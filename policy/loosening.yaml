  - path: packages/eslint-canon-be/unit-spec.spec.mjs
    marker: focused-test
    reason: "rule-test input: a code sample the canon rule under test must reject or accept"
  - path: packages/eslint-canon-be/unit-spec.spec.mjs
    marker: skipped-test
