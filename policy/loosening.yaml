# What makes a check pass without satisfying it. Every marker is detected by the CLI (cli/src/core/check/markers.ts);
# this file selects the banned ones and lists the exceptions. The gate reads the tree as it stands (tracked plus
# untracked, never ignored files), not a diff.
# Exceptions live only in a repository's own policy/loosening.yaml, never inline: each names one file, one marker, its
# kind, the exact text of each line it covers (`match`, the line trimmed; a list for several lines) and the reason. A
# fixture, template or detector file takes one, and so does any file a rule of the rule book (contexts/, CONTRIBUTING.md)
# covers, as a `rule` exception naming that rule's id in `cites` (`exceptionKindProblem` in cli/src/harness/policy.ts holds
# the test of each kind; any other file is refused EXCEPTION_KIND_REFUSED, an id the rule book does not hold
# EXCEPTION_RULE_UNKNOWN). Any other line of the
# file stays a finding, and a `match` that covers no finding is EXCEPTION_STALE, so the list cannot accrete.
# A project's policy/loosening.yaml may ban more markers and declare its exceptions; it can never unban.
schema: starci/loosening-policy@1
banned:
  - eslint-disable
  - stylelint-disable
  - ts-ignore
  - ts-nocheck
  - ts-expect-error
  - nosonar
  - skipped-test
  - focused-test
  - or-true
  - no-verify
  - gate-widening
  - tls-unverified
scan:
  maxFileBytes: 1048576
# An app's branch profile (`branches` of its .starcistacks/application-stacks.yaml) is the one exception that lowers a gate: a
# branch named here may run the polish gates named here as report or off, never main and never a safety gate (@starci/hfs refuses anything else,
# HFS_BRANCH_PROFILE_INVALID). An entry may be a pattern (`ui/*`: a literal first segment, `*` any characters but `/`) that covers the feature branches
# merging into dev; a pattern never matches the default branch and never starts with release/. `starci app` hands both lists to @starci/hfs; a
# project's overlay may narrow them, never widen them.
branchProfiles:
  cites: PROJECT-LINT-2
  branches: [dev, ui/*]
  gates: [lint, sonar, codecov]
  reason: "the flow-F product branch of an app, and the ui/* feature branches that merge into it, take product and UI work under the full safety gate while lint and Sonar only report (with the lint ratchet blocking on the files a commit touches); main keeps the full gate and promoting dev to main runs it"
# A code marker reads code, never the text of a string, template or comment; a directive marker reads comments, so a
# comment that spells a directive is a finding wherever it stands, a rule's doc comment included.
exceptions:
  - path: sonar-project.properties
    marker: gate-widening
    kind: rule
    cites: CONTRIB-1
    match: "sonar.coverage.exclusions=cli/src/**"
    reason: "the CLI is proven by runs of the built CLI, not unit coverage, so cli/src is excluded from coverage only; issues and duplication still analyse it"
  - path: packages/hfs/runtime/scripts/guards/git-policy.mts
    marker: no-verify
    kind: detector
    match: "export const HOOK_BYPASS_FLAG = '--no-verify';"
    reason: "the guard names the hook-bypass flag it refuses"
  - path: packages/hfs/runtime/scripts/lib/bypass-markers.mts
    marker: no-verify
    kind: detector
    match:
      - "[/--no-verify\\b/, '--no-verify'],"
      - "if (piece.text.trim() !== '--no-verify') return false;"
      - "if (skipsHooks(piece, code, strings)) hits.push({ line: piece.line, label: '--no-verify', text: piece.text.trim() });"
    reason: "the bypass-marker scanner spells the flag it detects and the label it reports"
  - path: packages/hfs/src/fixtures/loosening/forms.mjs
    marker: no-verify
    kind: fixture
    match:
      - "{ id: 'no-verify as a git argument in a script', file: SCRIPT, text: \"run(['git', 'commit', '--no-verify', '-m', 'x']);\\n\", kind: 'bypass', detail: '--no-verify' },"
      - "{ id: 'the flag as an argument of a guard, not of git', file: SCRIPT, text: \"if (has(options, '--no-verify')) return refusal('git commit --no-verify skips the hooks');\\n\" },"
    reason: "the loosening forms the bypass scanner is proved against, one it flags and one it lets pass"
  - path: packages/hfs/templates/app/quality-config/sonar-project.properties
    marker: gate-widening
    kind: template
    match:
      - "sonar.exclusions={{sonarExclusions}}"
      - "sonar.cpd.exclusions={{cpdExclusions}}"
      - "sonar.coverage.exclusions={{coverageExclusions}}"
    reason: "placeholders the app scaffold fills with the generated Sonar scope, which each app's own file is judged against"
