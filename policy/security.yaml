# Configuration of the secret scan (cli/src/shared/secrets.ts holds its rules): no secret in the repository.
# The runtime gate `secrets` scans the changed files (the whole tree with --all); `task verify` scans a task's changed files on its clean candidate; `release push` scans the pushed range.
# A project's policy/security.yaml may add neverRead globs and declare exceptions. An exception names one file, one rule,
# its kind, the exact text of each line it covers (`match`, the line trimmed; a list for several lines) and the reason;
# its kinds, the stale rule and the refusal are those of policy/loosening.yaml. A line of this file that declares a
# `match` is that declaration, not a finding.
schema: starci/security-policy@1
# A sops envelope (a .enc file carrying sops metadata and ENC[...] values) is ciphertext, not a secret, unless the
# profile refuses envelopes: the runtime is public and tracks none.
sopsEnvelopes:
  default: allowed
  profiles:
    runtime: refused
# Files the CLI never opens, in any gate: their presence is judged by name only.
neverRead:
  - "**/.env"
  - "**/.env.*"
  - "**/*.env"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/id_rsa"
  - "**/id_ed25519"
  - "**/id_ecdsa"
  - "**/.secrets/**"
  - "**/keys.txt"
  - "**/credentials.toml"
exceptions:
  - path: packages/eslint-canon-be/runtime/scripts/hfs/rules/secrets.mjs
    rule: assigned-secret
    kind: detector
    match: "const PLAINTEXT_SECRET = 'HFS_PLAINTEXT_SECRET';"
    reason: "a failure-code name (HFS_PLAINTEXT_SECRET) in the secret rule itself, not a secret value"
  - path: packages/eslint-canon-fe/runtime/scripts/hfs/rules/secrets.mjs
    rule: assigned-secret
    kind: detector
    match: "const PLAINTEXT_SECRET = 'HFS_PLAINTEXT_SECRET';"
    reason: "a failure-code name (HFS_PLAINTEXT_SECRET) in the secret rule itself, not a secret value"
  - path: packages/hfs/runtime/scripts/hfs/rules/secrets.mjs
    rule: assigned-secret
    kind: detector
    match: "const PLAINTEXT_SECRET = 'HFS_PLAINTEXT_SECRET';"
    reason: "a failure-code name (HFS_PLAINTEXT_SECRET) in the secret rule itself, not a secret value"
  - path: packages/hfs/src/fixtures/hfs-db/config-clean.toml
    rule: assigned-secret
    kind: fixture
    match: "jwt_secret = \"env(SUPABASE_JWT_SECRET)\""
    reason: "the clean Supabase config the hfs-db rule is proved against reads its JWT secret from the environment"
  - path: packages/hfs/templates/be/patterns/realtime/channel.gateway.spec.ts.tpl
    rule: assigned-secret
    kind: template
    match:
      - "const socketOf = (id: string, auth: Readonly<Record<string, unknown>> = { accessToken: \"signed-token\" }) => {"
      - "const { socket } = socketOf(\"socket-1\", { accessToken: \"signed-token\", principal: { id: \"p-2\" }, topic: \"foreign\" })"
    reason: "the realtime gateway spec template hands its socket a stand-in access token"
  - path: packages/test-world/src/nest/wiring.spec.ts
    rule: password-connection-string
    kind: fixture
    match:
      - "assert.equal(wiring.db[\"primary\"]?.url, \"postgres://postgres:p%40ss%2Fword@127.0.0.1:30100/shop_a1b2c3_primary\")"
      - "assert.equal(wiring.db[\"identity\"]?.url, \"postgres://shop_a1b2c3_identity:s3cr%2Ft@127.0.0.1:30100/shop_a1b2c3_core\")"
    reason: "the wiring spec asserts the URL built from made-up credentials, percent-encoded"
  - path: packages/ai-router/test/fixtures/gateway-helpers.ts
    rule: assigned-secret
    kind: fixture
    match:
      - "export const UPSTREAM_SECRET = \"sk-upstream-a-k1-secret\""
      - "export const ADMIN_TOKEN = \"admin-test-token\""
    reason: "the gateway specs' made-up upstream key (asserted never to appear in a response) and admin token"
