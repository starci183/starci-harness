# Configuration of the secret scan (cli/src/shared/secrets.ts holds its rules): no secret in the repository.
# The runtime gate `secrets` scans the changed files (the whole tree with --all); `task verify` scans a task's changed files on its clean candidate; `release push` scans the pushed range.
# A project's policy/security.yaml may add neverRead globs and declare exceptions. An exception names one file, one rule,
# its kind, the exact text of each line it covers (`match`, the line trimmed; a list for several lines) and the reason;
# its kinds, the stale rule and the refusal are those of policy/loosening.yaml. A line of this file that declares a
# `match` is that declaration, not a finding.
schema: starci/security-policy@1
# A sops envelope (a .enc or .enc.yaml file carrying sops metadata and ENC[...] values) is ciphertext, not a secret, unless the
# profile refuses envelopes: the runtime is public and tracks none.
sopsEnvelopes:
  default: allowed
  profiles:
    runtime: refused
# Files no agent, tool or gate opens: their presence is judged by name only. The one reader is the CLI's secret loader
# (cli/src/harness/secret-env.ts), which at run time reads a key `secretKeys` lists from the process environment, else from
# secret.env at the harness root (its keys are named in secret.env.example), and returns that key alone.
neverRead:
  - "**/.env"
  - "**/.env.*"
  - "**/*.env"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/id_rsa"
  - "**/id_ed25519"
  - "**/id_ecdsa"
  - "**/.secrets/**"
  - "**/keys.txt"
  - "**/credentials.toml"
# The keys the secret loader reads; it refuses any other (SECRET_KEY_UNLISTED). Only the runtime's policy lists them.
# A provider key the owner sets once for every app is one more line here, its entry in secret.env.example, and one
# `starci app secret set --env <env> <member> <KEY> --from-host <KEY>` per app; no code changes.
secretKeys:
  - TELEGRAM_BOT_TOKEN
  - OPENROUTER_API_KEY
  - SOPS_AGE_KEY
  # The shared SonarQube group of ops/host.yaml (sonar-postgres, sonar, sonar-bootstrap, sonar-tunnel): `host up` hands them to the compose process alone.
  - SONARQUBE_DB_PASSWORD
  - SONARQUBE_ADMIN_PASSWORD
  - CLOUDFLARE_TUNNEL_TOKEN
  # The host embeddings door of ops/host.yaml (embeddings-gate, embeddings-tunnel): the bearer token apps send, and the run token of
  # the locally managed tunnel starci-host-services. An app receives the bearer token through `app secret set ... --from-host EMBEDDINGS_API_KEY`.
  - EMBEDDINGS_API_KEY
  - HOST_SERVICES_TUNNEL_TOKEN
# Paths refused whatever they hold, beside the built-in path rules of cli/src/shared/secrets.ts: `unless` names the tracked files a
# glob does not cover. The managed-VPS inventory (ops/vps.yaml `inventory`: a server's host, port and sealed keys) never enters this
# public repository, sealed or not; .gitignore keeps it out, and this refuses a server file added by force.
refusedPaths:
  - name: vps-inventory
    glob: "ops/vps/servers/*.yaml"
    unless: ["ops/vps/servers/example.yaml"]
  - name: vps-inventory
    glob: "ops/vps/*.enc.yaml"
# Key names refused anywhere, a sealed envelope included (its keys are plaintext): a regex source matched against a whole key name
# followed by `:` or `=`, any case. A server is reached by key only (contexts/harness/managed-vps.md), so a password key such as
# VPS_PASSWORD or ROOT_PASSWORD names a credential nothing keeps.
refusedKeys:
  - name: server-password-key
    pattern: "(?:VPS|ROOT|SSH|SERVER|SUDO)[_-]?PASS(?:WORD|WD)"
exceptions:
  - path: packages/hfs/templates/be/patterns/realtime/channel.gateway.spec.ts.tpl
    rule: assigned-secret
    kind: template
    match:
      - "const socketOf = (id: string, auth: Readonly<Record<string, unknown>> = { accessToken: \"signed-token\" }) => {"
      - "const { socket } = socketOf(\"socket-1\", { accessToken: \"signed-token\", principal: { id: \"p-2\" }, topic: \"foreign\" })"
    reason: "the realtime gateway spec template hands its socket a stand-in access token"
  - path: packages/test-world/src/nest/wiring.spec.ts
    rule: password-connection-string
    kind: fixture
    match:
      - "assert.equal(wiring.db[\"primary\"]?.url, \"postgres://postgres:p%40ss%2Fword@127.0.0.1:30100/shop_a1b2c3_primary\")"
      - "assert.equal(wiring.db[\"identity\"]?.url, \"postgres://shop_a1b2c3_identity:s3cr%2Ft@127.0.0.1:30100/shop_a1b2c3_core\")"
    reason: "the wiring spec asserts the URL built from made-up credentials, percent-encoded"
  - path: packages/ai-router/test/fixtures/gateway-helpers.ts
    rule: assigned-secret
    kind: fixture
    match:
      - "export const UPSTREAM_SECRET = \"sk-upstream-a-k1-secret\""
      - "export const ADMIN_TOKEN = \"admin-test-token\""
    reason: "the gateway specs' made-up upstream key (asserted never to appear in a response) and admin token"
