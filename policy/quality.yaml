# The gate tiers and the profiles a project picks from. Policy selects and configures; every gate is code in the CLI
# (cli/src/core/check), and a gate name the CLI does not implement is refused when this file is read.
# runtime: `starci check run` before a push and `starci task verify` on the clean checkout run these, scoped to what
#   changed (a task that changes nothing: the tracked files under its allowPaths) and bounded by stepTimeoutSeconds per process. secrets and canon judge the changed scope; loosening reads
#   the whole tree as it is (state-based, cheap).
# ci: CI runs these on main after the push; nobody waits for them unless an action is listed in requireCi.
schema: starci/quality-policy@1
runtime:
  stepTimeoutSeconds: 300
  # Lint rules (the rule name, any plugin) that judge whether a module is composed. A task with a composer (its contract's
  # `composedBy`, a relay node's first waiter: cli/src/harness/graph.ts composerOf) defers their findings on its own
  # allowPaths to that task; the composer's verify and the workflow's final verify enforce them, and a relayed source's
  # head never answers for them as its baseline (cli/src/core/check/composition.ts, relay-baseline.ts).
  compositionRules: [dead-exports, feature-not-composed]
  # Package folders that keep no ESLint config: a Grammar edit is content only and adds no test or lint config
  # (contexts/authority/packages.md "Grammar edits are content only"). Their lint step is the compiler's, `tsc --noEmit
  # --noUnusedLocals --noUnusedParameters` over every tsconfig*.json the folder holds, never a pass for want of a config
  # (cli/src/core/check/scope.ts compilerLintPackage). A folder that is not listed and has no config is red.
  compilerLint: [packages/grammar]
# Where a task's heavy checks run (typecheck, lint and tests: the scoped `starci check` presets and every command check).
# wave: `task verify` runs only the cheap checks of each task (lands, secrets and loosening on its diff, paths, files, json,
#   cited and cite); a workflow's wave verify runs the heavy ones once over the union of the tasks that landed, before any
#   task depending on them starts and before the workflow is done, and fails the tasks whose files are red; a Supervisor's
#   [Worker] leaves them to Debug's round after it lands the worker's branch.
# task: every check runs in each task's own verify. A task sent alone (`task send`) always verifies everything itself.
verify:
  tier: wave
# Actions that refuse CI_NOT_GREEN unless `starci check ci` of their commit is green, or, when the caller passes --urgent,
# unless the commit carries the pushed URGENT record of `starci app release push --urgent` (owner ruling urgent-release, 2026-10-29,
# contexts/harness/decisions.md: an urgent deploy needs no CI; its full gate runs later as `app release gate --backfill <tag>`, and
# the deploy's safety floor is never skipped). release.publish is not listed: on the harness CI's own publish jobs run it once each
# package's own jobs are green, and Debug's workstation fallback runs when CI cannot (CONTRIBUTING.md CONTRIB-20).
# A deploy that passes --ci-run <run> (the CI deploy job, contexts/project/cicd.md) is judged by the CLI on that run instead of this list: every job the
# CI standard requires (@starci/hfs knowledge/hfs/ci-standard.yaml, not the workflow file) must have concluded success for the exact --sha, for any environment.
requireCi: [release.cut, deploy.prod]
# `starci app check` and `starci app lint` are green while fewer than errorLimit error findings remain and none is a hard blocker
# (a plaintext secret, the boot proof, a migration finding), so a release is not held back finding by finding by the last
# structural nits; every finding is still printed (owner ruling gate-threshold-20, contexts/harness/decisions.md). The CLI hands
# it to @starci/hfs as STARCI_GATE_ERROR_LIMIT; without it hfs uses 20.
gate:
  errorLimit: 20
# The profile of a project whose hfs.json names none: no hfs.json, an app (lite or full), the runtime itself.
defaults:
  none: lib
  app: app
  runtime: runtime
profiles:
  be:
    summary: a NestJS back end
    canon: [be]
    runtime: [secrets, loosening, canon, typecheck, lint]
    ci: [unit, e2e, build, sonar-new-code]
  fe:
    summary: a Next.js front end
    canon: [fe, css]
    runtime: [secrets, loosening, canon, typecheck, lint]
    ci: [unit, build, sonar-new-code]
  app:
    summary: an app with its be/ and fe/ sides in one repository
    canon: [be, fe, css]
    runtime: [secrets, loosening, canon, typecheck, lint]
    ci: [unit, e2e, build, sonar-new-code]
  lib:
    summary: a TypeScript package outside a StarCi app; its own tsconfig and ESLint config, no canon pin
    canon: []
    runtime: [secrets, loosening, typecheck, lint]
    ci: [unit, build]
  runtime:
    summary: the StarCi runtime (the harness and its CLI); public, so it tracks no secret envelope
    canon: []
    runtime: [secrets, loosening, typecheck, lint]
    ci: [unit, build]
# Configuration of the CI gates that take any; CI reads it from `starci check run --json` (data.policy.ci).
ci:
  sonar-new-code:
    gate: starci-quality
    newCodePeriodDays: 30
    coverageMinPercent: 100
    duplicationMaxPercent: 3
    ignoreBelowChangedLines: 0
    issuesMax: 0
    blockingSeverities: [BLOCKER, CRITICAL, MAJOR, MINOR, INFO]
    hotspotsReviewedMinPercent: 100
