# The identifiers the harness repository never holds: the names of the apps, products and providers its owner listed. The harness is the
# mechanism every app shares (contexts/harness/rules.md rule 9); what serves one app lives in that app. `starci check business` reads this file
# and refuses a file of the tree that holds a `deny` term as a whole token: bounded by a character that is no letter or digit, by the edge of
# the text or by a camelCase boundary, in any letter case, the words of a term joined by a hyphen, an underscore or nothing. A file's path is
# judged with its text. It decides by membership in this list and never by meaning: a business word nobody listed here is held by review.
#   deny     one entry per identifier: the term (lower-case words joined by hyphens), its kind and why it is named
#   allow    the exact exceptions, one file and one term each, with the reason the term stays there; an entry nothing uses is a finding
#   outside  the paths the scan does not read: a folder (ending in /), a suffix (starting with *) or one file
# Only the owner adds a term or an exception.
schema: starci/business-terms@1
deny:
  - {term: nivo, kind: product, reason: "an app the harness drives; its name, and every name that starts with it"}
  - {term: blocks-core, kind: product, reason: "a package of one app"}
  - {term: agent-sdk, kind: product, reason: "a package of one app"}
  - {term: starci-next, kind: product, reason: "an app the harness drives"}
  - {term: starci-academy, kind: product, reason: "an app the harness drove"}
  - {term: starci-lab, kind: product, reason: "an organisation's content repository"}
  - {term: starci-league, kind: product, reason: "an app the harness drives"}
  - {term: mia-mia, kind: product, reason: "an app the harness drove"}
  - {term: openclaw, kind: product, reason: "an agent runtime one app used"}
  - {term: sepay, kind: provider, reason: "a payment provider one app integrates"}
  - {term: payos, kind: provider, reason: "a payment provider one app integrates"}
  - {term: momo, kind: provider, reason: "a payment provider"}
  - {term: vnpay, kind: provider, reason: "a payment provider"}
  - {term: vietqr, kind: provider, reason: "a payment provider"}
  - {term: casso, kind: provider, reason: "a bank feed provider"}
  - {term: vietcombank, kind: provider, reason: "a bank one app reads"}
  - {term: zalo, kind: provider, reason: "a chat channel one app integrates"}
  - {term: shopee, kind: provider, reason: "a marketplace one app integrates"}
allow:
  - {path: contexts/stack/fe.yaml, term: nivo, reason: "`@nivo/core`, a third-party chart library the front-end stack forbids by its npm name"}
  - {path: packages/hfs/runtime/knowledge/hfs/fe-stack.yaml, term: nivo, reason: "`@nivo/core`, a third-party chart library the front-end stack forbids by its npm name"}
outside:
  - {path: "*CHANGELOG.md", reason: "a changelog says what each release changed, in the words of its day; history is kept"}
  - {path: "*package-lock.json", reason: "a lockfile is npm's record of resolved packages"}
  - {path: docs/knowledge-analysis/, reason: "the legacy runtime's analysis notes, which quote what leaked into it (CONTRIBUTING.md CONTRIB-15); the shape exception that keeps them ends 2026-12-31"}
