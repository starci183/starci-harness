schema: starci/knowledge-source@1
id: ui.presentation.grammar-laws
title: Grammar presentation laws (owner, 2026-11-09)
appliesTo: [ui, frontend]
family: presentation
purpose: |-
  The spacing, surface, field, typography, link and button laws the owner approved on 2026-11-09. The core Grammar
  owns the values; these rules say what an app composition may not do against them.
provenance:
  reviewedAt: 2026-11-09
  sources:
    - knowledge/patterns/fe/ui.yaml
  limitations: |-
    Static checks read JSX composition only; the rendered gaps are measured by the Grammar's audit-gap script.
rules:
  - id: GAP-PROXIMITY
    title: Children stand closer than their container's siblings
    governs: The gap role of a Grammar layout element nested in another.
    cases:
      - id: case-1
        when: A Grammar layout element (Stack, Cluster, PaneSection, Section, Grid, Form) sits directly inside another
        assert: |-
          The child's gap role is at least one step below its parent's (identity 4 < inline 8 < row 12 < section 24 <
          region 32). A field stack (fields 24 apart) inside a Form or a Drawer body is the Field rule's own rhythm.
  - id: SURFACE-IN-SURFACE
    title: A list of rows inside a surface is a nested surface
    governs: Row lists placed inside a card body, a drawer, a dialog or a pane band.
    cases:
      - id: case-1
        when: Rows divided by lines stand inside a surface without being that surface's own full-bleed body
        assert: |-
          The Grammar list draws them in a nested surface: a 1px separator border, the card radius, clipped.
          A hand-made row list (blocks divided by Divider) is the bare form and is refused.
  - id: FIELD-LABEL
    title: A control is labelled by its own label prop
    governs: The label of every form control.
    cases:
      - id: case-1
        when: A form control is composed
        assert: |-
          The label is the control's `label` prop: label to control 8, control to help 4, field to field 24. A Text
          placed beside the control as its label is refused.
  - id: PAGE-BREADCRUMBS
    title: Every console page states its trail
    governs: The header of an app console page.
    cases:
      - id: case-1
        when: An app console page draws a Page header
        assert: |-
          The header carries `breadcrumbs`, or `breadcrumbs="root"` for the root page of its console.
  - id: BUTTON-ARROW
    title: A leads-somewhere button ends with endArrow
    governs: Arrows on Buttons.
    cases:
      - id: case-1
        when: A Button leads somewhere
        assert: |-
          It takes `endArrow`; an arrow typed in its label or passed as end content is refused. A Button that does
          something takes `startGlyph` (primary only, case-2); never both.
      - id: case-2
        when: A Button carries a leading icon (`startGlyph`, `startContent`)
        assert: |-
          Only the primary Button (`intent="commit"`, the CTA) does. A neutral, alternative, dismiss or destructive Button, a
          suggestion pill and a row action are text only. The arrow (`endArrow`) is not an icon under this rule, so any intent
          may lead somewhere; `IconButton` is unaffected.
  - id: LAYOUT-TWO-AXIS
    title: A report page stacks its cards in one direction
    governs: Card surfaces placed side by side.
    cases:
      - id: case-1
        when: Card surfaces stand in the pink well of a report page
        assert: |-
          They stack in one vertical column, 24 apart. Side by side is allowed only for sibling cards of the same role and height
          (figure cells, short equal cards). A card beside a column of cards, or cards of different kinds in one row, is refused.
      - id: case-2
        when: The page has a persistent selection or navigation column, or a full-height chat or editor
        assert: |-
          It is a workspace page, `Page chrome="panes"`: a grid of panes split by dividers, side panes white surfaces at full
          height, never cards. The main pane may hold a pink well that follows case-1.
  - id: MESSAGE-SURFACES
    title: Every chat draws Grammar's three faces and an app never restyles them
    governs: A chat thread, the messages in it and the replies a message card offers.
    cases:
      - id: case-1
        when: A chat thread with messages is drawn (team chat, an agent's chat, an inbox thread, the assistant)
        assert: |-
          The thread is a `PaneSection scroll role="log"` on the page tone `--background`; a message of someone else
          (`MessageBubble` incoming, `MessageCard`) is the flat `--surface` with no border and no shadow; the reader's own
          message is `--accent` with `--accent-foreground`. No class or style reaches a bubble, a card or the thread ground.
      - id: case-2
        when: A message card offers replies to send
        assert: |-
          They are one bordered list, `SurfaceCard kind="list" layout="suggestions"`, a plain-text row per reply whose whole
          row sends it, with a trailing chevron; the suggestion pills by the composer stay `Button size="sm"`.
      - id: case-3
        when: A chat is drawn on any page (the chat page, an inbox thread between a list and an aside, an agent's chat tab, an aside or a drawer)
        assert: |-
          The chat is one frame, `Pane content="chat"` (head, thread, composer `footer`), painted `--background` as a whole
          whatever it stands on; it states no `surface`. The rest of the page keeps its own rule (a room list stays white).
          The composer field stays white, the 1px lines between the zones stay, and every message in the frame is flat.
  - id: SUGGESTION-BUTTONS
    title: Suggestions and quick replies are a Cluster of neutral sm Buttons
    governs: Anything that suggests something to say or ask.
    cases:
      - id: case-1
        when: A suggestion, quick reply or empty-state shortcut is drawn
        assert: |-
          It is a `Cluster gap="inline"` (with `label`) of neutral `Button size="sm"`, which every Button size draws as a
          pill; a Link row, ChoiceChips, TagGroup, Badge or Chip is never a suggestion.
  - id: TABLE-CELL-TYPE
    title: Table and row cells take the row type sizes
    governs: Text inside a DataTable cell or a ListRow.
    cases:
      - id: case-1
        when: Text is drawn in a DataTable cell or a ListRow
        assert: |-
          All text is 14 (the primary 14 / 500, the secondary 14 muted; sm equals md); only a small name (meta, count, timestamp) is 12 (xs). A larger Text, a Heading or a Label is refused.
  - id: SAME-LINE-SIZE
    title: One line, one size
    governs: Text siblings of one inline line.
    cases:
      - id: case-1
        when: Texts stand side by side in one Cluster
        assert: |-
          They share one size step (14: md and sm are the same; 12: xs; display: figure); a Badge or a chip is exempt.
  - id: ROW-TITLE-LINK
    title: A row title is never a link when the row opens
    governs: The primary of a ListRow or a DataTable row.
    cases:
      - id: case-1
        when: A row has an action, an href or a chevron
        assert: |-
          Its title is plain text; the row is the one pressable.
  - id: TABS-SWITCH-ZONE
    title: The pill is the switch zone of a card
    governs: Tabs appearance="primary".
    cases:
      - id: case-1
        when: A mode or period of one block's data is switched among two to four short options
        assert: |-
          It is the card's `switch` header zone (`headers={[{ kind: "switch", label, items, selectedKey, onSelect }]}`),
          with no count and no href. A pill written in JSX in a page body, under the page tabs, in a pane or in a drawer
          is refused: views of a page are page tabs, views or filters inside a region are underline `Tabs`.
  - id: TABS-DEPTH
    title: A page stacks two underline layers at most
    governs: Underline Tabs nested through the panels they select.
    cases:
      - id: case-1
        when: An underline Tabs stands in the panel of another, or in the body of a Page whose header carries tabs
        assert: |-
          The page tabs (`Page header.tabs`) and one region set are the two layers; a third nested set is refused.
          Every tab is one size, so only the count of layers is judged.
  - id: TABS-IN-WELL
    title: The second tab layer stands in the white header band
    governs: Underline Tabs in the body of a page or a pane.
    cases:
      - id: case-1
        when: A page has a second layer of underline tabs under its page tabs
        assert: |-
          It is `Page header.subTabs`: inside the white header band, under layer 1, on its own full-width separator, the same size as layer 1
          (14, 40 high, selected weight 500, the 2px underline exactly on the separator) and flush with the band's left inset, the same x as layer 1.
          An underline Tabs written in the body of a Page, Pane or PaneSection (the pink well, a pane body) is refused.
  - id: LINK-LOOK
    title: A Link is HeroUI's own link and takes its size from the line
    governs: The look of a Grammar Link.
    cases:
      - id: case-1
        when: A Link stands in a line of text, a meta line or a caption
        assert: |-
          It is HeroUI v3's link: the primary colour, the underline on hover only, the anchor icon at the end. Its type size and leading are
          inherited (14 in a body, 12 in meta or caption text). A size prop, a size class and an underline or decoration class are refused.
  - id: ROWS-IN-CARD
    title: Rows of data are always a card
    governs: A list of rows or key-value rows on the well or on a white surface.
    cases:
      - id: case-1
        when: A DescriptionList or DisclosureList is drawn
        assert: |-
          It stands in a Section or a SurfaceCard, so it is a card: a shadow and no border on the pink well, a 1px border and no shadow on a white
          surface (aside, pane, drawer); Grammar draws that edge itself. A row primitive with no card around it is refused. ListBox is a navigation list and is not read.
  - id: CARD-NO-DESCRIPTION
    title: A card has no description
    governs: The head of a SurfaceCard and the line above it.
    cases:
      - id: case-1
        when: A card is drawn with a label
        assert: |-
          The head is the label, a count chip, one fact and one end action; SurfaceCard has no description or subtitle prop. A muted Text written directly above a
          SurfaceCard as its description is refused: the line is a row subtitle (select or list) or, when it explains the card's data, the card note.
  - id: LABEL-SUBLABEL-HIERARCHY
    title: One Label per section; nested groups use a Sublabel
    governs: The Label of a Section or SurfaceCard and the Sublabel of the groups inside it.
    cases:
      - id: case-1
        when: A labelled section holds groups of cards
        assert: |-
          The section has exactly one Label (14 / 500, 12px above its content). Each group inside it is a Section or SurfaceCard with `sublabel` (12 / 500 muted, 8px above its card),
          never a second `title` / `label`; groups stand 24px apart. A Section or SurfaceCard with `sublabel` and a Label together is refused by the types.
  - id: SECTION-HEAD-ACTION
    title: A section head is one row with at most one thing at its end
    governs: The head of a Grammar Section.
    cases:
      - id: case-1
        when: A Section head carries an action
        assert: |-
          The head is ONE row: the label (14, 500) and an optional count chip (12) at the start, at most ONE thing at the end, a navigation
          Link variant="head" (the label then an arrow that slides about 3px on hover), an info IconButton, or (0.37.25) a neutral small text Button
          (intent neutral, size sm, no icon: "Add provider"). A primary or commit Button, another size or an icon Button is refused, and so are two commands. There is no description under the label: it is a caption (12, muted) below the card or list.
  - id: TAB-COUNT-CHIP
    title: A tab count is a 12px chip, grey unless it is work waiting for the owner
    governs: The count on a Grammar tab, page layers 1 and 2 and filter tabs.
    cases:
      - id: case-1
        when: A tab shows how many items its view holds
        assert: |-
          The count is the tab's `count`, drawn as a 12px chip, never "· N" text in the label (a label ending in a middle dot and a number is refused).
          The chip is grey; it is pink only when the number is work waiting for the owner (`isAttention`: to handle, to approve, an error). Page tabs
          (layers 1 and 2) hide the chip when the count is 0; filter tabs inside a table or list show a grey 0.
  - id: CARD-ONE-CONTENT
    title: One content per card, a surface on the well has a shadow and a surface on white has a border
    governs: A SurfaceCard's content and its edge.
    cases:
      - id: case-1
        when: A card is written
        assert: |-
          A card holds exactly ONE content: a list, an input group (form), a table, a graph or a figures ribbon, with its own controls (a tab, search or pagination
          zone, a form footer with Cancel and Save). Several groups are several cards, each with a Sublabel above it; items of the same kind stay in one list. A card
          inside a card is refused. A label has no description under it: the description is a caption under the card (Section caption, SurfaceCard note), and a legend
          (a FlowGraph's kinds) stands under the card as chips.
      - id: case-2
        when: A surface is painted
        assert: |-
          A card on the pink well has the card shadow and NO border; a surface on a white surface (a Pane surface, the aside, a Drawer, a Dialog, a Popover) has the
          1px separator border and no shadow. The Grammar decides from context; an app never chooses. A FlowGraph inside a card draws no frame of its own.
  - id: ICONS-OUTLINE
    title: Icons are outline only; a tile marks a standalone icon
    governs: Every icon Grammar and an app draw.
    cases:
      - id: case-1
        when: An icon is drawn
        assert: |-
          Never filled or solid: no @heroicons/react 16/20/24 solid import, no filled glyph, no filled-circle status mark. An icon that STANDS ALONE as the mark of a
          row, a card, an empty state or a graph step gets an icon tile (a soft-tone square holding an outline icon). An icon INLINE with text (a status beside a
          label, a search field, a button start icon, a link arrow, meta) is a plain outline icon at text size with no tile. A status (done, running, failed, waiting,
          skipped) is a tone-coloured outline icon with no tile: outline check-circle in success, x-circle in danger, a spinning arrow for running.
  - id: SINGLE-CHILD-CARD
    title: A lone DataTable or chart is the surface; a list card is always valid
    governs: A SurfaceCard whose only content is a DataTable or a chart (a list or key-value card is valid, 0.37.8).
    cases:
      - id: case-1
        when: A card has no zones (headers, footers, head actions) and holds one DataTable or chart (BarChart, ProportionBar, BubbleMap, FlowGraph, MermaidDiagram)
        assert: |-
          A standalone DataTable and chart is ONE frame (border, card radius), so the card is a second frame. The title sits above as a Section head and one caption
          sits below (Section caption, muted sm). A card of list or key-value rows (SurfaceCard kind="list", "table", "select", ListBox, DisclosureList, Section kind="list",
          DescriptionList) is valid alone or not (0.37.8). A card groups two or more different parts (figures + list + actions), or carries zones (tabs, search, head actions).
  - id: NO-RAW-SCROLL
    title: Grammar never shows scrollbars
    governs: Scroll areas an app draws.
    cases:
      - id: case-1
        when: Content scrolls in a pane, drawer, list, thread, tab strip, table or modal body
        assert: |-
          The scroll area is a Grammar scroller (`VerticalScrollRegion`, `HorizontalScrollRegion`, `PaneSection` with `scroll`):
          the scrollbar is hidden, a fading edge (ScrollShadow behaviour) shows where content continues, and wheel, touch and
          keyboard scrolling keep working. An app element with an `overflow-y-auto` or `overflow-auto` class is refused.
