schema: starci/knowledge-source@1
id: ui.proof.anatomy-source
title: Anatomy source
appliesTo:
  - ui
family: proof
purpose: |-
  This file answers one question for direction images and for the screens that follow them:
  where did the shape of each region come from?

  A direction names components and a generated image claims to draw them. A component name does not
  define its containment, hierarchy or geometry. Discover anatomy through a real render of the installed
  design system, including the location of labels, content and footers. A name alone lets an image model
  invent a plausible region instead of drawing the selected component.

  The formula a direction is generated by is therefore fixed:

  ```text
  direction = real-render(anatomy) + brand(surface) + composition(intent)
  ```

  anatomy      the pixels of the real installed component, captured from its storybook or an
               equivalent render harness — the only lawful source for what a region looks like
  brand        `brand/index.yaml`: tokens, mascot placement, imagery and voice rules
  composition  where creation legitimately lives: layout, state narrative, content and
               sequencing — provided every region still maps to a real component or to an
               app-owned pattern the record declares

  A generated direction that satisfies all three is verifiable: its anatomy can be diffed
  against the reference render, its palette against the brand record, and only its composition
  is judgement.
rules:
  - id: ANATOMY-1
    title: Component look comes from a real render
    governs: Governs every region a direction maps to a named component.
    cases:
      - id: case-1
        when: A direction names a grammar component for a region
        observe: |-
          The region's shape matches the component's real render — a reference capture of the
          installed package (storybook story or render harness), versioned beside the direction
          assets. A prompt that cites the component's name without a matching reference render
          cannot prove its region drew that component
      - id: case-2
        when: The direction and the real render disagree on containment
        observe: The real render wins. A list drawn on bare canvas while its published anatomy places those rows
          inside a surface falsifies the direction, however attractive the invented containment looks.
      - id: case-3
        when: No real render of the component exists yet
        observe: |-
          The direction's anatomy claim is `unproven` until one is captured. Rendering the
          storybook story is cheaper than arguing from the export's props
  - id: ANATOMY-2
    title: Nested controls separate from their surface
    governs: |-
      Governs form controls placed inside a surface that already owns a background, and the layer
      chain a screen is built from: the page background holds surfaces, and a surface holds nested
      controls. FE-RULE-OWNERSHIP assigns its visual treatment and API to the selected Grammar.
    cases:
      - id: case-1
        when: |-
          A field or choice control sits inside a painted surface: a card, panel, modal, drawer,
          popover or navigation region
        observe: |-
          Owner ruling 2026-10-25 (owner:surfacecard-always-painted; ruling:R318/case-1): the selected
          Grammar supplies a nested treatment that separates the control from its owning painted
          surface, and every card surface paints a face. A control placed outside a surface uses the
          treatment for that layer. Unpainted grouping containers pass their parent's context through.
          Applications compose the published surface and control and omit the field variant, allowing
          the Grammar to resolve their layer; they do not reproduce surface paint or force a static
          variant. Controls whose anatomy does not vary by layer keep their published treatment. The
          universal FE canon reports a static field variant as FE_NESTED_VARIANT (R318); rendered
          treatment is checked through DRAW_NESTED_VARIANT, recognising painted Grammar surface stamps.
          The family's own recipe defines its props, values and supported anatomy
        elements:
          - page
      - id: case-2
        when: The surface is nested inside another surface
        observe: |-
          Painted surfaces derive their depth from the parent context. The selected Grammar's depth
          treatment raises the top layer and keeps a nested layer subordinate; parent and child never
          claim the top-level treatment at once. Each Grammar declares its surface paint in its DNA
      - id: case-3
        when: Any drawing - the layer chain is a standard principle of every screen, not a per-screen exception
        observe: |-
          The layer chain holds: the page background, then an owning surface, then its nested controls.
          Grouped content and its controls stand in a surface; only page-level marks such as a brand
          lockup or page heading sit on the background
          itself. A form is one unit: its fields and submit/actions stand in the same surface.
          Unpainted grouping containers do not supply this surface. Fields laid straight on the page background, a form split across layers (fields on a
          surface, its submit on the background), or a background control borrowing a nested-layer
          treatment, falsifies
        elements:
          - page
  - id: ANATOMY-3
    title: Composition is the only place direction invents
    governs: Governs where a direction may introduce something the component inventory does not name.
    cases:
      - id: case-1
        when: The screen needs a region no component supplies (an illustration panel, a split layout, a hero band)
        observe: |-
          The record declares it as an app-owned region with its own anatomy description, and
          the direction is free inside that boundary. Declaring it honestly is required —
          passing an invented region off as a component falsifies
      - id: case-2
        when: The invented region carries brand elements (mascot, colour, imagery)
        observe: |-
          `brand/index.yaml`'s placement rules still govern it. A mascot inside a form control
          or a danger region falsifies
      - id: case-3
        when: An interactive element appears only for looks
        observe: |-
          Every control the direction shows is either wired or honestly marked as a route that
          does not exist yet. A forgot-password link the direction drew but never recorded
          falsifies
  - id: ANATOMY-4
    title: The formula is recorded per screen
    governs: Governs the provenance a direction asset must carry.
    cases:
      - id: case-1
        when: A direction asset is committed
        observe: |-
          Its prompt cites the reference render(s) used for anatomy and the brand revision used
          for surface, so a reviewer can replay which render and which brand produced it.
          A prompt whose only anatomy source is prose falsifies
      - id: case-2
        when: The grammar package revs
        observe: |-
          Reference renders are re-captured, and directions whose anatomy depended on the earlier
          render are flagged stale — never silently treated as still current
  - id: ANATOMY-5
    title: The prompt spells containment literally, license explicitly
    governs: Governs how an interface.draw prompt is written once the reference render exists.
    cases:
      - id: case-1
        when: The anatomy section of a prompt is written
        observe: "Describe the literal layout shown by the reference render: which elements are siblings outside the
          surface and which it bounds inside. State each label, fact, content region and caption in reading
          order. A summary that changes these relationships reinvents the anatomy it claims to cite."
      - id: case-2
        when: A region is one image models are known to flatten
        observe: |-
          The prompt names the expected failure ("this is the part people get wrong") and
          states the correct structure, the same way it states the correct colour
      - id: case-3
        when: Creative freedom is granted
        observe: |-
          It is granted as two explicit lists — "You MAY" (the small set of sanctioned
          embellishments: one mascot placement, metadata hints, one state highlight) and
          "You MAY NOT" (containment changes, palette changes, invented navigation or
          regions). Unbounded freedom produces a beautiful picture of a different product;
          no freedom produces a correct but lifeless one — the bounded list is what makes a
          direction both faithful and worth aiming code at
observations:
  - id: prompt-shape-b2
    lane: ui
    kind: proven-template
    summary: A direction prompt names the frame, subject, literal containment, brand constraints, bounded creative
      licence and exact copy. Missing containment invites invented anatomy; unbounded licence invites a
      different product. The selected Grammar playbook records any renderer-specific example.
  - id: surface-label-placement
    lane: ui
    kind: anatomy-detail
    summary: Components with similar jobs may place their labels in different regions. Capture each installed
      anatomy and describe its containment explicitly; do not infer label placement from a component name.
  - id: list-separator-bleed
    lane: ui
    kind: anatomy-detail
    summary: When the selected list anatomy uses an edge-to-edge separator, preserve that edge while keeping row
      content on its own inset. A list wrapper must not add another inset or replace the published row owner.
  - id: list-row-anatomy
    lane: ui
    kind: anatomy-detail
    summary: Use the selected Grammar's published list row and its actual content order. Preserve identity, name,
      supporting copy, available actions and detail hierarchy; an extra nested list or hand-built row cannot
      replace owned anatomy.
  - id: card-division-and-measure
    lane: ui
    kind: anatomy-detail
    summary: Use the selected Grammar's published division direction and reading measure. A composed split or
      arbitrary width must not claim to be shipped anatomy when the component supplies a different contract.
  - id: joined-band-treatment
    lane: ui
    kind: anatomy-detail
    summary: A joined surface keeps its bands flush and its separators on the published edge. Each band owns only
      its assigned content inset; adding a nested decorative container changes the chosen anatomy.
  - id: special-card-recipe
    lane: ui
    kind: anatomy-detail
    summary: Artwork, emphasis and state tint retain semantic meaning. A positive treatment requires a proven
      positive outcome; missing approved imagery stays withheld. The selected Grammar owns any highlight
      effect and its motion, while the product owns the image and its content role.
  - id: direction-scale-drift
    lane: ui
    kind: known-drift
    summary: Image models can inflate the selected type scale. A direction may still prove containment and
      composition, while an implementation capture must follow the component's real token-bound size. A
      generated size never replaces the Grammar's scale.
