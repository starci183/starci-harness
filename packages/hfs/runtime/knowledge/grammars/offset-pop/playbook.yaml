schema: starci/knowledge-source@1
id: grammar.offset-pop.playbook
title: Offset Pop — playbook
purpose: |
  How a playful, mobile-first learning or consumer app is composed from the renderers Offset Pop
  publishes: which renderers a business shape asks for, in what order, with which props, and the rules
  every Offset Pop app follows (one root, one pink per decision, thumb-sized targets, a bottom-sheet
  Drawer for secondary tasks, a navigation drawer at phone widths). Product-neutral: the shapes name no product,
  and every label below is a role, not copy. A shape not listed here may still be composed from Common
  semantics and family anatomy for an approved product direction.
appliesTo:
  - grammar
family: offset-pop
provenance:
  package: "@starci/grammar"
  version: "0.60.1"
  captured: "2026-11-26"
  publicEntry: "@starci/grammar/common"
  familyEntry: "@starci/grammar/offset-pop"
  limitations: |
    Use this playbook only when Offset Pop is selected in the current .starciwork specification. The
    shapes are package usage written from the family's source, not observations of a shipped product;
    verify installed exports, props and CSS before promising a capability, and do not invent Grammar
    APIs absent from the installed exports and their types. Reading steps are reasoning within one op, not an
    auto-running op chain.
shapes:
  - id: app-shell
    title: App shell — fixed frame, navbar, sidebar drawer, bottom navigation, one Toaster
    knowledge: knowledge/ui/composition/app-shell.yaml
    composition:
      - renderer: OffsetPopGrammarRoot
        role: |
          The one root around the whole app; imports `@starci/grammar/offset-pop/styles.css` and, unless the
          product brings its own palette, `@starci/grammar/offset-pop/theme.css`
      - renderer: WorkspaceShell
        role: |
          `viewport="fixed"` owns the frame, navbar, mobile opener band and independent sidebar and
          content scroll. Compose the regions required by FE-APP-SHELL-1 through FE-APP-SHELL-7.
      - renderer: TopBar
        role: |
          Identity, search and the ordered language, theme, notifications and account controls follow
          the app-shell contract. Every bar control uses `size="control"`; Grammar owns its geometry.
      - renderer: Sidebar
        role: |
          The desktop navigation and its icon rail use `presentation="rail"`. The route owns
          `selectedKey`; the product owns permissions, groups and collapse persistence.
      - renderer: BottomNav
        role: |
          At phone widths the shell's compact navigation is the one bottom bar (learn, practice, ranking,
          profile); the current item is the pink pill, never a hand-made tab bar
      - renderer: Drawer
        role: |
          The mobile opener below the navbar opens a left drawer containing Sidebar
          `presentation="drawer"`, plus language and theme controls. Selection, backdrop and Escape
          dismiss it; focus stays inside while it is open (FE-APP-SHELL-4).
      - renderer: Page
        role: |
          Route content lives in the shell's primary region. Create actions belong on their pages
          (FE-APP-SHELL-5); app classes express layout only.
      - renderer: Toaster
        role: |
          Once, inside the root, with `label` and `dismissLabel`; its placement keeps notifications
          clear of the shell controls and the current task.
    notes: |
      FE-RULE-OWNERSHIP in knowledge/patterns/fe/index.yaml keeps shell semantics in universal
      knowledge and the named API checks in the selected Grammar lint package. Offset Pop owns the
      outline, palette and hard shadow in its packaged CSS.

  - id: home-continue
    title: Home — where the reader left off, one next step
    referenceMayContribute: |
      Keep: which sections exist and which one is the next step. Never crosses over: layout grid, card
      chrome, or a section that would need a renderer the family does not publish.
    composition:
      - renderer: Section
        role: The greeting or section title
      - renderer: SurfaceCard
        role: |
          The one card for the next step, `emphasis="accent"` on that card only (its hard offset turns
          pink), holding the title, one supporting line (Text tone="muted"), a real measurement, and one
          Button variant="primary" in `actions` — the view's single pink fill
      - renderer: "Progress / ProgressCircle / Meter"
        role: Only a verified value with a truthful `label` (ACCENT-4); an unknown value is not drawn
      - renderer: Section
        role: |
          `kind="list"` for peers (recent lessons, suggestions) as rows; no second primary Button
      - renderer: "Skeleton / EmptyNotice"
        role: Pending is the same tree at rest (`isLoading` keeps the shape); empty or failed is EmptyNotice
    notes: |
      A streak, level or reward count is a Badge, a figure of `Section kind="figures"` or a Meter, never a
      second pink call to action.

  - id: lesson-list
    title: Lesson list — the lessons of a unit, where the reader stands in each
    composition:
      - renderer: Section
        role: |
          `kind="list"`, its `title` the unit; one row per lesson with `leading: { position }` (its number),
          a `description` of its length, and at most two `badges` for its state (done in the success tone, in
          progress in the accent tone); a row the reader opens is an `href` or `onPress`, never a button inside
          the row
      - renderer: Progress
        role: The unit's progress above the list, `steps={{ total, completed }}` from the real lesson count
      - renderer: EmptyNotice
        role: The list's `empty` (a unit with no lessons yet)
    notes: |
      A locked lesson is a row with `state="unavailable"` and its reason in the description, never hidden.
      The list keeps Common's hairline seams; the sticker is for objects, not rows.

  - id: practice-step
    title: One question per screen — choose, check, see the outcome
    composition:
      - renderer: Progress
        role: |
          How far through the set the reader is, `steps={{ total, completed }}` with a `label` in words
          ("Question 4 of 10")
      - renderer: "Heading / Text"
        role: The prompt; `Text role="reading.title"` for a long prompt, Heading `scale="display"` only for a single short one
      - renderer: GradedChoice
        role: |
          The answers with their keys (A, B, C): `grading="local"` with `isCorrect` and `explanation` when the
          browser may know the answer, `grading="server"` with `verdicts` and `pendingId` when it may not. Each
          open answer is a pressable sticker (outline and small offset); a wrong pick keeps the danger pair and
          its explanation, the right one the success pair
      - renderer: "RadioGroup / CheckboxGroup"
        role: |
          Instead of GradedChoice when the answer is checked later as a whole (a survey, a multi-select
          question); `isInvalid`/`errorMessage` only for a validation problem, never for a wrong answer
      - renderer: Button
        role: |
          One variant="primary" `width="fill"` at the bottom of the content ("continue" in the product's words),
          `isDisabled` until the question is solved — the layout does not move when it enables
      - renderer: Drawer
        role: |
          `placement="bottom"` for an optional hint or explanation the reader opens; the handle is
          decorative, the close button and Escape are the ways out
    notes: |
      Feedback that must not interrupt (a streak kept, an item saved) is a Toast, not an Alert; feedback
      the reader must act on stays in the page.

  - id: streak-progress
    title: Streak and progress — the week at a glance
    composition:
      - renderer: Section
        role: |
          `kind="figures"` for the few counts that matter (days in a row, points, words learned), each a
          `term`, a `value` and a `unit`; a change says its direction with `trend` and `trendLabel`
      - renderer: Meter
        role: The weekly goal, `value` with a `valueLabel` in words ("3 of 5 days")
      - renderer: "Progress / ProgressCircle"
        role: The progress of a unit or a course, from a real count
      - renderer: CalendarDay
        role: A day the streak counts, when the screen lists days
    notes: |
      Nothing here is a call to action: the counts are ink, the measures fill with the accent as a
      measurement, and the screen's one primary Button (if any) is the next lesson.

  - id: result-celebration
    title: Result — celebrate a finished set, offer one way on
    composition:
      - renderer: SurfaceCard
        role: The result card, `emphasis="accent"`
      - renderer: Heading
        role: "`scale=\"display\"` (the display tracking and line height) for the one headline"
      - renderer: "ProgressCircle / Meter / Section"
        role: The score and its facts (`Section kind="figures"` or `kind="list" layout="keyValue"`), each a real value with a label
      - renderer: Button
        role: One variant="primary" onward; a secondary Button or TextAction to review
      - renderer: Toast
        role: An earned reward announced politely (`toastQueue.add` with `tone="affirmative"`)
    notes: |
      Celebration is the display headline, the mint outcome and the card's press; the family adds no
      confetti, and motion stays press travel only (removed under reduced motion).

  - id: profile
    title: Profile — who the reader is and how they are doing
    composition:
      - renderer: "Avatar / IdentityLockup"
        role: The reader's face and name; the current identity takes the pink ring (`isCurrent`)
      - renderer: Section
        role: |
          `kind="figures"` for the totals, then `kind="list" layout="keyValue"` for the facts (level, learning
          since, goal); `layout="settings"` when a row carries a Switch or a Select
      - renderer: Button
        role: The one primary action of the page (edit the goal), or none
    notes: |
      The profile is a page of facts, not a card of cards: one SurfaceCard at most, for the one object the
      page offers to act on.

  - id: leaderboard
    title: Leaderboard — the ranking of a period
    composition:
      - renderer: Tabs
        role: "`kind=\"filter\"` as the list's `filter` when the period can change (this week, this month)"
      - renderer: Section
        role: |
          `kind="list"`, one row per person: `leading: { position }` for the place (or the avatar with the place
          in the title), the points as the row's `value`; the reader's own row is marked by `edgeTone="accent"`
          and by words in its title ("you"), never by colour alone
      - renderer: "Skeleton / EmptyNotice"
        role: Pending keeps the rows; nobody ranked yet is the list's `empty`
    notes: |
      The top three are not podium artwork: a product that wants a podium draws it in its own assets above
      the list, and the list stays the record.

  - id: bottom-sheet-task
    title: Secondary task on a phone — filters, pickers, details, quick edit
    composition:
      - renderer: Drawer
        role: |
          `placement="bottom"` below 48rem (upward hard shadow, grab handle), `placement="right"` on wide
          layouts; `title` names the task, `footer` holds one primary Button
      - renderer: "Select / DatePicker / TagGroup / Switch"
        role: The controls inside; their own popovers stay inside the root and the sheet
    notes: |
      One secondary-task sheet opens at a time. The shell navigation follows FE-APP-SHELL-4's left
      drawer and preserves its own navigation and dismissal behavior.

  - id: sign-up-and-onboarding
    title: Sign-up or onboarding — short groups, one submit per step
    composition:
      - renderer: Stepper
        role: Where the reader is in a multi-step flow (pink current, mint complete, critical error)
      - renderer: Form
        role: "`label`, `onSubmit(FormData)`, `validationErrors` by field `name`, `isPending`"
      - renderer: Fieldset
        role: One per named group
      - renderer: "Select / DateField / Checkbox / Switch / RadioGroup / Textarea / OtpInput"
        role: Each with its own `label`, `description`, `errorMessage`, `isRequired`, `name`
      - renderer: Field
        role: Only for a control the package does not publish (a third-party widget)
      - renderer: Button
        role: One variant="primary" type="submit" per step
    notes: |
      Field focus is the hard offset shadow (critical while invalid); do not add an app focus ring.

  - id: settings
    title: Settings — immediate toggles, grouped, destructive actions confirmed
    composition:
      - renderer: Section
        role: "`kind=\"list\" layout=\"settings\"` per group, each row its `control` (a Switch or a Select)"
      - renderer: "Switch / Select"
        role: A Switch applies immediately; confirm the change with a polite Toast, not a dialog
      - renderer: AlertDialog
        role: |
          For an irreversible action only: `tone="negative"` (the confirm fills critical, not pink),
          `confirmLabel`/`cancelLabel` in the product's words; initial focus lands on cancel
      - renderer: Toast
        role: Undo for a reversible action (`action` keeps the toast until dismissed)

  - id: browse-and-pick
    title: Browse a catalogue — search, filter, pick
    composition:
      - renderer: SearchField
        role: The query, labelled
      - renderer: TagGroup
        role: Filters as outlined chips
      - renderer: "ListBox / Section"
        role: |
          ListBox when picking is the task (pink focus ring, soft-pink selected row read in the text-safe
          accent); `Section kind="list"` when rows only report facts or open a page
      - renderer: Pagination
        role: Current page is the raised pink pill
      - renderer: "Skeleton / EmptyNotice"
        role: Pending keeps the list shape; empty and failed are EmptyNotice

readingSteps:
  - id: business-shape-first
    order: 1
    title: Business shape first
    instruction: |
      Name the shape and the one outcome the screen exists to produce. That outcome is the view's single
      pink fill; everything else is ink on cream.
  - id: then-reference
    order: 2
    title: Then the reference, if the request supplied one
    instruction: |
      A reference contributes region order, which decision dominates, and what folds into a bottom
      sheet. It never contributes palette, outline, shadow or component anatomy — those are this
      family's and knowledge/ui's.
  - id: then-compose
    order: 3
    title: Then the shape's composition, mobile first
    instruction: |
      Compose the shape's renderers at phone width first: the shell's left navigation drawer,
      bottom-sheet secondary tasks and a full-width primary action. The published responsive shell
      switches to its sidebar and the task drawer to its wide presentation.
  - id: compare-dna
    order: 4
    title: Compare DNA with actually installed source
    instruction: |
      Confirm named renderers, props and closed values against the installed exports of
      `@starci/grammar/offset-pop` and their types, and `OFFSET_POP_DNA` for the family's values, before
      promising a capability.
  - id: resolve-product-composition
    order: 5
    title: Then resolve the remaining product composition
    instruction: |
      Reuse a shape where it fits; otherwise compose existing Common semantics and family anatomy. A
      shape absent from this table is an evidence limit on house style, not a reason to stop work
      already inside the approved product scope.

authoritySplit:
  directionChoiceRequired: |
    DIRECTION_CHOICE_REQUIRED is reserved for a material product choice whose acceptable options lead to
    different outcomes and whose answer is absent from the request. Product facts, copy, mascot and
    assets come from the product; Common semantics from knowledge/ui; outline, shadow, palette and
    reusable treatments from this family. The family's two owner decisions (the BOUNDARY-6 outline
    plus offset departure, the single pink) are not the product's to change.

guidance:
  - id: one-root-overlays-inside
    requirement: |
      Render everything — chrome, content, every overlay trigger (Dialog, AlertDialog, Drawer, Popover,
      DropdownMenu, the Select/ComboBox/DatePicker fields) and the Toaster — inside one
      `OffsetPopGrammarRoot`. Overlays portal into the nearest Grammar root; a trigger outside it opens a
      plain, unstyled overlay in `<body>` with no outline, no offset, no dark palette.
    rationale: |
      The family is a scope on the root; only its DOM descendants are Offset Pop.
  - id: one-pink-per-view
    requirement: |
      Give each view at most one pink-filled action (Button variant="primary", or the single confirm /
      toast / alert action the family fills). Text that must carry the accent uses Text tone="accent"
      (which reads `accentText`); never set the pink as a text colour.
    rationale: |
      Pink as body text is 3.22:1 on the canvas; one fill per view is what makes the decision obvious in
      a family where selection, current and focus share the same pink.
  - id: big-touch-targets
    requirement: |
      Keep the published sizes: Common's control height for controls, the TopBar trigger and
      `size="control"` throughout the navbar, and Common's 44px touch floor on a coarse pointer or a
      narrow viewport. Do not shrink them with app classes, and put answers in GradedChoice,
      RadioGroup or CheckboxGroup rather than small custom chips.
    rationale: |
      A playful, thumb-driven app is used one-handed; the family's targets are part of its idiom.
  - id: bottom-sheet-for-secondary
    requirement: |
      On a phone, secondary tasks open in `Drawer placement="bottom"`; reserve `Dialog` for a short task
      that must block the page and `AlertDialog` for an irreversible decision.
    rationale: |
      The bottom sheet keeps the task within thumb reach and throws its shadow upward into the page.
  - id: toaster-clear-of-content
    requirement: |
      One Toaster stays inside the Grammar root. Its placement keeps feedback clear of the shell
      controls and the task's primary action, including while the navigation drawer is open.
    rationale: |
      Feedback remains visible without covering the control needed to complete the current task.
  - id: no-extra-chrome
    requirement: |
      Do not add app-level borders, blur shadows, gradients or a second accent colour to family
      renderers; do not restyle the palette per screen. Adapt the family only through the HeroUI tokens of
      the app's theme (in place of `theme.css`), `--offset-pop-shadow-ink` and the Grammar theme hooks
      (`src/common/theme-hooks.json`, such as `--starci-core-card-radius`).
    rationale: |
      The outline, the hard offset and the one pink are the family; an extra layer turns stickers into
      a different, noisier family and breaks the dark and forced-colours mappings.
  - id: product-neutral
    requirement: |
      Keep product names, copy, mascots and illustration inside the product. The family and this
      playbook name roles only.
    rationale: |
      Offset Pop is a shared family; its first consumer does not own it.

presentation:
  font:
    ownership: FE-RULE-OWNERSHIP
    inherits: core
    contract: |
      Offset Pop keeps Common typography renderers and props. Its font proof reads the shared Common
      rank-to-renderer recipes in the StarCi playbook; the Offset Pop stylesheet owns its family palette
      and display treatment.
  padding:
    ownership: FE-RULE-OWNERSHIP
    inherits: core
    contract: |
      Offset Pop keeps the same Common spacing and component geometry. Its padding proof reads the
      shared Common recipes declared in the StarCi playbook; it supplies no replacement inset scale.
