schema: starci/fe-stack@1
purpose: >-
  The front-end stack of every app, lite and full alike (R212): for each common front-end concern the
  ONE canonical library, its HFS home (slot ids of knowledge/hfs/slots.yaml), the pattern id that teaches it
  (knowledge/patterns/fe/*.yaml) and the alternatives a front end never depends on or imports. Versions live in
  knowledge/hfs/canon-pins.yaml only. `tier: core` packages are installed by every scaffold; `opt` packages are added when a feature
  needs the concern. This file decides.
concerns:
  - id: framework
    tier: core
    packages: [next, react, react-dom, typescript]
    home: [fe.route, fe.source-root-pinned]
    pattern: FE-ROUTE
    forbids: []
    why: App Router with thin routes; route handlers (except health/live and the auth callback slot) and Server Actions are refused by FE_ROUTE_HANDLER_FORBIDDEN and FE_SERVER_ACTION_FORBIDDEN.
  - id: graphql
    tier: core
    packages: ['@apollo/client', graphql]
    home: [fe.modules.api, fe.transport.client, fe.transport.outcome]
    pattern: FE-API-GRAPHQL
    forbids: [urql, graphql-request, '@urql/core', graphql-hooks, apollo-boost]
    why: one file per operation under modules/api/graphql/{queries,mutations,subscriptions}, run by the auth or no-auth Apollo client with the link chain.
  - id: graphql-subscriptions
    tier: opt
    packages: [graphql-ws]
    home: [fe.transport.client, fe.package.api.client]
    pattern: FE-REALTIME
    forbids: []
    why: the subscription transport of a GraphQL subscription door (be.feature.realtime.graphql); only the Apollo clients folder imports it (GraphQLWsLink of @apollo/client/link/subscriptions), a subscription operation runs on that client and a useSubscribe hook of hooks/swr reads it.
  - id: codegen
    tier: core
    packages: ['@graphql-codegen/cli', '@graphql-codegen/client-preset']
    home: [fe.modules.api]
    pattern: FE-WIRE-GENERATED
    forbids: []
    why: the wire types are generated from be/contracts/<app>/schema.graphql into modules/api/graphql/__generated__, never typed by hand.
  - id: rest
    tier: core
    packages: [axios]
    home: [fe.modules.api]
    pattern: FE-API-REST
    forbids: [ky, superagent, node-fetch, cross-fetch, isomorphic-fetch]
    why: modules/api/rest/<area>/*.ts for uploads and presigned URLs, only; GraphQL carries every other call.
  - id: data
    tier: core
    packages: [swr, '@starci/next-data']
    home: [fe.hooks.swr]
    pattern: FE-DATA-SWR
    forbids: ['@tanstack/react-query', react-query]
    why: hooks/swr/api/{graphql,rest}/{queries,mutations}/use*Swr.ts wrap one operation each; components call hooks only. The polling-restart middleware (pollingRestart), the key helpers, the viewer-keyed config and the viewer cache are @starci/next-data's; an app imports no Middleware or ScopedMutator type of swr and writes none of them.
  - id: toast
    tier: core
    packages: ['@heroui/react']
    home: [fe.modules.toast]
    pattern: FE-TOAST
    forbids: [sonner, react-toastify, react-hot-toast, notistack]
    why: mutation outcomes are reported by modules/toast (showGraphQLToast, use*WithToast) with next-intl labels.
  - id: forms
    tier: core
    packages: [react-hook-form, '@hookform/resolvers', zod]
    home: [fe.hooks.rhf]
    pattern: FE-FORM
    forbids: [formik, yup, final-form, react-final-form]
    why: hooks/rhf/use<X>Form.ts builds a zod schema with next-intl messages and submits through an SWR mutation and the toast.
  - id: state-global
    tier: core
    packages: ['@reduxjs/toolkit', react-redux]
    home: [fe.redux]
    pattern: FE-STATE-REDUX
    forbids: [mobx, mobx-react, mobx-react-lite, recoil, jotai, valtio, redux-saga]
    why: app-wide shared state (selected ids synced from the route, server-pushed entities) lives in redux/slices.
  - id: state-local
    tier: core
    packages: [zustand]
    home: [fe.hooks.zustand]
    pattern: FE-STATE-ZUSTAND
    forbids: []
    why: feature-local UI, wizard and editor state lives in hooks/zustand/<store>.
  - id: realtime
    tier: opt
    packages: [socket.io-client, eventemitter2]
    home: [fe.hooks.socketio]
    pattern: FE-REALTIME
    forbids: [subscriptions-transport-ws, '@supabase/realtime-js', pusher-js, ably]
    why: one socket.io-client singleton per namespace and one side-effect component that dispatches to redux and SWR; both editions run the gateway in the be api process. A one-way channel served as server-sent events is the event-stream concern below (FE-REALTIME).
  - id: event-stream
    tier: opt
    packages: ['@starci/event-stream']
    home: [fe.transport.stream]
    pattern: FE-REALTIME
    forbids: ['@microsoft/fetch-event-source', eventsource, event-source-polyfill, eventsource-parser, reconnecting-eventsource, 'sse.js', 'fetch-sse', 'sse-ts']
    why: >-
      the one server-sent-events client: the app creates one instance in modules/api/sse/clients/event-stream.ts
      with createEventStream (the bearer token source, one renewal on a 401, backoff, heartbeat timeout), each stream operation
      (sse/<area>/stream-<channel>.ts) follows on it, and the useSubscribe<Channel>Swr hook reads that operation. No app keeps a
      hand-written reader (read-event-stream.ts) and no second SSE library is installed.
  - id: auth
    tier: core
    packages: ['@starci/auth']
    home: [fe.modules.auth]
    pattern: FE-AUTH
    forbids: ['@supabase/supabase-js', '@supabase/ssr', '@supabase/auth-js', '@starci/auth-oidc', jose, jwt-decode, next-auth, '@auth/core', keycloak-js, oidc-client-ts]
    why: modules/auth is the session issuer's client (one @starci/auth client instance over the app's own back-end auth doors, the access token in its memory; full - the app's IdP client, @starci/auth/client/oidc; the retired @starci/auth-oidc is forbidden); it yields the session and the access token for the Apollo link and never reads data.
  - id: i18n
    tier: core
    packages: [next-intl, '@starci/next-i18n']
    home: [fe.modules.i18n]
    pattern: FE-I18N
    forbids: [i18next, react-i18next, next-i18next, react-intl, '@lingui/react']
    why: useTranslations for copy and the next-intl formatter for numbers, fixed dates and currency; FE-DATE owns live time display. The routing, the proxy, the navigation, the request config and the locale read of the layout are @starci/next-i18n's; an app calls no defineRouting, createNavigation, getRequestConfig or createMiddleware.
  - id: ui
    tier: core
    packages: ['@heroui/react', '@heroui/styles', tailwindcss, '@starci/grammar', react-aria-components]
    home: [fe.components, fe.feature]
    pattern: FE-UI
    forbids: ['@mantine/core', '@mui/material', '@chakra-ui/react', antd, styled-components, '@emotion/react', '@emotion/styled']
    why: the grammar renderers over HeroUI and Tailwind; no second UI kit and no CSS-in-JS.
  - id: icons
    tier: core
    packages: ['@heroicons/react', '@starci/heroicons']
    home: [fe.components]
    pattern: FE-ICON
    forbids: ['@phosphor-icons/react', react-icons, lucide-react, '@iconify/react', '@gravity-ui/icons', '@tabler/icons-react', '@fortawesome/react-fontawesome']
    why: >-
      one application icon set, the heroicons family, on the 24/outline and 16/solid cuts. @heroicons/react
      is the base set and is used first; @starci/heroicons holds only the glyphs heroicons lacks (brand or domain glyphs drawn in
      heroicons style), never duplicates a heroicons glyph, and a missing glyph is added to it.
  - id: avatar-illustration
    tier: opt
    packages: ['@starci/grammar']
    home: [fe.components]
    pattern: FE-UI
    forbids: ['@dicebear/*', boring-avatars, 'react-nice-avatar', multiavatar]
    why: >-
      Grammar owns avatars: pass the uploaded avatar as src and the user or identity id as seed on Avatar, AvatarButton
      or AvatarGroup members. Without src, Grammar renders bundled DiceBear initials using the first and last words of
      name, with colour seeded by seed when present and by name otherwise. kind="agent" only names the avatar for assistive technology; the "AI" Chip follows the name (isAgent on ListRow, the card head,
      MessageBubble and the members list), and avatars in a row are one AvatarGroup (items: a person or a provider mark, max). @dicebear/core and @dicebear/styles are Grammar runtime dependencies pinned in
      canon-pins.yaml. Apps declare and import @starci/grammar, never @dicebear/*, and draw no avatar visuals.
  - id: theme
    tier: core
    packages: [next-themes]
    home: [fe.components.providers]
    pattern: FE-THEME
    forbids: []
    why: the theme provider lives in components/providers.
  - id: motion
    tier: opt
    packages: [framer-motion]
    home: [fe.components]
    pattern: FE-MOTION
    forbids: [react-spring, '@react-spring/web', gsap]
    why: one motion library, imported only inside a Fragment region (`starci-fe/fragment-only-library`); the Grammar draws motion with CSS transitions its tokens drive and imports none.
  - id: dates
    tier: core
    packages: [dayjs]
    home: [fe.modules]
    pattern: FE-DATE
    forbids: [moment, moment-timezone, date-fns, luxon]
    why: FE-DATE owns application date math, fixed date formatting and Grammar's live time display.
  - id: numbers
    tier: opt
    packages: [decimal.js]
    home: [fe.modules]
    pattern: FE-NUMBER
    forbids: [big.js, bignumber.js, numeral]
    why: decimal.js for money arithmetic in modules/utils; display through the next-intl formatter.
  - id: storage
    tier: core
    packages: [superjson]
    home: [fe.modules]
    pattern: FE-STORAGE
    forbids: [localforage, store2]
    why: modules/storage (local and session storage) serializes through modules/superjson; components never touch storage directly.
  - id: utils
    tier: opt
    packages: [lodash, usehooks-ts]
    home: [fe.modules, fe.hooks.reuseables]
    pattern: FE-UTILS
    forbids: [underscore, ramda, lodash-es]
    why: per-method lodash imports in modules/utils and reusable hooks in hooks/reuseables.
  - id: charts
    tier: opt
    packages: [recharts]
    home: [fe.components]
    pattern: FE-CHART
    forbids: [chart.js, react-chartjs-2, '@nivo/core', d3, echarts, echarts-for-react]
    why: "one chart library, drawn on the grammar's tokens by @starci/grammar/core/ext/recharts; an app installs it as an optional peer of @starci/grammar and imports it only through @starci/grammar/core/ext/recharts (Grammar lint starci-grammar/no-graph-or-animation-library); app code never imports it directly."
  - id: flow
    tier: opt
    packages: ['@xyflow/react', elkjs, d3-force]
    home: [fe.components]
    pattern: FE-FLOW
    forbids: [reactflow, cytoscape]
    why: "a node graph (a run's flow, a data ERD, a knowledge map) is drawn by @starci/grammar/core/ext/graph; an app installs it as an optional peer of @starci/grammar and imports it only through @starci/grammar/core/ext/graph (Grammar lint starci-grammar/no-graph-or-animation-library); app code never imports it directly."
  - id: markdown
    tier: opt
    packages: [react-markdown, remark-gfm, remark-directive, unified, remark-parse, mdast-util-directive, shiki, beautiful-mermaid]
    home: [fe.components]
    pattern: FE-MARKDOWN
    forbids: [marked, markdown-it, showdown]
    why: "markdown renders to grammar parts, never dangerouslySetInnerHTML; a long authored document is drawn by @starci/grammar/core/ext/markdown (unified, remark-parse, remark-gfm, remark-directive, mdast-util-directive, shiki, beautiful-mermaid are its optional peers): an app installs it as an optional peer of @starci/grammar and imports it only through @starci/grammar/core/ext/markdown (Grammar lint starci-grammar/no-graph-or-animation-library); app code never imports it directly."
  - id: code
    tier: opt
    packages: [react-shiki, '@monaco-editor/react']
    home: [fe.components]
    pattern: FE-CODE
    forbids: [prismjs, react-syntax-highlighter, highlight.js, '@uiw/react-codemirror', codemirror]
    why: react-shiki highlights and Monaco edits.
  - id: diagrams
    tier: opt
    packages: [mermaid]
    home: [fe.components]
    pattern: FE-DIAGRAM
    forbids: []
    why: diagrams render through mermaid in a block.
  - id: media
    tier: opt
    packages: [hls.js, dashjs]
    home: [fe.components]
    forbids: [video.js, shaka-player, react-player, plyr, '@vidstack/react']
    why: the grammar's Video plays HLS through hls.js and MPEG-DASH through dash.js, each loaded by dynamic import only when a source needs it; apps never import a player.
  - id: upload
    tier: opt
    packages: [react-dropzone]
    home: [fe.components, fe.modules.api]
    pattern: FE-UPLOAD
    forbids: [react-dropzone-uploader, filepond, react-filepond, uppy]
    why: "every upload is the Dropzone of @starci/grammar/core/ext/dropzone and a presigned PUT through modules/api/rest; react-dropzone: an app installs it as an optional peer of @starci/grammar and imports it only through @starci/grammar/core/ext/dropzone (Grammar lint starci-grammar/no-graph-or-animation-library); app code never imports it directly."
  - id: pdf
    tier: opt
    packages: [pdfjs-dist]
    home: [fe.components]
    pattern: FE-PDF
    forbids: ['@react-pdf-viewer/core', react-pdf]
    why: "a PDF document is shown only by the PdfViewer of @starci/grammar/core/ext/pdf; pdfjs-dist: an app installs it as an optional peer of @starci/grammar and imports it only through @starci/grammar/core/ext/pdf (Grammar lint starci-grammar/no-graph-or-animation-library); app code never imports it directly."
  - id: ai-chat
    tier: opt
    packages: ['@assistant-ui/react']
    home: [fe.components]
    forbids: []
    why: "a chat with an assistant is the AiChatThread of @starci/grammar/core/ext/chat over assistant-ui's headless primitives and external store runtime; @assistant-ui/react: an app installs it as an optional peer of @starci/grammar and imports it only through @starci/grammar/core/ext/chat (Grammar lint starci-grammar/no-graph-or-animation-library); app code never imports it directly."
  - id: device-id
    tier: opt
    packages: ['@fingerprintjs/fingerprintjs']
    home: [fe.transport.client]
    pattern: FE-API-GRAPHQL
    forbids: []
    why: the fingerprint link of the Apollo client attaches the device id.
  - id: observability
    tier: opt
    packages: ['@sentry/nextjs']
    home: [fe.source-root-pinned]
    pattern: FE-OBSERVE
    forbids: [logrocket, bugsnag-js, '@bugsnag/js', '@datadog/browser-rum']
    why: errors are reported through @sentry/nextjs (sentry.*.config.ts, instrumentation.ts), never console-only.
  - id: lint
    tier: core
    packages: [eslint, prettier, '@starci/eslint-canon-fe', '@starci/prettier-config']
    home: [fe.tool-config]
    pattern: FE-LINT
    forbids: []
    why: the canon lint and format configuration.
  - id: grammar-lint
    tier: opt
    packages: ['@starci/eslint-grammar-core', '@starci/eslint-grammar-offset-pop']
    home: [fe.source-root-pinned]
    pattern: FE-RULE-OWNERSHIP
    forbids: []
    why: The selected Grammar family's lint package runs beside the universal front-end canon; the family catalog declares the package and factory.
  - id: framework-support
    tier: opt
    packages: [server-only, rxjs]
    home: [fe.source-root-pinned]
    pattern: FE-ROUTE
    forbids: []
    why: the Next server boundary marker and Apollo peer support used by canonical workspaces.
  - id: tool-support
    tier: opt
    packages: ['@types/node', '@types/react', '@types/react-dom', '@starci/tsconfig', '@starci/stylelint-canon', '@tailwindcss/postcss', postcss-value-parser, stylelint, eslint-plugin-react-hooks]
    home: [fe.tool-config]
    pattern: FE-LINT
    forbids: []
    why: the compiler, CSS and lint support packages of the canonical front-end configs.
