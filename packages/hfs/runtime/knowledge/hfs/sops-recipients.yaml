# Shipped copy of ops/vps/recipients.yaml of the harness repository, its owner (sops-recipients.spec.mts keeps the two equal).
# Read by runtime/scripts/lib/sops-recipients.mts: R451 (rules/sops-recipients.mts), starci app secret init and the scaffold.
# The public age recipients of the owner's apps and fleet (owner, 2026-11-21, model B). PUBLIC HALVES ONLY: an `age1...` recipient is the public
# half of an age key, safe in this public repository; a private key (AGE-SECRET-KEY-1...) never enters any tracked file.
#
# This file is the owner of the recipients; @starci/hfs ships an equal copy (packages/hfs/runtime/knowledge/hfs/sops-recipients.yaml, kept equal by
# packages/hfs/src/sops-recipients.spec.mts) so `starci app check` judges every app the same on any machine, with or without a key.
#
#   dev         the harness recipient alone: the public half of SOPS_AGE_KEY in the harness secret.env. Every app's dev rule names it and
#               nothing else; there is no app-only identity.
#   staging,    the key of the VPS the environment deploys to (made on that server by `starci app secret server-key`, its private half only in
#   production  /root/.config/sops/age/keys.txt there) plus that server's ONE backup recipient, a dedicated age key whose private half exists only
#               in a GitHub Environment secret of the harness repository (break-glass). The harness key never opens staging or production. The dev
#               machine holds the public halves only: it seals to them and never needs, or looks for, a private VPS or backup key.
schema: starci/sops-recipients@1
harness: age173qfq7f776syam9tpkyfej0h2jjt6rc4ha7r38ez40n5mn0lwyaqp9ejt7
# One entry per managed VPS (the id of ops/vps/servers/<id>.yaml). `server` is the environment's deploy.remote.serverRecipient; `backup` is null
# until the backup key of that server is minted (owed: the `vps` backup-key and break-glass lane), and every staging and production rule of an app
# on that server is reported until it is.
servers:
  sv-hk-1:
    server: age1dypvrqkgumsr0e37d5ejenzs6gnczfqwwtegusat35t5sy7ne57sfn3kd8
    backup: null
# The recipient set each environment's rule and members hold, exactly: `harness`, `server` (the server whose key the environment records as
# deploy.remote.serverRecipient) and `backup` (that server's backup). An environment not named here takes `otherwise`.
environments:
  dev: [harness]
otherwise: [server, backup]
