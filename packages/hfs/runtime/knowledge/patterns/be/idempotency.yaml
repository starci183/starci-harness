liteAdapter:
  summary: >-
    Lite keeps the Inbox port and transaction-owned client receipt API. Its existing public.inbox
    table uses db migration authority; the be/inbox platform templates carry the lite adapter and the
    platform/client-operation-outcomes.sql.tpl forward migration. The files tree above describes the full TypeORM adapter.
    Delivery-only webhook scaffolds do not install a client marker. When adopting this client pattern, add the shared
    idempotency/platform/inbox/effectful.decorators.ts.tpl as src/modules/platform/inbox/effectful.decorators.ts and
    export Effectful from the inbox barrel. Every effectful client command then uses that marker and declares the
    idempotency pattern with its required proof scenarios.
  ports:
    - {port: Inbox, adapter: PostgresInbox through the caller's active EntityManager transaction}
    - {port: receipt retention, adapter: a fenced job delivered by the BullMQ queue on the declared Redis and scheduled by a platform/jobs tick (R335) that enqueues through the queue outbox}
  proof: >-
    The same inbox and fingerprint unit specs apply; declaring idempotency requires both client receipt scenarios in
    lite's local db integration lane.
  see: [knowledge/patterns/be/queues.yaml]
