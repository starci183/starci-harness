schema: starci/knowledge-source@1
id: be.idempotency
title: Inbox dedupe and client operation receipts
purpose: |-
  Given a door a delivery can repeat through - a signed webhook, a queue message, a relayed outbox row - how does the receiver
  make a repeat a no-op instead of a second charge, a second email or a second state transition? One inbox table keyed by
  (source, event id) sits in front of every such door, reached through `InjectInbox()`. Effectful client commands use the
  same owner to bind a key to the request fingerprint and replay the committed outcome.
appliesTo:
  - backend
family: be
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [be.transport.message, be.feature.reactors, be.integrations, be.feature.application, be.transport.graphql, be.transport.http, be.platform]
pattern: idempotency
provenance:
  reviewedAt: 2026-10-24
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner-locked BE convention 2026-09-30
    - knowledge/patterns/be/persistence.yaml
    - owner decision 2026-10-24 (effectful client commands require marker and lint)
    - https://www.postgresql.org/docs/16/sql-insert.html (read 2026-10-24)
    - https://www.postgresql.org/docs/16/transaction-iso.html (read 2026-10-24)
    - https://raw.githubusercontent.com/typeorm/typeorm/0.3.31/src/driver/postgres/PostgresQueryRunner.ts (read 2026-10-24)
  limitations: |-
    Static checks judge the delivery entry of the service a thin door calls: the genuine Inbox receiver, the first await,
    and the return on false. For a sole returned or awaited EntityManager transaction, they also inspect its actual inline
    callback, require the claim in its first statement, and bind the claim's manager to that callback's parameter.
    They do not prove getter effects, called helpers, database rollback or broker delivery; service specs and the real test world
    prove failure and redelivery behaviour. Non-inline callbacks and dynamic isolation expressions are not static proof here.
    The client rule checks the marked command contract, transport key validation and the handler's resolved domain delegation
    into a transaction-owned runClient call. Whether an operation has effects, its fingerprint covers all request meaning,
    and its remote effects are separately protected remain design review and behavioral proof obligations.
rules:
  - id: BE-IDEMPOTENCY-1
    title: The delivery service claims the event before it acts
    kind: mandatory
    hfsRules: [R80, R85]
    requirement: |-
      A consumer (`transport/message/<event>.consumer.ts`) is a thin door that forwards the delivery's `eventId` through one
      command to the domain service. A signed webhook verifies first and calls one domain method that durably records the
      inbox receipt and outbox event; only a reactor or job dispatches its processing command after commit (webhooks.yaml).
      A public delivery method
      of that service (its first parameter carries `eventId`) takes `@InjectInbox() private readonly inbox: Inbox`, claims
      `(source, eventId)` first and returns when the claim answers `false`. When the service owns an EntityManager transaction,
      the first awaited work in the transaction callback is `this.inbox.claim(source, eventId, manager)`, with that callback's
      own manager. The claim, domain writes and outbox rows commit or roll back together; never move the claim to the shared
      manager outside the transaction to satisfy a static check. A duplicate return ends the callback and no outer delivery
      work follows it. `source` names the provider or publisher; `eventId` comes from the delivery and is never generated by
      the receiver. The rule identifies the Inbox and EntityManager by their declared type origins, not variable names.
      An outbox relay that only produces is not a delivery service and is not asked for a claim.
    rationale: |-
      A sender that gets no timely reply resends: a payment provider retries a webhook, a queue redelivers a message it never
      saw acknowledged. Identifying the receiver by type removes the keyword match a renamed variable could satisfy.
    cases:
      - id: case-1
        when: A signed webhook controller
        write: 'the webhook door (webhooks.yaml) verifies the signature and calls one domain recording intake; that method claims (PAYOS_SOURCE, eventId) first in its transaction, returns when the claim answers false, and saves the durable receipt with its outbox event. A reactor or job consumes the committed receipt and dispatches the processing command; the webhook door, HTTP module and called intake never dispatch on a command bus.'
      - id: case-2
        when: A consumer
        write: 'be/src/features/api/billing/transport/message/payment-captured.consumer.ts forwards delivery.eventId in one command; its domain service claims first inside its own transaction with the callback manager, then writes and publishes through that manager.'
    verification:
      automated:
        - BE_INBOX_DEDUPE_MISSING
        - BE_RAW_INJECT
      manual:
        - Trace that the claim executes on every path before the side effect, including an early return added later.
    relatedExamples: []
  - id: BE-IDEMPOTENCY-2
    title: The inbox is one table, owned by platform, shared by every door
    kind: mandatory
    hfsRules: [R80, R35, R34]
    requirement: |-
      `platform/inbox` owns one table, `inbox_claims(source varchar(200), event_id varchar(200),
      claimed_at timestamptz not null, request_fingerprint varchar(64) null, outcome jsonb null)`, with a composite primary key on `(source, event_id)`, created by a migration under
      `platform/inbox/persistence/migrations/`. `Inbox.claim(source, eventId, tx?)` inserts atomically on the supplied
      transaction manager, or on the configured manager when no caller transaction is supplied. A conflict-safe insert
      (`ON CONFLICT (source, event_id) DO NOTHING RETURNING event_id`) returns `true` for a new row and `false` for a
      duplicate without aborting the caller's transaction. It never reads first and writes after, which races two concurrent
      deliveries of the same event. Lite uses its existing `public.inbox` table with the same client receipt columns,
      owned by a forward-only db migration. A client receipt extends this table; no capability creates another
      dedupe table or unique request-key constraint to compete with it.
    rationale: |-
      One shared table with one owner keeps the guarantee "this (source, event id) claims at most once" in one place, and
      the atomic conflict-safe insert makes the claim safe under concurrent delivery and keeps a duplicate transaction usable.
    cases:
      - id: case-1
        when: The migration
        write: 'The platform inbox migration creates inbox_claims with PRIMARY KEY (source, event_id); its client-operation migration adds request_fingerprint and outcome to that same table.'
      - id: case-2
        when: The adapter
        write: 'async claim(source, eventId, tx?) { const manager = tx ?? this.managers[0]; const rows = await manager.query(CLAIM_EVENT, [source, eventId, this.clock.now()]); return rows.length > 0 } // CLAIM_EVENT is the conflict-safe insert in the inbox owner persistence file.'
    verification:
      automated:
        - BE_INBOX_DEDUPE_MISSING
        - BE_SCHEMA_OWNER
        - BE_SCHEMA_AUTHORITY
      manual:
        - Confirm no capability declares a second inbox-shaped table instead of using this one.
    relatedExamples: [idempotency]
  - id: BE-IDEMPOTENCY-3
    title: Effectful client commands require a key and replay their committed outcome
    kind: mandatory
    hfsRules: [R310, R155, R83, R87]
    requirement: |-
      Mark every command that initiates an effectful client operation with the `Effectful()` decorator exported by
      `platform/inbox` (deciding that a command is effectful is a design-review judgment: R310 judges the commands that carry
      the marker, it cannot find one that lacks it, and an app that never marks a command declares no idempotency
      pattern). Its request carries a required string `idempotencyKey`. GraphQL accepts a required input field;
      REST maps `Idempotency-Key` through a validated input. Validate the key with `IsUUID()` or with `IsString()`,
      `MinLength(1)` and `MaxLength(64)`. The client retains one key across retries of one intended operation and uses a new
      key for a new intent. Internal delivery commands retain the delivery identity of BE-IDEMPOTENCY-1.
      The thin handler forwards the key to one domain service. That service returns its EntityManager transaction,
      whose callback returns `inbox.runClient({ principalId, operation, idempotencyKey, request }, manager, effect)`.
      The principal comes from verified authentication; the operation is a stable operation name. `request` contains every
      business input that changes the meaning of the operation, excluding the key. Inbox canonicalizes the JSON object
      keys and hashes the request, then atomically claims `(source = client:<principalId>:<operation>, event_id = key)`
      through that callback manager. A matching repeat returns the stored complete outcome, including a domain refusal,
      without invoking `effect`; a different fingerprint throws `IDEMPOTENCY_KEY_REUSED`, mapped to a conflict.
      The claim, effect's local writes and outbox rows, and JSON outcome commit together. An exception rolls them all back.
      The outcome is JSON data; undefined, non-finite numbers and non-JSON objects are refused. A concurrent claimant waits
      for the first transaction and replays its committed outcome or claims after its rollback. External calls use an
      outbox or their provider's supported idempotency contract; the local receipt does not prove remote deduplication.
      The domain owns the transaction (BE-PERSISTENCE-10); no interceptor owns a claim or transaction.
      A scheduled fenced job sweeps completed client receipts in bounded batches after the configured retention window
      measured from their first claim.
      Delivery claims are preserved. A key may identify a new intent after its receipt is swept, so clients must keep
      retries within the advertised retention window. Declare `idempotency` in `hfs.json` `sides.be.patterns` and prove
      `idempotency/repeat-returns-same-outcome` and `idempotency/reused-key-other-body-is-refused` on real Postgres through
      the full test world or lite's local integration lane.
    rationale: |-
      A timeout leaves a client unsure whether a mutation committed. The receipt binds the caller's intent to its durable
      result while a request fingerprint prevents the same key from silently authorizing different work.
    cases:
      - id: case-1
        when: Checkout adds a cart item
        write: 'Mark AddCartItemCommand with Effectful(); forward its validated key and fingerprint { productId, quantity } to runClient inside the checkout transaction, and return the stored Outcome on retry.'
      - id: case-2
        when: A transaction fails before commit
        write: 'Let the exception escape the transaction; the receipt and mutation roll back together so the same key can retry.'
      - id: case-3
        when: Retention expires
        write: 'A FencedProcessor delegates to the inbox retention domain service; the inbox owner deletes only completed client receipts older than the configured window in a bounded batch.'
    verification:
      automated:
        - BE_MUTATION_IDEMPOTENT
        - BE_PATTERN_SPEC_MISSING
        - BE_UNNAMED_DATA_ACCESS
        - BE_CQRS_SHAPE
        - BE_READONLY_BOUNDARY
      manual:
        - Review the effectful designation, authenticated principal, operation identity, complete request meaning and JSON outcome.
        - Exercise simultaneous identical requests, rollback and a changed body under the same key on the real database.
        - Confirm retention and provider recovery behavior match the advertised client contract.
    relatedExamples: [idempotency]
