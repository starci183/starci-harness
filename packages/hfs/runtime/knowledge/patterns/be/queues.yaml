# Edition lite (ruling:R212/case-10): the queue is BullMQ on Redis in both editions; only the outbox table's schema authority differs.
liteAdapter:
  summary: >-
    Under lite the queue pattern is full's, adapter included: producers write the outbox in the caller's transaction, the relay
    adds each committed row to BullMQ with the outbox id as the job id, BullMQ workers run the processors with the queue policy's
    attempts and exponential backoff, and a job that exhausts its attempts stays in BullMQ's failed set (the dead letter). The
    queue needs Redis: a lite app that declares queue or fenced-job declares `backing: [redis]` in hfs.json sides.be, and its
    stack runs one Redis with AOF persistence (appendonly yes, appendfsync everysec) on a named volume. One difference from
    full's adapter: the relay marks an outbox row sent only after the transport's persist step confirms Redis wrote the job to
    its append-only file (WAITAOF) and still holds it, so a job Redis loses inside the at most one second fsync window leaves
    its row waiting and is added again; that is why a lite queue does not lose a job. Without a declared Redis there is no queue
    pattern: the work is a direct call inside the request, or a declared replicated-job running a cli command. pgmq
    is the event bus, not a queue transport (ruling:lite-pgmq-bus-bullmq-jobs). `starci app add queue|job` writes this adapter in a lite app, with the outbox and job
    tables as one db migration, the Redis declaration and the persisted Redis of every docker-swarm environment.
  ports:
    - {port: QueueOutbox (platform/queue), adapter: "the outbox row written through the caller's tx by queue_write, and the relay's queue_waiting and queue_mark_sent, functions of the queue migration in db/migrations called through callDbFunction of platform/database (R334)"}
    - {port: queue transport (queue-transport.port.ts), adapter: "full's bullmq-queue-transport.client.ts over the declared Redis (host, port, db and the password read from its sealed secret file), plus persist(jobs): WAITAOF 1 0 on each queue's connection, then each job's state, refusing with QUEUE_NOT_PERSISTED or QUEUE_JOB_LOST (errors/queue.error.ts)"}
    - {port: outbox relay (queue-relay.service.ts), adapter: "full's relay, which calls persist after the adds and before it marks the rows sent, so a refusal rolls the mark back and the next pass adds the rows again"}
    - {port: QueueWorkerRegistry (platform/queue), adapter: "full's BullMQ worker per queue: attempts and exponential backoff from queue.policy.ts, failed jobs kept as the dead letter"}
    - {port: schedulers, adapter: "a BullMQ job scheduler declared with its queue, as full, or a platform/jobs tick (JobTickService, R335) that writes one row of the tick's queue into the queue outbox under its lock and minute claim"}
  forbids: [kafkajs]
  proof: >-
    Unit specs as full (queue-outbox, relay and worker services, the BullMQ client against a mocked factory); declaring queue
    requires integration specs titled `queue/<scenario>: ...` for every declared scenario on the local db service (R284,
    which runs no container of its own): the outbox, its commit boundary, the relay identity and the tick's minute claim are Postgres
    facts proved there with the real outbox writer and relay, and the queue transport records what the relay hands to BullMQ
    (the job id is the outbox id). BullMQ itself is covered by the unit spec of the BullMQ client, which also proves the
    persist refusals; the relay's unit spec proves a refused persist leaves the rows waiting.
