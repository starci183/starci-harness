schema: starci/knowledge-source@1
id: be.queues
title: Queues and schedulers
purpose: |-
  Given work that must run later, in the background or on a schedule, how is it started? It is a job of a typed queue:
  `modules/queues/<queue>/<queue>.queue.ts` is the producer (`enqueueX(payload, tx, correlationId)` writes the outbox in the caller's
  transaction), `platform/queue` relays committed rows to BullMQ (the job id is the outbox id, so a relay retry never duplicates
  a job), and a `features/jobs/<job>/<job>.processor.ts` runs it. A schedule is a BullMQ job scheduler declared beside the
  producer; `@Cron`, `@Interval` and `@Timeout` do not exist.
appliesTo:
  - backend
family: be
# The slot ids this topic teaches (knowledge/hfs/slots.yaml); scripts/gates/read-digest.mjs inverts these
# into the READ-step slot -> pattern-topic map (knowledge/op-gate.yaml kinds), each slot's topics in index.yaml order.
slots: [be.feature.jobs, be.queues, be.platform.queue]
pattern: queue
provenance:
  reviewedAt: 2026-10-24
  sources:
    - knowledge/hfs/README.md
    - knowledge/hfs/slots.yaml
    - knowledge/hfs/rules.yaml
    - owner decision 2026-10-02 (BullMQ queues with a transactional outbox, schedulers replace cron)
    - ruling:R212/case-10 (2026-10-24; the queue is Redis in both editions, lite declares its Redis)
    - https://docs.bullmq.io/guide/job-schedulers
  limitations: |-
    Static checks prove who enqueues, with which transaction, and that nothing imports BullMQ or Nest scheduling outside the
    owner. They do not prove retry budgets, concurrency, or that a scheduler's cadence suits the business; the test-world
    scenarios (`queue/*`) prove delivery against a real Redis.
rules:
  - id: BE-QUEUES-1
    title: A queue is a typed producer that writes the outbox in the caller's transaction
    kind: mandatory
    hfsRules: [R152, R154]
    requirement: |-
      Each queue is a folder `be/src/modules/queues/<queue>/` with `<queue>.queue.ts` (a class whose methods are the typed
      producers `enqueueX(payload, tx: EntityManager, correlationId: string)`), optional `<queue>.contracts.ts` (payload types and the queue name) and
      `index.ts`. A producer calls `QueueOutbox.write(tx, queue, payload, correlationId)` in `platform/queue`. A producer
      is called only by a domain service, inside its transaction (the same rule as `eventBus.publish`). Work inside one context
      that must happen now is a direct call, not a job.
      Current outbox writes validate the explicit correlation id before issuing SQL.
    rationale: |-
      The job row commits with the change that caused it, so a rolled-back change never starts work and a committed one is never
      lost.
    cases:
      - id: case-1
        when: A domain service must send a receipt after payment
        write: 'await this.entityManager.transaction(async (manager) => { await manager.save(...); await this.receiptQueue.enqueueSendReceipt({ orderId }, manager, request.correlationId) })'
    verification:
      automated:
        - BE_OUTBOX_WRITE_TX
        - BE_QUEUE_PRODUCER_SHAPE
      manual:
        - Confirm the payload carries ids, not entities, and the queue name is the contract between producer and processor.
    relatedExamples: [queue]
  - id: BE-QUEUES-2
    title: platform/queue is the only BullMQ owner and the relay keeps jobId equal to the outbox id
    kind: mandatory
    hfsRules: [R90]
    requirement: |-
      `bullmq` and `@nestjs/bullmq` are imported only by `platform/queue`. Its relay claims committed queue-outbox rows per
      registered connection and adds each job with `jobId = <outbox id>`; BullMQ ignores a second add of the same id, so a relay
      that crashes after adding and before marking the row sent re-adds harmlessly. Nothing else constructs a `Queue`, `Worker`
      or `FlowProducer`.
      The row's explicit `correlationId` travels in the job envelope and `QueueDelivery`, following BE-LOGGING-4.
      BullMQ envelopes carry the owned `schema: "starci/queue@1"` marker; enqueued jobs wrap the payload and explicit id.
      Only the owned marker family is interpreted as transport data. Unmarked legacy objects remain whole business payloads,
      including their `kind`, `schema` and `correlationId` fields.
    rationale: |-
      The relay is at least once; a deterministic job id turns it into effectively once.
    cases:
      - id: case-1
        when: The relay re-reads a row it already added
        write: 'transport.add(row.queue, row.id, row.payload, row.correlationId) preserves the outbox id and correlation id; the BullMQ adapter adds the envelope with jobId = row.id.'
    verification:
      automated:
        - BE_INFRA_OWNER
      manual: []
    relatedExamples: [queue]
  - id: BE-QUEUES-3
    title: A schedule is a BullMQ job scheduler declared with its queue, or a platform/jobs tick that writes the outbox
    kind: mandatory
    hfsRules: [R90, R335]
    requirement: |-
      A recurring task is a job scheduler (`upsertJobScheduler`) that the queue module declares in its `schedulers` list and
      `platform/queue` registers at boot, or, in a lite app, a tick of `platform/jobs` (BE-JOBS-6, R335): `JOB_TICKS` of
      `job-ticks.contracts.ts` lists it as data and `JobTickService` fires it on every replica, where each firing takes
      `advisoryXactLock(tx, "tick:<name>")`, claims the tick's UTC minute through `job_tick_claim` and only then writes one row of
      the tick's queue into the queue outbox, which the relay hands to BullMQ. Its job is processed by the same
      `features/jobs/<job>/<job>.processor.ts` as any enqueued job. `@nestjs/schedule` and `cron` are imported only by that
      scheduler, and `@Cron`, `@Interval`, `@Timeout` and `setInterval` for work are not used anywhere.
    rationale: |-
      One scheduler in Redis, or one minute claim in the database, fires once for the whole deployment, where cron in a replicated
      process fires once per replica.
    cases:
      - id: case-1
        when: Expire unpaid orders every five minutes
        write: 'order-expiry.queue.ts declares scheduler { every: 5 minutes } for the expire-orders job; the processor dispatches ExpireOrdersCommand.'
      - id: case-2
        when: A lite app sends booking reminders every fifteen minutes
        write: "platform/jobs declares a booking_reminder tick every fifteen minutes (BE-JOBS-6): each firing claims its slot and writes one booking_reminder row through the queue outbox; the send-reminder processor is the queue's."
    verification:
      automated:
        - BE_INFRA_OWNER
        - DB_PGMQ_DECLARED
      manual:
        - Confirm the cadence and the job's idempotence.
    relatedExamples: [queue]
  - id: BE-QUEUES-4
    title: A declared queue pattern is proven on the test world
    kind: mandatory
    hfsRules: [R155]
    requirement: |-
      An app that declares `queue` has tests titled `queue/<scenario>: ...` for `enqueue-atomic-with-transaction`,
      `relay-job-id-is-outbox-id` and `scheduler-fires-once`, run against a real Redis.
    rationale: |-
      Atomicity and once-only firing are runtime facts.
    cases:
      - id: case-1
        when: The order-expiry e2e suite
        write: "it('queue/scheduler-fires-once: two relays, one job', ...)"
    verification:
      automated:
        - BE_PATTERN_SPEC_MISSING
      manual: []
    relatedExamples: [queue]
