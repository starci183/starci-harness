  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

FE_SLOT_FILE_ROLE:
  title: "A front-end file is owned by a slot and named by it"
  title_vi: "Tệp không đúng vai trò trong slot"
  meaning_vi: "Tệp `<f>` nằm trong slot `<s>` nhưng tên của nó không thuộc danh sách `allows` của slot (ví dụ `page.tsx` trong hooks, đoạn `[lang]` dưới `app/`, `*.test.tsx` cạnh component), hoặc là tệp đặt ở chỗ slot cần một thư mục."
  causes_vi:
    - "Vi phạm luật R94: mỗi slot thư mục của front end (route, feature, components, hooks, modules/api) chỉ chứa các tệp mà `allows` của nó gọi tên, và chứa chúng trong thư mục riêng; tệp không slot nào sở hữu là HFS_PATH_NO_SLOT."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi tên tệp về vai trò được phép hoặc chuyển nó về slot đúng; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_SOURCE_FORM:
  title: "Front-end source file breaks the layout, naming or comment canon"
  title_vi: "Tệp nguồn FE sai quy ước tên, vị trí hoặc chú thích"
  meaning_vi: "Tệp FE phải nằm đúng thư mục tầng với tên cố định, export hàm mũi tên trùng tên thư mục, có JSDoc tiếng Anh, không emoji và không có chữ tiếng Việt trong định danh, chuỗi ký tự, chú thích hay tên test (trừ danh mục i18n và slot fixture i18n); luật ESLint nêu trong lời nhắn chỉ rõ phần sai."
  causes_vi:
    - "Tệp đặt sai tầng hoặc thư mục phụ trợ trong components"
    - "Export không khớp tên thư mục"
    - "Thiếu JSDoc hoặc có emoji"
    - "Có chữ tiếng Việt trong mã nguồn ngoài danh mục i18n hoặc slot fixture i18n"
  nextStep_vi: "Chuyển tệp về đúng thư mục tầng, đổi tên export theo thư mục và thêm JSDoc tiếng Anh. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_SOURCE_LAYOUT_INVALID:
