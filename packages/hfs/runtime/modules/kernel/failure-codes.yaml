  meaning_vi: "Các commit kể từ nhánh gốc, chỉ mục hoặc cây làm việc đổi mã của một màn hình thuộc khu có trong .starcistacks/canvas/design.json, nhưng trang của màn hình trong sổ không có, chỉ ở trạng thái drafted, hoặc được duyệt (approvedAt) trước lần đổi mã mới nhất; thay đổi cũng không cập nhật mục của trang trong sổ."
  causes_vi:
