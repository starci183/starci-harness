    - "Component vẽ SVG trực tiếp mà không phải leaf nhãn hiệu được khai báo"
  nextStep_vi: "Thay glyph bằng Heroicons qua leaf Icon; nếu là nhãn hiệu, đặt nó trong leaf nhãn hiệu và khai báo đúng chủ của leaf (R286; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_LIST_KEY:
  title: "List rows have a stable key and stable props"
  title_vi: "Danh sách thiếu key ổn định"
  meaning_vi: "`.map` ở `<file>` trả phần tử không có `key`, dùng chỉ số hoặc giá trị ngẫu nhiên làm `key`, hoặc truyền object/array literal cho component trong danh sách; hàng bị đổi state khi xoá hoặc sắp xếp lại, và memo không bao giờ trúng."
  causes_vi:
    - "Vi phạm luật R65: Phần tử trong `.map` có `key` lấy từ id của dữ liệu (không dùng index, `Math.random`, `Date.now`), và không truyền object/array literal cho component trong danh sách; hằng số được nâng ra ngoài."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
