    - "Hook miền tự sở hữu bộ nhớ đệm thay vì dùng hook bọc của họ SWR"
  nextStep_vi: "Chuyển lời gọi SWR về hook bọc trong hooks/swr rồi để component hoặc hook miền dùng hook đó."
