  meaning_vi: "`catch` hoặc `.catch(() => {})` ở `<file>` không làm gì: lỗi biến mất, người dùng không thấy thông báo, đội không có dấu vết."
  causes_vi:
    - "Vi phạm luật R65: Mỗi `catch` trả một outcome có kiểu mang nguyên nhân, hiển thị trạng thái lỗi hoặc ném lại."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_SWR_KEY_IDENTITY:
