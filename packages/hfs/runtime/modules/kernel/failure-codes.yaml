  meaning_vi: ".starcistacks/brand/illustration.yaml không phải YAML, hoặc basePrompt không đúng dạng { version: số nguyên từ 1, text: khối chữ không rỗng }; hoặc .starcistacks/brand/media.yaml không đúng dạng bases: { <tên kebab-case khác illustration>: { version: số nguyên từ 1, text: khối chữ không rỗng } }."
