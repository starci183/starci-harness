  meaning_vi: "Tệp <file> vẽ SVG trực tiếp ngoài leaf nhãn hiệu được khai báo; glyph thông thường phải đến từ họ Heroicons thông qua leaf Icon."
  causes_vi:
    - "Leaf Icon tự vẽ path hoặc SVG thay vì dùng Heroicons"
    - "Component vẽ SVG trực tiếp mà không phải leaf nhãn hiệu được khai báo"
  nextStep_vi: "Thay glyph bằng Heroicons qua leaf Icon; nếu là nhãn hiệu, đặt nó trong leaf nhãn hiệu và khai báo đúng chủ của leaf (R286; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_LIST_KEY:
  title: "List rows have a stable key and stable props"
  title_vi: "Danh sách thiếu key ổn định"
  meaning_vi: "`.map` ở `<file>` trả phần tử không có `key`, dùng chỉ số hoặc giá trị ngẫu nhiên làm `key`, hoặc truyền object/array literal cho component trong danh sách; hàng bị đổi state khi xoá hoặc sắp xếp lại, và memo không bao giờ trúng."
  causes_vi:
    - "Vi phạm luật R65: Phần tử trong `.map` có `key` lấy từ id của dữ liệu (không dùng index, `Math.random`, `Date.now`), và không truyền object/array literal cho component trong danh sách; hằng số được nâng ra ngoài."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_LIST_PANEL_PADDING:
  title: "Panel list wrapper stacks horizontal content padding"
  title_vi: "Phần tử bọc danh sách trong panel cộng dồn padding ngang"
  meaning_vi: "Ứng dụng thêm padding ngang vào phần tử bọc ListBox của Grammar hoặc nhãn nhóm bên trong surface có nền, khiến nội dung lệch khỏi mép panel."
  causes_vi:
    - "Bọc ListBox bằng phần tử có padding ngang"
    - "Thêm padding ngang quanh nhãn nhóm của danh sách"
  nextStep_vi: "Bỏ padding của phần tử bọc và dùng ListBox inset=\"panel\" để các hàng và nhãn nhóm thẳng mép nội dung của panel."
  owner: "op-retry"
  kind: "check-finding"

FE_NATIVE_FORM_CONTROL:
  title: "No raw form controls, native images or raw structural tags in product tiers; the grammar renders them"
  title_vi: "Control form thô"
  meaning_vi: "`<tag>` thô ở `<file>`. Dùng renderer của grammar."
  causes_vi:
    - "Vi phạm luật R62: Không `<select>/<input>/<textarea>/<button>`, `<img>` thô và không thẻ cấu trúc thô (`<section>`, `<p>`, `<ul>`, `<h1>`...) ở tầng sản phẩm; dùng renderer grammar."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ (R62; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_NATIVE_IMAGE:
  title: "next/image with a reserved size"
  title_vi: "Ảnh thô hoặc next/image thiếu kích thước"
  meaning_vi: "`<file>` dùng `<img>` thô, hoặc `Image` không có `width` và `height` (hay `fill` mà không có `sizes`): trình duyệt không giữ chỗ nên trang nhảy khi ảnh tải xong."
  causes_vi:
    - "Vi phạm luật R62: Ảnh dùng `Image` của `next/image` với `width`+`height` hoặc `fill`+`sizes`; alt lấy từ catalog thông điệp."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_BRAND_NOT_ONE:
  title: "The front end does not have exactly one brand file"
  title_vi: "Front end không có đúng một file thương hiệu"
  meaning_vi: "Các ứng dụng web của front end không có `modules/brand/brand.css`, hoặc có nhiều hơn một: hai file là hai thương hiệu, trang giới thiệu và ứng dụng sẽ lệch màu."
  causes_vi:
    - "Vi phạm R445: màu của sản phẩm sống trong MỘT file token thương hiệu, mọi stylesheet toàn cục của mọi ứng dụng web import đúng file đó."
  nextStep_vi: "Giữ một `modules/brand/brand.css`, gộp token của file thừa vào đó, xóa file thừa và để `globals.css` của từng ứng dụng import file duy nhất (R445; contexts/project/brand.md PROJECT-BRAND-4)."
  owner: op-retry
  kind: check-finding

FE_BRAND_CANVAS_LITERAL:
  title: "A canvas generator writes a colour literal"
  title_vi: "Bộ sinh canvas ghi trực tiếp một giá trị màu"
  meaning_vi: "Một file trong `.starcistacks/canvas/gen/` (không kể bản sao `gen/kit/` của claude-design) chứa hex, hàm màu, tên màu trong thuộc tính màu hoặc class màu Tailwind tùy ý hay bảng mặc định."
  causes_vi:
    - "Vi phạm R445: canvas đọc màu từ token sinh ra từ file thương hiệu của ứng dụng, bộ sinh canvas không giữ màu riêng nên canvas luôn hiển thị đúng thương hiệu đang phát hành."
  nextStep_vi: "Thay giá trị màu bằng `var(--token)` của `.starcistacks/canvas/tokens.css`; thiếu token thì thêm vào brand.css rồi chạy lại `canvas-tokens.mjs` (R445; contexts/project/brand.md PROJECT-BRAND-4)."
  owner: op-retry
  kind: check-finding

FE_BRAND_CANVAS_TOKENS_STALE:
  title: "The canvas tokens are not generated from the brand file"
  title_vi: "Token của canvas không được sinh từ file thương hiệu"
  meaning_vi: "`.starcistacks/canvas/tokens.css` không có, đã bị sửa tay, hoặc cũ hơn brand.css: nội dung khác với bản `canvas-tokens.mjs` sinh ra."
  causes_vi:
    - "Vi phạm R445: canvas đọc token thương hiệu thật của ứng dụng; file token là một dòng dấu (đường dẫn và sha256 của brand.css) rồi đến lớp thương hiệu nguyên văn."
  nextStep_vi: "Chạy `node node_modules/@starci/hfs/runtime/scripts/hfs/canvas-tokens.mjs` ở gốc ứng dụng rồi commit `tokens.css` (R445; contexts/project/brand.md PROJECT-BRAND-4)."
  owner: op-retry
  kind: check-finding

FE_GLOBALS_NOT_ONE:
  title: "A web app has a second global stylesheet"
  title_vi: "Ứng dụng web có stylesheet toàn cục thứ hai"
  meaning_vi: "Dưới `src/` của ứng dụng có file `.css` ngoài `app/globals.css` và `modules/brand/brand.css` (ví dụ `site.css` của một route group), hoặc một file TypeScript import stylesheet khác `globals.css`."
  causes_vi:
    - "Vi phạm R446: ứng dụng nạp CSS qua đúng một cửa, `src/app/globals.css`, nên trang giới thiệu và ứng dụng dùng chung CSS toàn cục."
  nextStep_vi: "Đưa token vào brand.css, phần bố cục vào tiện ích của Grammar, xóa stylesheet thừa và import duy nhất `globals.css` ở layout gốc (R446; contexts/code/fe/ui.md FE-CSS-4)."
  owner: op-retry
  kind: check-finding

FE_GLOBALS_IMPORTS_MISSING:
  title: "The global stylesheet is missing or lacks the Grammar or brand import"
  title_vi: "Stylesheet toàn cục thiếu hoặc không import Grammar hay file thương hiệu"
  meaning_vi: "Ứng dụng có cây route nhưng không có `src/app/globals.css`, hoặc globals không `@import` stylesheet `@starci/grammar/...` hay `modules/brand/brand.css`."
  causes_vi:
    - "Vi phạm R446: stylesheet toàn cục duy nhất mang CSS của Grammar và token thương hiệu của ứng dụng."
  nextStep_vi: "Thêm `@import \"@starci/grammar/<family>.css\"` và `@import \"../modules/brand/brand.css\"` đúng thứ tự của FE-CSS-2 vào `globals.css` (R446; contexts/code/fe/ui.md FE-CSS-2, FE-CSS-4)."
  owner: op-retry
  kind: check-finding

FE_STATE_PAGE_NOT_SHARED:
  title: "A system-state page is not the shared component of its kind"
  title_vi: "Trang trạng thái hệ thống không phải thành phần dùng chung của loại đó"
  meaning_vi: "Một `not-found.tsx`, `error.tsx`, `global-error.tsx` hay trang offline vẽ thành phần khác với các boundary cùng loại của front end."
  causes_vi:
    - "Vi phạm R447: mỗi trạng thái hệ thống (không tìm thấy, lỗi, offline) có MỘT thành phần trang dùng chung, mọi route group và ứng dụng đều render đúng thành phần đó."
  nextStep_vi: "Nối boundary tới composite dùng chung (NotFoundNotice, ErrorNotice; GlobalErrorNotice bọc ErrorNotice) thay vì dựng trang riêng (R447; contexts/code/fe/ui.md FE-STATE-PAGES)."
  owner: op-retry
  kind: check-finding

FE_STATE_PAGE_GROUP_MISSING:
  title: "A route group has no error or not-found boundary of its own"
  title_vi: "Route group thiếu boundary error hoặc not-found riêng"
  meaning_vi: "Một route group `(tên)` có trang hoặc layout nhưng không có `error.tsx` hay `not-found.tsx` ngay trong thư mục của nó."
  causes_vi:
    - "Vi phạm R447: mỗi route group có boundary riêng nối tới thành phần dùng chung, để lỗi hay địa chỉ không tồn tại trong group không rơi sang giao diện khác."
  nextStep_vi: "Thêm `error.tsx` và `not-found.tsx` vào route group, mỗi file chỉ nối tới composite dùng chung (R447; contexts/code/fe/ui.md FE-STATE-PAGES)."
  owner: op-retry
  kind: check-finding

FE_NAVBAR_CLUSTER:
  title: "The navbar right cluster has the wrong kinds or order"
  title_vi: "Cụm bên phải navbar sai loại hoặc thứ tự"
  meaning_vi: "Cụm navbar tại <file> không giữ thứ tự ngôn ngữ, giao diện, thông báo và tài khoản."
  causes_vi:
    - "Cấu trúc shell không theo canon ứng dụng."
  nextStep_vi: "Ghép IconButton ngôn ngữ, Switch giao diện, IconButton chuông và AvatarButton theo đúng thứ tự (R315; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_NAVBAR_CONTROL_SIZE:
  title: "A navbar control bypasses the selected Grammar control scale"
  title_vi: "Điều khiển navbar không dùng cỡ control"
  meaning_vi: "Điều khiển trong navbar tại <file> không khai báo cùng cỡ control của Grammar."
  causes_vi:
    - "Cấu trúc shell không theo canon ứng dụng."
  nextStep_vi: "Đặt size=\"control\" trên từng điều khiển trong thanh (R314; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_NAVBAR_CREATE:
  title: "A create action is placed in the navbar"
  title_vi: "Thao tác tạo mới nằm trong navbar"
  meaning_vi: "Navbar tại <file> chứa thao tác tạo mới thuộc nội dung trang."
  causes_vi:
    - "Cấu trúc shell không theo canon ứng dụng."
  nextStep_vi: "Đưa thao tác tạo mới về trang sở hữu nó (R317; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_NESTED_VARIANT:
  title: "App variants bypass Grammar surface context"
  title_vi: "Variant ứng dụng vượt qua context surface của Grammar"
  meaning_vi: "Ứng dụng đặt variant tĩnh cho trường Grammar trên bất kỳ lớp nào, hoặc ép Tabs dùng primary trong surface có nền."
  causes_vi:
    - "Truyền variant tĩnh cho trường Grammar"
    - "Ép Tabs dùng primary bên trong surface có nền"
  nextStep_vi: "Bỏ variant để Grammar tự cấp mặc định theo context surface."
  owner: "op-retry"
  kind: "check-finding"

FE_NEXT_CONVENTIONS:
  title: "A Next convention of HFS is broken"
  title_vi: "Vi phạm quy ước Next của HFS"
  meaning_vi: "Một tệp dùng tên hoặc cách viết cũ của Next: middleware thay vì proxy.ts (từ Next 16), thiếu generateMetadata trên page, turbopack.root sai, hoặc dev và build dùng hai bundler khác nhau. Đây là kiểm tra con của R54 và R02."
  causes_vi:
    - "Đặt tên tệp middleware.ts trên Next 16 trở lên"
    - "Page không có generateMetadata"
    - "turbopack.root trỏ sai gốc workspace"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_NO_ALERT:
  title: "The front end calls a browser alert"
  title_vi: "Front end gọi hộp thoại alert của trình duyệt"
  meaning_vi: "Tệp <file> gọi alert() hoặc biến thể toàn cục của nó, tạo hộp thoại trình duyệt ngoài hệ thống thông báo của sản phẩm."
  causes_vi:
    - "Dùng alert() để báo lỗi hoặc báo thao tác hoàn tất"
    - "Gọi window.alert hoặc globalThis.alert thay cho toast"
  nextStep_vi: "Dùng mô-đun toast của sản phẩm hoặc overlay được khai báo, với chữ hiển thị lấy từ catalog next-intl."
  owner: op-retry
  kind: check-finding

FE_NO_COMMIT_IN_COLLECTION_ITEM:
  title: "A collection item repeats a commit"
  title_vi: "Phần tử danh sách lặp lại lệnh commit"
  meaning_vi: "Một phần tử collection hoặc callback map tại <file> hiển thị nút commit."
  causes_vi:
    - "Mỗi hàng giành vai trò hành động chính của toàn màn hình."
  nextStep_vi: "Dùng alternative cho hành động tiếp theo của hàng và giữ commit ở quyết định của màn hình (CTA-6)."
  owner: op-retry
  kind: check-finding

FE_NO_TESTS:
  title: "Front end holds a test file, test tooling or a test dependency"
  title_vi: "Front end có tệp test, công cụ test hoặc thư viện test"
  meaning_vi: "Chuẩn của front end là không có test: repository có spec, e2e, cấu hình vitest, Playwright hay jest, script test, hoặc khai báo thư viện chạy test, dựng môi trường test, testing-library, axe trong package.json."
  causes_vi:
    - "Viết spec hoặc e2e cho component, hook hay trang"
    - "Thêm vitest, Playwright, jest, testing-library hoặc axe vào package.json"
    - "Thêm script test hoặc cấu hình test vào repository front end"
  nextStep_vi: "Xóa tệp, cấu hình, script và thư viện test đó; front end không có ngoại lệ, kể cả thư mục scripts/. Kiểm tra giao diện bằng lint, typecheck và starci app check."
  owner: op-retry
  kind: check-finding

FE_OP_OUTSIDE_SWR_HOOK:
  title: "An API operation is used outside its SWR wrapper hook"
  title_vi: "Operation API được dùng ngoài hook bọc SWR"
  meaning_vi: "Tệp <file> import hoặc gọi operation của modules/api trực tiếp ở component, feature hoặc hook miền, bỏ qua hook bọc trong hooks/swr."
  causes_vi:
    - "Hook miền import operation API trực tiếp"
    - "Component hoặc trang máy chủ gọi operation thay vì dùng hook bọc"
  nextStep_vi: "Đặt import và lời gọi operation trong hook bọc tương ứng ở hooks/swr; các tệp tiêu thụ chỉ dùng hook đó."
  owner: op-retry
  kind: check-finding

FE_OUTCOME_KIND_UNHANDLED:
  title: "A switch over an Outcome names every kind"
  title_vi: "Switch trên Outcome thiếu nhánh"
  meaning_vi: "`switch` trên `kind` ở `<file>` có nhánh `ok` nhưng thiếu `<kinds>`. Mỗi kind là một màn người dùng có thể gặp: refused, invalid, not-found, unavailable."
  causes_vi:
    - "Vi phạm luật R51: Mọi `switch` trên `Outcome<T>` liệt kê đủ `ok`, `refused`, `invalid`, `not-found`, `unavailable`; không dựa vào `default`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_OWNER_REACHABLE:
  title: "Page feature not mounted by a route"
  title_vi: "Feature trang chưa được route nào gắn vào"
  meaning_vi: "Một feature trang, layout hoặc overlay của frontend không có đường import chạy thật từ bất kỳ tệp nào trong cây route của ứng dụng (thư mục src/app). Người dùng sẽ không bao giờ thấy nó vì không route nào hiển thị."
  causes_vi:
    - "Quên import feature vào page.tsx hoặc layout.tsx tương ứng"
    - "Route chỉ import kiểu của feature chứ không render nó"
    - "Feature đã bị thay thế nhưng thư mục cũ vẫn còn"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để gắn feature vào route đúng hoặc xoá feature không dùng; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_PACKAGE_SHAPE:
  title: "Packages build to `dist` with explicit exports and no dead unit"
  title_vi: "Gói dùng chung sai hình dạng"
  meaning_vi: "Package `<p>` export source chưa build (hoặc `export *`, hoặc unit không ai dùng)."
  causes_vi:
    - "Vi phạm luật R63: `packages/*` build ra `dist`, `exports` tường minh, không `export *`, không unit chết; package UI chỉ chứa composites/branches/leaves + CSS token của family."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

FE_PAGE_HEADER_HAND_ROLLED:
  title: "A page head is composed by hand instead of PageHeader"
  title_vi: "Phần đầu trang được ghép tay thay vì dùng PageHeader"
  meaning_vi: "Tại <file>, một PageHeader hoặc Breadcrumbs được nhập trực tiếp từ Grammar, vốn là bộ phận riêng của Page và không còn được export: phần đầu trang ghép tay không có dải nền, không có khoảng đệm trên và không có đường phân cách, nên mỗi trang tự quyết khoảng cách riêng."
  causes_vi:
    - "Nhập PageHeader hoặc Breadcrumbs từ Grammar để ghép đầu trang ở trang hoặc layout."
  nextStep_vi: "Dùng khe header của Page với breadcrumbs, title và các khe cần thiết (description, meta, status, mark, actions, tabs) (quy định page-header-band)."
  owner: op-retry
  kind: check-finding

FE_PAGE_METADATA_MISSING:
  title: "Every page exports metadata"
