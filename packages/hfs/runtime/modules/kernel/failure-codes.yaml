  meaning_vi: "`<file>` trong `hooks/` không phải React hook, hoặc một domain có nhiều hơn một tệp `.shared.ts` (hay tệp shared không mang tên domain), hoặc một helper được khai báo ở nhiều tệp của domain. Hàm gọi mạng về `modules/api`, helper về `<domain>.shared.ts`."
  causes_vi:
    - "Vi phạm luật R56: `hooks/` chỉ chứa hook: `hooks/swr` (mỗi operation của `modules/api` một hook SWR), `hooks/rhf`, `hooks/zustand/<store>`, `hooks/socketio`, `hooks/effects`, `hooks/reuseables` và `hooks/<domain>/` với một `<domain>.shared.ts` cho helper dùng chung."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_SURFACE_NESTING:
  title: "A surface stands inside a surface, or a table, grid or heading stands where the card laws refuse it"
  title_vi: "Bề mặt nằm trong bề mặt, hoặc bảng, lưới, tiêu đề nằm sai chỗ"
  meaning_vi: "Qua các tệp, `<file>` vẽ một card trong card, trong `Pane surface` hoặc trong lớp phủ; một `DataTable` trong card; một `PaneGrid` ngoài `Page chrome=\"panes\"`; một tiêu đề đứng ngay trên một card; hoặc một card có nhãn lặp trong `Grid`. Từng tệp đứng riêng thì hợp lệ, ghép lại thì sai."
  causes_vi:
    - "Vi phạm luật R356: bề mặt trong bề mặt bị cấm hoàn toàn (kể cả hộp thoại và ngăn kéo); card tự mang nhãn nên không cần tiêu đề phía trên; bảng đứng trên trang; lưới chia pane chỉ đứng trong `Page chrome=\"panes\"`; ô lặp lại không có nhãn."
  nextStep_vi: "Bỏ card bên trong (đưa nội dung lên card ngoài), chuyển bảng ra trang, đưa tiêu đề vào nhãn của card, hoặc chuyển ô lặp thành tile không nhãn. Bộ kiểm tra nêu chuỗi thành phần dẫn tới chỗ sai."
  owner: op-retry
  kind: check-finding

FE_RENDER_PROP_ACROSS_SERVER:
