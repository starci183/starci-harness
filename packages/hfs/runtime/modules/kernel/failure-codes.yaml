HFS_README_SECTION_ORDER:
  title: "README sections out of order"
  title_vi: "Các mục README sai thứ tự"
  meaning_vi: "Các mục chuẩn của README không theo đúng thứ tự quy định."
  causes_vi:
    - "Đặt mục sau trước mục trước"
    - "Chèn mục thêm làm xáo trộn thứ tự"
