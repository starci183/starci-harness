  kind: check-finding

HFS_README_TITLE_INVALID:
  title: "README title does not match repo name"
  title_vi: "Tiêu đề README không khớp tên kho"
  meaning_vi: "Dòng đầu README phải là # kèm tên kho nhưng đang khác."
  causes_vi:
    - "Tiêu đề đặt tên khác"
    - "Kho đổi tên mà README chưa đổi"
  nextStep_vi: "Op docs.author sửa dòng đầu thành # <tên kho>."
  owner: other-op:docs.author
  kind: check-finding

HFS_README_WORK_POINTER_MISSING:
  title: "README lacks Work pointer"
  title_vi: "README thiếu chỉ dẫn tới cây Work"
  meaning_vi: "README chưa chỉ tới cây .starciwork của kho backend."
  causes_vi:
    - "Chưa viết dòng trỏ tới .starciwork"
    - "Chỉ dẫn viết sai nơi"
  nextStep_vi: "Op docs.author thêm chỉ dẫn tới cây .starciwork của backend."
  owner: other-op:docs.author
  kind: check-finding

HFS_RELEASE_TAG_MISMATCH:
  title: "Product release tag does not match its version or image tag"
  title_vi: "Tag phát hành sản phẩm không khớp phiên bản hoặc tag image"
  meaning_vi: "Tag phát hành phải có dạng v cộng phiên bản package.json; workflow images.yml phải dùng tag phát hành đó cho image trong lite và full."
  causes_vi:
    - "Phiên bản package và tag khác nhau hoặc image dùng tag khác theo luật R271."
  nextStep_vi: "Đồng bộ phiên bản package và tag phát hành, rồi dùng cùng tag trong workflow xây image."
  owner: op-retry
  kind: check-finding

HFS_REPO_LOCAL_CHECK:
  title: "A repository keeps no check or lint rule of its own"
  title_vi: "Kho tự giữ bộ kiểm tra riêng"
  meaning_vi: "Kho có nguồn kiểm tra hoặc luật lint cục bộ ở `<f>`: tệp `check-*` trong `scripts/` hay `tools/`, tệp `eslint-local-rules*`, plugin eslint cục bộ, hoặc script npm chạy một tệp `check-*`."
  causes_vi:
    - "Vi phạm luật R103: mọi bộ kiểm tra sống trong runtime `.claude` (starci app check, các canon eslint); kho sản phẩm không giữ bộ kiểm tra hay luật riêng. `scripts/` chỉ chứa script vận hành."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa tệp và script trỏ tới nó; nếu luật còn cần thì đề xuất vào canon trong runtime `.claude`, không giữ bản sao trong kho."
  owner: op-retry
  kind: check-finding

HFS_REPO_UNREADABLE:
  title: "Repository is not a readable Git work tree"
  title_vi: "Không đọc được kho Git"
  meaning_vi: "Bộ kiểm tra HFS chỉ xét những gì Git theo dõi nên cần một cây làm việc Git đọc được; thư mục được chỉ định thì không."
  causes_vi:
    - "Đường dẫn --repo sai hoặc không phải kho Git"
    - "Git chưa cài hoặc kho bị hỏng"
  nextStep_vi: "Trỏ --repo vào gốc một kho Git hợp lệ rồi chạy lại."
  owner: op-retry
  kind: input-invalid

HFS_REQUIRED_FILE_MISSING:
  title: "Required file, directory or minimum instance is missing"
  title_vi: "Thiếu tệp, thư mục hoặc số lượng tối thiểu bắt buộc theo bảng kê"
  meaning_vi: "Bảng kê HFS đòi một tệp hoặc thư mục phải có trong mỗi phần của kho (gói dùng chung, module frontend, api, i18n, tuyến, layout...), hoặc đòi kho có ít nhất một ứng dụng hay tính năng thuộc loại bắt buộc. Mục đó không tồn tại; khi là số lượng tối thiểu thì báo tại hfs.json. Thiếu nó thì phần liên quan chưa hoạt động đầy đủ hoặc kho chưa phải một sản phẩm hoàn chỉnh."
  causes_vi:
    - "Tạo thư mục mới nhưng chưa thêm tệp bắt buộc như index.ts, store.ts, toast.tsx hoặc package.json"
    - "Tệp có nhưng tên hoặc chỗ đặt khác với bảng kê"
    - "Kho chưa có tính năng hoặc ứng dụng nào của loại bắt buộc"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để tạo tệp còn thiếu đúng chỗ bảng kê chỉ định; nếu cấu trúc hiện có là chủ ý thì đó là việc sửa bảng kê, do người giám sát làm, không phải kho tự đổi."
  owner: op-retry
  kind: check-finding

HFS_ROOT_ENTRY_FORBIDDEN:
  title: "Root entry not on HFS allowlist"
  title_vi: "Mục ở thư mục gốc không được phép"
  meaning_vi: "Ở thư mục gốc của repo có một tệp hoặc thư mục không nằm trong các gốc mà slot của repo khai báo (ví dụ contracts/ cho ảnh chụp hợp đồng)."
  causes_vi:
    - "Worker tạo thêm tệp hoặc thư mục ngay ở gốc repo"
    - "Tệp cũ chưa được dời vào đúng chỗ của nó"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op vừa tạo ra mục đó phải dời nó vào thư mục sở hữu rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_ROOT_ENTRY_MISSING:
  title: "Required root entry is missing"
  title_vi: "Thiếu mục bắt buộc ở thư mục gốc"
  meaning_vi: "Repo thiếu một tệp hoặc thư mục mà cấu trúc chuẩn bắt buộc phải có ở gốc, hoặc README.md không đọc được."
  causes_vi:
    - "Repo mới chưa được dựng khung đầy đủ"
    - "Tệp gốc bị xóa hoặc chưa được commit"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op đang làm việc phải tạo mục còn thiếu rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_ROOT_MARKDOWN_FORBIDDEN:
  title: "Markdown file at repository root"
  title_vi: "Tệp Markdown đặt ở thư mục gốc"
  meaning_vi: "Có một tệp Markdown nằm ngay ở gốc repo, trong khi tài liệu phải nằm trong thư mục docs hoặc hồ sơ Work của nó."
  causes_vi:
    - "Worker ghi ghi chú hoặc báo cáo thẳng ra gốc repo"
    - "Tài liệu cũ chưa được dời đi"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải chuyển tệp vào docs/ hoặc hồ sơ Work rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_ROOT_SRC_FORBIDDEN_FE:
  title: "Root src folder in the front end (fe/)"
  title_vi: "Repo giao diện có thư mục src ở gốc"
  meaning_vi: "Repo giao diện có thư mục src ngay ở gốc, trong khi mã nguồn chỉ được đặt trong apps/<tên app>/src."
  causes_vi:
    - "Dự án giao diện được dựng theo kiểu một app đơn"
    - "Worker tạo mã ngoài thư mục app"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải chuyển toàn bộ src vào apps/<app>/src rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_RULE_OFF_WITHOUT_REPLACEMENT:
  title: "The ESLint configuration (and a front end's stylelint configuration) is the rendered one-liner, so no rule is off, warned or redefined in a repository"
  title_vi: "Cấu hình ESLint hoặc stylelint lệch bản render"
  meaning_vi: "`eslint.config.mjs` (hoặc `stylelint.config.mjs` của front end) khác bản render (một dòng gọi `starciBeConfig`, `starciFeConfig` hoặc `starciStylelintConfig`). Factory không nhận tham số ghi đè, nên một luật chỉ có thể bị tắt, hạ mức hoặc định nghĩa lại trong repo khi tệp này khác bản render. Chạy `starci app sync --write`, không sửa tay."
  causes_vi:
    - "Vi phạm luật R17: `eslint.config.mjs` phải đúng bằng bản render; luật thay thế nằm trong plugin của `.claude`, không bao giờ tắt trong repo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SBOM_MISSING:
  title: "Release images carry SBOM and provenance evidence"
  title_vi: "Image phát hành thiếu SBOM hoặc provenance"
  meaning_vi: "Workflow images thiếu bước hoạt động tạo SBOM và chứng thực nguồn gốc cho image phát hành."
  causes_vi:
    - "Vi phạm R269: bản dựng không tạo cả danh mục thành phần và bằng chứng nguồn gốc."
  nextStep_vi: "Bật sbom và provenance trong bước build image hoặc tạo SBOM cùng chứng thực nguồn gốc bằng công cụ/action đã ghim."
  owner: op-retry
  kind: check-finding

HFS_SCHEDULE_UNDECLARED:
  title: "A scheduled component has no declared CLI job"
  title_vi: "Component chạy theo lịch thiếu job CLI được khai báo"
  meaning_vi: "Component có lịch hoặc replicated-job trong mô hình chưa có entry jobs khớp với schedule và lệnh gọi action có tên của CLI ứng dụng."
  causes_vi:
    - "Vi phạm R268: lịch chỉ nằm trong cấu hình triển khai hoặc gọi lệnh ngoài quyền sở hữu CLI của ứng dụng."
  nextStep_vi: "Khai báo jobs.<id> với schedule, command của back end CLI và component khi cần; giữ lập lịch trong ứng dụng hoặc replicated-job được khai báo."
  owner: op-retry
  kind: check-finding

HFS_SCRIPT_PLAINTEXT_LOAD:
  title: "Executable scripts do not load plaintext credential files"
  title_vi: "Script đọc tệp bí mật dạng rõ"
  meaning_vi: "Script tại <path> đọc secrets.env, secret.env, .env bí mật hoặc tệp thông tin xác thực trong thư mục nhà; bộ kiểm chỉ báo đường dẫn và không đọc giá trị."
  causes_vi:
    - "Vi phạm R252: nạp bí mật từ tệp dạng rõ thay cho bí mật đã mã hoá và cơ chế materialize."
  nextStep_vi: "Bỏ cách nạp tệp rõ; dùng starci app secret materialize và cơ chế bí mật của stack, không in giá trị."
  owner: op-retry
  kind: check-finding

HFS_SCRIPT_XTRACE:
  title: "Scripts do not enable xtrace or reveal secrets"
  title_vi: "Script bật truy vết hoặc hiện bí mật"
  meaning_vi: "Script tại <path> bật set -x, xtrace hoặc yêu cầu --reveal, có thể đưa giá trị bí mật vào log."
  causes_vi:
    - "Vi phạm R252: bật truy vết shell hoặc yêu cầu hiển thị bí mật trong lệnh tự động."
  nextStep_vi: "Tắt xtrace và bỏ --reveal; chỉ ghi thông tin thao tác không chứa giá trị bí mật."
  owner: op-retry
  kind: check-finding

HFS_SECRET_OUTSIDE_ENC:
  title: "A sealed secret sits outside the sealed home"
  title_vi: "File `.enc` nằm ngoài thư mục custody duy nhất"
  meaning_vi: "`<path>` là file `.enc` ngoài `.starcistacks/<env>/secrets/`. Chỉ đúng một đường custody được chấp nhận cho envelope bí mật trong kho sản phẩm."
  causes_vi:
    - "Vi phạm luật R277: chỉ `.starcistacks/<env>/secrets/**.enc` được giữ envelope; `.enc` ở chỗ khác là custody sai (với lite lỗi này đã là HFS_LITE_SECRET_CUSTODY)."
  nextStep_vi: "Chuyển envelope về `.starcistacks/<env>/secrets/<slug>.enc` (hoặc niêm phong lại bằng `starci app secret set`) rồi gỡ bản `.enc` lạc chỗ khỏi index."
  owner: owner
  kind: check-finding

HFS_SECRET_PLAINTEXT_FILE:
  title: "A tracked plaintext secret file is refused"
  title_vi: "Tệp bí mật dạng rõ bị track trong kho"
  meaning_vi: "`<path>` là tệp bí mật dạng rõ được track (`secrets.env`, `*.env` không dấu chấm chứa khoá bí mật, hoặc tệp trong thư mục `secrets/`). Trong mọi edition bí mật chỉ được commit dưới dạng sops envelope tại `.starcistacks/<env>/secrets/**.enc`."
  causes_vi:
    - "Vi phạm luật R277: custody duy nhất cho secret được track là `.starcistacks/<env>/secrets/**.enc`; mọi file plaintext secret đều bị từ chối."
  nextStep_vi: "Không đọc và không in giá trị. Niêm phong giá trị bằng `starci app secret set` vào `.starcistacks/<env>/secrets/<slug>.enc` rồi gỡ tệp plaintext khỏi index; xoay secret nếu nó đã lộ."
  owner: owner
  kind: check-finding

HFS_SEED_PII:
  title: "Seed SQL contains no real email or phone literals"
  title_vi: "Seed SQL chứa dữ liệu định danh thật"
  meaning_vi: "File seed chứa literal có dạng email hoặc số điện thoại thật thay vì dữ liệu mẫu an toàn. Finding không hiển thị giá trị đó."
  causes_vi:
    - "Vi phạm R259: sao chép dữ liệu người dùng vào seed theo dõi trong repository."
  nextStep_vi: "Thay bằng địa chỉ @example.test và dữ liệu mẫu không định danh; không đưa dữ liệu người dùng thật vào seed."
  owner: op-retry
  kind: check-finding

HFS_SERVICE_PLACEMENT:
  title: "A back-end service lives only at be/apps/<service>"
  title_vi: "Dịch vụ back end nằm ngoài be/apps/<service>"
  meaning_vi: "Một thư mục có Dockerfile hoặc package.json riêng nằm ngoài `be/apps/<service>/` (và không phải Dockerfile của front end hay package workspace của `fe/packages`), nên nó trở thành một gốc dịch vụ thứ hai bên cạnh `be/` và `fe/`."
  causes_vi:
    - "Vi phạm luật R163: mỗi dịch vụ back end là một ứng dụng Nest tại `be/apps/<service>/` dùng chung thư viện `be/src` và một `package.json` duy nhất của app; image của nó được build từ `be/apps/<service>/Dockerfile`."
    - "Op đã tạo thư mục dịch vụ riêng (ví dụ `services/<name>/` hoặc `be/<name>/`) thay vì thêm ứng dụng dưới `be/apps/`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chuyển dịch vụ vào `be/apps/<service>/` (main.ts, app.module.ts, Dockerfile) và xoá thư mục cũ; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding


HFS_SERVICE_STACK_DECLARATION:
  title: "Each service app is a service component of the stack"
  title_vi: "Ứng dụng dịch vụ chưa được khai báo trong stack"
  meaning_vi: "Một ứng dụng api hoặc worker dưới `be/apps/<service>/` của sản phẩm nhiều dịch vụ không có thành phần `role: service` trong `.starcistacks/application-stacks.yaml`: không có thành phần cùng tên, và không có thành phần nào được `environments.<env>.deploy.images.<component>.app` gắn với ứng dụng đó."
  causes_vi:
    - "Vi phạm luật R165: mọi dịch vụ của sản phẩm nhiều dịch vụ là một thành phần `role: service` của stack (image riêng `<repo>/<service>:<x.y.z>`, build từ Dockerfile của app)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm thành phần cùng tên app (role service, image đã ghim, file compose và cổng của môi trường), hoặc gắn thành phần dịch vụ đang chạy với app qua `environments.<env>.deploy.images.<component>.app` thay vì đổi tên dịch vụ."
  owner: op-retry
  kind: check-finding

HFS_SIZE_GROWTH:
  title: "Source file over the size budget grew"
  title_vi: "Tệp mã nguồn vượt hạn mức dòng vẫn tiếp tục dài thêm"
  meaning_vi: "Một tệp mã nguồn đã dài hơn hạn mức mềm của ruleParams.fileLines nhưng lại dài thêm so với phiên bản gốc của nhánh, hoặc một tệp mới tạo đã vượt hạn mức ngay từ đầu. Tệp quá dài khó đọc, khó sửa và là nơi lỗi dễ ẩn; quy tắc này cho phép tệp cũ đang quá dài được giữ nguyên hoặc thu nhỏ dần, nhưng không cho phép nó phình thêm."
  causes_vi:
    - "Op thêm mã mới vào một tệp vốn đã quá hạn mức thay vì tách phần mới sang tệp khác"
    - "Một tệp đang dưới hạn mức được thêm mã cho đến khi vượt hạn mức"
    - "Một tệp mới tạo dài hơn hạn mức, hoặc một tệp bị di chuyển sang đường dẫn mới nên bị coi là tệp mới"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để tách phần mã mới (hoặc bớt phần cũ) sang tệp riêng đúng ô của nó, sao cho tệp không dài hơn phiên bản gốc và tệp mới nằm trong hạn mức."
  owner: op-retry
  kind: check-finding

HFS_SIZE_SOFT_BACKLOG:
  title: "Source file above the soft size"
  title_vi: "Tệp mã vượt cỡ mềm (chỉ báo cáo)"
  meaning_vi: "Tệp mã nguồn dài hơn ngưỡng mềm của ruleParams.fileLines.soft. Đây là danh mục việc cần tách dần, chỉ báo cáo và không bao giờ làm bộ kiểm tra thất bại."
  causes_vi:
    - "Tệp tích tụ qua nhiều lần sửa mà chưa được tách"
  nextStep_vi: "Không cần hành động ngay; khi sửa tệp này, tách theo trách nhiệm để không tăng thêm. Quy tắc tăng trưởng HFS_SIZE_GROWTH mới là chỗ chặn tệp vượt ngưỡng lớn thêm."
  owner: op-retry
  kind: check-finding

HFS_SLOT_AMBIGUOUS:
  title: "Path owned equally by two slots"
  title_vi: "Đường dẫn thuộc hai ô cùng mức cụ thể"
  meaning_vi: "Hai ô của bảng kê cùng khớp một đường dẫn với độ cụ thể bằng nhau nên không xác định được ô nào sở hữu. Đây là chỗ hở của bảng kê, không phải lỗi của kho."
  causes_vi:
    - "Hai mẫu đường dẫn trong bảng kê chồng lên nhau"
    - "Một ô mới thêm chưa loại phần trùng với ô cũ"
  nextStep_vi: "Người giám sát sửa bảng kê để mỗi đường dẫn chỉ có một ô sở hữu; kho không tự xử lý. Bộ kiểm tra chạy lại sau khi bảng kê được sửa."
  owner: op-retry
  kind: check-finding

HFS_SLOT_NOT_ENABLED:
  title: "Path in an opt-in slot the repository did not enable"
  title_vi: "Đường dẫn thuộc ô tuỳ chọn mà kho chưa bật"
  meaning_vi: "Tệp được theo dõi nằm trong một ô loại tuỳ chọn, nhưng hfs.json không liệt kê ô đó trong optionalSlots và không có ứng dụng nào thuộc loại tự bật ô đó."
  causes_vi:
    - "Kho dùng một loại nội dung tuỳ chọn (worker, websocket, tài liệu, gói dùng chung) mà chưa khai báo"
    - "Ứng dụng của loại tương ứng chưa được ghi vào apps của hfs.json"
  nextStep_vi: "Khai báo ô trong optionalSlots hoặc khai ứng dụng đúng loại ở hfs.json nếu nội dung này là thật; nếu không thì chuyển hoặc xoá tệp. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SLOT_REQUIRED_MISSING:
  title: "A slot is missing a required file (feature `index.ts`, app `main.ts`, FE `global-error.tsx`)"
  title_vi: "Ô thiếu tệp bắt buộc"
  meaning_vi: "Một ô bắt buộc (hoặc một thực thể của ô, như một ứng dụng hay một tính năng) đòi có tệp hoặc thư mục này nhưng nó không nằm trong những gì Git theo dõi."
  causes_vi:
    - "Vi phạm luật R02: slot bắt buộc thiếu tệp `requires` (vd feature thiếu `index.ts`, app thiếu `main.ts`, FE thiếu `global-error.tsx`)."
    - "Ứng dụng thiếu main.ts hoặc app.module.ts"
    - "Kho thiếu tệp gốc bắt buộc như README.md, hfs.json, .starciwork, .starcistacks"
  nextStep_vi: "Tạo tệp hoặc thư mục theo mẫu của ô rồi commit; tệp chưa git add vẫn tính là thiếu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SLOT_UNDECLARED:
  title: "Every tracked path matches exactly one slot"
  title_vi: "Đường dẫn không thuộc ô nào"
  meaning_vi: "Một tệp hoặc thư mục trong kho không thuộc ô nào trong bảng kê; mọi đường dẫn được theo dõi phải khớp đúng một ô. Bộ kiểm tra báo kèm ô gần nhất để biết tệp lẽ ra thuộc đâu."
  causes_vi:
    - "Vi phạm luật R01: mọi path được track phải khớp đúng một slot trong `knowledge/hfs/slots.yaml` (thay allowlist gốc)."
    - "Tệp đặt sai chỗ, ví dụ một tệp không phải *.e2e-spec.ts nằm trong thư mục kiểm thử e2e"
    - "Thư mục do kho tự đặt ở gốc hoặc trong src mà HFS không có ô cho nó"
    - "Tên tệp hoặc thư mục viết sai so với mẫu của ô gần nhất"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển tệp vào ô gần nhất được báo hoặc xoá nó; nếu thực sự cần một loại nội dung mới thì đó là việc thêm ô vào bảng kê, do người giám sát làm, không phải kho tự thêm."
  owner: op-retry
  kind: check-finding

HFS_SONAR_CONFIG:
  title: "Sonar config is generated, with no host URL, importing the be lcov with the logic of be/src/modules as the coverage scope"
  title_vi: "Cấu hình Sonar lệch"
  meaning_vi: "Cấu hình Sonar lệch: `<detail>`. Sonar phải đọc đúng cấu hình sinh ra và nhập báo cáo độ phủ lcov của be, chỉ tính phần logic của be/src/modules (phạm vi suy ra từ slot manifest)."
  causes_vi:
    - "Vi phạm luật R11: `sonar-project.properties` do template sinh: không `sonar.host.url`, `sources`/`tests` không chồng, `sonar.exclusions` = đúng danh sách loại trừ của jest, nhập lcov của be (`sonar.javascript.lcov.reportPaths=be/coverage/lcov.info`) với `sonar.coverage.exclusions` loại mọi tệp không phải service (SonarQube không có coverage inclusions; starci app sync sinh phần bù từ COVERAGE_SOURCES và bộ hậu tố của slot manifest, gồm cả fe/**) và không khóa độ phủ nào khác, không nhắc kiểu spec đã bỏ, và nhận báo cáo ESLint cùng tệp nhập lỗi HFS (`sonar.eslint.reportPaths`, `sonar.externalIssuesReportPaths`) để mọi lỗi canon hiện trong Sonar."
    - "Vi phạm luật R11: `sonar-project.properties` do template sinh: không `sonar.host.url`, `sources`/`tests` không chồng, `sonar.exclusions` = đúng danh sách loại trừ của jest, nhập lcov của be (`sonar.javascript.lcov.reportPaths=be/coverage/lcov.info`) với `sonar.coverage.exclusions` loại mọi tệp không bị đo (SonarQube không có coverage inclusions; starci app sync sinh phần bù từ trường coverage của slot và ruleParams.be.logicRoles qua scripts/hfs/coverage-scope.mjs, gồm cả fe/**; lệch dòng này là HFS_COVERAGE_SCOPE_DRIFT) và không khóa độ phủ nào khác, không nhắc kiểu spec đã bỏ, và nhận báo cáo ESLint cùng tệp nhập lỗi HFS (`sonar.eslint.reportPaths`, `sonar.externalIssuesReportPaths`) để mọi lỗi canon hiện trong Sonar."
    - "Khối `services.sonar.qualityGate` của khai báo stack phải gọi đúng cổng chất lượng duy nhất của `knowledge/sonar-gate.yaml`; repo không tự ghi ngưỡng."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SRC_LAYOUT_INVALID:
  title: "Backend src holds unexpected folders"
  title_vi: "Thư mục src của backend có mục lạ"
  meaning_vi: "Trong src của repo backend có thư mục nằm ngoài ba nơi cho phép là features, modules và tests, hoặc trong src/tests có thư mục ngoài các slot be.tests.* (world, fixtures, integration, e2e, contract)."
  causes_vi:
    - "Worker tạo thư mục mới ngay dưới src"
    - "Mã cũ chưa được dời về đúng feature hoặc module"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải dời thư mục đó về nơi sở hữu nó rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_STACKS_IN_SIDE:
  title: "Stack declarations under a side (be/ or fe/) instead of the app root"
  title_vi: "Khai báo stack nằm trong một phía (be/ hoặc fe/) thay vì ở gốc app"
  meaning_vi: "Một phía của app (be/ hoặc fe/) đang chứa thư mục .starcistacks, trong khi .starcistacks chỉ được đặt ở gốc app, cạnh be/, fe/ và .starciwork."
  causes_vi:
    - "Còn giữ bố cục cũ be/.starcistacks từ trước khi chuyển về gốc app"
    - "Worker tạo stack trong một phía thay vì ở gốc app"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải dời thư mục bằng git mv về .starcistacks ở gốc app và sửa mọi đường dẫn trỏ tới nó."
  owner: op-retry
  kind: check-finding

HFS_STACKS_SHAPE:
  title: "`.starcistacks` violates the edition layout or Docker deployment requirements"
  title_vi: "Hình dạng hoặc runtime .starcistacks sai"
  meaning_vi: "Cây .starcistacks không khớp slot app.starcistacks, hoặc khai báo và mô hình Docker không nhất quán. Mọi dependency trong dev phải có container Docker Linux; Supabase dùng CLI cục bộ. Trong production, app và dependency dùng Swarm, trừ Supabase là dịch vụ hosted. Chỉ Supabase được khai trong backing; dependency khác phải là component Docker."
  causes_vi:
    - "Vi phạm R10 về cây theo edition, Sonar thuộc host hoặc runtime Swarm."
    - "Dependency đã chọn thiếu container trong mô hình, khai platform Windows hoặc dùng backing hosted khác Supabase (owner:dev-docker-prod-swarm)."
  nextStep_vi: "Sửa cây theo slot app.starcistacks và khai dependency dưới components với bằng chứng Docker Linux; giữ Supabase CLI trong dev và hosted trong production. App có thể chạy native trong profile dev đã khai báo; dependency vẫn nằm trong Docker. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_STARCIWORK_LITE_FORBIDDEN:
  title: "lite .starciwork holds only workspace.yaml and brand/"
  title_vi: "Work của lite"
  meaning_vi: "Trong ứng dụng edition lite, .starciwork chỉ được giữ workspace.yaml, .gitignore và brand/** (bản ghi bản vẽ, tham chiếu và tài sản thương hiệu). Cây này không bắt buộc khi ứng dụng chưa có bản ghi thương hiệu."
  causes_vi:
    - "Ứng dụng lite còn index.yaml, shell/, features/, _resources/, uat hoặc br trong .starciwork"
    - "Có tệp khác nằm ngoài workspace.yaml, brand/ và .gitignore trong Work của lite"
  nextStep_vi: "Giữ nguyên workspace.yaml, brand/** và .gitignore, chuyển nội dung khác ra khỏi .starciwork (lite không lên full được: khi cần các bản ghi đó, dựng một ứng dụng full mới), rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_TEXT_CORRUPT:
  title: "A Vietnamese message catalog lost its diacritics"
  title_vi: "Danh mục thông điệp tiếng Việt bị mất dấu"
  meaning_vi: "Một tệp thông điệp (messages.ts hoặc vi.json) không phải UTF-8 hợp lệ, hoặc chuỗi tiếng Việt có dấu hỏi chấm hay ký tự thay thế U+FFFD ở chỗ lẽ ra là chữ có dấu."
  causes_vi:
    - "Tệp được ghi lại qua một đường ống hoặc lệnh shell không giữ UTF-8."
    - "Biên tập bằng công cụ chuyển mã làm mất chữ có dấu."
  nextStep_vi: "Viết lại chuỗi tiếng Việt bằng trình soạn thảo hoặc Node theo UTF-8 tại đường dẫn và dòng được báo; không dùng đường ống shell."
  owner: op-retry
  kind: check-finding

HFS_TOOL_CONFIG_LOCAL:
  title: "Configs only call the factories; no local rules"
  title_vi: "Kho tự đặt luật cục bộ"
  meaning_vi: "Repo có cấu hình công cụ cục bộ ở `<file>`: tệp cấu hình ngoài bộ được quản lý (`.eslintrc*`, `.eslintignore`, `eslint.config.*` hay `stylelint.config.*` thứ hai, cấu hình prettier/lint-staged khác), tệp tự định nghĩa luật ESLint hoặc plugin stylelint, khóa cấu hình công cụ trong `package.json` (`eslintConfig`, `stylelint`, `prettier`, `lint-staged` hoặc khóa Jest), hoặc lệnh chạy eslint/stylelint/prettier với cờ đổi cấu hình (`--rule`, `--no-inline-config`, `--no-eslintrc`, `--config`, `--ignore-pattern`). Luật chung nằm trong `.claude`; đề xuất thay đổi ở đó."
  causes_vi:
    - "Vi phạm luật R16: Cấu hình của repo chỉ gọi factory của `.claude`; cấm tệp cấu hình công cụ khác, tệp luật cục bộ (vd một tệp eslint-local trong thư mục scripts) và cờ dòng lệnh đổi hoặc tắt cấu hình trong hook, workflow, script."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_TRACKED_MUST_BE_IGNORED:
  title: "Tracked path that must be gitignored"
  title_vi: "Tệp bị theo dõi nhưng lẽ ra phải bị bỏ qua"
  meaning_vi: "Tệp nằm trong một ô loại ignored (kết quả build, tệp sinh tự động, phụ thuộc) nhưng đã được đưa vào Git."
  causes_vi:
    - "Thư mục dist, coverage, .next hoặc tệp sinh tự động bị git add"
    - ".gitignore thiếu dòng cho thư mục này"
  nextStep_vi: "Gỡ tệp khỏi Git bằng git rm --cached và thêm vào khối .gitignore chuẩn; không xoá thư mục trên đĩa. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_TS_STRICT:
  title: "tsconfig extends `@starci/tsconfig` and lowers no flag"
  title_vi: "tsconfig hạ cờ strict"
  meaning_vi: "`tsconfig.json` đặt hoặc hạ cờ `<flag>`. `tsconfig.json` chỉ extends `@starci/tsconfig/be.json` và khai báo `paths` của ba alias; mọi cờ do preset quy định."
  causes_vi:
    - "Vi phạm luật R22: `tsconfig.json` chỉ có `extends` và `paths`; các cờ `strict`, `noUncheckedIndexedAccess`, `noImplicitOverride`, `noImplicitReturns`, `noFallthroughCasesInSwitch`, `noUnusedLocals`, `noUnusedParameters`, `allowJs: false` nằm trong preset và repo không đặt, không hạ cờ nào."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_UNTRACKED_ROOT_ENTRY:
  title: "No untracked or ignored entry outside an `ignored` slot"
  title_vi: "Mục lạ ở gốc kho"
  meaning_vi: "Có mục chưa được git theo dõi, cũng không nằm trong `.gitignore` hay slot `ignored`, nên HFS không cho phép nó tồn tại trong cây làm việc. Theo dõi nó vào đúng slot, hoặc lưu trữ ra `<archive root>/` rồi xóa."
  causes_vi:
    - "Vi phạm luật R03: Thư mục làm việc không được có mục untracked/ignored ngoài slot `ignored` (vd `nul`, `.worktrees/`, `design-plans/`, `express`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_UNUSED_EXPORT:
  title: "Public export that nothing outside the module uses"
  title_vi: "Tên xuất công khai mà không nơi nào bên ngoài dùng"
  meaning_vi: "Cửa vào công khai (index.ts) của một module, tính năng hoặc gói đang xuất ra một tên mà không tệp sản xuất nào nằm ngoài module đó import. Tệp kiểm thử không được tính là nơi dùng. Tên thừa ở cửa vào làm bề mặt công khai phình to, khiến người sau tưởng có thể dựa vào nó và làm việc thay đổi module khó hơn."
  causes_vi:
    - "Xuất thêm kiểu, hằng số hoặc hàm 'phòng khi cần' nhưng chưa có nơi nào dùng"
    - "Nơi từng dùng tên này đã bị xoá hoặc chuyển vào cùng module, còn dòng xuất ở cửa vào bị bỏ sót"
    - "Tên chỉ được dùng trong tệp kiểm thử, nên với bộ kiểm tra nó vẫn là thừa"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để xoá tên khỏi cửa vào (hoặc bỏ luôn phần khai báo nếu không còn ai dùng); nếu tên thực sự cần cho một nơi ngoài module thì nơi đó phải import nó qua cửa vào."
  owner: op-retry
  kind: check-finding

HFS_UNUSED_FILE:
  title: "Production file that nothing reaches"
  title_vi: "Tệp mã sản xuất không ai chạm tới"
  meaning_vi: "Một tệp mã sản xuất không được nối tới từ bất kỳ gốc nào: không phải main.ts hay app.module.ts của một ứng dụng, không phải tệp route, không phải cửa vào của một gói, và không tệp sản xuất nào import nó (kể cả import chỉ kiểu). Tệp kiểm thử không được tính; tệp chỉ có spec dùng vẫn là chết. Không tiến trình nào chạy tệp này."
  causes_vi:
    - "Nơi từng import tệp đã bị xoá hoặc chuyển đi, còn tệp bị bỏ sót"
    - "Tệp được thêm nhưng chưa nối vào module hay cửa vào nào"
    - "Tệp chỉ được spec dùng"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để xoá tệp, hoặc nối nó vào nơi thật sự dùng; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_UNUSED_SYMBOL:
  title: "An enum member, queue constant, error code or catalog key has no production consumer"
  title_vi: "Ký hiệu không có nơi dùng trong mã chạy thực tế"
  meaning_vi: "Thành viên enum, hằng hàng đợi, mã lỗi hoặc khóa danh mục được khai báo nhưng không được mã chạy thực tế sử dụng; bảng mô tả lỗi và tham chiếu chỉ trong kiểm thử không đủ."
  causes_vi:
    - "Ký hiệu còn sót lại sau khi xóa hoặc đổi luồng nghiệp vụ."
    - "Import namespace hoặc bảng ánh xạ che mất ký hiệu không còn dùng."
  nextStep_vi: "Xóa ký hiệu và ánh xạ thừa, hoặc nối nó vào luồng chạy thực tế nếu nghiệp vụ vẫn cần."
  owner: op-retry
  kind: check-finding

HFS_WORKFLOW_CONTEXT:
  title: "Workflow expressions use contexts available at their key"
  title_vi: "Biểu thức workflow dùng ngữ cảnh không được phép"
  meaning_vi: "Biểu thức tại file:line và đường dẫn khóa dùng ngữ cảnh chưa có tại khóa đó."
  causes_vi:
    - "Vi phạm R299: env cấp job đọc runner, job, steps hoặc env trước khi ngữ cảnh sẵn sàng."
  nextStep_vi: "Chuyển env phụ thuộc runner vào env của bước sử dụng, hoặc dùng RUNNER_TEMP trong shell; kiểm tra file:line và đường dẫn khóa được báo."
  owner: op-retry
  kind: check-finding

HFS_WORKFLOW_PIN:
  title: "Remote workflow actions use immutable commit SHAs"
  title_vi: "Action của workflow chưa được ghim SHA"
  meaning_vi: "Workflow tại <path> dùng action từ xa với tag hoặc nhánh thay cho commit SHA gồm 40 ký tự hex."
  causes_vi:
    - "Vi phạm R251: action có thể đổi nội dung khi tag hoặc nhánh thay đổi."
  nextStep_vi: "Ghim uses của action từ xa bằng commit SHA gồm 40 ký tự hex; action cục bộ vẫn dùng đường dẫn trong kho."
  owner: op-retry
  kind: check-finding

HFS_WORK_IN_FE:
  title: "Work tree inside the front end (fe/)"
  title_vi: "Hồ sơ Work nằm trong repo giao diện"
  meaning_vi: "Repo giao diện chứa thư mục .starciwork, trong khi hồ sơ Work chỉ được lưu ở repo backend."
  causes_vi:
    - "Tạo hồ sơ Work nhầm repo"
    - "Sao chép nguyên cây Work sang repo giao diện"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải chuyển hồ sơ sang repo backend rồi chạy lại."
  owner: op-retry
  kind: check-finding

RELEASE_NOTES:
  title: "Release tag without finished release notes"
  title_vi: "Tag phát hành chưa có ghi chú phát hành hoàn chỉnh"
  meaning_vi: "HEAD mang tag phát hành v<phiên bản> nhưng CHANGELOG.md không có mục ## [<phiên bản>], hoặc mục đó còn TODO, PENDING, TBD hay dấu in preparation. Thông điệp của tag và GitHub Release chính là mục này nên không được cắt tag khi nó chưa xong."
  causes_vi:
    - "Tạo tag trước khi viết xong mục CHANGELOG"
    - "Còn sót dấu PENDING hoặc TBD của lane chưa land"
  nextStep_vi: "Người giám sát hoàn tất mục CHANGELOG của phiên bản (xóa mọi dấu TODO, PENDING, TBD), commit rồi mới tạo lại tag chú thích trên commit phát hành; không dời hay xóa tag đã đẩy."
  owner: supervisor
  kind: check-finding

RIGHTS_GIT_COMMIT:
  title: "Raw git commit write refused"
  title_vi: "Từ chối ghi commit git trực tiếp"
  meaning_vi: "Agent đã gọi trực tiếp git commit, add, rm hoặc mv, nhưng mọi thay đổi lịch sử và vùng staged phải đi qua động từ runtime để quyền, bằng chứng và bước settle được giữ nhất quán."
  causes_vi:
    - "Agent tự stage hoặc commit thay vì để runtime tạo commit của phần việc đã qua cổng"
    - "Agent dùng git rm hoặc git mv trực tiếp cho một thay đổi trong cây làm việc"
  nextStep_vi: "Lệnh bị từ chối; dùng starci git commit, hoặc để nguyên thay đổi và báo cáo để runtime commit phần việc đã qua cổng khi settle."
  owner: op-retry
  kind: verb-refusal

RIGHTS_GIT_PUSH:
  title: "Git push refused by role rights"
  title_vi: "Quyền theo vai trò từ chối git push"
  meaning_vi: "Worker, lead, Supervisor hoặc coordinator không được đẩy remote theo ý mình: remote chỉ di chuyển một lần trong mỗi bản phát hành, khi main và thẻ phát hành được đẩy cùng nhau; coordinator hoặc Supervisor chỉ được đẩy bản sao lưu bằng refspec tường minh vào refs/backup/*."
  causes_vi:
    - "Agent định đẩy main, một nhánh thường, mọi thẻ hoặc một refspec quá rộng"
    - "Coordinator hoặc Supervisor đẩy bản sao lưu nhưng đích không nằm trong refs/backup/* hoặc không có refspec tường minh"
  nextStep_vi: "Lệnh bị từ chối; để thay đổi đi qua starci release push, hoặc nếu là coordinator hay Supervisor thì dùng starci git backup với đích refs/backup/* tường minh."
  owner: op-retry
  kind: verb-refusal

RIGHTS_GIT_SYNC:
  title: "Raw git synchronization write refused"
  title_vi: "Từ chối lệnh git đồng bộ trực tiếp"
  meaning_vi: "Agent đã gọi một lệnh git ghi lịch sử, ref, cấu hình hoặc cây làm việc ngoài commit, push và tag; các thao tác merge, rebase, pull, fetch, checkout, switch, reset, restore, clean, stash, worktree, branch và tương tự chỉ do runtime điều phối."
  causes_vi:
    - "Agent tự merge hoặc rebase main vào lane"
    - "Agent tự đổi nhánh, reset, restore, clean, stash, sửa ref, cấu hình hoặc worktree"
  nextStep_vi: "Lệnh bị từ chối; dùng starci git sync để cập nhật lane hoặc starci git land khi coordinator đưa thay đổi vào main."
  owner: op-retry
  kind: verb-refusal

RIGHTS_GIT_TAG:
  title: "Git tag write refused"
  title_vi: "Từ chối ghi thẻ git"
  meaning_vi: "Thẻ là dấu của một bản phát hành nên chỉ release cut được tạo thẻ; agent không được tạo, di chuyển hoặc xóa thẻ, và dấu giữ chỗ không phải thẻ."
  causes_vi:
    - "Agent định tạo hoặc ký một thẻ phát hành"
    - "Agent định di chuyển, ép ghi hoặc xóa thẻ, hoặc dùng thẻ làm dấu giữ chỗ"
  nextStep_vi: "Lệnh bị từ chối; dùng starci release cut cho thẻ phát hành, còn dấu giữ chỗ dùng refs/backup/* hoặc refs/salvage/*."
  owner: op-retry
  kind: verb-refusal

RIGHTS_NPM_CI_UNLOCKED:
  title: "Unlocked clean install refused"
  title_vi: "Từ chối cài sạch khi chưa giữ khóa máy"
  meaning_vi: "npm ci xóa và dựng lại node_modules nên là một lần chạy nặng; lệnh chỉ được chạy sau khi runtime đã lấy host lock cho đúng tác vụ."
  causes_vi:
    - "Agent gọi npm ci hoặc một biến thể clean install mà không có host lock"
    - "Host lock đang do terminal khác giữ hoặc chủ khóa đã stale"
  nextStep_vi: "Lệnh bị từ chối; dùng động từ starci của cổng hoặc đồng bộ ứng dụng để runtime lấy host lock rồi cài phụ thuộc, không chạy npm ci bằng tay."
  owner: op-retry
  kind: verb-refusal

RIGHTS_NPM_PUBLISH:
  title: "Package publish refused"
  title_vi: "Từ chối phát hành package"
  meaning_vi: "Package chỉ được publish một lần trong mỗi bản phát hành và từ release commit, nên agent ở lane không được publish, unpublish, deprecate hoặc đổi dist-tag."
  causes_vi:
    - "Agent gọi npm, pnpm hoặc yarn publish"
    - "Agent định unpublish, deprecate hoặc sửa dist-tag ngoài release cut"
  nextStep_vi: "Lệnh bị từ chối; hoàn tất lane và để chủ chạy starci release cut từ release commit."
  owner: op-retry
  kind: verb-refusal

RIGHTS_OP_RUNTIME_WRITE:
  title: "Op runtime write refused"
  title_vi: "Từ chối op ghi vào runtime"
  meaning_vi: "Op chỉ sửa ứng dụng trong worktree của workflow và không được ghi vào checkout .claude của runtime; lỗi của harness phải đi qua đường nâng cấp runtime."
  causes_vi:
    - "Op định sửa mã, cấu hình hoặc tri thức bên trong checkout .claude"
    - "Op phát hiện lỗi harness rồi cố sửa ngay trong phần việc của ứng dụng"
  nextStep_vi: "Lệnh bị từ chối; ghi lesson hoặc upgrade request trong báo cáo để đường owner hoặc supervisor self-upgrade xử lý."
  owner: op-retry
  kind: verb-refusal

RIGHTS_PROTECTED_ZONE:
  title: "Protected-zone write refused"
  title_vi: "Từ chối ghi vào vùng được bảo vệ"
  meaning_vi: "Supervisor self-upgrade đã định sửa vùng được bảo vệ của runtime, nơi chỉ đường owner được thay đổi guard và quyền vai trò, release cut và git hook, trigger CI, chính sách test, host lock, rule catalog liên quan hoặc cài đặt quyền và model."
  causes_vi:
    - "Một self-upgrade sửa trực tiếp tệp nằm trong vùng được khai báo ở modules/kernel/protected-zone.yaml"
    - "Một self-upgrade sửa mục rule hoặc failure code bảo vệ vùng đó"
  nextStep_vi: "Lệnh bị từ chối; Supervisor nộp đề xuất cho owner, nêu thay đổi cần làm và lý do, để đường owner thực hiện."
  owner: supervisor
  kind: verb-refusal

RIGHTS_PUSH_NOT_RELEASE:
  title: "Pre-push gate refused the push"
  title_vi: "Cổng pre-push từ chối lần đẩy"
  meaning_vi: "Hook pre-push đã chặn một lần đẩy main hoặc thẻ v* của runtime hoặc app: main không phải fast-forward hoặc vùng đẩy có ứng viên bí mật; thẻ v* không phải thẻ annotated."
  causes_vi:
    - "Thao tác xóa main hoặc xóa thẻ phát hành"
    - "Đẩy main không phải fast-forward của main trên remote (force push, rewind hoặc nhánh rẽ)"
    - "Vùng đẩy chứa ứng viên bí mật (tên tệp, dòng và mẫu, không bao giờ giá trị)"
    - "Đẩy thẻ v* không phải thẻ annotated"
  nextStep_vi: "Gỡ hoặc mã hóa ứng viên bí mật, fetch main rồi đẩy lại bằng starci release push; thẻ thì tạo bằng starci release cut --tag v<version> (thêm --plan để xem trước)."
  owner: supervisor
  kind: verb-refusal

RIGHTS_RAW_TOOL:
  title: "Raw side-effecting tool refused"
  title_vi: "Từ chối công cụ thô có tác động phụ"
  meaning_vi: "Agent đã gọi trực tiếp một công cụ có tác động phụ trong khi runtime có động từ starci sở hữu thao tác đó; chính sách chỉ cho phép các lệnh chỉ đọc được khai báo một lần trong modules/kernel/command-policy.yaml."
  causes_vi:
    - "Agent gọi npm run, npm test, npm install, node scripts, docker, supabase, gh, schtasks, shutdown, một test runner hoặc Orca mutation trực tiếp"
    - "Agent gọi một chương trình chưa được khai báo trong bảng chính sách lệnh"
  nextStep_vi: "Lệnh bị từ chối; dùng đúng starci <nhóm> <động từ> mà lời từ chối nêu, hoặc nhờ owner khi không có động từ được phép."
  owner: op-retry
  kind: verb-refusal

RIGHTS_RELEASE_CUT:
  title: "Release cut refused"
  title_vi: "Từ chối cắt bản phát hành"
  meaning_vi: "Release cut gắn thẻ bản phát hành cho một commit đã đẩy và publish gói là quyết định phát hành của owner; worker, lead, Supervisor và coordinator không được tự khởi động chúng."
  causes_vi:
    - "Agent gọi starci release cut hoặc đường script tương đương"
    - "Agent định publish bản phát hành mà chưa có phê duyệt của owner"
  nextStep_vi: "Lệnh bị từ chối; đẩy main bằng starci release push, và báo để owner phê duyệt starci release cut hoặc publish."
  owner: op-retry
  kind: verb-refusal

RIGHTS_ROLE_DENIED:
  title: "Action denied by role rights"
  title_vi: "Quyền theo vai trò từ chối thao tác"
  meaning_vi: "Command guard đã từ chối một thao tác vì vai trò của caller không sở hữu tác động đó; modules/kernel/command-policy.yaml là bảng chính sách duy nhất mà PreToolUse guard và PATH shim cùng đọc."
  causes_vi:
    - "Agent gọi một lệnh ghi hoặc công cụ có tác động phụ ngoài quyền của vai trò"
    - "Agent bỏ qua động từ starci sở hữu thao tác"
  nextStep_vi: "Không chạy đường thô; dùng động từ starci được lời từ chối nêu hoặc báo lại cho vai trò sở hữu thao tác."
  owner: op-retry
  kind: verb-refusal

RIGHTS_SUITE_RUN:
  title: "Whole-suite run refused"
  title_vi: "Từ chối chạy toàn bộ bộ kiểm thử"
  meaning_vi: "Toàn bộ suite chỉ chạy một lần trong mỗi release hoặc theo yêu cầu trong unit.verify hay e2e.verify; một worker chỉ chạy tệp spec vừa thay đổi hoặc để op gate chọn phạm vi."
  causes_vi:
    - "Agent gọi npm test, một script test toàn bộ hoặc node --test trên cả cây tests"
    - "Agent chạy suite ngoài CI và ngoài op verify được yêu cầu"
  nextStep_vi: "Lệnh bị từ chối; chạy riêng tệp spec đã thay đổi, để op gate chọn spec liên quan, hoặc dùng unit.verify/e2e.verify khi owner hay mục tiêu yêu cầu."
  owner: op-retry
  kind: verb-refusal

RT_ABSOLUTE_PATH:
  title: "Hard-coded absolute host path"
  title_vi: "Đường dẫn tuyệt đối của máy bị ghi cứng"
  meaning_vi: "Một tệp được git theo dõi của runtime chứa đường dẫn tuyệt đối của máy chủ: đường dẫn có ổ đĩa (chữ cái ổ đĩa, dấu hai chấm và dấu gạch), đường dẫn hồ sơ người dùng (/Users/<tên>/, /home/<tên>/) hoặc đường dẫn AppData đã khai triển. Kho .claude dùng đường dẫn tương đối; đường dẫn ghi cứng chỉ chạy trên một máy và làm lộ tên người dùng."
  causes_vi:
    - "Một lane ghi đường dẫn máy của nó vào mã, tài liệu, tri thức, ví dụ hoặc dữ liệu thử"
    - "Một spec dựng fixture từ ổ đĩa ghi cứng thay vì thư mục tạm của nó"
  nextStep_vi: "Người giám sát đổi đường dẫn thành đường dẫn tương đối hoặc tên giữ chỗ (<runtime>/..., %LOCALAPPDATA% chưa khai triển), cho mã lấy đường dẫn từ gốc runtime, os.tmpdir(), cấu hình hoặc hàm gốc trạng thái, và cho spec dựng fixture từ thư mục tạm."
  owner: supervisor
  kind: check-finding

RT_API_SHAPE:
  title: "api folder breaks its shape"
  title_vi: "Thư mục api sai hình dạng"
  meaning_vi: "Một tệp lệnh trong scripts/api/<hệ thống>/ export nhiều hơn một hàm hoặc không export hàm mang tên của tệp, một tệp bên ngoài hệ thống import lib.mjs của hệ thống đó, một hệ thống api import hệ thống khác, hoặc một tệp lệnh không phải là id trong hợp đồng calls của hệ thống."
  causes_vi:
    - "Thêm hằng số hay hàm phụ vào một tệp lệnh"
    - "Gọi thẳng trình chạy lib.mjs thay vì tệp lệnh"
  nextStep_vi: "Người giám sát tách mỗi lệnh thành một tệp riêng mang tên lệnh, chuyển hằng dùng chung vào lib.mjs của hệ thống và để nơi gọi dùng tệp lệnh."
  owner: supervisor
  kind: check-finding

RT_BASE_IMPURE:
  title: "Base tier writes or reads the environment"
  title_vi: "Tầng cơ sở ghi tệp hoặc đọc biến môi trường"
  meaning_vi: "Một tệp của tầng cơ sở (engine nền tảng, scripts/lib) gọi một hàm ghi của node:fs (writeFileSync, rmSync, mkdirSync...) hoặc đọc process.env ngoài các điểm khai báo trong ruleParams.runtime.baseEnvSeams. Tầng cơ sở chỉ chứa hàm thuần."
  causes_vi:
    - "Một hàm tiện ích tự ghi tệp thay vì trả dữ liệu cho nơi gọi"
    - "Đọc cấu hình từ biến môi trường bên trong thư viện"
  nextStep_vi: "Người giám sát chuyển thao tác ghi vào chủ sở hữu của nó (scripts/api/fs, engine/db hoặc một module nghiệp vụ) và truyền giá trị môi trường vào dưới dạng tham số."
  owner: supervisor
  kind: check-finding

RT_CITED_PATH_MISSING:
  title: "Cited runtime path does not exist"
  title_vi: "Đường dẫn được trích dẫn không tồn tại"
  meaning_vi: "Văn bản đang dùng (modules ngoài lịch sử hợp đồng, docs, skills, knowledge, CONTEXT.md, README.md, CONTRIBUTING.md, init, tài liệu ui) trích dẫn một đường dẫn runtime không tồn tại."
  causes_vi:
    - "Di chuyển hay xóa tệp mà không cập nhật tài liệu"
    - "Gõ sai đường dẫn trong tài liệu"
  nextStep_vi: "Người giám sát sửa trích dẫn thành đường dẫn hiện tại hoặc xóa câu đó."
  owner: supervisor
  kind: check-finding

RT_CLI_APP_ONLY_TEMPLATES:
  title: "Managed app template invokes the wrong CLI"
  title_vi: "Template ứng dụng gọi sai bề mặt CLI"
  meaning_vi: "Template do StarCi quản lý hoặc bản sao runtime đã sinh gọi lệnh hfs cũ, test-stack cũ, hoặc một nhóm starci không phải app; repository sản phẩm chỉ được gọi starci app <verb>."
  causes_vi:
    - "Vi phạm luật R200: mọi hành động sản phẩm trong template phải đi qua CLI thống nhất starci app."
  nextStep_vi: "Đổi lời gọi thành starci app <verb>, sinh lại các bản sao runtime và chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

RT_CLI_CATALOG_DRIFT:
  title: "Generated CLI catalog outputs drifted"
  title_vi: "Các đầu ra catalog CLI sinh tự động bị lệch"
  meaning_vi: "Một đầu ra sinh từ catalog của modules/cli/commands (packages/cli/src/catalog.generated.mjs, docs/cli.md, packages/cli/completions/*) khác với nội dung mà scripts/cli/gen-catalog.mjs sinh ra: thiếu, cũ, hoặc đã sửa tay."
  causes_vi:
    - "Sửa một file catalog trong modules/cli/commands mà quên chạy gen-catalog --write"
    - "Sửa tay một đầu ra sinh tự động thay vì sửa catalog nguồn"
  nextStep_vi: "Người giám sát chạy starci runtime gen-catalog --write rồi commit cả catalog lẫn các đầu ra; không sửa tay tệp đã sinh."
  owner: supervisor
  kind: check-finding

RT_CLI_VERB_PARITY:
  title: "CLI catalog and implementation disagree"
  title_vi: "Catalog CLI và cài đặt không khớp nhau"
  meaning_vi: "Catalog của modules/cli/commands và code lệch nhau: một verb của catalog không có handler (impl.script thiếu, không có verbs/<verb>.mjs, không có case trong cli.mjs) hoặc không có tài liệu; một verb module của kernel hoặc một case của cli.mjs không có file catalog; một --flag trong usage:/required của module verb hay trong api-boolean-flags.txt không nằm trong flags của catalog."
  causes_vi:
    - "Thêm một verb module trong scripts/kernel/verbs mà quên file modules/cli/commands/kernel/<verb>.yaml"
    - "Đổi usage hoặc required của một verb mà không cập nhật flags của catalog"
  nextStep_vi: "Người giám sát đồng bộ hai phía: thêm file catalog cho verb mới, sửa flags của catalog theo usage/required, hoặc xóa verb khỏi catalog khi handler đã bị xóa."
  owner: supervisor
  kind: check-finding

RT_CONFIG_DEFAULT_TWICE:
  title: "A documented default is restated outside its owner"
  title_vi: "Một giá trị mặc định được khai báo lại ngoài tệp chủ"
  meaning_vi: "Mỗi mặc định của cấu hình được viết một lần trong tệp chủ của nó: các leaf camelCase hay khóa lowercase của config.example.yaml, và các mặc định mà chủ sở hữu khai báo (DEFAULTS của scripts/machine/home.mjs cho supervisor và ngôn ngữ owner, engine/config.mjs cho connector/ask/UAT/spec/allocation, engine/orca-config.mjs cho độ sâu worker, scripts/reconciler/state.mjs cho mode của controller). Một literal fallback (??, ||, mặc định tham số, hay ternary kiểu language === 'en' ? 'en' : 'vi') ở tệp khác là bản chép lại; phía đọc gọi accessor của chủ (supervisorSettings(), configuredMode(), ownerLanguage()). Spec, test, runtime sinh ra, story và template HFS nằm ngoài luật."
  causes_vi:
    - "Viết ?? <literal> hay || <literal> cho một khóa đã có trong config.example.yaml thay vì gọi accessor"
    - "Khai báo tham số mặc định bằng literal giá trị mà chủ sở hữu đã định"
  nextStep_vi: "Người giám sát thay literal bằng accessor của chủ sở hữu (import DEFAULTS/supervisorSettings/ownerLanguage...) hoặc chuyển mặc định về tệp chủ rồi đọc qua nó."
  owner: supervisor
  kind: check-finding

