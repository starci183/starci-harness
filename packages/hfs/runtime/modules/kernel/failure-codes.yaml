  nextStep_vi: "Khai báo thư viện còn thiếu trong workspace sản phẩm; đặt công cụ codegen, lint, TypeScript và Tailwind tại gốc nếu dùng chung."
  owner: op-retry
  kind: check-finding

FE_STACK_FAMILY_LINT_MISSING:
  title: "The front end installs canon-fe 9 without the selected Grammar family's lint package"
  title_vi: "Front end dùng canon-fe 9 nhưng thiếu gói lint của họ Grammar đã chọn"
  meaning_vi: "hfs.json chọn sides.fe.grammar (starci hoặc offset-pop) và front end khai báo @starci/eslint-canon-fe 9 trở lên, nhưng không manifest nào khai báo gói lint của họ đó; từ canon-fe 9 các luật component Grammar nằm trong gói này, thiếu gói thì các luật ấy không chạy."
  causes_vi:
    - "Nâng @starci/eslint-canon-fe lên 9 mà chưa thêm @starci/eslint-grammar-core (Grammar StarCi) hoặc @starci/eslint-grammar-offset-pop (Grammar Offset Pop)."
  nextStep_vi: "Thêm @starci/eslint-grammar-core (hoặc @starci/eslint-grammar-offset-pop) cạnh @starci/eslint-canon-fe, ghép coreGrammarConfig({ hfs }) (hoặc offsetPopGrammarConfig({ hfs })) sau starciFeConfig({ hfs }) trong fe/eslint.config.mjs, hoặc chạy starci app sync."
  owner: op-retry
  kind: check-finding

FE_STACK_FORBIDDEN:
  title: "A front end declares or imports a package or scoped package family forbidden by the stack"
  title_vi: "Front end dùng thư viện hoặc họ package bị fe-stack cấm"
  meaning_vi: "`<path>` khai báo hoặc import `<package>` thuộc `forbids` của concern `<concern>` trong knowledge/hfs/fe-stack.yaml; danh sách có thể cấm cả họ package theo scope."
  causes_vi:
    - "Vi phạm R244: app dùng thư viện thay thế hoặc tự import phụ thuộc do Grammar sở hữu, như @dicebear/*."
  nextStep_vi: "Gỡ dependency và import bị cấm, dùng thư viện chuẩn của concern. Với @dicebear/*, truyền id định danh qua prop seed trên Grammar Avatar, AvatarButton hoặc từng thành viên AvatarGroup; Grammar giữ các dependency DiceBear và vẽ avatar."
  owner: op-retry
  kind: check-finding

FE_STACK_UNLISTED:
  title: "A direct front-end dependency is absent from the stack catalog"
  title_vi: "Phụ thuộc trực tiếp của front end chưa có trong danh mục"
  meaning_vi: "Manifest của workspace front end khai báo trực tiếp thư viện không có trong knowledge/hfs/fe-stack.yaml và không có fe.extraPackages kèm lý do trong hfs.json. Phụ thuộc runtime được package Grammar đã có trong danh mục mang theo không phải khai báo của app và không gây mã lỗi này."
  causes_vi:
    - "Thêm phụ thuộc trực tiếp ngoài danh mục mà chưa ghi rõ tên và lý do sử dụng."
  nextStep_vi: "Dùng thư viện chuẩn hoặc khai báo tên và lý do trong fe.extraPackages. Dependency bị cấm vẫn gây FE_STACK_FORBIDDEN; với @dicebear/*, dùng prop seed trên Grammar Avatar, AvatarButton hoặc thành viên AvatarGroup và gỡ dependency trực tiếp."
  owner: op-retry
  kind: check-finding

FE_STORAGE_OUTSIDE_MODULES:
  title: "Web storage only inside modules"
  title_vi: "Dùng localStorage/sessionStorage ngoài modules/"
  meaning_vi: "`<file>` đọc hoặc ghi `localStorage`/`sessionStorage` ngoài `modules/`. Storage không tồn tại ở server và ném lỗi khi đầy hạn mức, nên render server và hydrate lệch nhau."
  causes_vi:
    - "Vi phạm luật R55: Chỉ `modules/**` được chạm web storage, sau một hook hoặc module có bảo vệ (`typeof window`, try/catch); block gọi hook đó."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_STYLE_SOURCE_UNRESOLVED:
  title: "Tailwind @source path does not resolve"
  title_vi: "Đường dẫn @source của Tailwind không tồn tại"
