  meaning_vi: "Môi trường khai báo deploy.dbUpgrade nhưng service db còn gắn volume cũ; deploy thường sẽ phục vụ một cơ sở dữ liệu rỗng."
  causes_vi:
    - "Quên chạy db-upgrade trước khi deploy."
    - "Deploy tự động chạy sau khi khai báo được merge."
