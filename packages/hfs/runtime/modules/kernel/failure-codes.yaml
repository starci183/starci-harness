  title: "An app composition file is over its line budget"
  title_vi: "Tệp ghép nối của ứng dụng vượt ngân sách dòng"
  meaning_vi: "Một tệp ghép nối của ứng dụng vượt ngân sách dòng mà slot `be.app.*` đặt ra (`app.module.ts` 250, `<app>.env.ts` 150, `<app>.options.ts` 200, `compose/<area>.ts` 120, `main.ts` 80). Ngân sách là tuyệt đối, không phải kiểu không-được-tăng."
  causes_vi:
    - "Vi phạm luật R246: mọi module của ứng dụng được liệt kê trực tiếp trong app.module.ts"
    - "Một nhóm compose/<area>.ts gom nhiều khu vực vào một tệp"
  nextStep_vi: "Tách một khu vực ghép nối ra nhóm mới `apps/<app>/src/compose/<area>.ts` và spread nó trong `app.module.ts`; tệp options chỉ giữ giá trị từ môi trường và ràng buộc cổng. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_APP_COMPOSITION_ONLY:
  title: "Composition root has stray source"
  title_vi: "Gốc ghép nối có tệp lạc chỗ"
  meaning_vi: "Mã trong ứng dụng gốc không phải tệp mà slot ứng dụng cho phép (main.ts, app.module.ts, <app>.env.ts, <app>.options.ts, compose/<area>.ts; operations.ts ở ứng dụng API)."
  causes_vi:
    - "Thêm tệp không đúng tên vào thư mục ứng dụng gốc"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_APP_ENV_REQUIRED:
  title: "A back-end app lacks its typed environment boundary"
  title_vi: "Ứng dụng back end thiếu ranh giới môi trường có kiểu"
  meaning_vi: "Ứng dụng không có tệp <app>.env.ts được theo dõi với interface và read<App>Env(env: EnvSource), hoặc main.ts tự đọc và phân tích môi trường thay vì gọi hàm đó."
  causes_vi:
    - "Ứng dụng thiếu tệp môi trường hoặc dùng hàm đọc không có hợp đồng kiểu"
    - "main.ts gọi parseConfig hoặc đọc EnvSource trực tiếp"
  nextStep_vi: "Tạo và theo dõi apps/<app>/src/<app>.env.ts, xuất interface cùng read<App>Env nhận EnvSource; main.ts chỉ tạo EnvSource một lần rồi gọi hàm đọc đó để khởi động."
  owner: op-retry
  kind: check-finding

BE_APP_MODULE_LIST_INLINE:
  title: "An app root holds an inline composition list"
  title_vi: "Module gốc ứng dụng chứa danh sách ghép nối tại chỗ"
  meaning_vi: "app.module.ts liệt kê module, queue hoặc scheduler tại chỗ thay vì spread nhóm có kiểu từ compose/<area>.ts."
  causes_vi:
    - "Module gốc nhập trực tiếp các module tính năng hoặc đăng ký capability"
    - "Danh sách ghép nối được đặt trong biến của module gốc để tránh nhóm compose"
  nextStep_vi: "Chuyển danh sách vào nhóm có kiểu trong compose/<area>.ts rồi spread nhóm trong app.module.ts; chỉ giữ guard và filter toàn ứng dụng tại module gốc."
  owner: op-retry
  kind: check-finding

BE_APP_OPTIONS_COMPOSITION:
  title: "App env or options holds module, queue or scheduler composition"
  title_vi: "Tệp options của ứng dụng chứa danh sách module, queue hoặc scheduler"
  meaning_vi: "`apps/<app>/src/<app>.env.ts` or `apps/<app>/src/<app>.options.ts` chứa một mảng module Nest (lớp `*Module`, lời gọi `X.register(...)`, `forRoot(...)`, `registerQueue(...)`), một mục queue hoặc scheduler (`*SchedulerOf(...)`), hoặc một danh sách `imports`, `modules`, `schedulers`, `processors`. Tệp options chỉ giữ các giá trị đọc từ môi trường và các ràng buộc cổng (map provider như `{ approvalGate: X }`); danh sách ghép nối thuộc về `compose/<area>.ts`. The env file allows typed, fail-fast parsing through EnvSource and capability parse helpers only and also refuses standalone module or queue registration calls; the options file holds env-derived values and port bindings with no parsing."
  causes_vi:
    - "Vi phạm luật R245: dồn danh sách module, queue hoặc scheduler vào <app>.options.ts để app.module.ts ngắn lại"
  nextStep_vi: "Chuyển danh sách vào `apps/<app>/src/compose/<area>.ts` (mỗi khu vực một nhóm, xuất mảng module của khu vực đó) và spread nhóm trong `app.module.ts`; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ASYNC_NO_AWAIT:
  title: "Async function that never awaits"
  title_vi: "Hàm async không có await"
  meaning_vi: "Một hàm async không chứa await nào, nên nó hứa việc bất đồng bộ mà không làm, biến lỗi ném ra thành promise bị từ chối vô ích và khiến người đọc tìm một điểm chờ không tồn tại."
  causes_vi:
    - "async method chỉ return giá trị đồng bộ"
    - "async arrow chỉ trả về promise của hàm khác"
  nextStep_vi: "Bỏ async và trả giá trị (hoặc promise thân hàm đã có); nếu chữ ký phải trả Promise thì trả Promise.resolve(giá trị). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ASYNC_SPEC_MISSING:
  title: "Every message consumer and saga has an e2e spec"
  title_vi: "Consumer hoặc saga chưa có spec e2e"
  meaning_vi: "Một sự kiện mà ứng dụng tiêu thụ (mục trong `consumes.ts`) không được spec e2e nào gọi `useTestWorld` nêu tên, hoặc (với bước saga, hợp đồng khai báo `compensates`) spec không nêu cả sự kiện được bù trừ."
  causes_vi:
    - "Vi phạm luật R167: luồng bất đồng bộ và luồng bù trừ (saga) được chứng minh qua world: phát sự kiện, đọc lại trạng thái đã lưu, thử giao lại; với bước saga, spec chạy cả luồng (bước đầu, lỗi, rồi trạng thái đã bù trừ)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết spec e2e `be/src/tests/e2e/<area>/<tên>.e2e-spec.ts` khởi động world, phát sự kiện thật và đọc kết quả (với bước saga: nêu cả sự kiện được bù trừ và đọc trạng thái đã bù trừ)."
  owner: op-retry
  kind: check-finding

BE_BACKGROUND_UNOWNED:
  title: "Every sweep, outbox or retry has a job or consumer run by a worker app"
  title_vi: "Việc nền không có ai chạy"
  meaning_vi: "`<method>` là việc nền nhưng không có job/consumer nào chạy nó — 'khôi phục bền' này không bao giờ chạy."
  causes_vi:
    - "Vi phạm luật R46: Công việc nền (outbox, sweep, reconcile, retry) là `transport/schedule/*.job.ts` hoặc `transport/message/*.consumer.ts`, được app `worker` compose; job/consumer không app `worker` nào compose, hoặc `@Cron`/`@Interval`/`setInterval` ngoài `platform/scheduling`, hoặc method `sweep*\\|deliver*\\|reconcile*\\|retry*` không có job/consumer đã compose chạm tới = đỏ."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

BE_CLI_BOOTSTRAP:
  title: "The cli app does not boot with CommandFactory.run, or serves"
  title_vi: "App cli không khởi động bằng CommandFactory.run hoặc lại chạy như server"
  meaning_vi: "`main.ts` của app cli khởi động bằng `CommandFactory.run(...)` của nest-commander và không bao giờ phục vụ HTTP hay microservice: `NestFactory.create*`, `.listen()`, adapter `@nestjs/platform-*` hay `@nestjs/microservices` trong app cli đều bị từ chối."
  causes_vi:
    - "Vi phạm luật R148: app cli chạy một lệnh rồi thoát; một server trong app cli là một app api đội lốt."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết `main.ts` của app cli là `CommandFactory.run(AppModule, logger)` và bỏ mọi phần tạo server khỏi app cli."
  owner: op-retry
  kind: check-finding

BE_CLI_COMMAND_SHAPE:
  title: "A cli command is misplaced or has no spec"
  title_vi: "Lệnh cli đặt sai chỗ hoặc thiếu spec"
  meaning_vi: "Lệnh nest-commander (`@Command` hoặc `@SubCommand`) chỉ được khai báo trong `src/features/cli/`: nhóm `@Command` ở `<group>/<group>.cli.ts`, `@SubCommand` kế thừa `CommandRunner` ở `<group>/subs/<name>.cli.ts`, mỗi tệp một lệnh, và mỗi lệnh con có unit spec `<name>.cli.spec.ts` bên cạnh."
  causes_vi:
    - "Vi phạm luật R149: lệnh cli là nơi chạy hành động (không phải transport mỏng), nên phải nằm đúng chỗ và được chứng minh bằng spec như một service."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chuyển lệnh về `src/features/cli/<group>/subs/<name>.cli.ts` (nhóm về `<group>/<group>.cli.ts`), cho lệnh con kế thừa `CommandRunner` và viết `<name>.cli.spec.ts` bên cạnh."
  owner: op-retry
  kind: check-finding

BE_CLI_OWNER:
  title: "A command line outside the cli"
  title_vi: "Có dòng lệnh nằm ngoài cli"
  meaning_vi: "`nest-commander` chỉ được import trong app cli và gốc feature cli; không mã back end nào tự đọc `process.argv` hay import commander, yargs, minimist."
  causes_vi:
    - "Vi phạm luật R150: một cửa hành động một lần ở app khác (ví dụ cờ `migrate` trong api) lách khỏi app cli, image cli và spec của lệnh."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết hành động thành một lệnh `src/features/cli/<group>/subs/<name>.cli.ts` do app cli chạy và bỏ việc đọc tham số dòng lệnh ở nơi khác."
  owner: op-retry
  kind: check-finding

BE_CLI_REQUIRED:
  title: "The back end has no cli app, or no cli image"
  title_vi: "Back end thiếu app cli hoặc image của nó"
  meaning_vi: "Mọi hành động chạy một lần của back end (migrate, seed, sync, backup, lệnh vận hành) nằm trong MỘT app `be/apps/cli` (kind cli, tên cli) chạy trên nest-commander. Back end có connection (migration chạy bằng `cli migrate run`) hoặc có lệnh dưới `src/features/cli/` thì phải khai báo đúng app đó và có `be/apps/cli/Dockerfile`."
  causes_vi:
    - "Vi phạm luật R147: không có app cli thì migration và các hành động một lần không có chỗ chạy chuẩn; thiếu Dockerfile thì không có image `cli` để chạy `cli <group> <command>`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: khai báo { \"name\": \"cli\", \"kind\": \"cli\" } trong `sides.be.apps` của `hfs.json`, dựng `be/apps/cli` với `CommandFactory.run` và thêm `be/apps/cli/Dockerfile`; đổi tên app cli khác thành `cli`."
  owner: op-retry
  kind: check-finding

BE_COMPOSITION_UNTYPED:
  title: "App composition lives outside an explicitly typed area group"
  title_vi: "Ghép nối ứng dụng nằm ngoài nhóm khu vực có kiểu tường minh"
  meaning_vi: "Danh sách hoặc map module, provider, queue hay scheduler được đặt trong main, env hoặc options, hoặc nhóm compose không khai báo kiểu mảng hay kiểu trả về tường minh. Kiểm tra dựa trên kiểu đã phân giải, không dựa trên tên lớp hoặc hàm."
  causes_vi:
    - "Đổi tên module hoặc helper, dùng configure hay cron-table để giấu danh sách ghép nối"
    - "Xuất nhóm compose với kiểu suy luận, any hoặc phần tử không phải thành phần ghép nối"
  nextStep_vi: "Chuyển danh sách sang compose/<area>.ts, khai báo kiểu mảng hoặc kiểu trả về như Array<DynamicModule | Type<unknown>>, rồi spread nhóm trong app.module.ts; chỉ để giá trị môi trường và ràng buộc cổng trong options."
  owner: op-retry
  kind: check-finding

BE_CONFIG_OWNER:
  title: "Environment read outside platform/config"
  title_vi: "Đọc biến môi trường ngoài platform/config"
  meaning_vi: "Một tệp đọc process.env (truy cập, destructuring, Reflect.get hay import env của node:process), import @nestjs/config hoặc dotenv, gọi một hàm đọc cấu hình của <capability>.config.ts ngoài main.ts (tệp config, spec của nó hoặc test world), hoặc ghép đường dẫn từ process.cwd() với src hay .starcistacks, ngoài tệp khai báo lớp EnvSource của platform/config, nên cấu hình của capability không đi qua bộ đọc có kiểu duy nhất."
  causes_vi:
    - "Đọc process.env trực tiếp trong service, module hoặc factory"
    - "Import @nestjs/config, dotenv hoặc gọi platformConfig()/parse<C>Config() trong service, ở phạm vi module hay trong factory thay vì nhận options do main.ts truyền vào AppModule.register"
    - "path.join(process.cwd(), \"src\", ...)"
  nextStep_vi: "Thêm khóa vào <capability>.config.ts (parse<C>Config(env: EnvSource)) và lấy giá trị qua <capability>.options.ts; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_CONNECTION_DUPLICATE:
  title: "One database reached through more than one connection or injector"
  title_vi: "Một cơ sở dữ liệu có hơn một kết nối hoặc injector"
  meaning_vi: "Mỗi cơ sở dữ liệu vật lý chỉ có một kết nối và một injector Inject<Conn>EntityManager() khai báo một lần trong platform/database. Bộ kiểm tra thấy một injector thứ hai (ví dụ InjectCollabEntityManager bên cạnh InjectAgentOsEntityManager), một tên kết nối thứ hai trỏ vào cùng cơ sở dữ liệu, một lời gọi InjectEntityManager/getEntityManagerToken/InjectDataSource ngoài <conn>.decorators.ts, hoặc hfs.json, tệp kết nối và injector không khớp một-một. Một ngữ cảnh có thể là một schema riêng trong cơ sở dữ liệu dùng chung (isolation: schema): khi đó cấu hình phải đọc <PREFIX>_SCHEMA và hai ngữ cảnh chỉ được chung một cơ sở dữ liệu nếu schema khác nhau; ngữ cảnh isolation database không chung cơ sở dữ liệu với ai."
  causes_vi:
    - "Một tính năng tự tạo injector hoặc kết nối riêng cho cùng cơ sở dữ liệu"
    - "Hai tệp cùng export một tên injector nhưng trỏ tới hai kết nối"
    - "Kết nối mới chưa được khai báo trong hfs.json connections"
    - "Cấu hình kết nối đọc biến môi trường của kết nối khác"
    - "Hai ngữ cảnh isolation: schema cùng trỏ tới một schema (hoặc cấu hình không đọc <PREFIX>_SCHEMA)"
  nextStep_vi: "Giữ đúng một <conn>.connection.ts, <conn>.config.ts và <conn>.decorators.ts cho mỗi mục hfs.json connections trong src/modules/platform/database/, xóa injector hoặc kết nối thừa cùng mọi tham chiếu và đổi nơi dùng sang injector duy nhất. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTEXT_COUPLING:
  title: "Contexts are coupled by a relation, a foreign key or an import"
  title_vi: "Các ngữ cảnh bị ghép với nhau bằng quan hệ, khóa ngoại hoặc import"
  meaning_vi: "Các ngữ cảnh giới hạn chỉ liên lạc bằng sự kiện. Bộ kiểm tra thấy một quan hệ entity (OneToOne, OneToMany, ManyToOne, ManyToMany) trỏ sang entity của ngữ cảnh khác, một khóa ngoại (REFERENCES) trong migration trỏ sang bảng của ngữ cảnh khác, hoặc tệp của năng lực domain/projection import tệp của năng lực thuộc ngữ cảnh khác (entity, service hoặc SQL)."
  causes_vi:
    - "@ManyToOne(() => UserEntity) từ entity của order sang entity của identity"
    - "Migration tạo FOREIGN KEY ... REFERENCES users trên bảng của ngữ cảnh khác"
    - "Service của order import service của identity để lấy dữ liệu người dùng"
  nextStep_vi: "Giữ id của ngữ cảnh kia như một cột thường, không quan hệ và không khóa ngoại; dữ liệu cần dùng thì giữ bản sao cục bộ do reactor cập nhật từ sự kiện của ngữ cảnh đó, hoặc đọc một projection trong modules/projections/<tên>. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTEXT_OWNER:
  title: "An app composes a context it does not own"
  title_vi: "Một app lắp ghép ngữ cảnh không thuộc về nó"
  meaning_vi: "Mỗi mục hfs.json connections là một ngữ cảnh giới hạn (bounded context) và có đúng một app chủ (owner). Bộ kiểm tra thấy một app api hoặc worker đăng ký kết nối của app khác trong module cơ sở dữ liệu, import năng lực thuộc ngữ cảnh của app khác, hoặc app migrate/cli không đăng ký đủ mọi kết nối (migration chỉ chạy qua cli migrate, mỗi kết nối một lần)."
  causes_vi:
    - "App order đăng ký thêm kết nối identity để đọc trực tiếp dữ liệu của identity"
    - "App order import năng lực domain/identity thay vì gọi API hoặc nghe sự kiện của identity"
    - "Thêm kết nối mới vào hfs.json nhưng app migrate/cli chưa đăng ký nó"
  nextStep_vi: "Chỉ đăng ký các kết nối mà app là owner; dữ liệu của ngữ cảnh khác lấy qua API công khai của app chủ hoặc qua sự kiện (bản sao cục bộ, projection). Với app migrate/cli, đăng ký đủ mọi kết nối đã khai báo. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTEXT_PLATFORM_TABLES:
  title: "A per-connection platform capability has no tables on a connection that uses it"
  title_vi: "Năng lực nền tảng theo kết nối chưa có bảng trên kết nối đang dùng nó"
  meaning_vi: "Outbox/inbox của event bus và bảng job tồn tại trên mỗi kết nối dùng chúng (manifest liệt kê chúng trong perConnection của slot be.persistence). Bộ kiểm tra thấy một lời gọi truyền EntityManager của kết nối C vào năng lực đó, nhưng mảng entity và migration của năng lực chưa được đăng ký trên C, nên dòng ghi ra không có bảng trong cơ sở dữ liệu của ngữ cảnh đó."
  causes_vi:
    - "Thêm ngữ cảnh mới phát sự kiện nhưng quên đăng ký entity/migration của event-bus trên kết nối của nó"
    - "Handler gọi eventBus.publish(event, manager) với manager của kết nối chưa có bảng outbox"
  nextStep_vi: "Đăng ký entity và migration của năng lực nền tảng đó trên kết nối của ngữ cảnh (app chủ và cli migrate), để mỗi cơ sở dữ liệu có bảng riêng của nó trong cùng giao dịch với thay đổi nghiệp vụ. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTEXT_TRANSACTION:
  title: "One transaction spans more than one context"
  title_vi: "Một giao dịch trải qua nhiều hơn một ngữ cảnh"
  meaning_vi: "Một giao dịch chỉ được chạm kết nối của một ngữ cảnh. Bên trong callback của transaction trên EntityManager của kết nối C, bộ kiểm tra thấy dùng EntityManager của kết nối khác (nhận ra qua injector Inject<Conn>EntityManager) hoặc gọi một service của năng lực thuộc ngữ cảnh khác (service đó ghi bằng kết nối riêng của nó nên không thể cùng một giao dịch)."
  causes_vi:
    - "Trong giao dịch của order gọi identityService.update(...)"
    - "Giao dịch trên kết nối order dùng this.billingManager để ghi bảng của billing"
  nextStep_vi: "Chia thành một giao dịch cho mỗi ngữ cảnh, nối với nhau bằng sự kiện qua event bus (saga có bù trừ cho từng bước); đừng cố gom nhiều ngữ cảnh vào một commit. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTRACT_BREAKING:
  title: "An event contract changed in a breaking way"
  title_vi: "Hợp đồng sự kiện bị đổi theo cách phá vỡ tương thích"
  meaning_vi: "Hợp đồng sự kiện be/contracts/<service>/events.json chỉ được phát triển theo hướng cộng thêm so với bản đã ghim events.pin.json (bản đã công bố trước đó). Bộ kiểm tra thấy một sự kiện bị xóa, đổi stream hoặc version, một trường payload bị xóa, đổi kiểu hoặc đổi tính tùy chọn, hoặc một trường mới ở dạng bắt buộc (sự kiện đang nằm trên đường truyền không mang trường đó)."
  causes_vi:
    - "Xóa hoặc đổi tên trường payload của order.placed"
    - "Đổi kiểu totalCents từ number sang string"
    - "Thêm trường bắt buộc mới vào sự kiện đã công bố"
  nextStep_vi: "Giữ nguyên sự kiện cũ và thêm sự kiện mới <tên>.v2 với hình dạng mới (consumer chuyển dần rồi mới bỏ bản cũ); chỉ thêm trường mới ở dạng tùy chọn (field?). Khi công bố hợp đồng mới, chép events.json đè lên events.pin.json. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_CONTRACT_UNGUARDED:
  title: "A fake serves payload fixtures that no sandbox contract spec compares with the real provider"
  title_vi: "Fixture của fake chưa có contract spec bảo vệ"
  meaning_vi: "Thư mục `src/tests/world/fakes/<provider>/` có fixture payload (`payloads/*.json`) nhưng không có `src/tests/contract/<provider>/*.contract-spec.ts` nào vừa tham chiếu fixture của nhà cung cấp đó vừa khẳng định `shapeOf(real)` bằng `shapeOf(fixture)`: `<detail>`."
  causes_vi:
    - "Fake có fixture payload nhưng chưa có thư mục contract/<provider>/ hay spec nào"
    - "Contract spec có nhưng không so hình dạng (shapeOf) của payload thật với fixture, hoặc không đọc fixture của đúng nhà cung cấp, hoặc tự định nghĩa shapeOf thay vì import từ world"
  nextStep_vi: "Thêm `src/tests/contract/<provider>/<provider>.contract-spec.ts` dùng contract helper của world (`sandbox.describe(...)`, tự bỏ qua khi thiếu cấu hình sandbox) và khẳng định `expect(shapeOf(thật)).toEqual(shapeOf(fixture))`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_COOKIE_ATTRIBUTES:
  title: "A cookie a door writes leaves its attributes to the defaults"
  title_vi: "Cookie do cửa backend ghi ra không nêu rõ thuộc tính"
  meaning_vi: "Một lời gọi `cookie` hoặc `setCookie` trên phản hồi của Express hay Fastify ở `<file>` không nêu `httpOnly: true`, `secure: true` hoặc `sameSite` là `lax`/`strict` bằng giá trị cố định, hoặc `Set-Cookie` được ghi tay thành header; cookie đó khi đó đọc được từ script của trang, đi qua HTTP thường hoặc đi theo request chéo trang."
  causes_vi:
    - "Vi phạm luật R141: gọi `res.cookie(name, value)` không có options, hoặc options thiếu một trong ba thuộc tính"
    - "`sameSite: \"none\"`, `secure: false` hoặc `httpOnly` lấy từ một biến boolean không cố định"
    - "Ghi header `Set-Cookie` bằng `setHeader`, `append` hoặc `header`"
  nextStep_vi: "Khai báo một hằng số options `as const` trong module sở hữu cookie với `httpOnly: true`, `secure: true` và `sameSite: \"lax\"` hoặc `\"strict\"`, rồi truyền nó vào mọi lần `res.cookie`; bỏ mọi header `Set-Cookie` viết tay. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_CORS_ALLOWLIST:
  title: "API CORS has no exact origin allowlist"
  title_vi: "CORS của API thiếu danh sách origin cụ thể"
  meaning_vi: "API chưa giới hạn các origin của trình duyệt bằng danh sách cấu hình rõ ràng."
  causes_vi:
    - "Thiếu enableCors hoặc origin là wildcard, true hay danh sách rỗng"
  nextStep_vi: "Áp dụng allowedOrigins của http-security hoặc danh sách origin cụ thể; cấu hình phải từ chối wildcard và origin không hợp lệ."
  owner: op-retry
  kind: check-finding

BE_CQRS_SHAPE:
  title: "Application layer is not in CQRS shape"
  title_vi: "Tầng ứng dụng sai hình CQRS"
  meaning_vi: "Tầng application phải là CQRS: message Command<R>/Query<R> chỉ mang một trường readonly params kiểu ExecuteParams hoặc PublicExecuteParams, handler kế thừa ICQRSHandler và override process (không override execute). Bộ kiểm tra thấy tệp *.use-case.ts, service chuyển tiếp, message không khai kiểu kết quả, EventBus, @EventsHandler hoặc EventEmitter2, cũng như new EventEmitter() / extends EventEmitter, new Subject() (RxJS) dùng làm kênh, hoặc lớp giữ danh sách callback do nơi khác đăng ký (như *TransitionEmitter)."
  causes_vi:
    - "Còn lớp use case kiểu cũ"
    - "Message thiếu kiểu kết quả Command<R>"
    - "Handler override execute"
    - "Dùng sự kiện trong tiến trình thay cho outbox"
    - "class XTransitionEmitter { private emitter = new EventEmitter() } hoặc lớp tự giữ Set<callback> rồi gọi từng callback"
  nextStep_vi: "Tách mỗi thao tác thành <action>.command.ts hoặc <action>.query.ts, <action>.handler.ts và <action>.contracts.ts; transport gọi bus trực tiếp; hiệu ứng phụ bắt buộc đi qua outbox trong transaction. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_DEFAULT_DENY:
  title: "Open or untyped door"
  title_vi: "Cửa mở hoặc nhận dữ liệu không kiểu"
  meaning_vi: "Một operation nhận body không kiểu (unknown, any, GraphQLJSON, switch theo operation), công khai mà không có @Public({ reason: PublicReason.X }) lấy từ enum của domain/identity, tự chọn guard bằng @UseGuards, hoặc so sánh bí mật bằng toán tử bằng thay vì timingSafeEqual. Mặc định mọi route đi qua chuỗi APP_GUARD toàn cục và mọi đầu vào phải có kiểu."
  causes_vi:
    - "@Body() hoặc @Args() không khai kiểu, hoặc khai unknown, any, object"
    - "GraphQLJSON được dùng để chui dữ liệu không kiểu qua schema"
    - "@Public() thiếu reason, hoặc reason là chuỗi hay thuộc enum khác PublicReason"
    - "@UseGuards(...) trên controller hay resolver thay vì chuỗi APP_GUARD toàn cục"
    - "Token, mật khẩu hoặc chữ ký được so sánh bằng === hay !=="
    - "Gốc app api không cung cấp APP_GUARD theo thứ tự throttler, CSRF origin guard của platform/http-security, AuthGuard của domain/identity, hoặc thiếu, lặp một guard"
  nextStep_vi: "Khai DTO hoặc kiểu hợp đồng cho từng operation, dùng @Public({ reason: PublicReason.X }) khi cần mở cửa, bỏ @UseGuards, và so sánh bí mật bằng crypto.timingSafeEqual; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ENTITY_IN_CONTRACT:
  title: "ORM entity leaks into a contract"
  title_vi: "Entity ORM lộ ra hợp đồng"
  meaning_vi: "Một kiểu có khai báo @Entity của ORM với nguồn gốc từ typeorm nằm trong tầm với của một chữ ký transport, hàm execute của handler, hợp đồng (*.contracts.ts) hoặc thông điệp (*.command.ts, *.query.ts), trực tiếp hay qua tham số kiểu và thuộc tính, nên cấu trúc bảng bị lộ ra ngoài capability; hoặc một tệp entity nhập @nestjs/graphql hay class-validator."
  causes_vi:
    - "Trả nguyên entity từ resolver hoặc controller"
    - "Truyền entity xuyên tầng thay vì mã người dùng và vai trò"
    - "Một thuộc tính của kiểu hợp đồng có kiểu là Array<OrderEntity>"
    - "Entity gắn decorator @Field hoặc @IsString"
  nextStep_vi: "Trả một projection (kiểu thường của hợp đồng) và truyền principal id cùng role; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ENTRYPOINT_ONLY_IN_APPS:
  title: "Entrypoints only in `apps/*/src`"
  title_vi: "Entrypoint nằm ngoài apps"
  meaning_vi: "`<file>` là một entrypoint tiến trình nằm ngoài `apps/`."
  causes_vi:
    - "Vi phạm luật R33: Không `main.ts`/`bootstrap()`/top-level `void x()` ngoài `apps/*/src`; migrate là lệnh `cli migrate run` của `apps/cli`."
    - "NestFactory.create* hoặc lời gọi bootstrap() cấp cao nhất nằm ngoài apps/<app>/src/main.ts"
    - "Chỉ `src/tests/world/` (gốc ghép của test, slot be.tests.world) được gọi NestFactory ngoài main.ts; một spec (integration, contract, e2e) không được ghép: nó chỉ gọi useTestWorld(...)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_ERROR_CAUSE_DROPPED:
  title: "A catch replaces the failure without carrying it"
  title_vi: "Catch thay lỗi mà không giữ lỗi gốc"
  meaning_vi: "Một `throw` thoát ra khỏi `catch` (hoặc handler `.catch`) ở `<file>` ném một lỗi mới mà không ném lại giá trị đã bắt và không mang nó theo; lỗi gốc cùng stack của nó mất hẳn. Lỗi thay thế phải nhận đúng giá trị đã bắt làm `cause` (luật R108, BE-ERROR-4)."
  causes_vi:
    - "catch (error) { throw new PlanError({ code: PlanErrorCode.Failed }) } thiếu `cause: error`"
    - "Chỉ đọc `error.message` rồi dựng lỗi mới từ chuỗi đó"
    - "catch { throw new PlanError(...) } không đặt tên cho giá trị đã bắt"
  nextStep_vi: "Đặt tên cho giá trị bắt được (`catch (error)`) và truyền đúng nó làm `cause` của lỗi capability (`new <C>Error({ code, cause: error })`), hoặc ném lại chính nó. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ERROR_HOME:
  title: "Error declared outside its capability"
  title_vi: "Lỗi không nằm ở capability sở hữu"
  meaning_vi: "Một lớp lỗi nằm ngoài errors/<capability>.error.ts của capability sở hữu nó, kế thừa Error trần hay base đã bỏ thay vì DomainError, hoặc tệp errors/<capability>.error.ts không đúng hình dạng (một enum <C>ErrorCode, một bảng <C>_ERROR_KINDS kiểu Record<<C>ErrorCode, ErrorKind>, một lớp <C>Error rỗng); hoặc code ném giá trị không phải DomainError (new Error, exception của framework, chuỗi), hoặc domain ném lỗi của platform."
  causes_vi:
    - "Lớp lỗi đặt ở tệp service hay tệp khác thay vì <capability>/errors/<capability>.error.ts"
    - "Lớp lỗi kế thừa Error hoặc AbstractException thay vì DomainError"
    - "throw new Error(...), throw new NotFoundException(...) hoặc throw một chuỗi thoát ra khỏi capability"
    - "Giá trị enum không theo <CAPABILITY>_<WHAT>, bảng kind thiếu kiểu Record hoặc lớp lỗi có thân"
    - "Domain ném ConfigError hay lỗi khác của platform"
    - "Giá trị của enum <C>ErrorCode không phải chuỗi literal dạng <CAPABILITY>_<WHAT>, có hậu tố _ERROR hay _EXCEPTION, hoặc trùng với một mã ở nơi khác trong repo"
  nextStep_vi: "Chuyển lỗi về errors/<capability>.error.ts với đúng ba thành phần, kế thừa DomainError, dịch lỗi platform thành lỗi của capability; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_ERROR_MASKED:
  title: "One filter per app; undeclared errors are masked"
  title_vi: "Lỗi nội bộ lộ ra client"
  meaning_vi: "App `<a>` trả thông điệp lỗi nội bộ ra client (`<where>`). Lỗi lạ phải bị che."
  causes_vi:
    - "Vi phạm luật R39: Mỗi app đăng ký đúng một filter/formatError của `platform/errors`; lỗi không khai báo → 500 + thông điệp chung, chi tiết chỉ vào log."
    - "Gốc app api không cung cấp đúng một APP_FILTER dùng lớp khai báo trong platform/errors"
    - "GraphQLModule.forRoot không truyền formatError của platform/errors"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_EVENT_CLASS_CONTRACT:
  title: "A typed event class and its vendored contract agree"
  title_vi: "Lớp sự kiện và hợp đồng sự kiện đã vendor không khớp"
  meaning_vi: "Một lớp sự kiện dưới `be/src/modules/events/<service>/` không khai báo đúng một lớp với `eventName` và `version` là literal, không đặt tên tệp theo sự kiện của nó, không có mục tương ứng (cùng tên và phiên bản) trong `be/contracts/<service>/events.json`, hoặc một mục của hợp đồng không có lớp."
  causes_vi:
    - "Vi phạm luật R151: sự kiện là hợp đồng giữa các context và dịch vụ; lớp có kiểu và tệp hợp đồng phải là cùng một sự thật, nếu không bên nhận đọc một sự kiện mà bên phát không còn phát (hoặc ngược lại)."
    - "Bên phát đổi tên hoặc phiên bản của lớp nhưng chưa chạy `starci app emit`, hoặc thêm mục hợp đồng bằng tay."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa lớp (một lớp, eventName và version là literal, tên tệp theo sự kiện) rồi chạy `starci app emit` để hợp đồng khớp; không sửa tay `events.json`."
  owner: op-retry
  kind: check-finding

BE_EVENT_CONSUMER_SHAPE:
  title: "A message consumer is a transport door named after its event"
  title_vi: "Consumer sự kiện sai chỗ, sai tên hoặc không chuyển eventId"
  meaning_vi: "Một lớp implements `EventConsumer` nằm ngoài tệp `.consumer.ts` của `transport/message`, tên tệp không theo `eventName` của lớp sự kiện, `handle` không đọc `delivery.eventId`, hoặc một tệp `.consumer.ts` chứa lớp không phải consumer sự kiện."
  causes_vi:
    - "Vi phạm luật R153: giao hàng ít nhất một lần nên mỗi lần nhận lại phải dedupe; consumer chuyển `eventId` vào command để domain service claim trong `platform/inbox` cùng transaction với tác dụng của nó."
    - "Consumer được đặt ở handler hoặc nơi khác, hoặc đặt tên theo ý riêng khiến bên phát và bên nhận không cùng một tên sự kiện."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt consumer tại `transport/message/<event>.consumer.ts` (tên theo eventName, dấu chấm thành gạch ngang), khai báo `readonly event = <Lớp>Event`, và truyền `delivery.eventId` vào command được dispatch."
  owner: op-retry
  kind: check-finding

BE_FEATURE_IMPORTS_FEATURE:
  title: "A feature never imports a feature"
  title_vi: "Feature import feature khác"
  meaning_vi: "Feature `<a>` import feature `<b>`. Logic dùng chung phải là một capability domain."
  causes_vi:
    - "Vi phạm luật R28: Feature không import feature khác (kể cả qua `index.ts`); dùng chung thì đưa xuống domain."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

BE_FEATURE_LAYOUT_INVALID:
  title: "Feature folder layout invalid"
  title_vi: "Bố cục thư mục feature sai"
  meaning_vi: "Tệp của feature đặt sai thư mục application hoặc transport so với vai trò của nó."
  causes_vi:
    - "Đặt vai trò giao vận trong application/ hoặc ngược lại"
    - "Thiếu tên giao thức dưới transport/"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_FEATURE_NOT_COMPOSED:
  title: "Feature or capability module not composed into any app"
  title_vi: "Feature hoặc module năng lực không được lắp vào ứng dụng nào"
  meaning_vi: "Một feature backend, hoặc một module domain, integrations hay platform, không có đường import chạy thật (không tính import chỉ-kiểu) từ tệp gốc của bất kỳ ứng dụng nào (app.module.ts hoặc main.ts), kể cả qua các module khác đã được lắp. Không tiến trình nào nạp nó nên code này không bao giờ được phục vụ."
  causes_vi:
    - "Quên thêm module của feature vào app.module.ts của ứng dụng"
    - "Chỉ import kiểu (import type) từ ứng dụng, nên feature không thật sự được lắp vào"
    - "Feature đã bị bỏ dở hoặc thay bằng feature khác nhưng thư mục cũ vẫn còn"
    - "Module năng lực được viết sẵn nhưng chưa feature nào import nó, hoặc feature từng dùng nó đã bị xoá"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để lắp module của feature vào ứng dụng phù hợp hoặc xoá feature không dùng; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_FEATURE_SHAPE:
  title: "Feature root is `index.ts`, module, `application/`, `transport/<protocol>/`"
  title_vi: "Feature sai hình dạng"
  meaning_vi: "Feature `<f>` có `<dir>` ngoài hình dạng chuẩn (application/ + transport/<protocol>/)."
  causes_vi:
    - "Vi phạm luật R29: Feature gốc chỉ có `index.ts`, `<feature>.module.ts`, `application/`, `transport/<protocol>/` với protocol có slot; không `application/graphql\\|http`, không `infrastructure/`, `composition/`, cây transport-first."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_FEATURE_THIN:
  title: "A feature file holds logic"
  title_vi: "Tệp feature chứa logic thay vì chỉ ủy quyền"
  meaning_vi: "Mọi tệp thuộc tầng feature có vai trò trong ruleParams.be.thinRoles (handler, resolver, controller, consumer, processor, step, saga, saga-step, compensation, webhook, gateway, subscription, cli, mapper, service của saga) chỉ ánh xạ tham số rồi thực hiện MỘT lệnh gọi ủy quyền vào modules/ (service, command bus, query bus, event bus hoặc queue producer): không if/switch/vòng lặp/toán tử ba ngôi/&&/||/??, không try/catch hay throw, không tính toán (so sánh, phép toán, chuỗi mẫu có biểu thức), không gọi hàm nào khác ngoài lệnh ủy quyền duy nhất, hàm ánh xạ thuần (*.mapper.ts) và logger. Logic nghiệp vụ nằm ở modules/** nơi được đo độ phủ 100% từng tệp; điều phối (thứ tự bước, bù trừ, claim, fencing, retry) nằm ở platform/*; tầng feature được kiểm chứng bằng integration và e2e, không bằng unit spec. A webhook POST delegates only to its durable inbox recording intake and may return the declared literal PROVIDER_ACK; its optional GET challenge delegates once to the domain verifier and echoes only that result. Webhook doors and HTTP modules import or inject no CommandBus, QueryBus or feature command handler; the reactor or job alone dispatches the processing command after commit."
  causes_vi:
    - "Handler, consumer hoặc processor có if/switch/vòng lặp/try để quyết định nghiệp vụ thay vì để service quyết định"
    - "Step hoặc saga service gọi hai service liên tiếp (điều phối nằm sai chỗ, phải thuộc platform/*)"
    - "Mapper tính toán hoặc rẽ nhánh (giá trị mặc định bằng ||, so sánh, nối chuỗi) thay vì chỉ đổi tên và sao chép trường"
    - "Lệnh cli chứa vòng lặp, try/catch hoặc phép gán thay vì gọi một service của platform"
  nextStep_vi: "Chuyển phần logic vào service/policy/mapper thuộc modules/** (domain hoặc platform tùy loại), viết unit spec đạt 100% từng tệp ở đó, rồi để tệp feature chỉ gọi đúng một phương thức. Điều phối nhiều bước chuyển vào platform/* (saga, jobs, event-bus, queue). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/*.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_HAND_ROLLED_RETRY:
  title: "Hand-rolled retry loop"
  title_vi: "Tự viết vòng lặp thử lại thay vì dùng bộ trợ giúp chung"
  meaning_vi: "Một vòng lặp bắt lỗi (catch hoặc .catch) rồi chờ trước khi thử lại được viết tay tại chỗ; chờ nghĩa là gọi setTimeout, hàm của node:timers/promises, hoặc một hàm khai báo ngoài platform/retry mà thân hàm chờ, dù tên hàm là gì. Vòng lặp như vậy không có giới hạn số lần thử mà bộ kiểm tra nhìn thấy được, không có jitter, và không có cách nào tôn trọng một abort signal."
  causes_vi:
    - "for (let i = 0; i < max; i++) { try { return await fn() } catch (e) { await sleep(backoffMs(i)) } }"
    - "while (true) { try { return await fn() } catch (e) { await new Promise((r) => setTimeout(r, delayMs)) } }"
  nextStep_vi: "Thử lại qua bộ trợ giúp chung platform/retry (giới hạn số lần thử, backoff theo cấp số nhân có jitter, nhận abort signal) thay vì viết vòng lặp tại chỗ; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_HEALTH_SIGNALS:
  title: "API does not expose both live and ready health signals"
  title_vi: "API chưa cung cấp đủ tín hiệu live và ready"
  meaning_vi: "Đồ thị module của API chưa đăng ký cả endpoint liveness và readiness."
  causes_vi:
    - "Thiếu route live hoặc ready hoặc controller chưa được đăng ký trong module của API"
  nextStep_vi: "Đăng ký controller live và ready trong đồ thị module được API compose."
  owner: op-retry
  kind: check-finding

BE_HTTP_TIMEOUT:
  title: "Outbound HTTP call without a timeout"
  title_vi: "Gọi HTTP ra ngoài không có timeout"
  meaning_vi: "Một lời gọi fetch, axios hoặc HttpService không nêu timeout hay signal huỷ, nên một bên ngoài im lặng giữ yêu cầu, socket và một chỗ worker vô hạn."
  causes_vi:
    - "fetch(url) không có { signal }"
    - "axios.get hoặc post không có timeout"
    - "axios.create không có timeout"
  nextStep_vi: "Thêm signal: AbortSignal.timeout(<ms có tên>) cho fetch, hoặc timeout: <ms có tên> cho axios và HttpService. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_INBOX_DEDUPE_MISSING:
  title: "Webhook or consumer with no inbox dedupe"
  title_vi: "Thiếu chống trùng lặp qua inbox"
  meaning_vi: "Một handler của consumer (tệp *.consumer.ts trong transport/message) hoặc một handler mang @Public({ reason: PublicReason.SignedWebhook }) không bắt đầu bằng await inbox.claim(source, eventId) trên một receiver có kiểu Inbox của platform/inbox, hoặc có claim nhưng không return sớm khi claim trả false, nên khi bên gửi gửi lại (webhook không thấy phản hồi kịp, hàng đợi giao lại một thông điệp chưa được xác nhận) hành động sẽ chạy lại lần nữa thay vì là một no-op."
  causes_vi:
    - "@Public({ reason: PublicReason.SignedWebhook }) handle() { return this.service.charge() }"
    - "class PaymentCapturedConsumer { handle() { return this.service.capture() } }"
    - "await this.inbox.claim(source, id) rồi chạy tiếp mà không kiểm tra kết quả"
  nextStep_vi: "Gọi await this.inbox.claim(source, eventId) trước mọi await khác và return khi nó trả false (if (!(await this.inbox.claim(source, eventId))) return), để một lượt giao lại trở thành no-op; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_INFRA_OWNER:
  title: "Infrastructure library used outside its owning capability"
  title_vi: "Thư viện hạ tầng dùng ngoài năng lực sở hữu"
  meaning_vi: "Mỗi thư viện hạ tầng thô có đúng một năng lực sở hữu: fetch/axios/got/undici/node:http chỉ ở platform/http; cache-manager/redis/ioredis chỉ ở integrations/cache hoặc integrations/redis; bullmq/kafkajs chỉ ở platform/messaging; setTimeout/setInterval/node:timers chỉ ở platform/{scheduling,retry,messaging,http}; winston chỉ ở platform/logging; dayjs/moment chỉ ở platform/{clock,primitives}; @nestjs/config, dotenv, @nestjs/event-emitter và @nestjs/schedule không được dùng."
  causes_vi:
    - "Gọi fetch thẳng trong client tích hợp"
    - "Hẹn giờ bằng setTimeout trong service"
    - "Dùng dayjs trong miền"
    - "Gọi cổng HttpClient của platform/http ngoài một năng lực integrations, ví dụ service miền gọi thẳng endpoint token hay admin của Keycloak hoặc API gửi thư"
  nextStep_vi: "Gọi qua cổng của năng lực sở hữu (HttpClient, Cache, MessagePublisher, Clock, Logger) được tiêm bằng Inject*(). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_INPUT_BOUNDED:
  title: "Bounded input, depth limits, rate limits"
  title_vi: "Input không giới hạn"
  meaning_vi: "Một thuộc tính của lớp input ở `<file>` không có class-validator đúng với kiểu của nó (string thiếu @MaxLength, enum thiếu @IsEnum, mảng thiếu @ArrayMaxSize, object lồng thiếu @ValidateNested cùng @Type), hoặc phân trang bằng skip, offset, OFFSET hay số trang thay vì cursor."
  causes_vi:
    - "Thuộc tính của lớp input không có decorator class-validator nào, hoặc thiếu ràng buộc mà kiểu của nó đòi hỏi"
    - "skip hoặc offset trong tùy chọn find*, OFFSET trong câu SQL, hoặc trường page, pageNumber, offset trong DTO"
    - "Cửa mở bằng PublicReason.AuthHandshake hoặc PublicReason.SignedWebhook (đăng nhập, đăng ký, đặt lại mật khẩu, callback, webhook) không có @RateLimit(RateTier.Strict) của platform/http-security trên phương thức hay lớp của nó"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

BE_INTEGRATION_SPEC_MISSING:
  title: "Every integration has an integration spec that proves its client through the test world"
  title_vi: "Tích hợp thiếu spec integration chứng minh client qua test world"
  meaning_vi: "Thư mục `src/modules/integrations/<provider>/` (có `<provider>.config.ts`) không có `src/tests/integration/<provider>/*.integration-spec.ts` nào vừa gọi `useTestWorld({ modules })` với factory đăng ký module của chính tích hợp đó (`<Provider>Module.register`, import từ thư mục tích hợp), vừa tham chiếu enum ErrorCode của tích hợp, vừa gây một sự cố qua world (`world.infra.<service>`, `world.fake.<name>.failNext`, `world.apps.<peer>.during`, `world.interruptDatabase`)."
  causes_vi:
    - "Vi phạm luật R112: client của tích hợp chỉ được kiểm bằng unit spec với double, nên ánh xạ lỗi và đường sự cố của nhà cung cấp thật (hoặc fake ở biên mạng) chưa bao giờ chạy; lỗi phân loại timeout của FetchHttpClient chỉ lộ ra khi spec integration đầu tiên chạy."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm hoặc bổ sung spec integration của đúng thư mục provider cho phần còn thiếu (đăng ký module, enum ErrorCode, sự cố qua world); không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_JOB_FENCE_REQUIRED:
  title: "Every write to a claimed job carries its required fencing token"
  title_vi: "Ghi vào job đã claim không bắt buộc fencing token"
  meaning_vi: "Một phương thức của `JobClaims` nhận job mà kiểu tham số không bắt buộc `expectedFencingToken: number`, một lời gọi dùng `as`, `!` hoặc type assertion để lách, hoặc một `catch` quanh lệnh ghi có guard nuốt lỗi `JobFencedOut`."
  causes_vi:
    - "Vi phạm luật R158: lease hết hạn chỉ cho phép claimant mới, không dừng được tiến trình cũ; chỉ token đơn điệu được kiểm tra nguyên tử tại nơi nhận lệnh ghi mới từ chối worker zombie, nên token phải là bắt buộc trong kiểu."
    - "Token để optional, ép kiểu `as number`, hoặc `catch` ghi log rồi tiếp tục làm worker cũ vẫn gây tác dụng sau khi bị fence."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: khai báo `expectedFencingToken: number` bắt buộc trong kiểu, truyền đúng token trả về từ claim không ép kiểu, và để `FencedProcessor` xử lý lỗi (không `catch` quanh lệnh ghi trong step hay processor)."
  owner: op-retry
  kind: check-finding

BE_JOB_RUN_KEY:
  title: "An external effect of a job step carries a run key with the fencing token"
  title_vi: "Tác dụng ngoài của step không mang run key chứa fencing token"
  meaning_vi: "Một lời gọi tới integration trong `steps/<step>.step.ts` không truyền đối số kiểu `RunKey`, hoặc `RunKey` được tạo bằng ép kiểu thay vì `JobClaims.runKey`."
  causes_vi:
    - "Vi phạm luật R159: một worker zombie có thể lặp lại tác dụng ngoài; nhà cung cấp chỉ chặn được lặp nếu khoá idempotency gồm `jobId`, bước và fencing token của lần claim."
    - "Step truyền chuỗi cố định, hoặc `as RunKey` để tránh lỗi kiểu."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tạo khoá bằng `this.claims.runKey(job, \"<step>\")` và truyền cho integration; việc đọc dữ liệu đưa về lớp application."
  owner: op-retry
  kind: check-finding

BE_JOB_SHAPE:
  title: "A job processor extends the fenced base and a step implements JobStep"
  title_vi: "Processor của job không kế thừa lớp fenced hoặc step đặt sai chỗ"
  meaning_vi: "Một tệp `.processor.ts` nằm ngoài thư mục job của nó, tên khác job, không extends `FencedProcessor`; hoặc một tệp `.step.ts` nằm ngoài `steps/` hay không implements `JobStep`."
  causes_vi:
    - "Vi phạm luật R160: lớp cơ sở `FencedProcessor` claim job với token được tăng và kết thúc job qua các lệnh ghi có guard; một processor không kế thừa nó không có fence."
    - "Processor hoặc step được đặt cạnh handler hay nơi khác, làm loại jobs không còn một chỗ duy nhất."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt `<job>.processor.ts` trong `features/jobs/<job>/transport/queue/` với class extends `FencedProcessor`, và mỗi step trong `steps/<step>.step.ts` implements `JobStep`."
  owner: op-retry
  kind: check-finding

BE_JOB_WRITE_OUTSIDE_OWNER:
  title: "The job row is written only by platform/jobs"
  title_vi: "Dòng job bị ghi ngoài platform/jobs"
  meaning_vi: "Một lời gọi `update`, `increment`, `save`, `insert`, `delete` hoặc query builder ghi vào entity của job nằm ngoài `platform/jobs`."
  causes_vi:
    - "Vi phạm luật R157: fencing token và trạng thái của job chỉ đổi qua `JobClaims` (claim, advance, complete, fail), mỗi hàm đều bắt buộc `expectedFencingToken`; ghi thẳng cho phép một worker zombie ghi đè job mà worker mới đang sở hữu."
    - "Một handler, step hoặc domain service tự `manager.update(JobEntity, ...)` để tiện thay vì gọi cổng `JobClaims`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ lệnh ghi trực tiếp, gọi `JobClaims.advance`, `complete` hoặc `fail` với `expectedFencingToken` của lần claim; việc chỉ đọc thì không bị cấm."
  owner: op-retry
  kind: check-finding

BE_JSON_PARSE_UNGUARDED:
  title: "JSON.parse outside a try"
  title_vi: "JSON.parse không nằm trong try"
  meaning_vi: "Một lời gọi JSON.parse không nằm trong try trong cùng hàm, nên văn bản hỏng từ cơ sở dữ liệu, webhook hoặc nhà cung cấp gây ngoại lệ không được che và trả về 500."
  causes_vi:
    - "JSON.parse cột văn bản đã lưu"
    - "JSON.parse thân webhook hay phản hồi nhà cung cấp"
  nextStep_vi: "Bọc trong try và trả outcome có kiểu (hoặc DomainError) nêu rõ đang phân tích cái gì. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_JWT_ALG_PINNED:
  title: "JWT verification has no pinned asymmetric algorithm policy"
  title_vi: "Xác minh JWT thiếu chính sách thuật toán bất đối xứng cố định"
  meaning_vi: "Bộ xác minh chưa cố định thuật toán an toàn, nguồn cấu hình của issuer hoặc vai trò authenticated của principal."
  causes_vi:
    - "Danh sách algorithms rỗng, động hoặc chứa none hay HS256"
    - "Issuer viết trực tiếp hoặc principal chấp nhận vai trò khác authenticated"
  nextStep_vi: "Dùng danh sách literal gồm ES256, RS256 hoặc EdDSA, lấy issuer từ cấu hình và từ chối vai trò khác authenticated sau xác minh."
  owner: op-retry
  kind: check-finding

BE_KIND_DECLARATION:
  title: "The trigger kinds in use are declared, whole and never unused"
  title_vi: "Loại kích hoạt đang dùng chưa khai báo đủ trong hfs.json"
  meaning_vi: "`sides.be.kinds` của hfs.json không khớp với các loại feature đang có: thiếu một loại đang dùng, khai báo một loại không có feature nào, thiếu pattern mà loại đó cần, hoặc thiếu platform capability của pattern đó."
  causes_vi:
    - "Vi phạm luật R179: mỗi loại chỉ được sinh ra khi dùng đến (không có boilerplate rỗng), và loại nào đang dùng thì hạ tầng platform của nó phải có (jobs cần platform/jobs và platform/queue, reactors cần platform/event-bus)."
    - "Feature được tạo tay thay vì bằng `starci app add`, hoặc loại cuối cùng đã bị xoá mà khai báo vẫn còn."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: dùng `starci app add <loại> <tên>` để tạo thành viên đầu tiên cùng platform capability và khai báo, hoặc xoá khai báo của loại không còn dùng khỏi `sides.be.kinds`."
  owner: op-retry
  kind: check-finding

BE_KIND_EMPTY:
  title: "A kind folder has members and every member has code"
  title_vi: "Thư mục loại feature rỗng hoặc thành viên không có mã"
  meaning_vi: "Một tệp nằm trực tiếp trong `be/src/features/<loại>/` (ví dụ `.gitkeep` hay một feature trùng tên loại), hoặc một thư mục thành viên `<loại>/<tên>/` không có tệp TypeScript nào."
  causes_vi:
    - "Vi phạm luật R180: loại feature chỉ tồn tại khi có thành viên; thư mục loại rỗng là boilerplate mà `starci app add` không bao giờ sinh ra, và tên loại là tên dành riêng nên không dùng cho feature api."
    - "Tạo sẵn thư mục cho loại chưa dùng hoặc đổi tên feature api thành tên một loại."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xoá thư mục rỗng, đổi tên feature trùng tên loại, hoặc tạo thành viên bằng `starci app add`."
  owner: op-retry
  kind: check-finding

BE_KIND_ISOLATION:
  title: "No feature kind imports another kind"
  title_vi: "Một loại feature import trực tiếp loại feature khác"
  meaning_vi: "Một feature thuộc một loại kích hoạt (api, webhooks, realtime, saga, reactors, jobs hoặc cli) import một feature thuộc loại khác (kể cả import chỉ-kiểu), nên hai loại dính vào nhau thay vì gặp nhau qua event bus."
  causes_vi:
    - "Vi phạm luật R156: mỗi loại feature chỉ import xuống `modules/*`, chỉ `be/apps/*` mới ghép các feature; mọi lời gọi giữa các loại (api sang saga hoặc jobs, saga sang jobs, jobs sang saga, cli sang jobs) đi qua event bus để vẫn bền khi một bên chết."
    - "Một handler hoặc step được gọi trực tiếp từ loại khác để tiện, thay vì phát sự kiện từ domain service rồi để loại kia consume."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ import giữa các loại; để domain service phát sự kiện bằng `eventBus.publish(event, tx)` trong transaction của nó, và loại kia consume sự kiện đó; phần dùng chung đưa xuống `modules/*`."
  owner: op-retry
  kind: check-finding

BE_LITE_PROOF_LANE_MISSING:
  title: "A lite back end declares a pattern without an integration proof lane"
  title_vi: "Back end lite khai báo pattern nhưng thiếu nhánh kiểm thử integration"
  meaning_vi: "Ứng dụng lite khai báo event-bus, queue, webhooks, realtime, fenced-job, projection, saga hoặc idempotency nhưng không có spec integration để chứng minh hành vi của pattern."
  causes_vi:
    - "Vi phạm luật R284: chỉ có unit spec, spec e2e hoặc contract, hoặc chưa có spec dưới src/tests/integration."
  nextStep_vi: "Thêm spec integration dưới src/tests/integration với test chạy được mang tiêu đề `<pattern>/<kịch bản>: ...` cho từng kịch bản bắt buộc của pattern đã khai báo."
  owner: op-retry
  kind: check-finding

BE_LOGGER_REQUIRED:
  title: "Catch swallows the failure"
  title_vi: "Catch nuốt lỗi"
  meaning_vi: "Một catch (hoặc .catch) rỗng, hoặc không ném lại, không gọi phương thức nào của Logger (từ platform/logging), cũng không trả outcome có kiểu mang cause, nên lỗi thật biến mất không để lại dấu vết; hoặc một lời gọi Logger đặt tên sự kiện bằng chuỗi dựng tại chỗ thay vì một thành viên enum trong <owner>.log-events.ts, hoặc dùng Logger của framework thay cho cổng Logger của platform/logging."
  causes_vi:
    - "catch {} rỗng"
    - "catch chỉ trả null, false hoặc undefined"
    - "catch chỉ gọi console hoặc một đối tượng không có kiểu Logger, vốn không phải logger port"
    - "logger.info(`Checkout ${id} failed`) thay vì logger.info(OrderLogEvent.CheckoutFailed, { id })"
    - "new Logger('X') của @nestjs/common"
  nextStep_vi: "Ném lại lỗi, ghi log bằng logger của platform/logging, hoặc trả outcome có kiểu mang cause; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_LOG_SECRET:
  title: "Secret or personal data in a log call"
  title_vi: "Bí mật hoặc dữ liệu cá nhân bị ghi vào log"
  meaning_vi: "Một lời gọi trên cổng Logger của platform/logging truyền vào một giá trị có kiểu Secret (platform/config) hoặc Pii (identity), hay đọc ra từ một giá trị như vậy; hoặc một đối số có tên là thông tin xác thực (password, secret, token, apiKey, authorization, cookie, otp) hay định danh cá nhân (email, phone, fullName, idCard, birthDate), nên giá trị đó tồn tại lâu hơn yêu cầu và bị sao chép sang bên thứ ba."
  causes_vi:
    - "Ghi một giá trị kiểu Secret hoặc Pii, dù đặt tên là gì"
    - "Ghi token hoặc mật khẩu vào log để gỡ lỗi"
    - "Ghi email hoặc số điện thoại vào thông điệp lỗi"
    - "Tạo một lỗi (lớp kế thừa Error, kể cả DomainError) mang giá trị kiểu Secret hoặc chuỗi có tên là thông tin xác thực (token, mật khẩu, authorization, clientSecret) trong thông điệp hay params"
  nextStep_vi: "Ghi id của chủ sở hữu, độ dài, cờ có hay không, hoặc dạng đã che qua mask(...), không ghi giá trị thật. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MEMBER_DOC_MISSING:
  title: "A public member has no doc block"
  title_vi: "Thành viên công khai không có JSDoc"
  meaning_vi: "Một thành viên công khai (phương thức, accessor, field hoặc signature) của class, interface hoặc type object được export ở `<file>` không có khối JSDoc ngay phía trên; người gọi chạm tới thành viên chứ không đọc doc của kiểu (luật R109, BE-COMMENT-3)."
  causes_vi:
    - "Phương thức public của service hoặc handler không có /** ... */"
    - "Field của interface Request/Result được export không có doc"
    - "Comment dòng `//` thay cho khối JSDoc"
  nextStep_vi: "Thêm một khối JSDoc tiếng Anh ngay trên thành viên, nói nó dùng để làm gì hoặc gọi nó gây ra điều gì; private, protected, constructor và property gán hằng không cần. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MIGRATION_REVERSIBLE:
  title: "Migration that cannot be undone"
  title_vi: "Migration không có down đảo ngược được"
  meaning_vi: "Một migration có up() nhưng thiếu down(), down() rỗng hoặc chỉ ném lỗi, nên bản phát hành cần quay lui không có đường đi và bảng migration ghi đã hoàn tác trong khi lược đồ vẫn đổi."
  causes_vi:
    - "Không có phương thức down"
    - "down() rỗng"
    - "down() chỉ throw"
  nextStep_vi: "Viết down() là phép đảo ngược đúng của up(); khi up() xoá dữ liệu thì down() dựng lại cấu trúc và ghi rõ phần dữ liệu mất trong chú thích migration. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MODULE_DEFINITION_MISSING:
  title: "A Nest module has no module definition or is registered without register"
  title_vi: "Module Nest thiếu module-definition hoặc được đăng ký không qua register"
  meaning_vi: "Mọi module Nest của sản phẩm (capability, module con, feature, module transport, nhóm cli) phải có tệp <x>.module-definition.ts và <x>.options.ts cạnh <x>.module.ts, lớp module kế thừa ConfigurableModuleClass của chính tệp đó, và khi được import thì chỉ được viết dạng XModule.register({...}), không import trần tên lớp."
  causes_vi:
    - "Có <x>.module.ts nhưng thiếu <x>.module-definition.ts hoặc <x>.options.ts bên cạnh"
    - "Lớp module không kế thừa ConfigurableModuleClass lấy từ ./<x>.module-definition"
    - "Module sản phẩm nằm trong mảng imports (hoặc nhóm compose của app) như một tên lớp trần thay vì XModule.register({...})"
  nextStep_vi: "Tạo <x>.module-definition.ts (new ConfigurableModuleBuilder<XOptions>().setClassMethodName(\"register\").build()) và <x>.options.ts (export type XOptions = Record<string, never> nếu chưa có tùy chọn), cho lớp kế thừa ConfigurableModuleClass, và đăng ký bằng XModule.register({}); op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MODULE_HANDLER_REGISTRATION:
  title: "Handler not registered exactly once"
  title_vi: "Handler chưa đăng ký đúng một lần"
  meaning_vi: "Một handler không được đăng ký trực tiếp đúng một lần trong module Nest."
  causes_vi:
    - "Quên đăng ký vào providers"
    - "Đăng ký ở nhiều module"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_MODULE_PROVIDER_REREGISTRATION:
  title: "Provider re-registered"
  title_vi: "Provider bị đăng ký lại"
  meaning_vi: "Một provider đã có nơi đăng ký lại bị đăng ký thêm ở module khác."
  causes_vi:
    - "Khai báo cùng provider ở hai module"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_MODULE_SHAPE:
  title: "Nest module shape invalid"
  title_vi: "Hình dạng module Nest sai"
  meaning_vi: "Một module vi phạm hình dạng chuẩn: @Global() ở bất kỳ đâu, isGlobal: true ngoài apps/<app>/src/app.module.ts, import module của owner khác vào @Module({ imports }), ConfigurableModuleBuilder không khai kiểu options, có forRoot, forFeature hay registerAsync thay vì chỉ static register, nhiều module trong một tệp, new một provider, hoặc biến let ở cấp module."
  causes_vi:
    - "@Global() trên bất kỳ module nào (kể cả trong spec)"
    - "isGlobal: true ở ngoài app.module.ts của app"
    - "Module của một capability khác bị import vào imports thay vì dùng qua Inject<Thing>()"
    - "new ConfigurableModuleBuilder() không có kiểu options"
    - "register không static, hoặc có forRoot, forFeature, registerAsync"
    - "new XService() hoặc let ở cấp module tạo trạng thái toàn cục"
    - "Feature có hai module trong một thư mục transport (một module cho mỗi thao tác), module-definition không nằm cạnh module của nó, hoặc @Module ngoài `<f>.module.ts` và `<f>-<protocol>.module.ts`; app import module ứng dụng của feature hoặc module transport không thuộc loại app cho phép (api: graphql/http/websocket; worker: schedule/message; cli: cli)"
    - "Bộ máy đồ thị module: module đại diện của capability được đăng ký hai lần trong một app, thiếu isGlobal: true ở gốc app, hoặc bị module khác import"
    - "Module con có hơn một nơi import, hoặc vừa nằm ở gốc app vừa được module khác import"
    - "isGlobal: true xuất hiện ngoài gốc app apps/<app>/src/app.module.ts"
  nextStep_vi: "Bỏ @Global, để app đăng ký capability đúng một lần với isGlobal: true, dùng capability khác qua Inject<Thing>(), khai kiểu options, chỉ dùng static register, tách module, để container dựng provider; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_MUTATION_IDEMPOTENT:
  title: "Effectful client command lacks transaction-owned idempotency"
  title_vi: "Lệnh có tác dụng phụ thiếu khóa chống lặp trong giao dịch"
  meaning_vi: "Lệnh được đánh dấu Effectful thiếu idempotencyKey bắt buộc, đầu vào không kiểm tra giới hạn khóa, hoặc đường gọi từ handler đến miền không trả về Inbox.runClient trong giao dịch EntityManager của miền."
  causes_vi:
    - "Không khai báo pattern idempotency nên thiếu kiểm chứng kịch bản chống lặp"
    - "Khóa tùy chọn hoặc không được kiểm tra ở cửa vào"
    - "Dịch vụ gọi runClient ngoài giao dịch hoặc truyền manager dùng chung"
    - "Handler bỏ khóa khi chuyển yêu cầu vào miền"
  nextStep_vi: "Khai báo pattern idempotency, giữ khóa bắt buộc đã được kiểm tra, chuyển nguyên khóa vào miền, trả về giao dịch miền và runClient với manager của callback; không tắt luật."
  owner: op-retry
  kind: check-finding

BE_OPERATION_CONTRACT:
  title: "A versioned operation has no typed contract"
  title_vi: "Thao tác có phiên bản không có hợp đồng kiểu"
  meaning_vi: "Mỗi thao tác `<tên>@<phiên bản>` của một app được khai báo đúng một lần trong bảng thao tác có kiểu `apps/<app>/src/operations.ts` (`OperationContract<Input, Output, RefusalCode>` đăng ký bằng `defineOperations`), với schema zod có chặn trên cho đầu vào và đầu ra, xuất từ tệp `*.schema.ts` của chính chủ sở hữu (R304 và R305). Bộ kiểm tra thấy một mục thiếu schema có tên, hoặc kiểu suy ra là `any`, `unknown`, `Record<string, unknown>`, kiểu generic chưa gán, hàm hoặc `Date`; mã từ chối không phải hợp các chuỗi literal đóng; hoặc route phục vụ bảng không nhận `OperationRequest<Table>` và trả `Promise<OperationReply<Table>>` của cùng một bảng, hoặc body của route chưa gắn `OperationValidationPolicy` dựng từ đúng bảng đó nên pipe toàn cục không có lớp nào để kiểm."
  causes_vi:
    - "Đầu vào hoặc kết quả của thao tác khai báo là `unknown` nên client phải tự gõ kiểu tay"
    - "Mã từ chối khai báo là `string` thay vì hợp các literal như `\"DENIED\" | \"INVALID\"`"
    - "Route nhận `@Body() body: unknown` hoặc chỉ dùng một nửa `OperationRequest` / `OperationReply`"
    - "Body của route chỉ gõ bằng `OperationRequest<Table>` mà không có `@Body(new OperationValidationPolicy(OPERATIONS))` của cùng bảng, nên không ai kiểm giá trị lúc chạy"
  nextStep_vi: "Khai báo schema zod có tên và có chặn trên cho đầu vào và đầu ra của từng thao tác trong tệp `*.schema.ts`, liệt kê mã từ chối bằng hợp literal, và cho route nhận `@Body(new OperationValidationPolicy(OPERATIONS)) request: OperationRequest<typeof OPERATIONS>` và trả `Promise<OperationReply<typeof OPERATIONS>>`; chạy `starci app emit` để sinh `contracts/<app>/openapi.json`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục BE-OPERATIONS-1; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_OUTBOX_WRITE_TX:
  title: "The outbox is written by a domain service inside its transaction"
  title_vi: "Outbox bị ghi ngoài domain hoặc không trong transaction"
  meaning_vi: "`eventBus.publish(event, tx)` hoặc `enqueueX(payload, tx)` của một queue được gọi ngoài `modules/domain`, hoặc đối số `tx` không phải manager của transaction đang chạy (manager dùng chung được inject, một bí danh, manager ở ngoài hoặc thiếu đối số)."
  causes_vi:
    - "Vi phạm luật R152: một sự kiện hoặc job là hệ quả của thay đổi miền; dòng outbox phải cùng commit hoặc cùng rollback với thay đổi đó, nên chỉ domain service ghi và chỉ trong transaction của nó."
    - "Handler, consumer, integration hoặc platform tự phát sự kiện, hoặc gọi `publish` bằng manager ngoài transaction làm sự kiện bị mất hoặc phát dù giao dịch đã rollback."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đưa việc phát sự kiện vào domain service, gọi trong `this.entityManager.transaction(async (manager) => { ... })` và truyền đúng `manager` đó; handler hay consumer chỉ gọi domain service."
  owner: op-retry
  kind: check-finding

BE_PATTERN_SPEC_MISSING:
  title: "A declared pattern has its proof scenarios on the test world"
  title_vi: "Pattern đã khai báo thiếu kịch bản chứng minh trên test world"
  meaning_vi: "hfs.json khai báo một pattern (event-bus, queue, ...) nhưng không có spec e2e hoặc integration nào có test mang tiêu đề `<pattern>/<kịch bản>: ...` cho một kịch bản bắt buộc của pattern đó."
  causes_vi:
    - "Vi phạm luật R155: phân tích tĩnh chỉ chứng minh hình dạng; hành vi (giao lại rồi vào dead letter, fencing token từ chối worker cũ, outbox chỉ phát sau commit) chỉ được chứng minh bằng kịch bản chạy thật trên test world."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết spec e2e hoặc integration có test tiêu đề `<pattern>/<kịch bản>: ...` chạy trên `useTestWorld` cho từng kịch bản còn thiếu."
  owner: op-retry
  kind: check-finding

BE_PROJECTION_SHAPE:
  title: "A projection speaks recompute and get, hides its entity, and the api only reads"
  title_vi: "Projection có phương thức ngoài recompute/get, lộ entity hoặc api gọi recompute"
  meaning_vi: "Một phương thức public của projection không phải `recompute*` hay `get*`, `index.ts` của projection export entity, hoặc một feature loại api gọi `recompute*`."
  causes_vi:
    - "Vi phạm luật R162: projection chỉ làm hai việc, tính lại bảng từ sự kiện nguồn hoặc đọc nó; entity không được lộ để nơi khác không phụ thuộc hình dạng bảng; api chỉ đọc, còn reactor hoặc job giữ bảng luôn mới."
    - "Thêm một phương thức `set` hay `update` vào projection, hoặc export entity qua index để tiện đọc."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi tên phương thức theo `recompute*`/`get*` (hoặc chuyển logic về domain service), bỏ export entity khỏi `index.ts`, và để reactor hoặc job gọi `recompute*`."
  owner: op-retry
  kind: check-finding

BE_PROJECTION_WRITE_OWNER:
  title: "A read-model table is written only by its own projection"
  title_vi: "Bảng read model bị ghi ngoài projection của nó"
  meaning_vi: "Một lệnh ghi vào entity của projection nằm ngoài tệp `<name>.projection.ts` cùng thư mục."
  causes_vi:
    - "Vi phạm luật R161: read model chỉ có một người ghi là `recompute*` của projection, idempotent và có thể replay từ sự kiện nguồn; ghi từ nơi khác làm bảng lệch khỏi nguồn mà replay không sửa được."
    - "Một domain service hoặc handler cập nhật thẳng bảng projection để nhanh."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ lệnh ghi, để reactor hoặc job gọi `recompute*` của projection, và đọc qua `get*`."
  owner: op-retry
  kind: check-finding

BE_PUBLIC_CONTRACT_FORM:
  title: "Public contract form invalid"
  title_vi: "Dạng hợp đồng công khai sai"
  meaning_vi: "Hợp đồng công khai của backend không được khai báo theo dạng được yêu cầu (ví dụ kiểu inline)."
  causes_vi:
    - "Viết kiểu ngay tại tham số thay vì khai báo tên riêng"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_PUBLIC_REASON_CLOSED:
  title: "PublicReason differs from the closed public vocabulary"
  title_vi: "PublicReason khác danh sách lý do công khai cố định"
  meaning_vi: "Enum PublicReason của domain/identity hoặc lý do trên cửa công khai không thuộc đúng bốn tên Health, AuthHandshake, SignedWebhook và CatalogRead."
  causes_vi:
    - "Vi phạm R290: ứng dụng thêm lý do riêng như ToolToken hoặc ApiKey, hoặc bỏ một lý do chuẩn khỏi enum PublicReason."
  nextStep_vi: "Giữ đúng bốn thành viên chuẩn của PublicReason; xác thực route dùng API key hoặc tool token bằng guard riêng thay vì thêm lý do công khai."
  owner: op-retry
  kind: check-finding

BE_PUBLIC_SURFACE:
  title: "Owner public surface violated"
  title_vi: "Bề mặt công khai của owner bị vi phạm"
  meaning_vi: "Một import chui vào tệp bên trong owner khác thay vì đi qua index.ts của owner, một import cùng owner lại đi vòng qua index.ts của chính nó, một index.ts lồng nhau (không nằm ở gốc owner), hoặc index.ts không chỉ gồm các dòng export { } / export type { } có tên (export *, khai báo, import, export default) hoặc export quá nhiều tên."
  causes_vi:
    - "Import theo đường dẫn sâu như @modules/domain/plan/plan.service"
    - "Import cùng owner theo ./index hoặc ../index thay vì tệp khai báo ký hiệu"
    - "index.ts nằm trong thư mục con của owner, ví dụ persistence/index.ts"
    - "index.ts dùng export * hoặc chứa khai báo, hoặc vượt số export cho phép"
  nextStep_vi: "Import owner khác qua index.ts của nó, import cùng owner bằng đường dẫn tương đối tới tệp khai báo, mỗi owner chỉ một index.ts ở gốc và liệt kê tường minh những gì owner cung cấp; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_QUERY_IN_LOOP:
  title: "Query inside a loop (N+1)"
  title_vi: "Truy vấn chạy trong vòng lặp (N+1)"
  meaning_vi: "Một lệnh đọc trên EntityManager (find, findOne, count, exists...) chạy một lần cho mỗi phần tử của vòng lặp for hoặc của map, forEach, flatMap, nên số lượt gọi cơ sở dữ liệu tăng theo đầu vào và một yêu cầu lớn giữ kết nối rất lâu."
  causes_vi:
    - "for (const id of ids) { await manager.findOne(...) }"
    - "Promise.all(ids.map((id) => manager.findOneBy(Entity, { id })))"
  nextStep_vi: "Đọc một lần trước vòng lặp bằng find({ where: { khóa: In(danhSachKhoa) }, take }) hoặc WHERE khóa = ANY($1), dựng Map theo khóa rồi tra trong vòng lặp; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_QUERY_UNBOUNDED:
  title: "Read without a row bound"
  title_vi: "Truy vấn đọc không có giới hạn số dòng"
  meaning_vi: "Một lệnh find, findBy hoặc findAndCount trên EntityManager có thể trả về mọi dòng khớp mà không nêu take trong đối tượng tùy chọn, nên một khách hàng lớn biến nó thành quét toàn bảng nằm trong bộ nhớ."
  causes_vi:
    - "manager.find(Entity, { where }) không có take"
    - "findBy không thể mang giới hạn"
    - "Tùy chọn find là biến, không viết take ngay tại chỗ gọi"
  nextStep_vi: "Viết take với hằng có tên ngay trong đối tượng tùy chọn (manager.find(Entity, { where, take: LIST_ROWS_MAX })), hoặc phân trang theo con trỏ; câu SELECT thô do máy kiểm tra R86 xét; việc cần đủ mọi dòng (batch, xuất) lặp theo trang keyset chứ không cắt cụt kết quả âm thầm. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_QUEUE_PRODUCER_SHAPE:
  title: "A queue producer writes the outbox with its own tx parameter"
  title_vi: "Producer của queue ghi outbox không bằng tham số tx của nó"
  meaning_vi: "Một hàm hoặc phương thức export trong `<queue>.queue.ts` ghi vào `QueueOutbox` mà không khai báo tham số `tx: EntityManager` hoặc không truyền chính tham số đó làm đối số đầu."
  causes_vi:
    - "Vi phạm luật R154: job được enqueue trong transaction của người gọi (`enqueueX(payload, tx)`), nếu không job có thể chạy dù giao dịch rollback hoặc mất khi commit thành công."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm tham số `tx: EntityManager` vào producer và gọi `outbox.write(tx, ...)`."
  owner: op-retry
  kind: check-finding

BE_RAW_INJECT:
  title: "Infrastructure dependency injected without its Inject*() decorator"
  title_vi: "Phụ thuộc hạ tầng không được tiêm qua Inject*()"
  meaning_vi: "Mọi tham số constructor có kiểu thuộc hạ tầng (EntityManager, CommandBus, Clock, Logger, Cache, HttpClient, options của module, client SDK) phải mang một decorator Inject<Thing>() không tham số, export từ <owner>.decorators.ts và dựng bằng injector<T>(token) trên token unique symbol. Bộ kiểm tra thấy @Inject( thô ngoài *.decorators.ts, token chuỗi, forwardRef, ModuleRef, tiêm qua thuộc tính, injector sai hình hoặc kiểu T khác kiểu tham số. Token của Inject<Thing>() mà một service dùng cũng phải được export (từ <cap>.decorators.ts hoặc index.ts của năng lực) để spec có thể cung cấp nó."
  causes_vi:
    - "Token của Inject<Thing>() là const riêng tư, không export"
    - "@Inject(TOKEN) viết thẳng ở nơi dùng"
    - "Token là chuỗi thay vì unique symbol"
    - "Tiêm lớp hạ tầng (CacheService, AppLogger) không qua injector"
    - "Dùng ModuleRef.get hoặc forwardRef để né vòng phụ thuộc"
    - "constructor(private readonly timeoutMs: number) {} hoặc ReadonlyMap<string, X> không có Inject<Thing>() gắn token có tên"
  nextStep_vi: "Khai báo token `export const THING: unique symbol = Symbol(\"<owner>.<thing>\")` và `export const InjectThing = (): TypedParameterDecorator<Thing> => injector<Thing>(THING)` trong <owner>.decorators.ts rồi dùng @InjectThing() ở mọi nơi; vòng phụ thuộc là lỗi kiến trúc cần gỡ, không dùng forwardRef. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_READONLY_BOUNDARY:
  title: "Readonly boundary violated"
  title_vi: "Vi phạm ranh giới chỉ-đọc"
  meaning_vi: "Thông điệp hoặc phụ thuộc được tiêm không được đánh dấu readonly hoặc có setter."
  causes_vi:
    - "Thiếu readonly trên trường"
    - "Có setter hay index signature"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_READY_REAL:
  title: "Readiness does not probe a required dependency"
  title_vi: "Readiness chưa kiểm tra phụ thuộc bắt buộc"
  meaning_vi: "Endpoint readiness có thể trả thành công khi phụ thuộc bắt buộc không sẵn sàng."
  causes_vi:
    - "Readiness dùng lại liveness hoặc không có probe phụ thuộc với timeout hữu hạn"
  nextStep_vi: "Gọi probe của phụ thuộc bắt buộc, giới hạn thời gian chờ và trả unavailable khi probe lỗi hoặc hết hạn."
  owner: op-retry
  kind: check-finding

BE_REALTIME_SHAPE:
  title: "A realtime file is not exactly one push door"
  title_vi: "Tệp realtime không phải đúng một cửa đẩy tin"
  meaning_vi: "Mỗi tệp realtime là đúng một cửa theo vai trò của tên tệp: `<kênh>.gateway.ts` có một lớp `@WebSocketGateway` với các handler `@SubscribeMessage`, còn `<x>.subscription.ts` có một lớp `@Resolver` với các thao tác `@Subscription`. Không có query, mutation, field resolver, route REST hoặc giao thức còn lại trong cùng tệp."
  causes_vi:
    - "Tệp có hai lớp cửa hoặc không có lớp cửa nào"
    - "Cửa không có handler @SubscribeMessage hoặc @Subscription nào"
    - "Resolver của subscription chứa thêm @Query hoặc @Mutation"
    - "Gateway và subscription bị trộn trong một tệp"
  nextStep_vi: "Tách thành đúng một cửa cho mỗi tệp và đặt tên theo vai trò (.gateway.ts cho socket, .subscription.ts cho GraphQL subscription); chuyển query, mutation hoặc route REST sang một feature api. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/realtime.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_REALTIME_TOPIC_SCOPE:
  title: "A realtime topic is not scoped to the principal"
  title_vi: "Chủ đề realtime không gắn với chủ thể đăng nhập"
  meaning_vi: "Chủ đề mà handler realtime truyền cho `RealtimeHub.subscribe` phải được dựng từ tham số `@CurrentPrincipal()` của domain/identity, để một client chỉ nghe được kênh thuộc về chủ thể của nó. Chủ đề lấy hoàn toàn từ đầu vào client là lỗ hổng rò rỉ dữ liệu của người khác."
  causes_vi:
    - "Chủ đề là một chuỗi cố định dùng chung cho mọi client"
    - "Chủ đề chỉ ghép từ tham số do client gửi"
    - "Handler không nhận @CurrentPrincipal() hoặc dùng decorator trùng tên của owner khác"
  nextStep_vi: "Thêm tham số `@CurrentPrincipal() principal` vào handler và dựng chủ đề từ principal.id (cộng với mã đã kiểm tra quyền sở hữu nếu cần). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/realtime.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_REALTIME_WRITES:
  title: "A realtime door can write"
  title_vi: "Cửa realtime có khả năng ghi dữ liệu"
  meaning_vi: "Cửa realtime chỉ đọc và đẩy tin: giá trị duy nhất được tiêm vào là `RealtimeHub` của platform/realtime. EntityManager, bus lệnh, hàng đợi, event bus hoặc service miền (có thể ghi) không bao giờ được tiêm vào cửa này; tin đẩy do một reactor gọi hub, không do cửa."
  causes_vi:
    - "Gateway tiêm EntityManager hoặc CommandBus để cập nhật dữ liệu khi nhận tin của client"
    - "Subscription tiêm service miền để đọc, nhưng service đó có phương thức ghi"
    - "Cửa tiêm một lớp giả danh RealtimeHub do owner khác khai báo"
  nextStep_vi: "Bỏ mọi thứ khác ngoài RealtimeHub khỏi cửa; việc ghi thuộc về một feature api, và nguồn dữ liệu đẩy đi do một reactor (transport/message) gọi RealtimeHub.publish sau khi sự kiện đến. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và knowledge/patterns/be/realtime.yaml; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_REST_DOOR_EVIDENCE:
  title: "A REST route has no route-level reason"
  title_vi: "Route REST thiếu lý do ngay tại phương thức"
  meaning_vi: "Mỗi route REST trong cả lite và full phải chứng minh mục đích được phép của chính phương thức: probe, bắt tay xác thực, webhook đã ký, luồng byte thật hoặc bảng thao tác công khai có phiên bản. Import StreamableFile hoặc lý do ở cấp lớp không chứng minh route trả JSON."
  causes_vi:
    - "Controller trả JSON nhưng không có bằng chứng tại route"
    - "Một route khác hoặc import không dùng được lấy làm lý do cho cả controller"
  nextStep_vi: "Chuyển thao tác dữ liệu sang GraphQL hoặc khai báo bằng chứng hợp lệ ngay tại route; với API công khai có phiên bản, phục vụ bảng defineOperations có kiểu."
  owner: op-retry
  kind: check-finding

BE_REST_ROUTE_UNDECLARED:
  title: "A public REST route is absent from the operation table"
  title_vi: "Route REST công khai chưa thuộc bảng thao tác"
  meaning_vi: "Route REST công khai phải nhận OperationRequest và trả OperationReply của cùng một bảng defineOperations có thao tác đã khai báo. Một bảng rỗng, bảng không liên quan hoặc chỉ một nửa kiểu hợp đồng không đăng ký route."
  causes_vi:
    - "Route API công khai được viết riêng ngoài defineOperations"
    - "Đầu vào và đầu ra không dùng cùng một bảng thao tác"
  nextStep_vi: "Khai báo thao tác có kiểu trong bảng của ứng dụng và cho route nhận OperationRequest<typeof TABLE>, trả Promise<OperationReply<typeof TABLE>> của chính bảng đó."
  owner: op-retry
  kind: check-finding

BE_RETURN_TYPE:
  title: "Handler or public method without a return type"
  title_vi: "Handler hoặc phương thức công khai thiếu kiểu trả về"
  meaning_vi: "Một handler (Query, Mutation, Get, Post...) hoặc phương thức công khai của Injectable, Resolver, Controller không khai báo kiểu trả về, nên hợp đồng ra ngoài là thứ thân hàm tình cờ trả về hôm nay."
  causes_vi:
    - "Resolver hoặc controller method không có : Promise<T>"
    - "Phương thức công khai của service để kiểu suy luận"
  nextStep_vi: "Khai báo kiểu trả về tường minh (Promise<Type>). Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SAGA_CONSUMER_DEDUPE:
  title: "A saga consumer passes the delivery id on"
  title_vi: "Consumer của saga không chuyển id lần giao đi tiếp"
  meaning_vi: "Một `transport/message/<event>.consumer.ts` của feature có saga không đọc `message.eventId` để đưa vào lệnh nó gửi."
  causes_vi:
    - "Vi phạm luật R172: saga nhận mọi sự kiện qua inbox (R80), nên consumer phải chuyển khoá chống trùng (id lần giao) cho lệnh."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đưa `message.eventId` vào yêu cầu của lệnh để saga claim qua inbox."
  owner: op-retry
  kind: check-finding

BE_SAGA_E2E_MISSING:
  title: "Every compensation path has an e2e spec that injects a failure"
  title_vi: "Đường bù trừ của saga chưa có spec e2e chèn lỗi"
  meaning_vi: "Một bù trừ của saga không có spec e2e (qua `useTestWorld`) nêu tên sự kiện của nó, hoặc spec đó không chèn lỗi nào qua world (`during`, `cut`, `latency`, `failNext`, `interruptDatabase`)."
  causes_vi:
    - "Vi phạm luật R173: đường bù trừ được chứng minh dưới lỗi thật, không chỉ trên luồng thuận."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: viết spec e2e cho đường bù trừ, cắt một hạ tầng (hoặc app) khi sự kiện thất bại tới, rồi đọc trạng thái đã bù trừ."
  owner: op-retry
  kind: check-finding

BE_SAGA_EVENT_CONTRACT:
  title: "Every event of a saga step and compensation is in a vendored contract"
  title_vi: "Sự kiện của bước saga không nằm trong hợp đồng hoặc bù trừ không khớp"
  meaning_vi: "Một bước hoặc bù trừ không khai `readonly event = \"<tên>\"`, sự kiện đó không có trong `be/contracts/<service>/events.json`, hoặc hợp đồng của sự kiện bù trừ không khai `compensates` đúng sự kiện của bước cùng tên."
  causes_vi:
    - "Vi phạm luật R171: mọi sự kiện của saga nằm trong hợp đồng đã vendor, và sự kiện thất bại của một bù trừ nói rõ nó hoàn tác sự kiện của bước nào."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: khai sự kiện trong `events.ts` của bên phát (có `compensates`), chạy `starci app emit`, và ghi tên sự kiện vào bước/bù trừ."
  owner: op-retry
  kind: check-finding

BE_SAGA_STATE_VERSIONED:
  title: "The persisted state of a saga run carries a version and goes through the fenced store"
  title_vi: "Trạng thái saga không có phiên bản hoặc không đi qua kho có rào"
  meaning_vi: "Orchestrator không có `<saga>.saga-state.ts`, kiểu trạng thái xuất ra không khai `status` và `version: number`, hoặc orchestrator không dùng kho có rào của `platform/saga`."
  causes_vi:
    - "Vi phạm luật R170: trạng thái một lần chạy saga được lưu cùng phiên bản (rào), mọi chuyển trạng thái nêu phiên bản đã đọc, nên một lần giao lại \"xác sống\" không thể chuyển hai lần."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: khai kiểu trạng thái có `status` và `version`, và chuyển trạng thái qua `SagaService` của `platform/saga`."
  owner: op-retry
  kind: check-finding

BE_SAGA_STEP_COMPENSATION:
  title: "Every saga step has a compensation and the orchestrator lists them"
  title_vi: "Bước saga thiếu bù trừ hoặc orchestrator không liệt kê đủ"
  meaning_vi: "Một bước `saga/steps/<step>.step.ts` không có `saga/compensations/<step>.compensation.ts` (hoặc ngược lại), thư mục saga không có orchestrator `<saga>.saga.ts`, hoặc orchestrator không import đủ mọi bước và mọi bù trừ của thư mục."
  causes_vi:
    - "Vi phạm luật R169: mỗi bước tiến của saga có đúng một bù trừ cùng tên; orchestrator liệt kê tất cả, nên không có bước nào chạy mà không có đường lùi."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm bù trừ cho bước (một lệnh hoàn tác) và import nó trong orchestrator; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_SCHEMA_AUTHORITY:
  title: "Schema defined at runtime"
  title_vi: "Schema được định nghĩa lúc chạy"
  meaning_vi: "Một tệp để tiến trình đang chạy quyết định schema: một đối tượng tùy chọn của DataSource hoặc TypeORM không ghi literal synchronize: false, synchronize khác false, gọi dataSource.synchronize() hoặc dropDatabase(), có khóa migrationsRun (cấm dưới mọi dạng), gọi runMigrations() ngoài cli (lệnh migrate của apps/cli) và test world, dropSchema khác false, dựng schema bằng createSchemaBuilder()/build(), khóa synchronize trong tùy chọn của @Entity, hook onModuleInit/onApplicationBootstrap ghi dữ liệu qua EntityManager hoặc DataSource (seed chỉ chạy bằng một lệnh cli), chuỗi DDL (CREATE/ALTER/DROP TABLE, INDEX, TYPE, SCHEMA, EXTENSION, TRIGGER, FUNCTION, ADD/DROP CONSTRAINT...) ngoài persistence/migrations/, hoặc tìm entity và migration bằng glob. Schema chỉ đổi bằng migration do lệnh cli migrate chạy."
  causes_vi:
    - "new DataSource({ type: 'postgres' }) không ghi synchronize: false"
    - "synchronize: true, hoặc đọc từ biến môi trường"
    - "Chuỗi DDL trong .query ngoài migration"
    - "dropSchema: true, hoặc dataSource.createSchemaBuilder().build() lúc chạy"
    - "@Entity({ synchronize: false }): công tắc riêng cho từng entity"
    - "onModuleInit ghi dữ liệu bằng entityManager.save/insert/query INSERT: seed lúc khởi động ở mọi tiến trình"
    - "dataSource.runMigrations() gọi ngoài cli (lệnh migrate của apps/cli)"
    - "entities hoặc migrations khai bằng đường dẫn có ký tự *"
  nextStep_vi: "Viết một migration trong persistence/migrations/ của capability sở hữu bảng và liệt kê entity, migration tường minh; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SCHEMA_BOUNDED:
  title: "A zod schema has an unbounded string, collection or open value"
  title_vi: "Schema zod có chuỗi, tập hợp hoặc giá trị mở không giới hạn"
  meaning_vi: "Schema ở `<file>` có `z.string()` (hoặc `z.email()`, `z.url()`) không có `.max(n)`/`.length(n)`, `z.array()`/`z.set()` không có `.max(n)`/`.length(n)`/`.size(n)`, `z.record()`/`z.map()` không giới hạn số phần tử bằng `.refine`/`.check`, hoặc dùng `z.any()`, `z.unknown()`, `z.json()`; hoặc giới hạn vô nghĩa như `Infinity`, `0`, `Number.MAX_*`."
  causes_vi:
    - "Vi phạm luật R305: mảng không giới hạn mà mọi phần tử đều lỗi sẽ cấp phát một issue cho từng phần tử (GHSA-mrhx-c7xc-m3w5), còn chuỗi không giới hạn là chi phí không giới hạn ở mọi phiên bản zod"
    - "Schema mô tả dữ liệu ngoài bằng `z.any()` hoặc `z.unknown()` nên thực chất không kiểm gì"
  nextStep_vi: "Thêm giới hạn hữu hạn dương cho từng chuỗi và tập hợp (`z.string().max(200)`, `z.array(item).max(100)`), giới hạn số phần tử của record bằng `.refine`, và mô tả hình dạng thật thay cho `z.any()`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SCHEMA_OWNER:
  title: "Entities and migrations live in the owning capability's `persistence/`"
  title_vi: "Entity hoặc migration sai chủ"
  meaning_vi: "Entity/migration `<file>` không nằm dưới `persistence/` của capability sở hữu (hoặc sai tên)."
  causes_vi:
    - "Vi phạm luật R35: Entity + migration nằm trong `<capability>/persistence/` của capability sở hữu bảng, có `connection.ts` khai báo hai mảng `<c>Entities` và `<c>Migrations` (không có `CONNECTION`); connection của capability là connection mà app đăng ký hai mảng đó vào `DatabaseModule.register`: đúng một connection khai trong `hfs.json` ở mọi app, và mọi `Inject<Conn>EntityManager` trong capability phải là connection ấy; tên migration `<epochMs13>-<kebab>.ts`, class `<Pascal><epochMs13>`, thuộc tính `name` bằng tên class; `index.ts` của owner export `<c>Entities` và `<c>Migrations`, app compose."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_SCHEMA_PLACE:
  title: "A zod schema is outside its zone"
  title_vi: "Schema zod đặt sai vùng"
  meaning_vi: "Tệp `<file>` import `zod` ngoài tệp `<name>.schema.ts` của một chủ sở hữu domain, platform hoặc integrations; hoặc import `zod` trong feature, cửa transport hay thư mục `dto/`; hoặc tệp schema còn import `class-validator`, `class-transformer` hay `@nestjs/graphql`."
  causes_vi:
    - "Vi phạm luật R304: đầu vào của cửa transport được class-validator kiểm (R42), còn dữ liệu không đi qua DTO (phản hồi của nhà cung cấp, đầu ra có cấu trúc của mô hình, payload hàng đợi hoặc outbox đọc lại) mới đi qua schema zod của chủ sở hữu"
    - "Schema zod viết thẳng trong service, mapper hay lớp DTO thay vì tệp `<name>.schema.ts`"
  nextStep_vi: "Chuyển schema sang `<name>.schema.ts` cạnh bộ đọc trong chủ sở hữu domain, platform hoặc integrations, để bộ đọc import schema (và kiểu suy ra) từ đó và ánh xạ lỗi parse sang họ lỗi của chủ sở hữu; đầu vào của cửa transport dùng class-validator. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SECRET_DEFAULT:
  title: "Literal default for a secret or URL"
  title_vi: "Giá trị mặc định cố định cho bí mật hoặc URL"
  meaning_vi: "Một giá trị kiểu Secret hoặc Url của platform/config có giá trị mặc định: đối số mặc định cho env.secret/url/host, toán tử ??, || hay ??= trên giá trị đó, hoặc chuỗi mặc định (\"\", localhost, 127.0.0.1, 0.0.0.0, http(s)://...) đưa vào hàm đọc trả về Secret hay Url. Thiếu biến thì app phải dừng khi boot, nêu tên khóa."
  causes_vi:
    - "env.secret(\"K\", \"dev\") hoặc env.url(\"K\", \"http://localhost\")"
    - "secret ?? new Secret(\"dev\") hoặc url || \"http://localhost:3000\""
    - "Hàm đọc trả về Secret hay Url được gọi với giá trị mặc định viết sẵn"
  nextStep_vi: "Bỏ giá trị mặc định, để phần kiểm tra cấu hình báo lỗi nêu tên khóa khi thiếu; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SECURITY_HEADERS:
  title: "API security headers are missing or x-powered-by is enabled"
  title_vi: "API thiếu header bảo mật hoặc còn bật x-powered-by"
  meaning_vi: "Entrypoint chưa áp dụng middleware header bảo mật của platform/http-security và tắt thông tin framework."
  causes_vi:
    - "Thiếu middleware bảo mật hoặc chưa tắt x-powered-by"
  nextStep_vi: "Áp dụng middleware của platform/http-security và disable x-powered-by trước khi phục vụ yêu cầu."
  owner: op-retry
  kind: check-finding

BE_SERVICE_ISOLATION:
  title: "A service app imports no sibling service app"
  title_vi: "Ứng dụng dịch vụ import trực tiếp ứng dụng dịch vụ anh em"
  meaning_vi: "Một tệp dưới `be/apps/<service>/` import (đường dẫn tương đối hoặc alias) một tệp dưới `be/apps/<other>/`, nên hai dịch vụ dính vào nhau thành một khối triển khai."
  causes_vi:
    - "Vi phạm luật R168: các dịch vụ chỉ dùng chung thư viện `be/src` và gặp nhau qua đường truyền (client API của dịch vụ kia, hoặc sự kiện theo hợp đồng đã vendor dưới `be/contracts/<service>/`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ import, đưa phần dùng chung vào `be/src` hoặc gọi dịch vụ kia qua client/sự kiện của hợp đồng."
  owner: op-retry
  kind: check-finding

BE_SOURCE_FORM:
  title: "Back-end source file breaks the naming or form canon"
  title_vi: "Tệp nguồn BE sai quy ước tên hoặc hình thức"
  meaning_vi: "Tên tệp phải là kebab-case với hậu tố vai trò trong danh sách đóng của slots.yaml; chỉ export có tên (không export default); mọi export và thành viên công khai có JSDoc tiếng Anh; không emoji, và không có chữ tiếng Việt trong định danh, chuỗi ký tự, chú thích hay tên test ngoài catalog messages/ và slot fixture i18n; mã production không khai báo lớp, hàm hay hằng export có từ Mock, Fake hoặc Stub trong tên (đồ giả nằm trong spec hoặc src/tests; driver ngoại tuyến là adapter điều khiển bằng options, đặt tên theo việc nó làm)."
  causes_vi:
    - "class MockExpertAgentService trong mã production thay vì adapter điều khiển bằng options"
    - "Tệp dùng hậu tố bị cấm (use-case, repository, store, util, helper, types, constants)"
    - "Lớp export không kết thúc bằng hậu tố vai trò của tệp và cũng không kết thúc bằng tên port (interface trong *.port.ts hoặc *.contracts.ts) mà nó implements"
    - "Interface trong tệp *.input.ts, *.request.ts, *.response.ts, *.type.ts, *.args.ts hoặc *.rows.ts không kết thúc bằng Input, Request, Response, Type, Args hoặc Row"
    - "@Args dùng tên khác \"input\""
    - "Export default"
    - "Thiếu JSDoc trên export"
    - "Chú thích tiếng Việt trong mã"
  nextStep_vi: "Đổi tên tệp theo vai trò trong danh sách đóng, chuyển kiểu vào <tên>.contracts.ts, thêm JSDoc tiếng Anh và bỏ export default. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_SPEC_FORM_ALL_ROLES:
  title: "A logic-role unit spec does not prove behavior through its declared subject"
  title_vi: "Spec của vai trò logic không chứng minh hành vi qua đối tượng đã khai báo"
  meaning_vi: "Spec của policy, mapper, guard, client và các vai trò logic phải lấy đối tượng từ Nest testing module đã compile với provider rõ ràng, không new đối tượng hay mock module. Chỉ expect(x).toBeDefined() không chứng minh kết quả hay trạng thái."
  causes_vi:
    - "Spec new đối tượng kiểm thử hoặc mock module của ứng dụng"
    - "Spec chỉ kiểm tra đối tượng tồn tại"
  nextStep_vi: "Dựng đối tượng bằng Test.createTestingModule với provider và double phù hợp, lấy bằng moduleRef.get, gọi hành vi rồi so sánh kết quả hoặc trạng thái cụ thể."
  owner: op-retry
  kind: check-finding

BE_SPEC_PLACEMENT:
  title: "A back-end spec lives in one of the four test layers"
  title_vi: "Spec đặt ngoài bốn tầng test"
  meaning_vi: "Tệp spec hoặc test `<f>` nằm ngoài bốn tầng test của back end (kể cả trong `scripts/` hoặc `tools/`)."
  causes_vi:
    - "Vi phạm luật R102: spec đơn vị là `<name>.service.spec.ts` cạnh service của nó; spec tích hợp, e2e và contract nằm dưới `src/tests/{integration,e2e,contract}`. Mọi `*.spec.*`, `*.test.*`, `*-spec.*` khác là vi phạm; script vận hành và công cụ không mang spec."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chuyển spec vào tầng đúng hoặc xóa nó; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_SPEC_QUALITY:
  title: "Spec reads source, or an e2e breaks its flow shape"
  title_vi: "Spec đọc mã nguồn hoặc e2e phá dạng luồng"
  meaning_vi: "Một spec đọc mã nguồn của repo bằng fs để kiểm tra chữ, một spec chỉ khẳng định lời gọi thay vì kết quả, hoặc một e2e đi vòng qua transport, ngủ theo thời lượng, rẽ nhánh trong bước, tự dựng module, gọi nhà cung cấp mô hình hay không đọc lại trạng thái đã lưu. Ép kiểu (as, x!) trong spec do các luật mượn của typescript-eslint chặn, cùng mã BE_TYPE_ESCAPE. Một spec của bất kỳ tầng nào bỏ qua hoặc đánh dấu test (skip, skipIf, runIf, todo, only, xit, xdescribe, xtest) hay chọn runner theo điều kiện cũng bị chặn; việc bỏ qua duy nhất là của contract helper trong world khi thiếu cấu hình sandbox."
  causes_vi:
    - "readFileSync hay readdirSync trên mã nguồn hoặc __dirname trong spec"
    - "Spec chỉ có toHaveBeenCalled*, không khẳng định kết quả hay trạng thái"
    - "`it.skip`, `describe.skip`, `xit`, `it.todo`, `.skipIf`/`.runIf` hoặc `(cond ? describe : describe.skip)` trong spec; hãy viết test thật hoặc xóa nó, còn việc bỏ qua khi thiếu sandbox nằm trong contract helper của world (`sandbox.describe(...)`)"
    - "e2e gọi CommandBus, QueryBus hay handler trực tiếp; dùng sleep thay cho waitFor; tự gọi Test.createTestingModule; import SDK của nhà cung cấp mô hình; không đọc lại dòng đã lưu qua EntityManager"
    - "Spec đơn vị của service khẳng định `expect.any(String)`, `expect.any(Number)` hoặc `expect.any(Date)` cho giá trị service tự sinh; service nhận bộ sinh id và đồng hồ qua token, spec cấp `fakeIds()` và `new FakeClock(...)` từ @starci/jest-preset rồi khẳng định đúng giá trị"
    - "Spec đơn vị của service có providers khác với phụ thuộc constructor: thừa nhà cung cấp, thiếu nhà cung cấp, service không đứng đầu, token không suy ra được hoặc nhà cung cấp không phải lớp hay { provide, useValue }"
  nextStep_vi: "Chuyển luật kiến trúc sang lint hoặc bộ kiểm tra; khẳng định kết quả hoặc trạng thái; e2e vào bằng transport thật, chờ bằng waitFor và dựng thế giới ở src/tests/e2e/setup. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SQL_INTERPOLATED:
  title: "SQL text built from a runtime value"
  title_vi: "Giá trị chạy lúc chạy bị ghép vào chuỗi SQL"
  meaning_vi: "Một phép thế trong thẻ sql không có kiểu SqlIdent, hoặc một lời gọi .query(...) có chuỗi SQL dựng bằng template hoặc phép cộng chuỗi, nên đầu vào có thể trở thành câu lệnh (SQL injection) và kế hoạch truy vấn không được dùng lại."
  causes_vi:
    - "Template literal có ${biến} trong câu SQL"
    - "Ghép chuỗi SQL bằng dấu +"
    - "Thẻ sql nhận một phép thế không có kiểu SqlIdent (một chuỗi thường, một số)"
  nextStep_vi: "Truyền giá trị bằng tham số đánh số ($1, $2) ở mảng đối số; tên cột hoặc bảng động đi qua ident(tên, danhSáchChoPhép), phép thế duy nhất thẻ sql chấp nhận; câu lệnh là hằng SqlText trong persistence/<tên>.sql.ts chứ không ghép ở nơi gọi. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_SQL_OUTSIDE_PERSISTENCE:
  title: "Raw SQL outside persistence/<name>.sql.ts"
  title_vi: "SQL thô ngoài persistence/<name>.sql.ts"
  meaning_vi: "Có câu SQL viết ngoài hằng `sql` trong tệp persistence/<name>.sql.ts của năng lực sở hữu, hoặc `.query()` nhận một chuỗi không phải SqlText, hoặc có createQueryBuilder. SQL rải trong service và handler không được kiểm tra bảng sở hữu và giới hạn đọc."
  causes_vi:
    - "manager.query(\"SELECT ...\") viết thẳng trong handler hoặc service"
    - "createQueryBuilder dùng cho truy vấn phức tạp"
    - "SQL còn nằm trong *.repository.ts kiểu cũ"
  nextStep_vi: "Chuyển câu SQL thành hằng `sql` trong src/modules/<tầng>/<năng lực>/persistence/<tên>.sql.ts, kiểu dòng trả về và hàm ánh xạ ở <tên>.rows.ts, rồi gọi entityManager.query(HẰNG, [tham số]); thay QueryBuilder bằng tùy chọn find hoặc hằng sql. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_SQL_RETURNING_SHAPE:
  title: "UPDATE or DELETE with RETURNING is not wrapped in a SELECT"
  title_vi: "UPDATE hoặc DELETE có RETURNING chưa được bọc trong SELECT"
  meaning_vi: "EntityManager.query của TypeORM trả về câu UPDATE hoặc DELETE có RETURNING dưới dạng [các dòng, số dòng bị ảnh hưởng] chứ không phải danh sách dòng, nên nơi gọi đọc kết quả như danh sách dòng sẽ đọc sai mà unit spec giả lập SQL không thấy được (saga kẹt, kho không được trả). Bộ kiểm tra đọc từng hằng SqlText trong .sql.ts và từ chối câu bắt đầu bằng UPDATE hoặc DELETE mà có RETURNING ở cấp ngoài cùng; INSERT ... RETURNING và RETURNING nằm trong CTE đã bọc thì hợp lệ."
  causes_vi:
    - "UPDATE stock SET ... WHERE ... RETURNING id, qty chạy thẳng bằng manager.query rồi đọc rows[0]"
    - "DELETE ... RETURNING id trả về [rows, count]"
  nextStep_vi: "Viết lại thành WITH changed AS (UPDATE ... RETURNING ...) SELECT ... FROM changed để kết quả luôn là danh sách dòng, và thêm một spec e2e chạy câu lệnh trên cơ sở dữ liệu thật. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_SQL_TABLE_OWNER:
  title: "SQL touches a table outside its capability or context, or reads unbounded"
  title_vi: "SQL ghi bảng ngoài năng lực, đọc bảng ngoài ngữ cảnh hoặc đọc không giới hạn"
  meaning_vi: "Bộ kiểm tra phân tích từng hằng SqlText: câu lệnh ghi (INSERT, UPDATE, DELETE) chỉ được chạm bảng của entity thuộc chính năng lực đó; câu đọc (FROM, JOIN, USING, truy vấn con) chỉ được chạm bảng của chính ngữ cảnh của nó (ngữ cảnh là kết nối mà mảng entity của năng lực được đăng ký), tức bảng của năng lực mình hoặc của năng lực cùng ngữ cảnh mà chủ sở hữu được phép import; một bảng của ngữ cảnh khác, kể cả khi JOIN, bị từ chối vì dữ liệu giữa các ngữ cảnh chỉ đi bằng sự kiện (bản sao cục bộ do reactor cập nhật hoặc projection). SELECT nhiều dòng phải có LIMIT trừ khi lọc theo khóa chính hoặc khóa duy nhất hoặc chỉ tính tổng."
  causes_vi:
    - "Service của năng lực A cập nhật bảng của năng lực B"
    - "JOIN hoặc truy vấn con sang bảng của ngữ cảnh khác (ví dụ order đọc bảng của identity)"
    - "Truy vấn danh sách quên LIMIT"
    - "Bảng chưa có entity khai báo ở năng lực sở hữu"
  nextStep_vi: "Chuyển câu ghi về năng lực sở hữu bảng và gọi qua API công khai của năng lực đó. Với dữ liệu của ngữ cảnh khác: giữ bản sao cục bộ trong ngữ cảnh của mình do reactor cập nhật từ sự kiện, hoặc đọc một projection, rồi JOIN trên bảng cục bộ đó. Thêm LIMIT theo PAGE_SIZE_MAX, LIST_ROWS_MAX hoặc BATCH_ROWS của platform/database. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding



BE_TEST_BUILDER_ARRANGES:
  title: "A test data builder asserts or has a non-deterministic default"
  title_vi: "Builder dữ liệu test khẳng định hoặc có giá trị mặc định không ổn định"
  meaning_vi: "Builder chỉ sắp xếp dữ liệu: không import expect, jest hay @jest/globals, và giá trị mặc định cố định (id từ hằng hoặc fakeIds, ngày cố định) để test lỗi vẫn tái hiện được."
  causes_vi:
    - "expect, jest hoặc mô tả test được dùng trong tệp builder"
    - "Date.now(), new Date() không tham số, Math.random(), randomUUID() hoặc crypto.random* trong builder"
  nextStep_vi: "Trả về đối tượng hoặc dòng và để spec khẳng định; dùng id cố định hoặc fakeIds() và ngày cố định. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TEST_BUILDER_HOME:
  title: "A test data builder is outside the builders folder"
  title_vi: "Builder dữ liệu test nằm ngoài thư mục builders"
  meaning_vi: "Mọi hàm dựng dữ liệu test (hàm được export và tạo dòng trong cơ sở dữ liệu qua EntityManager, DataSource hoặc QueryRunner) chỉ được nằm trong src/tests/fixtures/builders/<khu>.builder.ts; SQL đi kèm nằm trong <khu>.sql.ts cạnh nó. Một mô-đun khác của cây test làm việc này là builder đặt sai chỗ, dù tên nó là gì."
  causes_vi:
    - "Mô-đun trong src/tests/world hoặc src/tests/fixtures (ngoài builders/) export hàm gọi save, insert hoặc upsert, hoặc chạy INSERT, qua EntityManager"
    - "Hàm seed hoặc anOrder viết ngay cạnh spec thay vì trong builders/"
    - "Tên tệp *.repository.ts, *.factory.ts hoặc *.fixture.ts trong src/tests (bị BE_SOURCE_FORM chặn cùng lúc)"
  nextStep_vi: "Chuyển hàm sang src/tests/fixtures/builders/<khu>.builder.ts, chuyển chuỗi SQL sang <khu>.sql.ts cạnh nó, sửa import trong spec. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_TEST_CONSTRAINTS_ON:
  title: "A test switches database constraints off"
  title_vi: "Test tắt hoặc gỡ ràng buộc cơ sở dữ liệu"
  meaning_vi: "Cây src/tests luôn chạy với ràng buộc bật: không tắt khóa ngoại, trigger hay ràng buộc, không hoãn ràng buộc. Builder tạo đủ chuỗi cha thay vì bỏ qua khóa ngoại."
  causes_vi:
    - "session_replication_role, SET CONSTRAINTS ... DEFERRED, DEFERRABLE INITIALLY DEFERRED, ALTER TABLE ... DISABLE hoặc DISABLE TRIGGER trong một câu SQL của cây test"
    - "DROP CONSTRAINT trong SQL, hoặc QueryRunner.dropForeignKey(s), dropCheckConstraint(s), dropUniqueConstraint(s)"
  nextStep_vi: "Bỏ câu lệnh tắt ràng buộc và tạo đủ dòng cha bằng builder. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_TEST_ROW_BY_BUILDER:
  title: "A spec hand-builds rows instead of using a builder"
  title_vi: "Spec tự dựng dòng dữ liệu thay vì dùng builder"
  meaning_vi: "Spec đơn vị, integration hoặc e2e không tự chèn hay ghi dòng: không có INSERT/UPDATE/DELETE thô, không gọi save, insert, upsert, update, delete, remove trên EntityManager, DataSource hoặc QueryRunner, và không dựng cùng một entity bằng object literal nhiều hơn một lần. Dòng dữ liệu đến từ builder của khu vực đó."
  causes_vi:
    - "em.query với chuỗi INSERT INTO ... hoặc chuỗi INSERT/UPDATE/DELETE được truyền vào query trong spec"
    - "em.save({...}), em.insert(...) hoặc upsert trong spec"
    - "Cùng một entity được viết thành object literal từ lần thứ hai trở đi trong một spec"
  nextStep_vi: "Thêm hoặc mở rộng builder của khu vực (orderRow(overrides) cho spec đơn vị, orderBuilder(db).pending().build(overrides) cho integration và e2e) rồi gọi nó trong spec. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TEST_TOPOLOGY:
  title: "One jest config, four projects live by folder; the world is the only test infrastructure and runs the repository's own stack for real"
  title_vi: "Cấu hình test lệch chuẩn"
  meaning_vi: "Cấu hình test lệch chuẩn: `<detail>`."
  causes_vi:
    - "Vi phạm luật R47: một `jest.config.js` (preset `@starci/jest-preset`) với bốn project `unit`, `integration`, `e2e`, `contract`; thư mục và hậu tố spec luôn khớp nhau; `diagnostics: false` + `isolatedModules: true`; `test:integration`, `test:e2e`, `test:contract` chạy qua `starci gate run --root <app> --tests <tên>`; `src/tests/world/` là nơi duy nhất dựng hạ tầng test và chỉ chứa `global-setup.ts`, `global-teardown.ts`, `use-test-world.ts`, `fakes/` và file gốc có hậu tố vai trò (kể cả `test-world.config.ts`)."
    - "Vi phạm luật R47 về stack thật: mọi dịch vụ khai trong `.starcistacks/<env>` (Postgres, Redis, Keycloak, mail host, k3s...) chạy THẬT trong world qua toxiproxy, world đọc dịch vụ và phiên bản image từ stack lúc chạy; `fakes/<provider>/` chỉ giả SaaS bên ngoài mà đội không vận hành. Ngoại lệ duy nhất: dịch vụ stateless cần phần cứng đặc biệt hoặc model bên ngoài (GPU inference, embedding tự host) được giả khi mục `stacks` của dịch vụ đó trong `test-world.config.ts` khai `{ fakedBy, reason }` với `reason` không rỗng; dịch vụ có trạng thái (database, cache, identity, storage, mail, queue, search hoặc có volume bền) không bao giờ được giả, và mục `fakedBy` trỏ tới dịch vụ hoặc fake (mục `fakes` hay thư mục `fakes/`) không tồn tại bị coi là cũ. `test-world.config.ts` khai world theo đúng một dạng export có tên `export const { useTestWorld, useSandbox } = defineTestWorld({...})` (`stack`, `stacks` theo từng dịch vụ, `fakes`); export default không được đọc và bị báo lỗi."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_THIRD_PARTY_OWNER:
  title: "A third-party SDK is imported outside its single integration owner"
  title_vi: "SDK bên thứ ba dùng ngoài chủ sở hữu tích hợp duy nhất"
  meaning_vi: "Các dependency của package.json ngoài danh sách thư viện thuần và framework phải có đúng một năng lực integrations/<provider> nhập chúng. Service miền và tính năng gọi API công khai của năng lực đó thay vì nhập SDK mạng hoặc IO trực tiếp."
  causes_vi:
    - "Service miền nhập nodemailer, openai, googleapis hoặc SDK mới"
    - "Hai năng lực tích hợp cùng nhập một SDK"
  nextStep_vi: "Chuyển import và giao thức nhà cung cấp vào một integrations/<provider> client, rồi tiêm cổng công khai của tích hợp vào service."
  owner: op-retry
  kind: check-finding

BE_TIER_DIRECTION:
  title: "Backend import against the tier direction"
  title_vi: "Backend import ngược chiều tầng"
  meaning_vi: "Một tệp backend import từ tầng mà bảng kê HFS không cho phép tầng của nó phụ thuộc vào. Mỗi tầng (app, feature, domain, integrations, platform) chỉ được nhìn xuống các tầng liệt kê trong bảng; hai feature import nhau là mã riêng BE_FEATURE_IMPORTS_FEATURE, và import chỉ kiểu (type-only) cũng tính như import thật."
  causes_vi:
    - "Một module domain, integrations hoặc platform import ngược lên feature hoặc app"
    - "Một module platform import domain hoặc integrations"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để đưa phần dùng chung xuống đúng tầng (domain hoặc platform) rồi cho cả hai bên import từ đó; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

BE_TRANSACTION_EXTERNAL_CALL:
  title: "Transaction spans an external call"
  title_vi: "Giao dịch cơ sở dữ liệu bao trùm một lệnh gọi ra ngoài"
  meaning_vi: "Một lệnh gọi fetch, HTTP client hoặc SDK tích hợp chạy bên trong .transaction(async (tx) => ...), nên giao dịch giữ kết nối mở trong suốt thời gian lệnh gọi ra ngoài chạy; nếu lệnh gọi thất bại sau khi giao dịch đã ghi một phần, hoặc thành công nhưng giao dịch sau đó rollback, hai hệ thống lệch nhau và không có đường quay lại."
  causes_vi:
    - "this.manager.transaction(async (tx) => { await tx.save(Entity, row); await fetch(url) })"
    - "this.manager.transaction(async (tx) => { await this.paymentSdk.charge(id) })"
  nextStep_vi: "Commit giao dịch trước rồi mới gọi ra ngoài, hoặc ghi một thông điệp outbox bên trong giao dịch để một worker gửi đi sau khi commit; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_TRANSPORT_SHAPE:
  title: "Transport does more than map and dispatch"
  title_vi: "Tầng giao tiếp làm nhiều hơn chuyển lệnh"
  meaning_vi: "Mỗi resolver, controller, gateway, consumer, job hoặc lệnh CLI chỉ ánh xạ đầu vào, gửi đúng một command hoặc query qua bus được tiêm và ánh xạ kết quả. Bộ kiểm tra thấy transport tiêm thứ khác ngoài InjectCommandBus/InjectQueryBus (và InjectRequestLocale cho REST), tiêm EntityManager, bọc phản hồi trong envelope, dùng GraphQLJSON hoặc cửa REST không có lý do."
  causes_vi:
    - "Resolver gọi service miền trực tiếp"
    - "Interceptor biến đổi phản hồi thành {success, message, data}"
    - "Đầu vào kiểu GraphQLJSON không kiểm tra"
  nextStep_vi: "Đưa logic vào handler của tính năng, để transport chỉ gọi commandBus.execute(new XCommand({ request, principal })) và trả kiểu kết quả; xóa envelope và thay GraphQLJSON bằng input có kiểu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong BE-CONVENTION; không thêm ngoại lệ, không tắt luật."
  owner: op-retry
  kind: check-finding

BE_TRUST_PROXY:
  title: "API proxy trust has no declared hop count"
  title_vi: "API chưa khai báo số hop proxy được tin cậy"
  meaning_vi: "API chưa nêu ranh giới proxy bằng số hop nguyên không âm nên địa chỉ khách có thể sai hoặc bị giả mạo."
  causes_vi:
    - "Thiếu trust proxy hoặc dùng true hay giá trị động chưa được giới hạn"
  nextStep_vi: "Khai báo số hop nguyên không âm phù hợp với ingress trong cấu hình khởi động API."
  owner: op-retry
  kind: check-finding

BE_TYPE_ESCAPE:
  title: "Type escape: cast, non-null assertion, any, Function or eval"
  title_vi: "Thoát kiểu: ép kiểu, non-null, any, Function hoặc eval"
  meaning_vi: "Có x as T (kể cả as never, as unknown as T), <T>x, x!, any, kiểu Function hoặc eval trong bất kỳ tệp nào, kể cả spec, nên trình biên dịch ngừng kiểm tra một giá trị mà thực tế có thể sai kiểu hoặc vắng mặt. Ép kiểu, x! và any do các luật mượn của typescript-eslint mà nhà máy cấu hình bật; Function và eval do luật no-function-or-eval của canon chặn."
  causes_vi:
    - "as never hoặc as unknown as X để lọt kiểm tra tham số, trong mã sản phẩm hay trong spec"
    - "x! thay cho việc kiểm tra tồn tại"
    - "Kiểu Function, eval hoặc new Function thay cho chữ ký có kiểu"
  nextStep_vi: "Cho giá trị đúng kiểu tham số cần (mock<T>() cho double trong spec), thu hẹp bằng guard trả về hoặc ném lỗi có kiểu, hoặc sửa chữ ký để sự vắng mặt không thể xảy ra. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_UNIT_SPEC_NOT_STAGED:
  title: "A new back-end logic file is committed without its unit spec"
  title_vi: "Tệp logic back-end mới được commit mà không có unit spec"
  meaning_vi: "Commit thêm `<file>`, một tệp `<name>.<role>.ts` có vai trò logic mà unit coverage đo ở mức 100 mỗi tệp, nhưng index không có `<name>.<role>.spec.ts` bên cạnh nó: mã được viết trước, spec để sau. Tệp chỉ có hằng số và kiểu (không có hàm, phương thức nào để chạy) không cần spec riêng."
  causes_vi:
    - "Agent viết mã trước rồi định sửa lint và spec sau, thay vì chạy vòng op `starci gate read` → mã + spec → `starci gate run`"
    - "Spec đã viết nhưng chưa được stage cùng tệp"
  nextStep_vi: "Viết `<name>.<role>.spec.ts` bên cạnh tệp trong cùng thay đổi, chạy `starci gate run --root <app> --changed <files> --tests <pattern>`, rồi stage cả hai tệp và commit lại qua hook. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

BE_UNNAMED_DATA_ACCESS:
  title: "Database reached without the named shared EntityManager"
  title_vi: "Truy cập cơ sở dữ liệu không qua EntityManager dùng chung có tên"
  meaning_vi: "Tham số hoặc thuộc tính kiểu EntityManager không mang bộ tiêm Inject<Kết nối>EntityManager của một kết nối đã khai báo trong hfs.json (tên na ná cũng không đạt), hoặc tiêm bằng thuộc tính, hoặc gọi .getRepository(...), hoặc dùng @InjectRepository / Repository<T> / TypeOrmModule.forFeature, hoặc tiêm DataSource / QueryRunner ngoài platform/database, cli (apps/cli, src/features/cli) và test world (kể cả viết kiểu DataSource làm kiểu trả về, giá trị await, token provide: hay lớp bọc trả ra kết nối); lớp nào ngoài handler ứng dụng, domain service và năng lực persistence của platform mà nhận, giữ hoặc trả EntityManager, Repository, DataSource hay QueryRunner đều là repository dù đặt tên gì (Store, Dao, Gateway, Persistence, hoặc module hàm export nhận EntityManager làm tham số đầu như authoring.statements.ts); ứng dụng đăng ký nhiều kết nối nên cách viết này trỏ vào kết nối mặc định hoặc gắn một handle vào đúng một entity, và giao dịch không đi qua được sang bảng thứ hai."
  causes_vi:
    - "constructor(@InjectFooEntityManager() private readonly manager: EntityManager) {} với Foo không phải kết nối khai báo"
    - "@InjectPrimaryEntityManager() private readonly manager: EntityManager (tiêm bằng thuộc tính)"
    - "this.dataSource.getRepository(CourseEntity).find()"
    - "constructor(private readonly dataSource: DataSource) {} ngoài module database của platform"
    - "constructor(@InjectRepository(CourseEntity) private readonly repo: Repository<CourseEntity>) {}"
    - "class AccountingLedgerRepository { appendPosting(manager: EntityManager, ...) {} } đặt ngoài handler và domain service (repository trá hình, kể cả khi tên không có hậu tố Repository)"
  nextStep_vi: "Nhận EntityManager dùng chung qua tham số constructor với bộ tiêm Inject<Kết nối>EntityManager() của kết nối khai báo trong hfs.json (ví dụ InjectPrimaryEntityManager()) rồi gọi trực tiếp manager.find(Entity, ...), manager.save(Entity, ...); DataSource chỉ do module database của platform dựng; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_UPLOAD_BUFFERED:
  title: "File upload buffering belongs in object storage"
  title_vi: "Tệp tải lên phải đi thẳng đến kho đối tượng"
  meaning_vi: "API nhập decorator hoặc middleware nhận tệp multipart thay vì chỉ cấp yêu cầu lưu trữ có chữ ký. Tệp phải đi từ trình duyệt đến kho đối tượng; API xác thực người dùng và khóa đối tượng rồi cấp quyền ngắn hạn với giới hạn loại nội dung và kích thước do nhà cung cấp thực thi."
  causes_vi:
    - "Dùng UploadedFile, UploadedFiles hoặc interceptor Multer trong API"
    - "Nhập thư viện nhận tệp multipart để đệm tệp qua API"
  nextStep_vi: "Dùng thao tác GraphQL để cấp yêu cầu lưu trữ có chữ ký, ràng buộc người dùng, khóa, thời hạn, loại nội dung và số byte; trình duyệt gửi trực tiếp đến kho."
  owner: op-retry
  kind: check-finding

BE_USER_COPY_LITERAL:
  title: "User-facing copy written in source"
  title_vi: "Chữ hiển thị cho người dùng viết thẳng trong mã nguồn"
  meaning_vi: "Một chuỗi chữ cố định xuất hiện ở nơi người dùng đọc được nó - tham số message của một *Error/*Exception, thuộc tính subject/title/body/text/message truyền vào notify/send/publish, hoặc thuộc tính message/description/title của một object trả về trong tầng transport - thay vì được tra theo khóa từ bộ danh mục messages theo từng capability qua cổng MessageCatalog kiểu platform/i18n."
  causes_vi:
    - "throw new PlanNotFoundError('Plan not found for this account')"
    - "this.notifier.send({ subject: 'Your plan has changed', templateId: 'plan-x' })"
    - "return { message: 'Plan updated successfully' }"
  nextStep_vi: "Thêm khóa vào catalog messages (vi và en) của capability hoặc feature liên quan, rồi gọi qua cổng MessageCatalog (messages.get('<khóa>', { ...tham số })) thay vì viết chuỗi tại chỗ; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_WEBHOOK_INBOX_KEY:
  title: "A webhook intake does not claim its stable delivery key"
  title_vi: "Intake webhook không claim khóa giao hàng ổn định"
  meaning_vi: "Phương thức intake nhận tham số đầu hoặc thuộc tính DTO kết thúc bằng Id, hoặc thân thô cùng chữ ký, nhưng không claim Inbox bằng khóa giao hàng ổn định và dừng ngay khi nhận bản trùng; hoặc xử lý giao hàng ngay trong giao dịch ghi nhận."
  causes_vi:
    - "Đổi tên tham số hoặc dùng thuộc tính DTO kết thúc bằng Id để tránh kiểm tra Inbox"
    - "Claim dùng khóa khác, chạy sau xử lý hoặc không dừng khi nhận bản trùng"
    - "Callback process, lời gọi domain hoặc dispatch command xử lý giao hàng trong giao dịch ghi nhận"
  nextStep_vi: "Dùng Inbox của platform/inbox, claim khóa giao hàng ổn định và trả về ngay khi claim báo bản trùng; ghi nhận cùng sự kiện outbox có kiểu trong giao dịch, rồi để reactor hoặc job xử lý sau commit."
  owner: op-retry
  kind: check-finding

BE_WEBHOOK_SCOPE:
  title: "Public webhook traffic bypasses the webhook door"
  title_vi: "Lưu lượng webhook công khai đi ngoài cửa webhook"
  meaning_vi: "PublicReason.SignedWebhook được dùng ngoài tệp cửa webhook hoặc phương thức xác thực domain được khai báo chính xác trong webhookVerifiers; một route công khai có đường dẫn webhook, callback hoặc events cũng phải nằm trong cửa webhook."
  causes_vi:
    - "Controller API dùng nhãn SignedWebhook để bỏ qua xác thực của cửa webhook"
    - "Route công khai nhận callback hoặc sự kiện ở một transport khác"
  nextStep_vi: "Chuyển route vào cửa <provider>.webhook.ts của slot HTTP webhook, xác thực trước rồi chuyển giao cho intake domain và Inbox; chỉ khai báo phương thức xác thực domain bằng symbol chính xác trong webhookVerifiers."
  owner: op-retry
  kind: check-finding

BE_WEBHOOK_SHAPE:
  title: "A webhook door breaks the verified inbox handoff or provider response contract"
  title_vi: "Cửa webhook làm nhiều hơn xác thực và chuyển giao"
  meaning_vi: "Webhook của nhà cung cấp là một cửa ký số: A provider webhook door (`src/features/webhooks/<provider>/transport/http/<provider>.webhook.ts`) is one `@Controller` with exactly one `@Post` handler and optionally one `@Get` subscription challenge handler, each declared `@Public({ reason: PublicReason.SignedWebhook })`. It injects only the `WebhookSignatureService` of `platform/http-security` and services of `modules/domain`, holds no branch, loop or `try`, and its POST calls proof then exactly one domain intake that durably records the inbox receipt and outbox event in its transaction. A combined domain proof and intake call is allowed. POST returns nothing or exactly the own-feature exported `PROVIDER_ACK`, a literal object or string declared with `as const` or a readonly literal type; computed values, inline return objects and cross-feature constants are refused. GET starts with a declared domain verifier call and returns exactly that result, with no intake. The door and its HTTP module import or inject no CommandBus, QueryBus of @nestjs/cqrs or feature command handler; the resolved called intake dispatches no command/query bus or feature handler. A reactor or job consumes the durable receipt and dispatches after commit; unresolved helpers and dynamic receivers require semantic review."
  causes_vi:
    - "The webhook door or its HTTP module imports or injects CommandBus, QueryBus or a feature command handler, or the resolved called domain intake dispatches on a command/query bus or feature handler"
    - "The handler branches, loops, parses, maps or publishes instead of proving first and recording one durable receipt"
    - "The POST returns an inline object, computed value, input-derived constant or another feature's PROVIDER_ACK"
    - "The door declares two POST routes, more than one GET, or a GET that echoes anything except its declared domain verifier result"
  nextStep_vi: "Đưa mọi quyết định và mọi lần ghi vào một phương thức nhận của service trong modules/domain: verify first, then call one domain recordProviderDelivery-style method that claims the shared Inbox and records the receipt with its outbox event in one transaction. Let a reactor or job consume the durable receipt and dispatch the command. POST may return nothing or the own-feature exported literal PROVIDER_ACK; one optional GET echoes only its first declared domain verifier result. Keep the signed-webhook public reason and strict rate tier; follow knowledge/patterns/be/webhooks.yaml."
  owner: op-retry
  kind: check-finding

BE_WEBHOOK_UNVERIFIED:
  title: "A webhook handler runs code before its declared delivery or challenge proof"
  title_vi: "Handler webhook chạy mã trước khi xác thực giao hàng"
  meaning_vi: "Câu lệnh đầu tiên của handler webhook: The first statement of a webhook POST is an unconditional verification call to `WebhookSignatureService.verify` or a domain verifier, awaited when async, with no data access or other call before proof. A domain verifier is a method on a domain service whose declared class name ends in `Verifier` or `verify`, or a domain service method declared by symbol in the adjacent HTTP module's exported `webhookVerifiers` array. A domain method may verify with per-connection secrets before intake in the same call; invalid proof throws before intake. A fixed PROVIDER_ACK never replaces proof. The optional GET challenge handler starts with a declared domain verifier call (directly returned or bound to a const and then returned), awaited when async, and echoes only its exact result."
  causes_vi:
    - "The handler reads or assigns data before its first unconditional proof call"
    - "Proof is conditional, unawaited when async, or a call nested around other work"
    - "The verifier is a local lookalike or lacks a resolved domain service or declared verification method symbol"
    - "The GET returns the unverified challenge field or transforms its verifier result"
  nextStep_vi: "Đặt `this.<signature>.verify({ rawBody, signature, timestamp })` làm câu lệnh đầu tiên của handler, không điều kiện, dùng WebhookSignatureService của platform/http-security và thân yêu cầu thô (không phải bản đã serialize lại). POST must start with WebhookSignatureService.verify or the declared domain verifier, awaited when async; a combined proof and intake must refuse invalid proof before recording. GET must start with its declared domain challenge verifier and echo exactly that call result. Returning PROVIDER_ACK after POST intake never removes this first-statement requirement; follow knowledge/patterns/be/webhooks.yaml."
  owner: op-retry
  kind: check-finding

BOOT_PROOF_TIMEOUT:
  title: "The lite boot proof's worker ran out of its budget twice and reached no verdict"
  title_vi: "Bằng chứng khởi động lite hết thời gian hai lần, chưa có kết luận"
  meaning_vi: "Tiến trình chứng minh ghép nối Nest chạy quá ngân sách thời gian riêng của nó (STARCI_BOOT_PROOF_TIMEOUT_MS, lấy từ heavy.bootProofTimeoutSeconds của ops/liveness.yaml) cả lần đầu lẫn lần thử lại. Đây không phải lỗi ghép nối: máy đang quá tải nên chưa phán được."
  causes_vi:
    - "Máy chủ đang chạy nhiều lệnh nặng cùng lúc nên trình biên dịch TypeScript của bằng chứng chạy quá chậm"
  nextStep_vi: "Chạy lại starci app check --wiring khi máy rảnh hơn; nếu vẫn hết thời gian khi máy rảnh, nâng heavy.bootProofTimeoutSeconds trong ops/liveness.yaml."
  owner: op-retry
  kind: check-finding

CI_DECLARATION_DRIFT:
  title: "Workflow references drift from CI declarations"
  title_vi: "Workflow lệch khai báo CI"
  meaning_vi: "Workflow hoặc liên kết dịch vụ thiếu khai báo đúng lớp, hoặc khai báo bắt buộc không được dùng."
  causes_vi:
    - "Workflow hoặc liên kết dịch vụ thiếu khai báo đúng lớp, hoặc khai báo bắt buộc không được dùng."
  nextStep_vi: "Đối chiếu secrets và vars trong workflow với ci và liên kết dịch vụ; chỉ đánh dấu optional khi phù hợp."
  owner: op-retry
  kind: check-finding

CI_SECRET_SEALED:
  title: "CI name overlaps sealed app custody"
  title_vi: "Tên CI trùng khóa bí mật đã niêm phong"
  meaning_vi: "Tên CI hoặc Dependabot cũng là khóa trong thành viên .enc của ứng dụng."
  causes_vi:
    - "Tên CI hoặc Dependabot cũng là khóa trong thành viên .enc của ứng dụng."
  nextStep_vi: "Bỏ khóa ứng dụng khỏi khai báo CI; đưa bí mật CI vào kho GitHub tương ứng."
  owner: op-retry
  kind: check-finding

CI_STANDARD:
  title: "A workflow breaks the StarCi CI standard"
  title_vi: "Workflow vi phạm chuẩn CI của StarCi"
  meaning_vi: "Workflow CI (của app, của ví dụ hoặc của runtime) không đáp ứng một mục của knowledge/hfs/ci-standard.yaml; mục bị vi phạm được nêu trong ngoặc vuông."
  causes_vi:
    - "Vi phạm R301: job shape, lịch sử đầy đủ và STARCI_BASE_REF, heap cho bước nặng, lint Sonar theo từng phía, probe nhà cung cấp tùy chọn, timeout hoặc ghim action theo sha."
  nextStep_vi: "App: chạy starci app sync --write để render lại CI chuẩn (không sửa tay); runtime: sửa workflow theo mục được nêu."
  owner: op-retry
  kind: check-finding

CI_TRIGGERS_RELEASE_ONLY:
  title: "Workflow trigger outside R221"
  title_vi: "Workflow có trigger ngoài R221"
  meaning_vi: "Workflow khai báo trigger ngoài R221: main được phép trong workflow runtime và ci.yml của app; các nhánh, sự kiện và bộ lọc khác phải theo R221."
  causes_vi:
    - "Khai báo nhánh, sự kiện hoặc bộ lọc không thuộc R221"
    - "Khai báo nhánh, sự kiện hoặc bộ lọc không thuộc R221"
  nextStep_vi: "Sửa on theo R221 rồi chạy starci app sync --write để tạo lại workflow ứng dụng."
  owner: supervisor
  kind: check-finding

CI_UPLOAD_NOT_SILENT:
  title: "Coverage upload can skip or fail silently"
  title_vi: "Bước tải coverage có thể bị bỏ qua hoặc lỗi mà không báo"
  meaning_vi: "Một bước codecov/codecov-action trong workflow CI (gốc, ví dụ hoặc template của packages/hfs) không xác thực bằng OIDC (use_oidc: true cùng permissions id-token: write), không đặt fail_ci_if_error: true, có continue-on-error: true, hoặc bị chặn bởi điều kiện đọc một secret hay CODECOV_TOKEN. Khi đó thiếu secret hay tải lỗi chỉ làm bước bị bỏ qua và job vẫn xanh, coverage thôi được báo mà không ai hay."
  causes_vi:
    - "Dùng token trong repository secret và đặt điều kiện if theo secret đó"
    - "Để continue-on-error hoặc quên fail_ci_if_error cho bước tải"
  nextStep_vi: "Người giám sát đặt use_oidc: true và fail_ci_if_error: true cho bước, cấp permissions id-token: write cho job, bỏ continue-on-error và điều kiện theo secret, rồi render lại workflow bằng starci app sync --write."
  owner: supervisor
  kind: check-finding

CLI_ONLY_ENTRY:
  title: "A tracked file runs a runtime script directly"
  title_vi: "Một file được theo dõi chạy trực tiếp script của runtime"
  meaning_vi: "Một prompt, tài liệu, skill, file knowledge, cấu hình, CI, hook hoặc đăng ký tác vụ chạy node scripts/..., chạy trực tiếp ui/harness-verbs.mjs hoặc npm run bọc script runtime thay vì starci <group> <verb>."
  causes_vi:
    - "Vi phạm luật R201: mọi hành động phải đi qua starci <group> <verb>."
  nextStep_vi: "Đổi lời gọi thành lệnh starci mà bộ kiểm tra gợi ý; nếu script chưa có verb thì thêm file catalog hoặc khai báo nội bộ trong modules/cli/commands/_internal.yaml."
  owner: op-retry
  kind: check-finding


DB_APP_ROLE:
  title: "The back-end database role has explicit least privileges"
  title_vi: "Role cơ sở dữ liệu của back end có quyền quá rộng"
  meaning_vi: "Migration tại <path> tạo hoặc sửa role của ứng dụng với superuser, bypassrls hay thuộc tính thiếu an toàn, hoặc cấp all thay cho các quyền cần thiết; role mặc định là app_be và có thể khai báo bằng supabase.appRole."
  causes_vi:
    - "Vi phạm R255: app role vượt qua RLS hoặc được cấp quyền rộng hơn công việc của back end."
    - "Role không khai báo rõ noinherit và nobypassrls, hoặc nhận grant all trên schema hay bảng."
  nextStep_vi: "Khai báo app role với noinherit, nobypassrls và các thuộc tính không đặc quyền; bỏ superuser, bypassrls và grant all, rồi cấp từng quyền cần thiết."
  owner: op-retry
  kind: check-finding

DB_ARCHIVE_MUTATED:
  title: "Archived migrations are immutable and retire only with a new baseline"
  title_vi: "Archive migration bị thay đổi ngoài lần cắt baseline"
  meaning_vi: "Migration đã lưu trữ bị sửa hoặc xóa, file mới được đưa thẳng vào archive, hoặc migration đang hoạt động được lưu trữ mà không thêm baseline trong cùng thay đổi."
  causes_vi:
    - "Vi phạm R257: archive không giữ nguyên nội dung lịch sử của chuỗi migration."
  nextStep_vi: "Khôi phục file lưu trữ nguyên vẹn và tạo baseline thay thế trong cùng thay đổi khi cần lưu trữ chuỗi đang hoạt động."
  owner: op-retry
  kind: check-finding

DB_BASELINE_SHAPE:
  title: "An archived migration chain needs exactly one valid replacement baseline"
  title_vi: "Baseline của chuỗi migration lưu trữ sai hình dạng"
  meaning_vi: "Archive có migration nhưng thiếu hoặc thừa baseline đang hoạt động, marker không nêu stamp cuối của archive, hoặc stamp baseline không hợp lệ và không có bản đồ restamp rõ ràng."
  causes_vi:
    - "Vi phạm R257: chuyển chuỗi migration vào archive mà không tạo baseline đúng marker và stamp."
  nextStep_vi: "Chạy app db baseline để xem kế hoạch, kiểm tra marker và bản đồ restamp, rồi thi hành với --apply khi kế hoạch đã đúng."
  owner: op-retry
  kind: check-finding



DB_DEFINER_REVOKE:
  title: "Exposed security definer functions revoke browser execution"
  title_vi: "Function security definer chưa thu hồi quyền trình duyệt"
  meaning_vi: "Function security definer tại <path>, được khai báo bằng create hoặc alter function trong schema exposed, vẫn chưa revoke execute từ authenticated sau toàn bộ tập migration."
  causes_vi:
    - "Vi phạm R256: authenticated hoặc role công khai vẫn có thể gọi function chạy bằng quyền của chủ sở hữu."
  nextStep_vi: "Chuyển function sang schema không exposed hoặc thêm migration revoke execute on function <signature> from authenticated; giữ các yêu cầu search_path, revoke public và anon cùng các kiểm tra an toàn của R215."
  owner: op-retry
  kind: check-finding

DB_DEFINER_SAFE:
  title: "A `security definer` function pins `search_path`, lives outside exposed schemas (or is revoked from public in the same migration), declares a return type, and interpolates parameters only through `format('%I/%L')`"
  title_vi: "Function security definer không an toàn"
  meaning_vi: "`<path>` có function `security definer` thiếu `set search_path` (trên create hoặc `alter function` cùng migration - `from current` không tính), nằm trong schema exposed mà không `revoke execute ... from public`, không khai báo return type, hoặc build dynamic SQL qua tham số không qua `format('%I/%L')`."
  causes_vi:
    - "Vi phạm luật L06: search_path không pin là lỗ hổng leo quyền; `security invoker` được miễn."
  nextStep_vi: "Thêm `set search_path = ''` (hoặc danh sách schema cố định), chuyển function sang schema `private` hoặc `revoke execute on function ... from public, anon`, và chỉ interpolate qua `format('%I'/'%L')`."
  owner: op-retry
  kind: check-finding

DB_DYNAMIC_DDL:
  title: "No dynamic SQL builds DDL - every statement a migration runs is visible to the parser"
  title_vi: "DDL động trong migration"
  meaning_vi: "`<path>` có `EXECUTE`/dynamic `FOR`/`OPEN` trong DO block hoặc function build create/alter/drop table|policy|function hay grant/revoke, hoặc một dynamic statement mà parser không đọc được."
  causes_vi:
    - "Vi phạm luật L04: DDL viết tường minh từng câu; dynamic DDL làm L03/L05/L06 không quyết định được bằng AST."
  nextStep_vi: "Viết thẳng các câu create/alter/drop/grant (codemod sinh nếu cần lặp); dynamic SQL chỉ còn DML thuần."
  owner: op-retry
  kind: check-finding

DB_EXTENSION_ALLOWED:
  title: "Database extensions belong to the declared allowlist"
  title_vi: "Extension cơ sở dữ liệu nằm ngoài danh sách cho phép"
  meaning_vi: "Migration tạo extension không thuộc danh sách extension mà chuẩn cơ sở dữ liệu cho phép."
  causes_vi:
    - "Vi phạm R259: thêm extension chưa được ruleParams.db.extensions cho phép."
  nextStep_vi: "Dùng extension trong danh sách chuẩn hoặc khai báo chính sách extension được phê duyệt trước khi thêm migration."
  owner: op-retry
  kind: check-finding

DB_FORCE_RLS_DEFAULT:
  title: "Tables owned by the app role force row level security"
  title_vi: "Bảng do app role sở hữu chưa bắt buộc RLS"
  meaning_vi: "Bảng tại <path> thuộc app role nhưng thiếu force row level security và không có ngoại lệ forceRls kèm lý do không rỗng trong hfs.json."
  causes_vi:
    - "Vi phạm R255: chủ sở hữu bảng có thể bỏ qua RLS khi không có force row level security."
  nextStep_vi: "Thêm alter table <schema>.<table> force row level security trong migration; nếu cần miễn, khai báo đúng bảng và lý do trong hfs.json db.forceRls."
  owner: op-retry
  kind: check-finding

DB_MIGRATION_DESTRUCTIVE:
  title: "Destructive DDL requires a contract migration with retired application references"
  title_vi: "Migration phá hủy chưa thuộc bước contract"
  meaning_vi: "DDL xóa hoặc thu hẹp schema nằm ngoài migration *_contract_*, hoặc đối tượng bị thay đổi vẫn được SQL hay entity của back end tham chiếu."
  causes_vi:
    - "Vi phạm R259: thực hiện bước phá hủy trước khi ứng dụng ngừng dùng đối tượng cũ."
  nextStep_vi: "Tách thay đổi thành expand và contract, bỏ tham chiếu cũ trong ứng dụng, rồi tạo migration <stamp>_contract_<name>.sql."
  owner: op-retry
  kind: check-finding

DB_MIGRATION_SHAPE:
  title: "A migration is named `<ts14>_<kebab>.sql`, stamped in valid UTC, appended after HEAD's active migrations, and immutable once on the base"
  title_vi: "Migration sai hình dạng hoặc bị sửa"
  meaning_vi: "`<path>` vi phạm luật migration: tên phải là `<ts14>_<kebab>.sql`, stamp là thời điểm UTC thật và không trùng giữa các migration đang hoạt động; migration mới xếp sau chuỗi đang hoạt động đã commit trên HEAD. Archive ghi nhận migration đã nghỉ khỏi chuỗi, nên baseline thay thế có thể mang stamp trước archive. Migration đã lên base là bất biến (sửa hay xoá mà không archive đều là finding)."
  causes_vi:
    - "Vi phạm luật L02: `db/migrations/<ts14>_<kebab>.sql`; stamp mới tăng nghiêm ngặt so với chuỗi đang hoạt động đã commit trên HEAD, không so với đồng hồ, thời gian commit hay stamp trên remote; file đã lên base không được đổi."
  nextStep_vi: "Tạo migration mới bằng `npm run db:new -- <ten>`, không sửa/đổi tên/xoá migration đã lên base; nếu cần đổi nội dung, viết migration mới."
  owner: op-retry
  kind: check-finding

DB_PGMQ_DECLARED:
  title: "A queue constant keeps a pgmq queue, a pgmq queue has no event-bus owner, or a pgmq queue, binding or grant is declared unsafely"
  title_vi: "Hằng hàng đợi còn hàng đợi pgmq, hàng đợi pgmq không có chủ event-bus, hoặc hàng đợi, liên kết topic hay quyền pgmq khai báo sai"
  meaning_vi: "pgmq là event bus và job chạy trên BullMQ (ruling:lite-pgmq-bus-bullmq-jobs), nhưng các migration đang hoạt động vẫn để lại một hàng đợi pgmq trùng tên một hằng hàng đợi trong modules/queues, hoặc một hàng đợi pgmq không được hằng literal *_TOPIC_QUEUE nào trong platform/event-bus đặt tên (hay một hằng như vậy không có hàng đợi pgmq); hoặc pgmq.create hay pgmq.bind_topic không có tên literal trong migration, liên kết một hàng đợi chưa được tạo, tên hằng không phải literal, hay quyền trên đối tượng pgmq vượt vai trò ứng dụng."
  causes_vi:
    - "Vi phạm R258: một job của app chạy trên pgmq thay vì BullMQ trên Redis."
    - "Một hàng đợi pgmq bị bỏ lại hoặc đổi tên mà không có chủ event-bus, hoặc một liên kết topic trỏ tới hàng đợi chưa tạo."
    - "Migration, mã nguồn hoặc quyền truy cập khai báo đối tượng pgmq ngoài migration tĩnh hoặc cho vai trò khác vai trò ứng dụng."
  nextStep_vi: "Chuyển job sang BullMQ trên Redis đã khai báo, rồi xóa hàng đợi pgmq bằng pgmq.drop_queue trong một migration mới; hàng đợi của một nhóm consumer được đặt tên bằng một hằng literal *_TOPIC_QUEUE trong platform/event-bus, tạo bằng pgmq.create rồi liên kết với tên event bằng pgmq.bind_topic trong cùng migration; vai trò ứng dụng đi qua các hàm event_bus_* thay vì nhận quyền trên schema pgmq."
  owner: op-retry
  kind: check-finding

DB_POLICY_SHAPE:
  title: "Policies are named `<table>_<role>_<action>`, write/FOR ALL never uses (true), anon/public only on `for select` `*_public_read`, no grant to anon without that policy, never `service_role`"
  title_vi: "Policy sai hình dạng"
  meaning_vi: "`<path>` có policy vi phạm L05: write hoặc FOR ALL với using (true)/with check (true), `to anon`/`to public` ngoài FOR SELECT `*_public_read`, select using (true) không hậu tố `_public_read`, tên sai `<table>_<role>_<action>`, grant tới anon/public không có policy `_public_read` kèm, hoặc grant tới `service_role`."
  causes_vi:
    - "Vi phạm luật L05: service_role vượt RLS nên không bao giờ được grant; anon chỉ đọc qua policy `_public_read` được khai báo."
  nextStep_vi: "Đổi tên policy theo `<table>_<role>_<action>`, thay using (true) trên write bằng điều kiện thật, bỏ grant tới service_role/anon hoặc thêm policy `<table>_public_read` cho select."
  owner: op-retry
  kind: check-finding

DB_POLICY_TAUTOLOGY:
  title: "Access policies use a meaningful principal predicate"
  title_vi: "Policy dữ liệu có điều kiện luôn đúng"
  meaning_vi: "Policy tại <path> dùng true, is not null hoặc so sánh một biểu thức với chính nó để mở dữ liệu, hoặc policy cho role trình duyệt không chứng minh điều kiện theo principal."
  causes_vi:
    - "Vi phạm R256: điều kiện luôn đúng không tạo ranh giới truy cập dữ liệu."
    - "Policy không gắn hàng dữ liệu với auth.uid(), auth.jwt() hoặc nguồn principal tương đương."
  nextStep_vi: "Viết điều kiện quyền sở hữu hoặc tenant dựa trên principal cho using và with check; bỏ các điều kiện true, is not null và x = x dùng thay cho kiểm soát truy cập."
  owner: op-retry
  kind: check-finding


DB_RLS_REQUIRED:
  title: "Every `create table` in an exposed schema is followed by `enable row level security` in the same migration"
  title_vi: "Bảng trong schema public thiếu RLS"
  meaning_vi: "`<path>` tạo bảng trong schema exposed (`public` và `[api] schemas` của config.toml) mà không có `alter table ... enable row level security` ngay trong cùng migration; bảng khai báo `forceRls` cần cả `force row level security`."
  causes_vi:
    - "Vi phạm luật L03: mọi `create table`/`create table as` trong schema exposed phải có enable (và force khi hfs.json `db.forceRls` khai báo) trong cùng migration; partition con và bảng temp được miễn."
  nextStep_vi: "Viết `alter table <schema>.<table> enable row level security;` ngay sau create trong cùng migration; không dùng vòng lặp dynamic SQL."
  owner: op-retry
  kind: check-finding

DB_STORAGE_POLICY:
  title: "A bucket insert declares `public = false` (true only for an id ending `_public`), `file_size_limit`, `allowed_mime_types`, and a `storage.objects` policy naming its `bucket_id` in the same migration"
  title_vi: "Bucket storage thiếu khai báo hoặc policy"
  meaning_vi: "`<path>` insert vào `storage.buckets` thiếu `public`/`file_size_limit`/`allowed_mime_types`, đặt `public = true` cho id không kết thúc `_public`, hoặc không có policy trên `storage.objects` nhắc `bucket_id` của nó trong cùng migration."
  causes_vi:
    - "Vi phạm luật L07: bucket là private mặc định; giới hạn size/mime và policy objects đi cùng khai báo bucket."
  nextStep_vi: "Khai báo đủ `public = false`, `file_size_limit`, `allowed_mime_types` và viết `create policy ... on storage.objects ... (bucket_id = '<id>')` trong cùng migration."
  owner: op-retry
  kind: check-finding

DB_STORAGE_PREFIX:
  title: "Private storage policies scope an ownership prefix"
  title_vi: "Policy storage thiếu prefix theo chủ sở hữu"
  meaning_vi: "Policy trên storage.objects tại <path> không ràng buộc storage.foldername(name) với principal và bucket không có id kết thúc _public."
  causes_vi:
    - "Vi phạm R256: chỉ kiểm tra bucket_id không giới hạn đối tượng theo chủ sở hữu."
  nextStep_vi: "Thêm điều kiện prefix sở hữu bằng storage.foldername(name) và principal trong using hoặc with check theo thao tác; chỉ dùng ngoại lệ cho bucket id kết thúc _public."
  owner: op-retry
  kind: check-finding


DB_VAULT_WRITE:
  title: "Migrations contain no vault writes or role passwords"
  title_vi: "Migration ghi vault hoặc mật khẩu vai trò"
  meaning_vi: "SQL ghi bí mật vào vault hoặc khai báo PASSWORD khi tạo hay đổi vai trò; bí mật phải nằm trong luồng lưu giữ sops, không trong migration."
  causes_vi:
    - "Vi phạm R259: migration được dùng để tạo hoặc thay đổi giá trị bí mật."
  nextStep_vi: "Bỏ thao tác ghi bí mật khỏi migration và dùng luồng app secret; chỉ giữ khai báo vai trò không chứa mật khẩu."
  owner: op-retry
  kind: check-finding

DB_VIEW_UNSAFE:
  title: "Exposed views preserve the caller's access boundary"
  title_vi: "View exposed chưa bảo vệ quyền của người gọi"
  meaning_vi: "View hoặc materialized view tại <path> nằm trong schema exposed mà không có security_invoker và tập migration kết thúc khi quyền của anon cùng authenticated chưa được thu hồi."
  causes_vi:
    - "Vi phạm R256: view có thể mở dữ liệu qua quyền của chủ sở hữu thay vì quyền của người gọi."
  nextStep_vi: "Đặt security_invoker = true cho view hỗ trợ tùy chọn này hoặc thêm migration revoke quyền trên view từ anon và authenticated."
  owner: op-retry
  kind: check-finding

ENV_DUPLICATE:
  title: "One env key is sealed in two members"
  title_vi: "Một khoá env bị niêm phong trong hai member"
  meaning_vi: "Cùng một khoá môi trường xuất hiện trong hai member `.enc` khác nhau, nên giá trị nào được dùng không còn rõ."
  causes_vi:
    - "Vi phạm luật R248: một khoá chỉ sống trong một member; hai bản sao lệch giá trị là lỗi vận hành chờ xảy ra."
    - "Khoá được di chuyển sang member mới nhưng quên gỡ khỏi member cũ."
  nextStep_vi: "Giữ khoá ở đúng một member và gỡ nó khỏi member còn lại (`starci app secret set` rồi chỉnh lại member thừa)."
  owner: op-retry
  kind: check-finding

ENV_EXAMPLE_DRIFT:
  title: "An env example names a key nothing reads"
  title_vi: "File env mẫu nêu một khoá không ai đọc"
  meaning_vi: "Một file `*.env.example` liệt kê khoá mà không có EnvSource reader nào dùng: ví dụ đã lệch với các khoá code thật sự đọc."
  causes_vi:
    - "Vi phạm luật R248: file example là hợp đồng tài liệu của môi trường; khoá trong đó phải là khoá code đọc."
    - "Đổi tên hoặc xoá reader mà quên cập nhật file example (D2-23 `QUEUE_RELAY_*`)."
  nextStep_vi: "Sửa file example cho khớp các khoá `<app>.env.ts`/`*.config.ts` đọc, hoặc thêm reader nếu khoá thật sự cần."
  owner: op-retry
  kind: check-finding

ENV_PUBLIC_SEALED:
  title: "A NEXT_PUBLIC_* key is in sealed custody"
  title_vi: "Khoá NEXT_PUBLIC_* nằm trong khu vực niêm phong"
  meaning_vi: "Một member `.enc` giữ khoá `NEXT_PUBLIC_*`: giá trị public của front end là cấu hình công khai, không bao giờ vào custody bí mật."
  causes_vi:
    - "Vi phạm luật R248: đưa cấu hình public vào `.enc` làm người đọc tưởng nó là bí mật và kéo theo quy trình custody không cần thiết."
    - "`web.enc` chứa `NEXT_PUBLIC_*` (D2-11)."
  nextStep_vi: "Gỡ khoá `NEXT_PUBLIC_*` khỏi member và khai báo nó như public config (stack/`KEYS.md`)."
  owner: op-retry
  kind: check-finding

ENV_REQUIRED_UNSET:
  title: "A required env key is neither sealed nor declared"
  title_vi: "Khoá môi trường bắt buộc chưa được niêm phong hay khai báo"
  meaning_vi: "Mã nguồn đọc một khoá môi trường bắt buộc qua EnvSource nhưng khoá đó không nằm trong member `.enc` nào của `.starcistacks/<env>/secrets` cũng không được stack hay `KEYS.md` khai báo."
  causes_vi:
    - "Vi phạm luật R248: khoá mà code đọc, khoá được niêm phong và khoá stack truyền vào phải là cùng một tập; khoá bắt buộc thiếu cả chỗ niêm phong lẫn khai báo sẽ làm app không boot được."
    - "Khoá được thêm vào `<app>.env.ts` hoặc `*.config.ts` nhưng quên `starci app secret set` và quên khai báo trong `KEYS.md` hoặc stack."
  nextStep_vi: "Niêm phong khoá bằng `starci app secret set <env> <slug> <KEY>` hoặc khai báo nó trong `.starcistacks/<env>/runtime/env/KEYS.md` / phần `environment:` của stack."
  owner: op-retry
  kind: check-finding

ENV_SEALED_UNREAD:
  title: "A sealed key is read by nobody"
  title_vi: "Khoá niêm phong không ai đọc"
  meaning_vi: "Một member `.enc` trong `.starcistacks/<env>/secrets` giữ một khoá mà không có EnvSource reader nào đọc và không có consumer nào được khai báo (stack hay `KEYS.md`)."
  causes_vi:
    - "Vi phạm luật R248: khoá niêm phong thừa là custody chết — tên sai (như D2-06 `OPENCLAW_TURN_TIMEOUT_MS`), khoá cũ đã bỏ (D2-07/08) hoặc member sai."
    - "Code đổi tên khoá nhưng member niêm phong vẫn giữ tên cũ."
  nextStep_vi: "Gỡ khoá khỏi member, sửa tên cho khớp khoá code đọc, hoặc khai báo consumer của nó trong `KEYS.md` / stack."
  owner: op-retry
  kind: check-finding

ENV_VALUE_SHAPE:
  title: "A stored env value does not parse as its reader's type"
  title_vi: "Giá trị env đã lưu không đúng kiểu reader khai báo"
  meaning_vi: "Một giá trị trong member niêm phong (kiểm bằng `starci app secret verify <env>`) hoặc trong `*.env.example` không parse được theo kiểu reader EnvSource khai báo (int, bool `true`/`false`, url tuyệt đối, duration `250`/`30s`/`5m`/`2h`, hoặc một giá trị enum đã khai báo)."
  causes_vi:
    - "Vi phạm luật R249: app boot sẽ fail hoặc đọc sai ngầm khi giá trị không khớp parser — như `OPENCLAW_MANAGE_AGENTS=1` cho `env.bool` (D2-03)."
    - "Giá trị được set bằng định dạng khác (`1` thay `true`, `1000` thay `1s`, URL thiếu scheme)."
  nextStep_vi: "Sửa giá trị qua `starci app secret set <env> <slug> <KEY>` cho đúng kiểu reader khai báo, hoặc sửa example; verify in ra tên khoá và kiểu bị vi phạm, không in giá trị."
  owner: op-retry
  kind: check-finding

FE_APP_ISOLATION:
  title: "App imports another app"
  title_vi: "Một app import app khác"
  meaning_vi: "Một app trong apps/ import mã nguồn của app khác. Các app độc lập, build và triển khai riêng; mã dùng chung phải nằm trong một gói packages/<pkg>."
  causes_vi:
    - "Import đường dẫn tương đối hoặc bí danh trỏ sang apps/<app-khác>/src"
    - "Sao chép cách dùng chung bằng import thay vì tạo gói dùng chung"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển phần dùng chung vào một gói packages/<pkg> hoặc nhân bản có chủ đích; nếu cần ô gói mới thì người giám sát thêm ô vào bảng kê."
  owner: op-retry
  kind: check-finding

FE_APP_SHELL_BOTTOM_TABS:
  title: "The application shell has a bottom tab bar"
  title_vi: "Khung ứng dụng có thanh tab dưới"
  meaning_vi: "Khung ứng dụng tại <file> đặt điều hướng trong thanh tab dưới thay vì Sidebar drawer."
  causes_vi:
    - "Cấu trúc shell không theo canon ứng dụng."
  nextStep_vi: "Dùng hàng mở drawer bên dưới navbar và Sidebar presentation=\"drawer\" (R316; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_APP_SHELL_FRAME:
  title: "The application frame bypasses the selected Grammar shell"
  title_vi: "Khung ứng dụng không dùng WorkspaceShell cố định"
  meaning_vi: "Khung ứng dụng tại <file> không giao bố cục và cuộn cho WorkspaceShell."
  causes_vi:
    - "Cấu trúc shell không theo canon ứng dụng."
  nextStep_vi: "Ghép khung ứng dụng bằng WorkspaceShell viewport=\"fixed\" (R313; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_BLOCK_PRODUCT_HOOK_DEFINITION:
  title: "Block defines a product hook"
  title_vi: "Khối giao diện tự định nghĩa hook sản phẩm"
  meaning_vi: "Một block định nghĩa luôn vòng đời dữ liệu của sản phẩm, trong khi block chỉ được gọi hook có sẵn từ thư mục hooks."
  causes_vi:
    - "Viết hook dữ liệu ngay trong file block"
    - "Trộn logic thế giới sản phẩm vào block"
  nextStep_vi: "Op interface.implement chuyển hook sang thư mục hooks và để block chỉ gọi nó."
  owner: other-op:interface.implement
  kind: check-finding

FE_BUTTON_INTENT:
  title: "Button variant is chosen by hand instead of by intent"
  title_vi: "Variant của nút được chọn thủ công thay vì theo intent"
  meaning_vi: "Button hoặc IconButton của ứng dụng thiếu intent, truyền variant, đặt nút xác nhận xoá ngoài hộp thoại xác nhận, có nhiều hơn một nút commit trong một lần render, hoặc đặt nút commit trong từng phần tử của danh sách."
  causes_vi:
    - "Truyền variant thay vì intent cho Button hoặc IconButton"
    - "Đặt intent destructive với step confirm ngoài AlertDialog hoặc ConfirmDialog"
    - "Đặt hai nút commit trong cùng một lần render hoặc một nút commit trong mỗi thẻ của danh sách"
  nextStep_vi: "Khai báo intent (và step cho destructive) theo hệ quả của hành động, bỏ variant để Grammar tự suy ra, và chạy codemod button-intent cho các nút cũ."
  owner: "op-retry"
  kind: "check-finding"

FE_BUTTON_INTENT_REQUIRED:
  title: "A button has no declared intent"
  title_vi: "Nút chưa khai báo intent"
  meaning_vi: "Button hoặc IconButton tại <file> chưa nêu ý định của lệnh."
  causes_vi:
    - "Bỏ intent nên Grammar không có dữ kiện để chọn variant."
  nextStep_vi: "Khai báo intent theo hệ quả và thứ hạng của lệnh trong quyết định (CTA-6)."
  owner: op-retry
  kind: check-finding

FE_BUTTON_NO_VARIANT:
  title: "An app button chooses a visual variant"
  title_vi: "Nút ứng dụng tự chọn variant"
  meaning_vi: "Button hoặc IconButton tại <file> truyền variant thay vì để Grammar suy ra từ intent và vị trí."
  causes_vi:
    - "Ứng dụng truyền variant trực tiếp hoặc qua props spread."
  nextStep_vi: "Thay variant bằng intent theo hệ quả của lệnh (CTA-6)."
  owner: op-retry
  kind: check-finding


FE_CLIENT_BOUNDARY:
  title: "Server first; `\"use client\"` only where allowed"
  title_vi: "use client sai chỗ"
  meaning_vi: "`\\\"use client\\\"` ở `<file>` (slot `<slot>` không được là client component)."
  causes_vi:
    - "Vi phạm luật R55: Server-first: `\"use client\"` chỉ ở `index.tsx` của block có tương tác, leaf có tương tác nội tại, và `error.tsx`/`global-error.tsx` (Next bắt buộc); layout/page là server component."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_CLIENT_REACHES_SERVER:
  title: "Client module reaches a server-only import"
  title_vi: "Mô-đun client với tới import chỉ dành cho máy chủ"
  meaning_vi: "Một mô-đun có chỉ thị `\"use client\"` với tới, qua chuỗi import chạy thật (nhiều bước, không tính import chỉ-kiểu), một mô-đun import `server-only`, `next/headers`, `next/server`, `next-intl/server`, `node:*` hoặc `fs`. Lời nhắn nêu client đầu vào và cả chuỗi import."
  causes_vi:
    - "Hook hoặc module dùng chung được client component import gián tiếp lại đọc request ở máy chủ"
    - "Module chỉ chạy ở máy chủ bị import từ đường đi của một client component"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để đọc dữ liệu qua hook SWR gọi `modules/api`, hoặc đưa import ra khỏi đồ thị client theo lời nhắn; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_CLIENT_SERVER_IMPORT:
  title: "A client component imports nothing server-only"
  title_vi: "Client component nhập mã chỉ chạy ở server"
  meaning_vi: "Tệp `\"use client\"` ở `<file>` nhập `<what>` (`server-only`, `next/headers`, module Node), thứ chỉ tồn tại ở server."
  causes_vi:
    - "Vi phạm luật R55: Client component không nhập `server-only`, `next/headers` hay module Node; dữ liệu đến từ hook SWR trong `hooks/swr` gọi `modules/api`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_COMPONENT_API:
  title: "Front-end component exposes a non-canon surface"
  title_vi: "Component FE sai bề mặt công khai"
  meaning_vi: "Component phải có props và slot có kiểu được đặt tên, mỗi khối kết nối có bản trình bày tương ứng, trạng thái đi qua slot view, không mở cửa className hay thuộc tính CSS, không có bản sao trạng thái nghỉ hay prop placeholder, tên lớp nằm ở tệp đi kèm."
  causes_vi:
    - "Component nhận className từ ngoài"
    - "Khối kết nối không có bản trình bày thuần"
    - "Trạng thái dữ liệu tự chế thay vì qua SlotView"
  nextStep_vi: "Sửa chữ ký component theo luật drawing và tách phần trình bày; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (R92; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: op-retry
  kind: check-finding

FE_COMPONENT_DEEP_HOOK_IMPORT:
  title: "Component imports a hook too deeply"
  title_vi: "Thành phần nhập hook quá sâu"
  meaning_vi: "Thành phần giao diện nhập hook dữ liệu không qua cửa (barrel) của thư mục hooks."
  causes_vi:
    - "Nhập thẳng tệp hook thay vì qua barrel"
    - "Đường nhập đi vòng qua nhiều tầng"
  nextStep_vi: "Op interface.implement đổi sang nhập qua barrel hooks của nơi sở hữu."
  owner: other-op:interface.implement
  kind: check-finding

FE_COMPONENT_WORLD_OWNERSHIP:
  title: "Component owns product-world state"
  title_vi: "Thành phần nắm trạng thái của thế giới sản phẩm"
  meaning_vi: "Một thành phần cấp thấp tự giữ dữ liệu, điều hướng, ngôn ngữ hoặc phiên, trong khi chỉ được xử lý tương tác trình duyệt đơn giản."
  causes_vi:
    - "Gọi hook điều hướng hoặc ngôn ngữ trong thành phần thuần"
    - "Đặt vòng đời dữ liệu ở tầng sai"
  nextStep_vi: "Op interface.implement chuyển phần này lên thành phần kết nối (index.tsx) của tầng sở hữu."
  owner: other-op:interface.implement
  kind: check-finding

FE_CONNECTED_BLOCK_RENDER_PAIR:
  title: "Connected block lacks pure render twin"
  title_vi: "Khối kết nối thiếu bản render thuần đi kèm"
  meaning_vi: "Block kết nối (index.tsx) không giao mọi đường render cho hàm thuần trong component.tsx cùng cấp."
  causes_vi:
    - "Viết JSX trực tiếp trong index.tsx"
    - "Chưa có bản thuần trong component.tsx"
  nextStep_vi: "Op interface.implement tách phần hiển thị sang component.tsx và để index.tsx chỉ nối dữ liệu."
  owner: other-op:interface.implement
  kind: check-finding

FE_CONSOLE_CALL:
  title: "No console in product source"
  title_vi: "console.* trong mã sản phẩm"
  meaning_vi: "`console.<method>` ở `<file>` không đi vào pipeline log nào, lộ chi tiết nội bộ trong devtools của người dùng và che mất việc xử lý thật."
  causes_vi:
    - "Vi phạm luật R65: Không `console.*` trong mã sản phẩm; trả outcome có kiểu, hiển thị trạng thái lỗi, hoặc để lỗi tới `error.tsx`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_CHIP_LABEL_CASE:
  title: "A status chip label starts with a lowercase letter"
  title_vi: "Nhãn chip trạng thái bắt đầu bằng chữ thường"
  meaning_vi: "Nhãn chữ của một StatusDot hoặc Badge tại <file> bắt đầu bằng chữ cái thường, nên các chip trong cùng một màn hình đọc thành hai lối viết."
  causes_vi:
    - "Viết nhãn chip như `running` thay vì `Running`."
  nextStep_vi: "Viết hoa chữ cái đầu của nhãn chip; luật tự sửa nhãn viết thẳng trong mã (quy định chip-label-uppercase)."
  owner: op-retry
  kind: check-finding

FE_CONTROL_HEIGHT:
  title: "A control picks a larger size or mixes sizes in one row"
  title_vi: "Điều khiển chọn cỡ lớn hơn hoặc trộn nhiều cỡ trong một hàng"
  meaning_vi: "Điều khiển Grammar tại <file> truyền size lớn hơn chiều cao chuẩn 40px, hoặc đứng cạnh điều khiển khác cỡ trong cùng một hàng."
  causes_vi:
    - "Truyền size lg hoặc xl cho nút, công tắc, ô nhập ngoài khu hero của trang landing."
    - "Trộn size sm với cỡ mặc định trong cùng một thanh công cụ hoặc hàng."
  nextStep_vi: "Bỏ size để Grammar vẽ đúng một chiều cao điều khiển 40px (quy định control-height-40)."
  owner: op-retry
  kind: check-finding

FE_COOKIE_ATTRIBUTES:
  title: "A written cookie leaves its attributes to the defaults"
  title_vi: "Cookie được ghi mà không nêu rõ thuộc tính"
  meaning_vi: "Một lời gọi `set` trên cookie phản hồi của Next (`response.cookies.set`, `cookies().set`) ở `<file>` không nêu `httpOnly` bằng một giá trị cố định, thiếu `secure`, hoặc có `sameSite` khác `lax`/`strict`; cookie phiên khi đó đọc được từ script của trang hoặc đi theo request chéo trang."
  causes_vi:
    - "Vi phạm luật R107: ghi cookie phiên bằng `set(name, value)` không có options, hoặc options thiếu `httpOnly: true`"
    - "`sameSite: \"none\"`, `secure: false` hoặc `httpOnly` lấy từ một biến boolean không cố định"
  nextStep_vi: "Khai báo một hằng số options `as const` trong module sở hữu cookie với `httpOnly: true` (chỉ `false` cho cookie tùy chọn mà script của trang cần đọc), `secure` lấy từ `modules/config` và `sameSite: \"lax\"` hoặc `\"strict\"`, rồi truyền nó vào mọi lần `set`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

FE_COPY_IN_CALL:
  title: "A validation or toast call contains literal display copy"
  title_vi: "Lời gọi kiểm tra dữ liệu hoặc toast chứa chữ hiển thị gõ trực tiếp"
  meaning_vi: "Tệp <file> truyền chữ hiển thị trực tiếp vào thông báo Zod hoặc toast; chữ người dùng đọc phải được lấy từ catalog next-intl."
  causes_vi:
    - "Lời gọi z.string().email chứa câu báo lỗi gõ trực tiếp"
    - "Toast chứa tiêu đề hoặc mô tả gõ trực tiếp"
  nextStep_vi: "Đưa chữ hiển thị vào catalog ngôn ngữ và truyền kết quả t() vào thông báo kiểm tra dữ liệu hoặc toast."
  owner: op-retry
  kind: check-finding

FE_CROSS_APP_DUPLICATE:
  title: "File copied between apps"
  title_vi: "Tệp chép nguyên giữa các app"
  meaning_vi: "Hai tệp TypeScript của hai app khác nhau có nội dung token giống hệt (bỏ qua chú thích và khoảng trắng, giữ tên định danh), kể cả tệp trong cây route. Mã dùng chung là slot `packages/<pkg>`; tệp chỉ gồm import hoặc export lại một ký hiệu của gói thì được phép."
  causes_vi:
    - "Tệp route hoặc helper được chép từ app này sang app khác thay vì đưa vào gói dùng chung"
    - "Mỗi app tự giữ một bản `error.tsx`, `not-found.tsx`, `i18n/request.ts` hay helper kiểm thử giống hệt nhau"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển mã vào một gói `packages/<pkg>` và để mỗi app chỉ re-export ký hiệu của gói theo lời nhắn; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_CUSTOM_HOOK_LOCATION:
  title: "Custom hook declared outside hooks root"
  title_vi: "Hook tự viết nằm ngoài thư mục hooks"
  meaning_vi: "Một hook useX do dự án tự viết được khai báo ngoài thư mục hooks đã cấu hình."
  causes_vi:
    - "Viết hook ngay trong file thành phần"
    - "Đặt hook ở thư mục khác"
  nextStep_vi: "Op interface.implement chuyển hook vào thư mục hooks."
  owner: other-op:interface.implement
  kind: check-finding

FE_DANGEROUS_HTML:
  title: "dangerouslySetInnerHTML only on script"
  title_vi: "dangerouslySetInnerHTML trên phần tử hiển thị"
  meaning_vi: "`<tag>` ở `<file>` dùng `dangerouslySetInnerHTML`: chuỗi bất kỳ (của người dùng, nhà cung cấp, catalog) trở thành mã HTML chạy được."
  causes_vi:
    - "Vi phạm luật R55: Chỉ được `dangerouslySetInnerHTML` trên `<script>` mang JSON-LD hoặc mã khởi tạo theme từ hằng số do app viết; nội dung khác render thành phần tử."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_DESTRUCTIVE_CONFIRM_IN_DIALOG:
  title: "A destructive confirm is outside its confirmation dialog"
  title_vi: "Lệnh xác nhận phá hủy nằm ngoài hộp thoại xác nhận"
  meaning_vi: "Nút destructive confirm tại <file> không nằm trong nội dung AlertDialog hoặc ConfirmDialog cùng tệp."
  causes_vi:
    - "Đặt lần nhấn cuối ngoài hộp thoại hoặc trên trigger."
  nextStep_vi: "Đặt confirm trong nội dung hộp thoại cùng tệp; trigger dùng step entry (CTA-6)."
  owner: op-retry
  kind: check-finding

FE_DIVIDER_FULL_BLEED:
  title: "Horizontal Grammar divider is inset by wrapper padding"
  title_vi: "Divider bị padding ngang của wrapper làm thụt vào"
  meaning_vi: "Divider ngang của Grammar phải dài full và sát viền surface."
  causes_vi:
    - "Wrapper chứa Divider có padding ngang"
  nextStep_vi: "Chuyển padding vào các band nội dung cạnh Divider."
  owner: "op-retry"
  kind: "check-finding"

FE_EFFECT_CLEANUP:
  title: "What an effect starts, its cleanup releases"
  title_vi: "Effect khởi động thứ không được dọn"
  meaning_vi: "`<what>` ở `<file>` (timer, frame, listener, observer, socket hoặc subscription) do effect hoặc `subscribe` khởi động, nhưng cleanup trả về không giải phóng đúng handle, target và listener đó; nó chạy tiếp sau khi component đã gỡ và set state vào chỗ không còn."
  causes_vi:
    - "Vi phạm luật R65: mọi thứ effect hoặc `subscribe` khởi động được cleanup trả về giải phóng cùng handle, target và listener (`clearTimeout(id)`, `cancelAnimationFrame(id)`, `removeEventListener` cùng type và listener, `.disconnect()`, `.close()`, `.unsubscribe()`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_EFFECT_FETCH:
  title: "No data loading inside useEffect"
  title_vi: "Tải dữ liệu trong useEffect"
  meaning_vi: "`useEffect` ở `<file>` gọi `await`, `fetch` hoặc `.then`. Effect không có cache, không gộp request, không có trạng thái loading/lỗi và không huỷ được."
  causes_vi:
    - "Vi phạm luật R50: Đọc dữ liệu bằng hook SWR trong `hooks/swr` gọi operation của `modules/api`; component chỉ gọi hook."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_ENV_OWNER:
  title: "Only `modules/config` reads the environment; no localhost fallback"
  title_vi: "Đọc biến môi trường ngoài modules/config"
  meaning_vi: "`<file>` đọc env (hoặc fallback localhost). Chỉ `modules/config` được đọc env."
  causes_vi:
    - "Vi phạm luật R49: `process.env`/`NEXT_PUBLIC_*` chỉ trong `modules/config`; không fallback `?? \"http://localhost…\"`; thiếu biến ở production thì ném lỗi khi load."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_ERROR_BOUNDARY_MISSING:
  title: "Next app lacks a required error or loading boundary"
  title_vi: "Ứng dụng Next thiếu trang lỗi hoặc trang đang tải bắt buộc"
  meaning_vi: "Mỗi ứng dụng Next phải có global-error.tsx, error.tsx, not-found.tsx và loading.tsx trong src/app theo bảng kê HFS. Thiếu chúng thì khi trang gặp lỗi, không tìm thấy hoặc đang tải, người dùng sẽ thấy màn hình mặc định của khung phần mềm hoặc màn hình trắng thay vì giao diện của sản phẩm."
  causes_vi:
    - "Ứng dụng mới được dựng mà chưa thêm các trang biên lỗi"
    - "Trang lỗi được đặt sai thư mục, ví dụ ngoài src/app/[locale]/"
    - "Tệp bị xoá hoặc đổi tên trong lúc dọn dẹp"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để thêm tệp còn thiếu vào đúng src/app hoặc src/app/[locale]; giao diện của các trang này do người thiết kế duyệt."
  owner: op-retry
  kind: check-finding

FE_GRAMMAR_LAYOUT_ONLY:
  title: "App surface paint violates layout-only composition"
  title_vi: "Ứng dụng tự tô surface thay vì chỉ viết CSS bố cục"
  meaning_vi: "Ứng dụng thêm lớp bg-surface thay vì dùng surface có nền của Grammar."
  causes_vi:
    - "Thêm lớp bg-surface vào phần tử do ứng dụng dựng"
  nextStep_vi: "Giữ CSS ứng dụng chỉ lo bố cục và dùng SurfaceCard hoặc surface có nền khác của Grammar."
  owner: "op-retry"
  kind: "check-finding"

FE_GRAPHQL_CONTRACT:
  title: "A front-end GraphQL document is one its back end serves"
  title_vi: "Tài liệu GraphQL của front end không khớp hợp đồng của back end"
  meaning_vi: "Một thao tác trong tệp `.graphql` dưới `fe/` không khớp ảnh chụp hợp đồng `be/contracts/<service>/schema.graphql` của dịch vụ phục vụ trường gốc đầu tiên của nó: trường, đối số hoặc trường input không được khai báo, thiếu đối số bắt buộc, biến khác kiểu, chọn trường trên giá trị lá hoặc thiếu lựa chọn trên đối tượng, biến khai báo mà không dùng, hoặc không hợp đồng nào phục vụ trường gốc đó."
  causes_vi:
    - "Vi phạm luật R113: front end gửi một tài liệu viết theo hợp đồng cũ (ví dụ `(request: ...)` trong khi back end nhận `input`), nên lời gọi hỏng khi chạy mà type-check của front end không thấy."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa tài liệu `.graphql` cho khớp hợp đồng (hoặc chạy `starci app emit` nếu ảnh chụp đã cũ); không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_HOOKS_ARE_HOOKS:
  title: "`hooks/` hold hooks and one shared file per domain"
  title_vi: "hooks/ chứa thứ không phải hook"
  meaning_vi: "`<file>` trong `hooks/` không phải React hook, hoặc một domain có nhiều hơn một tệp `.shared.ts` (hay tệp shared không mang tên domain), hoặc một helper được khai báo ở nhiều tệp của domain. Hàm gọi mạng về `modules/api`, helper về `<domain>.shared.ts`."
  causes_vi:
    - "Vi phạm luật R56: `hooks/` chỉ chứa hook: `hooks/swr` (mỗi operation của `modules/api` một hook SWR), `hooks/rhf`, `hooks/zustand/<store>`, `hooks/socketio`, `hooks/effects`, `hooks/reuseables` và `hooks/<domain>/` với một `<domain>.shared.ts` cho helper dùng chung."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_HREF_RESOLVES:
  title: "Link points to a route that does not exist"
  title_vi: "Liên kết trỏ tới đường dẫn không tồn tại"
  meaning_vi: "Một liên kết viết thẳng trong code (href, redirect hoặc router.push) trỏ tới đường dẫn mà không tệp page.tsx hay route.ts nào của ứng dụng phục vụ. Người dùng bấm vào sẽ gặp trang 404."
  causes_vi:
    - "Gõ sai đường dẫn hoặc đổi tên route mà quên sửa liên kết"
    - "Route đã bị xoá hoặc chưa được tạo"
    - "Thiếu một tham số động trong đường dẫn so với cấu trúc thư mục route"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa liên kết cho khớp route thật hoặc tạo route còn thiếu; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_HTTP_STATUS_COLLAPSE:
  title: "One `GraphQLResponse<T>` envelope; 401 and 403 become `refused`"
  title_vi: "Gộp mọi lỗi thành một nhánh"
  meaning_vi: "`<file>` gộp mọi lỗi thành một nhánh hoặc biến lỗi thành dữ liệu rỗng. UNAUTHENTICATED/FORBIDDEN (401/403) phải thành `refused`."
  causes_vi:
    - "Vi phạm luật R51: Một envelope `GraphQLResponse<T>` (`success`, `message`, `error`, `data`) trong `modules/api/graphql/types.ts`; 401/403 → `refused` (error link làm mới token một lần rồi đưa về đăng nhập); cấm `return null` khi lỗi; không hiển thị nguyên văn lỗi server làm lý do."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

FE_I18N_CATALOG:
  title: "Same keys in every catalog, real catalog in specs, `pick` for clients"
  title_vi: "Catalog ngôn ngữ lệch key"
  meaning_vi: "Catalog `<locale>` thiếu/thừa key `<k>`."
  causes_vi:
    - "Vi phạm luật R60: Catalog các locale cùng tập key; không key thừa/thiếu; spec dùng catalog thật (không mock `useTranslations` trả key); catalog tách namespace, client chỉ nhận `pick`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_I18N_FORMATTER:
  title: "Numbers, money and dates through the next-intl formatter"
  title_vi: "Định dạng số, tiền, ngày ngoài formatter của next-intl"
  meaning_vi: "`<file>` định dạng bằng `<what>` (`toLocale*String`, `new Intl.*`, `toFixed` hiển thị, ký hiệu tiền dán vào template hoặc thư viện ngày) thay vì formatter của next-intl, nên locale và múi giờ lệch giữa server và trình duyệt."
  causes_vi:
    - "Vi phạm luật R59: Số, tiền, ngày dùng `useFormatter()` / `getFormatter()` của next-intl; định dạng dùng chung khai báo một lần trong `modules/i18n`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_I18N_KEYS:
  title: "Catalog keys and the source that reads them agree"
  title_vi: "Khóa catalog và mã nguồn đọc chúng không khớp"
  meaning_vi: "Mã nguồn đọc khóa `<key>` mà một locale không có, hoặc catalog `<f>` giữ khóa `<key>` mà không đoạn mã nào của app hay của package dùng chung đọc tới."
  causes_vi:
    - "Vi phạm luật R106: khóa đọc bằng literal qua `next-intl` (`t`, `t.rich`, `t.raw`, `t.markup`) phải có trong mọi locale; khóa của catalog mà không chuỗi nào trong mã nguồn có thể đang đọc thì phải xóa."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm khóa vào mọi catalog của app hoặc đọc khóa có thật; xóa khóa chết khỏi mọi catalog; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

FE_I18N_LITERAL:
  title: "No display text at any tier, no escape comment"
  title_vi: "Chữ hiển thị không đi qua t()"
  meaning_vi: "Chữ `\\\"<text>\\\"` ở `<file>:<line>` không đi qua `t()`."
  causes_vi:
    - "Vi phạm luật R58: Không chữ hiển thị (JSX text, `aria-label`, `title`, `placeholder`, `alt`, object copy) ở MỌI tầng, mọi ngôn ngữ; `<html lang>` lấy từ `[locale]`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_I18N_NAVIGATION:
  title: "Navigation from modules/i18n/navigation"
  title_vi: "Điều hướng không đi qua next-intl"
  meaning_vi: "`<file>` dùng `next/link`, `useRouter`, `usePathname`, `redirect` của Next hoặc thẻ `<a>` cho route nội bộ: mất tiền tố `[locale]`, mất prefetch, tải lại cả trang."
  causes_vi:
    - "Vi phạm luật R59: `Link`, `useRouter`, `usePathname`, `redirect` lấy từ `modules/i18n/navigation`; liên kết ngoài mở tab mới phải có `rel=\"noopener noreferrer\"`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_I18N_PLACEMENT:
  title: "`next-intl`, `[locale]`, `modules/i18n/`"
  title_vi: "i18n sai chuẩn next-intl"
  meaning_vi: "i18n của app `<a>` không theo chuẩn (`<detail>`)."
  causes_vi:
