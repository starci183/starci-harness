    - "Thiếu định danh tài nguyên khi làm mới"
  nextStep_vi: "Op interface.implement gắn định danh tài nguyên vào khóa của thao tác ghi."
  owner: other-op:interface.implement
  kind: check-finding

FE_SWR_OUTSIDE_FAMILY:
  title: "An SWR runtime call is outside its hook family"
  title_vi: "Lời gọi SWR nằm ngoài họ hook được khai báo"
  meaning_vi: "Tệp <file> gọi SWR trực tiếp ở component, feature hoặc hook miền thay vì dùng hook thuộc họ SWR chịu trách nhiệm lấy dữ liệu."
  causes_vi:
