BE_AMBIENT_CLOCK:
  title: "Ambient clock read directly"
  title_vi: "Đọc đồng hồ hệ thống trực tiếp"
  meaning_vi: "Một tệp (kể cả spec) ngoài platform/clock tham chiếu tới đồng hồ hệ thống: Date.now, new Date() không tham số, performance.now, process.hrtime hoặc Temporal.Now, dù gọi hay chỉ tham chiếu, nên không có cách nào thay đồng hồ trong một spec hoặc lái một job theo lịch tới một thời điểm chọn trước."
  causes_vi:
    - "const startedAt = Date.now()"
    - "const at = new Date()"
    - "const mark = performance.now()"
    - "const read = Date.now, hoặc const { now } = performance"
  nextStep_vi: "Tiêm cổng Clock (đọc thời gian qua clock.now()) thay vì đọc đồng hồ hệ thống trực tiếp; một spec lái thời gian bằng FakeClock của @starci/jest-preset. op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

BE_AMBIENT_ID:
  title: "An id is minted from the ambient random source"
  title_vi: "Mã định danh được sinh trực tiếp từ nguồn ngẫu nhiên"
  meaning_vi: "Mã ở `<file>` gọi `randomUUID` của Node crypto (import tên, import namespace hoặc `crypto` toàn cục), một bộ sinh `v1`, `v4`, `v6`, `v7` của `uuid`, hoặc `nanoid`/`ulid` thay vì lấy từ cổng `Ids`; spec khi đó không điều khiển được mã nào được sinh ra và một lần chạy lỗi không tái hiện được."
  causes_vi:
    - "Vi phạm luật R142: dịch vụ gọi `randomUUID()` trực tiếp để tạo khóa hoặc mã sự kiện"
    - "Spec tự sinh mã bằng `randomUUID` thay vì dùng `fakeIds()`"
  nextStep_vi: "Tiêm cổng bằng `@InjectIds() private readonly ids: Ids` và gọi `ids.next()`; trong spec cấp `fakeIds([...])` qua token của `platform/ids`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

