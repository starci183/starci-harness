  owner: other-op:interface.implement
  kind: check-finding

FE_STYLE_TOKEN_ONLY:
  title: "CSS bypasses grammar tokens"
  title_vi: "CSS không đi qua token của grammar"
  meaning_vi: "CSS của app dùng giá trị màu, khoảng cách, bo góc hoặc chữ viết thẳng, giá trị thô ngoài brand.css, !important, selector class, CSS module, khai lại token của grammar, breakpoint ngoài thang, hoặc globals.css sai hình dạng và sai thứ tự import; hoặc màu trạng thái không theo cặp mềm HeroUI (thiếu --<tông>-soft/--<tông>-soft-foreground ở sáng hoặc tối, độ tương phản dưới ngưỡng, chữ hay icon tô bằng tông trạng thái đặc)."
  causes_vi:
    - "Hex, rgb, hsl, oklch hoặc px viết trong CSS ngoài modules/brand/brand.css"
    - "Biến --tên-riêng thay cho token grammar, hoặc khai lại token của grammar ngoài brand.css"
    - "Có tệp *.module.css hoặc selector class trong CSS của app"
    - "globals.css chứa thứ ngoài @import, @source và khối token, hoặc import sai thứ tự"
    - "@media dùng breakpoint ngoài thang của grammar"
    - "brand.css thiếu cặp mềm của một tông trạng thái ở sáng hoặc tối, chữ mềm dưới 3:1 trên nền nhạt hoặc nền trang, --foreground dưới 4.5:1, hoặc giá trị màu không phân giải được"
    - "Component tô chữ hoặc icon bằng text-success, text-danger, fill-warning, stroke-info (tông đặc) thay vì text-<tông>-soft-foreground"
  nextStep_vi: "Op interface.implement bỏ CSS riêng, dùng component và token của grammar; giá trị màu thương hiệu chỉ khai ở modules/brand/brand.css cho cả sáng và tối, đủ cặp mềm cho mọi tông trạng thái; chữ và icon trạng thái dùng text-<tông>-soft-foreground (R61; FE-RULE-OWNERSHIP: knowledge/patterns/fe/index.yaml; packages/eslint/grammar-core/README.md)."
  owner: other-op:interface.implement
  kind: check-finding

FE_SUBSCRIPTION_NO_SNAPSHOT:
  title: "A subscription hook does not revalidate its snapshot when the stream opens"
  title_vi: "Hook đăng ký không đọc lại ảnh chụp trạng thái khi luồng mở"
  meaning_vi: "Tệp <file> gọi operation luồng (SSE hoặc GraphQL subscription) mà không truyền onOpen để đọc lại truy vấn trạng thái; luồng chỉ mang thay đổi, không mang trạng thái, nên màn hình lỡ các thay đổi trong lúc mất kết nối."
  causes_vi:
    - "Lời gọi operation luồng không có onOpen"
    - "onOpen rỗng nên truy vấn trạng thái không được đọc lại"
  nextStep_vi: "Truyền onOpen: () => void mutate(<khóa truy vấn trạng thái>) cho operation luồng trong hook useSubscribe."
  owner: op-retry
  kind: check-finding


FE_SUSPENSE_NULL_FALLBACK:
  title: "Suspense fallback renders something"
  title_vi: "Suspense có fallback rỗng"
  meaning_vi: "`<Suspense>` ở `<file>` có `fallback={null}` hoặc không có fallback: người dùng thấy một khoảng trống, không biết trang đang tải."
  causes_vi:
    - "Vi phạm luật R53: `Suspense fallback={null}` bị cấm; fallback là trạng thái loading (skeleton) của đúng thứ đang tải."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_SWALLOWED_ERROR:
