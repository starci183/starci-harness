  kind: check-finding

FE_TIER_DIRECTION:
  title: "Frontend import against the tier direction"
  title_vi: "Frontend import ngược chiều tầng"
  meaning_vi: "Một tệp frontend import từ tầng mà bảng kê HFS không cho phép: route chỉ nhìn xuống feature, feature chỉ nhìn xuống components, hooks và modules, hai feature không bao giờ import nhau, và một lớp component chỉ import các lớp đứng sau nó (blocks, composites, branches, leaves)."
  causes_vi:
    - "Một feature import một feature khác thay vì đưa phần dùng chung xuống components, hooks hoặc modules"
    - "Một component import ngược lên lớp cao hơn hoặc lên feature"
    - "Một module import hooks hoặc components"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển phần dùng chung xuống tầng thấp hơn rồi cho cả hai bên import từ đó; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

FE_TRANSPORT_OWNER:
  title: "One transport: the Apollo clients and the one axios instance of modules/api"
  title_vi: "Gọi back end ngoài transport duy nhất"
  meaning_vi: "`fetch` hoặc thư viện HTTP/GraphQL khác ở `<file>` ngoài transport duy nhất của repository (gọi, gán lại hoặc truyền như giá trị), repository có nhiều hơn một thư mục client hoặc nhiều hơn một envelope `GraphQLResponse` (mỗi app giữ một bản, hoặc gói api cộng thêm một bản của app), hoặc state dùng chung dạng `let` giữ token/locale."
  causes_vi:
    - "Vi phạm luật R50: Mỗi repository đúng một transport: client Apollo auth/no-auth với chuỗi link (retry, error, timeout, refresh, access token, http) trong `modules/api/graphql/clients/` của app duy nhất hoặc `packages/<family>-api/src/graphql/clients/` khi các app dùng chung, và một instance axios trong `modules/api/rest` cho upload, presigned URL và endpoint auth; component đọc qua hook `hooks/swr`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra và mục của luật trong tiêu chuẩn HFS; nợ cũ cần quyết định thiết kế nên op không thêm ngoại lệ, chỉ tách hoặc chuyển về đúng chủ."
  owner: op-retry
  kind: check-finding

FE_TYPE_ESCAPE:
  title: "No type assertion, non-null assertion or any in product source"
  title_vi: "Ép kiểu, `!` hoặc `any` trong mã sản phẩm"
  meaning_vi: "`<file>` dùng `as T`, `x!` hoặc `any`: trình biên dịch bị bảo tin một điều nó không kiểm được, và lỗi dời sang trình duyệt của người dùng."
  causes_vi:
    - "Vi phạm luật R22: Không ép kiểu (`as T`, `<T>x`), không `!`, không `any` trong mã sản phẩm; thu hẹp bằng type guard, discriminant hoặc parser tại nơi dữ liệu đi vào. Ngoại lệ duy nhất là `as const` và `as unknown`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; nợ cũ được chia thành các lane sửa cơ học, op không thêm ngoại lệ và không tắt luật."
  owner: op-retry
  kind: check-finding

FE_VENDOR_BOUNDARY:
  title: "Vendor primitive or icon used outside its owner"
  title_vi: "Thư viện giao diện bên ngoài dùng ngoài chủ sở hữu"
  meaning_vi: "Biểu tượng của bộ icon ứng dụng, họ heroicons (@heroicons/react trước, @starci/heroicons cho glyph heroicons còn thiếu, ở hai nhánh 24/outline và 16/solid), chỉ đến component qua lá icon với kích thước theo thang glyph; mỗi primitive của thư viện ngoài nằm sau một chủ sở hữu có tên."
  causes_vi:
    - "Import thẳng @heroicons/react hoặc @starci/heroicons trong component thay vì qua lá icon"
    - "Dùng bộ glyph thứ hai ngoài họ heroicons (Phosphor, Lucide, Iconify...)"
