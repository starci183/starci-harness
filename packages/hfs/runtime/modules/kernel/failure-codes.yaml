    - "`--env local` và hook commit chỉ liệt kê, `--env prod` (hook push, CI, phát hành) chặn."
  nextStep_vi: "Vẽ lại thay đổi trên canvas bằng /claude-design, chờ chủ dự án nói \"đẹp\" rồi đặt approved với approvedAt mới trong design.json, sau đó mới code; commit cùng thay đổi mục của trang."
