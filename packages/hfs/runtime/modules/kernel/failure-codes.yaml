  kind: check-finding

FE_I18N_LOCALE_MISSING:
  title: "Every declared locale has its catalog, and every catalog is a declared locale"
  title_vi: "Locale khai báo thiếu catalog, hoặc catalog của locale không khai báo"
  meaning_vi: "`defineI18n` của app khai báo một locale mà `modules/i18n/messages/<locale>.json` chưa được track, hoặc có một catalog cho locale mà `defineI18n` không khai báo. FE_I18N_CATALOG chỉ so key giữa các catalog đang có, nên một locale không có catalog nào lọt qua và next-intl phục vụ locale đó không có câu chữ."
  causes_vi:
    - "Vi phạm R60 (FE-I18N-3): thêm locale vào `defineI18n` mà chưa viết catalog, hoặc xóa locale nhưng để lại catalog."
    - "`--env local` chỉ liệt kê, `--env prod` (hook push, CI, phát hành) chặn."
  nextStep_vi: "Viết catalog cho locale khai báo với đủ key như các locale khác, hoặc bỏ locale khỏi `defineI18n`; xóa catalog của locale không khai báo."
  owner: op-retry
  kind: check-finding
  localOnly: true

FE_I18N_FORMATTER:
  title: "Numbers, money and dates through the next-intl formatter"
  title_vi: "Định dạng số, tiền, ngày ngoài formatter của next-intl"
  meaning_vi: "`<file>` định dạng bằng `<what>` (`toLocale*String`, `new Intl.*`, `toFixed` hiển thị, ký hiệu tiền dán vào template hoặc thư viện ngày) thay vì formatter của next-intl, nên locale và múi giờ lệch giữa server và trình duyệt."
