  title: "Measured back-end logic file is below 100 percent coverage"
  title_vi: "Tệp logic back-end trong phạm vi đo chưa đạt độ bao phủ 100 phần trăm"
  meaning_vi: "Báo cáo lcov được cung cấp không chứng minh mỗi tệp logic trong phạm vi đo của edition đạt 100 phần trăm dòng, hàm và nhánh; phạm vi cùng các tệp ngoài phạm vi được liệt kê riêng. Độ bao phủ câu lệnh do trình chạy unit test kiểm tra."
  causes_vi:
    - "Có dòng, hàm hoặc nhánh chưa được chạy trong một tệp logic thuộc phạm vi đo"
    - "Báo cáo thiếu tệp nguồn, thiếu số liệu, sai định dạng hoặc không đọc được"
  nextStep_vi: "Bổ sung unit test cho tệp được nêu, tạo lại báo cáo lcov đầy đủ rồi chạy starci app check --coverage-from <lcov>; features, cli và webhooks ngoài phạm vi đo vẫn được liệt kê."
  owner: op-retry
  kind: check-finding

HFS_COVERAGE_SCOPE_DRIFT:
  title: "A file states a coverage scope the slot manifest does not derive"
  title_vi: "Tệp nêu phạm vi độ phủ khác với phạm vi suy ra từ slot manifest"
  meaning_vi: "Phạm vi độ phủ (những tệp nào bị đo 100% từng tệp) chỉ có một nguồn: trường `coverage: required|none` của từng slot be trong knowledge/hfs/slots.yaml cùng ruleParams.be.logicRoles, qua scripts/hfs/coverage-scope.mjs. Ba nơi dùng phạm vi đó đều do starci app sync sinh: be/jest.config.js (ngưỡng từng tệp), dòng sonar.coverage.exclusions của sonar-project.properties và codecov.yml (đường dẫn cùng các component theo từng service app và platform). `<detail>` nêu tệp đã lệch khỏi bản sinh; không ai được sửa tay phạm vi này."
  causes_vi:
    - "Sửa tay be/jest.config.js, codecov.yml hoặc dòng sonar.coverage.exclusions để đo ít tệp hơn hoặc thêm ngoại lệ"
    - "Đổi trường coverage của slot hoặc ruleParams.be.logicRoles nhưng chưa chạy lại starci app sync"
    - "Thêm service app hoặc capability mới nên các component của codecov.yml đã cũ"
  nextStep_vi: "Chạy `npx starci app sync --write` để sinh lại ba tệp từ slot manifest; muốn đổi phạm vi thì đổi trường `coverage` của slot (và ruleParams.be.logicRoles) trong .claude runtime, không sửa tệp sinh. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DB_DEPLOY_UNGUARDED:
  title: "Database deployment accepts a non-tag ref"
  title_vi: "Triển khai cơ sở dữ liệu chấp nhận ref không phải tag"
  meaning_vi: "Mỗi đường chạy triển khai migration phải từ chối ref không phải tag phát hành trước khi tác động cơ sở dữ liệu."
  causes_vi:
    - "Workflow db-deploy thiếu chốt kiểm tag hoặc chốt không chặn đường chạy migration theo luật R271."
  nextStep_vi: "Thêm chốt kiểm ref tag trước mỗi bước triển khai migration, rồi chứng minh ref nhánh bị từ chối."
  owner: op-retry
  kind: check-finding

HFS_DECLARATION_INVALID:
  title: "hfs.json missing or invalid"
  title_vi: "hfs.json thiếu hoặc sai định dạng"
  meaning_vi: "Kho mã không có tệp hfs.json hợp lệ nên không thể biết nó theo chuẩn HFS nào, có những ứng dụng nào và bật những ô tuỳ chọn nào."
  causes_vi:
    - "Thiếu tệp hfs.json ở gốc kho, hoặc tệp không đọc được như JSON"
    - "Loại ứng dụng không có trong bảng kê của HFS, ví dụ một loại ứng dụng do kho tự đặt"
    - "optionalSlots ghi một ô không phải loại tuỳ chọn, hoặc ghi một ô mà loại ứng dụng đã tự bật"
    - "Thiếu loại ứng dụng bắt buộc, ví dụ chưa khai ứng dụng api hoặc chưa khai ứng dụng migrate dù đã khai kết nối cơ sở dữ liệu"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa hfs.json theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DEPENDABOT_MISSING:
  title: "Apps declare scheduled dependency updates"
  title_vi: "Ứng dụng thiếu cấu hình cập nhật phụ thuộc"
  meaning_vi: "Kho thiếu .github/dependabot.yml hợp lệ với lịch cập nhật npm, github-actions và docker."
  causes_vi:
    - "Vi phạm R269: một hệ sinh thái phụ thuộc chưa được theo dõi cập nhật định kỳ."
  nextStep_vi: "Khai báo Dependabot version 2 với directory và schedule cho npm, github-actions và docker."
  owner: op-retry
  kind: check-finding

HFS_DEPLOY_COMPOSE_ON_VPS:
  title: "Docker compose lifecycle commands are dev-only"
  title_vi: "Docker Compose được dùng ngoài môi trường dev"
  meaning_vi: "Tệp tại <path> chạy docker compose up, down hoặc pull cho môi trường không phải dev; triển khai VPS dùng Docker Swarm."
  causes_vi:
    - "Vi phạm R250: dùng vòng đời Compose trong production, staging hoặc trên VPS."
  nextStep_vi: "Dùng stack Swarm đã khai báo để triển khai VPS; chỉ giữ Compose cho môi trường dev được xác định rõ."
  owner: op-retry
  kind: check-finding

HFS_DEPLOY_NO_LOGIC:
  title: "Deploy shell scripts delegate to the app CLI"
  title_vi: "Script triển khai chứa logic của ứng dụng"
  meaning_vi: "Script triển khai tại <path> chạy node -e, psql, SQL nội tuyến hoặc tải và thực thi shell; logic phải nằm trong ứng dụng và có spec."
  causes_vi:
    - "Vi phạm R250: đặt logic hoặc truy cập cơ sở dữ liệu trực tiếp trong deploy/*.sh."
  nextStep_vi: "Đưa logic vào lệnh be/apps/cli có spec rồi để script triển khai gọi docker, starci hoặc CLI đã biên dịch."
  owner: op-retry
  kind: check-finding

HFS_DEPLOY_SCHEDULER:
  title: "Workflow scheduling does not own app work"
  title_vi: "Workflow tự lập lịch cho tác vụ ứng dụng"
  meaning_vi: "Workflow tại <path> có lịch chạy thay cho scheduler của ứng dụng; tác vụ định kỳ phải thuộc back end hoặc job đã khai báo."
  causes_vi:
    - "Vi phạm R250: dùng sự kiện schedule hoặc lịch trong workflow để chạy tác vụ ứng dụng."
  nextStep_vi: "Bỏ lịch khỏi workflow và đưa tác vụ sang scheduler của ứng dụng hoặc replicated-job đã khai báo."
  owner: op-retry
  kind: check-finding

HFS_DEPLOY_WORKFLOW:
  title: "Deployment workflows declare protected jobs and sealed custody"
  title_vi: "Workflow triển khai thiếu kiểm soát hoặc sai nơi giữ bí mật"
  meaning_vi: "Workflow triển khai tại <path> thiếu environment, permissions, concurrency hoặc bước materialize; hoặc dùng dotenv hay bí mật ngoài danh sách cho phép."
  causes_vi:
    - "Vi phạm R251: workflow bỏ qua môi trường bảo vệ hoặc lấy bí mật ứng dụng từ GitHub thay cho kho mã hoá."
  nextStep_vi: "Khai báo environment, permissions và concurrency; materialize bí mật đã mã hoá với SOPS_AGE_KEY; chỉ cho phép khoá SSH và known_hosts phục vụ vận chuyển."
  owner: op-retry
  kind: check-finding

HFS_DEP_VERSION_SKEW:
  title: "One version per dependency in the workspace"
  title_vi: "Một gói nhiều phiên bản"
  meaning_vi: "`<pkg>` có `<n>` version trong workspace (`<list>`). Chỉ được một."
  causes_vi:
    - "Vi phạm luật R14: Mỗi dependency một version trong workspace; cấm bản sao lồng thứ hai (`apps/*/node_modules/@starci/grammar`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_BASE_PIN:
  title: "A Dockerfile base image is not pinned"
  title_vi: "Image nền của Dockerfile không được ghim"
  meaning_vi: "Mọi FROM của Dockerfile phải là một stage trước đó, image node duy nhất của chuẩn (phiên bản node và bản alpine cụ thể), hoặc image ghim bằng digest `@sha256`; không dùng tag trôi nổi (`latest`, `node:22`) và không để build argument chưa xác định."
  causes_vi:
    - "Vi phạm luật R190: tag trôi nổi làm image đổi nội dung mà không có thay đổi nào trong repo, nên build không tái lập và lỗ hổng mới lọt vào không dấu vết."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi FROM thành image node của chuẩn (xem `NODE_IMAGE` trong scripts/hfs/rules/docker.mjs) hoặc ghim image bằng digest `@sha256`."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_BUILD_CONTEXT:
  title: "The Dockerfile does not build from the app root"
  title_vi: "Dockerfile không build từ gốc app"
  meaning_vi: "Dockerfile của app phải ghi trong comment đầu tệp lệnh `starci docker build <app>` đúng app của chính nó (context là gốc app, nơi có `package.json` và lockfile duy nhất), và mọi nguồn của COPY/ADD nằm trong context (không có `..`, không có đường dẫn tuyệt đối)."
  causes_vi:
    - "Vi phạm luật R187: context build là gốc app; lệnh build sai hoặc nguồn COPY vượt ra ngoài context khiến image build được trên máy này nhưng hỏng trên CI hoặc trộn lẫn dữ liệu của app khác."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt lệnh `starci docker build <app>` vào comment đầu Dockerfile và sửa các nguồn COPY/ADD về đường dẫn tương đối trong gốc app."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_ENTRY:
  title: "The Dockerfile does not start the app's own entry or declare its port and health"
  title_vi: "Dockerfile không chạy đúng entry của app hoặc thiếu cổng và healthcheck"
  meaning_vi: "Stage `runtime` phải chạy entry đã build của chính app ở dạng exec (be: `node be/dist/apps/<app>/src/main.js`; fe: `node fe/apps/<app>/server.js`); app api hoặc Next đặt `ENV PORT`, EXPOSE đúng cổng đó và có HEALTHCHECK; worker có HEALTHCHECK theo tiến trình và không EXPOSE; cli/migrate ghi `HEALTHCHECK NONE` và không EXPOSE; app Next build bằng `turbo run build --filter=@<project>/<app>` và `next.config.ts` đặt `output: \"standalone\"`."
  causes_vi:
    - "Vi phạm luật R189: một image khởi động sai entry, không công bố cổng hoặc không có healthcheck thì nền tảng không thể điều phối hay phát hiện lỗi của nó."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa CMD/ENTRYPOINT về entry của app, thêm `ENV PORT`, `EXPOSE`, `HEALTHCHECK` (hoặc `HEALTHCHECK NONE` cho cli), và đặt `output: \"standalone\"` trong `next.config.ts` của app Next."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_HEALTHCHECK_FAKE:
  title: "API Docker healthcheck cannot reach its live route"
  title_vi: "Healthcheck Docker của API không tới được route live"
  meaning_vi: "Healthcheck không chứng minh API còn phục vụ liveness vì lệnh luôn thành công hoặc gọi route không tồn tại."
  causes_vi:
    - "HEALTHCHECK CMD true hoặc lệnh không kiểm tra thành công của route live đã đăng ký"
  nextStep_vi: "Dùng healthcheck HTTP kiểm tra thành công của route liveness thật của API và giữ lỗi probe thành exit code khác không."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_SECRETS:
  title: "A secret enters an image"
  title_vi: "Bí mật bị đưa vào image"
  meaning_vi: "Không được COPY/ADD tệp `.env*` (trừ `.env.example`) hay đường dẫn trong `.starcistacks`, `.secrets`, `.volume`, khóa, chứng chỉ, kubeconfig; không ADD một URL; không có ARG hoặc ENV mang tên một thông tin xác thực (PASSWORD, SECRET, TOKEN, KEY, CREDENTIAL, PRIVATE); riêng `NEXT_PUBLIC_*` được phép vì được công khai theo thiết kế."
  causes_vi:
    - "Vi phạm luật R191: mọi thứ trong layer hoặc lịch sử image đều lấy ra được; một bí mật trong image là bí mật đã lộ cho mọi nơi image được kéo về."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ COPY/ADD hoặc ARG/ENV đó, mount thông tin xác thực lúc chạy, và tải về bằng stage có kiểm checksum thay vì ADD URL."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_STAGES:
  title: "The Dockerfile stages, user or install break the canon"
  title_vi: "Các stage, user hoặc lệnh cài của Dockerfile sai chuẩn"
  meaning_vi: "Dockerfile phải nhiều stage: một stage tên `build` (cài và build) và stage cuối tên `runtime` (thứ được chạy); runtime kết thúc bằng `USER node` và không chạy build; mọi lệnh cài đi qua `starci npm ci` (không dùng `starci npm install`); runtime của be chỉ cài dependency production và bỏ lifecycle scripts, runtime của fe không cài gì."
  causes_vi:
    - "Vi phạm luật R188: image chạy bằng root, mang theo công cụ build hoặc cài không theo lockfile thì vừa lớn vừa kém an toàn, và không tái lập được."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tách Dockerfile thành stage `build` và stage cuối `runtime`, thêm `USER node`, đổi `starci npm install` thành `starci npm ci`, và chuyển mọi lệnh build ra khỏi runtime."
  owner: op-retry
  kind: check-finding

HFS_DOC_COMMAND_UNKNOWN:
  title: "Product documentation cites an unknown command"
  title_vi: "Tài liệu sản phẩm dẫn lệnh không tồn tại"
  meaning_vi: "Lệnh npm run không có script tương ứng trong package.json hoặc verb starci app không có trong catalog CLI."
  causes_vi:
    - "Script hoặc verb được đổi hay bỏ nhưng tài liệu chưa đổi theo luật R270."
  nextStep_vi: "Dùng lệnh hiện có trong package.json hoặc catalog CLI, hoặc khai báo script sản phẩm còn thiếu."
  owner: op-retry
  kind: check-finding

HFS_DOC_ENV_UNKNOWN:
  title: "Product documentation cites an undeclared environment key"
  title_vi: "Tài liệu sản phẩm dẫn khóa môi trường chưa khai báo"
  meaning_vi: "Tên khóa được tài liệu dẫn không có trong bộ đọc môi trường có kiểu hoặc KEYS.md; kiểm tra chỉ đọc tên, không đọc giá trị bí mật."
  causes_vi:
    - "Tên khóa cũ còn trong tài liệu hoặc bộ đọc chưa khai báo khóa theo luật R270."
  nextStep_vi: "Cập nhật tên khóa hoặc khai báo khóa trong bộ đọc môi trường và KEYS.md, không đưa giá trị bí mật vào tài liệu."
  owner: op-retry
  kind: check-finding

HFS_DOC_NOT_ENGLISH:
  title: "Document is not English"
  title_vi: "Tài liệu không viết bằng tiếng Anh"
  meaning_vi: "Tệp Markdown hoặc YAML trong knowledge/, docs/, src/ hoặc apps/ có chữ cái tiếng Việt (kể cả trong khối mã của Markdown); tài liệu, mẫu và ví dụ phải viết bằng tiếng Anh."
  causes_vi:
    - "Viết hoặc dán đoạn tiếng Việt vào tài liệu, mẫu, ví dụ hay lời trích của chủ dự án"
    - "Đặt dữ liệu YAML có tiếng Việt ngoài slot danh mục thông điệp hoặc slot fixture i18n"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: dịch dòng được nêu sang tiếng Anh. Chỉ dữ liệu YAML trong slot danh mục thông điệp hoặc slot fixture i18n được giữ tiếng khác; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_DOC_PATH_MISSING:
  title: "Product documentation cites a missing path"
  title_vi: "Tài liệu sản phẩm dẫn đường dẫn không còn tồn tại"
  meaning_vi: "README, tài liệu hoặc README của stack dẫn một tệp hay thư mục mà cây sản phẩm không có, trong cả lite và full."
  causes_vi:
    - "Đổi hoặc xóa đường dẫn nhưng chưa cập nhật tài liệu theo luật R270."
  nextStep_vi: "Sửa đường dẫn được dẫn hoặc khôi phục tệp đúng trong sản phẩm rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_DOC_RULE_UNKNOWN:
  title: "Product documentation cites an unknown HFS rule"
  title_vi: "Tài liệu sản phẩm dẫn luật HFS không tồn tại"
  meaning_vi: "Mã R được dẫn không có trong catalog luật HFS hiện hành của runtime."
  causes_vi:
    - "Dẫn sai mã luật hoặc dùng mã chưa được đăng ký theo luật R270."
  nextStep_vi: "Dùng đúng mã luật hiện có trong knowledge/hfs/rules.yaml và cập nhật đoạn tài liệu liên quan."
  owner: op-retry
  kind: check-finding

HFS_DUPLICATE_CODE:
  title: "Duplicated code block"
  title_vi: "Mã trùng lặp"
  meaning_vi: "Một đoạn mã (bỏ qua khác biệt về tên biến và giá trị chữ hoặc số) xuất hiện hai lần trong mã sản phẩm: ở hai chủ sở hữu, ở hai tệp của một chủ sở hữu, hoặc hai lần trong một tệp. Ngưỡng số dòng và số token là một định nghĩa duy nhất trong ruleParams.<profile>.duplicateBlock của knowledge/hfs/slots.yaml; lời nhắn của bộ kiểm tra ghi rõ ngưỡng và hai vị trí."
  causes_vi:
    - "Op cần một hàm hỗ trợ đã có ở nơi khác nhưng chép lại thay vì dùng chung"
    - "Hai nơi cùng tự viết một logic giống nhau vì chưa ai đưa nó vào chỗ dùng chung"
    - "Đoạn mã được chép nguyên rồi chỉ đổi tên biến hoặc hằng số"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để đưa đoạn mã về một chỗ duy nhất theo lời nhắn (trong cùng chủ sở hữu, hoặc src/modules/platform/primitives, module miền của năng lực đó, hay packages/* với FE) rồi gọi từ cả hai nơi; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_DUPLICATE_SYMBOL:
  title: "One exported name declared in two files"
  title_vi: "Một tên xuất được khai báo ở hai tệp"
  meaning_vi: "Một tên mà cửa vào công khai (index.ts) của một chủ sở hữu xuất ra, truy về tệp khai báo nó, cũng được một tệp sản xuất khác của repo khai báo và xuất ra (hàm, lớp, hằng, enum, kiểu, interface). Hai bản khai báo cùng tên khiến import nhầm một bản mà trình biên dịch không báo, ví dụ hai decorator cùng tên InjectPrimaryEntityManager cho hai kết nối khác nhau. Việc xuất lại (re-export) một khai báo duy nhất không phải là bản thứ hai. Không có danh sách tên được miễn."
  causes_vi:
    - "Hai module cùng tự viết một helper, decorator hoặc kiểu với cùng một tên thay vì dùng chung một bản"
    - "Mỗi kết nối hoặc mỗi ứng dụng chép nguyên một tệp rồi giữ nguyên tên xuất"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để giữ đúng một khai báo (dùng chung qua cửa vào của chủ sở hữu thích hợp) hoặc đổi tên bản còn lại cho đúng nghĩa của nó; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_E2E_IN_AUTOMATIC_GATE:
  title: "E2E runs in automatic gate"
  title_vi: "Kiểm thử e2e nằm trong cổng tự động"
  meaning_vi: "Hook husky hoặc script tự động gọi cả kiểm thử e2e, trong khi e2e không được nằm trong cổng tự động."
  causes_vi:
    - "Pre-commit hoặc pre-push chạy e2e"
    - "Script lint:check kéo e2e vào"
  nextStep_vi: "Op backend.scaffold gỡ e2e khỏi hook và script tự động."
  owner: other-op:backend.scaffold
  kind: check-finding

HFS_EDITION_FORBIDDEN_PRESENT:
  title: "Content the lite edition does not have"
  title_vi: "Nội dung ấn bản lite không có"
  meaning_vi: "Kho ghim edition lite nhưng vẫn giữ thứ chỉ ấn bản full mới có: script hay dependency kiểm thử, cấu hình jest/vitest/playwright, ứng dụng worker, pattern sự kiện (event-bus, queue, fenced-job, projection, saga) hay các loại trigger saga/reactors/jobs/realtime. Lite không có thế giới kiểm thử và không có bus sự kiện."
  causes_vi:
    - "package.json còn script test*, typecheck:tests hoặc dependency jest/vitest/playwright"
    - "Tệp cấu hình công cụ kiểm thử không ô nào cấm riêng vẫn nằm trong cây"
    - "hfs.json khai ứng dụng worker, một pattern sự kiện hoặc một loại trigger mà lite đã bỏ"
  nextStep_vi: "Xoá phần thuộc ấn bản full (không có gì thay thế trong lite). Ấn bản được chọn một lần lúc scaffold và không có lối nâng lite lên full: khi sản phẩm cần nội dung này, dựng một ứng dụng full mới rồi chuyển mã sản phẩm sang. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_EDITION_INVALID:
  title: "hfs.json edition is not one the manifest knows"
  title_vi: "Ấn bản HFS trong hfs.json không hợp lệ"
  meaning_vi: "Trường edition của hfs.json chỉ nhận một giá trị thuộc danh sách editions của bảng kê ô (full, lite); vắng mặt nghĩa là full. Một giá trị khác là lỗi khai báo, kiểm tra bị từ chối."
  causes_vi:
    - "hfs.json ghi edition với giá trị ngoài full/lite (gõ sai, hoặc một ấn bản bảng kê không biết)"
    - "`starci app check --edition <ấn bản>` hoặc `starci app upgrade --edition <ấn bản>` chọn ấn bản khác với ấn bản hfs.json khai: ấn bản cố định từ lúc scaffold"
  nextStep_vi: "Sửa edition thành một giá trị trong danh sách editions của bảng kê, hoặc bỏ trường để về full. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding


HFS_EMPTY_DIR:
  title: "No empty directory outside an `ignored` slot"
  title_vi: "Thư mục rỗng còn sót lại"
  meaning_vi: "Có thư mục không có tệp nào bên dưới (kể cả các thư mục con cũng rỗng). Git không theo dõi thư mục rỗng nên nó chỉ là dấu vết của cấu trúc đã đổi tên hoặc đã xóa. Xóa thư mục."
  causes_vi:
    - "Vi phạm luật R03: cấu trúc bị đổi tên hoặc tệp bị xóa mà thư mục cũ không được dọn (vd `src/modules/business/*` còn trống bên cạnh `domain/*`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_EVENT_CONTRACT:
  title: "The async contract between services is vendored and consumers match it"
  title_vi: "Hợp đồng sự kiện giữa các dịch vụ không khớp"
  meaning_vi: "Ảnh chụp `be/contracts/<service>/events.json` thiếu, cũ so với bảng `apps/<service>/src/events.ts` của bên phát, một mục trong `apps/<app>/src/consumes.ts` của bên nhận trỏ tới sự kiện không có trong ảnh chụp hoặc có phiên bản khác, hoặc một hàng đợi consumer định nghĩa bằng `defineQueue` không được liệt kê trong bảng `consumes.ts` nào."
  causes_vi:
    - "Vi phạm luật R166: hợp đồng giữa các dịch vụ được vendor dưới `be/contracts/<service>/` và bên nhận chỉ đọc đúng sự kiện và phiên bản mà ảnh chụp khai báo."
    - "Bên phát đổi sự kiện nhưng chưa chạy `starci app emit`, hoặc bên nhận khai báo phiên bản cũ."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chạy `starci app emit` rồi cập nhật `consumes.ts` và cách xử lý của bên nhận cho khớp; không sửa tay ảnh chụp."
  owner: op-retry
  kind: check-finding

HFS_FEATURE_FILE_BUDGET:
  title: "A feature exceeds its file budget"
  title_vi: "Tính năng vượt hạn mức số tệp"
  meaning_vi: "Một thư mục sở hữu tính năng có nhiều tệp được theo dõi hơn hạn mức ruleParams.featureFiles (250 tệp), tính cả các thư mục con. Luật áp dụng cho cả lite và full ở back end và front end."
  causes_vi:
    - "Một tính năng gộp nhiều khả năng sản phẩm vào cùng một thư mục"
    - "Các tệp mã nguồn, kiểm thử hoặc tài liệu trong thư mục con làm tổng số tệp vượt hạn mức"
  nextStep_vi: "Tách tính năng theo khả năng sản phẩm vào các thư mục sở hữu riêng, rồi chạy lại starci app check để mỗi tính năng nằm trong hạn mức."
  owner: op-retry
  kind: check-finding

HFS_FEATURE_LOGIC_ROLE:
  title: "A feature support role hides executable logic"
  title_vi: "Vai trò hỗ trợ của feature chứa logic thực thi"
  meaning_vi: "Tệp không phải cửa mỏng trong tầng feature chứa rẽ nhánh, vòng lặp, phép tính hoặc lời gọi thực thi thay vì chỉ khai báo dữ liệu, kiểu và metadata DTO."
  causes_vi:
    - "Đặt policy, guard, client hoặc projection có logic trong application/support"
    - "Đổi hậu tố handler thành vai trò hỗ trợ để tránh luật feature-thin"
  nextStep_vi: "Chuyển logic vào modules/domain hoặc modules/platform phù hợp và viết unit spec ở đó; giữ tệp feature dưới dạng khai báo dữ liệu hoặc một cửa mỏng ủy quyền."
  owner: op-retry
  kind: check-finding

HFS_FORBIDDEN_PRESENT:
  title: "Tracked path in a forbidden slot"
  title_vi: "Có tệp bị cấm trong cây mã nguồn"
  meaning_vi: "Tệp được theo dõi nằm trong một ô bị cấm (bộ nhớ đệm công cụ, đầu ra của tác tử, worktree, tệp bí mật dạng rõ). Ô này quy định nơi tệp phải ở, ngoài kho."
  causes_vi:
    - "Tác tử để lại tệp tạm hoặc báo cáo ở gốc kho rồi bị commit"
    - "Tệp .env hoặc khoá bí mật dạng rõ nằm trong kho"
    - "Thư mục e2e ở gốc thay vì src/tests/e2e"
  nextStep_vi: "Chuyển tệp tới nơi ô đó chỉ định (trường goesTo) hoặc xoá nó, rồi gỡ khỏi Git; tệp bí mật phải được niêm phong đúng chỗ, không bao giờ để dạng rõ. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_FORMAT:
  title: "Prettier is the only formatter"
  title_vi: "Chưa format bằng Prettier"
  meaning_vi: "`<file>` chưa được format. Chạy `starci app lint --fix`."
  causes_vi:
    - "Vi phạm luật R19: Prettier (config `@starci/prettier-config`) là formatter duy nhất; ESLint không còn luật định dạng."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_FORMAT_TOOL_MISSING:
  title: "The repository's own prettier is not installed"
  title_vi: "Kho chưa cài prettier của chính nó"
  meaning_vi: "Kiểm tra định dạng (R19) chạy prettier của chính kho. Kho chưa cài prettier nên không thể xác nhận định dạng, và trạng thái đó không bao giờ được tính là đạt."
  causes_vi:
    - "Chưa chạy `starci npm ci` trong kho"
    - "prettier không nằm trong devDependencies của kho"
  nextStep_vi: "Cài đúng phiên bản prettier ghi trong canon-pins.yaml bằng `starci npm ci` rồi chạy lại `starci app check`."
  owner: op-retry
  kind: input-invalid

HFS_FUNCTION_BUDGET:
  title: "A function body exceeds its line budget"
  title_vi: "Thân hàm vượt hạn mức dòng"
  meaning_vi: "Thân một hàm, phương thức hoặc hàm mũi tên của back end hoặc front end vượt hạn mức ruleParams.functionLines (80 dòng), kể cả dòng trống và chú thích. Luật áp dụng cho cả lite và full, không cho phép giữ nguyên hàm cũ quá dài."
  causes_vi:
    - "Một hàm gộp nhiều trách nhiệm hoặc nhiều bước xử lý vào cùng một thân hàm"
    - "Thêm mã, chú thích hoặc dòng trống làm thân hàm vượt hạn mức"
  nextStep_vi: "Tách các trách nhiệm thành hàm nhỏ có tên rõ ràng trong đúng nơi sở hữu, rồi chạy lại lint để mỗi thân hàm nằm trong hạn mức."
  owner: op-retry
  kind: check-finding

HFS_GHOST_TREE:
  title: "No empty directory beside a near-identical sibling"
  title_vi: "Cây thư mục ma cạnh thư mục gần trùng tên"
  meaning_vi: "Có thư mục rỗng mà tên chỉ khác vài ký tự so với thư mục anh em cùng cấp (thông báo nêu cả hai), tức là bản đổi tên hoặc gõ sai của cùng một cấu trúc chưa được dọn. Giữ bản có tệp, xóa bản rỗng."
  causes_vi:
    - "Vi phạm luật R03: đổi tên cấu trúc để lại bản cũ hoặc bản gõ sai (vd `business` và `bussiness`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_GITIGNORE_BLOCK_DRIFT:
  title: "The managed `.gitignore` block equals its render"
  title_vi: "Khối .gitignore lệch bản render"
  meaning_vi: "Khối .gitignore chuẩn đã bị sửa tay hoặc thiếu dòng `<rule>`. Chạy `starci app sync`."
  causes_vi:
    - "Vi phạm luật R04: Khối `.gitignore` do `.claude` quản lý phải trùng bản render (never-tracked list, deny `.env*`, cache)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_HOOKS_NOT_INSTALLED:
  title: "The hooks folder core.hooksPath names is missing or empty in this checkout"
  title_vi: "Hook Git chưa được cài trong bản checkout này"
  meaning_vi: "`core.hooksPath` trỏ tới `.husky/_` (hoặc `.husky`) nhưng thư mục đó không tồn tại hoặc không có hook đã cài (không có tệp điều phối `h` của husky) trong bản checkout này, nên Git không chạy pre-commit và pre-push: mọi commit bỏ qua lint và spec. Một worktree dùng chung cấu hình Git của clone chính nhưng `.husky/_` chỉ được husky tạo ở nơi đã cài phụ thuộc có chạy lifecycle script."
  causes_vi:
    - "Cài phụ thuộc với `--ignore-scripts` nên script `prepare` (husky) không chạy"
    - "Worktree mới tạo chưa từng chạy husky; runtime chỉ ghi hook riêng của nó vào `.husky/_`"
  nextStep_vi: "Chạy `starci npm ci` ở gốc app (lệnh này chạy trình cài hook husky `prepare` của app kể cả khi lifecycle script bị bỏ qua), rồi commit lại qua hook; không dùng `--no-verify`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_HOOKS_PATH_REDIRECTED:
  title: "A clone redirects core.hooksPath away from husky"
  title_vi: "core.hooksPath bị đổi hướng khỏi husky"
  meaning_vi: "Cấu hình Git cục bộ của bản clone đặt `core.hooksPath` trỏ ra ngoài `.husky`, nên hook pre-commit và pre-push không chạy và cổng mà mọi clone khác phải qua đã bị bỏ qua. Chỉ xét khi thư mục được kiểm tra chính là gốc work tree Git của nó; một thư mục nằm trong clone khác (một ví dụ trong clone runtime) không có hook riêng nên không bị xét."
  causes_vi:
    - "Vi phạm luật R13: pre-push chạy typecheck và lint, và không clone nào được đổi `core.hooksPath` để né husky; giá trị duy nhất được phép là `.husky` hoặc `.husky/_` do chính husky đặt."
  nextStep_vi: "Yêu cầu owner gỡ cấu hình local `core.hooksPath`, rồi commit lại qua hook; không dùng `--no-verify` và không đổi đường dẫn hook để né kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_HOST_CRON:
  title: "Apps do not install host cron or timer jobs"
  title_vi: "Ứng dụng cài lịch chạy trên máy chủ"
  meaning_vi: "Tệp triển khai hoặc script tại <path> khai báo crontab, cron.d, systemd timer, @reboot hoặc at; lịch chạy phải do ứng dụng sở hữu."
  causes_vi:
    - "Vi phạm R250: cài lịch chạy ngoài scheduler của ứng dụng hoặc replicated-job đã khai báo."
  nextStep_vi: "Chuyển tác vụ sang scheduler hàng đợi của back end, một tick của platform/jobs (R335) enqueue qua outbox hàng đợi hoặc replicated-job đã khai báo và gọi lệnh CLI của ứng dụng."
  owner: op-retry
  kind: check-finding

HFS_IDENTITY_CUSTODY:
  title: "An identity points its secret at `secrets/identity-<slug>.enc`; UAT chooses by role"
  title_vi: "Bí mật của identity sai chỗ"
  meaning_vi: "Identity `<id>` trỏ bí mật tới `<path>`; chỉ `.starcistacks/<env>/secrets/identity-<slug>.enc` (đường dẫn tính từ gốc app) hợp lệ; dạng `be/.starcistacks/...` bị từ chối. UAT chọn tài khoản theo role."
  causes_vi:
    - "Vi phạm luật R09: Identity record (`_resources/identities/<slug>/resource.yaml`) trỏ `custody.sealed` tới `.starcistacks/<env>/secrets/identity-<slug>.enc` ở gốc app; UAT `accounts.yaml` chọn identity theo role, không theo flow."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_IMAGE_UNPINNED:
  title: "Every image of a multi-service stack is pinned"
  title_vi: "Image của stack nhiều dịch vụ chưa được ghim phiên bản"
  meaning_vi: "Trong `.starcistacks/application-stacks.yaml` của một sản phẩm có từ hai dịch vụ trở lên, một `components.<name>.image` không có tag, dùng `latest`, một từ nhánh hoặc tag chỉ gồm major/minor (ví dụ `postgres:16`), nên image trôi theo thời gian."
  causes_vi:
    - "Vi phạm luật R164: image được ghim bằng digest (`@sha256:...`) hoặc phiên bản chính xác `x.y.z`; image của dịch vụ trong repo là `<repo>/<service>:<x.y.z>`, dịch vụ bên thứ ba cũng là image đã ghim."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: ghi tag chính xác hoặc digest vào `image` của thành phần; không dùng tag trôi."
  owner: op-retry
  kind: check-finding

HFS_INLINE_SUPPRESSION:
  title: "Inline lint or type suppression"
  title_vi: "Chú thích tắt luật tại chỗ"
  meaning_vi: "Có chú thích tắt luật hoặc miễn trừ trong mã: eslint-disable, eslint-enable, eslint-env, /* global */, stylelint-disable, @ts-ignore, @ts-expect-error, @ts-nocheck (ở bất kỳ vị trí nào trong chú thích), istanbul, c8 hay v8 ignore, NOSONAR, sonar-disable hoặc prettier-ignore. HFS không cho tắt luật, bỏ kiểm tra kiểu, giấu độ phủ hay giấu phát hiện Sonar tại chỗ."
  causes_vi:
    - "eslint-disable hoặc stylelint-disable (dòng, dòng kế tiếp hoặc cả tệp) để qua một luật"
    - "@ts-ignore hoặc @ts-expect-error để qua lỗi kiểu"
    - "istanbul, c8 hay v8 ignore để giấu mã khỏi độ phủ; NOSONAR hay sonar-disable để giấu phát hiện; prettier-ignore để bỏ định dạng"
  nextStep_vi: "Sửa mã cho đúng luật, hoặc đề xuất đổi luật trong canon; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_LINT_SUPPRESSION_FILE:
  title: "A repository keeps no lint-suppression file, script or option"
  title_vi: "Kho có tệp hoặc script ghi nhận bỏ qua lỗi lint"
  meaning_vi: "Kho có tệp, script hoặc tùy chọn ghi nhận lỗi lint để bỏ qua ở `<f>`: `eslint.suppressions*`, script `lint:suppressions`, cờ `--suppress-all`/`--suppressions-location`, hoặc cấu hình eslint có `suppressions`."
  causes_vi:
    - "Vi phạm luật R104: lỗi lint được sửa trong mã (hoặc luật được đổi trong canon); không ghi nhận để lỗi nằm lại trong tệp suppressions."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa tệp, script hoặc cờ, và sửa các lỗi lint trong mã."
  owner: op-retry
  kind: check-finding

HFS_LITE_SECRET_CUSTODY:
  title: "Lite secret material or a forbidden custody path is present"
  title_vi: "Bí mật hoặc đường dẫn lưu bí mật bị cấm trong edition lite"
  meaning_vi: "`<path>` là root `.env*`, `secrets.env`, `.secrets/`, file `.enc` ngoài `.starcistacks/<env>/secrets`, hoặc fe/supabase chứa token Supabase/JWT hay connection string có mật khẩu."
  causes_vi:
    - "Vi phạm L17: lite có đúng một đường custody đã mã hóa và browser/Supabase tree không giữ secret literal."
  nextStep_vi: "Không đọc hay in giá trị. Gỡ secret khỏi cây, xoay secret nếu đã lộ, rồi niêm phong bằng sops tại `.starcistacks/<env>/secrets/<slug>.enc`."
  owner: owner
  kind: check-finding

HFS_MANAGED_FILE_DRIFT:
  title: "A managed file equals its template render"
  title_vi: "Tệp do .claude quản lý bị lệch"
  meaning_vi: "`<file>` do `.claude` quản lý nhưng nội dung lệch bản render từ template. Chạy `starci app sync --write`, không sửa tay."
  causes_vi:
    - "Vi phạm luật R05: Tệp trong slot có `managedBy` của slots.yaml (tsconfig, jest.config.js, .prettierrc, .prettierignore, husky, workflows, sonar, khối `scripts` của package.json) phải bằng bản render từ template; danh sách tệp nằm trong slots.yaml, không nằm trong mã."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_MANIFEST_INVALID:
  title: "HFS slot manifest invalid"
  title_vi: "Bảng kê ô HFS sai định dạng"
  meaning_vi: "Tệp knowledge/hfs/slots.yaml của bộ chạy không đọc được hoặc vi phạm lược đồ của nó, nên mọi kiểm tra HFS bị từ chối chứ không chạy trên một bảng kê hỏng."
  causes_vi:
    - "Một ô thiếu trường bắt buộc, dùng giá trị ngoài danh sách cho phép hoặc trùng mã với ô khác"
    - "Ma trận hướng import nhắc tới một tầng không tồn tại"
    - "Hai ô cùng khai một mẫu đường dẫn, hoặc một ô đã ngừng dùng mà không chỉ ra ô kế nhiệm"
  nextStep_vi: "Đây là lỗi của bộ chạy, không phải của sản phẩm; người giám sát sửa knowledge/hfs/slots.yaml qua một nhánh đã được duyệt, sản phẩm không tự sửa."
  owner: supervisor
  kind: check-finding

HFS_MANIFEST_MAJOR_MISMATCH:
  title: "hfs.json pins another manifest major"
  title_vi: "Phiên bản chính của bảng kê không khớp"
  meaning_vi: "Trường hfs trong hfs.json ghim một phiên bản chính khác với bảng kê ô của bộ chạy. HFS không có giai đoạn tương thích: khi phiên bản chính mới được nạp thì phiên bản chính cũ bị từ chối ngay."
  causes_vi:
    - "Bộ chạy đã lên phiên bản chính mới của bảng kê nhưng kho chưa được di chuyển sang"
    - "hfs.json ghi số phiên bản chính sai hoặc chép từ một kho khác"
  nextStep_vi: "Chủ sở hữu duyệt một nhánh di chuyển cho kho này rồi mới đổi số hfs; không có cách bỏ qua hay giữ song song hai phiên bản."
  owner: owner
  kind: check-finding

HFS_MCP_TOOLS_SNAPSHOT:
  title: "A committed MCP tool catalog has the canonical tools/list shape"
  title_vi: "Snapshot danh mục tool MCP sai hình dạng chuẩn"
  meaning_vi: "Tệp `<file>` dưới `be/contracts/<app>/<contract>.tools.json` không phải danh mục tool MCP chuẩn: thiếu app khai báo, `contract` không phải `<server>@<major>` khớp tên tệp và `server.name`, hoặc có tool thiếu tên, mô tả hay `inputSchema` kiểu object, hoặc trùng tên."
  causes_vi:
    - "Vi phạm luật R302: snapshot là kết quả `tools/list` của server MCP ở một major hợp đồng, được commit như giao diện giữa các repo."
    - "Snapshot được chép tay hoặc đặt dưới thư mục của một app không khai báo trong hfs.json"
  nextStep_vi: "Lấy lại kết quả `tools/list` của server, ghi `{ contract, server: { name, version }, tools }` vào đúng tệp của app phục vụ server đó và khai báo slot `be.contract.mcp-tools` trong `sides.be.optionalSlots`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_MIN_INSTANCES:
  title: "Fewer instances of a slot than required"
  title_vi: "Số thực thể của ô ít hơn mức tối thiểu"
  meaning_vi: "Một ô đòi có ít nhất một số thực thể (ví dụ ít nhất một tính năng trong src/features) nhưng kho có ít hơn."
  causes_vi:
    - "Kho chưa có tính năng nào đúng mẫu src/features/<tên>/"
    - "Toàn bộ mã nghiệp vụ nằm ở chỗ ngoài mẫu nên không được tính"
  nextStep_vi: "Chuyển mã nghiệp vụ vào thực thể đúng mẫu của ô hoặc tạo thực thể còn thiếu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_MODULE_TIER_INVALID:
  title: "Module tier name is not allowed"
  title_vi: "Tên tầng module không hợp lệ"
  meaning_vi: "Trong src/modules có thư mục tầng không thuộc domain, platform hoặc integrations."
  causes_vi:
    - "Đặt tên tầng tự do"
    - "Sai chính tả tên tầng"
  nextStep_vi: "Op backend.implement chuyển module về một trong ba tầng hợp lệ."
  owner: other-op:backend.implement
  kind: check-finding

HFS_MONO_FE_WORKSPACE:
  title: "An fe workspace manifest breaks the workspace shape"
  title_vi: "Manifest của một workspace fe sai hình dạng"
  meaning_vi: "Mỗi app fe `fe/apps/<app>` là workspace `@<project>/<app>`, private, có đúng các script build, dev, lint (`starci app lint --workspace .`), start và typecheck; mỗi gói `fe/packages/<pkg>` là private và có build, typecheck cùng script lint của workspace."
  causes_vi:
    - "Vi phạm luật R144: turbo chạy các task theo script của từng workspace; tên, script hoặc cờ private sai khiến build, lint hoặc typecheck của app bị bỏ qua hoặc chạy khác chuẩn."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt tên `@<project>/<app>`, `\"private\": true` và đúng bộ script trong `package.json` của workspace đó."
  owner: op-retry
  kind: check-finding

HFS_MONO_NEST_PROJECTS:
  title: "be/nest-cli.json does not match the declared be apps"
  title_vi: "be/nest-cli.json không khớp các app be đã khai báo"
  meaning_vi: "`be/nest-cli.json` phải là `\"monorepo\": true`, project mặc định là một app api, và `projects` đúng bằng các app be mà `hfs.json` khai báo, mỗi project có `root` là `apps/<app>` và `sourceRoot` là `apps/<app>/src`."
  causes_vi:
    - "Vi phạm luật R145: back end luôn là monorepo Nest của `be/apps/<app>`, kể cả khi chỉ có một service; một project thừa hoặc thiếu nghĩa là app đó không được build hoặc chạy theo khai báo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa `be/nest-cli.json` cho khớp đúng các app be trong `hfs.json`."
  owner: op-retry
  kind: check-finding

HFS_MONO_WORKSPACES:
  title: "The app root is not the monorepo root"
  title_vi: "Gốc app không phải gốc monorepo"
  meaning_vi: "`package.json` ở gốc app phải khai báo `workspaces` đúng `[\"fe/apps/*\", \"fe/packages/*\"]`, `packageManager` là `npm@<phiên bản cụ thể>` và `turbo` trong devDependencies; gốc app giữ `turbo.json` do starci app sync sinh ra."
  causes_vi:
    - "Vi phạm luật R143: mọi sản phẩm luôn là monorepo, kể cả khi chỉ có một service, nên hình dạng hfs đồng nhất; thiếu workspaces hoặc turbo thì các app fe không được build qua turbo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt `workspaces`, `packageManager` và devDependency `turbo` (đúng bản ghim) trong `package.json` ở gốc, rồi chạy `npx starci app sync --write` để sinh `turbo.json`."
  owner: op-retry
  kind: check-finding

HFS_MONO_WORKSPACE_DEP:
  title: "An fe workspace imports a package it does not declare"
  title_vi: "Một workspace fe import gói mà nó không khai báo"
  meaning_vi: "Mọi gói mà các tệp của một workspace fe import phải được khai báo trong `package.json` của chính workspace đó (gói workspace anh em ghi `\"*\"`); `package.json` ở gốc không bao giờ khai báo một gói workspace."
  causes_vi:
    - "Vi phạm luật R146: một app chỉ chạy được nhờ gói được hoist từ gốc sẽ hỏng khi build riêng bằng `starci docker build <app>` hoặc khi turbo không biết thứ tự phụ thuộc."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm gói vào dependencies của workspace đó (cùng một phiên bản trong cả workspace), hoặc bỏ gói workspace khỏi `package.json` ở gốc."
  owner: op-retry
  kind: check-finding

HFS_PACKAGE_MANAGER_MIXED:
  title: "Package manager mixed with npm"
  title_vi: "Trộn trình quản lý gói khác với npm"
  meaning_vi: "Trường packageManager trong package.json mâu thuẫn với hợp đồng dùng npm và package-lock.json."
  causes_vi:
    - "Khai pnpm hoặc yarn trong package.json"
    - "Còn tệp khóa của trình khác"
  nextStep_vi: "Op dựng khung đưa packageManager về npm rồi kiểm tra lại."
  owner: other-op:backend.scaffold
  kind: check-finding

HFS_PEER_INTEGRATION_MISSING:
  title: "An app declares the runtime peer its driver integration needs"
  title_vi: "Thiếu gói peer mà tích hợp driver cần khi chạy"
  meaning_vi: "`package.json` ở gốc app phụ thuộc vào các gói của một cặp trong `knowledge/hfs/peer-integrations.yaml` (ví dụ `@nestjs/apollo` trên `@nestjs/platform-express` 11, tức Express 5) nhưng không khai báo gói `<requires>` trong dependencies, nên api không khởi động được."
  causes_vi:
    - "Vi phạm luật R111: npm không tự cài gói peer này, type-check và unit spec không nạp nó, nên lỗi chỉ lộ ra khi api khởi động (hai backend cũ thiếu `@as-integrations/express5` và api GraphQL không chạy được trên Express 5)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm gói `<requires>` vào dependencies của `package.json` ở gốc app; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_PLAINTEXT_SECRET:
  title: "Secrets exist only as `.starcistacks/<env>/secrets/<slug>.enc`"
  title_vi: "Bí mật dạng rõ trong kho"
  meaning_vi: "Tìm thấy bí mật dạng rõ ở `<path>`. Bí mật chỉ được nằm ở `.starcistacks/<env>/secrets/<slug>.enc` (sops). Không đọc, không in giá trị."
  causes_vi:
    - "Vi phạm luật R06: Bí mật chỉ tồn tại ở `.starcistacks/<env>/secrets/<slug>.enc`. Mọi `.env*`, `.secrets/`, `*.key\\|*.pem` plaintext, `runtime/files/*` đều bị từ chối, kể cả khi ignore."
  nextStep_vi: "Không đọc và không in giá trị. Chủ kho mã hoá bí mật bằng sops vào .starcistacks/<môi-trường>/secrets/<slug>.enc, sau đó xoá tệp rõ; agent không tạo hay xoay khoá."
  owner: owner
  kind: check-finding

HFS_PROOF_COMMAND_FILE_MISSING:
  title: "A proof command names only files the repository holds"
  title_vi: "Lệnh chứng minh trỏ tới tệp không tồn tại"
  meaning_vi: "Lệnh `requiresProof.<kind>.command` của hồ sơ `.starciwork` `<f>` chạy tệp `<path>` mà kho không có, nên không thể chạy đúng như đã viết."
  causes_vi:
    - "Vi phạm luật R105: lệnh chứng minh phải chạy được nguyên văn; tệp spec, script hay cấu hình mà nó nêu tên phải có trong kho (script đã xóa thì kế hoạch chứng minh phải được viết lại)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tạo tệp được nêu hoặc viết lại kế hoạch chứng minh (ví dụ thành một spec e2e trên world); không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_README_BADGE_NOT_LIVE:
  title: "README badge is not a live service"
  title_vi: "Huy hiệu README không phải dịch vụ ngoài đang chạy"
  meaning_vi: "Một huy hiệu trong README không trỏ tới dịch vụ ngoài HTTPS đang hoạt động."
  causes_vi:
