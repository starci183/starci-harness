  causes_vi:
    - "Vi phạm R267: khai báo sao lưu hoặc tệp không được theo dõi chưa chứng minh được khả năng phục hồi dữ liệu."
  nextStep_vi: "Thử phục hồi trong môi trường cách ly, ghi bằng chứng vào tệp được theo dõi và khai báo đường dẫn đó tại backup.restoreProof."
  owner: op-retry
  kind: check-finding

