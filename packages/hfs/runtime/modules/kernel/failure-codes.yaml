  title: "A product repository holds no bypass of a check"
  title_vi: "Kho có đoạn bỏ qua một bước kiểm tra"
  meaning_vi: "Kho có đoạn làm cho một bước kiểm tra qua mà không thỏa nó ở `<f>`: chú thích tắt luật (eslint, stylelint, prettier, biome), `ts-ignore`/`ts-expect-error`/`ts-nocheck`, `NOSONAR`, bỏ qua độ phủ istanbul/c8/v8, bài test bị bỏ qua hoặc chỉ chạy riêng, hoặc lỗi bị nuốt trong hook, script hay workflow (`|| true`, `continue-on-error`, `set +e`, `HUSKY=0`, `--no-verify`, `fail_ci_if_error: false`)."
  causes_vi:
    - "Vi phạm luật R303: một lần bỏ qua kiểm tra luôn là lỗi (phán quyết của chủ sở hữu loosening-always-red); kiểm tra được thỏa bằng cách sửa nguyên nhân, không phải bỏ qua. Giao diện (FE) không có test nhưng mã nguồn vẫn bị soát các chú thích tắt luật."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa đoạn bỏ qua và sửa nguyên nhân thật (mã, kiểu dữ liệu, test, bước chạy)."
  owner: op-retry
  kind: check-finding

HFS_CANON_COPY_DRIFT:
  title: "A hash-sensitive canon file differs from its template"
  title_vi: "Tệp canon nhạy hash lệch khỏi template"
  meaning_vi: "`<path>` khác bytes với bản canon trong `packages/hfs/templates/be/skeleton` (sha256 của hai bên được báo trong finding). `env-source.config.ts`, `origin.guard.ts` và `webhook-signature.service.ts` là canon nhạy hash, không phải tệp để sửa."
  causes_vi:
    - "Vi phạm luật R253: ba tệp custody bí mật phải bằng đúng bản template scaffold; mọi chỉnh sửa là drift."
  nextStep_vi: "Khôi phục đúng bytes của template `be/skeleton` cho tệp đó (scaffold lại hoặc checkout lại); thay đổi cần thiết phải đi qua template và canon pins, không sửa bản copy."
  owner: owner
  kind: check-finding

HFS_CANON_PIN_DRIFT:
  title: "Dependency version differs from the canon pin"
  title_vi: "Phiên bản phụ thuộc lệch khỏi bản đã ghim"
  meaning_vi: "Một phụ thuộc trong package.json không đúng phiên bản chính xác mà knowledge/hfs/canon-pins.yaml ghim cho cả họ kho; mọi gói @starci đều được cài từ npm registry đúng phiên bản đã ghim (không dùng file:)."
  causes_vi:
    - "Phiên bản viết dạng khoảng (^, ~) thay vì phiên bản chính xác"
    - "Một workspace giữ phiên bản cũ của cùng phụ thuộc"
    - "Một gói @starci khai báo dạng file: hoặc khoảng phiên bản thay vì phiên bản chính xác trên registry"
    - "Một bản dựng của registry cục bộ (đúng phiên bản đã commit của gói) cài bằng `starci deps install-local`, lockfile ghi `resolved` về máy này: chỉ `--env prod` chặn, `--env local` chỉ liệt kê"
  nextStep_vi: "Đặt phụ thuộc về đúng phiên bản chính xác ghi trong knowledge/hfs/canon-pins.yaml rồi cài lại từ npm registry. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding
  localOnly: true

HFS_CI_MISSING_CANON:
  title: "CI runs the pinned `starci app check --gate lint`; pre-push runs typecheck and lint"
  title_vi: "CI thiếu bước canon"
  meaning_vi: "Workflow/husky thiếu bước `<step>`. Cấu trúc chỉ được kiểm khi agent chạy — CI phải tự kiểm."
  causes_vi:
    - "Vi phạm luật R13: CI phải chạy `starci app check --gate lint`; pre-push phải có `typecheck` + `lint`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_CI_TOOL_INSTALL:
  title: "CI tool installation verifies immutable artifacts"
  title_vi: "Công cụ CI được cài mà chưa xác minh checksum"
  meaning_vi: "Workflow tại <path> tải hoặc cài công cụ bằng curl|sh, go install, npm global hoặc pip mà không xác minh checksum hay digest."
  causes_vi:
    - "Vi phạm R251: phiên bản hoặc URL riêng lẻ không chứng minh nội dung công cụ đã được xác minh."
  nextStep_vi: "Dùng action đã ghim SHA hoặc tải artifact được ghim và xác minh checksum/digest trước khi thực thi; không pipe bản tải vào shell."
  owner: op-retry
  kind: check-finding

HFS_CONTRACT_SNAPSHOT_DRIFT:
  title: "The be side commits its contract snapshot and it equals the emit"
  title_vi: "Bản hợp đồng lệch bản thật"
  meaning_vi: "Hợp đồng `<file>` lệch bản thật (`<sha>` ≠ `<sha>`). Chạy `starci app emit` ở gốc app rồi commit kết quả. Nếu emit không chạy được thì finding nêu nguyên văn lỗi của emit; không bao giờ bỏ qua âm thầm."
  causes_vi:
    - "Vi phạm luật R23: phía be: `be/contracts/<app>/schema.graphql` và `be/contracts/<app>/openapi.json` (sinh từ bảng thao tác có kiểu `apps/<app>/src/operations.ts`) phải bằng bản `starci app emit` phát ra ngay lúc kiểm tra (đồ thị module đọc từ mã nguồn, không cần env, DB hay mạng); chỉ chạy ở lượt kiểm tra đầy đủ, `--fast` bỏ qua và nói rõ trong phần coverage. Phía fe đọc thẳng `be/contracts/` (đường đọc chéo duy nhất khai trong hfs.json `sides.fe.reads`), không giữ bản sao."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_COVERAGE_BELOW:
  title: "Measured back-end logic file is below 100 percent coverage"
  title_vi: "Tệp logic back-end trong phạm vi đo chưa đạt độ bao phủ 100 phần trăm"
  meaning_vi: "Báo cáo lcov được cung cấp không chứng minh mỗi tệp logic trong phạm vi đo của edition đạt 100 phần trăm dòng, hàm và nhánh; phạm vi cùng các tệp ngoài phạm vi được liệt kê riêng. Độ bao phủ câu lệnh do trình chạy unit test kiểm tra."
  causes_vi:
    - "Có dòng, hàm hoặc nhánh chưa được chạy trong một tệp logic thuộc phạm vi đo"
    - "Báo cáo thiếu tệp nguồn, thiếu số liệu, sai định dạng hoặc không đọc được"
  nextStep_vi: "Bổ sung unit test cho tệp được nêu, tạo lại báo cáo lcov đầy đủ rồi chạy starci app check --coverage-from <lcov>; features, cli và webhooks ngoài phạm vi đo vẫn được liệt kê."
  owner: op-retry
  kind: check-finding

HFS_COVERAGE_SCOPE_DRIFT:
  title: "A file states a coverage scope the slot manifest does not derive"
  title_vi: "Tệp nêu phạm vi độ phủ khác với phạm vi suy ra từ slot manifest"
  meaning_vi: "Phạm vi độ phủ (những tệp nào bị đo 100% từng tệp) chỉ có một nguồn: trường `coverage: required|none` của từng slot be trong knowledge/hfs/slots.yaml cùng ruleParams.be.logicRoles, qua scripts/hfs/coverage-scope.mjs. Ba nơi dùng phạm vi đó đều do starci app sync sinh: be/jest.config.js (ngưỡng từng tệp), dòng sonar.coverage.exclusions của sonar-project.properties và codecov.yml (đường dẫn cùng các component theo từng service app và platform). `<detail>` nêu tệp đã lệch khỏi bản sinh; không ai được sửa tay phạm vi này."
  causes_vi:
    - "Sửa tay be/jest.config.js, codecov.yml hoặc dòng sonar.coverage.exclusions để đo ít tệp hơn hoặc thêm ngoại lệ"
    - "Đổi trường coverage của slot hoặc ruleParams.be.logicRoles nhưng chưa chạy lại starci app sync"
    - "Thêm service app hoặc capability mới nên các component của codecov.yml đã cũ"
  nextStep_vi: "Chạy `npx starci app sync --execute` để sinh lại ba tệp từ slot manifest; muốn đổi phạm vi thì đổi trường `coverage` của slot (và ruleParams.be.logicRoles) trong .claude runtime, không sửa tệp sinh. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DB_DEPLOY_UNGUARDED:
  title: "Database deployment accepts a non-tag ref"
  title_vi: "Triển khai cơ sở dữ liệu chấp nhận ref không phải tag"
  meaning_vi: "Mỗi đường chạy triển khai migration phải từ chối ref không phải tag phát hành trước khi tác động cơ sở dữ liệu."
  causes_vi:
    - "Workflow db-deploy thiếu chốt kiểm tag hoặc chốt không chặn đường chạy migration theo luật R271 (app lite không còn db-deploy: migration chạy trong bước migrate của stack deploy)."
  nextStep_vi: "Thêm chốt kiểm ref tag trước mỗi bước triển khai migration, rồi chứng minh ref nhánh bị từ chối."
  owner: op-retry
  kind: check-finding

HFS_DECLARATION_INVALID:
  title: "hfs.json missing or invalid"
  title_vi: "hfs.json thiếu hoặc sai định dạng"
  meaning_vi: "Kho mã không có tệp hfs.json hợp lệ nên không thể biết nó theo chuẩn HFS nào, có những ứng dụng nào và bật những ô tuỳ chọn nào."
  causes_vi:
    - "Thiếu tệp hfs.json ở gốc kho, hoặc tệp không đọc được như JSON"
    - "Loại ứng dụng không có trong bảng kê của HFS, ví dụ một loại ứng dụng do kho tự đặt"
    - "optionalSlots ghi một ô không phải loại tuỳ chọn, hoặc ghi một ô mà loại ứng dụng đã tự bật"
    - "Thiếu loại ứng dụng bắt buộc, ví dụ chưa khai ứng dụng api hoặc chưa khai ứng dụng migrate dù đã khai kết nối cơ sở dữ liệu"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa hfs.json theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DEPENDABOT_MISSING:
  title: "Apps declare scheduled dependency updates"
  title_vi: "Ứng dụng thiếu cấu hình cập nhật phụ thuộc"
  meaning_vi: "Kho thiếu .github/dependabot.yml hợp lệ với lịch cập nhật npm, github-actions và docker."
  causes_vi:
    - "Vi phạm R269: một hệ sinh thái phụ thuộc chưa được theo dõi cập nhật định kỳ."
  nextStep_vi: "Khai báo Dependabot version 2 với directory và schedule cho npm, github-actions và docker."
  owner: op-retry
  kind: check-finding

HFS_DEPLOY_COMPOSE_ON_VPS:
  title: "Docker compose lifecycle commands are dev-only"
  title_vi: "Docker Compose được dùng ngoài môi trường dev"
  meaning_vi: "Tệp tại <path> chạy docker compose up, down hoặc pull cho môi trường không phải dev; triển khai VPS dùng Docker Swarm."
  causes_vi:
    - "Vi phạm R250: dùng vòng đời Compose trong production, staging hoặc trên VPS."
  nextStep_vi: "Dùng stack Swarm đã khai báo để triển khai VPS; chỉ giữ Compose cho môi trường dev được xác định rõ."
  owner: op-retry
  kind: check-finding

HFS_DEPLOY_NO_LOGIC:
  title: "Deploy shell scripts delegate to the app CLI"
  title_vi: "Script triển khai chứa logic của ứng dụng"
  meaning_vi: "Script triển khai tại <path> chạy node -e, psql, SQL nội tuyến hoặc tải và thực thi shell; logic phải nằm trong ứng dụng và có spec."
  causes_vi:
    - "Vi phạm R250: đặt logic hoặc truy cập cơ sở dữ liệu trực tiếp trong deploy/*.sh."
  nextStep_vi: "Đưa logic vào lệnh be/apps/cli có spec rồi để script triển khai gọi docker, starci hoặc CLI đã biên dịch."
  owner: op-retry
  kind: check-finding

HFS_DEPLOY_SCHEDULER:
  title: "Workflow scheduling does not own app work"
  title_vi: "Workflow tự lập lịch cho tác vụ ứng dụng"
  meaning_vi: "Workflow tại <path> có lịch chạy thay cho scheduler của ứng dụng; tác vụ định kỳ phải thuộc back end hoặc job đã khai báo."
  causes_vi:
    - "Vi phạm R250: dùng sự kiện schedule hoặc lịch trong workflow để chạy tác vụ ứng dụng."
  nextStep_vi: "Bỏ lịch khỏi workflow và đưa tác vụ sang scheduler của ứng dụng hoặc replicated-job đã khai báo."
  owner: op-retry
  kind: check-finding

HFS_DEPLOY_WORKFLOW:
  title: "Deployment workflows declare protected jobs and sealed custody"
  title_vi: "Workflow triển khai thiếu kiểm soát hoặc sai nơi giữ bí mật"
  meaning_vi: "Workflow triển khai tại <path> thiếu environment, permissions, concurrency hoặc bước materialize; hoặc dùng dotenv hay bí mật ngoài danh sách cho phép."
  causes_vi:
    - "Vi phạm R251: workflow bỏ qua môi trường bảo vệ hoặc lấy bí mật ứng dụng từ GitHub thay cho kho mã hoá."
  nextStep_vi: "Khai báo environment, permissions và concurrency; materialize bí mật đã mã hoá với SOPS_AGE_KEY; chỉ cho phép khoá SSH và known_hosts phục vụ vận chuyển."
  owner: op-retry
  kind: check-finding

HFS_DEP_VERSION_SKEW:
  title: "One version per dependency in the workspace"
  title_vi: "Một gói nhiều phiên bản"
  meaning_vi: "`<pkg>` có `<n>` version trong workspace (`<list>`). Chỉ được một."
  causes_vi:
    - "Vi phạm luật R14: Mỗi dependency một version trong workspace; cấm bản sao lồng thứ hai (`apps/*/node_modules/@starci/grammar`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_BASE_PIN:
  title: "A Dockerfile base image is not pinned"
  title_vi: "Image nền của Dockerfile không được ghim"
  meaning_vi: "Mọi FROM của Dockerfile phải là một stage trước đó, image node duy nhất của chuẩn (phiên bản node và bản alpine cụ thể), hoặc image ghim bằng digest `@sha256`; không dùng tag trôi nổi (`latest`, `node:22`) và không để build argument chưa xác định."
  causes_vi:
    - "Vi phạm luật R190: tag trôi nổi làm image đổi nội dung mà không có thay đổi nào trong repo, nên build không tái lập và lỗ hổng mới lọt vào không dấu vết."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đổi FROM thành image node của chuẩn (xem `NODE_IMAGE` trong scripts/hfs/rules/docker.mjs) hoặc ghim image bằng digest `@sha256`."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_BUILD_CONTEXT:
  title: "The Dockerfile does not build from the app root"
  title_vi: "Dockerfile không build từ gốc app"
  meaning_vi: "Dockerfile của app phải ghi trong comment đầu tệp lệnh `docker build -f <side>/apps/<app>/Dockerfile -t <image> .` đúng app của chính nó (context là gốc app, nơi có `package.json` và lockfile duy nhất), và mọi nguồn của COPY/ADD nằm trong context (không có `..`, không có đường dẫn tuyệt đối)."
  causes_vi:
    - "Vi phạm luật R187: context build là gốc app; lệnh build sai hoặc nguồn COPY vượt ra ngoài context khiến image build được trên máy này nhưng hỏng trên CI hoặc trộn lẫn dữ liệu của app khác."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt lệnh `docker build -f <side>/apps/<app>/Dockerfile -t <image> .` vào comment đầu Dockerfile và sửa các nguồn COPY/ADD về đường dẫn tương đối trong gốc app."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_ENTRY:
  title: "The Dockerfile does not start the app's own entry or declare its port and health"
  title_vi: "Dockerfile không chạy đúng entry của app hoặc thiếu cổng và healthcheck"
  meaning_vi: "Stage `runtime` phải chạy entry đã build của chính app ở dạng exec (be: `node be/dist/apps/<app>/src/main.js`; fe: `node fe/apps/<app>/server.js`); app api hoặc Next đặt `ENV PORT`, EXPOSE đúng cổng đó và có HEALTHCHECK; worker có HEALTHCHECK theo tiến trình và không EXPOSE; cli/migrate ghi `HEALTHCHECK NONE` và không EXPOSE; app Next build bằng `turbo run build --filter=@<project>/<app>` và `next.config.ts` đặt `output: \"standalone\"`."
  causes_vi:
    - "Vi phạm luật R189: một image khởi động sai entry, không công bố cổng hoặc không có healthcheck thì nền tảng không thể điều phối hay phát hiện lỗi của nó."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa CMD/ENTRYPOINT về entry của app, thêm `ENV PORT`, `EXPOSE`, `HEALTHCHECK` (hoặc `HEALTHCHECK NONE` cho cli), và đặt `output: \"standalone\"` trong `next.config.ts` của app Next."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_HEALTHCHECK_FAKE:
  title: "API Docker healthcheck cannot reach its live route"
  title_vi: "Healthcheck Docker của API không tới được route live"
  meaning_vi: "Healthcheck không chứng minh API còn phục vụ liveness vì lệnh luôn thành công hoặc gọi route không tồn tại."
  causes_vi:
    - "HEALTHCHECK CMD true hoặc lệnh không kiểm tra thành công của route live đã đăng ký"
  nextStep_vi: "Dùng healthcheck HTTP kiểm tra thành công của route liveness thật của API và giữ lỗi probe thành exit code khác không."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_SECRETS:
  title: "A secret enters an image"
  title_vi: "Bí mật bị đưa vào image"
  meaning_vi: "Không được COPY/ADD tệp `.env*` (trừ `.env.example`) hay đường dẫn trong `.starcistacks`, `.secrets`, `.volume`, khóa, chứng chỉ, kubeconfig; không ADD một URL; không có ARG hoặc ENV mang tên một thông tin xác thực (PASSWORD, SECRET, TOKEN, KEY, CREDENTIAL, PRIVATE); riêng `NEXT_PUBLIC_*` được phép vì được công khai theo thiết kế."
  causes_vi:
    - "Vi phạm luật R191: mọi thứ trong layer hoặc lịch sử image đều lấy ra được; một bí mật trong image là bí mật đã lộ cho mọi nơi image được kéo về."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: bỏ COPY/ADD hoặc ARG/ENV đó, mount thông tin xác thực lúc chạy, và tải về bằng stage có kiểm checksum thay vì ADD URL."
  owner: op-retry
  kind: check-finding

HFS_DOCKER_STAGES:
  title: "The Dockerfile stages, user or install break the canon"
  title_vi: "Các stage, user hoặc lệnh cài của Dockerfile sai chuẩn"
  meaning_vi: "Dockerfile phải nhiều stage: một stage tên `build` (cài và build) và stage cuối tên `runtime` (thứ được chạy); runtime kết thúc bằng `USER node` và không chạy build; mọi lệnh cài là `npm ci` (không dùng `npm install`); runtime của be chỉ cài dependency production và bỏ lifecycle scripts, runtime của fe không cài gì."
  causes_vi:
    - "Vi phạm luật R188: image chạy bằng root, mang theo công cụ build hoặc cài không theo lockfile thì vừa lớn vừa kém an toàn, và không tái lập được."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: tách Dockerfile thành stage `build` và stage cuối `runtime`, thêm `USER node`, đổi `npm install` thành `npm ci`, và chuyển mọi lệnh build ra khỏi runtime."
  owner: op-retry
  kind: check-finding

HFS_DOC_COMMAND_UNKNOWN:
  title: "Product documentation cites an unknown command"
  title_vi: "Tài liệu sản phẩm dẫn lệnh không tồn tại"
  meaning_vi: "Lệnh npm run không có script tương ứng trong package.json hoặc verb starci app không có trong catalog CLI."
  causes_vi:
    - "Script hoặc verb được đổi hay bỏ nhưng tài liệu chưa đổi theo luật R270."
  nextStep_vi: "Dùng lệnh hiện có trong package.json hoặc catalog CLI, hoặc khai báo script sản phẩm còn thiếu."
  owner: op-retry
  kind: check-finding

HFS_DOC_NOT_ENGLISH:
  title: "Document is not English"
  title_vi: "Tài liệu không viết bằng tiếng Anh"
  meaning_vi: "Tệp Markdown hoặc YAML trong knowledge/, docs/, src/ hoặc apps/ có chữ cái tiếng Việt (kể cả trong khối mã của Markdown); tài liệu, mẫu và ví dụ phải viết bằng tiếng Anh."
  causes_vi:
    - "Viết hoặc dán đoạn tiếng Việt vào tài liệu, mẫu, ví dụ hay lời trích của chủ dự án"
    - "Đặt dữ liệu YAML có tiếng Việt ngoài slot danh mục thông điệp hoặc slot fixture i18n"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: dịch dòng được nêu sang tiếng Anh. Chỉ dữ liệu YAML trong slot danh mục thông điệp hoặc slot fixture i18n được giữ tiếng khác; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_DOC_PATH_MISSING:
  title: "Product documentation cites a missing path"
  title_vi: "Tài liệu sản phẩm dẫn đường dẫn không còn tồn tại"
  meaning_vi: "README, tài liệu hoặc README của stack dẫn một tệp hay thư mục mà cây sản phẩm không có, trong cả lite và full."
  causes_vi:
    - "Đổi hoặc xóa đường dẫn nhưng chưa cập nhật tài liệu theo luật R270."
  nextStep_vi: "Sửa đường dẫn được dẫn hoặc khôi phục tệp đúng trong sản phẩm rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_DOC_RULE_UNKNOWN:
  title: "Product documentation cites an unknown HFS rule"
  title_vi: "Tài liệu sản phẩm dẫn luật HFS không tồn tại"
  meaning_vi: "Mã R được dẫn không có trong catalog luật HFS hiện hành của runtime."
  causes_vi:
    - "Dẫn sai mã luật hoặc dùng mã chưa được đăng ký theo luật R270."
  nextStep_vi: "Dùng đúng mã luật hiện có trong knowledge/hfs/rules.yaml và cập nhật đoạn tài liệu liên quan."
  owner: op-retry
  kind: check-finding

HFS_DUPLICATE_CODE:
  title: "Duplicated code block"
  title_vi: "Mã trùng lặp"
  meaning_vi: "Một đoạn mã (bỏ qua khác biệt về tên biến và giá trị chữ hoặc số) xuất hiện hai lần trong mã sản phẩm: ở hai chủ sở hữu, ở hai tệp của một chủ sở hữu, hoặc hai lần trong một tệp. Ngưỡng số dòng và số token là một định nghĩa duy nhất trong ruleParams.<profile>.duplicateBlock của knowledge/hfs/slots.yaml; lời nhắn của bộ kiểm tra ghi rõ ngưỡng và hai vị trí."
  causes_vi:
    - "Op cần một hàm hỗ trợ đã có ở nơi khác nhưng chép lại thay vì dùng chung"
    - "Hai nơi cùng tự viết một logic giống nhau vì chưa ai đưa nó vào chỗ dùng chung"
    - "Đoạn mã được chép nguyên rồi chỉ đổi tên biến hoặc hằng số"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để đưa đoạn mã về một chỗ duy nhất theo lời nhắn (trong cùng chủ sở hữu, hoặc src/modules/platform/primitives, module miền của năng lực đó, hay packages/* với FE) rồi gọi từ cả hai nơi; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_DUPLICATE_SYMBOL:
  title: "One exported name declared in two files"
  title_vi: "Một tên xuất được khai báo ở hai tệp"
  meaning_vi: "Một tên mà cửa vào công khai (index.ts) của một chủ sở hữu xuất ra, truy về tệp khai báo nó, cũng được một tệp sản xuất khác của repo khai báo và xuất ra (hàm, lớp, hằng, enum, kiểu, interface). Hai bản khai báo cùng tên khiến import nhầm một bản mà trình biên dịch không báo, ví dụ hai decorator cùng tên InjectPrimaryEntityManager cho hai kết nối khác nhau. Việc xuất lại (re-export) một khai báo duy nhất không phải là bản thứ hai. Không có danh sách tên được miễn."
  causes_vi:
    - "Hai module cùng tự viết một helper, decorator hoặc kiểu với cùng một tên thay vì dùng chung một bản"
    - "Mỗi kết nối hoặc mỗi ứng dụng chép nguyên một tệp rồi giữ nguyên tên xuất"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để giữ đúng một khai báo (dùng chung qua cửa vào của chủ sở hữu thích hợp) hoặc đổi tên bản còn lại cho đúng nghĩa của nó; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_E2E_IN_AUTOMATIC_GATE:
  title: "A world layer runs outside the local machine"
  title_vi: "Kiểm thử integration, e2e hoặc contract chạy ngoài máy cục bộ"
  meaning_vi: "Hook husky, lượt đo coverage hoặc một workflow CI gọi kiểm thử integration, e2e hoặc contract, trong khi các lớp này chỉ chạy khi có người yêu cầu, trên máy cục bộ (chạy tay), không thuộc CI và không có hàng nào của cổng phát hành chạy chúng."
  causes_vi:
    - "Pre-commit hoặc pre-push chạy e2e"
    - "Script lint:check kéo e2e vào"
    - "Một workflow trong .github/workflows chạy test:e2e, test:integration hoặc test:contract, với bất kỳ trigger nào"
  nextStep_vi: "Op backend.scaffold gỡ e2e khỏi hook, script tự động và workflow; e2e chỉ chạy khi có yêu cầu, trên máy cục bộ bằng npm run test:e2e."
  owner: other-op:backend.scaffold
  kind: check-finding

HFS_EDITION_DEPRECATED:
  title: "hfs.json names the deprecated edition field"
  title_vi: "hfs.json còn trường edition đã bỏ"
  meaning_vi: "Ứng dụng chỉ còn một ấn bản (luật R212, quyết định của chủ dự án ngày 2026-11-20), nên trường edition của hfs.json bị bỏ qua với mọi giá trị. Đây là cảnh báo, không chặn; một đợt phát hành sau sẽ xoá hẳn trường này."
  causes_vi:
    - "hfs.json vẫn ghi edition (lite hoặc full) từ trước khi gộp ấn bản"
  nextStep_vi: "Xoá trường edition khỏi hfs.json; không cần đổi gì khác."
  owner: op-retry
  kind: check-finding

HFS_EMPTY_DIR:
  title: "No empty directory outside an `ignored` slot"
  title_vi: "Thư mục rỗng còn sót lại"
  meaning_vi: "Có thư mục không có tệp nào bên dưới (kể cả các thư mục con cũng rỗng). Git không theo dõi thư mục rỗng nên nó chỉ là dấu vết của cấu trúc đã đổi tên hoặc đã xóa. Xóa thư mục."
  causes_vi:
    - "Vi phạm luật R03: cấu trúc bị đổi tên hoặc tệp bị xóa mà thư mục cũ không được dọn (vd `src/modules/business/*` còn trống bên cạnh `domain/*`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_EVENT_CONTRACT:
  title: "The async contract between services is vendored and consumers match it"
  title_vi: "Hợp đồng sự kiện giữa các dịch vụ không khớp"
  meaning_vi: "Ảnh chụp `be/contracts/<service>/events.json` thiếu, cũ so với bảng `apps/<service>/src/events.ts` của bên phát, một mục trong `apps/<app>/src/consumes.ts` của bên nhận trỏ tới sự kiện không có trong ảnh chụp hoặc có phiên bản khác, hoặc một hàng đợi consumer định nghĩa bằng `defineQueue` không được liệt kê trong bảng `consumes.ts` nào."
  causes_vi:
    - "Vi phạm luật R166: hợp đồng giữa các dịch vụ được vendor dưới `be/contracts/<service>/` và bên nhận chỉ đọc đúng sự kiện và phiên bản mà ảnh chụp khai báo."
    - "Bên phát đổi sự kiện nhưng chưa chạy `starci app emit`, hoặc bên nhận khai báo phiên bản cũ."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chạy `starci app emit` rồi cập nhật `consumes.ts` và cách xử lý của bên nhận cho khớp; không sửa tay ảnh chụp."
  owner: op-retry
  kind: check-finding

HFS_FEATURE_FILE_BUDGET:
  title: "A feature exceeds its file budget"
  title_vi: "Tính năng vượt hạn mức số tệp"
  meaning_vi: "Một thư mục sở hữu tính năng có nhiều tệp được theo dõi hơn hạn mức ruleParams.featureFiles (250 tệp), tính cả các thư mục con. Luật áp dụng cho cả lite và full ở back end và front end."
  causes_vi:
    - "Một tính năng gộp nhiều khả năng sản phẩm vào cùng một thư mục"
    - "Các tệp mã nguồn, kiểm thử hoặc tài liệu trong thư mục con làm tổng số tệp vượt hạn mức"
  nextStep_vi: "Tách tính năng theo khả năng sản phẩm vào các thư mục sở hữu riêng, rồi chạy lại starci app check để mỗi tính năng nằm trong hạn mức."
  owner: op-retry
  kind: check-finding

HFS_FEATURE_LOGIC_ROLE:
  title: "A feature support role hides executable logic"
  title_vi: "Vai trò hỗ trợ của feature chứa logic thực thi"
  meaning_vi: "Tệp không phải cửa mỏng trong tầng feature chứa rẽ nhánh, vòng lặp, phép tính hoặc lời gọi thực thi thay vì chỉ khai báo dữ liệu, kiểu và metadata DTO."
  causes_vi:
    - "Đặt policy, guard, client hoặc projection có logic trong application/support"
    - "Đổi hậu tố handler thành vai trò hỗ trợ để tránh luật feature-thin"
  nextStep_vi: "Chuyển logic vào modules/domain hoặc modules/platform phù hợp và viết unit spec ở đó; giữ tệp feature dưới dạng khai báo dữ liệu hoặc một cửa mỏng ủy quyền."
  owner: op-retry
  kind: check-finding

HFS_FORBIDDEN_PRESENT:
  title: "Tracked path in a forbidden slot"
  title_vi: "Có tệp bị cấm trong cây mã nguồn"
  meaning_vi: "Tệp được theo dõi nằm trong một ô bị cấm (bộ nhớ đệm công cụ, đầu ra của tác tử, worktree, tệp bí mật dạng rõ). Ô này quy định nơi tệp phải ở, ngoài kho."
  causes_vi:
    - "Tác tử để lại tệp tạm hoặc báo cáo ở gốc kho rồi bị commit"
    - "Tệp .env hoặc khoá bí mật dạng rõ nằm trong kho"
    - "Thư mục e2e ở gốc thay vì src/tests/e2e"
  nextStep_vi: "Chuyển tệp tới nơi ô đó chỉ định (trường goesTo) hoặc xoá nó, rồi gỡ khỏi Git; tệp bí mật phải được niêm phong đúng chỗ, không bao giờ để dạng rõ. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_CHECK_CACHE_FORGED:
  title: "A committed check cache record disagrees with what the check computes"
  title_vi: "Bản ghi cache kiểm tra đã commit không khớp kết quả kiểm tra thật"
  meaning_vi: "`<file>`: bản ghi trong `.starcistacks/cache/` có khóa khớp cây hiện tại nhưng phát hiện (findings) của nó khác với kết quả mà bộ kiểm tra tính ra từ cache tại base tin cậy. CI chỉ tin cache như nó đang có ở base, nên bản ghi này bị sửa tay hoặc một bước kiểm tra không xác định (khác nhau giữa các máy)."
  causes_vi:
    - "Sửa tay một tệp trong `.starcistacks/cache/` (xóa phát hiện để qua mặt kiểm tra)"
    - "Một bước kiểm tra cho kết quả khác nhau trên các máy khác nhau"
  nextStep_vi: "Chạy lại `starci app check` trên cây sạch để sinh lại cache rồi commit; không sửa tay thư mục cache. Lỗi này chặn ở mọi số lượng."
  owner: op-retry
  kind: check-finding

HFS_CHECK_CACHE_STALE:
  title: "A changed file has no current record in the committed check cache"
  title_vi: "Tệp đã đổi nhưng cache kiểm tra đã commit chưa có bản ghi hiện hành"
  meaning_vi: "`<file>` đổi so với base tin cậy mà `.starcistacks/cache/` đã commit không có bản ghi khớp nội dung hiện tại. CI vẫn kiểm tra đầy đủ tệp này nên kết quả đúng, chỉ tốn thời gian (cảnh báo)."
  causes_vi:
    - "Quên chạy `starci app check` và commit cache sau khi sửa"
  nextStep_vi: "Chạy `starci app check` rồi commit `.starcistacks/cache/` cùng thay đổi."
  owner: op-retry
  kind: check-finding

HFS_CHECK_CACHE_MISSING:
  title: "The app commits no check cache"
  title_vi: "Ứng dụng chưa commit cache kiểm tra"
  meaning_vi: "`.starcistacks/cache/` không có bản ghi nào nên mọi lần chạy đều kiểm tra đầy đủ (cảnh báo, kết quả vẫn đúng)."
  causes_vi:
    - "Ứng dụng mới hoặc vừa nâng cấp, chưa chạy `starci app check` lần đầu"
  nextStep_vi: "Chạy `starci app check` một lần rồi commit `.starcistacks/cache/` để các lần sau chỉ kiểm tra phần thay đổi."
  owner: op-retry
  kind: check-finding

CI_PARITY_STEP_FAILED:
  title: "A step of the app's managed CI fails locally"
  title_vi: "Một bước của CI được quản lý của app thất bại khi chạy cục bộ"
  meaning_vi: "`starci app check` (hook pre-push) chạy các bước CI không cần database đúng như CI chạy chúng (đọc từ .github/workflows/ci.yml: `starci app audit` (npm audit --omit=dev kèm ngoại lệ), script typecheck, npm run build:be, next build từng app fe; và `starci app coverage verify` trên lcov họ test đã gộp). Một bước thất bại ở đây sẽ thất bại trên CI, nên lần push bị chặn."
  causes_vi:
    - "Vi phạm R383: next build hoặc build:be lỗi (prerender, cấu hình route, import) dù tsc đã xanh."
    - "Vi phạm R383: npm audit thấy lỗ hổng mức high trong dependency production."
  nextStep_vi: "Đọc dòng cuối của bước trong thông báo, sửa đúng lỗi đó (chạy lại lệnh CI được nêu để tái hiện), rồi chạy lại starci app check --fresh."
  owner: op-retry
  kind: check-finding
CI_PARITY_SONAR_SCAN_FAILED:
  title: "The Sonar scanner fails locally as the CI sonar job would"
  title_vi: "Bộ quét Sonar thất bại khi chạy cục bộ như job sonar của CI"
  meaning_vi: "`starci app check` chạy bộ quét Sonar thật với `sonar-project.properties` của app, trên máy chủ Sonar mà app khai báo, giống job sonar của CI. Bộ quét thoát lỗi hoặc dừng giữa chừng (ví dụ `Line 15 is out of range ... File has 14 lines`), nên job sonar của CI cũng sẽ đỏ."
  causes_vi:
    - "Vi phạm R386: tệp nguồn chứa ký tự U+2028, U+2029 hoặc U+0085 thô; bộ quét tách dòng tại các ký tự này còn TypeScript thì không."
    - "Cấu hình `sonar-project.properties` sai (đường dẫn sources, tsconfig, báo cáo lcov hoặc lint không tồn tại)."
  nextStep_vi: "Đọc những dòng cuối của bộ quét trong thông báo; thay ký tự thô bằng dạng thoát (`\\u2028`) hoặc xóa nó, hoặc sửa đường dẫn sai, rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

CI_PARITY_SONAR_GATE_FAILED:
  title: "The Sonar quality gate of the local analysis is red"
  title_vi: "Cổng chất lượng Sonar của lần phân tích cục bộ đang đỏ"
  meaning_vi: "Bộ quét đã tải phân tích lên máy chủ Sonar (nhánh `local/<user>` hoặc dự án `<projectKey>-local`), và cổng chất lượng của dự án trả về ERROR hoặc tác vụ compute-engine thất bại. Thông báo nêu từng điều kiện không đạt với giá trị thực; CI sẽ đỏ đúng điều kiện đó."
  causes_vi:
    - "Vi phạm R386: độ phủ, trùng lặp, issue hoặc hotspot trên mã mới vượt ngưỡng của cổng chất lượng mà máy chủ gán cho dự án."
  nextStep_vi: "Sửa đúng điều kiện được nêu (thêm test, bỏ mã trùng, xử lý issue) rồi chạy lại starci app check; không sửa ngưỡng trên máy chủ để qua cổng."
  owner: op-retry
  kind: check-finding

TYPES_CODEGEN_FAILED:
  title: "The app's code generation fails before the type programs run"
  title_vi: "Bước sinh mã (codegen) của app thất bại trước khi các chương trình tsc chạy"
  meaning_vi: "Bước types của `starci app check` chạy `npm run codegen` (script codegen ở package.json gốc) trước chương trình tsc đầu tiên, vì mã sinh ra (thư mục __generated__ không được git theo dõi) không có trong cây mới. Khi codegen thất bại, không chương trình tsc nào chạy (không báo hàng trăm lỗi import chưa phân giải) và bước types đỏ với đúng mã này."
  causes_vi:
    - "Schema hoặc tài liệu (operation) GraphQL sai, hoặc thiếu tệp hợp đồng mà script codegen đọc."
    - "Thiếu dependency của codegen trong node_modules (chưa chạy npm ci)."
  nextStep_vi: "Chạy npm run codegen từ gốc app để đọc lỗi đầy đủ, sửa đầu vào của nó, rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

TYPES_PACKAGE_BUILD_FAILED:
  title: "A workspace package that programs resolve through its build output fails to build"
  title_vi: "Một package workspace mà các chương trình tsc đọc qua thư mục build của nó không build được"
  meaning_vi: "Bước types của `starci app check` build trước mỗi package workspace có exports, main, module hoặc types trỏ vào thư mục build chưa được git theo dõi (ví dụ dist), bằng script build của chính package đó, package phụ thuộc trước. Khi một build thất bại, các chương trình tsc đọc package đó không chạy (không báo hàng trăm lỗi import chưa phân giải) và bước types đỏ với đúng mã này. Một cây mới chưa có dist, nên không có bước build này thì tsc báo mọi import của package."
  causes_vi:
    - "Lỗi biên dịch trong chính package (script build của nó chạy tsc -p tsconfig.build.json)."
    - "Package khai báo output build trong exports nhưng không có script build, hoặc script build không tạo ra file đã khai báo."
  nextStep_vi: "Chạy npm run build --workspace <thư mục package> từ gốc app để đọc lỗi đầy đủ, sửa package, rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

CI_PARITY_DB_SKIPPED:
  title: "The database migration checks of the CI parity family could not run on this host"
  title_vi: "Không chạy được các bước kiểm tra migration database của họ CI parity trên máy này"
  meaning_vi: "`starci app check` không chạy được các bước kiểm tra migration database của họ build parity (`npm run db:lint`, `starci app db drift`) vì máy này không có Docker và không có database trống nào được nêu bằng `--db-url-env`. Đây là cảnh báo, không bao giờ là kết quả xanh; CI vẫn chạy bước này và chính nó phát hiện BE_ENTITY_SCHEMA_DRIFT."
  causes_vi:
    - "Vi phạm R383: máy không cài Docker hoặc Docker không chạy, nên không dựng được database tạm để áp migration."
    - "Không truyền `--db-url-env` trỏ tới một database trống."
  nextStep_vi: "Bật Docker (hoặc truyền `--db-url-env` tới một database trống) rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

CI_PARITY_SONAR_SKIPPED:
  title: "The Sonar scan could not run on this host"
  title_vi: "Không chạy được lần quét Sonar trên máy này"
  meaning_vi: "`starci app check` không chạy được bộ quét Sonar ở đây: thiếu token trong secret đã niêm phong của app, máy chủ Sonar không trả lời, token không đủ quyền (đọc dự án, tạo dự án `<projectKey>-local`, gán cổng chất lượng) hoặc không đọc được kết quả cổng. Đây là cảnh báo, không bao giờ là kết quả xanh; CI vẫn chạy job sonar."
  causes_vi:
    - "Không mở được secret `sonar.enc.yaml` của môi trường (thiếu khóa age) hoặc không có mạng tới máy chủ Sonar."
    - "Máy chủ không hỗ trợ nhánh (Community) và token không được phép tạo dự án `<projectKey>-local`."
  nextStep_vi: "Cấp khóa age hoặc mạng cho máy này, hoặc nhờ quản trị Sonar tạo sẵn dự án `<projectKey>-local` gán cùng cổng chất lượng, rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

HFS_CHECK_CACHE_UNWARMED:
  title: "The pushed check cache is not the one a run on its tree writes"
  title_vi: "Cache kiểm tra được push không phải cache mà một lần chạy trên cây này ghi ra"
  meaning_vi: "`starci app check` (hook pre-push) chạy mọi họ kiểm tra theo diff với cache trong cây và phải ghi hoặc xóa tệp trong `.starcistacks/cache/`, hoặc cây còn tệp cache chưa commit: bản ghi đi kèm lần push không đủ ấm, nên CI sẽ phải kiểm tra lạnh và vượt ngân sách ESLint."
  causes_vi:
    - "Sửa mã mà chưa chạy `starci app check` rồi commit cache"
    - "Nâng phiên bản một pin của harness (một phần fingerprint đổi) nhưng chưa chạy lại một lần cho ấm"
  nextStep_vi: "Commit `.starcistacks/cache/` đúng như lần chạy vừa để lại rồi push lại; không sửa tay thư mục cache."
  owner: op-retry
  kind: check-finding

HFS_CHECK_CACHE_UNPORTABLE:
  title: "This host cannot write a check cache CI can trust"
  title_vi: "Máy này không ghi được cache kiểm tra mà CI tin được"
  meaning_vi: "Fingerprint của lần chạy không di động: một gói `@starci/*` hoặc CLI được link hay chép từ thư mục cục bộ (không có integrity ghi lại), nên cache không được ghi và lần push không mang bản ghi ấm."
  causes_vi:
    - "Đang dùng một gói harness cài từ registry cục bộ (`starci deps install-local`) mà bản dựng chưa mang `starciSource` (dấu nguồn), hoặc một bản link của gói"
  nextStep_vi: "Chạy `starci deps install-local --restore`, rồi `starci app check --env prod`, commit `.starcistacks/cache/` và push."
  owner: op-retry
  kind: check-finding
  localOnly: true

HFS_CHECK_CACHE_FILE_TOO_LARGE:
  title: "A committed check cache file is too large to push"
  title_vi: "Một tệp cache kiểm tra đã commit quá lớn để push"
  meaning_vi: "Một tệp trong `.starcistacks/cache/` vượt giới hạn mà một lần push được mang (mặc định 90 MB, `STARCI_CACHE_FILE_MAX_MB`); GitHub từ chối tệp trên 100 MB (GH001) và một tệp lớn làm việc tải lên quá thời gian."
  causes_vi:
    - "Cache được ghi bởi một bản `@starci/hfs` cũ, gom mọi bản ghi coverage của một vùng vào một tệp"
  nextStep_vi: "Chạy `starci app check` với `@starci/hfs` hiện tại (tách bản ghi thành nhiều tệp nhỏ), commit `.starcistacks/cache/` rồi push lại."
  owner: op-retry
  kind: check-finding

HFS_CHECK_CACHE_VERIFY_LOCKED:
  title: "The nightly verify of the check cache locks the release gate"
  title_vi: "Lần verify cache kiểm tra hằng đêm đang khóa cổng release"
  meaning_vi: "Lần chạy `cache-verify.yml` hoàn tất mới nhất trên nhánh mặc định bị đỏ (chạy diff rồi chạy đầy đủ cho kết quả khác nhau) hoặc không đọc được, nên cổng release, vốn tin cache ấm, từ chối cho tới khi một lần verify xanh."
  causes_vi:
    - "Một bản ghi cache trên main khác kết quả chạy đầy đủ (bước không xác định hoặc phần fingerprint thiếu)"
    - "`gh` chưa đăng nhập hoặc không đọc được các lần chạy"
  nextStep_vi: "Sửa bản ghi hoặc bước mà lần verify nêu tên, dispatch `cache-verify.yml` trên nhánh chứa sha của release (dev hoặc candidate) cho tới khi xanh cho đúng sha đó; hoặc chủ dự án chạy cổng đầy đủ `starci app release gate --full`."
  owner: op-retry
  kind: check-finding

HFS_FORMAT:
  title: "Prettier is the only formatter"
  title_vi: "Chưa format bằng Prettier"
  meaning_vi: "`<file>` chưa được format. Chạy `npm run format`."
  causes_vi:
    - "Vi phạm luật R19: Prettier (config `@starci/prettier-config`) là formatter duy nhất; ESLint không còn luật định dạng."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_FORMAT_TOOL_MISSING:
  title: "The repository's own prettier is not installed"
  title_vi: "Kho chưa cài prettier của chính nó"
  meaning_vi: "Kiểm tra định dạng (R19) chạy prettier của chính kho. Kho chưa cài prettier nên không thể xác nhận định dạng, và trạng thái đó không bao giờ được tính là đạt."
  causes_vi:
    - "Chưa chạy `npm ci` trong kho"
    - "prettier không nằm trong devDependencies của kho"
  nextStep_vi: "Cài đúng phiên bản prettier ghi trong canon-pins.yaml bằng `npm ci` rồi chạy lại `starci app check`."
  owner: op-retry
  kind: input-invalid

HFS_FUNCTION_BUDGET:
  title: "A function body exceeds its line budget"
  title_vi: "Thân hàm vượt hạn mức dòng"
  meaning_vi: "Thân một hàm, phương thức hoặc hàm mũi tên của back end hoặc front end vượt hạn mức ruleParams.functionLines (80 dòng), kể cả dòng trống và chú thích. Luật áp dụng cho cả lite và full, không cho phép giữ nguyên hàm cũ quá dài."
  causes_vi:
    - "Một hàm gộp nhiều trách nhiệm hoặc nhiều bước xử lý vào cùng một thân hàm"
    - "Thêm mã, chú thích hoặc dòng trống làm thân hàm vượt hạn mức"
  nextStep_vi: "Tách các trách nhiệm thành hàm nhỏ có tên rõ ràng trong đúng nơi sở hữu, rồi chạy lại lint để mỗi thân hàm nằm trong hạn mức."
  owner: op-retry
  kind: check-finding

HFS_GHOST_TREE:
  title: "No empty directory beside a near-identical sibling"
  title_vi: "Cây thư mục ma cạnh thư mục gần trùng tên"
  meaning_vi: "Có thư mục rỗng mà tên chỉ khác vài ký tự so với thư mục anh em cùng cấp (thông báo nêu cả hai), tức là bản đổi tên hoặc gõ sai của cùng một cấu trúc chưa được dọn. Giữ bản có tệp, xóa bản rỗng."
  causes_vi:
    - "Vi phạm luật R03: đổi tên cấu trúc để lại bản cũ hoặc bản gõ sai (vd `business` và `bussiness`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_GITIGNORE_BLOCK_DRIFT:
  title: "The managed `.gitignore` block equals its render"
  title_vi: "Khối .gitignore lệch bản render"
  meaning_vi: "Khối .gitignore chuẩn đã bị sửa tay hoặc thiếu dòng `<rule>`. Chạy `starci app sync --execute`."
  causes_vi:
    - "Vi phạm luật R04: Khối `.gitignore` do `.claude` quản lý phải trùng bản render (never-tracked list, deny `.env*`, cache)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_HOOKS_NOT_INSTALLED:
  title: "The hooks folder core.hooksPath names is missing or empty in this checkout"
  title_vi: "Hook Git chưa được cài trong bản checkout này"
  meaning_vi: "`core.hooksPath` trỏ tới `.husky/_` (hoặc `.husky`) nhưng thư mục đó không tồn tại hoặc không có hook đã cài (không có tệp điều phối `h` của husky) trong bản checkout này, nên Git không chạy pre-commit và pre-push: mọi commit bỏ qua lint và spec. Một worktree dùng chung cấu hình Git của clone chính nhưng `.husky/_` chỉ được husky tạo ở nơi đã cài phụ thuộc có chạy lifecycle script."
  causes_vi:
    - "Cài phụ thuộc với `--ignore-scripts` nên script `prepare` (husky) không chạy"
    - "Worktree mới tạo chưa từng chạy husky; runtime chỉ ghi hook riêng của nó vào `.husky/_`"
  nextStep_vi: "Chạy `npm ci` ở gốc app (script `prepare` của app là trình cài hook husky; sau một lần cài `--ignore-scripts` thì chạy `npm run prepare`), rồi commit lại qua hook; không dùng `--no-verify`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_HOOKS_PATH_REDIRECTED:
  title: "A clone redirects core.hooksPath away from husky"
  title_vi: "core.hooksPath bị đổi hướng khỏi husky"
  meaning_vi: "Cấu hình Git cục bộ của bản clone đặt `core.hooksPath` trỏ ra ngoài `.husky`, nên hook pre-commit và pre-push không chạy và cổng mà mọi clone khác phải qua đã bị bỏ qua. Chỉ xét khi thư mục được kiểm tra chính là gốc work tree Git của nó; một thư mục nằm trong clone khác (một ví dụ trong clone runtime) không có hook riêng nên không bị xét."
  causes_vi:
    - "Vi phạm luật R13: pre-push chạy typecheck và lint, và không clone nào được đổi `core.hooksPath` để né husky; giá trị duy nhất được phép là `.husky` hoặc `.husky/_` do chính husky đặt."
  nextStep_vi: "Yêu cầu owner gỡ cấu hình local `core.hooksPath`, rồi commit lại qua hook; không dùng `--no-verify` và không đổi đường dẫn hook để né kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_HOST_CRON:
  title: "Apps do not install host cron or timer jobs"
  title_vi: "Ứng dụng cài lịch chạy trên máy chủ"
  meaning_vi: "Tệp triển khai hoặc script tại <path> khai báo crontab, cron.d, systemd timer, @reboot hoặc at; lịch chạy phải do ứng dụng sở hữu."
  causes_vi:
    - "Vi phạm R250: cài lịch chạy ngoài scheduler của ứng dụng hoặc replicated-job đã khai báo."
  nextStep_vi: "Chuyển tác vụ sang scheduler hàng đợi của back end, một tick của platform/jobs (R335) enqueue qua outbox hàng đợi hoặc replicated-job đã khai báo và gọi lệnh CLI của ứng dụng."
  owner: op-retry
  kind: check-finding

HFS_IDENTITY_CUSTODY:
  title: "An identity points its secret at `secrets/identity-<slug>.enc`; UAT chooses by role"
  title_vi: "Bí mật của identity sai chỗ"
  meaning_vi: "Identity `<id>` trỏ bí mật tới `<path>`; chỉ `.starcistacks/<env>/secrets/identity-<slug>.enc` (đường dẫn tính từ gốc app) hợp lệ; dạng `be/.starcistacks/...` bị từ chối. UAT chọn tài khoản theo role."
  causes_vi:
    - "Vi phạm luật R09: Identity record (`_resources/identities/<slug>/resource.yaml`) trỏ `custody.sealed` tới `.starcistacks/<env>/secrets/identity-<slug>.enc` ở gốc app; UAT `accounts.yaml` chọn identity theo role, không theo flow."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_IMAGE_UNPINNED:
  title: "Every image of a multi-service stack is pinned"
  title_vi: "Image của stack nhiều dịch vụ chưa được ghim phiên bản"
  meaning_vi: "Trong `.starcistacks/application-stacks.yaml` của một sản phẩm có từ hai dịch vụ trở lên, một `components.<name>.image` không có tag, dùng `latest`, một từ nhánh hoặc tag chỉ gồm major/minor (ví dụ `postgres:16`), nên image trôi theo thời gian."
  causes_vi:
    - "Vi phạm luật R164: image được ghim bằng digest (`@sha256:...`) hoặc phiên bản chính xác `x.y.z`; image của dịch vụ trong repo là `<repo>/<service>:<x.y.z>`, dịch vụ bên thứ ba cũng là image đã ghim."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: ghi tag chính xác hoặc digest vào `image` của thành phần; không dùng tag trôi."
  owner: op-retry
  kind: check-finding

HFS_INLINE_SUPPRESSION:
  title: "Inline lint or type suppression"
  title_vi: "Chú thích tắt luật tại chỗ"
  meaning_vi: "Có chú thích tắt luật hoặc miễn trừ trong mã: eslint-disable, eslint-enable, eslint-env, /* global */, stylelint-disable, @ts-ignore, @ts-expect-error, @ts-nocheck (ở bất kỳ vị trí nào trong chú thích), istanbul, c8 hay v8 ignore, NOSONAR, sonar-disable hoặc prettier-ignore. HFS không cho tắt luật, bỏ kiểm tra kiểu, giấu độ phủ hay giấu phát hiện Sonar tại chỗ."
  causes_vi:
    - "eslint-disable hoặc stylelint-disable (dòng, dòng kế tiếp hoặc cả tệp) để qua một luật"
    - "@ts-ignore hoặc @ts-expect-error để qua lỗi kiểu"
    - "istanbul, c8 hay v8 ignore để giấu mã khỏi độ phủ; NOSONAR hay sonar-disable để giấu phát hiện; prettier-ignore để bỏ định dạng"
  nextStep_vi: "Sửa mã cho đúng luật, hoặc đề xuất đổi luật trong canon; op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_LINT_SUPPRESSION_FILE:
  title: "A repository keeps no lint-suppression file, script or option"
  title_vi: "Kho có tệp hoặc script ghi nhận bỏ qua lỗi lint"
  meaning_vi: "Kho có tệp, script hoặc tùy chọn ghi nhận lỗi lint để bỏ qua ở `<f>`: `eslint.suppressions*`, script `lint:suppressions`, cờ `--suppress-all`/`--suppressions-location`, hoặc cấu hình eslint có `suppressions`."
  causes_vi:
    - "Vi phạm luật R104: lỗi lint được sửa trong mã (hoặc luật được đổi trong canon); không ghi nhận để lỗi nằm lại trong tệp suppressions."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: xóa tệp, script hoặc cờ, và sửa các lỗi lint trong mã."
  owner: op-retry
  kind: check-finding

HFS_LITE_SECRET_CUSTODY:
  title: "Lite secret material or a forbidden custody path is present"
  title_vi: "Bí mật hoặc đường dẫn lưu bí mật bị cấm trong edition lite"
  meaning_vi: "`<path>` là root `.env*`, `secrets.env`, `.secrets/`, file `.enc` ngoài `.starcistacks/<env>/secrets`, hoặc fe/supabase chứa token Supabase/JWT hay connection string có mật khẩu."
  causes_vi:
    - "Vi phạm L17: lite có đúng một đường custody đã mã hóa và browser/Supabase tree không giữ secret literal."
  nextStep_vi: "Không đọc hay in giá trị. Gỡ secret khỏi cây, xoay secret nếu đã lộ, rồi niêm phong bằng sops tại `.starcistacks/<env>/secrets/<slug>.enc`."
  owner: owner
  kind: check-finding

HFS_MANAGED_FILE_DRIFT:
  title: "A managed file equals its template render"
  title_vi: "Tệp do .claude quản lý bị lệch"
  meaning_vi: "`<file>` do `.claude` quản lý nhưng nội dung lệch bản render từ template. Chạy `starci app sync --execute`, không sửa tay."
  causes_vi:
    - "Vi phạm luật R05: Tệp trong slot có `managedBy` của slots.yaml (tsconfig, jest.config.js, .prettierrc, .prettierignore, husky, workflows, sonar, khối `scripts` của package.json) phải bằng bản render từ template; danh sách tệp nằm trong slots.yaml, không nằm trong mã."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_MANIFEST_INVALID:
  title: "HFS slot manifest invalid"
  title_vi: "Bảng kê ô HFS sai định dạng"
  meaning_vi: "Tệp knowledge/hfs/slots.yaml của bộ chạy không đọc được hoặc vi phạm lược đồ của nó, nên mọi kiểm tra HFS bị từ chối chứ không chạy trên một bảng kê hỏng."
  causes_vi:
    - "Một ô thiếu trường bắt buộc, dùng giá trị ngoài danh sách cho phép hoặc trùng mã với ô khác"
    - "Ma trận hướng import nhắc tới một tầng không tồn tại"
    - "Hai ô cùng khai một mẫu đường dẫn, hoặc một ô đã ngừng dùng mà không chỉ ra ô kế nhiệm"
  nextStep_vi: "Đây là lỗi của bộ chạy, không phải của sản phẩm; người giám sát sửa knowledge/hfs/slots.yaml qua một nhánh đã được duyệt, sản phẩm không tự sửa."
  owner: supervisor
  kind: check-finding

HFS_MANIFEST_MAJOR_MISMATCH:
  title: "hfs.json pins another manifest major"
  title_vi: "Phiên bản chính của bảng kê không khớp"
  meaning_vi: "Trường hfs trong hfs.json ghim một phiên bản chính khác với bảng kê ô của bộ chạy. HFS không có giai đoạn tương thích: khi phiên bản chính mới được nạp thì phiên bản chính cũ bị từ chối ngay."
  causes_vi:
    - "Bộ chạy đã lên phiên bản chính mới của bảng kê nhưng kho chưa được di chuyển sang"
    - "hfs.json ghi số phiên bản chính sai hoặc chép từ một kho khác"
  nextStep_vi: "Chủ sở hữu duyệt một nhánh di chuyển cho kho này rồi mới đổi số hfs; không có cách bỏ qua hay giữ song song hai phiên bản."
  owner: owner
  kind: check-finding

HFS_MCP_TOOLS_SNAPSHOT:
  title: "A committed MCP tool catalog has the canonical tools/list shape"
  title_vi: "Snapshot danh mục tool MCP sai hình dạng chuẩn"
  meaning_vi: "Tệp `<file>` dưới `be/contracts/<app>/<contract>.tools.json` không phải danh mục tool MCP chuẩn: thiếu app khai báo, `contract` không phải `<server>@<major>` khớp tên tệp và `server.name`, hoặc có tool thiếu tên, mô tả hay `inputSchema` kiểu object, hoặc trùng tên."
  causes_vi:
    - "Vi phạm luật R302: snapshot là kết quả `tools/list` của server MCP ở một major hợp đồng, được commit như giao diện giữa các repo."
    - "Snapshot được chép tay hoặc đặt dưới thư mục của một app không khai báo trong hfs.json"
  nextStep_vi: "Lấy lại kết quả `tools/list` của server, ghi `{ contract, server: { name, version }, tools }` vào đúng tệp của app phục vụ server đó và khai báo slot `be.contract.mcp-tools` trong `sides.be.optionalSlots`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_MCP_TOOLS_SNAPSHOT_MISSING:
  title: "A back end that serves an MCP server commits its tool catalog"
  title_vi: "Back end phục vụ server MCP nhưng chưa commit danh mục tool"
  meaning_vi: "Mã nguồn back end import `@modelcontextprotocol/sdk/server` (tức là phục vụ một server MCP) nhưng không có tệp `contracts/<app>/<server>@<major>.tools.json` nào được track, nên luật hình dạng R302 không có gì để xét và các tool của agent runtime không được review."
  causes_vi:
    - "Vi phạm R302 (BE-AI-6): server MCP được thêm mà chưa commit kết quả `tools/list` của nó."
    - "`--env local` chỉ liệt kê, `--env prod` (hook push, CI, phát hành) chặn."
  nextStep_vi: "Lấy kết quả `tools/list` của server, ghi `{ contract, server: { name, version }, tools }` vào `contracts/<app>/<server>@<major>.tools.json` của app phục vụ server đó và khai báo slot `be.contract.mcp-tools` trong `sides.be.optionalSlots`."
  owner: op-retry
  kind: check-finding
  localOnly: true

HFS_MIN_INSTANCES:
  title: "Fewer instances of a slot than required"
  title_vi: "Số thực thể của ô ít hơn mức tối thiểu"
  meaning_vi: "Một ô đòi có ít nhất một số thực thể (ví dụ ít nhất một tính năng trong src/features) nhưng kho có ít hơn."
  causes_vi:
    - "Kho chưa có tính năng nào đúng mẫu src/features/<tên>/"
    - "Toàn bộ mã nghiệp vụ nằm ở chỗ ngoài mẫu nên không được tính"
  nextStep_vi: "Chuyển mã nghiệp vụ vào thực thể đúng mẫu của ô hoặc tạo thực thể còn thiếu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_MODULE_TIER_INVALID:
  title: "Module tier name is not allowed"
  title_vi: "Tên tầng module không hợp lệ"
  meaning_vi: "Trong src/modules có thư mục tầng không thuộc domain, platform hoặc integrations."
  causes_vi:
    - "Đặt tên tầng tự do"
    - "Sai chính tả tên tầng"
  nextStep_vi: "Op backend.implement chuyển module về một trong ba tầng hợp lệ."
  owner: other-op:backend.implement
  kind: check-finding

HFS_MONO_FE_WORKSPACE:
  title: "An fe workspace manifest breaks the workspace shape"
  title_vi: "Manifest của một workspace fe sai hình dạng"
  meaning_vi: "Mỗi app fe `fe/apps/<app>` là workspace `@<project>/<app>`, private, có đúng các script build, dev, start và typecheck; mỗi gói `fe/packages/<pkg>` là private và có build, typecheck; workspace không có script lint, lint chạy một lần từ gốc bằng `starci app check --gate lint`."
  causes_vi:
    - "Vi phạm luật R144: turbo chạy các task theo script của từng workspace; tên, script hoặc cờ private sai khiến build, lint hoặc typecheck của app bị bỏ qua hoặc chạy khác chuẩn."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt tên `@<project>/<app>`, `\"private\": true` và đúng bộ script trong `package.json` của workspace đó."
  owner: op-retry
  kind: check-finding

HFS_MONO_NEST_PROJECTS:
  title: "be/nest-cli.json does not match the declared be apps"
  title_vi: "be/nest-cli.json không khớp các app be đã khai báo"
  meaning_vi: "`be/nest-cli.json` phải là `\"monorepo\": true`, project mặc định là một app api, và `projects` đúng bằng các app be mà `hfs.json` khai báo, mỗi project có `root` là `apps/<app>` và `sourceRoot` là `apps/<app>/src`."
  causes_vi:
    - "Vi phạm luật R145: back end luôn là monorepo Nest của `be/apps/<app>`, kể cả khi chỉ có một service; một project thừa hoặc thiếu nghĩa là app đó không được build hoặc chạy theo khai báo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: sửa `be/nest-cli.json` cho khớp đúng các app be trong `hfs.json`."
  owner: op-retry
  kind: check-finding

HFS_MONO_WORKSPACES:
  title: "The app root is not the monorepo root"
  title_vi: "Gốc app không phải gốc monorepo"
  meaning_vi: "`package.json` ở gốc app phải khai báo `workspaces` đúng `[\"fe/apps/*\", \"fe/packages/*\"]`, `packageManager` là `npm@<phiên bản cụ thể>` và `turbo` trong devDependencies; gốc app giữ `turbo.json` do starci app sync sinh ra."
  causes_vi:
    - "Vi phạm luật R143: mọi sản phẩm luôn là monorepo, kể cả khi chỉ có một service, nên hình dạng hfs đồng nhất; thiếu workspaces hoặc turbo thì các app fe không được build qua turbo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: đặt `workspaces`, `packageManager` và devDependency `turbo` (đúng bản ghim) trong `package.json` ở gốc, rồi chạy `npx starci app sync --execute` để sinh `turbo.json`."
  owner: op-retry
  kind: check-finding

HFS_MONO_WORKSPACE_DEP:
  title: "An fe workspace imports a package it does not declare"
  title_vi: "Một workspace fe import gói mà nó không khai báo"
  meaning_vi: "Mọi gói mà các tệp của một workspace fe import phải được khai báo trong `package.json` của chính workspace đó (gói workspace anh em ghi `\"*\"`); `package.json` ở gốc không bao giờ khai báo một gói workspace."
  causes_vi:
    - "Vi phạm luật R146: một app chỉ chạy được nhờ gói được hoist từ gốc sẽ hỏng khi build riêng image của app (`starci app stack build`) hoặc khi turbo không biết thứ tự phụ thuộc."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm gói vào dependencies của workspace đó (cùng một phiên bản trong cả workspace), hoặc bỏ gói workspace khỏi `package.json` ở gốc."
  owner: op-retry
  kind: check-finding

HFS_PACKAGE_MANAGER_MIXED:
  title: "Package manager mixed with npm"
  title_vi: "Trộn trình quản lý gói khác với npm"
  meaning_vi: "Trường packageManager trong package.json mâu thuẫn với hợp đồng dùng npm và package-lock.json."
  causes_vi:
    - "Khai pnpm hoặc yarn trong package.json"
    - "Còn tệp khóa của trình khác"
  nextStep_vi: "Op dựng khung đưa packageManager về npm rồi kiểm tra lại."
  owner: other-op:backend.scaffold
  kind: check-finding

HFS_PLAINTEXT_SECRET:
  title: "Secrets exist only as `.starcistacks/<env>/secrets/<slug>.enc`"
  title_vi: "Bí mật dạng rõ trong kho"
  meaning_vi: "Tìm thấy bí mật dạng rõ ở `<path>`. Bí mật chỉ được nằm ở `.starcistacks/<env>/secrets/<slug>.enc` (sops). Không đọc, không in giá trị."
  causes_vi:
    - "Vi phạm luật R06: Bí mật chỉ tồn tại ở `.starcistacks/<env>/secrets/<slug>.enc`. Mọi `.env*`, `.secrets/`, `*.key\\|*.pem` plaintext, `runtime/files/*` đều bị từ chối, kể cả khi ignore."
  nextStep_vi: "Không đọc và không in giá trị. Chủ kho mã hoá bí mật bằng sops vào .starcistacks/<môi-trường>/secrets/<slug>.enc, sau đó xoá tệp rõ; agent không tạo hay xoay khoá."
  owner: owner
  kind: check-finding

HFS_README_INVALID:
  title: "README breaks its standard shape"
  title_vi: "README không đúng khuôn chuẩn"
  meaning_vi: "README.md của kho không đúng khuôn chuẩn. Thông báo của lỗi nêu đúng điểm sai: tiêu đề khác tên kho, thiếu dòng mô tả ngắn, thiếu hoặc sai thứ tự một mục chuẩn (Overview, Stack, Repository layout, Development, Work), mục Development chưa nêu đủ lệnh npm (các script do starci app sync quản lý; test chạy bằng npm test), mục Work chưa trỏ tới cây .starciwork của backend, có địa chỉ cục bộ hoặc mạng riêng, hoặc có huy hiệu không phải dịch vụ ngoài HTTPS đang chạy."
  causes_vi:
    - "Tiêu đề, dòng mô tả hoặc thứ tự mục lệch khuôn"
    - "Thiếu lệnh hoặc chỉ dẫn trong Development và Work"
    - "Để nguyên địa chỉ localhost hoặc IP riêng, hoặc dùng huy hiệu tĩnh"
  nextStep_vi: "Op docs.author sửa README.md theo đúng điều thông báo nêu."
  owner: other-op:docs.author
  kind: check-finding

HFS_RELEASE_TAG_MISMATCH:
  title: "Product release tag does not match its version or image tag"
  title_vi: "Tag phát hành sản phẩm không khớp phiên bản hoặc tag image"
  meaning_vi: "Tag phát hành phải có dạng v cộng phiên bản package.json; workflow images.yml đẩy image với tag bất biến sha-<commit>, còn tên phát hành v<phiên bản> chỉ là retag của digest đó trên lần chạy tag phát hành, sau một chốt kiểm ref."
  causes_vi:
    - "Phiên bản package và tag khác nhau hoặc image dùng tag khác theo luật R271."
  nextStep_vi: "Đồng bộ phiên bản package và tag phát hành, rồi dùng cùng tag trong workflow xây image."
  owner: op-retry
  kind: check-finding

HFS_REPO_LOCAL_CHECK:
  title: "A repository keeps no check or lint rule of its own"
  title_vi: "Kho tự giữ bộ kiểm tra riêng"
  meaning_vi: "Kho có nguồn kiểm tra hoặc luật lint cục bộ ở `<f>` nằm ngoài thư mục ext/ của dự án (PROJECT-LINT-3): tệp chạy được trong `scripts/` hay `tools/` có chữ check, checks hoặc checker trong tên (`check-x`, `x-check`, `x_check`, `x.check`), tệp trong `ext/checks/` mà ext/manifest.json `checks` không khai báo, tệp `eslint-local-rules*`, plugin eslint cục bộ, hoặc script npm chạy một tệp như vậy."
  causes_vi:
    - "Vi phạm luật R103: bộ kiểm tra chung sống trong runtime `.claude` (starci app check, các canon eslint); luật riêng của dự án chỉ nằm trong thư mục ext/ của nó: luật trong ext/hfs và ext/lint, project check trong ext/checks, tất cả khai báo trong ext/manifest.json (PROJECT-LINT-3)."
  nextStep_vi: "Nếu là luật riêng của dự án: chuyển tệp vào `ext/checks/<tên>.mjs` (sửa đường dẫn nó tự suy từ thư mục của nó), khai báo {\"id\", \"run\", \"why\"} trong ext/manifest.json `checks` và trỏ script npm vào tệp mới; nếu runtime `.claude` đã kiểm tra điều đó thì xóa tệp và script trỏ tới nó."
  owner: op-retry
  kind: check-finding

HFS_PROJECT_CHECK_FAILED:
  title: "A project check the extension manifest declares failed"
  title_vi: "Một project check khai báo trong ext/manifest.json bị đỏ"
  meaning_vi: "starci app check chạy mọi project check mà ext/manifest.json `checks` khai báo (bước `checks`, ở mọi nơi cổng hfs chạy, kể cả CI) bằng Node đang chạy, từ gốc app. Check thoát khác 0, hoặc tệp `run` của nó không còn, là lỗi; thông báo nêu id, tệp, mã thoát, điều nó canh giữ và những dòng cuối nó in ra. Kết quả không bao giờ được cache."
  causes_vi:
    - "Mã hoặc dữ liệu của app vi phạm luật riêng mà check đó canh giữ (R402)."
    - "Tệp của check bị xóa hoặc đổi tên mà khai báo trong ext/manifest.json chưa đổi theo."
  nextStep_vi: "Đọc các dòng cuối check in ra, sửa chỗ vi phạm rồi chạy lại starci app check; nếu tệp đã đổi chỗ thì sửa `run` trong ext/manifest.json `checks`."
  owner: op-retry
  kind: check-finding

HFS_REPO_UNREADABLE:
  title: "Repository is not a readable Git work tree"
  title_vi: "Không đọc được kho Git"
  meaning_vi: "Bộ kiểm tra HFS chỉ xét những gì Git theo dõi nên cần một cây làm việc Git đọc được; thư mục được chỉ định thì không."
  causes_vi:
    - "Đường dẫn --repo sai hoặc không phải kho Git"
    - "Git chưa cài hoặc kho bị hỏng"
  nextStep_vi: "Trỏ --repo vào gốc một kho Git hợp lệ rồi chạy lại."
  owner: op-retry
  kind: input-invalid

HFS_REQUIRED_FILE_MISSING:
  title: "Required file, directory or minimum instance is missing"
  title_vi: "Thiếu tệp, thư mục hoặc số lượng tối thiểu bắt buộc theo bảng kê"
  meaning_vi: "Bảng kê HFS đòi một tệp hoặc thư mục phải có trong mỗi phần của kho (gói dùng chung, module frontend, api, i18n, tuyến, layout...), hoặc đòi kho có ít nhất một ứng dụng hay tính năng thuộc loại bắt buộc. Mục đó không tồn tại; khi là số lượng tối thiểu thì báo tại hfs.json. Thiếu nó thì phần liên quan chưa hoạt động đầy đủ hoặc kho chưa phải một sản phẩm hoàn chỉnh."
  causes_vi:
    - "Tạo thư mục mới nhưng chưa thêm tệp bắt buộc như index.ts, store.ts, toast.tsx hoặc package.json"
    - "Tệp có nhưng tên hoặc chỗ đặt khác với bảng kê"
    - "Kho chưa có tính năng hoặc ứng dụng nào của loại bắt buộc"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để tạo tệp còn thiếu đúng chỗ bảng kê chỉ định; nếu cấu trúc hiện có là chủ ý thì đó là việc sửa bảng kê, do người giám sát làm, không phải kho tự đổi."
  owner: op-retry
  kind: check-finding

HFS_ROOT_ENTRY_FORBIDDEN:
  title: "Root entry not on HFS allowlist"
  title_vi: "Mục ở thư mục gốc không được phép"
  meaning_vi: "Ở thư mục gốc của repo có một tệp hoặc thư mục không nằm trong các gốc mà slot của repo khai báo (ví dụ contracts/ cho ảnh chụp hợp đồng)."
  causes_vi:
    - "Worker tạo thêm tệp hoặc thư mục ngay ở gốc repo"
    - "Tệp cũ chưa được dời vào đúng chỗ của nó"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op vừa tạo ra mục đó phải dời nó vào thư mục sở hữu rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_ROOT_ENTRY_MISSING:
  title: "Required root entry is missing"
  title_vi: "Thiếu mục bắt buộc ở thư mục gốc"
  meaning_vi: "Repo thiếu một tệp hoặc thư mục mà cấu trúc chuẩn bắt buộc phải có ở gốc, hoặc README.md không đọc được."
  causes_vi:
    - "Repo mới chưa được dựng khung đầy đủ"
    - "Tệp gốc bị xóa hoặc chưa được commit"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op đang làm việc phải tạo mục còn thiếu rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_ROOT_MARKDOWN_FORBIDDEN:
  title: "Markdown file at repository root"
  title_vi: "Tệp Markdown đặt ở thư mục gốc"
  meaning_vi: "Có một tệp Markdown nằm ngay ở gốc repo, trong khi tài liệu phải nằm trong thư mục docs hoặc hồ sơ Work của nó."
  causes_vi:
    - "Worker ghi ghi chú hoặc báo cáo thẳng ra gốc repo"
    - "Tài liệu cũ chưa được dời đi"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải chuyển tệp vào docs/ hoặc hồ sơ Work rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_ROOT_SRC_FORBIDDEN_FE:
  title: "Root src folder in the front end (fe/)"
  title_vi: "Repo giao diện có thư mục src ở gốc"
  meaning_vi: "Repo giao diện có thư mục src ngay ở gốc, trong khi mã nguồn chỉ được đặt trong apps/<tên app>/src."
  causes_vi:
    - "Dự án giao diện được dựng theo kiểu một app đơn"
    - "Worker tạo mã ngoài thư mục app"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải chuyển toàn bộ src vào apps/<app>/src rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_RULE_OFF_WITHOUT_REPLACEMENT:
  title: "The ESLint configuration (and a front end's stylelint configuration) is the rendered one-liner, so no rule is off, warned or redefined in a repository"
  title_vi: "Cấu hình ESLint hoặc stylelint lệch bản render"
  meaning_vi: "`eslint.config.mjs` (hoặc `stylelint.config.mjs` của front end) khác bản render (một dòng gọi `starciBeConfig`, `starciFeConfig` hoặc `starciStylelintConfig`). Factory không nhận tham số ghi đè, nên một luật chỉ có thể bị tắt, hạ mức hoặc định nghĩa lại trong repo khi tệp này khác bản render. Chạy `starci app sync --execute`, không sửa tay."
  causes_vi:
    - "Vi phạm luật R17: `eslint.config.mjs` phải đúng bằng bản render; luật thay thế nằm trong plugin của `.claude`, không bao giờ tắt trong repo."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SBOM_MISSING:
  title: "Release images carry SBOM and provenance evidence"
  title_vi: "Image phát hành thiếu SBOM hoặc provenance"
  meaning_vi: "Workflow images thiếu bước hoạt động tạo SBOM và chứng thực nguồn gốc cho image phát hành."
  causes_vi:
    - "Vi phạm R269: bản dựng không tạo cả danh mục thành phần và bằng chứng nguồn gốc."
  nextStep_vi: "Bật sbom và provenance trong bước build image hoặc tạo SBOM cùng chứng thực nguồn gốc bằng công cụ/action đã ghim."
  owner: op-retry
  kind: check-finding

HFS_SCHEDULE_UNDECLARED:
  title: "A scheduled component has no declared CLI job"
  title_vi: "Component chạy theo lịch thiếu job CLI được khai báo"
  meaning_vi: "Component có lịch hoặc replicated-job trong mô hình chưa có entry jobs khớp với schedule và lệnh gọi action có tên của CLI ứng dụng."
  causes_vi:
    - "Vi phạm R268: lịch chỉ nằm trong cấu hình triển khai hoặc gọi lệnh ngoài quyền sở hữu CLI của ứng dụng."
  nextStep_vi: "Khai báo jobs.<id> với schedule, command của back end CLI và component khi cần; giữ lập lịch trong ứng dụng hoặc replicated-job được khai báo."
  owner: op-retry
  kind: check-finding

HFS_SCRIPT_PLAINTEXT_LOAD:
  title: "Executable scripts do not load plaintext credential files"
  title_vi: "Script đọc tệp bí mật dạng rõ"
  meaning_vi: "Script tại <path> đọc secrets.env, secret.env, .env bí mật hoặc tệp thông tin xác thực trong thư mục nhà; bộ kiểm chỉ báo đường dẫn và không đọc giá trị."
  causes_vi:
    - "Vi phạm R252: nạp bí mật từ tệp dạng rõ thay cho bí mật đã mã hoá và cơ chế materialize."
  nextStep_vi: "Bỏ cách nạp tệp rõ; dùng starci app secret materialize và cơ chế bí mật của stack, không in giá trị."
  owner: op-retry
  kind: check-finding

HFS_SCRIPT_XTRACE:
  title: "Scripts do not enable xtrace or reveal secrets"
  title_vi: "Script bật truy vết hoặc hiện bí mật"
  meaning_vi: "Script tại <path> bật set -x, xtrace hoặc yêu cầu --reveal, có thể đưa giá trị bí mật vào log."
  causes_vi:
    - "Vi phạm R252: bật truy vết shell hoặc yêu cầu hiển thị bí mật trong lệnh tự động."
  nextStep_vi: "Tắt xtrace và bỏ --reveal; chỉ ghi thông tin thao tác không chứa giá trị bí mật."
  owner: op-retry
  kind: check-finding

HFS_PACKAGE_SECRET_NOT_SEALED:
  title: "A package secret file is not a valid sops document"
  title_vi: "Tệp bí mật của package không phải tài liệu sops hợp lệ"
  meaning_vi: "`<path>` (`packages/<pkg>/secrets/<tên>.sops.yaml`) đang được track nhưng không phải tài liệu sops hợp lệ: có giá trị dạng rõ, hoặc thiếu khối `sops` với mac."
  causes_vi:
    - "Vi phạm luật R277: package chỉ được commit `secrets/<env>.sops.yaml` khi mọi giá trị lá là `ENC[...]` và có khối `sops`."
  nextStep_vi: "Không đọc và không in giá trị. Niêm phong lại bằng sops (`sops --encrypt` theo `.sops.yaml` của package) rồi commit bản đã niêm phong; xoay secret nếu bản rõ đã lộ."
  owner: owner
  kind: check-finding

HFS_PACKAGE_SECRET_RECIPIENT:
  title: "A sealed package secret does not match the package's age recipients"
  title_vi: "Tệp bí mật của package không khớp recipient age của package"
  meaning_vi: "`<path>` là tài liệu sops nhưng khối `sops` không có recipient age, hoặc recipient khác với recipient mà `packages/<pkg>/.sops.yaml` khai cho đường dẫn đó (hoặc package không có `.sops.yaml`)."
  causes_vi:
    - "Vi phạm luật R277: tệp niêm phong phải mở được bằng đúng khoá age của package, nên recipient của tệp phải bằng recipient trong `.sops.yaml` của package."
  nextStep_vi: "Sửa `packages/<pkg>/.sops.yaml` cho đúng recipient rồi chạy `sops updatekeys` trên tệp, hoặc niêm phong lại tệp bằng recipient của package."
  owner: owner
  kind: check-finding

HFS_SECRET_PLAINTEXT_FILE:
  title: "A tracked plaintext secret file is refused"
  title_vi: "Tệp bí mật dạng rõ bị track trong kho"
  meaning_vi: "`<path>` là tệp bí mật dạng rõ được track (`secrets.env`, `*.env` không dấu chấm chứa khoá bí mật, hoặc tệp trong thư mục `secrets/`). Trong mọi edition bí mật chỉ được commit dưới dạng sops envelope tại `.starcistacks/<env>/secrets/**.enc`."
  causes_vi:
    - "Vi phạm luật R277: custody duy nhất cho secret được track là `.starcistacks/<env>/secrets/**.enc`; mọi file plaintext secret đều bị từ chối."
  nextStep_vi: "Không đọc và không in giá trị. Niêm phong giá trị bằng `starci app secret set` vào `.starcistacks/<env>/secrets/<slug>.enc` rồi gỡ tệp plaintext khỏi index; xoay secret nếu nó đã lộ."
  owner: owner
  kind: check-finding

HFS_SEED_PII:
  title: "Seed SQL contains no real email or phone literals"
  title_vi: "Seed SQL chứa dữ liệu định danh thật"
  meaning_vi: "File seed chứa literal có dạng email hoặc số điện thoại thật thay vì dữ liệu mẫu an toàn. Finding không hiển thị giá trị đó."
  causes_vi:
    - "Vi phạm R259: sao chép dữ liệu người dùng vào seed theo dõi trong repository."
  nextStep_vi: "Thay bằng địa chỉ @example.test và dữ liệu mẫu không định danh; không đưa dữ liệu người dùng thật vào seed."
  owner: op-retry
  kind: check-finding

HFS_SEEDS_SHAPE:
  title: "Seed data is misplaced or invalid"
  title_vi: "Dữ liệu seed đặt sai chỗ hoặc không hợp lệ"
  meaning_vi: "Dữ liệu seed của ứng dụng (R375) vi phạm khuôn của nó; thông báo của lỗi nêu đúng điểm sai. (1) Khuôn: một tệp dưới `.starcistacks/seeds/` hoặc `.starcistacks/<env>/seeds/` không phải `seeds.yaml` và không nằm trong `sql/`, `data/`, `files/`; hoặc thuộc cấp seed của một môi trường không được khai báo; hoặc là custody (envelope `.enc`, khoá `.pem`/`.key`, tệp `.env`). (2) Manifest: cấp seed có tệp nhưng không có `seeds.yaml`, manifest không đọc được hoặc sai schema starci/seeds@1, một mục trỏ tới đường dẫn không tồn tại, `after` nêu id không có hoặc tạo vòng, hay một tệp trong sql/, data/, files/ không thuộc mục nào. (3) DDL: một tệp SQL của mục sql có câu lệnh CREATE, ALTER, DROP, TRUNCATE, GRANT, REVOKE hoặc COMMENT: thay đổi schema hoặc quyền, việc chỉ migration được làm. (4) Schema dữ liệu: một tài liệu JSON hoặc YAML của mục data không qua được JSON schema mà mục đó nêu (`schema`, do app khai báo), hoặc schema đó không đọc được. (5) Dữ liệu thử: cấp seed dùng chung hoặc cấp của một môi trường không phải docker-compose có danh tính example.test hoặc giá trị, tên tệp bắt đầu bằng uat- hay test- ngoài mục test-account duy nhất mà môi trường đó khai báo. (6) Tham chiếu secret: một tài liệu seed có `{ \"secret\": \"<member>\" }` mà tên không có dạng seeds-<name>, hoặc môi trường của cấp đó (cấp dùng chung: mọi môi trường) không có `.starcistacks/<env>/secrets/<member>.enc.yaml`."
  causes_vi:
    - "Vi phạm R375: dữ liệu seed chỉ nằm trong hai cấp seed của `.starcistacks/`, mỗi cấp là một manifest (`seeds.yaml`, nơi khai báo thứ tự, loại, đích và chế độ once/upsert của mọi seed) và các thư mục sql/, data/, files/."
    - "Một secret được đặt cạnh seed thay vì niêm phong bằng sops trong `.starcistacks/<env>/secrets/`."
    - "Vi phạm BE-PERSISTENCE-1: dữ liệu seed không bao giờ là migration, và migration là nơi duy nhất thay đổi schema."
    - "App sở hữu ý nghĩa và schema của dữ liệu, harness kiểm tra tài liệu trước khi lệnh của app nạp nó; dữ liệu thử chỉ nằm trong cấp seed của môi trường dev; giá trị bí mật của seed nằm trong custody sops của môi trường, được bước seed mở trong bộ nhớ."
  nextStep_vi: "Khuôn: chuyển tệp vào thư mục loại của cấp seed (`starci app codemod seeds-layout` chuyển dữ liệu cũ); niêm phong secret bằng `starci app secret set --env <env>` và xoá bản rõ. Manifest: thêm hoặc sửa mục `{ id, kind, path, target, mode, after? }` trong `seeds.yaml` của cấp đó cho tệp được nêu. DDL: chuyển câu lệnh schema thành một migration (lite: `db/migrations/<ts14>_<kebab>.sql`), để seed chỉ ghi dòng dữ liệu một cách idempotent (`on conflict do nothing` hoặc upsert). Schema dữ liệu: sửa tài liệu cho khớp schema, hoặc sửa đường dẫn `schema` của mục trỏ tới schema app khai báo. Dữ liệu thử: chuyển vào `.starcistacks/dev/seeds/`, hoặc khai báo tài khoản thử duy nhất của production là một mục `kind: test-account` có `reason`; chỉ để dữ liệu ban đầu thật (gói, danh mục) ở cấp dùng chung. Tham chiếu secret: niêm phong giá trị bằng `starci app secret set --env <env>` vào member seeds-<name> của môi trường đó và tham chiếu đúng tên."
  owner: op-retry
  kind: check-finding

HFS_SERVICE_PLACEMENT:
  title: "A back-end service lives only at be/apps/<service>"
  title_vi: "Dịch vụ back end nằm ngoài be/apps/<service>"
  meaning_vi: "Một thư mục có Dockerfile hoặc package.json riêng nằm ngoài `be/apps/<service>/` (và không phải Dockerfile của front end hay package workspace của `fe/packages`), nên nó trở thành một gốc dịch vụ thứ hai bên cạnh `be/` và `fe/`."
  causes_vi:
    - "Vi phạm luật R163: mỗi dịch vụ back end là một ứng dụng Nest tại `be/apps/<service>/` dùng chung thư viện `be/src` và một `package.json` duy nhất của app; image của nó được build từ `be/apps/<service>/Dockerfile`."
    - "Op đã tạo thư mục dịch vụ riêng (ví dụ `services/<name>/` hoặc `be/<name>/`) thay vì thêm ứng dụng dưới `be/apps/`."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: chuyển dịch vụ vào `be/apps/<service>/` (main.ts, app.module.ts, Dockerfile) và xoá thư mục cũ; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding


HFS_SERVICE_STACK_DECLARATION:
  title: "Each service app is a service component of the stack"
  title_vi: "Ứng dụng dịch vụ chưa được khai báo trong stack"
  meaning_vi: "Một ứng dụng api hoặc worker dưới `be/apps/<service>/` của sản phẩm nhiều dịch vụ không có thành phần `role: service` trong `.starcistacks/application-stacks.yaml`: không có thành phần cùng tên, và không có thành phần nào được `environments.<env>.deploy.images.<component>.app` gắn với ứng dụng đó."
  causes_vi:
    - "Vi phạm luật R165: mọi dịch vụ của sản phẩm nhiều dịch vụ là một thành phần `role: service` của stack (image riêng `<repo>/<service>:<x.y.z>`, build từ Dockerfile của app)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra: thêm thành phần cùng tên app (role service, image đã ghim, file compose và cổng của môi trường), hoặc gắn thành phần dịch vụ đang chạy với app qua `environments.<env>.deploy.images.<component>.app` thay vì đổi tên dịch vụ."
  owner: op-retry
  kind: check-finding

HFS_SIZE_GROWTH:
  title: "Source file over the size budget grew"
  title_vi: "Tệp mã nguồn vượt hạn mức dòng vẫn tiếp tục dài thêm"
  meaning_vi: "Một tệp mã nguồn đã dài hơn hạn mức mềm của ruleParams.fileLines nhưng lại dài thêm so với phiên bản gốc của nhánh, hoặc một tệp mới tạo đã vượt hạn mức ngay từ đầu. Tệp quá dài khó đọc, khó sửa và là nơi lỗi dễ ẩn; quy tắc này cho phép tệp cũ đang quá dài được giữ nguyên hoặc thu nhỏ dần, nhưng không cho phép nó phình thêm."
  causes_vi:
    - "Op thêm mã mới vào một tệp vốn đã quá hạn mức thay vì tách phần mới sang tệp khác"
    - "Một tệp đang dưới hạn mức được thêm mã cho đến khi vượt hạn mức"
    - "Một tệp mới tạo dài hơn hạn mức, hoặc một tệp bị di chuyển sang đường dẫn mới nên bị coi là tệp mới"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để tách phần mã mới (hoặc bớt phần cũ) sang tệp riêng đúng ô của nó, sao cho tệp không dài hơn phiên bản gốc và tệp mới nằm trong hạn mức."
  owner: op-retry
  kind: check-finding

HFS_SLOT_AMBIGUOUS:
  title: "Path owned equally by two slots"
  title_vi: "Đường dẫn thuộc hai ô cùng mức cụ thể"
  meaning_vi: "Hai ô của bảng kê cùng khớp một đường dẫn với độ cụ thể bằng nhau nên không xác định được ô nào sở hữu. Đây là chỗ hở của bảng kê, không phải lỗi của kho."
  causes_vi:
    - "Hai mẫu đường dẫn trong bảng kê chồng lên nhau"
    - "Một ô mới thêm chưa loại phần trùng với ô cũ"
  nextStep_vi: "Người giám sát sửa bảng kê để mỗi đường dẫn chỉ có một ô sở hữu; kho không tự xử lý. Bộ kiểm tra chạy lại sau khi bảng kê được sửa."
  owner: op-retry
  kind: check-finding

HFS_SLOT_NOT_ENABLED:
  title: "Path in an opt-in slot the repository did not enable"
  title_vi: "Đường dẫn thuộc ô tuỳ chọn mà kho chưa bật"
  meaning_vi: "Tệp được theo dõi nằm trong một ô loại tuỳ chọn, nhưng hfs.json không liệt kê ô đó trong optionalSlots và không có ứng dụng nào thuộc loại tự bật ô đó."
  causes_vi:
    - "Kho dùng một loại nội dung tuỳ chọn (worker, websocket, tài liệu, gói dùng chung) mà chưa khai báo"
    - "Ứng dụng của loại tương ứng chưa được ghi vào apps của hfs.json"
  nextStep_vi: "Khai báo ô trong optionalSlots hoặc khai ứng dụng đúng loại ở hfs.json nếu nội dung này là thật; nếu không thì chuyển hoặc xoá tệp. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SLOT_REQUIRED_MISSING:
  title: "A slot is missing a required file (feature `index.ts`, app `main.ts`, FE `global-error.tsx`)"
  title_vi: "Ô thiếu tệp bắt buộc"
  meaning_vi: "Một ô bắt buộc (hoặc một thực thể của ô, như một ứng dụng hay một tính năng) đòi có tệp hoặc thư mục này nhưng nó không nằm trong những gì Git theo dõi."
  causes_vi:
    - "Vi phạm luật R02: slot bắt buộc thiếu tệp `requires` (vd feature thiếu `index.ts`, app thiếu `main.ts`, FE thiếu `global-error.tsx`)."
    - "Ứng dụng thiếu main.ts hoặc app.module.ts"
    - "Kho thiếu tệp gốc bắt buộc như README.md, hfs.json, .starciwork, .starcistacks"
  nextStep_vi: "Tạo tệp hoặc thư mục theo mẫu của ô rồi commit; tệp chưa git add vẫn tính là thiếu. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SLOT_UNDECLARED:
  title: "Every tracked path matches exactly one slot"
  title_vi: "Đường dẫn không thuộc ô nào"
  meaning_vi: "Một tệp hoặc thư mục trong kho không thuộc ô nào trong bảng kê; mọi đường dẫn được theo dõi phải khớp đúng một ô. Bộ kiểm tra báo kèm ô gần nhất để biết tệp lẽ ra thuộc đâu."
  causes_vi:
    - "Vi phạm luật R01: mọi path được track phải khớp đúng một slot trong `knowledge/hfs/slots.yaml` (thay allowlist gốc)."
    - "Tệp đặt sai chỗ, ví dụ một tệp không phải *.e2e-spec.ts nằm trong thư mục kiểm thử e2e"
    - "Thư mục do kho tự đặt ở gốc hoặc trong src mà HFS không có ô cho nó"
    - "Tên tệp hoặc thư mục viết sai so với mẫu của ô gần nhất"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để chuyển tệp vào ô gần nhất được báo hoặc xoá nó; nếu thực sự cần một loại nội dung mới thì đó là việc thêm ô vào bảng kê, do người giám sát làm, không phải kho tự thêm."
  owner: op-retry
  kind: check-finding

HFS_SONAR_CONFIG:
  title: "Sonar config is generated, with no host URL, importing the be lcov with the logic of be/src/modules as the coverage scope"
  title_vi: "Cấu hình Sonar lệch"
  meaning_vi: "Cấu hình Sonar lệch: `<detail>`. Sonar phải đọc đúng cấu hình sinh ra và nhập báo cáo độ phủ lcov của be, chỉ tính phần logic của be/src/modules (phạm vi suy ra từ slot manifest)."
  causes_vi:
    - "Vi phạm luật R11: `sonar-project.properties` do template sinh: không `sonar.host.url`, `sources`/`tests` không chồng, `sonar.exclusions` = đúng danh sách loại trừ của jest, nhập lcov của be (`sonar.javascript.lcov.reportPaths=be/coverage/lcov.info`) với `sonar.coverage.exclusions` loại mọi tệp không phải service (SonarQube không có coverage inclusions; starci app sync sinh phần bù từ COVERAGE_SOURCES và bộ hậu tố của slot manifest, gồm cả fe/**) và không khóa độ phủ nào khác, không nhắc kiểu spec đã bỏ, và nhận báo cáo ESLint cùng tệp nhập lỗi HFS (`sonar.eslint.reportPaths`, `sonar.externalIssuesReportPaths`) để mọi lỗi canon hiện trong Sonar."
    - "Vi phạm luật R11: `sonar-project.properties` do template sinh: không `sonar.host.url`, `sources`/`tests` không chồng, `sonar.exclusions` = đúng danh sách loại trừ của jest, nhập lcov của be (`sonar.javascript.lcov.reportPaths=be/coverage/lcov.info`) với `sonar.coverage.exclusions` loại mọi tệp không bị đo (SonarQube không có coverage inclusions; starci app sync sinh phần bù từ trường coverage của slot và ruleParams.be.logicRoles qua scripts/hfs/coverage-scope.mjs, gồm cả fe/**; lệch dòng này là HFS_COVERAGE_SCOPE_DRIFT) và không khóa độ phủ nào khác, không nhắc kiểu spec đã bỏ, và nhận báo cáo ESLint cùng tệp nhập lỗi HFS (`sonar.eslint.reportPaths`, `sonar.externalIssuesReportPaths`) để mọi lỗi canon hiện trong Sonar."
    - "Khối `services.sonar.qualityGate` của khai báo stack phải gọi đúng cổng chất lượng duy nhất của `knowledge/sonar-gate.yaml`; repo không tự ghi ngưỡng."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_SRC_LAYOUT_INVALID:
  title: "Backend src holds unexpected folders"
  title_vi: "Thư mục src của backend có mục lạ"
  meaning_vi: "Trong src của repo backend có thư mục nằm ngoài ba nơi cho phép là features, modules và tests, hoặc trong src/tests có thư mục ngoài các slot be.tests.* (world, fixtures, integration, e2e, contract)."
  causes_vi:
    - "Worker tạo thư mục mới ngay dưới src"
    - "Mã cũ chưa được dời về đúng feature hoặc module"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải dời thư mục đó về nơi sở hữu nó rồi chạy lại."
  owner: op-retry
  kind: check-finding

HFS_STACKS_IN_SIDE:
  title: "Stack declarations under a side (be/ or fe/) instead of the app root"
  title_vi: "Khai báo stack nằm trong một phía (be/ hoặc fe/) thay vì ở gốc app"
  meaning_vi: "Một phía của app (be/ hoặc fe/) đang chứa thư mục .starcistacks, trong khi .starcistacks chỉ được đặt ở gốc app, cạnh be/, fe/ và .starciwork."
  causes_vi:
    - "Còn giữ bố cục cũ be/.starcistacks từ trước khi chuyển về gốc app"
    - "Worker tạo stack trong một phía thay vì ở gốc app"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải dời thư mục bằng git mv về .starcistacks ở gốc app và sửa mọi đường dẫn trỏ tới nó."
  owner: op-retry
  kind: check-finding

HFS_STACKS_SHAPE:
  title: "`.starcistacks` violates the edition layout or Docker deployment requirements"
  title_vi: "Hình dạng hoặc runtime .starcistacks sai"
  meaning_vi: "Cây .starcistacks không khớp slot app.starcistacks, hoặc khai báo và mô hình Docker không nhất quán. Mọi dependency trong dev phải có container Docker Linux; Supabase dùng CLI cục bộ. Trong production, app và dependency dùng Swarm, trừ Supabase là dịch vụ hosted. Chỉ Supabase được khai trong backing; dependency khác phải là component Docker."
  causes_vi:
    - "Vi phạm R10 về cây theo edition, Sonar thuộc host hoặc runtime Swarm."
    - "Dependency đã chọn thiếu container trong mô hình, khai platform Windows hoặc dùng backing hosted khác Supabase."
  nextStep_vi: "Sửa cây theo slot app.starcistacks và khai dependency dưới components với bằng chứng Docker Linux; giữ Supabase CLI trong dev và hosted trong production. App có thể chạy native trong profile dev đã khai báo; dependency vẫn nằm trong Docker. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_BRANCH_PROFILE_INVALID:
  title: "A branch profile lowers what it may not, or names the default branch"
  title_vi: "Một branch profile hạ gate không được hạ, hoặc khai nhánh mặc định"
  meaning_vi: "Khối `branches` của .starcistacks/application-stacks.yaml chỉ được hạ các gate đánh bóng (lint, sonar, codecov) xuống report hoặc off, trên một nhánh mà policy/loosening.yaml branchProfiles cho phép; các gate an toàn (hfs, types, wiring, db, secrets, format, test) luôn chặn và nhánh mặc định (main) luôn chạy toàn bộ gate. Một khối bị từ chối không hạ gate nào: lần chạy dùng toàn bộ gate."
  causes_vi:
    - "Vi phạm R378: khai profile cho main, master hoặc ci.github.defaultBranch."
    - "Vi phạm R378: đặt một gate an toàn thành report hoặc off, hoặc một nhánh hay gate mà policy không cho phép."
  nextStep_vi: "Sửa khối branches: chỉ khai nhánh được phép (dev) và chỉ hạ lint, sonar, codecov; bỏ mọi gate an toàn khỏi profile hoặc để blocking, rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

DB_PRIMARY_KEY_SHAPE:
  title: "An app table's primary key is id uuid"
  title_vi: "Bảng của app không có khóa chính id uuid"
  meaning_vi: "Migration mới tạo bảng trong schema của app mà khóa chính không phải đúng một cột `id` kiểu uuid (khóa tự nhiên, khóa ghép, id bigint, hoặc không có khóa chính)."
  causes_vi:
    - "Vi phạm R431: khóa tự nhiên được dùng làm khóa chính thay vì là ràng buộc unique bên cạnh id."
  nextStep_vi: "Viết `id uuid primary key default gen_random_uuid()` và chuyển khóa tự nhiên thành `unique (...)`; nếu bảng do package sở hữu hoặc buộc khóa theo khóa tự nhiên, khai báo nó trong hfs.json db.keyExceptions kèm lý do."
  owner: op-retry
  kind: check-finding

DB_FOREIGN_KEY_NAME:
  title: "A foreign key column is named [<role>_]<referenced table singular>_id"
  title_vi: "Tên cột khóa ngoại không theo bảng nó tham chiếu"
  meaning_vi: "Migration mới khai báo khóa ngoại một cột mà tên cột không phải `<số ít của bảng được tham chiếu>_id` hay `<vai trò>_<số ít của bảng được tham chiếu>_id` (ví dụ `owner_id` trỏ tới users phải là `owner_user_id`)."
  causes_vi:
    - "Vi phạm R431: cột khóa ngoại chỉ mang tên vai trò hoặc tên một bảng khác."
    - "Danh từ số nhiều bất quy tắc chưa được khai trong hfs.json db.singulars."
  nextStep_vi: "Đổi tên cột thành `<số ít>_id` hoặc `<vai trò>_<số ít>_id` trong migration mới; với số nhiều bất quy tắc, thêm cặp `<số nhiều>: <số ít>` vào hfs.json db.singulars."
  owner: op-retry
  kind: check-finding

DB_FOREIGN_KEY_INDEX:
  title: "Every foreign key has an index leading with its columns"
  title_vi: "Khóa ngoại thiếu index"
  meaning_vi: "Khóa ngoại khai báo trong migration mới không có index, khóa chính hay ràng buộc unique nào của bảng bắt đầu bằng đúng các cột của nó trong tập migration, nên mỗi lần xóa bảng cha hay join đều quét toàn bảng."
  causes_vi:
    - "Vi phạm R431: tạo khóa ngoại mà quên index."
  nextStep_vi: "Thêm `create index <bảng>_<cột>_idx on <schema>.<bảng> (<cột>)` trong cùng migration hoặc một migration mới."
  owner: op-retry
  kind: check-finding

BE_FAILURE_CLASS_BY_TEXT:
  title: "A failure's class is never decided by matching its code or message text"
  title_vi: "Phân loại lỗi tạm thời hay vĩnh viễn bằng cách so chuỗi mã lỗi"
  meaning_vi: "Mã nguồn back end so mã hoặc thông điệp của lỗi với chuỗi của lỗi tạm thời (ECONNRESET, ETIMEDOUT, 40001, ...) bằng literal hoặc regex để quyết định thử lại; chỉ `classifyFailure` của @starci/nest-kit được quyết định, dựa trên `failureClass` mà lỗi mang theo."
  causes_vi:
    - "Vi phạm R432: viết danh sách mã lỗi thứ hai, lệch với bộ phân loại chung."
  nextStep_vi: "Xóa phép so chuỗi; nơi biết lỗi là tạm thời hay vĩnh viễn thì ném lỗi kèm `failureClass` (transient, input, config hoặc code) và để job runner phân loại; app có job outbox dùng @starci/outbox."
  owner: op-retry
  kind: check-finding

HFS_CONCEPT_CONVENTIONS_MISSING:
  title: "Every app keeps a conventions concept its catalog links"
  title_vi: "App thiếu concept conventions"
  meaning_vi: "`.starciwork/concepts/conventions.md` chưa được track, hoặc bảng `.starciwork/concepts/README.md` không có dòng trỏ tới nó; concept này giữ quy ước đặt tên, khóa, khóa ngoại, lớp lỗi và cách chứng minh của app, và được đọc trước khi sửa code."
  causes_vi:
    - "Vi phạm R433: app được tạo trước khi scaffold render concept conventions, hoặc concept bị xóa khỏi catalog."
  nextStep_vi: "Viết `.starciwork/concepts/conventions.md` theo các heading của PROJECT-WORK-7 và thêm dòng `| [conventions](conventions.md) | <thư mục> | <một dòng> |` vào README của concepts."
  owner: op-retry
  kind: check-finding

HFS_MASTER_PLAN_INVALID:
  title: "The Master Plan is nine layers of decisions, a reason and always/never rules"
  title_vi: "Master Plan sai cấu trúc"
  meaning_vi: "`.starciwork/master-plan.yaml` không phải YAML, sai schema `starci/master-plan@1`, không đủ chín tầng theo đúng thứ tự (business, tech, patterns, ui, data, testing, security, observability, domains), có luật thiếu id, kind (always hoặc never) hay text, lặp id luật, hoặc `enforcedBy` trỏ tới một luật hfs không có trong catalog."
  causes_vi:
    - "Vi phạm R449: sửa Master Plan bằng tay mà sai khóa, đổi thứ tự tầng, hoặc gán `enforcedBy` cho một mã luật không tồn tại."
  nextStep_vi: "Sửa tệp theo PROJECT-MASTER-PLAN-1: giữ chín tầng theo thứ tự, mỗi tầng có decisions, reason và rules; mỗi luật `{ id, kind: always|never, text, enforcedBy? }`. Chạy `starci app master-plan` để xem luật nào đã có cổng giữ."
  owner: op-retry
  kind: check-finding

HFS_MASTER_PLAN_MISSING:
  title: "The app keeps no Master Plan yet"
  title_vi: "App chưa có Master Plan"
  meaning_vi: "App root chưa track `.starciwork/master-plan.yaml`, nên brief của task không mang được các tầng quyết định và luật của dự án. Đây là cảnh báo, không phải lỗi."
  causes_vi:
    - "App được tạo trước khi scaffold render Master Plan (R449)."
  nextStep_vi: "Viết `.starciwork/master-plan.yaml` theo PROJECT-MASTER-PLAN-1 (chép khung từ template skeleton của @starci/hfs) rồi điền quyết định, lý do và luật của từng tầng."
  owner: op-retry
  kind: check-finding

HFS_SOPS_RECIPIENTS:
  title: "Each environment's .sops.yaml rule names exactly its recipient set"
  title_vi: "Rule .sops.yaml của một môi trường không đúng bộ recipient"
  meaning_vi: "Rule mà sops dùng cho member của một môi trường không nêu đúng bộ recipient của policy (R451, PROJECT-STACKS-5): dev chỉ có recipient của harness (`age173qf…`); staging và production có đúng khóa của VPS mà môi trường deploy tới cùng khóa backup của server đó, và không bao giờ có khóa harness. Một recipient không phải khóa nào được khai trong ops/vps/recipients.yaml là identity riêng của app, không được phép."
  causes_vi:
    - "App được tạo trước policy 2026-11-21: `starci app secret init` cũ sinh một identity riêng cho app."
    - "Rule staging hoặc production còn khóa harness hoặc khóa owner cũ."
    - "Mức độ là dữ liệu: khi `enforce` của ops/vps/recipients.yaml (hoặc của server) còn false, mọi phát hiện R451 chỉ là cảnh báo ở mọi env; khi true thì là lỗi, `--env local` chỉ liệt kê, `--env prod` chặn."
  nextStep_vi: "Dev: `starci app secret recipients --env dev --add <harness> --remove <khóa riêng> --execute`, rồi seal lại từng member. Staging/production: ghi rule `age: <khóa server>,<khóa backup>` và reseal member TRÊN server bằng khóa server (sops updatekeys, không ghi plaintext ra đĩa); máy dev chỉ giữ nửa public."
  owner: op-retry
  kind: check-finding
  localOnly: true

HFS_SOPS_IDENTITY_MISMATCH:
  title: "The SOPS_AGE_KEY this machine takes opens the app's dev members"
  title_vi: "SOPS_AGE_KEY trên máy này không mở được member dev"
  meaning_vi: "`starci app check --env local` so nửa public của SOPS_AGE_KEY mà lookup sẽ chọn (biến môi trường, `.claude/secret.env` của app, của main checkout, rồi secret.env của harness) với recipient của member dev đầu tiên. Không khớp thì `stack up` sẽ bị từ chối. Thông báo nêu tệp đã đọc, prefix recipient của nó và prefix cần có. Chỉ là cảnh báo, chỉ cho môi trường dev: máy dev không giữ khóa của staging/production là đúng."
  causes_vi:
    - "Một khóa khác (ví dụ khóa package) bị dán đè lên SOPS_AGE_KEY trong `.claude/secret.env` của app (sự cố 2026-11-21)."
    - "Member dev còn seal cho một identity riêng của app (R451)."
  nextStep_vi: "Xóa hoặc đổi tên dòng SOPS_AGE_KEY sai; khóa package luôn nằm dưới tên riêng (ví dụ NIVO_PACKAGE_AGE_KEY), không bao giờ là SOPS_AGE_KEY. Khóa harness nằm trong secret.env của harness."
  owner: op-retry
  kind: check-finding

HFS_SOPS_RECIPIENT_UNDECLARED:
  title: "An environment's recipient set resolves to declared public keys"
  title_vi: "Bộ recipient của một môi trường chưa xác định được"
  meaning_vi: "Môi trường cần khóa server và khóa backup (R451), nhưng nó chưa ghi `deploy.remote.serverRecipient`, server đó chưa được khai trong ops/vps/recipients.yaml, hoặc khóa backup của server chưa được tạo."
  causes_vi:
    - "Môi trường production chưa chạy `starci app secret server-key --env <env> --execute`."
    - "Khóa backup của VPS chưa được tạo (lane backup-key và break-glass GitHub)."
    - "Cảnh báo khi `enforce` còn false; khi true, `--env local` chỉ liệt kê, `--env prod` chặn."
  nextStep_vi: "Tạo khóa server bằng `starci app secret server-key --env <env> --execute`, khai server và khóa backup (chỉ nửa public) trong ops/vps/recipients.yaml của harness, rồi bump @starci/hfs."
  owner: op-retry
  kind: check-finding
  localOnly: true

HFS_SOPS_CATCH_ALL:
  title: "Every environment keeps a .sops.yaml rule of its own, with no catch-all"
  title_vi: ".sops.yaml có rule catch-all"
  meaning_vi: "Một rule của .sops.yaml khớp member của mọi môi trường không có rule riêng, nên một môi trường mới sẽ bị seal vào recipient của rule đó (R451). Mỗi môi trường giữ một rule riêng: dev cho khóa harness, mỗi môi trường deploy cho khóa server cùng khóa backup."
  causes_vi:
    - "`starci app secret init` cũ ghi một rule cho mọi môi trường."
    - "Cảnh báo khi `enforce` còn false; khi true, `--env local` chỉ liệt kê, `--env prod` chặn."
  nextStep_vi: "Xóa rule catch-all khỏi .sops.yaml sau khi mỗi môi trường đã có rule riêng."
  owner: op-retry
  kind: check-finding
  localOnly: true

HFS_SOPS_MEMBER_RECIPIENTS:
  title: "Every sealed member is sealed to exactly its environment's recipient set"
  title_vi: "Member đã seal không đúng bộ recipient của môi trường"
  meaning_vi: "Các recipient trong khối `sops.age` của một member (đọc không cần giải mã) khác bộ recipient của môi trường (R451). Member giữ recipient cũ cho tới khi được seal lại, kể cả khi rule đã sửa."
  causes_vi:
    - "Member được seal trước khi rule đổi, hoặc bằng một identity riêng của app."
    - "Cảnh báo khi `enforce` còn false; khi true, `--env local` chỉ liệt kê, `--env prod` chặn."
  nextStep_vi: "Dev: `starci app secret migrate --env dev <member> --execute` với một identity mở được member. Staging/production: reseal trên server bằng khóa server (sops updatekeys); nếu giá trị đã từng được seal cho một khóa phía dev thì xoay vòng giá trị, không chỉ reseal."
  owner: op-retry
  kind: check-finding
  localOnly: true

HFS_CONCEPT_UNCATALOGUED:
  title: "The concept catalog has one row per concept"
  title_vi: "Concept không có dòng trong catalog, hoặc dòng catalog trỏ tới concept không tồn tại"
  meaning_vi: "Một tệp `.starciwork/concepts/<topic>.md` được track mà không dòng nào của bảng `.starciwork/concepts/README.md` trỏ tới, hoặc một dòng của bảng trỏ tới concept không được track. Người đọc tìm concept qua catalog, nên concept không có dòng sẽ không bao giờ được đọc trước code."
  causes_vi:
    - "Vi phạm R433 (PROJECT-WORK-7): thêm concept mà quên thêm dòng catalog, hoặc xóa/đổi tên concept mà để lại dòng cũ."
    - "`--env local` chỉ liệt kê, `--env prod` (hook push, CI, phát hành) chặn."
  nextStep_vi: "Thêm dòng `| [<topic>](<topic>.md) | <thư mục chứa chủ đề> | <một dòng> |` cho concept, hoặc viết lại concept / xóa dòng trỏ tới concept đã mất."
  owner: op-retry
  kind: check-finding
  localOnly: true

HFS_GATE_DECLARATION_INVALID:
  title: "An app switches off a gate it may not, with no reason, or names no gate"
  title_vi: "Một app tắt gate không được tắt, tắt không nêu lý do, hoặc khai một id không phải gate"
  meaning_vi: "Khối `gates` của .starcistacks/application-stacks.yaml được tắt mọi gate trừ hfs, secrets và db cho cả app (lint, format, sonar, codecov, test, coverage, types, build, audit, wiring, checks, deps), mỗi gate là `{ run: off, reason: \"...\" }` với lý do ngắn bắt buộc. Các gate hfs (cấu trúc, slot, stack, tên, managed file), secrets (quét và lưu secret đã seal) và db (luật migration) là luật của chính harness nên không bao giờ tắt được; một gate đọc kết quả của gate đã tắt (test cho coverage, codecov, sonar; lint cho sonar) cũng phải tắt. Một khối bị từ chối không tắt gate nào: lần chạy dùng toàn bộ gate và finding này chặn."
  causes_vi:
    - "Vi phạm R430: tắt hfs, secrets hoặc db, hoặc tắt một gate mà gate đọc nó vẫn chạy."
    - "Vi phạm R430: một gate tắt không có `reason`, hoặc một id không phải gate, hoặc `run` khác off."
  nextStep_vi: "Sửa khối gates: không khai hfs, secrets, db; mỗi gate khác `{ run: off, reason: \"<vì sao app không chạy>\" }`; muốn chạy lại thì xoá mục đó, rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

LINT_RATCHET_RAISED:
  title: "A commit on a branch that reports lint adds lint findings to a file it touches"
  title_vi: "Một commit trên nhánh lint ở chế độ report thêm lỗi lint vào file nó sửa"
  meaning_vi: "Trên nhánh có branch profile đặt lint là report, lỗi lint cũ chỉ được báo, nhưng mỗi file bị commit chạm vào không được có nhiều lỗi lint hơn ở base (commit cha khi pre-commit; merge-base với nhánh remote, hoặc HEAD^, khi pre-push và CI), và một file mới không được có lỗi nào. Vi phạm ratchet luôn chặn, ở mọi số lượng."
  causes_vi:
    - "Vi phạm R379: sửa một file và thêm lỗi lint mới vào nó."
    - "Vi phạm R379: thêm một file mới có lỗi lint."
  nextStep_vi: "Sửa các lỗi lint mới trong những file đã chạm (lỗi cũ có thể để lại), rồi commit hoặc push lại; không đuổi theo lỗi lint của file không chạm."
  owner: op-retry
  kind: check-finding

LINT_NEW_CODE_FINDING:
  title: "A line changed since main carries an ESLint error on a branch that reports lint"
  title_vi: "Một dòng đã đổi so với main có lỗi ESLint trên nhánh đặt lint ở chế độ report"
  meaning_vi: "Trên nhánh có branch profile đặt lint là report (dev), lỗi lint cũ trên dòng không đổi chỉ được báo, nhưng một lỗi ESLint nằm trên dòng đã thêm hoặc sửa so với merge-base với main là code mới và luôn chặn, ở mọi số lượng."
  causes_vi:
    - "Vi phạm R387: thêm hoặc sửa một dòng khiến ESLint báo lỗi."
  nextStep_vi: "Sửa lỗi lint trên các dòng đã đổi (lỗi trên dòng không đổi có thể để lại), rồi commit hoặc push lại."
  owner: op-retry
  kind: check-finding

COVERAGE_NEW_CODE_BELOW:
  title: "The predicted new-code coverage of the changed lines is below the minimum main's gate holds"
  title_vi: "Độ phủ code mới dự đoán của các dòng đã đổi thấp hơn mức tối thiểu cổng của main đòi hỏi"
  meaning_vi: "Trên nhánh có branch profile đặt sonar là report (dev), cổng chất lượng của server Sonar và Codecov chỉ báo, nhưng độ phủ code mới dự đoán từ bản ghi unit-spec của lần chạy này trên các dòng đã đổi so với merge-base với main không được thấp hơn mức newCode.coverage.minPercent của cổng Sonar mà main áp dụng. Vi phạm luôn chặn."
  causes_vi:
    - "Vi phạm R387: thêm hoặc sửa dòng code mà không có unit spec phủ chúng."
  nextStep_vi: "Viết hoặc mở rộng unit spec để phủ các dòng đã đổi (số dòng và phần trăm nằm trong thông báo), rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

BRANCH_MAIN_NOT_ON_DEV:
  title: "main moves only to a commit on dev"
  title_vi: "main chỉ được dời tới một commit nằm trên dev"
  meaning_vi: "Hook pre-push của app đã chặn lần đẩy main: không có nhánh dev, hoặc commit đẩy không nằm trên dev ở máy và trên remote. main là nhánh phát hành: chỉ đi tới một commit đã có trên dev, bằng fast-forward qua starci release push."
  causes_vi:
    - "Vi phạm R388: commit trực tiếp trên main."
    - "dev chưa được đẩy, hoặc dev trên remote chưa chứa commit sắp phát hành."
    - "App chưa có nhánh dev."
  nextStep_vi: "Đưa công việc vào dev và đẩy dev trước, rồi fast-forward main tới dev (git merge --ff-only dev) và chạy starci release push. App chưa có dev thì tạo từ main và đẩy lên."
  owner: supervisor
  kind: verb-refusal

BRANCH_DEV_NOT_ON_MAIN:
  title: "dev always contains main"
  title_vi: "dev luôn chứa main"
  meaning_vi: "Hook pre-push của app đã chặn lần đẩy dev: dev bị xóa, hoặc dev đẩy lên không chứa main (ở máy, trên remote hoặc main đẩy cùng). dev luôn bằng hoặc đi trước main; hai nhánh không bao giờ rẽ."
  causes_vi:
    - "Vi phạm R388: dev tụt sau main hoặc rẽ khỏi main."
    - "Thao tác xóa dev."
  nextStep_vi: "Merge main vào dev (hoặc fast-forward dev tới main) rồi đẩy lại dev; không xóa dev."
  owner: supervisor
  kind: verb-refusal

BRANCH_MAIN_NOT_CHECKED_OUT:
  title: "A push of main carries the checked-out commit"
  title_vi: "Lần đẩy main phải mang commit đang checkout"
  meaning_vi: "Hook pre-push của app đã chặn lần đẩy main vì commit đẩy không phải HEAD đang checkout: starci app check của hook chạy trên cây đang checkout với cổng đầy đủ của main, nên chỉ commit đó mới được đẩy."
  causes_vi:
    - "Vi phạm R388: đẩy một commit khác HEAD tới main (ví dụ git push origin <sha>:main)."
  nextStep_vi: "Checkout commit cần phát hành (main sau khi fast-forward tới dev) rồi chạy starci release push."
  owner: supervisor
  kind: verb-refusal

HFS_DEV_BRANCH_MISSING:
  title: "An app repository has no dev branch"
  title_vi: "Repository của app không có nhánh dev"
  meaning_vi: "Một app giữ đúng hai nhánh dài hạn là main và dev: dev tách từ main và luôn bằng hoặc đi trước main, main chỉ dời tới một commit đã có trên dev. starci app check đầy đủ báo lỗi (đỏ ở cả --env local và --env prod) khi repository không có nhánh dev, ở máy hoặc là origin/dev."
  causes_vi:
    - "App chưa từng tạo nhánh dev (vi phạm R388)."
  nextStep_vi: "Tạo dev từ main (git branch dev main) và đẩy lên origin; công việc mới tách từ dev và merge lại vào dev."
  owner: supervisor
  kind: check-finding

STACK_PENDING_MIGRATIONS:
  title: "The dev database has not applied migration files the repository holds"
  title_vi: "Database dev chưa áp dụng migration có trong repository"
  meaning_vi: "starci app check --env local so sánh các file migration của repository (db/migrations, hoặc thư mục database.migrationsDir trong .starcistacks) với lịch sử đã áp dụng của database dev đang chạy (supabase_migrations.schema_migrations) và báo lỗi cho mỗi file chưa áp dụng. Code cần cột hoặc ràng buộc của migration đó sẽ lỗi lúc chạy (ví dụ vi phạm check constraint) dù mọi kiểm tra tĩnh đều xanh. Stack chưa chạy thì không có gì để so sánh và không báo lỗi."
  causes_vi:
    - "Migration mới được merge hoặc kéo về nhưng chưa chạy lại starci app stack up."
    - "Một migration được thêm vào nhánh khác rồi chuyển sang nhánh này sau khi database dev đã được migrate."
  nextStep_vi: "Chạy starci app stack up --env dev --execute (nó gọi starci app db migrate trên database dev và ghi biên nhận), rồi chạy lại starci app check."
  owner: supervisor
  kind: check-finding

STACK_DEAD_LETTER_REPEAT:
  title: "A queue or job dead-lettered more than once in the last 24 hours"
  title_vi: "Một queue hoặc job bị dead-letter nhiều lần trong 24 giờ qua"
  meaning_vi: "starci app check --env local đọc 24 giờ gần nhất của api.log của môi trường dev (state/stack/<app>/<env>/logs/api.log) và báo lỗi cho mỗi queue/job có hơn một dòng dead-letter (queue.delivery.dead-lettered hoặc event-bus.delivery.dead), kèm tên queue, job và thông điệp lỗi gần nhất. Một job cứ dead-letter lặp lại là lỗi mà không lần thử lại nào tự sửa được và không ai nhìn thấy nếu không đọc log."
  causes_vi:
    - "Job định kỳ (tick) ghi một dòng vi phạm ràng buộc, ví dụ khóa dedupe sai định dạng, nên lần chạy nào cũng chết."
    - "Migration chưa áp dụng làm một câu lệnh của job luôn lỗi (xem STACK_PENDING_MIGRATIONS)."
  nextStep_vi: "Đọc thông điệp lỗi trong finding, sửa nguyên nhân (mã hoặc migration), rồi resume hoặc requeue job (BE-RESILIENCE-2). Kiểm tra lại bằng starci app check sau khi log không còn dòng dead-letter mới."
  owner: supervisor
  kind: check-finding

HFS_STARCIWORK_LITE_FORBIDDEN:
  title: "lite .starciwork holds only workspace.yaml, brand/ and the concept records"
  title_vi: "Work của lite"
  meaning_vi: "Trong ứng dụng edition lite, .starciwork chỉ được giữ workspace.yaml, .gitignore, brand/** (bản ghi bản vẽ, tham chiếu và tài sản thương hiệu) và các bản ghi concept (concepts/index.yaml, concepts/<name>/index.yaml). Cây này không bắt buộc khi ứng dụng chưa có bản ghi thương hiệu."
  causes_vi:
    - "Ứng dụng lite còn index.yaml, shell/, features/, _resources/, uat hoặc br trong .starciwork"
    - "Có tệp khác nằm ngoài workspace.yaml, brand/, các bản ghi concept và .gitignore trong Work của lite"
  nextStep_vi: "Giữ nguyên workspace.yaml, brand/**, các bản ghi concept và .gitignore; xoá features/ và index.yaml (tài liệu theo từng feature đã bỏ ở cả hai edition, ngữ cảnh chung nằm trong concepts/), chuyển nội dung khác ra khỏi .starciwork, rồi chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

HFS_TEXT_CORRUPT:
  title: "A Vietnamese message catalog lost its diacritics"
  title_vi: "Danh mục thông điệp tiếng Việt bị mất dấu"
  meaning_vi: "Một tệp thông điệp (messages.ts hoặc vi.json) không phải UTF-8 hợp lệ, hoặc chuỗi tiếng Việt có dấu hỏi chấm hay ký tự thay thế U+FFFD ở chỗ lẽ ra là chữ có dấu."
  causes_vi:
    - "Tệp được ghi lại qua một đường ống hoặc lệnh shell không giữ UTF-8."
    - "Biên tập bằng công cụ chuyển mã làm mất chữ có dấu."
  nextStep_vi: "Viết lại chuỗi tiếng Việt bằng trình soạn thảo hoặc Node theo UTF-8 tại đường dẫn và dòng được báo; không dùng đường ống shell."
  owner: op-retry
  kind: check-finding

HFS_TOOL_CONFIG_LOCAL:
  title: "Configs only call the factories; no local rules"
  title_vi: "Kho tự đặt luật cục bộ"
  meaning_vi: "Repo có cấu hình công cụ cục bộ ở `<file>`: tệp cấu hình ngoài bộ được quản lý (`.eslintrc*`, `.eslintignore`, `eslint.config.*` hay `stylelint.config.*` thứ hai, cấu hình prettier/lint-staged khác), tệp tự định nghĩa luật ESLint hoặc plugin stylelint, khóa cấu hình công cụ trong `package.json` (`eslintConfig`, `stylelint`, `prettier`, `lint-staged` hoặc khóa Jest), hoặc lệnh chạy eslint/stylelint/prettier với cờ đổi cấu hình (`--rule`, `--no-inline-config`, `--no-eslintrc`, `--config`, `--ignore-pattern`). Luật chung nằm trong `.claude`; đề xuất thay đổi ở đó."
  causes_vi:
    - "Vi phạm luật R16: Cấu hình của repo chỉ gọi factory của `.claude`; cấm tệp cấu hình công cụ khác, tệp luật cục bộ (vd một tệp eslint-local trong thư mục scripts) và cờ dòng lệnh đổi hoặc tắt cấu hình trong hook, workflow, script."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_TRACKED_MUST_BE_IGNORED:
  title: "Tracked path that must be gitignored"
  title_vi: "Tệp bị theo dõi nhưng lẽ ra phải bị bỏ qua"
  meaning_vi: "Tệp nằm trong một ô loại ignored (kết quả build, tệp sinh tự động, phụ thuộc) nhưng đã được đưa vào Git."
  causes_vi:
    - "Thư mục dist, coverage, .next hoặc tệp sinh tự động bị git add"
    - ".gitignore thiếu dòng cho thư mục này"
  nextStep_vi: "Gỡ tệp khỏi Git bằng git rm --cached và thêm vào khối .gitignore chuẩn; không xoá thư mục trên đĩa. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra; không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_TS_STRICT:
  title: "tsconfig extends `@starci/tsconfig` and lowers no flag"
  title_vi: "tsconfig hạ cờ strict"
  meaning_vi: "`tsconfig.json` đặt hoặc hạ cờ `<flag>`. `tsconfig.json` chỉ extends `@starci/tsconfig/be.json` và khai báo `paths` của ba alias; mọi cờ do preset quy định."
  causes_vi:
    - "Vi phạm luật R22: `tsconfig.json` chỉ có `extends` và `paths`; các cờ `strict`, `noUncheckedIndexedAccess`, `noImplicitOverride`, `noImplicitReturns`, `noFallthroughCasesInSwitch`, `noUnusedLocals`, `noUnusedParameters`, `allowJs: false` nằm trong preset và repo không đặt, không hạ cờ nào."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_UNTRACKED_ROOT_ENTRY:
  title: "No untracked or ignored entry outside an `ignored` slot"
  title_vi: "Mục lạ ở gốc kho"
  meaning_vi: "Có mục chưa được git theo dõi, cũng không nằm trong `.gitignore` hay slot `ignored`, nên HFS không cho phép nó tồn tại trong cây làm việc. Theo dõi nó vào đúng slot, hoặc lưu trữ ra `<archive root>/` rồi xóa."
  causes_vi:
    - "Vi phạm luật R03: Thư mục làm việc không được có mục untracked/ignored ngoài slot `ignored` (vd `nul`, `.worktrees/`, `design-plans/`, `express`)."
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra (nợ hàng loạt có codemod của HFS); không cần ai can thiệp thêm."
  owner: op-retry
  kind: check-finding

HFS_UNUSED_EXPORT:
  title: "Public export that nothing outside the module uses"
  title_vi: "Tên xuất công khai mà không nơi nào bên ngoài dùng"
  meaning_vi: "Cửa vào công khai (index.ts) của một module, tính năng hoặc gói đang xuất ra một tên mà không tệp sản xuất nào nằm ngoài module đó import. Tệp kiểm thử không được tính là nơi dùng. Tên thừa ở cửa vào làm bề mặt công khai phình to, khiến người sau tưởng có thể dựa vào nó và làm việc thay đổi module khó hơn."
  causes_vi:
    - "Xuất thêm kiểu, hằng số hoặc hàm 'phòng khi cần' nhưng chưa có nơi nào dùng"
    - "Nơi từng dùng tên này đã bị xoá hoặc chuyển vào cùng module, còn dòng xuất ở cửa vào bị bỏ sót"
    - "Tên chỉ được dùng trong tệp kiểm thử, nên với bộ kiểm tra nó vẫn là thừa"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để xoá tên khỏi cửa vào (hoặc bỏ luôn phần khai báo nếu không còn ai dùng); nếu tên thực sự cần cho một nơi ngoài module thì nơi đó phải import nó qua cửa vào."
  owner: op-retry
  kind: check-finding

HFS_UNUSED_FILE:
  title: "Production file that nothing reaches"
  title_vi: "Tệp mã sản xuất không ai chạm tới"
  meaning_vi: "Một tệp mã sản xuất không được nối tới từ bất kỳ gốc nào: không phải main.ts hay app.module.ts của một ứng dụng, không phải tệp route, không phải cửa vào của một gói, và không tệp sản xuất nào import nó (kể cả import chỉ kiểu). Tệp kiểm thử không được tính; tệp chỉ có spec dùng vẫn là chết. Không tiến trình nào chạy tệp này."
  causes_vi:
    - "Nơi từng import tệp đã bị xoá hoặc chuyển đi, còn tệp bị bỏ sót"
    - "Tệp được thêm nhưng chưa nối vào module hay cửa vào nào"
    - "Tệp chỉ được spec dùng"
  nextStep_vi: "Op vừa tạo ra bản này sẽ được chạy lại để xoá tệp, hoặc nối nó vào nơi thật sự dùng; không thêm ngoại lệ."
  owner: op-retry
  kind: check-finding

HFS_UNUSED_SYMBOL:
  title: "An enum member, queue constant, error code or catalog key has no production consumer"
  title_vi: "Ký hiệu không có nơi dùng trong mã chạy thực tế"
  meaning_vi: "Thành viên enum, hằng hàng đợi, mã lỗi hoặc khóa danh mục được khai báo nhưng không được mã chạy thực tế sử dụng; bảng mô tả lỗi và tham chiếu chỉ trong kiểm thử không đủ."
  causes_vi:
    - "Ký hiệu còn sót lại sau khi xóa hoặc đổi luồng nghiệp vụ."
    - "Import namespace hoặc bảng ánh xạ che mất ký hiệu không còn dùng."
  nextStep_vi: "Xóa ký hiệu và ánh xạ thừa, hoặc nối nó vào luồng chạy thực tế nếu nghiệp vụ vẫn cần."
  owner: op-retry
  kind: check-finding

HFS_WORKFLOW_CONTEXT:
  title: "Workflow expressions use contexts available at their key"
  title_vi: "Biểu thức workflow dùng ngữ cảnh không được phép"
  meaning_vi: "Biểu thức tại file:line và đường dẫn khóa dùng ngữ cảnh chưa có tại khóa đó."
  causes_vi:
    - "Vi phạm R299: env cấp job đọc runner, job, steps hoặc env trước khi ngữ cảnh sẵn sàng."
  nextStep_vi: "Chuyển env phụ thuộc runner vào env của bước sử dụng, hoặc dùng RUNNER_TEMP trong shell; kiểm tra file:line và đường dẫn khóa được báo."
  owner: op-retry
  kind: check-finding

HFS_WORKFLOW_PIN:
  title: "Remote workflow actions use immutable commit SHAs"
  title_vi: "Action của workflow chưa được ghim SHA"
  meaning_vi: "Workflow tại <path> dùng action từ xa với tag hoặc nhánh thay cho commit SHA gồm 40 ký tự hex."
  causes_vi:
    - "Vi phạm R251: action có thể đổi nội dung khi tag hoặc nhánh thay đổi."
  nextStep_vi: "Ghim uses của action từ xa bằng commit SHA gồm 40 ký tự hex; action cục bộ vẫn dùng đường dẫn trong kho."
  owner: op-retry
  kind: check-finding

HFS_WORK_IN_FE:
  title: "Work tree inside the front end (fe/)"
  title_vi: "Hồ sơ Work nằm trong repo giao diện"
  meaning_vi: "Repo giao diện chứa thư mục .starciwork, trong khi hồ sơ Work chỉ được lưu ở repo backend."
  causes_vi:
    - "Tạo hồ sơ Work nhầm repo"
    - "Sao chép nguyên cây Work sang repo giao diện"
  nextStep_vi: "Bộ kiểm kiến trúc từ chối; op phải chuyển hồ sơ sang repo backend rồi chạy lại."
  owner: op-retry
  kind: check-finding

RELEASE_NOTES:
  title: "Release tag without finished release notes"
  title_vi: "Tag phát hành chưa có ghi chú phát hành hoàn chỉnh"
  meaning_vi: "HEAD mang tag phát hành v<phiên bản> nhưng CHANGELOG.md không có mục ## [<phiên bản>], hoặc mục đó còn TODO, PENDING, TBD hay dấu in preparation. Thông điệp của tag và GitHub Release chính là mục này nên không được cắt tag khi nó chưa xong."
  causes_vi:
    - "Tạo tag trước khi viết xong mục CHANGELOG"
    - "Còn sót dấu PENDING hoặc TBD của lane chưa land"
  nextStep_vi: "Người giám sát hoàn tất mục CHANGELOG của phiên bản (xóa mọi dấu TODO, PENDING, TBD), commit rồi mới tạo lại tag chú thích trên commit phát hành; không dời hay xóa tag đã đẩy."
  owner: supervisor
  kind: check-finding

RIGHTS_PUSH_NOT_RELEASE:
  title: "Pre-push gate refused the push"
  title_vi: "Cổng pre-push từ chối lần đẩy"
  meaning_vi: "Hook pre-push đã chặn một lần đẩy main hoặc thẻ v* của runtime hoặc app: main không phải fast-forward hoặc vùng đẩy có ứng viên bí mật; thẻ v* không phải thẻ annotated."
  causes_vi:
    - "Thao tác xóa main hoặc xóa thẻ phát hành"
    - "Đẩy main không phải fast-forward của main trên remote (force push, rewind hoặc nhánh rẽ)"
    - "Vùng đẩy chứa ứng viên bí mật (tên tệp, dòng và mẫu, không bao giờ giá trị)"
    - "Đẩy thẻ v* không phải thẻ annotated"
  nextStep_vi: "Gỡ hoặc mã hóa ứng viên bí mật, fetch main rồi đẩy lại bằng starci release push; thẻ thì tạo bằng starci release cut (thêm --dry-run để xem trước)."
  owner: supervisor
  kind: verb-refusal

RT_LOOSENING_STATE:
  title: "The tree holds a loosened gate"
  title_vi: "Cây mã đang giữ một cổng kiểm bị nới lỏng"
  meaning_vi: "Cây mã hiện tại có một cách bỏ qua kiểm tra (chú thích tắt luật, bỏ qua kiểu hoặc độ phủ, test bị bỏ qua hoặc chỉ chạy một phần, lỗi bị nuốt trong script hay workflow), một mục ignore hoặc exclude mà canon không sinh ra và bảng design-truths không cho phép, một ngưỡng bị hạ, một công tắc nới lỏng, một luật bị tắt, hoặc một tệp ngoại lệ không có trong bảng. Kiểm tra đọc trạng thái cây, không đọc lịch sử; không có phê duyệt nào cho nới lỏng đi qua, kể cả của chủ."
  causes_vi:
    - "Một lane thêm chú thích tắt luật, bỏ qua test hoặc nuốt lỗi để workflow chạy qua"
    - "Một mục ignore, exclude hoặc ngưỡng độ phủ bị sửa tay thay vì sinh từ canon"
    - "Một tệp allowlist, approval hoặc baseline được thêm mà bảng design-truths không liệt kê"
  nextStep_vi: "Sửa nguyên nhân để kiểm tra được thỏa rồi xoá phần nới lỏng; một ngoại lệ có thật chỉ vào được knowledge/hfs/design-truths.yaml bằng quyết định của chủ."
  owner: owner
  kind: check-finding

RT_SECRET_TRACKED:
  title: "A secret is tracked in the public runtime repository"
  title_vi: "Một bí mật được theo dõi trong repository runtime công khai"
  meaning_vi: "Một tệp *.enc hoặc secret.env/.env được git theo dõi trong repository runtime, vốn là public và không giữ vật liệu bí mật nào, kể cả bản mã hóa. Mọi bí mật của máy chủ nằm trong .claude/secret.env chưa theo dõi, chỉ đọc qua engine/secrets.mjs; các tên được liệt kê trong secret.env.example."
  causes_vi:
    - "Một bí mật mới được niêm phong và commit thay vì thêm tên vào secret.env"
    - "Tệp bí mật bị gitignore sót nên bị git add"
  nextStep_vi: "git rm tệp, thêm tên biến vào secret.env.example và danh mục env, owner đặt giá trị vào secret.env; bản mã hóa đã nằm trong lịch sử git chỉ mất khi xoay (rotate) bí mật."
  owner: owner
  kind: check-finding

SCAN_SMELL:
  title: "Code carries a smell SonarCloud measures"
  title_vi: "Mã mang một mùi mã mà SonarCloud đo"
  meaning_vi: "Tệp `<file>` có một đoạn mã mà SonarCloud sẽ báo thành code smell: `await` trong vòng lặp, `charCodeAt`, chuỗi chỉ thoát dấu gạch chéo ngược, biểu thức điều kiện lồng nhau, `void` trên giá trị không phải lời gọi, import không dùng, import chỉ để chuyển tiếp, prop khai báo mà component không đọc, API đã deprecated, đối tượng bị ép thành chuỗi hoặc hàm `async` không `await`; luật bắt ở máy trước khi bản quét đến."
  causes_vi:
    - "Vi phạm luật R235: một vòng lặp `await` từng bước mà không gọi tên thứ tự"
    - "Import còn sót sau khi mã dùng nó đã bị xóa"
    - "Vi phạm luật R235: tệp chứa ký tự U+2028, U+2029 hoặc U+0085 thô (thay bằng dạng thoát hoặc xóa), làm bộ quét Sonar dừng với `Line n is out of range`"
    - "Dùng API next-intl `requestLocale` hay `setRequestLocale` đã bị thay bằng `next/root-params`"
  nextStep_vi: "Sửa đúng dòng được chỉ: chạy các bước độc lập bằng `Promise.all`, gọi tên thứ tự bằng `eachInOrder` của `platform/primitives`, bỏ import thừa, viết lại biểu thức lồng thành câu lệnh riêng, đọc locale qua `next/root-params`, trả `Promise.resolve(...)` thay vì `async` không `await`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

SEALED_CUSTODY_LOCATION:
  title: "Sealed secret path is not under the app root .starcistacks"
  title_vi: "Đường dẫn bí mật đã mã hoá không nằm dưới .starcistacks"
  meaning_vi: "Trường custody.sealed của bản ghi danh tính hoặc tài nguyên không trỏ tới .starcistacks/<môi-trường>/secrets/<slug>.enc ở gốc app, nơi duy nhất được phép giữ bí mật đã mã hoá; dạng nằm dưới một phía (be/.starcistacks/...) cũng bị từ chối."
  causes_vi:
    - "Đường dẫn trỏ vào .starciwork, ví dụ .starciwork/_resources/identities/<id>/secrets.enc.yaml"
    - "Đường dẫn dùng thư mục con hoặc đuôi khác thay vì <slug>.enc"
    - "Ghi 'none' hoặc để trống thay vì nêu đường dẫn sẽ được mã hoá"
  nextStep_vi: "Đây là lỗi bị từ chối; op work.author hoặc op uat.verify sửa custody.sealed thành .starcistacks/<môi-trường>/secrets/<slug>.enc và chuyển tệp mã hoá (nếu có) tới đó bằng git mv, không đọc nội dung."
  owner: other-op:work.author
  kind: check-finding

SEALED_FILE_IN_WORK:
  title: "Sealed secret file kept inside .starciwork"
  title_vi: "Tệp bí mật đã mã hoá nằm trong .starciwork"
  meaning_vi: "Cây Work chứa một tệp mã hoá (.enc); cây Work chỉ được giữ bản ghi danh tính hoặc tài nguyên, còn tệp bí mật phải nằm ở .starcistacks/<môi-trường>/secrets/<slug>.enc."
  causes_vi:
    - "Tệp secrets.enc.yaml được đặt cạnh resource.yaml của danh tính"
    - "Tệp mã hoá được sao vào cây Work để tiện đọc"
  nextStep_vi: "Đây là lỗi bị từ chối; op work.author hoặc op uat.verify chuyển tệp bằng git mv tới .starcistacks/<môi-trường>/secrets/<slug>.enc và trỏ custody.sealed vào đó, không đọc hay in nội dung."
  owner: other-op:work.author
  kind: check-finding

# --- HFS rule catalog (knowledge/hfs/rules.yaml): one code per rule, from R01 up ---

STACKS_LOCAL_CONFIG_INVALID:
  title: "The dev environment declaration of an app (local block, runnable dev environment, base port layout) is not coherent"
  title_vi: "Khai báo môi trường dev của ứng dụng (khối local, môi trường dev chạy được, bố cục cổng theo cổng gốc) không nhất quán"
  meaning_vi: "Môi trường docker-compose của ứng dụng không khai báo đúng: environments.<env>.local thiếu hoặc có trường lạ, cổng trùng, dịch vụ không có trong tệp compose, vai trò cơ sở dữ liệu dùng chung, hoặc thăm dò không nằm trên loopback; ứng dụng không có environment nào chạy docker-compose với khối local nên starci app stack up --env dev không có gì để chạy; hoặc khi đã khai báo basePort, cổng của một tiến trình native hay của một dịch vụ compose có vai trò (db = basePort + 90, mail + 91, mailui + 92, storage + 93, storage-console + 94) lệch khỏi bảng vai trò của PROJECT-STACKS-10, hay một tệp compose publish cổng host bằng số cố định thay vì \"127.0.0.1:${STACK_PORT_<NAME>}:<cổng container>\". Thông báo của finding nêu đường dẫn khóa, điều được mong đợi và điều tìm thấy."
  causes_vi:
    - "Vi phạm R372: khối local được kiểm bằng đúng normalizeLocal mà các động từ starci app stack up, down, doctor dùng; môi trường dev vẫn là Swarm hoặc chưa được khai báo."
    - "Vi phạm R389: cổng được đặt tay hoặc viết thẳng vào tệp compose thay vì suy ra từ cổng gốc, nên hai ứng dụng trên một máy có thể trùng cổng; ứng dụng được tạo trước khi bảng vai trò có phần compose; tên tiến trình không thuộc đúng vai trò nên bị xếp vào nhóm còn lại."
  nextStep_vi: "Sửa đúng trường nêu trong thông báo: đường dẫn environments.<env>.local, khai báo environments.dev với runtime docker-compose, composeFiles và khối local, đặt lại cổng trong environments.<env>.local.ports theo bảng vai trò của basePort và đổi dòng ports của dịch vụ compose thành \"127.0.0.1:${STACK_PORT_<NAME>}:<cổng container>\" (hoặc chạy starci app sync --execute để dời db, mail, mailui về cổng suy ra), rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

HFS_SCAFFOLD_BASE_PORT_TAKEN:
  title: "The scaffold's named base port overlaps another project of the machine"
  title_vi: "Cổng gốc đặt cho scaffold trùng dải cổng của một dự án khác trên máy"
  meaning_vi: "starci app scaffold --base-port <n> đã bị từ chối: dải n..n+99 trùng dải trăm cổng (hoặc các cổng đã khai báo) của một dự án đã đăng ký trên máy, hay trùng dải 3900..3999 dành cho bản xem trước UI. Mỗi dự án sở hữu một trăm cổng riêng. Thông báo liệt kê mọi dự án đã so sánh và cổng gốc trống kế tiếp."
  causes_vi:
    - "Vi phạm R389: cổng gốc chọn tay rơi vào dải của dự án khác."
  nextStep_vi: "Chạy lại starci app scaffold với --base-port bằng cổng gốc trống mà thông báo đề xuất, hoặc bỏ --base-port để scaffold tự chọn trăm cổng trống kế tiếp."
  owner: supervisor
  kind: verb-refusal

STACK_LOCAL_BASE_PORT_TAKEN:
  title: "stack up refused: the environment's base port range overlaps another project of the machine"
  title_vi: "stack up bị từ chối: dải cổng gốc của môi trường trùng một dự án khác trên máy"
  meaning_vi: "starci app stack up --env <env> (chạy thử lẫn --execute) không khởi động gì khi dải local.basePort..basePort+99 trùng dải trăm cổng (hoặc các cổng đã khai báo) của một dự án đã đăng ký trên máy: hai stack sẽ giành cùng cổng, lần up thứ hai hỏng giữa chừng hoặc probe trả lời bằng tiến trình của dự án kia. Thông báo nêu dự án trùng, mọi dự án đã so sánh và cổng gốc trống kế tiếp."
  causes_vi:
    - "Vi phạm R389: hai dự án trên cùng máy khai cùng một trăm cổng."
  nextStep_vi: "Đổi environments.<env>.local.basePort sang cổng gốc trống mà thông báo đề xuất (và các cổng suy ra từ nó, starci app sync --execute dời cổng compose), rồi chạy lại stack up."
  owner: supervisor
  kind: verb-refusal

STACK_BASE_PORT_OVERLAP:
  title: "The dev environment's base port range overlaps another project of the machine"
  title_vi: "Dải cổng gốc của môi trường dev trùng một dự án khác trên máy"
  meaning_vi: "starci app check --env local so dải local.basePort..basePort+99 của mỗi môi trường dev với các dự án đã đăng ký trên máy (cùng cách stack doctor đọc) và cảnh báo khi trùng, nêu dự án trùng và cổng gốc trống kế tiếp. Chỉ báo, không chặn: cây mã có thể đúng luật và dự án nào dời cũng được, CI không có sổ đăng ký máy (--env prod không hỏi), còn stack up là nơi chặn."
  causes_vi:
    - "Hai dự án trên cùng máy khai cùng một trăm cổng (R389)."
  nextStep_vi: "Đổi environments.<env>.local.basePort của một trong hai dự án sang cổng gốc trống được đề xuất, rồi chạy lại starci app check."
  owner: supervisor
  kind: check-finding

STACKS_BASE_PORT_UNDECLARED:
  title: "A dev environment with native processes declares no project base port"
  title_vi: "Môi trường dev có tiến trình native nhưng chưa khai báo cổng gốc dự án"
  meaning_vi: "environments.<env>.local có tiến trình native dùng cổng nhưng không có basePort, nên cổng dev của ứng dụng không suy ra từ một cổng gốc và có thể trùng ứng dụng khác trên cùng máy. Đây là cảnh báo, không phải lỗi."
  causes_vi:
    - "Ứng dụng có trước quy ước cổng gốc (R389) và vẫn liệt kê cổng bằng tay."
  nextStep_vi: "Khai báo environments.<env>.local.basePort (một số nguyên, dự án sở hữu basePort đến basePort + 99) và xếp các cổng tiến trình theo bảng vai trò trong PROJECT-STACKS-10; starci app stack doctor --env <env> báo khi dải cổng trùng ứng dụng khác trên máy."
  owner: op-retry
  kind: check-finding

STACKS_DEPLOY_CONFIG_INVALID:
  title: "A deploy block of application-stacks.yaml is not coherent"
  title_vi: "Khối deploy trong application-stacks.yaml không nhất quán"
  meaning_vi: "environments.<env>.deploy có trường lạ, tên hoặc mẫu sai, tệp cấu hình không tồn tại, dịch vụ không có trong stack, thành viên sealed không có tệp .enc, mục verify sai dạng, tên config trùng hoặc ảnh backup chưa ghim digest thật."
  causes_vi:
    - "Vi phạm R294: khối deploy được kiểm bằng đúng normalizeDeploy mà các động từ starci app stack dùng, nên động từ sẽ từ chối cùng lỗi đó."
    - "Tệp, dịch vụ hoặc thành viên sealed được đổi tên hay xóa mà khối deploy chưa cập nhật."
  nextStep_vi: "Sửa đúng trường nêu trong thông báo (environments.<env>.<đường dẫn>), rồi chạy lại starci app check; mỗi vấn đề là một phát hiện riêng."
  owner: op-retry
  kind: check-finding

STACKS_INGRESS_INVALID:
  title: "The ingress, DNS or TLS declaration of a Swarm environment is incomplete or inconsistent"
  title_vi: "Khai báo ingress, DNS hoặc TLS của môi trường Swarm thiếu hoặc không nhất quán"
  meaning_vi: "Môi trường Swarm không có đúng một ingress được khai báo và định tuyến: thiếu ingress.component hoặc ingress.hosts (hay khối external, shared-edge hợp lệ), component ingress không tồn tại hoặc không dùng image Traefik/Caddy ghim bằng digest, có ingress thứ hai hoặc ingress tự render bên cạnh ingress ngoài; hoặc một host công khai thiếu bản ghi dns (host, owner, receipt), thiếu tls.owner và tls.receipt, hoặc không có tuyến trong mô hình ingress (một host viết tay trong stack file của shared edge cũng tính). Thông báo của finding nêu đường dẫn khóa và điều còn thiếu."
  causes_vi:
    - "Vi phạm R275 và R266: mô hình có thể chạy proxy nhưng khai báo không nêu ingress mà môi trường thực sự chọn, hai ingress tạo hai chủ sở hữu định tuyến và cổng công khai, danh sách host và tuyến thực tế không khớp, và điều kiện DNS hoặc TLS chỉ tồn tại ngoài kho mã."
  nextStep_vi: "Làm theo đường dẫn trong thông báo: khai báo đúng một ingress (component role ingress với Traefik hoặc Caddy ghim digest, hoặc ingress.external, hoặc shared-edge với routes), thêm tuyến cho từng host đã khai báo, thêm bản ghi dns cho từng host cùng tls.owner và tls.receipt; việc đổi DNS vẫn do chủ sở hữu thực hiện."
  owner: op-retry
  kind: check-finding

STACKS_LITE_SELFHOSTED_DB:
  title: "A lite deployment runs PostgreSQL, MongoDB, Qdrant or undeclared Redis"
  title_vi: "Triển khai lite chạy PostgreSQL, MongoDB, Qdrant hoặc Redis chưa khai báo"
  meaning_vi: "Tập component hoặc mô hình triển khai của lite chứa image PostgreSQL, MongoDB hoặc Qdrant, dù có khai báo, hoặc chứa Redis chưa khai trong sides.be.backing. Lite dùng Supabase được quản lý và pgvector cho vector; full giữ Qdrant khi được khai báo."
  causes_vi:
    - "Vi phạm R276: topology lite thêm máy chủ dữ liệu mà chuẩn dành cho Supabase được quản lý."
    - "Stack lite chạy Qdrant, hoặc chạy Redis khi chưa khai dịch vụ cho năng lực cần nó."
  nextStep_vi: "Gỡ image Postgres, Mongo hoặc Qdrant; dùng Supabase pgvector cho vector và SQLite trên volume được khai báo cho sidecar. Với Redis, khai redis trong sides.be.backing cho năng lực cần nó hoặc gỡ dịch vụ khỏi stack."
  owner: op-retry
  kind: check-finding
  cutoverTolerant: true

STACKS_MODEL_UNAVAILABLE:
  title: "The tracked rendered deployment model cannot be checked"
  title_vi: "Không kiểm tra được mô hình triển khai đã render được theo dõi"
  meaning_vi: "Mô hình triển khai được chọn bị thiếu, không được theo dõi, không đọc được hoặc không có cấu trúc dịch vụ hợp lệ."
  causes_vi:
    - "Vi phạm R267: checker không có mô hình thực tế để xét topology và không được bỏ qua kiểm tra vì thiếu đầu vào."
  nextStep_vi: "Theo dõi mô hình đã render dưới cây Swarm của môi trường, khai báo renderedModel hoặc composeFiles đúng và chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

STACKS_SERVICE_POLICY_MISSING:
  title: "A Swarm service lacks a required runtime policy (placement, healthcheck or update policy)"
  title_vi: "Dịch vụ Swarm thiếu chính sách chạy bắt buộc (vị trí chạy, healthcheck hoặc chính sách cập nhật)"
  meaning_vi: "Mô hình Swarm đã render của một dịch vụ thiếu một trong ba chính sách bắt buộc: deploy.placement.constraints cho dịch vụ có trạng thái hoặc volume bền vững; healthcheck thật sự kiểm tra được dịch vụ chạy liên tục; deploy.update_config (order, failure_action rollback, monitor dương), rollback_config và restart_policy. Thông báo của finding nêu đường dẫn khóa và chính sách còn thiếu."
  causes_vi:
    - "Vi phạm R266: task có thể chuyển sang node không giữ volume và mất quyền truy cập dữ liệu (placement); trạng thái container chạy chưa chứng minh được sức khỏe cần để cập nhật và phục hồi (healthcheck); triển khai dựa vào mặc định thay vì nêu cách cập nhật, xử lý lỗi và phục hồi (chính sách cập nhật)."
  nextStep_vi: "Làm theo đường dẫn trong thông báo: thêm ràng buộc placement phù hợp chủ sở hữu volume, healthcheck có lệnh thực sự kiểm tra dịch vụ, hoặc update_config, rollback_config và restart_policy của dịch vụ, rồi render lại mô hình."
  owner: op-retry
  kind: check-finding

STACKS_PORT_PUBLISHED:
  title: "A service outside the declared ingress publishes a port"
  title_vi: "Dịch vụ ngoài ingress được khai báo mở cổng công khai"
  meaning_vi: "Mô hình Swarm công bố cổng của dịch vụ không phải ingress duy nhất được môi trường chọn."
  causes_vi:
    - "Vi phạm R266: API, worker hoặc dịch vụ dữ liệu có cửa truy cập trực tiếp vượt qua ingress đã khai báo."
  nextStep_vi: "Gỡ ports khỏi dịch vụ nội bộ và định tuyến lưu lượng công khai qua ingress được môi trường khai báo."
  owner: op-retry
  kind: check-finding

STACKS_RELEASE_UNDECLARED:
  title: "A Swarm environment has no complete release declaration"
  title_vi: "Môi trường Swarm thiếu khai báo release đầy đủ"
  meaning_vi: "Môi trường chưa khai báo imagesLock, pointer, previous hoặc danh sách healthAssertions không rỗng."
  causes_vi:
    - "Vi phạm R267: kho mã chưa gắn image bất biến, release đang chạy, release trước và điều kiện xác nhận triển khai."
  nextStep_vi: "Bổ sung release với khóa image, con trỏ hiện tại và trước đó cùng healthAssertions; chỉ đổi con trỏ hiện tại sau khi xác minh thành công."
  owner: op-retry
  kind: check-finding

STACKS_SEALED_MEMBER_PENDING:
  title: "A grant waits for a sealed member that is not sealed yet (report only)"
  title_vi: "Một quyền cấp khoá đang chờ member sealed chưa được niêm phong (chỉ báo)"
  meaning_vi: "Một nguồn của deploy.secrets.grants khai báo rõ required: false, hoặc một opt-in environments.<env>.services không đặt required: true, trỏ tới member mà môi trường chưa có tệp .starcistacks/<env>/secrets/<member>.enc.yaml. Bản render bỏ nguồn đó: service chạy không có khoá cho tới khi khoá được niêm phong. Đây là cảnh báo, không chặn; nguồn không khai báo required vẫn bị từ chối bằng STACKS_DEPLOY_CONFIG_INVALID."
  causes_vi:
    - "Khai báo member và quyền cấp được đưa vào trước khi chủ dự án niêm phong khoá (ví dụ khoá của dịch vụ dùng chung embeddings)"
  nextStep_vi: "Niêm phong khoá: starci vps service grant <id> --service <tên> --app . --env <env> --execute (khoá của dịch vụ dùng chung) hoặc starci app secret set --env <env> <member> <KEY>; bản render sau sẽ cấp khoá cho service."
  owner: op-retry
  kind: check-finding

STACKS_SECRET_ENV_LITERAL:
  title: "A rendered service puts a secret literal in its environment"
  title_vi: "Dịch vụ đã render đưa bí mật trực tiếp vào biến môi trường"
  meaning_vi: "Mô hình triển khai truyền giá trị bí mật qua environment thay vì tham chiếu tệp secret được cấp cho dịch vụ."
  causes_vi:
    - "Vi phạm R266: giá trị bí mật có thể xuất hiện trong cấu hình đã render, thông tin dịch vụ hoặc bản ghi vận hành."
  nextStep_vi: "Bỏ giá trị trực tiếp và dùng adapter đọc tệp secret của consumer; cấp secret bên ngoài cho đúng dịch vụ mà không in giá trị."
  owner: op-retry
  kind: check-finding

STACKS_SECRET_NOT_EXTERNAL:
  title: "A Swarm secret is not an external engine secret"
  title_vi: "Bí mật Swarm chưa dùng secret bên ngoài của engine"
  meaning_vi: "Mô hình Swarm chứa secret không có external: true, dùng file hoặc giá trị trực tiếp, hoặc không có secret tương ứng với khai báo của môi trường."
  causes_vi:
    - "Vi phạm R266: mô hình triển khai giữ bí mật trong tệp mount hoặc nội dung stack thay vì cấp secret của engine cho đúng dịch vụ."
  nextStep_vi: "Khai báo secret bên ngoài trong mô hình Swarm, tạo nó qua stdin riêng tư và cấp quyền cho đúng dịch vụ; chỉ theo dõi bản mã hóa trong kho mã."
  owner: op-retry
  kind: check-finding

STACKS_SECRET_UNVERSIONED:
  title: "A Swarm secret has no matching immutable version"
  title_vi: "Bí mật Swarm thiếu phiên bản bất biến khớp khai báo"
  meaning_vi: "Secret thiếu runtimeName hoặc version dương, tên không kết thúc bằng -v<version>, hoặc tên secret đã render khác với tên được khai báo."
  causes_vi:
    - "Vi phạm R266: tên secret có thể bị tái sử dụng khi xoay khóa hoặc khai báo không khớp secret của engine."
  nextStep_vi: "Khai báo runtimeName và version dương khớp hậu tố -v<version>; dùng đúng tên đó trong mô hình, đổi quyền của consumer rồi mới thu hồi phiên bản cũ."
  owner: op-retry
  kind: check-finding

STACK_DEPLOY_DB_FOREIGN_CHAIN:
  title: "The stack database carries a migration history the app's chain does not explain"
  title_vi: "Cơ sở dữ liệu của stack mang lịch sử migration mà chuỗi của ứng dụng không giải thích được"
  meaning_vi: "Bản xem trước migration của lần triển khai thấy các phiên bản đã ghi trong cơ sở dữ liệu nằm ngoài baseline, các migration tiếp theo và các migration giữ lại của ứng dụng, nên lần triển khai bị từ chối trước khi sao lưu, migrate hay triển khai."
  causes_vi:
    - "Ứng dụng đã đặt lại chuỗi migration (hfs.json db.baselineReset) trong khi cơ sở dữ liệu vẫn giữ chuỗi cũ."
    - "Cơ sở dữ liệu thuộc về một chuỗi migration khác."
  nextStep_vi: "Khi chủ sở hữu xác nhận cơ sở dữ liệu không còn dữ liệu cần giữ, ứng dụng tự làm rỗng cơ sở dữ liệu bằng thao tác đặt lại của chính nó; lần triển khai sau sẽ chạy first start."
  owner: owner
  kind: verb-refusal

STACK_FIRST_START_APP_ROLE:
  title: "The first start could not give the app role its sealed password"
  title_vi: "First start không đặt được mật khẩu niêm phong cho vai trò ứng dụng"
  meaning_vi: "Sau khi migrate, first start đặt mật khẩu cho vai trò ứng dụng từ giá trị niêm phong mà khối database.appPassword chỉ ra; giá trị không mở được, không đúng dạng mật khẩu an toàn, hoặc lệnh psql trong container thất bại. Mật khẩu luôn được che trong thông báo."
  causes_vi:
    - "Thành viên niêm phong hoặc khóa được khai báo không có giá trị, hoặc không mở được bằng khóa age."
    - "Giá trị ngắn hơn 8 ký tự hoặc chứa ký tự ngoài chữ, số, gạch ngang và gạch dưới."
    - "Các migration chưa tạo vai trò ứng dụng."
  nextStep_vi: "Niêm phong lại giá trị bằng starci app secret set (dạng mật khẩu được sinh), kiểm tra vai trò hfs.json db.appRole do migration tạo, rồi triển khai lại."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_UNDECLARED:
  title: "deploy --adopt without a declared renamedFrom"
  title_vi: "deploy --adopt khi chưa khai báo renamedFrom"
  meaning_vi: "Lệnh triển khai được gọi với --adopt nhưng khối deploy của môi trường không khai báo renamedFrom, nên không biết dữ liệu được nhận từ stack nào."
  causes_vi:
    - "Thiếu khối deploy.renamedFrom (stack cũ, releasesBase, bảng volume mới sang cũ) trong application-stacks.yaml."
  nextStep_vi: "Khai báo environments.<env>.deploy.renamedFrom theo PROJECT-STACKS-18 rồi chạy lại; nếu đây không phải lần đổi tên stack thì bỏ --adopt."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_ALREADY_ACCEPTED:
  title: "The stack already has an accepted release, so it cannot adopt"
  title_vi: "Stack đã có bản phát hành được chấp nhận nên không nhận dữ liệu được nữa"
  meaning_vi: "Chỉ bản phát hành đầu tiên của stack mới được nhận dữ liệu của stack cũ; stack này đã có con trỏ current."
  causes_vi:
    - "Lần --adopt trước đã thành công, hoặc stack mới đã được triển khai bằng first start."
  nextStep_vi: "Triển khai lại không kèm --adopt."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_VOLUME_MISSING:
  title: "A new volume of renamedFrom does not exist"
  title_vi: "Một volume mới trong renamedFrom chưa tồn tại"
  meaning_vi: "Trước khi nhận dữ liệu, mọi volume mới trong bảng renamedFrom.volumes phải có trên manager và đã được chép dữ liệu."
  causes_vi:
    - "Chưa chạy stack prepare --execute để tạo volume mới."
    - "Chưa chạy stack volume copy."
  nextStep_vi: "Chạy starci app stack prepare --env <env> --execute, rồi starci app stack volume copy --env <env> --execute, rồi triển khai lại với --adopt."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_VOLUME_EMPTY:
  title: "A new volume of renamedFrom is empty"
  title_vi: "Một volume mới trong renamedFrom còn trống"
  meaning_vi: "Volume mới tồn tại nhưng không chứa gì, tức dữ liệu của stack cũ chưa được chép sang."
  causes_vi:
    - "Bỏ qua bước stack volume copy."
  nextStep_vi: "Chạy starci app stack volume copy --env <env> --execute rồi triển khai lại với --adopt."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_SOURCE_RUNNING:
  title: "The old stack still runs while the new one adopts its data"
  title_vi: "Stack cũ vẫn chạy khi stack mới nhận dữ liệu"
  meaning_vi: "Stack cũ còn task đang chạy, nên nó vẫn có thể ghi dữ liệu hoặc giữ route trên cùng host với stack mới."
  causes_vi:
    - "Chưa chạy stack standby --renamed-from cho stack cũ."
  nextStep_vi: "Chạy starci app stack standby --env <env> --renamed-from --execute, chép volume, rồi triển khai lại với --adopt."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_SOURCE_UNREADABLE:
  title: "The old stack's release store cannot be read"
  title_vi: "Không đọc được kho bản phát hành của stack cũ"
  meaning_vi: "Lệnh triển khai cần đọc releasesBase của stack cũ để biết bản phát hành cuối và bản ghi standby của nó, nhưng lệnh từ xa thất bại."
  causes_vi:
    - "renamedFrom.releasesBase sai đường dẫn."
    - "Người dùng triển khai không có quyền đọc thư mục đó."
  nextStep_vi: "Kiểm tra renamedFrom.releasesBase và quyền thư mục trên manager (stack prepare --env <env> in ra cả hai phía), rồi chạy lại."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_SOURCE_NO_RELEASE:
  title: "The old stack has no accepted release to roll back to"
  title_vi: "Stack cũ không có bản phát hành được chấp nhận để quay lại"
  meaning_vi: "Bản phát hành cuối của stack cũ là đích quay lại của bản phát hành nhận dữ liệu; kho của stack cũ không có con trỏ current."
  causes_vi:
    - "renamedFrom.releasesBase trỏ sai chỗ."
    - "Stack cũ chưa từng được triển khai bằng starci app stack deploy."
  nextStep_vi: "Sửa renamedFrom.releasesBase cho đúng kho của stack cũ; nếu stack cũ không có bản phát hành nào thì chủ sở hữu quyết định cách chuyển khác."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_SOURCE_NOT_STANDBY:
  title: "The old stack's journal holds no standby"
  title_vi: "Nhật ký của stack cũ không có bản ghi standby"
  meaning_vi: "Việc quay lại sau khi nhận dữ liệu khôi phục stack cũ từ bản ghi standby của nó; nhật ký không có standby nào sau lần resume cuối."
  causes_vi:
    - "Stack cũ được dừng bằng tay thay vì bằng stack standby."
    - "Stack cũ đã được resume sau standby."
  nextStep_vi: "Chạy starci app stack standby --env <env> --renamed-from --execute rồi triển khai lại với --adopt."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_NO_DATABASE:
  title: "The adopted database did not accept connections"
  title_vi: "Cơ sở dữ liệu được nhận không nhận kết nối"
  meaning_vi: "Sau lần triển khai giữ chỉ còn cơ sở dữ liệu chạy trên volume đã chép, không container nào của dịch vụ cơ sở dữ liệu nhận kết nối trong thời gian chờ; stack mới được đưa về standby và stack cũ được resume."
  causes_vi:
    - "Dữ liệu chép sang hỏng hoặc sai chủ sở hữu, nên Postgres không khởi động."
    - "Image cơ sở dữ liệu khác phiên bản với dữ liệu của stack cũ."
  nextStep_vi: "Xem log dịch vụ cơ sở dữ liệu của stack mới, so sánh bằng stack volume verify, sửa nguyên nhân rồi chép lại vào volume trống."
  owner: owner
  kind: verb-refusal

STACK_ADOPT_NO_HISTORY:
  title: "The adopted database carries no migration history"
  title_vi: "Cơ sở dữ liệu được nhận không có lịch sử migration"
  meaning_vi: "Volume cơ sở dữ liệu mới không mang lịch sử migration, tức đó không phải dữ liệu đã chép của stack cũ; stack mới được đưa về standby và stack cũ được resume."
  causes_vi:
    - "Chép nhầm volume, hoặc volume mới được khởi tạo bởi một first start."
  nextStep_vi: "Làm rỗng volume mới, chép lại đúng volume cơ sở dữ liệu cũ bằng stack volume copy, rồi triển khai lại với --adopt."
  owner: owner
  kind: verb-refusal

STACK_ROLLBACK_ADOPTED_DATA:
  title: "Rolling back an adopted release needs the owner's yes on the data"
  title_vi: "Quay lại bản phát hành nhận dữ liệu cần chủ sở hữu đồng ý về dữ liệu"
  meaning_vi: "Quay lại đưa stack mới về standby và resume stack cũ trên volume cũ của nó; mọi thứ đã ghi trên stack mới ở lại volume mới và stack cũ không thấy."
  causes_vi:
    - "Lệnh stack rollback được gọi cho bản phát hành nhận dữ liệu mà chưa có --data-acknowledged."
  nextStep_vi: "Khi chủ sở hữu đồng ý mất phần ghi mới (hoặc đã chép ngược theo runbook), chạy lại với --data-acknowledged."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_PAIRS_UNDECLARED:
  title: "stack volume has no pair to work on"
  title_vi: "stack volume không có cặp volume để xử lý"
  meaning_vi: "Lệnh không có --from và --to, và môi trường không khai báo renamedFrom.volumes."
  causes_vi:
    - "Quên --from/--to, hoặc chưa khai báo deploy.renamedFrom."
  nextStep_vi: "Truyền --from <volume> --to <volume>, hoặc khai báo deploy.renamedFrom.volumes."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_NO_IMAGE:
  title: "stack volume has no pinned helper image"
  title_vi: "stack volume không có image trợ giúp được ghim"
  meaning_vi: "Việc chép và đo volume chạy trong image sao lưu đã ghim digest của môi trường; môi trường không khai báo deploy.backup."
  causes_vi:
    - "Thiếu khối deploy.backup với image ghim digest."
  nextStep_vi: "Khai báo deploy.backup (image ghim bằng digest, volumes) rồi chạy lại."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_MISSING:
  title: "A volume of the copy does not exist"
  title_vi: "Một volume của lần chép không tồn tại"
  meaning_vi: "Volume nguồn hoặc volume đích không có trên manager, nên không chép gì."
  causes_vi:
    - "Tên volume sai."
    - "Volume đích chưa được stack prepare --execute tạo."
  nextStep_vi: "Kiểm tra tên trong renamedFrom.volumes hoặc --from/--to; tạo volume đích bằng starci app stack prepare --env <env> --execute."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_IN_USE:
  title: "A volume of the copy is mounted by a running task"
  title_vi: "Một volume của lần chép đang được task đang chạy gắn vào"
  meaning_vi: "Một container đang chạy, hoặc một dịch vụ còn task để chạy, gắn volume nguồn hoặc đích; chép nóng không đảm bảo nhất quán nên lệnh từ chối. Dịch vụ ở standby (0 replica) không tính."
  causes_vi:
    - "Stack cũ hoặc stack mới chưa được đưa về standby."
  nextStep_vi: "Chạy starci app stack standby --env <env> [--renamed-from] --execute cho stack đang gắn volume, rồi chạy lại."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_UNDECLARED:
  title: "The copy target is not a volume this environment declares"
  title_vi: "Volume đích không phải volume mà môi trường khai báo"
  meaning_vi: "Lệnh chỉ chép vào volume của chính môi trường (deploy.volumes hoặc deploy.backup.volumes), để không ghi đè volume của stack khác."
  causes_vi:
    - "--to trỏ tới volume của stack khác hoặc gõ sai tên."
  nextStep_vi: "Dùng volume mà môi trường khai báo làm --to."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_TARGET_NOT_EMPTY:
  title: "The copy target is not empty"
  title_vi: "Volume đích không trống"
  meaning_vi: "Lệnh chỉ chép vào volume trống, để bản chép không trộn với dữ liệu sẵn có."
  causes_vi:
    - "Một first start hoặc một lần chép trước đã ghi vào volume đích."
  nextStep_vi: "Khi chắc chắn không cần dữ liệu trong volume đích, xóa nó và tạo lại trống bằng starci app stack prepare --env <env> --execute, rồi chép lại."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_MEASURE:
  title: "A volume could not be measured"
  title_vi: "Không đo được volume"
  meaning_vi: "Container trợ giúp không in được số tệp, số byte và hai digest của volume."
  causes_vi:
    - "Image sao lưu không có sh, find, stat, sha256sum hoặc awk."
    - "Docker trên manager không chạy được container trợ giúp."
  nextStep_vi: "Kiểm tra image deploy.backup.image (một image có BusyBox hoặc GNU coreutils) và Docker trên manager, rồi chạy lại."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_COPY_FAILED:
  title: "The volume copy failed"
  title_vi: "Chép volume thất bại"
  meaning_vi: "Lệnh cp -a trong container trợ giúp lỗi; volume nguồn được gắn chỉ đọc nên không bị đổi, volume đích có thể đã có một phần."
  causes_vi:
    - "Đầy đĩa trên manager."
    - "Lỗi của Docker hoặc của image trợ giúp."
  nextStep_vi: "Sửa nguyên nhân, làm rỗng volume đích (xóa và tạo lại bằng stack prepare --execute), rồi chép lại."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_MISMATCH:
  title: "The two volumes do not hold the same tree"
  title_vi: "Hai volume không chứa cùng một cây dữ liệu"
  meaning_vi: "Số tệp, số byte, digest nội dung hoặc digest siêu dữ liệu (đường dẫn, chủ sở hữu, quyền, kích thước, đích của liên kết) của nguồn và đích khác nhau."
  causes_vi:
    - "Bản chép chưa xong hoặc bị lỗi."
    - "Có tiến trình ghi vào một trong hai volume."
  nextStep_vi: "Không dùng volume đích; làm rỗng nó, đảm bảo không gì gắn hai volume, rồi chép lại và kiểm bằng stack volume verify."
  owner: owner
  kind: verb-refusal

STACK_VOLUME_SOURCE_CHANGED:
  title: "The source volume changed while it was copied"
  title_vi: "Volume nguồn thay đổi trong lúc chép"
  meaning_vi: "Với --verify, số đo của nguồn trước khi chép khác số đo sau khi chép, tức có gì đó ghi vào nguồn trong lúc chép."
  causes_vi:
    - "Một container ngoài stack, hoặc một tiến trình trên host, ghi vào volume nguồn."
  nextStep_vi: "Tìm và dừng thứ đang ghi vào volume nguồn, làm rỗng volume đích rồi chép lại với --verify."
  owner: owner
  kind: verb-refusal

STACK_STANDBY_RENAMED_UNDECLARED:
  title: "--renamed-from without a declared renamedFrom"
  title_vi: "--renamed-from khi chưa khai báo renamedFrom"
  meaning_vi: "standby hoặc resume với --renamed-from tác động lên stack cũ trong deploy.renamedFrom, nhưng môi trường không khai báo khối đó."
  causes_vi:
    - "Thiếu deploy.renamedFrom, hoặc đã gỡ nó sau khi hết thời gian giữ."
  nextStep_vi: "Khai báo deploy.renamedFrom, hoặc bỏ --renamed-from để tác động lên stack của chính môi trường."
  owner: owner
  kind: verb-refusal

STACK_STANDBY_DOCKER:
  title: "The services of the stack could not be read"
  title_vi: "Không đọc được các dịch vụ của stack"
  meaning_vi: "docker service ls hoặc docker service inspect trên manager thất bại, nên standby hoặc resume không biết trạng thái dịch vụ."
  causes_vi:
    - "Không kết nối được Docker của manager."
  nextStep_vi: "Kiểm tra kết nối bằng starci app stack prepare --env <env> rồi chạy lại."
  owner: owner
  kind: verb-refusal

STACK_STANDBY_NO_SERVICES:
  title: "The stack has no service to stand by"
  title_vi: "Stack không có dịch vụ nào để standby"
  meaning_vi: "Trên swarm không có dịch vụ nào thuộc stack đó."
  causes_vi:
    - "Stack chưa được triển khai hoặc đã bị gỡ."
    - "Sai môi trường hoặc thiếu --renamed-from."
  nextStep_vi: "Kiểm tra --env và --renamed-from; không có gì để dừng."
  owner: owner
  kind: verb-refusal

STACK_STANDBY_ALREADY:
  title: "The stack is already in standby"
  title_vi: "Stack đã ở trạng thái standby"
  meaning_vi: "Mọi dịch vụ của stack đều đã dừng; một standby mới sẽ ghi lại số replica bằng 0 nên lệnh từ chối và giữ bản ghi standby trước."
  causes_vi:
    - "Đã chạy standby trước đó."
  nextStep_vi: "Không cần làm gì; starci app stack resume --env <env> [--renamed-from] --execute khôi phục từ bản ghi standby có sẵn."
  owner: owner
  kind: verb-refusal

STACK_RESUME_NO_STANDBY:
  title: "The journal holds no standby to resume from"
  title_vi: "Nhật ký không có bản ghi standby để resume"
  meaning_vi: "resume đọc bản ghi standby mới nhất của nhật ký triển khai; sau lần resume cuối không có standby nào."
  causes_vi:
    - "Stack đã được resume, hoặc được dừng bằng tay chứ không bằng stack standby."
  nextStep_vi: "Nếu stack đang dừng mà không có bản ghi, triển khai lại bản phát hành hiện tại bằng stack rollback --release <id> hoặc stack deploy."
  owner: owner
  kind: verb-refusal

STACK_TOOLING_REIMPLEMENTED:
  title: "An app re-implements deploy tooling the canon ships"
  title_vi: "Ứng dụng tự cài lại công cụ triển khai mà canon đã cung cấp"
  meaning_vi: "Một tệp triển khai gọi lệnh docker mà một động từ starci app stack đã đảm nhiệm, hoặc thư mục deploy chứa tệp mang tên một động từ như render, converge hay prepare."
  causes_vi:
    - "Vi phạm R293: kho mã giữ bản sao công cụ Swarm riêng (docker stack deploy, docker secret create, docker swarm init...) thay vì gọi động từ của canon."
    - "Một workflow hoặc script trong deploy/, scripts/ hay package.json gọi trực tiếp docker cho việc canon đã làm."
  nextStep_vi: "Xóa tệp hoặc lệnh đó và gọi động từ được nêu trong thông báo (starci app stack render, deploy, converge, verify, prune, rollback, prepare), đặt hằng số của ứng dụng vào khối deploy của application-stacks.yaml."
  owner: op-retry
  kind: check-finding

BE_ENTITY_SCHEMA_DRIFT:
  title: "A TypeORM entity column differs from the schema the migrations build"
  title_vi: "Cột entity TypeORM lệch với schema mà migration tạo ra"
  meaning_vi: "starci app db drift áp db/bootstrap.sql và mọi migration vào một cơ sở dữ liệu tạm, rồi so từng cột entity với schema đó: bảng hoặc cột không tồn tại, kiểu khác nhau sau khi chuẩn hóa theo tên của PostgreSQL, hoặc khả năng nhận NULL khác nhau."
  causes_vi:
    - "Vi phạm R333: entity được sửa mà không có migration tương ứng, hoặc migration đổi bảng mà entity chưa theo kịp."
    - "Entity khai báo sai kiểu (ví dụ timestamp thay vì timestamptz) hoặc quên nullable cho một cột cho phép NULL."
  nextStep_vi: "Viết migration mới trong db/migrations để schema có đúng cột đó, hoặc sửa entity cho khớp schema hiện tại, rồi chạy lại starci app db drift cho đến khi xanh."
  owner: op-retry
  kind: check-finding

BE_ENTITY_EXTENDS_BASE:
  title: "An entity repeats the columns every table shares instead of extending the base"
  title_vi: "Entity lặp lại các cột mọi bảng đều có thay vì kế thừa lớp nền"
  meaning_vi: "File `<path>` khai một lớp @Entity tự map cột created_at hoặc updated_at do cơ sở dữ liệu đặt (CreateDateColumn, UpdateDateColumn, hoặc Column với insert false, update false hay default) và có thể cả khóa uuid được sinh ra bên cạnh cả hai."
  causes_vi:
    - "Vi phạm R342 (BE-PERSISTENCE-3, phán quyết entity-base): các cột mọi bảng cùng có được kế thừa, không lặp lại trong từng entity."
    - "Entity được viết tay hoặc sao chép từ entity cũ trước khi có AbstractEntity và UuidAbstractEntity trong platform/database."
  nextStep_vi: "Xóa các thuộc tính đó và khai `extends UuidAbstractEntity` (có khóa uuid id) hoặc `extends AbstractEntity` (không có), import từ `@modules/platform/database`. Bảng có timestamp do ứng dụng đặt hoặc thiếu một trong hai cột thì không kế thừa gì và map cột đó bằng `@Column` thường."
  owner: op-retry
  kind: check-finding

BE_AUTH_PASSPORT_OWNER:
  title: "An identity library is imported outside integrations/passport"
  title_vi: "Thư viện định danh bị import ngoài integrations/passport"
  meaning_vi: "File `<path>` import @nestjs/passport, passport, passport-google-oauth20, passport-local, @nestjs/jwt, jose hoặc bcryptjs mà không thuộc `be.integrations.passport`, hoặc import bcrypt hay client Supabase."
  causes_vi:
    - "Vi phạm R328: chỉ integration passport sở hữu chiến lược Google, đăng nhập email/mật khẩu và token riêng của app."
  nextStep_vi: "Chuyển mã vào `src/modules/integrations/passport/` và gọi qua API công khai của integration; dùng bcryptjs thay bcrypt, bỏ client Supabase."
  owner: op-retry
  kind: check-finding

BE_AUTH_JWT_OWN_JWKS:
  title: "A lite principal is not built from the app own verified access token"
  title_vi: "Principal của app lite không đến từ access token riêng đã xác minh"
  meaning_vi: "`<path>` gọi jwtVerify ngoài integrations/passport, xác minh với createRemoteJWKSet thay vì key set riêng (createLocalJWKSet), thiếu issuer/audience/algorithms, decode token không xác minh hoặc đọc role/membership từ request body."
  causes_vi:
    - "Vi phạm R329: principal chỉ đến từ token do chính app ký và xác minh bằng JWKS riêng."
  nextStep_vi: "Dùng `createTokenKit` của integrations/passport (jwtVerify trên createLocalJWKSet, pin issuer/audience/algorithms) và để domain/identity dựng principal từ kết quả đó."
  owner: op-retry
  kind: check-finding

BE_AUTH_REFRESH_COOKIE:
  title: "A refresh token leaves the httpOnly cookie"
  title_vi: "Refresh token rời khỏi cookie httpOnly"
  meaning_vi: "`<path>` đặt cookie refresh thiếu httpOnly, secure, sameSite strict hoặc path của cửa refresh, hoặc đưa refresh token vào body của request/response."
  causes_vi:
    - "Vi phạm R330: refresh token chỉ sống trong cookie httpOnly Secure SameSite=Strict và được xoay vòng mỗi lần dùng."
  nextStep_vi: "Đặt và xoá cookie qua `setRefreshCookie`/`clearRefreshCookie` của integrations/passport; bỏ trường refreshToken khỏi DTO và kết quả trả về."
  owner: op-retry
  kind: check-finding

BE_STORAGE_OWNER:
  title: "An S3 SDK is imported outside integrations/object-storage"
  title_vi: "S3 SDK bị import ngoài integrations/object-storage"
  meaning_vi: "File `<path>` import @aws-sdk/client-s3 hoặc @aws-sdk/s3-request-presigner ngoài `be.integrations.object-storage`, hoặc import minio."
  causes_vi:
    - "Vi phạm R331: chỉ integration storage sở hữu client S3 (MinIO trong lite) và URL presigned."
  nextStep_vi: "Gọi port ObjectStorage của integrations/object-storage (presignPut, presignGet, remove); bỏ minio."
  owner: op-retry
  kind: check-finding

LITE_DB_MIGRATION:
  title: "A lite schema change lives outside db/migrations"
  title_vi: "Thay đổi schema của app lite nằm ngoài db/migrations"
  meaning_vi: "`<path>` là tệp của thư mục supabase/, một tệp SQL ngoài db/ (trừ mục sql của các cấp seed trong `.starcistacks/`), hoặc một tệp SQL trong db/ không phải migration, archive hay bootstrap."
  causes_vi:
    - "Vi phạm R332: schema của app lite chỉ nằm trong db/migrations/<ts14>_<kebab>.sql, archive và db/bootstrap.sql; dữ liệu seed nằm trong các cấp seed của `.starcistacks/` (R375)."
  nextStep_vi: "Chuyển migration sang db/migrations (giữ nguyên stamp), seed sang `.starcistacks/seeds/sql/` (`starci app codemod seeds-layout`), types sang db/types/; xoá supabase/."
  owner: op-retry
  kind: check-finding

BE_PERSISTENCE_NO_RAW_SQL:
  title: "Lite TypeScript runs or holds SQL text outside the test world"
  title_vi: "TypeScript của app lite chạy hoặc chứa văn bản SQL ngoài test world"
  meaning_vi: "File `<path>` gọi `.query(`, dùng template `sql`, là file `*.sql.ts`, import `sql`/`ident`/`SqlText`/`SqlIdent` ngoài src/tests/world (trừ bộ soạn câu lệnh của platform/database/database.client.ts và file có tên trong ruleParams.be.sqlPassThrough hay hfs.json sides.be.sqlPassThrough), gọi callDbFunction với một hàm không có trong ruleParams.be.dbFunctions hay hfs.json sides.be.dbFunctions, hoặc trong test world viết SQL thô cho điều entity hoặc hàm đã khai báo diễn đạt được (gọi hàm, ghi bảng ứng dụng)."
  causes_vi:
    - "Vi phạm R334: dữ liệu của app lite, kể cả spec, builder, fixture và test world, đi qua entity TypeORM trên EntityManager (find, save, update, upsert, createQueryBuilder); hàm database đi qua callDbFunction; SQL thô chỉ còn ở test world cho thăm dò (quyền, row-level security, catalog, cron, trigger, bảng pgmq, khóa/lỗi)."
  nextStep_vi: "Đọc/ghi bằng entity trên EntityManager hoặc createQueryBuilder với tham số có tên (trong test là world.db.<connection>); hàm database thì gọi qua callDbFunction với hàm đã khai kèm lý do; file chỉ chuyển tiếp văn bản SQL không phải của app thì khai trong hfs.json sides.be.sqlPassThrough kèm lý do; thăm dò chỉ test world mới được viết SQL thô."
  owner: op-retry
  kind: check-finding

BE_EVENT_BUS_LITE_SHAPE:
  title: "A lite event payload without dedupeKey, or a subscription that is not static"
  title_vi: "Payload event của bản lite thiếu dedupeKey, hoặc đăng ký consumer không tĩnh"
  meaning_vi: "File `<path>` khai một event (lớp kế thừa BaseEvent trong modules/events) mà kiểu payload không có `dedupeKey`, hoặc gọi `subscribe` với tên hàng đợi không phải hằng `*_TOPIC_QUEUE` import từ `@modules/platform/event-bus`, hay với options không phải object literal của giá trị literal."
  causes_vi:
    - "Vi phạm R336: event bus pgmq giao ít nhất một lần và không theo thứ tự, nên inbox của consumer claim (consumer, dedupeKey); thiếu dedupeKey thì không khử trùng được."
    - "Một đăng ký tính tên hàng đợi lúc chạy, nên không ai thấy được nó trong hằng và migration (R258)."
  nextStep_vi: "Thêm `readonly dedupeKey: string` (khoá nghiệp vụ, như id đơn hàng) vào kiểu payload hoặc kế thừa `EventPayload`; khai hằng `<TOPIC>_<CONSUMER>_TOPIC_QUEUE` trong platform/event-bus, tạo hàng đợi, hàng đợi `__dead` và bind_topic trong migration, rồi subscribe bằng hằng đó."
  owner: op-retry
  kind: check-finding

BE_JOBS_SCHEDULER_OWNER:
  title: "A schedule outside the platform/jobs tick scheduler"
  title_vi: "Lịch chạy định kỳ nằm ngoài bộ lập lịch tick của platform/jobs"
  meaning_vi: "File `<path>` import @nestjs/schedule hoặc cron ngoài job-tick.service.ts và jobs.module.ts của platform/jobs, dùng decorator Cron/Interval/Timeout, hoặc JobTickService không giữ advisoryXactLock và job_tick_claim trước khi ghi outbox."
  causes_vi:
    - "Vi phạm R335: việc định kỳ là tick của platform/jobs (JOB_TICKS), mỗi phút chỉ một replica enqueue nhờ khoá advisory và claim phút trong DB."
  nextStep_vi: "Khai tick vào JOB_TICKS của platform/jobs/job-ticks.contracts.ts (name, cron, timeZone UTC, queue, payload) và xoá lịch tự viết; giữ advisoryXactLock và job_tick_claim trong JobTickService."
  owner: op-retry
  kind: check-finding

STACKS_CODE_BIND_MOUNT:
  title: "A stack or compose file bind-mounts code into a service container"
  title_vi: "Tệp stack hoặc compose gắn (bind-mount) mã vào container của dịch vụ"
  meaning_vi: "Một dịch vụ gắn thư mục hoặc tệp mã, plugin, script hay đường dẫn ghi được của repository từ máy chủ vào container."
  causes_vi:
    - "Vi phạm R374: mã của dịch vụ phải nằm trong image dựng từ .starcistacks/images/<tên>/, không gắn lúc chạy."
  nextStep_vi: "Đưa mã vào Dockerfile của .starcistacks/images/<tên>/ (FROM image đã ghim digest, hoặc image fork của harness) và bỏ bind-mount; chỉ giữ volume dữ liệu, secret và tệp cấu hình thuần dữ liệu chỉ đọc."

STACKS_IMAGE_BASE_UNPINNED:
  title: "A service image folder has a FROM that is not digest-pinned"
  title_vi: "Thư mục image của dịch vụ có FROM chưa ghim digest"
  meaning_vi: "Dockerfile trong .starcistacks/images/<tên>/ dùng FROM theo tag, không theo name@sha256:..."
  causes_vi:
    - "Vi phạm R374: mọi image nền phải ghim digest."
  nextStep_vi: "Ghim FROM bằng name@sha256:<digest>."

STACKS_IMAGE_ENV_DIVERGES:
  title: "A service with an image folder runs a third-party image in an environment"
  title_vi: "Dịch vụ có thư mục image chạy image bên thứ ba ở một môi trường"
  meaning_vi: "Dev và production phải cùng chạy một image dựng từ .starcistacks/images/<tên>/."
  causes_vi:
    - "Vi phạm R374: một môi trường dùng image upstream hoặc image nước ngoài thay vì image dựng từ thư mục."
  nextStep_vi: "Dùng build.context trỏ tới thư mục image (compose) hoặc tham chiếu image của dự án (stack)."
  cutoverTolerant: true

HFS_EXT_INVALID:
  title: "A project's ext/ folder is refused, or one of its rules cannot judge"
  title_vi: "Thư mục ext/ của dự án bị từ chối, hoặc một luật của nó không chấm được"
  meaning_vi: "Dự án chỉ thêm luật riêng trong thư mục ext/ ở gốc app, khai trong ext/manifest.json (starci/project-ext@1): mỗi luật có id, mã finding, mức độ, doc, appliesTo và đúng một engine (hfs hoặc lint); mỗi project check là {id, run, why} với run là tệp ext/checks/<tên>.mjs. Extension chỉ thêm luật: không tắt, không ghi đè, không dùng lại mã của harness. Extension bị từ chối không góp luật nào và app check đỏ."
  causes_vi:
    - "Vi phạm R381: ext/manifest.json thiếu, không phải JSON hoặc không đúng starci/project-ext@1."
    - "Vi phạm R381: một luật thiếu id, code, severity, doc hoặc appliesTo, có khóa khác (off, overrides), hoặc dùng lại mã của harness hay của luật khác."
    - "Vi phạm R381: một file luật hay tệp check đã khai không tồn tại, hoặc một file trong ext/hfs, ext/lint không được luật nào khai."
    - "Vi phạm R381: một luật hfs ném lỗi hoặc trả finding không có path."
  nextStep_vi: "Sửa ext/manifest.json (hoặc thêm file còn thiếu) cho đủ trường và chỉ thêm luật, rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

HFS_EXT_API_MISMATCH:
  title: "A project's ext/ targets another extension API version than this hfs serves"
  title_vi: "ext/ của dự án nhắm phiên bản extension API khác với bản hfs đang chạy"
  meaning_vi: "ext/manifest.json khai api là phiên bản extension API mà thư mục nhắm tới. Một thay đổi phá vỡ của API tăng số này; manifest nhắm số khác bị từ chối cho tới khi ext/ của dự án được cập nhật, và trong lúc đó không luật nào của nó chạy."
  causes_vi:
    - "Vi phạm R381: hfs đã tăng extension API mà ext/ của dự án chưa cập nhật."
    - "Vi phạm R381: ext/ nhắm API mới hơn bản @starci/hfs đang cài."
  nextStep_vi: "Cập nhật ext/ của dự án theo mục Extension API trong README của @starci/hfs (hoặc cài bản hfs phục vụ API đó), rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

HFS_PACKAGE_SLOTS_INVALID:
  title: "The slots a project declares for a package cannot be read"
  title_vi: "Phần slot mà dự án khai cho một package không đọc được"
  meaning_vi: "ext/manifest.json khai slot của từng root package dưới packages[\"packages/<name>\"]: mỗi slot có id, path dưới src/, requires/allows là danh sách, coverage là measured hoặc { none: <lý do> }, lint là be hoặc fe."
  causes_vi:
    - "Vi phạm R382: khóa lạ, id trùng, path ngoài src/, coverage none không có lý do, hoặc lint không phải be/fe."
    - "Vi phạm R382: manifest nêu một thư mục không phải root package, hoặc package vừa có slots.yaml vừa được khai trong manifest."
  nextStep_vi: "Sửa phần packages của ext/manifest.json theo đúng khuôn rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

HFS_PACKAGE_SLOT_MISSING:
  title: "An instance of a package slot lacks a file its slot requires"
  title_vi: "Một instance của slot trong package thiếu file mà slot yêu cầu"
  meaning_vi: "Mỗi thư mục khớp một folder slot mà dự án khai cho package phải chứa mọi file trong requires của slot đó."
  causes_vi:
    - "Vi phạm R382: một block (hay instance khác) thiếu schema, renderer hoặc spec mà slot yêu cầu."
  nextStep_vi: "Thêm file còn thiếu vào instance, rồi chạy lại starci app check."
  owner: op-retry
  kind: check-finding

HFS_PACKAGE_SLOT_DISALLOWED:
  title: "An instance of a package slot holds a file its slot does not allow"
  title_vi: "Một instance của slot trong package chứa file mà slot không cho phép"
  meaning_vi: "Khi slot khai allows, mỗi file trong instance phải khớp requires hoặc allows."
  causes_vi:
    - "Vi phạm R382: một file nằm trong instance nhưng không khớp requires hay allows của slot."
  nextStep_vi: "Chuyển file vào slot đúng của nó, hoặc khai thêm vào allows nếu nó thật sự thuộc slot này."
  owner: op-retry
  kind: check-finding

HFS_PACKAGE_SLOT_UNPLACED:
  title: "A file of a package belongs to no slot the project declares for it"
  title_vi: "Một file của package không thuộc slot nào dự án khai cho nó"
  meaning_vi: "Một package được dự án khai slot (closed, mặc định) thì mọi file dưới src/ phải thuộc một slot đã khai."
  causes_vi:
    - "Vi phạm R382: file nằm ngoài mọi slot của manifest."
  nextStep_vi: "Đặt file vào slot đã khai, hoặc khai slot mới cho nó trong ext/manifest.json."
  owner: op-retry
  kind: check-finding

BE_REST_OPERATION_ID:
  title: "A REST operation has no stable operationId"
  title_vi: "Thao tác REST thiếu operationId ổn định"
  meaning_vi: "Trong contracts/<app>/openapi.json của app khai contract rest, mỗi thao tác phải có operationId tường minh dạng <vùng>.<hành động> (ví dụ orders.list) và không trùng; id mặc định Controller_method đổi theo tên lớp nên không phải hợp đồng."
  causes_vi:
    - "Vi phạm R396: phương thức controller thiếu @ApiOperation({ operationId })."
    - "Hai phương thức dùng cùng một operationId."
  nextStep_vi: "Thêm @ApiOperation({ operationId: \"<vùng>.<hành động>\" }) cho phương thức, chạy npm run contract:emit và commit openapi.json."
  owner: op-retry
  kind: check-finding

BE_REST_UNTYPED:
  title: "A REST body or answer has no named schema"
  title_vi: "Body hoặc kết quả REST không có schema có tên"
  meaning_vi: "Mọi body JSON và mọi kết quả 2xx (trừ 204) của app rest phải là một schema có tên trong components.schemas (một lớp DTO có @ApiProperty), để client sinh kiểu từ hợp đồng."
  causes_vi:
    - "Vi phạm R396: phương thức thiếu @ApiOkResponse({ type }) hoặc DTO không khai @ApiProperty."
  nextStep_vi: "Khai DTO có @ApiProperty và @ApiOkResponse({ type: <Dto> }) hoặc @ApiBody, chạy npm run contract:emit và commit."
  owner: op-retry
  kind: check-finding

BE_REST_ERROR_SHAPE:
  title: "A REST operation does not answer the one Error schema"
  title_vi: "Thao tác REST không trả schema Error chung"
  meaning_vi: "components.schemas.Error phải là object bắt buộc code và message, và mọi thao tác trả default bằng nó, để client đọc lỗi theo một hình duy nhất."
  causes_vi:
    - "Vi phạm R396: thiếu ErrorDto hoặc thiếu @ApiDefaultResponse({ type: ErrorDto })."
  nextStep_vi: "Khai ErrorDto (code, message bắt buộc) và @ApiDefaultResponse({ type: ErrorDto }) trên controller, chạy npm run contract:emit và commit."
  owner: op-retry
  kind: check-finding

BE_REST_SECURITY:
  title: "A REST operation states no security"
  title_vi: "Thao tác REST không khai bảo mật"
  meaning_vi: "Đầu tài liệu khai ít nhất một securityScheme và mọi thao tác nêu bảo mật của nó; thao tác công khai (security rỗng) phải có x-public-reason."
  causes_vi:
    - "Vi phạm R396: apps/<app>/src/openapi.ts không khai scheme, hoặc controller thiếu @ApiBearerAuth, hoặc route công khai thiếu lý do."
  nextStep_vi: "Thêm addBearerAuth() vào đầu tài liệu và @ApiBearerAuth() cho controller; route công khai thêm @ApiExtension(\"x-public-reason\", \"<lý do>\")."
  owner: op-retry
  kind: check-finding

BE_REST_APP_GRAPHQL:
  title: "A rest back end holds a GraphQL door"
  title_vi: "Back end rest còn cửa GraphQL"
  meaning_vi: "Khi mọi app api của be khai contract rest, cửa vào là controller (transport/http) mô tả bởi openapi.json; không còn resolver GraphQL hay platform graphql."
  causes_vi:
    - "Vi phạm R278: còn file transport/graphql hoặc src/modules/platform/graphql trong back end rest."
  nextStep_vi: "Chuyển thao tác sang controller REST và xoá phần GraphQL, hoặc khai lại contract graphql cho app api."
  owner: op-retry
  kind: check-finding
HFS_SIDE_FOLDER_MISSING:
  title: "A declared side tracks no file under its folder"
  title_vi: "Phía đã khai báo không có tệp nào trong thư mục của nó"
  meaning_vi: "hfs.json khai báo một phía (be, fe hoặc packages) dưới sides, nhưng không có tệp nào được git theo dõi trong thư mục be/, fe/ hoặc packages/ tương ứng."
  causes_vi:
    - "Vi phạm R399: phía khai báo và cây thư mục phải khớp nhau (PROJECT-1)."
    - "Thư mục của phía chưa được commit, hoặc phía đã bị xoá mà hfs.json vẫn khai báo."
  nextStep_vi: "Commit cây của phía đó, hoặc xoá khoá sides.<phía> khỏi hfs.json nếu dự án không có phía này."
  owner: op-retry
  kind: check-finding
HFS_SIDE_UNDECLARED:
  title: "A tracked side folder is not declared in hfs.json"
  title_vi: "Thư mục của một phía được theo dõi nhưng hfs.json không khai báo phía đó"
  meaning_vi: "Kho có tệp được git theo dõi trong be/, fe/ hoặc packages/, nhưng hfs.json không khai báo phía đó dưới sides; các kiểm tra của phía chỉ chạy khi nó được khai báo."
  causes_vi:
    - "Vi phạm R399: mọi phía của dự án được khai báo tường minh trong hfs.json (PROJECT-1)."
    - "Ứng dụng có thư mục packages/ từ trước khi phía packages được khai báo: thêm \"packages\": {} vào sides."
  nextStep_vi: "Khai báo phía trong hfs.json (\"packages\": {} cho packages/, hoặc be/fe với apps của nó), hoặc xoá thư mục nếu dự án không có phía này."
  owner: op-retry
  kind: check-finding
HFS_NIVOOS_PACKAGE_MISSING:
  title: "A declared nivoos package lacks its files"
  title_vi: "Gói nivoos đã khai báo thiếu tệp"
  meaning_vi: "hfs.json khai báo một gói nivoos dưới sides.nivoos.packages, nhưng package.json, tsconfig.json hoặc tệp entry của gói (mặc định src/<tên>.package.ts) không được git theo dõi trong packages/<tên>/."
  causes_vi:
    - "Vi phạm R436: gói nivoos được khai báo phải có thư mục packages/<tên>/ đầy đủ (PROJECT-BUSINESS-1)."
    - "Gói chưa được commit, đã đổi tên, hoặc entry nằm ở đường dẫn khác với khai báo."
  nextStep_vi: "Commit gói vào packages/<tên>/, khai báo `entry` đúng đường dẫn trong hfs.json, hoặc xoá gói khỏi sides.nivoos.packages."
  owner: op-retry
  kind: check-finding
HFS_NIVOOS_UNDECLARED:
  title: "A package that depends on the nivoos SDK is not declared"
  title_vi: "Gói phụ thuộc SDK nivoos nhưng chưa được khai báo"
  meaning_vi: "Một gói gốc packages/<tên>/ phụ thuộc vào SDK nivoos hoặc CLI nivoos, nên là gói nghiệp vụ, nhưng hfs.json không liệt kê nó trong sides.nivoos.packages; lint chuẩn của back end sẽ xét mã SDK (export mặc định, nội dung tiếng Việt) và từ chối."
  causes_vi:
    - "Vi phạm R436: gói viết bằng SDK nivoos phải được khai báo để dùng hồ sơ lint SDK và bước kiểm tra nivoos package check (PROJECT-BUSINESS-1)."
    - "Gói được chuyển vào từ kho khác mà hfs.json chưa được cập nhật."
  nextStep_vi: "Thêm { \"name\": \"<tên>\" } vào sides.nivoos.packages của hfs.json, hoặc bỏ phụ thuộc vào SDK nếu đó không phải gói nghiệp vụ."
  owner: op-retry
  kind: check-finding
HFS_NIVOOS_PACKAGE_CHECK:
  title: "The nivoos package check failed"
  title_vi: "Bước kiểm tra gói nivoos không đạt"
  meaning_vi: "`nivoos package check <entry> --out <out>` chạy trong packages/<tên>/ không thành công: gói không qua type-check hoặc không dựng được, seed hoặc mẫu secrets đã commit khác bản dựng mới, hoặc CLI nivoos chưa được cài cho gói."
  causes_vi:
    - "Vi phạm R436: mỗi gói nivoos đã khai báo phải qua nivoos package check trong starci app check (PROJECT-BUSINESS-1)."
    - "Mã gói đổi mà seed chưa được dựng lại và commit, hoặc devDependency `nivoos` thiếu."
  nextStep_vi: "Chạy `npm run build` trong packages/<tên>/ rồi commit seed; nếu CLI chưa cài, thêm `nivoos` vào devDependencies của gói và chạy npm install."
  owner: op-retry
  kind: check-finding
STACKS_SIDES_UNDECLARED:
  title: "The stack declaration states no sides"
  title_vi: "Khai báo stack chưa nêu các phía của dự án"
  meaning_vi: "Tệp .starcistacks/application-stacks.yaml không có trường sides (be, fe, packages: true hoặc false), nên người đọc stack không biết dự án có những phía nào."
  causes_vi:
    - "Khai báo stack có trước trường sides (R399, PROJECT-STACKS-2); starci app scaffold luôn viết trường này."
  nextStep_vi: "Thêm dòng sides: {be: ..., fe: ..., packages: ...} khớp với sides của hfs.json vào đầu application-stacks.yaml."
  owner: op-retry
  kind: check-finding
STACKS_SIDES_DRIFT:
  title: "The stack declaration's sides differ from hfs.json"
  title_vi: "Các phía trong khai báo stack lệch với hfs.json"
  meaning_vi: "Trường sides của .starcistacks/application-stacks.yaml phải bằng đúng các phía hfs.json khai báo."
  causes_vi:
    - "Vi phạm R399: một phía được thêm hoặc bỏ trong hfs.json mà khai báo stack không đổi theo, hoặc ngược lại."
  nextStep_vi: "Sửa sides trong application-stacks.yaml cho khớp với hfs.json (hfs.json là nơi khai báo gốc)."
  owner: op-retry
  kind: check-finding
STACKS_COMPONENT_SIDE:
  title: "A stack component runs an app of a side the project lacks"
  title_vi: "Một thành phần stack chạy app của phía mà dự án không có"
  meaning_vi: "Khai báo stack có image deploy của app mà không phía nào khai báo, cấu hình build front-end (buildArgs) khi không có fe, hoặc tiến trình local chạy từ thư mục của phía chưa khai báo."
  causes_vi:
    - "Vi phạm R399: không có thành phần web/front-end khi thiếu fe, không có thành phần api khi thiếu be (PROJECT-1)."
  nextStep_vi: "Xoá thành phần, image hoặc tiến trình đó khỏi application-stacks.yaml, hoặc khai báo phía chứa app trong hfs.json."
  owner: op-retry
  kind: check-finding
HFS_DATA_IN_CODE:
  title: "A code project tracks seed copy data or depends on a copy repository"
  title_vi: "Dự án mã nguồn chứa dữ liệu của bản sao hoặc phụ thuộc vào kho bản sao"
  meaning_vi: "Kho mã nguồn theo dõi một manifest bản sao (schema starci/data-manifest@1), một tệp trong cây data/, blobs/, index/ cạnh manifest đó, hoặc một phong bì sops chế độ binary (*.sops.json có thành viên data); hoặc package.json (dependencies, workspaces), .gitmodules hay tsconfig/jsconfig nêu tên kho kết thúc bằng -seed-standard hoặc -seed-backup-<env>. Dữ liệu chỉ nằm trong kho bản sao <tên>-seed-standard hoặc <tên>-seed-backup-<env>, và mã nguồn không được phụ thuộc vào nội dung bản sao."
  causes_vi:
    - "Vi phạm R400: một bản xuất dữ liệu được commit vào kho mã nguồn (PROJECT-STACKS-13)."
    - "Vi phạm R400: kho bản sao được thêm làm package, submodule, workspace hoặc đường dẫn import (PROJECT-STACKS-13)."
  nextStep_vi: "Chuyển tệp sang kho bản sao qua driver dữ liệu, rồi xoá nó khỏi dự án mã nguồn; fixture của test dùng dữ liệu tổng hợp. Với phụ thuộc: xoá tham chiếu đó; dữ liệu vào ứng dụng qua bước seed của bring-up hoặc một lệnh sync tường minh."
  owner: op-retry
  kind: check-finding

HFS_DATA_COPY_INVALID:
  title: "A seed copy repository breaks its sealing, manifest or size law"
  title_vi: "Kho bản sao dữ liệu vi phạm luật niêm phong, manifest hoặc kích thước"
  meaning_vi: "Trong kho bản sao (không có hfs.json, manifest.json gốc có schema starci/data-manifest@1), thông báo của lỗi nêu đúng điểm sai. Niêm phong: mọi tệp trong data/, blobs/, index/ của seed-backup phải là phong bì sops chế độ binary (*.sops.json, age) gửi tới recipients của môi trường; seed-standard là bản rõ, không chứa phong bì sops, tệp *.sops.json hoặc *.enc.yaml, manifest không khai sealing. Manifest: manifest.json phải liệt kê đúng các tệp trong data/, blobs/, index/ (tên có đuôi .sops.json khi sealing là sops-age) và purpose phải khớp tên format (<tên>-seed-standard@N hoặc <tên>-seed-backup-<env>@N). Kích thước: không tệp dữ liệu hoặc tệp raw/ nào của bản sao git vượt 4 MiB, và tổng các tệp dữ liệu cùng raw/ tối đa 500 MiB; vượt mức này bộ dữ liệu đã lớn hơn git."
  causes_vi:
    - "Vi phạm R400: một tệp rõ được stage vào kho seed-backup, hoặc một bí mật hay tệp niêm phong được đưa vào kho seed-standard (PROJECT-STACKS-13)."
    - "Vi phạm R400: một tệp được thêm hoặc xoá mà manifest không đổi theo, hoặc manifest được sửa tay (PROJECT-STACKS-13)."
    - "Vi phạm R400: một shard hoặc chunk quá lớn, hoặc snapshot vượt trần (PROJECT-STACKS-13, PROJECT-STACKS-14)."
  nextStep_vi: "Niêm phong: bỏ stage tệp và để driver dữ liệu ghi bản sao (niêm phong cùng lúc), rồi commit lại; với seed-standard thì xoá tệp niêm phong khỏi kho, bí mật của dự án nằm trong kho lưu giữ của stack (PROJECT-STACKS-5). Manifest: chạy lại driver dữ liệu để ghi manifest và tệp cùng lúc, không sửa tay. Kích thước: ghi lại qua driver dữ liệu với shard nhỏ hơn; nếu cả bộ vượt 500 MiB thì khai báo driver s3 cho bộ dữ liệu đó trong application-stacks.yaml."
  owner: op-retry
  kind: check-finding

HFS_DATA_ADAPTER_DRIFT:
  title: "A seed-standard's adapter is unguarded or its output is not what the adapter writes from raw/"
  title_vi: "Adapter của seed-standard thiếu lớp bảo vệ hoặc đầu ra không khớp với những gì adapter ghi từ raw/"
  meaning_vi: "Trong kho seed-standard có adapter/ (R434), thông báo của lỗi nêu đúng điểm sai. Đầu ra: manifest.json, data/, blobs/ và index/ đã commit phải trùng từng byte với đầu ra của node adapter/main.ts chạy trên raw/ (theo index); adapter không chạy được, hai lần chạy cho kết quả khác nhau (adapter không tất định), một tệp đầu ra lệch, thiếu hoặc thừa so với commit, hoặc adapter/ có thay đổi chưa stage đều bị từ chối. Lớp bảo vệ: kho phải theo dõi adapter/main.ts, adapter/package.json, hook .githooks/pre-commit và workflow .github/workflows/seed-standard.yml; hook và workflow đều chạy starci app check --staged để kiểm lại adapter trước mỗi commit và trên CI."
  causes_vi:
    - "Vi phạm R434: data/ bị sửa tay trong kho có adapter, hoặc raw/ được commit mà không chạy lại adapter (PROJECT-STACKS-13)."
    - "Adapter dùng đồng hồ, id ngẫu nhiên hoặc thứ tự hệ thống tệp nên mỗi lần chạy ra kết quả khác."
    - "Chưa cài phụ thuộc của adapter (npm ci --prefix adapter)."
    - "Vi phạm R434: kho được dựng tay, thiếu phần mà starci data standard init --adapter viết (PROJECT-STACKS-13)."
  nextStep_vi: "Đầu ra: sửa raw/ (hoặc adapter/), chạy lại node adapter/main.ts từ gốc kho rồi stage cả đầu ra; không sửa tay data/. Adapter phải tất định: không đồng hồ, không id ngẫu nhiên. Lớp bảo vệ: chạy starci data standard init --adapter trong kho để viết các tệp còn thiếu, rồi commit chúng."
  owner: op-retry
  kind: check-finding

STACK_SEED_ADAPTER_DRIFT:
  title: "The seed step refused a pinned seed-standard whose adapter output drifts"
  title_vi: "Bước seed từ chối seed-standard đã ghim có đầu ra adapter bị lệch"
  meaning_vi: "Trước khi áp dụng, bước seed của bring-up đọc từng seed-standard của môi trường tại commit đã ghim; nếu commit đó có adapter/, adapter được chạy lại trên raw/ và so từng byte với đầu ra đã commit. Đầu ra lệch, hoặc commit không đọc được, làm bước seed dừng trước khi áp dụng bất cứ mục nào."
  causes_vi:
    - "Vi phạm R434: commit được ghim mang data/ sửa tay hoặc adapter không tất định."
    - "Kho hoặc commit được ghim không tới được từ máy chạy bring-up."
  nextStep_vi: "Ghim một commit mà kiểm tra của chính kho seed-standard đã xanh (sửa raw/ hoặc adapter/ trong kho đó rồi commit lại), cập nhật commit trong data.sets, rồi chạy lại bring-up."
  owner: supervisor
  kind: verb-refusal
STACK_SEED_ADAPTER_INSTALL:
  title: "The seed step could not install the adapter dependencies of a pinned seed-standard"
  title_vi: "Bước seed không cài được dependency của adapter trong seed-standard đã ghim"
  meaning_vi: "Trước khi áp dụng, bước seed chạy `npm ci` cho adapter/ của seed-standard tại commit đã ghim để chạy lại adapter (R434). Lệnh npm thất bại nên không kiểm được đầu ra adapter và không có mục nào được áp dụng. Đây không phải lệch đầu ra adapter (STACK_SEED_ADAPTER_DRIFT)."
  causes_vi:
    - "adapter/package.json hoặc lockfile của nó ghim một phiên bản registry không phục vụ (ví dụ một bản harness chưa publish)."
    - "Máy chạy bring-up không tới được registry npm."
  nextStep_vi: "Sửa adapter/package.json và lockfile trong kho seed-standard để mọi dependency là bản đã publish, commit, ghim commit đó trong data.sets rồi chạy lại bring-up."
  owner: supervisor
  kind: verb-refusal
STACK_SEED_STANDARD_UNREADABLE:
  title: "The seed step cannot read a pinned seed-standard at its commit"
  title_vi: "Bước seed không đọc được seed-standard đã ghim tại commit của nó"
  meaning_vi: "Sau cổng R434, bộ nạp của bước seed lấy từng seed-standard của môi trường tại commit mà data.sets ghim (pinRepository vào bộ đệm của harness). Kho hoặc commit không tới được thì không mục nào của chuẩn được áp dụng và không có biên nhận."
  causes_vi:
    - "Commit được ghim không có trong kho seed-standard (chưa push, bị xoá lịch sử, gõ sai)."
    - "Máy chạy bring-up không tới được kho (mạng, quyền đọc kho riêng)."
  nextStep_vi: "Push commit đó lên kho seed-standard hoặc sửa commit trong data.sets, kiểm tra quyền đọc kho từ máy chạy bring-up, rồi chạy lại bring-up."
  owner: supervisor
  kind: verb-refusal
STACK_SEED_STANDARD_SCHEMA:
  title: "A pinned seed-standard is no healthy plain standard, or fills a store its set does not list"
  title_vi: "Seed-standard đã ghim không phải chuẩn plain lành mạnh, hoặc nạp vào kho mà tập dữ liệu không liệt kê"
  meaning_vi: "Bộ nạp kiểm bản sao tại commit đã ghim bằng verify của git driver (manifest starci/data-manifest@1, không niêm phong, tệp, giới hạn dung lượng, digest từng tập) và đòi purpose seed-standard; mỗi kho mà chuẩn nạp phải nằm trong stores của tập đó. Sai một điều là chuẩn bị từ chối trước khi bản ghi nào được áp dụng."
  causes_vi:
    - "data/ của kho chuẩn bị sửa tay nên digest không khớp manifest, hoặc thiếu hay thừa tệp."
    - "Commit được ghim là một seed-backup hay một định dạng khác, không phải seed-standard."
    - "Chuẩn có tập thuộc một kho mà stores của tập trong data.sets không nêu."
  nextStep_vi: "Sinh lại đầu ra của chuẩn bằng adapter hoặc git driver trong kho seed-standard và commit, hoặc thêm kho vào stores của tập; rồi ghim commit mới và chạy lại bring-up."
  owner: supervisor
  kind: verb-refusal
STACK_SEED_STORE_COMMAND:
  title: "A store a seed-standard fills has no seed door"
  title_vi: "Kho mà seed-standard nạp vào không có cửa seed"
  meaning_vi: "Chuẩn được áp dụng qua cửa seed của ứng dụng: adapter.command của từng kho trong data.stores, phục vụ kho qua giao thức starci/data-entries@1 (serveStore của @starci/seed). Kho không khai lệnh đó, hoặc không được khai trong data.stores, thì chuẩn không có đường vào."
  causes_vi:
    - "data.stores thiếu adapter.command cho kho mà một seed-standard nạp (R426 DATA_STORE_INVALID)."
    - "Chuẩn nạp một kho mà data.stores không khai."
  nextStep_vi: "Thêm vào ứng dụng một lệnh phục vụ kho bằng serveStore và khai argv của nó ở adapter.command của kho, rồi chạy lại bring-up."
  owner: op-retry
  kind: verb-refusal
STACK_SEED_DOOR_REFUSED:
  title: "The app's seed door failed or refused a key of a pinned seed-standard"
  title_vi: "Cửa seed của ứng dụng lỗi hoặc từ chối một khoá của seed-standard đã ghim"
  meaning_vi: "Bộ nạp chạy thử khô qua mọi cửa trước (không ghi gì), rồi mới upsert theo khoá tự nhiên. Cửa từ chối một khoá ở lượt khô thì không bản ghi nào được áp dụng; cửa thoát khác 0 hoặc từ chối ở lượt thật thì không có biên nhận, nên lần bring-up sau áp dụng lại cả chuẩn (upsert nên an toàn). Đầu ra của lệnh bị giữ kín."
  causes_vi:
    - "Logic nhập của kho trong ứng dụng từ chối bản ghi (ràng buộc, khoá không hợp lệ, tập chưa khai)."
    - "Lệnh của kho không chạy được hoặc không trả ImportReport ở dòng cuối."
  nextStep_vi: "Chạy lệnh của kho với import trên một bản sao dev để xem mã từ chối, sửa cửa của ứng dụng hoặc nội dung chuẩn, rồi chạy lại bring-up."
  owner: op-retry
  kind: verb-refusal
DATA_STORE_INVALID:
  title: "The data stores of the stack declaration are incomplete or invalid"
  title_vi: "Khai báo kho dữ liệu của stack thiếu hoặc không hợp lệ"
  meaning_vi: "Khối data của application-stacks.yaml (R426, PROJECT-STACKS-14) vi phạm; thông báo của lỗi nêu đúng điểm sai. Mọi thành phần có trạng thái (hoặc backing đã khai) là component của một store hoặc của một mục derived; store hoặc derived không được nêu thành phần không có. Store cần id duy nhất, kind là database hoặc storage, level là logical hoặc physical. adapter.module của store là tệp mã nguồn được theo dõi chứa lớp implements StoreAdapter; store của một bộ seed-backup, hay store mà một seed-standard nạp, còn khai adapter.command (lệnh của ứng dụng phục vụ store qua starci/data-entries@1). Mục derived nêu from là một store đã khai và rebuild không rỗng."
  causes_vi:
    - "Vi phạm R426: thiếu khai báo data.stores hoặc data.derived (PROJECT-STACKS-14)."
    - "Vi phạm R426: id, kind hoặc level của store sai, hoặc đường dẫn adapter thiếu, không được theo dõi, hoặc không có lớp implements StoreAdapter (PROJECT-STACKS-14)."
    - "Vi phạm R426: mục derived thiếu nguồn hoặc cách dựng lại (PROJECT-STACKS-14)."
  nextStep_vi: "Khai store kèm adapter, hoặc khai thành phần là derived từ một store và cách dựng lại; sửa id, kind, level của store (kind mới là thay đổi của harness); trỏ adapter.module tới tệp chứa lớp implements StoreAdapter; sửa from thành store đã khai và ghi cách dựng lại thành phần."
  owner: op-retry
  kind: check-finding

DATA_SET_INVALID:
  title: "A data set of the stack declaration is invalid"
  title_vi: "Bộ dữ liệu trong khai báo stack không hợp lệ"
  meaning_vi: "Một mục data.sets của application-stacks.yaml (R427, PROJECT-STACKS-14) vi phạm; thông báo của lỗi nêu đúng điểm sai. Mỗi mục có id duy nhất, purpose seed-standard hoặc seed-backup, stores nêu store đã khai, environments nêu môi trường stack đã khai. Mỗi to[].driver là git hoặc s3; đích git nêu repository. Mỗi seed-standard có commit là 40 ký tự hex. force và commit chỉ thuộc seed-standard, everyMinutes và maxAgeMinutes chỉ thuộc seed-backup. Không mục seeds.yaml nào (mọi cấp) và không tài liệu nào chúng nêu được nhắc tới kho -seed-backup: backup chỉ được đồng bộ tường minh vào cùng môi trường. completeness là ext:<id> của một check trong ext/manifest.json."
  causes_vi:
    - "Vi phạm R427: id, purpose, stores, environments hoặc driver của bộ dữ liệu sai (PROJECT-STACKS-14)."
    - "Vi phạm R427: seed-standard chưa ghim commit, hoặc force, commit, everyMinutes, maxAgeMinutes đặt sai loại bộ dữ liệu (PROJECT-STACKS-13)."
    - "Vi phạm R427: seed của bring-up nạp kho seed-backup, hoặc completeness không nêu check mở rộng đã khai (PROJECT-STACKS-13)."
  nextStep_vi: "Sửa id, purpose, stores, environments hoặc driver của bộ dữ liệu (driver mới là thay đổi của harness); ghi commit đã duyệt của kho seed-standard; chuyển hoặc xoá trường đặt sai loại; xoá tham chiếu kho seed-backup khỏi seeds và dùng sync tường minh để khôi phục; khai check trong ext/manifest.json hoặc sửa completeness."
  owner: op-retry
  kind: check-finding

DATA_COPY_NAME:
  title: "A copy repository name breaks the naming law"
  title_vi: "Tên kho bản sao sai quy ước"
  meaning_vi: "Kho seed-standard kết thúc -seed-standard; kho seed-backup chứa {env} và kết thúc -seed-backup-<env> cho từng môi trường; <env> là tên ngắn (short) của môi trường nếu có, không thì tên môi trường."
  causes_vi:
    - "Vi phạm R427 (PROJECT-STACKS-13)."
  nextStep_vi: "Đổi tên kho theo quy ước."
  owner: op-retry
  kind: check-finding
STORAGE_PUBLIC_ROUTE_CONSOLE:
  title: "A tunnel route reaches the admin console of an object store"
  title_vi: "Một route của tunnel trỏ vào console quản trị của kho đối tượng"
  meaning_vi: "Một mục local.tunnel.routes trỏ tới cổng console của kho đối tượng: chỉ cổng S3 được công khai, console quản trị ở lại loopback."
  causes_vi:
    - "Vi phạm R428 (PROJECT-STACKS-15)."
  nextStep_vi: "Xoá route đó, hoặc trỏ nó tới cổng S3 của kho."
  owner: op-retry
  kind: check-finding
STACK_LOCAL_TUNNEL_CERT:
  title: "stack up refused: the machine has no Cloudflare account certificate"
  title_vi: "stack up bị từ chối: máy chưa có chứng chỉ tài khoản Cloudflare"
  meaning_vi: "Môi trường khai báo local.tunnel nhưng không có cert.pem trong thư mục cloudflared (CLOUDFLARED_HOME hoặc ~/.cloudflared): không thể tạo bản ghi DNS của các route."
  causes_vi:
    - "Môi trường khai báo local.tunnel (PROJECT-STACKS-15)."
  nextStep_vi: "Chạy cloudflared tunnel login một lần trên máy này, rồi chạy lại stack up --execute."
  owner: supervisor
  kind: verb-refusal
STACK_LOCAL_TUNNEL_CONFIG:
  title: "stack up refused: the tunnel ingress file is missing or unusable"
  title_vi: "stack up bị từ chối: tệp ingress của tunnel thiếu hoặc không dùng được"
  meaning_vi: "Không có <tunnel>.yml trong thư mục cloudflared, nó không phải YAML hợp lệ, không ghi id tunnel (tunnel: <id>), hoặc không có rule bắt-tất-cả (- service: http_status:404) để chèn route trước nó."
  causes_vi:
    - "Môi trường khai báo local.tunnel (PROJECT-STACKS-15)."
  nextStep_vi: "Tạo tunnel một lần bằng cloudflared tunnel create <tên> và viết tệp ingress có rule bắt-tất-cả ở cuối, rồi chạy lại."
  owner: supervisor
  kind: verb-refusal
STACK_LOCAL_TUNNEL_CONFLICT:
  title: "stack up refused: a declared host already routes elsewhere in the tunnel ingress file"
  title_vi: "stack up bị từ chối: host đã khai báo đang trỏ chỗ khác trong tệp ingress của tunnel"
  meaning_vi: "Tệp ingress của tunnel trỏ host đã khai báo tới một service khác với local.tunnel.routes: stack up không sửa đè một rule có sẵn."
