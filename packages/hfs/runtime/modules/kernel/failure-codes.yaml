  causes_vi:
    - "Mục covered thiếu spec hoặc quy tắc"
    - "Spec hoặc quy tắc được đổi tên mà sổ không đổi theo"
  nextStep_vi: "Người giám sát sửa mục cho đúng tệp, hoặc chuyển mục sang open kèm lý do."
  owner: supervisor
  kind: check-finding

RT_EVENT_SPILL_BYPASS:
  title: "A ledger event payload is spilled by hand"
  title_vi: "Một payload sự kiện của sổ cái được tự chuyển sang blob"
  meaning_vi: "Payload sự kiện lớn theo đầu vào (danh sách tệp, manifest, bản tóm tắt, báo cáo, lời phê bình, menu) chỉ đi vào kho blob qua một đường duy nhất là appendEvent: engine/db/event-compact.mjs giữ bản inline tối đa 16 KiB và toàn bộ payload sau events.payload_sha, người đọc giải qua engine/db/event-payload.mjs. Một tệp nguồn khác truyền payloadSha vào lệnh ghi, bắt lỗi payload quá lớn để tự chuyển, hoặc chèn thẳng vào bảng events là đi vòng."
  causes_vi:
    - "Người viết gặp STARCI_EVENT_PAYLOAD_TOO_LARGE rồi tự lưu blob và truyền payloadSha thay vì để appendEvent làm"
  nextStep_vi: "Bỏ đoạn tự chuyển; gọi appendEvent với payload đầy đủ và đọc lại bằng eventPayloadOf."
  owner: supervisor
  kind: check-finding

RT_EXAMPLE_COUPLING:
  title: "Runtime source names a concrete example tree"
  title_vi: "Mã nguồn runtime gọi tên một cây examples/ cụ thể"
  meaning_vi: "Một tệp nguồn runtime được theo dõi (scripts/, engine/, packages/ trừ bản sao runtime đã sinh, ui/src, ui/api, hay một template quản lý dưới packages/hfs/templates/) viết literal examples/<name> — trỏ tới một thư mục ví dụ cụ thể thay vì một khai báo chung. Canon của runtime ship vào mọi sản phẩm, nên một đường dẫn ví dụ cứng chỉ đúng trên một checkout. Spec, test, lịch sử CHANGELOG và các bản ghi .starciwork nằm ngoài phạm vi; một lượt đọc runtime thật sự cần được khai báo một lần trong scripts/lib/example-refs.mjs và mọi nơi dùng gọi tên hằng đó."
  causes_vi:
    - "Một script hay gate đọc ví dụ của riêng một sản phẩm (ví dụ một tệp declaration đặt theo tên repo) lúc chạy, thay vì một mẫu chung hay tệp của repo đang được kiểm"
    - "Comment, tài liệu hay chuỗi trong nguồn trích dẫn đường dẫn examples/<name> cụ thể thay vì nói examples/<app>"
  nextStep_vi: "Người giám sát khái quát hóa chỗ đó (ví dụ examples/<app>, một mẫu template.*, hay một hằng trong scripts/lib/example-refs.mjs khi runtime thật sự đọc cây đó) hoặc trỏ tới repo đang được kiểm tra, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_EXTERNAL_OWNER:
  title: "External system reached outside its owner"
  title_vi: "Gọi hệ thống bên ngoài ngoài nơi sở hữu nó"
  meaning_vi: "Trong mã nguồn runtime, một tệp import một module bên ngoài (node:child_process, node:http, node:sqlite...), gọi một hàm toàn cục (fetch) hoặc khởi chạy một chương trình (git, npm, orca, powershell, node...) mà ruleParams.runtime.infraOwners của knowledge/hfs/runtime-slots.yaml không giao cho thư mục của tệp đó. Chỉ scripts/api/<hệ thống>/ (và engine/db cho SQLite) được gọi ra bên ngoài."
  causes_vi:
    - "Gọi spawnSync/execFile hay fetch trực tiếp trong tầng nghiệp vụ hoặc trong scripts/lib"
    - "Một tệp api của hệ thống này khởi chạy chương trình của hệ thống khác"
  nextStep_vi: "Người giám sát chuyển lời gọi vào một tệp lệnh của scripts/api/<hệ thống>/ rồi gọi hàm đó, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_FACT_FALSE:
  title: "A machine-evaluated fact is false, or prose contradicts it"
  title_vi: "Một sự thật máy kiểm được là sai, hoặc văn bản mâu thuẫn với nó"
  meaning_vi: "Một sự thật trong knowledge/hfs/facts.yaml không đúng với knowledge/hfs/slots.yaml (nguồn duy nhất của hình dạng sản phẩm), hoặc một dòng trong knowledge, docs hay README nói điều ngược lại, ví dụ 'không có package.json' cho một ứng dụng fe vốn có package.json riêng. Văn bản chép lại điều khẳng định bằng lời khác sẽ lệch dần khỏi slots.yaml."
  causes_vi:
    - "Sửa slots.yaml mà không sửa sự thật hoặc câu văn tương ứng"
    - "Một tài liệu chép lại điều khẳng định của slot bằng lời riêng và lời đó cũ đi"
  nextStep_vi: "Người giám sát xóa câu văn mâu thuẫn và thay bằng mã sự thật hoặc mã slot; nếu sự thật sai thì sửa slots.yaml hoặc facts.yaml, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_GENERATED_BLOCK_STALE:
  title: "A generated README block or derived field differs from its source"
  title_vi: "Khối README sinh tự động khác nguồn của nó"
  meaning_vi: "Một khối giữa các dấu hfs:generated của knowledge/hfs/README.md (bản đồ ứng dụng, cây mã backend, ma trận tầng, cây mã frontend, danh mục luật) không bằng từng byte với bản dựng từ knowledge/hfs/slots.yaml và rules.yaml. Cùng cách đó, danh sách verification.automated của luật mẫu, slot của mục files: và mã code của mục why phải bằng đúng bản suy ra từ danh mục luật và slots.yaml. Sửa tay hoặc đổi nguồn mà không dựng lại làm văn bản nói khác nguồn."
  causes_vi:
    - "Sửa slots.yaml hoặc rules.yaml mà không chạy lại readme-blocks.mjs --write"
    - "Sửa tay nội dung bên trong một khối sinh tự động"
  nextStep_vi: "Người giám sát chạy starci runtime readme-blocks --write hoặc starci runtime derived-fields --write rồi commit, qua một lane đã land; không sửa tay bên trong khối."
  owner: supervisor
  kind: check-finding

RT_GENERATED_DRIFT:
  title: "Generated copy drifted"
  title_vi: "Bản sao sinh tự động bị lệch"
  meaning_vi: "Một bản sao sinh tự động trong packages/hfs/runtime, packages/eslint/be/runtime hoặc packages/eslint/fe/runtime, packages/eslint/grammar-core/runtime, packages/eslint/grammar-offset-pop/runtime khác với nội dung mà scripts/hfs/sync-runtime.mjs ghi ra từ nguồn duy nhất: thiếu, cũ, hoặc thừa tệp."
  causes_vi:
    - "Sửa một tệp nguồn được đóng gói mà quên chạy sync-runtime"
    - "Sửa tay một tệp trong thư mục runtime/ của gói"
  nextStep_vi: "Người giám sát chạy bước sinh bản sao runtime của kiểm tra (sync-runtime); các bản sao là kết quả sinh tự động đã gitignore nên không commit, và không sửa tay thư mục runtime/ của gói."
  owner: supervisor
  kind: check-finding

RT_HELD_UNSURFACED:
  title: "A runtime fault of the Supervisor or the owner reaches nobody"
  title_vi: "Lỗi runtime giao cho Supervisor hoặc chủ sở hữu không đến được tay ai"
  meaning_vi: "Một mã lỗi loại runtime-fault được giao cho Supervisor hoặc chủ sở hữu nhưng mục của nó không nêu cơ chế báo cho họ, hoặc cơ chế được nêu không có thật trong tệp được trỏ tới. Trạng thái bị giữ như vậy đứng im hàng giờ cho đến khi có người đọc mã nguồn."
  causes_vi:
    - "Thêm mã runtime-fault mới mà không khai báo surfacedBy"
    - "surfacedAt trỏ tới tệp không mở Decision Item, không đặt đồng hồ SLA hoặc không nêu dòng digest như đã khai"
    - "Mã trạng thái chưa có đường báo thì phải ghi surfacedBy open kèm mục đang mở trong sổ ca biên"
  nextStep_vi: "Khai báo surfacedBy, surfacedAs và surfacedAt trong mục của mã (decision-item, sla-clock, incident, digest, notifier, caller hoặc open) và làm cho tệp được trỏ tới thật sự báo cho vai trò giữ mã; nếu chưa làm được thì ghi open và thêm mục open vào modules/reconciler/edge-cases.yaml nêu đúng lý do."
  owner: supervisor
  kind: check-finding

RT_HOOK_SHAPE:
  title: "App hook template breaks the gate model"
  title_vi: "Template hook của app phá vỡ mô hình cổng"
  meaning_vi: "Template hook của app không đúng R225: pre-commit chạy L0; pre-push gọi chính sách push dùng chung trong gói, không chạy build, test, typecheck hay lint."
  causes_vi:
    - "Thêm lại npm run typecheck hoặc test:affected vào pre-commit"
    - "Đưa build, typecheck, lint hay test vào pre-push hoặc bỏ lời gọi chính sách push dùng chung"
  nextStep_vi: "Khôi phục template theo R225 rồi chạy starci app sync --write để tạo lại hook."
  owner: supervisor
  kind: check-finding

RT_HOST_PATH_IN_TEMPLATE:
  title: "A host drive path is hard-coded in source"
  title_vi: "Một đường dẫn trên host bị viết cứng trong mã nguồn"
  meaning_vi: "Một tệp nguồn runtime hay một template quản lý viết cứng một đường dẫn của máy host — một ổ đĩa Windows kiểu chữ cái kèm dấu hai chấm, một thư mục người dùng kiểu Users hay home, hay một đường AppData đã bung. Source và template ship sang mọi máy và mọi sản phẩm, nên đường dẫn phải tương đối, đi qua runtime root, os.tmpdir() hay một giá trị cấu hình."
  causes_vi:
    - "Sao chép một đường dẫn tuyệt đối từ máy phát triển vào một script, template hay fixture"
    - "Một chuỗi gỡ lỗi hay ví dụ viết thẳng đường dẫn host thay vì biến môi trường hay đường tương đối"
  nextStep_vi: "Người giám sát thay đường đó bằng đường tương đối, runtime root, os.tmpdir() hay một cấu hình đã khai báo, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_IDENTIFIER_UNDECLARED:
  title: "A runtime module reads a name nothing declares"
  title_vi: "Một module runtime đọc một tên mà không nơi nào khai báo"
  meaning_vi: "Một định danh trong module ES của runtime (scripts/, engine/ trừ gói yaml của bên thứ ba, ui/api/, packages/cli/bin và src) không khớp với khai báo, import, tham số hay biến toàn cục Node nào của các phạm vi bao quanh. Một re-export (export {x} from './y.mjs') không gắn x vào phạm vi cục bộ; require, module, exports và __dirname không phải biến toàn cục của module; biến toàn cục của trình duyệt chỉ hợp lệ trong hàm được truyền cho page.evaluate. Dòng đó sẽ ném ReferenceError khi chạy tới."
  causes_vi:
    - "Tách một hàm ra khỏi vòng lặp hay closure nhưng biến cũ không được truyền sang"
    - "Xóa import cùng với hàm dùng nó trong khi còn một chỗ khác đọc tên đó"
    - "Dùng tên đã re-export từ module khác như thể nó là tên cục bộ"
  nextStep_vi: "Người giám sát khai báo hoặc import tên đó, truyền nó qua tham số, hoặc xóa chỗ đọc; không thêm ngoại lệ hay che bằng typeof."
  owner: supervisor
  kind: check-finding

RT_LOOSENING_STATE:
  title: "The tree holds a loosened gate"
  title_vi: "Cây mã đang giữ một cổng kiểm bị nới lỏng"
  meaning_vi: "Cây mã hiện tại có một cách bỏ qua kiểm tra (chú thích tắt luật, bỏ qua kiểu hoặc độ phủ, test bị bỏ qua hoặc chỉ chạy một phần, lỗi bị nuốt trong script hay workflow), một mục ignore hoặc exclude mà canon không sinh ra và bảng design-truths không cho phép, một ngưỡng bị hạ, một công tắc nới lỏng, một luật bị tắt, hoặc một tệp ngoại lệ không có trong bảng. Kiểm tra đọc trạng thái cây, không đọc lịch sử; không có phê duyệt nào cho nới lỏng đi qua, kể cả của chủ (owner ruling loosening-always-red)."
  causes_vi:
    - "Một lane thêm chú thích tắt luật, bỏ qua test hoặc nuốt lỗi để workflow chạy qua"
    - "Một mục ignore, exclude hoặc ngưỡng độ phủ bị sửa tay thay vì sinh từ canon"
    - "Một tệp allowlist, approval hoặc baseline được thêm mà bảng design-truths không liệt kê"
  nextStep_vi: "Sửa nguyên nhân để kiểm tra được thỏa rồi xoá phần nới lỏng; một ngoại lệ có thật chỉ vào được knowledge/hfs/design-truths.yaml bằng quyết định của chủ."
  owner: owner
  kind: check-finding

RT_NODE_MODULES_LINK:
  title: "node_modules linked instead of installed"
  title_vi: "node_modules được liên kết thay vì cài đặt"
  meaning_vi: "Mã runtime tạo một junction hoặc symlink tới một thư mục node_modules (qua fs.symlinkSync, fs.promises.symlink, một hàm bọc chúng, hoặc một lệnh mklink /J, New-Item -ItemType Junction, ln -s được khởi chạy). Mỗi bản checkout phải tự cài phụ thuộc bằng npm ci thật từ bộ nhớ đệm; một liên kết vào node_modules của checkout khác bị lệnh xóa đệ quy hoặc npm đi xuyên qua và làm trống cây thật."
  causes_vi:
    - "Dùng chung node_modules của checkout chính cho một worktree tạm để tiết kiệm thời gian cài đặt"
    - "Giữ lại đoạn mã cũ tạo junction cho land scratch hoặc staging"
  nextStep_vi: "Người giám sát thay liên kết bằng npm ci thật qua scripts/api/npm/ci.mjs; chỉ giữ mã gỡ hoặc phát hiện liên kết đã có."
  owner: supervisor
  kind: check-finding

RT_OP_JUDGE_UNDECLARED:
  title: "An op does not declare who judges its product, or declares a judge the runtime does not provide"
  title_vi: "Một op chưa khai báo ai chấm sản phẩm của nó, hoặc khai báo người chấm mà runtime không có"
  meaning_vi: "Nguyên tắc P2: người làm không bao giờ tự chấm việc của mình. Hợp đồng của mỗi op (modules/ops/ops/<op>.yaml) có trường bắt buộc judge, danh sách ít nhất một người chấm: machine (phép đo độc lập mà runtime sở hữu và chạy lại lúc chốt, gọi tên trong modules/kernel/op-judges.yaml; tệp test do chính lượt làm viết thì không bao giờ tự nó là người chấm), critic (Critic độc lập, đúng cho những loại op mà bảng modules/kernel/critic.yaml đánh dấu covered), owner (chỉ nơi có cổng của chủ) hoặc next-leg (chặng sau có hợp đồng là duyệt sản phẩm này). Danh sách rỗng, thiếu trường, phép đo lạ, phép đo runtime không áp dụng cho op đó, Critic khai lệch bảng, owner không có cổng hoặc next-leg chưa đăng ký đều bị từ chối."
  causes_vi:
    - "Thêm một op mới mà chưa khai báo trường judge"
    - "Khai báo một phép đo hoặc Critic mà runtime không chạy cho op đó, hoặc bảng của runtime đổi mà hợp đồng chưa đổi theo"
  nextStep_vi: "Khai báo judge trong hợp đồng của op theo modules/kernel/op-judges.yaml, hoặc sửa bảng tương ứng của runtime cho khớp với hành vi thật."
  owner: supervisor
  kind: check-finding

RT_PINNED_PATH_MOVED:
  title: "Pinned path missing"
  title_vi: "Đường dẫn được ghim không còn tồn tại"
  meaning_vi: "Một đường dẫn được ghim (ruleParams.runtime.pinned: được lưu ngoài git trong hook, settings, tác vụ định kỳ, prompt) không còn tồn tại."
  causes_vi:
    - "Đổi tên một tệp mà hook hay tác vụ định kỳ đang trỏ tới"
    - "Chuyển tệp khi các worker còn đang chạy"
  nextStep_vi: "Người giám sát khôi phục đường dẫn."
  owner: supervisor
  kind: check-finding

RT_PORT_RESTATED:
  title: "A port literal is spelled outside its owner"
  title_vi: "Một literal cổng được viết ngoài tệp chủ sở hữu"
  meaning_vi: "Một cổng của runtime chỉ được viết literal một lần, trong tệp chủ của nó: port và devPort của UI nằm trong modules/models/runtimes.yaml (statusApp) và đọc qua ui/ports.mjs, host SonarQube nội bộ trong DEFAULT_HOST của scripts/gates/sonar-local.mjs. Một literal cổng ở vị trí cổng (authority scheme://host:NNNN, host:NNNN, gán *port*/PORT, lời gọi listen(NNNN)) trong một tệp không phải chủ sở hữu — hoặc cùng một literal không chủ trong từ hai tệp nguồn runtime — là một bản chép lại. Spec, test, bản runtime sinh ra, lịch sử hợp đồng, CHANGELOG, .starciwork và khai báo stack của sản phẩm nằm ngoài luật."
  causes_vi:
    - "Hard-code một port của runtime trong script hay tài liệu thay vì import từ tệp chủ"
    - "Hai tệp nguồn cùng viết literal một port không chủ mà không khai báo hằng số chủ sở hữu"
  nextStep_vi: "Người giám sát thay literal bằng import từ tệp chủ (ui/ports.mjs, sonar-local DEFAULT_HOST) hoặc khai báo một hằng số chủ duy nhất rồi cho mọi nơi khác tham chiếu."
  owner: supervisor
  kind: check-finding

RT_PRODUCT_NAME_IN_SOURCE:
  title: "A product name is written in runtime source"
  title_vi: "Tên một sản phẩm xuất hiện trong mã nguồn runtime"
  meaning_vi: "Một tệp nguồn runtime được theo dõi viết tên của một sản phẩm mà runtime từng ship kèm (danh sách đóng PRODUCT_NAMES trong scripts/lib/example-refs.mjs) hoặc một mã inc-<hash> có tiền tố là tên sản phẩm. Canon chạy trong mọi repo sản phẩm, nên một tên cứng trong source rò rỉ phán đoán của một sản phẩm sang mọi sản phẩm khác. Spec, test và lịch sử được giữ tên đó; mọi nơi khác phải nói chung chung hoặc qua hằng khai báo trong scripts/lib/example-refs.mjs."
  causes_vi:
    - "Một câu chuyện sự cố trong comment hay log viết thẳng tên sản phẩm (ví dụ workflow wf-<product>-… hay một ledger cụ thể) thay vì 'a product's …' hay <product>"
    - "Một ánh xạ, alias hay fixture đặt theo tên sản phẩm được để trong source thay vì trong tệp khai báo chung"
  nextStep_vi: "Người giám sát viết lại chỗ đó theo dạng chung (<product>, a product's …, acme cho một ví dụ) hoặc chuyển giá trị thật sự cần vào một hằng trong scripts/lib/example-refs.mjs, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_PROSE_COMMAND_UNKNOWN:
  title: "Instruction text shows a starci command the CLI catalog does not have"
  title_vi: "Văn bản hướng dẫn nêu một lệnh starci mà danh mục CLI không có"
  meaning_vi: "Một lệnh `starci <nhóm> <verb>` trong đoạn mã, khối mã hay ví dụ yaml của skills/, docs/, README.md, CONTEXT.md, CONTRIBUTING.md hoặc modules/ nêu một verb không có trong modules/cli/commands, hoặc một cờ --flag mà verb đó và các cờ chung không nhận. Tác tử làm theo sẽ nhận lời từ chối thay vì kết quả. Danh mục CLI là sự thật; phát hiện nêu tệp:dòng và lệnh sai."
  causes_vi:
    - "Verb hoặc cờ bị gỡ hay đổi tên nhưng văn bản hướng dẫn vẫn nêu cách viết cũ"
    - "Gõ sai tên verb hoặc cờ khi viết ví dụ"
  nextStep_vi: "Người giám sát viết lại lệnh theo danh mục CLI (starci <nhóm> <verb> --help); nếu lệnh đã bị gỡ, thêm mục vào modules/kernel/removed-vocabulary.yaml và sửa mọi chỗ còn dạy nó."
  owner: supervisor
  kind: check-finding

RT_PROSE_PATH_NO_SLOT:
  title: "A path in prose that no slot owns"
  title_vi: "Đường dẫn trong văn bản không thuộc slot nào"
  meaning_vi: "Một đường dẫn sản phẩm (be/... hoặc fe/...) trong knowledge, docs hoặc README không được slot nào của knowledge/hfs/slots.yaml sở hữu và cũng không phải thư mục cha của một slot. Văn bản đã tự nghĩ ra một chỗ không có, hoặc giữ lại một chỗ mà slot không còn. Tên ứng dụng là tự do: tên ghi cứng phải là ứng dụng của ví dụ hoặc của starter, còn <tên> giữ chỗ thay cho mọi ứng dụng."
  causes_vi:
    - "Đổi hoặc xóa một slot mà văn bản vẫn nêu đường dẫn cũ"
    - "Ghi tên ứng dụng theo vai trò (api, web) thay vì giữ chỗ"
  nextStep_vi: "Người giám sát thay đường dẫn bằng mã slot, bằng <giữ chỗ> hoặc bằng tên ứng dụng của ví dụ, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_PROSE_RESTATES_SLOTS:
  title: "Prose restates the slots"
  title_vi: "Văn bản chép lại các slot"
  meaning_vi: "Một khối mã hoặc một dòng trong knowledge, docs hoặc README nêu từ ba đường dẫn sản phẩm mà slot sở hữu trở lên, hoặc một câu liệt kê từ ba tên tệp gốc hay tệp của phía mà các slot khai báo. Bản chép lại cũ đi so với slots.yaml; chỉ khối sinh tự động giữa các dấu hfs:generated mới được phép sao chép."
  causes_vi:
    - "Chép cây thư mục hoặc danh sách tệp của slots.yaml vào văn bản"
    - "Liệt kê các tệp cấu hình của gốc ứng dụng trong một câu"
  nextStep_vi: "Người giám sát thay bản chép bằng mã slot (slot app.format-config...) hoặc bằng một khối sinh tự động, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_REMOVED_VOCABULARY:
  title: "Instruction text spells a name the runtime refuses"
  title_vi: "Văn bản hướng dẫn viết một tên mà runtime từ chối"
  meaning_vi: "modules/kernel/removed-vocabulary.yaml là danh sách duy nhất các tên đã bị gỡ (khóa config, trường bias định tuyến, verb, cờ, mã, từ vựng), mỗi tên kèm thứ thay thế và bản phát hành đã gỡ nó. Một dòng trong skills/, docs/, README.md, CONTEXT.md, CONTRIBUTING.md, modules/ hoặc knowledge/ viết một tên trong danh sách mà không nằm trong CHANGELOG.md, không nằm trong chính danh sách và không mang dấu [removed-list] là dạy tác tử một cách viết mà runtime sẽ từ chối. Phát hiện nêu tệp:dòng, tên bị gỡ và cách viết thay thế."
  causes_vi:
    - "Một skill hay tài liệu còn dạy cách viết cũ sau khi runtime đổi"
    - "Gỡ hoặc đổi tên một khóa, cờ, verb, trường hay mã mà không thêm mục vào danh sách tên đã gỡ"
  nextStep_vi: "Người giám sát viết lại dòng theo cách thay thế mà phát hiện nêu; nếu dòng là danh sách các tên đã gỡ, đánh dấu [removed-list]; nếu tên mới bị gỡ, thêm mục vào modules/kernel/removed-vocabulary.yaml trong cùng commit."
  owner: supervisor
  kind: check-finding

RT_REVISION_SCOPE:
  title: "The revision-scope table does not match the runtime tree"
  title_vi: "Bảng phạm vi bản sửa không khớp với cây runtime"
  meaning_vi: "Một đường dẫn có trong cây không thuộc dòng nào của bảng phạm vi, bảng gọi tên vai trò hay hành động lạ, một tệp động cơ nạp bị liệt kê tay, tệp dựng lời nhắc khởi động của một ghế không khớp với bộ sinh, hoặc phép so sánh chỉ-sửa-lời-văn cho qua một thay đổi bỏ mục."
  causes_vi:
    - "Thêm một tệp hay thư mục mới mà chưa có dòng trong bảng"
    - "Bộ sinh lời nhắc đọc thêm một tệp mà bảng seatBoot chưa ghi"
  nextStep_vi: "Thêm dòng cho đường dẫn vào modules/kernel/revision-scope.yaml hoặc sửa seatBoot cho khớp bộ sinh."
  owner: supervisor
  kind: check-finding

RT_ROLES_CONTRACT_DRIFT:
  title: "A role surface differs from the roles contract"
  title_vi: "Một bề mặt mô tả vai trò khác với hợp đồng vai trò"
  meaning_vi: "Hợp đồng vai trò (modules/kernel/roles.yaml) là nơi duy nhất mô tả một vai trò. Một bề mặt Markdown mang khối sinh từ hợp đồng, một bề mặt yaml hoặc script dẫn id của vai trò, và không bề mặt nào dạy điều mà danh sách contradicts của vai trò cấm."
  causes_vi:
    - "Sửa hợp đồng mà không sinh lại các khối"
    - "Viết lại một đoạn mô tả vai trò trong prompt hoặc tài liệu thay vì dẫn hợp đồng"
  nextStep_vi: "Người giám sát chạy starci runtime check --only roles-contract -- --write, hoặc sửa câu mâu thuẫn theo hợp đồng."
  owner: supervisor
  kind: check-finding

RT_ROOT_ADHOC:
  title: "A root is resolved outside the root module"
  title_vi: "Một thư mục gốc được tự phân giải ngoài mô-đun gốc"
  meaning_vi: "Thư mục mà một thành phần đọc hoặc ghi chỉ được quyết định ở một mô-đun là scripts/lib/roots.mjs: cây runtime, thư mục trạng thái, thư mục tạm, thư mục nơi lệnh được gọi, tên thư mục Work và thứ tự thử hai cây cùng có thể giữ một bản ghi (cây làm việc trước, bản checkout chính sau). Tệp nguồn runtime tự viết process.cwd() hoặc literal tên thư mục Work là tự phân giải thư mục, và đã bốn lần trong hai ngày một thành phần đọc hay ghi nhầm cây vì vậy."
  causes_vi:
    - "Tệp mới nối đường dẫn từ process.cwd() hoặc từ literal .starciwork thay vì gọi mô-đun gốc"
    - "Tệp đã có sẵn ở bản phát hành trước nhưng nay viết nhiều hơn số lần khi đó"
  nextStep_vi: "Dùng invocationDir, workDirHolding, workRecordPath hoặc toolSearchDirs của scripts/lib/roots.mjs."
  owner: supervisor
  kind: check-finding

RT_RULE_ID_UNKNOWN:
  title: "A rule id that is not in the catalog"
  title_vi: "Mã luật không có trong danh mục"
  meaning_vi: "Một tệp được git theo dõi (tri thức, tài liệu, mã hoặc dữ liệu) nêu một mã luật R<số> mà knowledge/hfs/rules.yaml không có, hoặc một mã luật đã nghỉ hưu mà chỉ tệp lịch sử (CHANGELOG) mới được nêu. Mã luật ma làm người đọc và máy trỏ tới một luật không tồn tại."
  causes_vi:
    - "Một luật bị xóa hoặc đánh số lại mà các chỗ trích dẫn không được sửa theo"
    - "Gõ nhầm mã luật"
  nextStep_vi: "Người giám sát đổi trích dẫn sang luật hiện có của danh mục hoặc bỏ mã, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_RULE_UNCITED:
  title: "A catalog rule no pattern topic cites"
  title_vi: "Một luật của danh mục mà không chủ đề pattern nào trích dẫn"
  meaning_vi: "Một luật của knowledge/hfs/rules.yaml không được nêu trong hfsRules của bất kỳ chủ đề nào dưới knowledge/patterns/** và cũng không mang scope: runtime. Luật của sản phẩm tồn tại để được dạy; một luật không được trích dẫn là luật mà một lane không bao giờ đọc."
  causes_vi:
    - "Thêm một luật vào danh mục mà không trích dẫn nó từ chủ đề dạy nó"
    - "Một luật chỉ quản trị chính kho runtime mà thiếu scope: runtime"
  nextStep_vi: "Người giám sát thêm mã luật vào hfsRules của chủ đề knowledge/patterns dạy nó, hoặc đánh dấu luật scope: runtime khi nó chỉ quản trị kho runtime, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_RULING_STALE_CITE:
  title: "A live statement cites a superseded or unknown owner ruling"
  title_vi: "Nội dung hiện hành dẫn quyết định đã bị thay thế hoặc chưa được ghi nhận"
  meaning_vi: "Một trích dẫn dẫn quyết định cũ mà không dẫn quyết định thay thế trong cùng đoạn, khớp mẫu staleWhen, hoặc nêu ngày quyết định không có trong danh mục. Nội dung lịch sử của case và CHANGELOG được giữ nguyên."
  causes_vi:
    - "Tài liệu hoặc chú thích chưa cập nhật sau khi chủ sở hữu sửa quyết định"
    - "Trích dẫn thiếu id ổn định hoặc nêu ngày không có case tương ứng"
  nextStep_vi: "Cập nhật câu theo quyết định hiện hành và dẫn id của quyết định thay thế trong cùng đoạn; kiểm tra ngày và liên kết supersedes trong danh mục."
  owner: supervisor
  kind: check-finding

RT_SECRET_TRACKED:
  title: "A secret is tracked in the public runtime repository"
  title_vi: "Một bí mật được theo dõi trong repository runtime công khai"
  meaning_vi: "Một tệp *.enc hoặc secret.env/.env được git theo dõi trong repository runtime, vốn là public và không giữ vật liệu bí mật nào, kể cả bản mã hóa. Mọi bí mật của máy chủ nằm trong .claude/secret.env chưa theo dõi, chỉ đọc qua engine/secrets.mjs; các tên được liệt kê trong secret.env.example."
  causes_vi:
    - "Một bí mật mới được niêm phong và commit thay vì thêm tên vào secret.env"
    - "Tệp bí mật bị gitignore sót nên bị git add"
  nextStep_vi: "git rm tệp, thêm tên biến vào secret.env.example và danh mục env, owner đặt giá trị vào secret.env; bản mã hóa đã nằm trong lịch sử git chỉ mất khi xoay (rotate) bí mật."
  owner: owner
  kind: check-finding

RT_SLOT_ID_SHAPE:
  title: "A slot id breaks the manifest's declared grammar"
  title_vi: "Một slot id vi phạm ngữ pháp mà manifest khai báo"
  meaning_vi: "Một slot id đi theo ngữ pháp mà chính manifest khai báo: các đoạn lowercase kebab ngăn bằng dấu chấm, đoạn đầu thuộc naming.prefixes của knowledge/hfs/slots.yaml (profiles của runtime-slots.yaml), <side>.app.<kind> chỉ một kind trong appKinds.<side>, và mọi id sâu hơn mở rộng một id đã khai báo — qua trường parent tường minh, hoặc một family mà ít nhất hai slot cùng dùng; một id sâu lẻ loi tự bịa ra family. Từ vựng suffix không chứa cặp đồng nghĩa: suffixes của một profile không trùng bannedSuffixes, không cặp nào trong naming.refusedPairs sống ở cả hai vế, và naming.sameConceptPairs (step + saga-step) là ngoại lệ duy nhất — sống ở cả hai vế hoặc bị bỏ."
  causes_vi:
    - "Đặt một slot id mới không bắt đầu bằng prefix khai báo hay không kebab-case"
    - "Tạo một id sâu không mở rộng slot nào đã khai báo và family chỉ có một thành viên"
    - "Thêm một suffix đồng nghĩa với một suffix đã có mà không khai báo cặp đó trong naming"
  nextStep_vi: "Người giám sát sửa id theo ngữ pháp (đổi tên, đặt parent, hay khai báo prefix/family trong naming của manifest) hoặc đưa từ trùng nghĩa về bannedSuffixes / khai báo cặp trong naming.sameConceptPairs/refusedPairs."
  owner: supervisor
  kind: check-finding

RT_SOURCE_NAME:
  title: "Runtime source name breaks the convention"
  title_vi: "Tên tệp nguồn runtime sai quy ước"
  meaning_vi: "Một tệp nguồn của runtime không đặt tên kebab-case, mang tên dùng một lần (_*, tmp-*, fix-*, *-backfill, migrate-*, *.bak*), hoặc trùng tên với một tệp khác trong cùng tầng (trừ lib.mjs và index.mjs)."
  causes_vi:
    - "Để lại một script dùng một lần trong cây nguồn"
    - "Hai module ở hai thư mục cùng tầng mang cùng một tên"
  nextStep_vi: "Người giám sát đổi tên tệp (bằng script di chuyển để import được viết lại) hoặc xóa script dùng một lần."
  owner: supervisor
  kind: check-finding

RT_SPEC_PLACEMENT:
  title: "Runtime spec out of place"
  title_vi: "Spec của runtime đặt sai chỗ"
  meaning_vi: "Một spec của runtime không nằm ở tests/<khu vực>/<module>[.<chủ đề>].spec.mjs, mã dùng chung cho spec không nằm ở tests/helpers/, hoặc một tệp trong packages dùng hậu tố .test. thay vì .spec."
  causes_vi:
    - "Spec để phẳng ngay trong tests/"
    - "Tệp dùng chung có tiền tố _ ở gốc tests/"
  nextStep_vi: "Người giám sát chuyển tệp vào đúng thư mục bằng script di chuyển (rh-move.mjs) để import được viết lại, qua lane của chunk C7."
  owner: supervisor
  kind: check-finding

RT_STORAGE_UNDECLARED:
  title: "A text column of a store has no storage class"
  title_vi: "Một cột văn bản của kho dữ liệu chưa có lớp lưu trữ"
  meaning_vi: "Nội dung nằm thành tệp trong kho blob dưới thư mục trạng thái runtime còn hàng trong cơ sở dữ liệu chỉ giữ tham chiếu (sha) và các giá trị nhỏ dùng để truy vấn. Mọi cột văn bản của sổ cái sản phẩm và machine.sqlite phải được khai báo trong modules/schemas/storage-convention.yaml với một lớp: scalar, bounded, reference, spill hoặc migrate. Một cột chưa khai báo, một khai báo trỏ vào cột không còn, một lớp lạ, hoặc lớp migrate không khớp danh sách migrations là đi vòng quy ước."
  causes_vi:
    - "Thêm bảng hoặc cột văn bản mới mà không khai báo lớp"
    - "Cột bị đổi tên hoặc xóa nhưng khai báo vẫn còn"
  nextStep_vi: "Khai báo cột trong modules/schemas/storage-convention.yaml: nội dung dùng reference (lưu blob, giữ sha), giá trị nhỏ dùng scalar hoặc bounded."
  owner: supervisor
  kind: check-finding

RT_SYNTAX_INVALID:
  title: "Tracked JavaScript has invalid syntax"
  title_vi: "Tệp JavaScript được theo dõi có cú pháp không hợp lệ"
  meaning_vi: "Một tệp .mjs, .cjs hoặc .js được git theo dõi không thể được trình phân tích cú pháp JavaScript của TypeScript đọc. Luật áp dụng cả tests/ và nguồn packages/, trừ các gốc được sinh và cây đầu ra build của bên thứ ba. Một tệp không phân tích được không thể chạy tin cậy dù kiểm tra Node trong các thư mục runtime vẫn xanh."
  causes_vi:
    - "Biểu thức chính quy chứa xuống dòng thô, hoặc chuỗi hay template chưa đóng"
    - "Thiếu dấu ngoặc nhọn, ngoặc tròn hoặc ngoặc vuông đóng"
  nextStep_vi: "Người giám sát sửa cú pháp tại dòng được báo và chạy lại cổng runtime; không bỏ qua tệp hoặc thêm ngoại lệ."
  owner: supervisor
  kind: check-finding

RT_TIER_DIRECTION:
  title: "Runtime import against the tier direction"
  title_vi: "Import ngược chiều tầng của runtime"
  meaning_vi: "Một import tương đối giữa hai chủ sở hữu trong runtime đi từ một tầng tới một tầng không nằm trong mayImport của tầng đó (tiers.runtime trong knowledge/hfs/runtime-slots.yaml), ví dụ kernel import supervisor hay scripts/lib import một miền nghiệp vụ."
  causes_vi:
    - "Một dịch vụ dùng chung nằm ở tầng cao hơn nơi dùng nó"
    - "Thư viện cơ sở import mã nghiệp vụ"
  nextStep_vi: "Người giám sát chuyển phần dùng chung xuống tầng được phép (machine, lib) hoặc đảo chiều phụ thuộc, qua một lane đã land."
  owner: supervisor
  kind: check-finding

RT_VERSION_RESTATED:
  title: "A pinned version is spelled outside canon-pins.yaml"
  title_vi: "Một phiên bản ghim được viết ngoài canon-pins.yaml"
  meaning_vi: "knowledge/hfs/canon-pins.yaml viết phiên bản của mọi gói @starci và mọi phụ thuộc được ghim đúng một lần; package.json là nơi cài đặt khai báo và lockfile là kết quả resolve. Một literal semver bằng pin — hay specifier name@x.y.z nhắc tới nó — ở bất cứ đâu khác là bản chép lại, trừ các khóa binding mà refresher sở hữu và ghi đè tại chỗ (canon.version của code-pattern bindings do check-canon-pins giữ; provenance.version và identity.version của grammar snapshot do grammar-knowledge.mjs ghi lại). Manifest, lockfile, changelog, lịch sử hợp đồng, spec, test, runtime sinh ra và .starciwork nằm ngoài luật."
  causes_vi:
    - "Viết số phiên bản của một pin trong prose hay YAML thay vì nhắc tới tên pin"
    - "Chép specifier name@x.y.z vào tài liệu hay mẫu scaffold"
  nextStep_vi: "Người giám sát viết lại theo tên pin (\"the pinned @starci/grammar\", \"knowledge/hfs/canon-pins.yaml\") hoặc để refresher ghi qua khóa binding đã khai báo — không bao giờ viết literal."
  owner: supervisor
  kind: check-finding

SCAN_SMELL:
  title: "Code carries a smell SonarCloud measures"
  title_vi: "Mã mang một mùi mã mà SonarCloud đo"
  meaning_vi: "Tệp `<file>` có một đoạn mã mà SonarCloud sẽ báo thành code smell: `await` trong vòng lặp, `charCodeAt`, chuỗi chỉ thoát dấu gạch chéo ngược, biểu thức điều kiện lồng nhau, `void` trên giá trị không phải lời gọi, import không dùng, import chỉ để chuyển tiếp, prop khai báo mà component không đọc, API đã deprecated, đối tượng bị ép thành chuỗi hoặc hàm `async` không `await`; luật bắt ở máy trước khi bản quét đến."
  causes_vi:
    - "Vi phạm luật R235: một vòng lặp `await` từng bước mà không gọi tên thứ tự"
    - "Import còn sót sau khi mã dùng nó đã bị xóa"
    - "Dùng API next-intl `requestLocale` hay `setRequestLocale` đã bị thay bằng `next/root-params`"
  nextStep_vi: "Sửa đúng dòng được chỉ: chạy các bước độc lập bằng `Promise.all`, gọi tên thứ tự bằng `eachInOrder` của `platform/primitives`, bỏ import thừa, viết lại biểu thức lồng thành câu lệnh riêng, đọc locale qua `next/root-params`, trả `Promise.resolve(...)` thay vì `async` không `await`. Op vừa tạo ra bản này sẽ được chạy lại để sửa theo lời nhắn của bộ kiểm tra."
  owner: op-retry
  kind: check-finding

SEALED_CUSTODY_LOCATION:
  title: "Sealed secret path is not under the app root .starcistacks"
  title_vi: "Đường dẫn bí mật đã mã hoá không nằm dưới .starcistacks"
  meaning_vi: "Trường custody.sealed của bản ghi danh tính hoặc tài nguyên không trỏ tới .starcistacks/<môi-trường>/secrets/<slug>.enc ở gốc app, nơi duy nhất được phép giữ bí mật đã mã hoá; dạng nằm dưới một phía (be/.starcistacks/...) cũng bị từ chối."
  causes_vi:
    - "Đường dẫn trỏ vào .starciwork, ví dụ .starciwork/_resources/identities/<id>/secrets.enc.yaml"
    - "Đường dẫn dùng thư mục con hoặc đuôi khác thay vì <slug>.enc"
    - "Ghi 'none' hoặc để trống thay vì nêu đường dẫn sẽ được mã hoá"
  nextStep_vi: "Đây là lỗi bị từ chối; op work.author hoặc op uat.verify sửa custody.sealed thành .starcistacks/<môi-trường>/secrets/<slug>.enc và chuyển tệp mã hoá (nếu có) tới đó bằng git mv, không đọc nội dung."
  owner: other-op:work.author
  kind: check-finding

SEALED_FILE_IN_WORK:
  title: "Sealed secret file kept inside .starciwork"
  title_vi: "Tệp bí mật đã mã hoá nằm trong .starciwork"
  meaning_vi: "Cây Work chứa một tệp mã hoá (.enc); cây Work chỉ được giữ bản ghi danh tính hoặc tài nguyên, còn tệp bí mật phải nằm ở .starcistacks/<môi-trường>/secrets/<slug>.enc."
  causes_vi:
    - "Tệp secrets.enc.yaml được đặt cạnh resource.yaml của danh tính"
    - "Tệp mã hoá được sao vào cây Work để tiện đọc"
  nextStep_vi: "Đây là lỗi bị từ chối; op work.author hoặc op uat.verify chuyển tệp bằng git mv tới .starcistacks/<môi-trường>/secrets/<slug>.enc và trỏ custody.sealed vào đó, không đọc hay in nội dung."
  owner: other-op:work.author
  kind: check-finding

# --- HFS rule catalog (knowledge/hfs/rules.yaml): one code per rule, from R01 up ---

STACKS_DEPLOY_CONFIG_INVALID:
  title: "A deploy block of application-stacks.yaml is not coherent"
  title_vi: "Khối deploy trong application-stacks.yaml không nhất quán"
  meaning_vi: "environments.<env>.deploy có trường lạ, tên hoặc mẫu sai, tệp cấu hình không tồn tại, dịch vụ không có trong stack, thành viên sealed không có tệp .enc, mục verify sai dạng, tên config trùng hoặc ảnh backup chưa ghim digest thật."
  causes_vi:
    - "Vi phạm R294: khối deploy được kiểm bằng đúng normalizeDeploy mà các động từ starci app stack dùng, nên động từ sẽ từ chối cùng lỗi đó."
    - "Tệp, dịch vụ hoặc thành viên sealed được đổi tên hay xóa mà khối deploy chưa cập nhật."
  nextStep_vi: "Sửa đúng trường nêu trong thông báo (environments.<env>.<đường dẫn>), rồi chạy lại starci app check; mỗi vấn đề là một phát hiện riêng."
  owner: op-retry
  kind: check-finding

STACKS_DNS_UNDECLARED:
  title: "An ingress host has no DNS ownership receipt"
  title_vi: "Host của ingress thiếu khai báo chủ sở hữu và bằng chứng DNS"
  meaning_vi: "Một host được ingress sử dụng không có bản ghi dns với host, owner và receipt đầy đủ trong khai báo môi trường."
  causes_vi:
    - "Vi phạm R266: điều kiện DNS chỉ tồn tại ngoài kho mã hoặc chưa có người chịu trách nhiệm rõ ràng."
  nextStep_vi: "Thêm bản ghi dns cho từng host, nêu chủ sở hữu và tham chiếu bằng chứng DNS; việc thay đổi DNS vẫn do chủ sở hữu thực hiện."
  owner: op-retry
  kind: check-finding

STACKS_HEALTHCHECK_MISSING:
  title: "A runnable Swarm service has no healthcheck"
  title_vi: "Dịch vụ Swarm đang chạy thiếu healthcheck"
  meaning_vi: "Mô hình Swarm thiếu healthcheck hoạt động cho dịch vụ chạy liên tục hoặc đã tắt healthcheck của dịch vụ đó."
  causes_vi:
    - "Vi phạm R266: trạng thái container chạy chưa chứng minh được tín hiệu sức khỏe cần để cập nhật và phục hồi dịch vụ."
  nextStep_vi: "Khai báo healthcheck có lệnh thực sự kiểm tra dịch vụ; tách tín hiệu sống và sẵn sàng theo trách nhiệm của ứng dụng."
  owner: op-retry
  kind: check-finding

STACKS_HOST_UNROUTED:
  title: "A declared ingress host has no rendered route"
  title_vi: "Host được khai báo chưa có tuyến trong mô hình ingress"
  meaning_vi: "Danh sách ingress.hosts chứa host mà cấu hình Traefik hoặc Caddy đã render không định tuyến."
  causes_vi:
    - "Vi phạm R266: danh sách host và tuyến thực tế không khớp, nên khai báo chưa chứng minh được cửa vào của ứng dụng."
  nextStep_vi: "Thêm tuyến cho host trong cấu hình ingress được theo dõi hoặc bỏ host không còn dùng, rồi render lại mô hình."
  owner: op-retry
  kind: check-finding

STACKS_INGRESS_UNDECLARED:
  title: "A Swarm environment has no declared ingress"
  title_vi: "Môi trường Swarm chưa khai báo ingress"
  meaning_vi: "Môi trường chưa có ingress.component và danh sách ingress.hosts hợp lệ để xác định cửa vào của ứng dụng."
  causes_vi:
    - "Vi phạm R275: mô hình có thể chạy proxy nhưng khai báo không nêu ingress mà môi trường thực sự chọn."
  nextStep_vi: "Khai báo một ingress component và danh sách host của nó; dùng Traefik hoặc Caddy được ghim bằng digest."
  owner: op-retry
  kind: check-finding

STACKS_INGRESS_UNKNOWN:
  title: "The declared ingress is unknown or unsupported"
  title_vi: "Ingress được khai báo không tồn tại hoặc chưa được hỗ trợ"
  meaning_vi: "Component ingress không được chọn, sai role, thiếu trong mô hình hoặc không dùng image Traefik hay Caddy được ghim bằng digest."
  causes_vi:
    - "Vi phạm R275: tên component hoặc image của cửa vào không khớp hợp đồng ingress được hỗ trợ."
  nextStep_vi: "Chọn component có role ingress hiện diện trong mô hình và ghim image Traefik hoặc Caddy bằng digest đầy đủ."
  owner: op-retry
  kind: check-finding

STACKS_LITE_REDIS_PERSISTENCE:
  title: "The declared lite Redis is not one persisted, non-evicting stack service"
  title_vi: "Redis đã khai báo của lite không phải một dịch vụ duy nhất có AOF và không evict"
  meaning_vi: "hfs.json sides.be.backing khai báo redis nhưng stack lite không chạy đúng một dịch vụ Redis; hoặc dịch vụ Redis không chạy với --appendonly yes, không mount một named volume ghi được tại /data, hay đặt --maxmemory-policy khác noeviction. Job của hàng đợi nằm trong Redis nên khởi động lại hoặc evict sẽ làm mất chúng."
  causes_vi:
    - "Vi phạm R276 (ruling:R212/case-10): Redis đã khai báo không được render trong stack, hoặc được render nhiều lần."
    - "Lệnh redis-server thiếu --appendonly yes, hoặc đặt maxmemory-policy evict khóa (allkeys-lru, volatile-ttl...)."
    - "Dịch vụ Redis không mount named volume vào /data, hoặc mount chỉ đọc, hoặc volume không được định nghĩa trong mô hình."
  nextStep_vi: "Render đúng một dịch vụ Redis, chạy redis-server với --appendonly yes, giữ maxmemory-policy noeviction (mặc định; khóa cache đặt TTL) và mount một named volume ghi được tại /data, khai báo volume đó trong mô hình và trong components.redis.volumes."
  owner: op-retry
  kind: check-finding

STACKS_LITE_SELFHOSTED_DB:
  title: "A lite deployment runs PostgreSQL, MongoDB, Qdrant or undeclared Redis"
  title_vi: "Triển khai lite chạy PostgreSQL, MongoDB, Qdrant hoặc Redis chưa khai báo"
  meaning_vi: "Tập component hoặc mô hình triển khai của lite chứa image PostgreSQL, MongoDB hoặc Qdrant, dù có khai báo, hoặc chứa Redis chưa khai trong sides.be.backing. Lite dùng Supabase được quản lý và pgvector cho vector; full giữ Qdrant khi được khai báo (owner:lite-vector-is-pgvector)."
  causes_vi:
    - "Vi phạm R276: topology lite thêm máy chủ dữ liệu mà chuẩn dành cho Supabase được quản lý."
    - "Stack lite chạy Qdrant, hoặc chạy Redis khi chưa khai dịch vụ cho năng lực cần nó."
  nextStep_vi: "Gỡ image Postgres, Mongo hoặc Qdrant; dùng Supabase pgvector cho vector và SQLite trên volume được khai báo cho sidecar. Với Redis, khai redis trong sides.be.backing cho năng lực cần nó hoặc gỡ dịch vụ khỏi stack."
  owner: op-retry
  kind: check-finding

STACKS_MODEL_UNAVAILABLE:
  title: "The tracked rendered deployment model cannot be checked"
  title_vi: "Không kiểm tra được mô hình triển khai đã render được theo dõi"
  meaning_vi: "Mô hình triển khai được chọn bị thiếu, không được theo dõi, không đọc được hoặc không có cấu trúc dịch vụ hợp lệ."
  causes_vi:
    - "Vi phạm R267: checker không có mô hình thực tế để xét topology và không được bỏ qua kiểm tra vì thiếu đầu vào."
  nextStep_vi: "Theo dõi mô hình đã render dưới cây Swarm của môi trường, khai báo renderedModel hoặc composeFiles đúng và chạy lại kiểm tra."
  owner: op-retry
  kind: check-finding

STACKS_PLACEMENT_MISSING:
  title: "A stateful Swarm service has no placement constraint"
  title_vi: "Dịch vụ Swarm có trạng thái thiếu ràng buộc vị trí chạy"
  meaning_vi: "Dịch vụ có trạng thái hoặc volume bền vững không khai báo deploy.placement.constraints trong mô hình đã render."
  causes_vi:
    - "Vi phạm R266: task có thể chuyển sang node không giữ volume và mất quyền truy cập dữ liệu của component."
  nextStep_vi: "Thêm ràng buộc placement phù hợp chủ sở hữu volume và nêu rõ giới hạn phục hồi khi node hoặc đĩa bị mất."
  owner: op-retry
  kind: check-finding

STACKS_PORT_PUBLISHED:
  title: "A service outside the declared ingress publishes a port"
  title_vi: "Dịch vụ ngoài ingress được khai báo mở cổng công khai"
  meaning_vi: "Mô hình Swarm công bố cổng của dịch vụ không phải ingress duy nhất được môi trường chọn."
  causes_vi:
    - "Vi phạm R266: API, worker hoặc dịch vụ dữ liệu có cửa truy cập trực tiếp vượt qua ingress đã khai báo."
  nextStep_vi: "Gỡ ports khỏi dịch vụ nội bộ và định tuyến lưu lượng công khai qua ingress được môi trường khai báo."
  owner: op-retry
  kind: check-finding

STACKS_REALTIME_SCALED:
  title: "A realtime API with several replicas runs the in-process hub"
  title_vi: "API Realtime nhiều replica đang chạy hub trong tiến trình"
  meaning_vi: "App API có composition chứa feature be.feature.realtime.* và dịch vụ Swarm chạy nhiều hơn một replica, nhưng REALTIME_HUB không chọn hub dùng chung (postgres hoặc redis) hoặc không được khai báo. Hub memory chỉ phục vụ một tiến trình nên tin đẩy ở replica này không tới client đang nghe ở replica khác."
  causes_vi:
    - "Vi phạm R266: deploy.replicas lớn hơn 1 nhưng hub realtime là hub memory của bản chạy một replica và của test."
  nextStep_vi: "Khai báo REALTIME_HUB=postgres trong environment của API (hoặc redis), hoặc ghim deploy.replicas: 1 khi chỉ chạy một replica; xem BE-REALTIME-7 trong knowledge/patterns/be/realtime.yaml."
  owner: op-retry
  kind: check-finding

STACKS_RELEASE_UNDECLARED:
  title: "A Swarm environment has no complete release declaration"
  title_vi: "Môi trường Swarm thiếu khai báo release đầy đủ"
  meaning_vi: "Môi trường chưa khai báo imagesLock, pointer, previous hoặc danh sách healthAssertions không rỗng."
  causes_vi:
    - "Vi phạm R267: kho mã chưa gắn image bất biến, release đang chạy, release trước và điều kiện xác nhận triển khai."
  nextStep_vi: "Bổ sung release với khóa image, con trỏ hiện tại và trước đó cùng healthAssertions; chỉ đổi con trỏ hiện tại sau khi xác minh thành công."
  owner: op-retry
  kind: check-finding

STACKS_SECOND_INGRESS:
  title: "A Swarm environment selects more than one ingress"
  title_vi: "Môi trường Swarm chọn nhiều hơn một ingress"
  meaning_vi: "Tập component được chọn hoặc mô hình đã render chứa ingress thứ hai bên cạnh ingress của môi trường."
  causes_vi:
    - "Vi phạm R266: hai ingress tạo hai chủ sở hữu định tuyến, TLS hoặc cổng công khai trong cùng môi trường."
  nextStep_vi: "Giữ đúng một ingress trong môi trường và mô hình; chuyển mọi host cùng quyền công bố cổng sang component đó."
  owner: op-retry
  kind: check-finding

STACKS_SECRET_ENV_LITERAL:
  title: "A rendered service puts a secret literal in its environment"
  title_vi: "Dịch vụ đã render đưa bí mật trực tiếp vào biến môi trường"
  meaning_vi: "Mô hình triển khai truyền giá trị bí mật qua environment thay vì tham chiếu tệp secret được cấp cho dịch vụ."
  causes_vi:
    - "Vi phạm R266: giá trị bí mật có thể xuất hiện trong cấu hình đã render, thông tin dịch vụ hoặc bản ghi vận hành."
  nextStep_vi: "Bỏ giá trị trực tiếp và dùng adapter đọc tệp secret của consumer; cấp secret bên ngoài cho đúng dịch vụ mà không in giá trị."
  owner: op-retry
  kind: check-finding

STACKS_SECRET_NOT_EXTERNAL:
  title: "A Swarm secret is not an external engine secret"
  title_vi: "Bí mật Swarm chưa dùng secret bên ngoài của engine"
  meaning_vi: "Mô hình Swarm chứa secret không có external: true, dùng file hoặc giá trị trực tiếp, hoặc không có secret tương ứng với khai báo của môi trường."
  causes_vi:
    - "Vi phạm R266: mô hình triển khai giữ bí mật trong tệp mount hoặc nội dung stack thay vì cấp secret của engine cho đúng dịch vụ."
  nextStep_vi: "Khai báo secret bên ngoài trong mô hình Swarm, tạo nó qua stdin riêng tư và cấp quyền cho đúng dịch vụ; chỉ theo dõi bản mã hóa trong kho mã."
  owner: op-retry
  kind: check-finding

STACKS_SECRET_UNVERSIONED:
  title: "A Swarm secret has no matching immutable version"
  title_vi: "Bí mật Swarm thiếu phiên bản bất biến khớp khai báo"
  meaning_vi: "Secret thiếu runtimeName hoặc version dương, tên không kết thúc bằng -v<version>, hoặc tên secret đã render khác với tên được khai báo."
  causes_vi:
    - "Vi phạm R266: tên secret có thể bị tái sử dụng khi xoay khóa hoặc khai báo không khớp secret của engine."
  nextStep_vi: "Khai báo runtimeName và version dương khớp hậu tố -v<version>; dùng đúng tên đó trong mô hình, đổi quyền của consumer rồi mới thu hồi phiên bản cũ."
  owner: op-retry
  kind: check-finding

STACKS_SIDECAR_DB_UNSUPPORTED:
  title: "A lite sidecar requires an unsupported database adapter"
  title_vi: "Sidecar của lite yêu cầu adapter cơ sở dữ liệu không được hỗ trợ"
  meaning_vi: "Sidecar của lite khai báo hoặc cấu hình database khác SQLite, bao gồm PostgreSQL, Redis và MongoDB."
  causes_vi:
    - "Vi phạm R276: sidecar kéo thêm backing bị cấm vào topology lite thay vì dùng SQLite trên volume bền vững."
  nextStep_vi: "Chọn chế độ SQLite được sidecar hỗ trợ và volume được khai báo; bỏ sidecar nếu nó bắt buộc dùng backing không được lite hỗ trợ."
  owner: op-retry
  kind: check-finding

STACKS_SIDECAR_VOLUME_UNDECLARED:
  title: "A lite SQLite sidecar has no declared persistent volume"
  title_vi: "Sidecar SQLite của lite thiếu volume bền vững được khai báo"
  meaning_vi: "Sidecar dùng SQLite nhưng chưa khai báo database.volume, chưa liệt kê volume đó trong component hoặc chưa định nghĩa và mount volume trong mô hình."
  causes_vi:
    - "Vi phạm R276: tệp cơ sở dữ liệu sidecar không gắn với volume có chủ sở hữu rõ ràng và có thể mất khi tạo lại container."
  nextStep_vi: "Khai báo database.provider: sqlite, database.volume và components.<id>.volumes, rồi định nghĩa và mount đúng named volume trong mô hình."
  owner: op-retry
  kind: check-finding

STACKS_TLS_UNDECLARED:
  title: "A Swarm environment has no TLS ownership receipt"
  title_vi: "Môi trường Swarm thiếu chủ sở hữu và bằng chứng TLS"
  meaning_vi: "Môi trường có ingress nhưng chưa khai báo tls.owner và tls.receipt cho việc cấp chứng chỉ cùng nơi lưu giữ bền vững."
  causes_vi:
    - "Vi phạm R266: quyền cấp hoặc phục hồi chứng chỉ chưa có chủ sở hữu và bằng chứng được khai báo."
  nextStep_vi: "Khai báo chủ sở hữu TLS và tham chiếu bằng chứng cấp, lưu giữ chứng chỉ; giữ thao tác của chủ sở hữu là điều kiện triển khai rõ ràng."
  owner: op-retry
  kind: check-finding

STACKS_UPDATE_POLICY_MISSING:
  title: "A Swarm service has no explicit rollout and recovery policy"
  title_vi: "Dịch vụ Swarm thiếu chính sách cập nhật và phục hồi rõ ràng"
  meaning_vi: "Dịch vụ chạy liên tục thiếu chính sách deploy.update_config, rollback_config hoặc restart_policy cần cho vòng đời triển khai."
  causes_vi:
    - "Vi phạm R266: triển khai dựa vào mặc định thay vì nêu cách cập nhật, xử lý lỗi và phục hồi dịch vụ."
  nextStep_vi: "Khai báo chính sách cập nhật, rollback và restart của từng dịch vụ trong mô hình, rồi kiểm tra cùng các tín hiệu sức khỏe."
  owner: op-retry
  kind: check-finding

STACK_TOOLING_REIMPLEMENTED:
  title: "An app re-implements deploy tooling the canon ships"
  title_vi: "Ứng dụng tự cài lại công cụ triển khai mà canon đã cung cấp"
  meaning_vi: "Một tệp triển khai gọi lệnh docker mà một động từ starci app stack đã đảm nhiệm, hoặc thư mục deploy chứa tệp mang tên một động từ như render, converge hay prepare."
  causes_vi:
    - "Vi phạm R293: kho mã giữ bản sao công cụ Swarm riêng (docker stack deploy, docker secret create, docker swarm init...) thay vì gọi động từ của canon."
    - "Một workflow hoặc script trong deploy/, scripts/ hay package.json gọi trực tiếp docker cho việc canon đã làm."
  nextStep_vi: "Xóa tệp hoặc lệnh đó và gọi động từ được nêu trong thông báo (starci app stack render, deploy, converge, verify, prune, rollback, prepare, doctor), đặt hằng số của ứng dụng vào khối deploy của application-stacks.yaml."
  owner: op-retry
  kind: check-finding

BE_ENTITY_SCHEMA_DRIFT:
  title: "A TypeORM entity column differs from the schema the migrations build"
  title_vi: "Cột entity TypeORM lệch với schema mà migration tạo ra"
  meaning_vi: "starci app db drift áp db/bootstrap.sql và mọi migration vào một cơ sở dữ liệu tạm, rồi so từng cột entity với schema đó: bảng hoặc cột không tồn tại, kiểu khác nhau sau khi chuẩn hóa theo tên của PostgreSQL, hoặc khả năng nhận NULL khác nhau."
  causes_vi:
    - "Vi phạm R333: entity được sửa mà không có migration tương ứng, hoặc migration đổi bảng mà entity chưa theo kịp."
    - "Entity khai báo sai kiểu (ví dụ timestamp thay vì timestamptz) hoặc quên nullable cho một cột cho phép NULL."
  nextStep_vi: "Viết migration mới trong db/migrations để schema có đúng cột đó, hoặc sửa entity cho khớp schema hiện tại, rồi chạy lại starci app db drift cho đến khi xanh."
  owner: op-retry
  kind: check-finding

BE_AUTH_PASSPORT_OWNER:
  title: "An identity library is imported outside integrations/passport"
  title_vi: "Thư viện định danh bị import ngoài integrations/passport"
  meaning_vi: "File `<path>` import @nestjs/passport, passport, passport-google-oauth20, passport-local, @nestjs/jwt, jose hoặc bcryptjs mà không thuộc `be.integrations.passport`, hoặc import bcrypt hay client Supabase."
  causes_vi:
    - "Vi phạm R328: chỉ integration passport sở hữu chiến lược Google, đăng nhập email/mật khẩu và token riêng của app."
  nextStep_vi: "Chuyển mã vào `src/modules/integrations/passport/` và gọi qua API công khai của integration; dùng bcryptjs thay bcrypt, bỏ client Supabase."
  owner: op-retry
  kind: check-finding

BE_AUTH_JWT_OWN_JWKS:
  title: "A lite principal is not built from the app own verified access token"
  title_vi: "Principal của app lite không đến từ access token riêng đã xác minh"
  meaning_vi: "`<path>` gọi jwtVerify ngoài integrations/passport, xác minh với createRemoteJWKSet thay vì key set riêng (createLocalJWKSet), thiếu issuer/audience/algorithms, decode token không xác minh hoặc đọc role/membership từ request body."
  causes_vi:
    - "Vi phạm R329: principal chỉ đến từ token do chính app ký và xác minh bằng JWKS riêng."
  nextStep_vi: "Dùng `createTokenKit` của integrations/passport (jwtVerify trên createLocalJWKSet, pin issuer/audience/algorithms) và để domain/identity dựng principal từ kết quả đó."
  owner: op-retry
  kind: check-finding

BE_AUTH_REFRESH_COOKIE:
  title: "A refresh token leaves the httpOnly cookie"
  title_vi: "Refresh token rời khỏi cookie httpOnly"
  meaning_vi: "`<path>` đặt cookie refresh thiếu httpOnly, secure, sameSite strict hoặc path của cửa refresh, hoặc đưa refresh token vào body của request/response."
  causes_vi:
    - "Vi phạm R330: refresh token chỉ sống trong cookie httpOnly Secure SameSite=Strict và được xoay vòng mỗi lần dùng."
  nextStep_vi: "Đặt và xoá cookie qua `setRefreshCookie`/`clearRefreshCookie` của integrations/passport; bỏ trường refreshToken khỏi DTO và kết quả trả về."
  owner: op-retry
  kind: check-finding

BE_STORAGE_OWNER:
  title: "An S3 SDK is imported outside integrations/object-storage"
  title_vi: "S3 SDK bị import ngoài integrations/object-storage"
  meaning_vi: "File `<path>` import @aws-sdk/client-s3 hoặc @aws-sdk/s3-request-presigner ngoài `be.integrations.object-storage`, hoặc import minio."
  causes_vi:
    - "Vi phạm R331: chỉ integration storage sở hữu client S3 (MinIO trong lite) và URL presigned."
  nextStep_vi: "Gọi port ObjectStorage của integrations/object-storage (presignPut, presignGet, remove); bỏ minio."
  owner: op-retry
  kind: check-finding

LITE_DB_MIGRATION:
  title: "A lite schema change lives outside db/migrations"
  title_vi: "Thay đổi schema của app lite nằm ngoài db/migrations"
  meaning_vi: "`<path>` là tệp của thư mục supabase/ hoặc một tệp SQL ngoài db/ (trừ seed của .starcistacks)."
  causes_vi:
    - "Vi phạm R332: schema của app lite chỉ nằm trong db/migrations/<ts14>_<kebab>.sql, archive và seed trong db/."
  nextStep_vi: "Chuyển migration sang db/migrations (giữ nguyên stamp), seed sang db/seed.sql, types sang db/types/; xoá supabase/."
  owner: op-retry
  kind: check-finding

BE_PERSISTENCE_NO_RAW_SQL:
  title: "Lite domain code runs raw SQL instead of TypeORM entities"
  title_vi: "Mã domain của app lite chạy SQL thô thay vì entity TypeORM"
  meaning_vi: "File `<path>` gọi `.query(` hoặc dùng template `sql` ngoài platform/database và ngoài danh sách hàm ruleParams.be.lite.rawSqlFunctions."
  causes_vi:
    - "Vi phạm R334: dữ liệu của app lite đi qua entity TypeORM trên EntityManager (find, save, update, upsert, createQueryBuilder)."
  nextStep_vi: "Khai entity ở persistence/entities/<table>.entity.ts và đọc/ghi bằng EntityManager hoặc createQueryBuilder với tham số có tên; hàm pg/SECURITY DEFINER không diễn đạt được thì khai vào rawSqlFunctions kèm lý do."
  owner: op-retry
  kind: check-finding

BE_JOBS_SCHEDULER_OWNER:
  title: "A schedule outside the platform/jobs tick scheduler"
  title_vi: "Lịch chạy định kỳ nằm ngoài bộ lập lịch tick của platform/jobs"
  meaning_vi: "File `<path>` import @nestjs/schedule hoặc cron ngoài job-tick.service.ts và jobs.module.ts của platform/jobs, dùng decorator Cron/Interval/Timeout, hoặc JobTickService không giữ advisoryXactLock và job_tick_claim trước khi ghi outbox."
  causes_vi:
    - "Vi phạm R335: việc định kỳ là tick của platform/jobs (JOB_TICKS), mỗi phút chỉ một replica enqueue nhờ khoá advisory và claim phút trong DB."
  nextStep_vi: "Khai tick vào JOB_TICKS của platform/jobs/job-ticks.contracts.ts (name, cron, timeZone UTC, queue, payload) và xoá lịch tự viết; giữ advisoryXactLock và job_tick_claim trong JobTickService."
  owner: op-retry
  kind: check-finding
