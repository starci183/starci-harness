schema: starci/schema@1
id: starci/application-stacks@1
title: Application stack declaration
description: >-
  Static, repository-owned inventory for reproducible environments. It declares intended topology,
  custody and runbook location; it is not evidence that a stack ran. This is the machine form of
  modules/schemas/stacks-layout.yaml's CONTENT half - the layout governs the TREE, this document governs the
  fields inside application-stacks.yaml. Runtime content rules require the applicable
  deployment declarations; optional schema fields preserve compatibility with older inventories.
type: object
additionalProperties: false
required: [schema, components, environments, k8s]
properties:
  schema: {type: string, minLength: 1}
  sides:
    description: >-
      The sides of the project (contexts/project/README.md PROJECT-1), each true or false; they equal the sides hfs.json declares, and no
      component runs an app of a side the project lacks (R399, STACKS_SIDES_DRIFT, STACKS_COMPONENT_SIDE).
    type: object
    additionalProperties: false
    required: [be, fe, packages]
    properties:
      be: {type: boolean}
      fe: {type: boolean}
      packages: {type: boolean}
  data:
    description: >-
      The project's data declaration (contexts/project/stacks.md PROJECT-STACKS-13, PROJECT-STACKS-14): the stores that must be kept (each
      with its adapter), the components rebuilt from a store (derived), and the data sets, each a seed-standard or a seed-backup with its
      destinations (R426 data-stores, R427 data-sets). Absent when the project has no stateful component.
    type: object
    additionalProperties: false
    properties:
      stores:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, kind, level, component, adapter]
          properties:
            id: {type: string, minLength: 1}
            kind: {type: string, enum: [database, storage]}
            level: {type: string, enum: [logical, physical]}
            component: {type: string, minLength: 1}
            adapter:
              type: object
              additionalProperties: false
              required: [module]
              properties:
                module: {type: string, minLength: 1}
                command:
                  description: >-
                    The argv, from the app root, of the app's own command that serves this store over the line protocol `starci/data-entries@1`
                    (`serveStore` of @starci/seed), which `starci app data` runs with the environment's custody. Required for a store of a
                    seed-backup set (R426).
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1}
      derived:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [component, rebuild]
          properties:
            component: {type: string, minLength: 1}
            from: {type: string, minLength: 1}
            rebuild: {type: string, minLength: 1}
      sets:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, purpose, stores, environments, to]
          properties:
            id: {type: string, minLength: 1}
            purpose: {type: string, enum: [seed-standard, seed-backup]}
            stores: {type: array, minItems: 1, items: {type: string, minLength: 1}}
            environments: {type: array, minItems: 1, items: {type: string, minLength: 1}}
            to:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [driver]
                properties:
                  driver: {type: string, enum: [git, s3]}
                  repository: {type: string, minLength: 1}
            commit: {type: string, pattern: '^[0-9a-f]{40}$'}
            force: {type: boolean}
            everyMinutes: {type: integer, minimum: 1}
            maxAgeMinutes: {type: integer, minimum: 1}
            completeness: {type: string, pattern: '^ext:.+'}
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [repository]
      properties:
        repository: {type: string, minLength: 1}
  components:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          description: >-
            Component classification, including service, stateful, observability, ingress, scheduler
            and job. Free text preserves older declarations.
          type: string
          minLength: 1
        image: {type: string, minLength: 1}
        app:
          description: Back-end app id whose composition the component runs.
          type: string
          minLength: 1
        compose: {type: string, minLength: 1}
        purpose: {type: string}
        required: {type: boolean}
        stateful: {type: boolean}
        database:
          description: A sidecar's declared database adapter and persistent volume.
          type: object
          additionalProperties: false
          required: [provider]
          properties:
            provider: {type: string, minLength: 1}
            volume: {type: string, minLength: 1}
        volumes:
          description: Named persistent volumes owned by this component.
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        mode: {enum: [service, replicated-job], default: service}
        scheduler:
          description: Component id of the declared scheduler that triggers a replicated-job.
          type: string
          minLength: 1
        schedule:
          description: Cron expression consumed by the declared scheduler.
          type: string
          minLength: 1
  release:
    description: Release gates of the app (starci app release gate and push); packages/hfs/release/gate.mjs is the authority for the fields.
    type: object
  database:
    description: 'Database cutover data (starci app db migrate, adopt and post-cutover; adopt: optional mapping with only legacyHistory, a list of the legacy history tables db adopt leaves out of its schema compare); packages/hfs/db/migrate.mjs is the authority for the fields. reset: optional mapping with only backupMaxAgeHours (finite positive number; default 24 hours).'
    type: object
  jobs:
    description: Application-owned schedules, bound to their back-end CLI commands.
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [schedule, command]
      properties:
        component: {type: string, minLength: 1}
        schedule: {type: string, minLength: 1}
        command: {type: string, minLength: 1}
  backing:
    description: >-
      The self-hosted database of an app: its db component (the image its managed .starcistacks/images/db/Dockerfile builds), a Docker container in
      development and a Swarm service in production. Every other dependency is a Docker component too.
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [provider, component]
      properties:
        provider: {const: postgres}
        component: {type: string, minLength: 1}
  environments:
    type: object
    minProperties: 1
    additionalProperties: {$ref: '#/$defs/environment'}
  k8s:
    type: object
    additionalProperties: false
    required: [status, reason]
    properties:
      status: {enum: [deferred, supported]}
      reason: {type: string, minLength: 1}
  tests:
    description: >-
      The world slots the integration and e2e runs of a back end declare (contexts/code/be/test.md BE-TEST-17): how many spec files of a kind run at
      once, each on a data slot of its own. A kind absent runs one file at a time. The test world provisions that many slots, from 1 to 8 (the
      library's slots are the same for every app).
    type: object
    additionalProperties: false
    properties:
      integration: {$ref: '#/$defs/testWorkers'}
      e2e: {$ref: '#/$defs/testWorkers'}
  ci: {$ref: '#/$defs/ciDeclaration'}
  gates:
    description: >-
      Quality gates this app does not run, on every branch and in every runner (starci app check in both envs, the managed pre-commit and pre-push hooks, the release gate and the rendered
      CI): per gate `{ run: off, reason }`, the reason mandatory. Every gate but hfs, secrets and db (the harness's own rules, never switched off) may be, and only those
      policy/loosening.yaml optionalGates lists. A gate left out runs; a gate whose reader stays on (test: coverage, codecov, sonar; lint: sonar; coverage: codecov) is refused. An off gate is reported as `off (declared: <reason>)`, never counted as passed. scripts/lib/stack-declaration.mjs
      readGateDeclarations judges it (HFS_GATE_DECLARATION_INVALID); a refused block switches nothing off.
    type: object
    additionalProperties: false
    properties:
      lint: {$ref: '#/$defs/gateOff'}
      format: {$ref: '#/$defs/gateOff'}
      sonar: {$ref: '#/$defs/gateOff'}
      codecov: {$ref: '#/$defs/gateOff'}
      test: {$ref: '#/$defs/gateOff'}
      coverage: {$ref: '#/$defs/gateOff'}
      types: {$ref: '#/$defs/gateOff'}
      build: {$ref: '#/$defs/gateOff'}
      audit: {$ref: '#/$defs/gateOff'}
      wiring: {$ref: '#/$defs/gateOff'}
      checks: {$ref: '#/$defs/gateOff'}
      deps: {$ref: '#/$defs/gateOff'}
  branches:
    description: >-
      Branch profiles: per branch, or per branch pattern (ui/*: a literal first segment, * any characters but /, never release/), the mode of each gate it names (blocking, report: run, print and record but never count, off: not run); a gate left
      out blocks. Only lint, sonar and codecov may be lowered, only on a branch policy/loosening.yaml branchProfiles allows, and the default branch is
      never declared, by name or by a pattern that matches it; scripts/lib/stack-declaration.mjs readBranchProfiles judges it (HFS_BRANCH_PROFILE_INVALID) and starci app check, the hooks and
      the rendered CI apply it.
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [gates]
      properties:
        gates:
          type: object
          additionalProperties: false
          properties:
            hfs: {$ref: '#/$defs/gateMode'}
            format: {$ref: '#/$defs/gateMode'}
            db: {$ref: '#/$defs/gateMode'}
            secrets: {$ref: '#/$defs/gateMode'}
            wiring: {$ref: '#/$defs/gateMode'}
            types: {$ref: '#/$defs/gateMode'}
            lint: {$ref: '#/$defs/gateMode'}
            test: {$ref: '#/$defs/gateMode'}
            sonar: {$ref: '#/$defs/gateMode'}
            codecov: {$ref: '#/$defs/gateMode'}
  operations:
    $ref: provision-operation.schema.yaml
  services:
    description: >-
      The delivery, quality and platform services this repository's code and CI use - NOT Compose
      services (those are `components`). One entry per service id from the closed catalog below; a
      service the repository does not use is still declared `mode: disabled` when its CI or config
      mentions it. Every product states these unambiguously so no Kernel or
      op misreads them and asks the owner again. Optional in this schema so older declarations
      stay loadable; scripts/gates/starcistacks.mjs requires it for a new repository or a
      new leg (contract change starcistacks-services) and reports its absence as a suspect with a
      planned follow-up everywhere else.
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      sonar: {$ref: '#/$defs/service'}
      codecov: {$ref: '#/$defs/service'}
      dependabot: {$ref: '#/$defs/serviceOptionalCi'}
      audit: {$ref: '#/$defs/serviceOptionalCi'}
      container-registry: {$ref: '#/$defs/service'}
      analytics: {$ref: '#/$defs/service'}
      error-tracking: {$ref: '#/$defs/service'}
$defs:
  testWorkers:
    type: object
    additionalProperties: false
    required: [workers]
    properties:
      workers: {type: integer, minimum: 1, maximum: 8}
  gateMode: {enum: [blocking, report, off]}
  gateOff:
    type: object
    additionalProperties: false
    required: [run, reason]
    properties:
      run: {const: off}
      reason: {type: string, minLength: 1}
  service:
    type: object
    additionalProperties: false
    required: [provider, mode, ci, ownerAction]
    properties:
      provider:
        description: >-
          Closed per service id (check-starcistacks.mjs PROVIDERS): sonar sonarqube|sonarcloud,
          container-registry ghcr|dockerhub|ecr|gar, analytics posthog|plausible|umami|google-analytics,
          error-tracking sentry|glitchtip.
        type: string
        minLength: 1
      mode:
        description: >-
          local - a server a stack runs (stack and host.local required); hosted - a SaaS or remote
          server (host.public required); disabled - not used (reason required, CI must not call it).
        enum: [local, hosted, disabled]
      organization: {type: string, minLength: 1}
      flag: {type: string, minLength: 1}
      target: {type: number, minimum: 0, maximum: 100}
      components: {enum: [auto]}
      required: {type: boolean}
      badgeToken:
        description: >-
          codecov and sonar only: a read-only, public-safe badge token (Codecov graphing token, Sonar project badge token)
          that the README badge of a private repository needs. It is public configuration rendered into README.md, never a
          secret; a CI token or any write credential never goes here.
        type: string
        pattern: '^[A-Za-z0-9_-]{6,128}$'
      ecosystems: {type: array, items: {enum: [npm, docker, github-actions]}}
      schedule:
        type: object
        additionalProperties: false
        required: [interval]
        properties:
          interval: {enum: [daily, weekly, monthly]}
          day: {enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]}
          time: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
      groups:
        type: object
        additionalProperties: false
        properties:
          minorPatch: {enum: [grouped]}
          major: {enum: [per-package]}
      ignore: {type: array, items: {type: string}}
      security: {enum: [immediate]}
      level: {enum: [low, moderate, high, critical]}
      omitDev: {type: boolean}
      in: {type: array, items: {enum: [release-gate, ci]}}
      purpose: {type: string, minLength: 1}
      reason: {type: string, minLength: 1}
      qualityGate:
        description: >-
          sonar only: the name of the one quality gate the repository is held to. The thresholds are not restated
          here - knowledge/sonar-gate.yaml owns them and scripts/gates/starcistacks.mjs refuses any other name
          (STACKS_QUALITY_GATE_DRIFT).
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
      host:
        type: object
        additionalProperties: false
        properties:
          local: {type: string, pattern: '^https?://[^\s]+$'}
          public: {type: string, pattern: '^https://[^\s]+$'}
          fromCredential:
            description: A private connection URL carried inside a sealed credential - its credential id, never the value. Public local or hosted URLs use local or public.
            type: string
            pattern: '^[a-z][a-z0-9-]*$'
      stack: {$ref: '#/$defs/serviceStack'}
      auth:
        description: >-
          How a client authenticates - token (a credential in custody), oidc (GitHub OIDC, no stored
          secret), github-token (the workflow's automatic GITHUB_TOKEN, no stored secret), none.
        enum: [token, oidc, github-token, none]
      projects:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [repository, key]
          properties:
            repository: {type: string, pattern: '^[A-Za-z0-9._-]+$'}
            key: {type: string, minLength: 1}
            name: {type: string, minLength: 1}
      credentials:
        type: array
        items: {$ref: '#/$defs/serviceCredential'}
      runtimeSecrets:
        description: >-
          An app that lives inside the runtime repository (an example) holds no custody: it names the variables of the runtime's untracked
          .claude/secret.env it reads (and, in CI, the repository secret or variable of the same name). A product declares credentials instead;
          scripts/gates/starcistacks.mjs refuses each form for the other kind (STACKS_EXAMPLE_FORM, STACKS_PRODUCT_FORM).
        type: array
        minItems: 1
        items: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
      ci: {$ref: '#/$defs/serviceCi'}
      ownerAction:
        description: >-
          none - nothing about this service is ever asked of the owner (the default and the only
          value allowed while every credential is in custody). Otherwise the one thing only the owner
          can give, named exactly.
        anyOf:
          - {const: none}
          - type: object
            additionalProperties: false
            required: [needed, reason]
            properties:
              needed: {type: string, minLength: 1}
              reason: {type: string, minLength: 1}
  serviceOptionalCi:
    type: object
    additionalProperties: false
    required: [provider, mode, ownerAction]
    properties:
      provider: {$ref: '#/$defs/service/properties/provider'}
      mode: {$ref: '#/$defs/service/properties/mode'}
      organization: {$ref: '#/$defs/service/properties/organization'}
      target: {$ref: '#/$defs/service/properties/target'}
      components: {$ref: '#/$defs/service/properties/components'}
      required: {$ref: '#/$defs/service/properties/required'}
      ecosystems: {$ref: '#/$defs/service/properties/ecosystems'}
      schedule: {$ref: '#/$defs/service/properties/schedule'}
      groups: {$ref: '#/$defs/service/properties/groups'}
      ignore: {$ref: '#/$defs/service/properties/ignore'}
      security: {$ref: '#/$defs/service/properties/security'}
      level: {$ref: '#/$defs/service/properties/level'}
      omitDev: {$ref: '#/$defs/service/properties/omitDev'}
      in: {$ref: '#/$defs/service/properties/in'}
      purpose: {$ref: '#/$defs/service/properties/purpose'}
      reason: {$ref: '#/$defs/service/properties/reason'}
      qualityGate: {$ref: '#/$defs/service/properties/qualityGate'}
      host: {$ref: '#/$defs/service/properties/host'}
      stack: {$ref: '#/$defs/service/properties/stack'}
      auth: {$ref: '#/$defs/service/properties/auth'}
      projects: {$ref: '#/$defs/service/properties/projects'}
      credentials: {$ref: '#/$defs/service/properties/credentials'}
      runtimeSecrets: {$ref: '#/$defs/service/properties/runtimeSecrets'}
      ci: {$ref: '#/$defs/service/properties/ci'}
      ownerAction: {$ref: '#/$defs/service/properties/ownerAction'}
  ciName: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
  ciDeclaration:
    type: object
    additionalProperties: false
    properties:
      github:
        type: object
        additionalProperties: false
        required: [repository]
        properties:
          repository: {type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'}
          defaultBranch: {type: string, minLength: 1, default: main}
          workflow: {type: string, pattern: '^[A-Za-z0-9_.-]+\.ya?ml$', default: ci.yml}
          visibility:
            description: The GitHub repository visibility; private READMEs need services.<id>.badgeToken for live badges. Omitted means unknown.
            enum: [public, private]
      secrets: {type: array, items: {$ref: '#/$defs/ciSecret'}}
      vars: {type: array, items: {$ref: '#/$defs/ciVariable'}}
      imageCache:
        description: >-
          Where the images job keeps its BuildKit layer cache: gha (default, the repository's GitHub Actions cache, one scope per image) or registry (a buildcache tag
          beside the image in the registry, for images large enough to be evicted from the 10 GB Actions cache).
        enum: [gha, registry]
        default: gha
      imageBuilder:
        description: >-
          Where the images job builds: runner (default, the GitHub-hosted runner's own builder) or remote (the rootless BuildKit of a managed VPS,
          reached over ssh with the repository secrets STARCI_BUILDER_SSH_KEY, STARCI_BUILDER_HOST and STARCI_BUILDER_KNOWN_HOSTS that
          `starci vps build-key add` sets; when they are absent or the builder does not answer, the job builds on the runner). A build for
          another architecture than linux/amd64 stays on the runner.
        enum: [runner, remote]
        default: runner
      jobs:
        description: >-
          Per-job settings of the managed CI (the CI standard, knowledge/hfs/ci-standard.yaml defaults): timeoutMinutes per job and the number of unit-run shards.
          Omitted settings take the standard's defaults; starci app sync renders them.
        type: object
        additionalProperties: false
        properties:
          fast: {$ref: '#/$defs/ciJob'}
          lint: {$ref: '#/$defs/ciJob'}
          test:
            type: object
            additionalProperties: false
            properties:
              timeoutMinutes: {type: integer, minimum: 5, maximum: 360}
              shards: {type: integer, minimum: 1, maximum: 20}
          coverage: {$ref: '#/$defs/ciJob'}
          build: {$ref: '#/$defs/ciJob'}
          sonar: {$ref: '#/$defs/ciJob'}
          db-types: {$ref: '#/$defs/ciJob'}
      dependabot:
        type: object
        additionalProperties: false
        properties:
          secrets:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {$ref: '#/$defs/ciName'}
                purpose: {type: string}
  ciJob:
    type: object
    additionalProperties: false
    properties:
      timeoutMinutes: {type: integer, minimum: 5, maximum: 360}
  ciSecret:
    anyOf:
      - type: object
        additionalProperties: false
        required: [name, scope]
        properties:
          name: {$ref: '#/$defs/ciName'}
          scope: {const: repository}
          purpose: {type: string}
          optional: {type: boolean}
      - type: object
        additionalProperties: false
        required: [name, scope, environment]
        properties:
          name: {$ref: '#/$defs/ciName'}
          scope: {const: environment}
          environment: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
          purpose: {type: string}
          optional: {type: boolean}
  ciVariable:
    description: >-
      A public CI variable either carries its literal value, or declares ownerValue true (no value) when only the owner
      may supply it; var sync skips an owner-supplied value and ci verify checks that it exists by name.
    anyOf:
      - type: object
        additionalProperties: false
        required: [name, scope, value]
        properties:
          name: {$ref: '#/$defs/ciName'}
          scope: {const: repository}
          value: {type: string}
          purpose: {type: string}
          optional: {type: boolean}
      - type: object
        additionalProperties: false
        required: [name, scope, value, environment]
        properties:
          name: {$ref: '#/$defs/ciName'}
          scope: {const: environment}
          environment: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
          value: {type: string}
          purpose: {type: string}
          optional: {type: boolean}
      - type: object
        additionalProperties: false
        required: [name, scope, ownerValue]
        properties:
          name: {$ref: '#/$defs/ciName'}
          scope: {const: repository}
          ownerValue: {const: true}
          purpose: {type: string}
          optional: {type: boolean}
      - type: object
        additionalProperties: false
        required: [name, scope, ownerValue, environment]
        properties:
          name: {$ref: '#/$defs/ciName'}
          scope: {const: environment}
          environment: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
          ownerValue: {const: true}
          purpose: {type: string}
          optional: {type: boolean}
  serviceStack:
    description: >-
      Which stack defines a local service - either a project-owned .starcistacks stack
      ({repository, root: .starcistacks, environment, compose}) or a host-owned runtime
      extension ({owner: host, root: .claude/ext/<service>, environment, compose}).
    anyOf:
      - $ref: '#/$defs/serviceStackProject'
      - $ref: '#/$defs/serviceStackHost'
  serviceStackProject:
    description: A local service one repository's own .starcistacks runs.
    type: object
    additionalProperties: false
    required: [repository, root, environment, compose]
    properties:
      repository: {type: string, pattern: '^[A-Za-z0-9._-]+$'}
      root: {const: .starcistacks}
      environment: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      compose: {type: string, minLength: 1}
      container: {type: string, minLength: 1}
      publishedBy: {type: string, minLength: 1}
  serviceStackHost:
    description: >-
      A shared service the host's installed .claude tree runs once for every routed project
      (SonarQube at .claude/ext/sonar). `root` is a path inside the runtime tree; `environment`
      names the environment slot the extension serves and is not a path segment - the Compose
      file resolves at <root>/<compose>. The runtime tree carries the extension, so no
      repository is named.
    type: object
    additionalProperties: false
    required: [owner, root, environment, compose]
    properties:
      owner: {const: host}
      root: {type: string, pattern: '^\.claude/ext/[a-z][a-z0-9-]*$'}
      environment: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      compose: {type: string, minLength: 1}
      container: {type: string, minLength: 1}
      publishedBy: {type: string, minLength: 1}
  serviceCredential:
    description: >-
      A name-only connection or credential reference: its repository, actual sealed member path and key.
      env names the consuming tool's variable. project references projects[].key for project-scoped tooling;
      ids identify references independently of provider project-key syntax. Username, password and private
      endpoint keys use separate references; operator/admin login lives in a separate authority member and
      is never an implicit scanner or CI credential. Product Sonar analysis names exactly
      .starcistacks/<declared-env>/secrets/sonar.enc.yaml; ci-declaration.mjs enforces that service-specific member.
      Legacy plaintext paths with .enc twins require migration.
    type: object
    additionalProperties: false
    required: [id, custody]
    properties:
      id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      project: {type: string, minLength: 1, description: "The exact projects[].key this credential serves; execution selects the entry by the actual consumer repository."}
      purpose: {type: string, minLength: 1}
      env: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
      key: {type: string, minLength: 1}
      custody:
        type: object
        additionalProperties: false
        required: [repository, path]
        properties:
          repository: {type: string, pattern: '^[A-Za-z0-9._-]+$'}
          path: {type: string, pattern: '^(\.starcistacks/[a-z][a-z0-9-]*/(runtime/files|runtime/env|secrets)/[^\s]+|\.claude/ext/[a-z][a-z0-9-]*/secrets/[^\s]+)$'}
  serviceCi:
    description: >-
      How GitHub CI gets the service. wiring required - CI calls it now and the named secrets and
      variables must exist; optional-follow-up - CI may call it, and a Kernel (never the owner) sets
      the secrets and variables from custody when it chooses to; not-used - CI does not call it.
    type: object
    additionalProperties: false
    required: [wiring]
    properties:
      token: {$ref: '#/$defs/ciName'}
      hostVar: {$ref: '#/$defs/ciName'}
      organizationVar: {$ref: '#/$defs/ciName'}
      wiring: {enum: [required, optional-follow-up, not-used]}
      workflow: {type: string, minLength: 1}
      permissions: {type: array, items: {type: string, minLength: 1}}
      secrets:
        description: Explicit credential-to-CI execution-copy links; names are declared in the top-level ci block. ci.token selects the analysis copy.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, credential]
          properties:
            name: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
            credential: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      provisioning: {type: string, minLength: 1}
  environment:
    type: object
    additionalProperties: false
    required: [status, runtime, composeFiles, components, runbook, secrets]
    properties:
      short:
        description: >-
          The environment's short name, the `<env>` of its seed-backup repository `<name>-seed-backup-<env>` (PROJECT-STACKS-13) and what `{env}` in
          a repository template becomes: lowercase kebab, at most 12 characters, unique across the environments. Absent, the environment's name is used.
        type: string
        maxLength: 12
        pattern: '^[a-z][a-z0-9-]*$'
      status: {const: supported}
      cutover:
        description: >-
          Optional: this environment still runs the previous release and waits for the owner's cutover while the branch already carries the
          code of the next shape (contexts/project/stacks.md PROJECT-STACKS-20). `starci app check` reports, for this environment alone, the
          findings of the codes modules/kernel/failure-codes.yaml marks `cutoverTolerant` (a sealed member not created yet, a kept old member
          nobody reads, the rendered stack of the old shape) and lists them in its own section; every other finding still blocks. `stack deploy`
          in every form and `stack prepare --execute` refuse the environment (STACK_CUTOVER_PENDING) while the block is present. A past `until`
          is the blocking HFS_CUTOVER_EXPIRED. The cutover runbook removes the block as its last step. scripts/lib/stack-cutover.mjs
          readCutoverDeclarations judges it (HFS_CUTOVER_DECLARATION_INVALID).
        type: object
        additionalProperties: false
        required: [state, reason, until]
        properties:
          state: {const: pending}
          reason: {type: string, minLength: 1}
          until:
            description: The date the cutover is due, YYYY-MM-DD (UTC); the declaration holds through that day.
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          keep:
            description: The old sealed members kept for rollback, `<member>` or `<member>/<KEY>`; their unread keys are reported, not blocking.
            type: array
            uniqueItems: true
            items: {type: string, pattern: '^[a-z0-9][a-z0-9._-]*(?:/[A-Za-z_][A-Za-z0-9_]*)?$'}
      runtime: {enum: [docker-compose, docker-swarm]}
      composeFiles: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      renderedModel:
        description: Tracked rendered model relative to .starcistacks/<environment>, such as infra/swarm/rendered.yaml.
        type: string
        minLength: 1
      components:
        type: object
        additionalProperties:
          type: object
          additionalProperties: {type: number}
      runbook: {type: string, minLength: 1}
      secrets: {type: array, items: {$ref: '#/$defs/secret'}}
      deploy: {$ref: '#/$defs/deploy'}
      local:
        description: >-
          The dev declaration `starci app stack up|down|doctor|prepare|status|logs|verify` runs for a docker-compose environment (PROJECT-STACKS-6):
          ports, compose services, the environment's own database role, dev-only custody to generate once, setup and seed commands, native app
          processes, readiness and verification probes. Names, ports and argv lists only, never a value. The authority is scripts/hfs/stack-local-config.mjs; rule R340 judges it.
          `basePort` (a whole port, 1024 to 65436) is the project base port: the native process ports follow the role table of scripts/hfs/stack-base-port.mjs
          (front end base, api base+1, AI gateway base+2, the rest above, all within base..base+99; rule R389).
          `tunnel` ({name, routes: [{name, host, port}]}) names the machine's locally managed named tunnel and the public hosts it routes to declared ports (a route named `gallery` with port `gallery` publishes the screenshot gallery on its derived port, base + 50: PROJECT-GALLERY-1 item 4); a `services[]` entry of `kind: object-store` (with an optional `console` port) is an S3 store whose S3 port must be routed there, and its processes set `STORAGE_PUBLIC_URL` to that host (PROJECT-STACKS-15; rule R428).
        type: object
      ingress:
        description: "The one selected ingress component and the hosts it routes (the own ingress, kind own), or external with the stack name when the ingress is a shared stack outside this one (then no component), or kind shared-edge: a shared edge Traefik whose router labels this stack's deploy renders from `routes` (no hostname in the stack file; rule R275 judges which form is declared)."
        type: object
        additionalProperties: false
        properties:
          kind:
            description: "own (default): this stack's ingress component, hosts in its labels or config. shared-edge: a shared edge-traefik outside the stack; the hosts are declared once, in routes, and the stack deploy renders the Traefik labels (router rule Host(...), entrypoint, tls certresolver, service port) and joins the edge network."
            enum: [own, shared-edge]
          network:
            description: "shared-edge: the overlay network the edge-traefik reaches the routed services on (an external network of the stack)."
            type: string
            minLength: 1
          certResolver:
            description: "shared-edge: the certificate resolver of the edge-traefik that issues each route's certificate."
            type: string
            minLength: 1
          entrypoint:
            description: "shared-edge: the edge-traefik entrypoint the routers listen on (default websecure)."
            type: string
            minLength: 1
          routes:
            description: "shared-edge: one entry per public host: the stack service that serves it and the port that service listens on. Several hosts of one service and port share one router."
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [host, service, port]
              properties:
                host: {type: string, minLength: 1}
                service: {type: string, minLength: 1}
                port: {type: integer, minimum: 1, maximum: 65535}
                paths:
                  description: "shared-edge: exact paths this route serves on the host (Path(...)); with pathPrefixes it makes the route a path route."
                  type: array
                  items: {type: string, pattern: '^/'}
                pathPrefixes:
                  description: "shared-edge: path prefixes this route serves on the host (PathPrefix(...))."
                  type: array
                  items: {type: string, pattern: '^/'}
                priority:
                  description: "shared-edge: the explicit Traefik router priority of this route (a path route that must win over the host's catch-all route)."
                  type: integer
          component: {type: string, minLength: 1}
          external:
            description: "The shared ingress stack (its own docker stack) that serves the hosts; this stack renders no ingress and publishes no port."
            type: object
            additionalProperties: false
            required: [stack]
            properties:
              stack: {type: string, minLength: 1}
          hosts:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, minLength: 1}
      monitoring:
        description: >-
          Optional, docker-swarm only: this environment opts in to the shared monitoring stack of its server (contexts/project/monitoring.md).
          Absent, the stack renders exactly as without it. Present, `starci app stack render` puts the scrape labels on each service of
          `metrics` and of a scraped exporter, adds the exporter sidecars, puts the probe labels on the ingress, sets the trace and profile
          endpoints, joins those services to the external monitoring `network`, and with `logs` (default true) labels every service of the
          stack so the server's log collector keeps its logs, except the `logPush` services, which push their own lines to Loki.
        type: object
        additionalProperties: false
        properties:
          network:
            description: "The external attachable overlay network the shared Prometheus scrapes on (default starci-monitor, ops/vps.yaml monitor.network)."
            type: string
            pattern: '^[a-z][a-z0-9_-]*$'
          logs:
            description: "Whether the server's collector keeps the logs of every service of this stack (default true); a logPush service is left out."
            type: boolean
          logPush:
            description: >-
              The services that push their own log lines to the server's Loki through the Winston adapter of platform/logging
              (contexts/code/be/logging.md BE-LOGGING-1): the render sets LOKI_URL, LOKI_APP, LOKI_ENV and LOKI_SERVICE on each, joins it to the
              monitoring network and leaves it out of `logs`, so its lines reach Loki once.
            type: array
            items: {type: string, minLength: 1}
          metrics:
            description: "One entry per stack service that serves Prometheus metrics: the port it listens on inside the stack and the path (default /metrics)."
            type: array
            items:
              type: object
              additionalProperties: false
              required: [service, port]
              properties:
                service: {type: string, minLength: 1}
                port: {type: integer, minimum: 1, maximum: 65535}
                path: {type: string, pattern: '^/[^\s]*$'}
          probes:
            description: "The URLs the server's blackbox component probes (uptime, TLS, certificate expiry), at most 10: false for none; absent, https://<host>/ of every ingress host of this environment."
            anyOf:
              - {type: boolean, const: false}
              - {type: array, items: {type: string, pattern: '^https?://\S+$'}}
          exporters:
            description: >-
              One entry per backing service to measure. postgres and redis run an exporter sidecar beside the service (postgres reads the
              sealed password of a read-only monitoring role, `password: {member, key}`; service defaults to the backing postgres component);
              minio, qdrant, kafka-connect (the JMX exporter agent in its image) and ingress (Caddy's or Traefik's own metrics) are scraped on the
              service itself, at their default port and path unless given.
            type: array
            items:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: {enum: [postgres, redis, minio, qdrant, kafka-connect, ingress]}
                service: {type: string, minLength: 1}
                port: {type: integer, minimum: 1, maximum: 65535}
                path: {type: string, pattern: '^/[^\s]*$'}
                database: {type: string, minLength: 1}
                user: {type: string, minLength: 1}
                password:
                  type: object
                  additionalProperties: false
                  required: [member, key]
                  properties:
                    member: {type: string, minLength: 1}
                    key: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
          traces:
            description: "The services that send OpenTelemetry traces to the server's Alloy (Tempo on): true for every metrics service, or a list; the render sets OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_SERVICE_NAME."
            anyOf:
              - {type: boolean}
              - {type: array, items: {type: string, minLength: 1}}
          profiles:
            description: "The services that push profiles to the server's Pyroscope: true for every metrics service, or a list; the render sets PYROSCOPE_SERVER_ADDRESS and PYROSCOPE_APPLICATION_NAME."
            anyOf:
              - {type: boolean}
              - {type: array, items: {type: string, minLength: 1}}
          alerts:
            description: >-
              Where the server's Alertmanager sends this environment's alerts (contexts/project/monitoring.md PROJECT-MONITORING-5): the app's own
              Telegram bot, never the harness bot. `telegram.member` is the sealed member (sealed like every member of the environment: its server,
              backup and CI recipients) holding ALERTS_TELEGRAM_BOT_TOKEN and ALERTS_TELEGRAM_CHAT_ID (`starci app alerts discover-chat` seals the
              chat). Absent, the alerts of this environment are held behind a null receiver.
            type: object
            additionalProperties: false
            properties:
              telegram:
                type: object
                additionalProperties: false
                required: [member]
                properties:
                  member: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
      services:
        description: >-
          Optional, docker-swarm only: the shared services of the server this environment calls (contexts/project/shared-services.md), each deployed
          once per server by `starci vps service up <id> --service <name>`. Absent, the stack renders exactly as without it. Present, `starci app stack
          render` joins each consumer to the service's external network, sets its URL variable, and grants it the sealed key the service's gate checks
          (`<KEY>_FILE`). A key whose member is not sealed yet renders without it and is reported (STACKS_SEALED_MEMBER_PENDING) unless `required: true`.
        type: object
        additionalProperties: false
        properties:
          embeddings:
            description: "The server's one embeddings server (qwen3-embedding:4b, 2560 dimensions, on CPU behind a bearer-token gate): EMBEDDINGS_BASE_URL=http://embeddings-gate:8080/v1 on the network starci-embeddings."
            type: object
            additionalProperties: false
            required: [member]
            properties:
              member:
                description: "The sealed member of this environment that holds the gate's key (`starci vps service grant <id> --service embeddings --app . --env <env> --member <member> --execute` seals it)."
                type: string
                pattern: '^[a-z][a-z0-9-]*$'
              key: {description: "The key of the member (default EMBEDDINGS_API_KEY); the consumers read it through <KEY>_FILE.", type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
              consumers:
                description: "The stack services that call it (default: the services of deploy.images, the app's own images)."
                type: array
                minItems: 1
                items: {type: string, minLength: 1}
              required: {description: "true refuses the render while the member is not sealed; default false renders without the key and reports it.", type: boolean}
              network: {description: "The external network the gate answers on (default starci-embeddings, the catalog's network).", type: string, pattern: '^[a-z][a-z0-9_-]*$'}
              url: {description: "The URL the consumers call (default http://embeddings-gate:8080/v1).", type: string, pattern: '^https?://\S+$'}
              urlEnv: {description: "The variable the URL is set in (default EMBEDDINGS_BASE_URL).", type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
      hostServices:
        description: >-
          Optional: the host services this environment needs (the harness's ops/host-roles.yaml, contexts/harness/host.md "What an app needs"),
          judged by the starci CLI against the owner host's own config.yaml (the machines are never in a repository). `starci app check --env prod`
          and `starci app stack deploy` refuse HOST_SERVICE_MISSING when no machine of a need's list hosts the service, HOST_ROLE_MISSING when the
          server the environment lands on lacks the app-host role, and HOST_MACHINE_UNKNOWN when config.yaml does not know it; a host with no
          config.yaml (a CI runner) reports the judgement skipped. The render ignores this block.
        type: object
        additionalProperties: false
        required: [needs]
        properties:
          machine:
            description: "The machine the environment lands on; default the server its deploy.remote.serverRecipient belongs to (the harness ops/vps/recipients.yaml), else local."
            type: string
            pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$'
          needs:
            description: "Each host service (`<role>.<service>` such as starci.embed, or a bare name the catalog holds once such as embed) and the machines that may serve it, in the order the app tries them (`[local, sv-hk-1]`: the owner's PC first, the VPS as fallback); [] is the landing machine alone."
            type: object
            minProperties: 1
            additionalProperties:
              type: array
              items: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$'}
      dns:
        description: Owner-run DNS prerequisites, one declaration per ingress host.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [host, owner, receipt]
          properties:
            host: {type: string, minLength: 1}
            owner: {type: string, minLength: 1}
            receipt: {type: string, minLength: 1}
      tls:
        description: Ownership and receipt for TLS issuance and persistent certificate custody.
        type: object
        additionalProperties: false
        required: [owner, receipt]
        properties:
          owner: {type: string, minLength: 1}
          receipt: {type: string, minLength: 1}
      release:
        description: Immutable image inventory, active and previous release pointers, and health assertions.
        type: object
        additionalProperties: false
        required: [imagesLock, pointer, previous, healthAssertions]
        properties:
          imagesLock: {type: string, minLength: 1}
          pointer: {type: string, minLength: 1}
          previous: {type: string, minLength: 1}
          healthAssertions:
            type: array
            minItems: 1
            items: {type: string, minLength: 1}
      backup:
        description: Backup ownership and restore evidence for each stateful component.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [component, target, retention, owner, restoreProof]
          properties:
            component: {type: string, minLength: 1}
            target: {type: string, minLength: 1}
            retention: {type: string, minLength: 1}
            owner: {type: string, minLength: 1}
            restoreProof: {type: string, minLength: 1}
  deploy:
    description: >-
      The Swarm deploy configuration `starci app stack` verbs read (optional; rule R294 judges it). It holds names, paths and shapes
      only, never a value: sealed members and keys are references into .starcistacks/<environment>/secrets. The authority is
      scripts/hfs/stack-deploy-config.mjs, which normalises exactly this shape (service, volume and member names, paths
      inside the environment directory and the existence of the files they name are checked there, not here).
    type: object
    additionalProperties: false
    properties:
      stack: {$ref: '#/$defs/deployName'}
      remote: {$ref: '#/$defs/deployRemote'}
      images:
        description: Service -> the image the deploy injects; the managed workflow builds one per entry.
        type: object
        propertyNames: {$ref: '#/$defs/deployName'}
        additionalProperties: {$ref: '#/$defs/deployImage'}
      volumes:
        description: External volumes prepare creates (with --execute) and checks (dry run).
        type: array
        items: {$ref: '#/$defs/deployVolumeName'}
      secrets: {$ref: '#/$defs/deploySecrets'}
      environment:
        description: Service -> plain environment merged into the generated override.
        type: object
        additionalProperties: {$ref: '#/$defs/deployServiceEnvironment'}
      configs:
        description: Non-secret files mounted into services, versioned by content digest; config names are unique (checked by the normaliser).
        type: array
        items: {$ref: '#/$defs/deployConfig'}
      passEnv:
        description: Host variable names interpolated into the rendered stack (names only).
        type: array
        items: {$ref: '#/$defs/deployKey'}
      auto:
        description: >-
          true: every release tag whose CI is green deploys to this environment by itself, in the order the environments are declared (the owner's yes, given once by this setting).
          The variable STARCI_DEPLOY_PAUSED=true on the GitHub Environment stops it without a code change. Default false (a manual dispatch deploys).
        type: boolean
        default: false
      approval:
        description: >-
          none (default): the pipeline deploys without a human step. reviewers: the GitHub Environment has required reviewers (a public repository or Enterprise; Free, Pro and Team
          private repositories cannot set them), which the owner configures on the environment.
        enum: [none, reviewers]
        default: none
      custody:
        description: >-
          Where the deploy jobs of stack-deploy.yml find the key that opens this environment's members. environment (default): the jobs are bound to the GitHub
          Environment of this name and read its SOPS_AGE_KEY. ci-key: for a private repository on a plan without Environments (Free); the jobs bind no Environment
          and read the repository secret SOPS_AGE_KEY, the app's own CI key (a recipient of the environment, never the server key), which any workflow on any ref
          of the repository can read. The guard is then the workflow allow-list, the release-tag check of the job (a v* tag that is the package version) and R251,
          which allows the unbound read only in stack-deploy.yml: the exposure the tag deploy already has with that key, weaker than an Environment's deployment-ref
          policy. approval reviewers needs environment; under ci-key the pause is the repository variable STARCI_DEPLOY_PAUSED_<ENV> (the name upper-cased, - as _).
        enum: [environment, ci-key]
        default: environment
      platforms:
        description: >-
          The platforms the images are built for. Default [linux/amd64], the architecture of the VPS; add linux/arm64 only when an environment declares a node of that architecture
          (the build then uses QEMU, and the release record keeps the index digest).
        type: array
        uniqueItems: true
        minItems: 1
        items: {enum: [linux/amd64, linux/arm64]}
      verify: {$ref: '#/$defs/deployVerify'}
      jobs: {$ref: '#/$defs/deployJobs'}
      tasks: {$ref: '#/$defs/deployTasks'}
      postDeploy:
        description: 'The release tasks (names declared under tasks) a deploy runs inside the running task of their service after convergence and before verification, in order; each command is an idempotent write, verification stays read-only.'
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^[a-z][a-z0-9-]{0,40}$'}
      backup: {$ref: '#/$defs/deployBackup'}
      notify: {$ref: '#/$defs/deployNotify'}
      registry: {$ref: '#/$defs/deployRegistry'}
      renamedFrom: {$ref: '#/$defs/deployRenamedFrom'}
      dbUpgrade: {$ref: '#/$defs/deployDbUpgrade'}
      ingress:
        description: The shared host ingress (stack-ingress-config.mjs is the authority for the fields; starci app check R294 judges them).
        type: object
  deployName:
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
  deployKey:
    type: string
    pattern: '^[A-Z][A-Z0-9_]*$'
  deployVolumeName:
    type: string
    pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
  deployTreePath:
    description: A relative path inside .starcistacks/<environment>/ (forward slashes, no .. segment).
    type: string
    pattern: '^(?!/)(?!.*\\)(?!(?:.*/)?\.\.(?:/|$)).+$'
  deployAbsolutePath:
    description: An absolute path on the host without .. segments.
    type: string
    pattern: '^/(?!.*\.\.)[A-Za-z0-9._/-]+$'
  deployKeyList:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/deployKey'}
  deployMemberKeys:
    description: A sealed member and the keys taken from it.
    type: object
    additionalProperties: false
    required: [member, keys]
    properties:
      member: {$ref: '#/$defs/deployName'}
      keys: {$ref: '#/$defs/deployKeyList'}
  deployRemote:
    type: object
    additionalProperties: false
    properties:
      host:
        description: ssh alias used for DOCKER_HOST=ssh://<host> and the release records (default vps).
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      releasesBase: {$ref: '#/$defs/deployAbsolutePath'}
      sealed:
        description: 'Owner-machine session for prepare and deploy: the one member of .starcistacks/<environment>/secrets holding VPS_HOST, VPS_USER, privateKey and knownHosts, and optionally VPS_PORT (default 22).'
        $ref: '#/$defs/deployName'
      serverRecipient:
        description: The deploy server's public age recipient, recorded by starci app secret server-key --env <env> --execute.
        type: string
        pattern: '^age1[a-z0-9]+$'
  deployImage:
    type: object
    additionalProperties: false
    required: [app]
    properties:
      app: {$ref: '#/$defs/deployName'}
      buildArgs:
        description: Public build values (they reach the browser by design), literals and the public keys of a sealed member.
        type: object
        additionalProperties: false
        properties:
          values:
            type: object
            propertyNames: {$ref: '#/$defs/deployKey'}
            additionalProperties: {type: string}
          sealed: {$ref: '#/$defs/deployMemberKeys'}
      runtimePublicEnv:
        description: 'One image per sha: true keeps the NEXT_PUBLIC_* keys of buildArgs out of the build (images.yml, stack build-args) and the deploy passes them to this service as runtime environment, which the app reads through @starci/next-data publicEnv (window.__ENV). Default false: built in, as before.'
        type: boolean
  deploySecrets:
    type: object
    additionalProperties: false
    properties:
      grants:
        description: Which sealed keys become which Swarm secrets, granted to which services.
        type: array
        items: {$ref: '#/$defs/deployGrant'}
      settings:
        description: One sealed member and its keys, or a list of them (one per member); a key is named by one entry only.
        oneOf:
          - {$ref: '#/$defs/deployMemberKeys'}
          - {type: array, minItems: 1, items: {$ref: '#/$defs/deployMemberKeys'}}
  deployGrant:
    type: object
    additionalProperties: false
    required: [service, from]
    properties:
      service: {$ref: '#/$defs/deployName'}
      filePointers:
        description: Also set <KEY>_FILE=/run/secrets/<KEY> in the service environment.
        type: boolean
      from:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/deployGrantSource'}
  deployGrantSource:
    type: object
    additionalProperties: false
    required: [member]
    properties:
      member: {$ref: '#/$defs/deployName'}
      keys: {$ref: '#/$defs/deployKeyList'}
      required: {type: boolean}
      fill:
        description: Never override a key an earlier source of the same service gave.
        type: boolean
    if:
      required: [required]
      properties:
        required: {const: true}
    then:
      required: [keys]
  deployServiceEnvironment:
    type: object
    additionalProperties: false
    properties:
      files:
        description: KEY=VALUE files, relative to .starcistacks/<environment>/.
        type: array
        items: {$ref: '#/$defs/deployTreePath'}
      values:
        type: object
        propertyNames: {$ref: '#/$defs/deployKey'}
        additionalProperties: {type: string}
      settings:
        type: object
        propertyNames: {$ref: '#/$defs/deployKey'}
        additionalProperties: {$ref: '#/$defs/deploySetting'}
  deploySetting:
    type: object
    additionalProperties: false
    required: [key]
    properties:
      key: {$ref: '#/$defs/deployKey'}
      default: {description: 'A literal default: a string, number or boolean.'}
  deployConfig:
    type: object
    additionalProperties: false
    required: [name, file, env]
    properties:
      name: {$ref: '#/$defs/deployName'}
      file: {$ref: '#/$defs/deployTreePath'}
      env: {$ref: '#/$defs/deployKey'}
  deployVerify:
    type: object
    additionalProperties: false
    properties:
      http:
        type: array
        items: {$ref: '#/$defs/deployHttpCheck'}
      exec:
        type: array
        items: {$ref: '#/$defs/deployExecCheck'}
  deployHttpCheck:
    type: object
    additionalProperties: false
    required: [name, url]
    properties:
      name: {type: string, minLength: 1}
      url: {type: string, pattern: '^https?://[^\s]+$'}
      method: {enum: [GET, POST]}
      body: {type: string}
      status: {type: integer, minimum: 100, maximum: 599}
      json:
        description: Expected fields of the JSON response.
        type: object
      contains: {type: string}
      retry: {type: boolean}
  deployExecCheck:
    type: object
    additionalProperties: false
    required: [name, service, command]
    properties:
      name: {type: string, minLength: 1}
      service: {$ref: '#/$defs/deployName'}
      command: {$ref: '#/$defs/deployCommand'}
      stdout:
        description: Regular expression the standard output must match.
        type: string
  deployCommand:
    description: An argument vector run inside a task; every argument is a plain word (no shell syntax).
    type: array
    minItems: 1
    items:
      type: string
      pattern: '^[A-Za-z0-9_@%+=:,./-]+$'
  deployJobs:
    type: object
    additionalProperties: false
    required: [service, command]
    properties:
      service: {$ref: '#/$defs/deployName'}
      command: {$ref: '#/$defs/deployCommand'}
  deployTasks:
    description: One-off commands `starci app stack task <name>` runs inside a running task of the declared service.
    type: object
    propertyNames:
      pattern: '^[a-z][a-z0-9-]{0,40}$'
    additionalProperties:
      type: object
      additionalProperties: false
      required: [service, command]
      properties:
        service: {$ref: '#/$defs/deployName'}
        command: {$ref: '#/$defs/deployCommand'}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 3600, description: 'Seconds a post-deploy run of the task may take before the deploy fails and rolls back (default 600).'}
  deployBackup:
    type: object
    additionalProperties: false
    required: [image, volumes]
    properties:
      image:
        description: The tar helper image, pinned by a non-placeholder digest.
        type: string
        pattern: '^[a-z0-9./_-]+(?::[A-Za-z0-9._-]+)?@sha256:(?!0{64}$)[0-9a-f]{64}$'
      keepDays: {type: integer, minimum: 1, maximum: 3650}
      dir: {$ref: '#/$defs/deployAbsolutePath'}
      volumes:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/deployBackupVolume'}
  deployNotify:
    description: >-
      One webhook message per deploy outcome (accepted, rolled-back, rollback-failed, failed; `refused` only when listed): the outcome, the environment, the commit, the tag, the
      release and the attempt, as JSON with a `text` and a `content` line so a chat webhook shows it. Off unless declared. The URL is a sealed value of the environment
      (https only), never written here; a failing webhook is a line of the result and never fails the deploy.
    type: object
    additionalProperties: false
    required: [webhook]
    properties:
      webhook:
        type: object
        additionalProperties: false
        required: [member, key]
        properties:
          member: {$ref: '#/$defs/deployName'}
          key: {$ref: '#/$defs/deployKey'}
      on:
        type: array
        uniqueItems: true
        minItems: 1
        items: {enum: [accepted, rolled-back, rollback-failed, failed, refused]}
  deployRegistry:
    description: >-
      The image registry and the visibility the app's packages are meant to have. The canon scaffold writes `public`; the value then belongs to the app.
      While the effective value is `public`, `stack build --push` scans every image for secret material before the push and checks the real
      visibility afterwards. Omitted: ghcr.io and public.
    type: object
    additionalProperties: false
    properties:
      host: {type: string, pattern: '^[a-z0-9][a-z0-9.-]*(?::[0-9]{1,5})?$', default: ghcr.io}
      visibility: {enum: [public, private], default: public}
  deployRenamedFrom:
    description: >-
      The stack this environment's stack was renamed from (contexts/project/stacks.md PROJECT-STACKS-18). `stack deploy --adopt` takes over its copied
      data instead of a first start, `stack volume copy` copies each old volume into the new one, and `stack standby --renamed-from` / `stack resume
      --renamed-from` act on the old stack. Absent, the environment renders and deploys exactly as before. The normaliser checks that `stack` is not this
      environment's own stack and that every new volume is one of `volumes`.
    type: object
    additionalProperties: false
    required: [stack, volumes]
    properties:
      stack: {$ref: '#/$defs/deployName'}
      releasesBase:
        description: The old stack's release store on the manager (default /srv/<stack>); its last accepted release is the rollback target of the adopted first release.
        $ref: '#/$defs/deployAbsolutePath'
      volumes:
        description: New volume -> the old volume its data is copied from.
        type: object
        minProperties: 1
        propertyNames: {$ref: '#/$defs/deployVolumeName'}
        additionalProperties: {$ref: '#/$defs/deployVolumeName'}
  deployDbUpgrade:
    description: >-
      The database volume of a Postgres major upgrade that keeps the stack name (contexts/project/stacks.md PROJECT-STACKS-19). `stack db-upgrade`
      restores the old volume into the new one with the target major, and `stack deploy --adopt` then starts the database alone on it. The normaliser
      checks that the one new volume is one of `volumes` and differs from the old one. Absent, the environment renders and deploys exactly as before.
    type: object
    additionalProperties: false
    required: [volumes]
    properties:
      volumes:
        description: The new database volume -> the old volume it is restored from (exactly one pair).
        type: object
        minProperties: 1
        maxProperties: 1
        propertyNames: {$ref: '#/$defs/deployVolumeName'}
        additionalProperties: {$ref: '#/$defs/deployVolumeName'}
  deployBackupVolume:
    type: object
    additionalProperties: false
    required: [name, volume]
    properties:
      name: {$ref: '#/$defs/deployName'}
      volume: {$ref: '#/$defs/deployVolumeName'}
  secret:
    type: object
    additionalProperties: false
    required: [name, where, recipientPolicy, keyCustody]
    properties:
      name: {type: string, pattern: '^[a-z][a-z0-9.-]*$'}
      runtimeName:
        description: Immutable external Swarm secret name, ending in -v followed by its version.
        type: string
        pattern: '^[a-z][a-z0-9.-]*-v[1-9][0-9]*$'
      version:
        description: Positive version matching the immutable runtimeName suffix.
        anyOf:
          - {type: integer, minimum: 1}
          - {type: string, pattern: '^[1-9][0-9]*$'}
      where: {type: string, minLength: 1}
      member: {type: string, pattern: '^[a-z0-9][a-z0-9-]*$', description: "The provider member holding this key (`secrets/<member>`, the slug of where); with key, the entry declares one key of it."}
      key: {type: string, pattern: '^[A-Z][A-Z0-9_]*$', description: "The one key of the member this entry declares; materialized as its own file, read by the app as <KEY>_FILE."}
      keys:
        description: The keys a member groups on purpose (several providers in one member), declared in one entry instead of an entry per key; every one must be in the member's envelope.
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]*$'}
      recipientPolicy: {type: string, minLength: 1, description: "Which age recipients the envelope is encrypted to: its environment's rule of the app's managed .sops.yaml."}
      keyCustody: {type: string, minLength: 1, description: "Where the shared decrypting identity is held; docs/host-secrets.md owns host custody and its execution prerequisites."}
