# Rendered development model. App images and owner infrastructure must be provisioned before use.
# Host ports come from environments.dev.local.ports through STACK_PORT_<NAME>, which derive from the project base port (R389, PROJECT-STACKS-10);
# every port publishes on loopback only. `storage` is the dev object store (the StarCi source-built MinIO, images/sources.json of the harness,
# pinned by digest in contexts/stack/pins.yaml); its root credentials are the dev `storage` member's keys, read from the least grant STACK_GRANT_STORAGE.
services:
  core:
    image: "{{project}}/core:v0.0.0"
    environment:
      NODE_ENV: development
      PORT: "3001"
      HTTP_SECURITY_ALLOWED_ORIGINS: http://127.0.0.1:3000
      PRIMARY_DB_URL_FILE: /run/secrets/primary-db-url
    secrets:
      - source: primary-db-url
        target: primary-db-url
    ports: ["127.0.0.1:${STACK_PORT_CORE}:3001"]
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  app:
    image: "{{project}}/app:v0.0.0"
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    ports: ["127.0.0.1:${STACK_PORT_APP}:3000"]
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  landing:
    image: "{{project}}/landing:v0.0.0"
    environment:
      NODE_ENV: development
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    ports: ["127.0.0.1:${STACK_PORT_LANDING}:3002"]
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_DB: "{{project}}"
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d {{project}}"]
      interval: 10s
      timeout: 5s
      retries: 5
  storage:
    image: ghcr.io/starci183/minio:RELEASE.2025-10-15T17-29-55Z-starci.1@sha256:ec6dfba54eaa8e0d77bed9e7c6d86df90ad341f914ecfd3d613f0f811155f40f
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/STORAGE_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/STORAGE_SECRET_ACCESS_KEY
    ports:
      - "127.0.0.1:${STACK_PORT_STORAGE}:9000"
      - "127.0.0.1:${STACK_PORT_STORAGE_CONSOLE}:9001"
    volumes:
      - storage-data:/data
      - ${STACK_GRANT_STORAGE}:/run/secrets:ro
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
networks:
  app:
    driver: bridge
secrets:
  primary-db-url:
    file: /run/starci-secrets/{{project}}/dev/primary-db-url
volumes:
  postgres-data:
  storage-data:
