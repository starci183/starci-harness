{{header}}
# The nightly verify of the committed check cache (contexts/project/check-cache.md, "The nightly verify"). The release gate and every CI run trust the
# warm cache; this run proves that trust on the default branch: `starci app check --env prod --fresh` recomputes every family from scratch and the run fails
# (HFS_CHECK_CACHE_UNWARMED) when the committed records are not the ones it produced. A failed run locks `starci app release gate`
# (HFS_CHECK_CACHE_VERIFY_LOCKED) until a green run of this workflow, scheduled or dispatched, clears it.
name: cache verify

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-verify
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
{{> app/ci-workflows/install-steps.yml}}
{{ciPackagesBuild}}
      - name: verify the committed cache
        run: npx --no-install starci app check --env prod --fresh
        env:
          STARCI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
