# The dev environment's dependencies, run by `starci app stack up --env dev --execute` (PROJECT-STACKS-3, PROJECT-STACKS-6).
# Host ports come from environments.dev.local.ports through STACK_PORT_<NAME>, which derive from the project base port (R389, PROJECT-STACKS-10);
# every credential is read from a file through the least grant of its service (STACK_GRANT_<NAME>, a directory holding only that service's
# keys), never from the environment. Every port publishes on loopback only.
# `mail` is the dev mail sink (Mailpit, an unmodified upstream image pinned by digest in contexts/stack/pins.yaml): the api sends the
# confirmation and reset mails to its SMTP port, over a plain channel that exists on loopback only, and a person reads them in its web UI.
# `storage` is the dev object store (the StarCi source-built MinIO, images/sources.json of the harness, pinned by digest in contexts/stack/pins.yaml):
# its root credentials are the dev `storage` member's keys, the same keys the api signs with, and the api creates its bucket on its first
# readiness probe. The api and web run natively against these containers.
name: {{project}}-dev
services:
  db:
    build:
      context: ../../../images/db
    image: {{project}}-db:local
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:${STACK_PORT_DB}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ${STACK_GRANT_DB}:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  mail:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${STACK_PORT_MAIL}:1025"
      - "127.0.0.1:${STACK_PORT_MAILUI}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
  storage:
    image: ghcr.io/starci183/minio:RELEASE.2025-10-15T17-29-55Z-starci.1@sha256:ec6dfba54eaa8e0d77bed9e7c6d86df90ad341f914ecfd3d613f0f811155f40f
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/STORAGE_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/STORAGE_SECRET_ACCESS_KEY
    ports:
      - "127.0.0.1:${STACK_PORT_STORAGE}:9000"
      - "127.0.0.1:${STACK_PORT_STORAGE_CONSOLE}:9001"
    volumes:
      - storage-data:/data
      - ${STACK_GRANT_STORAGE}:/run/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
volumes:
  db-data: {}
  storage-data: {}
