{{header}}
# The be unit run's lcov ({{lcovReport}}), uploaded by the managed CI workflow. Coverage is the logic of be/src/modules/** and of the root packages: the
# status paths are the measured roots of the one coverage scope (derived from the slot manifest's `coverage` field; its complement is shared by ignore and
# sonar.coverage.exclusions and its roots by be/jest.config.js). The bars are the canon's (knowledge/sonar-gate.yaml, owner 2026-11-25): the project is a
# ratchet (`target: auto`, threshold 0: never below its base commit), the patch reaches {{codecovPatch}}, and each `tier-<letter>` component holds the modules
# hfs.json sides.be.coverageTiers puts in that tier at the tier's bar; the service-app, platform and package components hold the patch bar. fe/ and
# be/src/features are outside coverage (features are thin by rule; a front end has no tests).
codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        paths:
{{codecovPaths}}
    patch:
      default:
        target: {{codecovPatch}}%
        threshold: 0%
        paths:
{{codecovPaths}}
component_management:
  default_rules:
    statuses:
      - type: patch
        target: {{codecovPatch}}%
        threshold: 0%
  individual_components:
{{codecovComponents}}
{{codecovTierComponents}}
ignore:
{{codecovExclusions}}
