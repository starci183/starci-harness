# The harness's SonarCloud project. The organization and project key come from the repository variables
# SONAR_ORGANIZATION and SONAR_PROJECT_KEY, the token from the CI secret SONAR_TOKEN; none of them live in this file.
# The quality gate on the server is the one policy/quality.yaml names (ci.sonar-new-code.gate).
sonar.projectName=StarCi harness
sonar.sourceEncoding=UTF-8
sonar.sources=cli/src
sonar.tests=packages
sonar.test.inclusions=packages/*/*.spec.mjs
