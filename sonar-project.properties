# The harness's Sonar project. The token and host come from the CI secrets SONAR_TOKEN and SONAR_HOST_URL, never from
# this file. The quality gate on the server is the one policy/quality.yaml names (ci.sonar-new-code.gate).
# OWNER TO CONFIRM: the project key and organization of the Sonar project.
sonar.projectKey=starci183_starci-harness
sonar.organization=starci183
sonar.projectName=StarCi harness
sonar.sourceEncoding=UTF-8
sonar.sources=cli/src
sonar.tests=packages
sonar.test.inclusions=packages/*/*.spec.mjs
