[package]
name = "starci-harness"
version = "0.2.0"
description = "StarCi Harness: watch and steer StarCi harness workflows"
authors = ["starci183"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "starci_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
