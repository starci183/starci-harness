schema: starci/scenario@1
id: worktree-remove-busy-gc-retries
group: lifecycle
title: "a worktree the host holds is left busy without failing the task, retried by worktree gc with backoff, ticketed at the cap"
inject: >-
  a process that is no Orca terminal holds an inline task's Op worktree (its working folder on Windows, a read-only parent
  elsewhere) when the task is cancelled, and lets go only later
expect: >-
  the cancel settles the task and records the removal busy; worktree gc does not retry before the backoff runs out, retries
  once it has, opens one harness-defect ticket at the attempt cap, and removes the folder once the holder lets go, ending the
  busy record
pass:
  - the cancel succeeds and the task is cancelled although its worktree could not be removed
  - the removal is recorded busy once, and a gc before the backoff runs out retries nothing
  - a due gc retries and records the next attempt
  - the attempt cap opens one harness-defect ticket naming the folder
  - once the holder lets go, a due gc removes the folder and ends the busy record
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: docs/base.md
      content: "base\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: base"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: held
        goal: bench workflow held
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: start makes the inline task's Op worktree
    starci: [workflow, start, held]
    save:
      a: data.nodes.0.task.id
  - name: a process that is no Orca terminal holds the folder
    serve:
      stub: hold
      cwd: ${project}/worktrees/held.ops/${a}
      as: holder
  - name: the cancel settles the task although the removal is refused
    starci: [task, cancel, "${a}", --reason, bench]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${a}'"
        equals: [cancelled]
  - assert:
      exists:
        path: ${project}/worktrees/held.ops/${a}
        present: true
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.attempt') FROM events WHERE kind = 'worktree-remove-busy'"
        equals: [1]
  - name: a gc before the backoff runs out retries nothing
    starci: [worktree, gc]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'worktree-remove-busy'"
        equals: [1]
  - name: the backoff runs out
    sql:
      db: ledger
      exec: "UPDATE events SET data_json = json_set(data_json, '$.nextAt', '2000-01-01T00:00:00.000Z') WHERE kind = 'worktree-remove-busy'"
  - name: a due gc retries, still held
    starci: [worktree, gc]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.attempt') FROM events WHERE kind = 'worktree-remove-busy' ORDER BY id"
        equals: [1, 2]
  - assert:
      exists:
        path: ${project}/worktrees/held.ops/${a}
        present: true
  - name: the retries reach the attempt before the cap, due again
    sql:
      db: ledger
      exec: "UPDATE events SET data_json = json_set(data_json, '$.attempt', 5, '$.nextAt', '2000-01-01T00:00:00.000Z') WHERE id = (SELECT MAX(id) FROM events WHERE kind = 'worktree-remove-busy')"
  - name: the gc at the cap tickets the folder for Debug
    starci: [worktree, gc]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM tickets WHERE kind = 'harness-defect' AND title LIKE '%held.ops%stays locked after 6 removal attempts'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'worktree-remove-busy-ticketed'"
        equals: [1]
  - name: the holder lets go
    http:
      method: POST
      url: "${holder.url}/__exit"
      expect:
        status: 200
  - name: the backoff runs out again
    sql:
      db: ledger
      exec: "UPDATE events SET data_json = json_set(data_json, '$.nextAt', '2000-01-01T00:00:00.000Z') WHERE id = (SELECT MAX(id) FROM events WHERE kind = 'worktree-remove-busy')"
  - name: the due gc removes the folder
    starci: [worktree, gc]
  - assert:
      exists:
        path: ${project}/worktrees/held.ops/${a}
        present: false
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'worktree-remove-busy-cleared'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'op-worktree-removed' AND subject = '${a}'"
        equals: [1]
