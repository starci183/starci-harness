schema: starci/scenario@1
id: git-dirty-owner-edit-in-allowpaths
group: git
title: the owner has uncommitted edits inside a task's allowPaths when it starts
inject: docs/a.md modified, uncommitted, before dispatch
expect: dispatch refuses or the brief names the dirty path; the owner's edit is never swept into a harness commit unannounced
pass:
  - no harness commit containing the owner's uncommitted text without an event
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: "S3 state CAS fixes: intent rows (settling, cancelling), basedOn/cmdId dedupe, recovery that reconciles"
manual:
  - write docs/a.md uncommitted
  - start
  - assert refusal or event
  - work
  - assert the commit content
