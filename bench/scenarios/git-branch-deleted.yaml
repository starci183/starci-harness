schema: starci/scenario@1
id: git-branch-deleted
group: ledger
title: the workflow's branch is deleted by hand
inject: git branch -D on the workflow worktree's branch from another checkout
expect: the step refuses with a named code; the ledger keeps every result; the Kernel escalates
pass:
  - no crash
  - refusal names the branch
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: manual
pending: a person at the machine (manual)
manual:
  - create workflow worktree
  - delete its branch
  - step
