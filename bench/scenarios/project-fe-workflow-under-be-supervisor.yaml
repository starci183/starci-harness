schema: starci/scenario@1
id: project-fe-workflow-under-be-supervisor
group: lifecycle
title: "a side (FE) repository's workflow runs under the Supervisor of the project whose Work its hfs.json names"
inject: >-
  the BE repository holds the project's Work (.starciwork/workspace.yaml naming be and fe); the FE repository's hfs.json names the
  BE repository as its Work root; an FE workflow is started, then its Kernel dies and only the scheduled supervisor tick runs
expect: >-
  the project is the BE repository from either checkout: one [Supervisor] in the BE main checkout, a start from the FE checkout
  refuses SUPERVISOR_RUNNING, the FE workflow starts from the BE Supervisor's terminal and its Kernel launches into the BE
  Supervisor's Run; the tick, acting for that Supervisor, relaunches the FE Kernel there
pass:
  - one Supervisor for the two repositories
  - the FE Kernel launched and relaunched from the BE Supervisor's terminal into its Run
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# be\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: be, name: repo}
        - {role: fe, name: fe}
repos:
  fe:
    files:
      README.md: "# fe\n"
      hfs.json: '{"work": {"root": "../repo"}}'
steps:
  - file:
      path: ui.yaml
      content: |
        schema: starci/workflow@1
        id: ui
        goal: write the fe doc
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write the fe doc
            allowPaths: [docs/ui.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/ui.md]
  - boot:
      in: fe
      file: ${run}/ui.yaml
      workflow: ui
  - name: the FE checkout resolves to the same project, whose Supervisor runs
    starci: [supervisor, start]
    cwd: ${repo.fe}
    expect:
      exit: 1
      code: SUPERVISOR_RUNNING
  - starci: [supervisor, status, --project, "${repo.fe}"]
    expect:
      contains: '"name": "repo"'
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(*) FROM project_supervisors
        equals: [1]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] ui$'
          from: ^${supervisor.terminal}$
          run: ^${supervisor.run}$
        count: 1
  - name: the FE Kernel dies, 21 minutes pass with no progress
    orca:
      worker:
        dispatch: kernel
        state: exited
  - sql:
      db: ledger
      repo: fe
      exec: >-
        UPDATE seats SET lease_until = '2020-01-01T00:00:00.000Z' WHERE role = 'kernel';
        UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-21 minutes')
  - name: the owner's scheduled tick
    starci: [supervisor, tick]
    expect:
      contains: "ui: relaunched its Kernel"
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] ui$'
          from: ^${supervisor.terminal}$
          run: ^${supervisor.run}$
        count: 2
  - assert:
      orcaCalls:
        command: agent launch
        count: 1
