schema: starci/scenario@1
id: app-secret-from-host-key
group: security
title: "app secret set --from-host seals a host key from secret.env into a full and a lite app's custody, and no output carries its value"
inject: >-
  the run's secret.env (STARCI_SECRET_ENV) holds OPENROUTER_API_KEY and an unlisted key; a full app and a lite app each run
  `app secret init`, then `app secret set <env> <member> OPENROUTER_API_KEY --from-host OPENROUTER_API_KEY`; then a host key the
  policy does not list, a listed key the host lacks, and --from-host beside --generate
expect: >-
  each app's member is sealed (ciphertext naming the key) and decrypts to the fixture value; no set output carries it; the
  unlisted key is refused SECRET_KEY_UNLISTED and the missing one HOST_SECRET_MISSING, naming secret.env.example, before any
  member is written; --from-host with --generate is usage
pass:
  - the full and the lite app each seal the member and `get --reveal` returns the fixture value
  - no set output carries the fixture value or the unlisted key's value
  - an unlisted host key is SECRET_KEY_UNLISTED
  - a listed host key the host lacks is HOST_SECRET_MISSING
automation: automated
env:
  OPENROUTER_API_KEY: ""
  TELEGRAM_BOT_TOKEN: ""
repo:
  files:
    hfs.json: |
      {"hfs": 3, "kind": "app", "edition": "full", "project": "bench-full"}
repos:
  lite:
    files:
      hfs.json: |
        {"hfs": 3, "kind": "app", "edition": "lite", "project": "bench-lite"}
steps:
  - name: the host's secret.env holds the provider key among comments and a key the policy does not list
    file:
      path: ${run}/secret.env
      content: |
        # host secrets (bench fixture)
        SONAR_TOKEN=bench-fixture-unlisted-value
        export OPENROUTER_API_KEY="bench-fixture-openrouter-value"
  - name: the full app gets its own age identity and .sops.yaml
    starci: [app, secret, init]
  - name: the full app seals the host key without printing it
    starci: [app, secret, set, production, api, OPENROUTER_API_KEY, --from-host, OPENROUTER_API_KEY]
    expect:
      exit: 0
      lacks: bench-fixture-openrouter-value
  - starci: [app, secret, list, production]
    expect:
      contains: OPENROUTER_API_KEY
      lacks: bench-fixture-openrouter-value
  - assert:
      exists: { path: .starcistacks/production/secrets/api.enc.yaml, present: true, contains: "OPENROUTER_API_KEY: ENC[" }
  - name: the sealed member decrypts to the fixture value
    starci: [app, secret, get, production, api, OPENROUTER_API_KEY, --reveal]
    expect:
      contains: bench-fixture-openrouter-value
  - name: the lite app gets its own identity and seals the same host key the same way
    cwd: ${repo.lite}
    starci: [app, secret, init]
  - cwd: ${repo.lite}
    starci: [app, secret, set, production, api, OPENROUTER_API_KEY, --from-host, OPENROUTER_API_KEY]
    expect:
      exit: 0
      lacks: bench-fixture-openrouter-value
  - assert:
      exists: { path: "${repo.lite}/.starcistacks/production/secrets/api.enc.yaml", present: true, contains: "OPENROUTER_API_KEY: ENC[" }
  - cwd: ${repo.lite}
    starci: [app, secret, get, production, api, OPENROUTER_API_KEY, --reveal]
    expect:
      contains: bench-fixture-openrouter-value
  - name: a host key the policy does not list is refused before secret.env is read, and its value never printed
    starci: [app, secret, set, production, ops, SONAR_TOKEN, --from-host, SONAR_TOKEN]
    expect:
      exit: 1
      code: SECRET_KEY_UNLISTED
      lacks: bench-fixture-unlisted-value
  - name: a listed host key the host lacks is refused, naming where the owner sets it
    starci: [app, secret, set, production, ops, TELEGRAM_BOT_TOKEN, --from-host, TELEGRAM_BOT_TOKEN]
    expect:
      exit: 1
      code: HOST_SECRET_MISSING
      contains: secret.env.example
  - assert:
      exists: { path: .starcistacks/production/secrets/ops.enc.yaml, present: false }
  - name: --from-host and --generate both give set a value
    starci: [app, secret, set, production, api, OTHER_KEY, --from-host, OPENROUTER_API_KEY, --generate, "32"]
    expect:
      exit: 2
      code: CLI_USAGE
