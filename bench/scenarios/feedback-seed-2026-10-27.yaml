schema: starci/scenario@1
id: feedback-seed-2026-10-27
group: owner
title: "the owner feedback of 2026-10-27 closes on the changes that absorbed it: chip case on R322, StatusDot and card label on Grammar commits, chip wording on an app commit"
inject: >-
  the four owner feedback items of 2026-10-27 recorded in a scratch host ledger and closed on their real targets, commits of
  the harness checkout's own history (CI's harness job checks it out whole for this). The same
  steps are the one-time seed of the live ledger: run them without STARCI_LOCAL_ROOT, giving the owner's verbatim words in
  place of the summaries below (the summaries are the lane brief's, not the owner's words)
expect: >-
  each item closes on its target with the evidence the target gave (R322's enforcer, the commit's subject and files under
  packages/grammar or app), feedback list shows all four closed, and feedback check is green
pass:
  - chip uppercase closes on R322
  - the StatusDot spec closes on Grammar commit 0032ad8e
  - card label clipping closes on Grammar commit 406860a5
  - the chip status wording closes on app commit cb0c8c65
  - feedback check is green with nothing open
  - no human intervention beyond the injected fault
automation: automated
steps:
  - starci: [feedback, add, "Chip labels start uppercase", --on, "2026-10-27", --id, fb-2026-10-27-chip-case]
    expect: { exit: 0 }
  - starci: [feedback, close, fb-2026-10-27-chip-case, --kind, rule, --target, R322]
    expect: { exit: 0, contains: "FE_CHIP_LABEL_CASE" }
  - starci: [feedback, add, "StatusDot needs a specified anatomy", --on, "2026-10-27", --id, fb-2026-10-27-statusdot-spec]
    expect: { exit: 0 }
  - starci: [feedback, close, fb-2026-10-27-statusdot-spec, --kind, grammar, --target, 0032ad8e]
    expect: { exit: 0, contains: "0032ad8ef8dd" }
  - starci: [feedback, add, "A labelled card clips the first letter of its label", --on, "2026-10-27", --id, fb-2026-10-27-card-label-clip]
    expect: { exit: 0 }
  - starci: [feedback, close, fb-2026-10-27-card-label-clip, --kind, grammar, --target, 406860a5]
    expect: { exit: 0, contains: "406860a50e09" }
  - starci: [feedback, add, "Status chips must not read sống/đứng; they use the status words of the app", --on, "2026-10-27", --id, fb-2026-10-27-chip-wording]
    expect: { exit: 0 }
  - starci: [feedback, close, fb-2026-10-27-chip-wording, --kind, app, --target, cb0c8c65]
    expect: { exit: 0, contains: "under app/" }
  - starci: [feedback, list, --status, closed]
    expect: { exit: 0, contains: '"target": "cb0c8c653d4ee63a4ac1242538b6db4dd9f5cc6e"' }
  - starci: [feedback, check]
    expect: { exit: 0, contains: '"open": 0' }
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(*) FROM owner_feedback WHERE status = 'closed' AND given_on = '2026-10-27'
        equals: [4]
