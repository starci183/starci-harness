schema: starci/scenario@1
id: needs-orca-two-ops-one-prerequisite
group: needs
title: "orca: two Ops of one workflow report one missing capability at once; one shared-need decision, one prerequisite Op, both released on landing"
inject: "two Ops running side by side under one Kernel both find platform/http's HttpClient missing and file blocked --needs"
expect: >-
  kernel next parks both Ops on one need (their seats closed, their work kept) and hands the Kernel one shared-need decision and
  no question; the Kernel's one workflow-change adds the prerequisite, which kernel next launches as an Op; once it lands, kernel
  next releases both waiters and launches them again, with no further Kernel command
pass:
  - one need with two parked waiters, one shared-need decision, no question
  - one prerequisite task launched as an Op and landed
  - both waiters retried and launched again with no further Kernel command
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: duo
        goal: bench workflow duo
        runner: orca
        maxParallel: 3
        tasks:
          - id: a
            label: docs
            summary: write doc a, which calls the shared http client
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args: {files: [docs/a.md]}
          - id: b
            label: docs
            summary: write doc b, which calls the shared http client
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args: {files: [docs/b.md]}
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: duo
  - name: kernel next launches both Ops
    seat: kernel:duo
    starci: [kernel, next, duo, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a'"
      as: a
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'b'"
      as: b
  - worker:
      task: ${a}
      status: blocked
      output:
        summary: platform/http has no HttpClient
        files: []
        rulesApplied: []
        needs: [{key: "capability:platform.http", rule: BE-INFRA-2}]
  - worker:
      task: ${b}
      status: blocked
      output:
        summary: platform/http has no HttpClient
        files: []
        rulesApplied: []
        needs: [{key: "capability:platform.http", rule: BE-INFRA-2}]
  - name: kernel next parks both and hands one shared-need decision
    seat: kernel:duo
    starci: [kernel, next, duo, --wait, "0"]
    expect:
      contains: '"kind": "shared-need"'
    save:
      decision: data.decision.id
      graph: data.digest.graphVersion
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM shared_need_waiters WHERE parked_at IS NOT NULL"
        equals: [2]
  - assert:
      sql:
        db: ledger
        query: "SELECT kind FROM decisions WHERE scope = 'kernel'"
        equals: [shared-need]
  - file:
      path: add-http.yaml
      content: |
        schema: starci/workflow-change@1
        workflow: duo
        changes:
          - op: add
            task:
              id: http
              label: docs
              summary: write the shared http client
              allowPaths: [platform/http/client.md]
              checks:
                - preset: files-exist
                  args: {files: [platform/http/client.md]}
  - file:
      path: cmd-http.yaml
      content: |
        schema: starci/command@1
        cmdId: k-duo-need-http
        kind: workflow-change
        workflow: duo
        basedOn: {graph: ${graph}}
        answers: [${decision}]
        change: add-http.yaml
        need: {key: "capability:platform.http", resolver: http}
  - seat: kernel:duo
    starci: [kernel, submit, "${run}/cmd-http.yaml"]
  - name: kernel next launches the prerequisite
    seat: kernel:duo
    starci: [kernel, next, duo, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'http'"
      as: http
  - worker:
      task: ${http}
      files:
        platform/http/client.md: "# HttpClient\n"
  - name: kernel next lands it, releases both waiters and launches them again
    seat: kernel:duo
    starci: [kernel, next, duo, --wait, "0"]
  - assert:
      sql:
        db: machine
        query: "SELECT (SELECT state FROM shared_needs) || ':' || (SELECT COUNT(*) FROM shared_need_waiters WHERE released_at IS NOT NULL)"
        equals: ["resolved:2"]
  - assert:
      gitLog:
        grep: "Starci-Task: ${http}"
        count: 1
        in: ${worktree.duo}
  - name: both waiters run again, launched as Ops, with one Kernel command in all
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM tasks WHERE plan_key IN ('a', 'b') AND status IN ('queued', 'running')) || ':' || (SELECT COUNT(*) FROM commands WHERE scope = 'kernel')"
        equals: ["2:1"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 5
