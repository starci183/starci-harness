schema: starci/scenario@1
id: acc-4-two-workflows-one-path-run-at-once
group: acceptance
title: "owner acceptance 4: two workflows want one path; neither waits, each Op works in its own worktree and lands on its own workflow's branch"
inject: "workflows ui and nav both write docs/header.md, each differently, under their own Kernels"
expect: >-
  both Kernels launch their Op at once (no path is held while a task works); each Op works in a worktree of its own, listed in
  Orca under its Kernel's worktree, which is listed under the main checkout; each verify lands on its own workflow's branch, so
  no conflict arises inside the harness (the two branches meet only when Debug lands them on main); both Op worktrees are
  removed and each workflow branch carries only its own version
pass:
  - two Op worker-starts, one per Kernel, before either task settles
  - each workflow's worktree listed under the main checkout, each Op's under its workflow's
  - both tasks done with one attempt each; each workflow branch carries its own header and its task's trailer
  - both Op worktrees removed
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: ui.yaml
      content: |
        schema: starci/workflow@1
        id: ui
        goal: refresh the header doc
        runner: orca
        maxParallel: 2
        tasks:
          - id: header
            label: docs
            summary: rewrite the header doc
            allowPaths: [docs/header.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/header.md]
  - file:
      path: nav.yaml
      content: |
        schema: starci/workflow@1
        id: nav
        goal: rework the navigation docs
        runner: orca
        maxParallel: 2
        tasks:
          - id: header
            label: docs
            summary: add the nav links to the header doc
            allowPaths: [docs/header.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/header.md]
  - boot:
      file: ${run}/ui.yaml
      workflow: ui
  - name: ui's Kernel launches its Op
    seat: kernel:ui
    starci: [kernel, next, ui, --wait, "0"]
  - boot:
      file: ${run}/nav.yaml
      workflow: nav
  - name: nav's Kernel launches its Op while ui's runs
    seat: kernel:nav
    starci: [kernel, next, nav, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 2
  - assert:
      orcaCalls:
        command: worktree set
        match:
          display-name: '^\[Kernel\] '
        count: 2
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE workflow_id = 'ui'"
      as: ui
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE workflow_id = 'nav'"
      as: nav
  - worker:
      task: ${ui}
      files:
        docs/header.md: "# header by ui\n"
  - worker:
      task: ${nav}
      files:
        docs/header.md: "# header by nav\n"
  - name: ui settles
    seat: kernel:ui
    starci: [kernel, next, ui, --wait, "0"]
  - name: nav settles
    seat: kernel:nav
    starci: [kernel, next, nav, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT t.workflow_id || ':' || t.status || ':' || (SELECT COUNT(*) FROM attempts x WHERE x.task_id = t.id) FROM tasks t ORDER BY t.workflow_id"
        equals: ["nav:done:1", "ui:done:1"]
  - assert:
      gitLog:
        grep: "Starci-Task: ${ui}"
        count: 1
        in: ${worktree.ui}
  - assert:
      gitLog:
        grep: "Starci-Task: ${nav}"
        count: 1
        in: ${worktree.nav}
  - name: ui's branch carries ui's header only
    git: [-C, "${worktree.ui}", grep, -q, "by ui", HEAD, --, docs/header.md]
  - name: nav's branch carries nav's header only
    git: [-C, "${worktree.nav}", grep, -q, "by nav", HEAD, --, docs/header.md]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'op-worktree-removed'"
        equals: [2]
