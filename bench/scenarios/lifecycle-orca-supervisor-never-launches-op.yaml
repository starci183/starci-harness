schema: starci/scenario@1
id: lifecycle-orca-supervisor-never-launches-op
group: lifecycle
title: "a step from the Supervisor's terminal queues a Kernel's Op and never launches it; a fenced launch spends nothing"
inject: >-
  the Supervisor steps the workflow from its own terminal (as supervisor next, supervisor tick and the amend of a released need
  do), which Orca attests as the Supervisor and fences for a worker-start naming the Kernel's terminal; then Orca fences the
  Kernel's own launch once (consumer_fenced)
expect: >-
  the Supervisor's step queues the Op and sends no worker-start (it may not act as the Kernel's terminal), the task stays queued,
  not cancelled; the Kernel's kernel next launches it, and a launch Orca fences ends its attempt consumer-fenced with the task
  queued again and the workflow running, so the next kernel next launches it
pass:
  - "after the Supervisor's step: task queued, no [Op] worker-start, no attempt"
  - "after the fenced kernel next: task queued, one consumer-fenced attempt, workflow running"
  - "after the next kernel next: task running, the second [Op] worker-start under the Kernel's --from"
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: one
        goal: bench workflow one
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: one
  - name: the Supervisor steps the workflow from its own terminal
    seat: supervisor
    starci: [workflow, step, one]
    expect:
      contains: "the Kernel's own step (kernel next) launches it"
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - queued
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM attempts
        equals:
          - 0
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 0
  - orca:
      rules:
        - command: worker-start
          match:
            task-title: '^\[Op\]'
          fault: refuse
          code: consumer_fenced
          message: This terminal is attested as another terminal and cannot act as the consumer.
          times: 1
  - name: kernel next meets a fenced launch
    seat: kernel:one
    starci: [kernel, next, one, --wait, "0"]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - queued
  - assert:
      sql:
        db: ledger
        query: SELECT outcome FROM attempts
        equals:
          - consumer-fenced
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows
        equals:
          - running
  - name: kernel next launches it
    seat: kernel:one
    starci: [kernel, next, one, --wait, "0"]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - running
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
          run: "${kernel.one.run}"
          from: "${kernel.one.terminal}"
        count: 2
