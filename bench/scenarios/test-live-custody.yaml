schema: starci/scenario@1
id: test-live-custody
group: verify
title: "a worker runs a live suite through starci test live: the keys its world declares come from the app's custody into that one run, the value never shown; a key custody lacks refuses before anything runs"
inject: >-
  the app's custody holds OPENROUTER_API_KEY with a fake value and the host secret.env holds nothing; one live spec declares that
  key, another declares a key custody lacks; a worker runs each through starci test live
expect: >-
  the first run hands the key from custody to the suite's child environment alone: it passes, names the custody member, and the
  value the suite printed is scrubbed from the verb's output and json; the second refuses CUSTODY_KEY_MISSING naming the key and
  the environment, and runs nothing
pass:
  - the live suite with its key in custody passes through starci test live and names the custody member
  - the fake value appears in no output of the verb, human or json
  - the key custody lacks refuses CUSTODY_KEY_MISSING
  - no human intervention beyond the injected fault
automation: automated
env:
  OPENROUTER_API_KEY: ""
  STARCI_OPS_DIR: ${repo}/ops
# The jest stand-in runs exactly the paths --runTestsByPath gives it. A spec calling useSandbox( passes only when every key it
# declares is in the environment and the OPENROUTER_API_KEY it got is the fixture value, then prints the value, which the
# harness must scrub.
repo:
  files:
    README.md: "# bench scratch custody\n"
    hfs.json: '{"hfs": 3, "kind": "app", "edition": "full", "project": "bench-custody"}'
    package.json: '{"name": "bench-custody", "version": "1.0.0", "private": true, "scripts": {"test:e2e": "cd be && node ../node_modules/jest/bin/jest.js --selectProjects e2e"}}'
    be/jest.config.js: |
      module.exports = { projects: [{ displayName: "e2e", testMatch: ["<rootDir>/src/tests/e2e/**/*.e2e-spec.ts"] }] }
    be/src/tests/e2e/ai/router.e2e-spec.ts: |
      useSandbox({ provider: "openrouter", keys: ["OPENROUTER_API_KEY"] })
    be/src/tests/e2e/other/other.e2e-spec.ts: |
      useSandbox({ provider: "other", keys: ["MISSING_PROVIDER_KEY"] })
    node_modules/jest/bin/jest.js: |
      const { createHash } = require("node:crypto")
      const { readFileSync } = require("node:fs")
      const args = process.argv.slice(2)
      const files = args.filter((a) => !a.startsWith("-") && a !== "e2e")
      let failed = 0
      for (const f of files) {
        const text = readFileSync(f, "utf8")
        const keys = [...text.matchAll(/"([A-Z][A-Z0-9_]*)"/g)].map((m) => m[1])
        const missing = keys.filter((k) => !process.env[k])
        if (missing.length > 0) {
          failed += 1
          console.log("FAIL " + f + " TestWorldError: TEST_WORLD_NOT_DECLARED: " + missing.join(", "))
          continue
        }
        const got = process.env.OPENROUTER_API_KEY || ""
        const ok = createHash("sha256").update(got).digest("hex") === "bea4dde82d6a6f8e410532875c4dbe5902ae549c85aa1101a5f74d03eb7fbd69"
        console.log("debug: provider key " + got)
        if (ok) console.log("PASS " + f + " custody key reached the run")
        else { failed += 1; console.log("FAIL " + f + " the key is not the custody value") }
      }
      process.exit(failed === 0 ? 0 : 1)
steps:
  - name: copy ops/ into the scratch repository
    write: { path: ops, from: "${ops}" }
  - write: { path: contexts/project/work.md, from: "${ops}/../contexts/project/work.md" }
  - name: the suites run whatever else this host runs (the governor is not under test here)
    starci: [config, set, liveness.heavy.maxCpuPercent, "100"]
  - starci: [config, set, liveness.heavy.reserveMb, "0"]
  - name: the host's secret.env holds the fake provider key the owner seals into custody
    file:
      path: ${run}/secret.env
      content: |
        OPENROUTER_API_KEY=bench-fixture-custody-value
  - starci: [app, secret, init]
  - name: the dev environment's ai member holds the key, sealed
    starci: [app, secret, set, dev, ai, OPENROUTER_API_KEY, --from-host, OPENROUTER_API_KEY]
    expect: { exit: 0, lacks: bench-fixture-custody-value }
  - name: the host secret.env is gone, so only custody can hand the key over
    file:
      path: ${run}/secret.env
      content: "# empty\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: dev custody"]
  - name: the worker runs the router live suite through the verb
    starci: [test, live, src/tests/e2e/ai]
    expect: { exit: 0, contains: "custody: OPENROUTER_API_KEY from dev/ai, handed to this run's environment only", lacks: bench-fixture-custody-value }
  - name: the value the suite printed is scrubbed from what the worker sees
    starci: [test, live, src/tests/e2e/ai, --run, npm run test:e2e]
    expect: { exit: 0, contains: "debug: provider key [redacted:custody]", lacks: bench-fixture-custody-value }
  - name: a declared key custody lacks refuses before anything runs
    starci: [test, live, src/tests/e2e/other]
    expect: { code: CUSTODY_KEY_MISSING, contains: "custody lacks MISSING_PROVIDER_KEY in dev", lacks: bench-fixture-custody-value }
