schema: starci/scenario@1
id: git-rebase-force-push-by-someone
group: git
title: someone rebases or force-pushes the workflow branch mid-run
inject: the workflow worktree's branch is rewritten under the harness
expect: commits with Starci-Task trailers no longer reachable are detected; landed tasks become stale with evidence, never silently done
pass:
  - a ledger event names the lost commits
  - the workflow blocks for the Kernel
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: manual
pending: a person at the machine (manual)
manual:
  - run lifecycle chain
  - rewrite history in another clone and force-push
  - fetch + reset in the worktree
  - workflow status
