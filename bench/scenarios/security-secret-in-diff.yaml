schema: starci/scenario@1
id: security-secret-in-diff
group: security
title: a credential written inside allowPaths never lands in a harness commit
inject: the worker writes a provider-shaped key into its own file and files done
expect: the settle refuses to commit it (secret scan of the candidate) and the task does not end done; check secrets is red on the worktree
pass:
  - no commit carries the task trailer
  - the task is not done
  - starci check secrets exits 1
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: sec
        goal: bench workflow sec
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - src/config.js
            checks:
              - preset: files-exist
                args:
                  files:
                    - src/config.js
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - sec
    save:
      a: data.nodes.0.task.id
  - write:
      path: src/config.js
      generated: secret
  - worker:
      task: ${a}
      files: {}
  - name: step
    starci:
      - workflow
      - step
      - sec
    save: {}
    expect: {}
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 0
