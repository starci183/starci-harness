schema: starci/scenario@1
id: route-explain-coordinator-circuit
group: provider
title: "route explain --label kernel explains a Kernel's pick through pickCoordinator: claude while its circuit is closed, codex once it opens"
inject: provider report claude --outcome auth between two explains of the kernel label
expect: >-
  route explain --label kernel prints the same stages as a worker explain (tier from coordinators.kernel, hard filter, quota,
  lineage, probe, score) and chooses claude while its circuit is closed; with claude's circuit open it drops claude at the hard
  filter naming the circuit and chooses codex
pass:
  - the kernel label is explained, not refused LABEL_UNKNOWN, with its tier from coordinators.kernel
  - with the circuit closed the pick is claude
  - with the claude circuit open claude is dropped naming circuit open (auth) and the pick is codex
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - name: a healthy claude (creates the host store)
    starci: [provider, report, claude, --outcome, success]
  - name: an earlier Codex explore pick changes nothing; a coordinator is taken in the coordinator tier's listed order
    sql:
      db: machine
      exec: "INSERT INTO route_picks (at, tier, member, pool, label, chosen_by) VALUES (strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), 'coordinator', 'codex/gpt-6.1-sol', 'codex', 'kernel', 'explore')"
  - name: the circuit closed picks claude
    starci: [route, explain, --label, kernel]
    expect:
      exit: 0
      contains: "\"agent\": \"claude\""
  - starci: [route, explain, --label, kernel]
    expect:
      contains: "\"tierFrom\": \"coordinators.kernel\""
  - starci: [route, explain, --label, kernel]
    expect:
      contains: "\"by\": \"order\""
  - name: claude's auth fails and its circuit opens
    starci: [provider, report, claude, --outcome, auth, --detail, organization disabled]
  - name: the circuit open drops claude and picks codex
    starci: [route, explain, --label, kernel]
    expect:
      exit: 0
      contains: "\"reason\": \"provider claude circuit open (auth) until"
  - starci: [route, explain, --label, kernel]
    expect:
      contains: "\"agent\": \"codex\""
  - name: the supervisor label routes the same way
    starci: [route, explain, --label, supervisor]
    expect:
      contains: "\"agent\": \"codex\""
