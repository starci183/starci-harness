schema: starci/scenario@1
id: verify-worker-custody-recheck
group: verify
title: "a verify worker whose own run of a live suite lacked the custody keys and filed failed TEST_WORLD_NOT_DECLARED does not settle red: the harness reruns the suite with custody and judges by that, spending no try"
inject: >-
  the app's custody holds OPENROUTER_API_KEY with a fake value; a verify-label task names the live suite declaring it, and its
  worker ran the suite in its own process without custody and files failed with verdict failed and a TEST_WORLD_NOT_DECLARED
  finding for OPENROUTER_API_KEY; a second verify task's worker files blocked with the CUSTODY_KEY_MISSING refusal starci test live
  gave it for a key custody lacks
expect: >-
  the result is filed as the worker wrote it but the task goes reported with a custody-recheck event, not failed; its verify
  runs the suite with the key handed from custody, sets the worker's verdict aside and judges by that run: green, the task done
  at try 1 with a green verdict, and the fake value in no verb output, check row or event; the blocked one is verified too and
  its custody refusal ends it awaiting_owner at try 1 with no red verdict, the owner's question on credentials
pass:
  - the failed TEST_WORLD_NOT_DECLARED report leaves the task reported with a custody-recheck event, never failed
  - the harness's own run with custody judges the task green and done at try 1
  - the fake value appears in no verb output, check row or event
  - a custody refusal reported blocked ends the task awaiting_owner at try 1, owner-gated, no red verdict
  - no human intervention beyond the injected fault
automation: automated
env:
  OPENROUTER_API_KEY: ""
  STARCI_OPS_DIR: ${repo}/ops
# The jest stand-in runs exactly the paths --runTestsByPath gives it. A spec calling useSandbox( passes only when every key it
# declares is in the environment and the OPENROUTER_API_KEY it got is the fixture value, then prints the value, which the
# harness must scrub.
repo:
  files:
    README.md: "# bench scratch custody\n"
    hfs.json: '{"hfs": 3, "kind": "app", "edition": "full", "project": "bench-custody"}'
    package.json: '{"name": "bench-custody", "version": "1.0.0", "private": true, "scripts": {"test:e2e": "cd be && node ../node_modules/jest/bin/jest.js --selectProjects e2e"}}'
    be/jest.config.js: |
      module.exports = { projects: [{ displayName: "e2e", testMatch: ["<rootDir>/src/tests/e2e/**/*.e2e-spec.ts"] }] }
    be/src/tests/e2e/ai/router.e2e-spec.ts: |
      useSandbox({ provider: "openrouter", keys: ["OPENROUTER_API_KEY"] })
    be/src/tests/e2e/other/other.e2e-spec.ts: |
      useSandbox({ provider: "other", keys: ["MISSING_PROVIDER_KEY"] })
    node_modules/jest/bin/jest.js: |
      const { createHash } = require("node:crypto")
      const { readFileSync } = require("node:fs")
      const args = process.argv.slice(2)
      const files = args.filter((a) => !a.startsWith("-") && a !== "e2e")
      let failed = 0
      for (const f of files) {
        const text = readFileSync(f, "utf8")
        const keys = [...text.matchAll(/"([A-Z][A-Z0-9_]*)"/g)].map((m) => m[1])
        const missing = keys.filter((k) => !process.env[k])
        if (missing.length > 0) {
          failed += 1
          console.log("FAIL " + f + " TestWorldError: TEST_WORLD_NOT_DECLARED: " + missing.join(", "))
          continue
        }
        const got = process.env.OPENROUTER_API_KEY || ""
        const ok = createHash("sha256").update(got).digest("hex") === "bea4dde82d6a6f8e410532875c4dbe5902ae549c85aa1101a5f74d03eb7fbd69"
        console.log("debug: provider key " + got)
        if (ok) console.log("PASS " + f + " custody key reached the run")
        else { failed += 1; console.log("FAIL " + f + " the key is not the custody value") }
      }
      process.exit(failed === 0 ? 0 : 1)
steps:
  - name: copy ops/ into the scratch repository
    write: { path: ops, from: "${ops}" }
  - write: { path: contexts/project/work.md, from: "${ops}/../contexts/project/work.md" }
  - write: { path: contexts/project/lint.md, from: "${ops}/../contexts/project/lint.md" }
  - name: the suites run whatever else this host runs (the governor is not under test here)
    starci: [config, set, liveness.heavy.maxCpuPercent, "100"]
  - starci: [config, set, liveness.heavy.reserveMb, "0"]
  - name: the host's secret.env holds the fake provider key the owner seals into custody
    file:
      path: ${run}/secret.env
      content: |
        OPENROUTER_API_KEY=bench-fixture-custody-value
  - starci: [app, secret, init]
  - name: the dev environment's ai member holds the key, sealed
    starci: [app, secret, set, dev, ai, OPENROUTER_API_KEY, --from-host, OPENROUTER_API_KEY]
    expect: { exit: 0, lacks: bench-fixture-custody-value }
  - name: the host secret.env is gone, so only custody can hand the key over
    file:
      path: ${run}/secret.env
      content: "# empty\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: dev custody"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: live
        goal: bench a live verify whose worker lacked custody
        runner: inline
        tasks:
          - id: router-live
            label: verify
            summary: live proof of the ai router with the keys from custody
            allowPaths: [be/src/tests/reports/router]
            inputs: {suite: "npm run test:e2e -- src/tests/e2e/ai", step: live}
          - id: other-live
            label: verify
            summary: live proof of the other provider, whose key custody lacks
            allowPaths: [be/src/tests/reports/other]
            inputs: {suite: "npm run test:e2e -- src/tests/e2e/other", step: live}
            dependsOn: [router-live]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, live]
    save:
      router: data.nodes.0.task.id
  - name: the worker ran npm run test:e2e itself, without custody, and files the red it saw
    worker:
      task: ${router}
      status: failed
      output:
        summary: "the live router tests failed with TEST_WORLD_NOT_DECLARED because OPENROUTER_API_KEY is not declared in the run environment"
        files: []
        verdict: failed
        findings:
          - id: custody-key-not-in-env
            message: "TestWorldError: TEST_WORLD_NOT_DECLARED: the openrouter sandbox keys are not declared in the environment: OPENROUTER_API_KEY"
  - name: the report is handed to the harness's own run, not settled red
    assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || (SELECT COUNT(*) FROM events e WHERE e.subject = t.id AND e.kind = 'custody-recheck' AND json_extract(e.data_json, '$.keys') LIKE '%OPENROUTER_API_KEY%') FROM tasks t WHERE t.id = '${router}'"
        equals: ["reported:1"]
  - name: the step verifies it with the key from custody (and the wave runs its deferred suite)
    starci: [workflow, step, live]
    expect: { lacks: bench-fixture-custody-value }
  - starci: [workflow, step, live]
    expect: { lacks: bench-fixture-custody-value }
  - assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id AND a.verdict = 'red') FROM tasks t WHERE t.id = '${router}'"
        equals: ["done:1:0"]
  - name: the suite ran with the key handed from custody and the worker's verdict set aside
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE task_id = '${router}' AND name = 'suite-verdict' AND status = 'green' AND detail LIKE '%custody: OPENROUTER_API_KEY from dev/ai, handed to this run''s environment only%' AND detail LIKE '%verdict is set aside%' AND detail LIKE '%debug: provider key [redacted:custody]%'"
        equals: [1]
  - name: the value is in no check row and no event
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM check_runs WHERE detail LIKE '%bench-fixture-custody-value%') + (SELECT COUNT(*) FROM events WHERE data_json LIKE '%bench-fixture-custody-value%')"
        equals: [0]
  - starci: [workflow, status, live]
    save:
      other: data.nodes.1.task.id
  - name: the other worker ran starci test live, which refused the key custody lacks, and files blocked with that refusal
    worker:
      task: ${other}
      status: blocked
      output:
        summary: "starci test live refused before running: CUSTODY_KEY_MISSING custody lacks MISSING_PROVIDER_KEY in dev"
        files: []
        verdict: failed
        findings: []
  - name: the harness's own verify meets the same refusal and ends the task awaiting the owner, no try spent
    starci: [workflow, step, live]
    expect: { lacks: bench-fixture-custody-value }
  - assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id AND a.verdict = 'red') || ':' || (SELECT COUNT(*) FROM events e WHERE e.subject = t.id AND e.kind = 'verify-stuck' AND json_extract(e.data_json, '$.code') = 'CUSTODY_KEY_MISSING' AND json_extract(e.data_json, '$.owner') = 1) FROM tasks t WHERE t.id = '${other}'"
        equals: ["awaiting_owner:1:0:1"]
