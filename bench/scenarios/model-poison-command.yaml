schema: starci/scenario@1
id: model-poison-command
group: model
title: the same invalid command is submitted again and again
inject: "the Kernel submits one unfit change (a task depending on a task that does not exist) five times, each under a fresh cmdId"
expect: "each submit is refused and recorded failed; past a small number of identical failures the harness backs off (refuses at once) and raises an escalation (kind harness) for the Supervisor, so a looping Kernel never spins on the same refusal"
pass:
  - every submit refused, nothing applied, graph unchanged
  - an escalation for the Supervisor after repeated identical failures
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
finding: >-
  nothing counts repeated failures: kernelSubmit in cli/src/core/kernel/driver.ts:437 records each refused command failed
  (:447) and rethrows; no backoff and no escalation follow, so a Kernel resubmitting the same unfit change under fresh cmdIds
  is refused the same way forever
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: poison
        goal: write doc a
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - file:
      path: ghost.yaml
      content: |
        schema: starci/workflow-change@1
        workflow: poison
        reason: add b after a task that does not exist
        changes:
          - op: add
            task:
              id: b
              label: docs
              summary: write doc b
              dependsOn: [ghost]
              allowPaths: [docs/b.md]
              checks:
                - preset: files-exist
                  args:
                    files: [docs/b.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: poison
  - file:
      path: cmd-1.yaml
      content: |
        schema: starci/command@1
        cmdId: k-poison-1
        kind: workflow-change
        workflow: poison
        basedOn: {graph: 1}
        change: ghost.yaml
  - name: submit 1 of the same unfit change
    seat: kernel:poison
    starci: [kernel, submit, "${run}/cmd-1.yaml"]
    expect: {}
  - file:
      path: cmd-2.yaml
      content: |
        schema: starci/command@1
        cmdId: k-poison-2
        kind: workflow-change
        workflow: poison
        basedOn: {graph: 1}
        change: ghost.yaml
  - name: submit 2 of the same unfit change
    seat: kernel:poison
    starci: [kernel, submit, "${run}/cmd-2.yaml"]
    expect: {}
  - file:
      path: cmd-3.yaml
      content: |
        schema: starci/command@1
        cmdId: k-poison-3
        kind: workflow-change
        workflow: poison
        basedOn: {graph: 1}
        change: ghost.yaml
  - name: submit 3 of the same unfit change
    seat: kernel:poison
    starci: [kernel, submit, "${run}/cmd-3.yaml"]
    expect: {}
  - file:
      path: cmd-4.yaml
      content: |
        schema: starci/command@1
        cmdId: k-poison-4
        kind: workflow-change
        workflow: poison
        basedOn: {graph: 1}
        change: ghost.yaml
  - name: submit 4 of the same unfit change
    seat: kernel:poison
    starci: [kernel, submit, "${run}/cmd-4.yaml"]
    expect: {}
  - file:
      path: cmd-5.yaml
      content: |
        schema: starci/command@1
        cmdId: k-poison-5
        kind: workflow-change
        workflow: poison
        basedOn: {graph: 1}
        change: ghost.yaml
  - name: submit 5 of the same unfit change
    seat: kernel:poison
    starci: [kernel, submit, "${run}/cmd-5.yaml"]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT graph_version FROM workflows
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM commands WHERE status = 'applied'"
        equals: [0]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND kind = 'escalation'"
        equals: [1]
