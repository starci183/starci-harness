schema: starci/scenario@1
id: needs-deadline-and-failed-resolver
group: needs
title: a need nobody owns past its deadline climbs one router per deadline; a resolver that fails returns the need to its router
inject: "the Kernel never answers a need routed to it, past needs.ownerDeadlineMinutes; then the Supervisor never answers either; once owned, the resolver task fails"
expect: >-
  past the deadline the need moves from the Kernel to the Supervisor (the Kernel's decision superseded, one Supervisor
  shared-need raised), and past it again to the owner as one escalation of kind owner; the owner's ruling, relayed as a need-owner,
  gives it to the workflow, whose Kernel names a resolver; that resolver's failure reopens the need in a new round at the
  Supervisor, its router, and the waiter stays parked; nothing wedges
pass:
  - one level per deadline, each with its decision, the earlier one superseded
  - the owner escalation is kind owner and names the need
  - a failed resolver reopens the need at the Supervisor in round 2
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: slow
        goal: bench workflow slow
        runner: inline
        tasks:
          - {id: a, label: docs, summary: write doc a, allowPaths: [docs/a.md], checks: [{preset: files-exist, args: {files: [docs/a.md]}}]}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, slow]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      status: blocked
      output: {summary: needs the queue, files: [], rulesApplied: [], needs: ["capability:queue"]}
  - starci: [workflow, step, slow]
    expect: {}
  - assert:
      sql:
        db: machine
        query: "SELECT level FROM shared_needs"
        equals: [kernel]
  - name: the Kernel lets the deadline pass
    sql:
      db: machine
      exec: "UPDATE shared_needs SET routed_at = '2026-01-01T00:00:00.000Z'"
  - starci: [workflow, step, slow]
    expect: {}
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || level FROM shared_needs"
        equals: ["routed:supervisor"]
  - assert:
      sql:
        db: ledger
        query: "SELECT scope || ':' || kind || ':' || (answered_at IS NULL) FROM decisions ORDER BY raised_at, scope"
        equals: ["kernel:shared-need:0", "supervisor:shared-need:1"]
  - name: the Supervisor lets it pass too
    sql:
      db: machine
      exec: "UPDATE shared_needs SET routed_at = '2026-01-01T00:00:00.000Z'"
  - starci: [workflow, step, slow]
    expect: {}
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || level FROM shared_needs"
        equals: ["routed:owner"]
  - name: one owner escalation naming the need; the Supervisor's shared-need superseded
    assert:
      sql:
        db: ledger
        query: "SELECT kind || ':' || COALESCE(json_extract(evidence_json, '$.escalation.kind'), '-') || ':' || (answered_at IS NULL) FROM decisions WHERE scope = 'supervisor' ORDER BY raised_at"
        equals: ["shared-need:-:0", "escalation:owner:1"]
  - name: a further deadline climbs no higher
    sql:
      db: machine
      exec: "UPDATE shared_needs SET routed_at = '2026-01-01T00:00:00.000Z'"
  - starci: [workflow, step, slow]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND kind = 'escalation'"
        equals: [1]
  - file:
      path: owner.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-slow-queue-owner
        kind: need-owner
        workflow: slow
        basedOn: {}
        need: {key: "capability:queue"}
        note: the owner rules that slow builds the queue
  - name: the owner's ruling is relayed as a need-owner
    starci: [supervisor, submit, "${run}/owner.yaml"]
  - starci: [kernel, next, slow, --wait, "0"]
    expect:
      contains: '"kind": "shared-need"'
    save:
      decision: data.decision.id
      graph: data.digest.graphVersion
  - file:
      path: add-queue.yaml
      content: |
        schema: starci/workflow-change@1
        workflow: slow
        changes:
          - op: add
            task:
              id: queue
              label: docs
              summary: write the queue
              allowPaths: [platform/queue/queue.md]
              checks:
                - preset: files-exist
                  args: {files: [platform/queue/queue.md]}
  - file:
      path: cmd-queue.yaml
      content: |
        schema: starci/command@1
        cmdId: k-slow-need-queue
        kind: workflow-change
        workflow: slow
        basedOn: {graph: ${graph}}
        answers: [${decision}]
        change: add-queue.yaml
        need: {key: "capability:queue", resolver: queue}
  - starci: [kernel, submit, "${run}/cmd-queue.yaml"]
  - starci: [workflow, step, slow]
    expect: {}
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'queue'"
      as: queue
  - name: the resolver fails
    worker:
      task: ${queue}
      status: failed
      output: {summary: the queue does not build, files: [], rulesApplied: []}
  - starci: [workflow, step, slow]
    expect: {}
  - name: the need returns to the Supervisor in round 2; the waiter stays parked
    assert:
      sql:
        db: machine
        query: "SELECT n.state || ':' || n.level || ':' || n.round || ':' || (SELECT COUNT(*) FROM shared_need_waiters w WHERE w.released_at IS NULL) FROM shared_needs n"
        equals: ["routed:supervisor:2:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND kind = 'shared-need' AND answered_at IS NULL AND json_extract(evidence_json, '$.round') = 2"
        equals: [1]
