schema: starci/scenario@1
id: lifecycle-inline-chain
group: lifecycle
title: fresh inline workflow of two dependent tasks runs to done
inject: "nothing: the reference run every other scenario perturbs"
expect: each task is queued only when its dependency is done, verified on a clean checkout and committed with its trailer; the workflow ends done
pass:
  - tasks a and b done, workflow done
  - "git log holds exactly one commit per task, each with Starci-Task: <id>"
  - the worktree is clean
  - Orca is never called for an inline workflow
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: chain
        goal: bench workflow chain
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
          - id: b
            label: docs
            summary: write doc b
            allowPaths:
              - docs/b.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/b.md
            dependsOn:
              - a
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - chain
    save:
      a: data.nodes.0.task.id
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks
        equals:
          - 1
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
  - name: step
    starci:
      - workflow
      - step
      - chain
    save:
      b: data.nodes.1.task.id
  - name: worker files done
    worker:
      task: ${b}
      status: done
      files:
        docs/b.md: |
          # b
  - name: step
    starci:
      - workflow
      - step
      - chain
    save: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows WHERE id = 'chain'
        equals:
          - done
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks ORDER BY created_at
        equals:
          - done
          - done
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
  - assert:
      gitLog:
        grep: "Starci-Task: ${b}"
        count: 1
  - assert:
      gitClean: true
  - assert:
      orcaCalls:
        command: worker-start
        count: 0
