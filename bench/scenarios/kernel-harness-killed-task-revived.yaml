schema: starci/scenario@1
id: kernel-harness-killed-task-revived
group: orca
title: "a task the harness killed on its last try returns to ready at the same try, with no Kernel decision"
inject: >-
  Orca fences the Op's launch (consumer_fenced, a harness error), and the task then ends cancelled on its last try (3 of 3), as
  a cancel before the fence was requeued used to leave it
expect: >-
  the cancelled task carries a harness cause and no red of its own, so its node is ready again: the next kernel next dispatches a
  retry of it at the same try (3), records task-revived with the cause, raises no red decision, keeps the workflow running and
  launches the retry; a task that failed by its own red is not revived
pass:
  - "after the fence and the cancel: one task, cancelled, try 3, its attempt consumer-fenced"
  - "after kernel next: a second task retrying the first at try 3, running, and one task-revived event naming consumer-fenced"
  - no red decision for the Kernel, and the workflow is running
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: one
        goal: bench workflow one
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: one
  - orca:
      rules:
        - command: worker-start
          match:
            task-title: '^\[Op\]'
          fault: refuse
          code: consumer_fenced
          message: This terminal is attested as another terminal and cannot act as the consumer.
          times: 1
  - name: kernel next meets a fenced launch
    seat: kernel:one
    starci: [kernel, next, one, --wait, "0"]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT outcome FROM attempts
        equals:
          - consumer-fenced
  - name: the task ends cancelled on its last try
    sql:
      db: ledger
      exec: UPDATE tasks SET status = 'cancelled', try_no = 3
  - name: kernel next revives it at the same try and launches it
    seat: kernel:one
    starci: [kernel, next, one, --wait, "0"]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks
        equals:
          - 2
  - assert:
      sql:
        db: ledger
        query: SELECT try_no || ':' || status || ':' || (retry_of IS NOT NULL) FROM tasks ORDER BY created_at, rowid
        equals:
          - "3:cancelled:0"
          - "3:running:1"
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.cause') FROM events WHERE kind = 'task-revived'"
        equals:
          - consumer-fenced
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'kernel' AND kind = 'red'"
        equals:
          - 0
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows
        equals:
          - running
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
          run: "${kernel.one.run}"
          from: "${kernel.one.terminal}"
        count: 2
  - read:
      db: ledger
      query: SELECT id FROM tasks WHERE status = 'running'
      as: revived
  - name: the revived task fails by its own words (its worker files failed)
    worker:
      task: ${revived}
      status: failed
  - name: kernel next hands the Kernel its red, and revives nothing
    seat: kernel:one
    starci: [kernel, next, one, --wait, "0"]
    expect:
      contains: '"kind": "red"'
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks
        equals:
          - 2
