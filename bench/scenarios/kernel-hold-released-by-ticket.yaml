schema: starci/scenario@1
id: kernel-hold-released-by-ticket
group: orca
title: "a hold names what releases it: one linked to a ticket is released on the ticket's close; a conditionless hold is refused"
inject: >-
  the workflow's task fails red on a harness defect; the Kernel holds it with no release condition, then holds it against the
  defect's ticket; forty-six minutes pass; Debug closes the ticket
expect: >-
  the conditionless hold is refused HOLD_UNCONDITIONED; the hold on the ticket is recorded on the task, keeps it out of the
  undecided wakes (no kernel-undecided past the threshold); the ticket's close releases it at once, reopening the red decision
  as the Kernel's, which kernel next returns again
pass:
  - a hold with no condition is refused HOLD_UNCONDITIONED
  - a held task is neither woken nor handed to the Supervisor while its ticket is open
  - the ticket's close releases the hold and reopens the Kernel's red decision
  - "no step without evidence: every state change in the ledger has its event"
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: held
        goal: bench workflow held
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: held
  - seat: kernel:held
    starci: [kernel, next, held, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: a
  - worker:
      task: ${a}
      files: {}
      output:
        summary: wrote nothing
        files: []
        rulesApplied: []
  - seat: kernel:held
    starci: [kernel, next, held, --wait, "0"]
    expect:
      contains: '"kind": "red"'
    save:
      red: data.decision.id
      graph: data.digest.graphVersion
  - name: the defect behind the red is filed as a ticket
    seat: supervisor
    starci: [ticket, open, --kind, harness-defect, --severity, blocking, --title, "verify of doc a refuses CHECK_SCOPE_EMPTY (cli/src/harness/run-checks.ts)"]
  - read:
      db: machine
      query: SELECT id FROM tickets
      as: ticket
  - file:
      path: bare.yaml
      content: |
        schema: starci/command@1
        cmdId: k-held-bare-1
        kind: workflow-change
        workflow: held
        basedOn: {graph: ${graph}}
        answers: [${red}]
        note: hold until Debug says
  - name: a hold with no release condition is refused
    seat: kernel:held
    starci: [kernel, submit, "${run}/bare.yaml"]
    expect:
      exit: 1
      code: HOLD_UNCONDITIONED
  - file:
      path: hold.yaml
      content: |
        schema: starci/command@1
        cmdId: k-held-ticket-1
        kind: workflow-change
        workflow: held
        basedOn: {graph: ${graph}}
        answers: [${red}]
        hold: {ticket: ${ticket}}
        note: the red is the harness defect of the ticket; retry once it is fixed
  - name: the Kernel holds the task against the ticket
    seat: kernel:held
    starci: [kernel, submit, "${run}/hold.yaml"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'task-held' AND subject = '${a}' AND json_extract(data_json, '$.until.ticket') = '${ticket}' AND json_extract(data_json, '$.decision') = '${red}'"
        equals: [1]
  - name: forty-six minutes pass
    sql:
      db: ledger
      exec: >-
        UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-46 minutes');
        UPDATE decisions SET raised_at = strftime('%Y-%m-%dT%H:%M:%fZ', raised_at, '-46 minutes'), answered_at = CASE WHEN answered_at IS NULL THEN NULL ELSE strftime('%Y-%m-%dT%H:%M:%fZ', answered_at, '-46 minutes') END;
        UPDATE tasks SET updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', updated_at, '-46 minutes'), created_at = strftime('%Y-%m-%dT%H:%M:%fZ', created_at, '-46 minutes');
        UPDATE seats SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', started_at, '-46 minutes')
  - name: the held task is neither woken nor handed while its ticket is open
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE kind = 'kernel-undecided'"
        equals: [0]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'decision-idle'"
        equals: [0]
  - name: Debug closes the ticket, which releases the hold
    env:
      STARCI_ROLE: debug
    starci: [ticket, close, "${ticket}", --wontfix, --reason, "fixed elsewhere"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'hold-released' AND subject = '${a}' AND json_extract(data_json, '$.cmdId') = 'k-held-ticket-1'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT answered_at IS NULL FROM decisions WHERE id = '${red}'"
        equals: [1]
  - name: the red decision is the Kernel's again
    seat: kernel:held
    starci: [kernel, next, held, --wait, "0"]
    expect:
      contains: "${red}"
