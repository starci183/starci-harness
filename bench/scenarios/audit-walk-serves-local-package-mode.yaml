schema: starci/scenario@1
id: audit-walk-serves-local-package-mode
group: verify
title: a walk in a project in local package mode serves the local @starci package, as the wave judged it, never the registry pin
inject: >-
  an app in local package mode (starci deps source --local) whose installed @starci/tsconfig is then put back to the
  registry's copy, as an install from the cache or npm's reify leaves it, before an audit walks the app
expect: >-
  starci uat run gives the walk's checkout what a wave gives the checkout it judges (harness/install-cache.ts installCheckout):
  the repository's local package sources are applied over the install before any container runs, so the walk serves the local
  package, and its output names the local copy it applied
pass:
  - local mode copies the fixture folder over node_modules/@starci/tsconfig
  - after the install is put back to the registry copy, the walk re-applies the local copy before it runs
  - the walk's output names the local package sources it applied
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench local walk app\n"
    package.json: '{"name": "bench-local-walk", "version": "1.0.0", "private": true}'
    package-lock.json: '{"name": "bench-local-walk", "version": "1.0.0", "lockfileVersion": 3, "requires": true, "packages": {"": {"name": "bench-local-walk", "version": "1.0.0"}}}'
    .gitignore: "node_modules/\nruns/\n"
    walks/walk.mjs: |
      import { writeFileSync } from "node:fs"
      import { request } from "node:http"

      const port = Number(process.env.WALK_PORT)
      const status = await new Promise((resolve, reject) => {
          const asked = request({ host: "127.0.0.1", port, path: "/en/sign-in", headers: { "sec-fetch-dest": "document" } }, (response) => {
              response.resume()
              response.on("end", () => resolve(response.statusCode))
          })
          asked.on("error", reject)
          asked.end()
      })
      writeFileSync("observations.json", JSON.stringify([status]))
steps:
  - name: the app holds an install
    write:
      path: node_modules/.package-lock.json
      content: '{"name": "bench-local-walk", "version": "1.0.0", "lockfileVersion": 3, "requires": true, "packages": {}}'
  - name: local mode copies the folder over the installed package
    starci: [deps, source, --local, --from, "${ops}/../bench/fixtures/deps-source/ahead", --package, tsconfig, --prebuilt]
    expect:
      exit: 0
      contains: "\"targets\": ["
  - assert:
      exists:
        path: node_modules/@starci/tsconfig/base.json
        present: true
        contains: verbatimModuleSyntax
  - name: the install is put back to the registry copy, which lacks the local setting
    write:
      path: node_modules/@starci/tsconfig/base.json
      content: '{"compilerOptions": {"strict": true}}'
  - name: the app answers its pages
    serve: { stub: app, as: served, args: [--status, "200"] }
  - name: the walk applies the local package sources before it runs
    env: { WALK_PORT: "${served.token}" }
    starci: [uat, run, walks/walk.mjs, --forward, "${served.token}", --env, WALK_PORT, --out, runs/walk]
    expect:
      exit: 0
      contains: "local package sources (starci deps source)"
  - assert:
      exists:
        path: node_modules/@starci/tsconfig/base.json
        present: true
        contains: verbatimModuleSyntax
  - assert:
      exists:
        path: runs/walk/observations.json
        present: true
        contains: "[200]"
