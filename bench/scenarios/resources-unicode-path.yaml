schema: starci/scenario@1
id: resources-unicode-path
group: resources
title: a repository under a Vietnamese path with spaces runs end to end
inject: the scratch repository lives at 'dự án thử nghiệm/kho mã' and the task writes 'tài liệu/ghi chú.md'
expect: define, start, result, verify and commit work; the path survives every argv and the brief
pass:
  - task done
  - one task commit
  - HEAD has the unicode file
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  dir: dự án thử nghiệm/kho mã
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: viet
        goal: bench workflow viet
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - tài liệu/ghi chú.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - tài liệu/ghi chú.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - viet
    save:
      a: data.nodes.0.task.id
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        tài liệu/ghi chú.md: |
          # xin chào
  - name: step
    starci:
      - workflow
      - step
      - viet
    save: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - done
  - assert:
      gitHas:
        path: tài liệu/ghi chú.md
        present: true
