schema: starci/scenario@1
id: orca-unknown-launch-live-terminal-kept
group: orca
title: "Orca completed an Op's launch but never saw its turn start, and its terminal stays live: never fenced, adopted once it prints"
inject: >-
  worker-start's answer is lost (effect_unknown); request-show says completed with a receipt naming the dispatch, worker-show keeps
  that worker at start_unknown past stall.startDeadlineMinutes, and Orca keeps listing its terminal, quiet; then the terminal prints
expect: >-
  an unverifiable start never becomes launch-failed while its terminal lives: kernel next waits past the start deadline (its seat
  holding the terminal), stops nothing and launches nothing beside it; once the terminal prints after the launch the dispatch is
  adopted and the task runs
pass:
  - one Op launch; no worker-stop and no terminal close of its dispatch
  - the task runs again on the adopted dispatch
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: lt
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: lt
  - name: the Op launch lands, its answer is lost, and Orca never sees its turn start
    orca:
      set:
        newWorkerState: start_unknown
      rules:
        - command: worker-start
          fault: lost-reply
          match:
            task-title: '^\[Op\]'
  - seat: kernel:lt
    starci: [kernel, next, lt, --wait, "0"]
  - name: a young start waits
    seat: kernel:lt
    starci: [kernel, next, lt, --wait, "0"]
  - read:
      db: ledger
      query: SELECT terminal FROM seats WHERE role = 'worker' AND terminal IS NOT NULL
      as: opterm
  - sql:
      db: ledger
      exec: UPDATE seats SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-11 minutes') WHERE role = 'worker'
  - name: past the start deadline a live quiet terminal is waited on
    seat: kernel:lt
    starci: [kernel, next, lt, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals: [effect_unknown]
  - name: the terminal prints
    orca:
      set:
        lastOutput:
          ${opterm}: "2099-01-01T00:00:00.000Z"
  - name: the dispatch whose terminal shows a turn is adopted
    seat: kernel:lt
    starci: [kernel, next, lt, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals: [running]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 1
  - assert:
      orcaCalls:
        command: worker-stop
        count: 0
  - assert:
      orcaCalls:
        command: terminal close
        match:
          terminal: "${opterm}"
        count: 0
