schema: starci/scenario@1
id: lane-fe-code-held-until-ui
group: plan
title: front-end code waits for its feature's screens to be drawn
inject: the cart screen is not drawn yet; one plan builds its code beside the drawing, the next behind it
expect: >-
  define refuses FLOW_INCOMPLETE while the front-end code task does not depend on the tasks drawing its feature's ui records,
  naming the record it is held until; with the code behind the drawing and the art the plan is recorded
pass:
  - the plan whose code task runs beside the drawing is refused FLOW_INCOMPLETE naming the held ui record
  - the plan whose code task depends on the art (behind the drawing) is recorded
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
    .starciwork/.gitignore: "runs/\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: be, name: api}
        - {role: fe, name: web}
    .starciwork/features/shop/ui/cart/index.yaml: |
      schema: work/ui-screen@1
      id: ui.shop.cart
      title: the cart screen
      state: todo
      activity: idle
      route: /cart
    .starciwork/features/shop/impl/web/cart/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.web.cart
      title: the cart screen's code
      state: todo
      activity: idle
      repository: web
      owners:
        - {role: fe, path: web/src/cart}
      proves: [ui.shop.cart]
    .starciwork/features/shop/uat/checkout/index.yaml: |
      schema: work/uat-flow@1
      id: uat.shop.checkout
      title: a buyer checks out the cart
      state: todo
      activity: idle
      entry: /cart
      actor: buyer
      steps:
        - {order: 1, action: open the cart, expected: the cart lists its items}
steps:
  - file:
      path: beside.yaml
      content: |
        schema: starci/workflow@1
        id: beside
        goal: draw and build the cart screen
        runner: inline
        tasks:
          - id: draw
            label: draw
            summary: draw the cart screen
            allowPaths: [.starciwork/features/shop/ui/cart]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core}
          - id: image
            label: image
            summary: generate the cart screen's art
            dependsOn: [draw]
            allowPaths: [.starciwork/features/shop/ui/cart/assets]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
          - id: code
            label: code
            summary: build the cart screen
            allowPaths: [web/src/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {side: fe, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: audit
            label: audit
            summary: audit the cart screen against its direction
            dependsOn: [code]
            allowPaths: [web/audit/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml, .starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core, run: web/audit/cart}
          - id: walk
            uat: uat.shop.checkout
            dependsOn: [audit]
  - name: define with the code beside the drawing
    starci: [workflow, define, "${run}/beside.yaml"]
    expect:
      exit: 1
      code: FLOW_INCOMPLETE
      contains: "held until ui.shop.cart; make it depend on draw, image"
  - file:
      path: behind.yaml
      content: |
        schema: starci/workflow@1
        id: behind
        goal: draw and build the cart screen
        runner: inline
        tasks:
          - id: draw
            label: draw
            summary: draw the cart screen
            allowPaths: [.starciwork/features/shop/ui/cart]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core}
          - id: image
            label: image
            summary: generate the cart screen's art
            dependsOn: [draw]
            allowPaths: [.starciwork/features/shop/ui/cart/assets]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
          - id: code
            label: code
            summary: build the cart screen
            dependsOn: [image]
            allowPaths: [web/src/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {side: fe, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: audit
            label: audit
            summary: audit the cart screen against its direction
            dependsOn: [code]
            allowPaths: [web/audit/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml, .starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core, run: web/audit/cart}
          - id: walk
            uat: uat.shop.checkout
            dependsOn: [audit]
  - name: define with the code behind the drawing
    starci: [workflow, define, "${run}/behind.yaml"]
    expect:
      exit: 0
      contains: "impl.shop.web.cart [impl-fe]: code carried (code)"
  - assert:
      sql:
        db: ledger
        query: SELECT id FROM workflows
        equals:
          - behind
