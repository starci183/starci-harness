schema: starci/scenario@1
id: release-publish-plan-guard
group: release
title: the release plan refuses a package published against a sibling it does not ship with
inject: >-
  a scratch repository whose cli/ requires its packages/hfs sibling at another version than the sibling's own, then at the
  sibling's version while the sibling is private
expect: >-
  `release publish` (the plan CI's publish job judges before anything reaches npm) refuses RELEASE_DEPENDENCY_SKEW while
  the due CLI requires another hfs than the folder holds, RELEASE_DEPENDENCY_UNPUBLISHED while that hfs is private, and
  passes once the CLI requires the hfs due in the same run
pass:
  - the skewed requirement is refused RELEASE_DEPENDENCY_SKEW
  - a private sibling is refused RELEASE_DEPENDENCY_UNPUBLISHED
  - the CLI requiring the hfs due in the same run plans both, exit 0
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: packages/hfs/package.json
      content: |
        {"name":"@starci-bench-guard/hfs","version":"2.0.1"}
  - write:
      path: cli/package.json
      content: |
        {"name":"starci-bench-guard-cli","version":"1.0.0","dependencies":{"@starci-bench-guard/hfs":"2.0.0"}}
  - name: the due CLI requires another hfs than the folder holds
    starci: [release, publish]
    expect:
      exit: 1
      code: RELEASE_DEPENDENCY_SKEW
  - write:
      path: packages/hfs/package.json
      content: |
        {"name":"@starci-bench-guard/hfs","version":"2.0.0","private":true}
  - name: the hfs it requires is private, never on npm
    starci: [release, publish]
    expect:
      exit: 1
      code: RELEASE_DEPENDENCY_UNPUBLISHED
  - write:
      path: packages/hfs/package.json
      content: |
        {"name":"@starci-bench-guard/hfs","version":"2.0.0"}
  - name: the CLI requires the hfs due in the same run
    starci: [release, publish]
    expect:
      exit: 0
      ok: true
      contains: "\"package\": \"@starci-bench-guard/hfs\""
