schema: starci/scenario@1
id: lane-be-needs-test-e2e-review
group: plan
title: back-end code is tested, proven end to end and reviewed before the plan is recorded
inject: a back-end impl record in state todo; a plan that only codes it
expect: >-
  define refuses FLOW_INCOMPLETE naming each missing step of the impl-be lane (test, e2e, review); the plan that codes,
  tests, runs the e2e suite and reviews, each behind the one before, is recorded; security and perf stay optional because the
  goal does not require them
pass:
  - the code-only plan is refused FLOW_INCOMPLETE naming test, e2e and review
  - the full lane is recorded with security and perf optional
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: be, name: api}
        - {role: fe, name: web}
    .starciwork/features/shop/impl/api/orders/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.api.orders
      title: the orders slice
      state: todo
      activity: idle
      repository: api
      owners:
        - {role: be, path: api/src/orders}
      proves: []
steps:
  - file:
      path: codeonly.yaml
      content: |
        schema: starci/workflow@1
        id: codeonly
        goal: build the orders slice
        runner: inline
        tasks:
          - id: code
            label: code
            summary: build the orders slice
            allowPaths: [api/src/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {side: be, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
  - name: code only, test missing
    starci: [workflow, define, "${run}/codeonly.yaml"]
    expect:
      exit: 1
      code: FLOW_INCOMPLETE
      contains: "step test is neither satisfied"
  - name: code only, e2e missing
    starci: [workflow, define, "${run}/codeonly.yaml"]
    expect:
      exit: 1
      code: FLOW_INCOMPLETE
      contains: "step e2e is neither satisfied"
  - name: code only, review missing
    starci: [workflow, define, "${run}/codeonly.yaml"]
    expect:
      exit: 1
      code: FLOW_INCOMPLETE
      contains: "step review is neither satisfied"
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: orders
        goal: build the orders slice
        runner: inline
        tasks:
          - id: code
            label: code
            summary: build the orders slice
            allowPaths: [api/src/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {side: be, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: test
            label: test
            summary: test the orders slice
            dependsOn: [code]
            allowPaths: [api/test/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: e2e
            label: verify
            summary: run the orders e2e suite
            dependsOn: [test]
            allowPaths: [api/reports/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {suite: "node --version", step: e2e}
          - id: review
            label: review
            summary: review the orders diff
            dependsOn: [e2e]
            allowPaths: [api/reviews/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {since: HEAD}
  - name: define the whole lane
    starci: [workflow, define, "${run}/wf.yaml"]
    expect:
      exit: 0
      contains: "impl.shop.api.orders [impl-be]: code carried (code), test carried (test), e2e carried (e2e), security optional, perf optional, review carried (review)"
