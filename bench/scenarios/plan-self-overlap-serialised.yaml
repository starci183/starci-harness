schema: starci/scenario@1
id: plan-self-overlap-serialised
group: plan
title: "the Kernel plans two independent tasks over one path: the lease serialises them"
inject: tasks a and b both lease docs/shared.md, no dependsOn, maxParallel 2
expect: define accepts (overlap is allowed); only one launches; the other waits without a lease until the first ends
pass:
  - exactly one worker-start
  - one running task, one lease
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: self
        goal: bench workflow self
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/shared.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
          - id: b
            label: docs
            summary: write doc b
            allowPaths:
              - docs/shared.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/b.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - self
    save: {}
  - assert:
      orcaCalls:
        command: worker-start
        count: 1
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM leases
        equals:
          - 1
