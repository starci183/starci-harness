schema: starci/scenario@1
id: anatomy-gate-rule-without-enforcer
group: verify
title: "contexts anatomy --check is red on a slot rule code with no rule, a rule with no or only planned enforcers, and a pending entry no live owner ruling covers"
inject: >-
  a fixture knowledge tree (STARCI_CONTEXTS_DIR) whose slot names a code no rule carries, then rules with no enforcer, only a
  planned enforcer and an undeclared enforcer kind, then pending entries citing no ruling, a proposed ruling, a live ruling that
  lists them, and a pending entry that holds no gap
expect: >-
  --check exits 1 with ANATOMY_SLOT_RULE_UNKNOWN, ANATOMY_RULE_NO_ENFORCER, ANATOMY_RULE_ENFORCER_PLANNED and
  ANATOMY_ENFORCER_KIND_UNKNOWN, a law citing a path or yaml key that does not resolve ANATOMY_LAW_PATH_UNRESOLVED; a pending entry whose ruling is unknown, proposed or does not list it in covers is
  ANATOMY_PENDING_UNRULED; with a live ruling covering each pending gap the check is green and names the ruling; a pending entry
  for a gap that no longer exists is ANATOMY_PENDING_STALE
pass:
  - each gap kind is red with its own code
  - an enforcer kind enforcerKinds does not declare is red
  - a law citing a missing file or yaml key is red, one citing a present key is not
  - a pending entry without a live ruling listing it is red
  - pending entries a live ruling covers keep the check green and are listed
  - a pending entry that holds no gap is red
  - no human intervention beyond the injected fault
automation: automated
env:
  STARCI_CONTEXTS_DIR: ${repo}/contexts
steps:
  - write:
      path: contexts/hfs/slots.yaml
      content: |
        slots:
          - {id: app.readme, profiles: [app], path: README.md, presence: required, tracked: tracked, rules: [FX_README]}
          - {id: app.docs, profiles: [app], path: docs/, presence: optional, tracked: tracked, rules: [FX_DOCS_GHOST]}
  - write:
      path: contexts/hfs/rules.yaml
      content: |
        enforcerKinds:
          hfs: a check of the app CLI
        rules:
          - {id: R01, code: FX_README, failureCodes: [FX_README], enforcers: [{kind: hfs, id: readme}]}
  - write:
      path: contexts/decisions/rulings.yaml
      content: |
        rulings: []
  - write:
      path: contexts/code/be/README.md
      content: |
        # Backend
  - write:
      path: contexts/code/fe/README.md
      content: |
        # Frontend
  - write:
      path: contexts/project/anatomy.md
      content: |
        # Anatomy

        <!-- anatomy:begin (generated by `starci contexts anatomy --write` from hfs/slots.yaml; do not edit) -->
        <!-- anatomy:end -->
  - name: generate the fixture's anatomy, slices and index
    starci: [contexts, anatomy, --write]
    expect: { exit: 0 }
  - name: a slot names a code no rule carries
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: '"detail": "slot app.docs names FX_DOCS_GHOST, which no rule of hfs/rules.yaml carries as its code or a failure code"' }
  - write:
      path: contexts/hfs/slots.yaml
      content: |
        slots:
          - {id: app.readme, profiles: [app], path: README.md, presence: required, tracked: tracked, rules: [FX_README]}
  - write:
      path: contexts/hfs/rules.yaml
      content: |
        enforcerKinds:
          hfs: a check of the app CLI
        rules:
          - {id: R01, code: FX_README, failureCodes: [FX_README], enforcers: [{kind: hfs, id: readme}]}
          - {id: R02, code: FX_BARE, failureCodes: [FX_BARE], enforcers: []}
          - {id: R03, code: FX_PLANNED, failureCodes: [FX_PLANNED], enforcers: [{kind: hfs, id: planned-check, status: planned}]}
          - {id: R04, code: FX_GHOST_KIND, failureCodes: [FX_GHOST_KIND], enforcers: [{kind: ghost, id: nothing}]}
          - {id: R05, code: FX_LAW_PATH, law: "Read contexts/hfs/rules.yaml#rules and contexts/hfs/no-such-file.yaml.", failureCodes: [FX_LAW_PATH], enforcers: [{kind: hfs, id: law-path}]}
          - {id: R06, code: FX_LAW_KEY, law: "Read contexts/hfs/slots.yaml#no-such-key.", failureCodes: [FX_LAW_KEY], enforcers: [{kind: hfs, id: law-key}]}
  - starci: [contexts, anatomy, --write]
    expect: { exit: 0 }
  - name: a rule with no enforcer
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: '"code": "ANATOMY_RULE_NO_ENFORCER"' }
  - name: a rule judged only by a planned enforcer
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: '"code": "ANATOMY_RULE_ENFORCER_PLANNED"' }
  - name: an enforcer of an undeclared kind
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: '"code": "ANATOMY_ENFORCER_KIND_UNKNOWN"' }
  - name: a law citing a file that does not exist
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: "R05's law cites contexts/hfs/no-such-file.yaml, which does not exist" }
  - name: a law citing a yaml key the file lacks
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: "R06's law cites contexts/hfs/slots.yaml#no-such-key, which has no top-level key no-such-key" }
  - write:
      path: contexts/hfs/rules.yaml
      content: |
        enforcerKinds:
          hfs: a check of the app CLI
        rules:
          - {id: R01, code: FX_README, failureCodes: [FX_README], enforcers: [{kind: hfs, id: readme}]}
          - {id: R02, code: FX_BARE, failureCodes: [FX_BARE], enforcers: []}
          - {id: R03, code: FX_PLANNED, failureCodes: [FX_PLANNED], enforcers: [{kind: hfs, id: planned-check, status: planned}]}
        pending:
          - {gap: rule-no-enforcer, subject: R02, since: '2026-10-27', ruling: fx-pending}
          - {gap: rule-enforcer-planned, subject: R03, since: '2026-10-27', ruling: fx-pending}
  - starci: [contexts, anatomy, --write]
    expect: { exit: 0 }
  - name: a pending entry citing no ruling is red
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: '"code": "ANATOMY_PENDING_UNRULED"' }
  - write:
      path: contexts/decisions/rulings.yaml
      content: |
        rulings:
          - {id: fx-pending, date: '2026-10-27', status: proposed, ruling: "R02 and R03 wait for their enforcers.", owner: hfs/rules.yaml, covers: [R02, R03]}
  - name: a proposed ruling holds nothing open
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: '"code": "ANATOMY_PENDING_UNRULED"' }
  - write:
      path: contexts/decisions/rulings.yaml
      content: |
        rulings:
          - {id: fx-pending, date: '2026-10-27', status: live, ruling: "R02 waits for its enforcer.", owner: hfs/rules.yaml, covers: [R02]}
  - name: a live ruling that does not list the gap holds nothing open
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: '"code": "ANATOMY_PENDING_UNRULED"' }
  - write:
      path: contexts/decisions/rulings.yaml
      content: |
        rulings:
          - {id: fx-pending, date: '2026-10-27', status: live, ruling: "R02 and R03 wait for their enforcers.", owner: hfs/rules.yaml, covers: [R02, R03]}
  - name: a live ruling covering each pending gap keeps the check green
    starci: [contexts, anatomy, --check]
    expect: { exit: 0, contains: '"ruling": "fx-pending"' }
  - write:
      path: contexts/hfs/rules.yaml
      content: |
        enforcerKinds:
          hfs: a check of the app CLI
        rules:
          - {id: R01, code: FX_README, failureCodes: [FX_README], enforcers: [{kind: hfs, id: readme}]}
          - {id: R02, code: FX_BARE, failureCodes: [FX_BARE], enforcers: [{kind: hfs, id: bare-check}]}
          - {id: R03, code: FX_PLANNED, failureCodes: [FX_PLANNED], enforcers: [{kind: hfs, id: planned-check, status: planned}]}
        pending:
          - {gap: rule-no-enforcer, subject: R02, since: '2026-10-27', ruling: fx-pending}
          - {gap: rule-enforcer-planned, subject: R03, since: '2026-10-27', ruling: fx-pending}
  - starci: [contexts, anatomy, --write]
    expect: { exit: 0 }
  - name: once R02 has its enforcer, its pending entry is stale and red
    starci: [contexts, anatomy, --check]
    expect: { exit: 1, contains: '"code": "ANATOMY_PENDING_STALE"' }
