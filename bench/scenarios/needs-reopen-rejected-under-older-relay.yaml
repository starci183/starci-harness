schema: starci/scenario@1
id: needs-reopen-rejected-under-older-relay
group: needs
title: "a need rejected because its relay conflicted under an older relay is reopened once under the current relay, through its last resolver, and relayed; needs reopen takes back any rejection"
inject: >-
  workflow auth resolves capability:platform.http for workflow sub; the need is then found rejected as unrelayable, its waiter
  released by the rejection, after a relay conflict recorded by an older relay (no relayVersion), as a need rejected before a
  relay fix stands
expect: >-
  sub's next step reopens the need once (need-reopened, relayReopen, the current relay version), parks its waiter again,
  resolves it through auth's landed task with every commit it landed, relays them onto sub's branch and releases the waiter,
  which runs again; a later step reopens nothing more; `needs reopen` (Supervisor or Debug) takes back a later rejection the
  same way, refuses a need that is not rejected (NEED_NOT_REJECTED) and is refused to a Kernel
pass:
  - one need-reopened event by the harness under the current relay version, and the waiter parked again
  - the resolving commit is on sub's branch and a need-relayed event records it under the current relay version
  - the waiter released by resolved, its relay relayed, and launched again
  - a second step reopens nothing
  - needs reopen by the Supervisor reopens a rejected need through its last resolver; a resolved one is refused, and so is a Kernel
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: auth.yaml
      yaml:
        schema: starci/workflow@1
        id: auth
        goal: sign in, with the shared http client
        runner: orca
        maxParallel: 2
        tasks:
          - id: http
            label: docs
            summary: write the shared http client
            allowPaths: [platform/http/client.md]
            checks:
              - preset: files-exist
                args: {files: [platform/http/client.md]}
          - id: login
            label: docs
            summary: write the login doc
            allowPaths: [docs/login.md]
            checks:
              - preset: files-exist
                args: {files: [docs/login.md]}
  - file:
      path: sub.yaml
      yaml:
        schema: starci/workflow@1
        id: sub
        goal: premium subscription payments
        runner: orca
        maxParallel: 2
        tasks:
          - id: pay
            label: docs
            summary: write the payment rails doc, which calls the shared http client
            allowPaths: [docs/pay.md]
            checks:
              - preset: files-exist
                args: {files: [docs/pay.md, platform/http/client.md]}
  - boot:
      file: ${run}/auth.yaml
      workflow: auth
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - boot:
      file: ${run}/sub.yaml
      workflow: sub
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'http'"
      as: http
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'pay'"
      as: pay
  - name: auth lands the client on its own branch
    worker:
      task: ${http}
      files:
        platform/http/client.md: "# HttpClient\n"
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - assert:
      gitLog:
        grep: "Starci-Task: ${http}"
        count: 1
        in: ${worktree.auth}
  - assert:
      gitLog:
        grep: "Starci-Task: ${http}"
        count: 0
        in: ${worktree.sub}
  - name: sub's Op cannot see it on its branch
    worker:
      task: ${pay}
      status: blocked
      output:
        summary: platform/http has no HttpClient on this branch
        files: []
        rulesApplied: []
        needs: [{key: "capability:platform.http", paths: [platform/http/client.md], rule: BE-INFRA-2}]
  - name: sub's Kernel step parks it and routes the need to the Supervisor
    seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || level FROM shared_needs"
        equals: ["routed:supervisor"]
  - file:
      path: owner.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-http-by-auth
        kind: need-owner
        workflow: auth
        basedOn: {}
        need: {key: "capability:platform.http", resolver: [http]}
        note: auth landed the client already
  - name: the Supervisor names auth's landed task as the resolver
    seat: supervisor
    starci: [supervisor, submit, "${run}/owner.yaml"]
  - name: auth's step resolves it
    seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || json_array_length(resolver_json, '$.commits') FROM shared_needs"
        equals: ["resolved:1"]
  - name: the need is found rejected as unrelayable after a relay conflict an older relay recorded
    sql:
      db: machine
      exec: >-
        INSERT INTO host_events (at, kind, subject, data_json) SELECT '2026-01-01T00:00:00.000Z', 'need-relay-conflict', project || '|' || key,
        '{"workflow":"sub","round":1,"branch":"starci/sub","commits":[],"node":"relay.capability-platform.http.r1","waiters":["pay"],"relay":{"status":"conflict","relayed":[],"files":["platform/http/client.md"],"detail":"conflict"}}' FROM shared_needs;
        UPDATE shared_needs SET state = 'rejected', owner_json = NULL, resolver_json = NULL, reason = 'unrelayable: the relay dropped the commits it stands on';
        UPDATE shared_need_waiters SET released_at = '2026-01-01T00:00:00.000Z', release_json = '{"by":"rejected","round":1,"reason":"unrelayable","carried":null,"relay":{"status":"skipped","relayed":[],"files":[]},"retried":[]}'
  - name: sub's step reopens it under the current relay, resolves it through auth's task and relays the commits
    seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - assert:
      sql:
        db: machine
        query: "SELECT json_extract(data_json, '$.by') || ':' || json_extract(data_json, '$.relayReopen') || ':' || json_extract(data_json, '$.relayVersion') || ':' || json_extract(data_json, '$.parked') FROM host_events WHERE kind = 'need-reopened'"
        equals: ["harness:1:3:1"]
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || round || ':' || json_array_length(resolver_json, '$.commits') FROM shared_needs"
        equals: ["resolved:2:1"]
  - name: the resolving commit is on sub's branch now
    assert:
      gitLog:
        grep: "Starci-Task: ${http}"
        count: 1
        in: ${worktree.sub}
  - assert:
      sql:
        db: machine
        query: "SELECT json_extract(data_json, '$.workflow') || ':' || json_extract(data_json, '$.relay.status') || ':' || json_extract(data_json, '$.relayVersion') FROM host_events WHERE kind = 'need-relayed'"
        equals: ["sub:relayed:3"]
  - assert:
      sql:
        db: machine
        query: "SELECT json_extract(release_json, '$.by') || ':' || json_extract(release_json, '$.round') || ':' || json_extract(release_json, '$.relay.status') FROM shared_need_waiters"
        equals: ["resolved:2:relayed"]
  - name: the waiter runs again
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE plan_key = 'pay' AND status IN ('queued', 'running')"
        equals: [1]
  - name: a later step reopens nothing more
    seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM host_events WHERE kind = 'need-reopened'"
        equals: [1]
  - name: a resolved need is not reopened by hand
    seat: supervisor
    starci: [needs, reopen, "capability:platform.http", --reason, "the relay is fixed"]
    expect:
      exit: 1
      code: NEED_NOT_REJECTED
  - name: the Supervisor rejects it again, by hand this time
    sql:
      db: machine
      exec: >-
        UPDATE shared_needs SET state = 'rejected', resolver_json = NULL, reason = 'rejected by the Supervisor';
        UPDATE shared_need_waiters SET release_json = json_set(release_json, '$.by', 'rejected')
  - name: a Kernel may not take back a rejection
    seat: kernel:sub
    starci: [needs, reopen, "capability:platform.http", --reason, "mine"]
    expect:
      exit: 1
  - name: the Supervisor takes it back
    seat: supervisor
    starci: [needs, reopen, "capability:platform.http", --reason, "the rejection was wrong"]
    expect:
      contains: '"parked": 1'
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || round || ':' || json_extract(resolver_json, '$.workflow') FROM shared_needs"
        equals: ["resolving:3:auth"]
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || round FROM shared_needs"
        equals: ["resolved:3"]
  - assert:
      sql:
        db: machine
        query: "SELECT json_extract(data_json, '$.by') || ':' || json_extract(data_json, '$.relayReopen') FROM host_events WHERE kind = 'need-reopened' ORDER BY id"
        equals: ["harness:1", "supervisor:0"]
  - assert:
      sql:
        db: machine
        query: "SELECT json_extract(release_json, '$.by') || ':' || json_extract(release_json, '$.round') FROM shared_need_waiters"
        equals: ["resolved:3"]
