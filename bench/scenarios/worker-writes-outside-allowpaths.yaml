schema: starci/scenario@1
id: worker-writes-outside-allowpaths
group: worker
title: a worker that also writes outside its allowPaths lands nothing outside them
inject: the worker writes its doc and also src/backdoor.js, outside allowPaths
expect: "the candidate carries only allowPaths: either paths-only turns the verify red or the commit holds only docs/a.md; src/backdoor.js never reaches HEAD"
pass:
  - HEAD never contains src/backdoor.js
  - no commit touches a path outside allowPaths
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: out
        goal: bench workflow out
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - out
    save:
      a: data.nodes.0.task.id
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
        src/backdoor.js: |
          export const leak = 1
  - name: step
    starci:
      - workflow
      - step
      - out
    save: {}
    expect: {}
  - assert:
      gitHas:
        path: src/backdoor.js
        present: false
