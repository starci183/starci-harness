schema: starci/scenario@1
id: audit-walk-prepares-workspace-and-unserved-is-infra
group: verify
title: a walk builds the workspace package its app imports before it walks, and a walk where every page answered 5xx is the harness's failure, not a finding
inject: >-
  an npm workspace whose app imports a sibling package exporting only dist/, which git ignores, so the checkout a walk serves
  the app from lacks it; then an app that answers every page 500 (a dev server that cannot resolve that module)
expect: >-
  starci uat run gives the walk's checkout the workspace dependency before any container runs, as check run does: built and
  cached in the scratch repository, restored from the build cache in a task's Op worktree. The relay tallies the pages the walk
  opened; when every page answered 5xx the run is refused UAT_APP_UNSERVED with its receipt kept, and the result the worker files
  on that attempt is no verdict of the task: it fails walk-unserved, a harness cause, and the next step dispatches it again at the
  same try. A walk whose pages answer is the worker's own result, reported as filed.
pass:
  - uat run builds packages/ui/dist before walking, and refuses UAT_APP_UNSERVED when both pages it opened answered 500
  - the asset the error page loads (200, no document) is not counted as a page
  - the task's Op worktree, cut from a tree without dist, has the dependency before its walk
  - the result filed after an unserved walk fails the task with a walk-unserved event; no try is spent
  - the next workflow step revives the node at the same try (a retry at try 1, a task-revived event naming walk-unserved)
  - a walk where the app answers is green, tallies its pages, and the result filed after it is reported as the worker filed it
  - no human intervention beyond the injected fault
automation: automated
# The Docker stand-in (bench/stub/docker-stub.mjs) plays the container on this host: the CLI's own relay runs the walk script
# against the app stand-in on 127.0.0.2. The scratch commits are dated in the past: `lands` dates foreign commits to the second.
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
steps:
  - name: the fixture monorepo, its run folders ignored, and the walk script are committed
    write: { path: ".", from: "${ops}/../bench/fixtures/workspace-dist-only/repo" }
  - write:
      path: .gitignore
      content: "dist/\nruns/\n"
  - write:
      path: walks/walk.mjs
      content: |
        import { writeFileSync } from "node:fs"
        import { Agent, request } from "node:http"

        const port = Number(process.env.WALK_PORT)
        const agent = new Agent({ keepAlive: true, maxSockets: 1 })
        const open = (path, dest) =>
            new Promise((resolve, reject) => {
                const asked = request({ host: "127.0.0.1", port, path, agent, headers: { "sec-fetch-dest": dest } }, (response) => {
                    response.resume()
                    response.on("end", () => resolve(response.statusCode))
                })
                asked.on("error", reject)
                asked.end()
            })
        const seen = [await open("/en/sign-in", "document"), await open("/asset.js", "script"), await open("/en/sign-in?state=failed", "document")]
        agent.destroy()
        writeFileSync("observations.json", JSON.stringify(seen))
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: the workspace fixture and its walk"]
  - name: the app answers every page 500
    serve: { stub: app, as: broken }
  - name: the walk builds the workspace dependency first, then meets no app
    env: { WALK_PORT: "${broken.token}" }
    starci: [uat, run, walks/walk.mjs, --forward, "${broken.token}", --env, WALK_PORT, --out, runs/first]
    expect:
      exit: 1
      code: UAT_APP_UNSERVED
      contains: "every page the walk opened answered 5xx (2 of 2)"
  - assert:
      exists:
        path: packages/ui/dist/index.js
        present: true
  - assert:
      exists:
        path: runs/first/observations.json
        present: true
        contains: "[500,200,500]"
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: walk
        goal: the sign-in screen is walked
        runner: inline
        tasks:
          - id: screens
            label: docs
            summary: walk the sign-in screen
            allowPaths: [runs/screens]
            checks:
              - preset: files-exist
                args: {files: [walks/walk.mjs]}
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, walk]
    save:
      first: data.nodes.0.task.id
  - read:
      db: ledger
      query: "SELECT worktree FROM tasks WHERE id = '${first}'"
      as: firstCheckout
  - name: in the task's Op worktree the dependency is restored from the build cache, then the walk meets no app
    cwd: ${firstCheckout}
    env: { WALK_PORT: "${broken.token}" }
    starci: [uat, run, walks/walk.mjs, --forward, "${broken.token}", --env, WALK_PORT, --out, runs/screens]
    expect:
      exit: 1
      code: UAT_APP_UNSERVED
  - assert:
      exists:
        path: ${firstCheckout}/packages/ui/dist/index.js
        present: true
  - name: the worker files done as if the screens were judged
    worker:
      task: ${first}
      status: done
      output: { summary: "walked the sign-in screen", files: [], verdict: passed, findings: [] }
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || try_no FROM tasks WHERE id = '${first}'"
        equals: ["failed:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.pages.opened') || ':' || json_extract(data_json, '$.pages.serverErrors') FROM events WHERE kind = 'walk-unserved' AND subject = '${first}'"
        equals: ["2:2"]
  - name: the next step revives the node at the same try
    starci: [workflow, step, walk]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT try_no || ':' || (retry_of IS NOT NULL) FROM tasks ORDER BY created_at, rowid
        equals: ["1:0", "1:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.cause') FROM events WHERE kind = 'task-revived'"
        equals: [walk-unserved]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE retry_of = '${first}'"
      as: second
  - read:
      db: ledger
      query: "SELECT worktree FROM tasks WHERE id = '${second}'"
      as: secondCheckout
  - name: the app now answers its pages
    serve: { stub: app, as: served, args: [--status, "200"] }
  - name: the walk meets the app and is green
    cwd: ${secondCheckout}
    env: { WALK_PORT: "${served.token}" }
    starci: [uat, run, walks/walk.mjs, --forward, "${served.token}", --env, WALK_PORT, --out, runs/screens]
    expect:
      exit: 0
      contains: "\"serverErrors\": 0"
  - name: the worker's result after a walk that met the app is its own
    worker:
      task: ${second}
      status: done
      output: { summary: "walked the sign-in screen", files: [], verdict: passed, findings: [] }
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${second}'"
        equals: [reported]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'walk-unserved'"
        equals: [1]
