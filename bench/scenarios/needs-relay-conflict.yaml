schema: starci/scenario@1
id: needs-relay-conflict
group: needs
title: "orca: the resolving commits do not apply to the waiting branch; the conflict becomes a relay node of the waiting workflow, and the waiter proceeds once it lands"
inject: "workflow sub landed its own platform/http/client.md before auth's client was relayed, so the relay of auth's commit conflicts"
expect: >-
  the relay replays nothing onto sub's branch by itself (its head is unchanged) and is never a dead end: sub's graph gains one
  relay node, owned by its Kernel and allowed the conflicting file, whose waiter depends on it; a need-relay-conflict event names
  the node and the file, no Supervisor escalation is raised, and the waiter stays parked without spending a try. Once the relay
  node lands the merged file, the need is relayed by it and the waiter is released, runs again and lands
pass:
  - sub's branch head unchanged by the relay itself, no resolving commit on it
  - one need-relay-conflict event naming the relay node and platform/http/client.md, and no Supervisor escalation
  - the waiter parked, not released and not retried while the relay node runs
  - the relay node lands, a need-relayed event names it, and the waiter is released, retried and done
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: auth.yaml
      yaml:
        schema: starci/workflow@1
        id: auth
        goal: sign in, with the shared http client
        runner: orca
        maxParallel: 2
        tasks:
          - id: http
            label: docs
            summary: write the shared http client
            allowPaths: [platform/http/client.md]
            checks:
              - preset: files-exist
                args: {files: [platform/http/client.md]}
  - file:
      path: sub.yaml
      yaml:
        schema: starci/workflow@1
        id: sub
        goal: premium subscription payments
        runner: orca
        maxParallel: 2
        tasks:
          - id: pay
            label: docs
            summary: write the payment rails doc
            allowPaths: [docs/pay.md]
            checks:
              - preset: files-exist
                args: {files: [docs/pay.md]}
          - id: own
            label: docs
            summary: write sub's own client
            allowPaths: [platform/http/client.md]
            checks:
              - preset: files-exist
                args: {files: [platform/http/client.md]}
  - boot:
      file: ${run}/auth.yaml
      workflow: auth
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - boot:
      file: ${run}/sub.yaml
      workflow: sub
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'http'"
      as: http
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'pay'"
      as: pay
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'own'"
      as: own
  - worker:
      task: ${http}
      files:
        platform/http/client.md: "# HttpClient by auth\n"
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - worker:
      task: ${own}
      files:
        platform/http/client.md: "# sub's own client, written otherwise\n"
  - worker:
      task: ${pay}
      status: blocked
      output:
        summary: needs the shared http client
        files: []
        rulesApplied: []
        needs: [{key: "capability:platform.http", paths: [platform/http/client.md]}]
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - git: [-C, "${worktree.sub}", rev-parse, HEAD]
    save:
      head: stdout
  - file:
      path: owner.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-http-by-auth
        kind: need-owner
        workflow: auth
        basedOn: {}
        need: {key: "capability:platform.http", resolver: http}
  - seat: supervisor
    starci: [supervisor, submit, "${run}/owner.yaml"]
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - name: sub's step tries the relay and routes its conflict as a relay node
    seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - name: sub's head did not move
    git: [-C, "${worktree.sub}", rev-parse, HEAD]
    expect:
      contains: ${head}
  - assert:
      gitLog:
        grep: "Starci-Task: ${http}"
        count: 0
        in: ${worktree.sub}
  - assert:
      sql:
        db: machine
        query: "SELECT json_extract(data_json, '$.relay.status') || ':' || json_extract(data_json, '$.relay.files[0]') || ':' || json_extract(data_json, '$.node') FROM host_events WHERE kind = 'need-relay-conflict'"
        equals: ["conflict:platform/http/client.md:relay.capability-platform.http.r1"]
  - name: the conflict is work of sub's Kernel, never the Supervisor's
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND kind = 'escalation'"
        equals: [0]
  - name: the relay node is in sub's graph, allowed the conflicting file
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE workflow_id = 'sub' AND plan_key = 'relay.capability-platform.http.r1' AND status IN ('queued', 'running')"
        equals: [1]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'relay.capability-platform.http.r1'"
      as: relay
  - name: the waiter stays parked and spends no try
    assert:
      sql:
        db: machine
        query: "SELECT (parked_at IS NOT NULL) || ':' || (released_at IS NULL) FROM shared_need_waiters"
        equals: ["1:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE plan_key = 'pay'"
        equals: [1]
  - name: a later step adds no second relay node and raises nothing
    seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE plan_key LIKE 'relay.%'"
        equals: [1]
  - name: the relay node's worker merges both sides
    worker:
      task: ${relay}
      files:
        platform/http/client.md: "# HttpClient by auth\n# sub's own client, written otherwise\n"
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${relay}'"
        equals: [done]
  - name: the need is relayed by the node, and the waiter released
    assert:
      sql:
        db: machine
        query: "SELECT json_extract(data_json, '$.node') || ':' || json_extract(data_json, '$.relay.status') FROM host_events WHERE kind = 'need-relayed'"
        equals: ["relay.capability-platform.http.r1:relayed"]
  - assert:
      sql:
        db: machine
        query: "SELECT json_extract(release_json, '$.by') || ':' || json_extract(release_json, '$.relay.status') FROM shared_need_waiters"
        equals: ["resolved:relayed"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'pay' AND status IN ('queued', 'running')"
      as: pay2
  - name: the waiter runs again on a branch that holds the merged client, and lands
    worker:
      task: ${pay2}
      files:
        docs/pay.md: "# Payment rails\n"
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${pay2}'"
        equals: [done]
  - assert:
      exists:
        path: ${worktree.sub}/platform/http/client.md
        present: true
        contains: "# HttpClient by auth"
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND kind = 'escalation'"
        equals: [0]
