schema: starci/scenario@1
id: acc-1-fresh-run
group: acceptance
title: "owner acceptance 1: a fresh orca run from the owner's request to the Supervisor's stop, through every coordinator verb"
inject: "nothing: the owner asks, the Supervisor gives the goal, the Kernel plans, two Ops work, the Kernel hands off, the Supervisor stops it"
expect: >-
  the tree boots through real verbs; supervisor submit goal raises the Kernel's goal decision; kernel next returns it before
  any dispatch; the Kernel's plan (a whole workflow file as a workflow-change answering it) records graph v2; kernel next
  launches each Op under the Kernel's Run inside the workflow's worktree and settles each result there; the done decision is
  answered by a handoff that wakes the Supervisor; supervisor next returns the handoff and the Supervisor's stop answers it and
  closes the Kernel
pass:
  - goal, workflow-change, handoff and stop applied once each, each with its sha256
  - both tasks done with one attempt each, two task commits on the workflow branch, none on main
  - every Op worker-start under the Kernel's Run and terminal; one Kernel launch under the Supervisor's Run
  - the handoff mailed the Supervisor's Run
  - every decision answered; the Kernel seat released and its terminal closed
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the owner's request
automation: automated
finding: >-
  the Supervisor stop that answers the handoff raises a Kernel decision (escalation-answer, subject the stop cmdId) for a
  Kernel the same stop closes, and nothing ever answers or supersedes it: cli/src/core/supervisor/driver.ts:211 calls
  raiseForKernel for a stop, which picks escalation-answer at :203; supersede() in cli/src/core/kernel/driver.ts:110 only
  closes red, question and done decisions
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: fresh
        goal: write the two bench docs
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        scope:
          paths: [docs/]
          maxTasks: 4
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: fresh
  - file:
      path: goal.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-acc1-goal-1
        kind: goal
        workflow: fresh
        project: ${repo}
        basedOn: {goal: 1}
        goal: write docs a and b, b after a
  - name: the Supervisor gives the goal
    seat: supervisor
    starci: [supervisor, submit, "${run}/goal.yaml"]
  - name: kernel next returns the goal before any dispatch
    seat: kernel:fresh
    starci: [kernel, next, fresh, --wait, "0"]
    expect:
      contains: '"kind": "goal"'
    save:
      goalDecision: data.decision.id
      graph: data.digest.graphVersion
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 0
  - file:
      path: plan.yaml
      content: |
        schema: starci/workflow@1
        id: fresh
        goal: write the two bench docs
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        scope:
          paths: [docs/]
          maxTasks: 4
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
          - id: b
            label: docs
            summary: write doc b
            dependsOn: [a]
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/b.md]
  - file:
      path: cmd-plan.yaml
      content: |
        schema: starci/command@1
        cmdId: k-acc1-plan-1
        kind: workflow-change
        workflow: fresh
        basedOn: {graph: ${graph}}
        answers: [${goalDecision}]
        change: plan.yaml
  - name: the Kernel plans
    seat: kernel:fresh
    starci: [kernel, submit, "${run}/cmd-plan.yaml"]
  - name: kernel next launches a
    seat: kernel:fresh
    starci: [kernel, next, fresh, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a'"
      as: a
  - worker:
      task: ${a}
      files:
        docs/a.md: "# a\n"
  - name: kernel next settles a and launches b
    seat: kernel:fresh
    starci: [kernel, next, fresh, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'b'"
      as: b
  - worker:
      task: ${b}
      files:
        docs/b.md: "# b\n"
  - name: kernel next settles b and returns done
    seat: kernel:fresh
    starci: [kernel, next, fresh, --wait, "0"]
    expect:
      contains: '"kind": "done"'
    save:
      doneDecision: data.decision.id
      graph2: data.digest.graphVersion
  - file:
      path: cmd-handoff.yaml
      content: |
        schema: starci/command@1
        cmdId: k-acc1-handoff-1
        kind: handoff
        workflow: fresh
        basedOn: {graph: ${graph2}}
        answers: [${doneDecision}]
        handoff:
          summary: docs a and b are written and verified on the workflow branch
  - name: the Kernel hands off
    seat: kernel:fresh
    starci: [kernel, submit, "${run}/cmd-handoff.yaml"]
  - name: supervisor next returns the handoff
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: '"kind": "handoff"'
    save:
      handoffDecision: data.decision.id
  - file:
      path: stop.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-acc1-stop-1
        kind: stop
        workflow: fresh
        project: ${repo}
        basedOn: {}
        answers: [${handoffDecision}]
        mode: graceful
  - name: the Supervisor stops the done workflow
    seat: supervisor
    starci: [supervisor, submit, "${run}/stop.yaml"]
  - assert:
      sql:
        db: ledger
        query: SELECT kind || ':' || status FROM commands ORDER BY received_at
        equals: ["goal:applied", "workflow-change:applied", "handoff:applied", "stop:applied"]
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM commands WHERE length(sha256) = 64
        equals: [4]
  - assert:
      sql:
        db: ledger
        query: SELECT plan_key || ':' || status || ':' || try_no FROM tasks ORDER BY plan_key
        equals: ["a:done:1", "b:done:1"]
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
        in: ${worktree.fresh}
  - assert:
      gitLog:
        grep: "Starci-Task: ${b}"
        count: 1
        in: ${worktree.fresh}
  - assert:
      gitLog:
        grep: "Starci-Task:"
        count: 0
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
          run: "^${kernel.fresh.run}$"
          from: "^${kernel.fresh.terminal}$"
        count: 2
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] fresh$'
          run: "^${supervisor.run}$"
          from: "^${supervisor.terminal}$"
        count: 1
  - assert:
      orcaCalls:
        command: send
        match:
          to: "^run:${supervisor.run}$"
          type: "^handoff$"
        count: 1
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM seats WHERE role = 'kernel'
        equals: [released]
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM decisions WHERE answered_at IS NULL
        equals: [0]
