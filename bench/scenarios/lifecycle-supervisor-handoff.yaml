schema: starci/scenario@1
id: lifecycle-supervisor-handoff
group: lifecycle
title: a finished workflow hands off to the Supervisor, who lands it
inject: a workflow reaches done
expect: the Kernel files handoff; supervisor next returns it; the Supervisor runs release push (dry-run in the bench) and reports to the owner; nothing pushes without the Supervisor
pass:
  - one handoff command in the ledger
  - the Kernel never ran release push
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: "S4 coordinator agents: starci supervisor next|submit and the Supervisor seat"
manual:
  - run lifecycle-inline-chain under kernel seats
  - supervisor next returns the handoff
  - supervisor submit accept
  - assert release push ran with role supervisor only
