schema: starci/scenario@1
id: needs-relay-baseline-message-form
group: needs
title: "orca: a relay node carrying a canon finding byte-identical from its source holds it as the source's baseline, whichever ESLint report printed it"
inject: >-
  workflow premium lands a file holding a canon finding whose message closes with a period (the shape of BE_PUBLIC_CONTRACT_FORM)
  that its own lane never judged red; coach gets a relay node of premium's need, which carries the file byte-identical. The relay
  node's check-run-green defers the composition rules to its waiter, so its lint reads ESLint's json report, where the message
  keeps its period, while the run at the source's head has no deferral and reads the stylish report, which drops it
expect: >-
  both reports name one finding: the relay node's check-run-green holds it as the source's baseline, with no new finding, and is
  green; the relay node is done with no question to its Kernel, and the need is relayed
pass:
  - the relay node's check-run-green green, deferring composition to the waiter and naming the source's public-contract-form finding as its baseline
  - the relay node done, a need-relayed event names it, and no decision is raised on it
  - no human intervention beyond the injected fault
automation: automated
# bench/fixtures/lint-findings: the ESLint stand-in reports starci-be/public-contract-form on a file holding LINT_CONTRACT, its
# message closing with a period in the json report and without it in the line report, as ESLint's stylish report prints it.
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
steps:
  - name: the fixture and its tool stand-ins are committed
    write: { path: ".", from: "${ops}/../bench/fixtures/lint-findings/repo" }
  - write: { path: node_modules/typescript, from: "${ops}/../bench/fixtures/lint-findings/stand-ins/typescript" }
  - write: { path: node_modules/eslint, from: "${ops}/../bench/fixtures/lint-findings/stand-ins/eslint" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: the lint fixture"]
  - file:
      path: premium.yaml
      yaml:
        schema: starci/workflow@1
        id: premium
        goal: premium entitlements, with the shared client
        runner: orca
        maxParallel: 3
        tasks:
          - id: ent
            label: docs
            summary: write the entitlement module and the shared client
            allowPaths: [src/ent, platform/http/client.md]
            context: [.starciwork/features/shop/impl/ent/index.yaml]
            composedBy: wire
            checks: [check-run-green]
          - id: form
            label: docs
            summary: write the premium term's form
            allowPaths: [src/form]
          - id: wire
            label: docs
            summary: wire the entitlement module into premium's app
            allowPaths: [src/app.ts]
            dependsOn: [ent]
  - file:
      path: coach.yaml
      yaml:
        schema: starci/workflow@1
        id: coach
        goal: the lesson coach, gated by entitlements
        runner: orca
        maxParallel: 2
        tasks:
          - id: own
            label: docs
            summary: write coach's own client
            allowPaths: [platform/http/client.md]
            checks:
              - preset: files-exist
                args: {files: [platform/http/client.md]}
          - id: lesson
            label: docs
            summary: gate the lesson coach by entitlement
            allowPaths: [src/app.ts, docs/lesson.md]
            checks: [check-run-green]
  - boot:
      file: ${run}/premium.yaml
      workflow: premium
  - name: the Work record exists on premium's branch alone
    file:
      path: ${worktree.premium}/.starciwork/features/shop/impl/ent/index.yaml
      content: |
        schema: work/implementation@1
        id: impl.shop.ent
        title: the entitlement module
  - git: [-C, "${worktree.premium}", add, -A]
  - git: [-C, "${worktree.premium}", commit, -q, -m, "premium: the entitlement record"]
  - seat: kernel:premium
    starci: [kernel, next, premium, --wait, "0"]
  - boot:
      file: ${run}/coach.yaml
      workflow: coach
  - seat: kernel:coach
    starci: [kernel, next, coach, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'ent'"
      as: ent
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'form'"
      as: form
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'own'"
      as: own
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'lesson'"
      as: lesson
  - name: ent writes a module premium's wire composes, citing its record
    worker:
      task: ${ent}
      files:
        src/ent/index.ts: "export const ent = 1\n"
        platform/http/client.md: "# HttpClient by premium\n"
      output:
        summary: wrote the entitlement module and the shared client
        files: [src/ent/index.ts, platform/http/client.md]
        rulesApplied: []
        workRecords: [impl.shop.ent]
  - name: form lands a canon finding whose message closes with a period, which premium's lane never judged red
    worker:
      task: ${form}
      files:
        src/form/index.ts: "// LINT_CONTRACT premium settled\nexport const premiumUntil = (): string | null => null\n"
  - seat: kernel:premium
    starci: [kernel, next, premium, --wait, "0"]
  - name: premium's wave defers ent's composition to wire and is green
    starci: [workflow, wave, premium, --wait, "600"]
  - seat: kernel:premium
    starci: [kernel, next, premium, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT plan_key || ':' || status FROM tasks WHERE plan_key IN ('ent', 'form') ORDER BY plan_key"
        equals: ["ent:done", "form:done"]
  - worker:
      task: ${own}
      files:
        platform/http/client.md: "# coach's own client, written otherwise\n"
  - worker:
      task: ${lesson}
      status: blocked
      output:
        summary: needs the entitlement capability
        files: []
        rulesApplied: []
        needs: [{key: "capability:platform.http", paths: [platform/http/client.md]}]
  - seat: kernel:coach
    starci: [kernel, next, coach, --wait, "0"]
  - file:
      path: owner.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-http-by-premium
        kind: need-owner
        workflow: premium
        basedOn: {}
        need: {key: "capability:platform.http", resolver: [ent, form]}
  - seat: supervisor
    starci: [supervisor, submit, "${run}/owner.yaml"]
  - seat: kernel:premium
    starci: [kernel, next, premium, --wait, "0"]
  - name: coach's step tries the relay and routes its conflict as a relay node
    seat: kernel:coach
    starci: [kernel, next, coach, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'relay.capability-platform.http.r1'"
      as: relay
  - name: the relay node is built on ent's checks, drops premium's composer and has the waiter depend on it
    assert:
      sql:
        db: ledger
        query: "SELECT COALESCE(json_extract(t.contract_json, '$.context.composedBy'), 'none') || ':' || (instr(t.contract_json, 'check-run-green') > 0) || ':' || (SELECT COUNT(*) FROM edges e WHERE e.workflow_id = 'coach' AND e.plan_key = 'lesson' AND e.depends_on = t.plan_key AND e.graph_version = (SELECT graph_version FROM workflows WHERE id = 'coach')) FROM tasks t WHERE t.id = '${relay}'"
        equals: ["none:1:1"]
  - name: the relay node's worker merges the client and cites the source's record
    worker:
      task: ${relay}
      files:
        platform/http/client.md: "# HttpClient by premium\n# coach's own client, written otherwise\n"
        src/ent/index.ts: "export const ent = 1\n"
        src/form/index.ts: "// LINT_CONTRACT premium settled\nexport const premiumUntil = (): string | null => null\n"
      output:
        summary: relayed the entitlement commits, the client merged
        files: [platform/http/client.md, src/ent/index.ts, src/form/index.ts]
        rulesApplied: []
        workRecords: [impl.shop.ent]
  - name: coach's step verifies and lands the relay node, then starts its wave
    seat: kernel:coach
    starci: [kernel, next, coach, --wait, "0"]
  - name: the wave judges the relay node as the transport of settled work, and is green
    starci: [workflow, wave, coach, --wait, "600"]
  - seat: kernel:coach
    starci: [kernel, next, coach, --wait, "0"]
  - name: the relay node read the record at the source's head
    assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'impl.shop.ent in .starciwork/features/shop/impl/ent/index.yaml (at the relayed source') > 0) FROM check_runs WHERE task_id = '${relay}' AND name = 'rules-cited' ORDER BY id DESC LIMIT 1"
        equals: ["green:1"]
  - name: its check-run-green, judged on the json report its deferral asks for, holds the source's stylish finding as its baseline
    assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'deferred-to:lesson') > 0) || ':' || (instr(detail, 'baseline-findings: 1 finding(s)') > 0) || ':' || (instr(detail, 'new finding') = 0) FROM check_runs WHERE task_id = '${relay}' AND name = 'check-run-green' ORDER BY id DESC LIMIT 1"
        equals: ["green:1:1:1"]
  - name: the baseline it held is the source's public-contract-form finding on the relayed file
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.steps[0].findings[0]') FROM events WHERE kind = 'baseline-findings' AND subject = '${relay}' ORDER BY id DESC LIMIT 1"
        equals: ["src/form/index.ts error [BE_PUBLIC_CONTRACT_FORM] premiumUntil uses an inline object/union output; expose a named result contract or a primitive starci-be/public-contract-form"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${relay}'"
        equals: [done]
  - name: the need is relayed by the node, and the waiter released
    assert:
      sql:
        db: machine
        query: "SELECT json_extract(data_json, '$.node') || ':' || json_extract(data_json, '$.relay.status') FROM host_events WHERE kind = 'need-relayed'"
        equals: ["relay.capability-platform.http.r1:relayed"]
  - name: no question reaches the relay node's Kernel
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE subject = '${relay}'"
        equals: [0]
