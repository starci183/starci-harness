schema: starci/scenario@1
id: messaging-mailbox-backlog
group: messaging
title: a dead Kernel leaves a backlog; the new one processes it exactly once
inject: "20 question mails from the workflow's Op wait in the Kernel Run's mailbox while the Kernel is dead; it is relaunched"
expect: >-
  the relaunched Kernel takes the same Run back (run-use) and its kernel next drains the whole backlog batch by batch, acking
  each delivery: every mail becomes exactly one question decision; a second kernel next drains nothing new and raises nothing
pass:
  - 20 question decisions, one per mail
  - a second kernel next adds none
  - every delivery acked
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: backlog
        goal: write doc a
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: backlog
  - seat: kernel:backlog
    starci: [kernel, next, backlog, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT terminal FROM seats WHERE role = 'worker'"
      as: op
  - name: the Kernel dies; its Op keeps mailing questions
    orca:
      terminal:
        handle: ${kernel.backlog.terminal}
        live: false
      worker:
        dispatch: kernel
        state: exited
      mail:
        - to: run:${kernel.backlog.run}
          from: ${op}
          type: question
          subject: which heading style?
          body: the doc has no style guide
          count: 20
  - sql:
      db: ledger
      exec: >-
        UPDATE seats SET lease_until = '2020-01-01T00:00:00.000Z' WHERE role = 'kernel';
        UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-25 minutes')
  - seat: supervisor
    starci: [supervisor, next, --wait, "0"]
  - boot:
      adopt: backlog
  - name: the new Kernel drains the backlog
    seat: kernel:backlog
    starci: [kernel, next, backlog, --wait, "0"]
    expect:
      contains: '"kind": "question"'
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*), COUNT(DISTINCT subject) FROM decisions WHERE kind = 'question' AND subject LIKE 'mail:%'"
        equals: [[20, 20]]
  - name: a second kernel next
    seat: kernel:backlog
    starci: [kernel, next, backlog, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE kind = 'question'"
        equals: [20]
  - assert:
      orcaCalls:
        command: run-use
        min: 1
  - assert:
      orcaCalls:
        command: check
        match:
          ack: "^delivery-"
        min: 4
