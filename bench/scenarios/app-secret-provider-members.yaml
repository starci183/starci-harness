schema: starci/scenario@1
id: app-secret-provider-members
group: security
title: "app secret set seals a provider's keys into <provider>.enc.yaml byte for byte, declares them per key, and recipients and audit manage the standard"
inject: >-
  a full app with a compose dev environment runs `app secret init`, its identity moved to the run's harness secret.env; `set dev
  sepay` seals two keys from stdin lines in one write, a third from a PEM-shaped fake file with --from-file; recipients adds a
  production recipient and the owner; audit runs on the uncommitted members
expect: >-
  the member is sepay.enc.yaml holding the three keys, each declared once in environments.dev.secrets; materialize writes the
  file key byte for byte; recipients writes a production rule naming both; audit exits 1 naming the untracked member; no output
  carries a fixture value
pass:
  - set seals sepay.enc.yaml with SEPAY_MERCHANT_ID and SEPAY_IPN_SECRET_KEY in one write and declares both
  - set --from-file adds SEPAY_SIGNING_SECRET_KEY and get --to-file opens it with the harness identity
  - recipients production names the added recipient and the owner
  - audit exits 1 naming UNTRACKED for the uncommitted member
automation: automated
repo:
  files:
    hfs.json: |
      {"hfs": 3, "kind": "app", "edition": "full", "project": "bench-provider"}
    .starcistacks/application-stacks.yaml: |
      schema: starci/application-stacks@1
      environments:
        dev:
          runtime: docker-compose
          secrets: []
        production:
          runtime: docker-swarm
          secrets: []
steps:
  - name: the app gets its identity and .sops.yaml, and the identity moves to the run's harness secret.env
    starci: [app, secret, init]
  - write: { path: "${run}/secret.env", from: "${repo}/.claude/secret.env" }
  - remove: .claude/secret.env
  - name: two keys from stdin lines are sealed in one write and declared per key
    starci: [app, secret, set, dev, sepay, SEPAY_MERCHANT_ID, SEPAY_IPN_SECRET_KEY]
    stdin: "SEPAY_MERCHANT_ID=bench-fixture-merchant\nSEPAY_IPN_SECRET_KEY=bench-fixture-ipn\n"
    expect:
      exit: 0
      contains: declared SEPAY_MERCHANT_ID, SEPAY_IPN_SECRET_KEY
      lacks: bench-fixture-ipn
  - name: a multi-line key is read byte for byte from a file
    file:
      path: ${run}/signing.pem
      content: "-----BEGIN BENCH FIXTURE-----\nAAAA\n-----END BENCH FIXTURE-----\n"
  - starci: [app, secret, set, dev, sepay, SEPAY_SIGNING_SECRET_KEY, --from-file, "SEPAY_SIGNING_SECRET_KEY=${run}/signing.pem"]
    expect:
      exit: 0
      lacks: BEGIN BENCH FIXTURE
  - assert:
      exists: { path: .starcistacks/dev/secrets/sepay.enc.yaml, present: true, contains: "SEPAY_SIGNING_SECRET_KEY: ENC[" }
  - assert:
      exists: { path: .starcistacks/application-stacks.yaml, present: true, contains: "sepay-signing-secret-key" }
  - starci: [app, secret, list, dev]
    expect:
      contains: SEPAY_SIGNING_SECRET_KEY
  - starci: [app, secret, get, dev, sepay, SEPAY_SIGNING_SECRET_KEY, --to-file]
    expect:
      exit: 0
      lacks: BEGIN BENCH FIXTURE
  - name: production gets its own rule naming a server recipient and the owner
    starci: [app, secret, recipients, production, --add, age1qyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqs3290gq, --add, owner]
  - assert:
      exists: { path: .sops.yaml, present: true, contains: "age1qyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqs3290gq" }
  - name: audit names the uncommitted member and exits 1
    starci: [app, secret, audit, dev]
    expect:
      exit: 1
      contains: UNTRACKED dev/sepay.enc.yaml
