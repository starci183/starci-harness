schema: starci/scenario@1
id: security-secret-key-names
group: security
title: "a custody key's name and a contract spec's wrong password are no secrets; a credential in either place is still caught"
inject: >-
  a test task writes a provider contract spec (be/src/tests/contract/<provider>/*.contract-spec.ts) that names its custody keys
  in consts assigned to secret-worded names and holds a deliberately wrong password, plus a keys module outside the spec doing
  the same; then a credential is assigned to a secret-worded name in source, and planted in the contract spec
expect: >-
  check secrets is green for the key names and the contract spec's inputs, and red naming assigned-secret for the credential
  in source and aws-access-key for the one in the spec, never printing it
pass:
  - key names (KEYCLOAK_LEARNER_TEST_PASSWORD and the like) assigned to secret-worded names are no finding, in source or a spec
  - a contract spec's stand-in values are judged as a spec's inputs, like any other spec's
  - a credential assigned to a secret-worded name in source is red with rule assigned-secret, and the output never shows it
  - a provider-shaped credential in a contract spec is red with rule aws-access-key
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: be/src/tests/contract/keycloak/keys.ts
      content: "export const CLIENT_SECRET_KEY = \"IDENTITY_KEYCLOAK_CLIENT_SECRET\"\nexport const LEARNER_PASSWORD_KEY = \"KEYCLOAK_LEARNER_TEST_PASSWORD\"\n"
  - write:
      path: be/src/tests/contract/keycloak/keycloak.contract-spec.ts
      content: "const INVALID_PASSWORD = \"not-the-learner-password\"\nconst CLIENT_SECRET_KEY = \"IDENTITY_KEYCLOAK_CLIENT_SECRET\"\n"
  - name: key names and a contract spec's inputs are no secrets
    starci: [check, secrets, --all]
    expect:
      exit: 0
      contains: "\"findings\": []"
  - write:
      path: be/src/config.ts
      content: "export const clientSecret = \"${generatedKey}\"\n"
  - name: a credential assigned in source is caught
    starci: [check, secrets, --all]
    expect:
      exit: 1
      contains: "\"pattern\": \"assigned-secret\""
      lacks: ${generatedKey}
  - write:
      path: be/src/config.ts
      content: "export const CLIENT_SECRET_KEY = \"IDENTITY_KEYCLOAK_CLIENT_SECRET\"\n"
  - write:
      path: be/src/tests/contract/keycloak/keycloak.contract-spec.ts
      content: "const INVALID_PASSWORD = \"not-the-learner-password\"\nconst leaked = \"${generatedKey}\"\n"
  - name: a credential in a contract spec is caught
    starci: [check, secrets, --all]
    expect:
      exit: 1
      contains: "\"pattern\": \"aws-access-key\""
      lacks: ${generatedKey}
