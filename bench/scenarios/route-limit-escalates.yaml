schema: starci/scenario@1
id: route-limit-escalates
group: plan
title: past a route's limit the Kernel may not repair again; it escalates to the owner through the Supervisor
inject: the ledger already holds five applied repairs of the audit through audit-drift-repairs-code, its limit; the audit finds drift again
expect: >-
  the red decision carries no route and the owner gate; kernel submit refuses ROUTE_ILLEGAL for one more repair through code;
  an escalation of kind owner answering the decision is applied and becomes a Supervisor decision
pass:
  - the red decision's evidence names gate owner and no route
  - a sixth repair is refused ROUTE_ILLEGAL
  - the owner escalation answers the decision and raises the Supervisor's escalation
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: fe, name: web}
    .starciwork/features/shop/impl/web/cart/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.web.cart
      title: the cart screen's code
      state: done
      activity: idle
      repository: web
      owners:
        - {role: fe, path: web/src/cart}
      proves: []
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: aud
        goal: audit the cart screen
        runner: inline
        tasks:
          - id: audit
            label: audit
            summary: audit the cart screen against its direction
            allowPaths: [web/audit/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {grammar: core, run: web/audit/cart}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: five earlier repairs through code, the route's limit
    sql:
      db: ledger
      exec: >-
        INSERT INTO commands (cmd_id, scope, workflow_id, kind, based_on_json, sha256, body_json, status, received_at) VALUES
        ('k-old-1', 'kernel', 'aud', 'workflow-change', '{}', 's1', '{"route":"audit-drift-repairs-code"}', 'applied', '2026-10-01T00:00:00Z'),
        ('k-old-2', 'kernel', 'aud', 'workflow-change', '{}', 's2', '{"route":"audit-drift-repairs-code"}', 'applied', '2026-10-01T00:00:00Z'),
        ('k-old-3', 'kernel', 'aud', 'workflow-change', '{}', 's3', '{"route":"audit-drift-repairs-code"}', 'applied', '2026-10-01T00:00:00Z'),
        ('k-old-4', 'kernel', 'aud', 'workflow-change', '{}', 's4', '{"route":"audit-drift-repairs-code"}', 'applied', '2026-10-01T00:00:00Z'),
        ('k-old-5', 'kernel', 'aud', 'workflow-change', '{}', 's5', '{"route":"audit-drift-repairs-code"}', 'applied', '2026-10-01T00:00:00Z');
        INSERT INTO decisions (id, scope, workflow_id, kind, subject, evidence_json, raised_at, answered_by, answered_at) VALUES
        ('d-old-1', 'kernel', 'aud', 'red', 't-old-1', '{"key":"audit"}', '2026-10-01T00:00:00Z', 'k-old-1', '2026-10-01T00:00:00Z'),
        ('d-old-2', 'kernel', 'aud', 'red', 't-old-2', '{"key":"audit"}', '2026-10-01T00:00:00Z', 'k-old-2', '2026-10-01T00:00:00Z'),
        ('d-old-3', 'kernel', 'aud', 'red', 't-old-3', '{"key":"audit"}', '2026-10-01T00:00:00Z', 'k-old-3', '2026-10-01T00:00:00Z'),
        ('d-old-4', 'kernel', 'aud', 'red', 't-old-4', '{"key":"audit"}', '2026-10-01T00:00:00Z', 'k-old-4', '2026-10-01T00:00:00Z'),
        ('d-old-5', 'kernel', 'aud', 'red', 't-old-5', '{"key":"audit"}', '2026-10-01T00:00:00Z', 'k-old-5', '2026-10-01T00:00:00Z');
  - name: start
    starci: [workflow, start, aud]
    save:
      audit: data.nodes.0.task.id
  - name: the audit finds drift again
    worker:
      task: ${audit}
      status: failed
      output:
        summary: the cart total still sits outside its card
        files: []
        verdict: failed
        findings:
          - {screen: cart, state: filled, expected: total inside the card, observed: total below it, screenshot: cart-filled.png, rule: none}
        rulesApplied: []
        workRecords: [impl.shop.web.cart]
  - name: kernel next returns the red decision at the owner gate
    starci: [kernel, next, aud, --wait, "0"]
    expect:
      contains: '"gate": "owner"'
    save:
      red: data.decision.id
      graph: data.digest.graphVersion
  - assert:
      sql:
        db: ledger
        query: "SELECT json_array_length(evidence_json, '$.routes') FROM decisions WHERE kind = 'red' AND answered_at IS NULL"
        equals:
          - 0
  - file:
      path: repair.yaml
      content: |
        schema: starci/workflow-change@1
        workflow: aud
        changes:
          - op: add
            task:
              id: fix
              label: code
              summary: put the cart total back inside its card
              allowPaths: [web/src/cart]
              context: [.starciwork/features/shop/impl/web/cart/index.yaml]
              inputs: {side: fe, edition: lite}
              checks:
                - preset: tests-pass
                  args: {command: "node --version"}
          - {op: retry, id: audit}
  - file:
      path: cmd-repair.yaml
      content: |
        schema: starci/command@1
        cmdId: k-aud-sixth
        kind: workflow-change
        workflow: aud
        basedOn: {graph: ${graph}}
        answers: [${red}]
        route: audit-drift-repairs-code
        change: repair.yaml
  - name: a sixth repair is refused
    starci: [kernel, submit, "${run}/cmd-repair.yaml"]
    expect:
      exit: 1
      code: ROUTE_ILLEGAL
      contains: "escalate it (kind owner)"
  - file:
      path: cmd-escalate.yaml
      content: |
        schema: starci/command@1
        cmdId: k-aud-owner
        kind: escalation
        workflow: aud
        basedOn: {graph: ${graph}}
        answers: [${red}]
        escalation:
          kind: owner
          question: the cart audit drifted after five code repairs; how should the cart total sit?
  - name: the owner escalation is applied
    starci: [kernel, submit, "${run}/cmd-escalate.yaml"]
  - assert:
      sql:
        db: ledger
        query: "SELECT (SELECT answered_by FROM decisions WHERE kind = 'red' AND subject = '${audit}') || ':' || (SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND kind = 'escalation')"
        equals:
          - "k-aud-owner:1"
