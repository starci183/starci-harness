schema: starci/scenario@1
id: kernel-unknown-launch-live-terminal-kept
group: orca
title: "a Kernel relaunch whose turn start Orca never observed keeps a live terminal: never fenced or swept; waited on, escalated, then adopted once it prints"
inject: >-
  the Kernel exits and the Supervisor relaunches it; that worker-start exits 1 with outcome_unknown naming its dispatch and agent
  terminal, Orca keeps the worker at start_unknown and keeps listing its terminal, which prints nothing; the launch ages past
  stall.startDeadlineMinutes, then past effectUnknownDeadlineMinutes; then the terminal prints
expect: >-
  an unverifiable start never becomes launch-failed while its terminal lives: past the start deadline the sweep waits, the tick's
  terminal sweep leaves the tab alone (the open seat holds it), past effectUnknownDeadlineMinutes the Supervisor gets one harness
  escalation, and nothing is stopped, closed or launched beside it; once the terminal prints after the launch the seat is
  reconciled ready with its dispatch and terminal
pass:
  - no worker-stop, no terminal close of the Kernel's terminal, two Kernel launches in all
  - one stuck-launch escalation for the Supervisor
  - the seat ends ready, holding its dispatch and terminal
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: kl
        goal: bench workflow kl
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: kl
  - name: the Kernel exits, and its relaunch's turn start goes unobserved
    orca:
      worker:
        dispatch: kernel
        state: exited
      rules:
        - command: worker-start
          fault: turn-unobserved
          match:
            task-title: '^\[Kernel\]'
  - name: the Kernel lease and the progress clock lapse
    sql:
      db: ledger
      exec: UPDATE seats SET lease_until = '2020-01-01T00:00:00.000Z' WHERE role = 'kernel'; UPDATE events SET at = '2020-01-01T00:00:00.000Z'
  - name: supervisor next relaunches the Kernel; Orca answers outcome_unknown
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
  - read:
      db: ledger
      query: SELECT handle FROM seats WHERE role = 'kernel' ORDER BY started_at DESC, rowid DESC LIMIT 1
      as: kdispatch
  - read:
      db: ledger
      query: SELECT terminal FROM seats WHERE role = 'kernel' AND handle = '${kdispatch}'
      as: kterm
  - name: the launch ages past the start deadline, its terminal live and quiet
    sql:
      db: ledger
      exec: UPDATE seats SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-11 minutes') WHERE role = 'kernel' AND handle = '${kdispatch}'
  - name: the sweep waits on the live terminal
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
  - name: the tick's terminal sweep leaves the held tab alone
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM seats WHERE role = 'kernel' AND handle = '${kdispatch}'
        equals: [launch-unknown]
  - name: the launch ages past the effect-unknown deadline
    sql:
      db: ledger
      exec: UPDATE seats SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-16 minutes') WHERE role = 'kernel' AND handle = '${kdispatch}'
  - name: the sweep escalates, still without a fence
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND subject LIKE 'stuck-launch:%'"
        equals: [1]
  - name: the terminal prints
    orca:
      set:
        lastOutput:
          ${kterm}: "2099-01-01T00:00:00.000Z"
  - name: the sweep reconciles the launch whose terminal shows a turn
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status, terminal = '${kterm}' FROM seats WHERE role = 'kernel' AND handle = '${kdispatch}'
        equals: [[ready, 1]]
  - assert:
      orcaCalls:
        command: worker-stop
        match:
          dispatch: "${kdispatch}"
        count: 0
  - assert:
      orcaCalls:
        command: terminal close
        match:
          terminal: "${kterm}"
        count: 0
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\]'
        count: 2
