schema: starci/scenario@1
id: budget-over-reports-in-grace
group: budget
title: "an Op past its budget is asked once to wrap up, files in the grace and is judged as any other"
inject: >-
  the Op's attempt started two hours ago against a 60 minute budget and is still running with no result filed; the Kernel runs
  kernel next twice, then the Op files its result
expect: >-
  the first pass types the budget prompt into the Op's terminal once (a budget-nudged event); the second, inside the grace, sends
  nothing; the result filed in the grace is verified and the task settles done, never fenced
pass:
  - exactly one budget ask, typed into the Op's terminal
  - the task settles done after the ask, with no over-budget event and one launch
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: over
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: over
  - name: kernel next dispatches the Op
    seat: kernel:over
    starci: [kernel, next, over, --wait, "0"]
  - read:
      db: ledger
      query: SELECT terminal FROM seats WHERE role = 'worker'
      as: op.terminal
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: task
  - name: the attempt has run two hours against its 60 minute budget
    sql:
      db: ledger
      exec: UPDATE attempts SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-120 minutes')
  - name: the Kernel's driver asks it to wrap up
    seat: kernel:over
    starci: [kernel, next, over, --wait, "0"]
  - name: a second pass inside the grace sends nothing
    seat: kernel:over
    starci: [kernel, next, over, --wait, "0"]
  - assert:
      orcaCalls:
        command: terminal send
        match:
          terminal: ${op.terminal}
        count: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'budget-nudged' AND subject = '${task}'"
        equals: [1]
  - name: the Op files within the grace
    worker:
      task: ${task}
      files:
        docs/a.md: "# a\n"
  - seat: kernel:over
    starci: [kernel, next, over, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals: [done]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'task-over-budget'"
        equals: [0]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 1
