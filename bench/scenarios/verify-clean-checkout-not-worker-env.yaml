schema: starci/scenario@1
id: verify-clean-checkout-not-worker-env
group: verify
title: a check that passes only in the worker's environment is red on the clean checkout
inject: the check runs scripts/check.mjs, which exists only untracked in the worktree, outside allowPaths
expect: "verify replays on a clean checkout of HEAD plus allowPaths: the script is absent, the check red"
pass:
  - task failed
  - no task commit
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: clean
        goal: bench workflow clean
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
              - preset: tests-pass
                args:
                  command: node scripts/check.mjs
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - clean
    save:
      a: data.nodes.0.task.id
  - write:
      path: scripts/check.mjs
      content: |
        process.exit(0)
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
  - name: step
    starci:
      - workflow
      - step
      - clean
    save: {}
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - failed
