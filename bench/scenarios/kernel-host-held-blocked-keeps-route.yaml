schema: starci/scenario@1
id: kernel-host-held-blocked-keeps-route
group: verify
title: "orca: a question filed after the host held the Op's verify is harness-held: it spends no route, past the route's limit too, and no try"
inject: >-
  the Op of task a filed blocked twice and its Kernel took the blocked-answered route both times, its limit of 2; on the third
  attempt the heavy rules of an ops/ copy hold every heavy command (the CPU always above maxCpuPercent, the queue never starved),
  so the Op's own verify of its contract waits its one-minute budget in the queue and is refused HOST_HELD, and the Op files
  blocked again
expect: >-
  the held verify records verify-host-held on the third attempt; the Kernel's question decision on it is held, still carries the
  blocked-answered route although two commands took it, and the Kernel's third retry on that route is applied, never refused
  ROUTE_ILLEGAL; the retry keeps try 1, and the next question's route counts two takings, the held one left out
pass:
  - the Op's verify exits HOST_HELD (75) and one verify-host-held event names the third attempt
  - the third question decision is held and its legal route is blocked-answered at 2 of 2 taken
  - the Kernel's third retry on blocked-answered is applied and the task runs again at try 1
  - no step without evidence; no actor overstepping its role; no human intervention beyond the injected fault
automation: automated
env:
  STARCI_OPS_DIR: ${repo}/ops
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    package.json: '{"name": "bench-held-route", "version": "1.0.0", "private": true}'
    check.js: "console.log('the suite ran')\n"
steps:
  - name: copy ops/ into the scratch repository, with the contexts its labels read
    write: { path: ops, from: "${ops}" }
  - write: { path: contexts, from: "${ops}/../contexts" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: ops copy"]
  - name: a host that admits no heavy command (RAM never holds one back; a CPU ceiling no host is under; a queue never starved)
    starci: [config, set, liveness.heavy.reserveMb, "0"]
  - starci: [config, set, liveness.heavy.maxCpuPercent, "0.0001"]
  - starci: [config, set, liveness.heavy.cpuStarveMinutes, "600"]
  - starci: [config, set, liveness.heavy.managedCpuFloorPercent, "0"]
  - git: [commit, -q, -am, "bench: a host that admits nothing"]
  - name: another program keeps a core busy, so even an idle runner reads above the ceiling
    serve: { stub: busy, as: burner }
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: ask
        goal: write doc a
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            budget: {minutes: 1, tries: 3}
            checks:
              - preset: tests-pass
                args: {command: "node check.js"}
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: ask
        reason: the Op's default holds; retry it
        changes:
          - op: retry
            id: a
  - boot:
      file: ${run}/wf.yaml
      workflow: ask
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks WHERE plan_key = 'a' AND status = 'running'
      as: a1
  - worker:
      task: ${a1}
      status: blocked
      output: {summary: "which heading case?", question: which heading case?, default: title case, files: [], rulesApplied: []}
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
    save:
      q1: data.decision.id
      g1: data.digest.graphVersion
  - file:
      path: cmd-1.yaml
      content: |
        schema: starci/command@1
        cmdId: k-ask-retry-1
        kind: workflow-change
        workflow: ask
        basedOn: {graph: ${g1}}
        answers: [${q1}]
        route: blocked-answered
        note: title case
        change: retry.yaml
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/cmd-1.yaml"]
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks WHERE plan_key = 'a' AND status = 'running'
      as: a2
  - worker:
      task: ${a2}
      status: blocked
      output: {summary: "which heading case, again?", question: which heading case?, default: title case, files: [], rulesApplied: []}
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
    save:
      q2: data.decision.id
      g2: data.digest.graphVersion
  - file:
      path: cmd-2.yaml
      content: |
        schema: starci/command@1
        cmdId: k-ask-retry-2
        kind: workflow-change
        workflow: ask
        basedOn: {graph: ${g2}}
        answers: [${q2}]
        route: blocked-answered
        note: title case
        change: retry.yaml
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/cmd-2.yaml"]
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks WHERE plan_key = 'a' AND status = 'running'
      as: a3
  - name: the third Op proves its work with its contract, and the host holds the verify's test command past the one-minute budget
    file:
      path: held.json
      content: >-
        {"schema": "starci/contract@2", "label": "docs", "context": {"revision": "HEAD", "allowPaths": ["docs/a.md"]},
        "input": {"summary": "write doc a"}, "budget": {"minutes": 1, "tries": 3},
        "checks": {"extend": [{"preset": "tests-pass", "args": {"command": "node check.js"}}]}}
  - starci: [task, verify, "${a3}", --contract, "${run}/held.json"]
    cwd: ${project}/worktrees/ask.ops/${a3}
    expect:
      exit: 75
      contains: HOST_HELD
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'verify-host-held' AND subject = '${a3}' AND json_extract(data_json, '$.attempt') = (SELECT id FROM attempts WHERE task_id = '${a3}')"
        equals: [1]
  - name: the Op files blocked after the hold
    worker:
      task: ${a3}
      status: blocked
      output: {summary: "my verify was held by the host", question: may the unchanged work be retried once the host has room?, default: retry it unchanged, files: [], rulesApplied: []}
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
    save:
      q3: data.decision.id
      g3: data.digest.graphVersion
  - name: the held question still carries its route, past the two takings that reached its limit
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(evidence_json, '$.held') || ':' || json_extract(evidence_json, '$.routes[0].id') || ':' || json_extract(evidence_json, '$.routes[0].taken') || ':' || json_extract(evidence_json, '$.routes[0].limit') FROM decisions WHERE id = '${q3}'"
        equals: ["1:blocked-answered:2:2"]
  - file:
      path: cmd-3.yaml
      content: |
        schema: starci/command@1
        cmdId: k-ask-retry-3
        kind: workflow-change
        workflow: ask
        basedOn: {graph: ${g3}}
        answers: [${q3}]
        route: blocked-answered
        note: the host held it; retry unchanged
        change: retry.yaml
  - name: the Kernel's third retry on the route is applied
    seat: kernel:ask
    starci: [kernel, submit, "${run}/cmd-3.yaml"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM commands WHERE cmd_id = 'k-ask-retry-3'"
        equals: [applied]
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
  - name: the retry runs again at try 1
    assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || try_no FROM tasks WHERE plan_key = 'a' ORDER BY created_at, rowid"
        equals: ["cancelled:1", "cancelled:1", "cancelled:1", "running:1"]
  - name: nothing climbed to the Supervisor
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor'"
        equals: [0]
