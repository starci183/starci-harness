schema: starci/scenario@1
id: time-paused-days-moved-main
group: time
title: a workflow paused for days resumes on a moved main
inject: pause; 30 commits land on main; resume
expect: the workflow worktree rebases or the Kernel replans; stale basedOn refuses old commands
pass:
  - resume lands on the new main
  - no task built on the old HEAD
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: "S1 replan reconcile: goal@n, goal-change, desired-graph reconcile with keep/continue/stale/rework/redo-live/drop"
manual:
  - pause
  - commit 30 times
  - backdate
  - resume
  - step
