schema: starci/scenario@1
id: orca-lost-reply-no-duplicate
group: orca
title: "Orca launched the worker but the reply was lost: no second worker"
inject: worker-start succeeds inside Orca and prints nothing
expect: "the launch is effect_unknown until the Kernel driver asks Orca: kernel next resolves it through request-show (completed), replays it under the same retry-request, and Orca dedupe answers the first dispatch; one worker exists"
pass:
  - kernel next asks request-show for the lost launch
  - task running
  - one distinct retry-request across all worker-starts
  - one dispatch on the Op seats
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: lost
        goal: bench workflow lost
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: lost
  - orca:
      rules:
        - command: worker-start
          match:
            task-title: '^\[Op\]'
          fault: lost-reply
          times: 1
  - name: kernel next dispatches
    seat: kernel:lost
    starci: [kernel, next, lost, --wait, "0"]
    expect: {}
  - read:
      db: ledger
      query: SELECT id FROM tasks ORDER BY rowid
      as: a
  - assert:
      orcaCalls:
        command: request-show
        min: 1
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - running
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 1
        distinct: retry-request
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(DISTINCT handle) FROM seats WHERE role = 'worker'
        equals:
          - 1
