schema: starci/scenario@1
id: lane-fe-code-held-until-be-code
group: plan
title: front-end code of a feature waits for the back end's code of the same feature
inject: one feature with a back-end and a front-end impl record (its screen already drawn); one plan codes both side by side, the next codes the front end behind the back end's code
expect: >-
  define refuses FLOW_INCOMPLETE while the front-end code task does not depend on the back-end code task, naming the impl-be
  record it is held until through its code step; with the front-end code behind the back-end code (and nothing more of the
  back-end lane) the plan is recorded
pass:
  - the side-by-side plan is refused FLOW_INCOMPLETE naming the held back-end record and its code task
  - the plan whose front-end code depends on the back-end code is recorded
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
    .starciwork/.gitignore: "runs/\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: be, name: api}
        - {role: fe, name: web}
    .starciwork/features/shop/ui/cart/direction.html: "<main>cart</main>\n"
    .starciwork/features/shop/ui/cart/index.yaml: |
      schema: work/ui-screen@1
      id: ui.shop.cart
      title: the cart screen
      state: done
      activity: idle
      route: /cart
      direction: .starciwork/features/shop/ui/cart/direction.html
    .starciwork/features/shop/impl/api/cart/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.api.cart
      title: the cart api
      state: todo
      activity: idle
      repository: api
      owners:
        - {role: be, path: api/src/cart}
      proves: []
    .starciwork/features/shop/impl/web/cart/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.web.cart
      title: the cart screen's code
      state: todo
      activity: idle
      repository: web
      owners:
        - {role: fe, path: web/src/cart}
      proves: [ui.shop.cart]
    .starciwork/features/shop/uat/checkout/index.yaml: |
      schema: work/uat-flow@1
      id: uat.shop.checkout
      title: a buyer checks out the cart
      state: todo
      activity: idle
      entry: /cart
      actor: buyer
      steps:
        - {order: 1, action: open the cart, expected: the cart lists its items}
steps:
  - file:
      path: beside.yaml
      content: |
        schema: starci/workflow@1
        id: beside
        goal: build the cart
        runner: inline
        tasks:
          - id: be-code
            label: code
            summary: build the cart api
            allowPaths: [api/src/cart]
            context: [.starciwork/features/shop/impl/api/cart/index.yaml]
            inputs: {side: be, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: be-test
            label: test
            summary: test the cart api
            dependsOn: [be-code]
            allowPaths: [api/test/cart]
            context: [.starciwork/features/shop/impl/api/cart/index.yaml]
            inputs: {edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: be-e2e
            label: verify
            summary: run the cart e2e suite
            dependsOn: [be-test]
            allowPaths: [api/reports/cart]
            context: [.starciwork/features/shop/impl/api/cart/index.yaml]
            inputs: {suite: "node --version", step: e2e}
          - id: be-review
            label: review
            summary: review the cart api diff
            dependsOn: [be-e2e]
            allowPaths: [api/reviews/cart]
            context: [.starciwork/features/shop/impl/api/cart/index.yaml]
            inputs: {since: HEAD}
          - id: fe-code
            label: code
            summary: build the cart screen
            allowPaths: [web/src/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {side: fe, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: fe-audit
            label: audit
            summary: audit the cart screen against its direction
            dependsOn: [fe-code]
            allowPaths: [web/audit/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml, .starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core, run: web/audit/cart}
          - id: walk
            uat: uat.shop.checkout
            dependsOn: [fe-audit]
  - name: define with the front-end code beside the back-end code
    starci: [workflow, define, "${run}/beside.yaml"]
    expect:
      exit: 1
      code: FLOW_INCOMPLETE
      contains: "held until impl.shop.api.cart (impl-be through code); make it depend on be-code"
  - file:
      path: behind.yaml
      content: |
        schema: starci/workflow@1
        id: behind
        goal: build the cart
        runner: inline
        tasks:
          - id: be-code
            label: code
            summary: build the cart api
            allowPaths: [api/src/cart]
            context: [.starciwork/features/shop/impl/api/cart/index.yaml]
            inputs: {side: be, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: be-test
            label: test
            summary: test the cart api
            dependsOn: [be-code]
            allowPaths: [api/test/cart]
            context: [.starciwork/features/shop/impl/api/cart/index.yaml]
            inputs: {edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: be-e2e
            label: verify
            summary: run the cart e2e suite
            dependsOn: [be-test]
            allowPaths: [api/reports/cart]
            context: [.starciwork/features/shop/impl/api/cart/index.yaml]
            inputs: {suite: "node --version", step: e2e}
          - id: be-review
            label: review
            summary: review the cart api diff
            dependsOn: [be-e2e]
            allowPaths: [api/reviews/cart]
            context: [.starciwork/features/shop/impl/api/cart/index.yaml]
            inputs: {since: HEAD}
          - id: fe-code
            label: code
            summary: build the cart screen
            dependsOn: [be-code]
            allowPaths: [web/src/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {side: fe, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: fe-audit
            label: audit
            summary: audit the cart screen against its direction
            dependsOn: [fe-code]
            allowPaths: [web/audit/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml, .starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core, run: web/audit/cart}
          - id: walk
            uat: uat.shop.checkout
            dependsOn: [fe-audit]
  - name: define with the front-end code behind the back-end code
    starci: [workflow, define, "${run}/behind.yaml"]
    expect:
      exit: 0
      contains: "impl.shop.web.cart [impl-fe]: code carried (fe-code)"
  - assert:
      sql:
        db: ledger
        query: SELECT id FROM workflows
        equals:
          - behind
