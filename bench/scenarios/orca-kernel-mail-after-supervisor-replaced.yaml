schema: starci/scenario@1
id: orca-kernel-mail-after-supervisor-replaced
group: orca
title: "a Kernel's escalation after its Supervisor was replaced is mailed to the new Supervisor's Run, never refused as a Dispatch of the old one"
inject: >-
  the Supervisor's terminal dies and the scheduled ensure starts a new Supervisor with a new Run; the Kernel lives on as a
  Dispatch of the old Run, whose terminal Orca refuses as a sender to the new Run (dispatch_run_mismatch), and escalates a
  scope question
expect: >-
  `kernel submit` records the escalation as the new Supervisor's decision and mails its Run from the Supervisor's own
  terminal, the sender looked up at send time; no mail is refused, nothing is typed, and the Supervisor's next returns it
pass:
  - the escalation is a Supervisor decision
  - one mail to the new Run, from the new Supervisor's terminal, and no Orca refusal in the command's outcome
  - no wake prompt typed into the Supervisor's terminal
  - the new Supervisor's next returns the escalation
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: hush
        goal: write doc a
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: hush
  - name: the Supervisor terminal dies
    orca:
      terminal:
        handle: ${supervisor.terminal}
        live: false
  - name: the scheduled ensure starts a new Supervisor
    starci: [supervisor, ensure]
    expect:
      contains: '"action": "started"'
  - read:
      db: machine
      query: SELECT id FROM project_supervisors WHERE ended_at IS NULL
      as: supervisor.launch
  - read:
      db: machine
      query: SELECT terminal FROM project_supervisors WHERE ended_at IS NULL
      as: supervisor.terminal
  - seat: supervisor
    starci: [supervisor, attach, --launch, "${supervisor.launch}"]
  - read:
      db: machine
      query: SELECT run_id FROM project_supervisors WHERE ended_at IS NULL
      as: supervisor.run
  - name: the Kernel is still a Dispatch of the old Run
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM seats WHERE role = 'kernel' AND run_id IS NOT NULL AND run_id <> '${supervisor.run}' AND ended_at IS NULL"
        equals: [1]
  - file:
      path: esc.yaml
      content: |
        schema: starci/command@1
        cmdId: k-hush-ask-1
        kind: escalation
        workflow: hush
        basedOn: {graph: 1}
        escalation:
          kind: scope
          question: may doc a also write docs/b.md?
  - seat: kernel:hush
    starci: [kernel, submit, "${run}/esc.yaml"]
    expect:
      contains: mailed the Supervisor's Run
      lacks: dispatch_run_mismatch
  - assert:
      orcaCalls:
        command: send
        match:
          to: "^run:${supervisor.run}$"
          from: "^${supervisor.terminal}$"
        count: 1
  - assert:
      orcaCalls:
        command: terminal send
        match:
          terminal: "^${supervisor.terminal}$"
        count: 0
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM commands WHERE cmd_id = 'k-hush-ask-1' AND json_extract(outcome_json, '$.mail') = 'mailed the Supervisor''s Run'"
        equals: [1]
  - seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: may doc a also write docs/b.md?
