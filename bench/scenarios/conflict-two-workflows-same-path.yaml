schema: starci/scenario@1
id: conflict-two-workflows-same-path
group: conflict
title: "two inline workflows on one checkout write the same file: both run at once; the second to land returns conflict"
inject: workflows w1 and w2 each have a task writing docs/a.md, each different, on the same checkout
expect: >-
  both workflows queue their task at once, each in an Op worktree of its own; w1 lands on the checkout's branch under its
  land lock; w2's work no longer rebases onto that head, so w2's task returns conflict with its work preserved, nothing is
  resolved by the harness; the landed Op's worktree is removed, the conflicted one waits for its Kernel's settle
pass:
  - w2 has a live task while w1's task is live
  - w1 done; w2 failed with attempt outcome conflict and its work preserved
  - the landed Op's worktree removed; the conflicted one kept until its Kernel settles it
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: w1.yaml
      yaml:
        schema: starci/workflow@1
        id: w1
        goal: bench workflow w1
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - file:
      path: w2.yaml
      yaml:
        schema: starci/workflow@1
        id: w2
        goal: bench workflow w2
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: rewrite doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/w1.yaml
  - name: define
    starci:
      - workflow
      - define
      - ${run}/w2.yaml
  - name: start
    starci:
      - workflow
      - start
      - w1
    save:
      a: data.nodes.0.task.id
  - name: start
    starci:
      - workflow
      - start
      - w2
    save:
      b: data.nodes.0.task.id
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks WHERE workflow_id = 'w2'
        equals:
          - 1
  - name: w2's worker writes its own version
    worker:
      task: ${b}
      status: done
      files:
        docs/a.md: |
          # a by w2
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
  - name: step
    starci:
      - workflow
      - step
      - w1
    save: {}
  - name: step
    starci:
      - workflow
      - step
      - w2
    save: {}
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: SELECT tasks.workflow_id || ':' || tasks.status || ':' || COALESCE(attempts.outcome, '-') FROM tasks JOIN attempts ON attempts.task_id = tasks.id ORDER BY tasks.workflow_id
        equals:
          - "w1:done:done"
          - "w2:failed:conflict"
  - assert:
      exists:
        path: ${project}/preserved/${b}
        present: true
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM events WHERE kind = 'op-worktree-removed'
        equals:
          - 1
