schema: starci/scenario@1
id: budget-minutes-exhausted
group: budget
title: a workflow that used its minutes holds dispatch with BUDGET_EXHAUSTED
inject: the first attempt started nine hours ago (480-minute ceiling); its result is red; a retry is amended
expect: "the retry is not dispatched: the step names BUDGET_EXHAUSTED minutes"
pass:
  - no second task
  - budget show lists minutes as exhausted
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: mins
        goal: bench workflow mins
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - mins
    save:
      a: data.nodes.0.task.id
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/elsewhere.md: |
          x
  - sql:
      db: ledger
      exec: UPDATE attempts SET started_at = '2000-01-01T00:00:00.000Z'
  - name: step
    starci:
      - workflow
      - step
      - mins
    save: {}
    expect: {}
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: mins
        reason: retry
        changes:
          - op: retry
            id: a
  - starci:
      - workflow
      - amend
      - mins
      - --change
      - ${run}/retry.yaml
    expect: {}
  - name: step
    starci:
      - workflow
      - step
      - mins
    save: {}
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks
        equals:
          - 1
  - starci:
      - budget
      - show
      - mins
    expect:
      exit: 0
      contains: minutes
