schema: starci/scenario@1
id: heavy-heap-reaches-tsc-eslint
group: resources
title: "a governed tsc and eslint run under their kind's heap, above node's default"
inject: >-
  a scratch app whose typescript and eslint stand-ins fail unless the node they run in has a heap of at least 8000 MB, as a
  typecheck or typed lint of a large back end needs (node's default heap is 4 GB)
expect: >-
  check typecheck and check lint run each child under --max-old-space-size of its kind's heavy.memoryMb (NODE_OPTIONS of a
  `node <bin>` spawn), so both stand-ins see the heap and exit 0
pass:
  - check typecheck exits 0, its tsc saw a heap of at least 8000 MB
  - check lint exits 0, its eslint saw a heap of at least 8000 MB
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    package.json: '{"name": "bench-heavy-heap", "version": "1.0.0", "private": true}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "core"}}}'
    tsconfig.json: '{"compilerOptions": {"strict": true}, "include": ["src"]}'
    eslint.config.js: "module.exports = []\n"
    src/index.ts: "export const index = 1\n"
    node_modules/typescript/bin/tsc: |
      const limit = Math.round(require("node:v8").getHeapStatistics().heap_size_limit / 1048576)
      if (limit < 8000) { console.log(`tsc heap ${limit} MB is under 8000 MB`); process.exit(1) }
    node_modules/eslint/bin/eslint.js: |
      const limit = Math.round(require("node:v8").getHeapStatistics().heap_size_limit / 1048576)
      if (limit < 8000) { console.log(`eslint heap ${limit} MB is under 8000 MB`); process.exit(1) }
steps:
  - write: { path: src/changed.ts, content: "export const changed = 1\n" }
  - name: the typecheck runs under the tsc heap
    starci: [check, typecheck]
    expect: { exit: 0 }
  - name: the lint runs under the eslint heap
    starci: [check, lint]
    expect: { exit: 0 }
