schema: starci/scenario@1
id: lane-ui-already-drawn-skips
group: plan
title: a screen the owner already drew is not drawn again; its front end is built, audited and walked
inject: the ui record is done with its direction file and no asset slot; the plan holds no draw and no image task
expect: >-
  define records the plan: the ui lane's draw step is satisfied by the approved direction and its image step is optional
  (no asset slot), so the Kernel plans only the front end's code, audit and walk; the same plan without its walk is refused
pass:
  - the plan without a uat task is refused FLOW_INCOMPLETE naming step uat
  - the plan with code, audit and uat is recorded; the ui lane shows draw satisfied and image optional
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
    .starciwork/.gitignore: "runs/\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: be, name: api}
        - {role: fe, name: web}
    .starciwork/features/shop/ui/cart/index.yaml: |
      schema: work/ui-screen@1
      id: ui.shop.cart
      title: the cart screen
      state: done
      activity: idle
      route: /cart
      direction: .starciwork/features/shop/ui/cart/direction.html
    .starciwork/features/shop/ui/cart/direction.html: "<main>cart</main>\n"
    .starciwork/features/shop/impl/web/cart/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.web.cart
      title: the cart screen's code
      state: todo
      activity: idle
      repository: web
      owners:
        - {role: fe, path: web/src/cart}
      proves: [ui.shop.cart]
    .starciwork/features/shop/uat/checkout/index.yaml: |
      schema: work/uat-flow@1
      id: uat.shop.checkout
      title: a buyer checks out the cart
      state: todo
      activity: idle
      entry: /cart
      actor: buyer
      steps:
        - {order: 1, action: open the cart, expected: the cart lists its items}
steps:
  - file:
      path: nowalk.yaml
      content: |
        schema: starci/workflow@1
        id: nowalk
        goal: build the cart screen
        runner: inline
        tasks:
          - id: code
            label: code
            summary: build the cart screen
            allowPaths: [web/src/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {side: fe, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: audit
            label: audit
            summary: audit the cart screen against its direction
            dependsOn: [code]
            allowPaths: [web/audit/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml, .starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core, run: web/audit/cart}
  - name: define without the walk
    starci: [workflow, define, "${run}/nowalk.yaml"]
    expect:
      exit: 1
      code: FLOW_INCOMPLETE
      contains: "step uat is neither satisfied"
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: cart
        goal: build the cart screen
        runner: inline
        tasks:
          - id: code
            label: code
            summary: build the cart screen
            allowPaths: [web/src/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {side: fe, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: audit
            label: audit
            summary: audit the cart screen against its direction
            dependsOn: [code]
            allowPaths: [web/audit/cart]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml, .starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core, run: web/audit/cart}
          - id: walk
            uat: uat.shop.checkout
            dependsOn: [audit]
  - name: define code, audit and walk
    starci: [workflow, define, "${run}/wf.yaml"]
    expect:
      exit: 0
      contains: "ui.shop.cart [ui]: draw satisfied, image optional"
  - assert:
      sql:
        db: ledger
        query: SELECT plan_key FROM plan_nodes WHERE workflow_id = 'cart' ORDER BY plan_key
        equals:
          - audit
          - code
          - walk
