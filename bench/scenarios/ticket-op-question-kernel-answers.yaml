schema: starci/scenario@1
id: ticket-op-question-kernel-answers
group: messaging
title: "an Op stuck on an unclear rule files blocked with its question and proposed default; the Kernel answers it from the goal, and no ticket is opened"
inject: >-
  an Op cannot tell which heading style the doc takes: it files blocked with its question and the default it proposes, instead of
  guessing
expect: >-
  kernel next returns the blocked result as a question carrying the Op's question and proposed default; the Kernel accepts the
  default by retrying the task on its legal route (blocked-answered), which closes the question and launches the next attempt;
  nothing climbs to the Supervisor and no ticket is opened
pass:
  - the question decision carries the Op's question and proposed default
  - the Kernel's retry answers it on the blocked-answered route and the task runs again
  - no escalation, no ticket
  - no actor overstepping its role
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: ask
        goal: write doc a in the house style, title-case headings
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: ask
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: a
  - name: the Op asks instead of guessing
    worker:
      task: ${a}
      status: blocked
      output:
        summary: "question:business: do the headings of doc a take title case or sentence case?"
        question: do the headings of doc a take title case or sentence case?
        default: title case, as the goal's house style says
        files: []
        rulesApplied: []
  - name: kernel next returns the question with the proposed default
    seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
    expect:
      contains: title case, as the goal's house style says
    save:
      question: data.decision.id
      graph: data.digest.graphVersion
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: ask
        reason: "the goal answers it: title-case headings; the Op's default holds"
        changes:
          - op: retry
            id: a
  - file:
      path: cmd-retry.yaml
      content: |
        schema: starci/command@1
        cmdId: k-ask-retry-1
        kind: workflow-change
        workflow: ask
        basedOn: {graph: ${graph}}
        answers: [${question}]
        route: blocked-answered
        note: "answered from the goal: title-case headings"
        change: retry.yaml
  - name: the Kernel answers from the goal and retries the task
    seat: kernel:ask
    starci: [kernel, submit, "${run}/cmd-retry.yaml"]
  - seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT kind || ':' || answered_by FROM decisions WHERE scope = 'kernel' AND kind = 'question'"
        equals: ["question:k-ask-retry-1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE plan_key = 'a' ORDER BY created_at, rowid"
        equals: [cancelled, running]
  - name: nothing climbed to the Supervisor
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor'"
        equals: [0]
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(*) FROM tickets
        equals: [0]
