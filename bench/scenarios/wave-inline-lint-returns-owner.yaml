schema: starci/scenario@1
id: wave-inline-lint-returns-owner
group: verify
title: "inline: task verify skips the heavy checks, the wave runs them once over the batch and returns the task whose file is red"
inject: "of two independent tasks of an inline workflow, the second lands a file with a lint error"
expect: >-
  each task verify runs only the cheap checks and records its check-run-green as due for the wave; the second task is
  independent of the first, so it is dispatched without a wave; once both landed and nothing more can be dispatched the step
  runs one wave (scope decision first), whose scoped lint is red on the second task's file: that task turns failed and the
  workflow blocks, the first task stays done and is judged green
pass:
  - neither task verify ran check-run-green; both left it to the wave (wave-due)
  - one wave ran over both tasks, its scope decision recorded before it ran
  - task b failed with a red check-run-green row naming its file; task a done with a green one
  - the workflow is blocked, not done
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    package.json: '{"name": "bench-wave", "version": "1.0.0", "private": true}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "core"}}}'
    tsconfig.json: '{"compilerOptions": {"strict": true}, "include": ["src"]}'
    eslint.config.js: "module.exports = []\n"
    src/index.ts: "export const index = 1\n"
    node_modules/typescript/bin/tsc: "process.exit(0)\n"
    node_modules/eslint/bin/eslint.js: |
      const { readFileSync } = require("node:fs")
      const { resolve } = require("node:path")
      const bad = process.argv.slice(2).filter((a) => !a.startsWith("--") && readFileSync(a, "utf8").includes("LINT_ERROR"))
      for (const f of bad) console.log(resolve(f) + ": error LINT_ERROR bench/no-error")
      process.exit(bad.length === 0 ? 0 : 1)
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: wave
        goal: two independent changes, one of them red on lint
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: add module a
            allowPaths: [src/a.ts]
            checks: [check-run-green]
          - id: b
            label: docs
            summary: add module b
            allowPaths: [src/b.ts]
            checks: [check-run-green]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, wave]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      files:
        src/a.ts: "export const a = 1\n"
  - name: step verifies a without its heavy check and dispatches b, no wave yet
    starci: [workflow, step, wave]
    save:
      b: data.nodes.1.task.id
  - assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM check_runs WHERE task_id = '${a}' AND name = 'check-run-green') || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'wave-due' AND subject = '${a}') || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'wave-verified')"
        equals: ["0:1:0"]
  - worker:
      task: ${b}
      files:
        src/b.ts: "export const b = 1 // LINT_ERROR\n"
  - name: step verifies b, then the wave runs once and returns b
    starci: [workflow, step, wave]
    expect:
      exit: 1
      contains: "wave red"
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks ORDER BY created_at"
        equals: [done, failed]
  - name: one wave over both tasks, its scope written first
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM events WHERE kind = 'wave-verified') || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'wave-judged') || ':' || ((SELECT MIN(id) FROM events WHERE kind = 'wave-scope') < (SELECT MIN(id) FROM events WHERE kind = 'wave-verified'))"
        equals: ["1:2:1"]
  - name: b carries the red row naming its file, a a green one
    assert:
      sql:
        db: ledger
        query: "SELECT (task_id = '${b}') || ':' || status || ':' || (task_id <> '${b}' OR instr(replace(detail, char(92), '/'), 'src/b.ts') > 0) FROM check_runs WHERE name = 'check-run-green' ORDER BY task_id = '${b}'"
        equals: ["0:green:1", "1:red:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows WHERE id = 'wave'"
        equals: [blocked]
