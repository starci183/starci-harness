schema: starci/scenario@1
id: release-urgent-push-deploy-accepted
group: release
title: "an urgent release pushes after its fast checks alone, and its urgent record lets the production deploy past CI into a safety floor that refuses a failed backup"
inject: >-
  CI cannot answer (the scratch repository has no GitHub); an app whose release gates are stand-ins pushes with release push --urgent,
  then deploys production with and without --urgent while its database backup cannot be taken
expect: >-
  an urgent push without a reason is refused before anything runs; with one it runs the fast checks, tags v1.0.0, pushes main and the
  tag in one push and writes the URGENT record with the reason; a production deploy without --urgent is CI_NOT_GREEN; with --urgent
  the record stands in for CI and the floor runs, refusing STACK_URGENT_BACKUP_FAILED before anything is migrated or deployed; a
  commit without an urgent record is URGENT_RECORD_MISSING
pass:
  - release push --urgent without --reason is RELEASE_URGENT_REASON_MISSING
  - release push --urgent --execute pushes main and v1.0.0 and writes the urgent record naming the reason
  - deploy --execute without --urgent is CI_NOT_GREEN
  - deploy --urgent --execute is accepted past CI and refused STACK_URGENT_BACKUP_FAILED by the floor
  - deploy --urgent of a commit with no urgent record is URGENT_RECORD_MISSING
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    package.json: '{"name": "bench-urgent", "version": "1.0.0", "private": true}'
    hfs.json: '{"hfs": 3, "kind": "app", "edition": "lite", "project": "bench-urgent"}'
    ok.mjs: "process.exit(0)\n"
    .starcistacks/production/infra/swarm/stack.yaml: "services:\n  api: {image: app/api}\n"
    .starcistacks/production/secrets/ops.enc: "sealed stand-in\n"
    .starcistacks/application-stacks.yaml: |
      schema: starci/application-stacks@1
      release:
        gates:
          - {name: app-check, command: [node, ok.mjs]}
          - {name: typecheck, command: [node, ok.mjs]}
          - {name: lint, command: [node, ok.mjs]}
          - {name: test, command: [node, ok.mjs]}
          - {name: build, command: [node, ok.mjs]}
      services:
        audit: {mode: disabled}
      database:
        projectRef: benchurgentprojectref
      environments:
        production:
          runtime: docker-swarm
          composeFiles: [infra/swarm/stack.yaml]
          deploy:
            stack: bench-urgent
            remote: {host: vps, releasesBase: /srv/bench-urgent, sealed: {ops: ops, sshKey: vps-ssh-key, knownHosts: vps-known-hosts}}
            images:
              api: {app: api}
            verify:
              http:
                - {name: api readiness, url: "https://api.example.invalid/readyz", status: 200}
steps:
  - git: [init, -q, --bare, -b, main, "${run}/remote.git"]
  - git: [remote, add, origin, "${run}/remote.git"]
  - name: the age identity the floor's test decrypt would read
    file: { path: "${run}/identity.txt", content: "stand-in identity: the backup fails before any decrypt\n" }
  - name: an urgent release says why, or nothing runs
    starci: [app, release, push, --urgent]
    expect: { exit: 2, contains: RELEASE_URGENT_REASON_MISSING }
  - name: the urgent release runs the fast checks, tags and pushes, and writes its record
    starci: [app, release, push, --urgent, --reason, "CI budget exhausted tonight", --execute]
    expect: { exit: 0, contains: '"pushed": true' }
    save:
      head: data.output.head
  - assert:
      gitLog: { grep: "bench: scratch repository", count: 1, in: "${run}/remote.git", ref: v1.0.0 }
  - assert:
      exists: { path: ".git/starci-release/${head}.urgent.json", present: true, contains: "CI budget exhausted tonight" }
  - name: without --urgent the production deploy waits for a CI that cannot answer
    starci: [app, stack, deploy, --env, production, --source-sha, "${head}", --image, "api=registry.example.invalid/api@sha256:1111111111111111111111111111111111111111111111111111111111111111", --execute]
    expect: { exit: 1, code: CI_NOT_GREEN }
  - name: with --urgent the record stands in for CI and the floor refuses the failed backup before any migration or deploy
    starci: [app, stack, deploy, --env, production, --source-sha, "${head}", --image, "api=registry.example.invalid/api@sha256:1111111111111111111111111111111111111111111111111111111111111111", --urgent, --db-url-env, BENCH_URGENT_DB_URL, --backup-out, "${run}/backups", --execute]
    env:
      SOPS_AGE_KEY_FILE: "${run}/identity.txt"
      BENCH_URGENT_DB_URL: ""
    expect: { exit: 2, contains: STACK_URGENT_BACKUP_FAILED }
  - name: a commit with no urgent record is not let past CI
    starci: [app, stack, deploy, --env, production, --source-sha, "0123456789abcdef0123456789abcdef01234567", --image, "api=registry.example.invalid/api@sha256:1111111111111111111111111111111111111111111111111111111111111111", --urgent, --execute]
    expect: { exit: 1, code: URGENT_RECORD_MISSING }
