schema: starci/scenario@1
id: worktree-reap-busy-unlisted-now
group: lifecycle
title: "a folder already left busy, which git no longer lists, is still reaped: worktree gc --now ends the process working in it and removes it"
inject: >-
  an inline task's Op worktree left busy by an earlier removal (its busy record's backoff still running), then deregistered from
  git with its folder left behind, and a process working inside that folder, as the orphaned `python3 -` a seat left
expect: >-
  worktree gc keeps the folder while its backoff runs; worktree gc --now tries it at once: it reaps the folder, ending the process
  working inside it, removes the folder and ends the busy record
pass:
  - the earlier removal is recorded busy at attempt 1
  - a plain gc before the backoff runs out leaves the folder and its holder alone
  - gc --now ends the holder, recorded as reaped by its working folder, and the folder is gone
  - the busy record is cleared and the Op worktree recorded removed
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: docs/base.md
      content: "base\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: base"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: stuck
        goal: bench workflow stuck
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: start makes the inline task's Op worktree
    starci: [workflow, start, stuck]
    save:
      a: data.nodes.0.task.id
  - name: a program working elsewhere holds the folder, so the cancel's removal is left busy
    serve:
      stub: hold
      args: [--hold, "${project}/worktrees/stuck.ops/${a}/docs/base.md"]
      cwd: ${run}
      as: outside
  - starci: [task, cancel, "${a}", --reason, bench]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.attempt') FROM events WHERE kind = 'worktree-remove-busy'"
        equals: [1]
  - name: that program lets go
    http:
      method: POST
      url: "${outside.url}/__exit"
      expect:
        status: 200
  - name: git no longer lists the worktree (the busy removal deregistered it), yet its folder stays with files in it
    assert:
      exists:
        path: ${project}/worktrees/stuck.ops/${a}/.git
        present: false
  - write:
      path: ${project}/worktrees/stuck.ops/${a}/left.txt
      content: "left behind\n"
  - name: a process a seat left works inside the folder
    serve:
      stub: hold
      cwd: ${project}/worktrees/stuck.ops/${a}
      as: stray
  - name: a plain gc waits for the backoff
    starci: [worktree, gc]
  - assert:
      exists:
        path: ${project}/worktrees/stuck.ops/${a}
        present: true
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'worktree-reaped'"
        equals: [0]
  - name: gc --now tries it at once, reaps the folder and removes it
    starci: [worktree, gc, --now]
  - assert:
      exists:
        path: ${project}/worktrees/stuck.ops/${a}
        present: false
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'worktree-reaped' AND data_json LIKE '%\"pid\":${stray.token},%\"why\":\"cwd\"%'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'worktree-remove-busy-cleared'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'op-worktree-removed' AND subject = '${a}'"
        equals: [1]
