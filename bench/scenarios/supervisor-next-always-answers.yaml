schema: starci/scenario@1
id: supervisor-next-always-answers
group: crash
title: "supervisor next always prints its envelope: Orca crashing and answering garbage under it never leaves a silent exit"
inject: "Orca crashes on every mailbox check and answers garbage to every terminal list while the Supervisor waits in next with a dispatched worker"
expect: >-
  supervisor next --json sweeps, tends its worker, waits on a mailbox that crashes, and still returns one starci/supervisor-next@1
  envelope (exit 0, idle) naming the mailbox it could not read; a failure no verb catches is printed as a starci/refusal@1
  envelope with exit 1 by the CLI's last resort (main.ts), never a silent exit; the wait stops early by the longest sweep so the
  answer comes inside the caller's shell timeout
pass:
  - one supervisor-next envelope with kind idle and the unread mailbox among its actions
  - no human intervention beyond the injected faults
automation: automated
steps:
  - name: boot the project's Supervisor
    boot: {}
  - name: the Supervisor dispatches a worker
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "write the bench note", --label, docs, --allow, docs/note.md]
  - orca:
      rules:
        - {command: check, fault: crash, times: 100}
        - {command: terminal list, fault: garbage, times: 100}
  - name: supervisor next answers through the faults
    seat: supervisor
    starci: [supervisor, next, --wait, "2"]
    expect:
      ok: true
      contains: '"kind": "idle"'
  - name: the unread mailbox is reported, not hidden
    seat: supervisor
    starci: [supervisor, next, --wait, "1"]
    expect:
      ok: true
      contains: mailbox not read
