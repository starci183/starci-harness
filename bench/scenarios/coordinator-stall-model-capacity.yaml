schema: starci/scenario@1
id: coordinator-stall-model-capacity
group: orca
title: "a Kernel stops at its prompt after a model-capacity error: the tick nudges it, then relaunches it on another member with the first one's circuit open"
inject: >-
  the Kernel's agent stops at its prompt (tui-idle) while its workflow has a ready node, Orca's worker-show names the error
  ("Selected model is at capacity"), and it makes no driver call; the owner's scheduled supervisor tick runs, the Supervisor
  itself never calls supervisor next
expect: >-
  the first tick nudges the Kernel once with its loop prompt (terminal send), a second tick inside the grace waits; once the
  nudge went unanswered past nudgeGraceMinutes the tick gives the seat up: a stalled outcome for its member, the provider circuit
  opened for capacity, and the Kernel relaunched on a member of another pool
pass:
  - exactly one nudge, typed into the Kernel's terminal
  - the stalled Kernel is replaced by one Kernel of another pool
  - the first member's provider circuit is open for capacity
  - the first member has a stalled outcome with the kernel label
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: cap
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: cap
  - read:
      db: ledger
      query: SELECT handle FROM seats WHERE role = 'kernel'
      as: kernel.dispatch
  - read:
      db: ledger
      query: SELECT agent FROM seats WHERE role = 'kernel'
      as: kernel.agent
  - name: the Kernel hit a capacity error and sits at its prompt
    orca:
      set:
        tuiIdle:
          ${kernel.cap.terminal}: true
        agentWait:
          ${kernel.dispatch}: "Selected model is at capacity. Please try a different model."
  - &quiet
    name: its last driver call was ten minutes ago
    sql:
      db: ledger
      exec: UPDATE seats SET lease_until = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '+5 minutes') WHERE role = 'kernel'
  - name: the scheduled tick nudges the Kernel
    starci: [supervisor, tick]
    expect:
      contains: nudge 1 of
  - name: a tick inside the grace waits
    starci: [supervisor, tick]
    expect:
      contains: nudged at
  - assert:
      orcaCalls:
        command: terminal send
        match:
          terminal: ${kernel.cap.terminal}
        count: 1
  - name: the nudge went unanswered for four minutes
    sql:
      db: ledger
      exec: UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-4 minutes') WHERE kind = 'stall-nudged'
  - name: the tick gives the Kernel up and relaunches it on another member
    starci: [supervisor, tick]
    expect:
      contains: stalled (capacity)
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\]'
        count: 2
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(DISTINCT agent) FROM seats WHERE role = 'kernel'
        equals: [2]
  - assert:
      sql:
        db: machine
        query: "SELECT status || ':' || failure_kind FROM provider_health WHERE provider = '${kernel.agent}'"
        equals: ["open:capacity"]
  - assert:
      sql:
        db: machine
        query: "SELECT class FROM member_outcomes WHERE label = 'kernel' AND pool = '${kernel.agent}'"
        equals: ["stalled"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'kernel-relaunched' AND data_json LIKE '%stalled (capacity)%'"
        equals: [1]
