schema: starci/scenario@1
id: supervisor-worker-cap-counts-kernel-ops
group: scale
title: "the project's worker cap counts Kernel Ops and Supervisor workers together"
inject: seven [Worker] seats run in the project when a workflow with five ready docs tasks starts (projectMaxWorkers 10)
expect: >-
  kernel next launches only three Ops, the other two tasks wait queued naming the project's cap (no route is tried for them, so
  no other provider takes them); once the Supervisor rejects one worker (its seat released), the next kernel next launches one
  more Op
pass:
  - 7 [Worker] and 3 [Op] worker-starts, then a fourth [Op] after the reject
  - two queued tasks before the reject, one after
  - no human intervention beyond the injected load
automation: automated
steps:
  - name: boot the project's Supervisor
    boot: {}
  - name: dispatch worker 1
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "write doc w1", --label, docs, --allow, docs/w1.md]
    expect:
      contains: routed
    save:
      worker1: data.worker
  - name: dispatch worker 2
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "write doc w2", --label, docs, --allow, docs/w2.md]
    expect:
      contains: routed
    save:
      worker2: data.worker
  - name: dispatch worker 3
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "write doc w3", --label, docs, --allow, docs/w3.md]
    expect:
      contains: routed
    save:
      worker3: data.worker
  - name: dispatch worker 4
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "write doc w4", --label, docs, --allow, docs/w4.md]
    expect:
      contains: routed
    save:
      worker4: data.worker
  - name: dispatch worker 5
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "write doc w5", --label, docs, --allow, docs/w5.md]
    expect:
      contains: routed
    save:
      worker5: data.worker
  - name: dispatch worker 6
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "write doc w6", --label, docs, --allow, docs/w6.md]
    expect:
      contains: routed
    save:
      worker6: data.worker
  - name: dispatch worker 7
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "write doc w7", --label, docs, --allow, docs/w7.md]
    expect:
      contains: routed
    save:
      worker7: data.worker
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: five
        goal: write five docs
        runner: orca
        maxParallel: 5
        tasks:
          - id: o1
            label: docs
            summary: write doc o1
            allowPaths: [docs/o1.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/o1.md]
          - id: o2
            label: docs
            summary: write doc o2
            allowPaths: [docs/o2.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/o2.md]
          - id: o3
            label: docs
            summary: write doc o3
            allowPaths: [docs/o3.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/o3.md]
          - id: o4
            label: docs
            summary: write doc o4
            allowPaths: [docs/o4.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/o4.md]
          - id: o5
            label: docs
            summary: write doc o5
            allowPaths: [docs/o5.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/o5.md]
  - name: boot the workflow
    boot:
      file: ${run}/wf.yaml
      workflow: five
  - name: kernel next launches only into the project's free slots
    seat: kernel:five
    starci: [kernel, next, five, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 3
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE workflow_id = 'five' AND status = 'queued'"
        equals: [2]
  - name: the Supervisor rejects one worker
    seat: supervisor
    starci: [supervisor, reject, "${worker1}"]
    expect:
      contains: rejected
  - name: kernel next takes the freed slot
    seat: kernel:five
    starci: [kernel, next, five, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 4
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE workflow_id = 'five' AND status = 'queued'"
        equals: [1]
