schema: starci/scenario@1
id: worktree-gc-every-kind
group: lifecycle
title: "worktree gc removes every harness worktree whose owner ended, and an orphan's dirty work is preserved first"
inject: >-
  a cancelled inline task, an Op worktree a crash left behind its failed task, a done workflow's worktree, an ended Supervisor
  worker's worktree, a package edit landed on main whose packages/ the project's local package record names, a live task's worktree, and an orphan no ledger row owns holding uncommitted work
expect: >-
  task cancel removes its Op worktree at once; worktree gc --dry-run lists the due ones and changes nothing; worktree gc
  preserves the orphan's work (its changed and untracked files), unlinks links, removes every due worktree and prunes, keeps
  the live task's, keeps every branch but a landed Op's, and repoints the record entry inside the removed package edit worktree
  to the harness's own packages/ folder
pass:
  - the cancelled task's Op worktree is gone right after the cancel
  - the dry run removes nothing
  - the gc removes the failed task's, the workflow's, the worker's, the package's and the orphan's worktrees and keeps the live one
  - the local package record no longer names the removed package worktree
  - the orphan's tracked change and untracked file are in its preserved folder
  - the workflow's and the orphan's branches remain
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: docs/base.md
      content: "base\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: base"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: sweep
        goal: bench workflow sweep
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
          - id: b
            label: docs
            summary: write doc b
            allowPaths:
              - docs/b.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/b.md
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: start makes the first inline task's Op worktree
    starci: [workflow, start, sweep]
    save:
      a: data.nodes.0.task.id
  - assert:
      exists:
        path: ${project}/worktrees/sweep.ops/${a}
        present: true
  - name: the cancel removes it at once
    starci: [task, cancel, "${a}", --reason, bench]
  - assert:
      exists:
        path: ${project}/worktrees/sweep.ops/${a}
        present: false
  - name: the next step gives task b its Op worktree; a crash then leaves it behind its failed task
    starci: [workflow, step, sweep]
    expect:
      exit: 1
    save:
      b: data.next.task
  - assert:
      exists:
        path: ${project}/worktrees/sweep.ops/${b}
        present: true
  - sql:
      db: ledger
      exec: "UPDATE tasks SET status = 'failed' WHERE id = '${b}'"
  - name: its Kernel settled it discard before the crash, so gc may remove it (an unsettled attempt keeps its worktree)
    sql:
      db: ledger
      exec: "INSERT INTO events (at, kind, subject, data_json) VALUES (strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), 'op-settle-ruled', '${b}', json_object('decision', 'discard', 'cmdId', 'k-bench'))"
  - name: a live task's worktree, which gc keeps
    sql:
      db: ledger
      exec: "INSERT INTO tasks (id, workflow_id, label, contract_json, contract_hash, try_no, status, created_at, updated_at) SELECT 't-live0001', workflow_id, label, contract_json, contract_hash, 1, 'running', created_at, updated_at FROM tasks WHERE id = '${b}'"
  - git: [worktree, add, -q, -b, starci/sweep.ops/t-live0001, "${project}/worktrees/sweep.ops/t-live0001", HEAD]
  - name: a done workflow's worktree
    git: [worktree, add, -q, -b, starci/done-wf, "${project}/worktrees/done-wf", HEAD]
  - sql:
      db: ledger
      exec: "INSERT INTO workflows (id, goal_json, status, created_at) SELECT 'done-wf', goal_json, 'done', created_at FROM workflows WHERE id = 'sweep'"
  - name: an ended Supervisor worker's worktree
    git: [worktree, add, -q, -b, starci/w-ended01, "${project}/worktrees/w-ended01", HEAD]
  - sql:
      db: machine
      exec: "INSERT INTO supervisor_workers (id, project, repo, task_id, topic, worktree, created_at, ended_at, ended_by) VALUES ('w-ended01', 'bench', '${repo}', 't-none', 'bench', '${project}/worktrees/w-ended01', '2026-10-28T00:00:00Z', '2026-10-28T00:01:00Z', 'accepted')"
  - name: a package edit whose head is on main
    git: [worktree, add, -q, -b, pkg/bench-landed, "${run}/pkg-landed", HEAD]
  - git: [rev-parse, HEAD]
    save:
      head: stdout
  - sql:
      db: machine
      exec: "CREATE TABLE IF NOT EXISTS package_handoffs (branch TEXT NOT NULL, head TEXT NOT NULL, harness TEXT NOT NULL, worktree TEXT NOT NULL, app TEXT NOT NULL, packages TEXT NOT NULL, urgent INTEGER NOT NULL, note TEXT, by_role TEXT, at TEXT NOT NULL, PRIMARY KEY (branch, head)); INSERT INTO package_handoffs VALUES ('pkg/bench-landed', '${head}', '${repo}', '${run}/pkg-landed', 'bench', '[]', 0, NULL, NULL, '2026-10-28T00:00:00Z')"
  - name: the project takes @starci/tsconfig from the package edit worktree
    write:
      path: ${run}/pkg-landed/packages/tsconfig/package.json
      content: '{"name": "@starci/tsconfig", "version": "9.9.9"}'
  - file:
      path: ${project}/deps-local.json
      json:
        schema: starci/deps-local@1
        packages:
          - name: "@starci/tsconfig"
            folder: ${run}/pkg-landed/packages/tsconfig
  - name: an orphan holding uncommitted work
    git: [worktree, add, -q, -b, starci/stray, "${project}/worktrees/stray", HEAD]
  - write:
      path: ${project}/worktrees/stray/docs/base.md
      content: "edited in the orphan\n"
  - write:
      path: ${project}/worktrees/stray/docs/new.md
      content: "untracked in the orphan\n"
  - name: the dry run changes nothing
    starci: [worktree, gc, --dry-run]
  - assert:
      exists:
        path: ${project}/worktrees/stray
        present: true
  - name: the gc
    starci: [worktree, gc]
  - assert:
      exists:
        path: ${project}/worktrees/sweep.ops/${b}
        present: false
  - assert:
      exists:
        path: ${project}/worktrees/sweep.ops/t-live0001
        present: true
  - assert:
      exists:
        path: ${project}/worktrees/done-wf
        present: false
  - assert:
      exists:
        path: ${project}/worktrees/w-ended01
        present: false
  - assert:
      exists:
        path: ${run}/pkg-landed
        present: false
  - name: the removed package worktree's record entry now names the harness's own packages/tsconfig
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) || ':' || SUM(instr(json_extract(data_json, '$.healed[0].from'), 'pkg-landed') > 0 AND json_extract(data_json, '$.healed[0].to') LIKE '%/packages/tsconfig') FROM events WHERE kind = 'deps-local-healed'"
        equals: ["1:1"]
  - assert:
      exists:
        path: ${project}/worktrees/stray
        present: false
  - assert:
      exists:
        path: ${project}/preserved/gc-stray/changes.patch
        present: true
  - assert:
      exists:
        path: ${project}/preserved/gc-stray/untracked/docs/new.md
        present: true
  - name: the workflow's branch keeps its commits
    git: [rev-parse, --verify, --quiet, refs/heads/starci/done-wf]
  - name: the orphan's branch too
    git: [rev-parse, --verify, --quiet, refs/heads/starci/stray]
