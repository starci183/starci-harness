schema: starci/scenario@1
id: orca-worker-exited
group: orca
title: "Orca reports the worker exited: the task becomes effect_unknown (lost), never silently running"
inject: after launch, worker-show answers state exited; the seat is past its launch grace
expect: the step's ping marks the seat worker-lost and the running task effect_unknown; the workflow blocks naming it
pass:
  - task effect_unknown
  - workflow blocked
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: gone
        goal: bench workflow gone
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: gone
  - name: kernel next dispatches
    seat: kernel:gone
    starci: [kernel, next, gone, --wait, "0"]
  - orca:
      worker:
        dispatch: "*"
        state: exited
  - sql:
      db: ledger
      exec: UPDATE seats SET started_at = '2020-01-01T00:00:00.000Z' WHERE role = 'worker'
  - name: kernel next
    seat: kernel:gone
    starci: [kernel, next, gone, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - effect_unknown
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows
        equals:
          - blocked
