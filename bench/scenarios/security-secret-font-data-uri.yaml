schema: starci/scenario@1
id: security-secret-font-data-uri
group: security
title: "a page that embeds a font as a base64 data URI is content, not a secret; a key planted in the same page is still caught"
inject: >-
  a direction page embeds a font as a data:font/woff2;base64 URI whose payload is larger than scan.maxFileBytes and spells a
  provider-shaped key the way base64 can; then the same page also carries the run's key in a tag
expect: >-
  check secrets judges the page with its embedded content payload set aside: green for the page alone, red naming the line of
  the planted key for the second, never printing the key
pass:
  - the page with the embedded font is judged (not unjudged) and green
  - the page with a planted key is red with rule aws-access-key, and the output never shows the key
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: ui/direction.html
      generated: font-page
  - name: the embedded font is content
    starci: [check, secrets, --all]
    expect:
      exit: 0
      contains: "\"unjudged\": []"
      lacks: ${generatedKey}
  - write:
      path: ui/direction.html
      generated: font-page-secret
  - name: a key planted beside the font is caught
    starci: [check, secrets, --all]
    expect:
      exit: 1
      contains: "\"pattern\": \"aws-access-key\""
      lacks: ${generatedKey}
