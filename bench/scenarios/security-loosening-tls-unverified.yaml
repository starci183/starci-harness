schema: starci/scenario@1
id: security-loosening-tls-unverified
group: security
title: TLS verification turned off is a loosening finding in code, specs, scripts, workflows, Dockerfiles and .env templates; the test-world https fake path is green
inject: >-
  the test-world https fake path as the harness ships it (defineHttpFake https, the in-memory fake CA, its specs) and an app
  client that trusts the fake CA through its `ca` option; then the process switch set to 0 and the client option set false in
  every form and file kind the loosening gate reads (an .env template the security policy lets it read: `.env` and `.env.*` stay neverRead)
expect: >-
  check loosening is green on the https fake path and on a client trusting a CA (reading or comparing the switch, and a
  comment naming it, are no finding); each form that turns verification off is a tls-unverified finding at its file and line
pass:
  - the shipped https fake path and a client trusting the fake CA are green
  - the switch assigned in code, set in a spawned env object, in a spec, in a shell script, a workflow env entry, a Dockerfile ENV, a package.json script and an .env template is red
  - the client option set false, as a key and as an assigned property, is red
  - reading or comparing the switch, and a comment naming it, stay green
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: packages/test-world/src/fakes/framework
      from: ${ops}/../packages/test-world/src/fakes/framework
  - write:
      path: src/oidc/issuer.client.ts
      content: |
        import { Agent } from "node:https"

        // A test issuer is trusted through its CA; NODE_TLS_REJECT_UNAUTHORIZED stays untouched.
        export const issuerAgent = (ca: string | undefined): Agent => new Agent({ ca, rejectUnauthorized: true })

        export const verificationOff = (): boolean => process.env.NODE_TLS_REJECT_UNAUTHORIZED === "0"
  - name: the https fake path and a client trusting the fake CA are green
    starci: [check, loosening]
    expect:
      exit: 0
      lacks: "tls-unverified ("
  - write:
      path: src/oidc/insecure.client.ts
      content: |
        import { Agent } from "node:https"

        process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
        export const agent = new Agent({ rejectUnauthorized: false })
        export const options = { "rejectUnauthorized": false }
        export const env = { ...process.env, NODE_TLS_REJECT_UNAUTHORIZED: "0" }
        export const patch = (target: { rejectUnauthorized: boolean }): void => {
            target.rejectUnauthorized = false
        }
  - write:
      path: src/oidc/issuer.e2e-spec.ts
      content: |
        process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = '0'
  - write:
      path: scripts/e2e.sh
      content: |
        #!/usr/bin/env bash
        export NODE_TLS_REJECT_UNAUTHORIZED=0
        npm run test:e2e
  - write:
      path: .github/workflows/e2e.yml
      content: |
        on: push
        jobs:
          e2e:
            runs-on: ubuntu-latest
            env:
              NODE_TLS_REJECT_UNAUTHORIZED: "0"
            steps:
              - run: npm run test:e2e
  - write:
      path: Dockerfile
      content: |
        FROM node:22
        ENV NODE_TLS_REJECT_UNAUTHORIZED 0
  - write:
      path: package.json
      content: |
        { "name": "bench-tls", "private": true, "scripts": { "test:e2e": "NODE_TLS_REJECT_UNAUTHORIZED=0 jest" } }
  - write:
      path: deploy/app.env.example
      content: |
        # NODE_TLS_REJECT_UNAUTHORIZED=0 in a comment is no finding
        NODE_TLS_REJECT_UNAUTHORIZED=0
  - name: the switch assigned in code is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "process.env.NODE_TLS_REJECT_UNAUTHORIZED = \"0\""'
  - name: the client option as a key is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "export const agent = new Agent({ rejectUnauthorized: false })"'
  - name: the client option as a quoted key is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "export const options = { \"rejectUnauthorized\": false }"'
  - name: the switch in a spawned env object is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "export const env = { ...process.env, NODE_TLS_REJECT_UNAUTHORIZED: \"0\" }"'
  - name: the client option as an assigned property is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "target.rejectUnauthorized = false"'
  - name: the switch in a spec is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "process.env[\"NODE_TLS_REJECT_UNAUTHORIZED\"] = ''0''"'
  - name: the switch in a shell script is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "export NODE_TLS_REJECT_UNAUTHORIZED=0"'
  - name: the switch in a workflow env entry is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "NODE_TLS_REJECT_UNAUTHORIZED: \"0\""'
  - name: the switch in a Dockerfile ENV is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "ENV NODE_TLS_REJECT_UNAUTHORIZED 0"'
  - name: the switch in a package.json script is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "{ \"name\": \"bench-tls\", \"private\": true, \"scripts\": { \"test:e2e\": \"NODE_TLS_REJECT_UNAUTHORIZED=0 jest\" } }"'
  - name: the switch on an .env template line is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: '"text": "NODE_TLS_REJECT_UNAUTHORIZED=0"'
  - name: the .env comment line is no finding
    starci: [check, loosening]
    expect:
      exit: 1
      lacks: '"text": "# NODE_TLS_REJECT_UNAUTHORIZED=0 in a comment is no finding"'
  - name: the trusting client stays green beside them
    starci: [check, loosening]
    expect:
      exit: 1
      lacks: '"file": "src/oidc/issuer.client.ts"'
  - name: nothing of the https fake path is a finding
    starci: [check, loosening]
    expect:
      exit: 1
      lacks: '"file": "packages/test-world/'
