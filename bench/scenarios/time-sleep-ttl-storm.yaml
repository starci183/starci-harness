schema: starci/scenario@1
id: time-sleep-ttl-storm
group: time
title: a laptop sleep lapses every TTL lease at once
inject: all seats' last ping 8 h ago; the host wakes
expect: "unknown is not dead: no relaunch until Orca answers; seats Orca reports alive keep running; no double launch"
pass:
  - worker-start count unchanged after wake
  - tasks Orca reports gone are effect_unknown only
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: the host daemon for seat liveness and sweeps (not built)
manual:
  - backdate every seat
  - stand-in reports all ready
  - step
  - assert no worker-start
