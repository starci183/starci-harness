schema: starci/scenario@1
id: orca-garbage-run-create-no-second-run
group: orca
title: "run-create answers garbage: the retry replays the same request, never a second Run"
inject: run-create prints html instead of json once
expect: the Kernel's Run is unknown, not failed; the next attempt replays the same retry-request id
pass:
  - every run-create carries one retry-request id
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - orca:
      rules:
        - command: run-create
          fault: garbage
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: junk
        goal: bench workflow junk
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - junk
    save: {}
    expect: {}
  - name: step
    starci:
      - workflow
      - step
      - junk
    save: {}
    expect: {}
  - assert:
      orcaCalls:
        command: run-create
        min: 1
        distinct: retry-request
  - assert:
      orcaCalls:
        command: run-create
        max: 1
        distinct: retry-request
