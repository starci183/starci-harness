schema: starci/scenario@1
id: stories-skeleton-missing-red
group: verify
title: "check stories is red when the block's skeleton story is gone"
inject: "the fixture's stories file loses its skeleton story; every shape story stays"
expect: "check stories names both DataSlot fields of LeadBoardBlockBase (leads, owners) as STORY_SKELETON_MISSING, and nothing else"
pass:
  - the verb exits 1 with verdict red
  - the two findings are STORY_SKELETON_MISSING, one per slot
  - no human intervention beyond the injected fault
automation: automated
steps:
  - name: copy the shape-slot fixture into the scratch repository
    write: { path: ".", from: "${ops}/../bench/fixtures/shape-slot/app" }
  - name: drop the skeleton story
    write:
      path: fe/apps/leads/stories/LeadBoardBlock.stories.tsx
      content: |
        import type { Meta, StoryObj } from "@storybook/react"
        import { LeadBoardBlockBase } from "@/components/blocks/LeadBoardBlock/component"
        import { LEAD_BOARD_ARGS } from "./LeadBoardBlock.data"

        const meta = { title: "Blocks/LeadBoardBlock", component: LeadBoardBlockBase, args: LEAD_BOARD_ARGS } satisfies Meta<typeof LeadBoardBlockBase>

        export default meta

        type Story = StoryObj<typeof meta>

        export const ListShape: Story = { args: { shape: "list" } }

        export const StagesShape: Story = { args: { shape: "stages" } }

        export const UnassignedShape: Story = { args: { shape: "unassigned" } }
  - name: the missing skeleton is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"code": "STORY_SKELETON_MISSING"' }
  - name: it names the leads slot
    starci: [check, stories]
    expect: { exit: 1, contains: "slot leads of LeadBoardBlockBase is never drawn loading" }
  - name: it names the owners slot
    starci: [check, stories]
    expect: { exit: 1, contains: "slot owners of LeadBoardBlockBase is never drawn loading" }
  - name: nothing else is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"findings": 2' }
