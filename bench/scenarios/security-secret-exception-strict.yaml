schema: starci/scenario@1
id: security-secret-exception-strict
group: security
title: a secret-scan exception covers only the lines it pins, goes red when stale, and only on a fixture, template or detector
inject: a fixture holding the run's generated key, then a second key line in the same file, a stale match, and an exception on a source file
expect: >-
  check secrets --all is green with the pinned line excepted and listed, the policy line that pins it is no finding; a new key
  line in the same file is a finding; a match that covers nothing is EXCEPTION_STALE; an exception on a file that is no
  fixture, template or detector is refused EXCEPTION_KIND_REFUSED
pass:
  - the pinned line is excepted and listed with its kind, and its declaration in policy/security.yaml is no finding
  - the new line in the same file is red
  - the stale match is red EXCEPTION_STALE
  - the exception on src/ is refused EXCEPTION_KIND_REFUSED
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: fixtures/keys.js
      generated: secret
  - write:
      path: policy/security.yaml
      content: |
        schema: starci/security-policy@1
        exceptions:
          - path: fixtures/keys.js
            rule: aws-access-key
            kind: fixture
            match: 'const awsKey = "${key}"'
            reason: "the key fixture the secret scan is proved against"
  - name: the pinned line passes
    starci: [check, secrets, --all]
    expect:
      exit: 0
      contains: "\"kind\": \"fixture\""
  - write:
      path: fixtures/keys.js
      content: |
        const awsKey = "${key}"
        const otherKey = "${key}"
  - name: a new line in the same file is red
    starci: [check, secrets, --all]
    expect:
      exit: 1
      contains: "\"line\": 2"
  - write:
      path: fixtures/keys.js
      generated: secret
  - write:
      path: policy/security.yaml
      content: |
        schema: starci/security-policy@1
        exceptions:
          - path: fixtures/keys.js
            rule: aws-access-key
            kind: fixture
            match:
              - 'const awsKey = "${key}"'
              - 'const spareKey = "${key}"'
            reason: "the key fixture the secret scan is proved against"
  - name: a stale match is red
    starci: [check, secrets, --all]
    expect:
      exit: 1
      contains: "\"index\": 1"
  - write:
      path: policy/security.yaml
      content: |
        schema: starci/security-policy@1
        exceptions:
          - path: src/keys.js
            rule: aws-access-key
            kind: fixture
            match: 'const awsKey = "${key}"'
            reason: "a source file is no fixture, whatever it holds"
  - name: an exception on a source file is refused
    starci: [check, secrets, --all]
    expect:
      ok: false
      code: EXCEPTION_KIND_REFUSED
