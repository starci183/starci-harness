schema: starci/scenario@1
id: telegram-token-from-secret-env
group: security
title: "the bot token is read by name from secret.env when the environment lacks it, the environment wins over the file, an unlisted key is refused, and no value is ever printed"
inject: >-
  the run's secret.env (STARCI_SECRET_ENV) holds the bot token among comments, an `export`, quotes and another key; the
  environment then sets the token while the file holds a wrong one, and the reverse; finally ops/telegram.yaml names a key
  policy/security.yaml secretKeys does not list
expect: >-
  with no token in the environment, status reports it configured from secret.env and discover-chat reaches the bot with the
  file's token; with the right token in the environment and a wrong one in the file, the environment's is used; with the
  environment empty and a wrong token in the file, the bot rejects it, so the file is what was read; a token key the policy does
  not list is refused SECRET_KEY_UNLISTED before any file is read; no output carries the token or the file's other value
pass:
  - status says configured, source secret.env, then source environment
  - discover-chat succeeds with the file's token and with the environment's over a wrong file token
  - a wrong file token alone is TELEGRAM_TOKEN_REJECTED
  - an unlisted key is SECRET_KEY_UNLISTED
  - no output carries the token or the other key's value
automation: automated
env:
  TELEGRAM_BOT_TOKEN: ""
  STARCI_TELEGRAM_API: http://127.0.0.1:9
steps:
  - serve:
      stub: telegram
      as: tg
  - name: secret.env holds the token among other lines
    file:
      path: secret.env
      content: |
        # host secrets (bench fixture)
        SONAR_TOKEN=bench-fixture-other-value # a key the caller never asked for
        export TELEGRAM_BOT_TOKEN="${tg.token}"
  - name: status reads the token from secret.env and prints no value
    env: &file
      STARCI_TELEGRAM_API: ${tg.url}
    starci: [connect, telegram, status]
    expect:
      contains: "\"source\": \"secret.env\""
      lacks: ${tg.token}
  - starci: [connect, telegram, status]
    env: *file
    expect:
      lacks: bench-fixture-other-value
  - http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: /start}
  - name: discover-chat reaches the bot with the file's token
    env: *file
    starci: [connect, telegram, discover-chat]
    expect:
      contains: "\"id\": \"7001\""
      lacks: ${tg.token}
  - name: the file now holds a wrong token
    file:
      path: secret.env
      content: |
        SONAR_TOKEN=bench-fixture-other-value
        TELEGRAM_BOT_TOKEN='bench-fixture-wrong-token'
  - name: the environment wins over the file
    env: &environment
      TELEGRAM_BOT_TOKEN: ${tg.token}
      STARCI_TELEGRAM_API: ${tg.url}
    starci: [connect, telegram, status]
    expect:
      contains: "\"source\": \"environment\""
      lacks: ${tg.token}
  - http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: /start}
  - env: *environment
    starci: [connect, telegram, discover-chat]
    expect:
      contains: "\"id\": \"7001\""
      lacks: bench-fixture-wrong-token
  - name: with the environment empty the file's wrong token is what reaches the bot, and it is never printed
    env: *file
    starci: [connect, telegram, discover-chat]
    expect:
      exit: 1
      code: TELEGRAM_TOKEN_REJECTED
      lacks: bench-fixture-wrong-token
  - name: a copy of ops/ whose token key the policy does not list
    write: { path: ops, from: "${ops}" }
  - write:
      path: ops/telegram.yaml
      content: |
        schema: starci/telegram@1
        tokenVariable: SONAR_TOKEN
        apiBase: https://api.telegram.org
        pollSeconds: 25
        requestTimeoutSeconds: 40
        staleSeconds: 120
        sendPerMinute: 6
        sendTries: 3
        questionChars: 700
        ticketOccurrences: 5
        banner: telegram/ticket-banner.png
        commitUrl: https://github.com/starci183/starci-harness/commit/{sha}
        muteMinutes: 60
  - name: an unlisted key is refused and its value never read out
    env:
      STARCI_OPS_DIR: ${repo}/ops
      STARCI_TELEGRAM_API: ${tg.url}
    starci: [connect, telegram, status]
    expect:
      exit: 1
      code: SECRET_KEY_UNLISTED
      lacks: bench-fixture-other-value
  - env:
      STARCI_OPS_DIR: ${repo}/ops
      STARCI_TELEGRAM_API: ${tg.url}
    starci: [connect, telegram, discover-chat]
    expect:
      exit: 1
      code: SECRET_KEY_UNLISTED
  - name: the chat got the two greetings and nothing else
    http:
      url: ${tg.url}/__sent
      expect:
        equals:
          data.count: 2
