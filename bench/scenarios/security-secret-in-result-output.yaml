schema: starci/scenario@1
id: security-secret-in-result-output
group: security
title: a worker puts a credential into its result output
inject: task result output json carrying a provider-shaped key
expect: task result refuses (secret scan of the output) so the ledger never stores it
pass:
  - no results row containing it
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: S5 verification trust tiers
manual:
  - write output with a generated key
  - task result
  - assert refused
