schema: starci/scenario@1
id: conflict-scope-blocked
group: conflict
title: a worker needing a path outside its scope files blocked, never widens
inject: "the worker files blocked: it needs src/shared.js outside allowPaths"
expect: the task is returned with the question and keeps its lease until the Kernel decides; the workflow blocks; nothing committed
pass:
  - workflow blocked
  - the task is reported with result blocked, its lease held
  - no task commit
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: scope
        goal: bench workflow scope
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - scope
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      status: blocked
      output:
        summary: needs src/shared.js, outside allowPaths
        files: []
        rulesApplied: []
  - name: step
    starci:
      - workflow
      - step
      - scope
    save: {}
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows
        equals:
          - blocked
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - reported
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 0
