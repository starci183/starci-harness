schema: starci/scenario@1
id: verify-only-task-settles-on-observed-evidence
group: verify
title: a task whose audit finds nothing to change settles green on the checks over its allowPaths, with no commit
inject: "three tasks change nothing: one over a clean file, one over a file the lint flags, one whose allowPaths hold no tracked file"
expect: >-
  the scoped check of a candidate that changes nothing runs over the tracked files under the task's allowPaths: the clean
  file lints green and the task settles done with no commit, the flagged file lints red naming the rule, and allowPaths
  that hold no tracked file leave no step to run, which stays red; in the wave tier the three checks run in the workflow's one
  wave once the last task landed, each over its own task's allowPaths, and return the two red tasks
pass:
  - the clean task is done with no settle commit and no Starci-Task commit; its check-run-green ran a lint step over src/ok.ts
  - the flagged task's check-run-green is red and names R321
  - the empty task's check-run-green is red with no step ran
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
# The package's eslint is a stand-in committed with the scratch repository: it flags a file holding GRAMMAR_SHIM as the
# canon's R321 does, so the scenario observes which files the scoped check linted without installing ESLint. The scratch
# commit is dated in the past: the allowPaths are in it, and `lands` dates foreign commits to the second.
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    README.md: "# bench scratch repository\n"
    package.json: '{"name": "bench-app", "version": "1.0.0"}'
    eslint.config.js: "module.exports = []\n"
    tsconfig.json: '{"compilerOptions": {}}'
    node_modules/typescript/bin/tsc: "process.exit(0)\n"
    src/ok.ts: "export const ok = 1\n"
    src/shim.ts: "export const shim = 1 // GRAMMAR_SHIM\n"
    node_modules/eslint/bin/eslint.js: |
      const { readFileSync } = require("node:fs")
      const files = process.argv.slice(2).filter((arg) => !arg.startsWith("--"))
      const flagged = files.filter((file) => readFileSync(file, "utf8").includes("GRAMMAR_SHIM"))
      for (const file of flagged) console.log(`${file}: R321 FE_GRAMMAR_SHIM an app re-exports a Grammar component`)
      console.log(`linted ${files.join(" ")}`)
      process.exit(flagged.length === 0 ? 0 : 1)
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: audit
        goal: no app module re-exports a Grammar component
        runner: inline
        tasks:
          - id: clean
            label: docs
            summary: prove src/ok.ts re-exports no Grammar component
            allowPaths: [src/ok.ts]
            checks: [check-run-green]
          - id: empty
            label: docs
            summary: prove a path that holds no tracked file
            allowPaths: [notes/none.md]
            checks: [check-run-green]
          - id: flagged
            label: docs
            summary: prove src/shim.ts re-exports no Grammar component
            allowPaths: [src/shim.ts]
            checks: [check-run-green]
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, audit]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'clean'"
      as: clean
  - name: the clean audit finds nothing to change
    worker:
      task: ${clean}
  - name: step verifies it
    starci: [workflow, step, audit]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'empty'"
      as: empty
  - name: the empty audit finds nothing to change
    worker:
      task: ${empty}
  - name: step settles it on its cheap checks; its check-run-green waits for the wave, and the independent flagged task is dispatched
    starci: [workflow, step, audit]
    expect:
      exit: 0
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'flagged'"
      as: flagged
  - name: the flagged audit finds nothing to change either
    worker:
      task: ${flagged}
  - name: step verifies it red
    starci: [workflow, step, audit]
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT plan_key || ':' || status || ':' || COALESCE(settle_commit, 'none') FROM tasks WHERE plan_key = 'clean'"
        equals: ["clean:done:none"]
  - assert:
      gitLog:
        grep: "Starci-Task: ${clean}"
        count: 0
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'tracked file(s) under allowPaths') > 0) || ':' || (instr(detail, 'green lint') > 0) FROM check_runs WHERE task_id = '${clean}' AND name = 'check-run-green' ORDER BY ran_at DESC LIMIT 1"
        equals: ["green:1:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'R321') > 0) FROM check_runs WHERE task_id = '${flagged}' AND name = 'check-run-green' ORDER BY ran_at DESC LIMIT 1"
        equals: ["red:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'no step ran') > 0) FROM check_runs WHERE task_id = '${empty}' AND name = 'check-run-green' ORDER BY ran_at DESC LIMIT 1"
        equals: ["red:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE plan_key IN ('flagged', 'empty') AND status = 'done'"
        equals: [0]
