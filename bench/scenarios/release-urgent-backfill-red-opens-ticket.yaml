schema: starci/scenario@1
id: release-urgent-backfill-red-opens-ticket
group: release
title: "a red back-fill opens one blocking verify ticket and leaves the urgent release, the remote and prod as they are"
inject: "an urgent release whose build gate (not one of the fast checks) is red; its back-fill runs the full gate"
expect: >-
  the urgent push passes on its fast checks; the back-fill runs the full gate, goes red at build, writes no L4 record, records the
  red verdict and its ticket on the urgent record and opens one blocking ticket of kind verify in the host queue; nothing is pushed
pass:
  - the urgent push exits 0 although build is red
  - the back-fill exits 1 and names the fix ticket
  - one verify ticket with code RELEASE_BACKFILL_RED is open, blocking
  - no L4 record exists and the urgent record says red
  - the remote holds the same one commit
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    package.json: '{"name": "bench-backfill-red", "version": "1.0.0", "private": true}'
    ok.mjs: "process.exit(0)\n"
    fail.mjs: "process.stderr.write('build is red on purpose\\n'); process.exit(1)\n"
    .starcistacks/application-stacks.yaml: |
      schema: starci/application-stacks@1
      release:
        gates:
          - {name: app-check, command: [node, ok.mjs]}
          - {name: typecheck, command: [node, ok.mjs]}
          - {name: lint, command: [node, ok.mjs]}
          - {name: test, command: [node, ok.mjs]}
          - {name: build, command: [node, fail.mjs]}
      services:
        audit: {mode: disabled}
steps:
  - git: [init, -q, --bare, -b, main, "${run}/remote.git"]
  - git: [remote, add, origin, "${run}/remote.git"]
  - name: the urgent release ships on its fast checks
    starci: [app, release, push, --urgent, --reason, "customer outage", --execute]
    expect: { exit: 0, contains: '"pushed": true' }
    save:
      head: data.output.head
  - name: the back-fill is red at build and opens a fix ticket
    starci: [app, release, gate, --backfill, v1.0.0, --execute]
    expect: { exit: 1, contains: '"ticket": "tk-' }
  - assert:
      sql:
        db: machine
        query: "SELECT kind || ' ' || severity || ' ' || state FROM tickets WHERE title LIKE 'RELEASE_BACKFILL_RED%'"
        equals: ["verify blocking open"]
  - assert:
      exists: { path: ".git/starci-release/${head}.l4.json", present: false }
  - assert:
      exists: { path: ".git/starci-release/${head}.urgent.json", present: true, contains: '"state": "red"' }
  - assert:
      gitLog: { grep: "bench: scratch repository", count: 1, in: "${run}/remote.git", ref: main }
