schema: starci/scenario@1
id: wave-scope-landed-union
group: verify
title: "a wave's scoped lint judges exactly the union of what its tasks landed, never another commit inside base..head"
inject: "between two tasks of an inline workflow, a commit no task made lands a file with a lint error on the workflow's branch"
expect: >-
  the wave's diff base..head holds the foreign file too, but its scoped check runs with --within over the files the two tasks
  landed, so it judges exactly those two files: the wave is green, both tasks done, and the foreign file is neither linted nor
  blamed on a task
pass:
  - the wave is green and both tasks are done
  - each task's check-run-green row judged 2 changed file(s), the landed union
  - the wave's scope decision names the landed files the check ran over
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    package.json: '{"name": "bench-wave", "version": "1.0.0", "private": true}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "core"}}}'
    tsconfig.json: '{"compilerOptions": {"strict": true}, "include": ["src"]}'
    eslint.config.js: "module.exports = []\n"
    src/index.ts: "export const index = 1\n"
    node_modules/typescript/bin/tsc: "process.exit(0)\n"
    node_modules/eslint/bin/eslint.js: |
      const { readFileSync } = require("node:fs")
      const { resolve } = require("node:path")
      const bad = process.argv.slice(2).filter((a) => !a.startsWith("--") && readFileSync(a, "utf8").includes("LINT_ERROR"))
      for (const f of bad) console.log(resolve(f) + ": error LINT_ERROR bench/no-error")
      process.exit(bad.length === 0 ? 0 : 1)
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: wave
        goal: two independent changes with a foreign commit between them
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: add module a
            allowPaths: [src/a.ts]
            checks: [check-run-green]
          - id: b
            label: docs
            summary: add module b
            allowPaths: [src/b.ts]
            checks: [check-run-green]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, wave]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      files:
        src/a.ts: "export const a = 1\n"
  - name: step verifies a and dispatches b, no wave yet
    starci: [workflow, step, wave]
    save:
      b: data.nodes.1.task.id
  - name: a commit no task made lands a lint error on the branch the inline workflow lands on
    write:
      path: src/foreign.ts
      content: "export const foreign = 1 // LINT_ERROR\n"
  - git: [add, src/foreign.ts]
  - git: [commit, -q, -m, "foreign: a commit no task made"]
  - worker:
      task: ${b}
      files:
        src/b.ts: "export const b = 1\n"
  - name: step verifies b, then the wave runs over the landed union only
    starci: [workflow, step, wave]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks ORDER BY created_at"
        equals: [done, done]
  - assert:
      sql:
        db: ledger
        query: "SELECT instr(detail, '2 changed file(s)') > 0 FROM check_runs WHERE name = 'check-run-green' AND runner = 'harness' ORDER BY task_id"
        equals: [1, 1]
  - assert:
      sql:
        db: ledger
        query: "SELECT verdict FROM (SELECT json_extract(data_json, '$.verdict') AS verdict FROM events WHERE kind = 'wave-verified')"
        equals: [green]
