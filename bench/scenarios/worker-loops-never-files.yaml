schema: starci/scenario@1
id: worker-loops-never-files
group: worker
title: an Op loops and never files a result
inject: the worker prints forever and never calls task result
expect: "budget minutes and liveness fence it: timeout, preserved, the Kernel decides; never an infinite wait"
pass:
  - task failed timeout within budget.minutes
  - worker-stop called
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: "S3 state CAS fixes: intent rows (settling, cancelling), basedOn/cmdId dedupe, recovery that reconciles"
manual:
  - stand-in worker running with fresh output
  - backdate attempt past budget.minutes
  - step
  - assert timeout
