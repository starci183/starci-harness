schema: starci/scenario@1
id: flow-replan-reads-branch-records
group: plan
title: "orca: a replan asked from the main checkout judges the lanes on the workflow branch's head, where its Work records are written"
inject: >-
  workflow lessons writes a business record on its own branch alone (main has no .starciwork/features/lessons), then a change
  that adds a review task over that record is amended from the main checkout, as the Supervisor's submit and the shared-need
  tender do
expect: >-
  the amend judges the record's decide step satisfied (record-exists) in the workflow's worktree, as workflow status reads it,
  and records graph v2; it is never refused FLOW_INCOMPLETE for a record main does not hold
pass:
  - the record is absent on main and present on the workflow's branch
  - the amend from the main checkout records graph v2 with the review task
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
steps:
  - file:
      path: lessons.yaml
      yaml:
        schema: starci/workflow@1
        id: lessons
        goal: the lesson notes and their business record
        runner: orca
        maxParallel: 1
        tasks:
          - id: notes
            label: docs
            summary: write the lesson notes
            allowPaths: [docs/notes.md]
            checks:
              - preset: files-exist
                args: {files: [docs/notes.md]}
  - boot:
      file: ${run}/lessons.yaml
      workflow: lessons
  - name: the business record is written on the workflow's branch alone
    file:
      path: ${worktree.lessons}/.starciwork/features/lessons/br/intro/index.yaml
      content: |
        schema: work/business-rule@1
        id: br.lessons.intro
        title: a lesson opens with its intro
  - git: [-C, "${worktree.lessons}", add, -A]
  - git: [-C, "${worktree.lessons}", commit, -q, -m, "lessons: the intro record"]
  - assert:
      exists: { path: .starciwork/features/lessons/br/intro/index.yaml, present: false }
  - assert:
      exists: { path: "${worktree.lessons}/.starciwork/features/lessons/br/intro/index.yaml", present: true }
  - file:
      path: review.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: lessons
        reason: review the intro rule
        changes:
          - op: add
            task:
              id: review-intro
              label: review
              summary: review the lesson intro against its business rule
              dependsOn: [notes]
              allowPaths: [docs/reviews/intro.md]
              context: [.starciwork/features/lessons/br/intro/index.yaml]
              inputs: {since: HEAD}
  - name: the amend from the main checkout judges the record on the branch's head
    starci: [workflow, amend, lessons, --change, "${run}/review.yaml"]
  - assert:
      sql:
        db: ledger
        query: "SELECT w.graph_version || ':' || (SELECT COUNT(*) FROM plan_nodes p WHERE p.workflow_id = 'lessons' AND p.graph_version = w.graph_version AND p.plan_key = 'review-intro') FROM workflows w WHERE id = 'lessons'"
        equals: ["2:1"]
