schema: starci/scenario@1
id: change-retry-beside-done-node-over-budget
group: change
title: "a workflow change is judged on the contracts it adds or edits: a done node whose context grew past its op's budget never blocks a retry"
inject: >-
  a copy of ops/ whose docs op has a 150-token context budget; tasks a and b are defined and done under it, then the harness
  file every docs task reads grows past the budget, and the Kernel retries b
expect: >-
  the retry of b is applied: a (done) and b (retried, its contract unchanged) are history, so their context is not measured
  again; an edit that adds a docs task is still measured and refused WORKFLOW_INVALID for its budget
pass:
  - the retry is applied and b runs a second try
  - a's done task is kept
  - a change adding a docs task is refused for its own context budget, naming that task only
  - no human intervention beyond the injected fault
automation: automated
env:
  STARCI_OPS_DIR: ${repo}/ops
steps:
  - name: copy ops/ into the scratch repository
    write: { path: ops, from: "${ops}" }
  - name: the docs op caps its context at 150 tokens
    write:
      path: ops/ops/docs.md
      content: |
        ---
        schema: starci/op@1
        summary: documentation and product content
        floor: easy
        hostTools: [git]
        context:
          base:
            - harness:contexts/project/work.md
          budget: 150
        input:
          base: {}
        output:
          base:
            summary: {type: string, summary: "what you wrote or changed"}
            files: {type: "string[]", summary: "the documents you changed"}
            rulesApplied: {type: "string[]", minItems: 0, cites: context, summary: "the ids of the writing or record rules you applied"}
            workRecords: {type: "string[]", minItems: 1, cites: work, when: work, summary: "the ids of the Work records you wrote or changed"}
        checks:
          base: [paths-only, rules-cited]
          behavioural: false
        ---
        Write present-tense prose that states what is true now.
  - name: the harness file every docs task reads, about 100 tokens
    write:
      path: contexts/project/work.md
      content: |
        # Work

        A Work record is the product's own description of one feature, kept beside the code it describes. It names
        the screens, the rules and the acceptance a task proves. Read it before you write the document it asks for.
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: ops copy with a docs budget"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: grow
        goal: two docs
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args: {files: [docs/a.md]}
          - id: b
            label: docs
            summary: write doc b
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args: {files: [docs/b.md]}
            dependsOn: [a]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, grow]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      status: done
      files:
        docs/a.md: "# a\n"
  - starci: [workflow, step, grow]
    save:
      b: data.nodes.1.task.id
  - worker:
      task: ${b}
      status: done
      files:
        docs/b.md: "# b\n"
  - starci: [workflow, step, grow]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE status = 'done'"
        equals: [2]
  - name: the harness file grows past the docs budget (about 200 tokens)
    write:
      path: contexts/project/work.md
      content: |
        # Work

        A Work record is the product's own description of one feature, kept beside the code it describes. It names
        the screens, the rules and the acceptance a task proves. Read it before you write the document it asks for.

        A record grows with its feature: every screen it adds names its states, every rule it adds names the check
        that holds it, and every acceptance names the walk that proves it. A task reads the record it is over and
        no other, and writes only the files its contract allows. This paragraph makes the file heavier than before.

        A record that changes after a task landed does not reopen the task: the task proved the record as it stood,
        and the Kernel decides whether the change needs new work. This last paragraph takes the file past the budget.
  - git: [commit, -q, -a, -m, "bench: the docs context grows"]
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: grow
        reason: retry b
        changes:
          - op: retry
            id: b
  - name: the retry of b is applied beside a done node now over budget
    starci: [workflow, amend, grow, --change, "${run}/retry.yaml"]
    expect:
      exit: 0
      lacks: over the docs op's budget
  - starci: [workflow, step, grow]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE plan_key = 'b'"
        equals: [2]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${a}'"
        equals: [done]
  - file:
      path: add.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: grow
        reason: add doc c
        changes:
          - op: add
            task:
              id: c
              label: docs
              summary: write doc c
              allowPaths: [docs/c.md]
              checks:
                - preset: files-exist
                  args: {files: [docs/c.md]}
  - name: a task the change adds is measured against the context as it is now
    starci: [workflow, amend, grow, --change, "${run}/add.yaml"]
    expect:
      exit: 1
      code: WORKFLOW_INVALID
      contains: "task c: the context is about"
      lacks: "task a:"
