schema: starci/scenario@1
id: budget-over-fenced
group: budget
title: "an Op past its budget that never files is fenced after the grace: work preserved, try spent"
inject: >-
  the Op's attempt started two hours ago against a 60 minute budget, has written docs/a.md and keeps running with no result;
  a supervisor tick asks it to wrap up, the grace then passes with no result, and the next tick runs
expect: >-
  the first tick asks once (budget-nudged); the second fences the attempt: its worker stopped and released through the seat
  lifecycle, docs/a.md preserved in the project's preserved folder and reset in the worktree, the task failed with attempt
  outcome over-budget (a spent try), holding no intent
pass:
  - one budget ask, then worker-stop of the Op's dispatch
  - the task is failed, its attempt over-budget, and it holds no intent
  - the dirty file is preserved outside the worktree and gone from it
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: fence
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: fence
  - name: kernel next dispatches the Op
    seat: kernel:fence
    starci: [kernel, next, fence, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: task
  - name: the Op writes without filing
    file:
      path: ${project}/worktrees/fence.ops/${task}/docs/a.md
      content: "# half done\n"
  - name: the attempt has run two hours against its 60 minute budget
    sql:
      db: ledger
      exec: UPDATE attempts SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-120 minutes')
  - name: the tick asks it to wrap up
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'budget-nudged' AND subject = '${task}'"
        equals: [1]
  - name: the grace passes with no result
    sql:
      db: ledger
      exec: UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-30 minutes') WHERE kind = 'budget-nudged'
  - name: the next tick fences it
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks WHERE id = '${task}'
        equals: [failed]
  - assert:
      sql:
        db: ledger
        query: SELECT outcome FROM attempts WHERE task_id = '${task}'
        equals: [over-budget]
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks WHERE id = '${task}' AND intent IS NOT NULL
        equals: [0]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind IN ('task-over-budget', 'task-preserved') AND subject = '${task}'"
        equals: [2]
  - assert:
      orcaCalls:
        command: worker-stop
        min: 1
  - assert:
      exists:
        path: ${project}/preserved/${task}/untracked/docs/a.md
        present: true
  - assert:
      exists:
        path: ${project}/worktrees/fence.ops/${task}/docs/a.md
        present: false
