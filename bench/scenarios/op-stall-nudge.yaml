schema: starci/scenario@1
id: op-stall-nudge
group: orca
title: "an Op stops at its prompt with its task unfiled: its Kernel's driver nudges it once, and the nudge restarts it"
inject: >-
  the Op's agent sits idle at its prompt (tui-idle) ten minutes after its launch with no result filed; the Kernel runs kernel
  next
expect: >-
  kernel next nudges the Op once with its loop prompt (terminal send to the Op's terminal, a stall-nudged event); a second kernel
  next inside the grace sends nothing; the Op then files its result and the task settles done, with no fence and no second launch
pass:
  - exactly one nudge, typed into the Op's terminal
  - the task settles done after the nudge, launched once and never fenced
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: nudge
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: nudge
  - name: kernel next dispatches the Op
    seat: kernel:nudge
    starci: [kernel, next, nudge, --wait, "0"]
  - read:
      db: ledger
      query: SELECT terminal FROM seats WHERE role = 'worker'
      as: op.terminal
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: task
  - name: the Op sits at its prompt, ten minutes after its launch
    orca:
      set:
        tuiIdle:
          ${op.terminal}: true
  - sql:
      db: ledger
      exec: UPDATE seats SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-10 minutes') WHERE role = 'worker'
  - name: the Kernel's driver nudges it
    seat: kernel:nudge
    starci: [kernel, next, nudge, --wait, "0"]
  - name: a second pass inside the grace sends nothing
    seat: kernel:nudge
    starci: [kernel, next, nudge, --wait, "0"]
  - assert:
      orcaCalls:
        command: terminal send
        match:
          terminal: ${op.terminal}
        count: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'stall-nudged' AND subject = '${task}'"
        equals: [1]
  - name: the nudged Op finishes and files
    worker:
      task: ${task}
      files:
        docs/a.md: "# a\n"
  - seat: kernel:nudge
    starci: [kernel, next, nudge, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals: [done]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind IN ('task-stalled', 'stall-gave-up')"
        equals: [0]
