schema: starci/scenario@1
id: cited-rules-by-paths
group: verify
title: a task is briefed with the rule pages of its paths, and a rule from a page it was not handed names that page
inject: >-
  a back-end code task writes the CLI feature aggregate and the cli app root, its contract naming no CLI topic; one worker
  cites the CLI and architecture rules it applied, another task on the same paths also cites a webhook rule
expect: >-
  the brief lists contexts/code/be/cli.md and architecture.md as rule pages of the paths, and none of the webhook page;
  rules-cited is green for the CLI and architecture ids, read from those pages; for the webhook id it is red naming
  contexts/code/be/webhooks.md as the owner the brief did not include
pass:
  - the rule pages of the paths hold cli.md and architecture.md (cited green from them) and not webhooks.md (named as not included)
  - rules-cited green on the first task, citing BE-CLI-2 from cli.md
  - rules-cited red on the second task naming BE-WEBHOOK-1 as owned by contexts/code/be/webhooks.md, and BE-CLI-2 not at all
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf-green.yaml
      content: |
        schema: starci/workflow@1
        id: clipaths
        goal: register the lesson import command
        runner: inline
        tasks:
          - id: code
            label: code
            summary: add the lesson import command to the cli aggregate and register it in the cli app
            allowPaths: [be/src/features/cli/lessons, be/apps/cli/src]
            inputs: {side: be, edition: full}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
  - starci: [workflow, define, "${run}/wf-green.yaml"]
  - name: start the CLI task
    starci: [workflow, start, clipaths]
    save:
      green: data.nodes.0.task.id
  - name: the worker cites the CLI and architecture rules it applied
    worker:
      task: ${green}
      status: done
      files:
        be/src/features/cli/lessons/lessons.cli.ts: "export const lessons = 1\n"
      output:
        summary: the lesson import command
        files: [be/src/features/cli/lessons/lessons.cli.ts]
        rulesApplied: [BE-CLI-2, BE-CLI-3, BE-ARCHITECTURE-2]
        cites: [BE-CLI-2]
  # The scratch repository holds no package, so check-run-green is red and the task fails; this scenario judges rules-cited.
  - name: step verifies the task
    starci: [workflow, step, clipaths]
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (detail LIKE '%BE-CLI-2 in %be_cli.md%') || ':' || (detail LIKE '%BE-ARCHITECTURE-2 in %be_architecture.md%') FROM check_runs WHERE name = 'rules-cited' AND task_id = '${green}' AND runner = 'harness' AND attempt_id IS NOT NULL"
        equals:
          - "green:1:1"
  - file:
      path: wf-red.yaml
      content: |
        schema: starci/workflow@1
        id: webhookcite
        goal: register the lesson import command
        runner: inline
        tasks:
          - id: code
            label: code
            summary: add the lesson import command to the cli aggregate
            allowPaths: [be/src/features/cli/imports]
            inputs: {side: be, edition: full}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
  - starci: [workflow, define, "${run}/wf-red.yaml"]
  - name: start the task that cites a rule of an unrelated page
    starci: [workflow, start, webhookcite]
    save:
      red: data.nodes.0.task.id
  - name: the worker also cites a webhook rule
    worker:
      task: ${red}
      status: done
      files:
        be/src/features/cli/imports/imports.cli.ts: "export const imports = 1\n"
      output:
        summary: the import command
        files: [be/src/features/cli/imports/imports.cli.ts]
        rulesApplied: [BE-CLI-2, BE-WEBHOOK-1]
        cites: [BE-CLI-2]
  - starci: [workflow, step, webhookcite]
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (detail LIKE '%BE-WEBHOOK-1 is owned by contexts/code/be/webhooks.md, which the brief did not include%') || ':' || (detail LIKE '%BE-CLI-2%') FROM check_runs WHERE name = 'rules-cited' AND task_id = '${red}' AND runner = 'harness' AND attempt_id IS NOT NULL"
        equals:
          - "red:1:0"
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${red}'"
        equals:
          - failed
