schema: starci/scenario@1
id: crash-kernel-during-replan
group: crash
title: the CLI dies halfway through applying a replan
inject: workflow amend killed after writing graph v2 nodes and before cancelling dropped tasks
expect: "the replan is one transaction under basedOn: either v2 exists whole with its intents, or nothing changed; recovery completes the cancelling intents"
pass:
  - graph_versions and tasks agree
  - no live task of a dropped node without a cancelling intent
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: "S1 replan reconcile: goal@n, goal-change, desired-graph reconcile with keep/continue/stale/rework/redo-live/drop"
manual:
  - amend dropping a running node
  - inject a kill after the graph write
  - step
  - assert the dropped node's task cancelled exactly once and preserved
