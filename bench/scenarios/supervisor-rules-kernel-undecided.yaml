schema: starci/scenario@1
id: supervisor-rules-kernel-undecided
group: orca
title: "a decision the Kernel leaves undecided past the threshold is ruled by the Supervisor in its place; only an owner topic becomes a ticket"
inject: >-
  the workflow's task fails and its Kernel, alive, never answers the red decision for forty-five minutes; the Supervisor tries a
  ruling outside its vocabulary and an escalation it should rule itself, then retries the task by its route; the retried task
  fails again, the Kernel again leaves it, and the Supervisor rules that one an owner question
expect: >-
  the tick hands the decision to the Supervisor as a kernel-undecided decision carrying the red decision and the task's evidence;
  supervisor next returns it; a workflow-change answering no kernel-undecided is refused COMMAND_NOT_YOURS and a budget
  escalation RULING_WITHIN_AUTHORITY; the Supervisor's workflow-change on the red route is applied as the Kernel's would be,
  answers the red decision and the kernel-undecided, is recorded ruled-by-supervisor, and the Kernel's next turn tells it once;
  no ticket is opened for it; the second ruling, an owner escalation on a product topic with no default, becomes one
  question:business ticket and no harness-defect, and the held task is not handed again while that escalation is open
pass:
  - the undecided red decision is handed to the Supervisor as kernel-undecided and returned by supervisor next
  - a ruling outside the Supervisor's vocabulary or authority is refused
  - the Supervisor's retry answers the red decision, is recorded ruled-by-supervisor, and opens no ticket
  - the Kernel is told the ruling once on its next turn
  - an owner-topic ruling becomes one question ticket and no harness-defect ticket
  - "no step without evidence: every state change in the ledger has its event"
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: rule
        goal: bench workflow rule
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: rule
  - seat: kernel:rule
    starci: [kernel, next, rule, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: a
  - name: the worker files done without the file its check requires
    worker:
      task: ${a}
      files: {}
      output:
        summary: wrote nothing
        files: []
        rulesApplied: []
  - name: kernel next verifies it red and returns the red decision, which the Kernel never answers
    seat: kernel:rule
    starci: [kernel, next, rule, --wait, "0"]
    expect:
      contains: '"kind": "red"'
    save:
      red: data.decision.id
      graph: data.digest.graphVersion
  - &stall
    name: forty-six minutes pass with nothing decided
    sql:
      db: ledger
      exec: >-
        UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-46 minutes');
        UPDATE decisions SET raised_at = strftime('%Y-%m-%dT%H:%M:%fZ', raised_at, '-46 minutes'), answered_at = CASE WHEN answered_at IS NULL THEN NULL ELSE strftime('%Y-%m-%dT%H:%M:%fZ', answered_at, '-46 minutes') END;
        UPDATE tasks SET updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', updated_at, '-46 minutes'), created_at = strftime('%Y-%m-%dT%H:%M:%fZ', created_at, '-46 minutes');
        UPDATE seats SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', started_at, '-46 minutes')
  - name: the tick hands the red decision to the Supervisor to rule
    starci: [supervisor, tick]
    expect:
      contains: "handed to the Supervisor to rule"
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND kind = 'kernel-undecided' AND json_extract(evidence_json, '$.decision.id') = '${red}' AND json_extract(evidence_json, '$.decision.kind') = 'red' AND json_extract(evidence_json, '$.decision.evidence.routes[0].id') = 'rejected-retries' AND json_extract(evidence_json, '$.task.id') = '${a}' AND json_extract(evidence_json, '$.task.redChecks[0].name') IS NOT NULL"
        equals: [1]
  - name: supervisor next returns it as kernel-undecided with its evidence
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: kernel-undecided
    save:
      undecided: data.decision.id
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: rule
        changes:
          - op: retry
            id: a
  - file:
      path: stray.yaml
      content: |
        schema: starci/command@1
        cmdId: s-rule-stray-1
        kind: workflow-change
        workflow: rule
        basedOn: {graph: ${graph}}
        route: rejected-retries
        change: retry.yaml
  - name: a workflow-change that rules no kernel-undecided decision is the Kernel's
    seat: supervisor
    starci: [supervisor, submit, "${run}/stray.yaml"]
    expect:
      exit: 1
      code: COMMAND_NOT_YOURS
  - file:
      path: budget.yaml
      content: |
        schema: starci/command@1
        cmdId: s-rule-budget-1
        kind: escalation
        workflow: rule
        basedOn: {graph: ${graph}}
        answers: [${undecided}]
        escalation:
          kind: budget
          question: may task a take another try?
  - name: a budget escalation is the Supervisor's own to rule
    seat: supervisor
    starci: [supervisor, submit, "${run}/budget.yaml"]
    expect:
      exit: 1
      code: RULING_WITHIN_AUTHORITY
  - file:
      path: rule.yaml
      content: |
        schema: starci/command@1
        cmdId: s-rule-retry-1
        kind: workflow-change
        workflow: rule
        basedOn: {graph: ${graph}}
        answers: [${undecided}]
        route: rejected-retries
        change: retry.yaml
        note: the check holds; task a writes docs/a.md on its retry
  - name: the Supervisor rules the red decision in the Kernel's place by its route
    seat: supervisor
    starci: [supervisor, submit, "${run}/rule.yaml"]
  - assert:
      sql:
        db: ledger
        query: "SELECT answered_by FROM decisions WHERE id IN ('${red}', '${undecided}') ORDER BY id"
        equals: [s-rule-retry-1, s-rule-retry-1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'ruled-by-supervisor' AND json_extract(data_json, '$.cmdId') = 's-rule-retry-1' AND json_extract(data_json, '$.kernelDecisions[0]') = '${red}'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT scope || ' ' || kind || ' ' || status FROM commands WHERE cmd_id = 's-rule-retry-1'"
        equals: [supervisor workflow-change applied]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM tickets"
        equals: [0]
  - name: the Kernel is told the ruling on its next turn
    seat: kernel:rule
    starci: [kernel, next, rule, --wait, "0"]
    expect:
      contains: "the check holds; task a writes docs/a.md on its retry"
  - name: and only once
    seat: kernel:rule
    starci: [kernel, next, rule, --wait, "0"]
    expect:
      lacks: "the check holds; task a writes docs/a.md on its retry"
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'supervisor-ruling-told'"
        equals: [1]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE id <> '${a}' ORDER BY created_at DESC LIMIT 1"
      as: a2
  - name: the retried task fails the same way
    worker:
      task: ${a2}
      files: {}
      output:
        summary: wrote nothing again
        files: []
        rulesApplied: []
  - seat: kernel:rule
    starci: [kernel, next, rule, --wait, "0"]
    expect:
      contains: '"kind": "red"'
    save:
      red2: data.decision.id
      graph2: data.digest.graphVersion
  - *stall
  - name: the tick hands the second red decision to the Supervisor
    starci: [supervisor, tick]
    expect:
      contains: "handed to the Supervisor to rule"
  - seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: kernel-undecided
    save:
      undecided2: data.decision.id
  - file:
      path: owner.yaml
      content: |
        schema: starci/command@1
        cmdId: s-rule-owner-1
        kind: escalation
        workflow: rule
        basedOn: {graph: ${graph2}}
        answers: [${undecided2}]
        escalation:
          kind: owner
          topic: product
          question: doc a fails its check twice; should doc a exist at all?
  - name: an owner question is not the Supervisor's to rule, so it escalates
    seat: supervisor
    starci: [supervisor, submit, "${run}/owner.yaml"]
  - name: the tick files the owner question as its ticket
    starci: [supervisor, tick]
  - assert:
      sql:
        db: machine
        query: "SELECT kind FROM tickets"
        equals: ["question:business"]
  - assert:
      sql:
        db: ledger
        query: "SELECT answered_by FROM decisions WHERE id = '${red2}'"
        equals: [s-rule-owner-1]
  - *stall
  - name: while the owner question is open, the held task is not handed again
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE kind = 'kernel-undecided'"
        equals: [2]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'kernel-relaunched'"
        equals: [0]
