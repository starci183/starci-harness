schema: starci/scenario@1
id: check-run-workspace-dep-built
group: verify
title: check run builds a workspace dependency that exports only its untracked dist before judging its consumer, and the next run restores it from the cache
inject: "an npm workspace whose app imports a sibling package exporting only dist/, which git ignores, so a clean checkout lacks it"
expect: >-
  before the typecheck and lint of the app, check run finds that its workspace dependency's exports point at missing
  files, builds the dependency with its own build script and keeps the output under its content key; the app typechecks
  green against the built package; once the output is gone again the next run restores it from the cache instead of
  building; a task verified on a clean checkout of HEAD, where dist never exists, settles green the same way
pass:
  - check run is green, with a green dep-build step for the dependency naming the missing entries, built and cached
  - the dependency's dist exists after the run
  - after dist is removed, the next run is green and says the dependency was restored from the build cache
  - a task whose check-run-green runs on a clean checkout settles done, its kept detail naming the dep-build and the green typecheck
  - no human intervention beyond the injected fault
automation: automated
# bench/fixtures/workspace-dist-only: the monorepo, and the tsc stand-in that reports TS2307 for a file importing
# "@bench/ui" while packages/ui/dist/index.d.ts is missing, as tsc does for a package whose exports point at an unbuilt
# dist. The scratch commits are dated in the past: `lands` dates foreign commits to the second.
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
steps:
  - name: the fixture monorepo and its tool stand-ins are committed
    write: { path: ".", from: "${ops}/../bench/fixtures/workspace-dist-only/repo" }
  - write: { path: node_modules/typescript, from: "${ops}/../bench/fixtures/workspace-dist-only/stand-ins/typescript" }
  - write: { path: node_modules/eslint, from: "${ops}/../bench/fixtures/workspace-dist-only/stand-ins/eslint" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: the workspace fixture"]
  - name: the app changes while the dependency's dist does not exist
    write:
      path: apps/web/src/page.ts
      content: "import { greeting } from \"@bench/ui\"\nexport const page = greeting + \"!\"\n"
  - name: check run builds the dependency first and the app typechecks green
    starci: [check, run, --base, HEAD]
    expect:
      exit: 0
      contains: "dist/index.d.ts, dist/index.js missing; built and cached ("
  - assert:
      exists:
        path: packages/ui/dist/index.d.ts
        present: true
  - name: the build output is gone again
    remove: packages/ui/dist
  - name: the next run restores it from the cache instead of building
    starci: [check, run, --base, HEAD]
    expect:
      exit: 0
      contains: "dist/index.d.ts, dist/index.js missing; restored from the build cache ("
  - name: the change and the output are put back, so the workflow starts on a clean tree
    git: [checkout, --, apps/web/src/page.ts]
  - remove: packages/ui/dist
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: web
        goal: the web page greets loudly
        runner: inline
        tasks:
          - id: page
            label: docs
            summary: make the web page greet loudly
            allowPaths: [apps/web/src/page.ts]
            checks: [check-run-green]
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, web]
    save:
      page: data.nodes.0.task.id
  - name: the worker changes the page
    worker:
      task: ${page}
      files:
        apps/web/src/page.ts: "import { greeting } from \"@bench/ui\"\nexport const page = greeting + \"!\"\n"
  - name: step verifies it on a clean checkout, where dist never exists
    starci: [workflow, step, web]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${page}'"
        equals: [done]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'green dep-build @bench/ui') > 0) || ':' || (instr(detail, 'green typecheck @bench/web') > 0) FROM check_runs WHERE task_id = '${page}' AND name = 'check-run-green' ORDER BY id DESC LIMIT 1"
        equals: ["green:1:1"]
