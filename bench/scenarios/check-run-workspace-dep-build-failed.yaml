schema: starci/scenario@1
id: check-run-workspace-dep-build-failed
group: verify
title: a workspace dependency whose build fails is red with CHECK_WORKSPACE_DEP_BUILD_FAILED naming it, and its consumer's typecheck and lint are held instead of reporting a missing module
inject: "the workspace dependency's source breaks its build, in a change that also touches the app importing it"
expect: >-
  check run builds the dependency before the app's typecheck and lint; the build exits non-zero, so its dep-build step is
  red with CHECK_WORKSPACE_DEP_BUILD_FAILED naming the package and its folder, and carries the build's output; the app's
  typecheck and lint are skipped as held by that dependency rather than run into TS2307 and cascaded lint errors; the
  verdict is red; a dependency with no build script is red with the same code
pass:
  - check run exits 1 and its dep-build step names @bench/ui, packages/ui and the code
  - the step carries the build's own error line
  - the app's typecheck is held by the dependency and no TS2307 is reported
  - a dependency with no build script is red with the same code, naming it
  - no human intervention beyond the injected fault
automation: automated
# bench/fixtures/workspace-dist-only: the dependency's build script exits 1 when its source holds BUILD_ERROR.
steps:
  - name: the fixture monorepo and its tool stand-ins are committed
    write: { path: ".", from: "${ops}/../bench/fixtures/workspace-dist-only/repo" }
  - write: { path: node_modules/typescript, from: "${ops}/../bench/fixtures/workspace-dist-only/stand-ins/typescript" }
  - write: { path: node_modules/eslint, from: "${ops}/../bench/fixtures/workspace-dist-only/stand-ins/eslint" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: the workspace fixture"]
  - name: the dependency's source breaks its build and the app changes
    write:
      path: packages/ui/src/index.ts
      content: "export const greeting: number = \"BUILD_ERROR\"\n"
  - write:
      path: apps/web/src/page.ts
      content: "import { greeting } from \"@bench/ui\"\nexport const page = greeting + \"!\"\n"
  - name: the dep-build step is red with the code, naming the package and its folder
    starci: [check, run, --base, HEAD]
    expect:
      exit: 1
      contains: "CHECK_WORKSPACE_DEP_BUILD_FAILED: npm run build of @bench/ui in packages/ui exited 1"
  - name: the step carries the build's own output
    starci: [check, run, --base, HEAD]
    expect:
      exit: 1
      contains: "BUILD_ERROR breaks the ui build"
  - name: the app's typecheck is held by the dependency instead of reporting the module it lacks
    starci: [check, run, --base, HEAD]
    expect:
      exit: 1
      contains: "CHECK_WORKSPACE_DEP_BUILD_FAILED: held, its workspace dependency @bench/ui did not build"
  - assert:
      exists:
        path: packages/ui/dist
        present: false
  - name: the dependency loses its build script
    write:
      path: packages/ui/package.json
      content: '{"name": "@bench/ui", "version": "0.0.0", "private": true, "exports": {".": {"types": "./dist/index.d.ts", "default": "./dist/index.js"}}}'
  - starci: [check, run, --base, HEAD]
    expect:
      exit: 1
      contains: "CHECK_WORKSPACE_DEP_BUILD_FAILED: @bench/ui (packages/ui) has dist/index.d.ts, dist/index.js missing and no build script to make them"
