schema: starci/scenario@1
id: verify-skeleton-parity-pinned-hfs
group: verify
title: "a skeleton parity a contract spells against the CLI's own hfs judges the skeleton of the hfs the app pins: a copy of the pinned skeleton is green, a drift from it is red"
inject: >-
  the app pins @starci/hfs 4.9.3, whose be/skeleton platform/http lacks the trusted-CA configuration and http.config.ts the
  CLI's own hfs has since gained; two tasks carry the check a Kernel writes for a byte-identical copy,
  `git diff --no-index --exit-code <harness>/packages/hfs/templates/be/skeleton/src/modules/platform/http be/src/modules/platform/http`.
  The first writes the pinned skeleton's folder unchanged, the second the same folder with one export added to its index
expect: >-
  the command check reads the path it names inside the CLI's hfs in the app's pinned hfs (the exact published 4.9.3, unpacked
  into the state base's cache), never the CLI's copy: the first task's check is green and the task done, its detail naming the
  pinned version; the second's check is red on the drifted index and the task failed
pass:
  - the copy of the pinned skeleton is done, its parity check green and naming @starci/hfs 4.9.3
  - the drift from the pinned skeleton is failed, its parity check red naming index.ts
  - the pinned version is unpacked into the cache of the state base
  - no human intervention beyond the injected fault
automation: automated
# bench/fixtures/skeleton-pinned/http is be/skeleton/src/modules/platform/http of the published @starci/hfs 4.9.3. The pin is an
# exact devDependency with no lockfile, so the clean verify installs nothing and the resolver unpacks the published version.
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    package.json: '{"name": "bench-pinned", "version": "1.0.0", "private": true, "devDependencies": {"@starci/hfs": "4.9.3"}}'
steps:
  - name: boot the project's Supervisor, whose terminal launches the owner's tasks
    boot: {}
  - file:
      path: copy.json
      json:
        schema: starci/contract@2
        label: docs
        context: {revision: HEAD, allowPaths: [be/src/modules/platform/http]}
        input: {summary: "copy the skeleton's platform/http byte-identical"}
        budget: {minutes: 10, tries: 1}
        checks:
          extend:
            - check:
                kind: command
                run: [git, diff, --no-index, --exit-code, "${ops}/../packages/hfs/templates/be/skeleton/src/modules/platform/http", be/src/modules/platform/http]
  - seat: supervisor
    starci: [task, send, "${run}/copy.json", --launch, --agent, claude, --model, claude-sonnet-4-6]
    save:
      copy: data.task
  - name: the worker copies the pinned skeleton's folder
    write: { path: be/src/modules/platform/http, from: "${ops}/../bench/fixtures/skeleton-pinned/http" }
  - worker:
      task: ${copy}
      files: {}
  - starci: [task, verify, "${copy}"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${copy}'"
        equals: [done]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'pinned @starci/hfs 4.9.3') > 0) FROM check_runs WHERE task_id = '${copy}' AND name LIKE 'check-%:command'"
        equals: ["green:1"]
  - assert:
      exists:
        path: "${state}/cache/hfs/4.9.3/package/templates/be/skeleton/src/modules/platform/http/index.ts"
        present: true
  - file:
      path: drift.json
      json:
        schema: starci/contract@2
        label: docs
        context: {revision: HEAD, allowPaths: [be/src/modules/platform/http]}
        input: {summary: "export the http port from the skeleton's index"}
        budget: {minutes: 10, tries: 1}
        checks:
          extend:
            - check:
                kind: command
                run: [git, diff, --no-index, --exit-code, "${ops}/../packages/hfs/templates/be/skeleton/src/modules/platform/http", be/src/modules/platform/http]
  - seat: supervisor
    starci: [task, send, "${run}/drift.json", --launch, --agent, claude, --model, claude-sonnet-4-6]
    save:
      drift: data.task
  - name: the worker adds an export the pinned skeleton's index lacks
    worker:
      task: ${drift}
      files:
        be/src/modules/platform/http/index.ts: |
          export { HTTP_ERROR_KINDS } from "./errors/http.error"
          export { HTTP_MESSAGES } from "./messages/http.messages"
          export { HTTP_CLIENT, InjectHttpClient } from "./http.decorators"
          export { HttpModule } from "./http.module"
  - starci: [task, verify, "${drift}"]
    expect: {exit: 1}
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${drift}'"
        equals: [failed]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'index.ts') > 0) FROM check_runs WHERE task_id = '${drift}' AND name LIKE 'check-%:command'"
        equals: ["red:1"]
