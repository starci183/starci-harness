schema: starci/scenario@1
id: plan-self-overlap-conflict-returns
group: plan
title: "two independent tasks change the same line: the first lands, the second returns conflict with its work preserved"
inject: tasks a and b both rewrite the first line of docs/shared.md, no dependsOn, maxParallel 2
expect: >-
  both run at once in their own Op worktrees; the first to verify lands; the second does not rebase onto the new head, so no
  check runs on it: its work is preserved, its attempt ends conflict, the task fails without a red verdict, and the Kernel gets a
  conflict decision to amend on the new head; nothing resolves the conflict by itself, and both Op worktrees are removed
pass:
  - one task done, one failed with attempt outcome conflict and no verdict
  - one commit on the workflow branch, carrying the first task's line only
  - the second task's work preserved (its land-conflict event names the folder and the file)
  - a conflict decision is open for the second task
  - both Op worktrees removed
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: docs/shared.md
      content: "first\nlast\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: the shared doc"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: clash
        goal: bench workflow clash
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: rewrite the first line one way
            allowPaths:
              - docs/shared.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/shared.md
          - id: b
            label: docs
            summary: rewrite the first line another way
            allowPaths:
              - docs/shared.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/shared.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: clash
  - name: kernel next dispatches both
    seat: kernel:clash
    starci: [kernel, next, clash, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 2
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a'"
      as: a
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'b'"
      as: b
  - worker:
      task: ${a}
      files:
        docs/shared.md: "first by a\nlast\n"
  - worker:
      task: ${b}
      files:
        docs/shared.md: "first by b\nlast\n"
  - name: kernel next settles both
    seat: kernel:clash
    starci: [kernel, next, clash, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT tasks.status || ':' || COALESCE(attempts.outcome, '-') || ':' || COALESCE(attempts.verdict, '-') FROM tasks JOIN attempts ON attempts.task_id = tasks.id WHERE tasks.workflow_id = 'clash' ORDER BY tasks.status
        equals:
          - "done:done:green"
          - "failed:conflict:-"
  - read:
      db: ledger
      query: "SELECT subject FROM events WHERE kind = 'land-conflict'"
      as: loser
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.files[0]') || ':' || (json_extract(data_json, '$.preserved') IS NOT NULL) FROM events WHERE kind = 'land-conflict'"
        equals:
          - "docs/shared.md:1"
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE kind = 'conflict' AND subject = '${loser}' AND answered_at IS NULL"
        equals:
          - 1
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'op-worktree-removed'"
        equals:
          - 2
  - assert:
      exists:
        path: ${project}/worktrees/clash.ops/${loser}
        present: false
