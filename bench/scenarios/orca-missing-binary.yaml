schema: starci/scenario@1
id: orca-missing-binary
group: orca
title: "Orca is not installed: start refuses cleanly and spends nothing"
inject: STARCI_ORCA_BIN names a file that does not exist
expect: "supervisor start refuses ORCA_MISSING and reserves no Supervisor; workflow start refuses too and the workflow stays defined: no task, no attempt, no Op worktree, no seat is spent by a launch that cannot happen"
pass:
  - supervisor start and workflow start refuse ORCA_MISSING
  - no Supervisor reserved, the workflow still defined
  - no attempt, Op worktree or seat
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
env:
  STARCI_ORCA_BIN: ${run}/no-orca.exe
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: down
        goal: bench workflow down
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: supervisor start
    starci: [supervisor, start]
    expect:
      exit: 1
      code: ORCA_MISSING
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(*) FROM project_supervisors
        equals:
          - 0
  - name: start
    starci: [workflow, start, down]
    expect:
      exit: 1
      code: ORCA_MISSING
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows
        equals:
          - defined
  - assert:
      sql:
        db: ledger
        query: SELECT (SELECT COUNT(*) FROM attempts) + (SELECT COUNT(*) FROM events WHERE kind = 'op-worktree') + (SELECT COUNT(*) FROM seats)
        equals:
          - 0
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks WHERE status IN ('running','effect_unknown')
        equals:
          - 0
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM seats WHERE status = 'starting'
        equals:
          - 0
