schema: starci/scenario@1
id: upgrade-intermediate-ledger-read-verb
group: upgrade
title: a ledger migrated by an intermediate build opens through a read verb
inject: the ledger carries only part of the additive columns (an intermediate build of the same version wrote it); workflow status, plan show and plan diff open it
expect: "read verbs apply the additive schema before reading: no 'no such column', and the missing columns are present afterwards (found live, fixed in 578880e)"
pass:
  - workflow status, plan show and plan diff exit 0
  - the dropped columns exist again
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: mid
        goal: bench workflow mid
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: drop to the intermediate column set
    sql:
      db: ledger
      exec: ALTER TABLE workflows DROP COLUMN kernel_closed_at; ALTER TABLE workflows DROP COLUMN kernel_terminal_owned; ALTER TABLE seats DROP COLUMN terminal; UPDATE meta SET value = '5' WHERE key = 'version'
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM pragma_table_info('workflows') WHERE name = 'kernel_closed_at'
        equals:
          - 0
  - starci:
      - workflow
      - status
      - mid
    expect:
      exit: 0
      ok: true
  - starci:
      - plan
      - show
      - mid
    expect:
      exit: 0
      ok: true
  - file:
      path: edit.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: mid
        reason: probe
        changes:
          - op: edit
            id: a
            set:
              details: probe
  - starci:
      - plan
      - diff
      - mid
      - --to
      - ${run}/edit.yaml
    expect:
      exit: 0
      ok: true
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM pragma_table_info('workflows') WHERE name IN ('kernel_closed_at', 'kernel_terminal_owned')
        equals:
          - 2
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM pragma_table_info('seats') WHERE name = 'terminal'
        equals:
          - 1
