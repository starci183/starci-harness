schema: starci/scenario@1
id: lane-ui-draw-then-image
group: plan
title: a screen not yet drawn walks its ui lane, draw then image, before define records the graph
inject: a ui record in state todo; a plan that only draws it, then one whose image task does not wait for the drawing
expect: >-
  define refuses FLOW_INCOMPLETE while the image step is neither satisfied nor carried, and again while the image task does not
  depend on the draw task; the plan that draws then makes the art is recorded, its lane printed with both steps carried
pass:
  - the draw-only plan is refused FLOW_INCOMPLETE naming step image
  - the unordered plan is refused FLOW_INCOMPLETE naming the missing dependency on draw
  - the ordered plan is recorded with draw and image carried
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: be, name: api}
        - {role: fe, name: web}
    .starciwork/features/shop/ui/cart/index.yaml: |
      schema: work/ui-screen@1
      id: ui.shop.cart
      title: the cart screen
      state: todo
      activity: idle
      route: /cart
steps:
  - file:
      path: wf1.yaml
      content: |
        schema: starci/workflow@1
        id: draw1
        goal: draw the cart screen
        runner: inline
        tasks:
          - id: draw
            label: draw
            summary: draw the cart screen
            allowPaths: [.starciwork/features/shop/ui/cart]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core}
  - name: define draw only
    starci: [workflow, define, "${run}/wf1.yaml"]
    expect:
      exit: 1
      code: FLOW_INCOMPLETE
      contains: "step image is neither satisfied"
  - file:
      path: wf2.yaml
      content: |
        schema: starci/workflow@1
        id: draw2
        goal: draw the cart screen and its art
        runner: inline
        tasks:
          - id: draw
            label: draw
            summary: draw the cart screen
            allowPaths: [.starciwork/features/shop/ui/cart]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core}
          - id: image
            label: image
            summary: generate the cart screen's art
            allowPaths: [.starciwork/features/shop/ui/cart/assets]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
  - name: define with the image task out of order
    starci: [workflow, define, "${run}/wf2.yaml"]
    expect:
      exit: 1
      code: FLOW_INCOMPLETE
      contains: "does not depend on draw"
  - file:
      path: wf3.yaml
      content: |
        schema: starci/workflow@1
        id: draw3
        goal: draw the cart screen and its art
        runner: inline
        tasks:
          - id: draw
            label: draw
            summary: draw the cart screen
            allowPaths: [.starciwork/features/shop/ui/cart]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
            inputs: {grammar: core}
          - id: image
            label: image
            summary: generate the cart screen's art
            dependsOn: [draw]
            allowPaths: [.starciwork/features/shop/ui/cart/assets]
            context: [.starciwork/features/shop/ui/cart/index.yaml]
  - name: define draw then image
    starci: [workflow, define, "${run}/wf3.yaml"]
    expect:
      exit: 0
      contains: "ui.shop.cart [ui]: draw carried (draw), image carried (image)"
  - assert:
      sql:
        db: ledger
        query: SELECT id FROM workflows
        equals:
          - draw3
