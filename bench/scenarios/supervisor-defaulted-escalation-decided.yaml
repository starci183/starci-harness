schema: starci/scenario@1
id: supervisor-defaulted-escalation-decided
group: owner
title: "an owner escalation with a proposed default inside the goal is decided by the Supervisor on that default, without the owner"
inject: >-
  the Kernel escalates a product choice inside the goal with the default the goal implies and its reason; it also tries an owner
  escalation that names no topic, and escalates a money question that carries a default
expect: >-
  an owner escalation with no topic is refused COMMAND_INVALID; the Supervisor's driver decides the defaulted product choice on
  its default, records the ruling with its reasoning, and gives the Kernel an escalation-answer carrying it, so supervisor next
  never hands that escalation over and the owner is never asked; the money question, an owner topic no default settles, is still
  handed over as one awaiting the owner
pass:
  - an owner escalation with no topic is refused COMMAND_INVALID
  - the defaulted product choice is answered by the Supervisor's default ruling, with an escalation-defaulted event naming the reasoning
  - the Kernel's next decision is the escalation-answer carrying the default as its ruling
  - the money question with a default is handed over to the Supervisor as awaiting the owner
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: ask
        goal: write doc a, which names the product by its role, never by a brand
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: ask
  - file:
      path: esc-bare.yaml
      content: |
        schema: starci/command@1
        cmdId: k-ask-bare-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: owner
          question: may doc a name the product?
  - name: an owner escalation that names no topic is refused
    seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-bare.yaml"]
    expect:
      exit: 1
      code: COMMAND_INVALID
  - file:
      path: esc-default.yaml
      content: |
        schema: starci/command@1
        cmdId: k-ask-default-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: owner
          topic: product
          question: may doc a name the product?
          default: name the product by its role only
          reason: the goal says doc a names the product by its role, never by a brand
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-default.yaml"]
  - name: the Supervisor's driver decides it and has nothing to hand over
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: decided on its default
  - assert:
      sql:
        db: ledger
        query: "SELECT answered_by LIKE 'default:%' FROM decisions WHERE scope = 'supervisor' AND kind = 'escalation'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.ruling') FROM events WHERE kind = 'escalation-defaulted'"
        equals: [name the product by its role only]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'escalation-defaulted' AND json_extract(data_json, '$.reasoning') LIKE '%never by a brand%'"
        equals: [1]
  - name: the Kernel's next decision is the answer, carrying the default as its ruling
    seat: kernel:ask
    starci: [kernel, next, ask, --wait, "0"]
    expect:
      contains: escalation-answer
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(evidence_json, '$.ruling') FROM decisions WHERE scope = 'kernel' AND kind = 'escalation-answer'"
        equals: [name the product by its role only]
  - file:
      path: esc-money.yaml
      content: |
        schema: starci/command@1
        cmdId: k-ask-money-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: owner
          topic: money
          question: may doc a list a price of 9 dollars?
          default: list no price
          reason: the goal names no price
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-money.yaml"]
  - name: a money question is the owner's whatever default it proposes
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: may doc a list a price of 9 dollars?
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND kind = 'escalation' AND answered_at IS NULL"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'escalation-defaulted'"
        equals: [1]
