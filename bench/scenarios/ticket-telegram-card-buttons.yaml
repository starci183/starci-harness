schema: starci/scenario@1
id: ticket-telegram-card-buttons
group: owner
title: "each ticket reaches the owner as the banner with its facts and buttons, uploaded once; the owner's button accepts a question's default and releases its escalation, /tickets lists the open ones, and a foreign press is ignored"
inject: >-
  ops/telegram.yaml notices switched to question and defect; a Kernel escalates kind owner (topic scope) proposing a default, and kind harness; the tick runs; a chat that is not the
  owner's presses the question's "Đồng ý mặc định"; then the owner presses it; then the owner sends /tickets
expect: >-
  the tick sends each ticket as one photo of the banner with its facts as the caption and its buttons: the question with accept
  the default and another answer, the defect with details, hand to Debug, the list and mute; the banner is uploaded for the first
  card and sent by its file id for the second; the foreign press is ignored and changes nothing; the owner's press answers the
  ticket with the default as the owner's, releases the escalation, wakes the Supervisor, answers the press and edits the card's
  buttons; /tickets lists the open defect with its button and "Đã đóng hôm nay"
pass:
  - two banner cards, the first uploaded and the second by file id, each captioned with its ticket's facts and carrying its buttons
  - a foreign press ignored, the ticket still open
  - the owner's press answers with the default, releases the escalation and wakes the Supervisor
  - /tickets lists the open ticket with a button per ticket
  - no actor overstepping its role
automation: automated
env:
  TELEGRAM_BOT_TOKEN: ""
  STARCI_TELEGRAM_API: http://127.0.0.1:9
steps:
  - name: an ops/ copy with defect notices switched on beside the questions, read by the Telegram steps alone
    write: { path: ops, from: "${ops}" }
  - env: {STARCI_OPS_DIR: "${repo}/ops"}
    starci: [config, set, telegram.notices, '["question","defect"]']
    expect:
      contains: "telegram.notices"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: ops copy with defect notices"]
  - serve:
      stub: telegram
      as: tg
  - http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: /start}
  - env: &tg
      TELEGRAM_BOT_TOKEN: ${tg.token}
      STARCI_TELEGRAM_API: ${tg.url}
      STARCI_OPS_DIR: ${repo}/ops
    starci: [connect, telegram, discover-chat]
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: ask
        goal: write doc a
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: ask
  - file:
      path: esc-owner.yaml
      content: |
        schema: starci/command@1
        cmdId: k-card-owner-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: owner
          topic: scope
          question: may the goal also cover doc b?
          default: no, doc a only
          reason: the goal names doc a alone
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-owner.yaml"]
  - read:
      db: ledger
      query: "SELECT id FROM decisions WHERE scope = 'supervisor' AND kind = 'escalation'"
      as: decision
  - name: the tick sends the question's card, uploading the banner
    env: *tg
    starci: [supervisor, tick]
    expect:
      contains: ":ask"
  - file:
      path: esc-harness.yaml
      content: |
        schema: starci/command@1
        cmdId: k-card-harness-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: harness
          question: "task verify refuses CHECK_SCOPE_EMPTY from cli/src/harness/run-checks.ts"
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-harness.yaml"]
  - name: the tick sends the defect's card, the banner by its file id
    env: *tg
    starci: [supervisor, tick]
    expect:
      contains: ":open:r1"
  - read:
      db: machine
      query: "SELECT id FROM tickets WHERE kind = 'question:business'"
      as: question
  - read:
      db: machine
      query: "SELECT id FROM tickets WHERE kind = 'harness-defect'"
      as: defect
  - read:
      db: machine
      query: "SELECT message_id FROM telegram_notices WHERE key = 'ticket:${question}:ask'"
      as: card
  - name: the question's card is the uploaded banner with its facts and buttons
    http:
      url: ${tg.url}/__sent
      expect:
        equals:
          data.count: 3
          data.messages.1.photo: upload
          data.messages.1.keyboard.0: "tk:a:${question}:d"
          data.messages.1.keyboard.1: "tk:r:${question}"
          data.messages.2.photo: bench-file-1
          data.messages.2.keyboard.0: "tk:d:${defect}"
          data.messages.2.keyboard.1: "tk:g:${defect}"
          data.messages.2.keyboard.2: "tk:l"
          data.messages.2.keyboard.3: "tk:m"
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: "Mặc định đề xuất: no, doc a only"
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: "Đã gặp: 1 lần"
  - name: a chat that is not the owner's presses the question's default
    http:
      method: POST
      url: ${tg.url}/__callback
      body: {chat: 9999, data: "tk:a:${question}:d", messageId: "${card}"}
  - env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "ignored: foreign callback"
  - assert:
      sql:
        db: machine
        query: "SELECT state FROM tickets WHERE id = '${question}'"
        equals: [open]
  - name: the owner accepts the default
    http:
      method: POST
      url: ${tg.url}/__callback
      body: {chat: 7001, data: "tk:a:${question}:d", messageId: "${card}"}
  - env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "callback: answered ${question}"
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || answer || ':' || closed_by FROM tickets WHERE id = '${question}'"
        equals: ["answered:no, doc a only:owner"]
  - assert:
      sql:
        db: machine
        query: "SELECT subject || ':' || (released_at IS NOT NULL) FROM ticket_waiters WHERE ticket_id = '${question}'"
        equals: ["decision:${decision}:1"]
  - name: the press is answered and the card's buttons show the answer
    http:
      url: ${tg.url}/__sent
      expect:
        equals:
          data.edits.0.keyboard.0: "tk:d:${question}"
          data.toasts.0.text: Đã ghi câu trả lời.
  - name: the woken Supervisor reads the answer with the escalation it releases
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: "Released: decision:${decision}"
  - name: the owner lists the open tickets
    http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: /tickets}
  - env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "\"outcome\": \"tickets\""
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: "Ticket đang mở (1)"
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: "\"tk:c\""
