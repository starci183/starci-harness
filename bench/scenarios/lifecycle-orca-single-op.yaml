schema: starci/scenario@1
id: lifecycle-orca-single-op
group: lifecycle
title: "fresh orca workflow: Kernel tree, one Op, verify, release, tabs closed"
inject: "nothing: the orca reference run on the Orca stand-in"
expect: the tree boots through real verbs (Supervisor launched and attached, the workflow started from its terminal, the [Kernel] launched into its Run and attached to a child Run); kernel next launches the Op under the Kernel's Run, task and terminal inside the workflow's worktree; after its result kernel next verifies, commits in the worktree, releases the worker, closes its tab and returns the done decision
pass:
  - task done, workflow done
  - one task commit
  - the Op's worker-start under the Kernel's --run and --from
  - kernel next returns done
  - worker-release and terminal close called
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: one
        goal: bench workflow one
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: one
  - name: kernel next dispatches
    seat: kernel:one
    starci: [kernel, next, one, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: a
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
  - name: kernel next verifies
    seat: kernel:one
    starci: [kernel, next, one, --wait, "0"]
    save:
      decision: data.kind
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - done
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows
        equals:
          - done
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
        in: ${worktree.one}
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
          run: "${kernel.one.run}"
          from: "${kernel.one.terminal}"
        count: 1
  - assert:
      sql:
        db: ledger
        query: SELECT kind FROM decisions WHERE scope = 'kernel'
        equals:
          - done
  - assert:
      orcaCalls:
        command: worker-release
        min: 1
  - assert:
      orcaCalls:
        command: terminal close
        min: 1
