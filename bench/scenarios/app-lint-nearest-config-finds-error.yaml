schema: starci/scenario@1
id: app-lint-nearest-config-finds-error
group: verify
title: lint resolves the nearest eslint config above an app that has none
inject: "an app with no config of its own and a file holding a known error, the only config in the folder above"
expect: >-
  the app is linted with fe/eslint.config.mjs, the error turns the lint red, and the step names the config and the count
  of linted files
pass:
  - the known error is found in the app with no config of its own
  - the step names the config it used
  - no human intervention beyond the injected fault
automation: automated
# A product shaped like nivo-lite: one eslint config in fe/ (not a workspace), two apps without a config of their own.
# The ESLint stand-in refuses to run without an eslint.config.* in its working folder and reports a file holding LINT_ERROR.
repo:
  files:
    README.md: "# bench scratch app\n"
    package.json: '{"name": "bench-app", "version": "1.0.0", "private": true, "workspaces": ["fe/apps/web", "fe/apps/landing"]}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "starci"}}}'
    fe/eslint.config.mjs: "export default []\n"
    fe/apps/web/package.json: '{"name": "bench-web", "version": "1.0.0"}'
    fe/apps/web/src/page.ts: "export const page = 1\n"
    fe/apps/landing/package.json: '{"name": "bench-landing", "version": "1.0.0"}'
    fe/apps/landing/src/home.ts: "export const home = 1\n"
    node_modules/eslint/bin/eslint.js: |
      const { existsSync, readFileSync, statSync, readdirSync } = require("node:fs")
      const { join } = require("node:path")
      if (!["eslint.config.mjs", "eslint.config.js", "eslint.config.cjs", "eslint.config.ts"].some((f) => existsSync(join(process.cwd(), f)))) {
        console.log("eslint: no config in " + process.cwd())
        process.exit(2)
      }
      const files = (path) => (statSync(path).isDirectory() ? readdirSync(path).filter((n) => n !== "node_modules").flatMap((n) => files(join(path, n))) : [path])
      const bad = process.argv.slice(2).filter((a) => !a.startsWith("--")).flatMap(files).filter((f) => /\.ts$/.test(f) && readFileSync(f, "utf8").includes("LINT_ERROR"))
      for (const f of bad) console.log(f + ": error LINT_ERROR")
      process.exit(bad.length === 0 ? 0 : 1)
steps:
  - name: a file of the web app gains an error
    write:
      path: fe/apps/web/src/page.ts
      content: "export const page = 1 // LINT_ERROR\n"
  - name: the scoped lint finds the error through fe/eslint.config.mjs
    starci: [check, lint, --base, HEAD]
    expect:
      exit: 1
      contains: "error LINT_ERROR"
  - name: the step names the config and how many files it linted
    starci: [check, lint, --base, HEAD]
    expect:
      exit: 1
      contains: "config fe/eslint.config.mjs, 1 file(s) linted"
