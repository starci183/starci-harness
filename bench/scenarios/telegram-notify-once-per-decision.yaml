schema: starci/scenario@1
id: telegram-notify-once-per-decision
group: messaging
title: "an escalation the Supervisor cannot rule reaches the owner's Telegram chat once, as its ticket, by the tick, however many sweeps and bridge cycles run"
inject: >-
  the owner messages the bot and connects the channel; a Kernel escalates a question of kind owner (no default) and one of kind
  harness; the scheduled tick runs (no bridge running), then the notice sweep by hand and a bridge cycle, all against the
  Telegram stand-in
expect: >-
  discover-chat stores the one chat that wrote to the bot and greets it; the tick files each escalation as its ticket, a
  question:business ticket for the owner and a blocking harness-defect ticket for Debug, each waiting on its escalation, and
  sends one notice for each: the question with its ticket id and how to answer, and the defect saying Debug works it; the later
  sweep and the bridge cycle send nothing more; each notice row is sent once with the message id the owner replies to
pass:
  - one greeting and exactly two notices in the chat, sent by the tick
  - "the question notice carries the question, the ticket id and /answer; the defect notice names Debug"
  - two tickets opened by the supervisor, each with its escalation waiting
  - two telegram_notices rows, sent once
  - no actor overstepping its role
automation: automated
env:
  TELEGRAM_BOT_TOKEN: ""
  STARCI_TELEGRAM_API: http://127.0.0.1:9
steps:
  - serve:
      stub: telegram
      as: tg
  - name: the owner writes to the bot
    http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: /start}
  - name: the owner stores his chat
    env: &tg
      TELEGRAM_BOT_TOKEN: ${tg.token}
      STARCI_TELEGRAM_API: ${tg.url}
    starci: [connect, telegram, discover-chat]
    expect:
      contains: "\"id\": \"7001\""
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: ask
        goal: write doc a
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: ask
  - file:
      path: esc-owner.yaml
      content: |
        schema: starci/command@1
        cmdId: k-tg-owner-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: owner
          topic: product
          question: may doc a name the product?
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-owner.yaml"]
  - file:
      path: esc-harness.yaml
      content: |
        schema: starci/command@1
        cmdId: k-tg-harness-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: harness
          question: the files-exist preset reads the wrong folder
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-harness.yaml"]
  - name: the scheduled tick files both escalations as tickets and sends their notices, with no bridge running
    env: *tg
    starci: [supervisor, tick]
    expect:
      contains: "ticket:tk-"
  - name: a sweep by hand sends nothing more
    env: *tg
    starci: [connect, telegram, notify]
    expect:
      contains: "\"sent\": []"
  - name: a bridge cycle sends nothing either
    env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "\"sent\": []"
  - assert:
      sql:
        db: machine
        query: "SELECT kind || ':' || severity || ':' || state || ':' || opened_by || ':' || (SELECT COUNT(*) FROM ticket_waiters w WHERE w.ticket_id = tickets.id AND w.subject LIKE 'decision:d-%' AND w.released_at IS NULL) FROM tickets ORDER BY kind"
        equals: ["harness-defect:blocking:open:supervisor:1", "question:business:blocking:open:supervisor:1"]
  - name: the chat holds the greeting and two notices
    http:
      url: ${tg.url}/__sent
      expect:
        contains: may doc a name the product?
        equals:
          data.count: 3
          data.messages.1.chat_id: "7001"
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: /answer tk-
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: Claude Debug works it
  - assert:
      sql:
        db: machine
        query: SELECT kind || ':' || status || ':' || tries || ':' || (message_id IS NOT NULL) FROM telegram_notices
        equals: ["ticket:sent:1:1", "ticket:sent:1:1"]
