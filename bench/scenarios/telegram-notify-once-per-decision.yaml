schema: starci/scenario@1
id: telegram-notify-once-per-decision
group: messaging
title: "an owner escalation reaches the owner's Telegram chat once, by the tick, however many sweeps and bridge cycles run; a harness escalation never does"
inject: >-
  the owner messages the bot and connects the channel; a Kernel escalates a question of kind owner and one of kind harness; the
  scheduled tick runs (no bridge running), then the notice sweep by hand and a bridge cycle, all against the Telegram stand-in
expect: >-
  discover-chat stores the one chat that wrote to the bot and greets it; the tick sends one notice naming the project, the
  workflow, the decision id, the question and how to answer; the harness escalation is Debug's and is never sent; the later sweep
  and the bridge cycle send nothing more; the notice row is sent once with the message id the owner replies to
pass:
  - one greeting and exactly one notice in the chat, sent by the tick
  - no notice for the harness escalation
  - "the notice carries the question, the decision id and /answer"
  - one telegram_notices row, sent
  - no actor overstepping its role
automation: automated
env:
  TELEGRAM_BOT_TOKEN: ""
  STARCI_TELEGRAM_API: http://127.0.0.1:9
steps:
  - serve:
      stub: telegram
      as: tg
  - name: the owner writes to the bot
    http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: /start}
  - name: the owner stores his chat
    env: &tg
      TELEGRAM_BOT_TOKEN: ${tg.token}
      STARCI_TELEGRAM_API: ${tg.url}
    starci: [connect, telegram, discover-chat]
    expect:
      contains: "\"id\": \"7001\""
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: ask
        goal: write doc a
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: ask
  - file:
      path: esc-owner.yaml
      content: |
        schema: starci/command@1
        cmdId: k-tg-owner-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: owner
          question: may doc a name the product?
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-owner.yaml"]
  - file:
      path: esc-harness.yaml
      content: |
        schema: starci/command@1
        cmdId: k-tg-harness-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: harness
          question: the files-exist preset reads the wrong folder
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-harness.yaml"]
  - name: the scheduled tick sends the owner notice, with no bridge running
    env: *tg
    starci: [supervisor, tick]
    expect:
      contains: "decision:d-"
  - name: a sweep by hand sends nothing more
    env: *tg
    starci: [connect, telegram, notify]
    expect:
      contains: "\"sent\": []"
  - name: a bridge cycle sends nothing either
    env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "\"sent\": []"
  - name: the chat holds the greeting and one notice
    http:
      url: ${tg.url}/__sent
      expect:
        contains: may doc a name the product?
        equals:
          data.count: 2
          data.messages.1.chat_id: "7001"
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: /answer d-
  - assert:
      sql:
        db: machine
        query: SELECT kind || ':' || status || ':' || tries || ':' || (message_id IS NOT NULL) FROM telegram_notices
        equals: ["decision:sent:1:1"]
  - http:
      url: ${tg.url}/__sent
      expect:
        equals:
          data.count: 2
  - name: the harness question never reached the chat
    assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM telegram_notices WHERE text LIKE '%wrong folder%'"
        equals: [0]
