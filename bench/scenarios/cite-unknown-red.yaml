schema: starci/scenario@1
id: cite-unknown-red
group: verify
title: a cite that resolves to nothing is red, in the contract and in the result
inject: a workflow hands a task an anchor id no context defines; then a draw worker files done citing one
expect: >-
  define refuses the contract whose cites name an unknown id; a draw task whose result cites an unknown anchor fails its
  verify with anchors-cited red naming the id, and nothing is committed
pass:
  - the contract handing an unknown id is refused at define, naming it
  - anchors-cited is red naming the unknown id, the task failed
  - no commit carries the task trailer
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf-handed.yaml
      content: |
        schema: starci/workflow@1
        id: handed
        goal: draw the cart direction
        runner: inline
        tasks:
          - id: draw
            label: draw
            summary: draw the cart direction
            allowPaths: [web/direction]
            inputs: {grammar: core}
            cites: [tabs.choose, nosuch.choose.level]
  - name: a contract handing an unknown id is refused
    starci: [workflow, define, "${run}/wf-handed.yaml"]
    expect:
      exit: 1
      contains: "cites names ids no context defines: nosuch.choose.level"
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: unknown
        goal: draw the cart direction
        runner: inline
        tasks:
          - id: draw
            label: draw
            summary: draw the cart direction
            allowPaths: [web/direction]
            inputs: {grammar: core}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, unknown]
    save:
      draw: data.nodes.0.task.id
  - name: the worker cites an anchor no context defines
    worker:
      task: ${draw}
      status: done
      files:
        web/direction/cart.html: "<main>cart</main>\n"
      output:
        summary: the cart direction
        files: [web/direction/cart.html]
        direction: web/direction/cart.html
        rulesApplied: [STATE-6]
        cites: [tabs.choose, STATE-6, nosuch.choose.level]
  - name: step
    starci: [workflow, step, unknown]
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (detail LIKE '%nosuch.choose.level resolves to no anchor%') || ':' || (detail LIKE '%tabs.choose resolves%') FROM check_runs WHERE name = 'anchors-cited'"
        equals:
          - "red:1:0"
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - failed
  - assert:
      gitLog:
        grep: "Starci-Task: ${draw}"
        count: 0
