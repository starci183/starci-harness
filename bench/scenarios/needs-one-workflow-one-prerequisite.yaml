schema: starci/scenario@1
id: needs-one-workflow-one-prerequisite
group: needs
title: two Ops of one inline workflow report one missing capability; the Kernel gets one shared-need decision, adds one prerequisite, and both are released when it lands
inject: "both tasks of the workflow find platform/http's HttpClient missing (rule BE-INFRA-2) and file blocked with --needs, spelled two ways; the Kernel's first answer names a resolver the graph will not hold"
expect: >-
  the two reports open one need (capability:platform.http) with two waiters, each task parked with its work kept and no
  question raised; the Kernel gets exactly one shared-need decision; an answer naming an unknown resolver bounces back
  NEED_ANSWER_INVALID with guidance and leaves the decision open; the answer adding one prerequisite task makes the workflow its
  owner; once that task lands, the need is resolved and both waiters are retried without any nudge
pass:
  - one need row, two waiter rows, one shared-need decision, no question decision
  - the invalid answer is refused and the decision stays open
  - exactly one prerequisite task, landed with its commit
  - both waiters released and retried as new tasks, with no Kernel command after the resolver's
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: shop
        goal: bench workflow shop
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a, which calls the shared http client
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args: {files: [docs/a.md]}
          - id: b
            label: docs
            summary: write doc b, which calls the shared http client
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args: {files: [docs/b.md]}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, shop]
    save:
      a: data.nodes.0.task.id
  - name: the first Op finds the shared client missing
    worker:
      task: ${a}
      status: blocked
      output:
        summary: platform/http has no HttpClient
        files: []
        rulesApplied: []
        needs:
          - {key: "capability:platform/http", rule: BE-INFRA-2, note: HttpClient is missing}
  - name: step parks it and dispatches the second
    starci: [workflow, step, shop]
    expect: {}
    save:
      b: data.nodes.1.task.id
  - name: the second Op reports the same need, spelled otherwise
    worker:
      task: ${b}
      status: blocked
      output:
        summary: no shared http client
        files: []
        rulesApplied: []
        needs: ["Capability:Platform.HTTP"]
  - starci: [workflow, step, shop]
    expect: {}
  - name: one need, two waiters, both parked
    assert:
      sql:
        db: machine
        query: "SELECT n.key || ':' || n.state || ':' || n.level || ':' || (SELECT COUNT(*) FROM shared_need_waiters w WHERE w.key = n.key AND w.parked_at IS NOT NULL) FROM shared_needs n"
        equals: ["capability:platform.http:routed:kernel:2"]
  - name: one shared-need decision and no question
    assert:
      sql:
        db: ledger
        query: "SELECT kind FROM decisions ORDER BY kind"
        equals: [shared-need]
  - name: kernel next hands the decision
    starci: [kernel, next, shop, --wait, "0"]
    expect:
      contains: '"kind": "shared-need"'
    save:
      decision: data.decision.id
      graph: data.digest.graphVersion
  - file:
      path: add-http.yaml
      content: |
        schema: starci/workflow-change@1
        workflow: shop
        reason: build the shared http client once
        changes:
          - op: add
            task:
              id: http
              label: docs
              summary: write the shared http client
              allowPaths: [platform/http/client.md]
              checks:
                - preset: files-exist
                  args: {files: [platform/http/client.md]}
  - file:
      path: cmd-bad.yaml
      content: |
        schema: starci/command@1
        cmdId: k-shop-need-bad
        kind: workflow-change
        workflow: shop
        basedOn: {graph: ${graph}}
        answers: [${decision}]
        change: add-http.yaml
        need: {key: "capability:platform.http", resolver: nope}
  - name: an answer naming a task the graph will not hold bounces back with guidance
    starci: [kernel, submit, "${run}/cmd-bad.yaml"]
    expect:
      exit: 1
      code: NEED_ANSWER_INVALID
      contains: "resolver nope is no task"
  - assert:
      sql:
        db: ledger
        query: "SELECT answered_at IS NULL FROM decisions WHERE id = '${decision}'"
        equals: [1]
  - file:
      path: cmd-good.yaml
      content: |
        schema: starci/command@1
        cmdId: k-shop-need-http
        kind: workflow-change
        workflow: shop
        basedOn: {graph: ${graph}}
        answers: [${decision}]
        change: add-http.yaml
        need: {key: "capability:platform.http", resolver: http}
  - name: the Kernel adds one prerequisite and names it the resolver
    starci: [kernel, submit, "${run}/cmd-good.yaml"]
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || json_extract(resolver_json, '$.key') || ':' || json_extract(owner_json, '$.workflow') FROM shared_needs"
        equals: ["resolving:http:shop"]
  - starci: [workflow, step, shop]
    expect: {}
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'http'"
      as: http
  - name: the prerequisite lands
    worker:
      task: ${http}
      files:
        platform/http/client.md: "# HttpClient\n"
  - name: the step that lands it releases both waiters
    starci: [workflow, step, shop]
    expect: {}
  - assert:
      sql:
        db: machine
        query: "SELECT state FROM shared_needs"
        equals: [resolved]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM shared_need_waiters WHERE released_at IS NOT NULL AND json_extract(release_json, '$.by') = 'resolved'"
        equals: [2]
  - name: exactly one prerequisite task
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE plan_key = 'http'"
        equals: [1]
  - assert:
      gitLog:
        grep: "Starci-Task: ${http}"
        count: 1
  - name: each waiter runs again as a new task, no Kernel command after the resolver's
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM tasks WHERE plan_key IN ('a', 'b')) || ':' || (SELECT COUNT(*) FROM commands WHERE scope = 'kernel' AND status = 'applied')"
        equals: ["3:1"]
  - name: the waiter's new brief says how its need ended
    read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a' AND status = 'queued'"
      as: a2
  - starci: [task, status, "${a2}"]
    expect: {}
