schema: starci/scenario@1
id: kernel-holding-on-open-escalation
group: orca
title: "a Kernel escalates and ends its turn while its workflow still has work it can drive: the tick nudges it"
inject: >-
  the Kernel submits an escalation, then stops at its prompt ("holding here") with a ready node and no driver call for ten
  minutes, while the escalation waits for the Supervisor
expect: >-
  an open escalation does not excuse the Kernel: its workflow still has a node its driver acts on, so the tick nudges the Kernel
  once with its loop prompt, and nothing else is launched
pass:
  - exactly one nudge, typed into the Kernel's terminal, with the escalation still open
  - no relaunch
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: hold
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: hold
  - file:
      path: esc.yaml
      content: |
        schema: starci/command@1
        cmdId: k-hold-ask-1
        kind: escalation
        workflow: hold
        basedOn: {graph: 1}
        escalation:
          kind: owner
          topic: product
          question: may doc a name the product?
  - seat: kernel:hold
    starci: [kernel, submit, "${run}/esc.yaml"]
  - name: the Kernel holds at its prompt
    orca:
      set:
        tuiIdle:
          ${kernel.hold.terminal}: true
  - sql:
      db: ledger
      exec: UPDATE seats SET lease_until = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '+5 minutes') WHERE role = 'kernel'
  - starci: [supervisor, tick]
    expect:
      contains: "hold: Kernel idle at its prompt with work pending"
  - assert:
      orcaCalls:
        command: terminal send
        match:
          terminal: ${kernel.hold.terminal}
        count: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND answered_at IS NULL"
        equals: [1]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\]'
        count: 1
