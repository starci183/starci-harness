schema: starci/scenario@1
id: resources-crlf-workflow-yaml
group: resources
title: a workflow file saved with CRLF line endings defines like LF
inject: wf.yaml written with CRLF
expect: define reads it; node hashes equal those of the LF file
pass:
  - define exits 0
  - node hash equal to the LF definition's
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: lf.yaml
      yaml:
        schema: starci/workflow@1
        id: lf
        goal: bench workflow lf
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - file:
      path: crlf.yaml
      yaml:
        schema: starci/workflow@1
        id: crlf
        goal: bench workflow crlf
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
      crlf: true
  - name: define
    starci:
      - workflow
      - define
      - ${run}/lf.yaml
  - name: define
    starci:
      - workflow
      - define
      - ${run}/crlf.yaml
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(DISTINCT contract_hash) FROM plan_nodes
        equals:
          - 1
