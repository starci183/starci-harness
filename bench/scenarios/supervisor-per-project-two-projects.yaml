schema: starci/scenario@1
id: supervisor-per-project-two-projects
group: lifecycle
title: "two projects on one host: two Supervisors, each launching and sweeping only its own project's workflows"
inject: >-
  two repositories that hold no Work, so each is a project of its own, each with a running orca workflow; both Kernels die; each
  Supervisor runs supervisor next from its own terminal, and one tries to start a workflow of the other project
expect: >-
  supervisor start gives each project its own [Supervisor] <project> in its own main checkout, and a second start in a project
  refuses SUPERVISOR_RUNNING; workflow start of a project's workflow runs only from that project's Supervisor
  (SUPERVISOR_REQUIRED from the other's); each supervisor next relaunches only its own project's Kernel, into its own Run;
  supervisor status with no project lists both
pass:
  - two live Supervisor rows, one per project key
  - each Kernel launched and relaunched from its own project's Supervisor terminal, never the other's
  - "a Supervisor's sweep leaves the other project's dead Kernel alone"
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repos:
  other: {}
steps:
  - file:
      path: alpha.yaml
      content: |
        schema: starci/workflow@1
        id: alpha
        goal: write doc alpha
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc alpha
            allowPaths: [docs/alpha.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/alpha.md]
  - file:
      path: beta.yaml
      content: |
        schema: starci/workflow@1
        id: beta
        goal: write doc beta
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc beta
            allowPaths: [docs/beta.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/beta.md]
  - file:
      path: gamma.yaml
      content: |
        schema: starci/workflow@1
        id: gamma
        goal: write doc gamma
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc gamma
            allowPaths: [docs/gamma.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/gamma.md]
  - boot:
      file: ${run}/alpha.yaml
      workflow: alpha
  - boot:
      project: other
      file: ${run}/beta.yaml
      workflow: beta
  - name: a second Supervisor of the first project is refused
    starci: [supervisor, start]
    expect:
      exit: 1
      code: SUPERVISOR_RUNNING
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(DISTINCT project) FROM project_supervisors WHERE ended_at IS NULL
        equals: [2]
  - name: the first project's Supervisor may not start the other project's workflow
    starci: [workflow, define, "${run}/gamma.yaml"]
    cwd: ${repo.other}
  - seat: supervisor
    starci: [workflow, start, gamma]
    cwd: ${repo.other}
    expect:
      exit: 1
      code: SUPERVISOR_REQUIRED
  - name: status with no project lists both
    starci: [supervisor, status]
    expect:
      contains: '"name": "other"'
  - name: both Kernels die, 21 minutes pass with no progress
    orca:
      worker:
        dispatch: kernel
        state: exited
  - sql:
      db: ledger
      exec: >-
        UPDATE seats SET lease_until = '2020-01-01T00:00:00.000Z' WHERE role = 'kernel';
        UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-21 minutes')
  - sql:
      db: ledger
      repo: other
      exec: >-
        UPDATE seats SET lease_until = '2020-01-01T00:00:00.000Z' WHERE role = 'kernel';
        UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-21 minutes')
  - name: the first project's Supervisor sweeps its own project only
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: "alpha: relaunched its Kernel"
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] beta$'
        count: 1
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] alpha$'
          from: ^${supervisor.terminal}$
        count: 2
  - name: the other project's Supervisor sweeps its own
    seat: supervisor:other
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: "beta: relaunched its Kernel"
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] beta$'
          from: ^${supervisor.other.terminal}$
          run: ^${supervisor.other.run}$
        count: 2
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] alpha$'
        count: 2
  - assert:
      orcaCalls:
        command: agent launch
        count: 2
  - name: each Supervisor was launched in its own project's main checkout
    assert:
      orcaCalls:
        command: agent launch
        match:
          worktree: ^path:.*/other$
        count: 1
