schema: starci/scenario@1
id: conflict-scope-exceeded-escalates
group: conflict
title: "the Kernel needs a path past its scope ceiling: refused SCOPE_EXCEEDED, escalated (kind scope), widened by the Supervisor"
inject: "an Op returns blocked: the fix needs src/, outside the goal's scope docs/; the Kernel first tries to add the task anyway"
expect: >-
  kernel next returns the blocked result as a question; the Kernel's change adding a task on src/ is refused SCOPE_EXCEEDED
  and recorded failed; the Kernel escalates (kind scope); supervisor next returns it; the Supervisor's goal-change widens the
  scope to docs/ and src/ answering it; the Kernel's resubmitted change (a fresh cmdId on the new basedOn) is applied and the
  new task launches
pass:
  - SCOPE_EXCEEDED, nothing applied, graph unchanged
  - one scope escalation, answered by the goal-change; goal v2 scope docs/ and src/
  - the widened plan applied and its task launched
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: scoped
        goal: document the api
        runner: orca
        maxParallel: 2
        scope:
          paths: [docs/]
          maxTasks: 3
        tasks:
          - id: api
            label: docs
            summary: document the api
            allowPaths: [docs/api.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/api.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: scoped
  - seat: kernel:scoped
    starci: [kernel, next, scoped, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: api
  - worker:
      task: ${api}
      status: blocked
      output:
        summary: the api has no exported entry to document; src/index.ts must export it first
        files: []
        rulesApplied: []
  - name: kernel next returns the question
    seat: kernel:scoped
    starci: [kernel, next, scoped, --wait, "0"]
    expect:
      contains: '"kind": "question"'
    save:
      question: data.decision.id
      graph: data.digest.graphVersion
  - file:
      path: add.yaml
      content: |
        schema: starci/workflow-change@1
        workflow: scoped
        reason: export the api entry first
        changes:
          - op: add
            task:
              id: export
              label: docs
              summary: export the api entry from src/index.ts
              allowPaths: [src/index.ts]
              checks:
                - preset: files-exist
                  args:
                    files: [src/index.ts]
  - file:
      path: cmd-add.yaml
      content: |
        schema: starci/command@1
        cmdId: k-scoped-add-1
        kind: workflow-change
        workflow: scoped
        basedOn: {graph: ${graph}}
        answers: [${question}]
        route: blocked-answered
        change: add.yaml
  - name: the change past the ceiling is refused
    seat: kernel:scoped
    starci: [kernel, submit, "${run}/cmd-add.yaml"]
    expect:
      exit: 1
      code: SCOPE_EXCEEDED
  - assert:
      sql:
        db: ledger
        query: SELECT graph_version FROM workflows
        equals: [1]
  - file:
      path: cmd-escalate.yaml
      content: |
        schema: starci/command@1
        cmdId: k-scoped-escalate-1
        kind: escalation
        workflow: scoped
        basedOn: {graph: ${graph}}
        answers: [${question}]
        escalation:
          kind: scope
          question: documenting the api needs src/index.ts to export its entry; widen the scope to src/?
          paths: [src/index.ts]
  - seat: kernel:scoped
    starci: [kernel, submit, "${run}/cmd-escalate.yaml"]
  - name: supervisor next returns the scope escalation
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: '"kind": "scope"'
    save:
      escalation: data.decision.id
  - file:
      path: widen.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-scoped-widen-1
        kind: goal-change
        workflow: scoped
        project: ${repo}
        basedOn: {goal: 1}
        answers: [${escalation}]
        goal: document the api; exporting its entry from src/index.ts is in scope
        scope:
          paths: [docs/, src/]
          maxTasks: 3
  - seat: supervisor
    starci: [supervisor, submit, "${run}/widen.yaml"]
  - name: kernel next returns the answer
    seat: kernel:scoped
    starci: [kernel, next, scoped, --wait, "0"]
    expect:
      contains: '"kind": "escalation-answer"'
    save:
      answer: data.decision.id
      graph2: data.digest.graphVersion
  - file:
      path: cmd-add-2.yaml
      content: |
        schema: starci/command@1
        cmdId: k-scoped-add-2
        kind: workflow-change
        workflow: scoped
        basedOn: {graph: ${graph2}}
        answers: [${answer}]
        change: add.yaml
  - name: the widened change is applied
    seat: kernel:scoped
    starci: [kernel, submit, "${run}/cmd-add-2.yaml"]
  - seat: kernel:scoped
    starci: [kernel, next, scoped, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT cmd_id || ':' || status FROM commands WHERE scope = 'kernel' ORDER BY received_at
        equals: ["k-scoped-add-1:failed", "k-scoped-escalate-1:applied", "k-scoped-add-2:applied"]
  - assert:
      sql:
        db: ledger
        query: SELECT kind || ':' || answered_by FROM decisions WHERE scope = 'supervisor'
        equals: ["escalation:sup-scoped-widen-1"]
  - assert:
      sql:
        db: ledger
        query: SELECT goal_version FROM workflows
        equals: [2]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE plan_key = 'export'"
        equals: [running]
