schema: starci/scenario@1
id: telegram-bridge-reply-records-owner-request
group: messaging
title: "the owner answers a question ticket on Telegram: the ticket is answered as the owner's, its escalation released and the Supervisor woken; a later message about it is an owner request"
inject: >-
  a Kernel escalates a question of kind owner with no default, the bridge files it as a question ticket and its notice reaches
  the owner's chat; the owner replies to the notice, then sends /answer with the ticket id once it is answered; the bridge runs a
  cycle after each, and once more with nothing new
expect: >-
  the reply answers the ticket, recorded with the owner as who answered and why, releases the escalation waiting on it and wakes
  the Supervisor with one owner request naming the ticket, the answer and the released decision; the later /answer finds the
  ticket answered and becomes an owner request carrying the owner's words; the Supervisor's Run is mailed once per request and
  supervisor next returns the request as owner-request; the owner gets a receipt each time; an update already handled is never
  recorded twice; the Supervisor taking up the request and stopping the workflow sends nothing
pass:
  - the ticket answered by the owner with the reply's words, its escalation released
  - two owner requests by owner, the first naming the ticket, the answer and the decision
  - one wake-up mail per request to the Supervisor's Run
  - supervisor next returns an owner-request
  - a receipt in the chat for each message
  - no actor overstepping its role
automation: automated
env:
  TELEGRAM_BOT_TOKEN: ""
  STARCI_TELEGRAM_API: http://127.0.0.1:9
steps:
  - serve:
      stub: telegram
      as: tg
  - http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: /start}
  - env: &tg
      TELEGRAM_BOT_TOKEN: ${tg.token}
      STARCI_TELEGRAM_API: ${tg.url}
    starci: [connect, telegram, discover-chat]
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: ask
        goal: write doc a
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: ask
  - file:
      path: esc-owner.yaml
      content: |
        schema: starci/command@1
        cmdId: k-tg-owner-1
        kind: escalation
        workflow: ask
        basedOn: {graph: 1}
        escalation:
          kind: owner
          topic: product
          question: may doc a name the product?
  - seat: kernel:ask
    starci: [kernel, submit, "${run}/esc-owner.yaml"]
  - read:
      db: ledger
      query: "SELECT id FROM decisions WHERE kind = 'escalation'"
      as: decision
  - name: the bridge files the escalation as a question ticket and sends its notice
    env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "ticket:tk-"
  - read:
      db: machine
      query: SELECT id FROM tickets
      as: ticket
  - http:
      url: ${tg.url}/__sent
      save:
        notice: data.messages.1.message_id
  - name: the owner replies to the notice
    http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: "yes, name it", replyTo: "${notice}"}
  - name: the bridge answers the ticket with the reply
    env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: answered ${ticket}
  - assert:
      sql:
        db: machine
        query: "SELECT state || ':' || answer || ':' || closed_by || ':' || (reason LIKE '%via Telegram') FROM tickets"
        equals: ["answered:yes, name it:owner:1"]
  - assert:
      sql:
        db: machine
        query: "SELECT subject || ':' || (released_at IS NOT NULL) || ':' || (request_id IS NOT NULL) FROM ticket_waiters"
        equals: ["decision:${decision}:1:1"]
  - name: the owner answers by id once more, after the ticket is answered
    http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: "/answer ${ticket} only in the footer"}
  - env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: owner request r-
  - name: a cycle with nothing new records nothing
    env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "\"handled\": []"
  - assert:
      sql:
        db: machine
        query: "SELECT by || ':' || (closed_at IS NULL) FROM owner_requests ORDER BY at"
        equals: ["owner:1", "owner:1"]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM owner_requests WHERE (text LIKE 'Ticket ${ticket} (question:business) is answered by owner: yes, name it%' AND text LIKE '%decision:${decision}%') OR text LIKE 'Owner, via Telegram, about ticket ${ticket}: only in the footer'"
        equals: [2]
  - assert:
      orcaCalls:
        command: send
        match:
          subject: "^\\[Owner\\] request r-"
        count: 2
  - name: the woken Supervisor reads the request
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: owner-request
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: "Answered ${ticket}"
        equals:
          data.count: 4
  - http:
      url: ${tg.url}/__sent
      expect:
        contains: "Recorded r-"
  - read:
      db: machine
      query: SELECT id FROM owner_requests ORDER BY at LIMIT 1
      as: request
  - name: the Supervisor relays the answer and stops the workflow, answering the request
    file:
      path: stop.yaml
      content: |
        schema: starci/command@1
        cmdId: s-tg-stop-1
        kind: stop
        workflow: ask
        project: ${repo}
        basedOn: {}
        answers: [${request}]
        mode: hard
  - seat: supervisor
    starci: [supervisor, submit, "${run}/stop.yaml"]
  - name: the next cycle sends nothing about the request taken up or the workflow stopped, which need no decision
    env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "\"sent\": []"
  - assert:
      sql:
        db: machine
        query: SELECT kind || ':' || status FROM telegram_notices ORDER BY kind
        equals: ["ticket:sent"]
  - http:
      url: ${tg.url}/__sent
      expect:
        equals:
          data.count: 4
