schema: starci/scenario@1
id: wave-red-returns-file-owner-only
group: verify
title: "a wave's red returns only the task that landed the red file, even when another task left the check that found it"
inject: "of two tasks of an inline workflow, only a leaves check-run-green; b leaves a test command and lands a file with a lint error"
expect: >-
  the wave's scoped lint runs once over the union both tasks landed, on a's check-run-green, and is red only on b's file: the
  red is b's, so b alone turns failed with a red check-run-green row added to its own rows, and a, whose files are green, is
  judged green and stays done, its row noting the red as another task's; no wave error is recorded
pass:
  - task a done and judged green; task b failed
  - b carries a red check-run-green row naming its file; a's check-run-green row is green
  - the wave returned b only, and recorded no finding outside the landed files
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    package.json: '{"name": "bench-wave", "version": "1.0.0", "private": true}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "core"}}}'
    tsconfig.json: '{"compilerOptions": {"strict": true}, "include": ["src"]}'
    eslint.config.js: "module.exports = []\n"
    src/index.ts: "export const index = 1\n"
    node_modules/typescript/bin/tsc: "process.exit(0)\n"
    node_modules/eslint/bin/eslint.js: |
      const { readFileSync } = require("node:fs")
      const { resolve } = require("node:path")
      const bad = process.argv.slice(2).filter((a) => !a.startsWith("--") && readFileSync(a, "utf8").includes("LINT_ERROR"))
      for (const f of bad) console.log(resolve(f) + ": error LINT_ERROR bench/no-error")
      process.exit(bad.length === 0 ? 0 : 1)
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: wave
        goal: a change and its tests, the tests red on lint
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: add module a
            allowPaths: [src/a.ts]
            checks: [check-run-green]
          - id: b
            label: docs
            summary: add the tests of module a
            allowPaths: [src/b.ts]
            checks:
              - check:
                  kind: command
                  run: [node, -e, "process.exit(0)"]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, wave]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      files:
        src/a.ts: "export const a = 1\n"
  - name: step verifies a and dispatches b, no wave yet
    starci: [workflow, step, wave]
    save:
      b: data.nodes.1.task.id
  - worker:
      task: ${b}
      files:
        src/b.ts: "export const b = 1 // LINT_ERROR\n"
  - name: step verifies b, then the wave runs once and returns b alone
    starci: [workflow, step, wave]
    expect:
      exit: 1
      contains: "wave red"
  - assert:
      sql:
        db: ledger
        query: "SELECT plan_key || ':' || status FROM tasks ORDER BY created_at"
        equals: ["a:done", "b:failed"]
  - name: b carries the red row naming its file, a a green one
    assert:
      sql:
        db: ledger
        query: "SELECT (task_id = '${b}') || ':' || status || ':' || (instr(replace(detail, char(92), '/'), 'src/b.ts') > 0) FROM check_runs WHERE name = 'check-run-green' AND runner = 'harness' ORDER BY task_id = '${b}'"
        equals: ["0:green:1", "1:red:1"]
  - name: the wave returned b only, its red proven b's own, and found nothing outside the landed files
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.returned') || ':' || json_array_length(data_json, '$.free') || ':' || json_array_length(data_json, '$.errors') || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'wave-foreign-red') FROM events WHERE kind = 'wave-verified'"
        equals: ['["${b}"]:0:0:0']
  - name: a is judged green by the wave
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.verdict') FROM events WHERE kind = 'wave-judged' AND subject = '${a}'"
        equals: [green]
