schema: starci/scenario@1
id: op-settle-host-held-keeps
group: verify
title: "an attempt the host held is a harness stop: one patch is KEPT whatever the Kernel names, the next attempt applies it, and its merge deletes it"
inject: "the Op files failed with a draft written, and the ledger records that the host held its verify (verify-host-held on its attempt)"
expect: >-
  the step settles the attempt keep (by the harness, cause host-held) before any Kernel decision: its one patch is stored and its
  preserve folder, worktree and branch go; the Kernel's retry names no settle, which cannot discard work the harness owes; the
  next attempt applies the patch, spends no try, lands green, and its merge deletes the patch
pass:
  - the attempt is settled keep by the harness with one stored patch, its worktree and branch removed
  - the Kernel's plain retry spends no try and starts from the kept patch
  - after it merges, the store holds no patch
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: hld
        goal: bench workflow host-held
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a]
            checks:
              - preset: files-exist
                args: {files: [docs/a/final.md]}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, hld]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      status: failed
      files:
        docs/a/draft.md: "draft\n"
      output: {summary: the suite never ran, files: [docs/a/draft.md], rulesApplied: []}
  - read:
      db: ledger
      query: "SELECT id FROM attempts WHERE task_id = '${a}'"
      as: attempt
  - name: the host held its verify
    sql:
      db: ledger
      exec: "INSERT INTO events (at, kind, subject, data_json) VALUES (strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), 'verify-host-held', '${a}', json_object('attempt', '${attempt}'))"
  - starci: [workflow, step, hld]
    expect: {}
  - name: the harness keeps one patch before any Kernel decision
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.decision') || ':' || json_extract(data_json, '$.by') || ':' || json_extract(data_json, '$.cause') || ':' || (SELECT COUNT(*) FROM prior_work) FROM events WHERE kind = 'op-settled' AND subject = '${a}'"
        equals: ["keep:harness:host-held:1"]
  - assert:
      exists:
        path: ${project}/worktrees/hld.ops/${a}
        present: false
  - git: [rev-parse, --verify, --quiet, "refs/heads/starci/hld.ops/${a}"]
    expect:
      exit: 1
  - starci: [kernel, next, hld, --wait, "0"]
    expect:
      contains: '"kind": "red"'
    save:
      red: data.decision.id
      graph: data.digest.graphVersion
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: hld
        changes:
          - {op: retry, id: a}
  - file:
      path: cmd.yaml
      content: |
        schema: starci/command@1
        cmdId: k-hld-retry-1
        kind: workflow-change
        workflow: hld
        basedOn: {graph: ${graph}}
        answers: [${red}]
        route: failed-retries
        change: retry.yaml
  - starci: [kernel, submit, "${run}/cmd.yaml"]
  - starci: [workflow, step, hld]
    expect: {}
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a' AND id <> '${a}'"
      as: a2
  - name: the next attempt spends no try
    assert:
      sql:
        db: ledger
        query: "SELECT try_no FROM tasks WHERE id = '${a2}'"
        equals: [1]
  - name: it starts from the kept patch
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.outcome') FROM events WHERE kind = 'prior-applied' AND subject = '${a2}' ORDER BY id LIMIT 1"
        equals: [applied]
  - assert:
      exists:
        path: ${project}/worktrees/hld.ops/${a2}/docs/a/draft.md
        present: true
  - name: the next attempt finishes the work
    worker:
      task: ${a2}
      files:
        docs/a/final.md: "# a\n"
  - starci: [workflow, step, hld]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${a2}'"
        equals: [done]
  - assert:
      gitLog:
        grep: "Starci-Task: ${a2}"
        count: 1
  - name: once the next attempt settled (merged), the kept patch is deleted
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM prior_work) || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'prior-dropped' AND subject = '${a}')"
        equals: ["0:1"]
  - assert:
      exists:
        path: ${project}/worktrees/hld.ops/${a2}
        present: false
