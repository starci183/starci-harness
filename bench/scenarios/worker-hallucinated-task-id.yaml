schema: starci/scenario@1
id: worker-hallucinated-task-id
group: worker
title: a result for a task id the ledger never issued is refused
inject: task result t-deadbeef --status done
expect: refusal naming the unknown task; nothing written
pass:
  - exit 1 with a refusal code
  - no results row
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: ghost
        goal: bench workflow ghost
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - ghost
    save: {}
  - file:
      path: out.json
      content: '{"summary":"x","files":[],"rulesApplied":[]}'
  - starci:
      - task
      - result
      - t-deadbeef
      - --status
      - done
      - --output
      - "@${run}/out.json"
    expect:
      exit: 1
      ok: false
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM results
        equals:
          - 0
