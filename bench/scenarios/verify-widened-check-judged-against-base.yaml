schema: starci/scenario@1
id: verify-widened-check-judged-against-base
group: verify
title: "a change to hfs.json widens the scoped lint to whole packages; findings already on the branch are the base's, never the task's"
inject: >-
  a task of an inline workflow changes only the app-root hfs.json (a pattern declaration) while a front-end file on the branch
  already carries a lint finding; its check-run-green, run in the wave, widens to every package and meets that finding. Under
  fault new-finding the task also lands a file with a finding of its own
expect: >-
  the widened scoped check runs the same check at its base, finds the front-end finding there too (rule, file and message, line
  numbers aside), turns that step green and records the finding as baseline-findings evidence: the task is done on its first
  attempt and no try is spent. With a new finding of its own the back end's step stays red and the task alone is returned, the front-end finding still the base's
pass:
  - the task done on its first attempt, the wave green, a baseline-findings event naming the front-end finding
  - under new-finding, the wave red, the task returned for its own finding, the front-end finding still recorded as the base's
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
# The sides' eslint is a stand-in committed with the scratch app: it reports, in ESLint's stylish form, every line carrying
# BASELINE_ERROR or LINT_ERROR. Profile lib keeps the canon gate out of a stand-in app.
repo:
  files:
    package.json: '{"name": "bench-app", "version": "1.0.0", "private": true, "workspaces": ["be", "fe"]}'
    hfs.json: |
      {"hfs": 3, "kind": "app", "policy": "lib", "sides": {"be": {}, "fe": {"grammar": "core"}}}
    be/package.json: '{"name": "bench-be", "version": "1.0.0"}'
    be/eslint.config.js: "module.exports = []\n"
    be/src/main.ts: "export const main = 1\n"
    fe/package.json: '{"name": "bench-fe", "version": "1.0.0"}'
    fe/eslint.config.js: "module.exports = []\n"
    fe/src/page.ts: "export const page = 1\n\nexport const home = 2 // BASELINE_ERROR\n"
    node_modules/eslint/bin/eslint.js: |
      const { readFileSync } = require("node:fs")
      const { resolve } = require("node:path")
      let red = 0
      for (const file of process.argv.slice(2).filter((arg) => !arg.startsWith("--"))) {
        readFileSync(file, "utf8").split("\n").forEach((line, index) => {
          for (const code of ["BASELINE_ERROR", "LINT_ERROR"]) {
            if (!line.includes(code)) continue
            console.log(resolve(file))
            console.log(`  ${String(index + 1)}:1  error  ${code} found here  bench/${code.toLowerCase()}`)
            red++
          }
        })
      }
      process.exit(red === 0 ? 0 : 1)
faults:
  - new-finding
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: declare
        goal: declare a back-end pattern
        runner: inline
        tasks:
          - id: declare
            label: docs
            summary: declare the webhooks pattern
            allowPaths: [hfs.json, be/src/doors.ts]
            checks: [check-run-green]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, declare]
    save:
      task: data.nodes.0.task.id
  - unless: new-finding
    worker:
      task: ${task}
      files:
        hfs.json: |
          {"hfs": 3, "kind": "app", "policy": "lib", "sides": {"be": {"patterns": ["webhooks"]}, "fe": {"grammar": "core"}}}
  - when: new-finding
    worker:
      task: ${task}
      files:
        hfs.json: |
          {"hfs": 3, "kind": "app", "policy": "lib", "sides": {"be": {"patterns": ["webhooks"]}, "fe": {"grammar": "core"}}}
        be/src/doors.ts: "export const doors = 1 // LINT_ERROR\n"
  - name: step verifies the task, then the wave widens the lint, judges it against the base and stays green
    unless: new-finding
    starci: [workflow, step, declare]
  - name: step verifies the task, then the wave's widened lint is red on the task's own new finding alone
    when: new-finding
    starci: [workflow, step, declare]
    expect:
      exit: 1
      contains: "wave red"
  - unless: new-finding
    assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks"
        equals: [done]
  - name: "no try spent: one attempt, done"
    unless: new-finding
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) || ':' || SUM(outcome IS NOT NULL AND outcome <> 'done') FROM attempts"
        equals: ["1:0"]
  - unless: new-finding
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.verdict') FROM events WHERE kind = 'wave-verified'"
        equals: [green]
  - name: the base's finding is kept as baseline-findings evidence, line numbers aside
    unless: new-finding
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.steps[0].step') || ':' || json_extract(data_json, '$.steps[0].findings[0]') FROM events WHERE kind = 'baseline-findings' AND subject = '${task}'"
        equals: ["lint:fe/src/page.ts error BASELINE_ERROR found here bench/baseline_error"]
  - name: the wave returns the task for its own finding alone
    when: new-finding
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.returned') || ':' || json_array_length(data_json, '$.errors') FROM events WHERE kind = 'wave-verified'"
        equals: ['["${task}"]:0']
  - name: the front-end finding is still the base's, kept as evidence
    when: new-finding
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.steps[0].package') FROM events WHERE kind = 'baseline-findings' AND subject = '${task}'"
        equals: [bench-fe]
