schema: starci/scenario@1
id: seat-launch-waits-on-ram
group: resources
title: "a worker seat does not launch while free RAM is under the seat floor; its task stays queued and launches once there is room"
inject: "the seat RAM floor of an ops/ copy set above the host's free memory, then lowered"
expect: >-
  the Kernel's next routes the queued task, but the launch is refused SEAT_RAM_LOW before Orca is asked for a worker, which the
  step reports as a wait: the task stays queued and no worker starts; once the floor is under the free memory the next step
  launches it
pass:
  - no worker-start while the floor is above the free memory; the task stays queued
  - the launch happens once the floor is lowered
  - no human intervention beyond the injected fault
automation: automated
env:
  STARCI_OPS_DIR: ${repo}/ops
steps:
  - name: copy ops/ into the scratch repository
    write: { path: ops, from: "${ops}" }
  - name: the context file the docs op reads, from the harness checkout the copy stands in for
    write: { path: contexts/project/work.md, from: "${ops}/../contexts/project/work.md" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: ops copy"]
  - name: a seat floor above any host's free memory
    starci: [config, set, liveness.heavy.seatFreeMb, "100000000"]
  - git: [commit, -q, -am, "bench: seat floor"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: ram
        goal: one doc
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args: { files: [docs/a.md] }
  - boot:
      file: ${run}/wf.yaml
      workflow: ram
  - name: kernel next routes the task but the launch waits for memory
    seat: kernel:ram
    starci: [kernel, next, ram, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks"
        equals: [queued]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 0
  - name: the floor drops under the free memory
    starci: [config, set, liveness.heavy.seatFreeMb, "1"]
  - name: the next step launches it
    seat: kernel:ram
    starci: [kernel, next, ram, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 1
