schema: starci/scenario@1
id: change-stale-dependency-kernel-decides
group: change
title: "a dependency lands a different result: dependents become stale, never auto-cancelled"
inject: a is reworked and lands different content while b is done
expect: b is classified stale; the Kernel decides keep or redo; nothing is cancelled automatically
pass:
  - b stale in the classification
  - b's task untouched until a Kernel decision
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: "S1 replan reconcile: goal@n, goal-change, desired-graph reconcile with keep/continue/stale/rework/redo-live/drop"
manual:
  - chain done
  - amend edit a
  - work a with new content
  - step
  - assert b stale and a kernel decision pending
