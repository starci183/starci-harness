schema: starci/scenario@1
id: conflict-lease-overlap
group: conflict
title: "two live tasks over the same path: the second is refused LEASE_CONFLICT"
inject: task send twice, allowPaths docs and docs/a.md
expect: the second send refuses LEASE_CONFLICT and creates no task; the first keeps its lease
pass:
  - second send exits 1 with LEASE_CONFLICT
  - one task, one lease
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - starci:
      - contract
      - new
      - --label
      - docs
      - --summary
      - first
      - --allow
      - docs
      - --check
      - files-exist:files=docs/a.md
      - --out
      - ${run}/c1.json
  - starci:
      - contract
      - new
      - --label
      - docs
      - --summary
      - second
      - --allow
      - docs/a.md
      - --check
      - files-exist:files=docs/a.md
      - --out
      - ${run}/c2.json
  - starci:
      - task
      - send
      - ${run}/c1.json
  - starci:
      - task
      - send
      - ${run}/c2.json
    expect:
      exit: 1
      code: LEASE_CONFLICT
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks
        equals:
          - 1
