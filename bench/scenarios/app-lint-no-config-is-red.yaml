schema: starci/scenario@1
id: app-lint-no-config-is-red
group: verify
title: an app with source and no eslint config anywhere up to the root is red
inject: "every eslint.config.* removed from a tree whose apps hold source"
expect: >-
  the lint names LINT_CONFIG_MISSING for each package with source and exits red, in the changed-files mode and with --all
pass:
  - changed source with no config anywhere is red with LINT_CONFIG_MISSING
  - --all is red the same way
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch app\n"
    package.json: '{"name": "bench-app", "version": "1.0.0", "private": true, "workspaces": ["fe/apps/web", "fe/apps/landing"]}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "starci"}}}'
    fe/eslint.config.mjs: "export default []\n"
    fe/apps/web/package.json: '{"name": "bench-web", "version": "1.0.0"}'
    fe/apps/web/src/page.ts: "export const page = 1\n"
    fe/apps/landing/package.json: '{"name": "bench-landing", "version": "1.0.0"}'
    fe/apps/landing/src/home.ts: "export const home = 1\n"
    node_modules/eslint/bin/eslint.js: |
      console.log("linted")
      process.exit(0)
steps:
  - name: the only config is removed
    remove: fe/eslint.config.mjs
  - name: a web source file changes
    write:
      path: fe/apps/web/src/page.ts
      content: "export const page = 2\n"
  - name: the scoped lint is red and names the missing config
    starci: [check, lint, --base, HEAD]
    expect:
      exit: 1
      contains: LINT_CONFIG_MISSING
  - name: the whole-package lint is red for every app
    starci: [check, lint, --base, HEAD, --all]
    expect:
      exit: 1
      contains: LINT_CONFIG_MISSING
