schema: starci/scenario@1
id: change-noop-retry-early-cutoff
group: change
title: a retry upstream that lands the same result invalidates nothing downstream
inject: a and b done; a is retried and lands byte-identical content
expect: "early cutoff: b's identity hash is built from a's settled result, which did not change, so b is keep (no redo)"
pass:
  - plan diff classifies b keep
  - b's done task is not redone
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: cut
        goal: bench workflow cut
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
          - id: b
            label: docs
            summary: write doc b
            allowPaths:
              - docs/b.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/b.md
            dependsOn:
              - a
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - cut
    save:
      a: data.nodes.0.task.id
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
  - name: step
    starci:
      - workflow
      - step
      - cut
    save:
      b: data.nodes.1.task.id
  - name: worker files done
    worker:
      task: ${b}
      status: done
      files:
        docs/b.md: |
          # b
  - name: step
    starci:
      - workflow
      - step
      - cut
    save: {}
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: cut
        reason: bench retry
        changes:
          - op: retry
            id: a
  - name: plan diff
    starci:
      - plan
      - diff
      - cut
      - --to
      - ${run}/retry.yaml
    save:
      diff: data
  - starci:
      - workflow
      - amend
      - cut
      - --change
      - ${run}/retry.yaml
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT json_extract(value, '$.class') FROM graph_versions, json_each(classification_json) WHERE graph_version = 2 AND json_extract(value, '$.key') = 'b'
        equals:
          - keep
