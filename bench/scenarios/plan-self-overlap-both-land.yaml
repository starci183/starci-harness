schema: starci/scenario@1
id: plan-self-overlap-both-land
group: plan
title: "two independent tasks write one file: both run at once in their own worktrees and both land"
inject: tasks a and b both write docs/shared.md (a its first line, b its last), no dependsOn, maxParallel 2
expect: >-
  both tasks launch in the same step, each in its own Op worktree cut from the workflow branch and listed under the workflow's
  worktree in Orca; the first to verify lands, the second rebases onto it without a conflict and lands too; both Op worktrees
  are removed and their branches deleted once landed
pass:
  - two worker-starts in one step, each in a worktree of its own
  - both tasks done; one commit each on the workflow branch; docs/shared.md carries both edits
  - each Op worktree listed under the workflow's worktree in Orca, then removed through Orca; no Op branch left
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: docs/shared.md
      content: "first\nmiddle 1\nmiddle 2\nmiddle 3\nlast\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: the shared doc"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: self
        goal: bench workflow self
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: edit the first line of the shared doc
            allowPaths:
              - docs/shared.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/shared.md
          - id: b
            label: docs
            summary: edit the last line of the shared doc
            allowPaths:
              - docs/shared.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/shared.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: self
  - name: kernel next dispatches both
    seat: kernel:self
    starci: [kernel, next, self, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 2
  - assert:
      orcaCalls:
        command: worktree set
        match:
          display-name: '^\[Op\] self: '
        count: 2
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(DISTINCT worktree) FROM tasks WHERE workflow_id = 'self' AND worktree LIKE '%self.ops%'
        equals:
          - 2
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a'"
      as: a
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'b'"
      as: b
  - worker:
      task: ${a}
      files:
        docs/shared.md: "first by a\nmiddle 1\nmiddle 2\nmiddle 3\nlast\n"
  - worker:
      task: ${b}
      files:
        docs/shared.md: "first\nmiddle 1\nmiddle 2\nmiddle 3\nlast by b\n"
  - name: kernel next settles both
    seat: kernel:self
    starci: [kernel, next, self, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks WHERE workflow_id = 'self' ORDER BY plan_key
        equals:
          - done
          - done
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
        in: ${worktree.self}
  - assert:
      gitLog:
        grep: "Starci-Task: ${b}"
        count: 1
        in: ${worktree.self}
  - assert:
      exists:
        path: ${worktree.self}/docs/shared.md
        present: true
  - name: the workflow branch carries a's edit
    git: [-C, "${worktree.self}", grep, -q, "first by a", HEAD, --, docs/shared.md]
  - name: and b's
    git: [-C, "${worktree.self}", grep, -q, "last by b", HEAD, --, docs/shared.md]
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM events WHERE kind = 'op-worktree-removed' AND json_extract(data_json, '$.branch') = 'deleted'
        equals:
          - 2
  - assert:
      exists:
        path: ${project}/worktrees/self.ops/${a}
        present: false
  - assert:
      exists:
        path: ${project}/worktrees/self.ops/${b}
        present: false
  - assert:
      orcaCalls:
        command: worktree rm
        count: 2
