schema: starci/scenario@1
id: verify-flaky-test
group: verify
title: a check fails then passes on the same tree
inject: tests-pass command that fails on odd runs
expect: the trust tier records the flake; the verdict is reproducible or the task is marked flaky for the Kernel, never green-by-luck silently
pass:
  - check_runs shows both runs
  - verdict names flaky
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: S5 verification trust tiers
manual:
  - command that toggles a file
  - verify twice
  - assert flaky marker
