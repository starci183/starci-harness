schema: starci/scenario@1
id: scale-fanout-60-inline
group: scale
title: "sixty independent tasks: inline queues exactly one at a time"
inject: a workflow of 60 independent docs tasks under the inline runner
expect: define records 60 nodes; start queues one task and leases only its paths; nothing else holds a lease
pass:
  - 60 plan nodes at graph v1
  - exactly one ledger task and its one lease after start
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
