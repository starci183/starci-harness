schema: starci/scenario@1
id: needs-relay-command-baseline
group: needs
title: "a relay node's command check that is red exactly as at the relayed source's head is the source's red, recorded as inherited; a finding of its own stays red"
inject: >-
  workflow auth builds the shared client in two tasks: http, whose command check compares platform/http/client.md with a
  reference (green when it lands), and exports, which then adds an export line to the same file. The need's resolvers are both,
  so the relay carries both commits and is built on http's node with its command check, which is red at the source's own head.
  sub wrote its own client.md first, so the relay conflicts and becomes a relay node of sub
expect: >-
  the relay node's worker applies the source's file as it stands at the head: its command check is red with the one finding the
  head holds too, so the harness judges it at the head (a clean checkout of the last relayed commit), finds the same red, and the
  check is green with its detail naming the head; a baseline-findings event records the inherited finding; the relay node lands
  and the waiter is released. Under fault own-finding the worker keeps sub's line as well: that finding is not at the head, so
  the check stays red naming it
pass:
  - the relay node's command check green, its detail saying the red is the source's, judged at the head
  - one baseline-findings event on the relay task naming the head and the inherited finding
  - the relay node done and the waiter released
  - under own-finding, the command check red with the finding the head lacks, and no baseline-findings event
  - no human intervention beyond the injected fault
automation: automated
faults:
  - own-finding
# tools/same.js prints one line per line of the file that the reference lacks; the export line is the one the source's head holds.
repo:
  files:
    tools/reference.md: "# HttpClient\n"
    tools/same.js: |
      const { readFileSync } = require("node:fs")
      const file = process.argv[2]
      const reference = new Set(readFileSync("tools/reference.md", "utf8").split("\n"))
      const extra = readFileSync(file, "utf8").split("\n").filter((line) => line !== "" && !reference.has(line))
      for (const line of extra) console.log(`${file} has an extra line beyond the reference: ${line}`)
      process.exit(extra.length === 0 ? 0 : 1)
steps:
  - file:
      path: auth.yaml
      yaml:
        schema: starci/workflow@1
        id: auth
        goal: sign in, with the shared http client
        runner: orca
        maxParallel: 2
        tasks:
          - id: http
            label: docs
            summary: copy the reference http client
            allowPaths: [platform/http/client.md]
            checks:
              - check:
                  kind: command
                  run: [node, tools/same.js, platform/http/client.md]
          - id: exports
            label: docs
            summary: export the http client
            allowPaths: [platform/http/client.md]
            dependsOn: [http]
            checks:
              - preset: files-exist
                args: {files: [platform/http/client.md]}
  - file:
      path: sub.yaml
      yaml:
        schema: starci/workflow@1
        id: sub
        goal: premium subscription payments
        runner: orca
        maxParallel: 2
        tasks:
          - id: pay
            label: docs
            summary: write the payment rails doc
            allowPaths: [docs/pay.md]
            checks:
              - preset: files-exist
                args: {files: [docs/pay.md]}
          - id: own
            label: docs
            summary: write sub's own client
            allowPaths: [platform/http/client.md]
            checks:
              - preset: files-exist
                args: {files: [platform/http/client.md]}
  - boot:
      file: ${run}/auth.yaml
      workflow: auth
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - boot:
      file: ${run}/sub.yaml
      workflow: sub
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'http'"
      as: http
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'pay'"
      as: pay
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'own'"
      as: own
  - worker:
      task: ${http}
      files:
        platform/http/client.md: "# HttpClient\n"
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - name: http landed green on its command check
    assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${http}'"
        equals: [done]
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'exports'"
      as: exports
  - worker:
      task: ${exports}
      files:
        platform/http/client.md: "# HttpClient\nexport HttpClient\n"
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${exports}'"
        equals: [done]
  - worker:
      task: ${own}
      files:
        platform/http/client.md: "# sub client\n"
  - worker:
      task: ${pay}
      status: blocked
      output:
        summary: needs the shared http client
        files: []
        rulesApplied: []
        needs: [{key: "capability:platform.http", paths: [platform/http/client.md]}]
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - file:
      path: owner.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-http-by-auth
        kind: need-owner
        workflow: auth
        basedOn: {}
        need: {key: "capability:platform.http", resolver: [http, exports]}
  - seat: supervisor
    starci: [supervisor, submit, "${run}/owner.yaml"]
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - name: sub's step routes the conflicting relay as a relay node built on http's node
    seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'relay.capability-platform.http.r1'"
      as: relay
  - name: the relay node applies the source's file as it stands at the head
    unless: own-finding
    worker:
      task: ${relay}
      files:
        platform/http/client.md: "# HttpClient\nexport HttpClient\n"
  - name: the relay node keeps sub's line as well, a finding the head lacks
    when: own-finding
    worker:
      task: ${relay}
      files:
        platform/http/client.md: "# HttpClient\nexport HttpClient\n# sub client\n"
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - name: the wave runs the relay node's command check
    unless: own-finding
    starci: [workflow, wave, sub, --wait, "120"]
    expect: {}
  - name: the wave runs the relay node's command check, red on the relay's own finding
    when: own-finding
    starci: [workflow, wave, sub, --wait, "120"]
    expect: {exit: 1}
  - name: the inherited red is the source's, judged at its head
    unless: own-finding
    assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'relay-baseline:') > 0) FROM check_runs WHERE task_id = '${relay}' AND name LIKE 'check-%:command' ORDER BY rowid DESC LIMIT 1"
        equals: ["green:1"]
  - name: the inherited finding is recorded
    unless: own-finding
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'baseline-findings' AND subject = '${relay}' AND instr(data_json, 'export HttpClient') > 0 AND json_extract(data_json, '$.steps[0].step') = 'command'"
        equals: [1]
  - unless: own-finding
    assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${relay}'"
        equals: [done]
  - unless: own-finding
    assert:
      sql:
        db: machine
        query: "SELECT json_extract(release_json, '$.by') FROM shared_need_waiters"
        equals: [resolved]
  - name: a finding of the relay's own stays red, naming it
    when: own-finding
    assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, '1 of 2 finding(s) are not at') > 0) FROM check_runs WHERE task_id = '${relay}' AND name LIKE 'check-%:command' ORDER BY rowid DESC LIMIT 1"
        equals: ["red:1"]
  - when: own-finding
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'baseline-findings' AND subject = '${relay}'"
        equals: [0]
