schema: starci/scenario@1
id: change-reverted-ab-a
group: change
title: the owner changes a contract and changes it back before the rework lands
inject: edit a, then revert the edit
expect: the second graph's node hash equals v1's; a's original done result is kept (memoised), its rework cancelled
pass:
