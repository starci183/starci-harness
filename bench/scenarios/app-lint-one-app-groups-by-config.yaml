schema: starci/scenario@1
id: app-lint-one-app-groups-by-config
group: verify
title: a one-app repository lints its be and fe files each with its own side's config, and a changed file under no config is red
inject: "a one-app tree whose root package owns be/ (no package.json of its own) and holds no eslint config, with be/eslint.config.mjs and fe/eslint.config.mjs beside an unconfigured scripts/ folder"
expect: >-
  the root package's changed files are grouped by their nearest config and each group is linted from that config's
  folder; a changed root-level manifest widens to every file of every package without judging the unchanged unconfigured
  script; a changed file under no config up to the root is red with LINT_CONFIG_MISSING naming it
pass:
  - changed be and fe files lint green, each with its own config, and no LINT_CONFIG_MISSING at the root
  - an error in a be file is found through be/eslint.config.mjs
  - a widened lint counts the unchanged unconfigured script without turning red
  - a changed stray file with no config up to the root is red with LINT_CONFIG_MISSING naming it
  - no human intervention beyond the injected fault
automation: automated
# The ESLint stand-in refuses to run without an eslint.config.* in its working folder, refuses a path that leaves that
# folder (a file ESLint would judge with the wrong config) and reports a file holding LINT_ERROR.
repo:
  files:
    README.md: "# bench scratch one-app\n"
    package.json: '{"name": "bench-one-app", "version": "1.0.0", "private": true, "workspaces": ["fe/apps/*"]}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"be": {}, "fe": {"grammar": "starci"}}}'
    be/eslint.config.mjs: "export default []\n"
    be/src/lesson/lesson.service.ts: "export const lesson = 1\n"
    fe/eslint.config.mjs: "export default []\n"
    fe/apps/app/package.json: '{"name": "bench-fe-app", "version": "1.0.0"}'
    fe/apps/app/src/page.ts: "export const page = 1\n"
    scripts/tool.mjs: "export const tool = 1\n"
    node_modules/eslint/bin/eslint.js: |
      const { existsSync, readFileSync } = require("node:fs")
      const { join, resolve, relative, isAbsolute } = require("node:path")
      if (!["eslint.config.mjs", "eslint.config.js", "eslint.config.cjs", "eslint.config.ts"].some((f) => existsSync(join(process.cwd(), f)))) {
        console.log("eslint: no config in " + process.cwd())
        process.exit(2)
      }
      const files = process.argv.slice(2).filter((a) => !a.startsWith("--"))
      const outside = files.filter((f) => { const r = relative(process.cwd(), resolve(f)); return r.startsWith("..") || isAbsolute(r) })
      if (outside.length > 0) {
        console.log("eslint: " + outside.join(", ") + " is outside the config folder " + process.cwd())
        process.exit(2)
      }
      const bad = files.filter((f) => readFileSync(f, "utf8").includes("LINT_ERROR"))
      for (const f of bad) console.log(f + ": error LINT_ERROR")
      process.exit(bad.length === 0 ? 0 : 1)
steps:
  - name: a be file and an fe file change
    write:
      path: be/src/lesson/lesson.service.ts
      content: "export const lesson = 2\n"
  - write:
      path: fe/apps/app/src/page.ts
      content: "export const page = 2\n"
  - name: the be file is linted from be/ with its own config
    starci: [check, lint, --base, HEAD]
    expect:
      exit: 0
      contains: "config be/eslint.config.mjs, 1 file(s) linted"
  - name: the fe file is linted from fe/ with its own config
    starci: [check, lint, --base, HEAD]
    expect:
      exit: 0
      contains: "config fe/eslint.config.mjs, 1 file(s) linted"
  - name: an error in the be file is found through be/eslint.config.mjs
    write:
      path: be/src/lesson/lesson.service.ts
      content: "export const lesson = 3 // LINT_ERROR\n"
  - starci: [check, lint, --base, HEAD]
    expect:
      exit: 1
      contains: "error LINT_ERROR"
  - name: the error is fixed and the root manifest changes, widening to every file of every package
    write:
      path: be/src/lesson/lesson.service.ts
      content: "export const lesson = 4\n"
  - write:
      path: package.json
      content: '{"name": "bench-one-app", "version": "1.0.1", "private": true, "workspaces": ["fe/apps/*"]}'
  - name: the widened lint is green and counts the unchanged unconfigured script instead of judging it
    starci: [check, lint, --base, HEAD]
    expect:
      exit: 0
      contains: "1 unchanged file(s) under no eslint.config.*, not linted: scripts/tool.mjs"
  - name: a changed file under no config up to the root is red and named
    write:
      path: scripts/stray.ts
      content: "export const stray = 1\n"
  - starci: [check, lint, --base, HEAD]
    expect:
      exit: 1
      contains: "LINT_CONFIG_MISSING: no eslint.config.* in the folder of scripts/stray.ts"
