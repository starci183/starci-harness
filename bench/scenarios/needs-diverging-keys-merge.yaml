schema: starci/scenario@1
id: needs-diverging-keys-merge
group: needs
title: three Ops name one missing capability three ways; the reported path makes two of them one key, and needs merge folds the third
inject: "a reports capability:http-client with the path platform/http/client.ts, b reports capability:platform.http, c reports capability:httpclient with no path"
expect: >-
  the shared root platform/*/** names a's need capability:platform.http, so a and b join one need; c's spelling opens a second;
  a coordinator's needs merge folds it into the first, whose waiters then number three and closes the second's decision
pass:
  - a and b land on one key through the path's canonical slot
  - needs merge moves c's waiter, ends the other key merged and closes its decision
  - needs list --all shows the merged key
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: tri
        goal: bench workflow tri
        runner: inline
        tasks:
          - {id: a, label: docs, summary: write doc a, allowPaths: [docs/a.md], checks: [{preset: files-exist, args: {files: [docs/a.md]}}]}
          - {id: b, label: docs, summary: write doc b, allowPaths: [docs/b.md], checks: [{preset: files-exist, args: {files: [docs/b.md]}}]}
          - {id: c, label: docs, summary: write doc c, allowPaths: [docs/c.md], checks: [{preset: files-exist, args: {files: [docs/c.md]}}]}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, tri]
    save:
      a: data.nodes.0.task.id
  - name: a names its need by a path
    starci: [task, result, "${a}", --status, blocked, --output, '{"summary":"no http client","files":[],"rulesApplied":[]}', --needs, "capability:http-client", --paths, platform/http/client.ts, --rule, BE-INFRA-2]
  - starci: [workflow, step, tri]
    expect: {}
    save:
      b: data.nodes.1.task.id
  - worker:
      task: ${b}
      status: blocked
      output: {summary: no http client, files: [], rulesApplied: [], needs: ["capability:platform.http"]}
  - starci: [workflow, step, tri]
    expect: {}
    save:
      c: data.nodes.2.task.id
  - worker:
      task: ${c}
      status: blocked
      output: {summary: no http client, files: [], rulesApplied: [], needs: ["capability:httpclient"]}
  - starci: [workflow, step, tri]
    expect: {}
  - name: two keys; a and b share the canonical one
    assert:
      sql:
        db: machine
        query: "SELECT key || ':' || (SELECT COUNT(*) FROM shared_need_waiters w WHERE w.key = n.key) FROM shared_needs n ORDER BY key"
        equals: ["capability:httpclient:1", "capability:platform.http:2"]
  - assert:
      sql:
        db: machine
        query: "SELECT given_key FROM shared_need_waiters WHERE task_key = 'a'"
        equals: ["capability:http-client"]
  - name: a Kernel merges the third spelling into the kept key
    starci: [needs, merge, "capability:platform.http", "capability:httpclient"]
    env: {STARCI_ROLE: kernel}
  - assert:
      sql:
        db: machine
        query: "SELECT key || ':' || state || ':' || COALESCE(merged_into, '-') || ':' || (SELECT COUNT(*) FROM shared_need_waiters w WHERE w.key = n.key) FROM shared_needs n ORDER BY key"
        equals: ["capability:httpclient:merged:capability:platform.http:0", "capability:platform.http:routed:-:3"]
  - name: the merged key's decision is closed
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE kind = 'shared-need' AND answered_at IS NULL AND json_extract(evidence_json, '$.need') = 'capability:httpclient'"
        equals: [0]
  - name: needs show lists the three waiters of the kept key
    starci: [needs, show, "capability:platform.http"]
    expect:
      contains: '"taskKey": "c"'
  - name: needs list --all shows the merged key
    starci: [needs, list, --all]
    expect:
      contains: merged
