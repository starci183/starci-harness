schema: starci/scenario@1
id: wave-single-runner-install-cache
group: verify
title: "concurrent settling steps start exactly one wave; its checkout is gone after the run; the next wave links the cached install, no npm ci"
inject: "four `workflow step` calls of one inline workflow at once, each reaching the same due wave; then a second batch on the same lockfile"
expect: >-
  the first caller takes the workflow's wave lock and runs the one wave; every other caller is refused WAVE_RUNNING (a wait) or,
  arriving after it, finds nothing due, so one scope decision and one verdict are recorded; the wave's clean checkout is removed
  when it ends and git lists no clean-verify worktree; the first wave runs npm ci once and caches it, the second wave of the
  same lockfile links node_modules from the install cache without npm ci
pass:
  - exactly one wave-scope and one wave-verified event after four concurrent steps
  - no starci-verify worktree is listed once the wave ended
  - the first wave's install ran npm ci; the second wave's install was linked from the cache
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    .gitignore: "node_modules/\n"
    package.json: '{"name": "bench-wave", "version": "1.0.0", "private": true, "dependencies": {"eslint": "file:tools/eslint", "typescript": "file:tools/typescript"}}'
    package-lock.json: |
      {
        "name": "bench-wave",
        "version": "1.0.0",
        "lockfileVersion": 3,
        "requires": true,
        "packages": {
          "": {"name": "bench-wave", "version": "1.0.0", "dependencies": {"eslint": "file:tools/eslint", "typescript": "file:tools/typescript"}},
          "node_modules/eslint": {"resolved": "tools/eslint", "link": true},
          "node_modules/typescript": {"resolved": "tools/typescript", "link": true},
          "tools/eslint": {"version": "0.0.0"},
          "tools/typescript": {"version": "0.0.0"}
        }
      }
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "core"}}}'
    tsconfig.json: '{"compilerOptions": {"strict": true}, "include": ["src"]}'
    eslint.config.js: "module.exports = []\n"
    src/index.ts: "export const index = 1\n"
    tools/typescript/package.json: '{"name": "typescript", "version": "0.0.0"}'
    tools/typescript/bin/tsc: "process.exit(0)\n"
    tools/eslint/package.json: '{"name": "eslint", "version": "0.0.0"}'
    tools/eslint/bin/eslint.js: |
      const { readFileSync } = require("node:fs")
      const { resolve } = require("node:path")
      const bad = process.argv.slice(2).filter((a) => !a.startsWith("--") && readFileSync(a, "utf8").includes("LINT_ERROR"))
      for (const f of bad) console.log(resolve(f) + ": error LINT_ERROR bench/no-error")
      process.exit(bad.length === 0 ? 0 : 1)
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: wave
        goal: two batches of changes on one lockfile
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: add module a
            allowPaths: [src/a.ts]
            checks: [check-run-green]
          - id: b
            label: docs
            summary: add module b
            allowPaths: [src/b.ts]
            checks: [check-run-green]
          - id: c
            label: docs
            summary: add module c on top of b
            allowPaths: [src/c.ts]
            dependsOn: [b]
            checks: [check-run-green]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, wave]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      files:
        src/a.ts: "export const a = 1\n"
  - name: step verifies a and dispatches b, no wave yet
    starci: [workflow, step, wave]
    save:
      b: data.nodes.1.task.id
  - worker:
      task: ${b}
      files:
        src/b.ts: "export const b = 1\n"
  - name: b is verified alone, so the wave is due and nothing else is left to settle
    starci: [task, verify, "${b}"]
  - name: four settling steps at once reach the same due wave
    starci: [workflow, step, wave]
    parallel: 4
  - name: one wave ran, its scope written once
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM events WHERE kind = 'wave-scope') || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'wave-verified') || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'wave-judged')"
        equals: ["1:1:2"]
  - name: the first wave ran npm ci and cached it
    assert:
      sql:
        db: ledger
        query: "SELECT instr(data_json, 'npm ci ran') > 0 FROM events WHERE kind = 'wave-verified' ORDER BY id LIMIT 1"
        equals: [1]
  - name: no clean-verify worktree is left
    git: [worktree, list, --porcelain]
    save:
      listed: stdout
  - assert:
      sql:
        db: ledger
        query: "SELECT instr('${listed}', 'starci-verify-')"
        equals: [0]
  - name: the next step dispatches c
    starci: [workflow, step, wave]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'c'"
      as: c
  - worker:
      task: ${c}
      files:
        src/c.ts: "export const c = 1\n"
  - name: the second wave links the cached install
    starci: [workflow, step, wave]
  - assert:
      sql:
        db: ledger
        query: "SELECT instr(data_json, 'linked from the install cache') > 0 FROM events WHERE kind = 'wave-verified' ORDER BY id"
        equals: [0, 1]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows WHERE id = 'wave'"
        equals: [done]
