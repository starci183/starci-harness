schema: starci/scenario@1
id: supervisor-dispatch-check-preset-fixes-unfit
group: worker
title: a code worker with no behavioural check is refused CONTRACT_UNFIT naming --check; the same dispatch with --check tests-pass is fit
inject: "the Supervisor dispatches a back-end code job with no check of its own, then names an unknown preset, then follows the refusal's fix"
expect: >-
  supervisor dispatch on the code label with side be and no --check is refused CONTRACT_UNFIT before any worktree is made, and
  the refusal names its fix: --check with a behavioural preset and the --input its arguments take; --check with a preset
  ops/checks.yaml lacks is refused CONTRACT_UNKNOWN_PRESET; --check tests-pass --input command=... is fit, launches the worker,
  and its contract's checks.extend carries tests-pass
pass:
  - the first dispatch is refused CONTRACT_UNFIT and its text names --check tests-pass --input command=<command>
  - an unknown preset is refused CONTRACT_UNKNOWN_PRESET
  - the dispatch with --check tests-pass launches a worker whose contract carries it
  - no worker or task is made by a refused dispatch
  - no human intervention beyond the injected fault
automation: automated
steps:
  - name: boot the project's Supervisor
    boot: {}
  - name: a code job with no behavioural check is refused with its fix
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "fix the bench api", --input, side=be, --input, edition=lite, --allow, src/api.ts]
    expect:
      exit: 1
      code: CONTRACT_UNFIT
      contains: "--check tests-pass --input command=<command>"
  - name: an unknown preset is refused
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "fix the bench api", --input, side=be, --input, edition=lite, --allow, src/api.ts, --check, no-such-preset]
    expect:
      exit: 1
      code: CONTRACT_UNKNOWN_PRESET
  - name: neither refused dispatch launched a worker
    assert:
      orcaCalls:
        command: worker-start
        count: 0
  - name: the refusal's fix makes it fit
    seat: supervisor
    starci: [supervisor, dispatch, --brief, "fix the bench api", --input, side=be, --input, edition=lite, --allow, src/api.ts, --check, tests-pass, --input, "command=npm test"]
    expect:
      exit: 0
      contains: routed
    save:
      task: data.task
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(contract_json, '$.checks.extend[0].preset') || ':' || json_extract(contract_json, '$.input.extend.command') FROM tasks WHERE id = '${task}'"
        equals: ["tests-pass:npm test"]
