schema: starci/scenario@1
id: scale-50-ops
group: scale
title: "fifty Ops under one Kernel: the cap holds, nothing launches twice"
inject: 50 independent orca tasks at maxParallel 16 (the schema cap)
expect: one Kernel child Run, 16 worker-starts with 16 distinct request ids, 16 leases; 34 tasks wait without a ledger task
pass:
  - 16 distinct worker-start requests
  - one run-create
  - 16 running tasks, 16 leases
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: fifty
        goal: bench workflow fifty
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 16
        tasks:
          - id: o0
            label: docs
            summary: write doc o0
            allowPaths:
              - docs/o0.md
            checks:
