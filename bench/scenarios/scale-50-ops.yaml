      file: ${run}/wf.yaml
      workflow: fifty
  - name: kernel next dispatches
    seat: kernel:fifty
    starci: [kernel, next, fifty, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 16
        distinct: retry-request
  - assert:
      orcaCalls:
        command: run-create
        match:
          objective: "^StarCi workflow "
        count: 1
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks WHERE status = 'running'
        equals:
          - 16
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM leases
        equals:
          - 16
