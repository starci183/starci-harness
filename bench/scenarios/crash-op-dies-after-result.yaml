schema: starci/scenario@1
id: crash-op-dies-after-result
group: crash
title: "the Op process dies right after filing its result: the result still settles"
inject: worker files done, then Orca reports the worker exited before the step
expect: "the filed result is the truth: the step verifies it green and commits; the lost worker does not turn the reported task effect_unknown"
pass:
  - task done
  - one task commit
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: died
        goal: bench workflow died
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: died
  - name: kernel next dispatches
    seat: kernel:died
    starci: [kernel, next, died, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks ORDER BY rowid
      as: a
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
  - orca:
      worker:
        dispatch: "*"
        state: exited
  - sql:
      db: ledger
      exec: UPDATE seats SET started_at = '2020-01-01T00:00:00.000Z' WHERE role = 'worker'
  - name: kernel next
    seat: kernel:died
    starci: [kernel, next, died, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - done
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
        in: ${worktree.died}
