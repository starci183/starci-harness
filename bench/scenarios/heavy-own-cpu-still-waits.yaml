schema: starci/scenario@1
id: heavy-own-cpu-still-waits
group: resources
title: "a CPU the harness's own heavy commands burn still holds new ones back"
inject: >-
  the heavy rules of an ops/ copy set so the host's CPU average is always above maxCpuPercent, burned by a process the
  governor runs as one of its heavy commands (a running row of heavy_slots), with RAM to spare and a managed CPU floor of 1%;
  a check run queues behind it
expect: >-
  the managed share is at or above heavy.managedCpuFloorPercent, so the load is the harness's own and the ceiling holds the
  queue until it admitted nothing for cpuStarveMinutes, then the oldest fitting command starts; host load names that rule
pass:
  - host load says the load is the harness's own and names the starve rule
  - the check run exits 0 after waiting at least the starve time in the heavy queue
  - no human intervention beyond the injected fault
automation: automated
env:
  STARCI_OPS_DIR: ${repo}/ops
repo:
  files:
    package.json: '{"name": "bench-heavy-own", "version": "1.0.0", "private": true}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "core"}}}'
    tsconfig.json: '{"compilerOptions": {"strict": true}, "include": ["src"]}'
    eslint.config.js: "module.exports = []\n"
    src/index.ts: "export const index = 1\n"
    node_modules/typescript/bin/tsc: "setTimeout(() => process.exit(0), 1000)\n"
    node_modules/eslint/bin/eslint.js: "process.exit(0)\n"
steps:
  - name: copy ops/ into the scratch repository
    write: { path: ops, from: "${ops}" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: ops copy"]
  - name: RAM never holds a command back
    starci: [config, set, liveness.heavy.reserveMb, "0"]
  - name: a CPU ceiling no host is under
    starci: [config, set, liveness.heavy.maxCpuPercent, "0.0001"]
  - name: the queue counts as starved after three seconds with nothing admitted
    starci: [config, set, liveness.heavy.cpuStarveMinutes, "0.05"]
  - name: one busy core is at or above the floor on any host of up to a hundred cores
    starci: [config, set, liveness.heavy.managedCpuFloorPercent, "1"]
  - starci: [config, set, liveness.heavy.underForeignPressureSlots, "2"]
  - git: [commit, -q, -am, "bench: a CPU the harness burns"]
  - write: { path: src/changed.ts, content: "export const changed = 1\n" }
  - name: the governor's store exists
    starci: [host, load]
    expect: { exit: 0 }
  - name: a process that keeps a core busy
    serve: { stub: busy, as: burner }
  - name: the governor runs it as one of its heavy commands, and no managed reading predates it
    sql:
      db: machine
      exec: >-
        DELETE FROM managed_cpu_samples; DELETE FROM heavy_meta WHERE key = 'managed-cpu-claim-ms';
        INSERT INTO heavy_slots (id, pid, kind, label, cwd, state, at) VALUES ('bench-managed-burner', ${burner.token}, 'tsc',
        'bench managed burner', '${repo}', 'running', strftime('%Y-%m-%dT%H:%M:%fZ', 'now'))
  - name: host load names the harness's own load and the starve rule
    starci: [host, load]
    expect: { exit: 0, contains: "is the harness's own (managed" }
  - starci: [host, load]
    expect: { exit: 0, contains: "then the oldest fitting one does" }
  - name: a check run waits for the starve rule, then ends green
    starci: [check, run, --base, HEAD]
    expect: { exit: 0 }
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) >= 1 FROM host_events WHERE kind = 'heavy-wait' AND json_extract(data_json, '$.waitedMs') >= 2500"
        equals: [1]
