schema: starci/scenario@1
id: worktree-gc-retired-leftovers
group: lifecycle
title: "worktree gc removes the harness worktrees a retired project still holds, its work preserved first"
inject: >-
  a project retired before project retire removed worktrees (its ledger marked retired, nothing else done) still holds an Op
  worktree of a live-looking task with uncommitted work
expect: >-
  worktree gc --dry-run lists the leftover as due and changes nothing; worktree gc preserves its uncommitted work and removes
  it as project retire does, its branch kept, whatever its task's state, since no tick reaches a retired ledger
pass:
  - the dry run lists the leftover and removes nothing
  - the gc removes the leftover worktree and preserves its untracked file
  - the task's branch remains
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: old
        goal: bench workflow old
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: start, which cuts the task's Op worktree
    starci: [workflow, start, old]
    save:
      a: data.nodes.0.task.id
  - name: the abandoned task left uncommitted work
    write:
      path: ${project}/worktrees/old.ops/${a}/docs/a.md
      content: "# a, half written\n"
  - name: the project was retired before retire removed worktrees
    sql:
      db: machine
      exec: "UPDATE ledgers SET state = 'retired'"
  - name: the dry run lists the leftover
    starci: [worktree, gc, --dry-run]
    expect:
      contains: its project is retired
  - assert:
      exists:
        path: ${project}/worktrees/old.ops/${a}
        present: true
  - name: the gc removes it
    starci: [worktree, gc]
  - assert:
      exists:
        path: ${project}/worktrees/old.ops/${a}
        present: false
  - assert:
      exists:
        path: ${project}/preserved/gc-${a}/untracked/docs/a.md
        present: true
  - name: its branch keeps whatever it held
    git: [rev-parse, --verify, --quiet, "refs/heads/starci/old.ops/${a}"]
