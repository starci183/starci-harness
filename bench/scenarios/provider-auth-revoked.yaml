schema: starci/scenario@1
id: provider-auth-revoked
group: provider
title: "a provider's auth is revoked (org disabled): its circuit opens and the router routes around it"
inject: provider report claude --outcome auth
expect: claude is dropped at the hard filter with circuit open (auth); a claude-only bias is refused, never launched
pass:
  - route explain drops claude naming auth
  - --only claude refuses
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - starci:
      - provider
      - report
      - claude
      - --outcome
      - auth
      - --detail
      - organization disabled
  - starci:
      - route
      - explain
      - --label
      - code
    expect:
      exit: 0
      contains: circuit open (auth)
  - name: route claude
    starci:
      - route
      - explain
      - --label
      - code
      - --only
      - claude
    expect:
      exit: 1
