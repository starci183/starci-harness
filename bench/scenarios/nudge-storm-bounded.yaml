schema: starci/scenario@1
id: nudge-storm-bounded
group: orca
title: "a Kernel that answers each nudge and stalls again, under a storm of ticks: nudges stay bounded, then it is relaunched"
inject: >-
  the Kernel sits idle at its prompt with a ready node and calls kernel next only when nudged, then stalls again; three
  supervisor ticks run back to back each round, and five more run after the relaunch
expect: >-
  the ticks of a round claim one nudge between them (one terminal send per round, the claim is a transaction); after nudgeMax answered nudges the next stall gives
  the seat up (stall kind, no failure words from Orca) and relaunches the Kernel on another pool; the ticks after it type nothing
  more, so the whole run stays at nudgeMax prompts and two Kernel launches
pass:
  - two nudges in all, one per stall, whatever the number of ticks
  - one relaunch after the second stall, on another pool, with a stalled outcome and a stall strike for the first
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: storm
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: storm
  - read:
      db: ledger
      query: SELECT agent FROM seats WHERE role = 'kernel'
      as: kernel.agent
  - orca:
      set:
        tuiIdle:
          ${kernel.storm.terminal}: true
  - &quiet
    name: its last driver call was ten minutes ago
    sql:
      db: ledger
      exec: UPDATE seats SET lease_until = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '+5 minutes') WHERE role = 'kernel'
  - &tick
    name: a tick of the storm
    starci: [supervisor, tick]
  - *tick
  - *tick
  - assert:
      orcaCalls:
        command: terminal send
        count: 1
  - &answer
    name: the Kernel answers the nudge with one kernel next, then stops again
    sql:
      db: ledger
      exec: UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-15 minutes') WHERE kind = 'stall-nudged'
  - *quiet
  - *tick
  - *tick
  - *tick
  - assert:
      orcaCalls:
        command: terminal send
        count: 2
  - *answer
  - *quiet
  - name: the third stall gives the seat up
    starci: [supervisor, tick]
    expect:
      contains: stalled (stall)
  - starci: [supervisor, tick]
  - starci: [supervisor, tick]
  - starci: [supervisor, tick]
  - starci: [supervisor, tick]
  - starci: [supervisor, tick]
  - assert:
      orcaCalls:
        command: terminal send
        count: 2
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\]'
        count: 2
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(DISTINCT agent) FROM seats WHERE role = 'kernel'
        equals: [2]
  - assert:
      sql:
        db: machine
        query: "SELECT status || ':' || failure_kind FROM provider_health WHERE provider = '${kernel.agent}'"
        equals: ["striking:stall"]
  - assert:
      sql:
        db: machine
        query: "SELECT class FROM member_outcomes WHERE label = 'kernel'"
        equals: ["stalled"]
