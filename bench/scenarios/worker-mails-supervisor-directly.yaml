schema: starci/scenario@1
id: worker-mails-supervisor-directly
group: messaging
title: an Op tries to mail the Supervisor or the owner
inject: an Op submits an escalation addressed to the Supervisor
expect: "refused: an Op mails only its Kernel (role and sender checked against the Run tree)"
pass:
  - refusal ROLE_REFUSED or SENDER_REFUSED
  - no message row to the Supervisor
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: S4 mail commands (result/escalation/handoff through submit, Orca check/send only wakes)
manual:
  - STARCI_ROLE=op submit escalation to supervisor
  - assert refused
