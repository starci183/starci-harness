schema: starci/scenario@1
id: workflow-blocked-keeps-dispatching
group: conflict
title: "a workflow blocked on one returned task still dispatches its other ready tasks; one waiting on another task's lease says so"
inject: >-
  a task outside the workflow holds docs/shared.md; the workflow's task x comes back blocked while its independent task y needs
  docs/shared.md
expect: >-
  the workflow is blocked by x, and the status of y names the lease it waits for and the task holding it instead of reading as
  dispatchable; once the holder is cancelled, the next kernel next launches y although the workflow is still blocked
pass:
  - y ready with a why naming docs/shared.md and the holding task while the lease is held
  - an [Op] worker-start for y after the holder is cancelled, the workflow still blocked by x
  - no human intervention beyond the injected lease
automation: automated
steps:
  - file:
      path: holder.json
      content: |
        {"schema": "starci/contract@2", "label": "docs", "context": {"revision": "HEAD", "allowPaths": ["docs/shared.md"]}, "input": {"summary": "hold the shared doc"}, "budget": {"minutes": 60, "tries": 3}}
  - name: a task outside the workflow takes the shared path
    starci: [task, send, "${run}/holder.json"]
    save:
      holder: data.task
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: pair
        goal: write doc x and the shared doc
        runner: orca
        maxParallel: 2
        tasks:
          - id: x
            label: docs
            summary: write doc x
            allowPaths: [docs/x.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/x.md]
          - id: y
            label: docs
            summary: write the shared doc
            allowPaths: [docs/shared.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/shared.md]
  - name: boot the workflow
    boot:
      file: ${run}/wf.yaml
      workflow: pair
  - name: kernel next launches x; y waits on the lease
    seat: kernel:pair
    starci: [kernel, next, pair, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE workflow_id = 'pair' AND plan_key = 'x'"
      as: x
  - name: x comes back blocked
    worker:
      task: ${x}
      status: blocked
      output: {summary: "blocked on something outside the contract", files: [], rulesApplied: []}
  - name: kernel next steps the workflow, now blocked by x
    seat: kernel:pair
    starci: [kernel, next, pair, --wait, "0"]
  - name: the status names the lease y waits for
    starci: [workflow, status, pair]
    expect:
      contains: "waits for the lease on docs/shared.md: task ${holder}"
  - name: the holder ends
    starci: [task, cancel, "${holder}"]
  - name: kernel next dispatches y although the workflow is blocked
    seat: kernel:pair
    starci: [kernel, next, pair, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\] docs \(.+\) - write the shared doc$'
        count: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows WHERE id = 'pair'"
        equals: [blocked]
