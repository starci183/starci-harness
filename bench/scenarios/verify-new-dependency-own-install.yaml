schema: starci/scenario@1
id: verify-new-dependency-own-install
group: verify
title: a task that adds a dependency to package.json and the lockfile resolves it in its Op worktree, its verify and its wave, while the base's install is cached
inject: >-
  the install cache holds the base lockfile's install (a first task's wave cached it) and the second task's Op worktree is given
  it; that task adds a dependency (a workspace package) to package.json and package-lock.json and checks that it resolves
expect: >-
  the install cache key covers every install input (the lockfile and each manifest it installs), so the changed lockfile is never
  served the base's entry: the worker's dry replay in its Op worktree finds the base install no longer satisfies the worktree's
  lockfile, replaces it by npm ci of its own inputs (recorded op-install-refreshed) and resolves the new dependency green; the
  settling verify and the wave install the candidate's own lockfile and are green too
pass:
  - the dry replay in the Op worktree is green and resolves the new dependency
  - the Op worktree's install was replaced by npm ci of its own lockfile, not served the base's cache entry
  - the settling verify and the wave that follows are green, and the workflow is done
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    .gitignore: "node_modules/\n"
    package.json: '{"name": "bench-dep", "version": "1.0.0", "private": true, "workspaces": ["packages/*"]}'
    packages/util/package.json: '{"name": "@bench/util", "version": "1.0.0", "main": "index.js"}'
    packages/util/index.js: "module.exports = 'util'\n"
    check.js: |
      if (require("@bench/util") !== "util") process.exit(1)
      console.log("resolved @bench/util")
    package-lock.json: |
      {
        "name": "bench-dep",
        "version": "1.0.0",
        "lockfileVersion": 3,
        "requires": true,
        "packages": {
          "": { "name": "bench-dep", "version": "1.0.0", "workspaces": ["packages/*"] },
          "node_modules/@bench/util": { "resolved": "packages/util", "link": true },
          "packages/util": { "name": "@bench/util", "version": "1.0.0" }
        }
      }
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: newdep
        goal: a doc, then a new dependency the code resolves
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: tests-pass
                args: { command: "node check.js" }
          - id: b
            label: docs
            summary: add the extra dependency and resolve it
            allowPaths: [package.json, package-lock.json, packages/extra, extra-check.js]
            dependsOn: [a]
            checks:
              - preset: tests-pass
                args: { command: "node extra-check.js" }
  - file:
      path: contract.json
      content: >-
        {"schema": "starci/contract@2", "label": "docs", "context": {"revision": "HEAD", "allowPaths": ["package.json", "package-lock.json", "packages/extra", "extra-check.js"]},
        "input": {"summary": "add the extra dependency and resolve it"}, "budget": {"minutes": 10, "tries": 1},
        "checks": {"extend": [{"preset": "tests-pass", "args": {"command": "node extra-check.js"}}]}}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, newdep]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      files:
        docs/a.md: "# a\n"
  - name: step verifies a and runs its wave, which caches the base lockfile's install; b's Op worktree is given it
    starci: [workflow, step, newdep]
    save:
      b: data.nodes.1.task.id
  - read:
      db: ledger
      query: "SELECT worktree FROM tasks WHERE id = '${b}'"
      as: wt
  - name: the worker adds the dependency to package.json and the lockfile, and a check that resolves it
    worker:
      task: ${b}
      files:
        package.json: '{"name": "bench-dep", "version": "1.0.0", "private": true, "workspaces": ["packages/*"], "dependencies": {"@bench/extra": "1.0.0"}}'
        packages/extra/package.json: '{"name": "@bench/extra", "version": "1.0.0", "main": "index.js"}'
        packages/extra/index.js: "module.exports = 'extra'\n"
        extra-check.js: |
          if (require("@bench/extra") !== "extra") process.exit(1)
          console.log("resolved @bench/extra")
        package-lock.json: |
          {
            "name": "bench-dep",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": { "name": "bench-dep", "version": "1.0.0", "workspaces": ["packages/*"], "dependencies": { "@bench/extra": "1.0.0" } },
              "node_modules/@bench/extra": { "resolved": "packages/extra", "link": true },
              "node_modules/@bench/util": { "resolved": "packages/util", "link": true },
              "packages/extra": { "name": "@bench/extra", "version": "1.0.0" },
              "packages/util": { "name": "@bench/util", "version": "1.0.0" }
            }
          }
  - name: the worker's dry replay in its Op worktree resolves the new dependency
    starci: [task, verify, "${b}", --contract, "${run}/contract.json"]
    cwd: ${wt}
    expect:
      exit: 0
      contains: "resolved @bench/extra"
  - name: the Op worktree's install was made by npm ci of its own lockfile, never served the base's cache entry
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.reused') || ':' || json_extract(data_json, '$.exitCode') FROM events WHERE kind = 'op-install-refreshed' AND subject = '${b}'"
        equals: ["0:0"]
  - name: step verifies b on a clean checkout of its candidate and runs its wave
    starci: [workflow, step, newdep]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows WHERE id = 'newdep'"
        equals: [done]
  - name: every tests-pass run, the waves' included, was green
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE name = 'tests-pass' AND status <> 'green'"
        equals: [0]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'wave-verified' AND instr(data_json, '\"verdict\":\"green\"') > 0"
        equals: [2]
