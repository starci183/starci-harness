schema: starci/scenario@1
id: orca-restarted-handles-invalid
group: upgrade
title: Orca restarts and every terminal handle and dispatch is unknown to it
inject: worker-show answers dispatch_not_found for every dispatch, terminal list is empty
expect: running tasks turn effect_unknown (lost) with Orca's typed word; the Kernel terminal is recreated with run-use; nothing is relaunched without a decision
pass:
  - no worker-start until the Kernel decides
  - Kernel terminal recreated once
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: semi
pending: a live Orca beside the bench (semi)
manual:
  - restart Orca during a run
  - workflow step
  - seat list --live
