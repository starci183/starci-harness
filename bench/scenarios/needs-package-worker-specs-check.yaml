schema: starci/scenario@1
id: needs-package-worker-specs-check
group: needs
title: a package need's [Worker] carries its package's own specs as its behavioural check and reads the package contexts, with no caller input; pkg test runs those specs where the edit is
inject: >-
  an Op files blocked --needs package:@starci/demo; the Supervisor dispatches the package fix on the default code label with
  nothing but the need and the brief (no --check, no side); a scratch harness holds packages/demo with a node:test spec
expect: >-
  the dispatch is fit and launches: its contract's input names the package with side package and edition harness, and its
  checks.extend carries package-specs; pkg test @starci/demo finds this app's package edit worktree that changes the package,
  runs its specs there green, and turns red with exit 1 once a spec fails
pass:
  - supervisor dispatch --need of a package need on the code label is never refused CONTRACT_UNFIT
  - the worker's contract carries package-specs and side package
  - pkg test runs the package's specs in the package edit worktree, green then red
  - "no step without evidence: every state change in the ledger has its event"
  - no human intervention beyond the injected fault
automation: automated
repos:
  harness:
    files:
      .gitignore: ".claude/\n"
      packages/demo/package.json: '{"name": "@starci/demo", "version": "1.0.0", "type": "module", "scripts": {"test": "node --test"}}'
      packages/demo/index.mjs: "export const add = (left, right) => left + right\n"
      packages/demo/add.test.mjs: "import test from \"node:test\"\nimport assert from \"node:assert/strict\"\nimport { add } from \"./index.mjs\"\n\ntest(\"adds\", () => assert.equal(add(1, 2), 3))\n"
steps:
  - name: boot the project's Supervisor
    boot: {}
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: screen
        goal: bench workflow screen
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write the screen doc, which uses the demo package
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args: {files: [docs/a.md]}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, screen]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      status: blocked
      output:
        summary: the demo package lacks subtract
        files: []
        rulesApplied: []
        needs: [{key: "package:@starci/demo", note: "subtract is missing from @starci/demo"}]
  - starci: [workflow, step, screen]
    expect: {}
  - name: the Supervisor gives the package need to a code worker with the need and the brief alone
    seat: supervisor
    starci: [supervisor, dispatch, --need, "package:@starci/demo", --brief, "add subtract to @starci/demo"]
    expect:
      exit: 0
      contains: '"need": "package:@starci/demo"'
    save:
      task: data.task
  - name: its contract carries the package's specs and reads the package contexts
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(contract_json, '$.checks.extend[0].preset') || ':' || json_extract(contract_json, '$.input.base.side') || ':' || json_extract(contract_json, '$.input.base.edition') || ':' || json_extract(contract_json, '$.input.extend.package') FROM tasks WHERE id = '${task}'"
        equals: ["package-specs:package:harness:@starci/demo"]
  - name: the worker cuts its package edit branch
    starci: [pkg, branch, demo-subtract, --harness, "${repo.harness}"]
    expect:
      exit: 0
    save:
      worktree: data.worktree
  - write:
      path: ${worktree}/packages/demo/index.mjs
      content: "export const add = (left, right) => left + right\nexport const subtract = (left, right) => left - right\n"
  - git: [-C, "${worktree}", commit, -q, -am, "demo: subtract"]
  - name: the package's specs run green in the package edit worktree
    starci: [pkg, test, "@starci/demo", --harness, "${repo.harness}"]
    expect:
      exit: 0
      contains: '"verdict": "green"'
  - write:
      path: ${worktree}/packages/demo/subtract.test.mjs
      content: "import test from \"node:test\"\nimport assert from \"node:assert/strict\"\nimport { subtract } from \"./index.mjs\"\n\ntest(\"subtracts\", () => assert.equal(subtract(3, 1), 1))\n"
  - git: [-C, "${worktree}", add, packages/demo/subtract.test.mjs]
  - git: [-C, "${worktree}", commit, -q, -m, "demo: a failing subtract spec"]
  - name: a failing spec turns the check red
    starci: [pkg, test, "@starci/demo", --harness, "${repo.harness}"]
    expect:
      exit: 1
      contains: '"verdict": "red"'
