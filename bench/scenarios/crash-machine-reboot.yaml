schema: starci/scenario@1
id: crash-machine-reboot
group: crash
title: the machine reboots mid-run
inject: power cycle with three Ops running and one verify in progress
expect: after reboot Orca's handles are new; every running task is effect_unknown until Orca's word; the verifying task returns to reported with no try spent; nothing is redone that git shows landed
pass:
  - no duplicate commit
  - no task lost
  - no relaunch before Orca answers
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: manual
pending: a person at the machine (manual)
manual:
  - start an orca workflow with 3 Ops
  - reboot during a verify
  - start Orca
  - run workflow step
  - read workflow status and git log
