schema: starci/scenario@1
id: acc-2-crash-continue-same-worktree
group: acceptance
title: "owner acceptance 2: the Kernel crashes mid-run; the relaunched Kernel continues in the same worktree and Run, nothing redone"
inject: after task a landed and task b's Op is half-way, the Kernel's terminal disappears and Orca reports its worker exited; its lease and the progress clock lapse
expect: >-
  supervisor next relaunches the Kernel on Orca's word into the Supervisor's Run, in the workflow's one worktree; the new
  Kernel attach takes the child Run back with run-use; b's Op, still alive, files its result; the new Kernel's kernel next
  settles it in the same worktree on top of a's commit; a is never redone
pass:
  - two Kernel launches, every launch (Kernel and Op) in the one worktree
  - one child Run, taken back by run-use
  - a done with one attempt and one commit; b done with one attempt, its commit after a's on the workflow branch
  - the done decision returned to the new Kernel
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: crash2
        goal: write docs a then b
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
          - id: b
            label: docs
            summary: write doc b
            dependsOn: [a]
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/b.md]
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: crash2
  - name: kernel next launches a
    seat: kernel:crash2
    starci: [kernel, next, crash2, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a'"
      as: a
  - worker:
      task: ${a}
      files:
        docs/a.md: "# a\n"
  - name: kernel next settles a and launches b
    seat: kernel:crash2
    starci: [kernel, next, crash2, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'b'"
      as: b
  - read:
      db: ledger
      query: SELECT kernel_run_id FROM workflows
      as: krun
  - name: b's Op writes half its work in the worktree
    write:
      path: ${worktree.crash2}/docs/b.md
      content: "# b, half\n"
  - name: the Kernel crashes
    orca:
      terminal:
        handle: ${kernel.crash2.terminal}
        live: false
      worker:
        dispatch: kernel
        state: exited
  - name: its lease and the progress clock lapse
    sql:
      db: ledger
      exec: >-
        UPDATE seats SET lease_until = '2020-01-01T00:00:00.000Z' WHERE role = 'kernel';
        UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-25 minutes')
  - name: supervisor next relaunches the Kernel
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
  - name: the new Kernel attaches
    boot:
      adopt: crash2
  - name: b's Op finishes and files its result
    worker:
      task: ${b}
      files:
        docs/b.md: "# b\n"
  - name: the new Kernel settles b and returns done
    seat: kernel:crash2
    starci: [kernel, next, crash2, --wait, "0"]
    expect:
      contains: '"kind": "done"'
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] crash2$'
        count: 2
        distinct: retry-request
  - assert:
      orcaCalls:
        command: worker-start
        count: 1
        distinct: worktree
  - assert:
      orcaCalls:
        command: run-create
        match:
          objective: "^StarCi workflow crash2"
        count: 1
        distinct: retry-request
  - assert:
      orcaCalls:
        command: run-use
        match:
          id: "^${krun}$"
        min: 1
  - assert:
      sql:
        db: ledger
        query: SELECT t.plan_key || ':' || t.status || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id) FROM tasks t ORDER BY t.plan_key
        equals: ["a:done:1", "b:done:1"]
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM seats WHERE role = 'kernel'
        equals: [2]
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
        in: ${worktree.crash2}
  - assert:
      gitLog:
        grep: "Starci-Task: ${b}"
        count: 1
        in: ${worktree.crash2}
  - assert:
      gitHas:
        path: docs/a.md
        present: true
        in: ${worktree.crash2}
