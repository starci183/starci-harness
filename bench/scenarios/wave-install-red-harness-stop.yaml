schema: starci/scenario@1
id: wave-install-red-harness-stop
group: verify
title: "a wave whose install is red while no task changed a file an install reads stops on the harness: one ticket, no task returned, no try spent"
inject: >-
  two independent docs tasks of an inline workflow, each leaving a command check that needs the install, on a repository whose
  committed package.json requires a file dependency its lockfile lacks, so npm ci is red before any task works
expect: >-
  the wave's install is red and neither task landed package.json, package-lock.json, npm-shrinkwrap.json or .npmrc: the wave
  reaches no verdict (VERIFY_INFRA), records wave-infra, opens one harness-defect ticket coded INSTALL_RED_HARNESS, and returns,
  fails and revives no task, both staying done at try 1 with the wave still due; a second step repeats on the same ticket; once
  the owner fixes the manifest the next step runs the wave green and the workflow is done, every task still at try 1
pass:
  - the red install fails, returns and revives no task, and no wave-verified is recorded while it is red
  - one harness-defect ticket coded INSTALL_RED_HARNESS, its repeat landing on it
  - the fixed install turns the wave green with no try spent
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    .gitignore: "node_modules/\n"
    package.json: '{"name": "bench-install-red", "version": "1.0.0", "private": true, "dependencies": {"absent": "file:./absent"}}'
    package-lock.json: '{"name": "bench-install-red", "version": "1.0.0", "lockfileVersion": 3, "requires": true, "packages": {"": {"name": "bench-install-red", "version": "1.0.0"}}}'
    check.js: "console.log('the install is in place')\n"
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: red
        goal: two docs whose check needs the install
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: tests-pass
                args: { command: "node check.js" }
          - id: b
            label: docs
            summary: write doc b
            allowPaths: [docs/b.md]
            checks:
              - preset: tests-pass
                args: { command: "node check.js" }
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, red]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      files:
        docs/a.md: "# a\n"
  - name: step verifies a and dispatches b, no wave yet
    starci: [workflow, step, red]
    save:
      b: data.nodes.1.task.id
  - worker:
      task: ${b}
      files:
        docs/b.md: "# b\n"
  - name: step verifies b, then the wave stops on the red install
    starci: [workflow, step, red]
    expect:
      contains: VERIFY_INFRA
  - name: both tasks stay done at try 1; nothing was returned, failed or revived
    assert:
      sql:
        db: ledger
        query: "SELECT plan_key || ':' || status || ':' || try_no FROM tasks ORDER BY plan_key"
        equals: ["a:done:1", "b:done:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM events WHERE kind IN ('wave-returned', 'wave-judged', 'wave-verified', 'task-revived')) || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'wave-infra' AND instr(data_json, 'harness-defect ticket') > 0)"
        equals: ["0:1"]
  - name: one harness-defect ticket names the cause
    assert:
      sql:
        db: machine
        query: "SELECT kind || ':' || state || ':' || occurrences FROM tickets"
        equals: ["harness-defect:open:1"]
  - name: a second step stops the same way and repeats on that ticket
    starci: [workflow, step, red]
    expect:
      contains: VERIFY_INFRA
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) || ':' || MAX(occurrences) FROM tickets"
        equals: ["1:2"]
  - name: the owner fixes the manifest
    write:
      path: package.json
      content: '{"name": "bench-install-red", "version": "1.0.0", "private": true}'
  - git: [commit, -am, "fix the manifest"]
  - name: the next step runs the wave green
    starci: [workflow, step, red]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.verdict') FROM events WHERE kind = 'wave-verified'"
        equals: [green]
  - assert:
      sql:
        db: ledger
        query: "SELECT plan_key || ':' || status || ':' || try_no FROM tasks ORDER BY plan_key"
        equals: ["a:done:1", "b:done:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows WHERE id = 'red'"
        equals: [done]
