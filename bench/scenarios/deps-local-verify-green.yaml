schema: starci/scenario@1
id: deps-local-verify-green
group: verify
title: an app in local package mode verifies green against the local package, and npm mode restores the published one
inject: >-
  a one-app tree pinning @starci/tsconfig 2.1.0 whose test passes only when the installed base.json carries a setting the
  published 2.1.0 lacks; the local package folder (bench/fixtures/deps-source/ahead) holds that setting under the same version
expect: >-
  deps source --local copies the folder's publishable files over node_modules/@starci/tsconfig with its marker and leaves
  package.json and package-lock.json untouched; a task verified on a clean checkout of HEAD re-applies the copy after npm ci
  and goes green; the push gate refuses DEPS_LOCAL_AHEAD while the copy differs from the published tarball; deps source --npm
  runs npm ci and the marker is gone (reads the public registry)
pass:
  - local mode resolves @starci/tsconfig to the folder, the committed files unchanged
  - the clean verify applies local mode and the task is done
  - the push gate refuses DEPS_LOCAL_AHEAD
  - npm mode restores the published package
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench deps app\n"
    .npmrc: "legacy-peer-deps=true\n"
    hfs.json: '{"hfs": 3, "kind": "app", "edition": "lite", "policy": "lib"}'
    package.json: '{"name": "bench-deps-app", "version": "1.0.0", "private": true, "scripts": {"test": "node check-local.cjs"}, "devDependencies": {"@starci/tsconfig": "2.1.0"}}'
    package-lock.json: '{"name": "bench-deps-app", "version": "1.0.0", "lockfileVersion": 3, "requires": true, "packages": {"": {"name": "bench-deps-app", "version": "1.0.0", "devDependencies": {"@starci/tsconfig": "2.1.0"}}, "node_modules/@starci/tsconfig": {"version": "2.1.0", "resolved": "https://registry.npmjs.org/@starci/tsconfig/-/tsconfig-2.1.0.tgz", "integrity": "sha512-8nAgp5BdEWrQVFVWhvLh3ucU9Jfu7JhY5V9m1daLkRehQSmNsHVlAQ+2BuvtQHfomfbtybFT4/IwZCnsxp4Wiw==", "dev": true, "license": "MIT", "peerDependencies": {"typescript": ">=5.0.0"}}}}'
    .gitignore: "node_modules/\n"
    check-local.cjs: |
      const base = require("node:fs").readFileSync("node_modules/@starci/tsconfig/base.json", "utf8")
      console.log(base.includes("verbatimModuleSyntax") ? "the local tsconfig is installed" : "the published tsconfig is installed")
      process.exit(base.includes("verbatimModuleSyntax") ? 0 : 1)
steps:
  - name: npm mode installs the published package
    starci: [deps, source, --npm]
    expect:
      exit: 0
      contains: "\"mode\": \"npm\""
  - name: local mode copies the folder over the installed package
    starci: [deps, source, --local, --from, "${ops}/../bench/fixtures/deps-source/ahead", --prebuilt]
    expect:
      exit: 0
      contains: "\"targets\": ["
  - assert:
      exists:
        path: node_modules/@starci/tsconfig/.starci-local.json
        present: true
  - assert:
      gitClean: true
  - name: the status names the folder
    starci: [deps, source]
    expect:
      exit: 0
      contains: "\"mode\": \"local\""
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: local
        goal: bench workflow verifies against the local package
        runner: inline
        tasks:
          - id: note
            label: docs
            summary: add a note the test does not read
            allowPaths:
              - docs
            checks:
              - preset: tests-pass
                args:
                  command: npm test
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, local]
    save:
      note: data.nodes.0.task.id
  - name: the note is written
    worker:
      task: ${note}
      status: done
      files:
        docs/note.md: "# note\n"
  - name: step verifies it on a clean checkout
    starci: [workflow, step, local]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE name = 'install' AND status = 'green' AND detail LIKE '%local package sources%'"
        equals:
          - 1
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - done
  - name: the push gate refuses a copy no published version holds
    starci: [deps, check]
    expect:
      exit: 1
      code: DEPS_LOCAL_AHEAD
  - name: npm mode restores the published package
    starci: [deps, source, --npm]
    expect:
      exit: 0
      contains: "\"mode\": \"npm\""
  - assert:
      exists:
        path: node_modules/@starci/tsconfig/.starci-local.json
        present: false
