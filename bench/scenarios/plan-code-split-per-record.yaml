schema: starci/scenario@1
id: plan-code-split-per-record
group: plan
title: one code task over several impl records is refused; one task per record fans out in parallel
inject: three back-end impl records of one feature; one plan codes all three in a single task, the next cuts one code task per record
expect: >-
  define refuses TASK_NOT_SPLIT naming the three records; the plan with one code task per record (disjoint allowPaths, no
  dependency between them) is recorded, and the Kernel's first dispatch launches the three code Ops together
pass:
  - the single code task over three records is refused TASK_NOT_SPLIT naming each record
  - the split plan is recorded and its three code tasks launch at once
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: be, name: api}
    .starciwork/features/shop/impl/api/orders/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.api.orders
      title: the orders slice
      state: todo
      activity: idle
      repository: api
      owners:
        - {role: be, path: api/src/orders}
      proves: []
    .starciwork/features/shop/impl/api/payments/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.api.payments
      title: the payments slice
      state: todo
      activity: idle
      repository: api
      owners:
        - {role: be, path: api/src/payments}
      proves: []
    .starciwork/features/shop/impl/api/refunds/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.api.refunds
      title: the refunds slice
      state: todo
      activity: idle
      repository: api
      owners:
        - {role: be, path: api/src/refunds}
      proves: []
steps:
  - file:
      path: one.yaml
      content: |
        schema: starci/workflow@1
        id: one
        goal: build the orders, payments and refunds slices
        runner: orca
        maxParallel: 10
        tasks:
          - id: code
            label: code
            summary: build the three slices
            allowPaths: [api/src/orders, api/src/payments, api/src/refunds]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml, .starciwork/features/shop/impl/api/payments/index.yaml, .starciwork/features/shop/impl/api/refunds/index.yaml]
            inputs: {side: be, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
  - name: one code task over three records
    starci: [workflow, define, "${run}/one.yaml"]
    expect:
      exit: 1
      code: TASK_NOT_SPLIT
      contains: "task code (code) works impl.shop.api.orders, impl.shop.api.payments, impl.shop.api.refunds: split into one task per record"
  - file:
      path: split.yaml
      content: |
        schema: starci/workflow@1
        id: split
        goal: build the orders, payments and refunds slices
        runner: orca
        maxParallel: 10
        tasks:
          - id: code-orders
            label: code
            summary: build the orders slice
            allowPaths: [api/src/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {side: be, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: test-orders
            label: test
            summary: test the orders slice
            dependsOn: [code-orders]
            allowPaths: [api/test/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: e2e-orders
            label: verify
            summary: run the orders e2e suite
            dependsOn: [test-orders]
            allowPaths: [api/reports/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {suite: "node --version", step: e2e}
          - id: review-orders
            label: review
            summary: review the orders diff
            dependsOn: [e2e-orders]
            allowPaths: [api/reviews/orders]
            context: [.starciwork/features/shop/impl/api/orders/index.yaml]
            inputs: {since: HEAD}
          - id: code-payments
            label: code
            summary: build the payments slice
            allowPaths: [api/src/payments]
            context: [.starciwork/features/shop/impl/api/payments/index.yaml]
            inputs: {side: be, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: test-payments
            label: test
            summary: test the payments slice
            dependsOn: [code-payments]
            allowPaths: [api/test/payments]
            context: [.starciwork/features/shop/impl/api/payments/index.yaml]
            inputs: {edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: e2e-payments
            label: verify
            summary: run the payments e2e suite
            dependsOn: [test-payments]
            allowPaths: [api/reports/payments]
            context: [.starciwork/features/shop/impl/api/payments/index.yaml]
            inputs: {suite: "node --version", step: e2e}
          - id: review-payments
            label: review
            summary: review the payments diff
            dependsOn: [e2e-payments]
            allowPaths: [api/reviews/payments]
            context: [.starciwork/features/shop/impl/api/payments/index.yaml]
            inputs: {since: HEAD}
          - id: code-refunds
            label: code
            summary: build the refunds slice
            allowPaths: [api/src/refunds]
            context: [.starciwork/features/shop/impl/api/refunds/index.yaml]
            inputs: {side: be, edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: test-refunds
            label: test
            summary: test the refunds slice
            dependsOn: [code-refunds]
            allowPaths: [api/test/refunds]
            context: [.starciwork/features/shop/impl/api/refunds/index.yaml]
            inputs: {edition: lite}
            checks:
              - preset: tests-pass
                args: {command: "node --version"}
          - id: e2e-refunds
            label: verify
            summary: run the refunds e2e suite
            dependsOn: [test-refunds]
            allowPaths: [api/reports/refunds]
            context: [.starciwork/features/shop/impl/api/refunds/index.yaml]
            inputs: {suite: "node --version", step: e2e}
          - id: review-refunds
            label: review
            summary: review the refunds diff
            dependsOn: [e2e-refunds]
            allowPaths: [api/reviews/refunds]
            context: [.starciwork/features/shop/impl/api/refunds/index.yaml]
            inputs: {since: HEAD}
  - name: boot the tree
    boot:
      file: ${run}/split.yaml
      workflow: split
  - name: kernel next dispatches
    seat: kernel:split
    starci: [kernel, next, split, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\] code '
        count: 3
        distinct: retry-request
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks WHERE status = 'running'
        equals:
          - 3
