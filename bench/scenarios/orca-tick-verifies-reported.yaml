schema: starci/scenario@1
id: orca-tick-verifies-reported
group: orca
title: "orca: a filed result is verified and its worker's seat closed by the Supervisor's tick, with no Kernel turn"
inject: "the Op files done and its Kernel takes no further turn; later a verify of another task dies holding the task in verifying"
expect: >-
  `supervisor tick` runs the settling half of a workflow step for every workflow its Supervisor coordinates: the reported task is
  verified and committed, and its worker's seat is stopped, released and its tab closed, though no `kernel next` ran; a task
  left in verifying by a verifier that is gone is reconciled from git and verified by the same tick
pass:
  - the reported task is done after one tick, its commit in the workflow's worktree
  - its worker seat is released and its terminal closed
  - a verifying task whose verifier is gone is done after the next tick, no try spent
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: tick
        goal: two docs
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
          - id: b
            label: docs
            summary: write doc b
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/b.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: tick
  - name: kernel next launches both Ops, then the Kernel takes no further turn
    seat: kernel:tick
    starci: [kernel, next, tick, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a'"
      as: a
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'b'"
      as: b
  - worker:
      task: ${a}
      files:
        docs/a.md: "# a\n"
  - name: the tick verifies a and closes its seat
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${a}'"
        equals: [done]
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
        in: ${worktree.tick}
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM seats WHERE task_id = '${a}' AND role = 'worker'"
        equals: [released]
  - worker:
      task: ${b}
      files:
        docs/b.md: "# b\n"
  - name: b's verifier died holding it in verifying
    sql:
      db: ledger
      exec: "UPDATE tasks SET status = 'verifying' WHERE id = '${b}'"
  - name: the next tick reconciles b and verifies it
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || try_no FROM tasks WHERE id = '${b}'"
        equals: ["done:1"]
  - assert:
      orcaCalls:
        command: worker-release
        min: 2
  - assert:
      orcaCalls:
        command: terminal close
        min: 2
