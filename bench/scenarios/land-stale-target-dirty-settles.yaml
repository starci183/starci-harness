schema: starci/scenario@1
id: land-stale-target-dirty-settles
group: verify
title: "a green task lands over stale copies of its files left dirty in the workflow's checkout: what git holds is dropped, the rest is preserved"
inject: >-
  the checkout the task lands on (the workflow's) holds uncommitted copies of three tracked files the task's commit writes,
  leftovers of an earlier writer: one identical to the candidate's version, one that is the head's version with CRLF line
  endings (dirty to git status and to the merge, clean to git diff), and one that differs from both; a fast-forward of the
  branch would refuse to overwrite them (SETTLE_REF_FAILED)
expect: >-
  verify is green; under the land lock the settle drops the two copies git already holds, preserves the differing one as a patch
  in preserved/land-<task>, names all three in one land-stale event, then fast-forwards: the task is done with its settle commit,
  no try is spent and nothing awaits the owner
pass:
  - task done with one commit carrying its trailer, on its first try
  - one land-stale event naming the dropped copies and the preserved one, whose patch holds the differing content and outlives the merge settle
  - no land-escaped, settle-refused or verify-stuck event
  - the checkout is clean and holds the candidate's version of every file
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    .gitattributes: |
      * text=auto eol=lf
    docs/a/same.md: |
      old same
    docs/a/crlf.md: |
      old crlf
    docs/a/differs.md: |
      old differs
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: stale
        goal: bench workflow stale target
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: rewrite docs a
            allowPaths:
              - docs/a
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a/same.md
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, stale]
    save:
      a: data.nodes.0.task.id
  - name: a stale copy identical to the candidate's version
    write:
      path: docs/a/same.md
      content: |
        new same
  - name: the head's version with CRLF line endings
    write:
      path: docs/a/crlf.md
      crlf: true
      content: |
        old crlf
  - name: a stale copy that differs from the head and the candidate
    write:
      path: docs/a/differs.md
      content: |
        stale differs only the work tree holds
  - name: the worker rewrites the three files in its own Op worktree and files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a/same.md: |
          new same
        docs/a/crlf.md: |
          new crlf
        docs/a/differs.md: |
          new differs
  - name: step verifies and lands it
    starci: [workflow, step, stale]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || try_no FROM tasks"
        equals:
          - "done:1"
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.dropped') || ' ' || json_extract(data_json, '$.files') FROM events WHERE kind = 'land-stale' AND subject = '${a}'"
        equals:
          - '["docs/a/crlf.md","docs/a/same.md"] ["docs/a/differs.md"]'
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind IN ('land-escaped', 'settle-refused', 'verify-stuck')"
        equals:
          - 0
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.decision') FROM events WHERE kind = 'op-settled' AND subject = '${a}'"
        equals:
          - merge
  - assert:
      exists:
        path: ${project}/preserved/land-${a}/changes.patch
        present: true
        contains: stale differs only the work tree holds
  - assert:
      exists:
        path: docs/a/differs.md
        present: true
        contains: new differs
  - assert:
      exists:
        path: docs/a/crlf.md
        present: true
        contains: new crlf
  - assert:
      gitClean: true
