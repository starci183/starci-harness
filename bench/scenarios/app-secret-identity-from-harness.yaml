schema: starci/scenario@1
id: app-secret-identity-from-harness
group: security
title: "app secret set adds keys to an existing member with the age identity of the harness secret.env alone, in one write per set"
inject: >-
  a full app runs `app secret init`, then its private .claude/secret.env moves to the run's harness secret.env
  (STARCI_SECRET_ENV), so neither the environment nor the app holds an age identity; `set dev sepay K1` creates the member,
  `set dev sepay K2 K3` adds two keys to it (which decrypts it), `get` reads one back; then a set with the harness file gone
expect: >-
  each set seals with no identity exported or pointed to: the first names the recipient and the harness secret.env that holds
  its identity, the second opens the member with that identity and seals K2 and K3 in one write, list names all three keys;
  with no identity anywhere the next set is refused before anything is written, naming the app and harness secret.env and the fix
pass:
  - the first set names the harness secret.env as the holder of the identity
  - the second set adds K2 and K3 to the existing member, and list names K1, K2 and K3
  - get --to-file opens the member with the harness identity
  - with no identity anywhere, set on the existing member is refused naming both secret.env files, and the member keeps its keys
automation: automated
repo:
  files:
    hfs.json: |
      {"hfs": 3, "kind": "app", "edition": "full", "project": "bench-identity"}
steps:
  - name: the app gets its own age identity and .sops.yaml
    starci: [app, secret, init]
  - name: the identity moves from the app's .claude/secret.env to the run's harness secret.env
    write: { path: "${run}/secret.env", from: "${repo}/.claude/secret.env" }
  - remove: .claude/secret.env
  - name: the first set creates the member and names where the identity a later set needs is held
    starci: [app, secret, set, dev, sepay, K1, --generate, "24"]
    expect:
      exit: 0
      contains: secret.env (SOPS_AGE_KEY)
  - name: the second set opens the existing member with the harness identity and seals two keys in one write
    starci: [app, secret, set, dev, sepay, K2, K3, --generate, "24"]
  - starci: [app, secret, list, dev]
    expect:
      contains: K3
  - assert:
      exists: { path: .starcistacks/dev/secrets/sepay.enc.yaml, present: true, contains: "K2: ENC[" }
  - starci: [app, secret, get, dev, sepay, K1, --to-file]
  - name: with the harness secret.env gone too, adding a key is refused before anything is written
    remove: "${run}/secret.env"
  - starci: [app, secret, set, dev, sepay, K4, --generate, "24"]
    expect:
      exit: 2
  - assert:
      exists: { path: .starcistacks/dev/secrets/sepay.enc.yaml, present: true, contains: "K3: ENC[" }
