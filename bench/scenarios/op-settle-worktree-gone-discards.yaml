schema: starci/scenario@1
id: op-settle-worktree-gone-discards
group: lifecycle
title: "an attempt whose worktree was removed out of band is discarded at once by the redo that supersedes it: no TASK_WORKTREE_GONE, no try spent"
inject: >-
  the Op of task a filed done and its task waits reported; before any verify, someone removes its Op worktree and deletes its
  branch by hand (ticket tk-cb03efd533f1: graph 60 asked to cancel such a superseded attempt and every step refused
  TASK_WORKTREE_GONE)
expect: >-
  the Kernel's redo of a (a workflow-change retry) cancels the reported attempt at once: it has nothing to preserve, so it ends
  cancelled with a task-discarded event (worktree gone) and settles discard; the step names no problem, and the redo is queued at
  the same try
pass:
  - the redo is applied and the step reports no "not cancelled" problem
  - the superseded attempt is cancelled with one task-discarded event naming the gone worktree, and settled discard
  - the redo spends no try
  - a plain task cancel of a second such attempt settles it the same way
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: gone
        goal: bench workflow gone
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a]
            checks:
              - preset: files-exist
                args: {files: [docs/a/final.md]}
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, gone]
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      files:
        docs/a/final.md: "# a\n"
  - name: the worktree is removed by hand, its branch with it
    git: [worktree, remove, --force, "${project}/worktrees/gone.ops/${a}"]
  - git: [branch, -D, "starci/gone.ops/${a}"]
  - file:
      path: redo.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: gone
        reason: redo a
        changes:
          - {op: retry, id: a}
  - starci: [workflow, amend, gone, --change, "${run}/redo.yaml"]
    expect:
      lacks: TASK_WORKTREE_GONE
  - starci: [workflow, step, gone]
    expect:
      lacks: TASK_WORKTREE_GONE
  - assert:
      sql:
        db: ledger
        query: "SELECT (SELECT status FROM tasks WHERE id = '${a}') || ':' || (SELECT json_extract(data_json, '$.reason') FROM events WHERE kind = 'task-discarded' AND subject = '${a}') || ':' || (SELECT json_extract(data_json, '$.decision') FROM events WHERE kind = 'op-settled' AND subject = '${a}')"
        equals: ["cancelled:worktree gone:discard"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a' AND id <> '${a}'"
      as: a2
  - name: the redo spends no try
    assert:
      sql:
        db: ledger
        query: "SELECT try_no FROM tasks WHERE id = '${a2}'"
        equals: [1]
  - name: a second attempt filed, then its worktree removed by hand
    worker:
      task: ${a2}
      files:
        docs/a/final.md: "# a\n"
  - git: [worktree, remove, --force, "${project}/worktrees/gone.ops/${a2}"]
  - git: [branch, -D, "starci/gone.ops/${a2}"]
  - name: a plain cancel settles it at once
    starci: [task, cancel, "${a2}", --reason, "bench: its worktree is gone"]
  - assert:
      sql:
        db: ledger
        query: "SELECT (SELECT status FROM tasks WHERE id = '${a2}') || ':' || (SELECT COUNT(*) FROM events WHERE kind = 'task-discarded' AND subject = '${a2}') || ':' || (SELECT json_extract(data_json, '$.decision') FROM events WHERE kind = 'op-settled' AND subject = '${a2}')"
        equals: ["cancelled:1:discard"]
