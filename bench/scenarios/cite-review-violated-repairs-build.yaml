schema: starci/scenario@1
id: cite-review-violated-repairs-build
group: plan
title: a review that grades an author's cite violated sends the work back to the build
inject: >-
  a review is handed the author's cites; one reviewer grades a cite violated yet files done with verdict passed, another grades
  it violated and files failed with verdict failed
expect: >-
  the dishonest review fails its verify with anchors-cited red naming the violated cite, so it never passes; the honest
  review raises a red decision whose cause is findings and whose one legal route is review-findings-repair-build, to code
pass:
  - a violated grade under a passed verdict is red (anchors-cited names the cite) and the review task fails
  - the violated review's red decision carries cause findings and route review-findings-repair-build to code
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench scratch repository\n"
    .starciwork/workspace.yaml: |
      schema: work/workspace@1
      id: shop
      repositories:
        - {role: fe, name: web}
    .starciwork/features/shop/impl/web/cart/index.yaml: |
      schema: work/implementation@1
      id: impl.shop.web.cart
      title: the cart screen's code
      state: done
      activity: idle
      repository: web
      owners:
        - {role: fe, path: web/src/cart}
      proves: []
steps:
  - file:
      path: wf-claim.yaml
      content: |
        schema: starci/workflow@1
        id: claim
        goal: review the cart screen's code
        runner: inline
        tasks:
          - id: review
            label: review
            summary: review the cart screen's diff against the author's cites
            allowPaths: [web/reviews/claim]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {since: HEAD}
            cites: [tabs.choose, STATE-6]
  - starci: [workflow, define, "${run}/wf-claim.yaml"]
  - name: start the review that will claim a pass
    starci: [workflow, start, claim]
    save:
      claim: data.nodes.0.task.id
  - name: the reviewer grades a cite violated but files done
    worker:
      task: ${claim}
      status: done
      output:
        summary: read the cart diff
        files: []
        verdict: passed
        findings: []
        rulesApplied: []
        workRecords: [impl.shop.web.cart]
        citeGrades:
          - {cite: tabs.choose, grade: violated, evidence: "web/src/cart/cart.tsx:12 swaps one filter value with page tabs"}
          - {cite: STATE-6, grade: followed, evidence: "web/src/cart/cart.tsx:9 keeps the selected key controlled"}
  - name: step
    starci: [workflow, step, claim]
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (detail LIKE '%tabs.choose violated: web/src/cart/cart.tsx:12%') FROM check_runs WHERE name = 'anchors-cited'"
        equals:
          - "red:1"
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${claim}'"
        equals:
          - failed
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: graded
        goal: review the cart screen's code
        runner: inline
        tasks:
          - id: review
            label: review
            summary: review the cart screen's diff against the author's cites
            allowPaths: [web/reviews/graded]
            context: [.starciwork/features/shop/impl/web/cart/index.yaml]
            inputs: {since: HEAD}
            cites: [tabs.choose, STATE-6]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, graded]
    save:
      review: data.nodes.0.task.id
  - name: the reviewer grades a cite violated and files the finding
    worker:
      task: ${review}
      status: failed
      output:
        summary: the cart filter swaps a value with page tabs
        files: []
        verdict: failed
        findings:
          - {file: web/src/cart/cart.tsx, line: 12, rule: tabs.choose, record: impl.shop.web.cart, problem: page tabs swap one filter value}
        rulesApplied: []
        workRecords: [impl.shop.web.cart]
        citeGrades:
          - {cite: tabs.choose, grade: violated, evidence: "web/src/cart/cart.tsx:12 swaps one filter value with page tabs"}
          - {cite: STATE-6, grade: followed, evidence: "web/src/cart/cart.tsx:9 keeps the selected key controlled"}
  - name: kernel next returns the red decision with its route back to the build
    starci: [kernel, next, graded, --wait, "0"]
    expect:
      contains: '"id": "review-findings-repair-build"'
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(evidence_json, '$.cause') || ':' || json_extract(evidence_json, '$.routes[0].label') FROM decisions WHERE kind = 'red' AND workflow_id = 'graded'"
        equals:
          - findings:code
