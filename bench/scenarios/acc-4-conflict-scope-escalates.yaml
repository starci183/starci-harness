schema: starci/scenario@1
id: acc-4-conflict-scope-escalates
group: acceptance
title: "owner acceptance 4: two workflows want one path; the conflict escalates, the Supervisor narrows one, its Kernel replans inside the new scope"
inject: "workflows ui and nav both lease docs/header.md; ui's Op holds it; nav waits past conflictMinutes"
expect: >-
  nav's kernel next returns a conflict decision naming ui's task; nav's Kernel escalates (kind conflict); supervisor next
  returns the escalation; the Supervisor's goal-change narrows nav's scope to docs/nav/ answering it; nav's kernel next returns
  the escalation-answer; nav's Kernel first plans a task outside the new scope and is refused SCOPE_EXCEEDED, then plans
  inside it and its Op launches; ui's Op is never disturbed
pass:
  - a conflict decision for nav naming ui's task, escalated once
  - the Supervisor's goal-change records nav goal v2 with scope docs/nav/ and closes the escalation
  - a plan outside the new scope is refused SCOPE_EXCEEDED and changes nothing
  - nav's new task runs on docs/nav/; ui's task keeps its one attempt and its lease
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: ui.yaml
      content: |
        schema: starci/workflow@1
        id: ui
        goal: refresh the header doc
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: header
            label: docs
            summary: rewrite the header doc
            allowPaths: [docs/header.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/header.md]
  - file:
      path: nav.yaml
      content: |
        schema: starci/workflow@1
        id: nav
        goal: rework the navigation docs
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        scope:
          paths: [docs/]
          maxTasks: 3
        tasks:
          - id: header
            label: docs
            summary: add the nav links to the header doc
            allowPaths: [docs/header.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/header.md]
  - boot:
      file: ${run}/ui.yaml
      workflow: ui
  - name: ui's Kernel launches its Op
    seat: kernel:ui
    starci: [kernel, next, ui, --wait, "0"]
  - boot:
      file: ${run}/nav.yaml
      workflow: nav
  - name: nav's Kernel meets the lease
    seat: kernel:nav
    starci: [kernel, next, nav, --wait, "0"]
  - name: the conflict outlasts conflictMinutes
    sql:
      db: ledger
      exec: "UPDATE events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-11 minutes') WHERE kind = 'lease-conflict-seen'"
  - name: nav's kernel next returns the conflict
    seat: kernel:nav
    starci: [kernel, next, nav, --wait, "0"]
    expect:
      contains: '"kind": "conflict"'
    save:
      conflict: data.decision.id
      graph: data.digest.graphVersion
  - file:
      path: escalate.yaml
      content: |
        schema: starci/command@1
        cmdId: k-nav-conflict-1
        kind: escalation
        workflow: nav
        basedOn: {graph: ${graph}}
        answers: [${conflict}]
        escalation:
          kind: conflict
          question: workflow ui holds docs/header.md; who owns it?
          paths: [docs/header.md]
  - seat: kernel:nav
    starci: [kernel, submit, "${run}/escalate.yaml"]
  - name: supervisor next returns the escalation
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
    expect:
      contains: '"kind": "escalation"'
    save:
      escalation: data.decision.id
  - file:
      path: narrow.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-nav-narrow-1
        kind: goal-change
        workflow: nav
        project: ${repo}
        basedOn: {goal: 1}
        answers: [${escalation}]
        goal: rework the navigation docs under docs/nav/; the header belongs to workflow ui
        scope:
          paths: [docs/nav/]
          maxTasks: 3
        note: ui owns docs/header.md
  - seat: supervisor
    starci: [supervisor, submit, "${run}/narrow.yaml"]
  - name: nav's kernel next returns the answer
    seat: kernel:nav
    starci: [kernel, next, nav, --wait, "0"]
    expect:
      contains: '"kind": "escalation-answer"'
    save:
      answer: data.decision.id
      graph2: data.digest.graphVersion
  - file:
      path: outside.yaml
      content: |
        schema: starci/workflow@1
        id: nav
        goal: rework the navigation docs
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: links
            label: docs
            summary: write the nav links doc
            allowPaths: [docs/links.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/links.md]
  - file:
      path: cmd-outside.yaml
      content: |
        schema: starci/command@1
        cmdId: k-nav-outside-1
        kind: workflow-change
        workflow: nav
        basedOn: {graph: ${graph2}}
        answers: [${answer}]
        change: outside.yaml
  - name: a plan outside the new scope is refused
    seat: kernel:nav
    starci: [kernel, submit, "${run}/cmd-outside.yaml"]
    expect:
      exit: 1
      code: SCOPE_EXCEEDED
  - file:
      path: inside.yaml
      content: |
        schema: starci/workflow@1
        id: nav
        goal: rework the navigation docs
        runner: orca
        agent: claude
        model: sonnet
        maxParallel: 2
        tasks:
          - id: links
            label: docs
            summary: write the nav links doc
            allowPaths: [docs/nav/links.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/nav/links.md]
  - file:
      path: cmd-inside.yaml
      content: |
        schema: starci/command@1
        cmdId: k-nav-inside-1
        kind: workflow-change
        workflow: nav
        basedOn: {graph: ${graph2}}
        answers: [${answer}]
        change: inside.yaml
  - name: the plan inside the scope is applied
    seat: kernel:nav
    starci: [kernel, submit, "${run}/cmd-inside.yaml"]
  - name: nav's kernel next launches the new task
    seat: kernel:nav
    starci: [kernel, next, nav, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT kind || ':' || answered_by FROM decisions WHERE scope = 'supervisor'
        equals: ["escalation:sup-nav-narrow-1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT goal_version FROM workflows WHERE id = 'nav'"
        equals: [2]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM commands WHERE cmd_id = 'k-nav-outside-1'"
        equals: [failed]
  - assert:
      sql:
        db: ledger
        query: "SELECT plan_key || ':' || status FROM tasks WHERE workflow_id = 'nav' AND status IN ('running', 'queued')"
        equals: ["links:running"]
  - assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || (SELECT COUNT(*) FROM attempts x WHERE x.task_id = t.id) || ':' || (SELECT COUNT(*) FROM leases l WHERE l.task_id = t.id) FROM tasks t WHERE t.workflow_id = 'ui'"
        equals: ["running:1:1"]
  - assert:
      orcaCalls:
        command: send
        match:
          to: "^run:${supervisor.run}$"
          type: "^escalation$"
        count: 1
