schema: starci/scenario@1
id: verify-scoped-coverage
group: verify
title: a scoped tests-pass judges coverage of the task's own changed logic files, never the app's whole measured scope
inject: "a one-app tree whose be jest config measures every *.service.ts at per-file 100 and already holds an unrelated measured file at 0%; three tasks each run the managed npm test"
expect: >-
  the harness narrows the jest run's coverage to the changed source files under allowPaths that the app's own
  collectCoverageFrom measures, so the unrelated 0% file never turns a task red; a covered changed service passes, a
  change with no measured logic file runs its tests without coverage, and an uncovered changed service fails on exactly
  its own file
pass:
  - the covered service's task is done although an unrelated measured file sits at 0%
  - the task whose change holds no measured logic file is done, its coverage left to CI
  - the uncovered service's task fails on its own file
  - no human intervention beyond the injected fault
automation: automated
# The jest stand-in answers --showConfig with the config's collectCoverageFrom, measures the --collectCoverageFrom files the
# command passes (else every file the config measures) and fails a measured file that holds UNCOVERED, like a per-file
# threshold. The managed test script runs it from be/ with --coverage, as the canon preset's test script does.
repo:
  files:
    README.md: "# bench scratch one-app\n"
    package.json: '{"name": "bench-one-app", "version": "1.0.0", "private": true, "scripts": {"test": "cd be && node ../node_modules/jest/bin/jest.js --coverage"}}'
    be/jest.config.js: |
      module.exports = { collectCoverageFrom: ["src/**/*.service.ts", "!src/**/errors/**"] }
    be/src/platform/http.service.ts: "export const http = 1 // UNCOVERED\n"
    node_modules/jest/bin/jest.js: |
      const { readFileSync, readdirSync, statSync } = require("node:fs")
      const { join, relative, sep, posix } = require("node:path")
      const args = process.argv.slice(2)
      const config = require(join(process.cwd(), "jest.config.js"))
      if (args.includes("--showConfig")) {
        console.log(JSON.stringify({ configs: [{ rootDir: process.cwd() }], globalConfig: { rootDir: process.cwd(), collectCoverageFrom: config.collectCoverageFrom } }))
        process.exit(0)
      }
      if (!args.includes("--coverage") || args.includes("--coverage=false")) {
        console.log("tests passed; coverage not collected")
        process.exit(0)
      }
      const named = args.filter((a) => a.startsWith("--collectCoverageFrom=")).map((a) => a.slice("--collectCoverageFrom=".length))
      const globs = named.length > 0 ? named : config.collectCoverageFrom
      const positive = globs.filter((g) => !g.startsWith("!"))
      const negative = globs.filter((g) => g.startsWith("!")).map((g) => g.slice(1))
      const walk = (dir) => readdirSync(dir).flatMap((n) => (statSync(join(dir, n)).isDirectory() ? walk(join(dir, n)) : [join(dir, n)]))
      const measured = walk(join(process.cwd(), "src"))
        .map((f) => relative(process.cwd(), f).split(sep).join("/"))
        .filter((f) => positive.some((g) => posix.matchesGlob(f, g)) && !negative.some((g) => posix.matchesGlob(f, g)))
      const below = measured.filter((f) => readFileSync(f, "utf8").includes("UNCOVERED"))
      for (const f of measured) console.log("coverage " + f + (below.includes(f) ? " 0%" : " 100%"))
      for (const f of below) console.log("Jest: " + f + " coverage threshold for lines (100%) not met: 0%")
      process.exit(below.length === 0 ? 0 : 1)
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: cover
        goal: bench workflow scoped coverage
        runner: inline
        tasks:
          - id: covered
            label: docs
            summary: add a covered lesson service
            allowPaths:
              - be/src/lesson
            checks:
              - preset: tests-pass
                args:
                  command: npm test
          - id: unmeasured
            label: docs
            summary: add a lesson config, no measured logic
            allowPaths:
              - be/src/lesson/lesson.config.ts
            checks:
              - preset: tests-pass
                args:
                  command: npm test
            dependsOn:
              - covered
          - id: uncovered
            label: docs
            summary: add an uncovered quiz service
            allowPaths:
              - be/src/quiz
            checks:
              - preset: tests-pass
                args:
                  command: npm test
            dependsOn:
              - unmeasured
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, cover]
    save:
      covered: data.nodes.0.task.id
  - name: the covered service is written
    worker:
      task: ${covered}
      status: done
      files:
        be/src/lesson/lesson.service.ts: "export const lesson = 1\n"
  - name: step verifies it
    starci: [workflow, step, cover]
    save:
      unmeasured: data.nodes.1.task.id
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE name = 'tests-pass' AND status = 'green' AND detail LIKE '%coverage judged on the 1 changed logic file(s): src/lesson/lesson.service.ts%' AND detail NOT LIKE '%http.service.ts%'"
        equals:
          - 1
  - name: a change with no measured logic file
    worker:
      task: ${unmeasured}
      status: done
      files:
        be/src/lesson/lesson.config.ts: "export const lessonConfig = { size: 1 }\n"
  - name: step verifies it
    starci: [workflow, step, cover]
    save:
      uncovered: data.nodes.2.task.id
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE name = 'tests-pass' AND status = 'green' AND detail LIKE '%none of the 1 changed source file(s) is measured logic%' AND detail LIKE '%coverage not collected%'"
        equals:
          - 1
  - name: the uncovered service is written
    worker:
      task: ${uncovered}
      status: done
      files:
        be/src/quiz/quiz.service.ts: "export const quiz = 1 // UNCOVERED\n"
  - name: step verifies it
    starci: [workflow, step, cover]
    save: {}
    expect: {}
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE name = 'tests-pass' AND status = 'red' AND detail LIKE '%coverage judged on the 1 changed logic file(s): src/quiz/quiz.service.ts%' AND detail LIKE '%src/quiz/quiz.service.ts coverage threshold for lines (100%) not met%' AND detail NOT LIKE '%http.service.ts%'"
        equals:
          - 1
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks ORDER BY created_at
        equals:
          - done
          - done
          - failed
