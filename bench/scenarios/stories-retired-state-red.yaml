schema: starci/scenario@1
id: stories-retired-state-red
group: verify
title: "check stories is red when a story or a pure half still uses the retired state / XState names"
inject: "a stories file sets args.state instead of args.shape, then the pure half's union is exported as LeadBoardBlockState"
expect: "the story is STORY_STATE_RENAMED with the rename in its message and is not read as a shape; the retired union is SHAPE_UNION_RENAMED and is never taken as an alias"
pass:
  - a story setting state is red with a message naming the rename to shape
  - a pure half exporting XState is red with a message naming XShape
  - no human intervention beyond the injected fault
automation: automated
steps:
  - name: copy the shape-slot fixture into the scratch repository
    write: { path: ".", from: "${ops}/../bench/fixtures/shape-slot/app" }
  - name: add a story that sets the retired key
    write:
      path: fe/apps/leads/stories/LeadBoardBlockOld.stories.tsx
      content: |
        import type { Meta, StoryObj } from "@storybook/react"
        import { LeadBoardBlockBase } from "@/components/blocks/LeadBoardBlock/component"

        const meta = { title: "Blocks/LeadBoardBlockOld", component: LeadBoardBlockBase } satisfies Meta<typeof LeadBoardBlockBase>

        export default meta

        export const OldList: StoryObj<typeof meta> = { args: { state: "list" } }
  - name: the retired key is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"code": "STORY_STATE_RENAMED"' }
  - name: the message names the rename
    starci: [check, stories]
    expect: { exit: 1, contains: "rename args.state to args.shape" }
  - name: nothing else is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"findings": 1' }
  - name: export the union under its retired name
    write:
      path: fe/apps/leads/src/components/blocks/LeadBoardBlock/component.tsx
      content: |
        export const LEAD_BOARD_BLOCK_SHAPES = ["list", "stages", "unassigned"] as const

        export type LeadBoardBlockState = (typeof LEAD_BOARD_BLOCK_SHAPES)[number]
  - name: the retired union is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"code": "SHAPE_UNION_RENAMED"' }
  - name: the message names the new union
    starci: [check, stories]
    expect: { exit: 1, contains: "LeadBoardBlockState is the retired name of the drawn shapes: rename it LeadBoardBlockShape" }
