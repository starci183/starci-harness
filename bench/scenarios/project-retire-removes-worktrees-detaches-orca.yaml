schema: starci/scenario@1
id: project-retire-removes-worktrees-detaches-orca
group: lifecycle
title: retiring a project removes every worktree the harness made for it, its work preserved, and detaches the repository from Orca
inject: "an abandoned project still holds an Op worktree with uncommitted work, and Orca still lists the repository as a project"
expect: >-
  project retire marks the ledger retired, preserves the Op worktree's uncommitted work in the project's preserved/ folder,
  removes the worktree (through Orca, then git; its branch stays), and once Orca lists no worktree of the repository but its
  main checkout, detaches it from Orca's project list (orca project setup-delete); the repository and the ledger file stay
pass:
  - the ledger is retired and the Op worktree is gone, its untracked file preserved
  - one orca project setup-delete of the repository's setup
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: old
        goal: bench workflow old
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start, which cuts the task's Op worktree
    starci: [workflow, start, old]
    save:
      a: data.nodes.0.task.id
  - read:
      db: ledger
      query: "SELECT worktree FROM tasks WHERE id = '${a}'"
      as: wt
  - name: the abandoned task left uncommitted work
    write:
      path: ${wt}/docs/a.md
      content: "# a, half written\n"
  - name: Orca lists the repository as a project
    orca:
      set:
        setups:
          - id: setup-bench
            path: ${repo}
  - read:
      db: machine
      query: "SELECT ledger_id FROM ledgers"
      as: ledger
  - name: the owner retires the project
    starci: [project, retire, "${ledger}"]
    expect:
      exit: 0
      contains: detached from Orca
  - assert:
      sql:
        db: machine
        query: "SELECT state FROM ledgers WHERE ledger_id = '${ledger}'"
        equals: [retired]
  - assert:
      exists:
        path: ${wt}
        present: false
  - assert:
      exists:
        path: ${project}/preserved/gc-${a}/untracked/docs/a.md
        present: true
  - assert:
      orcaCalls:
        command: project setup-delete
        match:
          setup: "^setup-bench$"
        count: 1
