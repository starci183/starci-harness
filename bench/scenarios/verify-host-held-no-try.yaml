schema: starci/scenario@1
id: verify-host-held-no-try
group: verify
title: a verify whose heavy command the host holds in the queue past the verify's timeout ends host-held, spends no try, and verifies green later
inject: >-
  the heavy rules of an ops/ copy set so the host's CPU average is always above maxCpuPercent and the queue never counts as
  starved, so no heavy command is admitted, and the verify deadline is half a minute; a task's verify runs a test command whose
  contract budget is one minute
expect: >-
  the verify's test command waits in the heavy queue, which never counts against the verify's own deadline, and once it waited the
  verify's timeout (the contract budget) it is refused HOST_HELD: the verify reaches no verdict, the task is reported again with
  no try spent and no verdict on its attempt, recorded verify-host-held; once the host admits again the next verify of the same
  attempt runs the command and settles the task done on its first try
pass:
  - the held verify exits HOST_HELD (75) after a minute in the queue, never VERIFY_DEADLINE at half a minute
  - the task is reported at try 1 and its attempt has no verdict
  - one verify-host-held event, and no heavy slot row is left
  - after the CPU ceiling is lifted the task verifies green and is done at try 1
  - no human intervention beyond the injected fault
automation: automated
env:
  STARCI_OPS_DIR: ${repo}/ops
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
repo:
  files:
    package.json: '{"name": "bench-host-held", "version": "1.0.0", "private": true}'
    check.js: "console.log('the suite ran')\n"
steps:
  - name: copy ops/ into the scratch repository, with the contexts its labels read
    write: { path: ops, from: "${ops}" }
  - write: { path: contexts, from: "${ops}/../contexts" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: ops copy"]
  - name: RAM never holds a command back
    starci: [config, set, liveness.heavy.reserveMb, "0"]
  - name: a CPU ceiling no host is under, and a queue that never counts as starved
    starci: [config, set, liveness.heavy.maxCpuPercent, "0.0001"]
  - starci: [config, set, liveness.heavy.cpuStarveMinutes, "600"]
  - name: every load counts as the harness's own, so the ceiling holds the busy stub's load too
    starci: [config, set, liveness.heavy.managedCpuFloorPercent, "0"]
  - name: a verify deadline shorter than the queue wait, which never counts against it
    starci: [config, set, liveness.verifyDeadlineMinutes, "0.5"]
  - git: [commit, -q, -am, "bench: a host that admits nothing"]
  - name: another program keeps a core busy, so even an idle runner reads above the ceiling (CPU rounds to whole percent)
    serve: { stub: busy, as: burner }
  - name: boot the project's Supervisor, whose terminal launches the owner's tasks
    boot: {}
  - file:
      path: held.json
      content: >-
        {"schema": "starci/contract@2", "label": "docs", "context": {"revision": "HEAD", "allowPaths": ["docs"]},
        "input": {"summary": "write the held doc"}, "budget": {"minutes": 1, "tries": 1},
        "checks": {"extend": [{"preset": "tests-pass", "args": {"command": "node check.js"}}]}}
  - seat: supervisor
    starci: [task, send, "${run}/held.json", --launch, --agent, claude, --model, claude-sonnet-4-6]
    save:
      held: data.task
  - worker:
      task: ${held}
      files:
        docs/held.md: "# held\n"
  - name: the verify's test command waits past the contract budget and is refused HOST_HELD
    starci: [task, verify, "${held}"]
    expect:
      exit: 75
      contains: HOST_HELD
      lacks: VERIFY_DEADLINE
  - name: the task is reported again at its first try, its attempt without a verdict
    assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || COALESCE(a.verdict, 'none') FROM tasks t JOIN attempts a ON a.task_id = t.id WHERE t.id = '${held}'"
        equals: ["reported:1:none"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'verify-host-held' AND subject = '${held}'"
        equals: [1]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM heavy_slots"
        equals: [0]
  - name: the host admits again
    starci: [config, set, liveness.heavy.maxCpuPercent, "100"]
  - git: [commit, -q, -am, "bench: the host admits again"]
  - name: the same attempt verifies green
    starci: [task, verify, "${held}"]
    expect: { exit: 0 }
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || try_no FROM tasks WHERE id = '${held}'"
        equals: ["done:1"]
