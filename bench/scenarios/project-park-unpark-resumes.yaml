schema: starci/scenario@1
id: project-park-unpark-resumes
group: lifecycle
title: "project park closes every agent of a project and keeps its work; a tick relaunches nothing; unpark brings it back from the patch"
inject: "two orca workflows run under one Supervisor, one Op mid-edit with half a doc written, a stray shell in a workflow worktree, and another project's terminal; the owner parks the project"
expect: >-
  park pauses both workflows (reason parked), stops the live Op and cancels its task as parked (no try spent, its half-done
  doc kept as one patch, settled keep by the harness), closes both Kernel terminals (worktrees kept), stops the Supervisor
  (ended_by parked) and closes every Orca terminal of the project, the stray shell included, leaving the other project's; a
  tick launches nothing; unpark starts a Supervisor, and once it attached the tick relaunches both Kernels on their own
  worktrees and resumes both workflows; the Kernel re-dispatches the parked task at the same try from its patch
pass:
  - no Orca terminal of the project is listed after the park, and the other project's terminal is never closed
  - the parked task keeps try 1, its work is one stored patch, settled keep with cause parked
  - a supervisor tick after the park launches no agent and no worker
  - after unpark both workflows run again with a fresh Kernel each in their own worktree
  - the re-dispatched task applies the patch at launch and holds the half-written doc, at try 1
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: pa.yaml
      yaml:
        schema: starci/workflow@1
        id: pa
        goal: bench park workflow a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args: {files: [docs/a.md]}
  - file:
      path: pb.yaml
      yaml:
        schema: starci/workflow@1
        id: pb
        goal: bench park workflow b
        runner: orca
        maxParallel: 2
        tasks:
          - id: b
            label: docs
            summary: write doc b
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args: {files: [docs/b.md]}
  - boot:
      file: ${run}/pa.yaml
      workflow: pa
  - boot:
      file: ${run}/pb.yaml
      workflow: pb
  - name: pa's Kernel launches its Op
    seat: kernel:pa
    starci: [kernel, next, pa, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a'"
      as: a
  - name: the Op has written half its doc when the owner parks
    file:
      path: ${project}/worktrees/pa.ops/${a}/docs/a.md
      content: "# a, half written\n"
  - name: a shell left open in pb's worktree, and another project's terminal
    orca:
      terminal: {handle: stray-shell, live: true, title: bash, worktree: "${worktree.pb}"}
  - orca:
      terminal: {handle: other-project, live: true, title: "[Supervisor] elsewhere", worktree: "${run}"}
  - name: a dry run changes nothing
    starci: [project, park, --dry-run]
    expect:
      contains: '"dryRun": true'
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows ORDER BY id"
        equals: [running, running]
  - name: the owner parks the project
    starci: [project, park]
    expect:
      contains: '"left": []'
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || substr(reason, 1, 19) || ':' || (kernel_closed_at IS NOT NULL) FROM workflows ORDER BY id"
        equals: ["paused:parked: was running:1", "paused:parked: was running:1"]
  - name: the parked task spent no try and keeps one patch, settled keep by the harness
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT status || ':' || try_no FROM tasks WHERE id = '${a}') || ':' || json_extract(data_json, '$.decision') || ':' || json_extract(data_json, '$.cause') || ':' || (SELECT COUNT(*) FROM prior_work WHERE task_id = '${a}') FROM events WHERE kind = 'op-settled' AND subject = '${a}'"
        equals: ["cancelled:1:keep:parked:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'task-parked' AND subject = '${a}'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'workflow-parked'"
        equals: [2]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM seats WHERE status NOT IN ('released', 'launch-failed')"
        equals: [0]
  - assert:
      sql:
        db: machine
        query: "SELECT ended_by FROM project_supervisors"
        equals: [parked]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM host_events WHERE kind = 'project-parked' AND json_array_length(data_json, '$.workflows') = 2 AND json_array_length(data_json, '$.left') = 0"
        equals: [1]
  - assert:
      exists:
        path: ${worktree.pa}
        present: true
  - name: the stray shell in the project's worktree is closed, the other project's terminal is not
    assert:
      orcaCalls:
        command: terminal close
        match:
          terminal: '^stray-shell$'
        min: 1
  - assert:
      orcaCalls:
        command: terminal close
        match:
          terminal: '^other-project$'
        count: 0
  - name: a tick while parked relaunches nothing
    starci: [supervisor, tick]
  - starci: [supervisor, tick]
  - assert:
      orcaCalls:
        command: agent launch
        count: 1
  - assert:
      orcaCalls:
        command: worker-start
        count: 3
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows ORDER BY id"
        equals: [paused, paused]
  - name: the owner unparks; the Supervisor starts
    starci: [project, unpark, --wait, "0"]
    expect:
      contains: '"pending": true'
  - read:
      db: machine
      query: "SELECT id FROM project_supervisors WHERE ended_at IS NULL"
      as: supervisor.launch
  - read:
      db: machine
      query: "SELECT terminal FROM project_supervisors WHERE ended_at IS NULL"
      as: supervisor.terminal
  - name: the new Supervisor attaches
    seat: supervisor
    starci: [supervisor, attach, --launch, "${supervisor.launch}"]
    save:
      supervisor.run: data.run_id
  - name: the tick finishes the unpark
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || COALESCE(reason, '-') FROM workflows ORDER BY id"
        equals: ["running:-", "running:-"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'workflow-unparked'"
        equals: [2]
  - boot:
      adopt: pa
  - boot:
      adopt: pb
  - name: pa's relaunched Kernel works in its own worktree
    assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Kernel\] pa$'
          worktree: "pa$"
        count: 2
  - name: the relaunched Kernel re-dispatches the parked task
    seat: kernel:pa
    starci: [kernel, next, pa, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a' AND id <> '${a}'"
      as: a2
  - assert:
      sql:
        db: ledger
        query: "SELECT try_no || ':' || retry_of FROM tasks WHERE id = '${a2}'"
        equals: ["1:${a}"]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.outcome') FROM events WHERE kind = 'prior-applied' AND subject = '${a2}' ORDER BY id LIMIT 1"
        equals: [applied]
  - assert:
      exists:
        path: ${project}/worktrees/pa.ops/${a2}/docs/a.md
        present: true
        contains: half written
  - worker:
      task: ${a2}
      files:
        docs/a.md: "# a\n"
  - seat: kernel:pa
    starci: [kernel, next, pa, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${a2}'"
        equals: [done]
