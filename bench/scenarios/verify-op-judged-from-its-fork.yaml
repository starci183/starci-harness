schema: starci/scenario@1
id: verify-op-judged-from-its-fork
group: verify
title: a task in its Op worktree is judged on its own diff from its fork, never on what earlier tasks left on the workflow branch
inject: "an earlier task left a file holding a lint error committed on the workflow branch, after origin/main, before this task's Op worktree was cut"
expect: >-
  starci check run --task, and the worker's dry replay of its contract (task verify --contract), diff from the Op worktree's
  fork, so the scope holds the task's own file alone, its lint is green and the leftover is never linted or typechecked; a
  tests-pass check whose command is not jest (git diff --no-index) runs as named, with no coverage argument appended
pass:
  - check run --task judges the task's own file and not the leftover
  - the dry replay of check-run-green and tests-pass is green
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
steps:
  - name: the fixture and its tool stand-ins are committed, and main is published
    write: { path: ".", from: "${ops}/../bench/fixtures/lint-findings/repo" }
  - write: { path: node_modules/typescript, from: "${ops}/../bench/fixtures/lint-findings/stand-ins/typescript" }
  - write: { path: node_modules/eslint, from: "${ops}/../bench/fixtures/lint-findings/stand-ins/eslint" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: the lint fixture"]
  - git: [update-ref, refs/remotes/origin/main, HEAD]
  - name: an earlier task of the workflow left a file the canon would refuse on the branch
    write:
      path: src/leftover.ts
      content: "export const leftover = 1 // LINT_ERROR\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: an earlier task's leftover"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: fork
        goal: the app counts to two
        runner: inline
        tasks:
          - id: count
            label: docs
            summary: make the app count to two
            allowPaths: [src, docs]
            checks: [check-run-green]
  - file:
      path: contract.json
      content: >-
        {"schema": "starci/contract@2", "label": "docs", "context": {"revision": "HEAD", "allowPaths": ["src", "docs"]},
        "input": {"summary": "make the app count to two"}, "budget": {"minutes": 10, "tries": 1},
        "checks": {"extend": [{"preset": "check-run-green"}, {"preset": "tests-pass", "args": {"command": "git diff --no-index --exit-code src/app.ts src/app.ts"}}]}}
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start, which cuts the task's Op worktree from the branch head
    starci: [workflow, start, fork]
    save:
      count: data.nodes.0.task.id
  - read:
      db: ledger
      query: "SELECT worktree FROM tasks WHERE id = '${count}'"
      as: wt
  - name: the worker changes its own file in its Op worktree and files done
    worker:
      task: ${count}
      files:
        src/app.ts: "export const app = 2\n"
  - name: check run as the task judges its own file alone
    starci: [check, run, --task, "${count}"]
    cwd: ${wt}
    expect:
      exit: 0
      lacks: leftover.ts
  - name: the worker's dry replay of its contract is green
    starci: [task, verify, "${count}", --contract, "${run}/contract.json"]
    cwd: ${wt}
    expect:
      exit: 0
      lacks: collectCoverageFrom
