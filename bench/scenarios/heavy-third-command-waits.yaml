schema: starci/scenario@1
id: heavy-third-command-waits
group: resources
title: "three heavy commands at once on a host of two slots: the third waits for a slot, logs its wait and still runs green"
inject: "three scoped check runs at once, each typechecking with a tsc that takes seconds"
expect: >-
  every tsc and eslint the check runs start takes a slot of the host's heavy-command semaphore in machine.sqlite; with two slots
  the third command waits in the queue, prints that it waits and records a heavy-wait host event, then runs once a slot frees;
  all three check runs end green, the wait failing none of them
pass:
  - all three check runs exit 0
  - at least one heavy-wait host event was recorded
  - no slot row is left once they ended
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    package.json: '{"name": "bench-heavy", "version": "1.0.0", "private": true}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"fe": {"grammar": "core"}}}'
    tsconfig.json: '{"compilerOptions": {"strict": true}, "include": ["src"]}'
    eslint.config.js: "module.exports = []\n"
    src/index.ts: "export const index = 1\n"
    node_modules/typescript/bin/tsc: "setTimeout(() => process.exit(0), 4000)\n"
    node_modules/eslint/bin/eslint.js: "process.exit(0)\n"
steps:
  - write: { path: src/changed.ts, content: "export const changed = 1\n" }
  - name: three check runs at once
    starci: [check, run, --base, HEAD]
    parallel: 3
    expect: { exit: 0 }
  - name: the third waited for a slot and said so
    assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) >= 1 FROM host_events WHERE kind = 'heavy-wait'"
        equals: [1]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM heavy_slots"
        equals: [0]
