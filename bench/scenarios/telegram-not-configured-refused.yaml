schema: starci/scenario@1
id: telegram-not-configured-refused
group: environment
title: "with no bot token in the environment or secret.env, every Telegram verb that would call the bot refuses TELEGRAM_NOT_CONFIGURED, naming the key and where to set it"
inject: the token key of ops/telegram.yaml is empty in the environment and the run's secret.env does not exist
expect: >-
  discover-chat, notify and the bridge refuse TELEGRAM_NOT_CONFIGURED naming TELEGRAM_BOT_TOKEN, secret.env and the environment,
  store nothing and call nothing; both status verbs answer, saying the token is not set and the bridge absent
pass:
  - three refusals TELEGRAM_NOT_CONFIGURED, each naming TELEGRAM_BOT_TOKEN
  - status reports configured false and the bridge absent
  - no owner chat stored
  - no actor overstepping its role
automation: automated
env:
  TELEGRAM_BOT_TOKEN: ""
  STARCI_TELEGRAM_API: http://127.0.0.1:9
steps:
  - starci: [connect, telegram, discover-chat]
    expect:
      code: TELEGRAM_NOT_CONFIGURED
      contains: TELEGRAM_BOT_TOKEN is not set
  - starci: [connect, telegram, notify]
    expect:
      code: TELEGRAM_NOT_CONFIGURED
      contains: set TELEGRAM_BOT_TOKEN in secret.env (see secret.env.example) or in the environment
  - starci: [supervisor, telegram-bridge, run, --once]
    expect:
      code: TELEGRAM_NOT_CONFIGURED
  - starci: [connect, telegram, status]
    expect:
      contains: "\"configured\": false"
  - starci: [supervisor, telegram-bridge, status]
    expect:
      contains: "\"liveness\": \"absent\""
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(*) FROM telegram_channel WHERE chat_id IS NOT NULL
        equals: [0]
