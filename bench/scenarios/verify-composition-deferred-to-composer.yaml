schema: starci/scenario@1
id: verify-composition-deferred-to-composer
group: verify
title: a module's composition rules deferred to its composer are green on the producer, red on the final verify while nothing composes it, and green once composed
inject: "a workflow splits a feature module from the task that wires it in; the producer names its composer, which the plan first lacks"
expect: >-
  the producer's check-run-green defers feature-not-composed on its own allowPaths to the composer it names and settles
  green; with every node done the workflow's final verify judges the module in full, finds it composed by nothing and
  blocks the workflow; an amend adds the composer, whose verify judges the module with no deferral; a composer that does
  not compose is red; one that does settles, the final verify is green and the workflow is done; a plan that names no
  composer stays red on the producer
pass:
  - the producer is done and its check-run-green says the finding was deferred to the composer
  - the workflow is blocked on its final verify, naming feature-not-composed
  - the composer that does not compose is red on the module's finding
  - the composer that composes is done and the workflow is done after a green final verify
  - a producer with no composedBy is red on the same finding
  - no human intervention beyond the injected fault
automation: automated
# bench/fixtures/lint-findings: the ESLint stand-in reports starci-be/feature-not-composed on a file under src/pool/ while
# src/app.ts does not name the pool. The scratch commits are dated in the past: `lands` dates foreign commits to the second.
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
steps:
  - name: the fixture and its tool stand-ins are committed
    write: { path: ".", from: "${ops}/../bench/fixtures/lint-findings/repo" }
  - write: { path: node_modules/typescript, from: "${ops}/../bench/fixtures/lint-findings/stand-ins/typescript" }
  - write: { path: node_modules/eslint, from: "${ops}/../bench/fixtures/lint-findings/stand-ins/eslint" }
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: the lint fixture"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: pool
        goal: the app runs on a pool
        runner: inline
        tasks:
          - id: pool
            label: docs
            summary: write the pool module
            allowPaths: [src/pool]
            composedBy: compose
            checks: [check-run-green]
  - name: define
    starci: [workflow, define, "${run}/wf.yaml"]
  - name: start
    starci: [workflow, start, pool]
    save:
      pool: data.nodes.0.task.id
  - name: the producer writes the module, which nothing composes yet
    worker:
      task: ${pool}
      files:
        src/pool/index.ts: "export const pool = 1\n"
  - name: step settles the producer, then runs the final verify, which blocks the workflow
    starci: [workflow, step, pool]
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'deferred-to:compose: 1') > 0) FROM check_runs WHERE task_id = '${pool}' AND name = 'check-run-green' ORDER BY id DESC LIMIT 1"
        equals: ["green:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(reason, 'final verify') > 0) || ':' || (instr(reason, 'feature-not-composed') > 0) FROM workflows WHERE id = 'pool'"
        equals: ["blocked:1:1"]
  - file:
      path: add.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: pool
        reason: the pool's composer was missing from the plan
        changes:
          - op: add
            task:
              id: compose
              label: docs
              summary: wire the pool into the app
              allowPaths: [src/app.ts]
              dependsOn: [pool]
              checks: [check-run-green]
  - name: the composer is added
    starci: [workflow, amend, pool, --change, "${run}/add.yaml"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'compose' ORDER BY created_at DESC LIMIT 1"
      as: compose
  - name: the composer's worker forgets to compose
    worker:
      task: ${compose}
      files:
        src/app.ts: "export const app = 2\n"
  - name: the composer's verify judges the module with no deferral and is red
    starci: [workflow, step, pool]
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'index.ts: error') > 0) || ':' || (instr(detail, 'feature-not-composed') > 0) FROM check_runs WHERE task_id = '${compose}' AND name = 'check-run-green' ORDER BY id DESC LIMIT 1"
        equals: ["red:1:1"]
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: pool
        reason: compose the pool
        changes:
          - op: retry
            id: compose
  - name: the composer is retried
    starci: [workflow, amend, pool, --change, "${run}/retry.yaml"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'compose' ORDER BY created_at DESC LIMIT 1"
      as: composeAgain
  - name: this time it composes the pool
    worker:
      task: ${composeAgain}
      files:
        src/app.ts: "import { pool } from \"./pool\"\nexport const app = pool\n"
  - name: the composer settles and the final verify is green
    starci: [workflow, step, pool]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${composeAgain}'"
        equals: [done]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows WHERE id = 'pool'"
        equals: [done]
  - file:
      path: plain.yaml
      yaml:
        schema: starci/workflow@1
        id: plain
        goal: a second pool with no composer named
        runner: inline
        tasks:
          - id: cache
            label: docs
            summary: write a cache module
            allowPaths: [src/cache]
            checks: [check-run-green]
  - name: a plan that names no composer
    starci: [workflow, define, "${run}/plain.yaml"]
  - starci: [workflow, start, plain]
    save:
      second: data.nodes.0.task.id
  - name: the producer writes a module nothing composes
    worker:
      task: ${second}
      files:
        src/cache/index.ts: "export const cache = 1\n"
  - name: its producer stays red on the finding
    starci: [workflow, step, plain]
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || (instr(detail, 'feature-not-composed') > 0) FROM check_runs WHERE task_id = '${second}' AND name = 'check-run-green' ORDER BY id DESC LIMIT 1"
        equals: ["red:1"]
