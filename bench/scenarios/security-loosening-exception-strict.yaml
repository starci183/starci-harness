schema: starci/scenario@1
id: security-loosening-exception-strict
group: security
title: a loosening exception covers only the lines it pins, goes red when stale, and only on a fixture, template, detector or a live ruling
inject: a fixture manifest with a warning budget, then a second budget in the same file, a stale match, an exception on a source file, and ruling exceptions citing an unknown and a live id
expect: >-
  check loosening is green with the pinned line excepted and listed; a new budget line in the same file is a finding; a match
  that covers nothing is EXCEPTION_STALE; an exception on a file that is no fixture, template or detector is refused
  EXCEPTION_KIND_REFUSED; a ruling exception citing an unknown id is refused EXCEPTION_RULING_UNKNOWN, one citing a live ruling
  covers its pinned line on any file
pass:
  - the pinned line is excepted and listed with its kind
  - the new line in the same file is red
  - the stale match is red EXCEPTION_STALE
  - the exception on src/ is refused EXCEPTION_KIND_REFUSED
  - the ruling exception citing an unknown id is refused EXCEPTION_RULING_UNKNOWN
  - the ruling exception citing a live ruling passes
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write:
      path: fixtures/lint/package.json
      content: |
        {
          "scripts": {
            "lint": "eslint . --max-warnings 3"
          }
        }
  - write:
      path: policy/loosening.yaml
      content: |
        schema: starci/loosening-policy@1
        exceptions:
          - path: fixtures/lint/package.json
            marker: gate-widening
            kind: fixture
            match: '"lint": "eslint . --max-warnings 3"'
            reason: "the lint fixture carries the budget the gate is proved against"
  - name: the pinned line passes
    starci: [check, loosening]
    expect:
      exit: 0
      contains: "\"kind\": \"fixture\""
  - write:
      path: fixtures/lint/package.json
      content: |
        {
          "scripts": {
            "lint": "eslint . --max-warnings 3",
            "lint:src": "eslint src --max-warnings 9"
          }
        }
  - name: a new line in the same file is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: "\"line\": 4"
  - write:
      path: fixtures/lint/package.json
      content: |
        {
          "scripts": {
            "lint": "eslint . --max-warnings 3"
          }
        }
  - write:
      path: policy/loosening.yaml
      content: |
        schema: starci/loosening-policy@1
        exceptions:
          - path: fixtures/lint/package.json
            marker: gate-widening
            kind: fixture
            match:
              - '"lint": "eslint . --max-warnings 3"'
              - '"lint:src": "eslint src --max-warnings 9"'
            reason: "the lint fixture carries the budget the gate is proved against"
  - name: a stale match is red
    starci: [check, loosening]
    expect:
      exit: 1
      contains: "\"index\": 1"
  - write:
      path: src/package.json
      content: |
        {
          "scripts": {
            "lint": "eslint . --max-warnings 3"
          }
        }
  - write:
      path: policy/loosening.yaml
      content: |
        schema: starci/loosening-policy@1
        exceptions:
          - path: src/package.json
            marker: gate-widening
            kind: fixture
            match: '"lint": "eslint . --max-warnings 3"'
            reason: "a source manifest is no fixture, whatever it is called"
  - name: an exception on a source file is refused
    starci: [check, loosening]
    expect:
      ok: false
      code: EXCEPTION_KIND_REFUSED
  - write:
      path: policy/loosening.yaml
      content: |
        schema: starci/loosening-policy@1
        exceptions:
          - path: src/package.json
            marker: gate-widening
            kind: ruling
            decision: no-such-ruling
            match: '"lint": "eslint . --max-warnings 3"'
            reason: "a ruling exception that cites no ruling the owner made"
  - name: a ruling exception citing an unknown id is refused
    starci: [check, loosening]
    expect:
      ok: false
      code: EXCEPTION_RULING_UNKNOWN
  - remove: fixtures/lint/package.json
  - write:
      path: policy/loosening.yaml
      content: |
        schema: starci/loosening-policy@1
        exceptions:
          - path: src/package.json
            marker: gate-widening
            kind: ruling
            decision: cli-proven-by-bench
            match: '"lint": "eslint . --max-warnings 3"'
            reason: "a ruling exception that cites a live ruling covers its pinned line on any file"
  - name: a ruling exception citing a live id passes
    starci: [check, loosening]
    expect:
      exit: 0
      contains: "\"decision\": \"cli-proven-by-bench\""
