schema: starci/scenario@1
id: coordinator-reserve-claude-full-of-workers
group: provider
title: "a claude pool full of workers still takes a Kernel relaunch: coordinator slots are reserved"
inject: "five claude worker seats run beside the Supervisor and a Kernel, past claude's maxParallel of 6"
expect: >-
  a worker pick finds claude full for workers (its coordinatorReserve held) and routes elsewhere; the Kernel's relaunch is a
  coordinator pick, which takes a reserved claude slot whatever the workers hold, so it lands on claude and not on codex
pass:
  - route explain for a worker label drops claude as full for workers
  - the relaunched Kernel seat is claude/claude-opus-5-5
  - no human intervention beyond the injected seats
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: hold
        goal: hold one doc
        runner: orca
        maxParallel: 1
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: hold
  - name: five claude workers run in the project
    sql:
      db: ledger
      exec: >-
        INSERT INTO seats (id, role, agent, model, status, started_at) VALUES
        ('s-bench1', 'worker', 'claude', 'claude-sonnet-5-5', 'ready', '2026-01-01T00:00:00.000Z'),
        ('s-bench2', 'worker', 'claude', 'claude-sonnet-5-5', 'ready', '2026-01-01T00:00:00.000Z'),
        ('s-bench3', 'worker', 'claude', 'claude-sonnet-5-5', 'ready', '2026-01-01T00:00:00.000Z'),
        ('s-bench4', 'worker', 'claude', 'claude-sonnet-5-5', 'ready', '2026-01-01T00:00:00.000Z'),
        ('s-bench5', 'worker', 'claude', 'claude-sonnet-5-5', 'ready', '2026-01-01T00:00:00.000Z')
  - name: a worker pick finds claude full for workers
    starci: [route, explain, --label, docs]
    expect:
      contains: "pool claude full for workers"
  - name: the Supervisor relaunches the Kernel
    seat: supervisor
    starci: [kernel, start, hold, --replace]
    expect:
      contains: "as claude/claude-opus-5-5"
  - assert:
      sql:
        db: ledger
        query: "SELECT agent || '/' || model FROM seats WHERE role = 'kernel' ORDER BY started_at DESC, rowid DESC LIMIT 1"
        equals: ["claude/claude-opus-5-5"]
