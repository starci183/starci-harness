schema: starci/scenario@1
id: budget-task-tries-raised
group: budget
title: "a single task out of tries is freed by a task-scoped tries raise, which a workflow-wide raise never was"
inject: >-
  a task whose contract allows one try goes red; its Kernel amends a retry, which is refused TRIES_EXHAUSTED (a harness-caused
  exhaustion looks the same: tk-c9c3abd4cd48, whose code was green and landed)
expect: >-
  the retry's amend is refused TRIES_EXHAUSTED and its refusal names the task-scoped raise; raising the workflow's ceiling
  changes nothing for it; after `budget raise <workflow> --task <key> --tries 1 --by kernel` the amend applies and the step
  queues the retry; a workflow-wide
  raise by the Kernel is refused; who and why are kept on the ledger
pass:
  - no retry task while its tries are spent, the workflow-wide raise included
  - the refusal names budget raise --task
  - the Kernel's workflow-wide raise is refused ROLE_REFUSED
  - after the task raise by the Kernel the retry is queued, as try 2
  - the raise is a tries-raised event naming the Kernel and its reason
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: once
        goal: bench workflow once
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            budget: {minutes: 30, tries: 1}
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, once]
    save:
      a: data.nodes.0.task.id
  - name: the worker files done without the file, so its verify is red
    worker:
      task: ${a}
      status: done
      files:
        docs/a-draft.md: "x\n"
  - starci: [workflow, step, once]
    expect: {}
  - file:
      path: retry.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: once
        reason: bench retry
        changes:
          - op: retry
            id: a
  - name: the retry is refused and the refusal names the way out
    starci: [workflow, amend, once, --change, "${run}/retry.yaml"]
    expect:
      exit: 1
      contains: "budget raise once --task a --tries"
  - name: a workflow-wide raise does not free one task
    starci: [budget, raise, once, --tries, "5", --by, owner, --reason, "bench: the workflow ceiling"]
  - starci: [workflow, amend, once, --change, "${run}/retry.yaml"]
    expect:
      exit: 1
      contains: TRIES_EXHAUSTED
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks
        equals: [1]
  - name: a Kernel raises no workflow-wide ceiling
    starci: [budget, raise, once, --tries, "1", --by, kernel, --reason, "bench: not mine"]
    expect:
      exit: 1
      contains: ROLE_REFUSED
  - name: the Kernel raises the one task's tries for the harness-caused exhaustion
    starci: [budget, raise, once, --task, a, --tries, "1", --by, kernel, --reason, "bench: the red was the harness's"]
    expect:
      contains: '"after": 2'
  - starci: [workflow, amend, once, --change, "${run}/retry.yaml"]
  - starci: [workflow, step, once]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: "SELECT status || ':' || try_no FROM tasks WHERE id != '${a}'"
        equals: ["queued:2"]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.by') || ':' || json_extract(data_json, '$.tries') FROM events WHERE kind = 'tries-raised' AND subject = 'once/a'"
        equals: ["kernel:1"]
