schema: starci/scenario@1
id: conflict-lease-case-insensitive
group: conflict
title: "Docs/A.md and docs/a.md are one lease on every host, since a checkout on Windows or macOS holds them as one file"
inject: two tasks lease the same file spelled in two cases
expect: the second send refuses LEASE_CONFLICT, whatever the host's filesystem
pass:
  - second send exits 1 with LEASE_CONFLICT
  - one task
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - starci:
      - contract
      - new
      - --label
      - docs
      - --summary
      - lower
      - --allow
      - docs/a.md
      - --check
      - files-exist:files=docs/a.md
      - --out
      - ${run}/c1.json
  - starci:
      - contract
      - new
      - --label
      - docs
      - --summary
      - upper
      - --allow
      - Docs/A.md
      - --check
      - files-exist:files=Docs/A.md
      - --out
      - ${run}/c2.json
  - starci:
      - task
      - send
      - ${run}/c1.json
  - starci:
      - task
      - send
      - ${run}/c2.json
    expect:
      exit: 1
      code: LEASE_CONFLICT
