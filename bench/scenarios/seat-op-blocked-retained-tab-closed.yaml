schema: starci/scenario@1
id: seat-op-blocked-retained-tab-closed
group: lifecycle
title: "an Op that ends blocked: Orca retains its dispatch, the seat settles and its tab is closed"
inject: "the worker files blocked; Orca answers its worker-stop failed and its worker-release retained, as it does for a dispatch that ended"
expect: >-
  the seat is settled (released in the ledger) once Orca fenced and retained the dispatch, and its terminal tab is closed with
  terminal close --tab right after the release: a seat's terminal lives exactly as long as the seat, retained resources included
pass:
  - the Op seat is released
  - terminal close called once for the Op's terminal
  - no seat-tab-left-open event
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: stuck
        goal: bench workflow stuck
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: stuck
  - name: kernel next dispatches the Op
    seat: kernel:stuck
    starci: [kernel, next, stuck, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM tasks
      as: a
  - read:
      db: ledger
      query: "SELECT terminal FROM seats WHERE role = 'worker'"
      as: opTerminal
  - name: Orca ends the dispatch and retains it
    orca:
      rules:
        - command: worker-stop
          fault: reply
          reply: { ok: true, result: { state: failed } }
        - command: worker-release
          fault: reply
          reply: { ok: true, result: { state: retained } }
  - name: the worker files blocked
    worker:
      task: ${a}
      status: blocked
      output:
        summary: needs a decision outside its scope
        files: []
        rulesApplied: []
  - name: kernel next settles the result
    seat: kernel:stuck
    starci: [kernel, next, stuck, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM seats WHERE role = 'worker'"
        equals:
          - released
  - assert:
      orcaCalls:
        command: terminal close
        match:
          terminal: "^${opTerminal}$"
        count: 1
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'seat-tab-left-open'"
        equals:
          - 0
