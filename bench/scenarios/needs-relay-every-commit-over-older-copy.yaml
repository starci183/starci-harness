schema: starci/scenario@1
id: needs-relay-every-commit-over-older-copy
group: needs
title: "orca: a waiter parked on two shared needs gets both relayed; the folder its branch holds an older copy of is brought to the resolver's final content by all three resolving commits"
inject: >-
  auth resolves capability:platform.sec with three keys (store creates platform/sec, strict then form edit it) and
  capability:platform.cqrs with one; workflow sub already holds an older copy of platform/sec (store's version, from a copy
  task of its own), and its pay task is blocked on both needs, cqrs reported first
expect: >-
  each need is relayed and released on its own: releasing the waiter from one need leaves its other row waiting until that
  need's relay put its commits on sub's branch, and the waiter is retried once, after the last. The sec relay judges
  "held" by content at the need's paths, never by the older copy being there: it replays every resolving commit that is not an
  ancestor of sub's head, skipping only store, whose merge changes nothing, so platform/sec reads as at form's commit
pass:
  - platform/sec/guard.md and decorators.md on sub's branch read as the resolver's final commit has them
  - one need-relayed event per need, sec's naming the two commits the older copy lacked
  - each waiter row released by its own need's relay
  - the waiter retried once
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: auth.yaml
      yaml:
        schema: starci/workflow@1
        id: auth
        goal: sign in, with the shared http security and cqrs entry
        runner: orca
        maxParallel: 2
        tasks:
          - id: store
            label: docs
            summary: create the http security folder
            allowPaths: [platform/sec]
            checks:
              - preset: files-exist
                args: {files: [platform/sec/guard.md, platform/sec/decorators.md]}
          - id: strict
            label: docs
            summary: the origin guard requires an allowed Origin
            dependsOn: [store]
            allowPaths: [platform/sec]
            checks:
              - preset: files-exist
                args: {files: [platform/sec/guard.md]}
          - id: form
            label: docs
            summary: the RequireOrigin decorator
            dependsOn: [strict]
            allowPaths: [platform/sec]
            checks:
              - preset: files-exist
                args: {files: [platform/sec/decorators.md]}
          - id: cqrs
            label: docs
            summary: export the command bus from the cqrs entry
            allowPaths: [platform/cqrs/index.md]
            checks:
              - preset: files-exist
                args: {files: [platform/cqrs/index.md]}
  - file:
      path: sub.yaml
      yaml:
        schema: starci/workflow@1
        id: sub
        goal: premium subscription payments
        runner: orca
        maxParallel: 2
        tasks:
          - id: copy
            label: docs
            summary: copy the http security folder as it stood
            allowPaths: [platform/sec]
            checks:
              - preset: files-exist
                args: {files: [platform/sec/guard.md]}
          - id: pay
            label: docs
            summary: write the payment doors, which need strict origin admission and the command bus
            dependsOn: [copy]
            allowPaths: [docs/pay.md]
            checks:
              - preset: files-exist
                args: {files: [docs/pay.md]}
  - boot:
      file: ${run}/auth.yaml
      workflow: auth
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - boot:
      file: ${run}/sub.yaml
      workflow: sub
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'store'"
      as: store
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'cqrs'"
      as: cqrs
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'copy'"
      as: copy
  - name: auth's first resolver creates the folder
    worker:
      task: ${store}
      files:
        platform/sec/guard.md: "guard v1: admits a request with no Origin\n"
        platform/sec/decorators.md: "decorators v1\n"
  - worker:
      task: ${cqrs}
      files:
        platform/cqrs/index.md: "InjectQueryBus\nInjectCommandBus\n"
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'strict'"
      as: strict
  - name: the second makes the guard strict
    worker:
      task: ${strict}
      files:
        platform/sec/guard.md: "guard v2: an allowed Origin is required\n"
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'form'"
      as: form
  - name: the third adds RequireOrigin
    worker:
      task: ${form}
      files:
        platform/sec/decorators.md: "decorators v1\nRequireOrigin\n"
  - seat: kernel:auth
    starci: [kernel, next, auth, --wait, "0"]
  - name: sub's copy task puts the older folder on its own branch
    worker:
      task: ${copy}
      files:
        platform/sec/guard.md: "guard v1: admits a request with no Origin\n"
        platform/sec/decorators.md: "decorators v1\n"
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'pay'"
      as: pay
  - name: sub's waiter cannot use the older copy
    worker:
      task: ${pay}
      status: blocked
      output:
        summary: the command bus is not exported and the origin guard admits requests with no Origin on this branch
        files: []
        rulesApplied: []
        needs:
          - {key: "capability:platform.cqrs", paths: [platform/cqrs/index.md], rule: BE-TRANSPORT-2}
          - {key: "capability:platform.sec", paths: [platform/sec/guard.md, platform/sec/decorators.md], rule: BE-AUTH-5}
  - seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - file:
      path: owner-cqrs.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-cqrs-by-auth
        kind: need-owner
        workflow: auth
        basedOn: {}
        need: {key: "capability:platform.cqrs", resolver: [cqrs]}
        note: auth landed the export
  - file:
      path: owner-sec.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-sec-by-auth
        kind: need-owner
        workflow: auth
        basedOn: {}
        need: {key: "capability:platform.sec", resolver: [store, strict, form]}
        note: auth landed the folder and both strict-origin changes
  - seat: supervisor
    starci: [supervisor, submit, "${run}/owner-cqrs.yaml"]
  - seat: supervisor
    starci: [supervisor, submit, "${run}/owner-sec.yaml"]
  - name: sub's step resolves both needs (auth is done), relays each, then retries the waiter
    seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - assert:
      sql:
        db: machine
        query: "SELECT key || ':' || state || ':' || json_array_length(resolver_json, '$.commits') FROM shared_needs ORDER BY key"
        equals: ["capability:platform.cqrs:resolved:1", "capability:platform.sec:resolved:3"]
  - name: the waiter is not retried while a need of it is not relayed yet
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE plan_key = 'pay' AND status IN ('queued', 'running')"
        equals: [0]
  - name: the next step relays the other need and retries the waiter
    seat: kernel:sub
    starci: [kernel, next, sub, --wait, "0"]
  - name: the folder reads as the resolver's final commit has it
    assert:
      exists:
        path: ${worktree.sub}/platform/sec/guard.md
        present: true
        contains: "an allowed Origin is required"
  - assert:
      exists:
        path: ${worktree.sub}/platform/sec/decorators.md
        present: true
        contains: RequireOrigin
  - assert:
      exists:
        path: ${worktree.sub}/platform/cqrs/index.md
        present: true
        contains: InjectCommandBus
  - name: each need is relayed once, sec carrying the two commits the older copy lacked
    assert:
      sql:
        db: machine
        query: "SELECT substr(subject, instr(subject, '|') + 1) || ':' || json_extract(data_json, '$.relay.status') || ':' || json_array_length(data_json, '$.relay.relayed') FROM host_events WHERE kind = 'need-relayed' AND json_extract(data_json, '$.workflow') = 'sub' ORDER BY subject"
        equals: ["capability:platform.cqrs:relayed:1", "capability:platform.sec:relayed:2"]
  - name: each waiter row is released by its own need's relay
    assert:
      sql:
        db: machine
        query: "SELECT key || ':' || json_extract(release_json, '$.relay.status') || ':' || json_array_length(release_json, '$.relay.relayed') FROM shared_need_waiters ORDER BY key"
        equals: ["capability:platform.cqrs:relayed:1", "capability:platform.sec:relayed:2"]
  - name: the waiter is retried once, after its last need
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE plan_key = 'pay' AND status IN ('queued', 'running')"
        equals: [1]
