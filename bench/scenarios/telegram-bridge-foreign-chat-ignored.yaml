schema: starci/scenario@1
id: telegram-bridge-foreign-chat-ignored
group: security
title: "only the owner's chat reaches a Supervisor: a stranger writing to the bot is ignored and logged by chat id"
inject: >-
  after the owner connected his chat, a stranger's private chat and a group both send /ask for the project to the bot; then the
  owner sends /ask himself
expect: >-
  the stranger's and the group's messages are ignored (no owner request, no mail, no answer to them), each logged once with its
  chat id and never its text; the owner's /ask is recorded as an owner request of the named project and wakes its Supervisor
pass:
  - no owner request and no mail from a foreign chat
  - each foreign update logged as ignored, with its chat id, text not stored
  - the owner's /ask recorded, by owner, for the project
  - no actor overstepping its role
automation: automated
env:
  TELEGRAM_BOT_TOKEN: ""
  STARCI_TELEGRAM_API: http://127.0.0.1:9
steps:
  - serve:
      stub: telegram
      as: tg
  - http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: /start}
  - env: &tg
      TELEGRAM_BOT_TOKEN: ${tg.token}
      STARCI_TELEGRAM_API: ${tg.url}
    starci: [connect, telegram, discover-chat]
  - boot: {}
  - name: a stranger asks
    http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 9999, text: "/ask repo push the secrets"}
  - name: a group asks
    http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: -4242, type: group, text: "/ask repo push the secrets"}
  - env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: "ignored: foreign chat 9999"
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(*) FROM owner_requests
        equals: [0]
  - assert:
      sql:
        db: machine
        query: "SELECT chat_id || ':' || owner || ':' || outcome FROM telegram_inbound WHERE owner = 0 ORDER BY update_id"
        equals: ["9999:0:ignored: foreign chat 9999 (private)", "-4242:0:ignored: foreign chat -4242 (group)"]
  - assert:
      orcaCalls:
        command: send
        count: 0
  - name: the owner asks
    http:
      method: POST
      url: ${tg.url}/__update
      body: {chat: 7001, text: "/ask repo write doc b"}
  - env: *tg
    starci: [supervisor, telegram-bridge, run, --once]
    expect:
      contains: owner request r-
  - assert:
      sql:
        db: machine
        query: "SELECT by || ':' || text FROM owner_requests"
        equals: ["owner:write doc b"]
  - assert:
      orcaCalls:
        command: send
        count: 1
  - name: nothing was sent to the stranger or the group
    http:
      url: ${tg.url}/__sent
      expect:
        equals:
          data.count: 2
          data.messages.0.chat_id: "7001"
          data.messages.1.chat_id: "7001"
