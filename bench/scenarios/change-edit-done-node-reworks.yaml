schema: starci/scenario@1
id: change-edit-done-node-reworks
group: change
title: editing the contract of a done task makes it rework, its independents keep
inject: a, b independent and done; the Kernel edits a's details
expect: a is classified redo/rework, b keep; b's commit stays; only a gets a new ledger task
pass:
  - classification a rework, b keep
  - a new task for a only
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: edit
        goal: bench workflow edit
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
          - id: b
            label: docs
            summary: write doc b
            allowPaths:
              - docs/b.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/b.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - edit
    save:
      a: data.nodes.0.task.id
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
  - name: step
    starci:
      - workflow
      - step
      - edit
    save:
      b: data.nodes.1.task.id
  - name: worker files done
    worker:
      task: ${b}
      status: done
      files:
        docs/b.md: |
          # b
  - name: step
    starci:
      - workflow
      - step
      - edit
    save: {}
  - file:
      path: edit.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: edit
        reason: owner changed a
        changes:
          - op: edit
            id: a
            set:
              details: now with a second section
  - starci:
      - workflow
      - amend
      - edit
      - --change
      - ${run}/edit.yaml
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT json_extract(value, '$.key') || ':' || json_extract(value, '$.class') FROM graph_versions, json_each(classification_json) WHERE graph_version = 2 ORDER BY 1
        equals:
          - a:rework
          - b:keep
