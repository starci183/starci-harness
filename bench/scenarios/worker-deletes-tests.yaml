schema: starci/scenario@1
id: worker-deletes-tests
group: worker
title: a worker deleting a tracked test outside its paths cannot land the deletion
inject: the repo tracks tests/a.test.js; the worker deletes it while doing its doc
expect: the harness commit carries only allowPaths, so the deletion never lands; the test stays in HEAD
pass:
  - HEAD still has tests/a.test.js after the task is done
  - the task commit touches only docs/a.md
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: |
      # bench
    tests/a.test.js: |
      export const ok = true
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: del
        goal: bench workflow del
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - del
    save:
      a: data.nodes.0.task.id
  - name: worker deletes the test
    worker:
      task: ${a}
      files:
        docs/a.md: |
          # a
      remove:
        - tests/a.test.js
  - name: step
    starci:
      - workflow
      - step
      - del
    save: {}
    expect: {}
  - assert:
      gitHas:
        path: tests/a.test.js
        present: true
