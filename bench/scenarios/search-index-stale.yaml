schema: starci/scenario@1
id: search-index-stale
group: environment
title: the search index built at cli build matches the tree it covers, and a changed, added or removed file turns the check red naming it
inject: >-
  a copy of the harness's searched tree (contexts, ops, policy, the starci skill, the harness documents) compared with the
  built index, then one contexts file edited, then one added, then one removed
expect: >-
  contexts search --check is green on the unchanged copy; after an edit it exits 1 naming the file as changed; a new file is
  named added; a deleted file is named removed
pass:
  - the copy of the tree matches the built index
  - an edited file turns the check red and is named changed
  - an added file is named added
  - a removed file is named removed
  - no human intervention beyond the injected fault
automation: automated
steps:
  - write: { path: ops, from: "${ops}" }
  - write: { path: contexts, from: "${ops}/../contexts" }
  - write: { path: policy, from: "${ops}/../policy" }
  - write: { path: skills/starci, from: "${ops}/../skills/starci" }
  - write: { path: README.md, from: "${ops}/../README.md" }
  - write: { path: CONTRIBUTING.md, from: "${ops}/../CONTRIBUTING.md" }
  - write: { path: cli/README.md, from: "${ops}/../cli/README.md" }
  - write: { path: packages/README.md, from: "${ops}/../packages/README.md" }
  - name: the unchanged copy matches the built index
    starci: [contexts, search, --check, --root, .]
    expect:
      exit: 0
  - write:
      path: contexts/ui/components/tabs.md
      content: |
        # Tabs

        ## Choose
        Rewritten after the index was built.
  - name: an edited file turns the index stale
    starci: [contexts, search, --check, --root, .]
    expect:
      exit: 1
      contains: "contexts/ui/components/tabs.md (changed)"
  - write:
      path: contexts/ui/components/stepper.md
      content: |
        # Stepper

        ## Choose
        A new component page the index has never seen.
  - name: an added file is named
    starci: [contexts, search, --check, --root, .]
    expect:
      exit: 1
      contains: "contexts/ui/components/stepper.md (added)"
  - remove: contexts/ui/scale.md
  - name: a removed file is named
    starci: [contexts, search, --check, --root, .]
    expect:
      exit: 1
      contains: "contexts/ui/scale.md (removed)"
