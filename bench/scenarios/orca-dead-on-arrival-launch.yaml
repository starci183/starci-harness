schema: starci/scenario@1
id: orca-dead-on-arrival-launch
group: orca
title: "Orca completed an Op's launch but the agent never started its turn: the dispatch is judged, fenced, and the task relaunched on another member"
inject: >-
  worker-start's answer is lost (effect_unknown); request-show says completed with a receipt naming the dispatch, and worker-show
  keeps that worker at start_unknown, past stall.startDeadlineMinutes
expect: >-
  kernel next never replays the completed request: it reads the receipt's dispatch, waits while the start is young, then fences
  the dead dispatch (worker-stop), closes the attempt launch-failed with no try spent, reports a stall for its member and queues
  the task again; the next step launches it once more on another pool
pass:
  - no replay of the completed request; two Op launches under two request ids
  - the first attempt ends launch-failed and its dispatch is stopped
  - the second attempt runs on another pool
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: doa
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: doa
  - name: the Op launch lands, its answer is lost, and its agent never starts its turn
    orca:
      set:
        newWorkerState: start_unknown
      rules:
        - command: worker-start
          fault: lost-reply
          match:
            task-title: '^\[Op\]'
  - seat: kernel:doa
    starci: [kernel, next, doa, --wait, "0"]
  - name: later workers start normally
    orca:
      set:
        newWorkerState: ready
  - name: a young start waits
    seat: kernel:doa
    starci: [kernel, next, doa, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals: [effect_unknown]
  - sql:
      db: ledger
      exec: UPDATE seats SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-11 minutes') WHERE role = 'worker'
  - name: past the start deadline the dispatch is dead on arrival
    seat: kernel:doa
    starci: [kernel, next, doa, --wait, "0"]
  - name: the requeued task launches again
    seat: kernel:doa
    starci: [kernel, next, doa, --wait, "0"]
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 2
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        distinct: retry-request
        count: 2
  - assert:
      orcaCalls:
        command: worker-stop
        min: 1
  - assert:
      sql:
        db: ledger
        query: SELECT COALESCE(outcome, '-') FROM attempts ORDER BY seq
        equals: [launch-failed, "-"]
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(DISTINCT agent) FROM attempts
        equals: [2]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE kind = 'seat-dead-on-arrival'"
        equals: [1]
