schema: starci/scenario@1
id: verify-red-preserves-and-resets
group: verify
title: a red verify preserves the work, resets the paths and commits nothing
inject: the worker files done but never wrote the file its files-exist check requires; it left a stray draft inside allowPaths
expect: task verify is red, the task fails naming the red check, the draft is preserved under preserved/<task> and removed from the worktree, the lease is released, the workflow blocks
pass:
  - task failed, workflow blocked
  - no commit carries the task trailer
  - preserved/<task> exists in the project state
  - no lease left
  - the worktree is clean
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: red
        goal: bench workflow red
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a/final.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - red
    save:
      a: data.nodes.0.task.id
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a/draft.md: |
          draft
  - name: step
    starci:
      - workflow
      - step
      - red
    save: {}
    expect:
      exit: 1
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - failed
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows
        equals:
          - blocked
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM leases
        equals:
          - 0
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 0
  - assert:
      exists:
        path: ${project}/preserved/${a}
        present: true
  - assert:
      gitClean: true
