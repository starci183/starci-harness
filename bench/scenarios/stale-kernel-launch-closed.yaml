schema: starci/scenario@1
id: stale-kernel-launch-closed
group: orca
title: "a Kernel launch left launch-unknown with no dispatch and no terminal past the deadline is closed by the tick and stops holding a pool slot"
inject: >-
  a project's Kernel relaunch gets an outcome_unknown answer naming nothing (no dispatch, no terminal, no receipt), and the seat
  sits launch-unknown past effectUnknownDeadlineMinutes, as the abandoned launches of a project nobody sweeps do
expect: >-
  supervisor tick's host-wide reconcile finds the stale unreconciled launch, sees nothing of it alive (request-show knows no
  dispatch, no terminal), closes it launch-failed with a stale-launch-closed host event, and the pool no longer counts it
pass:
  - the stale seat ends launch-failed
  - one stale-launch-closed host event naming it
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: sk
        goal: bench workflow sk
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: sk
  - name: the Kernel exits, and its relaunch's answer names nothing
    orca:
      worker:
        dispatch: kernel
        state: exited
      rules:
        - command: worker-start
          fault: unknown
          match:
            task-title: '^\[Kernel\]'
  - name: the Kernel lease and the progress clock lapse
    sql:
      db: ledger
      exec: UPDATE seats SET lease_until = '2020-01-01T00:00:00.000Z' WHERE role = 'kernel'; UPDATE events SET at = '2020-01-01T00:00:00.000Z'
  - name: supervisor next relaunches the Kernel; Orca answers outcome_unknown with nothing named
    seat: supervisor
    starci: [supervisor, next, --wait, "0"]
  - read:
      db: ledger
      query: SELECT id FROM seats WHERE role = 'kernel' AND status = 'launch-unknown'
      as: stale
  - name: the launch ages past the effect-unknown deadline
    sql:
      db: ledger
      exec: UPDATE seats SET started_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-16 minutes') WHERE id = '${stale}'
  - name: the tick closes the stale launch
    starci: [supervisor, tick]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM seats WHERE id = '${stale}'
        equals: [launch-failed]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM host_events WHERE kind = 'stale-launch-closed' AND data_json LIKE '%${stale}%'"
        equals: [1]
