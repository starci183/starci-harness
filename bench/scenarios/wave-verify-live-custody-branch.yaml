schema: starci/scenario@1
id: wave-verify-live-custody-branch
group: verify
title: "a verify-only task's live suite gets its keys in the wave from the custody sealed on the workflow's branch, through a typed useSandbox<T>(...) call; a key sealed blank waits on the owner and a held key the run still lacks stops the harness, neither spending a try"
inject: >-
  main holds no custody: the dev ai member holding OPENROUTER_API_KEY is sealed on each workflow's branch only, as
  starci-next-app's lesson-ai sealed .starcistacks/dev/secrets/ai.enc in 5a0f350. Each verify task changes no file and names
  its live suite folder; the spec declares the key through `const CUSTODY_KEYS: ReadonlyArray<string> = [...]` passed to
  `useSandbox<LessonAi>({ keys: CUSTODY_KEYS })`, the typed call starci-next-app's lesson-ai-router-live spec makes. The first
  workflow's branch seals the key with a value; the second's seals it named with a blank value (`app secret set` refuses an empty one); the third's spec boots a keyless typed
  sandbox and reaches OPENROUTER_API_KEY through a helper, so nothing is handed while its branch's custody holds the key
expect: >-
  the first wave takes the typed spec for live, hands OPENROUTER_API_KEY from the branch head's dev/ai member and runs the suite
  green, the value scrubbed, the task done at try 1; the second refuses CUSTODY_KEY_MISSING before the suite runs and leaves its
  task awaiting_owner at try 1 with no red verdict, the owner's question; the third reaches no verdict (VERIFY_INFRA,
  wave-infra naming the key and dev/ai), its task done at try 1 with no red verdict, never returned as its own red
pass:
  - a typed useSandbox<T>(...) spec is a live suite, and its keys come from the workflow branch's custody that main lacks
  - a key sealed blank leaves the task awaiting_owner at try 1 with CUSTODY_KEY_MISSING, no red verdict
  - a held key the run reports undeclared is VERIFY_INFRA, no try, no wave-returned
  - the fake value appears in no verb output, check row or event
  - no human intervention beyond the injected fault
automation: automated
env:
  OPENROUTER_API_KEY: ""
  STARCI_OPS_DIR: ${repo}/ops
# The jest stand-in runs exactly the paths --runTestsByPath gives it. A spec passes only when every upper-case key quoted in it is
# in the environment and OPENROUTER_API_KEY hashes to the fixture value's sha256; a missing key fails the way @starci/test-world's
# sandbox does, with a TEST_WORLD_NOT_DECLARED line naming it.
repo:
  files:
    README.md: "# bench scratch custody on the branch\n"
    hfs.json: '{"hfs": 3, "kind": "app", "edition": "full", "project": "bench-custody-branch"}'
    package.json: '{"name": "bench-custody-branch", "version": "1.0.0", "private": true, "scripts": {"test:e2e": "cd be && node ../node_modules/jest/bin/jest.js --selectProjects e2e"}}'
    be/jest.config.js: |
      module.exports = { projects: [{ displayName: "e2e", testMatch: ["<rootDir>/src/tests/e2e/**/*.e2e-spec.ts"] }] }
    be/src/tests/e2e/lesson-ai-router-live/lesson-ai-router-live.e2e-spec.ts: |
      import { useSandbox } from "../../world/use-test-world"
      import type { LessonAi } from "../../world/lesson-ai"

      const CUSTODY_KEYS: ReadonlyArray<string> = ["OPENROUTER_API_KEY"]

      const healthy = useSandbox<LessonAi>({
          provider: "openrouter",
          keys: CUSTODY_KEYS,
          module: () => ({ keys: [{ alias: "openrouter-primary", resolve: () => "pool-value" }] }),
      })
    be/src/tests/e2e/helper-live/helper-live.e2e-spec.ts: |
      import { useSandbox } from "../../world/use-test-world"
      import { liveProvider } from "../../world/live-provider"
      import type { Fake } from "../../world/fake"

      const sandbox = useSandbox<Fake>({ provider: "fake", keys: [] })

      const live = liveProvider("openrouter", "OPENROUTER_API_KEY")
    node_modules/jest/bin/jest.js: |
      const { createHash } = require("node:crypto")
      const { readFileSync } = require("node:fs")
      const args = process.argv.slice(2)
      const files = args.filter((a) => !a.startsWith("-") && a !== "e2e")
      let failed = 0
      for (const f of files) {
        const text = readFileSync(f, "utf8")
        const keys = [...new Set([...text.matchAll(/"([A-Z][A-Z0-9_]*)"/g)].map((m) => m[1]))]
        const missing = keys.filter((k) => !process.env[k])
        if (missing.length > 0) {
          failed += 1
          console.log("FAIL " + f + " TestWorldError: TEST_WORLD_NOT_DECLARED: the openrouter sandbox keys are not declared in the environment: " + missing.join(", "))
          continue
        }
        const got = process.env.OPENROUTER_API_KEY || ""
        const ok = createHash("sha256").update(got).digest("hex") === "bea4dde82d6a6f8e410532875c4dbe5902ae549c85aa1101a5f74d03eb7fbd69"
        console.log("debug: provider key " + got)
        if (ok) console.log("PASS " + f + " custody key reached the run")
        else { failed += 1; console.log("FAIL " + f + " the key is not the custody value") }
      }
      process.exit(failed === 0 ? 0 : 1)
steps:
  - name: copy ops/ into the scratch repository
    write: { path: ops, from: "${ops}" }
  - write: { path: contexts/project/work.md, from: "${ops}/../contexts/project/work.md" }
  - write: { path: contexts/project/lint.md, from: "${ops}/../contexts/project/lint.md" }
  - name: the suites run whatever else this host runs (the governor is not under test here)
    starci: [config, set, liveness.heavy.maxCpuPercent, "100"]
  - starci: [config, set, liveness.heavy.reserveMb, "0"]
  - name: main gets the sops rules and the age identity, and no sealed member
    starci: [app, secret, init]
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: secret init, no custody on main"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: live
        goal: bench a verify-only live suite whose custody is sealed on the branch
        runner: inline
        tasks:
          - id: router-live
            label: verify
            summary: live proof of the ai router with the keys from custody
            allowPaths: [be/src/tests/reports/router]
            inputs: {suite: "npm run test:e2e -- src/tests/e2e/lesson-ai-router-live", step: live}
  - file:
      path: wf-empty.yaml
      yaml:
        schema: starci/workflow@1
        id: empty
        goal: bench a live suite whose key is sealed blank on the branch
        runner: inline
        tasks:
          - id: router-empty
            label: verify
            summary: live proof of the ai router while custody holds the key blank
            allowPaths: [be/src/tests/reports/empty]
            inputs: {suite: "npm run test:e2e -- src/tests/e2e/lesson-ai-router-live", step: live}
  - file:
      path: wf-helper.yaml
      yaml:
        schema: starci/workflow@1
        id: helper
        goal: bench a live suite the harness hands nothing although the branch's custody holds the key
        runner: inline
        tasks:
          - id: helper-live
            label: verify
            summary: live proof through a helper that reads the key itself
            allowPaths: [be/src/tests/reports/helper]
            inputs: {suite: "npm run test:e2e -- src/tests/e2e/helper-live", step: live}
  - name: each workflow runs from a checkout of its own branch, as an orca workflow runs from its worktree; main's checkout never holds custody
    git: [worktree, add, -q, -b, flow-live, "${run}/flow-live"]
  - git: [worktree, add, -q, -b, flow-empty, "${run}/flow-empty"]
  - git: [worktree, add, -q, -b, flow-helper, "${run}/flow-helper"]
  - starci: [workflow, define, "${run}/wf.yaml"]
    cwd: ${run}/flow-live
  - starci: [workflow, define, "${run}/wf-empty.yaml"]
    cwd: ${run}/flow-empty
  - starci: [workflow, define, "${run}/wf-helper.yaml"]
    cwd: ${run}/flow-helper
  - name: the host's secret.env holds the fake provider key the owner seals into the workflow's branch
    file:
      path: ${run}/secret.env
      content: |
        OPENROUTER_API_KEY=bench-fixture-custody-value
  - name: the live branch's dev ai member holds the key, sealed there and committed there only
    starci: [app, secret, set, dev, ai, OPENROUTER_API_KEY, --from-host, OPENROUTER_API_KEY]
    cwd: ${run}/flow-live
    expect: { exit: 0, lacks: bench-fixture-custody-value }
  - git: [-C, "${run}/flow-live", add, -A]
  - git: [-C, "${run}/flow-live", commit, -q, -m, "custody: the ai member holds OPENROUTER_API_KEY"]
  - name: main's checkout holds no sealed member
    assert:
      exists: { path: .starcistacks/dev/secrets/ai.enc, present: false }
  - starci: [workflow, start, live]
    cwd: ${run}/flow-live
    save:
      router: data.nodes.0.task.id
  - name: the verify worker changes nothing and reports the suite it was asked to prove
    worker:
      task: ${router}
      output:
        summary: "the live router suite is the proof; the harness runs it with custody"
        files: []
        verdict: passed
        findings: []
  - name: the step verifies it and the wave runs its deferred suite with the key from the branch's custody
    starci: [workflow, step, live]
    cwd: ${run}/flow-live
    expect: { lacks: bench-fixture-custody-value }
  - starci: [workflow, step, live]
    cwd: ${run}/flow-live
    expect: { lacks: bench-fixture-custody-value }
  - assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id AND a.verdict = 'red') FROM tasks t WHERE t.id = '${router}'"
        equals: ["done:1:0"]
  - name: the typed spec ran with the key handed from dev/ai of the branch head
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE task_id = '${router}' AND name = 'suite-verdict' AND status = 'green' AND detail LIKE '%custody: OPENROUTER_API_KEY from dev/ai, handed to this run''s environment only%' AND detail LIKE '%PASS src/tests/e2e/lesson-ai-router-live/lesson-ai-router-live.e2e-spec.ts custody key reached the run%' AND detail LIKE '%debug: provider key [redacted:custody]%'"
        equals: [1]
  - name: the empty branch's ai member names the key with a blank value (set refuses an empty one)
    starci: [app, secret, set, dev, ai, OPENROUTER_API_KEY]
    cwd: ${run}/flow-empty
    stdin: " "
    expect: { exit: 0 }
  - git: [-C, "${run}/flow-empty", add, -A]
  - git: [-C, "${run}/flow-empty", commit, -q, -m, "custody: the ai member names OPENROUTER_API_KEY, blank"]
  - starci: [workflow, start, empty]
    cwd: ${run}/flow-empty
    save:
      empty: data.nodes.0.task.id
  - worker:
      task: ${empty}
      output:
        summary: "the live router suite is the proof; the harness runs it with custody"
        files: []
        verdict: passed
        findings: []
  - starci: [workflow, step, empty]
    cwd: ${run}/flow-empty
    expect: { lacks: bench-fixture-custody-value }
  - starci: [workflow, step, empty]
    cwd: ${run}/flow-empty
    expect: { lacks: bench-fixture-custody-value }
  - name: the key sealed blank waits on the owner, no try spent, no red verdict
    assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id AND a.verdict = 'red') || ':' || (SELECT COUNT(*) FROM events e WHERE e.subject = t.id AND e.kind = 'verify-stuck' AND json_extract(e.data_json, '$.code') = 'CUSTODY_KEY_MISSING' AND json_extract(e.data_json, '$.reason') LIKE 'custody lacks OPENROUTER_API_KEY in dev%' AND json_extract(e.data_json, '$.owner') = 1) FROM tasks t WHERE t.id = '${empty}'"
        equals: ["awaiting_owner:1:0:1"]
  - name: no suite ran for the blank key
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE task_id = '${empty}' AND name = 'suite-verdict'"
        equals: [0]
  - starci: [app, secret, set, dev, ai, OPENROUTER_API_KEY, --from-host, OPENROUTER_API_KEY]
    cwd: ${run}/flow-helper
    expect: { exit: 0, lacks: bench-fixture-custody-value }
  - git: [-C, "${run}/flow-helper", add, -A]
  - git: [-C, "${run}/flow-helper", commit, -q, -m, "custody: the ai member holds OPENROUTER_API_KEY"]
  - starci: [workflow, start, helper]
    cwd: ${run}/flow-helper
    save:
      helper: data.nodes.0.task.id
  - name: the host secret.env is gone, so only custody can hand the key over
    file:
      path: ${run}/secret.env
      content: "# empty\n"
  - worker:
      task: ${helper}
      output:
        summary: "the live helper suite is the proof; the harness runs it with custody"
        files: []
        verdict: passed
        findings: []
  - starci: [workflow, step, helper]
    cwd: ${run}/flow-helper
    expect: { lacks: bench-fixture-custody-value }
  - name: the wave whose run reports a held key undeclared reaches no verdict
    starci: [workflow, step, helper]
    cwd: ${run}/flow-helper
    expect: { lacks: bench-fixture-custody-value }
  - assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id AND a.verdict = 'red') || ':' || (SELECT COUNT(*) FROM events e WHERE e.subject = t.id AND e.kind = 'wave-returned') FROM tasks t WHERE t.id = '${helper}'"
        equals: ["done:1:0:0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) > 0 FROM events WHERE subject = 'helper' AND kind = 'wave-infra' AND json_extract(data_json, '$.error') LIKE '%reports OPENROUTER_API_KEY as not declared although custody of dev holds it (OPENROUTER_API_KEY in ai.enc.yaml)%'"
        equals: [1]
  - name: the value is in no check row and no event
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM check_runs WHERE detail LIKE '%bench-fixture-custody-value%') + (SELECT COUNT(*) FROM events WHERE data_json LIKE '%bench-fixture-custody-value%')"
        equals: [0]
