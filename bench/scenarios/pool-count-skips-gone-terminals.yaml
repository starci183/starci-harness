schema: starci/scenario@1
id: pool-count-skips-gone-terminals
group: orca
title: "seats whose terminals Orca no longer lists fill the claude pool on paper: once the tick records the terminal list they stop counting and the Kernel routes to Claude again"
inject: >-
  six open claude Kernel seats from an hour ago, each recording a terminal Orca does not list (the state a crashed host or an
  abandoned project leaves), so the claude pool reads full even for a coordinator pick: its coordinatorReserve is spent and
  the pool is past its maxParallel
expect: >-
  before any tick the pool counts them and the Kernel route falls to codex; supervisor tick records Orca's full terminal list,
  and from then on the pool count leaves those seats out, so route explain picks claude for the Kernel, by order
pass:
  - before the tick the kernel route picks codex (claude full)
  - after the tick the kernel route picks claude
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: pc
        goal: bench workflow pc
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: pc
  # Kernel seats, not worker seats: a coordinator pick takes a reserved slot whatever the workers hold, so only coordinator
  # seats past the reserve make the pool full for the Kernel route.
  - name: six claude Kernel seats whose terminals are long gone
    sql:
      db: ledger
      exec: >-
        INSERT INTO seats (id, role, agent, model, status, started_at, terminal) VALUES
        ('s-g1', 'kernel', 'claude', 'claude-opus-5-5', 'ready', strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-60 minutes'), 'term-gone-1'),
        ('s-g2', 'kernel', 'claude', 'claude-opus-5-5', 'ready', strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-60 minutes'), 'term-gone-2'),
        ('s-g3', 'kernel', 'claude', 'claude-opus-5-5', 'ready', strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-60 minutes'), 'term-gone-3'),
        ('s-g4', 'kernel', 'claude', 'claude-opus-5-5', 'ready', strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-60 minutes'), 'term-gone-4'),
        ('s-g5', 'kernel', 'claude', 'claude-opus-5-5', 'ready', strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-60 minutes'), 'term-gone-5'),
        ('s-g6', 'kernel', 'claude', 'claude-opus-5-5', 'launch-unknown', strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-60 minutes'), 'term-gone-6')
  - name: before a tick the gone seats fill the claude pool
    starci: [route, explain, --label, kernel]
    save:
      before: data.chosen.agent
  - assert:
      sql:
        db: ledger
        query: SELECT '${before}'
        equals: [codex]
  - name: the tick records Orca's terminal list
    starci: [supervisor, tick]
  - name: the gone seats no longer count
    starci: [route, explain, --label, kernel]
    save:
      after: data.chosen.agent
  - assert:
      sql:
        db: ledger
        query: SELECT '${after}'
        equals: [claude]
