schema: starci/scenario@1
id: seat-launch-readiness-timeout-strikes
group: provider
title: "an Op's agent times out at readiness with an ordinary screen: a launch strike, and the seat says why"
inject: >-
  worker-start fails at agent_readiness with lastError timeout, naming the agent terminal it created; that terminal's screen
  shows an ordinary agent start with no prompt waiting
expect: >-
  the harness reads the terminal once, finds no blocked prompt, records the seat's failure as launch with the screen's last
  lines, closes the attempt launch-failed, strikes the provider once for launch, requeues the task and raises no escalation
pass:
  - the agent terminal is read once with orca terminal read
  - "the seat's failure is launch at agent_readiness, its error Orca's lastError, the screen recorded"
  - the attempt ends launch-failed and the task is queued again
  - the provider takes one launch strike
  - no blocked-prompt escalation is raised
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: tmo
        goal: bench workflow tmo
        runner: orca
        maxParallel: 1
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: tmo
  - name: the Op's worker-start times out at readiness, its agent terminal showing an ordinary start
    orca:
      terminal: {handle: term-slow, live: true}
      set:
        screens:
          term-slow:
            - "PS D:\\work> claude --model claude-opus-5-5"
            - ""
            - "Starting Claude Code..."
            - "Loading project context"
            - ""
      rules:
        - command: worker-start
          match:
            task-title: '^\[Op\]'
          fault: reply
          exit: 1
          times: 1
          reply:
            ok: false
            result:
              dispatchId: dispatch-slow
              state: failed
              stage: agent_readiness
              failedStage: agent_readiness
              lastError: timeout
              effects:
                - {kind: terminal, role: agent, action: created, id: term-slow, surface: visible}
              residualResources:
                - {kind: terminal, role: agent, action: created, id: term-slow, surface: visible}
  - name: kernel next dispatches; the launch fails at readiness
    seat: kernel:tmo
    starci: [kernel, next, tmo, --wait, "0"]
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals:
          - queued
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(failure_json, '$.kind') || ':' || json_extract(failure_json, '$.stage') || ':' || json_extract(failure_json, '$.error') || ':' || json_array_length(failure_json, '$.screen') || ':' || (json_extract(failure_json, '$.prompt') IS NULL) FROM seats WHERE role = 'worker'"
        equals:
          - "launch:agent_readiness:timeout:3:1"
  - assert:
      sql:
        db: ledger
        query: SELECT outcome FROM attempts
        equals:
          - launch-failed
  - name: one launch strike on the provider
    assert:
      sql:
        db: machine
        query: "SELECT json_extract(data_json, '$.kind') FROM provider_events WHERE kind = 'strike'"
        equals:
          - launch
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE subject LIKE 'blocked-prompt:%'"
        equals:
          - 0
  - assert:
      orcaCalls:
        command: terminal read
        match:
          terminal: '^term-slow$'
        count: 1
