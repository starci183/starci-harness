schema: starci/scenario@1
id: lifecycle-resume-after-restart
group: lifecycle
title: a workflow resumes from the ledger alone after every harness process restarted
inject: all CLI processes and coordinators exit mid-run; a new session runs workflow step
expect: "the step reads ledger + git + Orca and continues: done stays done, live tasks keep their seats, nothing is redone"
pass:
  - no task re-dispatched
  - no new commit for done tasks
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: "S3 state CAS fixes: intent rows (settling, cancelling), basedOn/cmdId dedupe, recovery that reconciles"
manual:
  - start a 3-task orca workflow
  - file one result
  - drop every in-memory state (new process)
  - step
  - assert one settle, no relaunch
