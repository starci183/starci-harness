schema: starci/scenario@1
id: worker-files-twice
group: worker
title: a second result for the same attempt is refused
inject: the worker files done, then files failed for the same task
expect: the second filing refuses; the first result stands, immutable
pass:
  - second task result exits 1
  - exactly one results row
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: twice
        goal: bench workflow twice
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - twice
    save:
      a: data.nodes.0.task.id
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
  - file:
      path: out2.json
      content: '{"summary":"again","files":[],"rulesApplied":[]}'
  - name: second filing
    starci:
      - task
      - result
      - ${a}
      - --status
      - failed
      - --output
      - "@${run}/out2.json"
    expect:
      exit: 1
      ok: false
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM results
        equals:
          - 1
