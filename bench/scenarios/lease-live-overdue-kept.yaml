schema: starci/scenario@1
id: lease-live-overdue-kept
group: conflict
title: "an in-progress task's overdue lease is not released by a step"
inject: "w1's task is still open (queued, not returned) and its lease is moved into the past; w2 steps"
expect: "w1 keeps its lease and w2's node waits: time alone never frees a path a task may still write"
pass:
  - w1's lease is still held after w2's step
  - w2 has no task
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: w1.yaml
      yaml:
        schema: starci/workflow@1
        id: w1
        goal: bench workflow w1
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - file:
      path: w2.yaml
      yaml:
        schema: starci/workflow@1
        id: w2
        goal: bench workflow w2
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: rewrite doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/w1.yaml
    save: {}
  - name: define
    starci:
      - workflow
      - define
      - ${run}/w2.yaml
    save: {}
  - name: start
    starci:
      - workflow
      - start
      - w1
    save:
      a: data.nodes.0.task.id
  - name: start
    starci:
      - workflow
      - start
      - w2
    save: {}
  - sql:
      db: ledger
      exec: UPDATE leases SET expires_at = '2000-01-01T00:00:00.000Z'
  - name: step
    starci:
      - workflow
      - step
      - w1
    save: {}
  - name: step
    starci:
      - workflow
      - step
      - w2
    save: {}
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM leases WHERE task_id = '${a}'
        equals:
          - 1
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM events WHERE kind = 'leases-expired'
        equals:
          - 0
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks WHERE workflow_id = 'w2'
        equals:
          - 0
