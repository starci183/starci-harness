schema: starci/scenario@1
id: worker-partial-output-write
group: worker
title: a truncated output file is refused, not half-recorded
inject: the output json is cut off mid-write
expect: task result refuses (unreadable output); no result recorded; the worker can file again
pass:
  - exit 1
  - no results row
  - a correct filing afterwards is accepted
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: cut
        goal: bench workflow cut
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - cut
    save:
      a: data.nodes.0.task.id
  - file:
      path: half.json
      content: '{"summary": "wrote a", "files": ["docs/a'
  - starci:
      - task
      - result
      - ${a}
      - --status
      - done
      - --output
      - "@${run}/half.json"
    expect:
      exit: 1
      ok: false
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM results
        equals:
          - 0
  - name: worker files done
    worker:
      task: ${a}
      status: done
      files:
        docs/a.md: |
          # a
