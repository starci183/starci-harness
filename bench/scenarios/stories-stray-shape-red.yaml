schema: starci/scenario@1
id: stories-stray-shape-red
group: verify
title: "check stories is red when a story draws a shape the block's union does not have"
inject: "a second stories file for LeadBoardBlockBase sets shape: kanban, which LeadBoardBlockShape does not name"
expect: "check stories names the stray story as STORY_SHAPE_UNKNOWN, listing the union's real shapes, and nothing else"
pass:
  - the verb exits 1 with verdict red
  - the one finding is STORY_SHAPE_UNKNOWN at the stray story's file
  - no human intervention beyond the injected fault
automation: automated
steps:
  - name: copy the shape-slot fixture into the scratch repository
    write: { path: ".", from: "${ops}/../bench/fixtures/shape-slot/app" }
  - name: add a story for a shape nobody drew
    write:
      path: fe/apps/leads/stories/LeadBoardBlockKanban.stories.tsx
      content: |
        import type { Meta, StoryObj } from "@storybook/react"
        import { LeadBoardBlockBase } from "@/components/blocks/LeadBoardBlock/component"
        import { LEAD_BOARD_ARGS } from "./LeadBoardBlock.data"

        const meta = { title: "Blocks/LeadBoardBlockKanban", component: LeadBoardBlockBase, args: LEAD_BOARD_ARGS } satisfies Meta<typeof LeadBoardBlockBase>

        export default meta

        type Story = StoryObj<typeof meta>

        export const KanbanShape: Story = { args: { shape: "kanban" } }
  - name: the stray shape is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"code": "STORY_SHAPE_UNKNOWN"' }
  - name: it names the story, its shape and the real union
    starci: [check, stories]
    expect: { exit: 1, contains: 'story KanbanShape sets shape: \"kanban\", which is no shape of LeadBoardBlock: LeadBoardBlockShape is \"list\" | \"stages\" | \"unassigned\"' }
  - name: it points at the stray story's file
    starci: [check, stories]
    expect: { exit: 1, contains: '"file": "stories/LeadBoardBlockKanban.stories.tsx"' }
  - name: nothing else is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"findings": 1' }
