schema: starci/scenario@1
id: change-edit-queued-node
group: change
title: editing a queued task replaces it without spending a try
inject: the Kernel edits a's details while a is queued and unworked
expect: the queued task is cancelled and a new one queued under the new contract; no try counted for the cancelled one
pass:
  - one cancelled and one queued task for a
  - the queued task carries the new details
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: q
        goal: bench workflow q
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - q
    save: {}
  - file:
      path: edit.yaml
      yaml:
        schema: starci/workflow-change@1
        workflow: q
        reason: clarify
        changes:
          - op: edit
            id: a
            set:
              details: two sections
  - starci:
      - workflow
      - amend
      - q
      - --change
      - ${run}/edit.yaml
    expect: {}
  - name: step
    starci:
      - workflow
      - step
      - q
    save: {}
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks ORDER BY created_at
        equals:
          - cancelled
          - queued
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks WHERE status = 'queued' AND contract_json LIKE '%two sections%'
        equals:
          - 1
