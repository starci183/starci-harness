schema: starci/scenario@1
id: verify-live-suite-custody-const
group: verify
title: "a live suite whose keys sit in a const gets them from custody; a declaration the harness cannot read, or a held key the run still reports undeclared, is the harness's defect and spends no try"
inject: >-
  the app's custody (.starcistacks/dev, ai member) holds OPENROUTER_API_KEY with a fake value; one task names a live suite that
  declares it through `const CUSTODY_KEYS: ReadonlyArray<string> = ["OPENROUTER_API_KEY"]` passed as `keys: CUSTODY_KEYS` to two
  useSandbox calls, beside a pool's `keys: [{ alias, resolve }]` object array; a second task names a live suite whose keys come
  from a function call the harness cannot reduce to string literals; a third, in a workflow of its own, names a live suite that
  declares no key but reaches OPENROUTER_API_KEY through a helper, so nothing is handed and the run fails
  TEST_WORLD_NOT_DECLARED for a key custody holds (the bench's policy leaves the test checks to each workflow's wave)
expect: >-
  the first wave hands OPENROUTER_API_KEY to the router's run (the const is read, the pool aliases are not custody names) and
  the suite passes with the value scrubbed; the second wave refuses CUSTODY_KEYS_UNRESOLVED naming spec:line before the suite
  runs and leaves that task awaiting_owner at try 1 with no red verdict, and the tick files one blocking harness-defect ticket
  for it, no owner question; the third wave reaches no verdict (VERIFY_INFRA, wave-infra), its task stays done at try 1 with no
  red verdict, and it opens one harness-defect ticket deduped by CUSTODY_KEY_NOT_HANDED that the next wave bumps instead of
  opening another
pass:
  - the const-declared key reaches the live suite and the check names the custody member
  - the unresolvable declaration leaves the task awaiting_owner at try 1 with CUSTODY_KEYS_UNRESOLVED and its spec:line, no red verdict
  - the held key reported undeclared spends no try, and its ticket is one, bumped on repeat
  - the fake value appears in no verb output, check row, event or ticket
  - no human intervention beyond the injected fault
automation: automated
env:
  OPENROUTER_API_KEY: ""
  STARCI_OPS_DIR: ${repo}/ops
# The jest stand-in runs exactly the paths --runTestsByPath gives it. A spec passes only when every upper-case key quoted in it is
# in the environment and OPENROUTER_API_KEY hashes to the fixture value's sha256; a missing key fails the way @starci/test-world's
# sandbox does, with a TEST_WORLD_NOT_DECLARED line naming it.
repo:
  files:
    README.md: "# bench scratch custody const\n"
    hfs.json: '{"hfs": 3, "kind": "app", "edition": "full", "project": "bench-custody-const"}'
    package.json: '{"name": "bench-custody-const", "version": "1.0.0", "private": true, "scripts": {"test:e2e": "cd be && node ../node_modules/jest/bin/jest.js --selectProjects e2e"}}'
    be/jest.config.js: |
      module.exports = { projects: [{ displayName: "e2e", testMatch: ["<rootDir>/src/tests/e2e/**/*.e2e-spec.ts"] }] }
    be/src/tests/e2e/ai/router.e2e-spec.ts: |
      import { useSandbox } from "../../world/use-test-world"

      const CUSTODY_KEYS: ReadonlyArray<string> = ["OPENROUTER_API_KEY"]

      const pool = { providers: [{ id: "openrouter", keys: [{ alias: "openrouter-primary", resolve: () => "pool-value" }] }] }

      const healthy = useSandbox({ provider: "openrouter", keys: CUSTODY_KEYS, module: () => pool })

      const refused = useSandbox({ provider: "openrouter", keys: CUSTODY_KEYS, module: () => pool })
    be/src/tests/e2e/other/other.e2e-spec.ts: |
      import { useSandbox } from "../../world/use-test-world"

      const keysFor = (provider: string): string[] => [provider.toUpperCase() + "_KEY"]

      const live = useSandbox({ provider: "other", keys: keysFor("other") })
    be/src/tests/e2e/third/third.e2e-spec.ts: |
      import { useSandbox } from "../../world/use-test-world"
      import { liveProvider } from "../../world/live-provider"

      const sandbox = useSandbox({ provider: "fake", keys: [] })

      const live = liveProvider("openrouter", "OPENROUTER_API_KEY")
    node_modules/jest/bin/jest.js: |
      const { createHash } = require("node:crypto")
      const { readFileSync } = require("node:fs")
      const args = process.argv.slice(2)
      const files = args.filter((a) => !a.startsWith("-") && a !== "e2e")
      let failed = 0
      for (const f of files) {
        const text = readFileSync(f, "utf8")
        const keys = [...new Set([...text.matchAll(/"([A-Z][A-Z0-9_]*)"/g)].map((m) => m[1]))]
        const missing = keys.filter((k) => !process.env[k])
        if (missing.length > 0) {
          failed += 1
          console.log("FAIL " + f + " TestWorldError: TEST_WORLD_NOT_DECLARED: the openrouter sandbox keys are not declared in the environment: " + missing.join(", "))
          continue
        }
        const got = process.env.OPENROUTER_API_KEY || ""
        const ok = createHash("sha256").update(got).digest("hex") === "bea4dde82d6a6f8e410532875c4dbe5902ae549c85aa1101a5f74d03eb7fbd69"
        console.log("debug: provider key " + got)
        if (ok) console.log("PASS " + f + " custody key reached the run")
        else { failed += 1; console.log("FAIL " + f + " the key is not the custody value") }
      }
      process.exit(failed === 0 ? 0 : 1)
steps:
  - name: copy ops/ into the scratch repository
    write: { path: ops, from: "${ops}" }
  - write: { path: contexts/project/work.md, from: "${ops}/../contexts/project/work.md" }
  - name: the suites run whatever else this host runs (the governor is not under test here)
    starci: [config, set, liveness.heavy.maxCpuPercent, "100"]
  - starci: [config, set, liveness.heavy.reserveMb, "0"]
  - name: the host's secret.env holds the fake provider key the owner seals into custody
    file:
      path: ${run}/secret.env
      content: |
        OPENROUTER_API_KEY=bench-fixture-custody-value
  - starci: [app, secret, init]
  - name: the dev environment's ai member holds the key, sealed
    starci: [app, secret, set, dev, ai, OPENROUTER_API_KEY, --from-host, OPENROUTER_API_KEY]
    expect: { exit: 0, lacks: bench-fixture-custody-value }
  - name: the host secret.env is gone, so only custody can hand the key over
    file:
      path: ${run}/secret.env
      content: "# empty\n"
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: dev custody"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: live
        goal: bench live suites whose keys sit in a const
        runner: inline
        tasks:
          - id: router
            label: docs
            summary: run the ai router live suite
            allowPaths: [be/src/tests/reports/router]
            checks:
              - preset: tests-pass
                args:
                  command: npm run test:e2e -- src/tests/e2e/ai
          - id: other
            label: docs
            summary: run the other live suite
            allowPaths: [be/src/tests/reports/other]
            checks:
              - preset: tests-pass
                args:
                  command: npm run test:e2e -- src/tests/e2e/other
            dependsOn: [router]
  - name: the third suite runs in a workflow of its own (the inline runner starts one task at a time)
    file:
      path: wf2.yaml
      yaml:
        schema: starci/workflow@1
        id: helper
        goal: bench a live suite the harness does not take for live
        runner: inline
        tasks:
          - id: third
            label: docs
            summary: run the third suite
            allowPaths: [be/src/tests/reports/third]
            checks:
              - preset: tests-pass
                args:
                  command: npm run test:e2e -- src/tests/e2e/third
  - starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, define, "${run}/wf2.yaml"]
  - starci: [workflow, start, live]
    save:
      router: data.nodes.0.task.id
  - worker:
      task: ${router}
      files:
        be/src/tests/reports/router/run.txt: "ran\n"
  - name: the router task lands and its wave runs green with the const-declared key from custody
    starci: [workflow, step, live]
    expect: { lacks: bench-fixture-custody-value }
    save:
      other: data.nodes.1.task.id
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE task_id = '${router}' AND name = 'tests-pass' AND status = 'green' AND detail LIKE '%custody: OPENROUTER_API_KEY from dev/ai, handed to this run''s environment only%' AND detail LIKE '%PASS src/tests/e2e/ai/router.e2e-spec.ts custody key reached the run%' AND detail LIKE '%debug: provider key [redacted:custody]%'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${router}'"
        equals: [done]
  - worker:
      task: ${other}
      files:
        be/src/tests/reports/other/run.txt: "ran\n"
  - name: the unreadable declaration blocks its task in the wave before any suite runs
    starci: [workflow, step, live]
    expect: { lacks: bench-fixture-custody-value }
  - assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id AND a.verdict = 'red') FROM tasks t WHERE t.id = '${other}'"
        equals: ["awaiting_owner:1:0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE subject = '${other}' AND kind = 'verify-stuck' AND json_extract(data_json, '$.code') = 'CUSTODY_KEYS_UNRESOLVED' AND json_extract(data_json, '$.reason') LIKE '%be/src/tests/e2e/other/other.e2e-spec.ts:5%' AND json_extract(data_json, '$.owner') = 0 AND json_extract(data_json, '$.module') = 'cli/src/harness/custody.ts'"
        equals: [1]
  - name: no suite ran for the unreadable declaration
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM check_runs WHERE task_id = '${other}' AND name = 'tests-pass'"
        equals: [0]
  - starci: [workflow, start, helper]
    save:
      third: data.nodes.0.task.id
  - worker:
      task: ${third}
      files:
        be/src/tests/reports/third/run.txt: "ran\n"
  - name: the wave whose run reports a held key undeclared reaches no verdict
    starci: [workflow, step, helper]
    expect: { lacks: bench-fixture-custody-value }
  - assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id AND a.verdict = 'red') FROM tasks t WHERE t.id = '${third}'"
        equals: ["done:1:0"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM events WHERE subject = 'helper' AND kind = 'wave-infra' AND json_extract(data_json, '$.error') LIKE '%reports OPENROUTER_API_KEY as not declared although custody of dev holds it%'"
        equals: [1]
  - name: the wave is still due, runs again on the next step and lands on the same ticket
    starci: [workflow, step, helper]
    expect: { lacks: bench-fixture-custody-value }
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) || ':' || MAX(occurrences) FROM tickets WHERE kind = 'harness-defect' AND title LIKE '%TEST_WORLD_NOT_DECLARED for a key the app''s custody holds%'"
        equals: ["1:2"]
  - assert:
      sql:
        db: ledger
        query: "SELECT t.status || ':' || t.try_no || ':' || (SELECT COUNT(*) FROM attempts a WHERE a.task_id = t.id AND a.verdict = 'red') FROM tasks t WHERE t.id = '${third}'"
        equals: ["done:1:0"]
  - name: the tick files the unreadable declaration as one harness-defect ticket, never as the owner's question
    starci: [supervisor, tick]
    expect: { lacks: bench-fixture-custody-value }
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM tickets WHERE kind = 'harness-defect' AND severity = 'blocking' AND title LIKE '%cannot read which custody keys useSandbox declares%'"
        equals: [1]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM tickets WHERE kind = 'question:business'"
        equals: [0]
  - name: the value is in no check row, event or ticket
    assert:
      sql:
        db: ledger
        query: "SELECT (SELECT COUNT(*) FROM check_runs WHERE detail LIKE '%bench-fixture-custody-value%') + (SELECT COUNT(*) FROM events WHERE data_json LIKE '%bench-fixture-custody-value%')"
        equals: [0]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM tickets WHERE evidence_json LIKE '%bench-fixture-custody-value%' OR title LIKE '%bench-fixture-custody-value%'"
        equals: [0]
