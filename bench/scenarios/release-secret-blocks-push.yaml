schema: starci/scenario@1
id: release-secret-blocks-push
group: release
title: a secret in the pushed range blocks release push
inject: a commit to push carries a provider-shaped key
expect: release push refuses naming the file and rule, never the value; nothing is pushed
pass:
  - exit 1
  - remote head unchanged
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - git:
      - init
      - -q
      - --bare
      - -b
      - main
      - ${run}/remote.git
  - git:
      - remote
      - add
      - origin
      - ${run}/remote.git
  - git:
      - push
      - -q
      - origin
      - main
  - write:
      path: src/config.js
      generated: secret
  - git:
      - add
      - src/config.js
  - git:
      - commit
      - -q
      - -m
      - config
  - starci:
      - release
      - push
    expect:
      exit: 1
      ok: false
  - assert:
      gitHas:
        path: src/config.js
        present: false
        in: ${run}/remote.git
