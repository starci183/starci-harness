schema: starci/scenario@1
id: stories-shape-missing-red
group: verify
title: "check stories is red when one shape of the block has no story"
inject: "the fixture's stories file loses its stages story; the other two shapes and the skeleton stay"
expect: "check stories names shape stages of LeadBoardBlockShape as STORY_SHAPE_MISSING at its member in the pure half, and nothing else"
pass:
  - the verb exits 1 with verdict red
  - the one finding is STORY_SHAPE_MISSING for stages, at the union member in component.tsx
  - no human intervention beyond the injected fault
automation: automated
steps:
  - name: copy the shape-slot fixture into the scratch repository
    write: { path: ".", from: "${ops}/../bench/fixtures/shape-slot/app" }
  - name: drop the stages story
    write:
      path: fe/apps/leads/stories/LeadBoardBlock.stories.tsx
      content: |
        import type { Meta, StoryObj } from "@storybook/react"
        import { LeadBoardBlockBase } from "@/components/blocks/LeadBoardBlock/component"
        import { loadingSlot } from "@/hooks/slot/slot.shared"
        import { LEAD_BOARD_ARGS } from "./LeadBoardBlock.data"

        const meta = { title: "Blocks/LeadBoardBlock", component: LeadBoardBlockBase, args: LEAD_BOARD_ARGS } satisfies Meta<typeof LeadBoardBlockBase>

        export default meta

        type Story = StoryObj<typeof meta>

        export const ListShape: Story = { args: { shape: "list" } }

        export const UnassignedShape: Story = { args: { shape: "unassigned" } }

        export const Skeleton: Story = { args: { props: { ...LEAD_BOARD_ARGS.props, leads: loadingSlot(), owners: loadingSlot() } } }
  - name: the missing shape is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"code": "STORY_SHAPE_MISSING"' }
  - name: it names the shape
    starci: [check, stories]
    expect: { exit: 1, contains: 'shape \"stages\" of LeadBoardBlockShape' }
  - name: it points at the member in the pure half
    starci: [check, stories]
    expect: { exit: 1, contains: '"file": "src/components/blocks/LeadBoardBlock/component.tsx"' }
  - name: nothing else is red
    starci: [check, stories]
    expect: { exit: 1, contains: '"findings": 1' }
