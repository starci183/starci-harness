schema: starci/scenario@1
id: scale-ten-workflows
group: scale
title: ten workflows in one repository with disjoint paths all start
inject: 10 inline workflows defined and started back to back
expect: 10 workflow rows, 10 queued tasks, 10 Op worktrees; no LEDGER lock error
pass:
  - 10 running workflows
  - 10 Op worktrees
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: w0.yaml
      yaml:
        schema: starci/workflow@1
        id: w0
        goal: bench workflow w0
        runner: inline
        tasks:
          - id: w0
            label: docs
            summary: write doc w0
            allowPaths:
              - docs/w0.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/w0.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/w0.yaml
  - name: start
    starci:
      - workflow
      - start
      - w0
    save: {}
