schema: starci/scenario@1
id: admitted-contract-settles-after-context-grows
group: change
title: "a contract is measured against its op's context budget when it is admitted: a context that grows under an admitted task never refuses its verify, settle or resend"
inject: >-
  a copy of ops/ whose docs op has a 150-token context budget; workflow task a and a sent task s are admitted under it and
  a works its slice, then the harness file every docs task reads grows past the budget
expect: >-
  a's verify settles it done (its contract was admitted, so the context that grew under it is not measured again); s's
  contract, resent unchanged, is admitted again and its dry replay is judged on its checks, never refused for the budget; a
  new docs contract sent after the growth is still measured and refused CONTRACT_UNFIT for its budget
pass:
  - workflow task a settles done after the context grew past the budget
  - the unchanged contract of s is sent again and dry-replayed without a budget refusal
  - a new contract sent after the growth is refused CONTRACT_UNFIT for its context budget
  - no human intervention beyond the injected fault
automation: automated
env:
  STARCI_OPS_DIR: ${repo}/ops
steps:
  - name: copy ops/ into the scratch repository
    write: { path: ops, from: "${ops}" }
  - name: the docs op caps its context at 150 tokens
    write:
      path: ops/ops/docs.md
      content: |
        ---
        schema: starci/op@1
        summary: documentation and product content
        floor: easy
        hostTools: [git]
        context:
          base:
            - harness:contexts/project/work.md
          budget: 150
        input:
          base: {}
        output:
          base:
            summary: {type: string, summary: "what you wrote or changed"}
            files: {type: "string[]", summary: "the documents you changed"}
            rulesApplied: {type: "string[]", minItems: 0, cites: context, summary: "the ids of the writing or record rules you applied"}
            workRecords: {type: "string[]", minItems: 1, cites: work, when: work, summary: "the ids of the Work records you wrote or changed"}
        checks:
          base: [paths-only, rules-cited]
          behavioural: false
        ---
        Write present-tense prose that states what is true now.
  - name: the harness file every docs task reads, about 100 tokens
    write:
      path: contexts/project/work.md
      content: |
        # Work

        A Work record is the product's own description of one feature, kept beside the code it describes. It names
        the screens, the rules and the acceptance a task proves. Read it before you write the document it asks for.
  - git: [add, -A]
  - git: [commit, -q, -m, "bench: ops copy with a docs budget"]
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: grow
        goal: one doc
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args: {files: [docs/a.md]}
  - file:
      path: s.json
      content: >-
        {"schema": "starci/contract@2", "label": "docs", "context": {"revision": "HEAD", "allowPaths": ["docs/s.md"]},
        "input": {"summary": "write doc s"}, "budget": {"minutes": 10, "tries": 1},
        "checks": {"extend": [{"preset": "files-exist", "args": {"files": ["docs/s.md"]}}]}}
  - file:
      path: n.json
      content: >-
        {"schema": "starci/contract@2", "label": "docs", "context": {"revision": "HEAD", "allowPaths": ["docs/n.md"]},
        "input": {"summary": "write doc n"}, "budget": {"minutes": 10, "tries": 1},
        "checks": {"extend": [{"preset": "files-exist", "args": {"files": ["docs/n.md"]}}]}}
  - name: a and s are admitted under the budget
    starci: [workflow, define, "${run}/wf.yaml"]
  - starci: [workflow, start, grow]
    save:
      a: data.nodes.0.task.id
  - starci: [task, send, "${run}/s.json"]
    expect:
      exit: 0
  - worker:
      task: ${a}
      status: done
      files:
        docs/a.md: "# a\n"
  - name: the harness file grows past the docs budget (about 200 tokens) while a waits for its verify
    write:
      path: contexts/project/work.md
      content: |
        # Work

        A Work record is the product's own description of one feature, kept beside the code it describes. It names
        the screens, the rules and the acceptance a task proves. Read it before you write the document it asks for.

        A record grows with its feature: every screen it adds names its states, every rule it adds names the check
        that holds it, and every acceptance names the walk that proves it. A task reads the record it is over and
        no other, and writes only the files its contract allows. This paragraph makes the file heavier than before.

        A record that changes after a task landed does not reopen the task: the task proved the record as it stood,
        and the Kernel decides whether the change needs new work. This last paragraph takes the file past the budget.
  - git: [commit, -q, -a, -m, "bench: the docs context grows"]
  - name: a's verify settles it, its admitted contract never measured again
    starci: [workflow, step, grow]
    expect:
      exit: 0
      lacks: CONTRACT_UNFIT
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE id = '${a}'"
        equals: [done]
  - name: s's unchanged contract is admitted again
    starci: [task, send, "${run}/s.json"]
    expect:
      exit: 0
      lacks: over the docs op's budget
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM tasks WHERE json_extract(contract_json, '$.input.base.summary') = 'write doc s' OR json_extract(contract_json, '$.input.summary') = 'write doc s'"
        equals: [2]
  - name: its dry replay is judged on its checks (docs/s.md is not written), never on the budget
    starci: [task, verify, --contract, "${run}/s.json"]
    expect:
      exit: 1
      lacks: CONTRACT_UNFIT
  - name: a contract sent after the growth is measured against the context as it is now
    starci: [task, send, "${run}/n.json"]
    expect:
      exit: 1
      code: CONTRACT_UNFIT
      contains: "over the docs op's budget"
