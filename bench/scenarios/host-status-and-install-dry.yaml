schema: starci/scenario@1
id: host-status-and-install-dry
group: environment
title: "host status reads every service of ops/host.yaml; install --dry prints the scheduler argv and writes nothing"
inject: a fresh state base on any platform, with the Orca stand-in
expect: "host status reports each service with its evidence and exits 0 whatever is down; host install --dry --platform win32 prints the exact schtasks argv (a hidden wscript launcher, task name StarCi Supervisor Tick, every minute) and writes no launcher; a --platform other than this host's without --dry is refused"
pass:
  - host status exits 0 and names every service
  - install --dry prints the schtasks /Create argv for StarCi Supervisor Tick
  - no launcher written under the state base
  - --platform without --dry refuses HOST_PLATFORM_DRY_ONLY
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - name: status
    starci: [host, status]
    expect:
      exit: 0
      contains: supervisor-tick
  - name: status names the Supervisors
    starci: [host, status, supervisors]
    expect:
      exit: 0
      contains: supervisors
  - name: unknown service
    starci: [host, status, nope]
    expect:
      exit: 1
      code: HOST_UNKNOWN_SERVICE
  - name: install dry
    starci: [host, install, --dry, --platform, win32]
    expect:
      exit: 0
      contains: '"/Create"'
  - name: install dry names the task
    starci: [host, install, --dry, --platform, win32]
    expect:
      exit: 0
      contains: '"StarCi Supervisor Tick"'
  - name: install dry runs every minute
    starci: [host, install, --dry, --platform, win32]
    expect:
      exit: 0
      contains: '"MINUTE"'
  - name: install dry hides the window
    starci: [host, install, --dry, --platform, win32]
    expect:
      exit: 0
      contains: "wscript.exe //B //Nologo"
  - assert:
      exists:
        path: ${state}/host
        present: false
  - name: another platform without --dry
    starci: [host, install, --platform, plan9]
    expect:
      exit: 1
      code: HOST_PLATFORM_DRY_ONLY
  - name: uninstall dry
    starci: [host, uninstall, --dry, --platform, win32]
    expect:
      exit: 0
      contains: '"/Delete"'
