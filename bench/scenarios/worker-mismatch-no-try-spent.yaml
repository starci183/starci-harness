schema: starci/scenario@1
id: worker-mismatch-no-try-spent
group: model
title: "the model refuses the task as specified: mismatch returns it without spending a try"
inject: the worker files mismatch (the contract is wrong)
expect: the task is returned to the Kernel, workflow blocked, no try spent; a contract fix amend is the next move
pass:
  - workflow blocked
  - try_no stays 1
  - no commit
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: mis
        goal: bench workflow mis
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/wf.yaml
  - name: start
    starci:
      - workflow
      - start
      - mis
    save:
      a: data.nodes.0.task.id
  - worker:
      task: ${a}
      status: mismatch
      output:
        summary: the doc asked for contradicts README
        files: []
        rulesApplied: []
  - name: step
    starci:
      - workflow
      - step
      - mis
    save: {}
    expect: {}
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM workflows
        equals:
          - blocked
  - assert:
      sql:
        db: ledger
        query: SELECT try_no FROM tasks
        equals:
          - 1
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 0
