schema: starci/scenario@1
id: release-ci-red-after-push
group: release
title: CI turns red after a push
inject: a pushed commit fails CI
expect: a scoped code contract for the red checks; the next push is not blocked
pass:
  - contract scoped to red checks
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: semi
pending: a live Orca beside the bench (semi)
manual:
  - push a breaking commit to a scratch GitHub repo
  - release ci-status
