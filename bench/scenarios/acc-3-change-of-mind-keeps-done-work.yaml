schema: starci/scenario@1
id: acc-3-change-of-mind-keeps-done-work
group: acceptance
title: "owner acceptance 3: the owner changes their mind mid-run; done work is kept, live unchanged work continues, the dropped task stops"
inject: "with a done, b and c running, the Supervisor submits a goal-change (goal v2): c is no longer wanted, d is"
expect: >-
  kernel next returns the goal-change decision; the Kernel's new desired graph (a and b unchanged, c gone, d new) is reconciled
  by key: a keeps its commit and its one attempt, b keeps running on its attempt, c is cancelled with its lease released, d is
  added; b then lands on top of a in the same worktree
pass:
  - goal_version 2, graph v2 recorded by the Kernel's command answering the goal-change decision
  - a done with one attempt and one commit, never relaunched
  - b's one attempt continues and lands
  - c cancelled, its lease released; d launched
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected change
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: mind
        goal: write docs a, b and c
        runner: orca
        maxParallel: 3
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
          - id: b
            label: docs
            summary: write doc b
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/b.md]
          - id: c
            label: docs
            summary: write doc c
            allowPaths: [docs/c.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/c.md]
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: mind
  - name: kernel next launches a, b and c
    seat: kernel:mind
    starci: [kernel, next, mind, --wait, "0"]
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'a'"
      as: a
  - read:
      db: ledger
      query: "SELECT id FROM tasks WHERE plan_key = 'b'"
      as: b
  - worker:
      task: ${a}
      files:
        docs/a.md: "# a\n"
  - name: kernel next settles a
    seat: kernel:mind
    starci: [kernel, next, mind, --wait, "0"]
  - file:
      path: goal-change.yaml
      content: |
        schema: starci/command@1
        cmdId: sup-acc3-change-1
        kind: goal-change
        workflow: mind
        project: ${repo}
        basedOn: {goal: 1}
        goal: write docs a, b and d; c is not wanted any more
  - name: the owner changes their mind through the Supervisor
    seat: supervisor
    starci: [supervisor, submit, "${run}/goal-change.yaml"]
  - name: kernel next returns the goal-change
    seat: kernel:mind
    starci: [kernel, next, mind, --wait, "0"]
    expect:
      contains: '"kind": "goal-change"'
    save:
      decision: data.decision.id
      graph: data.digest.graphVersion
  - file:
      path: desired.yaml
      content: |
        schema: starci/workflow@1
        id: mind
        goal: write docs a, b and c
        runner: orca
        maxParallel: 3
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
          - id: b
            label: docs
            summary: write doc b
            allowPaths: [docs/b.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/b.md]
          - id: d
            label: docs
            summary: write doc d
            allowPaths: [docs/d.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/d.md]
  - file:
      path: cmd.yaml
      content: |
        schema: starci/command@1
        cmdId: k-acc3-replan-1
        kind: workflow-change
        workflow: mind
        basedOn: {graph: ${graph}}
        answers: [${decision}]
        change: desired.yaml
  - name: the Kernel submits the new desired graph
    seat: kernel:mind
    starci: [kernel, submit, "${run}/cmd.yaml"]
  - name: kernel next applies it
    seat: kernel:mind
    starci: [kernel, next, mind, --wait, "0"]
  - worker:
      task: ${b}
      files:
        docs/b.md: "# b\n"
  - name: kernel next settles b
    seat: kernel:mind
    starci: [kernel, next, mind, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT goal_version || ':' || graph_version FROM workflows
        equals: ["2:2"]
  - assert:
      sql:
        db: ledger
        query: SELECT t.plan_key || ':' || t.status || ':' || (SELECT COUNT(*) FROM attempts x WHERE x.task_id = t.id) FROM tasks t WHERE t.plan_key IN ('a', 'b', 'c') ORDER BY t.plan_key
        equals: ["a:done:1", "b:done:1", "c:cancelled:1"]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM leases WHERE task_id IN (SELECT id FROM tasks WHERE plan_key = 'c')"
        equals: [0]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM tasks WHERE plan_key = 'd'"
        equals: [running]
  - assert:
      gitLog:
        grep: "Starci-Task: ${a}"
        count: 1
        in: ${worktree.mind}
  - assert:
      gitLog:
        grep: "Starci-Task: ${b}"
        count: 1
        in: ${worktree.mind}
  - assert:
      orcaCalls:
        command: worker-start
        match:
          task-title: '^\[Op\]'
        count: 4
        distinct: retry-request
