schema: starci/scenario@1
id: config-change-widens-scope
group: verify
title: a change to an app-wide configuration file widens the scoped check to every side that reads it
inject: "a diff that changes only the app-root hfs.json: first to a grammar family the lint factory refuses, then to one it knows"
expect: >-
  hfs.json is an app-wide configuration file (the app.declaration slot of contexts/hfs/slots.yaml), so the scoped check
  runs every package, each side's lint config loads, and the unknown grammar family turns the check red; a valid change
  loads the same configs and stays green
pass:
  - the unknown grammar makes check run red and names the refused family
  - the valid grammar keeps check run green with each side linted as a whole package
  - no human intervention beyond the injected fault
automation: automated
# The sides' eslint is a stand-in committed with the scratch app: like the grammar lint factory, it reads the app-root
# hfs.json when its config loads and refuses a grammar family it does not know, so the scenario observes whether the scoped
# check loaded each side's lint config without installing ESLint. Profile lib keeps the canon gate out of a stand-in app.
repo:
  files:
    README.md: "# bench scratch app\n"
    package.json: '{"name": "bench-app", "version": "1.0.0", "private": true, "workspaces": ["be", "fe"]}'
    hfs.json: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"be": {}, "fe": {"grammar": "starci"}}}'
    be/package.json: '{"name": "bench-be", "version": "1.0.0"}'
    be/eslint.config.js: "module.exports = []\n"
    be/src/main.ts: "export const main = 1\n"
    fe/package.json: '{"name": "bench-fe", "version": "1.0.0"}'
    fe/eslint.config.js: "module.exports = []\n"
    fe/src/page.ts: "export const page = 1\n"
    node_modules/eslint/bin/eslint.js: |
      const { readFileSync } = require("node:fs")
      const { resolve } = require("node:path")
      const hfs = JSON.parse(readFileSync(resolve(process.cwd(), "..", "hfs.json"), "utf8"))
      const grammar = hfs.sides && hfs.sides.fe ? hfs.sides.fe.grammar : undefined
      if (grammar !== undefined && !["starci", "core"].includes(grammar)) {
        console.log(`eslint config: the grammar lint factory refuses the family ${grammar}`)
        process.exit(2)
      }
      console.log(`linted ${process.argv.slice(2).filter((arg) => !arg.startsWith("--")).join(" ")}`)
      process.exit(0)
steps:
  - name: hfs.json names a grammar family the lint factory does not know
    write:
      path: hfs.json
      content: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"be": {}, "fe": {"grammar": "nope"}}}'
  - name: the scoped check widens to every side and turns red
    starci: [check, run, --base, HEAD]
    expect:
      exit: 1
      contains: refuses the family nope
  - name: hfs.json names a grammar family the lint factory knows
    write:
      path: hfs.json
      content: '{"hfs": 3, "kind": "app", "policy": "lib", "sides": {"be": {}, "fe": {"grammar": "core"}}}'
  - name: the scoped check loads both sides' lint configs and stays green
    starci: [check, run, --base, HEAD]
    expect:
      exit: 0
      contains: 'config fe/eslint.config.js, whole package linted'
