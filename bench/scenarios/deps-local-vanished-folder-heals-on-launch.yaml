schema: starci/scenario@1
id: deps-local-vanished-folder-heals-on-launch
group: verify
title: a local package record naming a folder that is gone heals at the Op's launch instead of failing its sync
inject: >-
  the project's local package record (deps-local.json) names two folders that no longer exist, as a package edit worktree
  Debug landed and removed leaves it: @starci/tsconfig, which the harness's own packages/ holds, and @starci/bench-gone, which
  it does not
expect: >-
  the Op's launch (seat start, through kernel next) heals the record before its sync: @starci/tsconfig is repointed to the
  harness's packages/tsconfig and @starci/bench-gone is dropped so it resolves from npm, one deps-local-healed event names both,
  the sync of the workflow worktree is green (deps-local-synced, never deps-local-sync-failed) and the Op is launched (reads the
  public registry for npm ci)
pass:
  - the record names the harness's packages/tsconfig and no longer the vanished folders
  - one deps-local-healed event, a green sync, no failed sync
  - the Op is launched
  - no human intervention beyond the injected fault
automation: automated
repo:
  files:
    README.md: "# bench deps app\n"
    .npmrc: "legacy-peer-deps=true\n"
    .gitignore: "node_modules/\n"
    package.json: '{"name": "bench-deps-app", "version": "1.0.0", "private": true, "devDependencies": {"@starci/tsconfig": "2.1.0"}}'
    package-lock.json: '{"name": "bench-deps-app", "version": "1.0.0", "lockfileVersion": 3, "requires": true, "packages": {"": {"name": "bench-deps-app", "version": "1.0.0", "devDependencies": {"@starci/tsconfig": "2.1.0"}}, "node_modules/@starci/tsconfig": {"version": "2.1.0", "resolved": "https://registry.npmjs.org/@starci/tsconfig/-/tsconfig-2.1.0.tgz", "integrity": "sha512-8nAgp5BdEWrQVFVWhvLh3ucU9Jfu7JhY5V9m1daLkRehQSmNsHVlAQ+2BuvtQHfomfbtybFT4/IwZCnsxp4Wiw==", "dev": true, "license": "MIT", "peerDependencies": {"typescript": ">=5.0.0"}}}}'
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: heal
        goal: bench workflow launches an Op in local package mode
        runner: orca
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: boot the tree
    boot:
      file: ${run}/wf.yaml
      workflow: heal
  - name: the record names two folders that are gone
    file:
      path: ${project}/deps-local.json
      content: |
        {
          "schema": "starci/deps-local@1",
          "packages": [
            { "name": "@starci/bench-gone", "folder": "/starci-bench-vanished/packages/bench-gone" },
            { "name": "@starci/tsconfig", "folder": "/starci-bench-vanished/packages/tsconfig" }
          ]
        }
  - name: kernel next launches the Op, healing the record first
    seat: kernel:heal
    starci: [kernel, next, heal, --wait, "0"]
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks
        equals: [running]
  - name: one heal names both entries, the one repointed and the one dropped
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) || ':' || SUM(json_extract(data_json, '$.healed[0].name') = '@starci/bench-gone' AND json_extract(data_json, '$.healed[0].to') IS NULL) || ':' || SUM(json_extract(data_json, '$.healed[1].name') = '@starci/tsconfig' AND json_extract(data_json, '$.healed[1].to') LIKE '%packages/tsconfig') FROM events WHERE kind = 'deps-local-healed'"
        equals: ["1:1:1"]
  - name: the launch's sync is green
    assert:
      sql:
        db: ledger
        query: "SELECT kind FROM events WHERE kind IN ('deps-local-synced', 'deps-local-sync-failed')"
        equals: [deps-local-synced]
  - name: the record names the harness's own folder now
    assert:
      exists:
        path: ${project}/deps-local.json
        present: true
        contains: packages/tsconfig"
  - assert:
      sql:
        db: ledger
        query: "SELECT instr(json_extract(data_json, '$.detail'), 'starci-bench-vanished/packages/tsconfig no longer holds @starci/tsconfig') > 0 FROM events WHERE kind = 'deps-local-synced'"
        equals: [1]
