schema: starci/scenario@1
id: verify-hfs-pattern-declared-by-harness
group: verify
title: "an opt-in slot a task writes is enabled by the harness, never by the task: hfs.json gains the pattern in a commit of its own, and a red HFS_SLOT_NOT_ENABLED spends no try"
inject: >-
  two dependent tasks of an inline workflow write provider doors in opt-in slots of an app whose hfs.json declares no be
  pattern: doors' allowPaths lie in be.feature.webhooks, feed's allowPaths (be/src/features) lie in no slot and its result names
  only that folder, so nothing tells the harness about its realtime channel until the wave's slot gate is red
  HFS_SLOT_NOT_ENABLED on it
expect: >-
  before doors' Op worktree is cut the harness adds "webhooks" to sides.be.patterns (add only, every other byte of hfs.json kept)
  as a commit of its own on the branch, trailer Starci-Harness: hfs-pattern, recorded as hfs-pattern-enabled and as the resolved
  shared need config:hfs.be.patterns.webhooks; doors lands and its wave is green. feed's wave meets the red, the harness adds
  "realtime" the same way and judges the wave again on the new head: green, feed done on its first attempt, no task failed or
  returned. No task's settle commit carries hfs.json, so no task is judged app-wide for the declaration
pass:
  - both tasks done on their first attempt, the workflow done, no failed attempt
  - two harness commits, one per pattern, each the only commit that changes hfs.json, and no settle commit touches it
  - hfs.json lists both patterns and keeps the rest of its text
  - "hfs-pattern-enabled events: op-start for webhooks, wave-red for realtime; both shared needs resolved"
  - every recorded wave verdict is green
  - no human intervention beyond the injected fault
automation: automated
env:
  GIT_AUTHOR_DATE: "2026-01-01T00:00:00Z"
  GIT_COMMITTER_DATE: "2026-01-01T00:00:00Z"
# The slot gate is a stand-in committed with the scratch app: like the canon lint's slot-ownership rule, it reports a file of an
# opt-in feature kind whose pattern hfs.json does not declare, in the rule's own words, so the scenario needs no ESLint install.
repo:
  files:
    package.json: '{"name": "bench-doors", "version": "1.0.0", "private": true}'
    hfs.json: |
      {
        "hfs": 3,
        "kind": "app",
        "project": "bench-doors",
        "sides": {
          "be": {
            "apps": [
              {
                "name": "core",
                "kind": "api"
              }
            ],
            "kinds": ["api"]
          },
          "fe": {
            "grammar": "core",
            "apps": [
              {
                "name": "app",
                "kind": "next"
              }
            ]
          }
        }
      }
    tools/slot-gate.js: |
      const { existsSync, readdirSync, readFileSync } = require("node:fs")
      const patterns = JSON.parse(readFileSync("hfs.json", "utf8")).sides.be.patterns ?? []
      let red = 0
      for (const kind of ["webhooks", "realtime"]) {
        const dir = `be/src/features/${kind}`
        if (!existsSync(dir) || patterns.includes(kind)) continue
        for (const name of readdirSync(dir)) {
          console.log(`HFS_SLOT_NOT_ENABLED ${dir}/${name}/index.ts belongs to be.feature.${kind}, an opt-in slot hfs.json neither lists in optionalSlots nor implies through an app kind`)
          red++
        }
      }
      console.log(red === 0 ? "every opt-in slot path is enabled" : `${String(red)} path(s) in opt-in slots hfs.json does not enable`)
      process.exit(red === 0 ? 0 : 1)
steps:
  - file:
      path: wf.yaml
      yaml:
        schema: starci/workflow@1
        id: doors
        goal: a provider webhook door, then a realtime channel
        runner: inline
        tasks:
          - id: doors
            label: docs
            summary: the sepay webhook door
            allowPaths: [be/src/features/webhooks/sepay]
            checks:
              - check:
                  kind: command
                  run: [node, tools/slot-gate.js]
          - id: feed
            label: docs
            summary: the feed realtime channel
            allowPaths: [be/src/features]
            dependsOn: [doors]
            checks:
              - check:
                  kind: command
                  run: [node, tools/slot-gate.js]
  - starci: [workflow, define, "${run}/wf.yaml"]
  - name: start cuts doors' Op worktree after the harness declared the webhooks pattern
    starci: [workflow, start, doors]
    save:
      doors: data.nodes.0.task.id
  - name: the harness commit is on the branch, and is the only change to hfs.json
    assert:
      gitLog:
        grep: "Starci-Harness: hfs-pattern"
        count: 1
  - assert:
      exists:
        path: hfs.json
        present: true
        contains: "\"kinds\": [\"api\"],\n      \"patterns\": [\"webhooks\"]\n    },"
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.why') || ':' || json_extract(data_json, '$.added[0].pattern') || ':' || json_extract(data_json, '$.added[0].slots[0]') FROM events WHERE kind = 'hfs-pattern-enabled' ORDER BY id"
        equals: ["op-start:webhooks:be.feature.webhooks"]
  - worker:
      task: ${doors}
      files:
        be/src/features/webhooks/sepay/index.ts: "export const sepay = 1\n"
  - name: step verifies doors, its wave is green, and feed starts
    starci: [workflow, step, doors]
    save:
      feed: data.nodes.1.task.id
  - worker:
      task: ${feed}
      files:
        be/src/features/realtime/feed/index.ts: "export const feed = 1\n"
      output:
        summary: the feed realtime channel
        files: [be/src/features]
        rulesApplied: []
  - name: step verifies feed; its wave is red HFS_SLOT_NOT_ENABLED, the harness declares realtime and the wave runs again green
    starci: [workflow, step, doors]
  - assert:
      sql:
        db: ledger
        query: "SELECT plan_key || ':' || status FROM tasks ORDER BY created_at"
        equals: ["doors:done", "feed:done"]
  - assert:
      sql:
        db: ledger
        query: "SELECT status FROM workflows WHERE id = 'doors'"
        equals: [done]
  - name: "no try spent: one attempt per task, none failed"
    assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) || ':' || SUM(outcome IS NOT NULL AND outcome <> 'done') FROM attempts"
        equals: ["2:0"]
  - name: every wave verdict recorded is green; the red run was remedied before any verdict
    assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.verdict') FROM events WHERE kind = 'wave-verified' ORDER BY id"
        equals: [green, green]
  - assert:
      sql:
        db: ledger
        query: "SELECT json_extract(data_json, '$.why') || ':' || json_extract(data_json, '$.added[0].pattern') FROM events WHERE kind = 'hfs-pattern-enabled' ORDER BY id"
        equals: ["op-start:webhooks", "wave-red:realtime"]
  - assert:
      gitLog:
        grep: "Starci-Harness: hfs-pattern"
        count: 2
  - assert:
      exists:
        path: hfs.json
        present: true
        contains: '"patterns": ["webhooks", "realtime"]'
  - name: no settle commit touches hfs.json (git diff --quiet exits 0 only when the file is unchanged)
    read:
      db: ledger
      query: "SELECT settle_commit FROM tasks WHERE plan_key = 'doors'"
      as: doorsCommit
  - read:
      db: ledger
      query: "SELECT settle_commit FROM tasks WHERE plan_key = 'feed'"
      as: feedCommit
  - git: [diff, --quiet, "${doorsCommit}^", "${doorsCommit}", --, hfs.json]
  - git: [diff, --quiet, "${feedCommit}^", "${feedCommit}", --, hfs.json]
  - name: each pattern is a resolved shared need the harness owns
    assert:
      sql:
        db: machine
        query: "SELECT key || ':' || state FROM shared_needs ORDER BY key"
        equals: ["config:hfs.be.patterns.realtime:resolved", "config:hfs.be.patterns.webhooks:resolved"]
