schema: starci/scenario@1
id: resources-file-locked
group: resources
title: an antivirus or IDE locks a file during preserve or verify
inject: hold an exclusive handle on a file in allowPaths
expect: the verify reaches no verdict and returns the task to reported with no try spent; preserve retries
pass:
  - task reported, try_no unchanged
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: manual
pending: a person at the machine (manual)
manual:
  - open the file exclusively in another process
  - step
