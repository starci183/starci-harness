schema: starci/scenario@1
id: supervisor-stall-relaunch-on-claude
group: orca
title: "a Supervisor that stalls for its own idleness is relaunched on the coordinator tier's first member; repeated stalls fall to the next member and escalate to Debug"
inject: >-
  the Kernel escalates a scope question; the Supervisor ends its turn at its prompt (tui-idle, no driver call for ten minutes)
  with no provider failure named, and does not answer its nudge; the Supervisor that replaces it attaches, then does the same
expect: >-
  the first give-up records a stalled outcome and relaunches the Supervisor on the same member (a plain stall puts nothing
  behind) with no escalation; the second plain stall of that member within the window relaunches it on the next member of the
  coordinator tier and raises one supervisor escalation of kind harness naming the repeated stalls
pass:
  - the first replacement runs on the first member again
  - the second replacement runs on another member
  - one open harness escalation for the repeated stalls, raised only at the second give-up
  - two stalled outcomes for the supervisor label
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: wf.yaml
      content: |
        schema: starci/workflow@1
        id: idle
        goal: write doc a
        runner: orca
        maxParallel: 2
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths: [docs/a.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/a.md]
  - boot:
      file: ${run}/wf.yaml
      workflow: idle
  - file:
      path: esc.yaml
      content: |
        schema: starci/command@1
        cmdId: k-idle-scope-1
        kind: escalation
        workflow: idle
        basedOn: {graph: 1}
        escalation:
          kind: scope
          question: may doc a also write docs/b.md?
          paths: [docs/b.md]
  - seat: kernel:idle
    starci: [kernel, submit, "${run}/esc.yaml"]
  - read:
      db: machine
      query: SELECT agent || '/' || model FROM project_supervisors WHERE ended_at IS NULL
      as: first.member
  - orca:
      set:
        tuiIdle:
          ${supervisor.terminal}: true
  - &quiet
    name: the Supervisor's last driver call was ten minutes ago
    sql:
      db: machine
      exec: UPDATE project_supervisors SET lease_until = strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '+20 minutes') WHERE ended_at IS NULL
  - name: the tick nudges the Supervisor
    starci: [supervisor, tick]
    expect:
      contains: nudge 1 of
  - &unanswered
    name: the nudge went unanswered for four minutes
    sql:
      db: machine
      exec: UPDATE host_events SET at = strftime('%Y-%m-%dT%H:%M:%fZ', at, '-4 minutes') WHERE kind = 'stall-nudged'
  - name: the tick gives the Supervisor up and relaunches it on the same member
    starci: [supervisor, tick]
    expect:
      contains: "stalled (stall, nudge 1 unanswered for 3 min): replaced by ${first.member}"
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(DISTINCT agent || '/' || model) FROM project_supervisors
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE subject LIKE 'coordinator-stalls:%'"
        equals: [0]
  - name: the new Supervisor attaches from the terminal its launch got
    read:
      db: machine
      query: SELECT id FROM project_supervisors WHERE ended_at IS NULL
      as: supervisor.launch
  - read:
      db: machine
      query: SELECT terminal FROM project_supervisors WHERE ended_at IS NULL
      as: supervisor.terminal
  - seat: supervisor
    starci: [supervisor, attach, --launch, "${supervisor.launch}"]
  - name: and ends its turn at its prompt too
    orca:
      set:
        tuiIdle:
          ${supervisor.terminal}: true
  - *quiet
  - name: the tick nudges the second Supervisor
    starci: [supervisor, tick]
    expect:
      contains: nudge 1 of
  - *unanswered
  - name: the second plain stall of the same member falls to the next member and escalates
    starci: [supervisor, tick]
    expect:
      contains: escalated to Debug (harness
  - assert:
      sql:
        db: machine
        query: SELECT COUNT(DISTINCT agent || '/' || model) FROM project_supervisors
        equals: [2]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM project_supervisors WHERE ended_at IS NULL AND agent || '/' || model != '${first.member}'"
        equals: [1]
  - assert:
      sql:
        db: ledger
        query: "SELECT COUNT(*) FROM decisions WHERE scope = 'supervisor' AND subject LIKE 'coordinator-stalls:%' AND answered_at IS NULL AND json_extract(evidence_json, '$.escalation.kind') = 'harness'"
        equals: [1]
  - assert:
      sql:
        db: machine
        query: "SELECT COUNT(*) FROM member_outcomes WHERE class = 'stalled' AND label = 'supervisor'"
        equals: [2]
