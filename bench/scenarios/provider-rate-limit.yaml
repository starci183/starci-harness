schema: starci/scenario@1
id: provider-rate-limit
group: provider
title: "a provider rate-limits: its pool's concurrency shrinks and new work routes elsewhere"
inject: provider report claude --outcome rate twice
expect: the AIMD cap of claude's pool halves; the router prefers another member while the circuit is half-open
pass:
  - provider status shows the lowered cap
  - route explain skips claude
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
pending: S5 verification trust tiers
manual:
  - provider report claude --outcome rate x2
  - provider status
  - route explain --label code
