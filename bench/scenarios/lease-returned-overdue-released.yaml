schema: starci/scenario@1
id: lease-returned-overdue-released
group: conflict
title: "a returned task's overdue lease is released by the next step and another workflow's ready task launches"
inject: "w1's task files blocked (returned to the Kernel), its lease is moved into the past, then w2 steps"
expect: "the step records leases-expired for w1's task, drops its lease and w2's node on the same path is queued"
pass:
  - w1's lease is gone after w2's step, with a leases-expired event
  - w2's task is queued
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: w1.yaml
      yaml:
        schema: starci/workflow@1
        id: w1
        goal: bench workflow w1
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: write doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - file:
      path: w2.yaml
      yaml:
        schema: starci/workflow@1
        id: w2
        goal: bench workflow w2
        runner: inline
        tasks:
          - id: a
            label: docs
            summary: rewrite doc a
            allowPaths:
              - docs/a.md
            checks:
              - preset: files-exist
                args:
                  files:
                    - docs/a.md
  - name: define
    starci:
      - workflow
      - define
      - ${run}/w1.yaml
    save: {}
  - name: define
    starci:
      - workflow
      - define
      - ${run}/w2.yaml
    save: {}
  - name: start
    starci:
      - workflow
      - start
      - w1
    save:
      a: data.nodes.0.task.id
  - name: start
    starci:
      - workflow
      - start
      - w2
    save: {}
  - worker:
      task: ${a}
      status: blocked
      output:
        summary: needs a decision
        files: []
        rulesApplied: []
  - name: step
    starci:
      - workflow
      - step
      - w1
    save: {}
    expect:
      exit: 1
  - name: step while the lease is still due
    starci:
      - workflow
      - step
      - w2
    save: {}
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM tasks WHERE workflow_id = 'w2'
        equals:
          - 0
  - sql:
      db: ledger
      exec: UPDATE leases SET expires_at = '2000-01-01T00:00:00.000Z'
  - name: step
    starci:
      - workflow
      - step
      - w2
    save: {}
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM leases WHERE task_id = '${a}'
        equals:
          - 0
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM events WHERE kind = 'leases-expired' AND subject = '${a}'
        equals:
          - 1
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks WHERE workflow_id = 'w2'
        equals:
          - queued
  - assert:
      sql:
        db: ledger
        query: SELECT status FROM tasks WHERE id = '${a}'
        equals:
          - reported
