schema: starci/scenario@1
id: kernel-cross-branch-copy-refused
group: needs
title: "a Kernel's contract that copies another workflow's landed code from its branch is refused NEEDS_REQUIRED"
inject: >-
  workflow one is defined in the project; the Kernel of workflow two plans a task whose input says to import a module
  byte-identical from workflow one's branch, then one that names an Op branch of workflow one, then the same task routed as a
  need instead
expect: >-
  workflow define refuses both copying plans NEEDS_REQUIRED, naming the branch of workflow one and how to report or route the
  need, and records nothing; the plan that names workflow one without taking its branch as a source is defined
pass:
  - a task whose input takes starci/one as its source is refused NEEDS_REQUIRED with the shared-needs guidance
  - a task whose input names an Op branch of workflow one is refused the same way
  - nothing is recorded for a refused plan; the routed plan is defined as graph 1
  - "no step without evidence: every state change in the ledger has its event"
  - no actor overstepping its role
  - no human intervention beyond the injected fault
automation: automated
steps:
  - file:
      path: one.yaml
      yaml:
        schema: starci/workflow@1
        id: one
        goal: build the http client
        runner: inline
        tasks:
          - id: client
            label: docs
            summary: write the client doc
            allowPaths: [docs/client.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/client.md]
  - starci: [workflow, define, "${run}/one.yaml"]
  - file:
      path: two-copy.yaml
      yaml:
        schema: starci/workflow@1
        id: two
        goal: use the http client
        runner: inline
        tasks:
          - id: use
            label: docs
            summary: write the usage doc
            details: import docs/client.md byte-identical from starci/one, then describe its use
            allowPaths: [docs/use.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/use.md]
  - name: a task copying another workflow's branch is refused
    starci: [workflow, define, "${run}/two-copy.yaml"]
    expect:
      exit: 1
      code: NEEDS_REQUIRED
      contains: --needs
  - file:
      path: two-op.yaml
      yaml:
        schema: starci/workflow@1
        id: two
        goal: use the http client
        runner: inline
        tasks:
          - id: use
            label: docs
            summary: write the usage doc
            details: cherry-pick the client from refs/heads/starci/one.ops/t-0000aaaa first
            allowPaths: [docs/use.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/use.md]
  - name: a task naming an Op branch of another workflow is refused
    starci: [workflow, define, "${run}/two-op.yaml"]
    expect:
      exit: 1
      code: NEEDS_REQUIRED
      contains: the branch of workflow one
  - assert:
      sql:
        db: ledger
        query: SELECT COUNT(*) FROM workflows WHERE id = 'two'
        equals: [0]
  - file:
      path: two.yaml
      yaml:
        schema: starci/workflow@1
        id: two
        goal: use the http client
        runner: inline
        tasks:
          - id: use
            label: docs
            summary: write the usage doc
            details: describe the http client of workflow one as this branch holds it; when it is missing here, report it with task result --status blocked --needs capability:http.client
            allowPaths: [docs/use.md]
            checks:
              - preset: files-exist
                args:
                  files: [docs/use.md]
  - name: the plan that routes the need is defined
    starci: [workflow, define, "${run}/two.yaml"]
  - assert:
      sql:
        db: ledger
        query: SELECT graph_version FROM workflows WHERE id = 'two'
        equals: [1]
