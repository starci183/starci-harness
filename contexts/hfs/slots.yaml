# The HFS slot manifest: what may exist in an app repository and where. An app is one repository: the app root
# (slots of profile app) holds the one package.json, lockfile, hfs.json, CI, hooks and .starciwork; be/ and fe/ are its
# two sides (profile be or fe, paths relative to the side). Every tracked path matches exactly one slot. Checks, lint
# factories, the architecture machine and templates read this file; none hardcodes a path. Field meanings and the
# ruleParams keys are explained in hfs/README.md; the reason for a slot's shape is its pattern topic.
schema: starci/hfs-slots@3
version: 3.12.0
presenceValues:
  - required
  - optional
  - opt-in
  - forbidden
trackedValues:
  - tracked
  - ignored
  - external
testValues:
  - unit-beside
  - e2e
  - none
editions:
  - full
  - lite
sides:
  be:
    reads: []
  fe:
    reads:
      - be/contracts/
triggerKinds:
  - api
  - webhooks
  - realtime
  - saga
  - reactors
  - jobs
  - cli
appKinds:
  be:
    - api
    - worker
    - cli
  fe:
    - next
naming:
  prefixes:
    - app
    - be
    - fe
    - repo
  sameConceptPairs:
    - - step
      - saga-step
  refusedPairs:
    - - use-case
      - handler
    - - listener
      - subscription
    - - job
      - processor
    - - worker
      - processor
    - - dto
      - input
    - - repository
      - mapper
  glossary:
    consumer: event
    subscription: realtime
    webhook: webhook
    processor: job
    handler: cqrs
tiers:
  be:
    app:
      mayImport:
        - feature
        - domain
        - events
        - queues
        - projections
        - platform
        - integrations
        - package
    feature:
      mayImport:
        - domain
        - events
        - queues
        - projections
        - platform
        - integrations
        - package
    domain:
      mayImport:
        - domain
        - events
        - queues
        - platform
        - integrations
        - package
      acyclic: true
    events:
      mayImport:
        - events
        - platform
        - package
      acyclic: true
    queues:
      mayImport:
        - queues
        - events
        - platform
        - package
      acyclic: true
    projections:
      mayImport:
        - projections
        - domain
        - events
        - platform
        - integrations
        - package
      acyclic: true
    integrations:
      mayImport:
        - platform
        - package
    platform:
      mayImport:
        - platform
        - package
      acyclic: true
    e2e:
      mayImport:
        - e2e
        - app
        - feature
        - domain
        - events
        - queues
        - projections
        - platform
        - integrations
        - fixtures
        - package
    fixtures:
      mayImport:
        - domain
        - events
        - queues
        - projections
        - platform
        - integrations
        - package
    package:
      mayImport:
        - package
  fe:
    route:
      mayImport:
        - feature
        - foundation
        - modules
        - transport
        - package
    feature:
      mayImport:
        - feature
        - components
        - hooks
        - foundation
        - modules
        - package
      mayImportKinds:
        feature:
          from:
            - pages
            - layouts
          to:
            - overlays
    components:
      mayImport:
        - components
        - hooks
        - foundation
        - package
      lowerLayerOnly: true
    hooks:
      mayImport:
        - hooks
        - foundation
        - modules
        - transport
        - package
      mayImportSlots:
        transport:
          from:
            - fe.hooks.swr
    foundation:
      mayImport:
        - foundation
        - package
      acyclic: true
    modules:
      mayImport:
        - foundation
        - modules
        - transport
        - package
      acyclic: true
    transport:
      mayImport:
        - foundation
        - modules
        - package
    package:
      mayImport:
        - package
crossOwner: every import across owners targets the owner's public entry (index.ts or index.tsx);
  never export *.
crossApp: apps never import each other; shared code is a packages/<pkg> slot.
ruleParams:
  db:
    extensions:
      - pgcrypto
      - pg_trgm
      - vector
      - uuid-ossp
      - unaccent
      - btree_gist
      - pgmq
  common:
    fileLines:
      soft: 500
      hardGrowth: true
    functionLines: 80
    featureFiles: 250
    duplicateBlock:
      lines: 8
      tokens: 60
  be:
    infraOwners:
      fetch:
        - platform/http
      axios:
        - platform/http
      got:
        - platform/http
      undici:
        - platform/http
      node:http:
        - platform/http
      node:https:
        - platform/http
      http:
        - platform/http
      https:
        - platform/http
      "@aws-sdk/client-s3":
        - integrations/object-storage
      "@aws-sdk/s3-request-presigner":
        - integrations/object-storage
      minio: []
      "@supabase": []
      "@nestjs/passport":
        - integrations/passport
      passport:
        - integrations/passport
      passport-google-oauth20:
        - integrations/passport
      passport-local:
        - integrations/passport
      "@nestjs/jwt":
        - integrations/passport
      jose:
        - integrations/passport
      bcryptjs:
        - integrations/passport
      bcrypt: []
      cache-manager:
        - integrations/cache
        - integrations/redis
      "@nestjs/cache-manager":
        - integrations/cache
        - integrations/redis
      redis:
        - integrations/cache
        - integrations/redis
      ioredis:
        - integrations/cache
        - integrations/redis
        - platform/realtime
      "@keyv/redis":
        - integrations/cache
        - integrations/redis
      cache-manager-redis-yet:
        - integrations/cache
        - integrations/redis
      cache-manager-ioredis-yet:
        - integrations/cache
        - integrations/redis
      bullmq:
        - platform/queue
      "@nestjs/bullmq":
        - platform/queue
      bull:
        - platform/queue
      "@nestjs/bull":
        - platform/queue
      kafkajs:
        - platform/event-bus
      "@nestjs/schedule":
        - platform/jobs
      cron:
        - platform/jobs
      eventemitter2: []
      setInterval:
        - platform/retry
        - platform/event-bus
        - platform/queue
        - platform/http
        - platform/realtime
      setTimeout:
        - platform/retry
        - platform/event-bus
        - platform/queue
        - platform/http
      node:timers:
        - platform/retry
        - platform/event-bus
        - platform/queue
        - platform/http
      node:timers/promises:
        - platform/retry
        - platform/event-bus
        - platform/queue
        - platform/http
      winston:
        - platform/logging
      node:async_hooks:
        - platform/logging
      nestjs-cls: []
      dayjs:
        - platform/clock
        - platform/primitives
      moment:
        - platform/clock
        - platform/primitives
      date-fns-tz:
        - platform/clock
        - platform/primitives
      "@nestjs/config": []
      dotenv: []
      "@nestjs/event-emitter": []
      "@nestjs/platform-socket.io":
        - platform/realtime
      socket.io:
        - platform/realtime
      graphql-subscriptions:
        - platform/realtime
      graphql-ws:
        - platform/realtime
      "@socket.io/postgres-adapter":
        - platform/realtime
      "@socket.io/redis-adapter":
        - platform/realtime
      pg:
        - platform/realtime
      "@starci/ai-router":
        - integrations/ai-gateway
      "@starci/ai-router/testing":
        - integrations/ai-gateway
        - integrations/ai
      "@langchain":
        - integrations/ai
      "@langchain/langgraph": []
      "@langchain/community": []
      langchain: []
      openai: []
      "@anthropic-ai/sdk": []
      "@google/genai": []
      "@google/generative-ai": []
      "@mistralai/mistralai": []
      "@openrouter/ai-sdk-provider": []
      "@ai-sdk": []
      ai: []
      cohere-ai: []
      groq-sdk: []
      ollama: []
    eventBus:
      imports:
        "@nestjs/cqrs":
          - EventBus
          - EventsHandler
          - IEventHandler
        "@nestjs/event-emitter": []
      classes:
        events:
          - EventEmitter
        node:events:
          - EventEmitter
        rxjs:
          - Subject
          - BehaviorSubject
          - ReplaySubject
          - AsyncSubject
    specDoubles:
      kit: "@starci/jest-preset"
      doubles:
        - token: (?:^|_)OPTIONS$
          double: builder
          forms:
            - curried
            - object
        - token: (?:^|_)ENTITY_MANAGER$
          double: mockEntityManager
          forms:
            - call
        - token: (?:^|_)TRANSACTION(?:_RUNNER)?$
          double: fakeTransaction
          forms:
            - call
        - token: (?:^|_)CLOCK$
          double: FakeClock
          forms:
            - new
        - token: (?:^|_)EVENT_BUS$
          double: recordingEventBus
          forms:
            - call
        - token: (?:^|_)QUEUE_OUTBOX$
          double: recordingQueueOutbox
          forms:
            - call
        - token: (?:^|_)INBOX(?:_|$)
          double: fakeInbox
          forms:
            - call
        - token: (?:^|_)CACHE(?:_|$)
          double: fakeCache
          forms:
            - call
        - token: (?:^|_)(?:LOCK|LEASE|FENCE|HOLD)(?:_|$)
          double: fakeLock
          forms:
            - call
        - token: (?:^|_)(?:IDS|ID_GENERATOR|ID_FACTORY)$
          from: /src/modules/platform/ids/
          double: fakeIds
          forms:
            - call
      fallback:
        double: mock
        forms:
          - call
          - primitive
          - array
    paramNames:
      - type: Clock
        names:
          - clock
      - type: Logger
        names:
          - logger
      - type: Cache
        names:
          - cache
      - type: CommandBus
        names:
          - commandBus
      - type: QueryBus
        names:
          - queryBus
      - type: EntityManager
        names:
          - entityManager
        nameSuffix: EntityManager
      - typeSuffix: Options
        names:
          - options
        nameSuffix: Options
    suffixes:
      - module
      - module-definition
      - decorators
      - options
      - config
      - connection
      - service
      - schema
      - command
      - query
      - handler
      - templates
      - compensation
      - saga-state
      - saga-step
      - saga
      - contracts
      - port
      - resolver
      - controller
      - gateway
      - webhook
      - subscription
      - consumer
      - cli
      - event
      - queue
      - projection
      - projection-entity
      - processor
      - step
      - input
      - type
      - args
      - request
      - response
      - mapper
      - policy
      - entity
      - sql
      - rows
      - error
      - messages
      - log-events
      - cache-keys
      - guard
      - interceptor
      - filter
      - client
      - adapter
      - spec
      - integration-spec
      - e2e-spec
      - contract-spec
      - global-setup
      - builder
    contractShape:
      helper: shapeOf
    unitRoles:
      - role: service
        spec: service.spec
      - role: cli
        spec: cli.spec
        slot: be.cli
        exempt:
          - BE_TRANSPORT_SHAPE
    logicRoles:
      - service
      - schema
      - policy
      - projection
      - guard
      - mapper
      - client
      - adapter
      - filter
      - interceptor
      - processor
      - step
      - saga
      - saga-step
      - compensation
      - consumer
      - webhook
    valueRoles:
      - schema
    thinRoles:
      - handler
      - resolver
      - controller
      - consumer
      - processor
      - step
      - saga
      - saga-step
      - compensation
      - webhook
      - gateway
      - subscription
      - cli
      - mapper
      - service
    patternScenarios:
      logging:
        - correlation-survives-queue
      event-bus:
        - atomic-with-transaction
        - relay-only-after-commit
        - redelivery-then-dead-letter
        - duplicate-delivery-is-a-noop
      queue:
        - enqueue-atomic-with-transaction
        - relay-job-id-is-outbox-id
        - scheduler-fires-once
      webhooks:
        - bad-signature-is-refused
        - replay-is-refused
        - accepted-delivery-publishes-once
      realtime:
        - subscriber-receives-push
        - foreign-topic-is-isolated
        - disconnect-releases-subscription
        - push-crosses-replicas
        - resume-after-reconnect
      fenced-job:
        - claim-bumps-token
        - zombie-fenced-out
        - redispatch-isolated
      projection:
        - recompute-is-idempotent
        - replay-rebuilds
      idempotency:
        - repeat-returns-same-outcome
        - reused-key-other-body-is-refused
    kindPatterns:
      api: []
      webhooks: []
      realtime: []
      saga:
        - saga
      reactors:
        - event-bus
      jobs:
        - fenced-job
        - queue
      cli: []
    addKinds:
      job:
        topic: jobs
        variable: job
        trigger: jobs
        patterns:
          - fenced-job
          - queue
        also:
          - queue
        defaults:
          step: "@name"
      reactor:
        topic: reactors
        variable: reactor
        trigger: reactors
        patterns:
          - event-bus
        needs:
          - event
          - from
          - service
        defaults:
          action: "@name"
      queue:
        topic: queues
        variable: queue
        patterns:
          - queue
      webhook:
        topic: webhooks
        variable: provider
        trigger: webhooks
        patterns:
          - webhooks
        needs:
          - service
        defaults:
          event: "@name"
      realtime:
        topic: realtime
        variable: channel
        trigger: realtime
        patterns:
          - realtime
        needs:
          - service
      saga:
        topic: saga
        variable: saga
        trigger: saga
        patterns:
          - saga
        needs:
          - owner
          - from
          - failed
          - done
          - service
        defaults:
          step: "@name"
      projection:
        topic: projections
        variable: name
        patterns:
          - projection
        needs:
          - connection
      api:
        topic: api
        variable: feature
        trigger: api
        patterns: []
        needs:
          - service
        defaults:
          action: "@name"
      cli:
        topic: cli
        variable: group
        trigger: cli
        patterns: []
        needs:
          - service
        wire:
          file: src/features/cli/cli.module.ts
          import: ./@@group@@/@@group@@.module
          symbol: "@@Group@@Module"
    bannedSuffixes:
      - use-case
      - repository
      - fixture
      - factory
      - store
      - worker
      - scheduler
      - cron
      - job
      - listener
      - dto
      - util
      - utils
      - helper
      - helpers
      - rules
      - types
      - constants
      - int-spec
      - harness-spec
      - test
    backing:
      redis:
        clients:
          - bullmq
          - "@nestjs/bullmq"
          - bull
          - "@nestjs/bull"
          - ioredis
          - redis
          - "@keyv/redis"
          - cache-manager-redis-yet
          - cache-manager-ioredis-yet
          - "@socket.io/redis-adapter"
        patterns:
          - queue
          - fenced-job
        images:
          - redis
          - redis-stack
          - redis-stack-server
      qdrant:
        clients:
          - "@qdrant/js-client-rest"
          - "@qdrant/qdrant-js"
        patterns: []
        images:
          - qdrant
        editions:
          - full
    dbFunctions:
      - {name: pg_advisory_xact_lock, reason: "advisoryXactLock: a transaction-scoped lock TypeORM has no API for"}
      - {name: hashtextextended, reason: "advisoryXactLock: the 64-bit key of a text lock name"}
      - {name: pg_notify, reason: "notify: LISTEN/NOTIFY of the Postgres realtime hub"}
      - {name: to_regproc, reason: "callDbFunction: whether an optional database function exists"}
      - {name: gen_random_uuid, reason: "callDbFunction: a random uuid from the database (PG13+ core, pg_catalog) where a token is minted in the transaction"}
      - {name: public.job_claim, reason: "platform/jobs (add job, lite): the fenced claim upsert of jobs.sql"}
      - {name: public.job_advance, reason: "platform/jobs (add job, lite): the token-guarded step write of jobs.sql"}
      - {name: public.job_complete, reason: "platform/jobs (add job, lite): the token-guarded completion of jobs.sql"}
      - {name: public.job_fail, reason: "platform/jobs (add job, lite): the token-guarded failure of jobs.sql"}
      - {name: public.job_tick_claim, reason: "platform/jobs (add job, lite): the once-per-minute claim of a scheduler tick, jobs.sql (R335)"}
      - {name: public.queue_write, reason: "platform/queue (add queue, lite): the outbox insert of queue-outbox.sql"}
      - {name: public.queue_waiting, reason: "platform/queue (add queue, lite): the relay read FOR UPDATE SKIP LOCKED of queue-outbox.sql"}
      - {name: public.queue_mark_sent, reason: "platform/queue (add queue, lite): the relay mark of queue-outbox.sql"}
      - {name: public.inbox_claim_event, reason: "platform/inbox (add webhook, lite): the conflict-safe delivery claim"}
      - {name: public.inbox_claim_client, reason: "platform/inbox (add webhook, lite): the client claim upsert returning its committed outcome"}
      - {name: public.inbox_save_client_outcome, reason: "platform/inbox (add webhook, lite): the saved client outcome"}
      - {name: public.inbox_sweep_clients, reason: "platform/inbox (add webhook, lite): the bounded retention sweep FOR UPDATE SKIP LOCKED"}
      - {name: public.event_bus_send, reason: "platform/event-bus (add webhook, lite): the send of a typed envelope to its pgmq topic in the publisher's transaction"}
      - {name: public.event_bus_read, reason: "platform/event-bus (add webhook, lite): a consumer's pgmq read with a visibility timeout"}
      - {name: public.event_bus_archive, reason: "platform/event-bus (add webhook, lite): the archive of a handled message"}
      - {name: public.event_bus_bury, reason: "platform/event-bus (add webhook, lite): the move of an exhausted or malformed message to its consumer's dead-letter queue"}
      - {name: public.event_bus_dead_letters, reason: "platform/event-bus (add webhook, lite): the operator read of a consumer's dead-letter queue"}
      - {name: public.event_bus_requeue, reason: "platform/event-bus (add webhook, lite): the operator requeue of one dead letter"}
    lite:
      schemaAuthority: sql
      infraOwners:
        kafkajs: []
        "@qdrant/js-client-rest": []
        "@qdrant/qdrant-js": []
slots:
  - id: app.declaration
    profiles:
      - app
    path: hfs.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules:
      - HFS_ARCH_CONFIG_UNREAD
  - id: app.readme
    profiles:
      - app
    path: README.md
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules:
      - HFS_README_*
  - id: app.package-manifest
    profiles:
      - app
    editionWhy: lite manages its database and wiring scripts; full also manages e2e and stack test scripts.
      Both may run optional contracts.
    path: package.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: package-scripts
    liteManagedBy: package-scripts-lite
    rules:
      - HFS_PACKAGE_MANAGER_MIXED
      - HFS_DEP_VERSION_SKEW
      - HFS_CANON_PIN_DRIFT
      - HFS_MANAGED_FILE_DRIFT
      - HFS_MONO_WORKSPACES
      - HFS_MONO_WORKSPACE_DEP
  - id: app.task-graph
    profiles:
      - app
    path: turbo.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: task-graph
    rules:
      - HFS_MANAGED_FILE_DRIFT
      - HFS_MONO_WORKSPACES
  - id: app.lockfile
    profiles:
      - app
    path: package-lock.json
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules:
      - HFS_PACKAGE_MANAGER_MIXED
      - HFS_DEP_VERSION_SKEW
  - id: app.git-meta
    profiles:
      - app
    path: .gitignore
    presence: required
    tracked: tracked
    tier: none
    tests: none
    rules:
      - HFS_GITIGNORE_BLOCK_DRIFT
  - id: app.gitattributes
    profiles:
      - app
    path: .gitattributes
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: skeleton
    liteManagedBy: skeleton-lite
    editionWhy: Lite renders the same managed file from skeleton-lite because the editions share one
      code structure while their adapters differ.
    rules:
      - HFS_MANAGED_FILE_DRIFT
  - id: app.tool-config
    profiles:
      - app
    path: "{.editorconfig,.nvmrc}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: skeleton
    liteManagedBy: skeleton-lite
    editionWhy: Lite renders the same managed files from skeleton-lite because the editions share one
      code structure while their adapters differ.
    rules:
      - HFS_MANAGED_FILE_DRIFT
  - id: app.format-config
    profiles:
      - app
    editionWhy: lite formats the same files; full has its TypeORM schema authority.
    path: "{.prettierrc,.prettierignore}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: tool-config
    liteManagedBy: tool-config-lite
    rules:
      - HFS_MANAGED_FILE_DRIFT
      - HFS_TOOL_CONFIG_LOCAL
  - id: app.tool-config-optional
    profiles:
      - app
    path: "{.npmrc,.npmignore}"
    presence: optional
    tracked: tracked
    tier: none
    tests: none
  - id: app.tool-config-local
    profiles:
      - app
    path: "{tsconfig.json,.eslintrc,.eslintrc.*,.eslintignore,eslint.config.*,.stylelintrc,.stylelintrc\
      .*,.stylelintignore,stylelint.config.*,.prettierrc.*,prettier.config.*,jest.config.*,lint-sta\
      ged.config.*,.lintstagedrc*}"
    presence: forbidden
    tracked: external
    tier: none
    tests: none
    goesTo: "nowhere at the app root: each side holds exactly its managed tool configuration
      (be.tool-config, fe.tool-config) and the root only the formatter (app.format-config)"
    rules:
      - HFS_TOOL_CONFIG_LOCAL
  - id: app.quality-config
    profiles:
      - app
    path: "{sonar-project.properties,codecov.yml}"
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: quality-config
    rules:
      - HFS_SONAR_CONFIG
      - HFS_MANAGED_FILE_DRIFT
  - id: app.hooks
    profiles:
      - app
    path: .husky/{pre-commit,pre-push}
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: hooks
    rules:
      - HFS_CI_E2E_AUTOMATIC
      - HFS_MANAGED_FILE_DRIFT
  - id: app.ci
    profiles:
      - app
    editionWhy: lite CI proves boot through R272 wiring and lints its db migrations; full also
      provides its e2e lane.
    path: .github/workflows/ci.yml
    presence: required
    tracked: tracked
    tier: none
    tests: none
    managedBy: ci-workflows
    liteManagedBy: ci-workflows-lite
    rules:
      - HFS_CI_E2E_AUTOMATIC
      - HFS_CI_MISSING_CANON
      - HFS_MANAGED_FILE_DRIFT
  - id: app.ci-e2e
    profiles:
      - app
    editionWhy: lite has no e2e world; R272 supplies its wiring proof, while optional contracts run separately.
    path: .github/workflows/e2e.yml
    presence: optional
    litePresence: forbidden
    tracked: tracked
    tier: none
    tests: none
