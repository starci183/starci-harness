    lite:
      why: "the world of the optional integration specs of a lite app: global-setup.ts connects to the
        local db service (`npm run db:start`, with the migrations applied by `npm run db:push`) and starts no container, no toxiproxy and no stack of its own; use-test-world.ts
        exports useTestWorld({ modules: [...] }) -> world.db.<connection> (the shared EntityManager)
        and world.fake.<provider> (a network-edge fake of an external SaaS). There is no world.apps
        (no e2e) and no world.infra (no self-hosted service to cut)"
    allows:
      - global-setup.ts
      - global-teardown.ts
      - use-test-world.ts
      - fakes/<provider>/server.ts
      - fakes/
    tests: none
    coverage: none
    why: "the ONLY test infrastructure location, shared by integration and e2e: global-setup.ts starts
      the shared infrastructure (containers) and runs the migrations once over the cli app's
      connections; use-test-world.ts exports useTestWorld({ apps: { <name>: { module, listen? } } }
      | { modules: [...] }) -> world.apps.<name>.api, world.db.<connection> (the shared
      EntityManager), world.infra.<service> (latency/cut/restore on a REAL service of the
      repository's own stack, the app root's `.starcistacks/<env>`, each behind toxiproxy),
      world.fake.<provider> (a network-edge fake of an external SaaS started by the world, with
      failNext/replayWebhook/delay), world.waitFor; fakes/<provider>/ holds the fake servers and
      payload fixtures, kit/ the inlined test helpers, and the world root may hold role-suffixed
      helpers (<name>.client.ts, <name>.contracts.ts, ...). Nothing is overridden in the DI
      container. It is the only test location that may import typeorm's DataSource or
      testcontainers, call migrate/runMigrations/synchronize, or write process.env."
