      - FE_OWNER_REACHABLE
  - id: fe.modules
    profiles:
      - fe
    path: apps/<app>/src/modules/<capability>/
    presence: required
    tracked: tracked
    tier: modules
    owner: true
    requiredInstances:
      capability:
        - config
        - i18n
        - routes
    requires:
      - index.ts
    tests: none
    budget:
      file: 400
    rules:
      - FE_ENV_OWNER
      - FE_TRANSPORT_OWNER
  - id: fe.modules.api
    profiles:
      - fe
    path: apps/<app>/src/modules/api/
    presence: optional
    tracked: tracked
    tier: transport
    requires:
      - index.ts
    allows:
      - index.ts
      - graphql/index.ts
      - graphql/types.ts
      - graphql/clients/**
      - graphql/queries/query-*.ts
      - graphql/queries/types/*.ts
      - graphql/mutations/mutation-*.ts
      - graphql/mutations/types/*.ts
      - graphql/subscriptions/subscription-*.ts
      - graphql/subscriptions/types/*.ts
      - graphql/__generated__/**
      - rest/index.ts
      - rest/<area>/*.ts
      - sse/clients/**
      - sse/*/stream-*.ts
    roles:
      entry: index.ts
      query: query-*.ts
      mutation: mutation-*.ts
    entries:
      - graphql/queries/query-*.ts
      - graphql/queries/types/*.ts
      - graphql/mutations/mutation-*.ts
      - graphql/mutations/types/*.ts
      - graphql/subscriptions/subscription-*.ts
      - graphql/subscriptions/types/*.ts
      - sse/*/stream-*.ts
    tests: none
    rules:
      - FE_TRANSPORT_OWNER
      - FE_HTTP_STATUS_COLLAPSE
      - FE_WIRE_GENERATED
  - id: fe.transport.generated
    profiles:
      - fe
    path: apps/<app>/src/modules/api/graphql/__generated__/
    presence: optional
    tracked: ignored
    tier: transport
    tests: none
    why: the canonical GraphQL client output of codegen is local and never committed; this specific slot
      overrides the tracked API parent
    rules:
      - FE_WIRE_GENERATED
  - id: fe.transport.client
    profiles:
      - fe
    path: apps/<app>/src/modules/api/graphql/clients/
    presence: optional
    tracked: tracked
    tier: transport
    tests: none
    why: the auth and no-auth Apollo clients and their link chain (retry, error, timeout, token refresh,
      attach access token, http) of the one app that calls the back end; when several apps do, the
      shared client is fe.package.api.client
    rules:
      - FE_TRANSPORT_OWNER
  - id: fe.transport.stream
    profiles:
      - fe
    path: apps/<app>/src/modules/api/sse/clients/
    presence: optional
    tracked: tracked
    tier: transport
    allows:
      - "*.ts"
    tests: none
    why: "the event-stream client of the one app that calls the back end, the stream half of the
      transport client layer (FE-REALTIME): event-stream.ts creates the app's one
      @starci/event-stream instance (createEventStream with the bearer access token source, which
      opens the stream with fetch, parses the events and reopens it with Last-Event-ID after a
      capped, doubling wait); a stream operation (sse/<area>/stream-<channel>.ts) follows on it and
      a useSubscribe hook of hooks/swr reads that operation; no hand-written reader lives here and
      only a stream operation imports this folder (FE_TRANSPORT_OWNER); a repository where several
      apps stream keeps one instance in each of them"
    rules:
      - FE_TRANSPORT_OWNER
  - id: fe.transport.outcome
    profiles:
      - fe
    path: apps/<app>/src/modules/api/graphql/types.ts
    presence: optional
    tracked: tracked
    tier: transport
    outcomeHome: true
    tests: none
    why: the one GraphQLResponse union ({success, message, error, data}) of the one app that calls the
      back end; when several apps do, the shared union is fe.package.api.outcome
    rules:
      - FE_HTTP_STATUS_COLLAPSE
  - id: fe.modules.config
    profiles:
      - fe
    path: apps/<app>/src/modules/config/
    presence: required
    tracked: tracked
    tier: foundation
    tests: none
    why: the only reader of process.env and NEXT_PUBLIC_*; fails fast, no localhost fallback
    rules:
      - FE_ENV_OWNER
  - id: fe.modules.i18n
    profiles:
      - fe
    path: apps/<app>/src/modules/i18n/
    presence: required
    tracked: tracked
    tier: foundation
    requires:
      - index.ts
    tests: none
    rules:
      - FE_I18N_PLACEMENT
      - FE_I18N_CATALOG
  - id: fe.modules.brand
    profiles:
      - fe
    path: apps/<app>/src/modules/brand/brand.css
    presence: optional
    tracked: tracked
    tier: none
    tests: none
    why: the ONLY app file that may hold colour values; sets grammar brand tokens only, light and dark
    rules:
      - FE_STYLE_TOKEN_ONLY
  - id: fe.modules.routes
    profiles:
      - fe
    path: apps/<app>/src/modules/routes/
    presence: required
    tracked: tracked
    tier: foundation
    tests: none
    why: every href builder; FE_HREF_RESOLVES checks each against app/
    rules:
      - FE_HREF_RESOLVES
      - FE_ROUTE_HARDCODED
  - id: fe.modules.types
    profiles:
      - fe
    path: apps/<app>/src/modules/types/
    presence: optional
    tracked: tracked
    tier: foundation
    tests: none
    why: shared types with no runtime behaviour; a component may import them
    rules:
      - FE_TYPE_ESCAPE
      - HFS_TS_STRICT
  - id: fe.modules.types.ambient
    parent: fe.modules.types
    profiles:
      - fe
    path: apps/<app>/src/modules/types/ambient/
    presence: optional
    tracked: tracked
    tier: foundation
    owner: true
    allows:
      - "*.d.ts"
    tests: none
    why: global ambient declarations loaded by the app compiler; this owner exposes no runtime API
    rules:
      - FE_TYPE_ESCAPE
      - HFS_TS_STRICT
  - id: fe.modules.auth
    profiles:
      - fe
    path: apps/<app>/src/modules/auth/
    presence: optional
    tracked: tracked
    tier: modules
    owner: true
    requires:
      - index.ts
    why: the session issuer's client; in lite auth-door.ts alone calls the app's own back-end auth doors
      with the REST client and token-store.ts alone keeps the in-memory access token
    tests: none
    rules:
      - FE_STACK_FORBIDDEN
      - FE_TRANSPORT_OWNER
  - id: fe.modules.toast
    profiles:
      - fe
    path: apps/<app>/src/modules/toast/
    presence: optional
    tracked: tracked
    tier: modules
    owner: true
    requires:
      - index.ts
      - toast.tsx
      - api.ts
      - hooks.ts
    allows:
      - index.ts
      - toast.tsx
      - api.ts
      - hooks.ts
    roles:
      entry: index.ts
      hooks: hooks.ts
    tests: none
    rules:
      - FE_I18N_LITERAL
      - FE_HOOKS_ARE_HOOKS
      - FE_HTTP_STATUS_COLLAPSE
  - id: fe.package.api
    profiles:
      - fe
    path: packages/<family>-api/
    presence: opt-in
    tracked: tracked
    tier: package
    owner: true
    requires:
      - package.json
      - src/index.ts
      - src/graphql/clients/index.ts
      - src/graphql/types.ts
      - tsconfig.json
    tests: none
    why: the one transport client and the one Outcome union shared by every app of the repository; no
      app keeps its own
    rules:
      - FE_TRANSPORT_OWNER
      - FE_PACKAGE_SHAPE
      - HFS_UNUSED_EXPORT
  - id: fe.package.api.client
    profiles:
      - fe
    path: packages/<family>-api/src/graphql/clients/
    presence: optional
    tracked: tracked
    tier: package
    tests: none
    why: the repository's one pair of Apollo clients and their link chain
    rules:
      - FE_TRANSPORT_OWNER
  - id: fe.package.api.outcome
    profiles:
      - fe
    path: packages/<family>-api/src/graphql/types.ts
    presence: optional
    tracked: tracked
    tier: package
    outcomeHome: true
    tests: none
    why: the repository's one GraphQLResponse union
    rules:
      - FE_HTTP_STATUS_COLLAPSE
  - id: fe.package.i18n
    profiles:
      - fe
    path: packages/<family>-i18n/
    presence: opt-in
    tracked: tracked
    tier: package
    owner: true
    requires:
      - package.json
      - src/index.ts
      - tsconfig.json
    tests: none
    why: the next-intl stack (routing, navigation, request config) written once, exported as the
      createAppI18n factory every app calls
    rules:
      - FE_I18N_PLACEMENT
      - FE_PACKAGE_SHAPE
      - HFS_UNUSED_EXPORT
