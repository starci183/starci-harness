# The harness repository's own HFS: what may exist in this repository (hfs.json kind runtime) and where. It is the
# runtime's counterpart of slots.yaml, in the same field vocabulary; `starci check shape` reads it and places every file
# of the tree as it stands (tracked and untracked, never what .gitignore ignores). Field meanings are in hfs/README.md
# ("The harness's own shape"); the code that judges them is cli/src/core/check/shape-scan.ts.
#
# Order: forbidden gate slots judge first, then forbidden target slots, then a file goes to the first other slot whose
# path holds it. A target slot is red outside its dated exceptions; an exception that covers nothing, or is past its
# date, is red too, so the list only shrinks.
schema: starci/harness-slots@1
version: 1.1.0
kind: runtime
presenceValues:
  - required
  - optional
  - forbidden
enforceValues:
  - gate
  - target

slots:
  # --- what must never exist
  - id: never.env
    path: "**/{.env,*.env,.env.*}"
    except:
      - "**/{.env,*.env}.example"
    presence: forbidden
    holds: an env or secret file; secrets stay on the machine, read only by the CLI's secret loader for the keys secretKeys lists
    rule: policy/security.yaml neverRead; .gitignore
  - id: never.examples
    path: "**/examples/"
    presence: forbidden
    holds: example apps and example re-pins; a proof is a scratch repository, a package proves itself with its specs
    rule: CONTRIB-2
  - id: never.plans
    path:
      - "**/{PLAN,Plan,plan,MASTER,ROADMAP,TODO}*.md"
      - "**/*{-plan,.plan,_plan}.md"
      - "**/plans/"
    presence: forbidden
    holds: a plan, roadmap or master file; a decided plan is stated as rules, each fact in its owner
    rule: CONTRIB-4 one owner per fact; CONTRIB-5 present tense, no ghosts
  - id: never.grammar-tests
    path:
      - "packages/grammar/**/*.{spec,test}.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      - "packages/grammar/**/*.{spec,test}.d.{ts,mts,cts}"
      - "packages/grammar/**/*.snap.json"
      - "packages/grammar/**/{specs,spec,tests,test,__tests__,e2e,proof}/"
      - "packages/grammar/**/{jest,vitest,playwright}.config.*"
      - "packages/grammar/tsconfig.{specs,spec,test,tests,codemods-spec}.json"
    presence: forbidden
    holds: >-
      a spec, test, snapshot, test folder or test-runner config in the Grammar package, with no exception. The owner, 2026-11-26:
      "xóa tests grammars và ghi rules chặt vì useless". A Grammar change is proven by its code, its stories, its contract row and
      its family context, read in review
    rule: contexts/ui/proof.md GRAMMAR-NO-TESTS; packages/grammar/README.md "No tests, no shots"
  - id: never.grammar-shots
    path:
      - "packages/grammar/docs/**/*.{png,jpg,jpeg,webp}"
      - "packages/grammar/{shots,reference-renders}/"
      - "packages/grammar/**/{shoot,shots,screenshot,screenshots}.{ts,mts,cts,js,mjs,cjs}"
    presence: forbidden
    holds: >-
      a screenshot of the Grammar, a folder of them or a script that takes them, with no exception. The owner, 2026-11-26:
      "Grammar chụp hình làm gì code ra story dc r? Đọc code là dc mà? Bỏ vụ chụp hình đi, xoá luôn". The proof of a Grammar
      change is its code and its stories, read in review
    rule: contexts/ui/proof.md GRAMMAR-NO-TESTS; packages/grammar/README.md "No tests, no shots"
  - id: never.cli-js
    path: "cli/src/**/*.{js,mjs,cjs,jsx}"
    presence: forbidden
    holds: JavaScript source in the CLI; the CLI is TypeScript built to cli/dist
    rule: CONTRIB-11; cli/README.md
  - id: never.build-output
    path:
      - "cli/dist/"
      - "packages/*/dist/"
      - "app/dist/"
    presence: forbidden
    holds: build output; dist is built from src and ignored, never committed
    rule: .gitignore dist/
  - id: never.second-cli
    path:
      - "packages/{cli,*-cli}/"
    presence: forbidden
    holds: a second CLI package; the CLI is one, cli/ (starci-harness)
    rule: the CLI is one package, cli/; CONTRIB-4
  - id: never.second-cli-bin
    path: "**/package.json"
    except:
      - "cli/package.json"
      - "packages/hfs/templates/**"
      - "packages/*/fixtures/**"
    jsonKey: bin
    presence: forbidden
    holds: a package that declares a bin, which makes it a second CLI; only cli/package.json declares one
    rule: the CLI is one package, cli/; CONTRIB-4
  - id: never.knowledge-outside-contexts
    path:
      - "docs/"
      - "knowledge/"
      - "notes/"
    presence: forbidden
    holds: knowledge outside contexts/; knowledge an agent loads lives only in contexts/
    rule: CONTRIB-4; contexts/README.md load order
  - id: never.package-js
    path:
      - "packages/<name>/**/*.{js,mjs,cjs,jsx}"
      - "packages/<name>/*.{d.ts,d.cts}"
    except:
      # spec fixtures: test data a spec reads or imports (an imported module has a hand-written .d.mts beside it)
      - "packages/*/src/fixtures/**"
      # app code a package renders into a product repository
      - "packages/*/templates/**"
      # the vendored yaml bundle
      - "packages/*/runtime/engine/yaml.mjs"
      # generated modules
      - "packages/**/*.generated.*"
      # the lint bundles' runtime copies: runtime/bundle.json names each file, generated from hfs's build output or kept as its own
      - "packages/{eslint-canon-be,eslint-canon-fe,eslint-grammar-core,eslint-grammar-offset-pop}/runtime/**"
    presence: forbidden
    holds: hand-written JavaScript or hand-written declarations in a package; a package is TypeScript in src/ built to dist/
    rule: every package is TypeScript source built to JavaScript

  # --- the repository root
  - id: root.declaration
    path: hfs.json
    presence: required
    holds: the tree declaration (hfs 1, kind runtime) a tree is recognised by
    rule: contexts/harness/state.md
  - id: root.readme
    path: README.md
    presence: required
    holds: what the harness is, how it works, how to install it, the verb groups and CI
    rule: CONTRIB-4
  - id: root.contributing
    path: CONTRIBUTING.md
    presence: required
    holds: the contribution laws CONTRIB-1 to CONTRIB-20
    rule: CONTRIB-4
  - id: root.license
    path: LICENSE
    presence: required
    holds: the license of the repository
    rule: open source repository
  - id: root.agent-bootstrap
    path: "{CLAUDE.md,AGENTS.md}"
    presence: required
    requires:
      - CLAUDE.md
      - AGENTS.md
    holds: the agent bootstrap each agent host reads first; both point at contexts/README.md
    rule: contexts/README.md load order
  - id: root.community
    path: "{CHANGELOG.md,CODE_OF_CONDUCT.md,SECURITY.md}"
    presence: optional
    holds: the CLI changelog, the conduct expected and how to report a vulnerability
    rule: CONTRIB-4
  - id: root.git-meta
    path: "{.gitignore,.gitattributes}"
    presence: required
    requires:
      - .gitignore
      - .gitattributes
    holds: what git ignores (env files, build output, state) and the LF line endings
    rule: CONTRIB-14
  - id: root.secret-example
    path: secret.env.example
    presence: required
    holds: the keys of the host's untracked secret.env, each empty with what it is and where to get it
    rule: policy/security.yaml secretKeys
  - id: root.sonar
    path: sonar-project.properties
    presence: optional
    holds: the Sonar scope of the repository
    rule: policy/quality.yaml ci.sonar-new-code
  - id: github.ci
    path: ".github/workflows/ci.yml"
    presence: required
    holds: the CI that plans the affected packages, runs the gates, those packages' specs (and packs each once), the harness and the app jobs; a newer push cancels an older run, and it writes to neither npm nor main
    rule: CONTRIB-3; CONTRIB-20
  - id: github.scripts
    path: [".github/scripts/*.mts", ".github/scripts/tsconfig.json"]
    presence: optional
    holds: scripts a CI job runs (the publish gate that picks the packages whose own jobs are green), typechecked by their own tsconfig
    rule: CONTRIB-20
  - id: github.actions
    path: ".github/actions/*/action.yml"
    presence: optional
    holds: composite steps the CI jobs share (the CLI install over the repo's own packages)
    rule: CONTRIB-20
  - id: github.workflows
    path: ".github/workflows/*.yml"
    presence: optional
    holds: further CI workflows (publish.yml, which publishes the tested tarballs and moves the CLI, never cancelled; the desktop app build)
    rule: CONTRIB-20
  - id: github.meta
    path: ".github/{dependabot.yml,pull_request_template.md,ISSUE_TEMPLATE/*.yml}"
    presence: optional
    holds: dependency updates, the pull request template and the issue forms
    rule: open source repository

  # --- the committed check cache of the harness itself
  - id: cache.check
    path: ".cache/check/{build,types,declarations,bundles,lint,test}/*.jsonl"
    presence: optional
    holds: the harness check cache, one green verdict per CI node (a package, cli, app) and step under its content key, written by `starci check` and committed by `lane gate --push`; reused by the lane gate, the full gate and CI's plan, proved nightly by cache-verify.yml
    rule: contexts/harness/check-cache.md

  # --- service images built from fork source
  - id: images.readme
    path: images/README.md
    presence: optional
    holds: how the canonical source-build recipes consume their pinned fork contexts and where their existing publication receipts live
    rule: CONTRIB-4; images/README.md
  - id: images.sources
    path: images/sources.json
    presence: optional
    holds: the source commits, release build arguments, platforms and published provenance of the source-built service images
    rule: CONTRIB-4; CONTRIB-9
  - id: images.dockerfile
    path: "images/<image>/Dockerfile"
    presence: optional
    holds: the canonical Dockerfile that builds a service image from its pinned fork source context
    rule: images/README.md

  # --- knowledge: only in contexts/
  - id: contexts.load-order
    path: contexts/README.md
    presence: required
    holds: the load order and the map of every knowledge file
    rule: CONTRIB-4
  - id: contexts.harness-shape
    path: contexts/hfs/harness.yaml
    presence: required
    holds: this manifest, the harness repository's own shape
    rule: CONTRIB-10 general checks only
  - id: contexts.knowledge
    path: "contexts/**/*.{md,yaml,html}"
    presence: optional
    holds: every piece of knowledge an agent loads (harness, hfs, code, ui, grammars, vendor, stack, project), product-agnostic
    rule: CONTRIB-4
  - id: misc.know-how
    path: "misc/*.md"
    presence: optional
    holds: know-how for work that is neither code nor the harness (filming a product demo and the like), indexed by misc/README.md and read on demand from AGENTS.md "Misc work"
    rule: AGENTS.md "Misc work"

  # --- machine rules: ops/ and policy/
  - id: ops.map
    path: ops/README.md
    presence: required
    holds: the map of ops/, the router's steps, failure classes and their accounting
    rule: CONTRIB-4
  - id: ops.data
    path: "ops/*.yaml"
    presence: required
    requires:
      - ops/checks.yaml
      - ops/routing.yaml
      - ops/routes.yaml
      - ops/lanes.yaml
      - ops/liveness.yaml
      - ops/host.yaml
      - ops/uat.yaml
      - ops/telegram.yaml
    holds: check presets, routing, routes, lanes, liveness thresholds, the host, the uat image and the Telegram channel, as data the CLI validates
    rule: CONTRIB-9 data is data
  - id: ops.host-services
    path: "ops/host/**"
    presence: optional
    holds: the compose files of the host stack ops/host.yaml declares in ops/host/stack (Sonar, its database, the tunnel, the local npm registry and its config), as data the host verbs run
    rule: CONTRIB-9 data is data
  - id: ops.vps-servers
    path: "ops/vps/servers/*.yaml"
    presence: optional
    holds: the example server row of the managed VPS fleet ops/vps.yaml declares; the real inventory in this folder stays gitignored, as data the vps verbs validate
    rule: CONTRIB-9 data is data
  - id: ops.vps-recipients
    path: "ops/vps/recipients.yaml"
    presence: required
    holds: the public age recipients of every app's sealed members (the harness recipient for dev, each managed VPS's server and backup recipient for the environments it serves; public halves only), owned here and shipped to @starci/hfs as knowledge/hfs/sops-recipients.yaml for R451
    rule: CONTRIB-9 data is data
  - id: ops.vps-monitor
    path: "ops/vps/monitor/**"
    presence: optional
    holds: the shared monitoring stack of a managed VPS (components.yaml with each component's toggle, pin, limits and retention, and the Prometheus, Alertmanager, Loki, Alloy, Tempo, Pyroscope, blackbox and Grafana provisioning files), as data `starci vps monitor up` renders and deploys
    rule: CONTRIB-9 data is data
  - id: ops.vps-services
    path: "ops/vps/services/**"
    presence: optional
    holds: the catalog of opt-in shared services of a managed VPS, one folder per service (components.yaml with its stack, network, key, pinned model variants and each component's toggle, pin, limits, rollout and retention, and the config files it mounts, the embeddings gate's Caddyfile first), as data `starci vps service up` renders and deploys; and the host-compose service buildkit (service.yaml, compose.yaml and buildkitd.toml of the rootless remote BuildKit the host roles deploy)
    rule: CONTRIB-9 data is data
  - id: ops.labels
    path: "ops/ops/*.md"
    presence: required
    requires:
      - ops/ops/README.md
    holds: one op file per label (its base context, inputs, outputs, checks and procedure) and the op pattern
    rule: CONTRIB-4
  - id: ops.coordinators
    path: "ops/coordinators/*.md"
    presence: optional
    holds: the Kernel's and the Supervisor's briefs
    rule: CONTRIB-4
  - id: ops.telegram-assets
    path: "ops/telegram/*.png"
    presence: required
    requires:
      - ops/telegram/ticket-banner.png
    holds: the one decorative banner every ticket notice is sent with (ops/telegram.yaml banner), generated once with Codex's image generation; the facts are its caption
    rule: CONTRIB-4
  - id: policy.rules
    path: "policy/{README.md,*.yaml}"
    presence: required
    requires:
      - policy/README.md
      - policy/canon.yaml
      - policy/loosening.yaml
      - policy/quality.yaml
      - policy/security.yaml
    holds: gate tiers, profiles, overlays, banned markers, the secret scan, the canon packages per stack and the business identifiers the tree never holds
    rule: CONTRIB-9; CONTRIB-11

  # --- the one CLI: cli/
  - id: cli.package
    path: "cli/{package.json,package-lock.json,README.md,tsconfig.json,tsconfig.build.json,eslint.config.ts}"
    presence: required
    requires:
      - cli/package.json
      - cli/package-lock.json
      - cli/README.md
      - cli/tsconfig.json
      - cli/tsconfig.build.json
      - cli/eslint.config.ts
    holds: the one CLI package (starci-harness), how it is built and linted
    rule: the CLI is one package, cli/; CONTRIB-11
  - id: cli.entry
    path: "cli/src/{main.ts,registry.ts}"
    presence: required
    requires:
      - cli/src/main.ts
      - cli/src/registry.ts
    holds: the entry point and the registry, the only place verb types are erased
    rule: CONTRIB-12
  - id: cli.verbs
    path:
      - "cli/src/core/*.ts"
      - "cli/src/core/<group>/*.ts"
    presence: required
    holds: each verb as one defineVerb file at core/<group>/<verb>.ts (core/<verb>.ts for a group of one), beside its group's helpers
    rule: CONTRIB-12 one verb, one file
  - id: cli.edition-verbs
    path: "cli/src/{lite,full}/<group>/*.ts"
    presence: optional
    holds: the verbs one edition alone serves
    rule: CONTRIB-12
  - id: cli.verb-data
    path: "cli/src/core/<group>/*.json"
    presence: optional
    holds: data a verb group reads and owns (the search evaluation set)
    rule: CONTRIB-9
  - id: cli.harness
    path: "cli/src/harness/**/*.ts"
    presence: required
    holds: the shared harness modules (ledgers, settling, graph, routing, seat launch, Orca) the verbs share
    rule: cli/README.md
  - id: cli.shared
    path: "cli/src/shared/*.ts"
    presence: required
    holds: the plumbing every module uses (verb standard, errors, git, exec, output, role, tree)
    rule: CONTRIB-13 no shell

  # --- packages: TypeScript in src/, built to dist/
  - id: packages.map
    path: packages/README.md
    presence: required
    holds: the map of packages and their build and install convention
    rule: CONTRIB-4
  - id: packages.package
    path: "packages/<name>/{package.json,package-lock.json,README.md,LICENSE,CHANGELOG.md,.gitignore,.npmrc}"
    presence: required
    per: "packages/<name>/"
    requires:
      - package.json
      - package-lock.json
      - README.md
      - LICENSE
    holds: one npm package per folder, its manifest, lockfile, readme, license and changelog
    rule: CONTRIB-2; CONTRIB-20
  - id: packages.build-config
    path:
      - "packages/<name>/{tsconfig.json,tsconfig.*.json,eslint.config.ts,stylelint.config.ts}"
      - "packages/<name>/scripts/*.ts"
    presence: optional
    holds: a package's typecheck and build configs (tsconfig.build.json emits dist/), its lint configs and the build steps its package.json runs after tsc (scripts/*.ts, e.g. the dual-entry step of @starci/common)
    rule: every package is TypeScript source built to dist/
  - id: packages.source
    path: "packages/<name>/src/"
    presence: required
    per: "packages/<name>/"
    exempt:
      - path: packages/tsconfig/
        why: the tsconfig package is JSON presets; it has nothing to build
    holds: a package's TypeScript source and its specs beside it, built to dist/ (ignored)
    rule: every package is TypeScript source built to JavaScript
  - id: packages.hfs-source
    path:
      - "packages/hfs/{audit,cache,ci,codemod,coverage,data,db,desktop,emit,lint,release,report,scaffold,scripts,stack,sync,uiaudit,upgrade}/**/*.{mts,cts}"
      - packages/hfs/src/main.mts
      - packages/hfs/vendor-types.d.mts
    presence: optional
    holds: the TypeScript source of @starci/hfs, one folder per app verb area beside runtime/, compiled in place to .mjs (.cjs from a .cts, a --require preload) at the paths it ships and is imported by (the emitted JavaScript and declarations are ignored); vendor-types.d.mts types the one dependency that ships none
    rule: every package is TypeScript; hfs keeps its published paths, so its source is not under src/
  - id: packages.grammar-tools
    path:
      - "packages/grammar/scripts/*.mts"
      - "packages/grammar/scripts/lint/*.mts"
    presence: optional
    holds: the grammar's build tools (build stamp, clean, CSS copy, the static checks, the proximity audit, the media fixtures), TypeScript typechecked by tsconfig.scripts.json
    rule: every package is TypeScript
  - id: packages.grammar-codemods
    path:
      - packages/grammar/codemods/index.mts
      - "packages/grammar/codemods/v*/*.mts"
      - "packages/grammar/codemods/v*/fixtures/{before,after}/**/*.{ts,tsx}"
    presence: optional
    holds: the Grammar's codemods, one folder per release that changes an app-facing API, named after its version (v0540 for 0.54.0), with its before/after fixtures; shipped as @starci/grammar/codemods and run by `starci app codemod`
    rule: contexts/grammars/contributing.md "Codemods"
  - id: packages.grammar-ext-demo
    path:
      - "packages/grammar/ext-demo/graph/{index.html,*.tsx,*.css,vite.config.ts}"
    presence: optional
    holds: the demo page of the core's graph ext (every story of FlowGraph, SchemaMap, ErdMap and KnowledgeMap, drawn from src/core/ext/graph; `npm run ext:demo`), looked at by hand at 1440 and 390; never in build, push or publish, and not in the published files
    rule: contexts/ui/components/graph.md
  - id: packages.tests
    path: "packages/<name>/test/"
    presence: optional
    holds: a package's tests kept apart from src/ (ai-router)
    rule: CONTRIB-2
  - id: packages.generated
    path:
      - "packages/<name>/runtime/"
      - "packages/<name>/**/*.generated.*"
    presence: optional
    generated:
      from:
        - contexts/stack/pins.yaml
        - contexts/hfs/slots.yaml
        - contexts/hfs/rules.yaml
        - contexts/grammars/contract.yaml
        - contexts/stack/fe.yaml
      how: copies of the owner files in contexts/ a package ships; one owner per fact means the package makes them at build, never by hand
    holds: generated runtime copies and generated modules a package ships
    rule: CONTRIB-4 one owner per fact (a copy is generated from its owner)
  - id: packages.data
    path:
      - "packages/<name>/fixtures/"
      - "packages/<name>/migrations/*.sql"
      - "packages/hfs/templates/"
      - "packages/<name>/**/*.{fixture,partial}"
    presence: optional
    holds: data a package reads and never compiles (lint fixtures that keep their violations, app templates, emit partials, SQL migrations a package ships for the app to render)
    rule: CONTRIB-9 data is data
  - id: packages.rule-docs
    path: "packages/<name>/docs/*.md"
    presence: optional
    holds: the page a lint rule's message links to; it names its owner in contexts/ and never restates the law
    rule: CONTRIB-4
  - id: packages.presets
    path: ["packages/tsconfig/*.json", "packages/tsconfig/config.spec.ts"]
    presence: optional
    holds: the strict TypeScript presets base, be, build, next and e2e
    rule: packages/README.md
  - id: packages.storybook
    path: "packages/grammar/.storybook/*.{ts,tsx}"
    presence: optional
    holds: the Grammar's Storybook configuration
    rule: packages/README.md

  # --- skills and the app
  - id: skills.skill
    path: "skills/<skill>/{SKILL.md,references/*.md,agents/*.yaml,kit/*.{css,mjs}}"
    presence: required
    per: "skills/<skill>/"
    requires:
      - SKILL.md
    holds: a skill an agent host loads, with its references and, for a skill that ships one, its kit (stylesheets and node scripts it copies or runs)
    rule: CONTRIB-4
  - id: app.package
    path: "app/{package.json,package-lock.json,README.md}"
    presence: required
    requires:
      - app/package.json
      - app/README.md
    holds: the desktop app, one package in app/
    rule: README.md (the desktop app)
  - id: app.tree
    path: app/
    presence: optional
    holds: the desktop app's source, Tauri shell, assets and screenshots
    rule: README.md (the desktop app)
