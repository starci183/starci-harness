    failureCodes:
      - BE_APP_BOOT_PROOF_MISSING
    enforcers:
      - {kind: hfs, id: boot-proof}
  - id: R273
    code: HFS_COVERAGE_BELOW
    law: A supplied coverage report proves full line, function and branch coverage per back-end logic file in the slot-derived measured scope.
    failureCodes:
      - HFS_COVERAGE_BELOW
    enforcers:
      - {kind: hfs, id: coverage-below}
  - id: R275
    code: STACKS_INGRESS_UNDECLARED
    law: Every Swarm environment declares one ingress component with a digest-pinned supported ingress image and its hosts.
    failureCodes:
      - STACKS_INGRESS_UNDECLARED
      - STACKS_INGRESS_UNKNOWN
    enforcers:
      - {kind: hfs, id: stacks-ingress}
  - id: R276
    code: STACKS_LITE_SELFHOSTED_DB
    law: Lite runs no self-hosted database or vector store, runs Redis only when declared and then durably, and its sidecars keep their own storage on a declared volume.
    editions: [lite]
    failureCodes:
      - STACKS_LITE_SELFHOSTED_DB
      - STACKS_SIDECAR_VOLUME_UNDECLARED
      - STACKS_SIDECAR_DB_UNSUPPORTED
      - STACKS_LITE_REDIS_PERSISTENCE
    enforcers:
