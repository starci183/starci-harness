# The HFS rule catalog: one entry per rule, its finding code, its law in one sentence, the failure codes it reports and
# the enforcers that judge it. The law states what must hold; the reason lives in the pattern that cites the rule
# (contexts/code/<side>/*.md), the value in its owner (hfs/slots.yaml ruleParams or budgets, stack/pins.yaml,
# the grammar package), and every dated owner decision in decisions/rulings.yaml.
schema: starci/hfs-rules@4
enforcerKinds:
  eslint-be: a rule of @starci/eslint-canon-be (id without the plugin prefix)
  eslint-fe: a universal rule of @starci/eslint-canon-fe
  eslint-grammar-core: a rule of the selected Grammar's lint package over the shared component API
  stylelint: a rule of @starci/stylelint-canon
  machine: a check of the architecture machine over the import graph
  hfs: a check of the app CLI over the tree, configuration, contracts or catalogs
  sonar: a condition of the Sonar quality gate
rules:
  - id: R01
    code: HFS_SLOT_UNDECLARED
    law: Every tracked path matches exactly one slot.
    failureCodes:
      - HFS_SLOT_UNDECLARED
      - HFS_SLOT_AMBIGUOUS
      - HFS_SLOT_NOT_ENABLED
      - HFS_FORBIDDEN_PRESENT
      - HFS_TRACKED_MUST_BE_IGNORED
      - HFS_ROOT_ENTRY_FORBIDDEN
      - HFS_ROOT_MARKDOWN_FORBIDDEN
      - HFS_ROOT_SRC_FORBIDDEN_FE
      - HFS_SRC_LAYOUT_INVALID
      - HFS_MODULE_TIER_INVALID
      - HFS_WORK_IN_FE
      - HFS_STACKS_IN_SIDE
    enforcers:
      - {kind: hfs, id: slot-undeclared}
      - {kind: eslint-be, id: slot-undeclared}
      - {kind: eslint-fe, id: slot-undeclared}
      - {kind: machine, id: repository-tree-layout}
  - id: R02
    code: HFS_SLOT_REQUIRED_MISSING
    law: Every slot holds its required files, and the root README keeps its standard shape.
    failureCodes:
      - HFS_SLOT_REQUIRED_MISSING
      - HFS_MIN_INSTANCES
      - HFS_REQUIRED_FILE_MISSING
      - HFS_ROOT_ENTRY_MISSING
      - HFS_APPS_REQUIRED
      - HFS_APP_LAYOUT_INVALID
      - HFS_README_TITLE_INVALID
      - HFS_README_DESCRIPTION_INVALID
      - HFS_README_SECTION_MISSING
      - HFS_README_SECTION_ORDER
      - HFS_README_DEVELOPMENT_INCOMPLETE
      - HFS_README_WORK_POINTER_MISSING
      - HFS_README_PRIVATE_URL
      - HFS_README_BADGE_NOT_LIVE
    enforcers:
      - {kind: hfs, id: slot-required-missing}
      - {kind: machine, id: required-files}
      - {kind: machine, id: repository-tree-required}
  - id: R03
    code: HFS_UNTRACKED_ROOT_ENTRY
    law: No untracked or ignored entry exists outside an `ignored` slot.
    failureCodes:
      - HFS_UNTRACKED_ROOT_ENTRY
      - HFS_EMPTY_DIR
      - HFS_GHOST_TREE
    enforcers:
      - {kind: hfs, id: untracked-root-entry}
  - id: R04
    code: HFS_GITIGNORE_BLOCK_DRIFT
    law: The managed `.gitignore` block equals its render.
    failureCodes:
      - HFS_GITIGNORE_BLOCK_DRIFT
    enforcers:
      - {kind: hfs, id: gitignore-block-drift}
  - id: R05
    code: HFS_MANAGED_FILE_DRIFT
    law: A managed file equals its template render.
    failureCodes:
      - HFS_MANAGED_FILE_DRIFT
    enforcers:
      - {kind: hfs, id: managed-file-drift}
  - id: R06
    code: HFS_PLAINTEXT_SECRET
    law: Secrets exist only as sealed `.starcistacks/<env>/secrets/<slug>.enc` members.
    failureCodes:
      - HFS_PLAINTEXT_SECRET
    enforcers:
      - {kind: hfs, id: plaintext-secret}
      - {kind: hfs, id: plaintext-secret-staged}
  - id: R10
    code: HFS_STACKS_SHAPE
    law: "`.starcistacks` has the edition-aware standard shape: dependencies run in Docker in development and the app runs on hardened Swarm stacks in production, with recurring work app-owned."
    failureCodes:
      - HFS_STACKS_SHAPE
    enforcers:
      - {kind: hfs, id: stacks-shape}
      - {kind: hfs, id: stacks-runtime}
      - {kind: hfs, id: stacks-evidence-runtime}
      - {kind: hfs, id: starcistacks-runtime}
      - {kind: hfs, id: starcistacks-runtime-gate}
  - id: R11
    code: HFS_SONAR_CONFIG
    law: The Sonar configuration is generated, names no host URL and imports the back-end lcov over the slot-derived coverage scope only.
    failureCodes:
      - HFS_SONAR_CONFIG
    enforcers:
      - {kind: hfs, id: sonar-config}
  - id: R12
    code: HFS_E2E_IN_AUTOMATIC_GATE
    law: e2e never joins the pre-commit hook, coverage or automatic CI.
    failureCodes:
      - HFS_E2E_IN_AUTOMATIC_GATE
    enforcers:
      - {kind: machine, id: e2e-in-automatic-gate}
  - id: R13
    code: HFS_CI_MISSING_CANON
    law: CI runs the pinned app lint, and every checkout keeps the installed pre-commit hooks active, so no commit lands without the pre-commit gate.
    failureCodes:
      - HFS_CI_MISSING_CANON
      - HFS_HOOKS_PATH_REDIRECTED
      - HFS_HOOKS_NOT_INSTALLED
    enforcers:
      - {kind: machine, id: hooks-path-not-redirected}
      - {kind: hfs, id: ci-missing-canon}
  - id: R14
    code: HFS_DEP_VERSION_SKEW
    law: Each dependency has one version in the workspace, root overrides included, and npm is the only package manager.
    failureCodes:
      - HFS_DEP_VERSION_SKEW
      - HFS_PACKAGE_MANAGER_MIXED
    enforcers:
      - {kind: hfs, id: dep-version-skew}
      - {kind: machine, id: package-manager}
  - id: R15
    code: HFS_CANON_PIN_DRIFT
    law: Canon packages and frameworks match their pins (stack/pins.yaml).
    failureCodes:
      - HFS_CANON_PIN_DRIFT
    enforcers:
      - {kind: hfs, id: canon-pin-drift}
  - id: R16
    code: HFS_TOOL_CONFIG_LOCAL
    law: Tool configurations only call the canon factories and define no local rules.
    failureCodes:
      - HFS_TOOL_CONFIG_LOCAL
    enforcers:
      - {kind: hfs, id: tool-config-local}
      - {kind: hfs, id: tool-config-forbidden}
  - id: R17
    code: HFS_RULE_OFF_WITHOUT_REPLACEMENT
    law: The lint configurations are the rendered one-liners, so no rule is turned off, warned or redefined in a repository.
    failureCodes:
      - HFS_RULE_OFF_WITHOUT_REPLACEMENT
    enforcers:
      - {kind: hfs, id: rule-off-without-replacement}
  - id: R18
    code: HFS_INLINE_SUPPRESSION
    law: No inline suppression of any kind exists.
    failureCodes:
      - HFS_INLINE_SUPPRESSION
    enforcers:
      - {kind: eslint-be, id: no-inline-suppression}
      - {kind: eslint-fe, id: no-inline-lint-config}
      - {kind: stylelint, id: no-inline-lint-config}
  - id: R19
    code: HFS_FORMAT
    law: Prettier is the only formatter.
    failureCodes:
      - HFS_FORMAT
    enforcers:
      - {kind: hfs, id: format}
  - id: R20
    code: HFS_SIZE_GROWTH
    law: An over-budget file does not grow, and a new file stays within its budget (hfs/slots.yaml).
    failureCodes:
      - HFS_SIZE_GROWTH
      - HFS_SIZE_SOFT_BACKLOG
    enforcers:
      - {kind: eslint-be, id: file-size-growth}
      - {kind: eslint-fe, id: file-size-growth}
      - {kind: sonar, id: cognitive-complexity}
  - id: R21
    code: HFS_DUPLICATE_CODE
    law: No block of code is duplicated and no helper is defined twice.
    failureCodes:
      - HFS_DUPLICATE_CODE
      - HFS_DUPLICATE_SYMBOL
      - FE_CROSS_APP_DUPLICATE
    enforcers:
      - {kind: eslint-be, id: duplicate-code}
      - {kind: eslint-fe, id: duplicate-code}
      - {kind: eslint-be, id: duplicate-symbol}
      - {kind: eslint-fe, id: duplicate-symbol}
      - {kind: eslint-fe, id: cross-app-duplicate}
      - {kind: sonar, id: duplicated-lines-density}
  - id: R22
    code: HFS_TS_STRICT
    law: tsconfig extends the canon tsconfig and lowers no flag; product source holds no type assertion, non-null assertion or `any`.
    failureCodes:
      - HFS_TS_STRICT
      - FE_TYPE_ESCAPE
    enforcers:
      - {kind: eslint-fe, id: no-type-assertion}
      - {kind: eslint-fe, id: no-non-null-assertion}
      - {kind: eslint-fe, id: no-explicit-any}
      - {kind: hfs, id: ts-strict}
      - {kind: eslint-fe, id: no-double-cast}
  - id: R23
    code: HFS_CONTRACT_SNAPSHOT_DRIFT
    law: The back end commits its contract snapshot under `be/contracts/` equal to the emit, and the front end reads it in place.
    failureCodes:
      - HFS_CONTRACT_SNAPSHOT_DRIFT
    enforcers:
      - {kind: hfs, id: contract-snapshot-drift}
  - id: R24
    code: HFS_ARCH_CONFIG_UNREAD
    law: The architecture machine reads `hfs.json`, and analysing zero files is red.
    failureCodes:
      - HFS_ARCH_CONFIG_UNREAD
    enforcers:
      - {kind: machine, id: arch-config-unread}
  - id: R25
    code: HFS_UNUSED_EXPORT
    law: Every public export has a consumer and every source file is reachable.
    failureCodes:
      - HFS_UNUSED_EXPORT
      - HFS_UNUSED_FILE
    enforcers:
      - {kind: eslint-be, id: dead-exports}
      - {kind: eslint-fe, id: dead-exports}
  - id: R26
    code: BE_TIER_DIRECTION
    law: "Imports follow the tier direction matrix: no shared package imports an app, only page and layout owners import overlays, and no other cross-owner feature edge exists."
    failureCodes:
      - BE_TIER_DIRECTION
      - FE_TIER_DIRECTION
      - ARCH_PACKAGE_IMPORTS_APP
    enforcers:
      - {kind: eslint-be, id: tier-direction}
      - {kind: eslint-fe, id: tier-direction}
      - {kind: eslint-be, id: package-imports-app}
      - {kind: eslint-fe, id: package-imports-app}
  - id: R27
    code: ARCH_OWNER_CYCLE
    law: No owner import cycle exists, type-only imports included.
    failureCodes:
      - ARCH_OWNER_CYCLE
    enforcers:
      - {kind: eslint-be, id: owner-cycle}
      - {kind: eslint-fe, id: owner-cycle}
  - id: R28
    code: BE_FEATURE_IMPORTS_FEATURE
    law: A feature never imports another feature.
    failureCodes:
      - BE_FEATURE_IMPORTS_FEATURE
    enforcers:
      - {kind: eslint-be, id: feature-imports-feature}
  - id: R29
    code: BE_FEATURE_SHAPE
    law: A back-end feature is `index.ts`, its module, `application/` and `transport/<protocol>/`, and `application/` never imports transport or a protocol framework.
    failureCodes:
      - BE_FEATURE_SHAPE
      - BE_FEATURE_LAYOUT_INVALID
      - BE_APPLICATION_IMPORTS_TRANSPORT
      - BE_APPLICATION_TRANSPORT_FRAMEWORK
    enforcers:
      - {kind: machine, id: feature-shape}
      - {kind: eslint-be, id: feature-layout}
      - {kind: eslint-be, id: application-never-imports-transport}
  - id: R30
    code: BE_PUBLIC_SURFACE
    law: Every owner exposes one `index.ts` of named re-exports within its slot's export budget; cross-owner imports go through it, same-owner imports stay relative, and no alias re-export exists.
    failureCodes:
      - BE_PUBLIC_SURFACE
      - ARCH_OWNER_EXPORT_BYPASS
      - ARCH_OWNER_EXPORT_STAR
      - HFS_ALIAS_REEXPORT
      - ARCH_PACKAGE_EXPORT_BYPASS
    enforcers:
      - {kind: eslint-be, id: import-owner-entry}
      - {kind: eslint-be, id: no-folder-reexport}
      - {kind: eslint-be, id: owner-export-bypass}
      - {kind: eslint-fe, id: owner-export-bypass}
      - {kind: eslint-be, id: alias-reexport}
      - {kind: eslint-fe, id: alias-reexport}
      - {kind: eslint-be, id: no-relative-capability-escape}
      - {kind: eslint-be, id: no-self-module-alias}
      - {kind: eslint-be, id: package-export-bypass}
      - {kind: eslint-fe, id: package-export-bypass}
  - id: R31
    code: BE_FEATURE_NOT_COMPOSED
    law: Every feature, transport module and capability module is composed by an app.
    failureCodes:
      - BE_FEATURE_NOT_COMPOSED
    enforcers:
      - {kind: eslint-be, id: feature-not-composed}
  - id: R32
    code: BE_APP_COMPOSITION_ONLY
    law: An app only composes, and it is proven by the e2e test world, never by a unit spec.
    failureCodes:
      - BE_APP_COMPOSITION_ONLY
      - BE_APP_BUSINESS_ROLE
    enforcers:
      - {kind: eslint-be, id: app-composition-only}
  - id: R33
    code: BE_ENTRYPOINT_ONLY_IN_APPS
    law: Entrypoints exist only in `be/apps/*/src`.
    failureCodes:
      - BE_ENTRYPOINT_ONLY_IN_APPS
    enforcers:
      - {kind: eslint-be, id: entrypoint-only-in-apps}
  - id: R34
    code: BE_SCHEMA_AUTHORITY
    law: Migrations own the application schema and run only through the cli migrate command or the test world, and `synchronize` is false.
    failureCodes:
      - BE_SCHEMA_AUTHORITY
    enforcers:
      - {kind: eslint-be, id: no-runtime-schema}
  - id: R35
    code: BE_SCHEMA_OWNER
    law: Entities and migrations live in the owning capability's `persistence/` and register under exactly one declared connection, except platform capabilities the manifest lists as `perConnection`.
    failureCodes:
      - BE_SCHEMA_OWNER
    enforcers:
      - {kind: eslint-be, id: schema-owner}
  - id: R36
    code: BE_SQL_OUTSIDE_PERSISTENCE
    law: Raw SQL is `sql`-tagged `SqlText` in the owning capability's `persistence/<name>.sql.ts`, `.query()` takes only `SqlText`, and no QueryBuilder is used.
    failureCodes:
      - BE_SQL_OUTSIDE_PERSISTENCE
    enforcers:
      - {kind: eslint-be, id: sql-text-only}
      - {kind: eslint-be, id: no-query-builder}
  - id: R37
    code: BE_ENTITY_IN_CONTRACT
    law: No ORM entity appears in a contract or transport type.
    failureCodes:
      - BE_ENTITY_IN_CONTRACT
    enforcers:
      - {kind: eslint-be, id: no-entity-in-contract}
  - id: R38
    code: BE_ERROR_HOME
    law: Errors live in the owning capability's `errors/` and extend `DomainError`.
    failureCodes:
      - BE_ERROR_HOME
    enforcers:
      - {kind: eslint-be, id: error-home}
      - {kind: eslint-be, id: throw-domain-error}
      - {kind: eslint-be, id: error-family-shape}
      - {kind: eslint-be, id: error-code-unique}
  - id: R39
    code: BE_ERROR_MASKED
    law: Each app has one exception filter, and undeclared errors are masked.
    failureCodes:
      - BE_ERROR_MASKED
    enforcers:
      - {kind: eslint-be, id: error-masked}
  - id: R40
    code: BE_LOGGER_REQUIRED
    law: The `Logger` port of `platform/logging` is the only logger; every `catch` logs, rethrows or returns a reasoned outcome, and every log call names an event from an owner's log-events enum.
    failureCodes:
      - BE_LOGGER_REQUIRED
    enforcers:
      - {kind: eslint-be, id: catch-must-account}
      - {kind: eslint-be, id: no-error-wording-as-log-identity}
      - {kind: eslint-be, id: no-interpolated-log-message}
      - {kind: eslint-be, id: no-framework-logger}
  - id: R41
    code: BE_DEFAULT_DENY
    law: Access is denied by default through the app guard, every public door declares `@Public` with a `PublicReason`, `@UseGuards` is not used, bodies are typed and secrets compare in constant time.
    failureCodes:
      - BE_DEFAULT_DENY
    enforcers:
      - {kind: eslint-be, id: no-untyped-body}
      - {kind: eslint-be, id: public-needs-reason}
      - {kind: eslint-be, id: secret-compare-timing-safe}
      - {kind: eslint-be, id: no-auth-use-guards}
      - {kind: eslint-be, id: no-guard-injects-guard}
      - {kind: eslint-be, id: default-deny-app-guard}
  - id: R42
    code: BE_INPUT_BOUNDED
    law: "Input is bounded: cursor-only pagination, depth and rate limits, `class-validator` decorators on every input property, and the strict rate tier on auth-handshake and signed-webhook doors."
    failureCodes:
      - BE_INPUT_BOUNDED
    enforcers:
      - {kind: eslint-be, id: input-bounded}
      - {kind: eslint-be, id: no-offset-pagination}
      - {kind: eslint-be, id: auth-door-strict-rate-tier}
  - id: R43
    code: BE_CONFIG_OWNER
    law: Only the `EnvSource` of `platform/config`, an app's `main.ts` and `<app>.env.ts`, and the test world read `process.env`; everything else receives typed options.
    failureCodes:
      - BE_CONFIG_OWNER
    enforcers:
      - {kind: eslint-be, id: no-direct-env-read}
      - {kind: eslint-be, id: config-parsed-in-main}
  - id: R44
    code: BE_SECRET_DEFAULT
    law: No secret key or infrastructure URL has a default value.
    failureCodes:
      - BE_SECRET_DEFAULT
    enforcers:
      - {kind: eslint-be, id: no-secret-default}
  - id: R45
    code: BE_MODULE_SHAPE
    law: "Modules are never `@Global`, `isGlobal: true` appears only at app roots, no module imports across owners, each transport has one module with its own module definition, and every handler and provider registers exactly once."
    failureCodes:
      - BE_MODULE_SHAPE
      - BE_MODULE_HANDLER_REGISTRATION
      - BE_MODULE_PROVIDER_REREGISTRATION
    enforcers:
      - {kind: eslint-be, id: no-global-decorator}
      - {kind: eslint-be, id: is-global-only-in-app}
      - {kind: eslint-be, id: no-cross-owner-module-import}
      - {kind: eslint-be, id: capability-module-shape}
      - {kind: eslint-be, id: typed-module-definition}
      - {kind: eslint-be, id: static-module-register}
      - {kind: eslint-be, id: no-new-injectable}
      - {kind: eslint-be, id: no-module-let}
      - {kind: eslint-be, id: one-module-per-file}
      - {kind: eslint-be, id: register-once}
      - {kind: eslint-be, id: module-per-transport}
      - {kind: eslint-be, id: module-registration}
  - id: R46
    code: BE_BACKGROUND_UNOWNED
    law: Every sweep, outbox or retry has a job or consumer composed by an app, either its owning api app or a separately scaled worker app.
    failureCodes:
      - BE_BACKGROUND_UNOWNED
    enforcers:
      - {kind: eslint-be, id: background-unowned}
  - id: R47
    code: BE_TEST_TOPOLOGY
    law: The back end has one jest config with the unit, integration, e2e and contract projects, unit specs beside their subjects at full per-file coverage, and `be/src/tests/world/` as the only test infrastructure, running the real stack.
    failureCodes:
      - BE_TEST_TOPOLOGY
      - BE_CONTRACT_UNGUARDED
      - BE_UNIT_SPEC_NOT_STAGED
    enforcers:
      - {kind: hfs, id: test-topology}
      - {kind: hfs, id: staged-spec-presence}
      - {kind: machine, id: test-kind-unsupported}
      - {kind: eslint-be, id: test-world-files}
      - {kind: machine, id: contract-fixture-guard}
      - {kind: eslint-be, id: unit-test-colocated}
      - {kind: eslint-be, id: tests-infra-only-in-world}
      - {kind: eslint-be, id: tests-no-override}
      - {kind: eslint-be, id: test-world-shape}
  - id: R48
    code: BE_SPEC_QUALITY
    law: A spec asserts exact results or state without type escapes, ambient time or environment, builds unit subjects through a compiled testing module with the canon doubles, enters e2e through transport, and never skips, focuses or marks a test todo.
    failureCodes:
      - BE_SPEC_QUALITY
    enforcers:
      - {kind: eslint-be, id: spec-no-source-read}
      - {kind: eslint-be, id: e2e-uses-production-transport}
      - {kind: eslint-be, id: no-branch-in-flow-step}
      - {kind: eslint-be, id: no-sleep-in-flow}
      - {kind: eslint-be, id: no-wiring-in-flow-spec}
      - {kind: eslint-be, id: e2e-asserts-persisted-state}
      - {kind: eslint-be, id: no-api-shaped-e2e-filename}
      - {kind: eslint-be, id: no-call-only-spec}
      - {kind: eslint-be, id: no-marker-model-stub}
      - {kind: eslint-be, id: no-model-call-in-e2e}
      - {kind: eslint-be, id: spec-typed-entity-manager}
      - {kind: eslint-be, id: spec-builds-with-testing-module}
      - {kind: eslint-be, id: spec-no-new-subject}
      - {kind: eslint-be, id: spec-module-definition-only-providers}
      - {kind: eslint-be, id: spec-no-module-mock}
      - {kind: eslint-be, id: no-return-only-generic}
      - {kind: eslint-be, id: spec-infra-double-from-kit}
      - {kind: eslint-be, id: spec-exact-values}
      - {kind: eslint-be, id: spec-no-skip}
      - {kind: eslint-be, id: unit-spec-providers}
  - id: R49
    code: FE_ENV_OWNER
    law: Only `modules/config` reads the front-end environment, with no localhost fallback.
    failureCodes:
      - FE_ENV_OWNER
    enforcers:
      - {kind: eslint-fe, id: no-env-outside-config}
      - {kind: eslint-fe, id: no-hardcoded-endpoint-fallback}
  - id: R50
    code: FE_TRANSPORT_OWNER
    law: "A front end has one transport: the auth and no-auth Apollo clients with their link chain plus one axios instance for uploads and auth endpoints, read by components only through SWR hooks."
    failureCodes:
      - FE_TRANSPORT_OWNER
      - FE_EFFECT_FETCH
      - FE_SWR_KEY_IDENTITY
      - FE_SWR_MUTATION_RESOURCE_IDENTITY
    enforcers:
      - {kind: eslint-fe, id: fetch-only-in-api-client}
      - {kind: eslint-fe, id: client-fetch-has-signal}
      - {kind: eslint-fe, id: no-shared-transport-state}
      - {kind: eslint-fe, id: no-data-fetch-in-effect}
      - {kind: eslint-fe, id: transport-owner}
      - {kind: eslint-fe, id: api-client-attaches-the-locale}
      - {kind: eslint-fe, id: locale-header-belongs-to-the-link}
      - {kind: eslint-fe, id: swr-data-lifecycle}
  - id: R51
    code: FE_HTTP_STATUS_COLLAPSE
    law: A front end declares one `GraphQLResponse<T>` envelope, never collapses a failure into empty data, and turns an unauthenticated or forbidden answer into `refused` after one token refresh.
    failureCodes:
      - FE_HTTP_STATUS_COLLAPSE
      - FE_OUTCOME_KIND_UNHANDLED
    enforcers:
      - {kind: eslint-fe, id: client-maps-auth-to-refused}
      - {kind: eslint-fe, id: no-failure-collapse}
      - {kind: eslint-fe, id: outcome-kinds-exhaustive}
      - {kind: eslint-fe, id: one-outcome-union}
  - id: R52
    code: FE_WIRE_GENERATED
    law: Wire types are generated by graphql-codegen from the back-end contract snapshot read in place, and operation types re-export them rather than being typed by hand.
    failureCodes:
      - FE_WIRE_GENERATED
    enforcers:
      - {kind: eslint-fe, id: no-hand-typed-wire}
      - {kind: hfs, id: wire-generated}
  - id: R53
    code: FE_ERROR_BOUNDARY_MISSING
    law: Global, locale error, not-found and loading boundaries exist.
