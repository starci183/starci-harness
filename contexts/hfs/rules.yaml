# The HFS rule catalog: one entry per rule, its finding code, its law in one sentence, the failure codes it reports and
# the enforcers that judge it. The law states what must hold; the reason lives in the pattern that cites the rule
# (contexts/code/<side>/*.md), the value in its owner (hfs/slots.yaml ruleParams or budgets, stack/pins.yaml,
# the grammar package). An enforcer marked `status: planned` is owed: `starci contexts anatomy` lists the rules judged only
# by planned enforcers, and the status is removed the day the check ships.
schema: starci/hfs-rules@4
enforcerKinds:
  eslint-be: a rule of @starci/eslint-canon-be (id without the plugin prefix)
  eslint-fe: a universal rule of @starci/eslint-canon-fe
  grammar-lint: the Grammar package's own lint (packages/grammar/scripts/lint), run over the Grammar source
  eslint-grammar-core: a rule of the selected Grammar's lint package over the shared component API
  stylelint: a rule of @starci/stylelint-canon
  machine: a check of the architecture machine over the import graph
  hfs: a check of the app CLI over the tree, configuration, contracts or catalogs
  sonar: a condition of the Sonar quality gate
rules:
  - id: R01
    code: HFS_SLOT_UNDECLARED
    law: Every tracked path matches exactly one slot.
    failureCodes:
      - HFS_SLOT_UNDECLARED
      - HFS_SLOT_AMBIGUOUS
      - HFS_SLOT_NOT_ENABLED
      - HFS_FORBIDDEN_PRESENT
      - HFS_TRACKED_MUST_BE_IGNORED
      - HFS_ROOT_ENTRY_FORBIDDEN
      - HFS_ROOT_MARKDOWN_FORBIDDEN
      - HFS_ROOT_SRC_FORBIDDEN_FE
      - HFS_SRC_LAYOUT_INVALID
      - HFS_MODULE_TIER_INVALID
      - HFS_WORK_IN_FE
      - HFS_STACKS_IN_SIDE
    enforcers:
      - {kind: hfs, id: slot-undeclared}
      - {kind: eslint-be, id: slot-undeclared}
      - {kind: eslint-fe, id: slot-undeclared}
      - {kind: machine, id: repository-tree-layout}
  - id: R02
    code: HFS_SLOT_REQUIRED_MISSING
    law: Every slot holds its required files, and the root README keeps its standard shape.
    failureCodes:
      - HFS_SLOT_REQUIRED_MISSING
      - HFS_MIN_INSTANCES
      - HFS_REQUIRED_FILE_MISSING
      - HFS_ROOT_ENTRY_MISSING
      - HFS_APPS_REQUIRED
      - HFS_APP_LAYOUT_INVALID
      - HFS_README_TITLE_INVALID
      - HFS_README_DESCRIPTION_INVALID
      - HFS_README_SECTION_MISSING
      - HFS_README_SECTION_ORDER
      - HFS_README_DEVELOPMENT_INCOMPLETE
      - HFS_README_WORK_POINTER_MISSING
      - HFS_README_PRIVATE_URL
      - HFS_README_BADGE_NOT_LIVE
    enforcers:
      - {kind: hfs, id: slot-required-missing}
      - {kind: machine, id: required-files}
      - {kind: machine, id: repository-tree-required}
  - id: R03
    code: HFS_UNTRACKED_ROOT_ENTRY
    law: No untracked or ignored entry exists outside an `ignored` slot.
    failureCodes:
      - HFS_UNTRACKED_ROOT_ENTRY
      - HFS_EMPTY_DIR
      - HFS_GHOST_TREE
    enforcers:
      - {kind: hfs, id: untracked-root-entry}
  - id: R04
    code: HFS_GITIGNORE_BLOCK_DRIFT
    law: The managed `.gitignore` block equals its render.
    failureCodes:
      - HFS_GITIGNORE_BLOCK_DRIFT
    enforcers:
      - {kind: hfs, id: gitignore-block-drift}
  - id: R05
    code: HFS_MANAGED_FILE_DRIFT
    law: A managed file equals its template render.
    failureCodes:
      - HFS_MANAGED_FILE_DRIFT
    enforcers:
      - {kind: hfs, id: managed-file-drift}
  - id: R06
    code: HFS_PLAINTEXT_SECRET
    law: Secrets exist only as sealed `.starcistacks/<env>/secrets/<slug>.enc` members, and the committed check cache holds codes, paths, positions and digests, never a message that could carry one.
    failureCodes:
      - HFS_PLAINTEXT_SECRET
    enforcers:
      - {kind: hfs, id: plaintext-secret}
      - {kind: hfs, id: plaintext-secret-staged}
  - id: R10
    code: HFS_STACKS_SHAPE
    law: "`.starcistacks` has the edition-aware standard shape: dependencies run in Docker in development and the app runs on hardened Swarm stacks in production, with recurring work app-owned."
    failureCodes:
      - HFS_STACKS_SHAPE
    enforcers:
      - {kind: hfs, id: stacks-shape}
      - {kind: hfs, id: stacks-runtime}
      - {kind: hfs, id: stacks-evidence-runtime}
      - {kind: hfs, id: starcistacks-runtime}
      - {kind: hfs, id: starcistacks-runtime-gate}
  - id: R11
    code: HFS_SONAR_CONFIG
    law: The Sonar configuration is generated, names no host URL and imports the back-end lcov over the slot-derived coverage scope only.
    failureCodes:
      - HFS_SONAR_CONFIG
    enforcers:
      - {kind: hfs, id: sonar-config}
  - id: R12
    code: HFS_E2E_IN_AUTOMATIC_GATE
    law: The integration, e2e and contract specs (the world layers) run only when a person asks for them, on a local machine (`npm run test:e2e`); no hook, coverage run, CI workflow, release gate row or lane runs them by default, whatever its trigger, and they are no part of CI.
    failureCodes:
      - HFS_E2E_IN_AUTOMATIC_GATE
    enforcers:
      - {kind: machine, id: e2e-in-automatic-gate}
  - id: R13
    code: HFS_CI_MISSING_CANON
    law: CI runs the pinned `starci app check --gate lint` (unless the app's stack declaration switches lint off, PROJECT-LINT-4, whose render has no lint step), and every checkout keeps the installed pre-commit hooks active, so no commit lands without the pre-commit gate.
    failureCodes:
      - HFS_CI_MISSING_CANON
      - HFS_HOOKS_PATH_REDIRECTED
      - HFS_HOOKS_NOT_INSTALLED
    enforcers:
      - {kind: machine, id: hooks-path-not-redirected}
      - {kind: hfs, id: ci-missing-canon}
  - id: R14
    code: HFS_DEP_VERSION_SKEW
    law: Each dependency has one version in the workspace, root overrides included, and npm is the only package manager.
    failureCodes:
      - HFS_DEP_VERSION_SKEW
      - HFS_PACKAGE_MANAGER_MIXED
    enforcers:
      - {kind: hfs, id: dep-version-skew}
      - {kind: machine, id: package-manager}
  - id: R15
    code: HFS_CANON_PIN_DRIFT
    law: "Canon packages and frameworks match their pins (stack/pins.yaml): exactly, or, for the Grammar family and the two canons, an exact version inside their same-minor `range` (@starci/hfs stays exact); a pre-release meets a range only when the range names one."
    failureCodes:
      - HFS_CANON_PIN_DRIFT
    enforcers:
      - {kind: hfs, id: canon-pin-drift}
  - id: R16
    code: HFS_TOOL_CONFIG_LOCAL
    law: "Tool configurations only call the canon factories and define no local rules; a project's own lint rules come only through its `ext/lint/` folder, declared in `ext/manifest.json`, which the canon factories load (R381, PROJECT-LINT-3)."
    failureCodes:
      - HFS_TOOL_CONFIG_LOCAL
    enforcers:
      - {kind: hfs, id: tool-config-local}
      - {kind: hfs, id: tool-config-forbidden}
  - id: R17
    code: HFS_RULE_OFF_WITHOUT_REPLACEMENT
    law: The lint configurations are the rendered one-liners, so no rule is turned off, warned or redefined in a repository; the one declared exception is the canon's own counting cohort (`COUNTING` of eslint-canon-fe), a rule that ships at warn for one release while a codemod moves apps onto its API, and its entry ends when the count is 0.
    failureCodes:
      - HFS_RULE_OFF_WITHOUT_REPLACEMENT
    enforcers:
      - {kind: hfs, id: rule-off-without-replacement}
  - id: R18
    code: HFS_INLINE_SUPPRESSION
    law: No inline suppression of any kind exists.
    failureCodes:
      - HFS_INLINE_SUPPRESSION
    enforcers:
      - {kind: eslint-be, id: no-inline-suppression}
      - {kind: eslint-fe, id: no-inline-lint-config}
      - {kind: stylelint, id: no-inline-lint-config}
  - id: R19
    code: HFS_FORMAT
    law: Prettier is the only formatter.
    failureCodes:
      - HFS_FORMAT
    enforcers:
      - {kind: hfs, id: format}
  - id: R20
    code: HFS_SIZE_GROWTH
    law: An over-budget file does not grow, and a new file stays within its budget (hfs/slots.yaml).
    failureCodes:
      - HFS_SIZE_GROWTH
      - HFS_SIZE_SOFT_BACKLOG
    enforcers:
      - {kind: eslint-be, id: file-size-growth}
      - {kind: eslint-fe, id: file-size-growth}
      - {kind: sonar, id: cognitive-complexity}
  - id: R21
    code: HFS_DUPLICATE_CODE
    law: No block of code is duplicated and no helper is defined twice.
    failureCodes:
      - HFS_DUPLICATE_CODE
      - HFS_DUPLICATE_SYMBOL
      - FE_CROSS_APP_DUPLICATE
    enforcers:
      - {kind: eslint-be, id: duplicate-code}
      - {kind: eslint-fe, id: duplicate-code}
      - {kind: eslint-be, id: duplicate-symbol}
      - {kind: eslint-fe, id: duplicate-symbol}
      - {kind: eslint-fe, id: cross-app-duplicate}
      - {kind: sonar, id: duplicated-lines-density}
  - id: R22
    code: HFS_TS_STRICT
    law: tsconfig extends the canon tsconfig and lowers no flag; product source holds no type assertion, non-null assertion or `any`.
    failureCodes:
      - HFS_TS_STRICT
      - FE_TYPE_ESCAPE
    enforcers:
      - {kind: eslint-fe, id: no-type-assertion}
      - {kind: eslint-fe, id: no-non-null-assertion}
      - {kind: eslint-fe, id: no-explicit-any}
      - {kind: hfs, id: ts-strict}
      - {kind: eslint-fe, id: no-double-cast}
  - id: R23
    code: HFS_CONTRACT_SNAPSHOT_DRIFT
    law: The back end commits its contract snapshot under `be/contracts/` equal to the emit, and the front end reads it in place.
    failureCodes:
      - HFS_CONTRACT_SNAPSHOT_DRIFT
    enforcers:
      - {kind: hfs, id: contract-snapshot-drift}
  - id: R24
    code: HFS_ARCH_CONFIG_UNREAD
    law: The architecture machine reads `hfs.json`, and analysing zero files is red.
    failureCodes:
      - HFS_ARCH_CONFIG_UNREAD
    enforcers:
      - {kind: machine, id: arch-config-unread}
  - id: R25
    code: HFS_UNUSED_EXPORT
    law: Every public export has a consumer and every source file is reachable.
    failureCodes:
      - HFS_UNUSED_EXPORT
      - HFS_UNUSED_FILE
    enforcers:
      - {kind: eslint-be, id: dead-exports}
      - {kind: eslint-fe, id: dead-exports}
  - id: R26
    code: BE_TIER_DIRECTION
    law: "Imports follow the tier direction matrix: no shared package imports an app, only page and layout owners import overlays, no other cross-owner feature edge exists, and the one platform-to-domain edge is the lite entity registry (be.platform.database.entities) importing a capability's `<c>Entities` alone from its `index.ts`. A component library's tiers (`tiers.grammar`: leaf, branch, composite, frame) import nothing above themselves, and its `data-tier` stamp is its folder."
    failureCodes:
      - BE_TIER_DIRECTION
      - FE_TIER_DIRECTION
      - FE_GRAMMAR_TIER_DIRECTION
      - FE_GRAMMAR_TIER_STAMP
      - ARCH_PACKAGE_IMPORTS_APP
    enforcers:
      - {kind: eslint-be, id: tier-direction}
      - {kind: eslint-fe, id: tier-direction}
      - {kind: eslint-be, id: package-imports-app}
      - {kind: eslint-fe, id: package-imports-app}
  - id: R27
    code: ARCH_OWNER_CYCLE
    law: No owner import cycle exists, type-only imports included.
    failureCodes:
      - ARCH_OWNER_CYCLE
    enforcers:
      - {kind: eslint-be, id: owner-cycle}
      - {kind: eslint-fe, id: owner-cycle}
  - id: R28
    code: BE_FEATURE_IMPORTS_FEATURE
    law: A feature never imports another feature.
    failureCodes:
      - BE_FEATURE_IMPORTS_FEATURE
    enforcers:
      - {kind: eslint-be, id: feature-imports-feature}
  - id: R29
    code: BE_FEATURE_SHAPE
    law: A back-end feature is `index.ts`, its module, `application/` and `transport/<protocol>/`, and `application/` never imports transport or a protocol framework.
    failureCodes:
      - BE_FEATURE_SHAPE
      - BE_FEATURE_LAYOUT_INVALID
      - BE_APPLICATION_IMPORTS_TRANSPORT
      - BE_APPLICATION_TRANSPORT_FRAMEWORK
    enforcers:
      - {kind: machine, id: feature-shape}
      - {kind: eslint-be, id: feature-layout}
      - {kind: eslint-be, id: application-never-imports-transport}
  - id: R30
    code: BE_PUBLIC_SURFACE
    law: Every owner exposes one `index.ts` of named re-exports within its slot's export budget; cross-owner imports go through it, except the lite entity registry, reached by deep path only from the files its slot's `importedBy` names; same-owner imports stay relative, and no alias re-export exists.
    failureCodes:
      - BE_PUBLIC_SURFACE
      - ARCH_OWNER_EXPORT_BYPASS
      - ARCH_OWNER_EXPORT_STAR
      - HFS_ALIAS_REEXPORT
      - ARCH_PACKAGE_EXPORT_BYPASS
    enforcers:
      - {kind: eslint-be, id: import-owner-entry}
      - {kind: eslint-be, id: no-folder-reexport}
      - {kind: eslint-be, id: owner-export-bypass}
      - {kind: eslint-fe, id: owner-export-bypass}
      - {kind: eslint-be, id: alias-reexport}
      - {kind: eslint-fe, id: alias-reexport}
      - {kind: eslint-be, id: no-relative-capability-escape}
      - {kind: eslint-be, id: no-self-module-alias}
      - {kind: eslint-be, id: package-export-bypass}
      - {kind: eslint-fe, id: package-export-bypass}
  - id: R31
    code: BE_FEATURE_NOT_COMPOSED
    law: Every feature, transport module and capability module is composed by an app.
    failureCodes:
      - BE_FEATURE_NOT_COMPOSED
    enforcers:
      - {kind: eslint-be, id: feature-not-composed}
  - id: R32
    code: BE_APP_COMPOSITION_ONLY
    law: An app only composes, and it is proven by the e2e test world, never by a unit spec.
    failureCodes:
      - BE_APP_COMPOSITION_ONLY
      - BE_APP_BUSINESS_ROLE
    enforcers:
      - {kind: eslint-be, id: app-composition-only}
  - id: R33
    code: BE_ENTRYPOINT_ONLY_IN_APPS
    law: Entrypoints exist only in `be/apps/*/src`.
    failureCodes:
      - BE_ENTRYPOINT_ONLY_IN_APPS
    enforcers:
      - {kind: eslint-be, id: entrypoint-only-in-apps}
  - id: R34
    code: BE_SCHEMA_AUTHORITY
    law: "Migrations own the application schema and run only through the cli migrate command or the test world, and `synchronize` is false. One declared exception: a root-package file hfs.json `sides.be.ddlRenderers` lists (the renderer `cli entities plan --write` uses to write NEW migration files) may hold DDL text only to build and return it; it never imports a database client or calls `.query/.execute`, and no file outside the cli and the root packages imports a symbol it declares."
    failureCodes:
      - BE_SCHEMA_AUTHORITY
    enforcers:
      - {kind: eslint-be, id: no-runtime-schema}
  - id: R35
    code: BE_SCHEMA_OWNER
    law: Entities and migrations live in the owning capability's `persistence/` and register under exactly one declared connection, except platform capabilities the manifest lists as `perConnection`; in lite a capability's `persistence/entities/index.ts` declares its `<c>Entities` and `platform/database/entities.ts` names it in `PRIMARY_ENTITIES`. The engine-owned objects of hfs.json sides.be.engineOwned (the base tables, the partitions of one of them and its views, built by generated migrations) need no entity per table and are mapped by the declared capability alone.
    failureCodes:
      - BE_SCHEMA_OWNER
    enforcers:
      - {kind: eslint-be, id: schema-owner}
  - id: R37
    code: BE_ENTITY_IN_CONTRACT
    law: No ORM entity appears in a contract or transport type.
    failureCodes:
      - BE_ENTITY_IN_CONTRACT
    enforcers:
      - {kind: eslint-be, id: no-entity-in-contract}
  - id: R38
    code: BE_ERROR_HOME
    law: Errors live in the owning capability's `errors/` and extend `DomainError`.
    failureCodes:
      - BE_ERROR_HOME
    enforcers:
      - {kind: eslint-be, id: error-home}
      - {kind: eslint-be, id: throw-domain-error}
      - {kind: eslint-be, id: error-family-shape}
      - {kind: eslint-be, id: error-code-unique}
  - id: R39
    code: BE_ERROR_MASKED
    law: Each app has one exception filter, and undeclared errors are masked.
    failureCodes:
      - BE_ERROR_MASKED
    enforcers:
      - {kind: eslint-be, id: error-masked}
  - id: R40
    code: BE_LOGGER_REQUIRED
    law: The `Logger` port of `platform/logging` is the only logger; every `catch` logs, rethrows or returns a reasoned outcome, and every log call names an event from an owner's log-events enum.
    failureCodes:
      - BE_LOGGER_REQUIRED
    enforcers:
      - {kind: eslint-be, id: catch-must-account}
      - {kind: eslint-be, id: no-error-wording-as-log-identity}
      - {kind: eslint-be, id: no-interpolated-log-message}
      - {kind: eslint-be, id: no-framework-logger}
  - id: R41
    code: BE_DEFAULT_DENY
    law: Access is denied by default through the app guard, every public door declares `@Public` with a `PublicReason`, `@UseGuards` is not used, bodies are typed and secrets compare in constant time.
    failureCodes:
      - BE_DEFAULT_DENY
    enforcers:
      - {kind: eslint-be, id: no-untyped-body}
      - {kind: eslint-be, id: public-needs-reason}
      - {kind: eslint-be, id: secret-compare-timing-safe}
      - {kind: eslint-be, id: no-auth-use-guards}
      - {kind: eslint-be, id: no-guard-injects-guard}
      - {kind: eslint-be, id: default-deny-app-guard}
  - id: R42
    code: BE_INPUT_BOUNDED
    law: "Input is bounded: cursor-only pagination, depth and rate limits, `class-validator` decorators on every input property, and the strict rate tier on auth-handshake and signed-webhook doors."
    failureCodes:
      - BE_INPUT_BOUNDED
    enforcers:
      - {kind: eslint-be, id: input-bounded}
      - {kind: eslint-be, id: no-offset-pagination}
      - {kind: eslint-be, id: auth-door-strict-rate-tier}
  - id: R43
    code: BE_CONFIG_OWNER
    law: Only the `EnvSource` of `platform/config`, an app's `main.ts` and `<app>.env.ts`, and the test world read `process.env`; everything else receives typed options.
    failureCodes:
      - BE_CONFIG_OWNER
    enforcers:
      - {kind: eslint-be, id: no-direct-env-read}
      - {kind: eslint-be, id: config-parsed-in-main}
  - id: R44
    code: BE_SECRET_DEFAULT
    law: No secret key or infrastructure URL has a default value.
    failureCodes:
      - BE_SECRET_DEFAULT
    enforcers:
      - {kind: eslint-be, id: no-secret-default}
  - id: R45
    code: BE_MODULE_SHAPE
    law: "Modules are never `@Global`, `isGlobal: true` appears only at app roots, no module imports across owners, each transport has one module with its own module definition, and every handler and provider registers exactly once."
    failureCodes:
      - BE_MODULE_SHAPE
      - BE_MODULE_HANDLER_REGISTRATION
      - BE_MODULE_PROVIDER_REREGISTRATION
    enforcers:
      - {kind: eslint-be, id: no-global-decorator}
      - {kind: eslint-be, id: is-global-only-in-app}
      - {kind: eslint-be, id: no-cross-owner-module-import}
      - {kind: eslint-be, id: capability-module-shape}
      - {kind: eslint-be, id: typed-module-definition}
      - {kind: eslint-be, id: static-module-register}
      - {kind: eslint-be, id: no-new-injectable}
      - {kind: eslint-be, id: no-module-let}
      - {kind: eslint-be, id: one-module-per-file}
      - {kind: eslint-be, id: register-once}
      - {kind: eslint-be, id: module-per-transport}
      - {kind: eslint-be, id: module-registration}
  - id: R46
    code: BE_BACKGROUND_UNOWNED
    law: Every sweep, outbox or retry has a job or consumer composed by an app, either its owning api app or a separately scaled worker app.
    failureCodes:
      - BE_BACKGROUND_UNOWNED
    enforcers:
      - {kind: eslint-be, id: background-unowned}
  - id: R47
    code: BE_TEST_TOPOLOGY
    law: The back end has one jest config with the unit, integration, e2e and contract projects, unit specs beside their subjects (a logic-role file, or a logic file its slot declares) at full per-file coverage, and `be/src/tests/world/` as the only test infrastructure, running the real stack.
    failureCodes:
      - BE_TEST_TOPOLOGY
      - BE_CONTRACT_UNGUARDED
      - BE_UNIT_SPEC_NOT_STAGED
    enforcers:
      - {kind: hfs, id: test-topology}
      - {kind: hfs, id: staged-spec-presence}
      - {kind: machine, id: test-kind-unsupported}
      - {kind: eslint-be, id: test-world-files}
      - {kind: machine, id: contract-fixture-guard}
      - {kind: eslint-be, id: unit-test-colocated}
      - {kind: eslint-be, id: tests-infra-only-in-world}
      - {kind: eslint-be, id: tests-no-override}
      - {kind: eslint-be, id: test-world-shape}
  - id: R48
    code: BE_SPEC_QUALITY
    law: A spec asserts exact results or state without type escapes, ambient time or environment, builds unit subjects through a compiled testing module with the canon doubles, enters e2e through transport, and never skips, focuses or marks a test todo.
    failureCodes:
      - BE_SPEC_QUALITY
    enforcers:
      - {kind: eslint-be, id: spec-no-source-read}
      - {kind: eslint-be, id: e2e-uses-production-transport}
      - {kind: eslint-be, id: no-branch-in-flow-step}
      - {kind: eslint-be, id: no-sleep-in-flow}
      - {kind: eslint-be, id: no-wiring-in-flow-spec}
      - {kind: eslint-be, id: e2e-asserts-persisted-state}
      - {kind: eslint-be, id: no-api-shaped-e2e-filename}
      - {kind: eslint-be, id: no-call-only-spec}
      - {kind: eslint-be, id: no-marker-model-stub}
      - {kind: eslint-be, id: no-model-call-in-e2e}
      - {kind: eslint-be, id: spec-typed-entity-manager}
      - {kind: eslint-be, id: spec-builds-with-testing-module}
      - {kind: eslint-be, id: spec-no-new-subject}
      - {kind: eslint-be, id: spec-module-definition-only-providers}
      - {kind: eslint-be, id: spec-no-module-mock}
      - {kind: eslint-be, id: no-return-only-generic}
      - {kind: eslint-be, id: spec-infra-double-from-kit}
      - {kind: eslint-be, id: spec-exact-values}
      - {kind: eslint-be, id: spec-no-skip}
      - {kind: eslint-be, id: unit-spec-providers}
  - id: R49
    code: FE_ENV_OWNER
    law: Only `modules/config` reads the front-end environment, with no localhost fallback.
    failureCodes:
      - FE_ENV_OWNER
    enforcers:
      - {kind: eslint-fe, id: no-env-outside-config}
      - {kind: eslint-fe, id: no-hardcoded-endpoint-fallback}
  - id: R50
    code: FE_TRANSPORT_OWNER
    law: "A front end has one transport: the auth and no-auth Apollo clients with their link chain plus one axios instance for uploads and auth endpoints, read by components only through SWR hooks."
    failureCodes:
      - FE_TRANSPORT_OWNER
      - FE_EFFECT_FETCH
      - FE_SWR_KEY_IDENTITY
      - FE_SWR_MUTATION_RESOURCE_IDENTITY
    enforcers:
      - {kind: eslint-fe, id: fetch-only-in-api-client}
      - {kind: eslint-fe, id: client-fetch-has-signal}
      - {kind: eslint-fe, id: no-shared-transport-state}
      - {kind: eslint-fe, id: no-data-fetch-in-effect}
      - {kind: eslint-fe, id: transport-owner}
      - {kind: eslint-fe, id: api-client-attaches-the-locale}
      - {kind: eslint-fe, id: locale-header-belongs-to-the-link}
      - {kind: eslint-fe, id: swr-data-lifecycle}
  - id: R51
    code: FE_HTTP_STATUS_COLLAPSE
    law: A front end declares one `GraphQLResponse<T>` envelope, never collapses a failure into empty data, and turns an unauthenticated or forbidden answer into `refused` after one token refresh.
    failureCodes:
      - FE_HTTP_STATUS_COLLAPSE
      - FE_OUTCOME_KIND_UNHANDLED
    enforcers:
      - {kind: eslint-fe, id: client-maps-auth-to-refused}
      - {kind: eslint-fe, id: no-failure-collapse}
      - {kind: eslint-fe, id: outcome-kinds-exhaustive}
      - {kind: eslint-fe, id: one-outcome-union}
  - id: R52
    code: FE_WIRE_GENERATED
    law: Wire types are generated by graphql-codegen from the back-end contract snapshot read in place, and operation types re-export them rather than being typed by hand.
    failureCodes:
      - FE_WIRE_GENERATED
    enforcers:
      - {kind: eslint-fe, id: no-hand-typed-wire}
      - {kind: hfs, id: wire-generated}
  - id: R53
    code: FE_ERROR_BOUNDARY_MISSING
    law: Global, locale error, not-found and loading boundaries exist.
    failureCodes:
      - FE_ERROR_BOUNDARY_MISSING
      - FE_SUSPENSE_NULL_FALLBACK
    enforcers:
      - {kind: eslint-fe, id: no-null-suspense-fallback}
      - {kind: machine, id: error-boundary-missing}
  - id: R54
    code: FE_ROUTE_FILES_THIN
    law: Route files mount one owner and follow the Next file conventions.
    failureCodes:
      - FE_ROUTE_FILES_THIN
      - FE_NEXT_CONVENTIONS
      - FE_PAGE_METADATA_MISSING
      - FE_ROUTE_ONE_PAGE
      - FE_ROUTE_DRAWING_DECISION
      - FE_ROUTE_CLIENT_BOUNDARY
      - FE_ROUTE_CLIENT_HOOK
      - FE_ROUTE_DEFAULT_EXPORT
    enforcers:
      - {kind: eslint-fe, id: no-middleware-file}
      - {kind: eslint-fe, id: page-exports-metadata}
      - {kind: eslint-fe, id: route-files-thin}
      - {kind: eslint-fe, id: route-adapter}
  - id: R55
    code: FE_CLIENT_BOUNDARY
    law: Components render on the server first, and `"use client"` appears only where a slot allows it.
    failureCodes:
      - FE_CLIENT_BOUNDARY
      - FE_CLIENT_SERVER_IMPORT
      - FE_CLIENT_REACHES_SERVER
      - FE_SERVER_ONLY_MARK
      - FE_STORAGE_OUTSIDE_MODULES
      - FE_DANGEROUS_HTML
    enforcers:
      - {kind: eslint-fe, id: use-client-only-at-boundary}
      - {kind: eslint-fe, id: client-no-server-import}
      - {kind: eslint-fe, id: server-module-marks-server-only}
      - {kind: eslint-fe, id: web-storage-only-in-modules}
      - {kind: eslint-fe, id: no-dangerous-html}
      - {kind: eslint-fe, id: client-reaches-server}
  - id: R56
    code: FE_HOOKS_ARE_HOOKS
    law: "`hooks/` holds hooks only, in its declared sub-folders, and a product hook is defined only there and imported through its index."
    failureCodes:
      - FE_HOOKS_ARE_HOOKS
      - FE_CUSTOM_HOOK_LOCATION
      - FE_BLOCK_PRODUCT_HOOK_DEFINITION
      - FE_COMPONENT_DEEP_HOOK_IMPORT
    enforcers:
      - {kind: eslint-fe, id: hooks-folder-holds-hooks-only}
      - {kind: eslint-fe, id: hooks-are-hooks}
      - {kind: eslint-fe, id: hook-location}
  - id: R57
    code: FE_OWNER_REACHABLE
    law: Every owner is mounted and every href resolves to a route.
    failureCodes:
      - FE_OWNER_REACHABLE
      - FE_ROUTE_HARDCODED
      - FE_HREF_RESOLVES
    enforcers:
      - {kind: eslint-fe, id: no-hardcoded-route}
      - {kind: eslint-fe, id: owner-reachable}
  - id: R58
    code: FE_I18N_LITERAL
    law: No display text is written in source at any tier, and no escape comment exempts one.
    failureCodes:
      - FE_I18N_LITERAL
    enforcers:
      - {kind: eslint-fe, id: no-hardcoded-copy}
      - {kind: eslint-fe, id: html-lang-from-locale}
      - {kind: eslint-fe, id: no-copy-resolution-below-block}
  - id: R59
    code: FE_I18N_PLACEMENT
    law: Front-end i18n uses `next-intl` with a `[locale]` segment; its stack (routing, proxy, navigation, request config, the layout's locale read) is built by `@starci/next-i18n` over the app's `defineI18n` description, kept in `modules/i18n` or in the shared i18n package, and no product source builds a layer of it; the proxy never evaluates navigation runtime.
    failureCodes:
      - FE_I18N_PLACEMENT
      - FE_I18N_NAVIGATION
      - FE_I18N_FORMATTER
    enforcers:
      - {kind: eslint-fe, id: locale-segment-is-locale}
      - {kind: eslint-fe, id: no-second-i18n-stack}
      - {kind: eslint-fe, id: i18n-stack-in-one-module}
      - {kind: eslint-fe, id: navigation-from-intl}
      - {kind: eslint-fe, id: no-native-anchor}
      - {kind: eslint-fe, id: use-intl-formatter}
      - {kind: hfs, id: i18n-placement}
  - id: R60
    code: FE_I18N_CATALOG
    law: Every locale the app's `defineI18n` declares has its catalog and every catalog is a declared locale, every catalog has the same keys, and client components receive only the keys they `pick`.
    failureCodes:
      - FE_I18N_CATALOG
      - FE_I18N_LOCALE_MISSING
    enforcers:
      - {kind: hfs, id: i18n-catalog}
      - {kind: hfs, id: i18n-locale-catalog}
  - id: R61
    code: FE_STYLE_TOKEN_ONLY
    law: Application CSS uses the selected Grammar tokens and the declared brand owner, which sets HeroUI's tokens, and every declaration resolves.
    failureCodes:
      - FE_STYLE_TOKEN_ONLY
      - FE_STYLE_SOURCE_UNRESOLVED
    enforcers:
      - {kind: stylelint, id: token-only}
      - {kind: stylelint, id: raw-brand-value}
      - {kind: stylelint, id: no-apply-raw}
      - {kind: stylelint, id: no-important}
      - {kind: stylelint, id: no-self-reference}
      - {kind: stylelint, id: globals-shape}
      - {kind: stylelint, id: globals-import-order}
      - {kind: stylelint, id: no-token-redefinition}
      - {kind: stylelint, id: no-grammar-private-token}
      - {kind: stylelint, id: theme-layer-shape}
      - {kind: stylelint, id: no-css-module}
      - {kind: stylelint, id: no-class-selector}
      - {kind: stylelint, id: breakpoint-scale}
      - {kind: stylelint, id: source-resolves}
      - {kind: eslint-fe, id: no-raw-brand-value}
      - {kind: eslint-grammar-core, id: no-fractional-step}
      - {kind: eslint-fe, id: no-arbitrary-value}
      - {kind: eslint-grammar-core, id: no-unresolved-token-class}
      - {kind: eslint-grammar-core, id: status-text-uses-soft-foreground}
  - id: R62
    code: FE_NATIVE_FORM_CONTROL
    law: Product tiers compose the selected Grammar renderers for form controls, images and structural elements and never reproduce them with raw HTML.
    failureCodes:
      - FE_NATIVE_FORM_CONTROL
      - FE_NATIVE_IMAGE
    enforcers:
      - {kind: eslint-fe, id: no-native-form-control}
      - {kind: eslint-fe, id: no-native-img}
      - {kind: eslint-grammar-core, id: no-raw-structural-element}
      - {kind: eslint-fe, id: image-has-size}
  - id: R63
    code: FE_PACKAGE_SHAPE
    law: Front-end packages build to `dist` with explicit exports and no dead unit.
    failureCodes:
      - FE_PACKAGE_SHAPE
    enforcers:
      - {kind: machine, id: package-shape}
  - id: R64
    code: FE_APP_ISOLATION
    law: Apps never import other apps, and every screen declares its `app`.
    failureCodes:
      - FE_APP_ISOLATION
    enforcers:
      - {kind: eslint-fe, id: app-isolation}
  - id: R65
    code: FE_SIZE_AND_STATE_BUDGET
    law: Front-end code stays within the hook and state budgets, takes live time from the Grammar's shared clock, writes no poll loop, keys its lists, releases every effect in cleanup and swallows no error.
    failureCodes:
      - FE_SIZE_AND_STATE_BUDGET
      - FE_LIST_KEY
      - FE_EFFECT_CLEANUP
      - FE_SWALLOWED_ERROR
      - FE_CONSOLE_CALL
    enforcers:
      - {kind: eslint-fe, id: component-line-budget}
      - {kind: eslint-fe, id: unit-hook-budget}
      - {kind: eslint-fe, id: no-hand-rolled-polling}
      - {kind: eslint-fe, id: no-app-relative-clock}
      - {kind: eslint-fe, id: list-item-has-key}
      - {kind: eslint-fe, id: no-index-key}
      - {kind: eslint-fe, id: no-inline-literal-prop-in-list}
      - {kind: eslint-fe, id: effect-subscription-needs-cleanup}
      - {kind: eslint-fe, id: no-empty-catch}
      - {kind: eslint-fe, id: no-console}
  - id: R68
    code: BE_SQL_INTERPOLATED
    law: "SQL text carries no runtime substitution; values are numbered parameters. The one exception is R334's call and LISTEN statements in `platform/database/database.client.ts`, which splice only the name parts and parameter list its own validator checked."
    failureCodes:
      - BE_SQL_INTERPOLATED
    enforcers:
      - {kind: eslint-be, id: no-interpolated-sql}
  - id: R69
    code: BE_QUERY_UNBOUNDED
    law: A read that can return many rows is bounded by `take`, `limit`, `LIMIT` or a cursor.
    failureCodes:
      - BE_QUERY_UNBOUNDED
    enforcers:
      - {kind: eslint-be, id: query-needs-limit}
  - id: R70
    code: BE_HTTP_TIMEOUT
    law: Every outbound `fetch`, axios or HttpService call states a timeout or an abort signal.
    failureCodes:
      - BE_HTTP_TIMEOUT
    enforcers:
      - {kind: eslint-be, id: http-needs-timeout}
  - id: R71
    code: BE_LOG_SECRET
    law: No log call or constructed error carries a `Secret`, `Pii` or credential-named value; it logs an id or a masked form.
    failureCodes:
      - BE_LOG_SECRET
    enforcers:
      - {kind: eslint-be, id: no-secret-in-log}
      - {kind: eslint-be, id: no-secret-in-error}
  - id: R72
    code: BE_TYPE_ESCAPE
    law: No file, specs included, holds a type assertion other than `as const`, a non-null assertion, `any`, the `Function` type or `eval`.
    failureCodes:
      - BE_TYPE_ESCAPE
    enforcers:
      - {kind: eslint-be, id: no-function-or-eval}
  - id: R73
    code: BE_ASYNC_NO_AWAIT
    law: An `async` function contains an `await`.
    failureCodes:
      - BE_ASYNC_NO_AWAIT
    enforcers:
      - {kind: eslint-be, id: async-needs-await}
  - id: R74
    code: BE_MIGRATION_REVERSIBLE
    law: Every migration declares a `down()` that reverses its `up()`.
    failureCodes:
      - BE_MIGRATION_REVERSIBLE
    enforcers:
      - {kind: eslint-be, id: migration-down-reversible}
  - id: R75
    code: BE_RETURN_TYPE
    law: Handlers and public methods of an Injectable, Resolver or Controller declare their return type.
    failureCodes:
      - BE_RETURN_TYPE
    enforcers:
      - {kind: eslint-be, id: explicit-handler-return-type}
  - id: R76
    code: BE_JSON_PARSE_UNGUARDED
    law: "`JSON.parse` sits inside a `try` in its own function and fails as a typed outcome."
    failureCodes:
      - BE_JSON_PARSE_UNGUARDED
    enforcers:
      - {kind: eslint-be, id: json-parse-needs-guard}
  - id: R77
    code: BE_QUERY_IN_LOOP
    law: No read through the shared EntityManager runs once per loop element; it reads once by key list before the loop.
    failureCodes:
      - BE_QUERY_IN_LOOP
    enforcers:
      - {kind: eslint-be, id: no-query-in-loop}
  - id: R78
    code: BE_USER_COPY_LITERAL
    law: Exception messages, notification texts and response copy come from the capability's messages catalog through the `MessageCatalog` port; the operation and field documentation a REST door hands to an `@nestjs/swagger` export is contract text, judged with the emitted document (R396).
    failureCodes:
      - BE_USER_COPY_LITERAL
    enforcers:
      - {kind: eslint-be, id: user-copy-through-catalog}
  - id: R79
    code: BE_AMBIENT_CLOCK
    law: Ambient clock APIs are referenced only inside `platform/clock`; code uses the injected `Clock` port and specs use `FakeClock`.
    failureCodes:
      - BE_AMBIENT_CLOCK
    enforcers:
      - {kind: eslint-be, id: no-ambient-clock}
  - id: R80
    code: BE_INBOX_DEDUPE_MISSING
    law: Every service method that takes a delivery first claims its `eventId` on the `Inbox` port (`claim`, or `claimRow` on its `EntityInbox` extension, which inserts the receipt row only for the winning claim) and returns early on a duplicate (`false`, or no receipt id); consumers stay thin doors.
    failureCodes:
      - BE_INBOX_DEDUPE_MISSING
    enforcers:
      - {kind: eslint-be, id: inbox-dedupe-required}
  - id: R81
    code: BE_HAND_ROLLED_RETRY
    law: Retry-with-wait goes through the shared `platform/retry` helper, never a hand-written loop.
    failureCodes:
      - BE_HAND_ROLLED_RETRY
    enforcers:
      - {kind: eslint-be, id: no-hand-rolled-retry}
  - id: R82
    code: BE_TRANSACTION_EXTERNAL_CALL
    law: No transaction spans an external call; it commits first or writes an outbox message inside the transaction.
    failureCodes:
      - BE_TRANSACTION_EXTERNAL_CALL
    enforcers:
      - {kind: eslint-be, id: no-external-call-in-transaction}
  - id: R83
    code: BE_UNNAMED_DATA_ACCESS
    law: The database is reached only through the shared EntityManager injected by a declared connection's injector, and no repository, wrapper or other class hands out a connection object.
    failureCodes:
      - BE_UNNAMED_DATA_ACCESS
    enforcers:
      - {kind: eslint-be, id: named-entity-manager-only}
      - {kind: eslint-be, id: no-injected-repository}
      - {kind: eslint-be, id: must-inject-entity-manager}
      - {kind: eslint-be, id: no-repository-class}
      - {kind: eslint-be, id: no-eager-relation}
      - {kind: eslint-be, id: no-outer-manager-in-transaction}
      - {kind: eslint-be, id: require-entity-table-name}
  - id: R84
    code: BE_CONNECTION_DUPLICATE
    law: One physical database is one connection with one injector declared once in `platform/database`, matching `hfs.json` connections one to one.
    failureCodes:
      - BE_CONNECTION_DUPLICATE
    enforcers:
      - {kind: eslint-be, id: one-connection-per-database}
      - {kind: eslint-be, id: connection-map}
  - id: R85
    code: BE_RAW_INJECT
    law: Every injected infrastructure dependency arrives through a zero-argument `Inject<Thing>()` over an exported `unique symbol` token, with port parameters named as `ruleParams.be.paramNames` gives.
    failureCodes:
      - BE_RAW_INJECT
    enforcers:
      - {kind: eslint-be, id: injector-only}
      - {kind: eslint-be, id: injector-shape}
      - {kind: eslint-be, id: injector-type-match}
      - {kind: eslint-be, id: infra-needs-injector}
      - {kind: eslint-be, id: provider-param-token}
      - {kind: eslint-be, id: injected-param-name}
      - {kind: eslint-be, id: no-module-ref}
      - {kind: eslint-be, id: no-forward-ref}
      - {kind: eslint-be, id: no-string-token}
      - {kind: eslint-be, id: injection-token-exported}
  - id: R86
    code: BE_SQL_TABLE_OWNER
    law: SQL writes only its own capability's tables, reads only tables of its own context, and bounds every multi-row SELECT. The engine-owned objects of hfs.json sides.be.engineOwned belong to the declared engine capability alone.
    failureCodes:
      - BE_SQL_TABLE_OWNER
    enforcers:
      - {kind: eslint-be, id: sql-owner}
  - id: R87
    code: BE_CQRS_SHAPE
    law: "The application layer is CQRS: readonly typed commands and queries whose handlers make exactly one delegating service call, with no use-case classes, forwarder services or in-process events."
