  - id: R69
    code: BE_QUERY_UNBOUNDED
    law: A read that can return many rows is bounded by `take`, `limit`, `LIMIT` or a cursor.
    failureCodes:
      - BE_QUERY_UNBOUNDED
    enforcers:
      - {kind: eslint-be, id: query-needs-limit}
  - id: R70
    code: BE_HTTP_TIMEOUT
    law: Every outbound `fetch`, axios or HttpService call states a timeout or an abort signal.
    failureCodes:
      - BE_HTTP_TIMEOUT
    enforcers:
      - {kind: eslint-be, id: http-needs-timeout}
  - id: R71
    code: BE_LOG_SECRET
    law: No log call or constructed error carries a `Secret`, `Pii` or credential-named value; it logs an id or a masked form.
    failureCodes:
      - BE_LOG_SECRET
    enforcers:
      - {kind: eslint-be, id: no-secret-in-log}
      - {kind: eslint-be, id: no-secret-in-error}
  - id: R72
    code: BE_TYPE_ESCAPE
    law: No file, specs included, holds a type assertion other than `as const`, a non-null assertion, `any`, the `Function` type or `eval`.
    failureCodes:
      - BE_TYPE_ESCAPE
    enforcers:
      - {kind: eslint-be, id: no-function-or-eval}
  - id: R73
    code: BE_ASYNC_NO_AWAIT
    law: An `async` function contains an `await`.
    failureCodes:
      - BE_ASYNC_NO_AWAIT
    enforcers:
      - {kind: eslint-be, id: async-needs-await}
  - id: R74
    code: BE_MIGRATION_REVERSIBLE
    law: Every migration declares a `down()` that reverses its `up()`.
