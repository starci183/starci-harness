      - {kind: eslint-grammar-core, id: no-unresolved-token-class}
      - {kind: eslint-grammar-core, id: no-heading-tag-outside-heading-component}
      - {kind: eslint-grammar-core, id: status-text-uses-soft-foreground}
  - id: R62
