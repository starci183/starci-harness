  - id: R278
    code: BE_REST_DOOR_EVIDENCE
    law: GraphQL is the default door, and every REST route carries its own evidence from the closed set of door reasons the pattern lists.
    failureCodes:
      - BE_REST_DOOR_EVIDENCE
