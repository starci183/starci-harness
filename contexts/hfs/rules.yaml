    code: BE_INBOX_DEDUPE_MISSING
    law: Every service method that takes a delivery first claims its `eventId` on the `Inbox` port and returns early on a duplicate; consumers stay thin doors.
    failureCodes:
      - BE_INBOX_DEDUPE_MISSING
    enforcers:
      - {kind: eslint-be, id: inbox-dedupe-required}
  - id: R81
    code: BE_HAND_ROLLED_RETRY
    law: Retry-with-wait goes through the shared `platform/retry` helper, never a hand-written loop.
    failureCodes:
