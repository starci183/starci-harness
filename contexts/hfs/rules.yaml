      - {kind: stylelint, id: raw-brand-value}
      - {kind: stylelint, id: no-apply-raw}
      - {kind: stylelint, id: no-important}
      - {kind: stylelint, id: globals-shape}
      - {kind: stylelint, id: globals-import-order}
