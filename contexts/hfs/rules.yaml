  - id: R277
    code: HFS_SECRET_PLAINTEXT_FILE
    law: A tracked secret exists only as a sops envelope under `.starcistacks/<env>/secrets/`, in every edition.
    failureCodes:
      - HFS_SECRET_PLAINTEXT_FILE
      - HFS_SECRET_OUTSIDE_ENC
    enforcers:
