    enforcers:
      - {kind: eslint-be, id: no-hand-rolled-retry}
  - id: R82
    code: BE_TRANSACTION_EXTERNAL_CALL
    law: No transaction spans an external call; it commits first or writes an outbox message inside the transaction.
