    enforcers:
      - {kind: eslint-be, id: migration-down-reversible}
  - id: R75
    code: BE_RETURN_TYPE
    law: Handlers and public methods of an Injectable, Resolver or Controller declare their return type.
    failureCodes:
      - BE_RETURN_TYPE
    enforcers:
      - {kind: eslint-be, id: explicit-handler-return-type}
  - id: R76
    code: BE_JSON_PARSE_UNGUARDED
    law: "`JSON.parse` sits inside a `try` in its own function and fails as a typed outcome."
    failureCodes:
      - BE_JSON_PARSE_UNGUARDED
    enforcers:
      - {kind: eslint-be, id: json-parse-needs-guard}
  - id: R77
    code: BE_QUERY_IN_LOOP
    law: No read through the shared EntityManager runs once per loop element; it reads once by key list before the loop.
    failureCodes:
      - BE_QUERY_IN_LOOP
    enforcers:
      - {kind: eslint-be, id: no-query-in-loop}
  - id: R78
    code: BE_USER_COPY_LITERAL
    law: Exception messages, notification texts and response copy come from the capability's messages catalog through the `MessageCatalog` port.
    failureCodes:
