      - FE_PURE_WORLD_IMPORT
    enforcers:
      - {kind: eslint-fe, id: no-inline-parameter-type}
      - {kind: eslint-fe, id: public-component-signature}
      - {kind: eslint-fe, id: no-per-part-classname-prop}
      - {kind: eslint-fe, id: no-public-classname-prop}
      - {kind: eslint-fe, id: no-public-frame-css-props}
      - {kind: eslint-fe, id: no-css-door-type-laundering}
      - {kind: eslint-fe, id: tier-children}
      - {kind: eslint-fe, id: base-props-atom}
      - {kind: eslint-fe, id: base-import-pair}
      - {kind: eslint-fe, id: no-data-status-shape}
      - {kind: eslint-fe, id: no-view-data-status}
      - {kind: eslint-grammar-core, id: slot-status-through-slotview}
      - {kind: eslint-fe, id: presentational-purity}
      - {kind: eslint-fe, id: connected-block-has-presentational-twin}
      - {kind: eslint-fe, id: no-resting-twin-component}
      - {kind: eslint-fe, id: no-placeholder-prop}
      - {kind: eslint-fe, id: no-resting-branch-at-call-site}
      - {kind: eslint-fe, id: no-inline-class-name}
      - {kind: eslint-fe, id: class-names-in-colocated-file}
      - {kind: eslint-fe, id: cn-arguments-are-single-tokens}
      - {kind: eslint-fe, id: component-purity}
  - id: R93
    code: FE_VENDOR_BOUNDARY
    law: Vendor primitives and icons reach components only through their named owners with one icon size per region from the Grammar scale, and the Grammar package is imported only through its public entries.
    failureCodes:
      - FE_VENDOR_BOUNDARY
      - ARCH_GRAMMAR_CONTRACT_INVALID
      - ARCH_GRAMMAR_EXPORT_BYPASS
    enforcers:
      - {kind: eslint-grammar-core, id: no-vendor-icon-outside-icon-leaf}
      - {kind: eslint-grammar-core, id: heroicons-is-the-glyph-vendor}
      - {kind: eslint-grammar-core, id: no-icon-size-class}
      - {kind: eslint-grammar-core, id: destructive-menu-entry-needs-danger-tone}
      - {kind: eslint-grammar-core, id: vendor-primitive-has-named-owner}
      - {kind: eslint-fe, id: grammar-entry}
      - {kind: machine, id: grammar}
  - id: R94
    code: FE_SLOT_FILE_ROLE
    law: A front-end file is owned and named by a slot, and a directory-owning slot holds only the files its `allows` list names inside a folder of its own.
    failureCodes:
      - FE_SLOT_FILE_ROLE
    enforcers:
      - {kind: machine, id: fe-slot-allows}
  - id: R95
    code: BE_OPERATION_CONTRACT
    law: A versioned operation is declared once by `defineOperations` with bounded zod schemas and a closed refusal union, validated by the operation pipe before dispatch, and its OpenAPI is derived by the app emit.
    failureCodes:
      - BE_OPERATION_CONTRACT
    enforcers:
      - {kind: eslint-be, id: operation-contract-decidable}
      - {kind: eslint-be, id: operation-route-driven-by-table}
      - {kind: eslint-be, id: operation-table-schemas}
  - id: R96
    code: HFS_DOC_NOT_ENGLISH
    law: Every Markdown and YAML document under a side's docs, source and apps, and under the runtime's knowledge and docs, is English, except data in message-catalog or i18n-fixtures slots.
    failureCodes:
      - HFS_DOC_NOT_ENGLISH
    enforcers:
      - {kind: machine, id: doc-language}
  - id: R97
    code: FE_NO_TESTS
    law: "The front end has no tests: no spec files, test folders, runner configurations, test scripts or test dependencies."
    failureCodes:
      - FE_NO_TESTS
    enforcers:
      - {kind: hfs, id: fe-no-tests}
  - id: R98
    code: BE_TEST_BUILDER_HOME
    law: Test data builders live only in `be/src/tests/fixtures/builders/<area>.builder.ts`, and no other test module creates persisted rows.
    failureCodes:
      - BE_TEST_BUILDER_HOME
    enforcers:
      - {kind: eslint-be, id: persisting-builder-in-builders-slot}
  - id: R99
    code: BE_TEST_ROW_BY_BUILDER
    law: A spec never hand-builds rows through SQL or EntityManager writes; rows come from the area's builder.
    failureCodes:
      - BE_TEST_ROW_BY_BUILDER
    enforcers:
      - {kind: eslint-be, id: spec-no-raw-insert}
      - {kind: eslint-be, id: spec-no-repeated-row-literal}
  - id: R100
    code: BE_TEST_CONSTRAINTS_ON
    law: Nothing under `be/src/tests` disables, defers or drops a database constraint; a builder creates the parent chain instead.
    failureCodes:
      - BE_TEST_CONSTRAINTS_ON
    enforcers:
      - {kind: eslint-be, id: tests-keep-constraints}
  - id: R101
    code: BE_TEST_BUILDER_ARRANGES
    law: A test data builder only arranges data, imports no assertion or test framework, and has deterministic defaults.
    failureCodes:
      - BE_TEST_BUILDER_ARRANGES
    enforcers:
      - {kind: eslint-be, id: builder-arranges-only}
  - id: R102
    code: BE_SPEC_PLACEMENT
    law: "A back-end spec lives only in one of the four test layers: a unit spec beside its unit-tested subject, or an integration, e2e or contract spec under `be/src/tests`."
    failureCodes:
      - BE_SPEC_PLACEMENT
    enforcers:
      - {kind: hfs, id: spec-placement}
      - {kind: eslint-be, id: spec-placement}
  - id: R103
    code: HFS_REPO_LOCAL_CHECK
    law: "A repository keeps no check, lint rule or lint plugin of its own outside its extension folder (PROJECT-LINT-3): no `eslint-local-rules*` or local eslint plugin; no check-named runnable file in `scripts/` or `tools/` (or one folder below), a check-named file being one whose name holds the word check, checks or checker split on `-`, `_` and `.` (`check-schema.mjs`, `tool-names-check.mjs`, `flow_check.cjs`, `ids.check.mjs`, never `checkout.mjs`); no file of `ext/checks/` that ext/manifest.json `checks` does not declare; and no package script that runs such a file (one that runs a declared check stays). A generic check lives in the harness runtime and the canons."
    failureCodes:
      - HFS_REPO_LOCAL_CHECK
    enforcers:
      - {kind: hfs, id: repo-local-check}
  - id: R104
    code: HFS_LINT_SUPPRESSION_FILE
    law: A repository keeps no lint-suppression file, script or option; a finding is fixed in the code.
    failureCodes:
      - HFS_LINT_SUPPRESSION_FILE
    enforcers:
      - {kind: hfs, id: lint-suppression}
  - id: R105
    code: HFS_PROOF_COMMAND_FILE_MISSING
    law: Every repository file a `.starciwork` proof command names exists.
    failureCodes:
      - HFS_PROOF_COMMAND_FILE_MISSING
    enforcers:
      - {kind: hfs, id: proof-command-files}
  - id: R106
    code: FE_I18N_KEYS
    law: "Front-end catalogs and source agree both ways: every literal key read through `next-intl` exists in every locale, and no catalog key is unread."
    failureCodes:
      - FE_I18N_KEYS
    enforcers:
      - {kind: eslint-fe, id: i18n-keys}
  - id: R107
    code: FE_COOKIE_ATTRIBUTES
    law: A cookie the front end writes states `httpOnly` literally, carries `secure` and has `sameSite` `lax` or `strict`.
    failureCodes:
      - FE_COOKIE_ATTRIBUTES
    enforcers:
      - {kind: eslint-fe, id: response-cookie-attributes}
  - id: R108
    code: BE_ERROR_CAUSE_DROPPED
    law: A `throw` escaping a `catch` rethrows the caught value or carries it as the new error's `cause`.
    failureCodes:
      - BE_ERROR_CAUSE_DROPPED
    enforcers:
      - {kind: eslint-be, id: replacement-throw-carries-cause}
  - id: R109
    code: BE_MEMBER_DOC_MISSING
    law: Every public member of an exported class, interface or object type in product source opens with English JSDoc.
    failureCodes:
      - BE_MEMBER_DOC_MISSING
    enforcers:
      - {kind: eslint-be, id: require-public-member-jsdoc}
  - id: R110
    code: FE_PROPS_MUTABLE
    law: The props type of an exported rendering function is readonly all the way down.
    failureCodes:
      - FE_PROPS_MUTABLE
    enforcers:
      - {kind: eslint-fe, id: props-fields-readonly}
  - id: R111
    code: HFS_PEER_INTEGRATION_MISSING
    law: An app declares the runtime peer every driver integration pair of contexts/stack/pins.yaml#peers requires.
    failureCodes:
      - HFS_PEER_INTEGRATION_MISSING
    enforcers:
      - {kind: hfs, id: peer-integrations}
  - id: R113
    code: FE_GRAPHQL_CONTRACT
    law: Every GraphQL operation a front end keeps in a `.graphql` file validates against the back-end contract snapshot that declares its root field.
    failureCodes:
      - FE_GRAPHQL_CONTRACT
    enforcers:
      - {kind: hfs, id: fe-contract-documents}
  - id: R141
    code: BE_COOKIE_ATTRIBUTES
    law: A cookie a back-end door writes sets `httpOnly`, `secure` and a `lax` or `strict` `sameSite` as typed literals, and `Set-Cookie` is never written as a raw header.
    failureCodes:
      - BE_COOKIE_ATTRIBUTES
    enforcers:
      - {kind: eslint-be, id: response-cookie-attributes}
  - id: R142
    code: BE_AMBIENT_ID
    law: Random id generators are used only inside `platform/ids`; code uses the injected `Ids` port and specs use `fakeIds()`.
    failureCodes:
      - BE_AMBIENT_ID
    enforcers:
      - {kind: eslint-be, id: no-ambient-id}
  - id: R143
    code: HFS_MONO_WORKSPACES
    law: Every app is an npm monorepo with the declared workspaces, an exact `packageManager`, the pinned turbo, one root lockfile and the managed `turbo.json`.
    failureCodes:
      - HFS_MONO_WORKSPACES
    enforcers:
      - {kind: hfs, id: monorepo}
  - id: R144
    code: HFS_MONO_FE_WORKSPACE
    law: Every front-end app and package is a private npm workspace with its declared name and exactly the standard scripts.
    failureCodes:
      - HFS_MONO_FE_WORKSPACE
    enforcers:
      - {kind: hfs, id: monorepo}
  - id: R145
    code: HFS_MONO_NEST_PROJECTS
    law: The back end is a Nest monorepo of `be/apps/<app>` whose `nest-cli.json` projects are exactly the apps `hfs.json` declares, defaulting to an api app.
    failureCodes:
      - HFS_MONO_NEST_PROJECTS
    enforcers:
      - {kind: hfs, id: monorepo}
  - id: R146
    code: HFS_MONO_WORKSPACE_DEP
    law: A front-end workspace declares every package its files import in its own `package.json`, and the app root declares no workspace package.
    failureCodes:
      - HFS_MONO_WORKSPACE_DEP
    enforcers:
      - {kind: hfs, id: monorepo}
  - id: R147
    code: BE_CLI_REQUIRED
    law: Every one-off back-end action lives in the one ops cli app `be/apps/cli` (the only app of kind `cli`) with its own image, required whenever the back end declares a connection or an ops command.
    failureCodes:
      - BE_CLI_REQUIRED
    enforcers:
      - {kind: hfs, id: cli}
  - id: R148
    code: BE_CLI_BOOTSTRAP
    law: A cli app, the ops cli or a client cli, boots through nest-commander's `CommandFactory.run` and never serves.
    failureCodes:
      - BE_CLI_BOOTSTRAP
    enforcers:
      - {kind: eslint-be, id: cli-bootstrap}
  - id: R149
    code: BE_CLI_COMMAND_SHAPE
    law: A nest-commander command is declared only in the feature root of its cli app (`src/features/cli/` of the ops cli, `src/features/client-cli/<app>/` of a client cli), one per file in its group or `subs/` folder, each sub-command with its unit spec beside it, and no two command classes of one feature root share a class name.
    failureCodes:
      - BE_CLI_COMMAND_SHAPE
    enforcers:
      - {kind: eslint-be, id: cli-command-shape}
      - {kind: eslint-be, id: unit-test-colocated}
      - {kind: hfs, id: cli-command-names}
  - id: R150
    code: BE_CLI_OWNER
    law: "`nest-commander` is imported only by the cli apps and their feature roots, and no back-end source parses command-line arguments itself."
    failureCodes:
      - BE_CLI_OWNER
    enforcers:
      - {kind: eslint-be, id: cli-owner}
  - id: R151
    code: BE_EVENT_CLASS_CONTRACT
    law: Every typed event class under `be/src/modules/events/<service>/` matches an entry of the vendored `events.json` contract by name and version, and every contract entry has its class.
    failureCodes:
      - BE_EVENT_CLASS_CONTRACT
    enforcers:
      - {kind: hfs, id: event-class-contract}
  - id: R152
    code: BE_OUTBOX_WRITE_TX
    law: Only a domain service writes the outbox (an event publish, a queue producer call or a direct `QueueOutbox.write`), passing the manager of its own transaction, so a job starts, and enqueues its next job, only with the change that calls for it.
    failureCodes:
      - BE_OUTBOX_WRITE_TX
    enforcers:
      - {kind: eslint-be, id: outbox-write-tx}
  - id: R153
    code: BE_EVENT_CONSUMER_SHAPE
    law: An `EventConsumer` is `transport/message/<event>.consumer.ts` named after its event and passes `delivery.eventId` on to the command it dispatches.
    failureCodes:
      - BE_EVENT_CONSUMER_SHAPE
    enforcers:
      - {kind: eslint-be, id: event-consumer-shape}
  - id: R154
    code: BE_QUEUE_PRODUCER_SHAPE
    law: "Every queue producer write takes a `tx: EntityManager` parameter and passes it as the write's first argument."
    failureCodes:
      - BE_QUEUE_PRODUCER_SHAPE
    enforcers:
      - {kind: eslint-be, id: queue-producer-shape}
  - id: R155
    code: BE_PATTERN_SPEC_MISSING
    law: Every pattern a back end declares has a test titled `<pattern>/<scenario>` for each scenario of `ruleParams.be.patternScenarios`.
    failureCodes:
      - BE_PATTERN_SPEC_MISSING
    enforcers:
      - {kind: hfs, id: pattern-spec-missing}
      - {kind: hfs, id: proof-lane}
  - id: R156
    code: BE_KIND_ISOLATION
    law: A feature of one trigger kind never imports a feature of another kind; kinds meet only through the event bus.
    failureCodes:
      - BE_KIND_ISOLATION
    enforcers:
      - {kind: eslint-be, id: kind-isolation}
      - {kind: machine, id: tiers}
  - id: R157
    code: BE_JOB_WRITE_OUTSIDE_OWNER
    law: The job entity is written only by `platform/jobs`.
    failureCodes:
      - BE_JOB_WRITE_OUTSIDE_OWNER
    enforcers:
      - {kind: eslint-be, id: job-write-owner}
  - id: R158
    code: BE_JOB_FENCE_REQUIRED
    law: Every `JobClaims` method that takes a job requires an expected fencing token, no caller casts around it, and a catch around a claims write rethrows.
    failureCodes:
      - BE_JOB_FENCE_REQUIRED
    enforcers:
      - {kind: eslint-be, id: job-fence-required}
  - id: R159
    code: BE_JOB_EFFECT_PIECE
    law: "In a job step, and in a function that takes a `ClaimedJob`, every call on an integration port that its port does not declare an outside read (`OutsideReads<'member'>` of `platform/effects`, extended by the port's interface, by an interface merged with a client class, or held by the contract a class implements) is the `act` or the `confirm` read of an `Effects.once` call of `platform/effects`, which commits the intent row before the act and the result after; a declared read needs no intent, an undeclared member is an act."
    failureCodes:
      - BE_JOB_EFFECT_PIECE
    enforcers:
      - {kind: eslint-be, id: job-effect-piece}
  - id: R160
    code: BE_JOB_SHAPE
    law: Job processors and steps exist only in their job folder, a processor extending `FencedProcessor` and a step implementing `JobStep`.
    failureCodes:
      - BE_JOB_SHAPE
    enforcers:
      - {kind: eslint-be, id: job-shape}
  - id: R161
    code: BE_PROJECTION_WRITE_OWNER
    law: A projection's entity is written only by the `<name>.projection.ts` of its folder.
    failureCodes:
      - BE_PROJECTION_WRITE_OWNER
    enforcers:
      - {kind: eslint-be, id: projection-write-owner}
  - id: R162
    code: BE_PROJECTION_SHAPE
    law: A projection exposes only `recompute*` and `get*` methods, exports no entity from its index, and is never recomputed by an api feature.
    failureCodes:
      - BE_PROJECTION_SHAPE
    enforcers:
      - {kind: eslint-be, id: projection-shape}
  - id: R163
    code: HFS_SERVICE_PLACEMENT
    law: A back-end service lives only at `be/apps/<service>/`, sharing the `be/src` libraries and the one package.json; any other service root is refused, and a workspace package's manifest (`fe/apps/<app>`, `fe/packages/<pkg>`, a root `packages/<name>`) is none. The package.json of a client cli (`be/apps/<name>/package.json` of an app declared with kind `client-cli`, R397) is none either.
    failureCodes:
      - HFS_SERVICE_PLACEMENT
    enforcers:
      - {kind: hfs, id: services-placement}
  - id: R164
    code: HFS_IMAGE_UNPINNED
    law: In a multi-service product every stack component image is pinned by digest or exact version.
    failureCodes:
      - HFS_IMAGE_UNPINNED
    enforcers:
      - {kind: hfs, id: services-image-pins}
  - id: R165
    code: HFS_SERVICE_STACK_DECLARATION
    law: "In a multi-service product every api or worker app is a `role: service` component of the application stacks."
    failureCodes:
      - HFS_SERVICE_STACK_DECLARATION
    enforcers:
      - {kind: hfs, id: services-stack-declaration}
  - id: R166
    code: HFS_EVENT_CONTRACT
    law: The async contract between services is emitted into `be/contracts/<service>/events.json`, compensations name an existing event, and every consumed entry exists in the provider's snapshot at its version.
    failureCodes:
      - HFS_EVENT_CONTRACT
    enforcers:
      - {kind: hfs, id: services-event-contract}
  - id: R168
    code: BE_SERVICE_ISOLATION
    law: A service app imports no file of a sibling service app; services meet only through the `be/src` libraries and the wire.
    failureCodes:
      - BE_SERVICE_ISOLATION
    enforcers:
      - {kind: eslint-be, id: service-isolation}
  - id: R169
    code: BE_SAGA_STEP_COMPENSATION
    law: A declared saga is one folder whose orchestrator imports every step and every compensation; a compensation (the optional declared undo, pressed by a person and run as a forward step) has the step of the same name, and a step needs none.
    failureCodes:
      - BE_SAGA_STEP_COMPENSATION
    enforcers:
      - {kind: hfs, id: saga-step-compensation}
  - id: R170
    code: BE_SAGA_STATE_VERSIONED
    law: Every saga orchestrator has a versioned state type moved only through the fenced store of `platform/saga`.
    failureCodes:
      - BE_SAGA_STATE_VERSIONED
    enforcers:
      - {kind: hfs, id: saga-state-versioned}
  - id: R171
    code: BE_SAGA_EVENT_CONTRACT
    law: A saga step and its compensation each name an event declared in a vendored contract, and the compensation's event declares what it compensates.
    failureCodes:
      - BE_SAGA_EVENT_CONTRACT
    enforcers:
      - {kind: hfs, id: saga-event-contract}
  - id: R172
    code: BE_SAGA_CONSUMER_DEDUPE
    law: A saga consumer passes the delivery's `eventId` to the command it dispatches.
    failureCodes:
      - BE_SAGA_CONSUMER_DEDUPE
    enforcers:
      - {kind: hfs, id: saga-consumer-dedupe}
  - id: R174
    code: BE_CONTEXT_OWNER
    law: Each `hfs.json` connection is a bounded context owned by one api or worker app; an app composes only its own contexts, and the migrate and cli apps compose all.
    failureCodes:
      - BE_CONTEXT_OWNER
    enforcers:
      - {kind: eslint-be, id: context-owner}
  - id: R175
    code: BE_CONTEXT_COUPLING
    law: "Contexts couple only through events: no entity relation, foreign key or import crosses a context."
    failureCodes:
      - BE_CONTEXT_COUPLING
    enforcers:
      - {kind: eslint-be, id: context-coupling}
  - id: R176
    code: BE_CONTEXT_TRANSACTION
    law: One transaction touches one context's connection; work across contexts is a saga.
    failureCodes:
      - BE_CONTEXT_TRANSACTION
    enforcers:
      - {kind: eslint-be, id: context-transaction}
  - id: R177
    code: BE_CONTRACT_BREAKING
    law: A published contract evolves only additively against its pinned previous copy; a breaking event change is a new versioned event key, and a breaking REST change raises the major of the document's info.version.
    failureCodes:
      - BE_CONTRACT_BREAKING
    enforcers:
      - {kind: hfs, id: contract-compat}
      - {kind: hfs, id: rest-contract-breaking}
  - id: R178
    code: BE_CONTEXT_PLATFORM_TABLES
    law: A `perConnection` platform capability registers its entities and migrations on every connection it serves.
    failureCodes:
      - BE_CONTEXT_PLATFORM_TABLES
    enforcers:
      - {kind: eslint-be, id: context-platform-tables}
  - id: R179
    code: BE_KIND_DECLARATION
    law: "`hfs.json` `sides.be.kinds` lists exactly the trigger kinds in use, with their required patterns and platform capabilities."
    failureCodes:
      - BE_KIND_DECLARATION
    enforcers:
      - {kind: hfs, id: kind-declaration}
  - id: R180
    code: BE_KIND_EMPTY
    law: A kind folder holds only instance folders, each with TypeScript source.
    failureCodes:
      - BE_KIND_EMPTY
    enforcers:
      - {kind: hfs, id: kind-empty}
  - id: R181
    code: BE_SQL_RETURNING_SHAPE
    law: A `sql` UPDATE or DELETE with RETURNING is wrapped as a CTE that SELECTs from the changed rows.
    failureCodes:
      - BE_SQL_RETURNING_SHAPE
    enforcers:
      - {kind: eslint-be, id: sql-returning}
  - id: R182
    code: BE_WEBHOOK_SHAPE
    law: A webhook door is one public signed-webhook controller whose POST verifies, then makes one durable domain intake and returns nothing or a declared literal ack, with no bus or handler dispatch.
    failureCodes:
      - BE_WEBHOOK_SHAPE
    enforcers:
      - {kind: eslint-be, id: webhook-shape}
  - id: R183
    code: BE_WEBHOOK_UNVERIFIED
    law: A webhook POST starts with an unconditional signature or domain verification before any other work, and an optional GET challenge echoes only its verifier's result.
    failureCodes:
      - BE_WEBHOOK_UNVERIFIED
    enforcers:
      - {kind: eslint-be, id: webhook-verify-first}
  - id: R184
    code: BE_REALTIME_SHAPE
    law: A realtime file is the one door its role names (gateway, subscription or SSE controller), and all three doors are served from the api process in both editions.
    failureCodes:
      - BE_REALTIME_SHAPE
    enforcers:
      - {kind: eslint-be, id: realtime-shape}
  - id: R185
    code: BE_REALTIME_WRITES
    law: A realtime door only reads and pushes; it injects the `RealtimeHub` of `platform/realtime` and, in an SSE door, at most one stream read service whose public methods only answer an `Observable`.
    failureCodes:
      - BE_REALTIME_WRITES
    enforcers:
      - {kind: eslint-be, id: realtime-read-only}
  - id: R186
    code: BE_REALTIME_TOPIC_SCOPE
    law: A realtime handler subscribes only to topics built from its `@CurrentPrincipal()`, and a call to a stream read service passes that principal.
    failureCodes:
      - BE_REALTIME_TOPIC_SCOPE
    enforcers:
      - {kind: eslint-be, id: realtime-topic-scope}
  - id: R187
    code: HFS_DOCKER_BUILD_CONTEXT
    law: Every app image builds from the app root, no COPY or ADD source leaves the build context, and a Next image copies be/contracts only when the back end holds it. Every image copies hfs.json (the repository root marker a package reads a shared folder from) and statics/brand when the repository holds it, before its build step.
    failureCodes:
      - HFS_DOCKER_BUILD_CONTEXT
    enforcers:
      - {kind: hfs, id: docker}
  - id: R188
    code: HFS_DOCKER_STAGES
    law: An app Dockerfile is multi-stage with `build` and `runtime` stages, installs with `npm ci`, and its runtime stage builds nothing and runs as `node`.
    failureCodes:
      - HFS_DOCKER_STAGES
    enforcers:
      - {kind: hfs, id: docker}
  - id: R189
    code: HFS_DOCKER_ENTRY
    law: The runtime stage starts the app's built entry in exec form with the port, exposure and HEALTHCHECK its app kind requires.
    failureCodes:
      - HFS_DOCKER_ENTRY
    enforcers:
      - {kind: hfs, id: docker}
  - id: R190
    code: HFS_DOCKER_BASE_PIN
    law: Every FROM of an app Dockerfile is a prior stage, the canon node base image (stack/pins.yaml) or a digest-pinned image.
    failureCodes:
      - HFS_DOCKER_BASE_PIN
    enforcers:
      - {kind: hfs, id: docker}
  - id: R191
    code: HFS_DOCKER_SECRETS
    law: No secret enters an image through a copied file, a URL, or a credential-named ARG or ENV other than `NEXT_PUBLIC_*`.
    failureCodes:
      - HFS_DOCKER_SECRETS
    enforcers:
      - {kind: hfs, id: docker}
  - id: R203
    code: BE_FEATURE_THIN
    law: A feature-tier file of `ruleParams.be.thinRoles` maps its parameters and makes one delegating call into `modules/`, with no branch, loop or computation beyond the gate calls its kind requires.
    failureCodes:
      - BE_FEATURE_THIN
    enforcers:
      - {kind: eslint-be, id: feature-thin}
  - id: R204
    code: HFS_COVERAGE_SCOPE_DRIFT
    law: The back-end coverage scope is derived once from the slot manifest (its coverage fields, logic roles and the logic files slots declare), and the jest, Sonar and Codecov configurations are its render.
    failureCodes:
      - HFS_COVERAGE_SCOPE_DRIFT
    enforcers:
      - {kind: hfs, id: coverage-scope-drift}
  - id: R212
    code: HFS_EDITION_DEPRECATED
    law: "An app has ONE edition, what the live apps run. (a) The full code structure, slots, patterns and back-end unit specs. (b) No Work features catalog: `.starciwork` is optional and admits only .gitignore, workspace.yaml, brand/** and the product concepts. (c) Chat agents code directly and run the app gates before each commit; no Kernel op is required. (d) The app runs its own stack on Docker Swarm with the backing services it declares: its own PostgreSQL db service, S3-compatible storage, Passport identity, and one minimal instance of each backing service hfs.json sides.be.backing declares (Redis for the queue, Qdrant for vectors); a client library of an undeclared backing service is HFS_BACKING_UNDECLARED and a declared service no dependency consumes (and no imported back-end module src/modules/integrations/<service>/, the client an app writes over the service's own protocol) is HFS_BACKING_UNUSED. The event bus is pgmq in the db service, the queue BullMQ on the declared Redis fed by the Postgres outbox. (e) The integration and e2e test world (useTestWorld, a browser journey) is allowed and runs only on request (R12). The hfs.json `edition` field is deprecated: any value is accepted and ignored with the warning HFS_EDITION_DEPRECATED, and the field is dropped in a later train."
    failureCodes:
      - HFS_EDITION_DEPRECATED
      - HFS_STARCIWORK_LITE_FORBIDDEN
      - HFS_BACKING_UNDECLARED
      - HFS_BACKING_UNUSED
    enforcers:
      - {kind: hfs, id: edition}
      - {kind: hfs, id: lite-brand-work}
  - id: R213
    code: DB_MIGRATION_SHAPE
    law: "A migration is `db/migrations/<ts14>_<kebab>.sql` with a valid unique stamp sorting after the committed active migrations, parses as PostgreSQL, carries no transaction control (it is applied in one transaction with its history row), and is immutable once on the base. A declared one-time baseline reset (hfs.json `db.baselineReset` = `{ baseline, ruling, date, reason }`, declared by an app that keeps no data worth migrating) makes the one declared baseline file (`-- starci:baseline-reset <ruling>` header) the new base chain while it is not yet on the base branch: the removal of every older active file and of the archive is accepted (R213 immutability, R257 archive immutability); exactly one file may carry the marker, no older active file may stay, and later migrations sort after the baseline. Once the baseline is on the base branch the declaration is spent and every rule applies to it unchanged; without the declaration nothing changes."
    failureCodes:
      - DB_MIGRATION_SHAPE
    enforcers:
      - {kind: hfs, id: db-migration-shape}
  - id: R214
    code: DB_RLS_REQUIRED
    law: Every table in an exposed schema enables row level security in its creating migration, and policies are named, never tautological for writes, and never grant `service_role`.
    failureCodes:
      - DB_RLS_REQUIRED
      - DB_DYNAMIC_DDL
      - DB_POLICY_SHAPE
    enforcers:
      - {kind: hfs, id: db-rls}
  - id: R215
    code: DB_DEFINER_SAFE
    law: A `security definer` function pins `search_path`, is not executable by the public and interpolates only through `format`, and every storage bucket is private by default with declared limits and a policy.
    failureCodes:
      - DB_DEFINER_SAFE
      - DB_STORAGE_POLICY
    enforcers:
      - {kind: hfs, id: db-privileged-objects}
  - id: R220
    code: HFS_LITE_SECRET_CUSTODY
    law: A lite app holds no secret material in the tree outside the sealed `.starcistacks/<env>/secrets/<slug>.enc` members.
    failureCodes:
      - HFS_LITE_SECRET_CUSTODY
    enforcers:
      - {kind: hfs, id: secret-custody}
  - id: R235
    code: SCAN_SMELL
    law: Code carries none of the Sonar way smells a lint rule can decide, each on at error in both canons (a leftover `TODO` marker comment among them, written as the upper-case word or as `todo:` and `todo(`; the noun in prose or a name is no marker), outside the files specs name (the specs run the test-scoped rules of the profile), and no raw U+2028, U+2029, U+0085 or bidirectional control character in any file, which the scanner counts as a line break and the language does not (the scan aborts with "Line n is out of range"); the finding names the escape to write.
    failureCodes:
      - SCAN_SMELL
    enforcers:
      - {kind: eslint-be, id: no-await-in-loop}
      - {kind: eslint-be, id: prefer-code-point}
      - {kind: eslint-be, id: prefer-string-raw}
      - {kind: eslint-be, id: no-nested-conditional}
      - {kind: eslint-be, id: no-void-operator}
      - {kind: eslint-be, id: no-unused-import}
      - {kind: eslint-be, id: prefer-export-from}
      - {kind: eslint-fe, id: no-await-in-loop}
      - {kind: eslint-fe, id: prefer-code-point}
      - {kind: eslint-fe, id: prefer-string-raw}
      - {kind: eslint-fe, id: no-nested-conditional}
      - {kind: eslint-fe, id: no-void-operator}
      - {kind: eslint-fe, id: no-unused-import}
      - {kind: eslint-fe, id: prefer-export-from}
      - {kind: eslint-fe, id: no-unused-prop-types}
      - {kind: eslint-fe, id: media-has-caption}
      - {kind: eslint-be, id: max-params}
      - {kind: eslint-fe, id: max-params}
      - {kind: eslint-be, id: no-line-separator-literal}
      - {kind: eslint-fe, id: no-line-separator-literal}
      - {kind: eslint-be, id: no-bidirectional-character}
      - {kind: eslint-fe, id: no-bidirectional-character}
      - {kind: eslint-be, id: no-duplicate-import}
      - {kind: eslint-fe, id: no-duplicate-import}
      - {kind: eslint-fe, id: no-useless-fragment}
      - {kind: eslint-fe, id: no-nested-component}
      - {kind: eslint-fe, id: no-children-prop}
      - {kind: eslint-fe, id: use-state-destructured}
      - {kind: eslint-fe, id: prefer-tag-over-role}
      - {kind: eslint-be, id: todo-tag}
      - {kind: eslint-fe, id: todo-tag}
  - id: R243
    code: FE_SERVER_ACTION_FORBIDDEN
    law: "The front end serves no API: no `\"use server\"` directive, and no route handler but the health route."
    failureCodes:
      - FE_SERVER_ACTION_FORBIDDEN
      - FE_ROUTE_HANDLER_FORBIDDEN
    enforcers:
      - {kind: machine, id: server-action-forbidden}
      - {kind: eslint-fe, id: no-server-action}
  - id: R244
    code: FE_STACK_FORBIDDEN
    law: A front end depends on no package that contexts/stack/fe.yaml forbids for a concern, writes no SWR middleware or viewer-cache binding of its own (they are @starci/next-data's), and avatar generation stays inside the Grammar.
    failureCodes:
      - FE_STACK_FORBIDDEN
    enforcers:
      - {kind: hfs, id: fe-stack}
      - {kind: eslint-fe, id: fe-stack-import}
      - {kind: eslint-fe, id: swr-extension-from-package}
  - id: R245
    code: BE_APP_OPTIONS_COMPOSITION
    law: An app's `src/` holds the five app roles, `main.ts`, `<app>.env.ts`, `<app>.options.ts`, `compose/<area>.ts` and `app.module.ts`, each with its single responsibility.
    failureCodes:
      - BE_APP_OPTIONS_COMPOSITION
    enforcers:
      - {kind: eslint-be, id: app-options-composition-free}
  - id: R246
    code: BE_APP_COMPOSITION_BUDGET
    law: Each app file stays within the absolute line budget its `be.app.*` slot names (hfs/slots.yaml), counted in lines excluding import declarations (a multi-line import counts none of its lines).
    failureCodes:
      - BE_APP_COMPOSITION_BUDGET
    enforcers:
      - {kind: eslint-be, id: app-file-budget}
  - id: R248
    code: ENV_REQUIRED_UNSET
    law: The environment keys a back end reads, the sealed keys and the keys the stack declares are one set by name, and no key name carries an environment (a leading DEV_, PROD_, PRODUCTION_, STAGING_, LOCAL_ or TEST_), since the environment of a key is its folder.
    failureCodes:
      - ENV_REQUIRED_UNSET
      - ENV_SEALED_UNREAD
      - ENV_DUPLICATE
      - ENV_PUBLIC_SEALED
      - ENV_EXAMPLE_DRIFT
      - ENV_KEY_ENVIRONMENT_NAMED
    enforcers:
      - {kind: hfs, id: env-parity}
  - id: R249
    code: ENV_VALUE_SHAPE
    law: Every stored environment value parses as the type its `EnvSource` reader declares, verified without revealing values.
    failureCodes:
      - ENV_VALUE_SHAPE
    enforcers:
      - {kind: hfs, id: env-value-shape}
  - id: R250
    code: HFS_HOST_CRON
    law: Scheduled work belongs to the app's queue scheduler, platform/jobs ticks or declared replicated jobs, never to a host crontab or a workflow schedule (the managed nightly cache verify, cache-verify.yml, aside), and deploy scripts only delegate to docker or the app CLI.
    failureCodes:
      - HFS_HOST_CRON
      - HFS_DEPLOY_NO_LOGIC
      - HFS_DEPLOY_COMPOSE_ON_VPS
      - HFS_DEPLOY_SCHEDULER
    enforcers:
      - {kind: hfs, id: deploy-scan}
  - id: R251
    code: HFS_DEPLOY_WORKFLOW
    law: Deployment workflows declare protected environments, permissions and concurrency, materialize only sealed secrets, pin every action by full commit SHA, and trigger only on the allowed refs (and cache-verify.yml, the nightly verify of the check cache, on its schedule).
    failureCodes:
      - HFS_DEPLOY_WORKFLOW
      - HFS_WORKFLOW_PIN
      - HFS_CI_TOOL_INSTALL
      - HFS_APP_WORKFLOW_TRIGGER
    enforcers:
      - {kind: hfs, id: deploy-workflow}
      - {kind: hfs, id: supply-chain}
  - id: R252
    code: HFS_SCRIPT_PLAINTEXT_LOAD
    law: Scripts and workflows never load plaintext secret files, enable xtrace or reveal secrets.
    failureCodes:
      - HFS_SCRIPT_PLAINTEXT_LOAD
      - HFS_SCRIPT_XTRACE
    enforcers:
      - {kind: hfs, id: script-hygiene}
  - id: R253
    code: HFS_AGE_KEY_CUSTODY
    law: The age identity that seals an app's secrets stays in untracked host-local custody, and the hash-sensitive secret-custody platform files equal the skeleton template of the @starci/hfs version the app pins.
    failureCodes:
      - HFS_AGE_KEY_CUSTODY
      - HFS_CANON_COPY_DRIFT
    enforcers:
      - {kind: hfs, id: secret-age-key-custody}
      - {kind: hfs, id: canon-copy-drift}
  - id: R255
    code: DB_APP_ROLE
    law: The declared back-end database role holds only the privileges it needs, none of them on schema `auth` (accounts are reached through the identity account doors), and the tables it owns force row level security unless exempted with a reason.
    failureCodes:
      - DB_APP_ROLE
      - DB_FORCE_RLS_DEFAULT
    enforcers:
      - {kind: hfs, id: db-app-role}
  - id: R256
    code: DB_POLICY_TAUTOLOGY
    law: "Exposed database objects keep their access boundaries: no tautological policies, principal-scoped policies for every role but the application role (the principal is auth.uid, auth.jwt, the request JWT claims or a transaction setting the app declares in hfs.json db.scopeSettings, read only by policies whose roles are all declared in db.scopeRoles, compared with the owning column of db.scopeColumns; a scope role is granted only to the application role), invoker-secured views and revoked execute on exposed definers."
    failureCodes:
      - DB_POLICY_TAUTOLOGY
      - DB_VIEW_UNSAFE
      - DB_DEFINER_REVOKE
      - DB_STORAGE_PREFIX
    enforcers:
      - {kind: hfs, id: db-policy-hardening}
      - {kind: hfs, id: db-definer-revoke}
  - id: R257
    code: DB_BASELINE_SHAPE
    law: An archived migration chain has exactly one active baseline, archive contents stay immutable, and the db baseline verbs are read-only unless `--execute` is explicit.
    failureCodes:
      - DB_BASELINE_SHAPE
      - DB_ARCHIVE_MUTATED
    enforcers:
      - {kind: hfs, id: db-baseline-shape}
  - id: R258
    code: DB_PGMQ_DECLARED
    law: pgmq is the event bus and carries no job queue; every pgmq queue is an event-bus topic queue named by a literal constant, bound to its topic by a literal binding, and granted only to the application role.
    failureCodes:
      - DB_PGMQ_DECLARED
    enforcers:
      - {kind: hfs, id: db-queue-cron}
  - id: R259
    code: DB_EXTENSION_ALLOWED
    law: "Database extensions follow the allowlist, migrations write no vault secret or role password, and destructive DDL lives only in contract migrations whose targets are unreferenced, also by the previous release's sources. A table a contract migration drops and a LATER migration of the ordered set creates anew under the same name is a replacement when the creating migration says so with a `-- replaces: <table>` comment line (the rule checks the create exists and sorts after the drop): code references to it are then judged against the new definition, and only a column the old table had and the new one lacks is still a read of the dropped table (DB_MIGRATION_DESTRUCTIVE); the rows of the old table lost by intent are reported as an info line. A migration already on the base unchanged is immutable (R213), so its destructive and dynamic DDL is reported as a known item, not a blocker; an entry of hfs.json `db.destructiveRulings` (the exact migration, the exact objects, a reason and the date) accepts those objects outside a contract migration only while the same proof finds them unreferenced, else DB_DESTRUCTIVE_RULING_UNPROVEN."
    failureCodes:
      - DB_EXTENSION_ALLOWED
      - DB_MIGRATION_DESTRUCTIVE
      - DB_DESTRUCTIVE_RULING_UNPROVEN
      - HFS_SEED_PII
      - DB_VAULT_WRITE
    enforcers:
      - {kind: hfs, id: db-config-ext}
      - {kind: hfs, id: db-migration-destructive}
  - id: R260
    code: BE_JWT_ALG_PINNED
    law: Every back-end JWT verifier pins a literal subset of asymmetric algorithms and reads its issuer from typed configuration; it binds the principal by an audience read from typed configuration (an OIDC client such as Keycloak, or the app's own Passport tokens) or, where every token of the issuer shares one audience (Supabase-style), admits only the authenticated role.
    failureCodes:
      - BE_JWT_ALG_PINNED
    enforcers:
      - {kind: eslint-be, id: jwt-alg-pinned}
      - {kind: machine, id: jwt-policy}
  - id: R261
    code: BE_CORS_ALLOWLIST
    law: Every back-end API declares an exact CORS origin allowlist, applies the http-security middleware, hides x-powered-by and trusts an explicit proxy hop count.
    failureCodes:
      - BE_CORS_ALLOWLIST
      - BE_SECURITY_HEADERS
      - BE_TRUST_PROXY
    enforcers:
      - {kind: eslint-be, id: cors-allowlist}
      - {kind: eslint-be, id: security-headers}
      - {kind: eslint-be, id: trust-proxy}
  - id: R262
    code: BE_READY_REAL
    law: Every back-end API serves distinct live and ready signals, readiness probes a required dependency with a bounded timeout, and the Docker HEALTHCHECK reaches the live route.
    failureCodes:
      - BE_READY_REAL
      - BE_HEALTH_SIGNALS
      - HFS_DOCKER_HEALTHCHECK_FAKE
    enforcers:
      - {kind: eslint-be, id: ready-real}
      - {kind: eslint-be, id: health-signals}
      - {kind: hfs, id: docker-health-reachability}
  - id: R263
    code: BE_WEBHOOK_SCOPE
    law: "Signed-webhook public metadata belongs only to webhook doors and declared verifiers; a delivery intake first claims its stable delivery key on the `Inbox` port (`claim`, or `claimRow` on its `EntityInbox`) and returns on a duplicate, and a webhook receipt transaction only records the inbox delivery and its outbox event. A receipt port the app declares in hfs.json sides.be.receiptPorts ({class, method, repeat, reason}: a class of the app, its method that records a delivery once, and the answer it gives a repeat, false or undefined) is held to the same contract as the Inbox claim: awaited first inside the receipt transaction, on that transaction's manager as its first argument, with an argument that comes from the delivery and no call inside its arguments, and its repeat answer returned on at once; only the declared method is the record, any other call of that class is processing. A port declared with many: true in place of repeat ({class, method, many, reason}) records a delivery of several events and answers the list of the new events only, the empty list on a repeat: its answer is bound to one const and every later statement of the receipt transaction is a for (const event of <that const>) whose body reads nothing of the delivery, of the bindings made before the claim or of the answer list, only its own bindings and the transaction's manager."
    failureCodes:
      - BE_WEBHOOK_SCOPE
      - BE_WEBHOOK_INBOX_KEY
    enforcers:
      - {kind: eslint-be, id: webhook-scope}
      - {kind: eslint-be, id: webhook-inbox-key}
  - id: R264
    code: HFS_FEATURE_LOGIC_ROLE
    law: A non-door feature-tier role declares data, types and DTO metadata only, apart from a top-level `registerEnumType` in a GraphQL transport type file.
    failureCodes:
      - HFS_FEATURE_LOGIC_ROLE
    enforcers:
      - {kind: eslint-be, id: feature-logic-role}
  - id: R265
    code: BE_COMPOSITION_UNTYPED
    law: App composition lives only in typed `compose/<area>.ts` groups identified by resolved types, never in `main.ts`, `<app>.env.ts` or `<app>.options.ts`; a group composes modules, providers, queues or schedules, or carries its area's typed catalogs (error-kind tables of `platform/errors`, message bundles of `platform/i18n`) that `compose/platform.ts` spreads into ErrorsModule and I18nModule.
    failureCodes:
      - BE_COMPOSITION_UNTYPED
    enforcers:
      - {kind: eslint-be, id: app-composition-typed}
  - id: R266
    code: STACKS_SECRET_NOT_EXTERNAL
    law: Rendered Swarm deployments use versioned external secrets, publish ports only through the declared ingress, and declare placement, healthchecks and rollout policies.
    failureCodes:
      - STACKS_SECRET_NOT_EXTERNAL
      - STACKS_SECRET_UNVERSIONED
      - STACKS_SECRET_ENV_LITERAL
      - STACKS_PORT_PUBLISHED
      - STACKS_SECOND_INGRESS
      - STACKS_DNS_UNDECLARED
      - STACKS_HOST_UNROUTED
      - STACKS_TLS_UNDECLARED
      - STACKS_PLACEMENT_MISSING
      - STACKS_HEALTHCHECK_MISSING
      - STACKS_UPDATE_POLICY_MISSING
    enforcers:
      - {kind: hfs, id: stacks-swarm}
      - {kind: hfs, id: stacks-second-ingress}
  - id: R267
    code: STACKS_RELEASE_UNDECLARED
    law: Each Swarm environment declares an immutable images lock, release pointers, health assertions and backup with a restore proof for every stateful dependency.
    failureCodes:
      - STACKS_RELEASE_UNDECLARED
      - BACKUP_UNDECLARED
      - BACKUP_PROOF_MISSING
      - STACKS_MODEL_UNAVAILABLE
    enforcers:
      - {kind: hfs, id: stacks-release}
  - id: R268
    code: HFS_SCHEDULE_UNDECLARED
    law: Every scheduler, pg_cron schedule and replicated job matches a top-level jobs declaration that invokes a named back-end CLI action.
    failureCodes:
      - HFS_SCHEDULE_UNDECLARED
    enforcers:
      - {kind: hfs, id: stacks-release}
  - id: R269
    code: HFS_DEPENDABOT_MISSING
    law: Dependabot schedules npm, Actions and Docker updates with minor-and-patch groups, CI gates on the production audit (`starci app audit`, judged against owner-approved, time-boxed exceptions, PROJECT-LINT-5; unless the app's stack declaration switches audit off, PROJECT-LINT-4), and release images carry an SBOM and provenance.
    failureCodes:
      - HFS_DEPENDABOT_MISSING
      - HFS_AUDIT_STEP_MISSING
      - HFS_SBOM_MISSING
      - AUDIT_HIGH
      - AUDIT_EXCEPTION_INVALID
      - AUDIT_EXCEPTION_EXPIRED
      - AUDIT_EXCEPTION_TOO_LONG
      - AUDIT_EXCEPTION_FIX_AVAILABLE
      - AUDIT_EXCEPTION_UNUSED
      - AUDIT_EXCEPTION_ACTIVE
      - AUDIT_REPORT_UNREADABLE
    enforcers:
      - {kind: hfs, id: supply-chain}
  - id: R270
    code: HFS_DOC_PATH_MISSING
    law: Documentation cites only existing paths, scripts, CLI verbs, declared environment keys and catalog rule ids.
    failureCodes:
      - HFS_DOC_PATH_MISSING
      - HFS_DOC_COMMAND_UNKNOWN
      - HFS_DOC_ENV_UNKNOWN
      - HFS_DOC_RULE_UNKNOWN
    enforcers:
      - {kind: hfs, id: doc-fresh}
  - id: R271
    code: HFS_RELEASE_TAG_MISMATCH
    law: A release tag is a v-prefixed semantic version equal to the package version, images are pushed under the immutable sha-<sha> tag with the release name as a guarded retag of that digest, and database deployment refuses a non-tag ref.
    failureCodes:
      - HFS_RELEASE_TAG_MISMATCH
      - HFS_DB_DEPLOY_UNGUARDED
    enforcers:
      - {kind: hfs, id: release-provenance}
  - id: R272
    code: BE_APP_BOOT_PROOF_MISSING
    law: Every lite back-end app proves its real AppModule composition by compiling the dependency graph with fixture options and infrastructure doubles, in `app check` and in the fast job of the app's CI (`starci app check --gate hfs`, whatever the wiring gate says), so a provider a domain module needs and the app root does not compose never passes tsc and the unit suite to fail at boot.
    failureCodes:
      - BE_APP_BOOT_PROOF_MISSING
    enforcers:
      - {kind: hfs, id: boot-proof}
  - id: R273
    code: HFS_COVERAGE_BELOW
    law: A supplied coverage report proves full line, function and branch coverage per back-end logic file (a logic-role file or one its slot declares) in the slot-derived measured scope, and a root package's type module, which that scope leaves out, holds types only.
    failureCodes:
      - HFS_COVERAGE_BELOW
    enforcers:
      - {kind: hfs, id: coverage-below}
  - id: R275
    code: STACKS_INGRESS_UNDECLARED
    law: Every Swarm environment declares one ingress component with a digest-pinned supported ingress image and its hosts.
    failureCodes:
      - STACKS_INGRESS_UNDECLARED
      - STACKS_INGRESS_UNKNOWN
    enforcers:
      - {kind: hfs, id: stacks-ingress}
  - id: R276
    code: STACKS_LITE_SELFHOSTED_DB
    law: Lite runs no self-hosted database or vector store, and runs Redis only when declared; that a declared Redis runs durably (one service, AOF on a named volume, no eviction) and that its sidecars keep their own storage on a declared volume is held by review, not by a check.
    failureCodes:
      - STACKS_LITE_SELFHOSTED_DB
    enforcers:
      - {kind: hfs, id: stacks-backing}
  - id: R277
    code: HFS_SECRET_PLAINTEXT_FILE
    law: A tracked secret exists only as a sops envelope under `.starcistacks/<env>/secrets/`, in every edition; a business package may also commit `packages/<pkg>/secrets/<name>.sops.yaml`, only as a valid sops document (every leaf `ENC[...]`, a `sops` block with age recipients) sealed to the recipients of its own `packages/<pkg>/.sops.yaml`.
    failureCodes:
      - HFS_SECRET_PLAINTEXT_FILE
      - HFS_PACKAGE_SECRET_NOT_SEALED
      - HFS_PACKAGE_SECRET_RECIPIENT
    enforcers:
      - {kind: hfs, id: secret-custody-only}
  - id: R278
    code: BE_REST_DOOR_EVIDENCE
    law: An api app's declared contract (graphql when absent) is its default door; in a graphql back end every REST route carries its own evidence from the closed set of door reasons the pattern lists, and a rest back end holds no GraphQL door or GraphQL platform.
    failureCodes:
      - BE_REST_DOOR_EVIDENCE
      - BE_REST_ROUTE_UNDECLARED
      - BE_REST_APP_GRAPHQL
    enforcers:
      - {kind: eslint-be, id: rest-door-needs-a-reason}
      - {kind: eslint-be, id: rest-route-declared}
      - {kind: hfs, id: rest-app-graphql}
  - id: R279
    code: BE_THIRD_PARTY_OWNER
    law: A third-party SDK outside the library allowlists is imported only by its one `integrations/<provider>` capability; a workspace package of the app itself (a folder its root `workspaces` name) is first-party source, no SDK, and what it imports is judged over its own files. `socket.io-client` is a test library.
    failureCodes:
      - BE_THIRD_PARTY_OWNER
    enforcers:
      - {kind: eslint-be, id: third-party-import-owner}
  - id: R280
    code: HFS_UNUSED_SYMBOL
    law: Every enum member, queue constant, error code and catalog key has a production consumer, and dynamic keys are declared with a reason.
    failureCodes:
      - HFS_UNUSED_SYMBOL
    enforcers:
      - {kind: hfs, id: unused-symbol}
      - {kind: hfs, id: unused-symbol-ledger}
  - id: R281
    code: BE_SPEC_FORM_ALL_ROLES
    law: Every declared logic role has a unit spec in the canon form, its subject obtained from a compiled testing module, except value roles whose spec parses the value directly.
    failureCodes:
      - BE_SPEC_FORM_ALL_ROLES
    enforcers:
      - {kind: eslint-be, id: spec-builds-with-testing-module}
      - {kind: eslint-be, id: spec-no-new-subject}
      - {kind: eslint-be, id: spec-module-definition-only-providers}
      - {kind: eslint-be, id: spec-no-module-mock}
      - {kind: eslint-be, id: spec-behavior-assertion}
      - {kind: eslint-be, id: spec-infra-double-from-kit}
      - {kind: eslint-be, id: spec-exact-values}
  - id: R282
    code: HFS_ASSET_OVERSIZE
    law: Back-end build assets stay within the `be.assets` slot budget and extension allowlist, and model weights and datasets are never tracked.
    failureCodes:
      - HFS_ASSET_OVERSIZE
      - HFS_ASSET_KIND
    enforcers:
      - {kind: hfs, id: assets}
  - id: R283
    code: HFS_APP_LEXICON
    law: Source and documentation use no word `hfs.json` `lexicon.removed` declares.
    failureCodes:
      - HFS_APP_LEXICON
    enforcers:
      - {kind: hfs, id: lexicon}
  - id: R284
    code: BE_LITE_PROOF_LANE_MISSING
    law: A lite back end proves every declared pattern through integration specs titled `<pattern>/<scenario>`.
    failureCodes:
      - BE_LITE_PROOF_LANE_MISSING
    enforcers:
      - {kind: hfs, id: proof-lane}
  - id: R285
    code: FE_SWR_OUTSIDE_FAMILY
    law: SWR runtime calls stay in the `hooks/swr` wrappers, and each back-end operation is imported only by its wrapper.
    failureCodes:
      - FE_SWR_OUTSIDE_FAMILY
      - FE_OP_OUTSIDE_SWR_HOOK
      - FE_SUBSCRIPTION_NO_SNAPSHOT
    enforcers:
      - {kind: eslint-fe, id: swr-only-in-family}
      - {kind: eslint-fe, id: operations-only-in-swr-hooks}
      - {kind: eslint-fe, id: subscription-refetches-snapshot}
  - id: R286
    code: FE_COPY_IN_CALL
    law: Validation and toast copy comes from the catalog, browser alerts are forbidden, and icons come only from the Grammar icon owner or declared brand-mark owners.
    failureCodes:
      - FE_COPY_IN_CALL
      - FE_NO_ALERT
      - FE_ICON_INLINE_SVG
    enforcers:
      - {kind: eslint-fe, id: no-copy-in-call}
      - {kind: eslint-fe, id: no-alert}
      - {kind: eslint-grammar-core, id: no-inline-svg-outside-brand-mark-leaf}
  - id: R288
    code: FE_STACK_UNLISTED
    law: Every direct front-end dependency is listed in contexts/stack/fe.yaml or declared with a reason, and every product Next app declares the catalog's core packages.
    failureCodes:
      - FE_STACK_UNLISTED
      - FE_STACK_CORE_MISSING
      - FE_STACK_FAMILY_LINT_MISSING
    enforcers:
      - {kind: hfs, id: fe-stack-allowlist}
  - id: R289
    code: BE_APP_ENV_REQUIRED
    law: Every back-end app owns a typed `<app>.env.ts` reader that `main.ts` delegates to, and `app.module.ts` only spreads the compose groups and binds app-wide guards and filters.
    failureCodes:
      - BE_APP_ENV_REQUIRED
      - BE_APP_MODULE_LIST_INLINE
    enforcers:
      - {kind: hfs, id: app-env-required}
      - {kind: eslint-be, id: app-env-required}
      - {kind: eslint-be, id: app-module-list-inline}
  - id: R290
    code: BE_PUBLIC_REASON_CLOSED
    law: "`PublicReason` is exactly Health, AuthHandshake, SignedWebhook and CatalogRead, and other access uses its own credential guard."
    failureCodes:
      - BE_PUBLIC_REASON_CLOSED
    enforcers:
      - {kind: eslint-be, id: public-reason-closed}
  - id: R291
    code: HFS_FUNCTION_BUDGET
    law: Every function, method or arrow body stays within the function line budget (ruleParams.common.functionLines).
    failureCodes:
      - HFS_FUNCTION_BUDGET
    enforcers:
      - {kind: eslint-be, id: function-line-budget}
      - {kind: eslint-fe, id: function-line-budget}
  - id: R292
    code: HFS_FEATURE_FILE_BUDGET
    law: Every feature owner stays within the feature file budget (ruleParams.common.featureFiles).
    failureCodes:
      - HFS_FEATURE_FILE_BUDGET
    enforcers:
      - {kind: hfs, id: feature-files}
  - id: R293
    code: STACK_TOOLING_REIMPLEMENTED
    law: An app does not re-implement the canon Swarm deploy tooling in its own scripts or workflows.
    failureCodes:
      - STACK_TOOLING_REIMPLEMENTED
    enforcers:
      - {kind: hfs, id: stack-tooling}
  - id: R294
    code: STACKS_DEPLOY_CONFIG_INVALID
    law: Every Swarm environment's deploy block is coherent under the stack verbs' own normalization against the real tree.
    failureCodes:
      - STACKS_DEPLOY_CONFIG_INVALID
      - STACKS_SEALED_MEMBER_PENDING
    enforcers:
      - {kind: hfs, id: stacks-deploy}
  - id: R295
    code: BE_MODULE_DEFINITION_MISSING
    law: Every NestJS module has its module definition and options files and is imported only through `register`.
    failureCodes:
      - BE_MODULE_DEFINITION_MISSING
    enforcers:
      - {kind: eslint-be, id: module-definition-required}
      - {kind: eslint-be, id: capability-module-shape}
  - id: R296
    code: CI_SECRET_SEALED
    law: A sealed CI credential copy names an explicit service credential bound to the selected product project, environment, member and key, sealed unless its service declares the open owner step that provisions it (`ownerAction.needed`); required product Sonar analysis uses sonar.enc.yaml and an app runtime key never becomes a CI credential.
    failureCodes:
      - CI_SECRET_SEALED
    enforcers:
      - {kind: hfs, id: ci-custody}
  - id: R297
    code: APP_SECRET_IN_CI
    law: No sealed key selected by an app runtime secret declaration or deploy grant appears in the CI secrets or vars.
    failureCodes:
      - APP_SECRET_IN_CI
    enforcers:
      - {kind: hfs, id: ci-custody}
  - id: R298
    code: CI_DECLARATION_DRIFT
    law: Every workflow secret and variable reference is declared in its matching CI class, and every non-optional declaration is consumed, except the names of a service whose gate the app's stack declaration switches off (PROJECT-LINT-4), which the render does not read.
    failureCodes:
      - CI_DECLARATION_DRIFT
    enforcers:
      - {kind: hfs, id: ci-custody}
  - id: R299
    code: HFS_WORKFLOW_CONTEXT
    law: GitHub Actions expressions use only contexts available at their workflow key.
    failureCodes:
      - HFS_WORKFLOW_CONTEXT
    enforcers:
      - {kind: hfs, id: workflow-contexts}
  - id: R300
    code: FE_PUBLIC_BUILD_ARG_MISSING
    law: Every front-end image receives each required `NEXT_PUBLIC_*` value through a Dockerfile ARG default or the deploy build args of every environment.
    failureCodes:
      - FE_PUBLIC_BUILD_ARG_MISSING
    enforcers:
      - {kind: hfs, id: fe-build-args}
  - id: R301
    code: CI_STANDARD
    law: App CI follows the one CI standard of packages/hfs/templates/app/ci-workflows, delivered only through the app sync; an item never requires the step of a gate the app's stack declaration switches off (PROJECT-LINT-4), which the sync renders without it.
    failureCodes:
      - CI_STANDARD
    enforcers:
      - {kind: hfs, id: ci-standard}
  - id: R302
    code: HFS_MCP_TOOLS_SNAPSHOT
    law: A back end that serves an MCP server (its source imports `@modelcontextprotocol/sdk/server`) commits its tool catalog, and a committed MCP tool catalog is the server's `tools/list` result at `be/contracts/<app>/<server>@<major>.tools.json`.
    failureCodes:
      - HFS_MCP_TOOLS_SNAPSHOT
      - HFS_MCP_TOOLS_SNAPSHOT_MISSING
    enforcers:
      - {kind: hfs, id: mcp-tools-snapshot}
  - id: R303
    code: HFS_BYPASS_MARKER
    law: "A product repository holds no bypass marker: no inline disable, type-check ignore, coverage ignore, skipped test, swallowed failure or constant false condition on a check; a job of the managed ci.yml that the app's gate declaration idles (PROJECT-LINT-4) is the render of that declaration, not a bypass."
    failureCodes:
      - HFS_BYPASS_MARKER
    enforcers:
      - {kind: hfs, id: bypass-markers}
      - {kind: hfs, id: bypass-guard}
  - id: R304
    code: BE_SCHEMA_PLACE
    law: Transport doors validate with `class-validator`, other untrusted data is read through zod schemas declared only in `<name>.schema.ts` files of modules or in a root workspace package, whose node, block and vocabulary contracts are zod schemas, and no schema of a module is shared with the front end.
    failureCodes:
      - BE_SCHEMA_PLACE
    enforcers:
      - {kind: eslint-be, id: schema-place}
      - {kind: eslint-be, id: schema-file-values-only}
  - id: R305
    code: BE_SCHEMA_BOUNDED
    law: Every zod schema is bounded by a finite positive bound on every string, collection and record, and refuses unknown or arbitrary JSON.
    failureCodes:
      - BE_SCHEMA_BOUNDED
    enforcers:
      - {kind: eslint-be, id: schema-bounded}
  - id: R310
    code: BE_MUTATION_IDEMPOTENT
    law: An `Effectful` client command carries a required bounded idempotency key and runs through the inbox inside its domain transaction, refusing a reused key with different input.
    failureCodes:
      - BE_MUTATION_IDEMPOTENT
    enforcers:
      - {kind: eslint-be, id: mutation-idempotent}
  - id: R311
    code: HFS_TEXT_CORRUPT
    law: Every message catalog and locale file is valid UTF-8 and carries no lossy re-encode marks.
    failureCodes:
      - HFS_TEXT_CORRUPT
    enforcers:
      - {kind: hfs, id: text-integrity}
  - id: R312
    code: BE_UPLOAD_BUFFERED
    law: Browser uploads go directly to storage through presigned requests of the ObjectStorage port, and no multipart upload handling exists in the back end.
    failureCodes:
      - BE_UPLOAD_BUFFERED
    enforcers:
      - {kind: eslint-be, id: no-buffered-upload}
  - id: R313
    code: FE_APP_SHELL_FRAME
    law: The selected Grammar shell owns the fixed application frame with independent navigation and content scroll, and the application layout never recreates it.
    failureCodes:
      - FE_APP_SHELL_FRAME
    enforcers:
      - {kind: eslint-grammar-core, id: app-shell-frame}
  - id: R314
    code: FE_NAVBAR_CONTROL_SIZE
    law: Navbar controls share one height and icons one size per region from the selected Grammar scale.
    failureCodes:
      - FE_NAVBAR_CONTROL_SIZE
    enforcers:
      - {kind: eslint-grammar-core, id: navbar-control-size}
  - id: R315
    code: FE_NAVBAR_CLUSTER
    law: Navbar controls appear in the order language, theme, notifications and account, each supplied by the selected Grammar.
    failureCodes:
      - FE_NAVBAR_CLUSTER
    enforcers:
      - {kind: eslint-grammar-core, id: navbar-cluster}
  - id: R316
    code: FE_APP_SHELL_BOTTOM_TABS
    law: An application keeps the selected Grammar shell's navigation model across viewports; the only bottom bar of places is the Grammar BottomNav as the compactNavigation of a WorkspaceShell (two to five places), and a hand-made bottom tab bar or a BottomNav anywhere else is refused.
    failureCodes:
      - FE_APP_SHELL_BOTTOM_TABS
    enforcers:
      - {kind: eslint-grammar-core, id: no-shell-bottom-tabs}
  - id: R317
    code: FE_NAVBAR_CREATE
    law: Create actions live on the page that owns them, never in the global navbar.
    failureCodes:
      - FE_NAVBAR_CREATE
    enforcers:
      - {kind: eslint-grammar-core, id: no-navbar-create}
  - id: R318
    code: FE_NESTED_VARIANT
    law: Apps compose the Grammar with layout-only CSS; paint and surface edges belong to the Grammar, and app styles never target Grammar internals.
    failureCodes:
      - FE_NESTED_VARIANT
      - FE_LIST_PANEL_PADDING
      - FE_GRAMMAR_LAYOUT_ONLY
      - FE_DIVIDER_FULL_BLEED
    enforcers:
      - {kind: eslint-fe, id: no-list-panel-padding}
      - {kind: eslint-fe, id: no-app-surface-paint}
      - {kind: eslint-fe, id: divider-full-bleed}
      - {kind: eslint-fe, id: selection-fill-no-check}
      - {kind: eslint-fe, id: no-grammar-internal-selector}
  - id: R319
    code: FE_BUTTON_INTENT
    law: An app Button declares an intent, never a variant; a destructive confirm lives in a confirmation dialog, a render holds at most one commit and a collection item none.
    failureCodes:
      - FE_BUTTON_INTENT
      - FE_BUTTON_INTENT_REQUIRED
      - FE_DESTRUCTIVE_CONFIRM_IN_DIALOG
      - FE_SINGLE_COMMIT_PER_RENDER
      - FE_NO_COMMIT_IN_COLLECTION_ITEM
    enforcers:
      - {kind: eslint-fe, id: button-intent-required}
      - {kind: eslint-fe, id: destructive-confirm-in-dialog}
      - {kind: eslint-fe, id: single-commit-per-render}
      - {kind: eslint-fe, id: no-commit-in-collection-item}
  - id: R320
    code: FE_CONTROL_HEIGHT
    law: Every standalone control uses the selected Grammar's default control height, larger only for a landing hero call to action, and controls of one row share one size.
    failureCodes:
      - FE_CONTROL_HEIGHT
    enforcers:
      - {kind: eslint-fe, id: control-height}
  - id: R321
    code: FE_GRAMMAR_SHIM
    law: An app imports a Grammar component where it renders it and never re-exports a Grammar export under its own name; a Grammar defect is reported to the Grammar.
    failureCodes:
      - FE_GRAMMAR_SHIM
    enforcers:
      - {kind: eslint-fe, id: no-grammar-shim}
  - id: R322
    code: FE_CHIP_LABEL_CASE
    law: The label of a status chip (a Badge, with or without its dot) starts with an uppercase letter, so every chip of an app reads in one vocabulary.
    failureCodes:
      - FE_CHIP_LABEL_CASE
    enforcers:
      - {kind: eslint-grammar-core, id: chip-label-starts-uppercase}
  - id: R323
    code: FE_PAGE_HEADER_HAND_ROLLED
    law: A page is headed by the header of Grammar's Page; PageHeader and Breadcrumbs are Page's parts and are not exported, so importing either from the Grammar composes a page head by hand, with no band, no top inset and no separator.
    failureCodes:
      - FE_PAGE_HEADER_HAND_ROLLED
    enforcers:
      - {kind: eslint-grammar-core, id: no-hand-rolled-page-header}
  - id: R324
    code: FE_PAGE_TABS_OUTSIDE_HEADER
    law: Page tabs are the header's tabs; a Tabs that is the first element of a Page body is a page tab bar drawn outside the band.
    failureCodes:
      - FE_PAGE_TABS_OUTSIDE_HEADER
    enforcers:
      - {kind: eslint-grammar-core, id: page-tabs-in-header}
  - id: R325
    code: FE_ROUTE_PAGE_OUTSIDE_PAGE
    law: A route draws exactly one Grammar Page, drawn by its page owner, the owner's pure half or the one connected block the owner renders as its root, or by the route segment layout whose owner draws a Page with header.tabs, the one Page of every route under it; that Page has nothing beside it and no second Page inside it, so a page owner under such a layout draws its body only; a page owner that draws no UI, sits under such a layout, or is mounted only under the (auth) route group whose layout frames it, needs none; PageHeader and PageContainer are Page's parts and are not exported, so importing either from the Grammar re-decides the inset and rhythm Page owns.
    failureCodes:
      - FE_ROUTE_PAGE_OUTSIDE_PAGE
    enforcers:
      - {kind: eslint-grammar-core, id: route-page-is-one-page}
  - id: R326
    code: BE_AI_KEY_CUSTODY
    law: An upstream model provider key variable is named only inside the ai-router gateway's custody owner `integrations/ai-gateway`; every other file reaches a model through the gateway with a virtual key.
    failureCodes:
      - BE_AI_KEY_CUSTODY
    enforcers:
      - {kind: eslint-be, id: provider-key-custody}
  - id: R327
    code: BE_AI_GATEWAY_CLIENT
    law: Code builds only the `ChatOpenAI` and `OpenAIEmbeddings` clients of `@langchain/openai`, each with its `configuration.baseURL` read from the integration's options and its `apiKey` revealed from a `Secret`, so every model call goes through the ai-router gateway.
    failureCodes:
      - BE_AI_GATEWAY_CLIENT
    enforcers:
      - {kind: eslint-be, id: ai-client-through-gateway}
  - id: R328
    code: BE_AUTH_PASSPORT_OWNER
    law: "The identity libraries (@nestjs/passport, passport, passport-google-oauth20, passport-local, passport-oauth2, @nestjs/jwt, jose and bcryptjs) are the dependencies of @starci/auth, the one sign-in package of both editions, and are imported by no app file; @starci/auth and @starci/auth/server are imported only by integrations/passport (lite), @starci/auth/oidc only by integrations/keycloak (full, which also composes the issuer presets, the GitHub Actions CI attestation among them), @starci/auth/contracts and @starci/auth/testing only by those two glues, and the retired @starci/auth-oidc by no app file. bcrypt and every Supabase client are owned nowhere."
    failureCodes:
      - BE_AUTH_PASSPORT_OWNER
    enforcers:
      - {kind: eslint-be, id: infra-import-owner}
  - id: R329
    code: BE_AUTH_JWT_OWN_JWKS
    law: "A lite back-end principal comes only from the app's own access token, verified by @starci/auth (EdDSA pinned, issuer and audience checked, a local key set that may hold several keys), never from a remote JWKS, a token decoded without its signature check, a jwtVerify call in the app or a body claim."
    failureCodes:
      - BE_AUTH_JWT_OWN_JWKS
    enforcers:
      - {kind: machine, id: own-jwks-principal}
      - {kind: eslint-be, id: own-jwks-only}
  - id: R330
    code: BE_AUTH_REFRESH_COOKIE
    law: A refresh token travels only in the httpOnly, Secure cookie that @starci/auth sets, rotates (with a reuse grace window and reuse detection) and clears; no app file writes that cookie, and the token never appears as a field of a request or response body.
    failureCodes:
      - BE_AUTH_REFRESH_COOKIE
    enforcers:
      - {kind: eslint-be, id: refresh-token-cookie-only}
  - id: R331
    code: BE_STORAGE_OWNER
    law: "The S3 client libraries (@aws-sdk/client-s3, @aws-sdk/s3-request-presigner) are the dependencies of @starci/object-storage and are imported by no app file; @starci/object-storage is imported only by `integrations/object-storage`, its one glue; minio is imported nowhere."
    failureCodes:
      - BE_STORAGE_OWNER
    enforcers:
      - {kind: eslint-be, id: infra-import-owner}
  - id: R332
    code: LITE_DB_MIGRATION
    law: A lite app's schema lives only in `db/` (`db/migrations/<ts14>_<kebab>.sql`, its archive, the managed `db/bootstrap.sql`; any other SQL under `db/` is refused); the tree holds no `supabase/` folder and no SQL outside `db/` but the `sql/` entries of its seed levels in `.starcistacks/` (R375).
    failureCodes:
      - LITE_DB_MIGRATION
    enforcers:
      - {kind: hfs, id: lite-db-path}
  - id: R333
    code: BE_ENTITY_SCHEMA_DRIFT
    law: Every TypeORM entity column of a lite app's entity list matches the schema its `db/migrations` build; `starci app db drift` applies `db/bootstrap.sql` and every migration to an empty database and compares each column; an app that declares sides.be.engineOwned also has the partitions, views, CHECKs and indexes of the engine-owned objects compared with the engine's entity manifest, both ways.
    failureCodes:
      - BE_ENTITY_SCHEMA_DRIFT
    enforcers:
      - {kind: hfs, id: db-drift}
  - id: R334
    code: BE_PERSISTENCE_NO_RAW_SQL
    law: "Lite TypeScript holds no SQL text, outside the test world. A table is read and written through its TypeORM entity on an EntityManager (domain code the injected one; specs, builders, fixtures and the test world the world's `world.db.<connection>`): find, save, update, delete, upsert, a pessimistic `lock` option, `createQueryBuilder(Entity, \"alias\")` with named parameters; never a table-name builder or a Repository. Every table a migration creates has an entity. Anything else is a database function, called through `callDbFunction` of `platform/database/database.client.ts`, which names only a function that `ruleParams.be.dbFunctions` or hfs.json `sides.be.dbFunctions` lists with a reason: a function of a migration, schema-qualified (`public.job_claim`); an extension function, schema-qualified; a pg built-in of the canon's list, bare (`pg_notify`, called in pg_catalog). `database.client.ts` alone composes SQL text (the call statement and LISTEN), from parts its validator checked; `advisoryXactLock` and `notify` are `callDbFunction` calls of built-ins there. The only other `.query(` outside the world is the pass-through of a file that `ruleParams.be.sqlPassThrough` or hfs.json `sides.be.sqlPassThrough` lists with a reason, whose text is not the app's own (the tracked seed, a customer data-source read, an outside session's setup), with a plain string first argument, never a template or a `+`. The test world `src/tests/world` may hold raw SQL, as `sql`-tagged text with numbered `$n` parameters (and `<name>.sql.ts` files), only for what neither an entity nor a listed function expresses: a privilege or row-level-security probe, catalog, cron or trigger introspection, a pgmq queue table, a lock or failure probe; in the world too plain CRUD on an application table goes through its entity, an application function through `callDbFunction`, and seeded rows come from builders (R98). No `sql` template, `*.sql.ts`, `sql`/`ident` import or other `.query(` exists anywhere else."
    failureCodes:
      - BE_PERSISTENCE_NO_RAW_SQL
    enforcers:
      - {kind: eslint-be, id: no-raw-sql}
  - id: R335
    code: BE_JOBS_SCHEDULER_OWNER
    law: "Recurring work is a tick of platform/jobs: only its job-tick.service.ts and jobs.module.ts import @nestjs/schedule or cron, no file uses a cron, interval or timeout decorator, and the tick service takes advisoryXactLock and claims the tick's minute through job_tick_claim before it writes the outbox, so one replica enqueues each tick once per minute."
    failureCodes:
      - BE_JOBS_SCHEDULER_OWNER
    enforcers:
      - {kind: eslint-be, id: jobs-scheduler-owner}
  - id: R336
    code: BE_EVENT_BUS_LITE_SHAPE
    law: "On the lite event bus (pgmq, delivery at least once and unordered), every event payload type declares dedupeKey, the business key a consumer inbox claims as (consumer, dedupeKey), and a reactor subscribes with a *_TOPIC_QUEUE constant imported from platform/event-bus and literal options, so every subscription is static data."
    failureCodes:
      - BE_EVENT_BUS_LITE_SHAPE
    enforcers:
      - {kind: eslint-be, id: event-dedupe-key}
      - {kind: eslint-be, id: event-subscription-static}
  - id: R337
    code: HFS_AUTH_COOKIE_DOMAIN_MISSING
    law: "In a lite app whose api uses the skeleton's passport (a tracked src/modules/integrations/passport/passport.config.ts), a docker-swarm environment whose rendered stack serves the web and the api on different hosts gives the api an AUTH_COOKIE_DOMAIN: a declared value in services.api.environment, a row of the environment's runtime/env/KEYS.md or a key sealed under its secrets/. Otherwise the refresh cookie is host-only on the api host, is absent from the Cookie header the web server forwards to the api, the api refuses the session and the user loops back to sign-in. The hosts are read from the rendered stack (web: NEXT_PUBLIC_SITE_URL, AUTH_WEB_ORIGIN, deploy.verify.http, HTTP_SECURITY_ALLOWED_ORIGINS; api: AUTH_JWT_ISSUER, GOOGLE_CALLBACK_URL, NEXT_PUBLIC_API_URL, deploy.verify.http), ports ignored, an unknown host is not judged. The finding names both hosts and their common parent domain as the value to set. A declared AUTH_COOKIE_DOMAIN that is not a bare domain (no scheme, port, path, leading dot or IP) or is not a parent of the web and the api hosts is a finding too. Same host: no key is required."
    failureCodes:
      - HFS_AUTH_COOKIE_DOMAIN_MISSING
    enforcers:
      - {kind: hfs, id: stacks-auth-cookie-domain}
  - id: R338
    code: FE_GENERATED_ART_OUTSIDE_FRAME
    law: Generated art, a .webp or .png under the public /images/ tree, renders only through Grammar's Mascot (the character size scale sm, md, lg, hero) or inside a MediaFrame; a bare Image, img or other src-taking element drawing it takes whatever box its page gives.
    failureCodes:
      - FE_GENERATED_ART_OUTSIDE_FRAME
    enforcers:
      - {kind: eslint-grammar-core, id: generated-art-in-mascot-or-media-frame}
  - id: R339
    code: FE_MASCOT_ASSET_SLOT_MISSING
    law: Every Grammar Mascot names its assetSlot (a non-empty value), tying the rendered art to the asset workflow's request; an element with a spread attribute is not judged.
    failureCodes:
      - FE_MASCOT_ASSET_SLOT_MISSING
    enforcers:
      - {kind: eslint-grammar-core, id: mascot-asset-slot-required}
  - id: R340
    code: FE_RAISED_SURFACE_IN_SURFACE
    law: 'A card never stands inside another card; a SurfaceCard that another SurfaceCard of the same file encloses is refused. A white Pane surface, Drawer, Dialog, AlertDialog or Popover may hold an object card, drawn as everywhere: a 1px --border edge and no shadow (BOUNDARY-6). The Grammar throws the card-in-card refusal in development. Across files the whole-program rule closes it (R356).'
    failureCodes:
      - FE_RAISED_SURFACE_IN_SURFACE
    enforcers:
      - {kind: eslint-grammar-core, id: no-raised-surface-in-surface}
  - id: R341
    code: FE_FREESTYLE_REASON_MISSING
    law: A Grammar Freestyle region, the one sanctioned place where an app writes its own plain elements and CSS because no Grammar component fits, names its reason, a non-empty string literal saying why. The rules that judge hand-written elements, classes, styles and generated art leave the raw elements of a Freestyle subtree alone; a Grammar component inside it is judged as before. An element with a spread attribute is not judged.
    failureCodes:
      - FE_FREESTYLE_REASON_MISSING
    enforcers:
      - {kind: eslint-grammar-core, id: freestyle-has-reason}
  - id: R342
    code: BE_ENTITY_EXTENDS_BASE
    law: "An @Entity class does not repeat the columns every table shares: a database-set created_at or updated_at (CreateDateColumn, UpdateDateColumn, or a Column on those names with insert false, update false or a default) and, beside both, the generated uuid id are inherited from AbstractEntity or UuidAbstractEntity of @modules/platform/database (BE-PERSISTENCE-3). A table whose timestamps the application sets, or that lacks one, extends nothing; the base file platform/database/abstract.entity.ts is exempt."
    failureCodes:
      - BE_ENTITY_EXTENDS_BASE
    enforcers:
      - {kind: eslint-be, id: entity-extends-base}

  - id: R343
    code: HFS_CHECK_CACHE_FORGED
    law: An app's committed check cache (.starcistacks/cache/) is trusted in CI only as it stands at the trusted base; a record whose key matches the tree and whose findings differ from the inherited or computed result is HFS_CHECK_CACHE_FORGED (an error finding), a touched key without a current record is HFS_CHECK_CACHE_STALE and a missing cache is HFS_CHECK_CACHE_MISSING (both report-only warnings in CI); every push carries the warm cache a real run on its tree writes, refused at the pre-push hook as HFS_CHECK_CACHE_UNWARMED (a cache that run had to change, or uncommitted cache files; the pristine first commit, a root commit that carries no cache as `starci app scaffold` records it, pushes no record and is not refused) or HFS_CHECK_CACHE_UNPORTABLE (a host whose fingerprint is not portable), and a cache file over the limit a push may carry (STARCI_CACHE_FILE_MAX_MB, 90 MB) is HFS_CHECK_CACHE_FILE_TOO_LARGE, an error finding, while a run splits its records into files under 32 MB; and the release gate, which trusts the warm cache, is refused HFS_CHECK_CACHE_VERIFY_LOCKED while the newest nightly verify of the default branch is red or cannot be read.
    failureCodes:
      - HFS_CHECK_CACHE_FORGED
      - HFS_CHECK_CACHE_STALE
      - HFS_CHECK_CACHE_MISSING
      - HFS_CHECK_CACHE_UNWARMED
      - HFS_CHECK_CACHE_UNPORTABLE
      - HFS_CHECK_CACHE_FILE_TOO_LARGE
      - HFS_CHECK_CACHE_VERIFY_LOCKED
    enforcers:
      - {kind: hfs, id: check-cache}
  - id: R344
    code: BE_AI_VIRTUAL_KEY
    law: An app's ai-router gateway has one client key, `STARCI_AI_KEY`, and no admin token; `integrations/ai` reads exactly that secret name, and the gateway's custody owner passes no `adminToken`.
    failureCodes:
      - BE_AI_VIRTUAL_KEY
    enforcers:
      - {kind: eslint-be, id: ai-virtual-key-name}
  - id: R345
    code: FE_PANE_GRID_CHILD_NOT_PANE
    law: "A child of a Grammar PaneGrid is a literal Pane element, written directly or returned by a conditional (`cond ? <Pane/> : null`, `cond && <Pane/>`) or a `.map`; a wrapper component, a raw element, a fragment or a variable is refused, because PaneGrid places each child by the area of a Pane and drops the rest, leaving its cell blank. A Freestyle subtree leaves the raw elements inside it alone."
    failureCodes:
      - FE_PANE_GRID_CHILD_NOT_PANE
    enforcers:
      - {kind: eslint-grammar-core, id: pane-grid-children}
  - id: R346
    code: FE_PANE_CHILD_NOT_SECTION
    law: "A Grammar Pane holds PaneSection elements or one nested PaneGrid; a raw element, or a Grammar component other than PaneSection, PaneGrid and Freestyle, placed directly in a Pane skips the inset the pane publishes to its bands. A project component is judged in its own file, and a Freestyle subtree leaves its raw elements alone."
    failureCodes:
      - FE_PANE_CHILD_NOT_SECTION
    enforcers:
      - {kind: eslint-grammar-core, id: pane-children}
  - id: R347
    code: FE_PANE_SECTION_PADDING
    law: "The outermost element a Grammar PaneSection renders, and the root of a same-file component returned as its child, carries no padding or margin utility (`p-*`, `px-*`, `py-*`, `ps/pe/pt/pb/pl/pr-*`, `m-*`, `mx/my/ms/me/mt/mb/ml/mr-*`, their negative forms, or an arbitrary padding or margin property; zero and auto values place or reset and are not one), because the Pane owns the content inset and the section applies it. A Freestyle subtree leaves its raw elements alone."
    failureCodes:
      - FE_PANE_SECTION_PADDING
    enforcers:
      - {kind: eslint-grammar-core, id: no-pane-section-padding}
  - id: R348
    code: FE_PANE_GRID_FRAME
    law: "A Grammar PaneGrid is the one child of `Page chrome=\"panes\"`, written there as a PaneGrid element, or stands inside a Pane; a PaneGrid drawn in a SurfaceCard of any kind or a Page of another chrome re-decides the frame and the bottom edge that Page owns, and `Page chrome=\"panes\"` holding anything but one written PaneGrid element (a wrapper element, a component that renders the grid, a fragment, a variable, a condition) throws PAGE_PANES_CHILD_NOT_PANE_GRID at run time. A grid whose frame lives in another file is judged where the frame is, and a Freestyle subtree is not judged."
    failureCodes:
      - FE_PANE_GRID_FRAME
    enforcers:
      - {kind: eslint-grammar-core, id: pane-grid-page}
  - id: R349
    code: FE_HAND_BUILT_PANES
    law: "A multi-pane frame is a Grammar PaneGrid of Panes, which draws the dividers between panes; a vertical Divider used as a column seam (among the plain columns of a flex row, or anywhere inside a SurfaceCard composition=\"joined\") and a joined SurfaceCard that holds a flex row of two or more plain columns are a pane frame drawn by hand and are refused. A short vertical separator between controls and a row whose classes cannot be read in the file are not judged."
    failureCodes:
      - FE_HAND_BUILT_PANES
    enforcers:
      - {kind: eslint-fe, id: no-hand-built-panes}

  - id: R350
    code: FE_SPACING_UTILITY
    law: "Every spacing value is the Grammar's, on its one scale 0 4 8 12 24 32 (16 is the card's own inset alone, the value of --grammar-inset-card, never a gap): an app names the relation between the blocks it places through a role prop (Stack and Cluster gap identity, inline, row, section or region; Grid kind cards, form or main-rail; PaneSection; Page) and writes no padding, margin, gap or space utility and no arbitrary spacing value in a class string; a Grammar stylesheet writes no spacing length off the scale and no fluid spacing value (the package's own `starci-grammar/spacing-scale`, run by its `npm test`)."
    failureCodes:
      - FE_SPACING_UTILITY
      - FE_SPACING_OFF_SCALE
    enforcers:
      - {kind: eslint-fe, id: no-spacing-utility}
      - {kind: stylelint, id: spacing-scale}

  - id: R351
    code: FE_TABLE_IN_CARD
    law: "A DataTable is not placed inside a SurfaceCard, on the page or in a pane: plain rows with a few facts are a Section kind=list with its title and its caption, and a table is a Section holding the DataTable, with no card around it. The rule reads the JSX of the file: a DataTable enclosed by a SurfaceCard element, or rendered by a component of the same file that a SurfaceCard encloses."
    failureCodes:
      - FE_TABLE_IN_CARD
    enforcers:
      - {kind: eslint-fe, id: no-table-in-card}

  - id: R352
    code: FE_COMMAND_FILLS_HEADER
    law: "A page or pane command hugs its label and sits at the end of its header row: a Grammar Button with width=\"fill\" in the actions of a Page header, the labelEnd of a SurfaceCard or the action of a Section is refused; width=\"fill\" is for a form submit, an auth panel and a phone action bar, which a file cannot show and the rule does not judge."
    failureCodes:
      - FE_COMMAND_FILLS_HEADER
    enforcers:
      - {kind: eslint-fe, id: no-fill-command-in-header}

  - id: R353
    code: FE_TAG_GROUP_SELECTION
    law: "A TagGroup holds values the user entered, to remove or to order, and has no selection: selectionMode, selectedIds, defaultSelectedIds and onSelectionChange on it are refused. Peer values that filter a collection that stays in place are Tabs kind=\"filter\"."
    failureCodes:
      - FE_TAG_GROUP_SELECTION
    enforcers:
      - {kind: eslint-fe, id: no-selectable-tag-group}

  - id: R354
    code: FE_HEADING_ABOVE_CARD
    law: "A card has a label by design, so a heading over it is wrong: a Section (not kind=\"list\") whose only child is one SurfaceCard, and a card whose ariaLabel is the Section title, are refused; the title moves to the label, the count to fact, the action to labelEnd and a note to the card's note. Several cards under one Section stay legal."
    failureCodes:
      - FE_HEADING_ABOVE_CARD
    enforcers:
      - {kind: eslint-fe, id: no-heading-above-card}

  - id: R355
    code: FE_SURFACE_CARD_KIND
    law: "A SurfaceCard is one component whose kind the compiler checks, and what a kind draws is not drawn by hand around it: a card of the body kind (the default) holds no raw ul, ol, li or dl, no Divider, and no Heading standing as a second title, and a Section whose only child is one SurfaceCard frames one subject twice. Rows are a Section kind=list (a list is never a card), key figures a Section kind=figures, a table a Section holding a DataTable, a disclosure list a Section holding a DisclosureList; the card's title is its label and its commands are its one `actions` band."
    failureCodes:
      - FE_SURFACE_CARD_KIND
    enforcers:
      - {kind: eslint-grammar-core, id: surface-card-kind}

  - id: R356
    code: FE_SURFACE_NESTING
    law: "Across files, a card is not drawn inside a card (a white Pane surface or overlay hosts cards), a DataTable not inside a card, a PaneGrid stands only in Page chrome=\"panes\" or a Pane, a Section or Heading never holds just one card, and a labelled card is not repeated in the peer-card layout Grid kind=\"cards\"."
    failureCodes:
      - FE_SURFACE_NESTING
    enforcers:
      - {kind: machine, id: surface-nesting}
  - id: R357
    code: FE_TEXT_BLOCK
    law: "Text holds a run of words; a block component or element inside it is refused."
    failureCodes:
      - FE_TEXT_BLOCK
    enforcers:
      - {kind: eslint-grammar-core, id: text-inline-only}
  - id: R358
    code: FE_TEXT_HEADING
    law: "A strong Text that only titles the blocks after it is a hand heading; use a Section title, a card label or Heading."
    failureCodes:
      - FE_TEXT_HEADING
    enforcers:
      - {kind: eslint-grammar-core, id: no-text-heading}
  - id: R359
    code: FE_ONE_HIGHLIGHT
    law: "A render states one highlighted thing; a second isHighlight is refused."
    failureCodes:
      - FE_ONE_HIGHLIGHT
    enforcers:
      - {kind: eslint-grammar-core, id: one-highlight-per-render}
  - id: R361
    code: FE_RENDER_PROP_ACROSS_SERVER
    law: "A function is not handed from a server file to a client component; pass data, or move the callback into the client branch that owns the interaction."
    failureCodes:
      - FE_RENDER_PROP_ACROSS_SERVER
    enforcers:
      - {kind: machine, id: render-prop-across-server}
  - id: R362
    code: FE_GRAMMAR_TIER_STATE
    law: "In the Grammar package a leaf and a composite hold no useState, useReducer or effect, and a component's own props and its ReactNode slots stay inside its tier's budget (leaf 8, branch 12, composite 12, frame 10 props; 3 slots). Both run as counting rules: their findings are the tier refactor list."
    failureCodes:
      - FE_GRAMMAR_TIER_STATE
      - FE_GRAMMAR_PROP_BUDGET
    enforcers:
      - {kind: grammar-lint, id: tier-state}
      - {kind: grammar-lint, id: prop-budget}
  - id: R363
    code: FE_GRAMMAR_LITERAL
    law: "A Grammar component holds no hardcoded colour, length, utility class or numeric style value (`no-literal-look`); its stylesheets read named roles and ramps."
    failureCodes:
      - FE_GRAMMAR_LITERAL
    enforcers:
      - {kind: grammar-lint, id: no-literal-look}
  - id: R366
    code: FE_LABEL_IN_GRID
    law: "A card with a label heads a section and draws the label outside its material; a peer you recognise and open names itself inside, beside its mark. A SurfaceCard with a label repeated in a Grid kind=cards (two or more as direct children, or one written in a .map) is refused: it is a tile (SurfaceCard kind=tile with name, mark, description, badge and action), or, when the peers are compared by a fact, one Section kind=list."
    failureCodes:
      - FE_LABEL_IN_GRID
    enforcers:
      - {kind: eslint-grammar-core, id: no-label-in-grid}

  - id: R367
    code: FE_SWR_DEFAULT_ARRAY
    law: "A loading state is drawn from the page's own reads: a read folded to [] also returns its isLoading, a slot never takes another slot's loading or error, a background refresh never drives a loading flag, a placeholder is not the ready data emptied, and an app draws no skeleton by hand: the Grammar components draw their loading structure from `isLoading`."
    failureCodes:
      - FE_SWR_DEFAULT_ARRAY
      - FE_FOREIGN_SLOT_STATUS
      - FE_VALIDATING_AS_LOADING
      - FE_PLACEHOLDER_OBJECT
      - FE_HAND_SKELETON
    enforcers:
      - {kind: eslint-fe, id: no-swr-default-array}
      - {kind: eslint-fe, id: no-foreign-slot-status}
      - {kind: eslint-fe, id: no-validating-as-loading}
      - {kind: eslint-fe, id: no-placeholder-object}
      - {kind: eslint-fe, id: no-hand-skeleton}
  - id: R368
    code: HFS_EXPLICIT_EXPORT_SURFACE
    law: "An exported declaration states its type where it is exported: the return type of an exported function, the type of an exported variable and the type of its parameters are written, not inferred from a body or from other files, because the isolated declaration emit must be able to write the file's surface alone. A component that returns only JSX is explicit. Each export that cannot be written is reported at its place with what to annotate, in a front-end and a back-end file alike."
    failureCodes:
      - HFS_EXPLICIT_EXPORT_SURFACE
    enforcers:
      - {kind: eslint-fe, id: explicit-export-surface}
      - {kind: eslint-be, id: explicit-export-surface}
  - id: R369
    code: FE_DIRECTIVE_FIRST
    law: "A `use client` or `use server` directive is the first statement of its module, above every import: below another statement it is an expression that does nothing (Prettier writes it as a parenthesised string) and next build refuses the file."
    failureCodes:
      - FE_DIRECTIVE_FIRST
    enforcers:
      - {kind: eslint-fe, id: directive-first}
  - id: R372
    code: STACKS_LOCAL_CONFIG_INVALID
    law: Every docker-compose environment declares a coherent `local` block under the dev verbs' own normalization, and a lite app declares one such dev environment, so `starci app stack up --env dev` has something to run.
    failureCodes:
      - STACKS_LOCAL_CONFIG_INVALID
      - STACKS_DEV_UNDECLARED
    enforcers:
      - {kind: hfs, id: stacks-local}
  - id: R374
    code: STACKS_CODE_BIND_MOUNT
    law: A service the app customises runs from an image built out of `.starcistacks/images/<name>/` (a Dockerfile whose every FROM is digest-pinned; when the harness owns a StarCi fork image for that service the final stage is FROM it, held by review), the same image in every environment (the folder build, or a project-owned reference `<project>` or `<project>-<name>` as the managed images workflow publishes it); no stack or compose file bind-mounts code, plugins or scripts into a service container (data volumes, secrets, and read-only plain config data files stay allowed).
    failureCodes:
      - STACKS_CODE_BIND_MOUNT
      - STACKS_IMAGE_BASE_UNPINNED
      - STACKS_IMAGE_ENV_DIVERGES
    enforcers:
      - {kind: hfs, id: stacks-service-images}
  - id: R375
    code: HFS_SEEDS_SHAPE
    law: Seed data lives only in the seed levels of `.starcistacks/`, where `seeds/` is applied in every environment first and `<env>/seeds/` in the one environment the stack declaration names `<env>`; each level is a `seeds.yaml` manifest (schema starci/seeds@1) whose entries list every file of its `sql/`, `data/` and `files/` folders; a seed is never a migration (no statement that creates, alters, drops, truncates, grants, revokes or comments on an object), never custody, a data document validates against the schema its entry names, a level a production environment applies holds no test data but the one test account an environment declares (a test-account entry with its reason), and a document names a secret only as a reference to a sealed seeds-<name> member of its environment.
    failureCodes:
      - HFS_SEEDS_SHAPE
      - HFS_SEED_MANIFEST
      - HFS_SEED_DDL
      - HFS_SEED_DATA_SCHEMA
      - HFS_SEED_TEST_DATA
      - HFS_SEED_SECRET_REF
    enforcers:
      - {kind: hfs, id: seeds-shape}
  - id: R376
    code: HFS_BOOT_LOGGER_SILENCED
    law: "A back-end app root boots loudly: its `be/apps/<app>/src/main.ts` never hands Nest `logger: false` (NestFactory or nest-commander's CommandFactory), so a provider a module needs and the root does not compose, or any other bootstrap failure, is printed on stderr and exits non-zero instead of ending every boot or CLI command silently; the main passes the app's logger and an error handler that prints and exits non-zero."
    failureCodes:
      - HFS_BOOT_LOGGER_SILENCED
    enforcers:
      - {kind: hfs, id: boot-logger}
  - id: R377
    code: BE_FLOW_FAILURE_SWALLOWED
    law: "Every job and saga flow runs itself again after a failure of any kind: a processor, a job step, a saga step or compensation, a message consumer and a domain method that takes a `ClaimedJob` never catch a failure without rethrowing or parking it (feature and domain code never catches to wait, loop, retry, count or swallow), and no back-end source sets BullMQ's `removeOnFail` to delete failed jobs (`true`, a bare count, an unreadable value), while a bounded retention of the broker copy (an object literal naming `age` or `count`), `false` and a type member that only declares the option are accepted, the parked row being the durable failure; the runner classifies the failure (`classifyFailure`), retries a transient one on the flow's declared ladder and ends any other as a dead letter, parked `failed_awaiting_fix` with one item for a person per park episode until a resume, so no flow ends silently."
    failureCodes:
      - BE_FLOW_FAILURE_SWALLOWED
    enforcers:
      - {kind: hfs, id: flow-failure}
  - id: R378
    code: HFS_BRANCH_PROFILE_INVALID
    law: "An app's branch profile (`branches` of .starcistacks/application-stacks.yaml) lowers only the polish gates lint, sonar and codecov, to report or off, on a branch, or a branch pattern (`ui/*`: a literal first segment, never release/, `*` any characters but `/`), policy/loosening.yaml branchProfiles allows; the safety gates hfs, types, wiring, db, secrets, format and test block on every branch, and the default branch (main, master or ci.github.defaultBranch) is never declared, by its name or by a pattern that matches it, and always runs the full gate, as does a pull request into it; a refused profile lowers nothing."
    failureCodes:
      - HFS_BRANCH_PROFILE_INVALID
    enforcers:
      - {kind: hfs, id: branch-profile}
  - id: R379
    code: LINT_RATCHET_RAISED
    law: "On a branch whose profile runs lint as report, a commit never adds lint findings to a file it touches: each touched source file has no more ESLint error findings than at the base (the parent commit for the pre-commit hook, the merge-base with the pushed range or the remote branch, else HEAD^, for the pre-push hook and CI) and a new file has none, judged by the lint records of the base commit's committed cache and of the run when both hold a file and no rule rose, else by linting both versions of the touched files through the side's installed config in bounded children; the findings a file already carried stay report-only, and a ratchet violation blocks at any count."
    failureCodes:
      - LINT_RATCHET_RAISED
    enforcers:
      - {kind: hfs, id: lint-ratchet}
  - id: R380
    code: FE_GROUPED_CHOICE_CONTROL
    law: "The Grammar draws no group of attached buttons: a `ButtonGroup`, `FilterButtonGroup` or `SegmentedControl` in product source is refused and the message names the replacement by meaning, `Tabs` to switch a view or filter a list (`kind=\"filter\"`), `ChoiceChips` or `RadioGroup` to choose a value of a form, separate `Button`s or a `DropdownMenu` for actions. The three components stay exported and deprecated for one release."
    failureCodes:
      - FE_GROUPED_CHOICE_CONTROL
    enforcers:
      - {kind: eslint-grammar-core, id: no-grouped-choice-controls}
  - id: R381
    code: HFS_EXT_INVALID
    law: "A project adds its own laws only in its ext/ folder at the app root, declared in `ext/manifest.json` (`starci/project-ext@1`, with the extension API version it targets): every rule carries an id, a finding code, a severity, its doc, the app-relative globs it applies to and exactly one engine (a machine rule of ext/hfs/ the app check runs, or an ESLint rule of ext/lint/ the canon factories load), and every project check of ext/checks/ is declared there too (R402); the app check loads and runs them on every run; an extension only adds, so a rule or manifest with any other key, a code the harness reports, an id or code declared twice, a declared file that is not there, a rule file no rule declares, a rule that throws, a finding without a path or a manifest of another API version refuses the extension, which then lends nothing while the check is red; its findings go through the harness's policy (a machine rule and a project check block like hfs, an ESLint rule follows the lint gate, its branch profile and the ratchet)."
    failureCodes:
      - HFS_EXT_INVALID
      - HFS_EXT_API_MISMATCH
    enforcers:
      - {kind: hfs, id: project-ext}
  - id: R382
    code: HFS_PACKAGE_SLOT_UNPLACED
    law: "A root workspace package whose slots the project's ext/manifest.json declares (packages, by the package's folder) is held to them as the be and fe sides are held to theirs: every file below its src/ belongs to a declared slot (unless closed is false), each instance of a folder slot holds every file the slot requires and nothing its allows leave out, and the declaration itself is readable; its coverage follows the slots, every file measured at 100 per file but the barrels, the type files and a slot that opts out with coverage none and its reason; a slot names the canon that judges it (lint be or fe): the packages lint hands a lint fe slot to the front-end canon and the Grammar lint, the first slot that holds a file decides, every .tsx file is the front end's, and no folder name of a package is known to the harness. A package's own slots.yaml is read for one more minor, with a warning, for a package the manifest does not declare."
    failureCodes:
      - HFS_PACKAGE_SLOT_UNPLACED
      - HFS_PACKAGE_SLOT_MISSING
      - HFS_PACKAGE_SLOT_DISALLOWED
      - HFS_PACKAGE_SLOTS_INVALID
      - HFS_PACKAGE_SLOTS_MOVED
    enforcers:
      - {kind: hfs, id: package-slots}
  - id: R383
    code: CI_PARITY_STEP_FAILED
    law: "A whole `starci app check` runs every command of the app's managed CI that no other family runs, as CI runs it, so a green run is not followed by a red CI on one of them: the build and audit families read their commands from the app's rendered .github/workflows/ci.yml (the fast job's production dependency audit and typecheck script, the build job's `npm run build:be`, each `build fe` step, a next build per front-end app with its own SWC cache root under the app's tool cache, and the database migration checks, `db:lint` and `app db drift`, which need Docker or an empty `--db-url-env` database and are reported as the warning CI_PARITY_DB_SKIPPED where the host has neither), and CI's coverage step (`starci app coverage verify`) runs on the lcov the test family merged from its records; a step that fails is CI_PARITY_STEP_FAILED."
    failureCodes:
      - CI_PARITY_STEP_FAILED
    enforcers:
      - {kind: hfs, id: ci-parity}
  - id: R384
    code: FE_RENDERER_LOGIC
    law: "A renderer of a root workspace package (every `.tsx` file of its source, `packages/<pkg>/src/**/*.tsx`) holds presentation only: mapping rows to components, choosing what to show, formatting. Data computation (arithmetic between two data values, accumulation, reduce, a chain of filters and sorts, date math), a domain comparison between two data values and a mutation outside a declared action (a write to a prop, an in-place array mutator on data, fetch, storage) live in a measured .ts module the renderer calls; the renderer itself is outside coverage."
    failureCodes:
      - FE_RENDERER_LOGIC
    enforcers:
      - {kind: eslint-fe, id: renderer-presentation-only}
  - id: R386
    code: CI_PARITY_SONAR_SCAN_FAILED
    law: "A whole `starci app check` runs the app's CI sonar job against the app's own Sonar server: the scanner (`@sonar/scan`) with the app's `sonar-project.properties` (project key, sources, exclusions, coverage and lint-report paths), the server and token custody of its stack declaration (`services.sonar`, the token opened from its sealed secrets), and the quality gate the server holds for the project, read from the server after the analysis. The analysis never overwrites the project's own: a server with branch support receives it as the branch `local/<user>`, a server without (Community) as the derived project `<projectKey>-local`, created with the main project's visibility and bound to the main project's quality gate when the token may. A scanner that fails is CI_PARITY_SONAR_SCAN_FAILED and a red gate or a failed compute-engine task is CI_PARITY_SONAR_GATE_FAILED, both errors; a missing token, an unreachable server, a token without the permission it needs or an unreadable verdict is the warning CI_PARITY_SONAR_SKIPPED, never a green. An app with no `sonar-project.properties` or no Sonar service gets an info line. The scan runs after lint and coverage are green; a green verdict is kept in the untracked tool cache by the scanned content and the gate's conditions, so an unchanged tree is not scanned again (`--fresh` scans again)."
    failureCodes:
      - CI_PARITY_SONAR_SCAN_FAILED
      - CI_PARITY_SONAR_GATE_FAILED
      - CI_PARITY_SONAR_SKIPPED
    enforcers:
      - {kind: hfs, id: ci-sonar-scan}
  - id: R387
    code: LINT_NEW_CODE_FINDING
    law: "On a branch whose profile reports lint or sonar, a profile lowers old debt only and never new code: an ESLint error finding on a line the branch changed since its merge-base with main (the diff the Sonar new-code prediction reads) is a blocking LINT_NEW_CODE_FINDING at any count while a finding on an untouched line stays report-only, and the predicted new-code coverage of the changed lines below the minimum `newCode.coverage.minPercent` of the Sonar gate main enforces is a blocking COVERAGE_NEW_CODE_BELOW; the Sonar server's quality gate and the Codecov upload stay report-only, the lint ratchet (R379) stays, and main always runs the full gate."
    failureCodes:
      - LINT_NEW_CODE_FINDING
      - COVERAGE_NEW_CODE_BELOW
    enforcers:
      - {kind: hfs, id: new-code}
  - id: R388
    code: BRANCH_MAIN_NOT_ON_DEV
    law: "An app repository has exactly two long-lived branches, main and dev: main is released on git, moves only by a release (the annotated v* tag through `release push`) and only by fast-forward to a commit on dev; dev is the working branch, forked from main and always at or ahead of it, so main is always an ancestor of dev and the two never diverge; lane and feature branches fork from dev and merge back into it, and nobody commits on main directly. The managed pre-push hook refuses a push of main whose commit is not reachable from dev, locally and on the remote (BRANCH_MAIN_NOT_ON_DEV), or is not the checked-out HEAD the hook's check judges (BRANCH_MAIN_NOT_CHECKED_OUT), and a push of dev that deletes it or does not contain main (BRANCH_DEV_NOT_ON_MAIN); a push of main or a release tag runs the full app check whatever branch is checked out, and a whole app check warns HFS_DEV_BRANCH_MISSING when the repository has no dev. The harness repository is no app and has neither."
    failureCodes:
      - BRANCH_MAIN_NOT_ON_DEV
      - BRANCH_DEV_NOT_ON_MAIN
      - BRANCH_MAIN_NOT_CHECKED_OUT
      - HFS_DEV_BRANCH_MISSING
    enforcers:
      - {kind: hfs, id: app-branches}
      - {kind: hfs, id: dev-branch}
  - id: R07
    code: HFS_AGENT_DATA_TRACKED
    law: "`.starciwork` holds product records only; agent and session data never lives there."
    failureCodes:
      - HFS_AGENT_DATA_TRACKED
    enforcers:
      - {kind: hfs, id: agent-data-tracked, status: planned}
  - id: R09
    code: HFS_IDENTITY_CUSTODY
    law: "An identity points its secret at `secrets/identity-<slug>.enc`, and UAT chooses an identity by role."
    failureCodes:
      - HFS_IDENTITY_CUSTODY
    enforcers:
      - {kind: hfs, id: identity-custody, status: planned}
  - id: R385
    code: HFS_SCRIPT_ONE_OFF
    law: "`scripts/` holds the app's standing tooling; a one-off codemod or fix script is agent output and is never committed."
    failureCodes:
      - HFS_SCRIPT_ONE_OFF
    enforcers:
      - {kind: hfs, id: script-one-off, status: planned}
  - id: R389
    code: STACKS_BASE_PORT_ROLE
    law: "The host ports of a dev environment derive from its project base port: with `local.basePort` declared, the primary front end listens on base, the api on base+1, the AI gateway on base+2 and every further native process from base+3 (from base+2 when no gateway runs) up to base+79; the compose services take base+80 to base+99, the database on base+90, the mail sink's SMTP on base+91 and web UI on base+92, the object store's S3 API on base+93 and console on base+94; and every compose file publishes its host ports from `local.ports`, never a literal port. An environment with native processes on ports and no `basePort` is reported as a warning, not an error. Each project owns its own hundred: the doctor fails, the scaffold refuses a named base (taking the next free hundred otherwise) and stack up refuses to start, when another registered project's hundred or declared ports overlap it; the local app check reports it as a warning."
    failureCodes:
      - STACKS_BASE_PORT_ROLE
      - STACKS_COMPOSE_PORT_ROLE
      - STACKS_COMPOSE_PORT_LITERAL
      - STACKS_BASE_PORT_UNDECLARED
      - HFS_SCAFFOLD_BASE_PORT_TAKEN
      - STACK_LOCAL_BASE_PORT_TAKEN
      - STACK_BASE_PORT_OVERLAP
    enforcers:
      - {kind: hfs, id: stacks-local}
  - id: R390
    code: BE_SAGA_SIDE_STEP_BLOCKING
    law: "A saga or graph step that only informs (an owner notice, a report, analytics, an echo into team chat) is declared non-blocking: its failure is recorded and alerted once and the run continues to its next step, and no step that answers the customer is ordered after a side step, so a failed notice never parks the run that serves the customer."
    failureCodes:
      - BE_SAGA_SIDE_STEP_BLOCKING
    enforcers:
      - {kind: hfs, id: saga-side-step, status: planned}
  - id: R391
    code: BE_SAGA_CUSTOMER_HOLDING_LINE
    law: "A run triggered by a customer message that parks or dead-letters before the customer received a reply sends the customer one holding line, in the run's locale, through the same outbound channel as the reply and claimed idempotently under the run id, so a customer is never left silent and a resume or a second park never sends it twice."
    failureCodes:
      - BE_SAGA_CUSTOMER_HOLDING_LINE
    enforcers:
      - {kind: hfs, id: saga-holding-line, status: planned}
  - id: R392
    code: BE_SAGA_INTERACTIVE_RESUME_LADDER
    law: "A flow a customer waits on declares the `waited` ladder (minutes, such as 1, 2, 4 and 8) in the declaration of its jobs and every other flow `background` (seconds, such as 5, 10 and 20), each ladder declared once per class of flow by the jobs platform's ladder policy; after the last rung the run is a dead letter with one item for a person, and a new build hands it back at once."
    failureCodes:
      - BE_SAGA_INTERACTIVE_RESUME_LADDER
    enforcers:
      - {kind: hfs, id: saga-resume-ladder, status: planned}
  - id: R393
    code: STACK_PENDING_MIGRATIONS
    law: "`starci app check --env local` compares the migration files of the repository with the history the running dev database recorded (supabase_migrations.schema_migrations) and fails on every file the database has not applied, naming the files and `starci app stack up --env <env> --execute`; a stack that is not running is not judged, and `--env prod` does not ask (check id `pending-migrations`)."
    failureCodes:
      - STACK_PENDING_MIGRATIONS
    enforcers:
      - {kind: hfs, id: pending-migrations}
  - id: R394
    code: STACK_DEAD_LETTER_REPEAT
    law: "`starci app check --env local` reads the last 24 hours of the api log of the dev environment and fails on every queue or job that dead-lettered more than once, naming the queue, the job and the last error message; a missing log is not judged, and `--env prod` does not ask (check id `dead-letter-repeat`)."
    failureCodes:
      - STACK_DEAD_LETTER_REPEAT
    enforcers:
      - {kind: hfs, id: dead-letter-repeat}
  - id: R395
    code: HFS_APP_GALLERY_MISSING
    law: "Every app source repository carries the screenshot gallery at `gallery/` (a Vite app rendered by `starci app sync`) that serves on the app's base port + `ruleParams.gallery.portOffset` with a `dev` script using --strictPort, pins its vite version exactly, and keeps `gallery/pages/**/*.png` git-ignored and untracked; every UI fix round saves its shots in `gallery/pages/<area>/<screen>/` (one folder is one screen: one agent, one state; only `1440.png`, `390.png`, `explain.md` and an optional `links.json`; no `before/`) beside an `explain.md` (front matter `title`, `route`, `area`; one `## <region name>` per visible region with the lines `Vì sao:`, `Luật:` and `Grammar:`): a screen folder with shots and no `explain.md`, any other file name in a screen folder, a region without a `Vì sao` or `Grammar` value, a `links.json` or `flows.json` that names a screen folder that does not exist,, (in `--env prod`; a warning in `--env local`) a region that says `CHƯA RÕ` or `SAI`, a `page.tsx` route of the front end (`fe/apps/<app>/src/app`, a dynamic segment is one screen) with no screen folder whose `explain.md` front matter `route` matches it and no reasoned exclusion in `gallery/routes.json`, and a change to a screen's source (its `page.tsx` and the `features/pages/<Name>/` folders it imports) in the commits since the base that leaves its `explain.md` untouched (`HFS_APP_GALLERY_EXPLAIN_STALE`; both the last two are warnings in `--env local`), and, where the app keeps `.starcistacks/canvas/design.json` (the design pass drawn before code, PROJECT-GALLERY-6), a manifest that is not its shape, a built page with no screen folder, a screen of an area listed in `areas` with no approved design, a built page that records no sha256 of its 1440 or 390 shot or whose shot in the work tree is not the recorded one, and a shot record on a page not yet built (all but the first are warnings in `--env local`), and a change to a canvas-managed screen's source in the commits since the base whose design page is missing, only drafted or approved before the change (`HFS_APP_GALLERY_DESIGN_CHANGE_UNAPPROVED`, PROJECT-GALLERY-7; a warning in `--env local`), and, where the app keeps `gallery/board/board.yaml` (the design board, PROJECT-GALLERY-9), a record that is not its shape or a section without its module, a `page.tsx` route with no board section, and a board section whose route is neither coded nor marked `planned`, or marked `planned` while coded (both the last two are warnings in `--env local`) fail."
    failureCodes:
      - HFS_APP_GALLERY_MISSING
      - HFS_APP_GALLERY_SCRIPT
      - HFS_APP_GALLERY_VITE_UNPINNED
      - HFS_APP_GALLERY_SHOTS_TRACKED
      - HFS_APP_GALLERY_EXPLAIN_MISSING
      - HFS_APP_GALLERY_REGION_INCOMPLETE
      - HFS_APP_GALLERY_REGION_UNCLEAR
      - HFS_APP_GALLERY_FRONT_MATTER
      - HFS_APP_GALLERY_SCREEN_FILE
      - HFS_APP_GALLERY_LINKS
      - HFS_APP_GALLERY_ROUTE_MISSING
      - HFS_APP_GALLERY_ROUTE_AMBIGUOUS
      - HFS_APP_GALLERY_EXPLAIN_STALE
      - HFS_APP_GALLERY_SCREEN_INVALID
      - UI_AUDIT_MISSING
      - UI_AUDIT_STALE
      - UI_AUDIT_SELF_REVIEW
      - UI_AUDIT_ROUNDS_FEW
      - UI_AUDIT_OPEN
      - UI_AUDIT_NEEDS_OWNER
      - UI_AUDIT_CONSIDERED_EMPTY
      - HFS_APP_GALLERY_DESIGN_MANIFEST
      - HFS_APP_GALLERY_DESIGN_PAGE_MISSING
      - HFS_APP_GALLERY_DESIGN_UNAPPROVED
      - HFS_APP_GALLERY_DESIGN_SHOT_MISSING
      - HFS_APP_GALLERY_DESIGN_SHOT_STALE
      - HFS_APP_GALLERY_DESIGN_CHANGE_UNAPPROVED
      - HFS_APP_GALLERY_DESIGN_CRITIQUE_MISSING
      - HFS_APP_GALLERY_DESIGN_PENDING
      - HFS_APP_GALLERY_BOARD_INVALID
      - HFS_APP_GALLERY_BOARD_ROUTE_MISSING
      - HFS_APP_GALLERY_BOARD_SECTION_UNMAPPED
    enforcers:
      - {kind: hfs, id: gallery}
  - id: R396
    code: BE_REST_OPERATION_ID
    law: "A rest api app commits the OpenAPI 3 document of its controllers, and every operation in it has a unique explicit `<area>.<action>` operationId, named request and answer schemas, the one Error answer as `default`, a cursor page for a list, and a declared security or a stated public reason."
    failureCodes:
      - BE_REST_OPERATION_ID
      - BE_REST_UNTYPED
      - BE_REST_ERROR_SHAPE
      - BE_REST_PAGINATION
      - BE_REST_SECURITY
    enforcers:
      - {kind: hfs, id: rest-contract}
  - id: R397
    code: BE_CLI_CLIENT
    law: "A client cli is an app of kind `client-cli` that declares its npm `package` and its `bin` in `hfs.json` (no other app does, and no two share either), keeps its commands in its own feature root `be/src/features/client-cli/<app>/`, and tracks `be/apps/<app>/package.json` (that name, that bin on `dist/apps/<app>/src/main.js`, not private, `files` holding `dist`, a version, every dependency at the app root's pin) and `be/apps/<app>/tsconfig.build.json` (it emits the import closure of `src/main.ts` into `dist/`)."
    failureCodes:
      - BE_CLI_CLIENT
    enforcers:
      - {kind: hfs, id: cli}
  - id: R398
    code: BE_CLI_CLIENT_BOUNDARY
    law: A client cli (its app and its feature root) imports no domain, events, queues or projections module, nothing of the database capability or of a persistence folder, and no database library.
    failureCodes:
      - BE_CLI_CLIENT_BOUNDARY
    enforcers:
      - {kind: eslint-be, id: cli-client-boundary}
  - id: R399
    code: HFS_SIDE_UNDECLARED
    law: "A project's sides are the ones hfs.json declares (a non-empty subset of be, fe, packages): each declared side tracks files under its folder, no tracked be/, fe/ or packages/ belongs to an undeclared side, and the stack declaration states the same sides with no component of a missing side."
    failureCodes:
      - HFS_SIDE_UNDECLARED
      - HFS_SIDE_FOLDER_MISSING
      - STACKS_SIDES_UNDECLARED
      - STACKS_SIDES_DRIFT
      - STACKS_COMPONENT_SIDE
    enforcers:
      - {kind: hfs, id: project-sides}
  - id: R400
    code: HFS_DATA_IN_CODE
    law: "Data lives in git only in a seed copy repository, `<name>-seed-standard` (plain, pinned by commit, read once by the bring-up) or `<name>-seed-backup-<env>` (one environment, always sealed, read only by an explicit sync): a copy repository has no hfs.json and a root manifest.json of schema `starci/data-manifest@1` whose purpose agrees with its format name; a code project tracks no copy document (a data manifest, the data/ blobs/ index/ tree next to one, a sops binary-mode envelope: HFS_DATA_IN_CODE) and never depends on a copy repository (package dependency, workspace, submodule, tsconfig path: HFS_DATA_DEPENDENCY); the commit hook refuses in a copy repository an unsealed backup file (HFS_DATA_UNSEALED), a sealed file in a standard (HFS_DATA_STANDARD_SEALED), a manifest that disagrees with the tracked data files or its format name (HFS_DATA_MANIFEST_DRIFT), a data file over 4 MiB (HFS_DATA_FILE_SIZE) and a snapshot over 500 MiB, which needs the s3 driver (HFS_DATA_CAP)."
    failureCodes:
      - HFS_DATA_IN_CODE
      - HFS_DATA_DEPENDENCY
      - HFS_DATA_UNSEALED
      - HFS_DATA_STANDARD_SEALED
      - HFS_DATA_MANIFEST_DRIFT
      - HFS_DATA_FILE_SIZE
      - HFS_DATA_CAP
    enforcers:
      - {kind: hfs, id: data-copies}
  - id: R401
    code: BE_DI_RING
    law: No Nest provider of a lite back-end app reaches itself through its constructor, property, factory or `useExisting` injections (a `forwardRef` edge aside, which R85 refuses); the boot proof scans the real AppModule before it compiles and names every ring of two or more providers, since Nest refuses a ring of two and hangs at boot on a longer one.
    failureCodes:
      - BE_DI_RING
    enforcers:
      - {kind: hfs, id: di-ring}
  - id: R402
    code: HFS_PROJECT_CHECK_FAILED
    law: "Every project check the project's ext/manifest.json `checks` declares passes. A declaration is {id, run, why}: a unique kebab-case id, run a unique `ext/checks/<name>.mjs` file, and why the project keeps it (its shape, and a declared file that is not there, are HFS_EXT_INVALID, R381). `starci app check` runs every declared check wherever the hfs gate runs (a whole run, `--gate hfs`, CI), as its own `checks` step after the structure pass: with the Node that runs the check, from the app root, one after another through the heavy governor; exit 0 is green and says so in one line, any other exit, or a missing file, is HFS_PROJECT_CHECK_FAILED naming the check, its file, its exit, what it guards and the last 20 lines it printed. An hfs finding: it blocks like hfs under the branch profile. A check reads what it reads, so its verdict is never cached."
    failureCodes:
      - HFS_PROJECT_CHECK_FAILED
    enforcers:
      - {kind: hfs, id: project-checks}
  - id: R403
    code: BE_JOB_NEXT_DECLARED
    law: "In a `defineJob` declaration `next` is an array literal of statically readable job names, each the name of a job a `defineJob` of the program declares; the queue platform refuses, at run time, an enqueue of a job the running job's `next` does not list (Known gap: the call site is judged by that refusal, review and the chain's specs)."
    failureCodes:
      - BE_JOB_NEXT_DECLARED
    enforcers:
      - {kind: eslint-be, id: job-next-declared}
  - id: R404
    code: BE_JOB_PROGRESS_SHAPE
    law: "A `defineJob` `progress.topic` is a function whose declared return type is `JobProgressTopic` of `platform/jobs` (the principal first, then the chain root), and a function that takes a `ClaimedJob` never calls the `RealtimeHub`: it reports step progress through `JobProgress`, which the jobs frame stores on the row and publishes."
    failureCodes:
      - BE_JOB_PROGRESS_SHAPE
    enforcers:
      - {kind: eslint-be, id: job-progress-shape}
  - id: R426
    code: DATA_STORE_UNDECLARED
    law: "Every stateful component or declared backing of the stack is the `component` of a store or of a `derived` entry of the `data:` declaration (DATA_STORE_UNDECLARED); a store has a kind of the closed list (database, storage) and a level logical or physical (DATA_STORE_KIND), an `adapter.module` that is a tracked source file holding a class that `implements StoreAdapter` (or a factory whose declared return type is `StoreAdapter`) and, for a store of a seed-backup set or a store a seed-standard without a project `completeness` fills, an `adapter.command` argv of the app command that serves it over starci/data-entries@1, the door `starci app data` and the bring-up's seed step reach it through (DATA_STORE_ADAPTER); a derived entry has a non-empty `rebuild` and, when it names a `from`, a declared store (DATA_DERIVED_SOURCE; `from` is optional for a source outside the project); a project with no stateful component and no `data:` member is green."
    failureCodes:
      - DATA_STORE_UNDECLARED
      - DATA_STORE_KIND
      - DATA_STORE_ADAPTER
      - DATA_DERIVED_SOURCE
    enforcers:
      - {kind: hfs, id: data-stores}
  - id: R427
    code: DATA_PURPOSE
    law: "Every `data.sets[]` entry of the stack declaration has a purpose seed-standard or seed-backup, declared stores and declared environments (DATA_PURPOSE), a destination whose driver is git or s3 (DATA_DRIVER_KIND), a git repository named `<name>-seed-standard` for a standard and, with `{env}`, `<name>-seed-backup-<env>` for a backup, where `<env>` is the environment's declared `short` name (lowercase kebab, at most 12 characters, unique across the environments), else its name (DATA_COPY_NAME); a standard is pinned by a 40-hex `commit` (DATA_SEED_UNPINNED), `force` and `commit` belong to a standard and `everyMinutes` and `maxAgeMinutes` to a backup (DATA_FORCE_MISPLACED); `completeness` is `ext:<id>` of a check of ext/manifest.json (DATA_EXTENSION_UNDECLARED); no seeds.yaml entry of any level, nor document it names, mentions a -seed-backup repository (DATA_BACKUP_LOADED)."
    failureCodes:
      - DATA_PURPOSE
      - DATA_DRIVER_KIND
      - DATA_COPY_NAME
      - DATA_SEED_UNPINNED
      - DATA_FORCE_MISPLACED
      - DATA_BACKUP_LOADED
      - DATA_EXTENSION_UNDECLARED
    enforcers:
      - {kind: hfs, id: data-sets}
  - id: R428
    code: STORAGE_PUBLIC_ROUTE_CONSOLE
    law: "A dev environment that runs an object store (a `local.services[]` entry of `kind: object-store`, or the `component` of a `data.stores[]` of kind storage) publishes its S3 API port only: no `tunnel.routes[]` entry reaches the store's declared admin `console` port (STORAGE_PUBLIC_ROUTE_CONSOLE). The rest of PROJECT-STACKS-15 is a convention held by review and the app's specs: a `tunnel.routes[]` entry whose port is the store's S3 port; every process that sets STORAGE_ENDPOINT, the internal address of its writes, also sets STORAGE_PUBLIC_URL to `https://<the host of a route to the store>`, so a link the app builds is never a loopback address, localhost or a container name; the statics base (`NEXT_PUBLIC_STATICS_URL`, `VITE_STATICS_URL`, PROJECT-STATICS-4) of a process in an environment with a tunnel starts with `https://<the host of a route to the store>/`; stored data holds a bucket and a key, never a host. `starci app stack up --env <env> --execute` makes the ingress rule and the DNS record of each declared route, `stack verify` reads the public side. Production is not judged here."
    failureCodes:
      - STORAGE_PUBLIC_ROUTE_CONSOLE
    enforcers:
      - {kind: hfs, id: stacks-storage-public}
  - id: R429
    code: HFS_SECRET_TARGET_MISSING
    law: "A secret target the project declares in `secretTargets` of ext/manifest.json (starci/project-ext@1: id, root, one `*.enc.yaml` file per environment, the `.sops.yaml` whose creation rule names the recipients, optional `under` and `depth`) holds sealed files only, judged when its checkout is on the machine and never by reading a value: a file of a declared environment, or the target's `.sops.yaml`, that is not in the checkout is HFS_SECRET_TARGET_MISSING, a file that is not a sops envelope (no `sops` block) HFS_SECRET_TARGET_UNSEALED, a file with its `sops` block and a value that is not an ENC[...] value HFS_SECRET_TARGET_PLAIN; the declaration's own shape is HFS_EXT_INVALID (R381). `starci app secret set|unset|list --env <env> --ext <target>` is the one writer: it resolves the target through the extension, prompts masked as set does, seals to the file's recipients and never prints a value or writes one to the stack; an unknown target, an environment the target does not seal, or a key naming an environment is refused."
    failureCodes:
      - HFS_SECRET_TARGET_MISSING
      - HFS_SECRET_TARGET_UNSEALED
      - HFS_SECRET_TARGET_PLAIN
    enforcers:
      - {kind: hfs, id: secret-targets}
  - id: R430
    code: HFS_GATE_DECLARATION_INVALID
    law: "An app's `gates` block (.starcistacks/application-stacks.yaml, PROJECT-LINT-4) switches off, for the whole app and every branch, any gate but the three that are the harness's own rules: `hfs`, `secrets` and `db` are never switched off, whatever the declaration says; every other id (lint, format, sonar, codecov, test, coverage, types, build, audit, wiring, checks, deps) may be, each as `{ run: off, reason }` with a mandatory reason and only where policy/loosening.yaml optionalGates lists it; an id that is no gate, a gate that is never switchable, a missing reason, a `run` other than off and a switched-off gate whose reader stays on (test needs coverage, codecov and sonar; lint needs sonar; coverage needs codecov) are HFS_GATE_DECLARATION_INVALID, and a refused block switches nothing off. One reader (readGateDeclarations, folded by activeProfile) serves `starci app check` in both envs, the managed hooks, the release gate (whose build rows always run) and the rendered CI, and every one reports an off gate as `off (declared: <reason>)`, never as passed."
    failureCodes:
      - HFS_GATE_DECLARATION_INVALID
    enforcers:
      - {kind: hfs, id: gate-declaration}
  - id: R431
    code: DB_PRIMARY_KEY_SHAPE
    law: "Every table an app creates in its schema has the primary key `id uuid` (DB_PRIMARY_KEY_SHAPE; a natural key is a unique constraint beside it); a one-column foreign key is named `<referenced table singular>_id` or `<role>_<referenced table singular>_id`, or is the table's own `id` when the table shares the key of the row it extends (DB_FOREIGN_KEY_NAME), the singular being a fixed rule set on the last word of the table name with the app's map of irregular plurals, hfs.json `db.singulars`, first; every foreign key has an index, primary key or unique constraint of its table whose leading columns are its columns somewhere in the migration set (DB_FOREIGN_KEY_INDEX). A table hfs.json `db.keyExceptions` lists with a reason is not judged for its key shape or foreign key names. The rule binds every new migration: a migration already on the base unchanged is the backlog, its findings reported as known items, never blocking."
    failureCodes:
      - DB_PRIMARY_KEY_SHAPE
      - DB_FOREIGN_KEY_NAME
      - DB_FOREIGN_KEY_INDEX
    enforcers:
      - {kind: hfs, id: db-key-shape}
  - id: R432
    code: BE_FAILURE_CLASS_BY_TEXT
    law: "Whether a failure is transient or permanent is decided only by `classifyFailure` of @starci/nest-kit, which reads an explicit `failureClass` the error carries first: no back-end source (src/**, not a spec) matches an error's code or message text against a transient failure code (ECONNRESET, ETIMEDOUT, EAI_AGAIN, 40001, 40P01, 57P01 and their siblings), as a quoted literal or inside a regular expression literal; code that knows a class throws its error with `failureClass`, and a back end with a Postgres job outbox takes the outbox, its runner and its judge from @starci/outbox."
    failureCodes:
      - BE_FAILURE_CLASS_BY_TEXT
    enforcers:
      - {kind: hfs, id: failure-class}
  - id: R433
    code: HFS_CONCEPT_CONVENTIONS_MISSING
    law: "Every app keeps a `conventions` concept: `.starciwork/concepts/conventions.md` is tracked and the catalog `.starciwork/concepts/README.md` has a row linking it, and the catalog has one row per concept (every tracked `.starciwork/concepts/<topic>.md` is linked by a row, and every row links a tracked concept); the check reads the tree and the catalog, never the concept's content, which is held by review."
    failureCodes:
      - HFS_CONCEPT_CONVENTIONS_MISSING
      - HFS_CONCEPT_UNCATALOGUED
    enforcers:
      - {kind: hfs, id: concept-conventions}
  - id: R434
    code: HFS_DATA_ADAPTER_DRIFT
    law: "A seed-standard repository may keep what people author in `raw/` (plain, never sealed, sized and capped like the data files by R400) and an `adapter/` whose `convert(rawDir)` turns it into entries written through the git driver of @starci/seed (`renderStandard`, `runStandardAdapter`); its committed manifest.json, data/, blobs/ and index/ are then, byte for byte, what `node adapter/main.ts` writes from raw/: the copy repository's commit hook and CI (`starci app check --staged`) run the adapter twice over raw/ as the index holds it and refuse a run that fails, two runs that differ (a non-deterministic adapter), an output file that differs from, is missing from or is absent in the commit (a hand edit of data/, or raw/ committed without its output), and an adapter/ the index does not hold as it stands (HFS_DATA_ADAPTER_DRIFT); an adapter repository tracks adapter/main.ts, adapter/package.json, the hook .githooks/pre-commit and the workflow .github/workflows/seed-standard.yml, each of the last two running `starci app check --staged` (HFS_DATA_ADAPTER_UNGUARDED; `starci data standard init --adapter` writes them); the bring-up's seed step verifies each pinned seed-standard of the environment once per pin before any entry applies, running the same check on the pinned commit, and refuses a pin whose adapter output drifts or that cannot be read (STACK_SEED_ADAPTER_DRIFT)."
    failureCodes:
      - HFS_DATA_ADAPTER_DRIFT
      - HFS_DATA_ADAPTER_UNGUARDED
      - STACK_SEED_ADAPTER_DRIFT
      - STACK_SEED_ADAPTER_INSTALL
    enforcers:
      - {kind: hfs, id: data-adapter}
      - {kind: hfs, id: standard-gate}
  - id: R435
    code: HFS_DATA_SECOND_LOADER
    law: "A seed-standard reaches an app by one path, the bring-up's seed step over the commit `data.sets` pins: no tracked text file of an app (source, scripts, package.json, workflows, compose, env and stack files; ext/, .starciwork, Markdown, lock files and the check cache aside) runs git clone, pull, fetch, archive, submodule, sparse-checkout or remote add on a `-seed-standard` repository (kind git), declares a content-sync command (a package.json script or a quoted command name `content|standard` + `sync|pull|fetch|import|load`, or a script that names a `-seed-standard` repository: kind command) or assigns an environment variable a value naming a `-seed-standard` repository or a name holding SEED_STANDARD (kind env) (HFS_DATA_SECOND_LOADER). That path is the loader of the seed step: after the R434 gate it reads each pin at its commit through `pinRepository` and the git driver (an unreadable pin is STACK_SEED_STANDARD_UNREADABLE, a copy that is no healthy plain standard or fills a store its set does not list is STACK_SEED_STANDARD_SCHEMA), applies it through each store's `adapter.command` over starci/data-entries@1 (a store with none is STACK_SEED_STORE_COMMAND), a dry run through every door first and then an upsert by natural key (a door that fails or refuses a key is STACK_SEED_DOOR_REFUSED), and writes one receipt per standard and commit only once every store applied; a receipt skips the pin, a changed pin is reported DATA_STANDARD_CHANGED and applies only with the set's `force: true`, once per commit; a set with a project `completeness` is left to the project. Known gap: the check reads one line at a time, so a repository name held in a variable and cloned on another line is held by review."
    failureCodes:
      - HFS_DATA_SECOND_LOADER
      - STACK_SEED_STANDARD_UNREADABLE
      - STACK_SEED_STANDARD_SCHEMA
      - STACK_SEED_STORE_COMMAND
      - STACK_SEED_DOOR_REFUSED
    enforcers:
      - {kind: hfs, id: data-loaders}
      - {kind: hfs, id: standard-load}
  - id: R436
    code: HFS_NIVOOS_PACKAGE_MISSING
    law: "The nivoos packages a project declares (hfs.json `sides.nivoos.packages`, each `{ name, entry?, out? }`, a kebab-case folder `packages/<name>/` once, `entry` defaulting to `src/<name>.package.ts` and `out` to `seed`; declaring one declares the packages side) agree with its tree and its check, each way: a declared package tracks its `package.json`, `tsconfig.json` and entry (HFS_NIVOOS_PACKAGE_MISSING); a root package that depends on the nivoos SDK or its CLI is declared (HFS_NIVOOS_UNDECLARED), since the slot `app.nivoos-package` is what hands its source to the SDK authoring lint profile of `@starci/eslint-canon-be` (Vietnamese copy in string and template literals, the default export of the entry; the canon otherwise whole) and what leaves it unmeasured; and `nivoos package check <entry> --out <out>`, run from the package folder in the `checks` step of `starci app check`, passes: a package that does not type-check, a committed seed or secrets template that differs from a fresh build, or a nivoos CLI that is not installed for it is HFS_NIVOOS_PACKAGE_CHECK, which is never cached."
    failureCodes:
      - HFS_NIVOOS_PACKAGE_MISSING
      - HFS_NIVOOS_UNDECLARED
      - HFS_NIVOOS_PACKAGE_CHECK
    enforcers:
      - {kind: hfs, id: nivoos}
      - {kind: hfs, id: nivoos-package-check}
  - id: R437
    code: HFS_BRAND_INVALID
    law: "An app that keeps AI-generated images prompts them from its brand sheet: `.starcistacks/brand/illustration.yaml` holds `basePrompt: { version: <integer from 1>, text }`, the block every image prompt starts with, and every `statics/**/*.prompt.yaml` records the `basePrompt.version` it was built from, a `subject` and a `prompt` that starts with the current base text; a brand sheet whose basePrompt is not that shape (HFS_BRAND_INVALID, an error), a prompt file in an app with no illustration.yaml (HFS_BRAND_MISSING), a prompt file whose recorded version is absent or not the current one (HFS_BRAND_PROMPT_STALE) and a prompt file with no subject, not YAML or whose prompt does not start with the base text (HFS_BRAND_PROMPT_INCOMPLETE) fail; the last three are a warning in `--env local` and an error in `--env prod`. A named media base lives in the optional `.starcistacks/brand/media.yaml` as `bases: { <lowercase-kebab-name>: { version: <integer from 1>, text } }` (`illustration` is reserved: it is the basePrompt of illustration.yaml, read as the base named `illustration`); a prompt file names its base in `basePrompt.name` (default `illustration`) and is judged against that base's version and text, a media.yaml not of that shape is HFS_BRAND_INVALID too, and a prompt file naming a base neither file defines fails HFS_BRAND_BASE_UNKNOWN (a warning in `--env local`, an error in `--env prod`). `starci app scaffold` writes the starter folder once (brand.md, illustration.md, illustration.yaml, media.md, media.yaml, references/) and `starci app sync` never overwrites it (PROJECT-BRAND-1, PROJECT-BRAND-2)."
    failureCodes:
      - HFS_BRAND_INVALID
      - HFS_BRAND_MISSING
      - HFS_BRAND_PROMPT_STALE
      - HFS_BRAND_PROMPT_INCOMPLETE
      - HFS_BRAND_BASE_UNKNOWN
    enforcers:
      - {kind: hfs, id: brand}
  - id: R438
    code: HFS_STATICS_FILE_KIND
    law: "statics/ at the app root holds the repo-owned media of the app and nothing else: files of the kinds png, jpg, jpeg, webp, avif, gif, svg, mp4 and webm and a <name>.prompt.yaml sidecar beside the image it prompted (HFS_STATICS_FILE_KIND, HFS_STATICS_PROMPT_ORPHAN for a sidecar with no image of that name, HFS_STATICS_PROMPT_SCHEMA for one that is not a YAML mapping with a non-empty `prompt`); every segment of a path under statics/, the file name before its extension included, is lowercase kebab-case, the extension is lowercase and the first segment is an area folder, because the path under statics/ is the staticsKey that code and data hold and the URL after the public base (HFS_STATICS_KEY); a file above 2 MiB is a warning and above 10 MiB an error (HFS_STATICS_FILE_SIZE), and the tree above 256 MiB an error (HFS_STATICS_TREE_SIZE). The sidecar's subject and basePrompt version are judged by R436 against `.starcistacks/brand/`."
    failureCodes:
      - HFS_STATICS_FILE_KIND
      - HFS_STATICS_KEY
      - HFS_STATICS_FILE_SIZE
      - HFS_STATICS_TREE_SIZE
      - HFS_STATICS_PROMPT_ORPHAN
      - HFS_STATICS_PROMPT_SCHEMA
    enforcers:
      - {kind: hfs, id: statics-shape}
  - id: R439
    code: HFS_STATIC_ASSET_OUTSIDE_STATICS
    law: "A tracked media file (png, jpg, jpeg, webp, avif, gif, svg, mp4, webm) under `fe/**/public/**` or `{fe,be}/**/src/**` is HFS_STATIC_ASSET_OUTSIDE_STATICS: move it to statics/<area>/ and reference it by its staticsKey. Exempt: inside `fe/**/public/` only the favicon (`favicon.*`), the PWA/manifest icons (`apple-touch-icon*.png`, `android-chrome-*.png`, `mstile-*.png`, `safari-pinned-tab.svg`, `icon-*.png`, `icons/**`) and the app logo (`logo.{png,svg,webp}` or a variant `*-logo.{png,svg,webp}` in `public/` or `public/brand/`) stay, everything else lives in statics/ behind the CDN; also exempt: the route metadata files Next.js reads by name (`src/app/{icon,favicon,apple-icon,opengraph-image,twitter-image}.*`), and the small build-time binaries under `be/**/src/assets/` (slot be.assets, HFS_ASSET_KIND)."
    failureCodes:
      - HFS_STATIC_ASSET_OUTSIDE_STATICS
    enforcers:
      - {kind: hfs, id: statics-outside}
  - id: R440
    code: STACK_STORAGE_MISSING
    law: "A project ships its own MinIO, in development and in production, on one condition: it has statics/ (a file other than .gitkeep) or its back end needs object storage (the @starci/object-storage dependency, a `storage` custody member or a sealed storage-* secret). With the condition and no `storage` service in a dev docker-compose environment, or no `deploy.images.storage` in a lite production, the check refuses (STACK_STORAGE_MISSING); a declared storage service with no condition is an object store nothing uses: remove it (held by review, not by a check). The service is built from the managed .starcistacks/images/storage/Dockerfile: when statics/ holds media and the dev service does not build it, STACK_STORAGE_IMAGE_UNUSED; a service that builds it must have build.context the app root, build.dockerfile the override, image <project>-storage:local, STATICS_BUCKET, STATICS_PREFIX (kebab-case) and STATICS_PUBLIC (download or none), a healthcheck on /tmp/statics-ready and an existing statics/ folder, and the production `deploy.images.storage` is {app: storage} (STACK_STORAGE_IMAGE_SHAPE). The Dockerfile's own drift is HFS_MANAGED_FILE_DRIFT."
    failureCodes:
      - STACK_STORAGE_MISSING
      - STACK_STORAGE_IMAGE_UNUSED
      - STACK_STORAGE_IMAGE_SHAPE
    enforcers:
      - {kind: hfs, id: storage-image}
  - id: R442
    code: FE_RAW_MEDIA_ELEMENT
    law: A picture, a video or decorative art is drawn by Grammar's Image, Video or Illustration, never by a raw img, video or picture element in app source (the family-ui package, whose components are the renderers, and a Freestyle region are exempt); a raw element reserves no ratio, loads at once and carries none of the Grammar's alt, rendition, caption, track or stream contract.
    failureCodes:
      - FE_RAW_MEDIA_ELEMENT
    enforcers:
      - {kind: eslint-grammar-core, id: no-raw-media}
  - id: R443
    code: FE_ERROR_PAGE_NOT_EMPTY_STATE
    law: "The not-found, error and global-error pages of a web app (the boundaries R53 requires) draw the Grammar's one empty state: the source they reach, through the app's own files and the composites of its workspace ui package, holds an EmptyNotice of scope page with an illustration, so they are never hand-rolled from other components. An app edits their words and art; it never replaces the empty state."
    failureCodes:
      - FE_ERROR_PAGE_NOT_EMPTY_STATE
    enforcers:
      - {kind: hfs, id: error-pages}
  - id: R444
    code: HFS_DESKTOP_UNDECLARED
    law: "The desktop app a project declares (hfs.json `sides.desktop`: `app` the fe app it wraps, `name`, a reverse-DNS `identifier` that does not end in `.app`, the https `origin` the shell loads, optional `devOrigin`, `allowedOrigins`, deep link `schemes`, `targets` (macos, windows, linux) and an `updater` `{ pubkey, endpoint }`; it needs the fe side) is a Tauri v2 remote-origin shell at `desktop/` and agrees with its tree and its config, each way: a tracked file of `desktop/` or the release workflow without the declaration is HFS_DESKTOP_UNDECLARED; a declared app tracks the icons `tauri icon` writes (and its Cargo.lock, a warning) or is HFS_DESKTOP_FILE_MISSING; `desktop/src-tauri/tauri.conf.json` says what the declaration says (identifier, product name, the version read from the app's package.json, deep link schemes, the updater key and endpoint, no window in the config) or is HFS_DESKTOP_CONFIG; the shell's isolation holds, with no global Tauri API, no dangerous* switch, a CSP without unsafe-eval or a wildcard, an updater over https and no capability that hands the IPC to a wildcard or plain-http remote origin, or it is HFS_DESKTOP_SECURITY; and no signing certificate, key store or private key is a tracked file and no signing secret is written into `desktop/`, or it is HFS_DESKTOP_SIGNING_KEY. The Tauri config, the Cargo manifest, the Rust of the shell, the bundled page and the release workflow are rendered from the declaration by `starci app sync` (slots `app.desktop-config`, `app.ci-desktop-release`, HFS_MANAGED_FILE_DRIFT); the signing secrets the workflow reads are names of `ci.secrets` (CI_DECLARATION_DRIFT) and are never committed."
    failureCodes:
      - HFS_DESKTOP_UNDECLARED
      - HFS_DESKTOP_FILE_MISSING
      - HFS_DESKTOP_CONFIG
      - HFS_DESKTOP_SECURITY
      - HFS_DESKTOP_SIGNING_KEY
    enforcers:
      - {kind: hfs, id: desktop}
  - id: R445
    code: FE_BRAND_NOT_ONE
    law: "The colours of a product live in ONE brand token file: the web apps of a front end hold exactly one `modules/brand/brand.css`, which every global stylesheet imports (a colour literal elsewhere is R61's lint, which also refuses a named colour and a Tailwind arbitrary or palette colour), and the canvas holds none of its own: `.starcistacks/canvas/tokens.css` is generated from the brand file by `canvas-tokens.mjs`, and no generator under `.starcistacks/canvas/gen/` (the claude-design `gen/kit/` aside) writes a colour literal."
    failureCodes:
      - FE_BRAND_NOT_ONE
      - FE_BRAND_CANVAS_LITERAL
      - FE_BRAND_CANVAS_TOKENS_STALE
    enforcers:
      - {kind: hfs, id: brand-one}
  - id: R446
    code: FE_GLOBALS_NOT_ONE
    law: "A web app loads its CSS through exactly ONE global stylesheet, `src/app/globals.css`, which imports the Grammar stylesheet and the brand file: no second `.css` file under the app's `src/` (a route group's `site.css`), and no TypeScript file imports a stylesheet other than the globals."
    failureCodes:
      - FE_GLOBALS_NOT_ONE
      - FE_GLOBALS_IMPORTS_MISSING
    enforcers:
      - {kind: hfs, id: globals-one}
  - id: R447
    code: FE_STATE_PAGE_NOT_SHARED
    law: "Every system state has ONE page: all the `not-found.tsx` of a front end render one shared page component, all the `error.tsx` and `global-error.tsx` one, all the offline pages one, and every route group of the app tree (any depth) carries its own `error.tsx` and `not-found.tsx`, so no group falls through to a different look. The page component is the file of the boundary's reachable source that draws the Grammar's page empty state (R443)."
    failureCodes:
      - FE_STATE_PAGE_NOT_SHARED
      - FE_STATE_PAGE_GROUP_MISSING
    enforcers:
      - {kind: hfs, id: state-pages}
  - id: R448
    code: BE_BOOT_ENTRY_FAILED
    law: A back-end app that declares a boot entry (hfs.json `sides.be.apps[].boot`) has that entry composed by the gate, with NestFactory.createApplicationContext, no listener, no lifecycle hook, no network and only the declared stub env, in `app check` and in the fast job of the app's CI (`starci app check --gate wiring`), so a provider wiring error that only a command's boot reaches never passes the other gates to take the stack down.
    failureCodes:
      - BE_BOOT_ENTRY_FAILED
      - BE_BOOT_ENTRY_UNJUDGED
    enforcers:
      - {kind: hfs, id: boot-entry}
  - id: R449
    code: HFS_MASTER_PLAN_INVALID
    law: "An app root keeps its Master Plan in `.starciwork/master-plan.yaml` (schema `starci/master-plan@1`): the nine layers business, tech, patterns, ui, data, testing, security, observability and domains in that order, each with its decisions, its reason, its always/never rules (ids unique, each optionally `enforcedBy` an hfs rule id, a check preset or `review`) and an optional roadmap; a malformed file or an `enforcedBy` naming an hfs rule the catalog does not hold is refused, and an app that tracks none yet is a warning."
    failureCodes:
      - HFS_MASTER_PLAN_INVALID
      - HFS_MASTER_PLAN_MISSING
    enforcers:
      - {kind: hfs, id: master-plan}
  - id: R450
    code: HFS_CUTOVER_EXPIRED
    law: "An environment that still runs the previous release while the branch carries the next shape may declare `cutover: { state: pending, reason, until: <YYYY-MM-DD>, keep?: [<member> | <member>/<KEY>] }` (PROJECT-STACKS-20): `starci app check` in both envs then reports, for that environment alone, the findings of the codes the failure-code catalog marks `cutoverTolerant` (`true`: any finding about the environment; `kept`: only one about a member or key `keep` names) in a section of their own, while every other finding still blocks; a block of another shape is HFS_CUTOVER_DECLARATION_INVALID and one past its `until` is HFS_CUTOVER_EXPIRED, both blocking and neither tolerating anything; while the block is present at all, every `stack deploy` and `stack prepare --execute` refuse the environment with STACK_CUTOVER_PENDING."
    failureCodes:
      - HFS_CUTOVER_EXPIRED
      - HFS_CUTOVER_DECLARATION_INVALID
      - STACKS_SEALED_MEMBER_MISSING
      - STACK_CUTOVER_PENDING
    enforcers:
      - {kind: hfs, id: cutover}
  - id: R451
    code: HFS_SOPS_RECIPIENTS
    law: "Every app's sealed members follow the one recipient policy of knowledge/hfs/sops-recipients.yaml (owned by the harness repository's ops/vps/recipients.yaml, public halves only): the rule sops uses for an environment's members names exactly that environment's set, dev the harness recipient alone and every deployed environment (staging, production) the key of the VPS it deploys to (deploy.remote.serverRecipient) plus that server's one backup recipient, never the harness key, and no recipient that is not a declared key, which is an app-only identity (HFS_SOPS_RECIPIENTS); an environment whose set cannot be resolved (no recorded server, a server not declared, a backup not minted) is HFS_SOPS_RECIPIENT_UNDECLARED; a rule that reaches the members of an environment the app does not declare is HFS_SOPS_CATCH_ALL; and a sealed member whose cleartext sops.age recipients are not exactly its environment's set is HFS_SOPS_MEMBER_RECIPIENTS; the severity is data: while the policy's `enforce` (a server's own `enforce` for the environments deploying to it) is false, each is a warning in every env, so a fresh app with no server yet and an app awaiting its migration pass --env prod; once true, each is an error, report-only in --env local and blocking in --env prod; the check reads no value and no key. The SOPS_AGE_KEY guard compares the public recipient of the identity the lookup takes with a dev member's recipients before sops runs (stack up refuses SECRET_IDENTITY_MISMATCH, app check --env local warns HFS_SOPS_IDENTITY_MISMATCH), naming the file read and the recipient prefix expected."
    failureCodes:
      - HFS_SOPS_RECIPIENTS
      - HFS_SOPS_RECIPIENT_UNDECLARED
      - HFS_SOPS_CATCH_ALL
      - HFS_SOPS_MEMBER_RECIPIENTS
      - HFS_SOPS_IDENTITY_MISMATCH
    enforcers:
      - {kind: hfs, id: sops-recipients}
      - {kind: hfs, id: sops-identity-guard}
