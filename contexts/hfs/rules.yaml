    enforcers:
      - {kind: eslint-be, id: spec-no-raw-insert}
      - {kind: eslint-be, id: spec-no-repeated-row-literal}
  - id: R100
    code: BE_TEST_CONSTRAINTS_ON
    law: Nothing under `be/src/tests` disables, defers or drops a database constraint; a builder creates the parent chain instead.
    failureCodes:
      - BE_TEST_CONSTRAINTS_ON
    enforcers:
      - {kind: eslint-be, id: tests-keep-constraints}
  - id: R101
    code: BE_TEST_BUILDER_ARRANGES
    law: A test data builder only arranges data, imports no assertion or test framework, and has deterministic defaults.
    failureCodes:
      - BE_TEST_BUILDER_ARRANGES
    enforcers:
      - {kind: eslint-be, id: builder-arranges-only}
  - id: R102
    code: BE_SPEC_PLACEMENT
    law: "A back-end spec lives only in one of the four test layers: a unit spec beside its unit-tested subject, or an integration, e2e or contract spec under `be/src/tests`."
    failureCodes:
      - BE_SPEC_PLACEMENT
    enforcers:
      - {kind: hfs, id: spec-placement}
      - {kind: eslint-be, id: spec-placement}
  - id: R103
    code: HFS_REPO_LOCAL_CHECK
    law: A repository keeps no check, lint rule or lint plugin of its own; every check lives in the harness runtime and the canon packages.
    failureCodes:
      - HFS_REPO_LOCAL_CHECK
    enforcers:
      - {kind: hfs, id: repo-local-check}
  - id: R104
    code: HFS_LINT_SUPPRESSION_FILE
    law: A repository keeps no lint-suppression file, script or option; a finding is fixed in the code.
    failureCodes:
      - HFS_LINT_SUPPRESSION_FILE
    enforcers:
      - {kind: hfs, id: lint-suppression}
  - id: R105
    code: HFS_PROOF_COMMAND_FILE_MISSING
    law: Every repository file a `.starciwork` proof command names exists.
    failureCodes:
      - HFS_PROOF_COMMAND_FILE_MISSING
    enforcers:
      - {kind: hfs, id: proof-command-files}
  - id: R106
    code: FE_I18N_KEYS
    law: "Front-end catalogs and source agree both ways: every literal key read through `next-intl` exists in every locale, and no catalog key is unread."
    failureCodes:
      - FE_I18N_KEYS
    enforcers:
      - {kind: eslint-fe, id: i18n-keys}
  - id: R107
    code: FE_COOKIE_ATTRIBUTES
    law: A cookie the front end writes states `httpOnly` literally, carries `secure` and has `sameSite` `lax` or `strict`.
    failureCodes:
      - FE_COOKIE_ATTRIBUTES
    enforcers:
      - {kind: eslint-fe, id: response-cookie-attributes}
  - id: R108
    code: BE_ERROR_CAUSE_DROPPED
    law: A `throw` escaping a `catch` rethrows the caught value or carries it as the new error's `cause`.
    failureCodes:
      - BE_ERROR_CAUSE_DROPPED
    enforcers:
      - {kind: eslint-be, id: replacement-throw-carries-cause}
  - id: R109
    code: BE_MEMBER_DOC_MISSING
    law: Every public member of an exported class, interface or object type in product source opens with English JSDoc.
    failureCodes:
      - BE_MEMBER_DOC_MISSING
    enforcers:
      - {kind: eslint-be, id: require-public-member-jsdoc}
  - id: R110
    code: FE_PROPS_MUTABLE
    law: The props type of an exported rendering function is readonly all the way down.
    failureCodes:
      - FE_PROPS_MUTABLE
    enforcers:
      - {kind: eslint-fe, id: props-fields-readonly}
  - id: R111
    code: HFS_PEER_INTEGRATION_MISSING
    law: An app declares the runtime peer every driver integration pair of contexts/hfs/peer-integrations.yaml requires.
    failureCodes:
      - HFS_PEER_INTEGRATION_MISSING
    enforcers:
      - {kind: hfs, id: peer-integrations}
  - id: R112
    code: BE_INTEGRATION_SPEC_MISSING
    law: Every back-end integration has an integration spec that registers its own module through the test world, references its error codes and drives an outage.
    editions: [full]
    failureCodes:
      - BE_INTEGRATION_SPEC_MISSING
    enforcers:
      - {kind: hfs, id: integration-specs}
  - id: R113
    code: FE_GRAPHQL_CONTRACT
    law: Every GraphQL operation a front end keeps in a `.graphql` file validates against the back-end contract snapshot that declares its root field.
    failureCodes:
      - FE_GRAPHQL_CONTRACT
    enforcers:
      - {kind: hfs, id: fe-contract-documents}
  - id: R141
    code: BE_COOKIE_ATTRIBUTES
    law: A cookie a back-end door writes sets `httpOnly`, `secure` and a `lax` or `strict` `sameSite` as typed literals, and `Set-Cookie` is never written as a raw header.
    failureCodes:
      - BE_COOKIE_ATTRIBUTES
    enforcers:
      - {kind: eslint-be, id: response-cookie-attributes}
  - id: R142
    code: BE_AMBIENT_ID
    law: Random id generators are used only inside `platform/ids`; code uses the injected `Ids` port and specs use `fakeIds()`.
    failureCodes:
      - BE_AMBIENT_ID
    enforcers:
      - {kind: eslint-be, id: no-ambient-id}
  - id: R143
    code: HFS_MONO_WORKSPACES
    law: Every app is an npm monorepo with the declared workspaces, an exact `packageManager`, the pinned turbo, one root lockfile and the managed `turbo.json`.
    failureCodes:
      - HFS_MONO_WORKSPACES
    enforcers:
      - {kind: hfs, id: monorepo}
  - id: R144
    code: HFS_MONO_FE_WORKSPACE
    law: Every front-end app and package is a private npm workspace with its declared name and exactly the standard scripts.
    failureCodes:
      - HFS_MONO_FE_WORKSPACE
    enforcers:
      - {kind: hfs, id: monorepo}
  - id: R145
    code: HFS_MONO_NEST_PROJECTS
    law: The back end is a Nest monorepo of `be/apps/<app>` whose `nest-cli.json` projects are exactly the apps `hfs.json` declares, defaulting to an api app.
    failureCodes:
      - HFS_MONO_NEST_PROJECTS
    enforcers:
      - {kind: hfs, id: monorepo}
  - id: R146
    code: HFS_MONO_WORKSPACE_DEP
    law: A front-end workspace declares every package its files import in its own `package.json`, and the app root declares no workspace package.
    failureCodes:
      - HFS_MONO_WORKSPACE_DEP
    enforcers:
      - {kind: hfs, id: monorepo}
  - id: R147
    code: BE_CLI_REQUIRED
    law: Every one-off back-end action lives in the one `be/apps/cli` app with its own image, required whenever the back end declares a connection or a cli command.
    failureCodes:
      - BE_CLI_REQUIRED
    enforcers:
      - {kind: hfs, id: cli}
  - id: R148
    code: BE_CLI_BOOTSTRAP
    law: The cli app boots through nest-commander's `CommandFactory.run` and never serves.
    failureCodes:
      - BE_CLI_BOOTSTRAP
    enforcers:
      - {kind: eslint-be, id: cli-bootstrap}
  - id: R149
    code: BE_CLI_COMMAND_SHAPE
    law: A nest-commander command is declared only under `src/features/cli/`, one per file in its group or `subs/` folder, each sub-command with its unit spec beside it.
    failureCodes:
      - BE_CLI_COMMAND_SHAPE
    enforcers:
      - {kind: eslint-be, id: cli-command-shape}
      - {kind: eslint-be, id: unit-test-colocated}
  - id: R150
    code: BE_CLI_OWNER
    law: "`nest-commander` is imported only by the cli app and cli feature root, and no back-end source parses command-line arguments itself."
    failureCodes:
      - BE_CLI_OWNER
    enforcers:
      - {kind: eslint-be, id: cli-owner}
  - id: R151
    code: BE_EVENT_CLASS_CONTRACT
    law: Every typed event class under `be/src/modules/events/<service>/` matches an entry of the vendored `events.json` contract by name and version, and every contract entry has its class.
    failureCodes:
      - BE_EVENT_CLASS_CONTRACT
    enforcers:
      - {kind: hfs, id: event-class-contract}
  - id: R152
    code: BE_OUTBOX_WRITE_TX
    law: Only a domain service writes the outbox, passing the manager of its own transaction to the event bus or queue producer.
    failureCodes:
      - BE_OUTBOX_WRITE_TX
    enforcers:
      - {kind: eslint-be, id: outbox-write-tx}
  - id: R153
    code: BE_EVENT_CONSUMER_SHAPE
    law: An `EventConsumer` is `transport/message/<event>.consumer.ts` named after its event and passes `delivery.eventId` on to the command it dispatches.
    failureCodes:
      - BE_EVENT_CONSUMER_SHAPE
    enforcers:
      - {kind: eslint-be, id: event-consumer-shape}
  - id: R154
    code: BE_QUEUE_PRODUCER_SHAPE
    law: "Every queue producer write takes a `tx: EntityManager` parameter and passes it as the write's first argument."
    failureCodes:
      - BE_QUEUE_PRODUCER_SHAPE
    enforcers:
      - {kind: eslint-be, id: queue-producer-shape}
  - id: R155
    code: BE_PATTERN_SPEC_MISSING
    law: Every pattern a back end declares has a test titled `<pattern>/<scenario>` for each scenario of `ruleParams.be.patternScenarios`.
    failureCodes:
      - BE_PATTERN_SPEC_MISSING
    enforcers:
      - {kind: hfs, id: pattern-spec-missing}
      - {kind: hfs, id: lite-proof-lane}
  - id: R156
    code: BE_KIND_ISOLATION
    law: A feature of one trigger kind never imports a feature of another kind; kinds meet only through the event bus.
    failureCodes:
      - BE_KIND_ISOLATION
    enforcers:
      - {kind: eslint-be, id: kind-isolation}
      - {kind: machine, id: tiers}
  - id: R157
    code: BE_JOB_WRITE_OUTSIDE_OWNER
    law: The job entity is written only by `platform/jobs`.
    failureCodes:
      - BE_JOB_WRITE_OUTSIDE_OWNER
    enforcers:
      - {kind: eslint-be, id: job-write-owner}
  - id: R158
    code: BE_JOB_FENCE_REQUIRED
    law: Every `JobClaims` method that takes a job requires an expected fencing token, no caller casts around it, and a catch around a claims write rethrows.
    failureCodes:
      - BE_JOB_FENCE_REQUIRED
    enforcers:
      - {kind: eslint-be, id: job-fence-required}
  - id: R159
    code: BE_JOB_RUN_KEY
    law: A job step passes a `RunKey` from `JobClaims.runKey` to every integration call and performs no read.
    failureCodes:
      - BE_JOB_RUN_KEY
    enforcers:
      - {kind: eslint-be, id: job-run-key}
  - id: R160
    code: BE_JOB_SHAPE
    law: Job processors and steps exist only in their job folder, a processor extending `FencedProcessor` and a step implementing `JobStep`.
    failureCodes:
      - BE_JOB_SHAPE
    enforcers:
      - {kind: eslint-be, id: job-shape}
  - id: R161
    code: BE_PROJECTION_WRITE_OWNER
    law: A projection's entity is written only by the `<name>.projection.ts` of its folder.
    failureCodes:
      - BE_PROJECTION_WRITE_OWNER
    enforcers:
      - {kind: eslint-be, id: projection-write-owner}
  - id: R162
    code: BE_PROJECTION_SHAPE
    law: A projection exposes only `recompute*` and `get*` methods, exports no entity from its index, and is never recomputed by an api feature.
    failureCodes:
      - BE_PROJECTION_SHAPE
    enforcers:
      - {kind: eslint-be, id: projection-shape}
  - id: R163
    code: HFS_SERVICE_PLACEMENT
    law: A back-end service lives only at `be/apps/<service>/`, sharing the `be/src` libraries and the one package.json; any other service root is refused.
    failureCodes:
      - HFS_SERVICE_PLACEMENT
    enforcers:
      - {kind: hfs, id: services-placement}
  - id: R164
    code: HFS_IMAGE_UNPINNED
    law: In a multi-service product every stack component image is pinned by digest or exact version.
    failureCodes:
      - HFS_IMAGE_UNPINNED
    enforcers:
      - {kind: hfs, id: services-image-pins}
  - id: R165
    code: HFS_SERVICE_STACK_DECLARATION
    law: "In a multi-service product every api or worker app is a `role: service` component of the application stacks."
    failureCodes:
      - HFS_SERVICE_STACK_DECLARATION
    enforcers:
      - {kind: hfs, id: services-stack-declaration}
  - id: R166
    code: HFS_EVENT_CONTRACT
    law: The async contract between services is emitted into `be/contracts/<service>/events.json`, compensations name an existing event, and every consumed entry exists in the provider's snapshot at its version.
    failureCodes:
      - HFS_EVENT_CONTRACT
    enforcers:
      - {kind: hfs, id: services-event-contract}
  - id: R167
    code: BE_ASYNC_SPEC_MISSING
    law: Every consumed event is named by an e2e spec that publishes it, reads the effect and redelivers it, driving the compensation flow for a saga step.
    editions: [full]
    failureCodes:
      - BE_ASYNC_SPEC_MISSING
    enforcers:
      - {kind: hfs, id: services-async-specs}
  - id: R168
    code: BE_SERVICE_ISOLATION
    law: A service app imports no file of a sibling service app; services meet only through the `be/src` libraries and the wire.
    failureCodes:
      - BE_SERVICE_ISOLATION
    enforcers:
      - {kind: eslint-be, id: service-isolation}
  - id: R169
    code: BE_SAGA_STEP_COMPENSATION
    law: A declared saga is one folder whose orchestrator imports every step and its same-named compensation.
    failureCodes:
      - BE_SAGA_STEP_COMPENSATION
    enforcers:
      - {kind: hfs, id: saga-step-compensation}
  - id: R170
    code: BE_SAGA_STATE_VERSIONED
    law: Every saga orchestrator has a versioned state type moved only through the fenced store of `platform/saga`.
    failureCodes:
      - BE_SAGA_STATE_VERSIONED
    enforcers:
      - {kind: hfs, id: saga-state-versioned}
  - id: R171
    code: BE_SAGA_EVENT_CONTRACT
    law: A saga step and its compensation each name an event declared in a vendored contract, and the compensation's event declares what it compensates.
    failureCodes:
      - BE_SAGA_EVENT_CONTRACT
    enforcers:
      - {kind: hfs, id: saga-event-contract}
  - id: R172
    code: BE_SAGA_CONSUMER_DEDUPE
    law: A saga consumer passes the delivery's `eventId` to the command it dispatches.
    failureCodes:
      - BE_SAGA_CONSUMER_DEDUPE
    enforcers:
      - {kind: hfs, id: saga-consumer-dedupe}
  - id: R173
    code: BE_SAGA_E2E_MISSING
    law: Every saga compensation path has an e2e spec that names its event and injects a failure through the test world.
    editions: [full]
    failureCodes:
      - BE_SAGA_E2E_MISSING
    enforcers:
      - {kind: hfs, id: saga-e2e}
  - id: R174
    code: BE_CONTEXT_OWNER
    law: Each `hfs.json` connection is a bounded context owned by one api or worker app; an app composes only its own contexts, and the migrate and cli apps compose all.
    failureCodes:
      - BE_CONTEXT_OWNER
    enforcers:
      - {kind: eslint-be, id: context-owner}
  - id: R175
    code: BE_CONTEXT_COUPLING
    law: "Contexts couple only through events: no entity relation, foreign key or import crosses a context."
    failureCodes:
      - BE_CONTEXT_COUPLING
    enforcers:
      - {kind: eslint-be, id: context-coupling}
  - id: R176
    code: BE_CONTEXT_TRANSACTION
    law: One transaction touches one context's connection; work across contexts is a saga.
    failureCodes:
      - BE_CONTEXT_TRANSACTION
    enforcers:
      - {kind: eslint-be, id: context-transaction}
  - id: R177
    code: BE_CONTRACT_BREAKING
    law: An event contract evolves only additively against its pinned previous copy, and a breaking change is a new versioned event key.
    failureCodes:
      - BE_CONTRACT_BREAKING
    enforcers:
      - {kind: hfs, id: contract-compat}
  - id: R178
    code: BE_CONTEXT_PLATFORM_TABLES
    law: A `perConnection` platform capability registers its entities and migrations on every connection it serves.
    failureCodes:
      - BE_CONTEXT_PLATFORM_TABLES
    enforcers:
      - {kind: eslint-be, id: context-platform-tables}
  - id: R179
    code: BE_KIND_DECLARATION
    law: "`hfs.json` `sides.be.kinds` lists exactly the trigger kinds in use, with their required patterns and platform capabilities."
    failureCodes:
      - BE_KIND_DECLARATION
    enforcers:
      - {kind: hfs, id: kind-declaration}
  - id: R180
    code: BE_KIND_EMPTY
    law: A kind folder holds only instance folders, each with TypeScript source.
    failureCodes:
      - BE_KIND_EMPTY
    enforcers:
      - {kind: hfs, id: kind-empty}
  - id: R181
    code: BE_SQL_RETURNING_SHAPE
    law: A `sql` UPDATE or DELETE with RETURNING is wrapped as a CTE that SELECTs from the changed rows.
    failureCodes:
      - BE_SQL_RETURNING_SHAPE
    enforcers:
      - {kind: eslint-be, id: sql-returning}
  - id: R182
    code: BE_WEBHOOK_SHAPE
    law: A webhook door is one public signed-webhook controller whose POST verifies, then makes one durable domain intake and returns nothing or a declared literal ack, with no bus or handler dispatch.
    failureCodes:
      - BE_WEBHOOK_SHAPE
    enforcers:
      - {kind: eslint-be, id: webhook-shape}
  - id: R183
    code: BE_WEBHOOK_UNVERIFIED
    law: A webhook POST starts with an unconditional signature or domain verification before any other work, and an optional GET challenge echoes only its verifier's result.
    failureCodes:
      - BE_WEBHOOK_UNVERIFIED
    enforcers:
      - {kind: eslint-be, id: webhook-verify-first}
  - id: R184
    code: BE_REALTIME_SHAPE
    law: A realtime file is the one door its role names (gateway, subscription or SSE controller), and all three doors are served from the api process in both editions.
    failureCodes:
      - BE_REALTIME_SHAPE
    enforcers:
      - {kind: eslint-be, id: realtime-shape}
  - id: R185
    code: BE_REALTIME_WRITES
    law: A realtime door only reads and pushes; its one injected dependency is the `RealtimeHub` of `platform/realtime`.
    failureCodes:
      - BE_REALTIME_WRITES
    enforcers:
      - {kind: eslint-be, id: realtime-read-only}
  - id: R186
    code: BE_REALTIME_TOPIC_SCOPE
    law: A realtime handler subscribes only to topics built from its `@CurrentPrincipal()`.
    failureCodes:
      - BE_REALTIME_TOPIC_SCOPE
    enforcers:
      - {kind: eslint-be, id: realtime-topic-scope}
  - id: R187
    code: HFS_DOCKER_BUILD_CONTEXT
    law: Every app image builds from the app root, and no COPY or ADD source leaves the build context.
    failureCodes:
      - HFS_DOCKER_BUILD_CONTEXT
    enforcers:
      - {kind: hfs, id: docker}
  - id: R188
    code: HFS_DOCKER_STAGES
    law: An app Dockerfile is multi-stage with `build` and `runtime` stages, installs with `npm ci`, and its runtime stage builds nothing and runs as `node`.
    failureCodes:
      - HFS_DOCKER_STAGES
    enforcers:
      - {kind: hfs, id: docker}
  - id: R189
    code: HFS_DOCKER_ENTRY
    law: The runtime stage starts the app's built entry in exec form with the port, exposure and HEALTHCHECK its app kind requires.
    failureCodes:
      - HFS_DOCKER_ENTRY
    enforcers:
      - {kind: hfs, id: docker}
  - id: R190
    code: HFS_DOCKER_BASE_PIN
    law: Every FROM of an app Dockerfile is a prior stage, the canon node base image (stack/pins.yaml) or a digest-pinned image.
    failureCodes:
      - HFS_DOCKER_BASE_PIN
    enforcers:
      - {kind: hfs, id: docker}
  - id: R191
    code: HFS_DOCKER_SECRETS
    law: No secret enters an image through a copied file, a URL, or a credential-named ARG or ENV other than `NEXT_PUBLIC_*`.
    failureCodes:
      - HFS_DOCKER_SECRETS
    enforcers:
      - {kind: hfs, id: docker}
  - id: R203
    code: BE_FEATURE_THIN
    law: A feature-tier file of `ruleParams.be.thinRoles` maps its parameters and makes one delegating call into `modules/`, with no branch, loop or computation beyond the gate calls its kind requires.
    failureCodes:
      - BE_FEATURE_THIN
    enforcers:
      - {kind: eslint-be, id: feature-thin}
  - id: R204
    code: HFS_COVERAGE_SCOPE_DRIFT
    law: The back-end coverage scope is derived once from the slot manifest, and the jest, Sonar and Codecov configurations are its render.
    failureCodes:
      - HFS_COVERAGE_SCOPE_DRIFT
    enforcers:
      - {kind: hfs, id: coverage-scope-drift}
  - id: R212
    code: HFS_EDITION_INVALID
    law: "`hfs.json` names an edition the manifest knows (full or lite, absent means full), and a lite app keeps the full code structure while running the minimal production topology its edition pattern defines."
    failureCodes:
      - HFS_EDITION_INVALID
      - HFS_EDITION_FORBIDDEN_PRESENT
      - HFS_STARCIWORK_LITE_FORBIDDEN
      - HFS_BACKING_UNDECLARED
      - HFS_BACKING_UNUSED
    enforcers:
      - {kind: hfs, id: edition}
      - {kind: hfs, id: lite-brand-work}
  - id: R213
    code: DB_MIGRATION_SHAPE
    law: A migration is `supabase/migrations/<ts14>_<kebab>.sql` with a valid unique stamp sorting after the committed active migrations, parses as PostgreSQL, and is immutable once on the base.
    failureCodes:
      - DB_MIGRATION_SHAPE
    enforcers:
      - {kind: hfs, id: db-migration-shape}
  - id: R214
    code: DB_RLS_REQUIRED
    law: Every table in an exposed schema enables row level security in its creating migration, and policies are named, never tautological for writes, and never grant `service_role`.
    failureCodes:
      - DB_RLS_REQUIRED
      - DB_DYNAMIC_DDL
      - DB_POLICY_SHAPE
    enforcers:
      - {kind: hfs, id: db-rls}
  - id: R215
    code: DB_DEFINER_SAFE
    law: A `security definer` function pins `search_path`, is not executable by the public and interpolates only through `format`, and every storage bucket is private by default with declared limits and a policy.
    failureCodes:
      - DB_DEFINER_SAFE
      - DB_STORAGE_POLICY
    enforcers:
      - {kind: hfs, id: db-privileged-objects}
  - id: R216
    code: DB_CONFIG_POLICY
    law: "`supabase/config.toml` reads credentials only through `env()`, matches the Supabase block of `hfs.json`, and the committed database types equal their emit from the applied migrations."
    failureCodes:
      - DB_CONFIG_POLICY
      - DB_TYPES_DRIFT
      - HFS_EMIT_DB_TYPES_STALE
    enforcers:
      - {kind: hfs, id: db-config-types}
      - {kind: hfs, id: db-types-emit}
  - id: R217
    code: FE_SUPABASE_CLIENT_OWNER
    law: "Each side has one Supabase door: the front end uses only the auth API from `fe.modules.auth` and holds no credential, and the back end uses it only from `be.integrations.supabase` with the committed `Database` type."
    failureCodes:
      - FE_SUPABASE_CLIENT_OWNER
      - BE_SUPABASE_CLIENT_OWNER
      - FE_SERVICE_ROLE_FORBIDDEN
    enforcers:
      - {kind: machine, id: supabase-client-owner}
      - {kind: machine, id: supabase-service-role}
  - id: R219
    code: BE_SUPABASE_JWT_VERIFIED
    law: A back-end principal comes only from a Supabase access token verified against the project JWKS.
    failureCodes:
      - BE_SUPABASE_JWT_VERIFIED
    enforcers:
      - {kind: machine, id: supabase-principal}
  - id: R220
    code: HFS_LITE_SECRET_CUSTODY
    law: A lite app holds no secret material in the tree outside the sealed `.starcistacks/<env>/secrets/<slug>.enc` members.
    editions: [lite]
    failureCodes:
      - HFS_LITE_SECRET_CUSTODY
    enforcers:
      - {kind: hfs, id: lite-secret-custody}
  - id: R235
    code: SCAN_SMELL
    law: Code carries none of the Sonar way smells a lint rule can decide, each on at error in both canons, outside the files specs name.
    failureCodes:
      - SCAN_SMELL
    enforcers:
      - {kind: eslint-be, id: no-await-in-loop}
      - {kind: eslint-be, id: prefer-code-point}
      - {kind: eslint-be, id: prefer-string-raw}
      - {kind: eslint-be, id: no-nested-conditional}
      - {kind: eslint-be, id: no-void-operator}
      - {kind: eslint-be, id: no-unused-import}
      - {kind: eslint-be, id: prefer-export-from}
      - {kind: eslint-fe, id: no-await-in-loop}
      - {kind: eslint-fe, id: prefer-code-point}
      - {kind: eslint-fe, id: prefer-string-raw}
      - {kind: eslint-fe, id: no-nested-conditional}
      - {kind: eslint-fe, id: no-void-operator}
      - {kind: eslint-fe, id: no-unused-import}
      - {kind: eslint-fe, id: prefer-export-from}
      - {kind: eslint-fe, id: no-unused-prop-types}
      - {kind: eslint-fe, id: media-has-caption}
      - {kind: eslint-be, id: max-params}
      - {kind: eslint-fe, id: max-params}
  - id: R243
    code: FE_SERVER_ACTION_FORBIDDEN
    law: "The front end serves no API: no `\"use server\"` directive, and no route handler but the health and auth-callback routes."
    failureCodes:
      - FE_SERVER_ACTION_FORBIDDEN
      - FE_ROUTE_HANDLER_FORBIDDEN
    enforcers:
      - {kind: machine, id: server-action-forbidden}
      - {kind: eslint-fe, id: no-server-action}
  - id: R244
    code: FE_STACK_FORBIDDEN
    law: A front end depends on no package that contexts/hfs/fe-stack.yaml forbids for a concern, and avatar generation stays inside the Grammar.
    failureCodes:
      - FE_STACK_FORBIDDEN
    enforcers:
      - {kind: hfs, id: fe-stack}
      - {kind: eslint-fe, id: fe-stack-import}
  - id: R245
    code: BE_APP_OPTIONS_COMPOSITION
    law: An app's `src/` holds the five app roles, `main.ts`, `<app>.env.ts`, `<app>.options.ts`, `compose/<area>.ts` and `app.module.ts`, each with its single responsibility.
    failureCodes:
      - BE_APP_OPTIONS_COMPOSITION
    enforcers:
      - {kind: eslint-be, id: app-options-composition-free}
  - id: R246
    code: BE_APP_COMPOSITION_BUDGET
    law: Each app file stays within the absolute line budget its `be.app.*` slot names (hfs/slots.yaml).
    failureCodes:
      - BE_APP_COMPOSITION_BUDGET
    enforcers:
      - {kind: eslint-be, id: app-file-budget}
  - id: R248
    code: ENV_REQUIRED_UNSET
    law: The environment keys a back end reads, the sealed keys and the keys the stack declares are one set by name.
    failureCodes:
      - ENV_REQUIRED_UNSET
      - ENV_SEALED_UNREAD
      - ENV_DUPLICATE
      - ENV_PUBLIC_SEALED
      - ENV_EXAMPLE_DRIFT
    enforcers:
      - {kind: hfs, id: env-parity}
  - id: R249
    code: ENV_VALUE_SHAPE
    law: Every stored environment value parses as the type its `EnvSource` reader declares, verified without revealing values.
    failureCodes:
      - ENV_VALUE_SHAPE
    enforcers:
      - {kind: hfs, id: env-value-shape}
  - id: R250
    code: HFS_HOST_CRON
    law: Scheduled work belongs to the app's queue scheduler, pg_cron ticks or declared replicated jobs, never to a host crontab, and deploy scripts only delegate to docker or the app CLI.
    failureCodes:
      - HFS_HOST_CRON
      - HFS_DEPLOY_NO_LOGIC
      - HFS_DEPLOY_COMPOSE_ON_VPS
      - HFS_DEPLOY_SCHEDULER
    enforcers:
      - {kind: hfs, id: deploy-scan}
  - id: R251
    code: HFS_DEPLOY_WORKFLOW
    law: Deployment workflows declare protected environments, permissions and concurrency, materialize only sealed secrets, pin every action by full commit SHA, and trigger only on the allowed refs.
    failureCodes:
      - HFS_DEPLOY_WORKFLOW
      - HFS_WORKFLOW_PIN
      - HFS_CI_TOOL_INSTALL
      - HFS_APP_WORKFLOW_TRIGGER
    enforcers:
      - {kind: hfs, id: deploy-workflow}
      - {kind: hfs, id: supply-chain}
  - id: R252
    code: HFS_SCRIPT_PLAINTEXT_LOAD
    law: Scripts and workflows never load plaintext secret files, enable xtrace or reveal secrets, and only the back-end Supabase integration references the service role.
    failureCodes:
      - HFS_SCRIPT_PLAINTEXT_LOAD
      - HFS_SCRIPT_XTRACE
      - HFS_SERVICE_ROLE_SCOPE
    enforcers:
      - {kind: hfs, id: script-hygiene}
  - id: R253
    code: HFS_AGE_KEY_CUSTODY
    law: The age identity that seals an app's secrets stays in untracked host-local custody, and the hash-sensitive secret-custody platform files equal their skeleton template.
    failureCodes:
      - HFS_AGE_KEY_CUSTODY
      - HFS_CANON_COPY_DRIFT
    enforcers:
      - {kind: hfs, id: secret-age-key-custody}
      - {kind: hfs, id: canon-copy-drift}
  - id: R254
    code: DB_BE_ONLY_ACCESS
    law: Browser data access stays closed on exposed schemas except tables `hfs.json` `supabase.directAccess` declares; the front end uses Supabase only for auth.
    editions: [lite]
    failureCodes:
      - DB_BE_ONLY_ACCESS
      - DB_REALTIME_UNLISTED
    enforcers:
      - {kind: hfs, id: db-be-only-access}
  - id: R255
    code: DB_APP_ROLE
    law: The declared back-end database role holds only the privileges it needs, and the tables it owns force row level security unless exempted with a reason.
    editions: [lite]
    failureCodes:
      - DB_APP_ROLE
      - DB_FORCE_RLS_DEFAULT
    enforcers:
      - {kind: hfs, id: db-app-role}
  - id: R256
    code: DB_POLICY_TAUTOLOGY
    law: "Exposed database objects keep their access boundaries: no tautological policies, principal-scoped browser policies, invoker-secured views and revoked execute on exposed definers."
    editions: [lite]
    failureCodes:
      - DB_POLICY_TAUTOLOGY
      - DB_VIEW_UNSAFE
      - DB_DEFINER_REVOKE
      - DB_STORAGE_PREFIX
    enforcers:
      - {kind: hfs, id: db-policy-hardening}
      - {kind: hfs, id: db-definer-revoke}
  - id: R257
    code: DB_BASELINE_SHAPE
    law: An archived migration chain has exactly one active baseline, archive contents stay immutable, and the db baseline verbs are read-only unless `--apply` is explicit.
    editions: [lite]
    failureCodes:
      - DB_BASELINE_SHAPE
      - DB_ARCHIVE_MUTATED
    enforcers:
      - {kind: hfs, id: db-baseline-shape}
  - id: R258
    code: DB_PGMQ_DECLARED
    law: pgmq serves only event-bus topic queues, and every pg_cron job is migration-owned, scheduled once and only enqueues one row into the declared queue outbox.
    editions: [lite]
    failureCodes:
      - DB_PGMQ_DECLARED
      - DB_CRON_OWNED
    enforcers:
      - {kind: hfs, id: db-queue-cron}
  - id: R259
    code: DB_EXTENSION_ALLOWED
    law: Database extensions follow the allowlist, migrations write no vault secret or role password, and destructive DDL lives only in contract migrations whose targets are unreferenced.
    editions: [lite]
    failureCodes:
      - DB_EXTENSION_ALLOWED
      - DB_API_EXPOSED
      - DB_MIGRATION_DESTRUCTIVE
      - HFS_SEED_PII
      - DB_VAULT_WRITE
    enforcers:
      - {kind: hfs, id: db-config-ext}
      - {kind: hfs, id: db-migration-destructive}
  - id: R260
    code: BE_JWT_ALG_PINNED
    law: A back-end JWT verifier pins a literal subset of asymmetric algorithms, reads its issuer from configuration and admits only the authenticated role.
    failureCodes:
      - BE_JWT_ALG_PINNED
    enforcers:
      - {kind: eslint-be, id: jwt-alg-pinned}
      - {kind: machine, id: jwt-policy}
  - id: R261
    code: BE_CORS_ALLOWLIST
    law: Every back-end API declares an exact CORS origin allowlist, applies the http-security middleware, hides x-powered-by and trusts an explicit proxy hop count.
    failureCodes:
      - BE_CORS_ALLOWLIST
      - BE_SECURITY_HEADERS
      - BE_TRUST_PROXY
    enforcers:
      - {kind: eslint-be, id: cors-allowlist}
      - {kind: eslint-be, id: security-headers}
      - {kind: eslint-be, id: trust-proxy}
  - id: R262
    code: BE_READY_REAL
    law: Every back-end API serves distinct live and ready signals, readiness probes a required dependency with a bounded timeout, and the Docker HEALTHCHECK reaches the live route.
    failureCodes:
      - BE_READY_REAL
      - BE_HEALTH_SIGNALS
      - HFS_DOCKER_HEALTHCHECK_FAKE
    enforcers:
      - {kind: eslint-be, id: ready-real}
      - {kind: eslint-be, id: health-signals}
      - {kind: hfs, id: docker-health-reachability}
  - id: R263
    code: BE_WEBHOOK_SCOPE
    law: Signed-webhook public metadata belongs only to webhook doors and declared verifiers, and a webhook receipt transaction only records the inbox delivery and its outbox event.
    failureCodes:
      - BE_WEBHOOK_SCOPE
      - BE_WEBHOOK_INBOX_KEY
    enforcers:
      - {kind: eslint-be, id: webhook-scope}
      - {kind: eslint-be, id: webhook-inbox-key}
  - id: R264
    code: HFS_FEATURE_LOGIC_ROLE
    law: A non-door feature-tier role declares data, types and DTO metadata only, apart from a top-level `registerEnumType` in a GraphQL transport type file.
    failureCodes:
      - HFS_FEATURE_LOGIC_ROLE
    enforcers:
      - {kind: eslint-be, id: feature-logic-role}
  - id: R265
    code: BE_COMPOSITION_UNTYPED
    law: App composition lives only in typed `compose/<area>.ts` groups identified by resolved types, never in `main.ts`, `<app>.env.ts` or `<app>.options.ts`.
    failureCodes:
      - BE_COMPOSITION_UNTYPED
    enforcers:
      - {kind: eslint-be, id: app-composition-typed}
  - id: R266
    code: STACKS_SECRET_NOT_EXTERNAL
    law: Rendered Swarm deployments use versioned external secrets, publish ports only through the declared ingress, and declare placement, healthchecks and rollout policies.
    failureCodes:
      - STACKS_SECRET_NOT_EXTERNAL
      - STACKS_SECRET_UNVERSIONED
      - STACKS_SECRET_ENV_LITERAL
      - STACKS_PORT_PUBLISHED
      - STACKS_SECOND_INGRESS
      - STACKS_DNS_UNDECLARED
      - STACKS_HOST_UNROUTED
      - STACKS_TLS_UNDECLARED
      - STACKS_PLACEMENT_MISSING
      - STACKS_HEALTHCHECK_MISSING
      - STACKS_UPDATE_POLICY_MISSING
      - STACKS_REALTIME_SCALED
    enforcers:
      - {kind: hfs, id: stacks-swarm}
      - {kind: hfs, id: stacks-second-ingress}
  - id: R267
    code: STACKS_RELEASE_UNDECLARED
    law: Each Swarm environment declares an immutable images lock, release pointers, health assertions and backup with a restore proof for every stateful dependency.
    failureCodes:
      - STACKS_RELEASE_UNDECLARED
      - BACKUP_UNDECLARED
      - BACKUP_PROOF_MISSING
      - STACKS_MODEL_UNAVAILABLE
    enforcers:
      - {kind: hfs, id: stacks-release}
  - id: R268
    code: HFS_SCHEDULE_UNDECLARED
    law: Every scheduler, pg_cron schedule and replicated job matches a top-level jobs declaration that invokes a named back-end CLI action.
    failureCodes:
      - HFS_SCHEDULE_UNDECLARED
    enforcers:
      - {kind: hfs, id: stacks-release}
  - id: R269
    code: HFS_DEPENDABOT_MISSING
    law: Dependabot schedules npm, Actions and Docker updates with minor-and-patch groups, CI gates on `npm audit`, and release images carry an SBOM and provenance.
    failureCodes:
      - HFS_DEPENDABOT_MISSING
      - HFS_AUDIT_STEP_MISSING
      - HFS_SBOM_MISSING
    enforcers:
      - {kind: hfs, id: supply-chain}
  - id: R270
    code: HFS_DOC_PATH_MISSING
    law: Documentation cites only existing paths, scripts, CLI verbs, declared environment keys and catalog rule ids.
    failureCodes:
      - HFS_DOC_PATH_MISSING
      - HFS_DOC_COMMAND_UNKNOWN
      - HFS_DOC_ENV_UNKNOWN
      - HFS_DOC_RULE_UNKNOWN
    enforcers:
      - {kind: hfs, id: doc-fresh}
  - id: R271
    code: HFS_RELEASE_TAG_MISMATCH
    law: A release tag is a v-prefixed semantic version equal to the package version, images publish under it, and database deployment refuses a non-tag ref.
    failureCodes:
      - HFS_RELEASE_TAG_MISMATCH
      - HFS_DB_DEPLOY_UNGUARDED
    enforcers:
      - {kind: hfs, id: release-provenance}
  - id: R272
    code: BE_APP_BOOT_PROOF_MISSING
    law: Every lite back-end app proves its real AppModule composition by compiling the dependency graph with fixture options and infrastructure doubles.
