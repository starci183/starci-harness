      - {kind: eslint-fe, id: no-alert}
      - {kind: eslint-grammar-core, id: no-inline-svg-outside-brand-mark-leaf}
  - id: R287
    code: FE_CALLBACK_SHAPE
    law: The auth callback handler only exchanges the code or verifies the email OTP and redirects, using the auth owner and pure route helpers.
    failureCodes:
      - FE_CALLBACK_SHAPE
    enforcers:
      - {kind: eslint-fe, id: callback-shape}
  - id: R288
    code: FE_STACK_UNLISTED
    law: Every direct front-end dependency is listed in contexts/hfs/fe-stack.yaml or declared with a reason, and every product Next app declares the catalog's core packages.
    failureCodes:
