    failureCodes:
      - BE_PUBLIC_REASON_CLOSED
    enforcers:
      - {kind: eslint-be, id: public-reason-closed}
  - id: R291
    code: HFS_FUNCTION_BUDGET
    law: Every function, method or arrow body stays within the function line budget (ruleParams.common.functionLines).
    failureCodes:
      - HFS_FUNCTION_BUDGET
    enforcers:
      - {kind: eslint-be, id: function-line-budget}
      - {kind: eslint-fe, id: function-line-budget}
  - id: R292
    code: HFS_FEATURE_FILE_BUDGET
    law: Every feature owner stays within the feature file budget (ruleParams.common.featureFiles).
    failureCodes:
      - HFS_FEATURE_FILE_BUDGET
    enforcers:
      - {kind: hfs, id: feature-files}
  - id: R293
    code: STACK_TOOLING_REIMPLEMENTED
    law: An app does not re-implement the canon Swarm deploy tooling in its own scripts or workflows.
    failureCodes:
      - STACK_TOOLING_REIMPLEMENTED
    enforcers:
      - {kind: hfs, id: stack-tooling}
  - id: R294
    code: STACKS_DEPLOY_CONFIG_INVALID
    law: Every Swarm environment's deploy block is coherent under the stack verbs' own normalization against the real tree.
    failureCodes:
      - STACKS_DEPLOY_CONFIG_INVALID
    enforcers:
      - {kind: hfs, id: stacks-deploy}
  - id: R295
    code: BE_MODULE_DEFINITION_MISSING
    law: Every NestJS module has its module definition and options files and is imported only through `register`.
    failureCodes:
      - BE_MODULE_DEFINITION_MISSING
    enforcers:
      - {kind: eslint-be, id: module-definition-required}
      - {kind: eslint-be, id: capability-module-shape}
  - id: R296
    code: CI_SECRET_SEALED
    law: No CI secret names a key sealed inside an app secret member.
    failureCodes:
      - CI_SECRET_SEALED
    enforcers:
      - {kind: hfs, id: ci-custody}
  - id: R297
    code: APP_SECRET_IN_CI
    law: No sealed key granted to an app container appears in the CI secrets or vars.
    failureCodes:
      - APP_SECRET_IN_CI
    enforcers:
      - {kind: hfs, id: ci-custody}
  - id: R298
    code: CI_DECLARATION_DRIFT
    law: Every workflow secret and variable reference is declared in its matching CI class, and every non-optional declaration is consumed.
    failureCodes:
      - CI_DECLARATION_DRIFT
    enforcers:
      - {kind: hfs, id: ci-custody}
  - id: R299
    code: HFS_WORKFLOW_CONTEXT
    law: GitHub Actions expressions use only contexts available at their workflow key.
    failureCodes:
      - HFS_WORKFLOW_CONTEXT
    enforcers:
      - {kind: hfs, id: workflow-contexts}
  - id: R300
    code: FE_PUBLIC_BUILD_ARG_MISSING
    law: Every front-end image receives each required `NEXT_PUBLIC_*` value through a Dockerfile ARG default or the deploy build args of every environment.
    failureCodes:
      - FE_PUBLIC_BUILD_ARG_MISSING
    enforcers:
      - {kind: hfs, id: fe-build-args}
  - id: R301
    code: CI_STANDARD
    law: App CI follows the one CI standard of contexts/hfs/ci-standard.yaml, delivered only through the app sync.
    failureCodes:
      - CI_STANDARD
    enforcers:
      - {kind: hfs, id: ci-standard}
  - id: R302
    code: HFS_MCP_TOOLS_SNAPSHOT
    law: A committed MCP tool catalog is the server's `tools/list` result at `be/contracts/<app>/<server>@<major>.tools.json`.
    failureCodes:
      - HFS_MCP_TOOLS_SNAPSHOT
    enforcers:
      - {kind: hfs, id: mcp-tools-snapshot}
  - id: R303
    code: HFS_BYPASS_MARKER
    law: "A product repository holds no bypass marker: no inline disable, type-check ignore, coverage ignore, skipped test or swallowed failure."
    failureCodes:
      - HFS_BYPASS_MARKER
    enforcers:
      - {kind: hfs, id: bypass-markers}
      - {kind: hfs, id: bypass-guard}
  - id: R304
    code: BE_SCHEMA_PLACE
    law: Transport doors validate with `class-validator`, other untrusted data is read through zod schemas declared only in `<name>.schema.ts` files of modules, and no schema is shared with the front end.
    failureCodes:
      - BE_SCHEMA_PLACE
    enforcers:
      - {kind: eslint-be, id: schema-place}
      - {kind: eslint-be, id: schema-file-values-only}
  - id: R305
    code: BE_SCHEMA_BOUNDED
    law: Every zod schema is bounded by a finite positive bound on every string, collection and record, and refuses unknown or arbitrary JSON.
    failureCodes:
      - BE_SCHEMA_BOUNDED
    enforcers:
      - {kind: eslint-be, id: schema-bounded}
  - id: R310
    code: BE_MUTATION_IDEMPOTENT
    law: An `Effectful` client command carries a required bounded idempotency key and runs through the inbox inside its domain transaction, refusing a reused key with different input.
    failureCodes:
      - BE_MUTATION_IDEMPOTENT
    enforcers:
      - {kind: eslint-be, id: mutation-idempotent}
  - id: R311
    code: HFS_TEXT_CORRUPT
    law: Every message catalog and locale file is valid UTF-8 and carries no lossy re-encode marks.
    failureCodes:
      - HFS_TEXT_CORRUPT
    enforcers:
      - {kind: hfs, id: text-integrity}
  - id: R312
    code: BE_UPLOAD_BUFFERED
    law: Browser uploads go directly to storage through presigned requests of the ObjectStorage port, and no multipart upload handling exists in the back end.
    failureCodes:
      - BE_UPLOAD_BUFFERED
    enforcers:
      - {kind: eslint-be, id: no-buffered-upload}
  - id: R313
    code: FE_APP_SHELL_FRAME
    law: The selected Grammar shell owns the fixed application frame with independent navigation and content scroll, and the application layout never recreates it.
    failureCodes:
      - FE_APP_SHELL_FRAME
    enforcers:
      - {kind: eslint-grammar-core, id: app-shell-frame}
  - id: R314
    code: FE_NAVBAR_CONTROL_SIZE
    law: Navbar controls share one height and icons one size per region from the selected Grammar scale.
    failureCodes:
      - FE_NAVBAR_CONTROL_SIZE
    enforcers:
      - {kind: eslint-grammar-core, id: navbar-control-size}
  - id: R315
    code: FE_NAVBAR_CLUSTER
    law: Navbar controls appear in the order language, theme, notifications and account, each supplied by the selected Grammar.
    failureCodes:
      - FE_NAVBAR_CLUSTER
    enforcers:
      - {kind: eslint-grammar-core, id: navbar-cluster}
  - id: R316
    code: FE_APP_SHELL_BOTTOM_TABS
    law: An application keeps the selected Grammar shell's navigation model across viewports and never replaces it with a bottom tab bar.
    failureCodes:
      - FE_APP_SHELL_BOTTOM_TABS
    enforcers:
      - {kind: eslint-grammar-core, id: no-shell-bottom-tabs}
  - id: R317
    code: FE_NAVBAR_CREATE
    law: Create actions live on the page that owns them, never in the global navbar.
    failureCodes:
      - FE_NAVBAR_CREATE
    enforcers:
      - {kind: eslint-grammar-core, id: no-navbar-create}
  - id: R318
    code: FE_NESTED_VARIANT
    law: Apps compose the Grammar with layout-only CSS; paint, variants and surface edges belong to the Grammar, and app styles never target Grammar internals.
    failureCodes:
      - FE_NESTED_VARIANT
      - FE_LIST_PANEL_PADDING
      - FE_GRAMMAR_LAYOUT_ONLY
      - FE_DIVIDER_FULL_BLEED
    enforcers:
      - {kind: eslint-fe, id: nested-control-variant}
      - {kind: eslint-fe, id: no-list-panel-padding}
      - {kind: eslint-fe, id: no-app-surface-paint}
      - {kind: eslint-fe, id: divider-full-bleed}
      - {kind: eslint-fe, id: selection-fill-no-check}
      - {kind: eslint-fe, id: no-grammar-internal-selector}
  - id: R319
    code: FE_BUTTON_INTENT
    law: An app Button declares an intent, never a variant; a destructive confirm lives in a confirmation dialog, a render holds at most one commit and a collection item none.
    failureCodes:
      - FE_BUTTON_INTENT
      - FE_BUTTON_INTENT_REQUIRED
      - FE_BUTTON_NO_VARIANT
      - FE_DESTRUCTIVE_CONFIRM_IN_DIALOG
      - FE_SINGLE_COMMIT_PER_RENDER
      - FE_NO_COMMIT_IN_COLLECTION_ITEM
    enforcers:
      - {kind: eslint-fe, id: button-intent-required}
      - {kind: eslint-fe, id: button-no-variant}
      - {kind: eslint-fe, id: destructive-confirm-in-dialog}
      - {kind: eslint-fe, id: single-commit-per-render}
      - {kind: eslint-fe, id: no-commit-in-collection-item}
  - id: R320
    code: FE_CONTROL_HEIGHT
    law: Every standalone control uses the selected Grammar's default control height, larger only for a landing hero call to action, and controls of one row share one size.
    failureCodes:
      - FE_CONTROL_HEIGHT
    enforcers:
      - {kind: eslint-fe, id: control-height}
  - id: R321
    code: FE_GRAMMAR_SHIM
    law: An app imports a Grammar component where it renders it and never re-exports a Grammar export under its own name; a Grammar defect is reported to the Grammar.
    failureCodes:
      - FE_GRAMMAR_SHIM
    enforcers:
      - {kind: eslint-fe, id: no-grammar-shim}
  - id: R322
    code: FE_CHIP_LABEL_CASE
    law: The label of a status chip (a StatusDot with text, a Badge) starts with an uppercase letter, so every chip of an app reads in one vocabulary.
    failureCodes:
      - FE_CHIP_LABEL_CASE
    enforcers:
      - {kind: eslint-grammar-core, id: chip-label-starts-uppercase}
