      - {kind: eslint-be, id: rest-route-declared}
  - id: R279
    code: BE_THIRD_PARTY_OWNER
    law: A third-party SDK outside the library allowlists is imported only by its one `integrations/<provider>` capability.
    failureCodes:
      - BE_THIRD_PARTY_OWNER
    enforcers:
      - {kind: eslint-be, id: third-party-import-owner}
  - id: R280
    code: HFS_UNUSED_SYMBOL
    law: Every enum member, queue constant, error code and catalog key has a production consumer, and dynamic keys are declared with a reason.
    failureCodes:
      - HFS_UNUSED_SYMBOL
