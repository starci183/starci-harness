  - id: R65
    code: FE_SIZE_AND_STATE_BUDGET
    law: Front-end code stays within the hook and state budgets, takes live time from the Grammar's shared clock, writes no poll loop, keys its lists, releases every effect in cleanup and swallows no error.
    failureCodes:
