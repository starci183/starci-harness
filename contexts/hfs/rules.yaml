  - id: R282
    code: HFS_ASSET_OVERSIZE
    law: Back-end build assets stay within the `be.assets` slot budget and extension allowlist, and model weights and datasets are never tracked.
    failureCodes:
      - HFS_ASSET_OVERSIZE
      - HFS_ASSET_KIND
