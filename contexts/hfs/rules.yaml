      - {kind: eslint-be, id: no-inline-param-type}
      - {kind: eslint-be, id: no-test-double-in-source}
      - {kind: eslint-be, id: no-default-export}
      - {kind: hfs, id: source-suffix}
      - {kind: eslint-be, id: source-suffix}
      - {kind: eslint-be, id: source-names}
      - {kind: eslint-be, id: public-contract-form}
  - id: R90
    code: BE_INFRA_OWNER
    law: Each raw infrastructure library, model SDKs included, is imported only by its one owning platform or integration capability, and only integrations call the `HttpClient` port. The socket decorators `@nestjs/websockets` are owned by `platform/realtime` and by the slot of the websocket door (`slot:be.feature.realtime.websocket`), so the mandatory `<channel>.gateway.ts` is legal and no other file imports them.
    failureCodes:
