# Engines a managed VPS installs from its distribution vendor (ops/vps.yaml `docker`): the package version `starci vps bootstrap` asks the
# vendor repository for, by OS family; the one place it is raised.
hosts:
  docker-ce: {version: 29.9.3, why: "Docker Engine of every managed VPS (docker-ce, docker-ce-cli and containerd.io from download.docker.com), the engine Docker Desktop of the harness host runs too"}
# Runtime peers a driver needs and npm does not install for it: an app whose root package.json depends on every
# package of `when` (at `major` when named) also declares `requires`. A missing peer passes the type check and the unit
# specs and fails only when the app boots, so an entry is added the day such a boot failure is found.
peers:
  nestjs-apollo-express5:
    when: [{package: '@nestjs/apollo'}, {package: '@nestjs/platform-express', major: 11}]
    requires: '@as-integrations/express5'
    why: "Express 5 serves Apollo Server 5 only through this integration, which @nestjs/apollo loads at boot without depending on it"
