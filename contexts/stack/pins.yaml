# The exact version of every shared dependency: one version per dependency for every app and package, except the command line
# itself, whose version in an app is the starci-harness that judges and scaffolds it (@starci/hfs takes it from the CLI). Raising a
# version changes this file first (with the package release when it is a @starci package), then the CLI's requirement of it
# (CONTRIBUTING.md CONTRIB-20, `starci check pins`), and each app moves in its own upgrade. The Grammar family and the two canons also
# carry `range`, a same-minor range an app's exact pin must meet instead of `version`:
# a patch of one of them then moves no other pin. @starci/hfs stays exact: an app takes it through starci-harness, and the check and the canon
# lint read one hfs. `side` is the side whose code uses it; `install: registry` marks a published @starci package that
# apps pin and CI installs from npm, never by path: an unreleased edit is installed only on one machine from the local registry
# (`starci deps install-local`), outside every committed file. `why` is one line; history lives in the package CHANGELOG.
schema: starci/stack-pins@1
pins:
  '@starci/common': {version: 1.0.1, group: starci, side: both, install: registry, why: "the shared concepts of every app and package: the coded error base DomainError with its guard and ErrorKind, Outcome, ok, refused and unwrapOutcome, the object guards isRecord and isPlainRecord, eachInOrder; platform/errors and platform/primitives re-export them and every @starci package derives its error from DomainError"}
  '@starci/heroicons': {version: 0.3.6, group: starci, side: fe, install: registry, why: "the extension glyph set: only the meanings @heroicons/react lacks, drawn in its style"}
  '@starci/event-stream': {version: 0.2.0, group: starci, side: fe, install: registry, why: "the one server-sent-events client; apps create one instance in modules/api/sse/clients"}
  '@starci/next-data': {version: 0.1.0, group: starci, side: fe, install: registry, why: "the SWR middleware pollingRestart, the viewer and tenant key helpers and the viewer cache of a front end; each operation's hook stays in the app"}
  '@starci/visual-effects': {version: 0.1.0, group: starci, side: fe, install: registry, why: "the visual effects of a front end over the Grammar theme, confetti first, on an overlay canvas of their own and skipped for reduced motion"}
  '@starci/object-storage': {version: 0.2.0, group: starci, side: be, install: registry, why: "object storage of a back end: the ObjectStorage port over S3-compatible storage; the only importer of the AWS S3 client libraries"}
  '@starci/nest-kit': {version: 0.2.2, group: starci, side: be, install: registry, why: "the module definition of every back-end module: defineConfigurableModule and defineCapabilityModule, one typed call per <x>.module-definition.ts"}
  '@starci/auth': {version: 0.6.0, group: starci, side: both, install: registry, why: "the sign-in of both editions: the lite server module with its sign-in providers, the full OIDC client of the identity provider with its issuer presets, the front-end clients, contracts and test doubles with the fake issuer; the only importer of the identity libraries"}
  '@starci/mail': {version: 0.2.0, group: starci, side: be, install: registry, why: "outgoing mail of a back end: the Mailer port over SMTP with timeouts, required STARTTLS, attachments, a shared SMTP target policy, coded errors, typed render helpers; the only importer of nodemailer"}
