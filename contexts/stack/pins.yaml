# Base images an app's Dockerfiles build FROM (R190); the image tag is pinned here and nowhere else.
images:
  node: {version: 22.14.0-alpine3.21, why: "the base image of every back-end and front-end Dockerfile"}
  supabase/postgres: {version: 17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2, why: "the db service of a lite app (pg_cron, pg_net, pgmq, vector, unaccent, pgcrypto); hfs sync DB_IMAGE renders it"}
# Runtime peers a driver needs and npm does not install for it (R111): an app whose root package.json depends on every
# package of `when` (at `major` when named) also declares `requires`. A missing peer passes the type check and the unit
# specs and fails only when the app boots, so an entry is added the day such a boot failure is found.
peers:
  nestjs-apollo-express5:
    when: [{package: '@nestjs/apollo'}, {package: '@nestjs/platform-express', major: 11}]
    requires: '@as-integrations/express5'
    why: "Express 5 serves Apollo Server 5 only through this integration, which @nestjs/apollo loads at boot without depending on it"
