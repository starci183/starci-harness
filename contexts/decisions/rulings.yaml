# The one log of owner rulings that knowledge, the grammar package, the canon lint and the policy exceptions carry. A
# ruling is what the owner decided, in present tense and in one place; the rule it shaped states it as plain law and
# lives in `owner` (a knowledge file and rule id, a package file, a lint rule, or a policy file). Rules never carry dates
# or ruling citations; a change that needs to point at the decision cites the ruling id here, and a `ruling` exception
# of policy/loosening.yaml or policy/security.yaml names a live id (or one it absorbs) as its `decision`.
#   id        stable; legacy spellings are kept so existing citations resolve (R212/case-4, control-height-40)
#   status    live | proposed (written, awaiting the owner; the gate that depends on it stays red)
#   absorbs   ids of earlier rulings this one replaced; a citation of an absorbed id resolves to this entry
#   pins      digests a gate compares against; only a ruling records a pin
#   covers    the gaps a ruling holds pending in hfs/rules.yaml's `pending` list (a slot rule code or a rule id); only a ruling lists them
#   words     optional: the owner's own words as given, in their language, when the ruling quotes them
# A new ruling replaces the entry it amends (replace, never append). Decisions taken by an agent and not yet
# confirmed live in decisions/open-*.md; when the owner confirms one, it moves here and its row there is deleted.
# Harness, release and process rulings (supervisor, release waves, push policy, loosening, draw loop) are not
# knowledge; decisions/open-core.md lists them for policy/ and contexts/harness/decisions.md.
schema: starci/rulings@1

rulings:
  # --- knowledge itself
  - id: knowledge-product-agnostic
    date: '2026-10-27'
    status: live
    ruling: "Knowledge is product-agnostic and English only; product records (brand direction, worked examples, screen records) live in that product's .starciwork."
    owner: "contexts/README.md"
  - id: feedback-hardens
    date: '2026-10-27'
    status: live
    ruling: "A feedback is absorbed by making the system stricter in one place (a rule rewritten where it lives, a grammar API that removes the choice, or a lint, gate or threshold), never by a case note or a second rule; each hardening records its ruling here."
    owner: "contexts/README.md"
  - id: same-app-from-same-inputs
    date: '2026-10-27'
    status: live
    ruling: "Every app is built from the grammar package plus knowledge and comes out the same in structure: which component, which spacing role, which anatomy. A structural choice an app could make two ways is a gap closed in the grammar or in ui, never left to the app. Paint is the other half and is the app's (ruling app-owns-theme)."
    owner: "contexts/README.md; code/fe/README.md"
  - id: two-grammars
    date: '2026-10-27'
    status: live
    ruling: "Two grammars exist, `core` (the legacy core grammar kept faithfully) and `offset-pop` (redesigned on the contract), both implementing the grammar contract per component role; an app picks one in hfs.json. Heritage and a separate `starci` family are dropped; the legacy catalog id `starci`, source id `core` and DNA id `starci-core` all mean `core`."
    owner: "contexts/grammars/README.md; contexts/grammars/contract.yaml"
    absorbs: [heritage-family]

  # --- grammar and vendor
  - id: grammar-vendor-parity
    date: '2026-10-25'
    status: live
    ruling: "Each grammar component that wraps HeroUI keeps HeroUI's anatomy, behaviour, accessibility and defaults; what a grammar may change is declared by its parity mode, and every deviation is a declared override in the wrapper manifest citing a ruling. A literal color preview uses the vendor's sm square swatch beside its app-owned name, preserving actual color data and the transparency checkerboard. The vendor reference is generated, never hand-written."
    owner: "contexts/vendor/parity.yaml; contexts/vendor/wrappers.yaml"
    absorbs: [grammar-vendor-wrappers-pin, grammar-vendor-wrappers-pin-final, grammar-vendor-wrappers-pin-repaints, grammar-vendor-wrappers-pin-control-height]
  - id: repaint-default-heroui-unless-ruled
    date: '2026-10-25'
    status: live
    ruling: "A grammar repaint of a property HeroUI decides stays only when a recorded ruling names it and its wrapper override cites that ruling; otherwise the CSS is removed and the vendor default shows, without waiting for the owner."
    owner: "contexts/vendor/wrappers.yaml"
  - id: heroui-defaults-first
    date: '2026-09-27'
    status: live
    ruling: "HeroUI's anatomy, behaviour and tokens come first: a grammar component reads HeroUI's tokens and keeps the vendor's defaults unless a recorded ruling names the repaint. An app departs from a family's default by setting HeroUI's tokens in its own CSS, never by repainting a component locally (ruling app-owns-theme)."
    owner: "contexts/ui/presentation.md (Paint)"
  - id: control-height-40
    date: '2026-10-26'
    status: live
    ruling: "One control height, the vendor md (40px), is the default of every standalone control; only sm (a control nested in an item or a dense toolbar) and lg (a landing hero call to action) exist besides it; controls of one row share one height. The values are the grammar's."
    owner: "contexts/ui/scale.md; '@starci/grammar src/common (control height tokens)'; lint control-height (R320)"
  - id: card-label-by-kind
    date: '2026-11-01'
    status: live
    ruling: "Where a card's name sits follows the card's kind, in every grammar, and no app or family chooses it. A card that heads a section (one subject with its own title: a list, an accordion, figures, a body that stands alone) carries its label outside the material, as an unpainted row above it. A tile, one of several peers repeated in a grid, carries its name inside, beside its logo or mark, and has no outside label. A docked region is a Pane, not a card, so a card has no panel placement. Each family paints the name; none moves it. The owner's words, relayed: label position depends on the card kind; a tile repeated in a grid carries its name inside with its logo; label outside fits only a card that heads a section."
    owner: "contexts/grammars/contract.md Card; contexts/grammars/contract.yaml (DNA-COMMON-CARD-LABEL-ABOVE, DNA-CORE-CARD-LABEL-OUTSIDE, DNA-OFFSET-POP-CARD-LABEL-OUTSIDE); contexts/grammars/core.md; contexts/ui/components/card.md card.choose.role; contexts/decisions/open-grammar.md G-20"
    absorbs: [card-label-placement-per-grammar]
  - id: app-owns-theme
    date: '2026-11-01'
    status: live
    words: "bản thân app phải set được không dựa grammar"
    ruling: "The structure of a screen comes out the same in every app; its paint is the app's. An app sets HeroUI's tokens in its own CSS, on :root, .light and .dark, and every part of the grammar follows; it writes no grammar-private name and may set nothing and take the family's default. A family publishes its default palette as an optional theme.css of HeroUI tokens, never as a declaration on the grammar root. The mode is the app's class on html. A tone x on its own tint wears x-soft and x-soft-foreground and a mark alone wears x, whatever the values. No gate and no rule judges the contrast of an app's chosen colours: a family's defaults are proved in the package's own stories and block nothing in an app. Avatar initial colours stay as identity art, not a theming violation."
    owner: "@starci/grammar src/core/theme.css, src/offset-pop/theme.css, src/common/styles.css; contexts/grammars/README.md (Theming); lint starci/theme-layer-shape"
    absorbs: [status-contrast]
  - id: card-grid-gap
    date: '2026-11-01'
    status: live
    ruling: "The cards and tiles of one Grid kind=\"cards\" stand the inline step (8) apart on both axes, and the grid sits the row step (12) under its title, because siblings sit closer than their heading. This replaces the section step (24) for a card grid."
    owner: "contexts/ui/presentation.md (Space); contexts/ui/situations.md; @starci/grammar src/core/frame/Grid"
  - id: native-peer-action-state
    date: '2026-11-02'
    status: live
    ruling: "Peer action groups retain the vendor's fused corners and size in ready, pending and loading states. Only the initiating member owns pending; unresolved group content is inert loading geometry. IconButton delegates its busy spinner to the native vendor parts and preserves its accessible name and duplicate-activation guard. Standalone corner rules do not override joined group members."
    owner: "contexts/grammars/contract.yaml roles.button-group; contexts/ui/components/action-group.md; contexts/vendor/wrappers.yaml; packages/grammar/src/core/composite/ButtonGroup; packages/grammar/src/core/leaf/IconButton"
  - id: entry-task-frame
    date: '2026-11-02'
    status: live
    ruling: "One full-height entry task is an EntryFrame: equal context and task panes on desktop, compact identity over the bounded centred form on mobile, tools at the top trailing edge and supporting navigation below. The app owns artwork and copy inside named slots; the Grammar owns every track, bound and responsive transition. The form measure is 24rem and the desktop split begins at 64rem, with no app look props."
    owner: "contexts/ui/components/entry-frame.md; contexts/grammars/contract.yaml roles.entry-frame; packages/grammar/src/core/frame/EntryFrame; packages/grammar/src/common/entry-frame.css"
  - id: message-status-facts
    date: '2026-11-02'
    status: live
    ruling: "A message's delivery acknowledgement and transport outcome are typed MessageStatus facts, rendered in the message's existing footer. The Bubble API gains no status flags. Receipt marks, read people, localized status text and polite announcements belong to that one composite; app text never chooses accent or status paint to imitate it."
    owner: "contexts/grammars/contract.yaml roles.message-status; contexts/ui/components/message-bubble.md; packages/grammar/src/core/composite/MessageStatus"
  - id: passive-calendar-day
    date: '2026-11-02'
    status: live
    ruling: "A passive calendar-region date is CalendarDay: a vendor-owned date-only value, a full localized name and the authoritative current-date fact. It draws a native time element and aria-current=date for today; only that semantic fact receives the current-date emphasis. Date selection and scheduler cell actions keep their existing owners."
    owner: "contexts/grammars/contract.yaml roles.calendar-day; contexts/ui/components/calendar-day.md; packages/grammar/src/core/leaf/CalendarDay"
  - id: semantic-region-relations
    date: '2026-11-02'
    status: live
    ruling: "A Grid kind is chosen by its content relation: independent named working sections, two equal portions of one reading or comparison unit, or one featured focus between symmetric support groups. The last two require named slots; no role takes arbitrary columns, gap, width or breakpoint props. Source and focus order are preserved. Independent working sections follow the wide workspace viewport; the other relations answer their own container."
    owner: "contexts/ui/composition.md grid.choose.content; contexts/grammars/contract.yaml roles.grid; packages/grammar/src/core/frame/Grid; packages/grammar/src/common/styles.css"
  - id: surfacecard-always-painted
    date: '2026-10-25'
    status: live
    ruling: "A card carries its shadow on the page background. A surface never stands inside another surface, dialogs and drawers included, so there is no nested edge (owner decision 2026-11-01, ruling surface-card-kinds)."
    owner: "contexts/ui/components/card.md; contexts/grammars/core.md"
  - id: surface-card-kinds
    date: '2026-11-01'
    status: live
    words: "Owner decisions of the grammar audit: kind=panes stays out; surface in surface is banned totally, dialogs and drawers included; a list is a card by default and a long list with search or filter is a Section; label by kind, a tile inside and a section card outside; tables do not go in cards unless truly complex."
    ruling: "SurfaceCard is the one card, a discriminated union on kind: body (default), figures, list, accordion, bands and tile. SurfaceListCard, SurfaceAccordionCard, StaticStateRow, ListRow as a public export and DescriptionList stat-strip are gone; a row is an item of kind=list. A card never stands inside another surface (a card, Pane surface, Dialog, Drawer, AlertDialog or Popover): development throws, R340 and R356 refuse it. A body card holds no hand list, Divider or second title (R355); a labelled card repeated in a Grid of cards is a tile (R366)."
    owner: "@starci/grammar src/core/frame/SurfaceCard, src/core/composite/ListRow, src/core/surfaceContext.tsx; contexts/grammars/contract.yaml roles.card; lint starci-grammar/surface-card-kind, no-label-in-grid, no-raised-surface-in-surface; starci app codemod surface-card-kinds"
  - id: R318/case-1
    date: '2026-10-25'
    status: live
    ruling: "Apps on a grammar write layout-only CSS and every visual element lives in the grammar package; contextual field variants, panel-list alignment and composite group identities are grammar capabilities, and the canon refuses static field variants, app surface paint and stacked list padding."
    owner: "contexts/code/fe/ui.md FE-CSS-1; contexts/ui/composition.md COLLECTION-3; lint R318"
  - id: alert-soft-pair
    date: '2026-11-05'
    status: live
    ruling: "A notice is the grammar Alert in one look: the tone's soft pair, background x-soft at full strength and glyph, title and description x-soft-foreground, with no shadow and no border, in Core and Offset Pop alike; tones map informative to info (the accent pair where the theme defines no info pair), affirmative to success, cautionary to warning, negative to danger and neutral, pending and unavailable to default; its action is the grammar Button in the variant the Alert gives its tone. The `appearance` prop is a deprecated no-op until it is removed."
    owner: "contexts/ui/components/toast-alert.md; contexts/grammars/core.md"
    absorbs: [ACCENT-5/case-6, alert-white-surface]
  - id: grammar-own-style
    date: '2026-11-05'
    status: live
    ruling: "Each Grammar has its own style. Core draws every colour from HeroUI's palette tokens only: accent, default, success, warning and danger with their soft and foreground pairs (and the neutral ground and text tokens HeroUI defines: background, foreground, surface, muted, border, separator); Core has no palette of its own. Offset Pop and any other Grammar are free to choose their own palette. An app may ADD tones to Core's built-in ones (Nivo's `info`): it supplies the four tokens `--<tone>`, `--<tone>-foreground`, `--<tone>-soft`, `--<tone>-soft-foreground` in its theme and declares the name in the Grammar's `GrammarToneRegistry` (confirmed by the owner 2026-11-05: Core ships HeroUI's tones only; `informative` is an intent that is the accent unless the app writes `--informative*`). A debt of one Grammar (Offset Pop's ink on pink, its 44px md Select at 390) never drives a rule of Core. Confirmed by the owner 2026-11-05."
    owner: "contexts/grammars/contributing.md Paint; contexts/grammars/core.md; contexts/grammars/offset-pop.md"
  - id: one-way-to-choose
    date: '2026-11-05'
    status: live
    ruling: "A choice among a few has one component by meaning and the Grammar draws no group of attached buttons: Tabs switch a view (page head) or filter a list (kind filter: compact underline tabs with a count, inside the list pane under its search field; a tab's count is drawn as a chip: neutral, the accent soft pair on the selected tab, the warning soft pair when the view waits for the reader; counts as chips, confirmed by the owner 2026-11-05, replacing the plain muted count), ChoiceChips or RadioGroup choose a value of a form (a tablist is not a form field), a date is the Calendar and a time ChoiceChips, actions are separate Buttons or a DropdownMenu. ButtonGroup and FilterButtonGroup are deprecated for one release and refused in product source (R380); SegmentedControl is removed (grammar 0.24.0): a switch of a mode or period is Tabs appearance primary in a card switch header zone, a value of a form is ChoiceChips or RadioGroup."
    owner: "contexts/ui/components/tabs.md; contexts/ui/composition.md CTA-1; contexts/grammars/contract.md; contexts/vendor/wrappers.yaml (ChoiceChips, ScheduleGrid: wraps only, no override; the digest moved here from native-peer-action-state, confirmed by the owner 2026-11-05)"
    pins:
      contexts/vendor/wrappers.yaml: 781d2a9e5cf6fab5a671230cc9d5b36ccda3394eeb909c0d424f20be7d81f8bd
  - id: region-loading
    date: '2026-11-05'
    status: live
    ruling: "Every Grammar component that can sit in a loading region draws its loading state from the region, never from a prop per control: Section, PaneSection, SurfaceCard, Form and a Dialog or Drawer body publish the first-load flag, and a component inside draws the same box as when ready, inert, with the region carrying the one aria-busy. Static chrome (titles, tab labels, 'Cancel', field labels) keeps its real words and only goes inert; data (values, counts, rows, chips, avatars, a button labelled with a count) becomes geometry. An explicit isLoading overrides the region for one control. Loading is not pending (isPending keeps its spinner), only a first load counts (a refresh keeps its data), a Dialog, Drawer or Popover starts a fresh region, and a create form is never loading. The contract check scripts/check-region-loading.mts fails a component that neither honours the region nor is listed with its reason."
    owner: "contexts/ui/loading.md; contexts/grammars/contract.md; packages/grammar/src/common/region-loading.ts"
  - id: meter-segments-h1
    date: '2026-09-27'
    status: live
    ruling: "A segmented capability meter is the grammar Meter's equal segments on a thin full-width transparent track."
    owner: "contexts/vendor/wrappers.yaml (Meter)"
  - id: buttons-pill
    date: '2026-09-27'
    status: live
    ruling: "Buttons are pills in the core grammar (the vendor's own corner), and a button skeleton takes the same corner."
    owner: "contexts/grammars/core.md"
  - id: icon-tile-neutral
    date: '2026-09-27'
    status: live
    ruling: "An identity tile is neutral and spends no accent."
    owner: "contexts/ui/composition.md ACCENT-2"
  - id: status-soft-pair-on-background
    date: '2026-11-01'
    status: live
    ruling: "A status tone x (success, warning, danger, info) paints content one of two ways. Content that sits on a background of the tone (a tint, a tinted tile, a tinted band) uses the pair x-soft and x-soft-foreground; a mark that stands alone, with no background of the tone behind it (a bare glyph, a required asterisk, a count, a title on the page or on a neutral surface), uses x itself. A solid fill takes x-foreground. The soft pair on its tint is accepted at the lower contrast floor and body and interactive text keep the full floor; a family's own default tones are proved in the package's stories at `contrast.statusSoft` as a glyph or title and at `contrast.text` as body text, and no gate judges the colours an app sets (ruling app-owns-theme). Core's light tones are set so a bare mark reaches 3:1 on the surface (success oklch(62.8% 0.1941 162.85), warning oklch(67% 0.159 84.37), info oklch(66.8% 0.17 250)). Named exception: on Offset Pop's light theme only, a bare status mark wears the soft foreground, because the owner kept the pastel tones (\"1. Pastel\") and a bare success, warning or info there measures 1.30 to 1.46:1; Offset Pop's dark theme keeps bare x, and the lint reports no lone soft foreground for Offset Pop."
    words: "TEXT TRÊN BG THÌ X-SOFT VÀ X-SOFT-FOREGROUND, CÒN NẾU X ĐỘC LẬP THÌ ĐỂ X LUN"
    owner: "contexts/ui/proof/thresholds.yaml; contexts/ui/presentation.md (Tone); lint starci-grammar/status-text-uses-soft-foreground"
    absorbs: [status-tones-follow-heroui]
  - id: secondary-input-contrast-accepted
    date: '2026-09-27'
    status: live
    ruling: "The fill of a field nested in a surface is accepted as the vendor renders it; the field is carried by its fill, label and focus outline, and the focus outline still meets the non-text floor."
    owner: "contexts/ui/proof.md"
  - id: grammar-menu-drawer-live-time
    date: '2026-10-25'
    status: live
    ruling: "The grammar owns a menu item's exclusive mark or glyph, the current-item mark of navigation, drawer state through its overlay contract, and one shared clock for live relative time and countdowns; apps compose these with layout-only CSS and own no display clock."
    owner: "contexts/vendor/wrappers.yaml; contexts/code/fe/i18n.md FE-I18N-5"
  - id: avatar-default-dicebear-initials
    date: '2026-10-25'
    status: live
    ruling: "An avatar without an uploaded image draws the grammar's bundled initials (first letter of the first and last words of the name), coloured by the user or entity id when given and by the name otherwise, through one renderer for every avatar surface."
    owner: "contexts/ui/components/identity-mark.md; '@starci/grammar Avatar'"
  - id: agent-avatar-initials-bot-badge
    date: '2026-10-25'
    status: live
    ruling: "An agent's name is free text under the same initials rule; the agent kind adds the grammar's bot badge with an accessible name, hidden below its size floor."
    owner: "contexts/ui/components/identity-mark.md"
  - id: item-description-one-line
    date: '2026-10-25'
    status: live
    ruling: "A collection item's description shows one line with an ellipsis by default (up to three by prop); a conversation title carries no group glyph, and an unread row strengthens label and description through the grammar."
    owner: "contexts/ui/components/list-table.md"
  - id: panel-list-box-edge
    date: '2026-10-25'
    status: live
    ruling: "A panel list aligns each row box with the panel content edge; content keeps the vendor item padding and radius inside it, and hover, pressed and selected fills keep them, with no negative-margin bleed."
    owner: "contexts/ui/presentation.md (Space)"
  - id: selection-fill-no-check
    date: '2026-10-26'
    status: live
    ruling: "Navigation-like single-select rows show selection and hover by fill, without a check indicator, while the selected state stays available to assistive technology."
    owner: "contexts/ui/components/list-table.md"
  - id: scroll-region-background-tone
    date: '2026-10-26'
    status: live
    ruling: "A chat-like or log-like scroll region takes the background tone under its items, while its header and composer stay on the surface tone."
    owner: "contexts/ui/presentation.md (Surface)"
  - id: hover-actions-floating-toolbar
    date: '2026-10-26'
    status: live
    ruling: "An item's actions that show on hover and focus are the grammar's floating strip beside it, tooltip-named icon commands that never overlap its text; a MessageBubble draws its own."
    owner: "contexts/ui/components/message-bubble.md"
  - id: divider-full-bleed
    date: '2026-10-26'
    status: live
    ruling: "A divider runs the full width of its surface, flush to the edge; padding sits on the bands, never on the ancestor."
    owner: "contexts/ui/presentation.md (Boundary)"
  - id: button-variant-follows-intent
    date: '2026-10-25'
    status: live
    ruling: "A button's variant is a consequence of its declared intent (and step for destructive), resolved by the grammar from the placement it reads from context; the label word never decides the intent. A command repeated per collection item is neutral and renders without fill."
    owner: "contexts/ui/composition.md CTA-6; contexts/grammars/contract.yaml (intent); lint R319"
  - id: grammar-scroll-region-fills-parent
    date: '2026-10-27'
    status: proposed
    ruling: "A contained scroll region fills its parent's block size, so the parent owns the height cap and one owner scrolls each axis."
    owner: "contexts/vendor/wrappers.yaml; contexts/decisions/open-grammar.md D-11"
  - id: grammar-rating-radiogroup
    date: '2026-10-27'
    status: proposed
    ruling: "A rating, which HeroUI does not ship, is one radio group of stars, the platform pattern for one value from a closed set."
    owner: "contexts/vendor/wrappers.yaml; contexts/decisions/open-grammar.md D-11"
  - id: colours-final
    date: '2026-11-02'
    status: proposed
    ruling: "The grammar's colours are final: no change of the grammar package, a lane or a law moves a colour on its own, and a law that only a colour change can satisfy is exempt from the run until the owner confirms its retirement or names the colour to move. DNA-COMMON-TREATMENT-TEXT-CONTRAST is such a law."
    owner: "contexts/decisions/open-grammar.md D-17; contexts/grammars/contract.yaml DNA-COMMON-TREATMENT-TEXT-CONTRAST"

  # --- ui composition (owner decisions folded into ui/ as plain rules)
