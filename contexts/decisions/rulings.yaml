    owner: "@starci/grammar src/core/frame/Freestyle; @starci/eslint-grammar-core src/freestyle.ts (R341) and exemptFreestyle; @starci/eslint-canon-fe src/lib/freestyle.ts; contexts/ui/components/freestyle.md"
