# The one log of owner rulings that knowledge, the grammar package, the canon lint and the policy exceptions carry. A
# ruling is what the owner decided, in present tense and in one place; the rule it shaped states it as plain law and
# lives in `owner` (a knowledge file and rule id, a package file, a lint rule, or a policy file). Rules never carry dates
# or ruling citations; a change that needs to point at the decision cites the ruling id here, and a `ruling` exception
# of policy/loosening.yaml or policy/security.yaml names a live id (or one it absorbs) as its `decision`.
#   id        stable; legacy spellings are kept so existing citations resolve (R212/case-4, control-height-40)
#   status    live | proposed (written, awaiting the owner; the gate that depends on it stays red)
#   absorbs   ids of earlier rulings this one replaced; a citation of an absorbed id resolves to this entry
#   pins      digests a gate compares against; only a ruling records a pin
#   covers    the gaps a ruling holds pending in hfs/rules.yaml's `pending` list (a slot rule code or a rule id); only a ruling lists them
#   words     optional: the owner's own words as given, in their language, when the ruling quotes them
# A new ruling replaces the entry it amends (replace, never append). Decisions taken by an agent and not yet
# confirmed live in decisions/open-*.md; when the owner confirms one, it moves here and its row there is deleted.
# Harness, release and process rulings (supervisor, release waves, push policy, loosening, draw loop) are not
# knowledge; decisions/open-core.md lists them for policy/ and contexts/harness/decisions.md.
schema: starci/rulings@1

rulings:
  # --- knowledge itself
  - id: knowledge-product-agnostic
    date: '2026-10-27'
    status: live
    ruling: "Knowledge is product-agnostic and English only; product records (brand direction, worked examples, screen records) live in that product's .starciwork."
    owner: "contexts/README.md"
  - id: feedback-hardens
    date: '2026-10-27'
    status: live
    ruling: "A feedback is absorbed by making the system stricter in one place (a rule rewritten where it lives, a grammar API that removes the choice, or a lint, gate or threshold), never by a case note or a second rule; each hardening records its ruling here."
    owner: "contexts/README.md"
  - id: same-app-from-same-inputs
    date: '2026-10-27'
    status: live
    ruling: "Every app is built from the grammar package plus knowledge and comes out the same; a visual choice an app could make two ways is a gap closed in the grammar or in ui, never left to the app."
    owner: "contexts/README.md; code/fe/README.md"
  - id: two-grammars
    date: '2026-10-27'
    status: live
    ruling: "Two grammars exist, `core` (the legacy core grammar kept faithfully) and `offset-pop` (redesigned on the contract), both implementing the grammar contract per component role; an app picks one in hfs.json. Heritage and a separate `starci` family are dropped; the legacy catalog id `starci`, source id `core` and DNA id `starci-core` all mean `core`."
    owner: "contexts/grammars/README.md; contexts/grammars/contract.yaml"
    absorbs: [heritage-family]

  # --- grammar and vendor
  - id: grammar-vendor-parity
    date: '2026-10-25'
    status: live
    ruling: "Each grammar component that wraps HeroUI keeps HeroUI's anatomy, behaviour, accessibility and defaults; what a grammar may change is declared by its parity mode, and every deviation is a declared override in the wrapper manifest citing a ruling. The vendor reference is generated, never hand-written."
    owner: "contexts/vendor/parity.yaml; contexts/vendor/wrappers.yaml"
    absorbs: [grammar-vendor-wrappers-pin, grammar-vendor-wrappers-pin-final, grammar-vendor-wrappers-pin-repaints, grammar-vendor-wrappers-pin-control-height]
  - id: repaint-default-heroui-unless-ruled
    date: '2026-10-25'
    status: live
    ruling: "A grammar repaint of a property HeroUI decides stays only when a recorded ruling names it and its wrapper override cites that ruling; otherwise the CSS is removed and the vendor default shows, without waiting for the owner."
    owner: "contexts/vendor/wrappers.yaml"
  - id: heroui-defaults-first
    date: '2026-09-27'
    status: live
    ruling: "HeroUI and grammar defaults come first; the canvas stays the vendor background, and a brand departure is a declared brand token, never a local repaint."
    owner: "contexts/ui/presentation.md (Paint)"
  - id: control-height-40
    date: '2026-10-26'
    status: live
    ruling: "One control height, the vendor md (40px), is the default of every standalone control; only sm (a control nested in an item or a dense toolbar) and lg (a landing hero call to action) exist besides it; controls of one row share one height. The values are the grammar's."
    owner: "contexts/ui/scale.md; '@starci/grammar src/common (control height tokens)'; lint control-height (R320)"
  - id: card-label-placement-per-grammar
    date: '2026-10-28'
    status: live
    ruling: "Whether a labelled card's label sits inside or outside the painted material is each grammar's decision; core (starci) puts it outside, an unpainted row above the card, only when the card floats inside the content; a card that is a docked panel of the layout keeps its title inside as its header; offset-pop keeps it outside. Core is HeroUI shaped like the Claude app: full-bleed dividers, surface in surface allowed (nested is unraised), 40px controls. The owner's words: label inside or outside is decided per grammar; outside is relative, only when the card floats in the content. The inside version came from a legacy WIP commit (57e5851e5) without a ruling."
    owner: "contexts/grammars/contract.yaml (DNA-CORE-CARD-LABEL-OUTSIDE, DNA-OFFSET-POP-CARD-LABEL-OUTSIDE); contexts/grammars/core.md; @starci/grammar src/core/styles.css"
  - id: surfacecard-always-painted
    date: '2026-10-25'
    status: live
    ruling: "A card carries its shadow on the page background and its border, without shadow, when it sits on another surface."
    owner: "contexts/ui/components/card.md; contexts/grammars/core.md"
  - id: R318/case-1
    date: '2026-10-25'
    status: live
    ruling: "Apps on a grammar write layout-only CSS and every visual element lives in the grammar package; contextual field variants, panel-list alignment and composite group identities are grammar capabilities, and the canon refuses static field variants, app surface paint and stacked list padding."
    owner: "contexts/code/fe/ui.md FE-CSS-1; contexts/ui/composition.md COLLECTION-3; lint R318"
  - id: alert-white-surface
    date: '2026-09-27'
    status: live
    ruling: "A notice is the vendor Alert on its surface with the tone on its indicator and title only; a `soft` appearance (the tone's soft tint, no shadow) is the one tinted alternative; its action is the grammar Button in the variant the Alert gives its tone."
    owner: "contexts/ui/components/toast-alert.md; contexts/grammars/core.md"
    absorbs: [ACCENT-5/case-6]
  - id: meter-segments-h1
    date: '2026-09-27'
    status: live
    ruling: "A segmented capability meter is the grammar Meter's equal segments on a thin full-width transparent track."
    owner: "contexts/vendor/wrappers.yaml (Meter)"
  - id: buttons-pill
    date: '2026-09-27'
    status: live
    ruling: "Buttons are pills in the core grammar (the vendor's own corner), and a button skeleton takes the same corner."
    owner: "contexts/grammars/core.md"
  - id: icon-tile-neutral
    date: '2026-09-27'
    status: live
    ruling: "An identity tile is neutral and spends no accent."
    owner: "contexts/ui/composition.md ACCENT-2"
  - id: status-tones-follow-heroui
    date: '2026-09-30'
    status: live
    ruling: "A status tone has a solid pair and a soft pair as HeroUI defines them; the soft foreground on its tint is accepted at the lower contrast floor, a bare status glyph takes the soft foreground, and body and interactive text keep the full floor."
    owner: "contexts/ui/proof/thresholds.yaml; contexts/ui/presentation.md (Paint)"
  - id: secondary-input-contrast-accepted
    date: '2026-09-27'
    status: live
    ruling: "The fill of a field nested in a surface is accepted as the vendor renders it; the field is carried by its fill, label and focus outline, and the focus outline still meets the non-text floor."
    owner: "contexts/ui/proof.md"
  - id: grammar-menu-drawer-live-time
    date: '2026-10-25'
    status: live
    ruling: "The grammar owns a menu item's exclusive mark or glyph, the current-item mark of navigation, drawer state through its overlay contract, and one shared clock for live relative time and countdowns; apps compose these with layout-only CSS and own no display clock."
    owner: "contexts/vendor/wrappers.yaml; contexts/code/fe/i18n.md FE-I18N-5"
  - id: avatar-default-dicebear-initials
    date: '2026-10-25'
    status: live
    ruling: "An avatar without an uploaded image draws the grammar's bundled initials (first letter of the first and last words of the name), coloured by the user or entity id when given and by the name otherwise, through one renderer for every avatar surface."
    owner: "contexts/ui/components/identity-mark.md; '@starci/grammar Avatar'"
  - id: agent-avatar-initials-bot-badge
    date: '2026-10-25'
    status: live
    ruling: "An agent's name is free text under the same initials rule; the agent kind adds the grammar's bot badge with an accessible name, hidden below its size floor."
    owner: "contexts/ui/components/identity-mark.md"
  - id: item-description-one-line
    date: '2026-10-25'
    status: live
    ruling: "A collection item's description shows one line with an ellipsis by default (up to three by prop); a conversation title carries no group glyph, and an unread row strengthens label and description through the grammar."
    owner: "contexts/ui/components/list-table.md"
  - id: panel-list-box-edge
    date: '2026-10-25'
    status: live
    ruling: "A panel list aligns each row box with the panel content edge; content keeps the vendor item padding and radius inside it, and hover, pressed and selected fills keep them, with no negative-margin bleed."
    owner: "contexts/ui/presentation.md (Space)"
  - id: selection-fill-no-check
    date: '2026-10-26'
    status: live
    ruling: "Navigation-like single-select rows show selection and hover by fill, without a check indicator, while the selected state stays available to assistive technology."
    owner: "contexts/ui/components/list-table.md"
  - id: joined-multi-pane
    date: '2026-10-26'
    status: live
    ruling: "List, detail and information panes form one joined surface separated by vertical dividers, with no gap showing the page background; an absent pane removes its divider."
    owner: "contexts/ui/composition.md LAYOUT-1"
  - id: scroll-region-background-tone
    date: '2026-10-26'
    status: live
    ruling: "A chat-like or log-like scroll region takes the background tone under its items, while its header and composer stay on the surface tone."
    owner: "contexts/ui/presentation.md (Surface)"
  - id: hover-actions-floating-toolbar
    date: '2026-10-26'
    status: live
    ruling: "Message actions use the grammar's floating toolbar beside the bubble, tooltip-named icon buttons that never overlap its text."
    owner: "contexts/ui/composition.md (Action)"
  - id: divider-full-bleed
    date: '2026-10-26'
    status: live
    ruling: "A divider runs the full width of its surface, flush to the edge; padding sits on the bands, never on the ancestor."
    owner: "contexts/ui/presentation.md (Boundary)"
  - id: button-variant-follows-intent
    date: '2026-10-25'
    status: live
    ruling: "A button's variant is a consequence of its declared intent (and step for destructive), resolved by the grammar from the placement it reads from context; the label word never decides the intent. A command repeated per collection item is neutral and renders without fill."
    owner: "contexts/ui/composition.md CTA-6; contexts/grammars/contract.yaml (intent); lint R319"
  - id: grammar-scroll-region-fills-parent
    date: '2026-10-27'
    status: proposed
    ruling: "A contained scroll region fills its parent's block size, so the parent owns the height cap and one owner scrolls each axis."
    owner: "contexts/vendor/wrappers.yaml; contexts/decisions/open-grammar.md D-11"
  - id: grammar-rating-radiogroup
    date: '2026-10-27'
    status: proposed
    ruling: "A rating, which HeroUI does not ship, is one radio group of stars, the platform pattern for one value from a closed set."
    owner: "contexts/vendor/wrappers.yaml; contexts/decisions/open-grammar.md D-11"

  # --- ui composition (owner decisions folded into ui/ as plain rules)
  - id: chip-label-uppercase
    date: '2026-10-27'
    status: live
    ruling: "A chip label starts uppercase: StatusDot capitalises the text it renders, and a literal StatusDot or Badge label is written with an uppercase first letter."
    owner: "contexts/hfs/rules.yaml R322; packages/eslint-grammar-core/chip-label.mjs"
  - id: CTA-1/case-5
    date: '2026-10-11'
    status: live
    ruling: "A view shows one primary per command; an empty region's empty notice owns the command and the header omits it until content exists."
    owner: "contexts/ui/composition.md CTA-1"
  - id: CTA-1/case-6
    date: '2026-10-11'
    status: live
    ruling: "Peer choices are bordered secondary chips or a segmented control, the selected one on accent-soft with an accent border; never bare pills, a primary among them, or a local chip recipe."
    owner: "contexts/ui/components/chip.md; contexts/ui/components/segmented-control.md"
  - id: CTA-1/case-7
    date: '2026-10-12'
    status: live
    ruling: "A decision and its way out are separate buttons at the inline gap, way out first and the single primary last, never a button group; a button group is only for a few peer commands of one intent on one object."
    owner: "contexts/ui/components/action-group.md; contexts/ui/composition.md CTA-5"
  - id: CTA-4/case-5
    date: '2026-10-12'
    status: live
    ruling: "An unsubmitted row is removed at once by a danger-soft icon button; deleting stored data goes through a confirmation dialog whose confirm is the solid danger button."
    owner: "contexts/ui/composition.md CTA-4"
  - id: LAYOUT-1/case-8
    date: '2026-10-12'
    status: live
    ruling: "Secondary options of a task sit in one closed accordion card below the main task, whose summary says in words who may use the result."
    owner: "contexts/ui/composition.md LAYOUT-1"
  - id: LAYOUT-1/case-9
    date: '2026-10-12'
    status: live
    ruling: "Each source sits with its own kind: a cloud picker as a secondary button under the drop zone, links as a list of inputs with an \"add\" ghost command; no separate staging step."
    owner: "contexts/ui/composition.md LAYOUT-1"
  - id: page-header-band
    date: '2026-10-28'
    status: live
    ruling: "A page is headed by Grammar's PageHeader: a surface band across the primary region whose content shares the page content's edges, ending in its own full-width separator with or without tabs, page tabs standing on it; an app never composes Breadcrumbs and SectionHeader into a page head."
    owner: "contexts/ui/components/page-header.md; contexts/grammars/contract.yaml page-header; contexts/hfs/rules.yaml R323"
  - id: page-frame
    date: '2026-10-29'
    status: live
    ruling: "A route page is one Grammar Page: the header band full width, the body always inside the page measure and gutter one region step below it, nothing in the body escaping the gutter; Page is the single owner of the page inset and the page rhythm, layout frames are pure layout and never wrap a page in PageContainer; page tabs are the header's tabs. An app surface (a chat, a split editor) is a Page with chrome bleed: no inline gutter, no block padding and no clip, the body filling the region so a FillViewport in it keeps its one bottom inset; its header is optional, and when given it is the band (a title) or the breadcrumbs alone, the title optional only in bleed. A route draws exactly one Page, drawn by its page owner, by the owner's pure half, or by the one connected block the owner renders as its root (one level), where client data builds the header a server owner may not; siblings beside it or a second Page stay refused. A route segment layout whose owner, its pure half or its one root block draws a Page with its header and header.tabs as link tabs is the one Page of every route under it: those page owners draw body content only, need no Page and are refused one; the layout's Page has nothing beside it, so a PageHeader beside it moves into its header. A page owner that draws no UI (it only redirects, refuses with notFound or returns null) needs no Page, nor does a page mounted only under the auth route group (auth), whose layout draws the auth frame that is its page frame; workbench pages are ordinary pages."
    owner: "contexts/ui/components/page-header.md; contexts/grammars/contract.yaml page; contexts/hfs/rules.yaml R324, R325"
  - id: mermaid-diagram
    date: '2026-10-28'
    status: live
    ruling: "An article's Mermaid diagrams render through Grammar's MermaidDiagram in the grammar's theme, with Mermaid loaded lazily, the loading box kept and a refused source shown as code in the same region; FlowGraph draws flowchart node shapes and edge labels."
    owner: "contexts/ui/components/diagram.md; contexts/grammars/contract.yaml diagram"
  - id: field-anatomy-order
    date: '2026-10-28'
    status: live
    ruling: "Every field draws HeroUI's order, label, control, description, error, with the description under the control; a group keeps HeroUI's group order. Fields that pair sit in Grammar's FormGrid, whose rows align on the control line whatever a neighbour carries, its columns from its own width."
    owner: "contexts/grammars/contract.md input; contexts/grammars/contract.yaml DNA-COMMON-FIELD-ANATOMY-ORDER, DNA-COMMON-FIELD-ROW-CONTROL-LINE; contexts/ui/components/text-field.md"
  - id: copy-field
    date: '2026-10-28'
    status: live
    ruling: "A value the reader copies and never edits is Grammar's CopyField: a read-only field at the field height with its copy action inside at the end, named in the app's words, a long value truncated in the middle and whole in a tooltip and for a screen reader, a secret masked to bullets and its last four with the clear value only in the app's onCopy, a copied state of about two seconds announced politely and a failed copy as the field's error."
    owner: "contexts/grammars/contract.md copy-field; contexts/grammars/contract.yaml copy-field; contexts/ui/components/text-field.md"
  - id: page-header-breadcrumbs
    date: '2026-10-11'
    status: live
    ruling: "The trail above a page heading is breadcrumbs; the page's command sits in the header's action slot and no loose action row stands between header and content."
    owner: "contexts/ui/composition.md LAYOUT-1"
  - id: RESPONSIVE-1/case-6
    date: '2026-10-12'
    status: live
    ruling: "A form inside a narrow owner stays one column; several field columns appear only through a container query on the form's own owner."
    owner: "contexts/ui/composition.md RESPONSIVE-1"
  - id: STATE-6/case-5
    date: '2026-10-12'
    status: live
    ruling: "Switching whole panels is tabs; a segmented control chooses one value inside a form and never swaps panels."
