  - id: page-panes-frame
    date: '2026-10-31'
    status: live
    words: "sao trang lan agent có gap 1 khoảng trên vậy??? … phải dính vào chứ"
    ruling: "A tabbed app page's PaneGrid attaches flush under the tab line, full width and to the bottom of the viewport, with no card, radius or gap between the tabs and the grid: Page chrome=\"panes\" is that frame, and a card, a joined surface or a FillViewport around panes is not."
    owner: "@starci/grammar src/core/composition/Page; lint starci-grammar/pane-grid-page and starci-fe/no-hand-built-panes (R348, R349); contexts/ui/components/page-header.md"
  - id: spacing-roles
    date: '2026-10-31'
    status: live
    words: "ý là tùy mà p-3, tùy cái mà px khác py khác, thầy muốn trò suy nghĩ thấu đáo hiểu k / tương tự với gap, m,... thầy muốn deep thinking / rồi làm r / hay full 3 bỏ 4 đi!!! thầy nghĩ nên v"
    ruling: "Spacing is one scale, 0 4 8 12 24 32, with no 16, and every value on it is the Grammar's: an app names the relation between the blocks it places through role props (Stack and Cluster gap identity, inline, row, section or region; Grid kind cards, form or main-rail; PaneSection; Page chrome) and writes no spacing utility. Gaps are roles, strictly ordered: identity 4, inline 8, row 12, section 24, region 32. Insets are levels, each side taking its value from what it touches: every container (a card dense or holding a form, a pane on every side, a dialog or drawer, a band) holds its content 12 in, a box inside a card 8, a low-density region (an empty state, a drop target) 24, the page gutter 12 on a phone, 24 from the medium breakpoint and 32 from wide, stepped and never fluid, except on a page of panes (Page chrome=\"panes\"), whose header takes 12 at every width so the title, the first tab and the pane content share one edge and the gutter column starts at the pane content edge; controls take inline sm 8, md 12, lg 24, one step less on a glyph side, and their block padding comes from their height. A closed box has equal block sides and never two steps between its sides; extra separation belongs to the parent's gap. The page title, the tab labels and the section headings share one text edge with the card or pane box below: tabs are the underline bar with the first label on that edge, pills are only for filters and chips, and the card's inner 12 is the one intentional step. The lint ships at warn for one cohort with a per-rule count while the spacing-roles codemod moves apps onto the role props, then moves to error."
    owner: "@starci/grammar src/common/spacing.ts, src/common/styles.css (root tokens), src/common/components-spacing.css, src/core/composition/Stack, Cluster, Grid, Page (chrome panes); lint starci-fe/no-spacing-utility and starci/spacing-scale (R350); starci app codemod spacing-roles; contexts/ui/presentation.md Space"
    pins:
      contexts/vendor/wrappers.yaml: 0da99e774deba147e983918c237820ad853fd05840a0d04b5b71c9c2c6030a09
