  - id: app-check-cache
    date: '2026-10-31'
    status: live
    ruling: "Every app commits the results of `starci app check` and its unit coverage run in `.starcistacks/cache/` (check/, lint/, test-coverage/, sonar-baseline/, codecov-baseline/), one subfolder per existing family selected by repeatable `--gate <name>` (`sonar` and `codecov` select the same combined prediction family), keyed by content hashed with CRLF normalised to LF, never by time, deterministic and split per area; the CLI writes it and `app sync` never overwrites it. On a host and in CI a run judges only what differs from the cache; it is full when the cache is missing, on `--no-cache` (which writes refreshed records), when the one fingerprint check, lint and coverage share differs, and for a release. Every run hashes every file again, so a file whose hash differs is judged for real; CI trusts the cache only as it stands at the trusted base and fails a change whose committed record disagrees with what it inherited or computed. Sonar and Codecov baselines hold reference data only; the servers keep judging. The design is contexts/project/check-cache.md. Owner decisions, 2026-10-31: HFS_CHECK_CACHE_FORGED is a hard blocker at any count, HFS_CHECK_CACHE_STALE and HFS_CHECK_CACHE_MISSING only warn; the release trusts the warm cache, verified nightly (harness decision release-gate-warm-cache, 2026-11-04); branch protection requiring the check is a later follow-up."
    owner: "contexts/project/check-cache.md; @starci/hfs src/main.mts, lint/run.mts, coverage/, templates/; contexts/hfs/slots.yaml and rules.yaml once built"
    words: "app check cache lại vào file dc không? sau chỉ check diff; giao làm luôn đi; nếu không có json thì check full hoặc trò require --force như github đi; suy nghĩ thiết kế phần này 1 agent opus nhé; chốt starcistacks lưu hết nhé và check diff và triển cho ci và local lun; thiết kế chuẩn để check ra bệnh và ghi vào cache"
  - id: app-check-cli-selectors
    date: '2026-11-02'
    status: live
    ruling: "`app check` keeps its existing core, cache trust and thresholds. No arguments run every existing family with valid-cache reuse; repeatable `--gate <name>` selects work, and `--no-cache` dispatches selected work through the existing full-run path and normal cache writer. The public `--full` spelling is removed. Ten public names map to nine existing core families: sonar and codecov both select the same combined prediction family and execute it once. Their predictions remain diagnostics and never pass or fail a run; actual Sonar CI/release server checks and Codecov CI ownership are unchanged. `--staged` remains the separate pre-commit guard. `app check` is the one verb for app quality (owner, 2026-11-03): the `lint` verb is removed, `--gate lint` judges what it judged, `--side be|fe` limits the lint gate to one side, `--out <file>` writes the merged Sonar Generic Issue Import of every finding the run produced, and `--fix` runs ESLint and stylelint with --fix before the check and is refused unless `--gate lint` is selected; `--changed` and `--workspace` are not carried over, since the cache makes a whole-app check of an unchanged tree take seconds. This is an entrypoint/parser/dispatch and caller migration, not a new quality engine or server-result contract."
    owner: "contexts/project/check-cache.md; contexts/harness/cli-canonical.md; @starci/hfs src/main.mts and its parser/callers"
  - id: app-cicd-auto-deploy
    date: '2026-10-31'
    status: live
    ruling: "Every app's managed `.github/` is one delivery pipeline keyed on the commit sha: the release tag run checks in full (or reuses a green candidate run of the same sha), builds each declared image once with SBOM and provenance and pushes it by `sha-<sha>` and `v<version>` to the declared registry (GitHub Actions cache per image; `linux/amd64` unless an environment declares another node), and when the one `verdict` job is green deploys every environment with `deploy.auto: true` in order through `starci app stack deploy --ci-run <run>`, which verifies the run's required jobs itself. Every green release tag deploys without waiting for the owner; `STARCI_DEPLOY_PAUSED` is the brake, and because agents push main, agents deploy. The deploy takes a lock on the manager shared with the urgent deploy, backs up and runs expand migrations inside the database's container before the services update and contract migrations only after accept in the same deploy, verifies, and on failure redeploys the previous accepted release from its stored bytes on top of Swarm's per-service update_config rollback; every attempt leaves a journal on the manager and the live service digests are compared with the accepted release. The CI SSH key is a sealed member of the environment (`vps-ci`), not a GitHub secret: GitHub keeps only `SOPS_AGE_KEY` (ruling ci-transport-one-home). Pull requests run checks only, with no secret, and Sonar runs on every full run. For an auto environment the owner's yes to deploy is that setting. The design is contexts/project/cicd.md."
    owner: "contexts/project/cicd.md; @starci/hfs templates/app/ci-workflows*, sync/, stack/, release/; cli/src/core/check/ci.ts; contexts/hfs/rules.yaml R221, R251, R271 once built"
    words: "cắm 1 opus nghiên cứu pattern ci cd chuẩn cho .github của từng dự án nhé — push cái build image mới push lên registry và tất cả pass, sau đó deploy lun, fail thì rollback trong môi trường dockerswarm. (approval, 2026-10-31:) Deploy lun có gì phải chờ"
  - id: ci-transport-one-home
    date: '2026-10-31'
    status: live
    ruling: "An environment has two SSH transports by design: the operator's member named by `deploy.remote.sealed` (`vps`) and the CI member `vps-ci`, a separate identity with a forced command; merging them would hand the CI key the owner's SSH key. Transport members are their own class and never reach an app container: ENV_DUPLICATE judges app env only and exempts exactly the SSH group keys (SSH_GROUP) in exactly the member `deploy.remote.sealed` names and in `vps-ci`; an app key in two members, or an SSH group key in any third member, stays red. The CI transport lives in one place, the sealed `vps-ci`; GitHub keeps only `SOPS_AGE_KEY`, with no condition on a first deploy, and `stack-key-restore.yml` opens the same member and writes the server identity through the gate's `identity-restore` operation."
    owner: "contexts/project/cicd.md (Secrets and access); @starci/hfs runtime/scripts/hfs/rules/env-parity.mts (R248), runtime/scripts/hfs/secret-standard.mts SSH_GROUP, stack/ssh-gate.mts, templates/app/ci-workflows*"
