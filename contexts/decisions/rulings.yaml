    date: '2026-11-01'
    status: live
    ruling: "A card already has a label, which is the purpose of its design: the title is its label, the count its fact, the action its labelEnd and the note its footer, so a Section whose only child is a single SurfaceCard is a heading over one card and is refused, as is a card whose ariaLabel repeats the Section's title; several cards under one Section stay legal. SurfaceCard takes a footer, the bottom note. The owner's words: \"bản thân card đã có label, vốn là mục đích thiết kế\"."
    owner: "contexts/ui/components/card.md; contexts/hfs/rules.yaml R354; @starci/grammar src/core/frame/SurfaceCard"
  - id: flow-graph-lanes
    date: '2026-11-01'
    status: live
    ruling: "A workflow graph is FlowGraph layout=\"lanes\": columns by stage and one row per branch of a condition, so each path reads left to right on one line, rows close together and no node stacked into one tall column; every node is one width and draws its words at the body size with an optional subline (the approver or the provider); the node kind sets the tone through the soft pair (trigger neutral, condition warning, execute its own tone, output accent); an edge is orthogonal with rounded corners and an arrowhead in the muted ink, the branches of a node fork from one point, a terminal node has no outgoing line; a branch label sits on its own edge on the canvas background; a column header is sentence case, muted, and shown only over a column that holds a node; the canvas is as tall as the graph and never magnifies it. The owner called the previous graph ugly; the grammar guarantees the look, not only the structure."
    owner: "@starci/grammar src/core/branch/FlowGraph; contexts/ui/components/diagram.md (diagram.choose.shape, workflow)"
  - id: header-command-hugs-label
    date: '2026-11-01'
    status: live
    ruling: "A page or pane command hugs its label and sits at the end of its header row; Button width=\"fill\" is only for a form submit, an auth panel, or a phone action bar. The lint refuses width fill in the actions of a Page header or a card labelEnd; the other three places are not decidable from a file."
    owner: "contexts/ui/components/button.md (button.choose.width); contexts/hfs/rules.yaml R352"
  - id: flow-graph-orbit
    date: '2026-10-31'
    status: live
    ruling: "BubbleMap is the value-sized map, split from FlowGraph by the owner: bubble nodes (form, mark, caption, diameter from bubbleDiameter), the info tone, fill and ring for status, isDimmed for a filter, expandedIds and fanLimit for the fan on ring four, a hover and focus tip, and the zoom-fixed text of a bubble. An app never draws its own map with React Flow; a status never rests on colour alone."
    owner: "@starci/grammar src/core/branch/BubbleMap; contexts/ui/components/diagram.md"
  - id: agent-keyed-schedules
    date: '2026-10-31'
    status: live
    ruling: "A schedule owned by a data row, such as one agent's next run, is a BullMQ job scheduler keyed by that row, in lite as in full. A customer chat turn locks per conversation and background or scheduled work locks per agent: one conversation never has two turns overlapping, and several customers of one agent are answered in parallel."
    owner: "contexts/code/be/queues.md (BE-QUEUES-3)"

  - id: section-is-the-heading
    date: '2026-11-01'
    status: live
    ruling: "A heading comes from the frame that owns what it heads, never from a free component: a titled Section is a named region whose title is its heading and its landmark name (SectionHeader and Region are gone), a card heads itself with its label, and Heading is for prose and the landing rank. A figures strip inside an already-headed surface is Section kind=\"figures\" with ariaLabel, no second heading and no head controls; its alternative titled form owns its heading. A long list that searches or filters is Section kind=\"list\" of rows with a FilterButtonGroup in its filter slot, its head, filter and rows one section step (24) apart; a short list to work through is a list card. The section's one page command hugs its label at the end of its head row. Text has one stronger weight, isStrong, for a value or a term inside a line: a strong block Text that heads a group is a heading wearing a weight and is refused by review until the lint of the whole-program lane lands. The placement providers CollectionItem, ItemActions and ToolbarActions are gone: item and chrome placement come from the structure."
    owner: "@starci/grammar src/core/frame/Section; contexts/ui/components/card.md; packages/hfs/codemod/section-frame.mts"

  - id: grammar-literal-lint
    date: '2026-11-01'
    status: live
    ruling: "The Grammar package keeps one lint config, the gate of literals: ESLint over its components and Stylelint over its stylesheets refuse a hardcoded colour, radius, type size, shadow geometry, motion or opacity, a literal var() fallback, a utility class that decides a look, and a spacing value off the scale. Every value is a token or a step of a ramp in src/common/ramps.css. It runs in the package's own `npm test`, so CI judges every grammar change. This is the one exception to no-grammar-tests: the Grammar still adds no spec suite or test helper."
    owner: "packages/grammar/eslint.config.mjs and stylelint.config.mjs (rules in scripts/lint/)"

  - id: grammar-tier-ladder
    date: '2026-11-01'
    status: live
    ruling: "One ladder of tiers serves the grammar and apps, and a tier imports nothing above it: leaf (one element or one vendor part; a string or no children), branch (a leaf plus its own interaction state; never children), composite (a fixed anatomy drawn from fields; never children, at most three named ReactNode slots), frame (owns a region: tracks, inset, scroll, ground or an overlay; the one tier that takes children), and in apps block (owns a world, reads data through hooks, takes children only as the structurally proven one-level connected RootPage of page-frame and FE-FUNCTION-2, never imports a block). The folder is the tier and data-tier carries it. Overlays are frames. Apps gain components/frames between blocks and composites; a Gate block moves to features/layouts. Named exceptions, each with its holder: Text inline content, Freestyle className, a Tooltip behind a leaf, DataTable render per column on a client branch, vendor field props over budget; any other needs a ruling."
    owner: "contexts/grammars/contributing.md (Which tier); contexts/code/fe/architecture.md FE-ARCHITECTURE-2; contexts/code/fe/folder.md FE-FOLDER-1; contexts/hfs/slots.yaml tiers"
  - id: grammar-canonical-set
    date: '2026-11-01'
    status: live
    ruling: "One job, one component: when two components could carry a job, one is removed in the same change that settles it, never aliased. The public set is what the folders of src/core/<tier> export and the roles of contract.yaml name; a card is the one SurfaceCard, a heading comes from the frame that owns what it heads, a route is one Page, a graph of value-sized bubbles is BubbleMap and FlowGraph keeps layered, radial, manual and lanes layouts, a conversation is MessageBubble, and Backdrop is removed (a tinted brand ground is a soft card or Freestyle). Every removed spelling is listed under removedVocabulary and migrated by a codemod of packages/hfs. A prop states a fact and no prop chooses a look: variant, className, style, colour, radius and size in pixels are not public; an illegal state is a type error."
    owner: "contexts/grammars/contributing.md; contexts/grammars/contract.yaml roles; @starci/grammar src/core"
  - id: avatar-initial-colours
    date: '2026-11-01'
    status: live
    ruling: "The colours of an avatar's generated initials are identity art, a stable palette chosen by seed, and not a theming violation: an app's HeroUI tokens do not recolour them."
    owner: "@starci/grammar src/core/leaf/Avatar; contexts/ui/components/identity-mark.md"
  - id: render-proof
    date: '2026-11-01'
    status: live
    ruling: "The grammar's look is proved by Playwright's toHaveScreenshot over every story of the built Storybook, in both families, light and dark, at 1920 and 390, device scale factor 2, against baselines committed in packages/grammar/proof/baselines and taken in the pinned Playwright image CI runs in. A baseline detects change and approves no look: a diff fails CI and reads changed, a lane refreshes unreviewed baselines, and only the pictures named in proof/approved.json (the chat renderer) are approved, a change to one needing a person. The owner's eye reviews every new or changed baseline, and a green check never stands in for it. Storybook stays."
    owner: "packages/grammar/playwright.config.ts and proof/; contexts/grammars/contributing.md (Render proof); contexts/ui/proof.md (Who holds each proof)"
  - id: situation-tables
    date: '2026-11-01'
    status: live
    ruling: "An author says what a thing is and the grammar decides how it looks: knowledge is decision tables that cover every UI situation, and a table row names one situation, one component, the spacing role, one story and the lint or type that enforces it. Spacing is a role chosen by the structure (identity 4, inline 8, row 12, section 24, region 32; a card holds 12, a box in a card 8, an empty region 24), never a number an author writes."
    words: "An author says what it is. The grammar decides how it looks. A wrong composition does not compile, and every allowed input looks right."
    owner: "contexts/ui/situations.md; contexts/ui/presentation.md (Space)"
  - id: explicit-export-surface
    date: '2026-11-03'
    status: live
    ruling: "An exported declaration states its type where it is exported, in every front-end and back-end file: a function's return type, an exported variable's type and a parameter's type are written, never inferred from a body or from other files. A component that returns only JSX, null or undefined is explicit. The lint result cache counts a file with an inferred surface as open and lints every importer again when it changes; one classifier, the isolated declaration emit, serves the cache and the rule, so the rule reports exactly what the cache counts as open."
    owner: "contexts/code/shared/typing.md SHARED-TYPING-5; lint explicit-export-surface (R368); packages/hfs/runtime/scripts/lib/declaration-surface.mts"
  - id: module-definition-helper
    date: '2026-11-03'
    status: live
    ruling: "A module definition is one call of @starci/nest-kit, defineConfigurableModule<XOptions>() or, for the representative module of a capability, defineCapabilityModule<XOptions>(), destructured into the names the module uses. The helper states the type of every name it returns, so the definition is a surface the explicit-export-surface rule accepts and one line that two modules cannot make a clone (R21). The lint on stated export types accepts a destructured export of those two calls and no other; a definition written with ConfigurableModuleBuilder is rewritten by starci app codemod module-definition."
    owner: "contexts/code/be/architecture.md BE-ARCHITECTURE-3; packages/nest-kit; lint capability-module-shape (R45) and explicit-export-surface (R368); packages/hfs/runtime/scripts/lib/declaration-surface.mts"
  - id: seed-levels
    date: '2026-11-03'
    status: live
    ruling: "Owner ruling: the seed data of every app lives in the seed levels of .starcistacks, in the harness so every app pulled from now on gets the convention (a root seeds/ folder was ruled and reversed the same day). .starcistacks/seeds/ is applied in every environment first and .starcistacks/<env>/seeds/ in the environment application-stacks.yaml declares as <env> (the declared name, no alias); each level is a seeds.yaml manifest (starci/seeds@1, entries { id, kind: sql|data|files, path, target, mode: once|upsert|always, after?, probe? }; an upsert entry runs again on a changed hash or when its probe, an app command, exits non-zero on drift, and an always entry, an idempotent cheap command, runs on every stack up) and the folders sql/, data/, files/. SQL seeds are idempotent DML, never DDL; data documents validate against a schema the app declares and load through an app command the manifest names; files go to the bucket the target names. No seed holds a secret: a document references a sealed seeds-<name> member of its environment, opened in memory at apply time and handed to the app command, never written, logged or kept in a receipt. A production level holds no test data but the one test account (a test-account entry with its reason: a test workspace and its owner login, whose password is a sealed member the seed sets, with the product's own connector test credentials, never a customer's). db/seed.sql is retired by `starci app codemod seeds-layout`. The harness owns order, receipt (public.starci_seed_receipts in the app database) and validation, the app the meaning of its data."
    owner: "contexts/project/stacks.md PROJECT-STACKS-12; contexts/hfs/slots.yaml (app.starcistacks); contexts/hfs/rules.yaml R375, R332; @starci/hfs rules/seeds.mts, stack-seeds-config.mts, codemod/seeds-layout.mts, templates/app/skeleton*/.starcistacks/**/seeds"
  - id: landed-destructive-migration
    date: '2026-11-04'
    status: live
    ruling: "Owner ruling: a migration already on the base branch, byte-identical at the merge-base, is landed and immutable (R213), so its destructive and dynamic DDL is reported as a known item, never a blocker, while it stays unchanged; a changed landed file still blocks, and a new file is judged in full. An owner ruling in the app's hfs.json db.destructiveRulings names one exact migration, the exact objects it destroys, a reason and the date; the db gate accepts those objects outside a contract migration only while the proof a contract migration gets (no be/src reference now, none in the previous release) finds them unreferenced, and otherwise refuses DB_DESTRUCTIVE_RULING_UNPROVEN. It is never a blanket waiver: an object the ruling does not name, a ruling naming an object the migration does not destroy, or a migration that does not exist stays refused."
    owner: "contexts/hfs/rules.yaml R259, R213; contexts/code/be/persistence.md BE-PERSISTENCE-19; @starci/hfs rules/database-landed.mts, rules/database-migrations.mts, declaration-shape.mts"
