    status: live
    ruling: "Both editions share one code structure and one front-end standard; lite is a minimal production of one stateless, horizontally scaled instance type on its own self-hosted PostgreSQL, identity and S3 storage (lite-self-hosted-postgres-passport-minio) plus one minimal instance of each declared backing service, with no e2e world, while full runs several services with their own infrastructure. The queue is ruling lite-queue-bullmq and the event bus ruling lite-pgmq-bus-bullmq-jobs. Editions are fixed at scaffold."
    owner: "contexts/hfs/rules.yaml R212; contexts/hfs/slots.yaml (editions, ruleParams.be.backing)"
