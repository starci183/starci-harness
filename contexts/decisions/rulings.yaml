  - id: STATE-6/case-6
    date: '2026-10-12'
    status: live
    ruling: "Page tabs switch the page's main areas once per page and may reflect the URL; region tabs switch panels inside a drawer, card, dialog or rail and never reflect the URL; same-look tab sets never nest."
    owner: "contexts/ui/components/tabs.md"
