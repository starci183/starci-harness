    owner: "contexts/ui/composition.md DISCIPLINE-3; contexts/ui/components/mascot.md"
  - id: surfacecard-soft-treatment
    date: '2026-10-30'
    status: live
    words: "Thêm treatment `soft`"
    ruling: "SurfaceCard has a `soft` treatment: the brand's light tint as ground (the family's accentSoft) with the default dark text, keeping the artwork slot; its tokens come from the brand layer, never app paint. Every SurfaceCard treatment rebinds the whole surface pair on its ground, so a child's text (a Stepper's step number included) contrasts with what it stands on."
    owner: "@starci/grammar src/core/branch/SurfaceCard, src/common/styles.css; contexts/grammars/contract.yaml roles.card; contexts/ui/components/card.md card.choose.treatment"
  - id: empty-notice-artwork
