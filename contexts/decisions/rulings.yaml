    date: '2026-10-31'
    status: live
    words: "trò thiết kế hệ thống padding đồng nhất cho grammar chứ mỗi nơi 1 padding trò thấy k"
    ruling: "A Pane owns its content inset and every band in it is a PaneSection whose boxes align to that edge: one padding system for everything placed in a PaneGrid, chosen by the Grammar per side by contact, never by the app. A box (a search field, the first tab, a list row and its selected fill, a chip) starts at the pane content edge and the text inside a box keeps the vendor's own padding; a pane and a section take no class, and no padding or margin utility sits on what a section renders."
