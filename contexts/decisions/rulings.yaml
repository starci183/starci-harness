  - id: page-header-band
    date: '2026-10-28'
    status: live
    ruling: "A page is headed by the header of Grammar's Page: a surface band across the primary region whose content shares the page content's edges, ending in its own full-width separator with or without tabs, page tabs standing on it; an app never composes a trail and a heading into a page head by hand."
    owner: "contexts/ui/components/page-header.md; contexts/grammars/contract.yaml page; contexts/hfs/rules.yaml R323"
  - id: page-frame
    date: '2026-10-29'
    status: live
    ruling: "A route page is one Grammar Page: the header band full width, the body always inside the page measure and gutter one region step below it, nothing in the body escaping the gutter; Page is the single owner of the page inset and the page rhythm, layout frames are pure layout and never wrap a page in a container; page tabs are the header's tabs. An app surface (a chat, a split editor) is a Page with chrome bleed: no inline gutter, no block padding and no clip, the body filling the region so what it holds fills it; its header is optional, and when given it is the band (a title) or the breadcrumbs alone, the title optional only in bleed. A route draws exactly one Page, drawn by its page owner, by the owner's pure half, or by the one connected block the owner renders as its root (one level), where client data builds the header a server owner may not: the owner content passes as children through that connected block to its own Base and into the Page body (FE-FUNCTION-2); siblings beside it or a second Page stay refused. A route segment layout whose owner, its pure half or its one root block draws a Page with its header and header.tabs as link tabs is the one Page of every route under it: those page owners draw body content only, need no Page and are refused one; the layout's Page has nothing beside it, so a hand-drawn head beside it moves into its header. A page owner that draws no UI (it only redirects, refuses with notFound or returns null) needs no Page, nor does a page mounted only under the auth route group (auth), whose layout draws the auth frame that is its page frame; workbench pages are ordinary pages."
    owner: "contexts/ui/components/page-header.md; contexts/grammars/contract.yaml page; contexts/hfs/rules.yaml R324, R325"
