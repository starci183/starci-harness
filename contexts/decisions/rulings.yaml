  # --- app shape, editions and back end
  - id: lite-self-hosted-postgres-passport-minio
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim (relayed from the nivo-lite chat after the hosted Supabase project of nivo-lite was locked on its egress quota and production went down): \"self host postgresql + auth thì trò tự code gg auth (lite, full dùng keycloak)\", \"storage minio trên tayson có r!!!!\", \"auth dùng passport nestjs\", \"cập nhật lại luôn cả .claude nhé cho lite app\". The lite edition leaves Supabase: its PostgreSQL is self-hosted as the db service of the app's stack (its image is ruling lite-official-postgres-image), its schema is db/migrations applied by starci app db migrate, its identity is the app's own NestJS Passport integration (Google OAuth 2.0 with state and PKCE, email and password with bcrypt, the app's own asymmetric access tokens and JWKS, a rotating refresh token in an httpOnly cookie), and its storage is the MinIO already running on the Tay Son host through one S3 integration. The front end holds no credential and talks only to the app's own auth doors. Full keeps Keycloak."
    owner: "contexts/hfs/slots.yaml (app.db*, be.integrations.passport, be.integrations.object-storage, ruleParams.be.infraOwners); contexts/hfs/rules.yaml R328-R332; contexts/code/be/api-auth.md, persistence.md, infra.md; contexts/project/lite.md; @starci/eslint-canon-be src/auth-passport.ts; @starci/hfs db/ and templates"
  - id: lite-official-postgres-image
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: \"chạy postgresql thuần image chính chủ nhé ko phải supebase\", then \"pgvector\" as the one extension package and \"Nest schedule\" for the ticks pg_cron ran. The lite db service runs the Docker Official postgres image (major 17, pinned by digest) through the app's managed .starcistacks/images/db/Dockerfile, which adds only the PGDG package of pgvector; the contrib extensions the image ships (pgcrypto, pg_trgm, unaccent, uuid-ossp, btree_gist) are the rest, pgmq is added by ruling lite-pgmq-bus-bullmq-jobs, and there is no pg_cron, pg_net or supabase_vault. The scratch database of starci app db drift and the local db container build the same Dockerfile. Recurring work is a tick of platform/jobs: @nestjs/schedule fires it in the back end, each firing claims its minute in the database under advisoryXactLock and enqueues one job through the queue outbox, so one replica fires it once."
    owner: "contexts/stack/pins.yaml (images postgres); contexts/hfs/slots.yaml (app.db.image, ruleParams.db.extensions, ruleParams.be.infraOwners, be.platform.jobs); contexts/hfs/rules.yaml R335; contexts/code/be/jobs.md BE-JOBS-6; contexts/project/lite.md; @starci/hfs templates/app/db-image, sync, db/drift.mjs; @starci/eslint-canon-be src/jobs-scheduler.ts"
  - id: lite-queue-bullmq
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: \"Giữ BullMQ\". The lite queue is BullMQ on the declared Redis, the shape nivo-lite runs, as in full: platform/queue owns bullmq and ioredis, a producer writes the queue outbox in its transaction and the relay adds each committed row to BullMQ; no queue rides on Postgres tables."
    owner: "contexts/code/be/queues.md; contexts/hfs/slots.yaml (be.platform.queue, ruleParams.be.infraOwners, ruleParams.be.backing)"
  - id: lite-pgmq-bus-bullmq-jobs
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: asked \"Event bus của bản lite đi qua đâu?\" he answered \"BullMQ\", then settled it as \"bullmq để chạy job còn pgmq làm queue hiểu ý không? chốt v đi\". BullMQ on the declared Redis runs jobs: background work, retries and the scheduled ticks of platform/jobs, through platform/queue as ruling lite-queue-bullmq has it. pgmq is the message queue between features, the lite event bus: publishing sends the typed envelope to its pgmq topic inside the same transaction as the data change, so the bus needs no outbox or relay; each consumer group of a reactor reads its own queue bound to the event's name with a visibility timeout, archives a handled message and lets a failed one reappear, so consumers stay idempotent through the inbox. The managed .starcistacks/images/db/Dockerfile installs pgmq from its pinned release, verified by sha256, into its own schema pgmq; no job queue rides on pgmq and pg_cron stays refused."
    owner: "contexts/code/be/event-bus.md BE-EVENT-BUS-3, -4; contexts/hfs/rules.yaml R258; contexts/hfs/slots.yaml (be.platform.event-bus lite, ruleParams.db.extensions, ruleParams.be.dbFunctions); contexts/project/lite.md; @starci/hfs templates/app/db-image (sync PGMQ), templates/be/inbox/platform/event-bus, runtime/scripts/hfs/rules/database-queues.mjs"
    absorbs: [lite-event-bus-stays-pgmq]
  - id: lite-db-image-in-stacks
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim, on where the db image's Dockerfile lives: \"phải nằm trong starcistacks nhỉ?\" (it belongs in starcistacks). The managed Dockerfile of a lite app's db image is .starcistacks/images/db/Dockerfile, built with its folder as the context by the stack build, the images and stack-deploy workflows, npm run db:image, the drift scratch database and the squash replay; db/ keeps only schema and data (migrations, bootstrap, seed), and starci app sync --execute removes a leftover db/Dockerfile."
    owner: "contexts/hfs/slots.yaml (app.db.image, app.starcistacks lite allows); @starci/hfs db/image.mjs, sync (retiredFiles), templates/app/db-image, templates/app/gitignore-lite; contexts/project/lite.md"
  - id: lite-reactors-as-full
    date: '2026-10-30'
    status: live
    ruling: "Owner, verbatim, on the lite reactor pattern being marked open while R153 already judged lite consumers: \"ủa là sao, phần này lite phải tuân thủ full chứ?\" (lite must follow full here). A lite app's event consumer is a reactor exactly as in full (BE-REACTORS-1, BE-EVENT-BUS-4): features/reactors/<reactor>/ holds transport/message/<event>.consumer.ts, <reactor>-message.module.ts and an application/ of plain CQRS; the consumer dispatches one command forwarding delivery.eventId and never imports a domain service; the handler's domain service of the reactor's own context claims the inbox and does the work in one transaction. Only the transport differs (the pgmq bus of ruling lite-pgmq-bus-bullmq-jobs). Saga and projection stay open for lite."
    owner: "contexts/code/be/reactors.md BE-REACTORS-1; contexts/code/be/event-bus.md BE-EVENT-BUS-4, -6; contexts/hfs/rules.yaml R153 BE_EVENT_CONSUMER_SHAPE; contexts/project/lite.md (Patterns); @starci/hfs templates/be/patterns/reactors (full adapter; a lite template is to come, until then the lite reactor is written by hand on the pgmq adapter)"
  - id: lite-persistence-typeorm-entities
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: \"big refactor đi … không viết raw sql như thế theo starci-academy-be\". Lite persistence maps its tables with TypeORM entities in each owning capability (persistence/entities/<table>.entity.ts, explicit column names and types, timestamptz, no eager, lazy or cascade relation, no GraphQL or validator decorator) and reads and writes through the injected EntityManager and createQueryBuilder(Entity, alias) with named parameters, the shape of full and starci-academy-be; domain and feature code writes no raw SQL, and a database function TypeORM cannot express goes through the typed helpers of platform/database restricted to a listed set. db/migrations stays the only DDL and synchronize stays false."
    owner: "contexts/code/be/persistence.md BE-PERSISTENCE-1, -3, -4; contexts/hfs/rules.yaml R334; contexts/hfs/slots.yaml (be.persistence lite overlay, be.platform.database.entities, ruleParams.be.dbFunctions); @starci/eslint-canon-be src/no-raw-sql.ts, src/query-safety.ts (R68: the call statement of platform/database/database.client.ts), runtime/scripts/hfs/architecture/entity-registry.mjs; @starci/hfs templates/be/skeleton-lite platform/database/database.client.ts"
  - id: lite-test-sql-owner
    date: '2026-10-29'
    status: live
    ruling: "Narrowed by ruling no-raw-sql-one-style (2026-10-31): the world keeps raw SQL for probes only; plain CRUD and application function calls go through entities and callDbFunction. Debug's ruling, which the owner may override. no-raw-sql keeps covering src/tests/**: test code reads and writes through entities on an EntityManager like domain code, so integration specs, e2e specs, builders and fixtures seed and assert through the world's DataSource manager (world.db.<connection>). The one exception mirrors platform/database: be/src/tests/world/**, the owner of test infrastructure, may hold raw SQL, only for what entities cannot express (a trigger, a database function, a row-level-security probe, a pgmq queue inspection), each case a named, typed helper on the world (world.db.<connection>.raw...) that specs call; specs and builders outside tests/world stay under the rule. callDbFunction and the listed dbFunctions work in tests as in domain code."
    owner: "contexts/code/be/persistence.md BE-PERSISTENCE-4; contexts/hfs/rules.yaml R334; @starci/eslint-canon-be src/no-raw-sql.ts (RAW_SQL_OWNERS)"
  - id: no-raw-sql-one-style
    date: '2026-10-31'
    status: live
    ruling: "Owner, verbatim: \"ý là không dc có bảng không có sql, phải có entity cả chứ\" (every table has an entity); \"À là code sẵn function chứ ko gọi qua sql query thôi vậy giữ db function đi\" (database functions stay, called as functions); \"Ý là bỏ sql thô chứ viết thuần function đi và call = call db function\" and \"Chốt 1 kiểu thôi\" (one style: no raw SQL in TypeScript, entities, or a function called through callDbFunction); \"à thôi testwword cho viết query cũng dc thêm vào db chính cũng k tốt lắm\" (the test world may keep raw queries for what entities and functions cannot express; test-only functions do not go into the main database); \"K code nào dùng thì xóa chứ trò\" (unused things are deleted, a separate drop lane). So lite TypeScript holds no SQL text outside the test world: a table is read and written through its entity, anything else is a listed database function called through callDbFunction, database.client.ts alone composes the call statement and LISTEN (advisoryXactLock and notify are callDbFunction calls of pg built-ins), and the only other .query( is the pass-through of a file listed in ruleParams.be.sqlPassThrough or hfs.json sides.be.sqlPassThrough with a reason. The world's raw SQL narrows to probes (privilege and row-level-security checks, catalog, cron and trigger introspection, pgmq queue tables, lock and failure probes); a *.sql.ts file exists only in the world. Narrows ruling lite-test-sql-owner; full's R36 is unchanged."
    owner: "contexts/code/be/persistence.md BE-PERSISTENCE-4; contexts/code/be/test.md BE-TEST-1; contexts/hfs/rules.yaml R334, R68; contexts/hfs/slots.yaml (ruleParams.be.sqlPassThrough, be.tests.world); @starci/eslint-canon-be src/no-raw-sql.ts; @starci/hfs manifest-shape.mts, rule-params-shape.mts, declaration-shape.mts, templates/be/skeleton-lite platform/database/database.client.ts"
  - id: be-ai-langchain-gateway
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: \"nhớ làm langchain nhé update .claude lun là call thẳng từ code phải dùng langchain với embeded context\" (a model call made straight from code uses LangChain with retrieved context; update .claude too), with the gateway rulings of the same night. Every model call goes through the @starci/ai-router gateway hosted in process by AiRouterGatewayModule on the app's port plus one; clients authenticate with gateway-issued virtual keys (sk-starci-...), and only the gateway's custody owner reads an upstream provider key such as OPENROUTER_API_KEY. Code calls models through LangChain from exactly one integration: ChatOpenAI and OpenAIEmbeddings of @langchain/openai pointed at the gateway base URL from config with a virtual key, with context from a retriever over the app's knowledge filtered by the caller's access lane; a domain task is a chain (prompt template, model, structured output or string parser) and code appends its fixed tails after the answer. Fixed-shape tasks (classify, extract, draft, parse a rule, embed) run in code; open, multi-step, tool-using conversations run in the agent runtime (openclaw), whose tools all go through the single MCP gateway that enforces authority and audit and whose model calls go through the same ai-router gateway with the app's one virtual key (ruling be-ai-one-virtual-key). The runtime never writes business data directly, and code never runs an agent loop."
    owner: "contexts/code/be/ai.md BE-AI-1 … 6; contexts/hfs/rules.yaml R326, R327, R90; contexts/hfs/slots.yaml ruleParams.be.infraOwners; @starci/eslint-canon-be src/ai-gateway.ts"
  - id: be-ai-one-virtual-key
    date: '2026-10-31'
    status: live
    words: "Xóa ai api key và openclaw ai key chỉnh thành starci ai key là key ảo / Ý là key ảo gen ngẫu nhiên ấy, hiểu luồng k, module ai router cần các ai key, ở đây cấp 1 openrouter, còn module khác dùng key ảo do ai router tạo ra nên cấp cả 2 / AI_ROUTER_ADMIN_TOKEN bỏ cái này đi ko xài nữa / Ở dưới ai router quăng nhiều api xoay load balncer / Xuất lên trên 1 api key ảo / Phản biện kĩ chốt kiến trúc phần này nhé và update starci harness luật"
    ruling: "Per app and per environment the sealed ai member holds exactly two kinds of AI secret: the upstream provider keys, read only by the gateway's custody owner integrations/ai-gateway, and one random virtual key STARCI_AI_KEY (sk-starci-<app>-<48 hex>) that the in-process @starci/ai-router gateway mounts (profiles work and embed) and every client uses: the app's integrations/ai LangChain client and the agent runtime, granted the same key from the ai member. Below the gateway the upstream is a pool of providers, each with an array of keys, rotated, failed over and blacklisted by the router; above it there is that one virtual key. The embed profile is pinned to one embedding model and never falls back to another model; work may fall back across models and providers. The gateway has no admin API and no admin token: rotation is reseal and deploy, and the key store keeps only the usage and quota counters of the mounted key. Dev and production seal their own STARCI_AI_KEY. Accepted trade-off: one key per app loses per-caller revocation and attribution at the gateway between api and agent runtime, which share one stack and trust domain; attribution is the app's own usage events, and fewer secrets mean less custody drift. A pool raises headroom only across separate accounts or providers (keys of one account share its credits and limits), and the gateway's breaker and key store are per process, so the api hosting it runs one replica or the gateway moves to its own service."
    owner: "contexts/code/be/ai.md BE-AI-1, BE-AI-2, BE-AI-3, BE-AI-6; contexts/hfs/rules.yaml R326, R327, R344; @starci/eslint-canon-be src/ai-gateway.ts (ai-virtual-key-name)"
  - id: R212/case-10
