    owner: "@starci/grammar src/core/composite/Backdrop, src/common/styles.css; contexts/grammars/contract.md Backdrop; contexts/ui/components/backdrop.md"
  - id: workspace-shell-fills-viewport
    date: '2026-10-30'
    status: live
    words: "sao mà background dc nửa màn thôi thế???"
    ruling: "A WorkspaceShell is at least one viewport tall, so the canvas under a short page runs to the bottom of the screen."
    owner: "@starci/grammar src/common/styles.css .starci-core-workspace-shell"
  - id: grammar-names-are-generic
    date: '2026-10-31'
    status: live
    words: "tên gì chung chung tính chất grammar là cấp ui ux chung chung k bias tính năng hiểu k, ghi vào knowlege đi"
    ruling: "The grammar is a generic UI/UX layer: a component, prop or token name says what it does as a layout or UI role (PaneGrid, SurfaceCard, Rail), never a product feature (chat, customer, order, invoice), so any product can reach for it. The multi-pane frame is PaneGrid; the old chat-named and PaneLayout spellings are removed, not aliased (removedVocabulary)."
    owner: "@starci/grammar src/core/composition/PaneGrid; contexts/grammars/contract.md What a grammar provides; contexts/ui/components/page-header.md Owner split"
  - id: pane-grid
    date: '2026-10-31'
    status: live
    words: "phải xây kiểu grid hiểu không, kiểu bỏ A BC ngang hàng D ở dưới... và cách nhau bởi divider; chuẩn build grid và ghép các element nghiệp vụ của chat, mỗi grid có option surface hoặc k"
    ruling: "The multi-pane frame is one generic PaneGrid, not a layout with fixed chat-shaped slots: named areas (A B C side by side, D below) laid out flush with a divider between neighbours, columns and rows by track role, the arrangement chosen per breakpoint, and each Pane either a borderless surface or a plain div. The grid divides the space and each Pane owns the content inset of what is placed in it (ruling pane-inset); what the cell shows is the app's. PaneLayout is removed, not aliased (removedVocabulary). A short inset separator inside a pane's content is the app's own element, not a grammar option."
    owner: "@starci/grammar src/core/composition/PaneGrid, src/core/composition/PaneSection, src/common/styles.css; contexts/grammars/contract.md PaneGrid; contexts/ui/components/pane-grid.md"
