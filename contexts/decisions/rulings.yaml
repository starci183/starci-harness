    owner: "contexts/code/be/persistence.md BE-PERSISTENCE-4; contexts/code/be/test.md BE-TEST-1; contexts/hfs/rules.yaml R334, R68; contexts/hfs/slots.yaml (ruleParams.be.sqlPassThrough, be.tests.world); @starci/eslint-canon-be src/no-raw-sql.ts; @starci/hfs manifest-shape.mts, rule-params-shape.mts, declaration-shape.mts, templates/be/skeleton-lite platform/database/database.client.ts"
  - id: be-ai-langchain-gateway
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: \"nhớ làm langchain nhé update .claude lun là call thẳng từ code phải dùng langchain với embeded context\" (a model call made straight from code uses LangChain with retrieved context; update .claude too), with the gateway rulings of the same night. Every model call goes through the @starci/ai-router gateway hosted in process by AiRouterGatewayModule on the app's port plus one; clients authenticate with gateway-issued virtual keys (sk-starci-...), and only the gateway's custody owner reads an upstream provider key such as OPENROUTER_API_KEY. Code calls models through LangChain from exactly one integration: ChatOpenAI and OpenAIEmbeddings of @langchain/openai pointed at the gateway base URL from config with a virtual key, with context from a retriever over the app's knowledge filtered by the caller's access lane; a domain task is a chain (prompt template, model, structured output or string parser) and code appends its fixed tails after the answer. Fixed-shape tasks (classify, extract, draft, parse a rule, embed) run in code; open, multi-step, tool-using conversations run in the agent runtime (openclaw), whose tools all go through the single MCP gateway that enforces authority and audit and whose model calls go through the same ai-router gateway with the app's one virtual key (ruling be-ai-one-virtual-key). The runtime never writes business data directly, and code never runs an agent loop."
    owner: "contexts/code/be/ai.md BE-AI-1 … 6; contexts/hfs/rules.yaml R326, R327, R90; contexts/hfs/slots.yaml ruleParams.be.infraOwners; @starci/eslint-canon-be src/ai-gateway.ts"
  - id: be-ai-one-virtual-key
    date: '2026-10-31'
    status: live
    words: "Xóa ai api key và openclaw ai key chỉnh thành starci ai key là key ảo / Ý là key ảo gen ngẫu nhiên ấy, hiểu luồng k, module ai router cần các ai key, ở đây cấp 1 openrouter, còn module khác dùng key ảo do ai router tạo ra nên cấp cả 2 / AI_ROUTER_ADMIN_TOKEN bỏ cái này đi ko xài nữa / Ở dưới ai router quăng nhiều api xoay load balncer / Xuất lên trên 1 api key ảo / Phản biện kĩ chốt kiến trúc phần này nhé và update starci harness luật"
    ruling: "Per app and per environment the sealed ai member holds exactly two kinds of AI secret: the upstream provider keys, read only by the gateway's custody owner integrations/ai-gateway, and one random virtual key STARCI_AI_KEY (sk-starci-<app>-<48 hex>) that the in-process @starci/ai-router gateway mounts (profiles work and embed) and every client uses: the app's integrations/ai LangChain client and the agent runtime, granted the same key from the ai member. Below the gateway the upstream is a pool of providers, each with an array of keys, rotated, failed over and blacklisted by the router; above it there is that one virtual key. The embed profile is pinned to one embedding model and never falls back to another model; work may fall back across models and providers. The gateway has no admin API and no admin token: rotation is reseal and deploy, and the key store keeps only the usage and quota counters of the mounted key. Dev and production seal their own STARCI_AI_KEY. Accepted trade-off: one key per app loses per-caller revocation and attribution at the gateway between api and agent runtime, which share one stack and trust domain; attribution is the app's own usage events, and fewer secrets mean less custody drift. A pool raises headroom only across separate accounts or providers (keys of one account share its credits and limits), and the gateway's breaker and key store are per process, so the api hosting it runs one replica or the gateway moves to its own service."
    owner: "contexts/code/be/ai.md BE-AI-1, BE-AI-2, BE-AI-3, BE-AI-6; contexts/hfs/rules.yaml R326, R327, R344; @starci/eslint-canon-be src/ai-gateway.ts (ai-virtual-key-name)"
  - id: R212/case-10
    date: '2026-10-24'
    status: live
    ruling: "Both editions share one code structure and one front-end standard; lite is a minimal production of one stateless, horizontally scaled instance type on its own self-hosted PostgreSQL, identity and S3 storage (lite-self-hosted-postgres-passport-minio) plus one minimal instance of each declared backing service, with no e2e world, while full runs several services with their own infrastructure. The queue is ruling lite-queue-bullmq and the event bus ruling lite-pgmq-bus-bullmq-jobs. Editions are fixed at scaffold."
    owner: "contexts/hfs/rules.yaml R212; contexts/hfs/slots.yaml (editions, ruleParams.be.backing)"
    absorbs: [R212/case-1, R212/case-2, R212/case-3, lite-minimal-production, lite-backing-services]
  - id: R212/case-4
    date: '2026-10-14'
    status: live
    ruling: "A lite app's .starciwork admits only .gitignore, an optional workspace.yaml and brand records; full keeps its Work tree."
    owner: "contexts/hfs/slots.yaml (app.starciwork)"
    absorbs: [lite-work-brand-only]
  - id: R212/case-7
    date: '2026-10-24'
    status: live
    ruling: "Realtime has three doors in both editions: server-sent events (the default for one-way push), socket.io (two-way messages) and the GraphQL subscription (only for a client already on GraphQL that needs the typed payload, with a snapshot refetch on reconnect)."
    owner: "contexts/code/be/realtime.md; contexts/code/fe/realtime.md FE-REALTIME-2"
    absorbs: [R212/case-5, lite-sse-door, lite-graphql-subscription-door]
  - id: R212/case-9
    date: '2026-10-24'
    status: live
    ruling: "Every replica serves any request or reconnect; shared state lives in Postgres or the declared Redis; no sticky sessions. The realtime hub is memory for one replica or tests only, else Redis when declared and Postgres otherwise."
    owner: "contexts/code/be/realtime.md"
    absorbs: [lite-scales-stateless]
  - id: lite-vector-is-pgvector
    date: '2026-10-25'
    status: live
    ruling: "Lite's vector store is pgvector in its db service; lite declares only Redis as a backing service, while full may declare Redis and Qdrant."
    owner: "contexts/hfs/slots.yaml (ruleParams.be.backing)"
  - id: lite-contract-specs
    date: '2026-10-14'
    status: live
    ruling: "Lite may have contract specs; e2e, stack and browser runs stay full-only."
    owner: "contexts/code/be/test.md"
  - id: lite-webhook-after-commit
    date: '2026-10-14'
    status: live
    ruling: "Webhook intake records its receipt and typed outbox event in its transaction; processing runs after commit in a reactor or job, never inside the intake transaction."
    owner: "contexts/code/be/webhooks.md"
  - id: webhook-intake-shape
    date: '2026-10-14'
    status: live
    ruling: "A webhook door answers the provider's literal acknowledgement, serves at most one GET challenge, and hands off durably to the inbox before any reactor or job runs."
    owner: "contexts/code/be/webhooks.md"
  - id: webhook-receipt-port
    date: '2026-10-17'
    status: live
    ruling: "A call on a domain receipt port (a domain class over platform ports with the platform Inbox) inside the intake transaction is the inbox record, not processing; any other service or bus call there is processing."
    owner: "lint R263 BE_WEBHOOK_SCOPE"
  - id: oauth-redirect-not-webhook
    date: '2026-10-17'
    status: live
    ruling: "A third-party OAuth redirect (a public GET with the auth-handshake reason on a non-webhook path) is not a webhook door."
    owner: "lint R263"
  - id: credential-guarded-rest-door
    date: '2026-10-16'
    status: live
    ruling: "A REST route serving an external machine client behind a declared credential guard is a justified REST door without joining the operation table; anonymous public REST routes still need a closed public reason."
    owner: "contexts/code/be/transport.md; lint R278, R290"
  - id: feature-type-file-register-enum-type
    date: '2026-10-16'
    status: live
    ruling: "A feature's GraphQL type file may call registerEnumType at module top level, because the schema emit loads only files the resolver imports; nowhere else may it run."
    owner: "lint R264"
  - id: module-definition-everywhere
    date: '2026-10-15'
    status: live
    ruling: "Every NestJS module has a module definition (ConfigurableModuleBuilder with register, an options type, a module class) and is registered with XModule.register(...)."
    owner: "contexts/code/be/architecture.md; lint R295"
  - id: typed-app-environment
    date: '2026-10-14'
    status: live
    ruling: "Every back-end app reads its environment through apps/<app>/src/<app>.env.ts (an interface and read<App>Env); main.ts only delegates, and app.module.ts spreads composition groups that hold composition only."
    owner: "contexts/code/be/architecture.md; contexts/code/be/config.md"
    absorbs: [R245, R265, R246]
  - id: code-function-feature-budgets
    date: '2026-10-14'
    status: live
    ruling: "Function bodies and feature sizes have absolute budgets in both sides; the numbers are hfs/slots.yaml ruleParams.common."
    owner: "contexts/hfs/slots.yaml (ruleParams.common)"
  - id: be-convention
    date: '2026-09-30'
    status: live
    ruling: "The back-end convention is owner-locked: features grouped by trigger kind and composed only by apps, a plain CQRS application layer, one schema authority, one connection per database, injected infrastructure, default deny, configuration per capability, and background work as a transport."
    owner: "contexts/code/be/README.md"
  - id: be-bounded-contexts
    date: '2026-10-02'
    status: live
    ruling: "Work inside one bounded context is synchronous; contexts and trigger kinds meet only through events (Kafka with a transactional outbox, typed event classes), projections replace cross-context joins, reactors keep local copies, background jobs are fenced, queues use BullMQ with schedulers instead of cron, and each service is its own app with its own image."
    owner: "contexts/code/be/domain.md; contexts/code/be/event-bus.md"
  - id: effectful-command-receipt
    date: '2026-10-24'
    status: live
    ruling: "Every effectful client command carries an idempotency key with a transaction-owned receipt that replays the outcome."
    owner: "contexts/code/be/idempotency.md"
  - id: app-owned-schedules
    date: '2026-10-14'
    status: live
    ruling: "Schedules are application-owned (a queue job scheduler, a declared replicated job); a host never runs a crontab."
    owner: "contexts/code/be/background.md"
  - id: observability-required-signals
    date: '2026-10-14'
    status: live
    ruling: "The logger port, live and ready probes and a Docker health check are mandatory in both editions; request-id correlation, metrics and tracing are not yet mandatory."
    owner: "contexts/code/be/logging.md; contexts/code/be/api-auth.md"
    absorbs: [observability-deferred-signals]
  - id: sealed-secret-custody
    date: '2026-10-14'
    status: live
    ruling: "Product secrets exist only as sops/age sealed .starcistacks/<env>/secrets/*.enc members; plaintext secrets are never tracked, and the age identity is held only by the owner outside the repository."
    owner: "contexts/hfs/rules.yaml R06, R253"
    absorbs: [platform-age-file-custody]
  - id: lite-production-swarm
    date: '2026-10-14'
    status: live
    ruling: "Production runs on a declared Docker Swarm stack (lite and full), the lite database included; dev runs every dependency in Docker; scheduling is app-owned and the host runs no crontab."
    owner: "contexts/hfs/slots.yaml (app.starcistacks)"
    absorbs: [dev-docker-prod-swarm]
  - id: single-declared-ingress
    date: '2026-10-14'
    status: live
    ruling: "Any single declared ingress component, pinned by digest, is accepted."
    owner: "lint R266, R275"
  - id: owner-run-steps
    date: '2026-10-14'
    status: live
    ruling: "DNS changes, provider URIs, swarm init and key rotation are owner-run steps that the standard declares with their evidence and never automates."
    owner: "lint R266, R267"
  - id: graphql-13-pin
    date: '2026-10-18'
    status: live
    ruling: '@nestjs/graphql stays on its 13 line with its advisory accepted, and @graphql-tools/utils is overridden at a fixed release in every app root until the 14 upgrade.'
    owner: "contexts/stack/pins.yaml"
    absorbs: [graphql-13-advisory-accepted-until-a19, graphql-tools-utils-override]
  - id: message-catalogs-not-duplicate-code
    date: '2026-10-22'
    status: live
    ruling: "Message catalogs are excluded from copy-paste detection only; they stay linted and held to every other rule."
    owner: "policy (sonar configuration of the app template)"
  - id: cli-proven-by-bench
    date: '2026-10-29'
    status: live
    ruling: "The harness CLI is proven by runs of the built CLI, not by unit coverage; the stress bench that also proved it is removed (owner ruling bench-removed, contexts/harness/decisions.md) and orchestration proof is to come from real test results in Orca. Sonar analyses cli/src for issues and duplication and excludes it from coverage only."
    owner: "CONTRIBUTING.md CONTRIB-1; sonar-project.properties"
  - id: rules-pending-enforcers-2026-10-27
    date: '2026-10-27'
    status: live
    ruling: "The slot rule codes in covers name checks hfs/rules.yaml has no rule for yet; each stays pending in the rule catalog's owner section, not red, until a rule with a built enforcer carries it, and no code joins the list without a new ruling."
    owner: "contexts/hfs/rules.yaml (pending); cli/src/core/contexts/anatomy-gate.ts"
    covers: [BE_E2E_FLOW, FE_DATA_FRESHNESS, FE_SIZE_BUDGET, HFS_AGENT_DATA_TRACKED, HFS_CI_E2E_AUTOMATIC, HFS_IDENTITY_CUSTODY, HFS_SCRIPT_ONE_OFF]
  - id: origin-required-for-state-change
    date: '2026-10-29'
    status: live
    ruling: "A state-changing request with no usable Origin is refused; Referer stands in only when Origin is absent; a signed webhook or a header-credential door, which proves its caller itself, is the only exemption."
    owner: "contexts/code/be/api-auth.md BE-AUTH-5; @starci/hfs templates/be/skeleton platform/http-security origin.guard.ts"
  - id: app-secrets-one-standard
    date: '2026-10-29'
    status: live
    ruling: "App secrets have one standard, committed to git encrypted. A member holds the keys of one provider or service, `.starcistacks/<env>/secrets/<provider>.enc.yaml`, a YAML document whose multi-line values round-trip byte for byte; `starci app secret set --env <env> <provider> <KEY>...` prompts masked for each key (or takes --from-file) and writes the member once. Each key is declared in that environment's stack `secrets:` with its member, and materialize or sync writes one file per key that the app reads as `<KEY>_FILE`; the decrypted document is never written inside a repository. The owner's one age identity is SOPS_AGE_KEY in the harness secret.env, found by every secret verb by itself; whoever holds it can decrypt all history, so it never leaves there and the repositories stay private. Each environment has its own .sops.yaml rule: dev encrypts to the owner key, production to the production server key and the owner key both (Debug's refinement of two recipients, so the owner can still set and rotate production from his machine); the server's own identity is made on the server by `starci app secret server-key --env <env>` at the key file a decrypt on the server reads, only its public recipient leaving it, recorded as `deploy.remote.serverRecipient` and rotated with --rotate. The owner key is the primary way back; the owner's chosen second path (owner 2026-10-29: \"GitHub secret anyway\") is a copy streamed from the server into the secret SOPS_AGE_KEY of the GitHub Environment <env>, refused unless that Environment is protected (required reviewers or main only), and written back by the managed stack-key-restore workflow only when its public key is the recorded server recipient. That copy is also the key CI deploys the environment with: every job that opens members of <env> is bound to that Environment, whose SOPS_AGE_KEY overrides a repository secret of the name, so the owner key never needs to be in GitHub and a repository-level SOPS_AGE_KEY, which server-key warns about, is deleted once every environment holds its server key. Legacy `*.enc` members stay readable until `migrate` moves them; `audit` names members that mix providers (unless the stack declares every key of the member in it, the owner's group), keys undeclared in the stack, legacy members and a rule without the recorded server recipient beside the owner key; `split` divides a member that mixes providers, by first word or the owner's --group, and `migrate` or `split` merge into an existing member only with --into-existing, refusing a key held with another value."
    owner: "contexts/project/stacks.md PROJECT-STACKS-5"
  - id: rate-limit-redirect-outcome
    date: '2026-10-29'
    status: live
    ruling: "A redirect-only door over its rate limit answers its own error redirect (303), declared on @RateLimit, never a 429 body."
    owner: "contexts/code/be/api-auth.md BE-AUTH-4; @starci/hfs templates/be/skeleton platform/http-security rate-limit.guard.ts"
  - id: cross-capability-reads-via-owner
    date: '2026-10-29'
    status: live
    ruling: "The capability that owns a table stays its only reader and writer. Another capability reads that data through the owner's read service or through a projection the reader owns, never by querying, joining or mapping the owner's table. R86 sql-owner refuses a write to another capability's table and a read across contexts; a same-context read of another capability's table is held by review."
    owner: "contexts/code/be/persistence.md BE-PERSISTENCE-9"
  - id: slot-declared-logic
    date: '2026-10-30'
    status: live
    ruling: "A slot may declare which of its own files carry logic (`logic`, file names relative to the slot path, each one it requires or allows, on a coverage-required unit-beside slot). Those files are measured at 100 per file like any logic role, and the `<file>.spec.ts` beside each is a legitimate unit spec, held to the unit-spec form; no new role name is added to ruleParams.be.logicRoles. be.integrations.passport declares passport.tokens.ts, passport.password.ts and passport.cookie.ts."
    owner: "contexts/hfs/slots.yaml be.integrations.passport, contexts/hfs/README.md Slot fields, contexts/code/be/test.md BE-TEST-1 and BE-TEST-13 (R47, R204, R273)"
  - id: entity-base
    date: '2026-10-30'
    status: live
    ruling: "Entities do not repeat the columns every table shares (owner 2026-10-30: \"trò đọc source starci academy backend gốc có extend AbstractEntity thì cũng update hfs lun nhé tránh lặp code trên các entity\"). platform/database carries the entity bases in abstract.entity.ts: AbstractEntity maps created_at and updated_at (timestamptz, set by the database: insert and update false), UuidAbstractEntity extends it with the generated uuid id. A table whose migration has those columns, with those names and types and set by the database, maps them by extending the base, imported from @modules/platform/database; a table without them extends nothing. The bases carry no GraphQL, validator or transformer decorator and map no table themselves; they are written by the first table that extends them, never by the starter. Owner 2026-10-31 approved a lint so entities never repeat these columns again: R342 BE_ENTITY_EXTENDS_BASE (eslint-be entity-extends-base) refuses an entity that declares a database-set created_at or updated_at, or the generated uuid id beside both, itself."
    owner: "contexts/code/be/persistence.md BE-PERSISTENCE-3; @starci/hfs templates/be/skeleton platform/database abstract.entity.ts, templates/be/table/entity.ts.tpl"
  - id: app-check-cache
    date: '2026-10-31'
    status: live
    ruling: "Every app commits the results of `starci app check`, `starci app lint` and its unit coverage run in `.starcistacks/cache/` (check/, lint/, test-coverage/, sonar-baseline/, codecov-baseline/), one subfolder per family a selector of `app check` runs (`--hfs`, `--format`, `--db`, `--secrets`, `--wiring`, `--types`, `--lint`, `--test`, `--sonar`), keyed by content hashed with CRLF normalised to LF, never by time, deterministic and split per area; the CLI writes it and `app sync` never overwrites it. On a host and in CI a run judges only what differs from the cache; it is full when the cache is missing, on `--full`, when the one fingerprint check, lint and coverage share differs, and for a release. Every run hashes every file again, so a file whose hash differs is judged for real; CI trusts the cache only as it stands at the trusted base and fails a change whose committed record disagrees with what it inherited or computed. Sonar and Codecov baselines hold reference data only; the servers keep judging. The design is contexts/project/check-cache.md. Owner decisions, 2026-10-31: `app lint` stays its own verb and shares the cache with `app check`; HFS_CHECK_CACHE_FORGED is a hard blocker at any count, HFS_CHECK_CACHE_STALE and HFS_CHECK_CACHE_MISSING only warn; the release is always a full run; branch protection requiring the check is a later follow-up."
    owner: "contexts/project/check-cache.md; @starci/hfs src/main.mts, lint/run.mts, coverage/, templates/; contexts/hfs/slots.yaml and rules.yaml once built"
    words: "app check cache lại vào file dc không? sau chỉ check diff; giao làm luôn đi; nếu không có json thì check full hoặc trò require --force như github đi; suy nghĩ thiết kế phần này 1 agent opus nhé; chốt starcistacks lưu hết nhé và check diff và triển cho ci và local lun; thiết kế chuẩn để check ra bệnh và ghi vào cache"
  - id: app-cicd-auto-deploy
    date: '2026-10-31'
    status: live
    ruling: "Every app's managed `.github/` is one delivery pipeline keyed on the commit sha: the release tag run checks in full (or reuses a green candidate run of the same sha), builds each declared image once with SBOM and provenance and pushes it by `sha-<sha>` and `v<version>` to the declared registry (GitHub Actions cache per image; `linux/amd64` unless an environment declares another node), and when the one `verdict` job is green deploys every environment with `deploy.auto: true` in order through `starci app stack deploy --ci-run <run>`, which verifies the run's required jobs itself. Every green release tag deploys without waiting for the owner; `STARCI_DEPLOY_PAUSED` is the brake, and because agents push main, agents deploy. The deploy takes a lock on the manager shared with the urgent deploy, backs up and runs expand migrations inside the database's container before the services update and contract migrations only after accept in the same deploy, verifies, and on failure redeploys the previous accepted release from its stored bytes on top of Swarm's per-service update_config rollback; every attempt leaves a journal on the manager and the live service digests are compared with the accepted release. The CI SSH key is a sealed member of the environment (`vps-ci`), not a GitHub secret. Pull requests run checks only, with no secret, and Sonar runs on every full run. For an auto environment the owner's yes to deploy is that setting. The design is contexts/project/cicd.md."
    owner: "contexts/project/cicd.md; @starci/hfs templates/app/ci-workflows*, sync/, stack/, release/; cli/src/core/check/ci.ts; contexts/hfs/rules.yaml R221, R251, R271 once built"
    words: "cắm 1 opus nghiên cứu pattern ci cd chuẩn cho .github của từng dự án nhé — push cái build image mới push lên registry và tất cả pass, sau đó deploy lun, fail thì rollback trong môi trường dockerswarm. (approval, 2026-10-31:) Deploy lun có gì phải chờ"
  - id: step-card-list
    date: '2026-10-31'
    status: live
    ruling: "A few choices or facts inside a first-run step card (connect a channel, the rules a workspace starts with) are a SurfaceListCard of ListRow with the label outside, the `step` row of `list-table.choose.role`, placed before `entity`. This is the second exception to \"a list is never wrapped in a card\" beside the rail list (COLLECTION-1); a list in a page section stays a section list without a card. Owner chose \"SurfaceListCard\" for the step card, 2026-10-31."
    owner: "contexts/ui/components/list-table.md (list-table.choose.role, step); contexts/ui/components/card.md rail-list"
  - id: flow-graph-orbit
    date: '2026-10-31'
    status: live
    ruling: "FlowGraph layout=\"orbit\" is the value-sized map: bubble nodes (form, mark, caption, diameter, flowGraphDiameter), the info tone, fill and ring for status, isDimmed for a filter, expandedIds and fanLimit for the fan on ring four, a hover and focus tip, and the zoom-fixed text of a bubble. An app never draws its own map with React Flow; a status never rests on colour alone."
    owner: "@starci/grammar src/core/branch/FlowGraph"
  - id: agent-keyed-schedules
    date: '2026-10-31'
    status: live
    ruling: "A schedule owned by a data row, such as one agent's next run, is a BullMQ job scheduler keyed by that row, in lite as in full. A customer chat turn locks per conversation and background or scheduled work locks per agent: one conversation never has two turns overlapping, and several customers of one agent are answered in parallel."
    owner: "contexts/code/be/queues.md (BE-QUEUES-3)"

