  # --- app shape, editions and back end
  - id: lite-self-hosted-postgres-passport-minio
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim (relayed from the nivo-lite chat after the hosted Supabase project of nivo-lite was locked on its egress quota and production went down): \"self host postgresql + auth thì trò tự code gg auth (lite, full dùng keycloak)\", \"storage minio trên tayson có r!!!!\", \"auth dùng passport nestjs\", \"cập nhật lại luôn cả .claude nhé cho lite app\". The lite edition leaves Supabase: its PostgreSQL is self-hosted as the db service of the app's stack (its image is ruling lite-official-postgres-image), its schema is db/migrations applied by starci app db migrate, its identity is the app's own NestJS Passport integration (Google OAuth 2.0 with state and PKCE, email and password with bcrypt, the app's own asymmetric access tokens and JWKS, a rotating refresh token in an httpOnly cookie), and its storage is the MinIO already running on the Tay Son host through one S3 integration. The front end holds no credential and talks only to the app's own auth doors. Full keeps Keycloak."
    owner: "contexts/hfs/slots.yaml (app.db*, be.integrations.passport, be.integrations.object-storage, ruleParams.be.infraOwners); contexts/hfs/rules.yaml R328-R332; contexts/code/be/api-auth.md, persistence.md, infra.md; contexts/project/lite.md; @starci/eslint-canon-be src/auth-passport.ts; @starci/hfs db/ and templates"
  - id: lite-official-postgres-image
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: \"chạy postgresql thuần image chính chủ nhé ko phải supebase\", then \"pgvector\" as the one extension package and \"Nest schedule\" for the ticks pg_cron ran. The lite db service runs the Docker Official postgres image (major 17, pinned by digest) through the app's managed .starcistacks/images/db/Dockerfile, which adds only the PGDG package of pgvector; the contrib extensions the image ships (pgcrypto, pg_trgm, unaccent, uuid-ossp, btree_gist) are the rest, pgmq is added by ruling lite-pgmq-bus-bullmq-jobs, and there is no pg_cron, pg_net or supabase_vault. The scratch database of starci app db drift and the local db container build the same Dockerfile. Recurring work is a tick of platform/jobs: @nestjs/schedule fires it in the back end, each firing claims its minute in the database under advisoryXactLock and enqueues one job through the queue outbox, so one replica fires it once."
    owner: "contexts/stack/pins.yaml (images postgres); contexts/hfs/slots.yaml (app.db.image, ruleParams.db.extensions, ruleParams.be.infraOwners, be.platform.jobs); contexts/hfs/rules.yaml R335; contexts/code/be/jobs.md BE-JOBS-6; contexts/project/lite.md; @starci/hfs templates/app/db-image, sync, db/drift.mjs; @starci/eslint-canon-be src/jobs-scheduler.ts"
  - id: lite-queue-bullmq
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: \"Giữ BullMQ\". The lite queue is BullMQ on the declared Redis, the shape nivo-lite runs, as in full: platform/queue owns bullmq and ioredis, a producer writes the queue outbox in its transaction and the relay adds each committed row to BullMQ; no queue rides on Postgres tables."
    owner: "contexts/code/be/queues.md; contexts/hfs/slots.yaml (be.platform.queue, ruleParams.be.infraOwners, ruleParams.be.backing)"
  - id: lite-pgmq-bus-bullmq-jobs
    date: '2026-10-29'
    status: live
    ruling: "Owner, verbatim: asked \"Event bus của bản lite đi qua đâu?\" he answered \"BullMQ\", then settled it as \"bullmq để chạy job còn pgmq làm queue hiểu ý không? chốt v đi\". BullMQ on the declared Redis runs jobs: background work, retries and the scheduled ticks of platform/jobs, through platform/queue as ruling lite-queue-bullmq has it. pgmq is the message queue between features, the lite event bus: publishing sends the typed envelope to its pgmq topic inside the same transaction as the data change, so the bus needs no outbox or relay; each consumer group of a reactor reads its own queue bound to the event's name with a visibility timeout, archives a handled message and lets a failed one reappear, so consumers stay idempotent through the inbox. The managed .starcistacks/images/db/Dockerfile installs pgmq from its pinned release, verified by sha256, into its own schema pgmq; no job queue rides on pgmq and pg_cron stays refused."
    owner: "contexts/code/be/event-bus.md BE-EVENT-BUS-3, -4; contexts/hfs/rules.yaml R258; contexts/hfs/slots.yaml (be.platform.event-bus lite, ruleParams.db.extensions, ruleParams.be.dbFunctions); contexts/project/lite.md; @starci/hfs templates/app/db-image (sync PGMQ), templates/be/inbox/platform/event-bus, runtime/scripts/hfs/rules/database-queues.mjs"
