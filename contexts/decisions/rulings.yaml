  - id: project-service-credential-custody
    date: '2026-11-02'
    status: live
    words: "ý là chốt patterns lưu trữ cho từng dự án trên .starcistacks hiểu k?; trò nhớ lưu cả user pass lẫn host url nhé vì hiện tại chạy local nma tương lai có thể chạy cloud"
    ruling: "Each product keeps its complete quality-service connection profile in .starcistacks: public provider, mode, endpoint and project settings in application-stacks.yaml; username, password, private endpoint and project analysis token values only in SOPS members of declared environments. Required product Sonar analysis uses the declared environment's sonar.enc.yaml member. Credential references name actual encrypted member paths and keys; a project credential's project field references the exact projects[].key selected by consumer repository. Operator/admin login credentials occupy a separate authority member from analysis, and never flow implicitly into scanning or CI. A service CI secret is an execution copy linked explicitly through services.<id>.ci.secrets[].credential; ci.token selects that analysis copy. Native local analysis decrypts the selected product credential in memory through the existing identity owner and forwards it only to its scanner child, with no host/global token fallback. Runtime-granted application keys remain barred from CI. OIDC declares authentication without a fabricated token. The owner identity remains outside project repositories and CI quality jobs need no age identity. Missing, ambiguous, wrong-project or unopenable custody refuses; this storage pattern authorizes no remote project recreation, history replacement or credential rotation."
    owner: "contexts/project/stacks.md PROJECT-STACKS-5, PROJECT-STACKS-7, PROJECT-STACKS-8; contexts/hfs/rules.yaml R296; @starci/hfs runtime/scripts/hfs/ci-declaration.mts, secret-store.mts, secret-standard.mts, rules/ci-custody.mts, release/gate.mts, ci/secret.mts"
  - id: app-secrets-one-standard
    date: '2026-10-29'
    status: live
    ruling: "App secrets have one standard, committed to git encrypted. A member holds the keys of one provider or service, `.starcistacks/<env>/secrets/<provider>.enc.yaml`, a YAML document whose multi-line values round-trip byte for byte; `starci app secret set --env <env> <provider> <KEY>...` prompts masked for each key (or takes --from-file) and writes the member once. Each runtime key is declared in that environment's stack `secrets:` with its member, and materialize or sync writes one file per key that the app reads as `<KEY>_FILE`; service keys name their exact member and key through `services.<id>.credentials[]` rather than runtime grants; the decrypted document is never written inside a repository. The owner's one age identity is SOPS_AGE_KEY in the harness secret.env, found by every secret verb by itself; whoever holds it can decrypt all history, so it never leaves there and the repositories stay private. Each environment has its own .sops.yaml rule: dev encrypts to the owner key, production to the production server key and the owner key both (Debug's refinement of two recipients, so the owner can still set and rotate production from his machine); the server's own identity is made on the server by `starci app secret server-key --env <env>` at the key file a decrypt on the server reads, only its public recipient leaving it, recorded as `deploy.remote.serverRecipient` and rotated with --rotate. The owner key is the primary way back; the owner's chosen second path (owner 2026-10-29: \"GitHub secret anyway\") is a copy streamed from the server into the secret SOPS_AGE_KEY of the GitHub Environment <env>, refused unless that Environment is protected (required reviewers or main only), and written back by the managed stack-key-restore workflow only when its public key is the recorded server recipient. That copy is also the key CI deploys the environment with: every job that opens members of <env> is bound to that Environment, whose SOPS_AGE_KEY overrides a repository secret of the name, so the owner key never needs to be in GitHub and a repository-level SOPS_AGE_KEY, which server-key warns about, is deleted once every environment holds its server key. Legacy `*.enc` members stay readable until `migrate` moves them; `audit` names members that mix providers (unless the stack declares every key of the member in it, the owner's group), keys undeclared in the stack, legacy members and a rule without the recorded server recipient beside the owner key; `split` divides a member that mixes providers, by first word or the owner's --group, and `migrate` or `split` merge into an existing member only with --into-existing, refusing a key held with another value."
    owner: "contexts/project/stacks.md PROJECT-STACKS-5"
