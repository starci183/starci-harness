# The DNA: every constraint a grammar keeps, each one law with the measurement a DNA gate performs on a render.
# Layer 1 of grammars/README.md#three-layers: a DNA entry is a constraint, never a judgement; a choice rule moves here
# only once it has a measure. A gate run for grammar <id> measures `common` plus `<id>`; roles[].dna lists the ids.
mustKeep:
  shape:
    id: "DNA-<SCOPE>-<NAME>, SCOPE is COMMON (held by every grammar), CORE or OFFSET-POP; stable, a closed id is never reused"
    role: "a roles[].id, a list of them, or root"
    law: "the constraint as one present-tense sentence"
    measure: "one measure object (fields below)"
    owner: "who fixes the law or its value: a rule id, a contract role, a contexts section, a package path"
    followUp: "optional: the open decision whose code change makes the law hold; the gate reports the entry red until it lands"
  measureFields:
    kind:
      box: "border-box geometry of each match in CSS px: width, height, top, bottom, left, right; inner-left and inner-right are the padding box (inside the border)"
      style: "computed style of each match (and of `pseudo` when given); metric is a CSS property or a derived metric"
      attr: "an attribute value of each match"
      relation: "a metric of each match against `ref`: { within: ancestor selector (closest), select: a selector inside it, self (the ancestor) or previous (the previous sibling matching select), metric, offset }; the compared value is ref + offset"
      uniform: "every match inside one `scope` has the same metric value"
      count: "the number of matches inside each `scope` (the family root when absent), after the `where` filter; no metric"
      seams: "the visible horizontal rules between consecutive `rows` inside each match; metric count (compared with rows - 1) or inset-inline (each rule's distance from the match's padding box, both sides)"
      a11y: "accessibility-tree property of each match: role, name, description, focusable, controls (the id it controls resolves to `value`)"
      text: "rendered text of each match; metric text, first-letter (uppercase or lowercase) or lines (rendered line count)"
      tokens: "custom properties resolved on the family root; metric is a list of names or { contract: <path in this file> }; an order op (> <) compares each name with the next"
      interaction: "`act` steps on each match (press <key>, focus, hover, press, open (the fixture opens the overlay the match belongs to), state <name> (the fixture sets that state), resize <inline-size>), then `then`, a measure on the same match (kind defaults to style) or on `then.select`"
      source: "a static check another gate owns: lint:<rule id>, parity:<mode> or conformance; the DNA gate verifies the check exists and is green"
    select: "a CSS selector evaluated inside .grammar-common-root[data-grammar-family=\"<id>\"]; `document ` prefix means the whole document"
    scope: "optional ancestor selector grouping matches (uniform, count, seams)"
    target: "optional: painted-box measures the painted box resolved from each match instead of the match itself"
    checks: "instead of metric, op and value: a list of { metric, op, value }, every one must hold"
    metric: "one name or a list; every listed metric is held to the same op and value; against a list-valued ref the lists pair element-wise"
    derivedMetrics:
      radius: "border-start-start-radius resolved to px"
      border-width: "the largest of the four border widths"
      shadow-blur: "blur radius of the first box-shadow layer (0 when none)"
      shadow-offset: "x and y offsets of the first box-shadow layer"
      scale: "scale factor of the computed transform matrix (1 when none)"
      translate: "x and y translation of the computed transform matrix"
      hit-area: "the square around the box centre over which elementFromPoint resolves to the match or a descendant"
      focus-rings: "elements in the match's subtree, the match included, that draw a visible outline or a focus box-shadow"
      tabs-look: "pill when the selected tab's .tabs__indicator is at least 80% of the tab's height, else underline"
      painted-box: "the nearest element at or above the match, inside the same component, whose background-color is not transparent"
      contrast: "the WCAG ratio of the match's text colour against its composed ground: its own background composited over every ancestor's up to an opaque one, read as rendered sRGB"
      navigation: "client (history changed, no document load), reload or none"
      scroll-owners-x: "how many elements at or above the match scroll on the inline axis (overflow auto or scroll and content larger than the box)"
      scroll-owners-y: "the same on the block axis"
    op: "= != < <= > >= set (resolves to a non-empty value) matches (a pattern or another value)"
    value: >-
      a literal with its unit; or { token: --name } resolved on the match through a probe so colours compare as computed
      rgb; or { threshold: <key path in ../ui/proof/thresholds.yaml> }; or { vendor: { component, props, metric } }, the
      HeroUI component rendered in the same root with $data-size standing for the match's data-size; or
      { self: <metric>, times: n }; or { count: <selector>, offset: n } (count only); or { rows: n } (seams: the row count
      plus n); or { oneOf: [values] }; or { before: true } (interaction:
      the same metric before `act`); or { fixture: <fact> } that the gate's fixture declares
    where: "optional filter on matches: { metric, op, value }"
    context: "pointer coarse|fine, viewport WxH, theme light|dark, forcedColors active, reducedMotion reduce, state hover|pressed|focus-visible; default light, fine pointer, 1280x800"
    tolerance: "box and relation, default 0.5px"
    cases: "a list of { select, metric?, value } sharing every other field"
    coverage: "an entry with zero matches is not exercised: the gate reports it per id from its fixture and never passes it"

  common:
    # --- size ramp (contract sizes)
    - id: DNA-COMMON-CONTROL-MD
      role: button
      law: An md button or icon button, and every bar control, is 40px tall at every breakpoint.
      measure: { kind: box, select: ':is([data-component="Button"],[data-component="IconButton"]):is([data-size="md"],[data-size="control"]):not([data-width="fill"])', metric: height, op: "=", value: 40px }
      owner: ui/scale.md scale.choose.step
    - id: DNA-COMMON-CONTROL-SM
      role: button
      law: An sm button or icon button is one equal increment below md, 32px.
      measure: { kind: box, select: ':is([data-component="Button"],[data-component="IconButton"])[data-size="sm"]:not([data-width="fill"])', metric: height, op: "=", value: 32px }
      owner: ui/scale.md scale.choose.step; contract sizes.increments
    - id: DNA-COMMON-CONTROL-LG
      role: button
      law: An lg button or icon button is one equal increment above md, 48px.
      measure: { kind: box, select: ':is([data-component="Button"],[data-component="IconButton"])[data-size="lg"]:not([data-width="fill"])', metric: height, op: "=", value: 48px }
      owner: ui/scale.md scale.choose.step; contract sizes.increments
    - id: DNA-COMMON-CONTROL-FILL
      role: button
      law: A full-width button holds its step as a floor at every breakpoint, md 40px, sm 32px and lg 48px; only a wrapped label grows it.
      measure:
        kind: box
        metric: height
        op: ">="
        cases:
          - { select: '[data-component="Button"][data-width="fill"]:is([data-size="md"],[data-size="control"])', value: 40px }
          - { select: '[data-component="Button"][data-width="fill"][data-size="sm"]', value: 32px }
          - { select: '[data-component="Button"][data-width="fill"][data-size="lg"]', value: 48px }
      owner: ui/scale.md scale.choose.step
    - id: DNA-COMMON-ICON-BUTTON-SQUARE
      role: button
      law: An icon button is as wide as it is tall at its step.
      measure: { kind: box, select: '[data-component="IconButton"]', metric: width, op: "=", value: { self: height, times: 1 } }
      owner: contract roles.button
    - id: DNA-COMMON-FIELD-MD
      role: [input, select, copy-field]
      law: Every single-line field box (input, select trigger, combo box, search, number, date and time field, copy field) is as tall as an md control, 40px.
      measure: { kind: box, select: ':is(.starci-core-input-field,.starci-core-select-trigger,.starci-core-combo-box-group,.starci-core-search-field-group,.starci-core-number-field-group,.starci-core-date-group,.starci-core-copy-field-group):not([data-grammar-field-size="sm"] *)', metric: height, op: "=", value: 40px }
      owner: ui/scale.md scale.choose.step
    - id: DNA-COMMON-TABS-BAR-MD
      role: tabs
      law: A tab bar, pill or underline, lands on the md height without a size prop.
      measure: { kind: box, select: '[data-component="Tabs"] .tabs__list-container', metric: height, op: "=", value: 40px }
      owner: contract roles.tabs
    - id: DNA-COMMON-AVATAR-RAMP
      role: avatar
      law: An avatar is on the control ramp, sm 32px, md 40px, lg 48px and the bar avatar 40px.
      measure:
        kind: box
        metric: [width, height]
        op: "="
        cases:
          - { select: '[data-component="Avatar"][data-grammar-avatar-size="sm"]', value: 32px }
          - { select: '[data-component="Avatar"][data-grammar-avatar-size="md"]', value: 40px }
          - { select: '[data-component="Avatar"][data-grammar-avatar-size="lg"]', value: 48px }
          - { select: '[data-component="Avatar"][data-grammar-avatar-size="control"]', value: 40px }
      owner: ui/scale.md scale.choose.step
    - id: DNA-COMMON-BAR-ONE-HEIGHT
      role: shell
      law: Every control in a bar has one height, the md height.
      measure: { kind: uniform, scope: '[data-component="TopBar"]', select: ':is([data-component="Button"],[data-component="IconButton"],[data-component="Avatar"],[data-component="Switch"],.starci-core-search-field-group)', metric: height, op: "=", value: 40px }
      owner: ui/scale.md scale.choose.step; contract sizes.control
    - id: DNA-COMMON-BADGE-BELOW-RAMP
      role: chip
      law: A Badge and a StatusDot are labels below the control ramp, shorter than an sm control.
      measure: { kind: box, select: ':is([data-component="Badge"],[data-component="StatusDot"])', metric: height, op: "<", value: 32px }
      owner: contract sizes.labels
    - id: DNA-COMMON-TARGET-COARSE
      role: button
      law: On a coarse pointer every pressable part has a hit area of at least the coarse floor, without redrawing its box.
      measure: { kind: box, context: { pointer: coarse, viewport: 375x812 }, select: ':is([data-component="Button"],[data-component="IconButton"],[data-component="TextAction"],[role="tab"],[role="option"],[role="radio"],[role="checkbox"],[role="switch"],[role="menuitem"],[role="row"][data-grammar-tag])', metric: hit-area, op: ">=", value: { threshold: target.coarse.min } }
      owner: contract sizes.target; ui/scale.md
      followUp: the Common sheet assigns the target tokens and extends every pressable part's hit area to the floor
    - id: DNA-COMMON-TARGET-FINE
      role: button
      law: On a fine pointer every pressable part has a hit area of at least the fine floor.
      measure: { kind: box, context: { pointer: fine }, select: ':is([data-component="Button"],[data-component="IconButton"],[data-component="TextAction"],[role="tab"],[role="option"],[role="radio"],[role="checkbox"],[role="switch"],[role="menuitem"])', metric: hit-area, op: ">=", value: { threshold: target.fine.min } }
      owner: contract sizes.target
    # --- root, tokens and rhythm
    - id: DNA-COMMON-TOKENS-BOUND
      role: root
      law: Every contract colour role resolves to a value, the app's own, the family's default theme.css or HeroUI's own; none is left undefined. The extension pair (info) is optional and reads as accent when unset.
      measure: { kind: tokens, metric: { contract: tokens.colour }, op: set }
      owner: contract tokens
    - id: DNA-COMMON-RHYTHM-MONOTONIC
      role: root
      law: The rhythm tokens are strictly ordered, region gap above section gap above row gap above inline gap above identity gap.
      measure: { kind: tokens, metric: [--grammar-region-gap, --grammar-section-gap, --grammar-row-gap, --grammar-inline-gap, --grammar-identity-gap], op: ">" }
      owner: "@starci/grammar src/common/spacing.ts; ui/presentation.md (Space)"
    - id: DNA-COMMON-ONE-TOASTER
      role: alert
      law: A document holds at most one Toaster, inside the grammar root.
      measure: { kind: count, select: 'document [data-component="Toaster"]', op: "<=", value: 1 }
      owner: grammars/common.md#one-root
    - id: DNA-COMMON-TOASTER-LIVE
      role: alert
      law: The Toaster owns exactly one polite and one assertive live region.
      measure:
        kind: count
        scope: '[data-component="Toaster"]'
        op: "="
        cases:
          - { select: '[data-grammar-toaster-live="polite"][aria-live="polite"]', value: 1 }
          - { select: '[data-grammar-toaster-live="assertive"][aria-live="assertive"]', value: 1 }
      owner: grammars/common.md#one-root
    - id: DNA-COMMON-OVERLAY-IN-ROOT
      role: [dialog, menu, select]
      law: Every open overlay (dialog, alert dialog, drawer, popover, menu, listbox popover, tooltip) renders inside the grammar root.
      measure: { kind: count, select: 'document :is([role="dialog"],[role="alertdialog"],[role="menu"],[role="listbox"],[role="tooltip"]):not(.grammar-common-root[data-grammar-family] *)', op: "=", value: 0 }
      owner: grammars/common.md#one-root
    - id: DNA-COMMON-NO-BOTTOM-TABS
      role: shell
      law: The shell has no bottom tab bar; on a phone the navigation is the drawer.
      measure: { kind: count, context: { viewport: 375x812 }, select: '[data-component="BottomNav"]', op: "=", value: 0 }
      owner: contract roles.shell; lint no-shell-bottom-tabs
    - id: DNA-COMMON-ONE-SHELL
      role: shell
      law: One shell owns the frame, the bar and the mobile drawer.
      measure: { kind: count, select: 'document [data-component="WorkspaceShell"]', op: "<=", value: 1 }
      owner: contract roles.shell
    - id: DNA-COMMON-ONE-SCROLL-OWNER
      role: shell
      law: One owner scrolls each axis; no scrolling element sits inside another that scrolls on the same axis.
      measure: { kind: style, select: '*', metric: [scroll-owners-x, scroll-owners-y], op: "<=", value: 1 }
      owner: contract roles.shell; OVERFLOW-3
    - id: DNA-COMMON-VENDOR-PARITY
      role: root
      law: Every wrapper keeps HeroUI's parts, required parts, roles, keyboard, focus, props, closed values and defaults.
      measure: { kind: source, check: "parity:always" }
      owner: vendor/parity.yaml
    # --- surfaces and cards
    - id: DNA-COMMON-NO-RAISED-SURFACE-IN-SURFACE
      role: card
      law: A surface never stands inside another surface (a card in a card, in Pane surface, in a Dialog, Drawer or Popover); the grammar has one depth, raised.
      measure: { kind: count, select: '[data-grammar-surface-card] [data-grammar-surface-card]', op: "=", value: 0 }
      owner: ui/components/card.md; src/core/surfaceContext.tsx
    - id: DNA-COMMON-CARD-LABEL-ABOVE
      role: card
      law: A card's label row sits above the card's content frame, never beside it; a card that heads a section carries it outside the painted material and a tile carries its name inside, with its mark.
      measure: { kind: relation, select: '[data-component="SurfaceCard"] > [data-grammar-surface-label]', metric: bottom, op: "<=", ref: { within: '[data-component="SurfaceCard"]', select: '[data-grammar-surface-content]', metric: top } }
      owner: contract roles.card
    - id: DNA-COMMON-CARD-LABEL-HEADING
      role: card
      law: A card label is a heading and names its card.
      measure: { kind: a11y, select: '[data-grammar-surface-label] > :first-child', metric: role, op: "=", value: heading }
      owner: contract roles.card
    - id: DNA-COMMON-ONE-HIGHLIGHT
      role: card
      law: A view holds at most one highlighted card.
      measure: { kind: count, select: 'document [data-grammar-highlight="true"]', op: "<=", value: 1 }
      owner: contract roles.card variants.highlight
      followUp: G-9
    - id: DNA-COMMON-DIVIDER-FULL-BLEED
      role: card
      law: A horizontal divider runs the full inner width of its surface, inline inset 0px on both sides.
      measure: { kind: relation, select: '[data-component="Divider"][data-grammar-divider="bare"][data-grammar-divider-orientation="horizontal"]', metric: [left, right], op: "=", ref: { within: '[data-grammar-frame="bounded"]', select: self, metric: [inner-left, inner-right] } }
      owner: ui/presentation.md R3
    - id: DNA-COMMON-SOFT-GROUND
      role: card
      law: A soft card's ground is the family's accent-soft tint.
      measure: { kind: style, select: '[data-component="SurfaceCard"] > [data-grammar-surface-treatment="soft"]', metric: background-color, op: "=", value: { token: --accent-soft } }
      owner: ui/components/card.md card.choose.treatment
    - id: DNA-COMMON-TREATMENT-TEXT-CONTRAST
      role: card
      law: In every SurfaceCard treatment and theme, a step number reads against its own circle and text reads against the card's ground.
      measure:
        kind: style
        metric: contrast
        op: ">="
        value: { threshold: contrast.text }
        cases:
          - { select: '[data-grammar-surface-treatment] [data-component="Stepper"] [data-grammar-step-marker]' }
          - { select: '[data-grammar-surface-treatment] :is([data-component="Text"], [data-grammar-section-header] :is(h2, h3, p))' }
      owner: ui/components/card.md card.choose.treatment; COLOR-5; story Navigation & Data / Stepper on every treatment, Surfaces / Soft surface card
      followUp: "contexts/harness/questions.md: retire the law, or name the colour to move"
    - id: DNA-COMMON-ACCENT-CORNER
      role: card
      law: The corner a SurfaceCard or MediaFrame names in accentCorner is drawn at the Common accent radius.
      measure: { kind: style, select: '[data-grammar-accent-corner="end-end"]', metric: border-end-end-radius, op: "=", value: { token: --grammar-accent-corner } }
      owner: grammars/contract.md (Corners are roles)
    # --- lists
    - id: DNA-COMMON-LIST-SEAMS
      role: list
      law: n rows of a list are divided by exactly n-1 seams, or by gap and no seam.
      measure: { kind: seams, select: '[data-grammar-list="true"]', rows: ':is([data-grammar-row],[data-grammar-list-item],[role="option"])', metric: count, op: "=", value: { oneOf: [{ rows: -1 }, 0] } }
      owner: contract roles.list; BOUNDARY-3
    - id: DNA-COMMON-SEAM-FULL-BLEED
      role: list
      law: Every seam between rows runs the list's full inner width, inline inset 0px.
      measure: { kind: seams, select: '[data-grammar-list="true"]', rows: ':is([data-grammar-row],[data-grammar-list-item],[role="option"])', metric: inset-inline, op: "=", value: 0px }
      owner: ui/presentation.md R3
    - id: DNA-COMMON-ROW-DESCRIPTION-ONE-LINE
      role: list
      law: A static or entity row's description renders one line.
      measure: { kind: text, select: '.starci-core-list-row-description', metric: lines, op: "<=", value: 1 }
      owner: ui/components/list-table.md
    - id: DNA-COMMON-OPTION-DESCRIPTION-WRAPS
      role: list
      law: A list box option's description wraps unless the list sets descriptionLines.
      measure: { kind: style, select: '[data-component="ListBox"] [data-grammar-item-description]:not([data-grammar-description-lines="1"],[data-grammar-description-lines="2"],[data-grammar-description-lines="3"])', metric: -webkit-line-clamp, op: "=", value: none }
      owner: contract roles.list
    - id: DNA-COMMON-TABLE-ROW-LINK
      role: list
      law: A table row with href is one link that navigates through the root's router, without a document load.
      measure: { kind: interaction, select: '[data-grammar-table-row-link="true"]', act: [focus, press Enter], then: { metric: navigation, op: "=", value: client } }
      owner: contract roles.list; grammars/common.md#one-root
    - id: DNA-COMMON-TABLE-FOLD
      role: list
      law: On a narrow table the low-priority columns fold into the first column, so only high-priority column headers remain.
      measure: { kind: interaction, select: '[data-component="DataTable"]', act: [resize 600px], then: { select: '[role="columnheader"]', kind: count, op: "=", value: { fixture: highPriorityColumns } } }
      owner: contract roles.list
    # --- buttons and groups
    - id: DNA-COMMON-PENDING-KEEPS-BOX
      role: button
      law: A pending button keeps its box and its accessible name and refuses a second press.
      measure: { kind: interaction, select: '[data-component="Button"]', act: [state pending], then: { metric: [width, height, name], op: "=", value: { before: true } } }
      owner: contract roles.button; CTA-3
    - id: DNA-COMMON-SKELETON-CORNER
      role: button
      law: A button skeleton takes the corner of the button it stands for.
      measure: { kind: style, select: '[data-component="Button"][data-loading="true"]', metric: radius, op: "=", value: { vendor: { component: Button, props: { size: $data-size }, metric: radius } } }
      owner: grammars/core.md
    - id: DNA-COMMON-LOADING-REGION-INERT
      role: button
      law: "Inside a loading region nothing can be focused or pressed: every control draws inert, static chrome keeps its words, data is geometry, and the region carries the one aria-busy."
      measure: { kind: count, scope: '[data-grammar-loading-region="true"]', select: ':is(button, a[href], input, select, textarea, [tabindex="0"]):not([inert], [inert] *, :disabled)', op: "=", value: 0 }
      owner: ui/loading.md
    - id: DNA-COMMON-LOADING-SAME-BOX
      role: button
      law: "A component in a loading region has the width and height it has when ready, so nothing moves when the data lands."
      measure: { kind: uniform, scope: '[data-grammar-twin]', select: '[data-grammar-twin-item]', metric: [width, height], op: "=" }
      owner: ui/loading.md
    - id: DNA-COMMON-DISABLED-REASON
      role: button
      law: A disabled button's reason is its accessible description and shows in a tooltip on hover and keyboard focus.
      measure: { kind: interaction, select: '[data-component="Button"]:is([disabled],[data-disabled="true"],[aria-disabled="true"])', act: [focus], then: { select: 'document [role="tooltip"]', kind: text, metric: text, op: "=", value: { fixture: disabledReason } } }
      owner: contract roles.button
    - id: DNA-COMMON-BUTTONGROUP-JOINED
      role: button-group
      law: Buttons of a horizontal group touch with no gap between them.
      measure: { kind: relation, select: '[data-component="ButtonGroup"][data-grammar-orientation="horizontal"] [data-component="Button"] + [data-component="Button"]', metric: left, op: "<=", ref: { within: '[data-component="ButtonGroup"]', select: previous, metric: right } }
      owner: contract roles.button-group; vendor/parity.yaml button-group
    - id: DNA-COMMON-BUTTONGROUP-INNER-CORNERS
      role: button-group
      law: The inner corners of a horizontal group are square.
      measure: { kind: style, select: '[data-component="ButtonGroup"][data-grammar-orientation="horizontal"] [data-component="Button"] + [data-component="Button"]', metric: [border-start-start-radius, border-end-start-radius], op: "=", value: 0px }
      owner: vendor/parity.yaml button-group
    - id: DNA-COMMON-BUTTONGROUP-NO-PRESS-SCALE
      role: button-group
      law: A button inside a group does not scale when pressed.
      measure: { kind: style, context: { state: pressed }, select: '[data-component="ButtonGroup"] [data-component="Button"]', metric: scale, op: "=", value: 1 }
      owner: vendor/parity.yaml button-group
    - id: DNA-COMMON-BUTTONGROUP-ONE-INTENT
      role: button-group
      law: Every button of a group has one paint, because a group holds peers of one intent.
      measure: { kind: uniform, scope: '[data-component="ButtonGroup"]', select: '[data-component="Button"]', metric: [background-color, color], op: "=" }
      owner: CTA-5
    - id: DNA-COMMON-ONE-ACCENT-FILL
      role: button
      law: A view shows at most budgets.commitPerView buttons in the accent fill, the commit; the page behind an open modal does not count.
      measure: { kind: count, select: 'document [data-component="Button"]:not([inert] *)', where: { metric: background-color, op: "=", value: { token: --accent } }, op: "<=", value: { threshold: budgets.commitPerView.max } }
      owner: CTA-1; lint single-commit-per-render
    # --- tabs, segmented control, fields
    - id: DNA-COMMON-TABS-BY-LAYER
      role: tabs
      law: Every tab bar draws the underline, on the page and inside a surface alike, views and filter tabs alike.
      measure:
        kind: style
        metric: tabs-look
        op: "="
        cases:
          - { select: '[data-component="Tabs"]', value: underline }
      owner: contract roles.tabs; ui/presentation.md (Space)
      followUp: C-1
    - id: DNA-COMMON-TABS-FILTER-COMPACT
      role: tabs
      law: A filter tab is one size smaller than a page tab, 32px tall, with a hairline under the row.
      measure:
        kind: box
        select: '[data-grammar-tabs-kind="filter"] [role="tab"]'
        metric: height
        op: "="
        value: 32px
      owner: ui/components/tabs.md tabs.choose.role
    - id: DNA-COMMON-TABS-INDICATOR
      role: tabs
      law: A tab bar draws exactly one indicator.
      measure: { kind: count, scope: '[data-component="Tabs"]', select: '.tabs__indicator', op: "=", value: 1 }
      owner: vendor/parity.yaml tabs
    - id: DNA-COMMON-TABS-OWN-PANEL
      role: tabs
      law: Each tab controls its own panel.
      measure: { kind: a11y, select: '[data-component="Tabs"] [role="tab"]', metric: controls, op: "=", value: tabpanel }
      owner: vendor/parity.yaml tabs
    - id: DNA-COMMON-TABS-ROVING
      role: tabs
      law: Arrow keys move focus between tabs.
      measure: { kind: interaction, select: '[data-component="Tabs"] [role="tab"][aria-selected="true"]', act: [focus, press ArrowRight], then: { select: 'document :focus', kind: a11y, metric: role, op: "=", value: tab } }
      owner: vendor/parity.yaml tabs
    - id: DNA-COMMON-FIELD-BY-LAYER
      role: [input, select, copy-field]
      law: A field on the canvas takes the primary treatment and a field inside a surface the secondary one, never by app choice; a search box is the field tone (secondary) in both places.
      measure:
        kind: attr
        metric: data-grammar-variant
        op: "="
        cases:
          - { select: ':is([data-component="Input"],[data-component="Select"],[data-component="NumberField"],[data-component="Textarea"],[data-component="CopyField"]):not([data-grammar-nesting="surface"] *)', value: primary }
          - { select: '[data-grammar-nesting="surface"] :is([data-component="Input"],[data-component="Select"],[data-component="NumberField"],[data-component="Textarea"],[data-component="CopyField"])', value: secondary }
          - { select: '[data-component="SearchField"]', value: secondary }
      owner: FE-CSS-1; UI-10; U6-5 (a search box is the field tone wherever it stands)
    - id: DNA-COMMON-FIELD-NAME-IS-LABEL
      role: [input, select]
      law: A field's accessible name is its visible label, never its placeholder.
      measure: { kind: a11y, select: ':is(input,textarea,[role="combobox"]):is([data-component="Input"] *,[data-component="Textarea"] *,[data-component="Select"] *,[data-component="ComboBox"] *,[data-component="SearchField"] *,[data-component="NumberField"] *)', metric: name, op: "=", value: { fixture: label } }
      owner: contract roles.input; A11Y-1
    - id: DNA-COMMON-FIELD-ERROR-DESCRIBES
      role: [input, select]
      law: An invalid field's error renders in its own slot and is part of its accessible description.
      measure: { kind: a11y, select: '[aria-invalid="true"]', metric: description, op: matches, value: { fixture: errorMessage } }
      owner: FEEDBACK-1
    - id: DNA-COMMON-FIELD-ONE-RING
      role: input
      law: A focused single-line field shows exactly one focus ring, on the field frame.
      measure: { kind: interaction, select: ':is([data-component="Input"],[data-component="Select"],[data-component="SearchField"],[data-component="NumberField"],[data-component="ComboBox"])', act: [focus], then: { metric: focus-rings, op: "=", value: 1 } }
      owner: FOCUS-1
    - id: DNA-COMMON-FIELD-ANATOMY-ORDER
      role: [input, select, copy-field]
      law: A field draws HeroUI's order, label, control, description, error; its description is standing guidance under the control, never between the label and the control.
      measure:
        kind: relation
        select: ':is([data-component="Input"],[data-component="Field"],[data-component="Textarea"],[data-component="SearchField"],[data-component="NumberField"],[data-component="DateField"],[data-component="TimeField"],[data-component="FileDropzone"],[data-component="Select"],[data-component="ComboBox"],[data-component="DatePicker"],[data-component="DateRangePicker"],[data-component="CopyField"]) [data-grammar-field-description]:not([data-grammar-field-control] *)'
        metric: top
        op: ">="
        ref: { within: ':is([data-component="Input"],[data-component="Field"],[data-component="Textarea"],[data-component="SearchField"],[data-component="NumberField"],[data-component="DateField"],[data-component="TimeField"],[data-component="FileDropzone"],[data-component="Select"],[data-component="ComboBox"],[data-component="DatePicker"],[data-component="DateRangePicker"],[data-component="CopyField"])', select: ':is([data-grammar-field-control="true"],[data-grammar-input-control="true"])', metric: bottom }
      owner: contract roles.input; vendor/parity.yaml textfield
    - id: DNA-COMMON-FIELD-ROW-CONTROL-LINE
      role: [input, select, copy-field]
      law: The fields of one form Grid row laid out in columns start their control boxes on one line, whatever label, description or error a neighbour carries.
      measure: { kind: uniform, scope: '[data-component="FormGrid"] [data-grammar-form-grid-row]', select: ':is([data-grammar-field-control="true"],[data-grammar-input-control="true"]):not(:is([data-grammar-field-control="true"],[data-grammar-input-control="true"]) *)', metric: top }
      owner: contract roles.input
    # --- copy field
    - id: DNA-COMMON-COPYFIELD-MASKED
      role: copy-field
      law: A masked CopyField never renders its clear value; it shows bullets and at most the last four characters, and opens no full-value tooltip.
      measure: { kind: text, select: '[data-component="CopyField"][data-grammar-copy-masked="true"] [data-grammar-copy-value]', metric: text, op: matches, value: '^•{8}.{0,4}$' }
      owner: contract roles.copy-field
    - id: DNA-COMMON-COPYFIELD-TAIL
      role: copy-field
      law: A CopyField value gives up its middle, never its end; the tail stays whole before the copy action.
      measure: { kind: relation, select: '[data-component="CopyField"] [data-grammar-copy-tail]', metric: right, op: "<=", ref: { within: '[data-component="CopyField"]', select: '[data-grammar-copy-action]', metric: left } }
      owner: contract roles.copy-field
    # --- chips and status dots
    - id: DNA-COMMON-CHIP-NOT-TARGET
      role: chip
      law: A Badge, with or without its dot, is a label, not focusable or pressable.
      measure: { kind: a11y, select: '[data-component="Badge"]', metric: focusable, op: "=", value: false }
      owner: contract roles.chip
    - id: DNA-COMMON-CHIP-LABEL-UPPERCASE
      role: chip
      law: A chip label's first letter renders uppercase.
      measure: { kind: text, select: ':is([data-component="Badge"],[data-grammar-tag])', metric: first-letter, op: "=", value: uppercase }
      owner: lint R322; contract roles.chip
    - id: DNA-COMMON-BADGE-DOT-CHIP-PARITY
      role: chip
      law: A Badge with its dot has the height of the HeroUI soft Chip of the same size.
      measure: { kind: style, select: '[data-component="Badge"][data-grammar-badge-dot="true"]', metric: [height], op: "=", value: { vendor: { component: Chip, props: { variant: soft, size: sm }, metric: [height] } } }
      owner: contract roles.chip
    - id: DNA-COMMON-BADGE-DOT-GAP
      role: chip
      law: A Badge's dot sits 4px before its text.
      measure: { kind: relation, select: '[data-grammar-badge-dot="true"] .starci-core-badge-dot-label', metric: left, op: "=", ref: { within: '[data-grammar-badge-dot="true"]', select: '[data-slot="status-dot-mark"]', metric: right, offset: 4px } }
      owner: contract roles.chip
    - id: DNA-COMMON-DOT-SIZE
      role: chip
      law: Every status dot, in every variant, is the one dot-size token square.
      measure: { kind: box, select: '[data-slot="status-dot-mark"]', metric: [width, height], op: "=", value: { token: --starci-core-status-dot-size } }
      owner: contract roles.chip
    - id: DNA-COMMON-DOT-NAMED
      role: chip
      law: A dot without text is named by its aria-label and shows that name in a tooltip on hover and focus.
      measure: { kind: interaction, select: '[data-component="StatusDot"]:is([data-variant="static"],[data-variant="echo"])', act: [focus], then: { select: 'document [role="tooltip"]', kind: text, metric: text, op: "=", value: { fixture: ariaLabel } } }
      owner: contract roles.chip
    - id: DNA-COMMON-ECHO-LIGHT-STOP
      role: chip
      law: The echo ring is painted in the tone's light stop.
      measure: { kind: style, select: '[data-slot="status-dot-mark"][data-echo="true"]', pseudo: "::after", metric: background-color, op: "=", value: { token: --starci-core-status-dot-light } }
      owner: contract roles.chip
    - id: DNA-COMMON-ECHO-REDUCED-MOTION
      role: chip
      law: Under reduced motion the echo ring is not drawn.
      measure: { kind: style, context: { reducedMotion: reduce }, select: '[data-slot="status-dot-mark"][data-echo="true"]', pseudo: "::after", metric: display, op: "=", value: none }
      owner: contract roles.chip
    - id: DNA-COMMON-TAG-REMOVE
      role: chip
      law: A removable tag carries one remove button of its own.
      measure: { kind: count, scope: '[data-component="TagGroup"][data-grammar-tag-removable="true"] [data-grammar-tag]', select: ':is(button,[role="button"])', op: "=", value: 1 }
      owner: vendor/parity.yaml tag
    - id: DNA-COMMON-TAG-REORDER-KEYS
      role: chip
      law: A reorderable tag moves with Alt and an arrow key, and the move is announced politely.
      measure: { kind: interaction, select: '[data-grammar-tag-reorderable="true"] [data-grammar-tag]', act: [focus, press Alt+ArrowRight], then: { select: 'document [aria-live="polite"]', kind: text, metric: text, op: set } }
      owner: contract roles.chip
    # --- overlays and menus
    - id: DNA-COMMON-DIALOG-NAMED
      role: dialog
      law: Every modal overlay has an accessible name from its heading and a close control.
      measure: { kind: a11y, select: 'document :is([role="dialog"],[role="alertdialog"])', metric: name, op: set }
      owner: vendor/parity.yaml modal
    - id: DNA-COMMON-DIALOG-ESCAPE
      role: dialog
      law: Escape closes a modal overlay and focus returns to its trigger.
      measure: { kind: interaction, select: '[aria-haspopup="dialog"]', act: [press, press Escape], then: { select: 'document :focus', kind: attr, metric: aria-haspopup, op: "=", value: dialog } }
      owner: vendor/parity.yaml modal; FOCUS-3
    - id: DNA-COMMON-DIALOG-FOCUS-TRAP
      role: dialog
      law: Tab never moves focus out of an open modal overlay.
      measure: { kind: interaction, select: 'document :is([role="dialog"],[role="alertdialog"])', act: [press Tab, press Tab, press Tab, press Tab, press Tab, press Tab], then: { kind: count, select: 'document :is([role="dialog"],[role="alertdialog"]) :focus', op: "=", value: 1 } }
      owner: vendor/parity.yaml modal; FOCUS-3
    - id: DNA-COMMON-ALERTDIALOG-DISMISS-FIRST
      role: dialog
      law: An alert dialog opens with focus on its dismiss button, which comes first; the confirm comes last.
      measure: { kind: interaction, select: 'document [role="alertdialog"]', act: [open], then: { select: '.starci-core-overlay-footer [data-component="Button"]:first-child', kind: a11y, metric: focused, op: "=", value: true } }
      owner: CTA-4
    - id: DNA-COMMON-MENU-SECTIONS
      role: menu
      law: Menu sections are separated by the vendor separator, one fewer than the sections.
      measure: { kind: count, scope: 'document [role="menu"]', select: '[role="separator"]', op: "=", value: { count: '[data-grammar-menu-section]', offset: -1 } }
      owner: vendor/parity.yaml dropdown
    - id: DNA-COMMON-MENU-DANGER
      role: menu
      law: A destructive menu item carries the danger tone.
      measure: { kind: source, check: "lint:starci-grammar/destructive-menu-entry-needs-danger-tone" }
      owner: CTA-4
    # --- alerts, empty states, avatars
    - id: DNA-COMMON-ALERT-TONE-PAIR-INFORMATIVE
      role: alert
      law: "An informative Alert is NEUTRAL, flat, unless the app writes --informative-soft and --informative-soft-foreground (the Grammar story theme writes none): the row is --default-soft, the text --default-soft-foreground, the glyph muted, no shadow and no border. It never wears the accent pair (it reads as an error and spends the red budget)."
      measure:
        kind: style
        select: '[data-component="Alert"][data-grammar-tone="informative"]:not([data-loading="true"])'
        checks: [{ metric: background-color, op: "=", value: { token: --default-soft } }, { metric: color, op: "=", value: { token: --default-soft-foreground } }, { metric: border-width, op: "=", value: 0px }, { metric: box-shadow, op: "=", value: none }]
      owner: contract roles.alert
    - id: DNA-COMMON-BADGE-TONE-INFO
      role: chip
      law: "A Badge of the app-declared tone info is filled with the info soft tint of the app's theme (the text colour is the family's: the soft foreground in Core, ink in Offset Pop)."
      measure: { kind: style, select: '[data-component="Badge"][data-tone="info"]:not([data-loading="true"])', metric: background-color, op: "=", value: { token: --info-soft } }
      owner: contract roles.alert
    - id: DNA-COMMON-ALERT-TONE-PAIR-SUCCESS
      role: alert
      law: A affirmative Alert is its tone's soft pair, flat - the row is --success-soft at full strength, the text and glyph --success-soft-foreground, no shadow and no border.
      measure:
        kind: style
        select: '[data-component="Alert"][data-grammar-tone="affirmative"]:not([data-loading="true"])'
        checks: [{ metric: background-color, op: "=", value: { token: --success-soft } }, { metric: color, op: "=", value: { token: --success-soft-foreground } }, { metric: border-width, op: "=", value: 0px }, { metric: box-shadow, op: "=", value: none }]
      owner: contract roles.alert
    - id: DNA-COMMON-ALERT-TONE-PAIR-WARNING
      role: alert
      law: A cautionary Alert is its tone's soft pair, flat - the row is --warning-soft at full strength, the text and glyph --warning-soft-foreground, no shadow and no border.
      measure:
        kind: style
        select: '[data-component="Alert"][data-grammar-tone="cautionary"]:not([data-loading="true"])'
        checks: [{ metric: background-color, op: "=", value: { token: --warning-soft } }, { metric: color, op: "=", value: { token: --warning-soft-foreground } }, { metric: border-width, op: "=", value: 0px }, { metric: box-shadow, op: "=", value: none }]
      owner: contract roles.alert
    - id: DNA-COMMON-ALERT-TONE-PAIR-DANGER
      role: alert
      law: A negative Alert is its tone's soft pair, flat - the row is --danger-soft at full strength, the text and glyph --danger-soft-foreground, no shadow and no border.
      measure:
        kind: style
        select: '[data-component="Alert"][data-grammar-tone="negative"]:not([data-loading="true"])'
        checks: [{ metric: background-color, op: "=", value: { token: --danger-soft } }, { metric: color, op: "=", value: { token: --danger-soft-foreground } }, { metric: border-width, op: "=", value: 0px }, { metric: box-shadow, op: "=", value: none }]
      owner: contract roles.alert
    - id: DNA-COMMON-ALERT-TONE-PAIR-DEFAULT
      role: alert
      law: A neutral Alert is its tone's soft pair, flat - the row is --default-soft at full strength, the text and glyph --default-soft-foreground, no shadow and no border.
      measure:
        kind: style
        select: '[data-component="Alert"][data-grammar-tone="neutral"]:not([data-loading="true"])'
        checks: [{ metric: background-color, op: "=", value: { token: --default-soft } }, { metric: color, op: "=", value: { token: --default-soft-foreground } }, { metric: border-width, op: "=", value: 0px }, { metric: box-shadow, op: "=", value: none }]
      owner: contract roles.alert
    - id: DNA-COMMON-TOAST-TONE-INFORMATIVE
      role: alert
      law: "An informative Toast is neutral, as an informative Alert is: its mark is --muted (unless the app writes --informative), never the accent."
      measure: { kind: style, select: '[data-component="Toast"][data-grammar-tone="informative"] .starci-core-toast-indicator:not([data-grammar-toast-indicator])', metric: color, op: "=", value: { token: --muted } }
      owner: contract roles.alert
    - id: DNA-COMMON-ALERTDIALOG-TONE-INFORMATIVE
      role: dialog
      law: "An informative alert dialog is neutral: its icon tile is --default-soft with --default-soft-foreground (unless the app writes --informative-soft), never the accent pair."
      measure: { kind: style, select: '.starci-core-alert-dialog[data-grammar-tone="informative"] .starci-core-alert-dialog-icon', checks: [{ metric: background-color, op: "=", value: { token: --default-soft } }, { metric: color, op: "=", value: { token: --default-soft-foreground } }] }
      owner: contract roles.dialog
    - id: DNA-COMMON-EMPTY-ONE-ACTION
      role: empty-state
      law: An empty notice holds at most one action.
      measure: { kind: count, scope: '[data-component="EmptyNotice"]', select: ':is([data-component="Button"],[data-component="TextAction"])', op: "<=", value: 1 }
      owner: contract roles.empty-state
    - id: DNA-COMMON-PANE-HEADER-TOUCH-HEIGHT
      role: pane-grid
      law: A pane header is at least as tall as a touch target (2.75rem, 44px), so the heads of one grid row share a height with or without a command.
      measure: { kind: box, select: '[data-component="PaneHeader"]', metric: height, op: ">=", value: 44px }
      owner: contract roles.pane-grid
    - id: DNA-COMMON-PANE-DRAWER-SPACING
      role: pane-grid
      law: A pane opened as a drawer keeps the spacing of the same pane in the wide aside (the drawer is portalled into the Grammar root, never the body), so its stack gap, section gaps and content inset are the pane's tokens.
      measure:
        kind: style
        select: '.starci-core-pane-drawer-scroll .starci-core-pane-stack'
        checks: [{ metric: row-gap, op: "=", value: { token: --grammar-row-gap } }]
      owner: contract roles.pane-grid
    - id: DNA-COMMON-PANE-DRAWER-SECTION-GAP
      role: pane-grid
      law: Inside a drawer pane a section with the section gap stands that far between its blocks, and is inset by the pane inset, as in the wide aside.
      measure:
        kind: style
        select: '.starci-core-pane-drawer-scroll .starci-core-pane-section[data-grammar-pane-section-gap="section"]'
        checks: [{ metric: row-gap, op: "=", value: { token: --grammar-section-gap } }, { metric: padding-inline-start, op: "=", value: { token: --grammar-pane-inset-inline } }]
      owner: contract roles.pane-grid
    - id: DNA-COMMON-PAGE-FILL-GROWS
      role: page
      law: "A bleed Page that holds a flow workspace shell grows with it: the fill is a floor (a viewport at least), never a fixed height, so the canvas painted by the Grammar root reaches the end of a long page (U2-G8)."
      measure: { kind: relation, select: '[data-grammar-workspace-viewport="flow"]', metric: bottom, op: "<=", ref: { within: '[data-grammar-page-body]', select: self, metric: bottom } }
      owner: contract roles.page
    - id: DNA-COMMON-CHOICE-RING
      role: input
      law: "An unselected radio draws a ring of its own (the muted foreground), so it stays visible when the app sets the field border and shadow to transparent (U2-G6)."
      measure: { kind: style, select: '.starci-core-radio:not([data-selected]) [data-grammar-choice-control="radio"]', metric: box-shadow, op: "!=", value: none }
      owner: contract roles.input
    - id: DNA-COMMON-LIST-ROW-DIFF
      role: list
      law: "A diff row (ListRowData.diff, 0.37.28, owner drawing 'So sánh phiên bản') has a monospace gutter mark at its start, + added, − removed, ~ changed, in its tone's ink, read with its label (diffLabel) before the title, never colour alone; its ground is the tone's soft pair (added success, removed danger, changed warning); a removed title is struck through; a changed row's 'from → to' is the 12 muted line; the row padding holds (ROW-EDGE-PADDING)."
      measure: { kind: style, select: '[data-component="ListRow"][data-grammar-diff="added"]', metric: background-color, op: "=", value: { token: --success-soft } }
      owner: ui/components/list-table.md
    - id: DNA-COMMON-ROW-ACTION-END
      role: list
      law: "A row with actionPlacement end keeps its commands on the line of its copy, at the end of the row, at any width (G7-7)."
      measure: { kind: relation, select: '[data-grammar-action-placement="end"] > .starci-core-list-row-actions', metric: top, op: "<=", ref: { within: '[data-component="ListRow"]', select: '.starci-core-list-row-copy', metric: bottom } }
      owner: contract roles.list
    - id: DNA-COMMON-DISCLOSURE-CHEVRON-START
      role: list
      law: "A disclosure with chevron start draws its chevron before its title (G7-8)."
      measure: { kind: relation, select: '[data-grammar-disclosure-chevron="start"] .starci-core-disclosure-indicator', metric: right, op: "<=", ref: { within: '.starci-core-disclosure-trigger', select: '.starci-core-disclosure-title', metric: left } }
      owner: contract roles.list
    - id: DNA-COMMON-FIGURES-PANE-ROW
      role: list
      law: "Figures in a pane stand in one bordered row while the strip is 20rem wide or more: every cell starts on the line of the first (G9c-1)."
      measure: { kind: relation, select: '[data-grammar-figures-placement="pane"] .starci-core-description-pair:last-child', metric: top, op: "<=", ref: { within: '[data-grammar-figures-placement="pane"]', select: '.starci-core-description-pair:first-child', metric: bottom } }
      owner: contract roles.list
    - id: DNA-COMMON-DESCRIPTION-DRAWER-COLUMNS
      role: list
      law: "A description list in the columns layout draws each term beside its value once the list is 16rem wide, a phone-wide drawer included: it answers its own width, not the viewport."
      measure: { kind: relation, select: '[data-grammar-description-layout="columns"] .starci-core-description-value', metric: left, op: ">=", ref: { within: '.starci-core-description-pair', select: '.starci-core-description-term', metric: right } }
      owner: contract roles.list
    - id: DNA-COMMON-STEPPER-BAR
      role: list
      law: "The current segment of a bar stepper is filled with the accent and every segment is a thin bar (four pixels)."
      measure: { kind: style, select: '[data-grammar-stepper-kind="bar"] [data-grammar-step-state="current"] [data-grammar-step-bar]', checks: [{ metric: background-color, op: "=", value: { token: --accent } }, { metric: height, op: "=", value: 4px }] }
      owner: contract roles.list
    - id: DNA-COMMON-ALERT-TONE-PAIR-ACCENT
      role: alert
      law: "An accent Alert is the accent soft pair, flat: the row is --accent-soft, the text and glyph --accent-soft-foreground, no shadow and no border (G10b-2)."
      measure:
        kind: style
        select: '[data-component="Alert"][data-grammar-tone="accent"]:not([data-loading="true"])'
        checks: [{ metric: background-color, op: "=", value: { token: --accent-soft } }, { metric: color, op: "=", value: { token: --accent-soft-foreground } }, { metric: border-width, op: "=", value: 0px }, { metric: box-shadow, op: "=", value: none }]
      owner: contract roles.alert
    - id: DNA-COMMON-PANE-SCROLL-ALIGN
      role: pane-grid
      law: "The content of a scroll band with an align is at least as tall as the band, so it can stand at the foot or in the middle of the free space (G10b-1); the band keeps its own 12px block inset around it, hence the tolerance."
      measure: { kind: relation, select: '[data-grammar-pane-section-scroll-align] > .starci-core-pane-section-content', metric: height, op: ">=", tolerance: 24.5, ref: { within: '[data-grammar-pane-section-scroll-align]', select: self, metric: height } }
      owner: contract roles.pane-grid
    - id: DNA-COMMON-PANE-SCROLL-ALIGN-END
      role: pane-grid
      law: "With align end the content ends where the band ends: the last message stands beside the composer (G10b-1)."
      measure: { kind: relation, select: '[data-grammar-pane-section-scroll-align="end"] > .starci-core-pane-section-content', metric: bottom, op: ">=", tolerance: 12.5, ref: { within: '[data-grammar-pane-section-scroll-align="end"]', select: self, metric: bottom } }
      owner: contract roles.pane-grid
    - id: DNA-COMMON-TABS-FILTER-LOADING-COUNTS
      role: tabs
      law: "In a loading region the filter tabs keep their labels as real text and every count is the geometry of its ready box (an unseen placeholder), never a live number."
      measure: { kind: count, select: 'document [data-grammar-region-inert] [data-grammar-tabs-kind="filter"] [data-grammar-tab-count]:not(:has(.starci-core-skeleton-placeholder))', op: "=", value: 0 }
      owner: contract roles.tabs
    - id: DNA-COMMON-CHOICE-CHIPS-FILL
      role: segmented-control
      law: "ChoiceChips with width fill share the row: the last chip of every row ends where the row ends."
      measure: { kind: relation, select: '[data-grammar-width="fill"] .starci-core-choice-chip:last-child', metric: right, op: ">=", tolerance: 1, ref: { within: '.starci-core-choice-chips-row', select: self, metric: right } }
      owner: contract roles.segmented-control
    - id: DNA-COMMON-CLUSTER-GROUP-NAMED
      role: cluster
      law: "A Cluster given a label is a group with an accessible name: separate controls stay separate and the set is named."
      measure: { kind: a11y, select: '[data-component="Cluster"][role="group"]', metric: name, op: set }
      owner: contract roles.cluster
    - id: DNA-COMMON-STEPPER-BAR-NO-CONNECTOR
      role: list
      law: "A bar stepper draws no connector line between its segments: the marker form's connector never reaches a segment (G5-F1)."
      measure: { kind: style, select: '[data-grammar-stepper-kind="bar"] .starci-core-step', pseudo: "::after", metric: content, op: "=", value: none }
      owner: contract roles.list
    - id: DNA-COMMON-DISCLOSURE-CHEVRON-TITLE-NEXT
      role: list
      law: "With the chevron first, the title starts next to it (within one gap), left-aligned, never pushed to the row end."
      measure: { kind: relation, select: '[data-grammar-disclosure-chevron="start"] .starci-core-disclosure-title', metric: left, op: "<=", tolerance: 16, ref: { within: '.starci-core-disclosure-trigger', select: '.starci-core-disclosure-indicator', metric: right } }
      owner: contract roles.list
    - id: DNA-COMMON-TABLE-NO-CLIP
      role: list
      law: "A table of four columns or fewer fits its pane: its content never reaches past the box that holds it, so no column is clipped."
      measure: { kind: relation, select: '[data-component="DataTable"][data-grammar-table-fit="true"] .starci-core-data-table-content', metric: right, op: "<=", tolerance: 1, ref: { within: '.starci-core-data-table-scroll', select: self, metric: right } }
      owner: contract roles.list
    - id: DNA-COMMON-FIELD-SM
      role: [input, select]
      law: "A single-line field with size sm is 32px tall, whatever its label or state: a picker in a list head or a toolbar."
      measure: { kind: box, select: '[data-grammar-field-size="sm"] :is(.starci-core-input-field,.starci-core-select-trigger,.starci-core-combo-box-group,.starci-core-search-field-group,.starci-core-number-field-group)', metric: height, op: "=", value: 32px }
      owner: contract roles.select
    - id: DNA-COMMON-ROW-TEXT-FIRST
      role: list
      law: "In a narrow pane a row with two or more commands keeps the text column the row width: the commands stand under the copy, never beside it (G7-11)."
      measure: { kind: relation, select: '[data-story-narrow-rows] [data-grammar-action-placement="end"][data-grammar-actions-multi="true"] > .starci-core-list-row-actions', metric: top, op: ">=", tolerance: 1, ref: { within: '[data-component="ListRow"]', select: '.starci-core-list-row-copy', metric: bottom } }
      owner: contract roles.list
    - id: DNA-COMMON-SELECT-NO-VENDOR-ENGLISH
      role: select
      law: "A Select never shows the vendor's English placeholder \"Select an item\": it shows the app's words or none."
      measure: { kind: text, select: '[data-component="Select"] [data-slot="select-value"]', metric: text, op: matches, value: '^(?!.*Select an item)' }
      owner: contract roles.select
    - id: DNA-COMMON-LINK-MEDIA-KEEPS-BOX
      role: link
      law: "A media link keeps the width and the height it is given (a 113 by 40 logo stays 113 by 40), never the width of its container."
      measure: { kind: box, select: '[data-component="Link"][data-grammar-link-media-size="both"]', metric: [width, height], op: "=", value: [113px, 40px] }
      owner: contract roles.link
    - id: DNA-COMMON-LINK-ACCENT-TEXT
      role: link
      law: "A text link is the exact primary brand colour (--accent), underlined. The raw accent may fall below 4.5 contrast as text on an app's grounds, so this law pins the token and no contrast law judges a link."
      measure: { kind: style, select: '[data-component="Link"][data-grammar-link-content="text"]:not([data-grammar-current="true"]):not([aria-disabled="true"])', checks: [{ metric: color, op: "=", value: { token: --accent } }] }
      owner: contract roles.link
    - id: DNA-COMMON-EMPTY-NOTICE-TOP
      role: empty-state
      law: "An empty or no-selection notice in a growing pane section stands at the top of it (its own inset below the section edge), never centred in the free space; the text stays centred across, as the artboards draw it."
      measure: { kind: relation, select: '[data-story-empty-top] .starci-core-empty-notice', metric: top, op: "<=", tolerance: 40, ref: { within: '[data-component="PaneSection"]', select: self, metric: top } }
      owner: contract roles.empty-state
    - id: DNA-COMMON-STEPPER-MARKER-FILLS
      role: list
      law: "In the markers form the current step is a filled accent circle under the accent foreground, and an upcoming step a filled secondary-surface circle with no ring (U0-G9)."
      measure: { kind: style, select: '[data-component="Stepper"]:not([data-grammar-stepper-kind="bar"]):not([data-loading="true"]) [data-grammar-step-state="current"] [data-grammar-step-marker]', checks: [{ metric: background-color, op: "=", value: { token: --accent } }, { metric: color, op: "=", value: { token: --accent-foreground } }] }
      owner: contract roles.list
    - id: DNA-COMMON-STEPPER-MARKER-UPCOMING
      role: list
      law: "An upcoming step of the markers form is a filled secondary-surface circle with no ring (U0-G9)."
      measure: { kind: style, select: '[data-component="Stepper"]:not([data-grammar-stepper-kind="bar"]):not([data-loading="true"]) [data-grammar-step-state="upcoming"] [data-grammar-step-marker]', checks: [{ metric: background-color, op: "=", value: { token: --surface-secondary } }, { metric: border-color, op: "=", value: transparent }] }
      owner: contract roles.list
    - id: DNA-COMMON-HEADING-TITLE-SCALE
      role: section
      law: "The title scale of a Heading and of a PageHeader is 24px (the 3xl step), between the standard headings and display (U0-G10)."
      measure: { kind: style, select: ':is([data-component="Heading"][data-scale="title"], .starci-core-page-header-title[data-grammar-title-scale="title"])', checks: [{ metric: font-size, op: "=", value: 24px }] }
      owner: contract roles.section
    - id: DNA-COMMON-TABS-COUNT-CHIP
      role: tabs
      law: "A tab's count is a chip (a pill with its own ground): neutral by default, the accent soft pair on the selected tab, the warning soft pair when the tab is marked isAttention."
      measure: { kind: style, select: '[role="tab"][aria-selected="true"] [data-grammar-tab-count]:not([data-grammar-attention="true"])', checks: [{ metric: background-color, op: "=", value: { token: --accent-soft } }, { metric: color, op: "=", value: { token: --accent-soft-foreground } }] }
      owner: contract roles.tabs
    - id: DNA-COMMON-TABS-COUNT-CHIP-ATTENTION
      role: tabs
      law: "The count chip of a tab marked isAttention is the warning soft pair, selected or not."
      measure: { kind: style, select: '[data-grammar-tab-count][data-grammar-attention="true"]', checks: [{ metric: background-color, op: "=", value: { token: --warning-soft } }, { metric: color, op: "=", value: { token: --warning-soft-foreground } }] }
      owner: contract roles.tabs
    - id: DNA-COMMON-TONE-CUSTOM-COMPLETE
      role: chip
      law: "An app-declared tone has all four tokens: on every element stamped data-grammar-tone-custom the four component variables (--grammar-tone, -foreground, -soft, -soft-foreground) resolve to a colour, so a theme that declares a tone without one of its tokens is caught here (and throws in development)."
      measure: { kind: style, select: '[data-grammar-tone-custom="true"]', checks: [{ metric: --grammar-tone, op: set }, { metric: --grammar-tone-foreground, op: set }, { metric: --grammar-tone-soft, op: set }, { metric: --grammar-tone-soft-foreground, op: set }] }
      owner: contract roles.chip
    - id: DNA-COMMON-TILE-BYLINE
      role: card
      law: "A tile's byline stands under its name, never beside or above it."
      measure: { kind: relation, select: '[data-grammar-tile-byline]', metric: top, op: ">=", tolerance: 1, ref: { within: '[data-grammar-tile="true"]', select: '.starci-core-label', metric: bottom } }
      owner: contract roles.card
    - id: DNA-COMMON-TILE-FIGURE-START
      role: card
      law: "A tile figure is plain bold text (a price, never a chip): weight 600 or more."
      measure: { kind: style, select: '[data-grammar-tile-figure-value]:not([data-loading="true"])', checks: [{ metric: font-weight, op: ">=", value: 600 }] }
      owner: contract roles.card
    - id: DNA-COMMON-TILE-FIGURE-BEFORE-ACTION
      role: card
      law: "The figure ends before the action of its row begins: one line, value then command."
      measure: { kind: relation, select: '[data-grammar-tile-figure-value]', metric: right, op: "<=", tolerance: 1, ref: { within: '.starci-core-tile-foot', select: '.starci-core-tile-actions', metric: left } }
      owner: contract roles.card
    - id: DNA-COMMON-PANE-SECTION-RULE
      role: pane-grid
      law: "A pane section with rule start draws a 1px separator on its block-start edge and none elsewhere (R4-27)."
      measure: { kind: style, select: '[data-grammar-pane-section-rule="start"]', checks: [{ metric: border-top-width, op: "=", value: 1px }, { metric: border-bottom-width, op: "=", value: 0px }, { metric: border-top-color, op: "=", value: { token: --separator } }] }
      owner: contract roles.pane-grid
    - id: DNA-COMMON-BUBBLE-TEXT-INSIDE-START
      role: diagram
      law: "The name and the count inside a bubble start inside the disc: neither the left nor the top edge of the text block passes the disc's (R4-22, never cut)."
      measure: { kind: relation, select: '.starci-core-flow-graph-text', metric: [left, top], op: ">=", tolerance: 1, ref: { within: '.starci-core-flow-graph-disc', select: self, metric: [left, top] } }
      owner: contract roles.diagram
    - id: DNA-COMMON-BUBBLE-TEXT-INSIDE-END
      role: diagram
      law: "The name and the count inside a bubble end inside the disc: neither the right nor the bottom edge of the text block passes the disc's, so the text is never clipped by it."
      measure: { kind: relation, select: '.starci-core-flow-graph-text', metric: [right, bottom], op: "<=", tolerance: 1, ref: { within: '.starci-core-flow-graph-disc', select: self, metric: [right, bottom] } }
      owner: contract roles.diagram
    - id: DNA-COMMON-CHOICE-CHIPS-WRAP
      role: segmented-control
      law: The chips of one group have one height, so a wrapped row and a short row read as one set.
      measure: { kind: uniform, scope: '[data-component="ChoiceChips"]', select: '.starci-core-choice-chip', metric: [height], op: "=" }
      owner: contract roles.segmented-control
    - id: DNA-COMMON-BOARD-ONE-WIDTH
      role: data-views
      law: The columns of one board share one width.
      measure: { kind: uniform, scope: '[data-component="Board"]', select: '.starci-core-board-column', metric: [width], op: "=" }
      owner: contract roles.data-views
    - id: DNA-COMMON-SCHEDULE-HEADINGS
      role: data-views
      law: A schedule that has drawn its grid names its columns, with a column heading for each.
      measure: { kind: count, scope: '[data-component="ScheduleGrid"]:not([data-grammar-schedule-state="error"])', select: 'th[scope="col"]', op: ">=", value: 1 }
      owner: contract roles.data-views
    - id: DNA-COMMON-BAR-CHART-ONE-SCALE
      role: data-views
      law: The bars of one chart stand on plots of one height, so their heights compare.
      measure: { kind: uniform, scope: '[data-component="BarChart"]', select: '.starci-core-bar-chart-plot', metric: [height], op: "=" }
      owner: contract roles.data-views
    - id: DNA-COMMON-AVATAR-GROUP-ONE-SIZE
      role: avatar
      law: Every member of an avatar group has one size.
      measure: { kind: uniform, scope: '[data-component="AvatarGroup"]', select: '[data-component="Avatar"]', metric: [width, height], op: "=" }
      owner: FE-CSS-1
    - id: DNA-COMMON-AVATAR-INITIALS
      role: avatar
      law: An avatar without an image draws the initials of the first and last words of its name.
      measure: { kind: text, select: '[data-component="Avatar"]:not(:has(img[src]))', metric: text, op: "=", value: { fixture: initials } }
      owner: ui/components/identity-mark.md
    - id: DNA-COMMON-AGENT-NAMED
      role: avatar
      law: An agent avatar carries the bot badge and an accessible name that says it is an agent.
      measure: { kind: a11y, select: '.starci-core-avatar-agent-anchor [data-component="Avatar"]', metric: name, op: "=", value: { fixture: agentAccessibleName } }
      owner: ui/components/identity-mark.md

    # --- page header
    - id: DNA-COMMON-PAGE-HEADER-BAND
      role: page
      law: The page header is a band painted with the surface over the page background.
      measure: { kind: style, select: '[data-component="PageHeader"]', metric: background-color, op: "=", value: { token: --surface } }
      owner: ui/components/page-header.md
    - id: DNA-COMMON-PAGE-HEADER-INSET
      role: page
      law: The band's content is inset by the page inset inline and the region step at the top, so its edges are the page content's edges.
      measure:
        kind: style
        select: '[data-component="PageHeader"] > [data-component="PageContainer"]'
        checks: [{ metric: padding-inline-start, op: "=", value: { token: --grammar-page-inset } }, { metric: padding-inline-end, op: "=", value: { token: --grammar-page-inset } }, { metric: padding-block-start, op: "=", value: { token: --grammar-region-gap } }]
      owner: ui/components/page-header.md
    - id: DNA-COMMON-PAGE-HEADER-ONE-H1
      role: page
      law: The page header holds exactly one heading, the page's h1.
      measure: { kind: count, scope: '[data-component="PageHeader"]', select: ':is(h1, h2, h3, h4, h5, h6)', op: "=", value: 1 }
      owner: ui/components/page-header.md; ui/presentation.md FONT-4
    - id: DNA-COMMON-PAGE-HEADER-SEPARATOR
      role: page
      law: The band ends in its own bottom border, which runs the band's full width at its bottom edge, with or without tabs; no Divider is drawn beside it.
      measure: { kind: count, scope: '[data-component="PageHeader"]', select: '[data-component="Divider"]', op: "=", value: 0 }
      owner: ui/components/page-header.md
    - id: DNA-COMMON-PAGE-HEADER-TABS-ON-SEPARATOR
      role: page
      law: Page tabs in the header stand on its bottom border, which is the one line under them; the selected tab's underline lies over it, its bottom edge on the band's bottom edge.
      measure: { kind: relation, select: '[data-component="PageHeader"] [role="tab"][aria-selected="true"] .tabs__indicator', metric: bottom, op: "=", ref: { within: '[data-component="PageHeader"]', select: self, metric: bottom } }
      owner: ui/components/page-header.md; tabs.choose.level:page

    # --- page
    - id: DNA-COMMON-PAGE-HEADER-FIRST
      role: page
      law: A page's header band is its first child, full width, with no gap above it.
      measure: { kind: relation, select: '[data-component="Page"] > [data-component="PageHeader"]', metric: [left, right, top], op: "=", ref: { within: '[data-component="Page"]', select: self, metric: [left, right, top] } }
      owner: ui/components/page-header.md
    - id: DNA-COMMON-PAGE-BODY-EDGES
      role: page
      law: A standard page body is inset by the page inset inline, so its content edges are the header content's edges.
      measure:
        kind: style
        select: '[data-component="Page"][data-grammar-page-chrome="standard"] > [data-grammar-page-body]'
        checks: [{ metric: padding-inline-start, op: "=", value: { token: --grammar-page-inset } }, { metric: padding-inline-end, op: "=", value: { token: --grammar-page-inset } }]
      owner: ui/components/page-header.md
    - id: DNA-COMMON-PAGE-BODY-GAP
      role: page
      law: The page owns its rhythm, the region step between the band and the body and between the body's sections.
      measure:
        kind: style
        select: ':is([data-component="Page"], [data-component="Page"] > [data-grammar-page-body])'
        metric: row-gap
        op: "="
        value: { token: --grammar-region-gap }
      owner: ui/components/page-header.md
    - id: DNA-COMMON-PAGE-BODY-CLIP
      role: page
      law: Nothing in a standard page body reaches across the gutter; the body clips past its content box.
      measure:
        kind: style
        select: '[data-component="Page"][data-grammar-page-chrome="standard"] > [data-grammar-page-body]'
        checks: [{ metric: overflow-x, op: "=", value: clip }, { metric: overflow-clip-margin, op: matches, value: content-box }]
      owner: ui/components/page-header.md
    - id: DNA-COMMON-PAGE-BLEED-BODY
      role: page
      law: A bleed page is an app surface; it keeps no block padding, and its body no inline gutter and no clip, so the body is the measured fill box and what it holds fills the region.
      measure:
        kind: style
        select: '[data-component="Page"][data-grammar-page-chrome="bleed"] > [data-grammar-page-body]'
        checks: [{ metric: padding-inline-start, op: "=", value: 0px }, { metric: padding-inline-end, op: "=", value: 0px }, { metric: overflow-x, op: "=", value: visible }]
      owner: ui/components/page-header.md
    - id: DNA-COMMON-PAGE-PANES-FLUSH
      role: page
      law: A panes page attaches its pane grid flush under the header band; the page keeps no row gap and no block padding, and its body no gap.
      measure:
        kind: style
        select: '[data-component="Page"][data-grammar-page-chrome="panes"]'
        checks: [{ metric: row-gap, op: "=", value: 0px }, { metric: padding-block-start, op: "=", value: 0px }, { metric: padding-block-end, op: "=", value: 0px }]
      owner: ui/components/page-header.md

    # --- diagram
    - id: DNA-COMMON-DIAGRAM-LOADING-BOX
      role: diagram
      law: A diagram reserves its canvas height in every state, so the loading skeleton and the error take the ready drawing's least box.
      measure:
        kind: box
        metric: height
        op: ">="
        cases:
          - { select: '[data-component="MermaidDiagram"][data-grammar-mermaid-height="sm"] > :first-child', value: 256px }
          - { select: '[data-component="MermaidDiagram"][data-grammar-mermaid-height="md"] > :first-child', value: 384px }
          - { select: '[data-component="MermaidDiagram"][data-grammar-mermaid-height="lg"] > :first-child', value: 512px }
      owner: ui/components/diagram.md
    - id: DNA-COMMON-DIAGRAM-NAMED
      role: diagram
      law: A drawn diagram is one image named by its label.
      measure: { kind: a11y, select: '[data-grammar-mermaid-state="ready"] [data-grammar-mermaid-canvas] > [role="img"]', metric: name, op: set }
      owner: ui/components/diagram.md
    - id: DNA-COMMON-DIAGRAM-ERROR-SOURCE
      role: diagram
      law: A source the renderer refuses stays in the diagram's region as code under the error.
      measure: { kind: count, scope: '[data-grammar-mermaid-state="error"]', select: '[data-component="FencedCodeBlock"] code', op: "=", value: 1 }
      owner: ui/components/diagram.md
    - id: DNA-COMMON-FLOW-EDGE-LABEL-SPOKEN
      role: diagram
      law: Every labelled FlowGraph edge is repeated in the graph's screen-reader edge list.
      measure: { kind: count, scope: '[data-component="FlowGraph"]', select: '[data-grammar-flow-edge-fallback] li', op: "=", value: { count: ':is(.react-flow__edge-text, [data-grammar-flow-edge-label])', offset: 0 } }
      owner: ui/components/diagram.md
    - id: DNA-COMMON-FLOW-LANE-LABEL-ABOVE-LINES
      role: diagram
      law: A lanes branch label is drawn in the edge label layer, above every edge line, never inside an edge's own drawing, where a line drawn after it crosses its words.
      measure: { kind: count, select: '[data-component="FlowGraph"][data-grammar-flow-layout="lanes"] :is(.react-flow__edge-text, [data-grammar-flow-edge-label]:not(.react-flow__edgelabel-renderer *))', op: "=", value: 0 }
      owner: ui/components/diagram.md workflow
    - id: DNA-COMMON-FLOW-LANE-LABEL-OPAQUE
      role: diagram
      law: A lanes branch label is an opaque chip on the canvas background, so the line it sits on stops at its words.
      measure: { kind: style, select: '[data-component="FlowGraph"][data-grammar-flow-layout="lanes"] [data-grammar-flow-edge-label]', metric: background-color, op: "=", value: { token: --surface } }
      owner: ui/components/diagram.md workflow
  core:
    - id: DNA-CORE-PAGE-HEADER-HAIRLINE
      role: page
      law: The page header's bottom border is a 1px hairline in the separator token.
      measure:
        kind: style
        select: '[data-component="PageHeader"]'
        checks: [{ metric: border-bottom-width, op: "=", value: 1px }, { metric: border-bottom-color, op: "=", value: { token: --separator } }]
      owner: ui/components/page-header.md
    - id: DNA-COMMON-LIST-ON-WHITE-BORDERED
      role: card
      law: "A list (`Section kind=list`, `SurfaceCard kind=list`) on a white surface (a `Pane surface` aside, a drawer, a dialog, a popover) is a bordered rounded frame: a 1px separator border, the card radius and no shadow, rows divided full width inside it; it is never flat (SURFACE-ELEVATION, owner 2026-11-10, reverting the 0.37.14 flat aside list)."
      measure:
        kind: style
        select: '.starci-core-pane[data-grammar-pane-surface="true"] .starci-core-section-list'
        checks: [{ metric: border-width, op: "=", value: 1px }, { metric: border-color, op: "=", value: { token: --separator } }, { metric: box-shadow, op: "=", value: none }]
      owner: ui/components/card.md
    - id: DNA-COMMON-ROW-EDGE-PADDING
      role: card
      law: "A side of a row that touches the card's edge is p-4 (--grammar-card-padding-block, 16): the first row's top (no header zone above it) and the last row's bottom (no footer zone below it), a single-row card both. A side that touches a separator (between rows, under a zone divider) is p-3 (--grammar-row-gap, 12). Controls included: a row grows around a tall control; no row slot has a fixed block-size (ROW-EDGE-PADDING, owner 2026-11-10)."
      measure:
        kind: style
        select: '[data-grammar-surface-content]:not([data-grammar-surface-headed]) .starci-core-owned-collection > .starci-core-static-row:first-child'
        checks: [{ metric: padding-block-start, op: "=", value: { token: --grammar-card-padding-block } }, { metric: padding-block-end, op: "=", value: { token: --grammar-row-gap } }]
      owner: ui/components/card.md
    - id: DNA-CORE-EDGE-TOP
      role: card
      law: A card on the page ground is the white surface at the card radius with a 1px separator border and the card shadow; a surface nested in a card keeps the border and drops the shadow.
      measure:
        kind: style
        select: '[data-grammar-surface-card] > [data-grammar-frame="bounded"]'
        target: painted-box
        checks: [{ metric: box-shadow, op: "!=", value: none }, { metric: border-width, op: "=", value: 1px }, { metric: border-color, op: "=", value: { token: --separator } }]
      owner: ui/components/card.md
    - id: DNA-CORE-CARD-LABEL-OUTSIDE
      role: card
      law: A card that heads a section carries its label as an unpainted row above the card, outside the material; a tile carries its name inside, beside its mark. Measured on labelled cards; the tile case is measured once the grammar exposes the kind.
      measure:
        kind: style
        op: "="
        cases:
          - { select: '[data-component="SurfaceCard"][data-grammar-surface-labelled="true"]', metric: background-color, value: "rgba(0, 0, 0, 0)" }
          - { select: '[data-component="SurfaceCard"][data-grammar-surface-labelled="true"] > [data-grammar-frame="bounded"]', metric: background-color, value: { token: --surface } }
      owner: grammars/core.md
      followUp: G-20
    - id: DNA-CORE-BUTTON-PILL
      role: button
      law: Every button and its skeleton is a pill, its corner at least half its height; the members of a ButtonGroup keep their square inner corners (DNA-COMMON-BUTTONGROUP-INNER-CORNERS).
      measure: { kind: style, select: ':is([data-component="Button"],[data-component="IconButton"]):not([data-slot="button-group"] *)', metric: radius, op: ">=", value: { self: height, times: 0.5 } }
      owner: grammars/core.md
    - id: DNA-CORE-BUTTON-ALTERNATIVE-OUTLINE
      role: button
      law: "In Core an alternative button is outlined (a hairline border, no tinted fill) and writes its words in the default foreground, as the design system draws its secondary command; never the brand-coloured words of the vendor secondary variant. Core only: Offset Pop keeps its own look."
      measure: { kind: style, select: '[data-component="Button"][data-grammar-intent="alternative"]:not([data-loading="true"])', checks: [{ metric: border-width, op: ">=", value: 1px }, { metric: color, op: "=", value: { token: --default-foreground } }] }
      owner: contract roles.button
    - id: DNA-CORE-ACCENT-TEXT
      role: root
      law: Where the accent is text (a link, the current tab label) it reads the text-safe accent, never the fill accent.
      measure: { kind: style, select: '[data-component="Link"]', metric: color, op: "=", value: { token: --link } }
      owner: grammars/core.md
    - id: DNA-CORE-PARITY-STRICT
      role: root
      law: core changes HeroUI through tokens only; every other deviation is a declared override in vendor/wrappers.yaml.
      measure: { kind: source, check: "parity:strict" }
      owner: vendor/parity.yaml; vendor/wrappers.yaml

  offset-pop:
    - id: DNA-OFFSET-POP-PAGE-HEADER-INK-RULE
      role: page
      law: The page header closes on the ink rule at the outline width, the rule under the TopBar.
      measure:
        kind: style
        select: '[data-component="PageHeader"]'
        checks: [{ metric: border-bottom-width, op: "=", value: { token: --offset-pop-outline-width } }, { metric: border-bottom-color, op: "=", value: { token: --foreground } }]
      owner: ui/components/page-header.md; grammars/offset-pop.md
    - id: DNA-OFFSET-POP-STICKER
      role: card
      law: A card wears the ink outline and an unblurred offset shadow down and to the right.
      measure:
        kind: style
        select: '[data-grammar-surface-card] > [data-grammar-frame="bounded"]'
        target: painted-box
        checks: [{ metric: border-width, op: "=", value: { token: --offset-pop-outline-width } }, { metric: shadow-blur, op: "=", value: 0px }, { metric: shadow-offset, op: ">", value: 0px }]
      owner: O-1
    - id: DNA-OFFSET-POP-CARD-LABEL-OUTSIDE
      role: card
      law: A card that heads a section carries its label on the page above the sticker, outside the painted box; a tile carries its name inside.
      measure: { kind: relation, select: '[data-component="SurfaceCard"] > [data-grammar-surface-label]', metric: bottom, op: "<=", ref: { within: '[data-component="SurfaceCard"]', select: '[data-slot="card-content"]', metric: top } }
      owner: grammars/offset-pop.md
      followUp: G-20
    - id: DNA-OFFSET-POP-BUTTON-STICKER
      role: button
      law: Every button wears the ink outline and an unblurred offset shadow.
      measure:
        kind: style
        select: '[data-component="Button"]'
        checks: [{ metric: border-width, op: "=", value: { token: --offset-pop-outline-width } }, { metric: shadow-blur, op: "=", value: 0px }, { metric: shadow-offset, op: ">", value: 0px }]
      owner: grammars/offset-pop.md
    - id: DNA-OFFSET-POP-HARD-SHADOWS
      role: root
      law: No shadow inside the grammar is blurred.
      measure: { kind: count, select: '*', where: { metric: shadow-blur, op: ">", value: 0px }, op: "=", value: 0 }
      owner: grammars/offset-pop.md (What an app must not add)
    - id: DNA-OFFSET-POP-PINK-NEVER-TEXT
      role: root
      law: Pink is a fill and a ring, never a text colour.
      measure: { kind: count, select: '*:not(:empty)', where: { metric: color, op: "=", value: { token: --accent } }, op: "=", value: 0 }
      owner: O-2
    - id: DNA-OFFSET-POP-INK-ON-PINK
      role: button
      law: Text on a pink fill is ink.
      measure: { kind: style, select: '*', where: { metric: background-color, op: "=", value: { token: --accent } }, metric: color, op: "=", value: { token: --foreground } }
      owner: O-2
    - id: DNA-OFFSET-POP-PRESS-TRAVEL
      role: button
      law: A pressed button travels into its shadow, which collapses.
      measure: { kind: style, context: { state: pressed }, select: '[data-component="Button"]:not([disabled])', metric: shadow-offset, op: "=", value: 0px }
      owner: grammars/offset-pop.md
    - id: DNA-OFFSET-POP-REDUCED-MOTION
      role: root
      law: Under reduced motion nothing travels when pressed.
      measure: { kind: style, context: { reducedMotion: reduce, state: pressed }, select: ':is([data-component="Button"],[data-grammar-surface],[data-grammar-row])', metric: translate, op: "=", value: 0px }
      owner: grammars/offset-pop.md
    - id: DNA-OFFSET-POP-FORCED-COLORS
      role: root
      law: In forced colours every shadow is dropped and the outline stays.
      measure:
        kind: style
        context: { forcedColors: active }
        select: ':is([data-component="Button"],[data-component="Badge"],[data-grammar-surface])'
        checks: [{ metric: box-shadow, op: "=", value: none }, { metric: border-width, op: "=", value: { token: --offset-pop-outline-width } }]
      owner: grammars/offset-pop.md
    - id: DNA-OFFSET-POP-PARITY-CUSTOM
      role: root
      law: offset-pop re-skins paint and arrangement only inside its scope; anatomy, roles and behaviour stay HeroUI's.
      measure: { kind: source, check: "parity:custom" }
      owner: vendor/parity.yaml
