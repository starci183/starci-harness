# What every grammar implements. Read by the grammar contract gate, the DNA gate and generators; reasoning is contract.md.
# Values are the package's: a measure names the value's owner (a token read at gate time, a threshold key, a vendor
# reference) and writes a literal only where the contract fixes it (the control heights 32, 40, 48). Vendor part names come from
# ../vendor/parity.yaml. roles[].dna lists the mustKeep ids of the role; mustKeep (last) owns each law and measure.
schema: starci/grammar-contract@1
grammars: [core, offset-pop]          # the implementations; each has contexts/grammars/<id>.md
base: common                          # shared renderers, anatomy, spacing and mechanics under every grammar

package:
  name: "@starci/grammar"
  entry: "@starci/grammar/<id>"
  stylesheet: "@starci/grammar/<id>/styles.css"   # imports the Common sheet first, then the grammar's own rules
  dna: "src/<id>/dna.ts"
  cssLayer: "starci-grammar-<id>"                 # ordered after starci-grammar-common
  scope: ".grammar-common-root[data-grammar-family=\"<id>\"]"
  imports:
    mayImport: [common]
    mustNotImport: [another grammar]              # Common imports no grammar either

root:
  component: GrammarRoot                          # the only Common renderer a grammar replaces
  stamps: { data-grammar-family: "<id>" }       # the root declares no theme token and stamps no mode: the app sets HeroUI tokens, `.dark` on html
  themes: [light, dark, forced-colors, reduced-motion]
  overlays: portal into the nearest root           # Common mechanics; a grammar never re-portals
  navigation: navigate and useHref props mount the vendor RouterProvider; every Grammar href navigates through it
  toaster: one, rendered in place inside the root
  unknownGrammar: refuse                          # no default grammar, no silent fallback

registry:
  components: common                              # every grammar publishes exactly Common's registry
  replacements: [GrammarRoot]
  extensions: { allowed: true, collideWithCommon: refuse, needs: [role, vendorParity, lintCoverage] }
  conformance: every ui rule id is inherited or carries family evidence naming the mechanism

tokens:
  # HeroUI semantic variables, read by every component and set by the app. A grammar declares none
  # on its root; its default palette is the optional theme.css of HeroUI tokens, and a role neither sets is HeroUI's own.
  colour: [background, foreground, surface, surface-foreground, surface-secondary, surface-secondary-foreground,
           surface-tertiary, default, default-foreground, muted, border, separator,
           accent, accent-foreground, accent-soft, accent-soft-foreground, link, focus,
           success, success-foreground, success-soft-foreground, warning, warning-foreground, warning-soft-foreground,
           danger, danger-foreground, danger-soft-foreground,
           field-background, field-foreground, field-placeholder, field-border, field-shadow]
  extension: [info, info-foreground]              # the one pair HeroUI lacks: each read falls back to accent, a family's theme.css sets both, an app may; no gate needs it set
  shape: [radius, field-radius]                   # every vendor corner derives from these
  corner: [--grammar-radius-tiny, --grammar-radius-compact, --grammar-radius-control, --grammar-radius-surface,
           --grammar-radius-hero, --grammar-radius-pill]   # roles an app names; the grammar sets them from its base radius
  elevation: [shadow-surface]
  type: [font-sans]                               # body family; sizes and ranks are Common's
  ownedByCommon:                                  # a grammar never sets these
    spacing: [--grammar-identity-gap, --grammar-inline-gap, --grammar-row-gap, --grammar-section-gap, --grammar-region-gap,
              --grammar-inset, --grammar-inset-nested, --grammar-inset-open, --grammar-page-inset, --grammar-overlay-inset,
              --grammar-card-padding-inline, --grammar-card-padding-block, --grammar-pane-inset-inline,
              --grammar-pane-inset-block-start, --grammar-pane-inset-block-end-outer, --grammar-pane-inset-block-end-divider,
              --grammar-control-padding-inline-sm, --grammar-control-padding-inline-md, --grammar-control-padding-inline-lg,
              --grammar-control-padding-glyph-sm, --grammar-control-padding-glyph-md, --grammar-control-padding-glyph-lg]
    controlHeight: [--grammar-control-height-sm, --grammar-control-height-md, --grammar-control-height-lg]
    target: [--grammar-target-coarse, --grammar-target-fine]
    mascot: [--grammar-mascot-sm, --grammar-mascot-md, --grammar-mascot-lg, --grammar-mascot-hero-max]

dna:
  required:
    id: string
    vendor: { name: heroui, parity: [strict, custom] }      # meaning in ../vendor/parity.yaml
    color:
      keys: [accent, accentForeground, focus]
      perTheme: [canvas, surface, surfaceSecondary, surfaceTertiary, foreground, muted, border, separator,
                 success, successForeground, warning, warningForeground, danger, dangerForeground,
                 info, infoForeground, accentText, accentSoft]
      themes: [light, dark]
    geometry: [pageMeasure, readingMeasure, tinyRadius, compactRadius, controlRadius, surfaceRadius, heroRadius, pillRadius]
    elevation: { surface: string, surfaceLayers: { top: string, nested: string } }
    motion: [duration, easing]
  optionalGroups: true                            # a grammar may add named groups (offset-pop: offset)
  ownedByCommon: [intent, arrangement, collectionItem, avatar, rhythm, spacingScale]

intent:
  owner: common
  intents: [commit, alternative, dismiss, neutral, destructive]
  steps: { destructive: [entry, confirm] }
  placements: [decision, item, chrome]
  iconButtonPlacements: [decision, item, chrome, navbar]
  shape:
    commit: { decision: variant, item: variant, chrome: variant }
    alternative: variant
    dismiss: variant
    neutral: { button: { decision: variant, item: variant, chrome: variant }, iconButton: { decision: variant, item: variant, chrome: variant, navbar: variant } }
    destructive: { entry: variant, confirm: variant }
  variantDomain: vendor Button variants          # ../vendor/parity.yaml roles.button

sizes:
  owner: common
  steps:
    sm: a control nested in a collection item or a dense toolbar
    md: the default of every standalone control
    lg: a landing hero call to action only
  increments: equal                               # reference 32 / 40 / 48 px, held at every breakpoint
  control: a control inside a bar row; set only by the bar composition, rendered at md height, never passed by an app
  rule: controls in one row share one height
  labels: badges, status dots and glyphs keep their own smaller scales
  target:                                         # drawn height and hit area are separate facts
    floors: [coarse, fine]                        # values: ../ui/proof/thresholds.yaml target.coarse, target.fine
    rule: every pressable part extends its hit area to the floor without redrawing its box
    crowded: a row of sm controls whose extensions would overlap takes md on a coarse pointer

lint:
  required: true                                  # a grammar with no factory fails closed
  package: "@starci/eslint-grammar-<id>"
  factory: "<id>GrammarConfig"
  extends: "@starci/eslint-grammar-common"        # Common API checks every grammar inherits

doc: contexts/grammars/<id>.md                   # how the grammar fills each role below

roles:
  - id: card
    ui: ui/components/card.md
    renderers: [SurfaceCard]
    vendorParity: [card, accordion]
    slots: ["label (a card that heads a section: outside the material)", "name with mark or typed poster (tile identity inside)", "tile poster: Image-owned data or localized absence, one preserved media frame", "tile facts: plain text; badge or up to three typed badges; primary ItemAction and typed overflow ItemMenu", fact, labelEnd, content, footer, "wholeAction: excludes inner actions and menu", "Figure: optional whole-cell href with Link.onFollow and isDisabled, neutral values", "ItemAction: Button.isPending preserves action-owned busy state", "artwork (soft and ink: decorative art carrying its assetSlot)", "motif (ink only)"]
    variants:
      kind: { values: [body, figures, list, accordion, bands, tile], chosenBy: app, compiler: a discriminated union; a list needs items and an empty state, bands end in at most one collection }
      labelPlacement: { values: [outside, inside], chosenBy: "the card's kind, never an app or a family: outside for a card that heads a section, inside for a tile repeated in a grid" }
      measure: { values: [content, form, formCompact], chosenBy: app }
      highlight: { values: [false, true], chosenBy: app, limit: one per view }
      treatment:
        values: [surface, soft, ink]
        meaning: { surface: "the family's surface face", soft: "the brand's light tint (accentSoft) under the default foreground; may carry copy and controls", ink: "the family's brand ink, a full-strength slab with no control (SURFACE-6)" }
        chosenBy: app by card.choose.treatment
        rebinds: "a painted treatment rebinds the whole surface pair (surface, foreground, muted, separator, border, the text accents) on its ground, so every child paints a pair that holds"
    sizes: none
    states: [neutral, pending, PresentationState]
    grammarMayChange: [surface paint, edge (border/shadow by depth), radius via surfaceRadius, the label's paint, the ink ground and its inks]
    dna: [DNA-COMMON-LIST-ON-WHITE-BORDERED, DNA-COMMON-ROW-EDGE-PADDING, DNA-COMMON-NO-RAISED-SURFACE-IN-SURFACE, DNA-COMMON-CARD-LABEL-ABOVE, DNA-COMMON-CARD-LABEL-HEADING, DNA-COMMON-ONE-HIGHLIGHT, DNA-COMMON-DIVIDER-FULL-BLEED, DNA-COMMON-SOFT-GROUND, DNA-COMMON-TREATMENT-TEXT-CONTRAST, DNA-CORE-EDGE-TOP, DNA-CORE-CARD-LABEL-OUTSIDE, DNA-OFFSET-POP-STICKER, DNA-OFFSET-POP-CARD-LABEL-OUTSIDE, DNA-COMMON-TILE-BYLINE, DNA-COMMON-TILE-FIGURE-START, DNA-COMMON-TILE-FIGURE-BEFORE-ACTION]
    lint: [starci-grammar/no-raised-surface-in-surface]

  - id: button
    ui: ui/components/button.md
    renderers: [Button, IconButton, FileButton, TextAction]
    vendorParity: [button, link, spinner]
    slots: [label, startContent, endContent, disabledReason, "isPending: initiating Button or IconButton busy state", "isLoading: unresolved inert geometry"]
    variants:
      variant: { values: vendor Button variants, chosenBy: intent x placement }
      width: { values: [content, fill], chosenBy: app }
      kind: { values: [command (onPress), destination (href)], chosenBy: app }
    intent: intent
    sizes: { steps: [sm, md, lg], default: md, bar: control }
    states: [rest, hover, pressed, focus-visible, disabled, pending, skeleton]
    grammarMayChange: [paint per variant through tokens, corner via radius, press motion]
    dna: [DNA-COMMON-LOADING-REGION-INERT, DNA-COMMON-LOADING-SAME-BOX, DNA-COMMON-CONTROL-MD, DNA-COMMON-CONTROL-SM, DNA-COMMON-CONTROL-LG, DNA-COMMON-CONTROL-FILL, DNA-COMMON-ICON-BUTTON-SQUARE, DNA-COMMON-TARGET-COARSE, DNA-COMMON-TARGET-FINE, DNA-COMMON-PENDING-KEEPS-BOX, DNA-COMMON-SKELETON-CORNER, DNA-COMMON-DISABLED-REASON, DNA-COMMON-ONE-ACCENT-FILL, DNA-CORE-BUTTON-PILL, DNA-OFFSET-POP-BUTTON-STICKER, DNA-OFFSET-POP-INK-ON-PINK, DNA-OFFSET-POP-PRESS-TRAVEL, DNA-CORE-BUTTON-ALTERNATIVE-OUTLINE]

  - id: link
    ui: ui/components/button.md
    renderers: [Link]
    vendorParity: [link]
    slots: ["children: string text label, exclusive with media", "media: existing ImageProps data, no arbitrary node", "label: required destination name for media", href, onFollow]
    variants:
      content: { values: [text, media], chosenBy: app from the destination's content; compiler rejects mixing the forms }
      kind: { values: [internal, external], chosenBy: app from the destination }
    sizes: Image owns media dimensions and aspect
    states: [rest, hover, focus-visible, disabled, image loading, image loaded, image error]
    grammarMayChange: [link colour and underline through the existing link treatment]
    dna: [DNA-COMMON-LINK-MEDIA-KEEPS-BOX, DNA-COMMON-LINK-ACCENT-TEXT]

  - id: color-swatch
    ui: ui/components/color-swatch.md
    renderers: [ColorSwatch]
    vendorParity: [color-swatch]
    slots: ["color: the vendor's typed actual color data", "label: required accessible color name"]
    variants: {}
    sizes: one small square vendor preview
    states: [ready, loading with the same inert geometry]
    grammarMayChange: []
    dna: []

  - id: button-group
    ui: ui/components/action-group.md
    renderers: [ButtonGroup]
    vendorParity: [button-group]
    slots: ["actions: each member has label, command and optional isPending", "isLoading: unresolved whole-group content"]
    variants:
      orientation: { values: [horizontal, vertical], chosenBy: app }
      width: { values: [content, fill], chosenBy: app }
    sizes: native ButtonGroup root size type, forwarded to every member
    states: [disabled, pending per initiating member, loading inert whole-group skeleton]
    grammarMayChange: [separator paint]
    dna: [DNA-COMMON-BUTTONGROUP-JOINED, DNA-COMMON-BUTTONGROUP-INNER-CORNERS, DNA-COMMON-BUTTONGROUP-NO-PRESS-SCALE, DNA-COMMON-BUTTONGROUP-ONE-INTENT]

  - id: tabs
    ui: ui/components/tabs.md
    renderers: [Tabs]
    vendorParity: [tabs]
    slots: ["items: label, leading, count, href, isDisabled", panels]
    variants:
      kind: { values: [views, filter], meaning: "views: switch views of a page, in the page head; filter: narrow one list, inside the list pane under its search field, the same underline one size smaller with a count chip per tab and a +n fold; a value of a form is ChoiceChips or RadioGroup, never a tab bar", chosenBy: app by tabs.choose.role }
      inset: { values: [page, none], chosenBy: app }
    sizes: { steps: none, bar: md }
    states: [selected, focus-visible, disabled]
    grammarMayChange: [track, indicator and label paint; current label reads accent text]
    dna: [DNA-COMMON-TABS-BAR-MD, DNA-COMMON-TABS-FILTER-COMPACT, DNA-COMMON-TABS-BY-LAYER, DNA-COMMON-TABS-INDICATOR, DNA-COMMON-TABS-OWN-PANEL, DNA-COMMON-TABS-ROVING, DNA-COMMON-TABS-FILTER-LOADING-COUNTS, DNA-COMMON-TABS-COUNT-CHIP, DNA-COMMON-TABS-COUNT-CHIP-ATTENTION]

  - id: filter-button-group
    ui: ui/components/chip.md
    renderers: [FilterButtonGroup]
    vendorParity: [toggle-button-group, toggle-button]
    slots: [options]
    states: [selected, focus-visible, disabled]
    grammarMayChange: [selected paint (the accent soft pair), the overflow button and its list]

  - id: segmented-control
    ui: ui/components/segmented-control.md
    renderers: [ChoiceChips]
    vendorParity: [toggle-button-group, toggle-button]
    slots: ["ChoiceChips: label, options (value, label, isDisabled), empty, error"]
    variants:
      width: { values: [content, fill], chosenBy: app }
    sizes: { steps: [sm, md], default: md }
    states: [selected, focus-visible, disabled, skeleton]
    grammarMayChange: [selected paint (soft accent with accent border)]
    dna: [DNA-COMMON-CHOICE-CHIPS-WRAP, DNA-COMMON-CHOICE-CHIPS-FILL]

  - id: chip
    ui: ui/components/chip.md
    renderers: [Badge, StatusDot, TagGroup]
    vendorParity: [chip, tag-group, tag, tooltip]
    slots: [label, startContent, "aria-label (a StatusDot)"]
    variants:
      tone: { values: [neutral, accent, success, warning, danger, muted (Badge only)], chosenBy: app from a settled fact }
      emphasis: { values: [soft, muted (no fill, muted ink)], chosenBy: grammar from the tone }
      statusDot: { values: [echo, static], chosenBy: app }
      badgeDot: { values: [dot, live], chosenBy: app, meaning: "Badge isDot is a status with its words; isLive makes it a live feed (the dot echoes, a polite live region)" }
      reorder: { values: [none, TagGroup onReorder], chosenBy: app }
    sizes: { badge: below the ramp, statusDot: { steps: [sm, md, lg], default: md }, badgeDot: { steps: [sm], equals: the vendor Chip of the same size }, tagGroup: { steps: [sm, md], default: sm } }
    states: [disabled, echo (StatusDot, off under reduced motion), live (Badge isDot isLive: a polite live region, the words carry the state)]
    grammarMayChange: [tone paint through tokens]
    dna: [DNA-COMMON-BADGE-TONE-INFO, DNA-COMMON-BADGE-BELOW-RAMP, DNA-COMMON-CHIP-NOT-TARGET, DNA-COMMON-CHIP-LABEL-UPPERCASE, DNA-COMMON-BADGE-DOT-CHIP-PARITY, DNA-COMMON-BADGE-DOT-GAP, DNA-COMMON-DOT-SIZE, DNA-COMMON-DOT-NAMED, DNA-COMMON-ECHO-LIGHT-STOP, DNA-COMMON-ECHO-REDUCED-MOTION, DNA-COMMON-TAG-REMOVE, DNA-COMMON-TAG-REORDER-KEYS, DNA-COMMON-TONE-CUSTOM-COMPLETE]

  - id: quote
    ui: ui/components/quote.md
    renderers: [Quote, Inset]
    vendorParity: []
    slots: [children (the words), source (a short word: Brain, Chat, Template), byline (where and when), "Inset: children (rows or a block), label, isLoading"]
    variants: none
    sizes: none
    states: [skeleton]
    grammarMayChange: [ground tint through tokens]
    dna: []

  - id: input
    ui: ui/components/text-field.md
    renderers: [Input, Textarea, SearchField, NumberField, DateField, TimeField, Field, OtpInput, Grid]
    vendorParity: [textfield, input, input-group, textarea, search-field, number-field, date-field, time-field, input-otp]
    slots: [label, control, description, errorMessage, prefix, suffix]
    variants:
      variant: { values: [primary, secondary], meaning: { primary: on the canvas, secondary: inside a surface }, chosenBy: context }
      formColumns: { values: [1, 2], meaning: { 2: Grid kind=form rows of two once its own width holds them }, chosenBy: app }
    sizes: { steps: [md], default: md }
    states: [rest, focus-visible, invalid, disabled, read-only, skeleton]
    grammarMayChange: [fill, border, focus treatment, corner via field-radius]
    dna: [DNA-COMMON-FIELD-MD, DNA-COMMON-FIELD-BY-LAYER, DNA-COMMON-FIELD-NAME-IS-LABEL, DNA-COMMON-FIELD-ERROR-DESCRIBES, DNA-COMMON-FIELD-ONE-RING, DNA-COMMON-FIELD-ANATOMY-ORDER, DNA-COMMON-FIELD-ROW-CONTROL-LINE, DNA-COMMON-CHOICE-RING, DNA-COMMON-FIELD-SM]

  - id: select
    ui: ui/components/select.md
    renderers: [Select, ComboBox, DatePicker, DateRangePicker]
    vendorParity: [select, combo-box, list-box, date-picker, date-range-picker]
    slots: [label, description, errorMessage, "options: label, description, leading"]
    variants:
      variant: { values: [primary, secondary], chosenBy: context }
    sizes: { steps: [md], default: md }
    states: [open, selected, focus-visible, invalid, disabled, pending, skeleton]
    grammarMayChange: [trigger and option paint, popover edge, arrangement indicatorSide]
    dna: [DNA-COMMON-FIELD-MD, DNA-COMMON-OVERLAY-IN-ROOT, DNA-COMMON-FIELD-BY-LAYER, DNA-COMMON-FIELD-NAME-IS-LABEL, DNA-COMMON-FIELD-ERROR-DESCRIBES, DNA-COMMON-FIELD-ANATOMY-ORDER, DNA-COMMON-FIELD-ROW-CONTROL-LINE, DNA-COMMON-FIELD-SM, DNA-COMMON-SELECT-NO-VENDOR-ENGLISH]

  - id: copy-field
    ui: ui/components/text-field.md
    renderers: [CopyField]
    vendorParity: [textfield, input-group, tooltip]
    slots: [label, control (the value and the copy action at its end), description, "errorMessage (copyErrorLabel)", "action: copyLabel, copiedLabel"]
    variants:
      masked: { values: [false, true], meaning: { false: "the value, truncated in the middle with the whole value in a tooltip", true: "bullets and the last four characters; the clear value comes only from onCopy" }, chosenBy: app from the fact (a secret) }
      variant: { values: [primary, secondary], chosenBy: context }
    sizes: { steps: [md], default: md }
    states: [rest, focus-visible, pending, copied (about 2s, announced politely), failed, disabled, skeleton]
    grammarMayChange: [the field frame's paint as Input's, the action glyph paint]
    dna: [DNA-COMMON-FIELD-MD, DNA-COMMON-FIELD-BY-LAYER, DNA-COMMON-FIELD-ANATOMY-ORDER, DNA-COMMON-FIELD-ROW-CONTROL-LINE, DNA-COMMON-COPYFIELD-MASKED, DNA-COMMON-COPYFIELD-TAIL]

  - id: dialog
    ui: ui/components/dialog-drawer.md
    renderers: [Dialog, AlertDialog, Drawer, Popover, Tooltip]
    vendorParity: [modal, alert-dialog, drawer, popover, tooltip]
    slots: [title, description, body, footer, trigger, closeLabel]
    variants:
      dialogSize: { values: [sm, md, lg, full], chosenBy: app }
      drawerPlacement: { values: [left, right, top, bottom], chosenBy: app }
      alertTone: { values: PresentationState, chosenBy: app }
    sizes: dialogSize is a max inline size, not a control size
    states: [open, closed, confirm-pending]
    grammarMayChange: [surface paint and edge, backdrop paint, shadow direction]
    dna: [DNA-COMMON-OVERLAY-IN-ROOT, DNA-COMMON-DIALOG-NAMED, DNA-COMMON-DIALOG-ESCAPE, DNA-COMMON-DIALOG-FOCUS-TRAP, DNA-COMMON-ALERTDIALOG-TONE-INFORMATIVE, DNA-COMMON-ALERTDIALOG-DISMISS-FIRST]

  - id: menu
    ui: ui/components/menu.md
    renderers: [DropdownMenu]
    vendorParity: [dropdown]
    slots: [trigger, sections, "items: label, description, shortcut, iconSource or mark, submenu"]
    variants:
      itemTone: { values: [neutral, danger], chosenBy: app from the consequence }
    sizes: none
    states: [open, focused, selected, disabled]
    grammarMayChange: [item paint, "arrangement: indicator side, leading glyph size, separators"]
    dna: [DNA-COMMON-OVERLAY-IN-ROOT, DNA-COMMON-MENU-SECTIONS, DNA-COMMON-MENU-DANGER]

  - id: list
    ui: ui/components/list-table.md
    renderers: [ListBox, SurfaceCard, DataTable]
    vendorParity: [list-box, table, checkbox]
    slots: ["items: label, description, leading, trailing, href", "ListRowData: string title; href links its title with optional Link.onFollow; without href, no onFollow", "columns: editor, priority", "rows: href", emptyContent]
    variants:
      descriptionLines: { values: [wrap, 1, 2, 3], meaning: { wrap: the ListBox default, 1: the ListRow default }, chosenBy: app }
      leadingSize: { values: [sm, md, lg], chosenBy: app from the leading content }
      selectionIndicator: { values: [check, none], chosenBy: app }
      inset: { values: [default, panel], chosenBy: context }
      emphasis: { values: [unread], chosenBy: app from the fact }
    sizes: leading slot sm/md/lg match the control ladder
    states: [hover, focus-visible, selected, disabled, loading (same rows at rest), empty]
    grammarMayChange: [row state paint, seam paint]
    dna: [DNA-COMMON-LIST-SEAMS, DNA-COMMON-SEAM-FULL-BLEED, DNA-COMMON-ROW-DESCRIPTION-ONE-LINE, DNA-COMMON-OPTION-DESCRIPTION-WRAPS, DNA-COMMON-TABLE-ROW-LINK, DNA-COMMON-TABLE-FOLD, DNA-COMMON-ROW-ACTION-END, DNA-COMMON-DISCLOSURE-CHEVRON-START, DNA-COMMON-FIGURES-PANE-ROW, DNA-COMMON-DESCRIPTION-DRAWER-COLUMNS, DNA-COMMON-STEPPER-BAR, DNA-COMMON-STEPPER-BAR-NO-CONNECTOR, DNA-COMMON-DISCLOSURE-CHEVRON-TITLE-NEXT, DNA-COMMON-TABLE-NO-CLIP, DNA-COMMON-ROW-TEXT-FIRST, DNA-COMMON-STEPPER-MARKER-FILLS, DNA-COMMON-STEPPER-MARKER-UPCOMING, DNA-COMMON-LIST-ROW-DIFF]

  - id: alert
    ui: ui/components/toast-alert.md
    renderers: [Alert, Toaster, toastQueue]
    vendorParity: [alert, spinner]
    slots: [title, description, action, dismissLabel]
    variants:
      tone: { values: PresentationState, chosenBy: app from a settled fact }
      urgency: { values: [polite, assertive], chosenBy: tone }
    sizes: none
    states: [persistent (action or negative), timed, paused on hover or focus]
    grammarMayChange: [tone paint, toast spacing]
    dna: [DNA-COMMON-ONE-TOASTER, DNA-COMMON-TOASTER-LIVE, DNA-COMMON-ALERT-TONE-PAIR-INFORMATIVE, DNA-COMMON-TOAST-TONE-INFORMATIVE, DNA-COMMON-ALERT-TONE-PAIR-SUCCESS, DNA-COMMON-ALERT-TONE-PAIR-WARNING, DNA-COMMON-ALERT-TONE-PAIR-DANGER, DNA-COMMON-ALERT-TONE-PAIR-DEFAULT, DNA-COMMON-ALERT-TONE-PAIR-ACCENT]

  - id: empty-state
    ui: ui/components/empty-state.md
    renderers: [EmptyNotice]
    vendorParity: [button]
    slots: [message, description, "mark: iconSource or artwork (src, alt, assetSlot required, assetSha256, assetPrompt; drawn as Mascot md)", "action: label, pending"]
    variants:
      action: { values: [none, one], chosenBy: app when a real next step exists }
      mark: { values: [none, glyph, artwork], chosenBy: "app by empty-state.choose.cause; artwork on the first-run row only" }
    sizes: none
    states: [action-pending]
    grammarMayChange: [glyph and text paint]
    dna: [DNA-COMMON-EMPTY-ONE-ACTION, DNA-COMMON-EMPTY-NOTICE-TOP]
    provenance: "the artwork's assetSlot is a required field of EmptyNoticeArtwork (the compiler holds it; lint R338 holds it on a written Mascot)"

  - id: avatar
    ui: ui/components/identity-mark.md
    renderers: [Avatar, AvatarButton, AvatarGroup, IconTile]
    vendorParity: [avatar, avatar-group]
    slots: [src, name, seed, kind]
    variants:
      kind: { values: [person, agent], chosenBy: app from the fact }
      groupLayout: { values: [row, grid], chosenBy: app }
    sizes: { steps: [sm, md, lg], default: md, bar: control }
    states: [image, initials fallback, skeleton]
    grammarMayChange: [ring, fallback paint]
    dna: [DNA-COMMON-AVATAR-RAMP, DNA-COMMON-AVATAR-GROUP-ONE-SIZE, DNA-COMMON-AVATAR-INITIALS, DNA-COMMON-AGENT-NAMED]

  - id: mascot
    ui: ui/components/mascot.md
    renderers: [Mascot]
