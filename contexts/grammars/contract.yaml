# What every grammar implements. Read by the grammar contract gate, the DNA gate and generators; reasoning is contract.md.
# Values are the package's: a measure names the value's owner (a token read at gate time, a threshold key, a vendor
# reference) and writes a literal only where a ruling fixes it (control-height-40). Vendor part names come from
# ../vendor/parity.yaml. roles[].dna lists the mustKeep ids of the role; mustKeep (last) owns each law and measure.
schema: starci/grammar-contract@1
grammars: [core, offset-pop]          # the implementations; each has contexts/grammars/<id>.md
base: common                          # shared renderers, anatomy, spacing and mechanics under every grammar

package:
  name: "@starci/grammar"
  entry: "@starci/grammar/<id>"
  stylesheet: "@starci/grammar/<id>/styles.css"   # imports the Common sheet first, then the grammar's own rules
  dna: "src/<id>/dna.ts"
  cssLayer: "starci-grammar-<id>"                 # ordered after starci-grammar-common
  scope: ".grammar-common-root[data-grammar-family=\"<id>\"]"
  imports:
    mayImport: [common]
    mustNotImport: [another grammar]              # Common imports no grammar either

root:
  component: GrammarRoot                          # the only Common renderer a grammar replaces
  stamps: { data-grammar-family: "<id>", data-grammar-theme: [system, light, dark] }
  themes: [light, dark-explicit, dark-system, forced-colors, reduced-motion]
  overlays: portal into the nearest root           # Common mechanics; a grammar never re-portals
  navigation: navigate and useHref props mount the vendor RouterProvider; every Grammar href navigates through it
  toaster: one, rendered in place inside the root
  unknownGrammar: refuse                          # no default grammar, no silent fallback

registry:
  components: common                              # every grammar publishes exactly Common's registry
  replacements: [GrammarRoot]
  extensions: { allowed: true, collideWithCommon: refuse, needs: [role, vendorParity, lintCoverage] }
  conformance: every ui rule id is inherited or carries family evidence naming the mechanism

tokens:
  # Bound by the grammar on its root (HeroUI semantic variables). A role left unbound falls to HeroUI's default
  # and must be declared as such in the grammar's dna.
  colour: [background, foreground, surface, surface-foreground, surface-secondary, surface-secondary-foreground,
           surface-tertiary, default, default-foreground, muted, border, separator,
           accent, accent-foreground, accent-soft, accent-soft-foreground, link, focus,
           success, success-foreground, success-soft-foreground, warning, warning-foreground, warning-soft-foreground,
           danger, danger-foreground, danger-soft-foreground, info, info-foreground,
           field-background, field-foreground, field-placeholder, field-border, field-shadow]
  shape: [radius, field-radius]                   # every vendor corner derives from these
  corner: [--grammar-radius-tiny, --grammar-radius-compact, --grammar-radius-control, --grammar-radius-surface,
           --grammar-radius-hero, --grammar-radius-pill]   # roles an app names; the grammar sets them from its base radius
  elevation: [shadow-surface]
  type: [font-sans]                               # body family; sizes and ranks are Common's
  ownedByCommon:                                  # a grammar never sets these
    spacing: [--grammar-inline-gap, --grammar-row-gap, --grammar-section-gap, --grammar-region-gap, --grammar-page-inset]
    controlHeight: [--grammar-control-height-sm, --grammar-control-height-md, --grammar-control-height-lg]
    target: [--grammar-target-coarse, --grammar-target-fine]
    mascot: [--grammar-mascot-sm, --grammar-mascot-md, --grammar-mascot-lg, --grammar-mascot-hero-max]

dna:
  required:
    id: string
    vendor: { name: heroui, parity: [strict, custom] }      # meaning in ../vendor/parity.yaml
    color:
      keys: [accent, accentForeground, focus]
      perTheme: [canvas, surface, surfaceSecondary, surfaceTertiary, foreground, muted, border, separator,
                 success, successForeground, warning, warningForeground, danger, dangerForeground,
                 info, infoForeground, accentText, accentSoft]
      themes: [light, dark]
    geometry: [pageMeasure, readingMeasure, tinyRadius, compactRadius, controlRadius, surfaceRadius, heroRadius, pillRadius]
    elevation: { surface: string, surfaceLayers: { top: string, nested: string } }
    motion: [duration, easing]
  optionalGroups: true                            # a grammar may add named groups (offset-pop: offset)
  ownedByCommon: [intent, arrangement, collectionItem, avatar, rhythm, spacingScale]

intent:
  owner: common
  intents: [commit, alternative, dismiss, neutral, destructive]
  steps: { destructive: [entry, confirm] }
  placements: [decision, item, chrome]
  iconButtonPlacements: [decision, item, chrome, navbar]
  shape:
    commit: { decision: variant, item: variant, chrome: variant }
    alternative: variant
    dismiss: variant
    neutral: { button: { decision: variant, item: variant, chrome: variant }, iconButton: { decision: variant, item: variant, chrome: variant, navbar: variant } }
    destructive: { entry: variant, confirm: variant }
  variantDomain: vendor Button variants          # ../vendor/parity.yaml roles.button

sizes:
  owner: common
  steps:
    sm: a control nested in a collection item or a dense toolbar
    md: the default of every standalone control
    lg: a landing hero call to action only
  increments: equal                               # reference 32 / 40 / 48 px, held at every breakpoint
  control: a control inside a bar row; set only by the bar composition, rendered at md height, never passed by an app
  rule: controls in one row share one height
  labels: badges, status dots and glyphs keep their own smaller scales
  target:                                         # drawn height and hit area are separate facts
    floors: [coarse, fine]                        # values: ../ui/proof/thresholds.yaml target.coarse, target.fine
    rule: every pressable part extends its hit area to the floor without redrawing its box
    crowded: a row of sm controls whose extensions would overlap takes md on a coarse pointer

lint:
  required: true                                  # a grammar with no factory fails closed
  package: "@starci/eslint-grammar-<id>"
  factory: "<id>GrammarConfig"
  extends: "@starci/eslint-grammar-common"        # Common API checks every grammar inherits

doc: contexts/grammars/<id>.md                   # how the grammar fills each role below

roles:
  - id: card
    ui: ui/components/card.md
    renderers: [SurfaceCard, SurfaceListCard, SurfaceAccordionCard]
    vendorParity: [card, accordion]
    slots: [label, fact, labelEnd, content, footer, wholeAction, "artwork (soft and ink: decorative art carrying its assetSlot)", "motif (ink only)"]
    variants:
      composition: { values: [single, joined], chosenBy: app }
      measure: { values: [content, form, formCompact], chosenBy: app }
      depth: { values: [top, nested], chosenBy: context }
      highlight: { values: [false, true], chosenBy: app, limit: one per view }
      treatment:
        values: [surface, soft, ink]
        meaning: { surface: "the family's surface face", soft: "the brand's light tint (accentSoft) under the default foreground; may carry copy and controls", ink: "the family's brand ink, a full-strength slab with no control (SURFACE-6)" }
        chosenBy: app by card.choose.treatment
        rebinds: "a painted treatment rebinds the whole surface pair (surface, foreground, muted, separator, border, the text accents) on its ground, so every child paints a pair that holds"
    sizes: none
    states: [neutral, pending, PresentationState]
    grammarMayChange: [surface paint, edge (border/shadow by depth), radius via surfaceRadius, label placement inside or outside the material, the ink ground and its inks]
    dna: [DNA-COMMON-NO-RAISED-SURFACE-IN-SURFACE, DNA-COMMON-CARD-LABEL-ABOVE, DNA-COMMON-CARD-LABEL-HEADING, DNA-COMMON-LISTCARD-LABEL-OUTSIDE, DNA-COMMON-LISTCARD-LABEL-UNPAINTED, DNA-COMMON-ONE-HIGHLIGHT, DNA-COMMON-DIVIDER-FULL-BLEED, DNA-COMMON-SOFT-GROUND, DNA-COMMON-TREATMENT-TEXT-CONTRAST, DNA-CORE-EDGE-TOP, DNA-CORE-EDGE-NESTED, DNA-CORE-CARD-LABEL-OUTSIDE, DNA-OFFSET-POP-STICKER, DNA-OFFSET-POP-POCKET, DNA-OFFSET-POP-CARD-LABEL-OUTSIDE]
    lint: [starci-grammar/no-raised-surface-in-surface]

  - id: button
    ui: ui/components/button.md
    renderers: [Button, IconButton, TextAction]
    vendorParity: [button, link, spinner]
    slots: [label, startContent, endContent, disabledReason]
    variants:
      variant: { values: vendor Button variants, chosenBy: intent x placement }
      width: { values: [content, fill], chosenBy: app }
      kind: { values: [command (onPress), destination (href)], chosenBy: app }
    intent: intent
    sizes: { steps: [sm, md, lg], default: md, bar: control }
    states: [rest, hover, pressed, focus-visible, disabled, pending, skeleton]
    grammarMayChange: [paint per variant through tokens, corner via radius, press motion]
    dna: [DNA-COMMON-CONTROL-MD, DNA-COMMON-CONTROL-SM, DNA-COMMON-CONTROL-LG, DNA-COMMON-CONTROL-FILL, DNA-COMMON-ICON-BUTTON-SQUARE, DNA-COMMON-TARGET-COARSE, DNA-COMMON-TARGET-FINE, DNA-COMMON-PENDING-KEEPS-BOX, DNA-COMMON-SKELETON-CORNER, DNA-COMMON-DISABLED-REASON, DNA-COMMON-ONE-ACCENT-FILL, DNA-CORE-BUTTON-PILL, DNA-OFFSET-POP-BUTTON-STICKER, DNA-OFFSET-POP-INK-ON-PINK, DNA-OFFSET-POP-PRESS-TRAVEL]

  - id: button-group
    ui: ui/components/action-group.md
    renderers: [ButtonGroup]
    vendorParity: [button-group]
    slots: [buttons]
    variants:
      orientation: { values: [horizontal, vertical], chosenBy: app }
      width: { values: [content, fill], chosenBy: app }
    sizes: inherits its buttons
    states: [disabled]
    grammarMayChange: [separator paint]
    dna: [DNA-COMMON-BUTTONGROUP-JOINED, DNA-COMMON-BUTTONGROUP-INNER-CORNERS, DNA-COMMON-BUTTONGROUP-NO-PRESS-SCALE, DNA-COMMON-BUTTONGROUP-ONE-INTENT]

  - id: tabs
    ui: ui/components/tabs.md
    renderers: [Tabs]
    vendorParity: [tabs]
    slots: ["items: label, leading, href", panels]
    variants:
      variant: { values: [primary, secondary], meaning: { primary: "region tabs: pill segment, inside a painted surface", secondary: "page tabs: underline, outside a painted surface" }, chosenBy: context }
      inset: { values: [page, none], chosenBy: app }
    sizes: { steps: none, bar: md }
    states: [selected, focus-visible, disabled]
    grammarMayChange: [track, indicator and label paint; current label reads accent text]
    dna: [DNA-COMMON-TABS-BAR-MD, DNA-COMMON-TABS-BY-LAYER, DNA-COMMON-TABS-INDICATOR, DNA-COMMON-TABS-OWN-PANEL, DNA-COMMON-TABS-ROVING]

  - id: segmented-control
    ui: ui/components/segmented-control.md
    renderers: [SegmentedControl]
    vendorParity: [toggle-button-group, toggle-button]
    slots: [options]
    variants:
      width: { values: [content, fill], chosenBy: app }
    sizes: { steps: [sm, md], default: md }
    states: [selected, focus-visible, disabled, skeleton]
    grammarMayChange: [selected paint (soft accent with accent border)]
    dna: [DNA-COMMON-SEGMENTED-RAMP, DNA-COMMON-SEGMENTED-RADIO, DNA-CORE-SEGMENT-SELECTED]

  - id: chip
    ui: ui/components/chip.md
    renderers: [Badge, StatusDot, TagGroup]
    vendorParity: [chip, tag-group, tag, tooltip]
    slots: [label, startContent, "aria-label (a dot without text)"]
    variants:
      tone: { values: [neutral, accent, success, warning, danger, muted (Badge only)], chosenBy: app from a settled fact }
      emphasis: { values: [soft, muted (no fill, muted ink)], chosenBy: grammar from the tone }
      statusDot: { values: [text, echo, static], chosenBy: app }
      selectable: { values: [TagGroup selection], chosenBy: app }
      reorder: { values: [none, TagGroup onReorder], chosenBy: app }
    sizes: { badge: below the ramp, statusDot: { steps: [sm, md, lg], default: md, equals: the vendor Chip of the same size }, tagGroup: { steps: [sm, md], default: sm } }
    states: [selected (TagGroup), disabled, echo (StatusDot, off under reduced motion)]
    grammarMayChange: [tone paint through tokens]
    dna: [DNA-COMMON-BADGE-BELOW-RAMP, DNA-COMMON-CHIP-NOT-TARGET, DNA-COMMON-CHIP-LABEL-UPPERCASE, DNA-COMMON-STATUSDOT-CHIP-PARITY, DNA-COMMON-STATUSDOT-GAP, DNA-COMMON-DOT-SIZE, DNA-COMMON-DOT-NAMED, DNA-COMMON-ECHO-LIGHT-STOP, DNA-COMMON-ECHO-REDUCED-MOTION, DNA-COMMON-TAG-REMOVE, DNA-COMMON-TAG-REORDER-KEYS]

  - id: input
    ui: ui/components/text-field.md
    renderers: [Input, Textarea, SearchField, NumberField, DateField, TimeField, Field, OtpInput, FormGrid]
    vendorParity: [textfield, input, input-group, textarea, search-field, number-field, date-field, time-field, input-otp]
    slots: [label, control, description, errorMessage, prefix, suffix]
    variants:
      variant: { values: [primary, secondary], meaning: { primary: on the canvas, secondary: inside a surface }, chosenBy: context }
      formColumns: { values: [1, 2], meaning: { 2: FormGrid rows of two once its own width holds them }, chosenBy: app }
    sizes: { steps: [md], default: md }
    states: [rest, focus-visible, invalid, disabled, read-only, skeleton]
    grammarMayChange: [fill, border, focus treatment, corner via field-radius]
    dna: [DNA-COMMON-FIELD-MD, DNA-COMMON-FIELD-BY-LAYER, DNA-COMMON-FIELD-NAME-IS-LABEL, DNA-COMMON-FIELD-ERROR-DESCRIBES, DNA-COMMON-FIELD-ONE-RING, DNA-COMMON-FIELD-ANATOMY-ORDER, DNA-COMMON-FIELD-ROW-CONTROL-LINE]

  - id: select
    ui: ui/components/select.md
    renderers: [Select, ComboBox, DatePicker, DateRangePicker]
    vendorParity: [select, combo-box, list-box, date-picker, date-range-picker]
    slots: [label, description, errorMessage, "options: label, description, leading"]
    variants:
      variant: { values: [primary, secondary], chosenBy: context }
    sizes: { steps: [md], default: md }
    states: [open, selected, focus-visible, invalid, disabled, pending, skeleton]
    grammarMayChange: [trigger and option paint, popover edge, arrangement indicatorSide]
    dna: [DNA-COMMON-FIELD-MD, DNA-COMMON-OVERLAY-IN-ROOT, DNA-COMMON-FIELD-BY-LAYER, DNA-COMMON-FIELD-NAME-IS-LABEL, DNA-COMMON-FIELD-ERROR-DESCRIBES, DNA-COMMON-FIELD-ANATOMY-ORDER, DNA-COMMON-FIELD-ROW-CONTROL-LINE]

  - id: copy-field
    ui: ui/components/text-field.md
    renderers: [CopyField]
    vendorParity: [textfield, input-group, tooltip]
    slots: [label, control (the value and the copy action at its end), description, "errorMessage (copyErrorLabel)", "action: copyLabel, copiedLabel"]
    variants:
      masked: { values: [false, true], meaning: { false: "the value, truncated in the middle with the whole value in a tooltip", true: "bullets and the last four characters; the clear value comes only from onCopy" }, chosenBy: app from the fact (a secret) }
      variant: { values: [primary, secondary], chosenBy: context }
    sizes: { steps: [md], default: md }
    states: [rest, focus-visible, pending, copied (about 2s, announced politely), failed, disabled, skeleton]
    grammarMayChange: [the field frame's paint as Input's, the action glyph paint]
    dna: [DNA-COMMON-FIELD-MD, DNA-COMMON-FIELD-BY-LAYER, DNA-COMMON-FIELD-ANATOMY-ORDER, DNA-COMMON-FIELD-ROW-CONTROL-LINE, DNA-COMMON-COPYFIELD-MASKED, DNA-COMMON-COPYFIELD-TAIL]

  - id: dialog
    ui: ui/components/dialog-drawer.md
    renderers: [Dialog, AlertDialog, Drawer, Popover, Tooltip]
    vendorParity: [modal, alert-dialog, drawer, popover, tooltip]
    slots: [title, description, body, footer, trigger, closeLabel]
    variants:
      dialogSize: { values: [sm, md, lg, full], chosenBy: app }
      drawerPlacement: { values: [left, right, top, bottom], chosenBy: app }
      alertTone: { values: PresentationState, chosenBy: app }
    sizes: dialogSize is a max inline size, not a control size
    states: [open, closed, confirm-pending]
    grammarMayChange: [surface paint and edge, backdrop paint, shadow direction]
    dna: [DNA-COMMON-OVERLAY-IN-ROOT, DNA-COMMON-DIALOG-NAMED, DNA-COMMON-DIALOG-ESCAPE, DNA-COMMON-DIALOG-FOCUS-TRAP, DNA-COMMON-ALERTDIALOG-DISMISS-FIRST]

  - id: menu
    ui: ui/components/menu.md
    renderers: [DropdownMenu]
    vendorParity: [dropdown]
    slots: [trigger, sections, "items: label, description, shortcut, iconSource or mark, submenu"]
    variants:
      itemTone: { values: [neutral, danger], chosenBy: app from the consequence }
    sizes: none
    states: [open, focused, selected, disabled]
    grammarMayChange: [item paint, "arrangement: indicator side, leading glyph size, separators"]
    dna: [DNA-COMMON-OVERLAY-IN-ROOT, DNA-COMMON-MENU-SECTIONS, DNA-COMMON-MENU-DANGER]

  - id: list
    ui: ui/components/list-table.md
    renderers: [ListBox, SurfaceListCard, ListRow, StaticStateRow, DataTable]
    vendorParity: [list-box, table, checkbox]
    slots: ["items: label, description, leading, trailing, href", "columns: editor, priority", "rows: href", emptyContent]
    variants:
      descriptionLines: { values: [wrap, 1, 2, 3], meaning: { wrap: the ListBox default, 1: the ListRow default }, chosenBy: app }
      leadingSize: { values: [sm, md, lg], chosenBy: app from the leading content }
      selectionIndicator: { values: [check, none], chosenBy: app }
      inset: { values: [default, panel], chosenBy: context }
      emphasis: { values: [unread], chosenBy: app from the fact }
    sizes: leading slot sm/md/lg match the control ladder
    states: [hover, focus-visible, selected, disabled, loading (same rows at rest), empty]
    grammarMayChange: [row state paint, seam paint]
    dna: [DNA-COMMON-LIST-SEAMS, DNA-COMMON-SEAM-FULL-BLEED, DNA-COMMON-ROW-DESCRIPTION-ONE-LINE, DNA-COMMON-OPTION-DESCRIPTION-WRAPS, DNA-COMMON-TABLE-ROW-LINK, DNA-COMMON-TABLE-FOLD]

  - id: alert
    ui: ui/components/toast-alert.md
    renderers: [Alert, Toaster, toastQueue]
    vendorParity: [alert, spinner]
    slots: [title, description, action, dismissLabel]
    variants:
      tone: { values: PresentationState, chosenBy: app from a settled fact }
      appearance: { values: [surface, soft], chosenBy: app }
      urgency: { values: [polite, assertive], chosenBy: tone }
    sizes: none
    states: [persistent (action or negative), timed, paused on hover or focus]
    grammarMayChange: [tone paint, toast spacing]
    dna: [DNA-COMMON-ONE-TOASTER, DNA-COMMON-TOASTER-LIVE, DNA-COMMON-ALERT-SURFACE, DNA-CORE-ALERT-RAISED, DNA-OFFSET-POP-ALERT-SOFT]

  - id: empty-state
    ui: ui/components/empty-state.md
    renderers: [EmptyNotice]
    vendorParity: [button]
    slots: [message, description, "mark: iconSource or artwork (src, alt, assetSlot required, assetSha256, assetPrompt; drawn as Mascot md)", "action: label, pending"]
    variants:
      action: { values: [none, one], chosenBy: app when a real next step exists }
      mark: { values: [none, glyph, artwork], chosenBy: "app by empty-state.choose.cause; artwork on the first-run row only" }
    sizes: none
    states: [action-pending]
    grammarMayChange: [glyph and text paint]
    dna: [DNA-COMMON-EMPTY-ONE-ACTION]
    provenance: "the artwork's assetSlot is a required field of EmptyNoticeArtwork (the compiler holds it; lint R338 holds it on a written Mascot)"

  - id: avatar
    ui: ui/components/identity-mark.md
    renderers: [Avatar, AvatarButton, AvatarGroup, IconTile]
    vendorParity: [avatar, avatar-group]
    slots: [src, name, seed, kind]
    variants:
      kind: { values: [person, agent], chosenBy: app from the fact }
      groupLayout: { values: [row, grid], chosenBy: app }
    sizes: { steps: [sm, md, lg], default: md, bar: control }
    states: [image, initials fallback, skeleton]
    grammarMayChange: [ring, fallback paint]
    dna: [DNA-COMMON-AVATAR-RAMP, DNA-COMMON-AVATAR-GROUP-ONE-SIZE, DNA-COMMON-AVATAR-INITIALS, DNA-COMMON-AGENT-NAMED]

  - id: mascot
    ui: ui/components/mascot.md
    renderers: [Mascot]
    vendorParity: []                              # no HeroUI part: Common's Image under a sized box
    slots: [src, alt, "provenance: assetSlot, assetSha256, assetPrompt (Image and MediaFrame's AssetSlotProps)"]
    variants:
      meaning: { values: ["decorative (alt empty, aria-hidden)", "meaningful (a non-empty alt names it)"], chosenBy: app, default: decorative }
      visibility: { values: [wide, always], meaning: { wide: "a hero is absent below 64rem", always: "a hero is kept, as the lg box" }, chosenBy: app, default: wide }
    sizes: { steps: [sm, md, lg, hero], default: md, values: { sm: --grammar-mascot-sm 96px, md: --grammar-mascot-md 160px, lg: --grammar-mascot-lg 240px, hero: "fills its host's height up to --grammar-mascot-hero-max 30rem" }, compact: "below 48rem lg draws md and md draws sm" }
    states: ["loading (transparent, no plate)", loaded, "error (the Image's fallback)"]
    grammarMayChange: ["nothing: fit contain, the transparent ground with no plate, and the scale are Common's"]
    dna: []

  - id: backdrop
    ui: ui/components/backdrop.md
    renderers: [Backdrop]
    vendorParity: []                              # no HeroUI part: a Common region
    slots: ["children: the brand copy (logo, heading, tagline)", "artwork: decorative, usually a hero Mascot"]
    variants:
      accentCorner: { values: [start-start, start-end, end-start, end-end], chosenBy: app, meaning: "that one logical corner at --grammar-accent-corner; the others square" }
    sizes: { fills: "its host's block size" }
    states: []
    grammarMayChange: ["nothing: the tint is the family's accentSoft, the inset and the accent radius are Common's"]
    dna: [DNA-COMMON-BACKDROP-GROUND, DNA-COMMON-ACCENT-CORNER]
    lint: [starci-grammar/generated-art-in-mascot-or-media-frame, starci-grammar/mascot-asset-slot-required]

  - id: shell
    ui: ui/composition.md
    renderers: [WorkspaceShell, TopBar, NavigationFeatureNav, Sidebar, PageContainer, PrimaryRailLayout]
    vendorParity: [drawer, list-box]
    slots: ["header: identity, navigation, actions", navigation, compactHeader, primary, floatingLayer]
    variants:
      viewport: { values: [fixed, flow], chosenBy: app kind (workspace or public site) }
      sidebarPresentation: { values: [rail, drawer], chosenBy: viewport width }
    sizes: every bar control is size control
    states: [sidebar expanded, sidebar collapsed, drawer open]
    grammarMayChange: [bar and sidebar paint]
    dna: [DNA-COMMON-BAR-ONE-HEIGHT, DNA-COMMON-NO-BOTTOM-TABS, DNA-COMMON-ONE-SHELL, DNA-COMMON-ONE-SCROLL-OWNER]

  - id: page-header
    ui: ui/components/page-header.md
    renderers: [PageHeader]
    vendorParity: [breadcrumbs, tabs, separator]
    slots: ["breadcrumbs: label, items", title, description, meta, status, mark, actions, "tabs: label, items, selectedKey"]
    variants:
      tabs: { values: [none, page tabs on the separator], chosenBy: app from tabs.choose.level:page }
      measure: { values: [reading, product, full], chosenBy: app, equals: the PageContainer of the content below }
    sizes: none; controls in actions keep the ramp, a tab bar lands on md
    states: [ready, skeleton]
    grammarMayChange: [band paint, separator paint and weight, title weight]
    dna: [DNA-COMMON-PAGE-HEADER-BAND, DNA-COMMON-PAGE-HEADER-INSET, DNA-COMMON-PAGE-HEADER-ONE-H1, DNA-COMMON-PAGE-HEADER-SEPARATOR, DNA-COMMON-PAGE-HEADER-TABS-ON-SEPARATOR, DNA-CORE-PAGE-HEADER-HAIRLINE, DNA-OFFSET-POP-PAGE-HEADER-INK-RULE]

  - id: page
    ui: ui/components/page-header.md
    renderers: [Page]
    vendorParity: [breadcrumbs, tabs, separator]
    slots: ["header: the page-header slots as data (breadcrumbs, title, description, meta, status, mark, actions, tabs); in bleed the breadcrumbs alone", children]
    variants:
      chrome: { values: [standard, bleed], chosenBy: app from page-header.choose.head (bleed for an app surface) }
      header: { values: [none, the page header band, the trail alone (bleed only)], chosenBy: app }
      measure: { values: [reading, product, full], chosenBy: app, equals: the header's content measure }
    sizes: none
    states: [ready, skeleton (passed to the header)]
    grammarMayChange: [the header band's paint (page-header)]
    dna: [DNA-COMMON-PAGE-HEADER-FIRST, DNA-COMMON-PAGE-BODY-EDGES, DNA-COMMON-PAGE-BODY-GAP, DNA-COMMON-PAGE-BODY-CLIP, DNA-COMMON-PAGE-BLEED-BODY]

  - id: diagram
    ui: ui/components/diagram.md
    renderers: [MermaidDiagram, FlowGraph]
    vendorParity: [skeleton, alert]
    slots: ["MermaidDiagram: source, label, errorTitle", "FlowGraph: label, nodes (label, description, tone, size, shape, count, href), edges (source, target, label), headers"]
    variants:
      height: { values: [sm, md, lg], chosenBy: app from the drawing }
      nodeShape: { values: [stadium, rect, round, diamond, circle], chosenBy: app from the node's meaning }
      layout: { values: [radial, layered, manual], chosenBy: app }
    sizes: none
    states: [loading (skeleton at the reserved box), ready, error (title and the source as code, in the region), empty (FlowGraph)]
    grammarMayChange: [frame, node and edge paint through tokens]
    dna: [DNA-COMMON-DIAGRAM-LOADING-BOX, DNA-COMMON-DIAGRAM-NAMED, DNA-COMMON-DIAGRAM-ERROR-SOURCE, DNA-COMMON-FLOW-EDGE-LABEL-SPOKEN]

# The DNA: every constraint a grammar keeps, each one law with the measurement a DNA gate performs on a render.
# Layer 1 of grammars/README.md#three-layers: a DNA entry is a constraint, never a judgement; a choice rule moves here
# only once it has a measure. A gate run for grammar <id> measures `common` plus `<id>`; roles[].dna lists the ids.
mustKeep:
  shape:
    id: "DNA-<SCOPE>-<NAME>, SCOPE is COMMON (held by every grammar), CORE or OFFSET-POP; stable, a closed id is never reused"
    role: "a roles[].id, a list of them, or root"
    law: "the constraint as one present-tense sentence"
    measure: "one measure object (fields below)"
    owner: "who fixes the law or its value: a ruling id (decisions/rulings.yaml), a decision id (decisions/open-grammar.md), a package path"
    followUp: "optional: the open decision whose code change makes the law hold; the gate reports the entry red until it lands"
  measureFields:
    kind:
      box: "border-box geometry of each match in CSS px: width, height, top, bottom, left, right; inner-left and inner-right are the padding box (inside the border)"
      style: "computed style of each match (and of `pseudo` when given); metric is a CSS property or a derived metric"
      attr: "an attribute value of each match"
      relation: "a metric of each match against `ref`: { within: ancestor selector (closest), select: a selector inside it, self (the ancestor) or previous (the previous sibling matching select), metric, offset }; the compared value is ref + offset"
      uniform: "every match inside one `scope` has the same metric value"
      count: "the number of matches inside each `scope` (the family root when absent), after the `where` filter; no metric"
      seams: "the visible horizontal rules between consecutive `rows` inside each match; metric count (compared with rows - 1) or inset-inline (each rule's distance from the match's padding box, both sides)"
      a11y: "accessibility-tree property of each match: role, name, description, focusable, controls (the id it controls resolves to `value`)"
      text: "rendered text of each match; metric text, first-letter (uppercase or lowercase) or lines (rendered line count)"
      tokens: "custom properties resolved on the family root; metric is a list of names or { contract: <path in this file> }; an order op (> <) compares each name with the next"
      interaction: "`act` steps on each match (press <key>, focus, hover, press, open (the fixture opens the overlay the match belongs to), state <name> (the fixture sets that state), resize <inline-size>), then `then`, a measure on the same match (kind defaults to style) or on `then.select`"
      source: "a static check another gate owns: lint:<rule id>, parity:<mode> or conformance; the DNA gate verifies the check exists and is green"
    select: "a CSS selector evaluated inside .grammar-common-root[data-grammar-family=\"<id>\"]; `document ` prefix means the whole document"
    scope: "optional ancestor selector grouping matches (uniform, count, seams)"
    target: "optional: painted-box measures the painted box resolved from each match instead of the match itself"
    checks: "instead of metric, op and value: a list of { metric, op, value }, every one must hold"
    metric: "one name or a list; every listed metric is held to the same op and value; against a list-valued ref the lists pair element-wise"
    derivedMetrics:
      radius: "border-start-start-radius resolved to px"
      border-width: "the largest of the four border widths"
      shadow-blur: "blur radius of the first box-shadow layer (0 when none)"
      shadow-offset: "x and y offsets of the first box-shadow layer"
      scale: "scale factor of the computed transform matrix (1 when none)"
      translate: "x and y translation of the computed transform matrix"
      hit-area: "the square around the box centre over which elementFromPoint resolves to the match or a descendant"
      focus-rings: "elements in the match's subtree, the match included, that draw a visible outline or a focus box-shadow"
      tabs-look: "pill when the selected tab's .tabs__indicator is at least 80% of the tab's height, else underline"
      painted-box: "the nearest element at or above the match, inside the same component, whose background-color is not transparent"
      contrast: "the WCAG ratio of the match's text colour against its composed ground: its own background composited over every ancestor's up to an opaque one, read as rendered sRGB"
      navigation: "client (history changed, no document load), reload or none"
      scroll-owners-x: "how many elements at or above the match scroll on the inline axis (overflow auto or scroll and content larger than the box)"
      scroll-owners-y: "the same on the block axis"
    op: "= != < <= > >= set (resolves to a non-empty value) matches (a pattern or another value)"
    value: >-
      a literal with its unit; or { token: --name } resolved on the match through a probe so colours compare as computed
      rgb; or { threshold: <key path in ../ui/proof/thresholds.yaml> }; or { vendor: { component, props, metric } }, the
      HeroUI component rendered in the same root with $data-size standing for the match's data-size; or
      { self: <metric>, times: n }; or { count: <selector>, offset: n } (count only); or { rows: n } (seams: the row count
      plus n); or { oneOf: [values] }; or { before: true } (interaction:
      the same metric before `act`); or { fixture: <fact> } that the gate's fixture declares
    where: "optional filter on matches: { metric, op, value }"
    context: "pointer coarse|fine, viewport WxH, theme light|dark, forcedColors active, reducedMotion reduce, state hover|pressed|focus-visible; default light, fine pointer, 1280x800"
    tolerance: "box and relation, default 0.5px"
    cases: "a list of { select, metric?, value } sharing every other field"
    coverage: "an entry with zero matches is not exercised: the gate reports it per id from its fixture and never passes it"

  common:
    # --- size ramp (contract sizes; ruling control-height-40)
    - id: DNA-COMMON-CONTROL-MD
      role: button
      law: An md button or icon button, and every bar control, is 40px tall at every breakpoint.
      measure: { kind: box, select: ':is([data-component="Button"],[data-component="IconButton"]):is([data-size="md"],[data-size="control"]):not([data-width="fill"])', metric: height, op: "=", value: 40px }
      owner: control-height-40
    - id: DNA-COMMON-CONTROL-SM
      role: button
      law: An sm button or icon button is one equal increment below md, 32px.
      measure: { kind: box, select: ':is([data-component="Button"],[data-component="IconButton"])[data-size="sm"]:not([data-width="fill"])', metric: height, op: "=", value: 32px }
      owner: control-height-40; contract sizes.increments
    - id: DNA-COMMON-CONTROL-LG
      role: button
      law: An lg button or icon button is one equal increment above md, 48px.
      measure: { kind: box, select: ':is([data-component="Button"],[data-component="IconButton"])[data-size="lg"]:not([data-width="fill"])', metric: height, op: "=", value: 48px }
      owner: control-height-40; contract sizes.increments
    - id: DNA-COMMON-CONTROL-FILL
      role: button
      law: A full-width button holds its step as a floor at every breakpoint, md 40px, sm 32px and lg 48px; only a wrapped label grows it.
      measure:
        kind: box
        metric: height
        op: ">="
        cases:
          - { select: '[data-component="Button"][data-width="fill"]:is([data-size="md"],[data-size="control"])', value: 40px }
          - { select: '[data-component="Button"][data-width="fill"][data-size="sm"]', value: 32px }
          - { select: '[data-component="Button"][data-width="fill"][data-size="lg"]', value: 48px }
      owner: control-height-40
    - id: DNA-COMMON-ICON-BUTTON-SQUARE
      role: button
      law: An icon button is as wide as it is tall at its step.
      measure: { kind: box, select: '[data-component="IconButton"]', metric: width, op: "=", value: { self: height, times: 1 } }
      owner: contract roles.button
    - id: DNA-COMMON-FIELD-MD
      role: [input, select, copy-field]
      law: Every single-line field box (input, select trigger, combo box, search, number, date and time field, copy field) is as tall as an md control, 40px.
      measure: { kind: box, select: ':is(.starci-core-input-field,.starci-core-select-trigger,.starci-core-combo-box-group,.starci-core-search-field-group,.starci-core-number-field-group,.starci-core-date-group,.starci-core-copy-field-group)', metric: height, op: "=", value: 40px }
      owner: control-height-40
    - id: DNA-COMMON-SEGMENTED-RAMP
      role: segmented-control
      law: A segmented control sits on the ramp, md 40px and sm 32px.
      measure:
        kind: box
        metric: height
        op: "="
        cases:
          - { select: '[data-component="SegmentedControl"][data-grammar-segmented-size="md"]', value: 40px }
          - { select: '[data-component="SegmentedControl"][data-grammar-segmented-size="sm"]', value: 32px }
      owner: control-height-40
      followUp: D-3
    - id: DNA-COMMON-TABS-BAR-MD
      role: tabs
      law: A tab bar, pill or underline, lands on the md height without a size prop.
      measure: { kind: box, select: '[data-component="Tabs"] .tabs__list-container', metric: height, op: "=", value: 40px }
      owner: contract roles.tabs
    - id: DNA-COMMON-AVATAR-RAMP
      role: avatar
      law: An avatar is on the control ramp, sm 32px, md 40px, lg 48px and the bar avatar 40px.
      measure:
        kind: box
        metric: [width, height]
        op: "="
        cases:
          - { select: '[data-component="Avatar"][data-grammar-avatar-size="sm"]', value: 32px }
          - { select: '[data-component="Avatar"][data-grammar-avatar-size="md"]', value: 40px }
          - { select: '[data-component="Avatar"][data-grammar-avatar-size="lg"]', value: 48px }
          - { select: '[data-component="Avatar"][data-grammar-avatar-size="control"]', value: 40px }
      owner: control-height-40
    - id: DNA-COMMON-BAR-ONE-HEIGHT
      role: shell
      law: Every control in a bar has one height, the md height.
      measure: { kind: uniform, scope: '[data-component="TopBar"]', select: ':is([data-component="Button"],[data-component="IconButton"],[data-component="Avatar"],[data-component="SegmentedControl"],[data-component="Switch"],.starci-core-search-field-group)', metric: height, op: "=", value: 40px }
      owner: control-height-40; contract sizes.control
    - id: DNA-COMMON-BADGE-BELOW-RAMP
      role: chip
      law: A Badge and a StatusDot are labels below the control ramp, shorter than an sm control.
      measure: { kind: box, select: ':is([data-component="Badge"],[data-component="StatusDot"])', metric: height, op: "<", value: 32px }
      owner: contract sizes.labels
    - id: DNA-COMMON-TARGET-COARSE
      role: button
      law: On a coarse pointer every pressable part has a hit area of at least the coarse floor, without redrawing its box.
      measure: { kind: box, context: { pointer: coarse, viewport: 375x812 }, select: ':is([data-component="Button"],[data-component="IconButton"],[data-component="TextAction"],[role="tab"],[role="option"],[role="radio"],[role="checkbox"],[role="switch"],[role="menuitem"],[role="row"][data-grammar-tag])', metric: hit-area, op: ">=", value: { threshold: target.coarse.min } }
      owner: contract sizes.target; ui/scale.md
      followUp: D-4
    - id: DNA-COMMON-TARGET-FINE
      role: button
      law: On a fine pointer every pressable part has a hit area of at least the fine floor.
      measure: { kind: box, context: { pointer: fine }, select: ':is([data-component="Button"],[data-component="IconButton"],[data-component="TextAction"],[role="tab"],[role="option"],[role="radio"],[role="checkbox"],[role="switch"],[role="menuitem"])', metric: hit-area, op: ">=", value: { threshold: target.fine.min } }
      owner: contract sizes.target
    # --- root, tokens and rhythm
    - id: DNA-COMMON-TOKENS-BOUND
      role: root
      law: Every contract colour role resolves on the grammar root; none falls through to the host theme.
      measure: { kind: tokens, metric: { contract: tokens.colour }, op: set }
      owner: contract tokens
      followUp: C-3, C-4
    - id: DNA-COMMON-RHYTHM-MONOTONIC
      role: root
      law: The rhythm tokens are strictly ordered, region gap above section gap above row gap above inline gap.
      measure: { kind: tokens, metric: [--grammar-region-gap, --grammar-section-gap, --grammar-row-gap, --grammar-inline-gap], op: ">" }
      owner: "@starci/grammar src/common/spacing.ts; ui/presentation.md (Space)"
    - id: DNA-COMMON-ONE-TOASTER
      role: alert
      law: A document holds at most one Toaster, inside the grammar root.
      measure: { kind: count, select: 'document [data-component="Toaster"]', op: "<=", value: 1 }
      owner: grammars/common.md#one-root
    - id: DNA-COMMON-TOASTER-LIVE
      role: alert
      law: The Toaster owns exactly one polite and one assertive live region.
      measure:
        kind: count
        scope: '[data-component="Toaster"]'
        op: "="
        cases:
          - { select: '[data-grammar-toaster-live="polite"][aria-live="polite"]', value: 1 }
          - { select: '[data-grammar-toaster-live="assertive"][aria-live="assertive"]', value: 1 }
      owner: grammars/common.md#one-root
    - id: DNA-COMMON-OVERLAY-IN-ROOT
      role: [dialog, menu, select]
      law: Every open overlay (dialog, alert dialog, drawer, popover, menu, listbox popover, tooltip) renders inside the grammar root.
      measure: { kind: count, select: 'document :is([role="dialog"],[role="alertdialog"],[role="menu"],[role="listbox"],[role="tooltip"]):not(.grammar-common-root[data-grammar-family] *)', op: "=", value: 0 }
      owner: grammars/common.md#one-root
    - id: DNA-COMMON-NO-BOTTOM-TABS
      role: shell
      law: The shell has no bottom tab bar; on a phone the navigation is the drawer.
      measure: { kind: count, context: { viewport: 375x812 }, select: '[data-component="BottomNav"]', op: "=", value: 0 }
      owner: D-13; lint no-shell-bottom-tabs
    - id: DNA-COMMON-ONE-SHELL
      role: shell
      law: One shell owns the frame, the bar and the mobile drawer.
      measure: { kind: count, select: 'document [data-component="WorkspaceShell"]', op: "<=", value: 1 }
      owner: contract roles.shell
    - id: DNA-COMMON-ONE-SCROLL-OWNER
      role: shell
      law: One owner scrolls each axis; no scrolling element sits inside another that scrolls on the same axis.
      measure: { kind: style, select: '*', metric: [scroll-owners-x, scroll-owners-y], op: "<=", value: 1 }
      owner: contract roles.shell; OVERFLOW-3
    - id: DNA-COMMON-VENDOR-PARITY
      role: root
      law: Every wrapper keeps HeroUI's parts, required parts, roles, keyboard, focus, props, closed values and defaults.
      measure: { kind: source, check: "parity:always" }
      owner: grammar-vendor-parity
    # --- surfaces and cards
    - id: DNA-COMMON-NO-RAISED-SURFACE-IN-SURFACE
      role: card
      law: A surface inside another surface takes the nested depth; two raised surfaces never stack.
      measure: { kind: count, select: '[data-grammar-nesting="surface"] [data-grammar-nesting="surface"] [data-grammar-surface-depth="top"]', op: "=", value: 0 }
      owner: surfacecard-always-painted; src/core/surfaceContext.tsx
    - id: DNA-COMMON-CARD-LABEL-ABOVE
      role: card
      law: A card's label row sits above the card's content frame, never beside it; whether it sits inside or outside the painted material is each grammar's decision (ruling card-label-placement-per-grammar).
      measure: { kind: relation, select: '[data-component="SurfaceCard"] > [data-grammar-surface-label]', metric: bottom, op: "<=", ref: { within: '[data-component="SurfaceCard"]', select: '[data-grammar-surface-content]', metric: top } }
      owner: contract roles.card
    - id: DNA-COMMON-CARD-LABEL-HEADING
      role: card
      law: A card label is a heading and names its card.
      measure: { kind: a11y, select: '[data-grammar-surface-label] > :first-child', metric: role, op: "=", value: heading }
      owner: contract roles.card
    - id: DNA-COMMON-LISTCARD-LABEL-OUTSIDE
      role: card
      law: A list card's label row sits on the page above the list shell, outside its material.
      measure: { kind: relation, select: '[data-component="SurfaceListCard"] > [data-grammar-surface-label]', metric: bottom, op: "<=", ref: { within: '[data-component="SurfaceListCard"]', select: '[data-grammar-surface="true"]', metric: top } }
      owner: R318/case-1
    - id: DNA-COMMON-LISTCARD-LABEL-UNPAINTED
      role: card
      law: A list card's label row carries no fill, border or shadow of its own.
      measure:
        kind: style
        select: '[data-component="SurfaceListCard"] > [data-grammar-surface-label]'
        checks: [{ metric: background-color, op: "=", value: "rgba(0, 0, 0, 0)" }, { metric: box-shadow, op: "=", value: none }, { metric: border-width, op: "=", value: 0px }]
      owner: R318/case-1
    - id: DNA-COMMON-ONE-HIGHLIGHT
      role: card
      law: A view holds at most one highlighted card.
      measure: { kind: count, select: 'document [data-grammar-highlight="true"]', op: "<=", value: 1 }
      owner: contract roles.card variants.highlight
      followUp: G-9
    - id: DNA-COMMON-DIVIDER-FULL-BLEED
      role: card
      law: A horizontal divider runs the full inner width of its surface, inline inset 0px on both sides.
      measure: { kind: relation, select: '[data-component="Divider"][data-grammar-divider="bare"][data-grammar-divider-orientation="horizontal"]', metric: [left, right], op: "=", ref: { within: '[data-grammar-frame="bounded"]', select: self, metric: [inner-left, inner-right] } }
      owner: divider-full-bleed
    - id: DNA-COMMON-SOFT-GROUND
      role: card
      law: A soft card's ground is the family's accent-soft tint.
      measure: { kind: style, select: '[data-component="SurfaceCard"] > [data-grammar-surface-treatment="soft"]', metric: background-color, op: "=", value: { token: --accent-soft } }
      owner: surfacecard-soft-treatment
    - id: DNA-COMMON-TREATMENT-TEXT-CONTRAST
      role: card
      law: In every SurfaceCard treatment and theme, a step number reads against its own circle and text reads against the card's ground.
      measure:
        kind: style
        metric: contrast
        op: ">="
        value: { threshold: contrast.text }
        cases:
          - { select: '[data-grammar-surface-treatment] [data-component="Stepper"] [data-grammar-step-marker]' }
          - { select: '[data-grammar-surface-treatment] :is([data-component="Text"], [data-grammar-section-header] :is(h2, h3, p))' }
      owner: surfacecard-soft-treatment; COLOR-5; story Navigation & Data / Stepper on every treatment, Surfaces / Soft surface card
    - id: DNA-COMMON-ACCENT-CORNER
      role: card
      law: The corner a SurfaceCard or MediaFrame names in accentCorner is drawn at the Common accent radius.
      measure: { kind: style, select: '[data-grammar-accent-corner="end-end"]', metric: border-end-end-radius, op: "=", value: { token: --grammar-accent-corner } }
      owner: accent-corner
    - id: DNA-COMMON-BACKDROP-GROUND
      role: backdrop
      law: A Backdrop's ground is the family's accent-soft tint, with no border and no shadow.
      measure: { kind: style, select: '[data-component="Backdrop"]', metric: background-color, op: "=", value: { token: --accent-soft } }
      owner: backdrop
    # --- lists
    - id: DNA-COMMON-LIST-SEAMS
      role: list
      law: n rows of a list are divided by exactly n-1 seams, or by gap and no seam.
      measure: { kind: seams, select: '[data-grammar-list="true"]', rows: ':is([data-grammar-row],[data-grammar-list-item],[role="option"])', metric: count, op: "=", value: { oneOf: [{ rows: -1 }, 0] } }
      owner: contract roles.list; BOUNDARY-3
    - id: DNA-COMMON-SEAM-FULL-BLEED
      role: list
      law: Every seam between rows runs the list's full inner width, inline inset 0px.
      measure: { kind: seams, select: '[data-grammar-list="true"]', rows: ':is([data-grammar-row],[data-grammar-list-item],[role="option"])', metric: inset-inline, op: "=", value: 0px }
      owner: divider-full-bleed
    - id: DNA-COMMON-ROW-DESCRIPTION-ONE-LINE
      role: list
      law: A static or entity row's description renders one line.
      measure: { kind: text, select: '.starci-core-list-row-description', metric: lines, op: "<=", value: 1 }
      owner: item-description-one-line
    - id: DNA-COMMON-OPTION-DESCRIPTION-WRAPS
      role: list
      law: A list box option's description wraps unless the list sets descriptionLines.
      measure: { kind: style, select: '[data-component="ListBox"] [data-grammar-item-description]:not([data-grammar-description-lines="1"],[data-grammar-description-lines="2"],[data-grammar-description-lines="3"])', metric: -webkit-line-clamp, op: "=", value: none }
      owner: contract roles.list
    - id: DNA-COMMON-TABLE-ROW-LINK
      role: list
      law: A table row with href is one link that navigates through the root's router, without a document load.
      measure: { kind: interaction, select: '[data-grammar-table-row-link="true"]', act: [focus, press Enter], then: { metric: navigation, op: "=", value: client } }
      owner: contract roles.list; grammars/common.md#one-root
    - id: DNA-COMMON-TABLE-FOLD
      role: list
      law: On a narrow table the low-priority columns fold into the first column, so only high-priority column headers remain.
      measure: { kind: interaction, select: '[data-component="DataTable"]', act: [resize 600px], then: { select: '[role="columnheader"]', kind: count, op: "=", value: { fixture: highPriorityColumns } } }
      owner: contract roles.list
    # --- buttons and groups
    - id: DNA-COMMON-PENDING-KEEPS-BOX
      role: button
      law: A pending button keeps its box and its accessible name and refuses a second press.
      measure: { kind: interaction, select: '[data-component="Button"]', act: [state pending], then: { metric: [width, height, name], op: "=", value: { before: true } } }
      owner: contract roles.button; CTA-3
    - id: DNA-COMMON-SKELETON-CORNER
      role: button
      law: A button skeleton takes the corner of the button it stands for.
      measure: { kind: style, select: '[data-component="Button"][data-loading="true"]', metric: radius, op: "=", value: { vendor: { component: Button, props: { size: $data-size }, metric: radius } } }
      owner: buttons-pill
    - id: DNA-COMMON-DISABLED-REASON
      role: button
      law: A disabled button's reason is its accessible description and shows in a tooltip on hover and keyboard focus.
      measure: { kind: interaction, select: '[data-component="Button"]:is([disabled],[data-disabled="true"],[aria-disabled="true"])', act: [focus], then: { select: 'document [role="tooltip"]', kind: text, metric: text, op: "=", value: { fixture: disabledReason } } }
      owner: contract roles.button
    - id: DNA-COMMON-BUTTONGROUP-JOINED
      role: button-group
      law: Buttons of a horizontal group touch with no gap between them.
      measure: { kind: relation, select: '[data-component="ButtonGroup"][data-grammar-orientation="horizontal"] [data-component="Button"] + [data-component="Button"]', metric: left, op: "<=", ref: { within: '[data-component="ButtonGroup"]', select: previous, metric: right } }
      owner: contract roles.button-group; vendor/parity.yaml button-group
    - id: DNA-COMMON-BUTTONGROUP-INNER-CORNERS
      role: button-group
      law: The inner corners of a horizontal group are square.
      measure: { kind: style, select: '[data-component="ButtonGroup"][data-grammar-orientation="horizontal"] [data-component="Button"] + [data-component="Button"]', metric: [border-start-start-radius, border-end-start-radius], op: "=", value: 0px }
      owner: vendor/parity.yaml button-group
    - id: DNA-COMMON-BUTTONGROUP-NO-PRESS-SCALE
      role: button-group
      law: A button inside a group does not scale when pressed.
      measure: { kind: style, context: { state: pressed }, select: '[data-component="ButtonGroup"] [data-component="Button"]', metric: scale, op: "=", value: 1 }
      owner: vendor/parity.yaml button-group
    - id: DNA-COMMON-BUTTONGROUP-ONE-INTENT
      role: button-group
      law: Every button of a group has one paint, because a group holds peers of one intent.
      measure: { kind: uniform, scope: '[data-component="ButtonGroup"]', select: '[data-component="Button"]', metric: [background-color, color], op: "=" }
      owner: CTA-1/case-7
    - id: DNA-COMMON-ONE-ACCENT-FILL
      role: button
      law: A view shows at most budgets.commitPerView buttons in the accent fill, the commit; the page behind an open modal does not count.
      measure: { kind: count, select: 'document [data-component="Button"]:not([inert] *)', where: { metric: background-color, op: "=", value: { token: --accent } }, op: "<=", value: { threshold: budgets.commitPerView.max } }
      owner: CTA-1; lint single-commit-per-render
    # --- tabs, segmented control, fields
    - id: DNA-COMMON-TABS-BY-LAYER
      role: tabs
      law: Tabs outside a painted surface draw the underline and tabs inside a surface draw the pill.
      measure:
        kind: style
        metric: tabs-look
        op: "="
        cases:
          - { select: '[data-component="Tabs"]:not([data-grammar-nesting="surface"] *)', value: underline }
          - { select: '[data-grammar-nesting="surface"] [data-component="Tabs"]', value: pill }
      owner: D-2; UI-9
      followUp: C-1
    - id: DNA-COMMON-TABS-INDICATOR
      role: tabs
      law: A tab bar draws exactly one indicator.
      measure: { kind: count, scope: '[data-component="Tabs"]', select: '.tabs__indicator', op: "=", value: 1 }
      owner: vendor/parity.yaml tabs
    - id: DNA-COMMON-TABS-OWN-PANEL
      role: tabs
      law: Each tab controls its own panel.
      measure: { kind: a11y, select: '[data-component="Tabs"] [role="tab"]', metric: controls, op: "=", value: tabpanel }
      owner: vendor/parity.yaml tabs
    - id: DNA-COMMON-TABS-ROVING
      role: tabs
      law: Arrow keys move focus between tabs.
      measure: { kind: interaction, select: '[data-component="Tabs"] [role="tab"][aria-selected="true"]', act: [focus, press ArrowRight], then: { select: 'document :focus', kind: a11y, metric: role, op: "=", value: tab } }
      owner: vendor/parity.yaml tabs
    - id: DNA-COMMON-SEGMENTED-RADIO
      role: segmented-control
      law: A segmented control is a radio group with exactly one checked segment.
      measure: { kind: count, scope: '[data-component="SegmentedControl"]', select: '[role="radio"][aria-checked="true"]', op: "=", value: 1 }
      owner: STATE-6/case-5
    - id: DNA-COMMON-FIELD-BY-LAYER
      role: [input, select, copy-field]
      law: A field on the canvas takes the primary treatment and a field inside a surface the secondary one, never by app choice.
      measure:
        kind: attr
        metric: data-grammar-variant
        op: "="
        cases:
          - { select: ':is([data-component="Input"],[data-component="Select"],[data-component="SearchField"],[data-component="NumberField"],[data-component="Textarea"],[data-component="CopyField"]):not([data-grammar-nesting="surface"] *)', value: primary }
          - { select: '[data-grammar-nesting="surface"] :is([data-component="Input"],[data-component="Select"],[data-component="SearchField"],[data-component="NumberField"],[data-component="Textarea"],[data-component="CopyField"])', value: secondary }
      owner: R318/case-1; UI-10
    - id: DNA-COMMON-FIELD-NAME-IS-LABEL
      role: [input, select]
      law: A field's accessible name is its visible label, never its placeholder.
      measure: { kind: a11y, select: ':is(input,textarea,[role="combobox"]):is([data-component="Input"] *,[data-component="Textarea"] *,[data-component="Select"] *,[data-component="ComboBox"] *,[data-component="SearchField"] *,[data-component="NumberField"] *)', metric: name, op: "=", value: { fixture: label } }
      owner: contract roles.input; A11Y-1
    - id: DNA-COMMON-FIELD-ERROR-DESCRIBES
      role: [input, select]
      law: An invalid field's error renders in its own slot and is part of its accessible description.
      measure: { kind: a11y, select: '[aria-invalid="true"]', metric: description, op: matches, value: { fixture: errorMessage } }
      owner: FEEDBACK-1
    - id: DNA-COMMON-FIELD-ONE-RING
      role: input
      law: A focused single-line field shows exactly one focus ring, on the field frame.
      measure: { kind: interaction, select: ':is([data-component="Input"],[data-component="Select"],[data-component="SearchField"],[data-component="NumberField"],[data-component="ComboBox"])', act: [focus], then: { metric: focus-rings, op: "=", value: 1 } }
      owner: FOCUS-1/case-6
    - id: DNA-COMMON-FIELD-ANATOMY-ORDER
      role: [input, select, copy-field]
      law: A field draws HeroUI's order, label, control, description, error; its description is standing guidance under the control, never between the label and the control.
      measure:
        kind: relation
        select: ':is([data-component="Input"],[data-component="Field"],[data-component="Textarea"],[data-component="SearchField"],[data-component="NumberField"],[data-component="DateField"],[data-component="TimeField"],[data-component="FileDropzone"],[data-component="Select"],[data-component="ComboBox"],[data-component="DatePicker"],[data-component="DateRangePicker"],[data-component="CopyField"]) [data-grammar-field-description]:not([data-grammar-field-control] *)'
        metric: top
        op: ">="
        ref: { within: ':is([data-component="Input"],[data-component="Field"],[data-component="Textarea"],[data-component="SearchField"],[data-component="NumberField"],[data-component="DateField"],[data-component="TimeField"],[data-component="FileDropzone"],[data-component="Select"],[data-component="ComboBox"],[data-component="DatePicker"],[data-component="DateRangePicker"],[data-component="CopyField"])', select: ':is([data-grammar-field-control="true"],[data-grammar-input-control="true"])', metric: bottom }
      owner: field-anatomy-order; vendor/parity.yaml textfield
    - id: DNA-COMMON-FIELD-ROW-CONTROL-LINE
      role: [input, select, copy-field]
      law: The fields of one FormGrid row laid out in columns start their control boxes on one line, whatever label, description or error a neighbour carries.
      measure: { kind: uniform, scope: '[data-component="FormGrid"] [data-grammar-form-grid-row]', select: ':is([data-grammar-field-control="true"],[data-grammar-input-control="true"]):not(:is([data-grammar-field-control="true"],[data-grammar-input-control="true"]) *)', metric: top }
      owner: field-anatomy-order
    # --- copy field
    - id: DNA-COMMON-COPYFIELD-MASKED
      role: copy-field
      law: A masked CopyField never renders its clear value; it shows bullets and at most the last four characters, and opens no full-value tooltip.
      measure: { kind: text, select: '[data-component="CopyField"][data-grammar-copy-masked="true"] [data-grammar-copy-value]', metric: text, op: matches, value: '^•{8}.{0,4}$' }
      owner: copy-field
    - id: DNA-COMMON-COPYFIELD-TAIL
      role: copy-field
      law: A CopyField value gives up its middle, never its end; the tail stays whole before the copy action.
      measure: { kind: relation, select: '[data-component="CopyField"] [data-grammar-copy-tail]', metric: right, op: "<=", ref: { within: '[data-component="CopyField"]', select: '[data-grammar-copy-action]', metric: left } }
      owner: copy-field
    # --- chips and status dots
    - id: DNA-COMMON-CHIP-NOT-TARGET
      role: chip
      law: A Badge and a StatusDot with text are labels, not focusable or pressable.
      measure: { kind: a11y, select: ':is([data-component="Badge"],[data-component="StatusDot"][data-variant="text"])', metric: focusable, op: "=", value: false }
      owner: contract roles.chip
    - id: DNA-COMMON-CHIP-LABEL-UPPERCASE
      role: chip
      law: A chip label's first letter renders uppercase.
      measure: { kind: text, select: ':is([data-component="Badge"],[data-component="StatusDot"][data-variant="text"],[data-grammar-tag])', metric: first-letter, op: "=", value: uppercase }
      owner: lint R322; contract roles.chip
    - id: DNA-COMMON-STATUSDOT-CHIP-PARITY
      role: chip
      law: A StatusDot with text has the padding and height of the HeroUI soft Chip of the same size.
      measure: { kind: style, select: '[data-component="StatusDot"][data-variant="text"]', metric: [padding-inline-start, padding-inline-end, height], op: "=", value: { vendor: { component: Chip, props: { variant: soft, size: $data-size }, metric: [padding-inline-start, padding-inline-end, height] } } }
      owner: contract roles.chip
    - id: DNA-COMMON-STATUSDOT-GAP
      role: chip
      law: A StatusDot's dot sits 4px before its text.
      measure: { kind: relation, select: '[data-component="StatusDot"][data-variant="text"] .starci-core-status-dot-label', metric: left, op: "=", ref: { within: '[data-component="StatusDot"]', select: '[data-slot="status-dot-mark"]', metric: right, offset: 4px } }
      owner: contract roles.chip
    - id: DNA-COMMON-DOT-SIZE
      role: chip
      law: Every status dot, in every variant, is the one dot-size token square.
      measure: { kind: box, select: '[data-slot="status-dot-mark"]', metric: [width, height], op: "=", value: { token: --starci-core-status-dot-size } }
      owner: contract roles.chip
    - id: DNA-COMMON-DOT-NAMED
      role: chip
      law: A dot without text is named by its aria-label and shows that name in a tooltip on hover and focus.
      measure: { kind: interaction, select: '[data-component="StatusDot"]:is([data-variant="static"],[data-variant="echo"])', act: [focus], then: { select: 'document [role="tooltip"]', kind: text, metric: text, op: "=", value: { fixture: ariaLabel } } }
      owner: contract roles.chip
    - id: DNA-COMMON-ECHO-LIGHT-STOP
      role: chip
      law: The echo ring is painted in the tone's light stop.
      measure: { kind: style, select: '[data-slot="status-dot-mark"][data-echo="true"]', pseudo: "::after", metric: background-color, op: "=", value: { token: --starci-core-status-dot-light } }
      owner: contract roles.chip
    - id: DNA-COMMON-ECHO-REDUCED-MOTION
      role: chip
      law: Under reduced motion the echo ring is not drawn.
      measure: { kind: style, context: { reducedMotion: reduce }, select: '[data-slot="status-dot-mark"][data-echo="true"]', pseudo: "::after", metric: display, op: "=", value: none }
      owner: contract roles.chip
    - id: DNA-COMMON-TAG-REMOVE
      role: chip
      law: A removable tag carries one remove button of its own.
      measure: { kind: count, scope: '[data-component="TagGroup"][data-grammar-tag-removable="true"] [data-grammar-tag]', select: ':is(button,[role="button"])', op: "=", value: 1 }
      owner: vendor/parity.yaml tag
    - id: DNA-COMMON-TAG-REORDER-KEYS
      role: chip
      law: A reorderable tag moves with Alt and an arrow key, and the move is announced politely.
      measure: { kind: interaction, select: '[data-grammar-tag-reorderable="true"] [data-grammar-tag]', act: [focus, press Alt+ArrowRight], then: { select: 'document [aria-live="polite"]', kind: text, metric: text, op: set } }
      owner: contract roles.chip
    # --- overlays and menus
    - id: DNA-COMMON-DIALOG-NAMED
      role: dialog
      law: Every modal overlay has an accessible name from its heading and a close control.
      measure: { kind: a11y, select: 'document :is([role="dialog"],[role="alertdialog"])', metric: name, op: set }
      owner: vendor/parity.yaml modal
    - id: DNA-COMMON-DIALOG-ESCAPE
      role: dialog
      law: Escape closes a modal overlay and focus returns to its trigger.
      measure: { kind: interaction, select: '[aria-haspopup="dialog"]', act: [press, press Escape], then: { select: 'document :focus', kind: attr, metric: aria-haspopup, op: "=", value: dialog } }
      owner: vendor/parity.yaml modal; FOCUS-3
    - id: DNA-COMMON-DIALOG-FOCUS-TRAP
      role: dialog
      law: Tab never moves focus out of an open modal overlay.
      measure: { kind: interaction, select: 'document :is([role="dialog"],[role="alertdialog"])', act: [press Tab, press Tab, press Tab, press Tab, press Tab, press Tab], then: { kind: count, select: 'document :is([role="dialog"],[role="alertdialog"]) :focus', op: "=", value: 1 } }
      owner: vendor/parity.yaml modal; FOCUS-3
    - id: DNA-COMMON-ALERTDIALOG-DISMISS-FIRST
      role: dialog
      law: An alert dialog opens with focus on its dismiss button, which comes first; the confirm comes last.
      measure: { kind: interaction, select: 'document [role="alertdialog"]', act: [open], then: { select: '.starci-core-overlay-footer [data-component="Button"]:first-child', kind: a11y, metric: focused, op: "=", value: true } }
      owner: CTA-4
    - id: DNA-COMMON-MENU-SECTIONS
      role: menu
      law: Menu sections are separated by the vendor separator, one fewer than the sections.
      measure: { kind: count, scope: 'document [role="menu"]', select: '[role="separator"]', op: "=", value: { count: '[data-grammar-menu-section]', offset: -1 } }
      owner: vendor/parity.yaml dropdown
    - id: DNA-COMMON-MENU-DANGER
      role: menu
      law: A destructive menu item carries the danger tone.
      measure: { kind: source, check: "lint:starci-grammar/destructive-menu-entry-needs-danger-tone" }
      owner: CTA-4
    # --- alerts, empty states, avatars
    - id: DNA-COMMON-ALERT-SURFACE
      role: alert
      law: An Alert in the surface appearance is drawn on the surface colour; its tone paints only the indicator and the title.
      measure: { kind: style, select: '[data-component="Alert"][data-grammar-appearance="surface"]', metric: background-color, op: "=", value: { token: --surface } }
      owner: alert-white-surface; D-12
    - id: DNA-COMMON-EMPTY-ONE-ACTION
      role: empty-state
      law: An empty notice holds at most one action.
      measure: { kind: count, scope: '[data-component="EmptyNotice"]', select: ':is([data-component="Button"],[data-component="TextAction"])', op: "<=", value: 1 }
      owner: contract roles.empty-state
    - id: DNA-COMMON-AVATAR-GROUP-ONE-SIZE
      role: avatar
      law: Every member of an avatar group has one size.
      measure: { kind: uniform, scope: '[data-component="AvatarGroup"]', select: '[data-component="Avatar"]', metric: [width, height], op: "=" }
      owner: R318/case-1
    - id: DNA-COMMON-AVATAR-INITIALS
      role: avatar
      law: An avatar without an image draws the initials of the first and last words of its name.
      measure: { kind: text, select: '[data-component="Avatar"]:not(:has(img[src]))', metric: text, op: "=", value: { fixture: initials } }
      owner: avatar-default-dicebear-initials
    - id: DNA-COMMON-AGENT-NAMED
      role: avatar
      law: An agent avatar carries the bot badge and an accessible name that says it is an agent.
      measure: { kind: a11y, select: '.starci-core-avatar-agent-anchor [data-component="Avatar"]', metric: name, op: "=", value: { fixture: agentAccessibleName } }
      owner: agent-avatar-initials-bot-badge

    # --- page header (ruling page-header-band)
    - id: DNA-COMMON-PAGE-HEADER-BAND
      role: page-header
      law: The page header is a band painted with the surface over the page background.
      measure: { kind: style, select: '[data-component="PageHeader"]', metric: background-color, op: "=", value: { token: --surface } }
      owner: page-header-band
    - id: DNA-COMMON-PAGE-HEADER-INSET
      role: page-header
      law: The band's content is inset by the page inset inline and the region step at the top, so its edges are the page content's edges.
      measure:
        kind: style
        select: '[data-component="PageHeader"] > [data-component="PageContainer"]'
        checks: [{ metric: padding-inline-start, op: "=", value: { token: --grammar-page-inset } }, { metric: padding-inline-end, op: "=", value: { token: --grammar-page-inset } }, { metric: padding-block-start, op: "=", value: { token: --grammar-region-gap } }]
      owner: page-header-band
    - id: DNA-COMMON-PAGE-HEADER-ONE-H1
      role: page-header
      law: The page header holds exactly one heading, the page's h1.
      measure: { kind: count, scope: '[data-component="PageHeader"]', select: ':is(h1, h2, h3, h4, h5, h6)', op: "=", value: 1 }
      owner: page-header-band; ui/presentation.md FONT-4
    - id: DNA-COMMON-PAGE-HEADER-SEPARATOR
      role: page-header
      law: The band ends in its own separator, which runs the band's full width at its bottom edge, with or without tabs.
      measure: { kind: relation, select: '[data-grammar-page-header-separator] > [data-component="Divider"]', metric: [left, right, bottom], op: "=", ref: { within: '[data-component="PageHeader"]', select: self, metric: [left, right, bottom] } }
      owner: page-header-band
    - id: DNA-COMMON-PAGE-HEADER-TABS-ON-SEPARATOR
      role: page-header
      law: Page tabs in the header stand on its separator; the selected tab's underline lies over it.
      measure: { kind: relation, select: '[data-component="PageHeader"] [role="tab"][aria-selected="true"] .tabs__indicator', metric: bottom, op: "=", ref: { within: '[data-component="PageHeader"]', select: '[data-grammar-page-header-separator] > [data-component="Divider"]', metric: bottom } }
      owner: page-header-band; tabs.choose.level:page

    # --- page (ruling page-frame)
    - id: DNA-COMMON-PAGE-HEADER-FIRST
      role: page
      law: A page's header band is its first child, full width, with no gap above it.
      measure: { kind: relation, select: '[data-component="Page"] > [data-component="PageHeader"]', metric: [left, right, top], op: "=", ref: { within: '[data-component="Page"]', select: self, metric: [left, right, top] } }
      owner: page-frame
    - id: DNA-COMMON-PAGE-BODY-EDGES
      role: page
      law: A standard page body is inset by the page inset inline, so its content edges are the header content's edges.
      measure:
        kind: style
        select: '[data-component="Page"][data-grammar-page-chrome="standard"] > [data-grammar-page-body]'
        checks: [{ metric: padding-inline-start, op: "=", value: { token: --grammar-page-inset } }, { metric: padding-inline-end, op: "=", value: { token: --grammar-page-inset } }]
      owner: page-frame
    - id: DNA-COMMON-PAGE-BODY-GAP
      role: page
      law: The page owns its rhythm, the region step between the band and the body and between the body's sections.
      measure:
        kind: style
        select: ':is([data-component="Page"], [data-component="Page"] > [data-grammar-page-body])'
        metric: row-gap
        op: "="
        value: { token: --grammar-region-gap }
      owner: page-frame
    - id: DNA-COMMON-PAGE-BODY-CLIP
      role: page
      law: Nothing in a standard page body reaches across the gutter; the body clips past its content box.
      measure:
        kind: style
        select: '[data-component="Page"][data-grammar-page-chrome="standard"] > [data-grammar-page-body]'
        checks: [{ metric: overflow-x, op: "=", value: clip }, { metric: overflow-clip-margin, op: matches, value: content-box }]
      owner: page-frame
    - id: DNA-COMMON-PAGE-BLEED-BODY
      role: page
      law: A bleed page is an app surface; it keeps no block padding, and its body no inline gutter and no clip, so the body fills the region and a FillViewport in it keeps the one bottom inset.
      measure:
        kind: style
        select: '[data-component="Page"][data-grammar-page-chrome="bleed"] > [data-grammar-page-body]'
        checks: [{ metric: padding-inline-start, op: "=", value: 0px }, { metric: padding-inline-end, op: "=", value: 0px }, { metric: overflow-x, op: "=", value: visible }]
      owner: page-frame

    # --- diagram (ruling mermaid-diagram)
    - id: DNA-COMMON-DIAGRAM-LOADING-BOX
      role: diagram
      law: A diagram reserves its canvas height in every state, so the loading skeleton and the error take the ready drawing's least box.
      measure:
        kind: box
        metric: height
        op: ">="
        cases:
          - { select: '[data-component="MermaidDiagram"][data-grammar-mermaid-height="sm"] > :first-child', value: 256px }
          - { select: '[data-component="MermaidDiagram"][data-grammar-mermaid-height="md"] > :first-child', value: 384px }
          - { select: '[data-component="MermaidDiagram"][data-grammar-mermaid-height="lg"] > :first-child', value: 512px }
      owner: mermaid-diagram
    - id: DNA-COMMON-DIAGRAM-NAMED
      role: diagram
      law: A drawn diagram is one image named by its label.
      measure: { kind: a11y, select: '[data-grammar-mermaid-state="ready"] [data-grammar-mermaid-canvas] > [role="img"]', metric: name, op: set }
      owner: mermaid-diagram
    - id: DNA-COMMON-DIAGRAM-ERROR-SOURCE
      role: diagram
      law: A source the renderer refuses stays in the diagram's region as code under the error.
      measure: { kind: count, scope: '[data-grammar-mermaid-state="error"]', select: '[data-component="FencedCodeBlock"] code', op: "=", value: 1 }
      owner: mermaid-diagram
    - id: DNA-COMMON-FLOW-EDGE-LABEL-SPOKEN
      role: diagram
      law: Every labelled FlowGraph edge is repeated in the graph's screen-reader edge list.
      measure: { kind: count, scope: '[data-component="FlowGraph"]', select: '[data-grammar-flow-edge-fallback] li', op: "=", value: { count: '.react-flow__edge-text', offset: 0 } }
      owner: mermaid-diagram
  core:
    - id: DNA-CORE-PAGE-HEADER-HAIRLINE
      role: page-header
      law: The page header's separator is a 1px hairline in the separator token.
      measure:
        kind: style
        select: '[data-grammar-page-header-separator] > [data-component="Divider"]'
        checks: [{ metric: height, op: "=", value: 1px }, { metric: background-color, op: "=", value: { token: --separator } }]
      owner: page-header-band
    - id: DNA-CORE-EDGE-TOP
      role: card
      law: A top-depth surface is raised by its shadow and draws no border.
      measure:
        kind: style
        select: '[data-grammar-surface-depth="top"]'
        target: painted-box
        checks: [{ metric: box-shadow, op: "!=", value: none }, { metric: border-width, op: "=", value: 0px }]
      owner: surfacecard-always-painted
    - id: DNA-CORE-EDGE-NESTED
      role: card
      law: A nested surface draws a border and no shadow; border and shadow are never both drawn.
      measure:
        kind: style
        select: '[data-grammar-surface-depth="nested"]'
        target: painted-box
        checks: [{ metric: box-shadow, op: "=", value: none }, { metric: border-width, op: ">=", value: 1px }]
      owner: surfacecard-always-painted
    - id: DNA-CORE-CARD-LABEL-OUTSIDE
      role: card
      law: A labelled card floating in the content flow carries its label as an unpainted row above the card, outside the material; a card that is a docked panel of the layout carries its title inside, as its header (ruling card-label-placement-per-grammar). Measured on floating cards; the panel case is measured once the grammar exposes its placement signal.
      measure:
        kind: style
        op: "="
        cases:
          - { select: '[data-component="SurfaceCard"][data-grammar-surface-labelled="true"]', metric: background-color, value: "rgba(0, 0, 0, 0)" }
          - { select: '[data-component="SurfaceCard"][data-grammar-surface-labelled="true"] > [data-grammar-frame="bounded"]', metric: background-color, value: { token: --surface } }
      owner: grammars/core.md
    - id: DNA-CORE-BUTTON-PILL
      role: button
      law: Every button and its skeleton is a pill, its corner at least half its height.
      measure: { kind: style, select: ':is([data-component="Button"],[data-component="IconButton"])', metric: radius, op: ">=", value: { self: height, times: 0.5 } }
      owner: buttons-pill
    - id: DNA-CORE-ACCENT-TEXT
      role: root
      law: Where the accent is text (a link, the current tab label) it reads the text-safe accent, never the fill accent.
      measure: { kind: style, select: '[data-component="Link"]', metric: color, op: "=", value: { token: --link } }
      owner: grammars/core.md
    - id: DNA-CORE-SEGMENT-SELECTED
      role: segmented-control
      law: The selected segment sits on the soft accent with an accent border.
      measure:
        kind: style
        op: "="
        cases:
          - { select: '[data-component="SegmentedControl"] [role="radio"][aria-checked="true"]', metric: background-color, value: { token: --accent-soft } }
          - { select: '[data-component="SegmentedControl"] [role="radio"][aria-checked="true"]', metric: border-top-color, value: { token: --accent } }
      owner: CTA-1/case-6
    - id: DNA-CORE-ALERT-RAISED
      role: alert
      law: A surface Alert is raised like a top surface, by its shadow and without a border.
      measure: { kind: style, select: '[data-component="Alert"][data-grammar-appearance="surface"]', metric: border-width, op: "=", value: 0px }
      owner: alert-white-surface
    - id: DNA-CORE-PARITY-STRICT
      role: root
      law: core changes HeroUI through tokens only; every other deviation is a ruled override.
      measure: { kind: source, check: "parity:strict" }
      owner: grammar-vendor-parity; repaint-default-heroui-unless-ruled

  offset-pop:
    - id: DNA-OFFSET-POP-PAGE-HEADER-INK-RULE
      role: page-header
      law: The page header closes on the ink rule at the outline width, the rule under the TopBar.
      measure:
        kind: style
        select: '[data-grammar-page-header-separator] > [data-component="Divider"]'
        checks: [{ metric: height, op: "=", value: { token: --offset-pop-outline-width } }, { metric: background-color, op: "=", value: { token: --offset-pop-ink } }]
      owner: page-header-band; grammars/offset-pop.md
    - id: DNA-OFFSET-POP-STICKER
      role: card
      law: A top-depth object wears the ink outline and an unblurred offset shadow down and to the right.
      measure:
        kind: style
        select: '[data-grammar-surface-depth="top"]'
        target: painted-box
        checks: [{ metric: border-width, op: "=", value: { token: --offset-pop-outline-width } }, { metric: shadow-blur, op: "=", value: 0px }, { metric: shadow-offset, op: ">", value: 0px }]
      owner: O-1
    - id: DNA-OFFSET-POP-POCKET
      role: card
      law: A nested surface keeps the outline, drops the shadow and takes the secondary fill.
      measure:
        kind: style
        select: '[data-grammar-surface-depth="nested"]'
        target: painted-box
        checks: [{ metric: border-width, op: "=", value: { token: --offset-pop-outline-width } }, { metric: box-shadow, op: "=", value: none }, { metric: background-color, op: "=", value: { token: --surface-secondary } }]
      owner: O-1
