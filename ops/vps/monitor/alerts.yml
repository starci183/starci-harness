# Written by `starci vps monitor up` from ops/vps/monitor/alerts.yml: the alerts every server runs; each component adds its own group (components.yaml alerts) when it runs. They hold for every
# opted-in app alike (no app's own words): a scraped target down, a Swarm service with fewer running tasks than it wants, a postgres or redis
# exporter's server down or near its limit, slow queries (only where pg_stat_statements is collected), the edge's 5xx rate; and by component
# the host short of memory, disk or CPU (ops/vps.yaml health), a service near its memory limit or restarting in a loop, a probe failing or a
# certificate expiring. A rule whose metric no target serves stays silent. Alertmanager sends them to each app's own bot (PROJECT-MONITORING-5);
# a `threshold` annotation is the limit the monitor bot shows beside the value (PROJECT-MONITORING-6).
groups:
  - name: targets
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} {{ $labels.service }} is down"
  - name: swarm
    rules:
      - alert: ServiceReplicasBelowDesired
        expr: count by (stack, service) (up{job="swarm-tasks", task_state!="running"}) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} has {{ $value }} task(s) Swarm wants running that do not run"
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "the postgres of {{ $labels.stack }} ({{ $labels.service }}) does not answer its exporter"
      - alert: PostgresConnectionsNearMax
        expr: sum by (stack, service) (pg_stat_activity_count) / max by (stack, service) (pg_settings_max_connections) > 0.80
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "the postgres of {{ $labels.stack }} holds {{ $value | humanizePercentage }} of max_connections"
          threshold: "80% of max_connections for 10m"
      - alert: PostgresSlowQueries
        expr: sum by (stack, service) (rate(pg_stat_statements_seconds_total[10m])) / (sum by (stack, service) (rate(pg_stat_statements_calls_total[10m])) > 0) > 1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "the statements of {{ $labels.stack }} take {{ $value | humanizeDuration }} on average"
  - name: redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "the redis of {{ $labels.stack }} ({{ $labels.service }}) does not answer its exporter"
      - alert: RedisMemoryNearMax
        expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0) > 0.90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "the redis of {{ $labels.stack }} uses {{ $value | humanizePercentage }} of its maxmemory"
          threshold: "90% of maxmemory for 10m"
  - name: edge
    rules:
      # Over 2% of the answers of one edge service are 5xx for 5 minutes, once it serves more than 3 requests a minute.
      - alert: EdgeErrorRate
        expr: sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m])) / (sum by (service) (rate(traefik_service_requests_total[5m])) > 0.05) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} answers {{ $value | humanizePercentage }} 5xx through the edge"
          threshold: "2% 5xx for 5m"
