# The ingress of the locally managed Cloudflare tunnel `starci-host-services` (ops/host/stack/embeddings.yaml, container
# cloudflared-embeddings). Its connector reads this file when it starts; a changed rule needs `host down embeddings-tunnel` then
# `host up embeddings-tunnel`. The DNS record of each host is made with
# `cloudflared --config ops/host/stack/embeddings-tunnel.yml tunnel route dns --overwrite-dns starci-host-services <host>`,
# naming this file so the record lands on this tunnel and not on the one of the home's default config.yml. Only the gate is
# reachable: every other host and path the tunnel receives answers 404.
#
# The service is the gate's fixed address on the `edge` network (embeddings.yaml: subnet 10.77.84.0/29, the gate 10.77.84.2), not its
# alias `embeddings-gate`: Docker's embedded DNS stopped resolving the alias twice on 2026-11-21 and the tunnel answered 502 until a
# restart, and an address needs no lookup. `starci host doctor` resolves the alias and calls this exact URL from a throwaway container
# on the network, so a mismatch between this line and embeddings.yaml reads down at once.
tunnel: starci-host-services
ingress:
  - hostname: embed.starci.org
    service: http://10.77.84.2:8080
  - service: http_status:404
