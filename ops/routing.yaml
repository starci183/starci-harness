# Which agent and model takes a task, how a provider in trouble is set aside and probed back, how evidence qualifies and
# scores a member, and the workflow budgets. The router reads this file and ops/ops/<label>.md (a label's difficulty floor and
# the host tools it needs); nothing here is restated in code. The router alone picks: no workflow or task names an agent.
schema: starci/routing@2

# A difficulty is given by name or as 1..4 in this order.
difficulties: [easy, medium, hard, insane]
# tier = labelTiers[label] ?? difficultyTier[max(difficulty, label floor)].
difficultyTier: {easy: low, medium: medium, hard: high, insane: frontier}
# A label named here takes that tier whatever its difficulty.
labelTiers: {image: high}
# Coordinator seats use these tiers and the same pool, provider, quota, qualification and scoring rules as Ops.
# Owner ruling 2026-10-28: Supervisors and Kernels run on Claude Opus. The `coordinator` tier is taken in its listed order
# (never scored, explored or balanced), so Codex takes a coordinator seat only while Claude is filtered out (circuit, quota).
coordinators: {supervisor: coordinator, kernel: coordinator}
# Lowest first: a second contract-red in a task's lineage raises the tier one step along this order.
tierOrder: [low, medium, high, frontier]
escalateAfterReds: 2

# A tier is the set of members the router scores; the order breaks a tie only.
# The model follows the work: everyday work (low, medium) runs each provider's everyday model (Claude Sonnet, Devin
# SWE-2 Max, Codex GPT-6 Luna); hard work (high, frontier) runs its strongest (Claude Opus, Codex GPT-6.1 Sol). A Claude or
# Codex member's effort follows its tier (low, medium, high, max at frontier); the launch passes it to Orca with the model.
tiers:
  coordinator:
    - {agent: claude, model: claude-opus-5-5, effort: high}
    - {agent: codex, model: gpt-6.1-sol, effort: high}
  frontier:
    - {agent: claude, model: claude-opus-5-5, effort: max}
    - {agent: codex, model: gpt-6.1-sol, effort: max}
  high:
    - {agent: claude, model: claude-opus-5-5, effort: high}
    - {agent: codex, model: gpt-6.1-sol, effort: high}
  # Claude is in the everyday tiers, so a uat task always has a member whose pool takes the uat label.
  medium:
    - {agent: claude, model: claude-sonnet-5-5, effort: medium}
    - {agent: devin, model: swe-2-max}
    - {agent: codex, model: gpt-6-luna, effort: medium}
    - {agent: cursor, model: auto}
  low:
    - {agent: claude, model: claude-sonnet-5-5, effort: low}
    - {agent: devin, model: swe-2-max}
    - {agent: codex, model: gpt-6-luna, effort: low}

# One pool per agent: one provider quota window with real parallel slots. `labels` are the work it may take, `tools` what
# its agent can use. A label's host tool that has a probe below must also answer on this host.
pools:
  claude:
    provider: claude
    maxParallel: 6
    labels: [code, test, draw, audit, review, verify, uat, docs, deliver, supervisor, kernel]
    tools: [git, node, browser, docker]
  # Only Codex takes image work: image generation runs on GPT-6.1 Sol alone (labelTiers keeps image on the high tier).
  codex:
    provider: codex
    maxParallel: 10
    labels: [code, test, draw, audit, review, verify, uat, docs, deliver, image, supervisor, kernel]
    tools: [git, node, browser, docker]
  devin:
    provider: devin
    maxParallel: 10
    labels: [code, test, review, verify, docs]
    tools: [git, node, docker]
    # Devin takes no launch-time model: worker-start names none and the attempt records the model Orca attests.
    modelSelection: false
  # Orca's worker-start takes a Cursor model id (--model), so Cursor selects its model at launch.
  cursor:
    provider: cursor
    maxParallel: 4
    labels: [code, test, docs]
    tools: [git, node]

# Host tools the router checks on this machine (the command must exit 0); a tool without a probe is the pool's own.
hostProbes:
  git: [git, --version]
  node: [node, --version]
  docker: [docker, --version]
  # This host can run the uat image (ops/uat.yaml): a Docker engine answers. `starci uat run` pulls and prepares the image
  # on its first run, whatever agent calls it.
  browser: [docker, info, --format, "{{.ServerVersion}}"]

# The scored head yields when it was picked maxStreak times in a row, or holds more than maxSharePercent of its tier's
# running seats, to the next member the lineage step did not put behind it.
balance: {maxStreak: 3, maxSharePercent: 70}

# Quota use of a pool's binding window, in percent. A member at exhaustedPercent is never used until the window resets; one
# at reservePercent is used only when no member below the reserve is left. No reading, or one older than maxAgeMinutes or
# past its reset, is unknown and not blocked.
quota: {reservePercent: 90, exhaustedPercent: 100, maxAgeMinutes: 1440}

# Orca's account list (`orca account list --json`, its rateLimits per provider) is read before a recorded pick when the last
# reading is older than refreshMinutes. The windows named here feed the pool's quota (the most-used one binds) and its pace;
# a provider whose reading says ok proves its auth, which closes a circuit opened for auth. When Orca gives no Codex reading,
# the rate_limits of Codex's newest session rollout (~/.codex/sessions) stand in, observed at that file's last write.
usage: {refreshMinutes: 10, windows: [session, weekly, monthly]}

# Provider circuit: a failure of a kind opens the provider for its cooldown once it has `strikes` of that kind in a row
# (1 when not named). A launch reports rate, quota, capacity, auth or launch, and nothing when it is blocked at a prompt
# (blockedPrompts: the host's problem, not the provider's); a seat the stall ladder (ops/liveness.yaml
# `stall`) gives up on reports the kind its Orca failure text names, else `stall`. An open within reopenWindowMinutes of
# the last one waits reopenFactor times longer, capped at capMinutes but never below the kind's own cooldown. A quota failure that names its reset waits for the reset.
# Half-open: an open provider is due one probe when its cooldown ends, or probeEveryMinutes after it opened (each failed probe
# multiplies that by reopenFactor, capped at probeCapMinutes), whichever comes first; a quota circuit at its reset. One pick sends the probe; a success closes
# the circuit, a failure re-opens it with the backoff. A probe whose outcome never arrives frees the slot after probeLeaseMinutes.
circuit:
  cooldownMinutes: {rate: 10, quota: 60, capacity: 10, auth: 1440, launch: 2}
  strikes: {launch: 2}
  reopenFactor: 5
  reopenWindowMinutes: 60
  capMinutes: 60
  probeEveryMinutes: 60
  probeCapMinutes: 240
  probeLeaseMinutes: 30

# Typed launch errors, and the failure fields Orca's worker-show gives for a stalled seat (agentWait, error, exit reason), are
# read for these signals (case-insensitive regular expressions); a certain launch failure with none of them is a `launch`
# failure, a stalled seat with none a `stall`. The one terminal screen read is blockedPrompts' below.
failureSignals:
  rate: ["rate.?limit", "too many requests", "\b429\b"]
  quota: ["quota", "usage limit", "credit", "out of tokens", "billing"]
  capacity: ["overloaded", "capacity", "\b529\b", "\b503\b"]
  auth: ["unauthori[sz]ed", "\b401\b", "forbidden", "not logged in", "login expired", "invalid api key"]

# A launch Orca failed at its agent_readiness stage has its agent terminal (the one its receipt says it created) read once,
# before the worker is released: the last `screenLines` non-empty lines become the seat's failure facts and the launch error.
# A screen matching a prompt here (first name wins, case-insensitive) is a `blocked-prompt` failure: the agent waits at a host
# or config dialog, so its provider takes no strike, and the Supervisor gets a `harness` escalation naming the prompt and the
# worktree. Any other readiness failure is classified by failureSignals.
blockedPrompts:
  screenLines: 20
  prompts:
    external-import: ["allow external claude\\.md file imports"]
    trust: ["do you trust the files in this folder", "trust this folder"]
    login: ["please (log|sign) ?in", "select login method", "run /login", "not logged in"]
    confirmation: ["do you want to"]

# A launch whose turn start Orca did not observe (worker start_unknown, seat launch-unknown) may have its dispatch pasted into
# the agent's composer with the Enter lost. While such a launch is reconciled, its terminal's last blockedPrompts.screenLines
# lines are read; a screen matching one of these patterns (case-insensitive) gets a bare Enter (`terminal send --enter`), at
# most resubmitMax times per seat, before the launch can be given up.
pendingComposer:
  resubmitMax: 2
  patterns: ["\\[Pasted Content \\d+ chars\\]", "\\[Pasted text #\\d+"]

# Every ended attempt of every registered ledger is recorded per member and label (green or red verdict, timeout, lost,
# stalled, launch failure, mismatch, minutes), and every coordinator seat the stall ladder gave up on (stalled); the evidence of the last windowDays qualifies and scores a member.
outcomes: {windowDays: 14}

# Qualification of a member for a label, from its verdicts in the outcomes window: `high` and `standard` need at least
# `verified` verdicts with at least `greenPercent` green; anything less is probation. A member of a tier named in
# startStandard is standard before it has evidence. A task whose `risk` names any of riskTags refuses a member below
# riskMinimum; when that leaves its tier empty the task looks one tier up.
qualification:
  standard: {verified: 3, greenPercent: 60}
  high: {verified: 10, greenPercent: 80}
  startStandard: [frontier]
  riskMinimum: standard
  riskTags: [external, prod, money, security]

# Scoring inside the tier: expected success (the Beta posterior mean of green for member and label, from `prior`) over expected
# cost (mean minutes of its attempts over costMinutes, times 1 + paceWeight x how far its quota burns ahead of its window's
# clock). A pick explores by Thompson sampling with probability exploreSharePercent, and never while explore picks already
# hold that share of the tier's recent picks.
scoring:
  prior: {green: 1, red: 1}
  costMinutes: 30
  paceWeight: 1
  exploreSharePercent: 15

# Pool concurrency (AIMD): a rate or capacity failure halves the pool's cap (never below floor, at most once per
# decreaseCooldownMinutes); a success after quietMinutes without one adds 1, at most once per increaseStepMinutes.
concurrency: {floor: 2, decreaseCooldownMinutes: 2, quietMinutes: 15, increaseStepMinutes: 5}

# The most Ops one orca workflow runs at once (its fan-out), and its default; a workflow file's maxParallel asks for fewer, never more, and
# ready tasks past it wait for a free slot (engine.ts queueReady).
workflowParallel: 10

# The most worker seats one project runs at once: its Kernels' Ops across all of its workflows and the [Worker] seats its
# Supervisor dispatched (`supervisor dispatch`), wherever they work. A launch past it waits queued and starts once a seat of the
# project is released (engine.ts launchTask, core/supervisor/workers.ts); it is never refused and never routed elsewhere for
# it. The pools' maxParallel still binds every launch.
projectMaxWorkers: 10

# Per-workflow ceilings; only the owner or the Supervisor raises one (budget raise).
budgets:
  workflow: {minutes: 480, tries: 40}
