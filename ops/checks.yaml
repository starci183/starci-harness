# Named check presets an op file (checks.base) or a contract (checks.extend) names; ops/ops/README.md says how they compose.
# Each preset expands into one primitive check: command, starci, files, json, probe, uat-flow, cited or cite.
# Arguments a preset needs are named in `args`; `{name}` in a value is replaced by the entry's argument, else by the
# contract's input of that name (so an op's base can name a preset bare and take its arguments from its inputs).
# Trust tiers (trustTier in cli/src/harness/ops.ts) follow the kind: T0 the harness observes itself (command, starci, files,
# probe, cite), T1 it reads from a receipted run (uat-flow), T2 is the worker's claim (json, cited). `behavioural: true` is
# allowed only on a T0 or T1 check, which loadOps enforces: a claim may make a task red, never prove it green.
# Where a check runs: a heavy one (a scoped `starci check` verb, or any command: typecheck, lint, tests, a suite) of a workflow
# task runs in its workflow's wave verify, on a clean checkout of the merged batch, when policy/quality.yaml `verify.tier` is
# wave (cli/src/harness/wave.ts splitChecks; a Supervisor's [Worker] leaves it to Debug's round); every other check, and every
# check of a task sent alone, runs in the task's own clean verify. "The clean checkout" below is whichever runs it.
schema: starci/check-presets@1
presets:
  check-run-green:
    summary: the scoped starci check exits 0 having run a step, over the changed packages, or over the tracked files under allowPaths when the task changes nothing
    behavioural: false
    check:
      kind: starci
      args: [check, run]
  # CI is the critic after the push; a contract waits for it only when its work is the release or the deploy itself.
  ci-green:
    summary: CI of the commit on the remote main is green (starci check ci); for deliver work that ships main
    behavioural: true
    check:
      kind: starci
      args: [check, ci, --ref, origin/main]
  paths-only:
    summary: the change touches only the contract's allowPaths
    behavioural: false
    check:
      kind: files
      onlyAllowPaths: true
  # A jest run (this and every command check) runs the task's own spec files by path when it names test paths (those under the
  # paths and the specs of every changed file under allowPaths) or runs the test world alone, never a live-provider spec it did
  # not name (scopedTests, cli/src/harness/coverage-scope.ts), and its coverage is
  # narrowed to the changed logic files under allowPaths (coverage: changed), so the app's own thresholds hold what the task
  # changed while its whole measured scope stays CI's.
  tests-pass:
    summary: the harness runs the named tests (or the tests related to the change) on the clean checkout and they pass, with the coverage of every changed logic file at the app's thresholds
    behavioural: true
    args: [command]
    check:
      kind: command
      run: "{command}"
      coverage: changed
  # A package fix edits a @starci package on its package edit branch, outside the task's own checkout, so the harness runs that
  # package's own gates where the edit is (starci pkg test, cli/src/core/pkg/test.ts): a Supervisor worker of a package need
  # carries it without being asked (workerChecks, cli/src/core/supervisor/workers.ts).
  package-specs:
    summary: the harness runs the package's own typecheck, lint and specs (npm test) in packages/<name> of this app's package edit worktree, each under a heavy-command slot, and they pass
    behavioural: true
    args: [package]
    check:
      kind: starci
      args: [pkg, test, "{package}"]
  # A verify task reports a suite; the harness reruns it on the clean checkout and the result's verdict must agree with the exit.
  suite-verdict:
    summary: the harness reruns the suite on the clean checkout and the result's verdict agrees with its exit (0 passed, else failed)
    behavioural: true
    args: [suite]
    check:
      kind: command
      run: "{suite}"
      verdict: verdict
  files-exist:
    summary: every listed file exists after the task
    behavioural: false
    args: [files]
    check:
      kind: files
      mustExist: "{files}"
  # A json check reads a file of the candidate (the clean checkout), relative to the contract's cwd; the file name @result
  # reads the worker's filed result output from the ledger instead. Either is what the worker wrote, so it proves no behaviour.
  json-required:
    summary: a json file the task lands (under allowPaths) exists and carries the required keys
    behavioural: false
    args: [file, keys]
    check:
      kind: json
      file: "{file}"
      requiredKeys: "{keys}"
  result-json:
    summary: the worker's filed result output (task result --output) carries the required keys
    behavioural: false
    args: [keys]
    check:
      kind: json
      file: "@result"
      requiredKeys: "{keys}"
  result-passed:
    summary: the worker's filed result says its verdict is passed (a worker that saw the product fail turns the task red)
    behavioural: false
    args: []
    check:
      kind: json
      file: "@result"
      requiredKeys: [verdict]
      expect: {verdict: passed}
  # The run folder is git-ignored Work (contexts/project/work.md), so it is read in the work tree the candidate came from.
  uat-flow:
    summary: the checks.json and screenshots a receipted starci uat run wrote walk every step of the Work record at its expected values, and the worker's verdict agrees
    behavioural: true
    args: [record, run]
    check:
      kind: uat-flow
      record: "{record}"
      run: "{run}"
  # The trace of what the worker read: the ids its result cites (rulesApplied, workRecords) come from its context files other
  # than the shared ones every task of the label reads; a Work record id may also come from the records under its own Work
  # allowPaths, or from a record a Work context file or an input points at by id or path. A cheap read trace, never evidence of behaviour.
  rules-cited:
    summary: every rule or Work record id the result cites is named by one of the task's non-shared context files (or, for a Work record, by a record in its Work allowPaths or one its Work context or inputs point at), and as many are cited as the op requires
    behavioural: false
    check:
      kind: cited
  # The anchor cites (cli/src/harness/cite.ts): layer 2 of the Grammar principle, the author's pick of component, variant,
  # intent and spacing, cited from the Choose sections it read and graded by the reviewer. The harness resolves every id against
  # the contexts and reads the changed files' Grammar imports itself (T0), yet green proves no behaviour.
  anchors-cited:
    summary: every id under cites resolves to a Choose anchor, rule or DNA id of the contexts, each Grammar component family the changed files import has a Choose anchor cited, every id the contract hands is cited (author) or graded once under citeGrades (grader), and no grade is violated
    behavioural: false
    check:
      kind: cite
  # The DNA gate (cli/src/core/dna, measurement shape in cli/src/harness/dna.ts): the harness renders the target in a headless
  # browser and measures the measured mustKeep laws of contexts/grammars/contract.yaml; a target is a url, a built Storybook
  # folder, a static folder or one html file, relative to the checkout.
  dna:
    summary: the rendered UI keeps every measured DNA law of the Grammar contract (starci dna check), skeleton twins included
    behavioural: true
    args: [target]
    check:
      kind: starci
      args: [dna, check, "{target}"]
  probe:
    summary: an http endpoint answers with the expected status
    behavioural: true
    args: [url, status]
    check:
      kind: probe
      url: "{url}"
      status: "{status}"
