# Named check presets an op file (checks.base) or a contract (checks.extend) names; ops/ops/README.md says how they compose.
# Each preset expands into one primitive check: command, starci, files, json, probe, uat-flow, cited or cite.
# Arguments a preset needs are named in `args`; `{name}` in a value is replaced by the entry's argument, else by the
# contract's input of that name (so an op's base can name a preset bare and take its arguments from its inputs).
# Trust tiers (trustTier in cli/src/harness/ops.ts) follow the kind: T0 the harness observes itself (command, starci, files,
# probe, cite), T1 it reads from a receipted run (uat-flow), T2 is the worker's claim (json, cited). `behavioural: true` is
# allowed only on a T0 or T1 check, which loadOps enforces: a claim may make a task red, never prove it green.
schema: starci/check-presets@1
presets:
  check-run-green:
    summary: the scoped starci check exits 0 having run a step, over the changed packages, or over the tracked files under allowPaths when the task changes nothing
    behavioural: false
    check:
      kind: starci
      args: [check, run]
  # CI is the critic after the push; a contract waits for it only when its work is the release or the deploy itself.
  ci-green:
    summary: CI of the commit on the remote main is green (starci check ci); for deliver work that ships main
    behavioural: true
    check:
      kind: starci
      args: [check, ci, --ref, origin/main]
  paths-only:
    summary: the change touches only the contract's allowPaths
    behavioural: false
    check:
      kind: files
      onlyAllowPaths: true
  tests-pass:
    summary: the harness runs the named tests (or the tests related to the change) on the clean checkout and they pass
    behavioural: true
    args: [command]
    check:
      kind: command
      run: "{command}"
  # A verify task reports a suite; the harness reruns it on the clean checkout and the result's verdict must agree with the exit.
  suite-verdict:
    summary: the harness reruns the suite on the clean checkout and the result's verdict agrees with its exit (0 passed, else failed)
    behavioural: true
    args: [suite]
    check:
      kind: command
      run: "{suite}"
      verdict: verdict
  files-exist:
    summary: every listed file exists after the task
    behavioural: false
    args: [files]
    check:
      kind: files
      mustExist: "{files}"
  # A json check reads a file of the candidate (the clean checkout), relative to the contract's cwd; the file name @result
  # reads the worker's filed result output from the ledger instead. Either is what the worker wrote, so it proves no behaviour.
  json-required:
    summary: a json file the task lands (under allowPaths) exists and carries the required keys
    behavioural: false
    args: [file, keys]
    check:
      kind: json
      file: "{file}"
      requiredKeys: "{keys}"
  result-json:
    summary: the worker's filed result output (task result --output) carries the required keys
    behavioural: false
    args: [keys]
    check:
      kind: json
      file: "@result"
      requiredKeys: "{keys}"
  result-passed:
    summary: the worker's filed result says its verdict is passed (a worker that saw the product fail turns the task red)
    behavioural: false
    args: []
    check:
      kind: json
      file: "@result"
      requiredKeys: [verdict]
      expect: {verdict: passed}
  # The run folder is git-ignored Work (contexts/project/work.md), so it is read in the work tree the candidate came from.
  uat-flow:
    summary: the checks.json and screenshots a receipted starci uat run wrote walk every step of the Work record at its expected values, and the worker's verdict agrees
    behavioural: true
    args: [record, run]
    check:
      kind: uat-flow
      record: "{record}"
      run: "{run}"
  # The trace of what the worker read: the ids its result cites (rulesApplied, workRecords) come from its context files other
  # than the shared ones every task of the label reads; a Work record id may also come from the records it wrote under its own
  # Work allowPaths. A cheap read trace, never evidence of behaviour.
  rules-cited:
    summary: every rule or Work record id the result cites is named by one of the task's non-shared context files (or, for a Work record, by one it wrote in its Work allowPaths), and as many are cited as the op requires
    behavioural: false
    check:
      kind: cited
  # The anchor cites (cli/src/harness/cite.ts): layer 2 of the Grammar principle, the author's pick of component, variant,
  # intent and spacing, cited from the Choose sections it read and graded by the reviewer. The harness resolves every id against
  # the contexts and reads the changed files' Grammar imports itself (T0), yet green proves no behaviour.
  anchors-cited:
    summary: every id under cites resolves to a Choose anchor, rule or DNA id of the contexts, each Grammar component family the changed files import has a Choose anchor cited, every id the contract hands is cited (author) or graded once under citeGrades (grader), and no grade is violated
    behavioural: false
    check:
      kind: cite
  probe:
    summary: an http endpoint answers with the expected status
    behavioural: true
    args: [url, status]
    check:
      kind: probe
      url: "{url}"
      status: "{status}"
