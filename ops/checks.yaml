# Named check presets an op file (checks.base) or a contract (checks.extend) names; ops/ops/README.md says how they compose.
# Each preset expands into one primitive check: command, starci, files, json, probe or cited.
# Arguments a preset needs are named in `args`; `{name}` in a value is replaced by the contract's argument.
schema: starci/check-presets@1
presets:
  check-run-green:
    summary: the scoped starci check (typecheck and lint of the changed packages) exits 0
    behavioural: false
    check:
      kind: starci
      args: [check, run]
  # CI is the critic after the push; a contract waits for it only when its work is the release or the deploy itself.
  ci-green:
    summary: CI of the commit on the remote main is green (starci check ci); for deliver work that ships main
    behavioural: true
    check:
      kind: starci
      args: [check, ci, --ref, origin/main]
  paths-only:
    summary: the change touches only the contract's allowPaths
    behavioural: false
    check:
      kind: files
      onlyAllowPaths: true
  tests-pass:
    summary: the named tests (or the tests related to the change) pass
    behavioural: true
    args: [command]
    check:
      kind: command
      run: "{command}"
  files-exist:
    summary: every listed file exists after the task
    behavioural: false
    args: [files]
    check:
      kind: files
      mustExist: "{files}"
  # A json check reads a file of the candidate (the clean checkout), relative to the
  # contract's cwd; the file name @result reads the worker's filed result output from the ledger instead.
  json-required:
    summary: a json file the task lands (under allowPaths) exists and carries the required keys
    behavioural: true
    args: [file, keys]
    check:
      kind: json
      file: "{file}"
      requiredKeys: "{keys}"
  result-json:
    summary: the worker's filed result output (task result --output) carries the required keys
    behavioural: true
    args: [keys]
    check:
      kind: json
      file: "@result"
      requiredKeys: "{keys}"
  result-passed:
    summary: the worker's filed result says its verdict is passed (a uat that saw the product fail is red)
    behavioural: true
    args: []
    check:
      kind: json
      file: "@result"
      requiredKeys: [verdict]
      expect: {verdict: passed}
  # The run folder is git-ignored Work (contexts/project/work.md), so it is read in the work tree the candidate came from.
  uat-flow:
    summary: the worker's filed result walks every step of the Work record, each check at its expected value, with the report and one screenshot per step in the run folder
    behavioural: true
    args: [record, run]
    check:
      kind: uat-flow
      record: "{record}"
      run: "{run}"
  # The trace of what the worker read: the ids its result cites (rulesApplied, workRecords) come from its context files; a Work record id may also come from the records it wrote under its own Work allowPaths.
  rules-cited:
    summary: every rule or Work record id the result cites is named by one of the task's context files (or, for a Work record, by one it wrote in its Work allowPaths), and as many are cited as the op requires
    behavioural: false
    check:
      kind: cited
  probe:
    summary: an http endpoint answers with the expected status
    behavioural: true
    args: [url, status]
    check:
      kind: probe
      url: "{url}"
      status: "{status}"
