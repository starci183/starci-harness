# Seat liveness (orca runner only): how long a seat may be quiet before the harness says so, and which Orca answers are its
# explicit word that a worker is gone; and settle liveness. Read by `seat ping`, `workflow step` and `task verify`; nothing
# here is restated in code.
# Unknown is never dead: an Orca that does not answer, or answers anything not listed below, proves nothing about the worker.
schema: starci/liveness@1

# A seat younger than this is launching: it is not pinged by a step and not judged.
launchGraceSeconds: 90
# The deadline of one worker-show a ping sends; no answer by then is unknown, not dead.
pingDeadlineSeconds: 15
# Orca answers, but the worker's terminal printed nothing for this long (when Orca reports its last output): stale (worker-hung).
activeStaleMinutes: 10
# Pings went unanswered for this long: quiet. The seat is held and reported, never declared dead.
quietMinutes: 20

# Orca's explicit word that a worker ended: a worker state or observation.status in goneStates, or a typed worker-show
# error in goneErrors. Only these make a seat worker-lost (and its running task effect_unknown).
goneStates: [exited, failed, stopped, released, abandoned]
goneErrors: [dispatch_not_found]

# Settle liveness (both runners): a verify that reaches no verdict returns its task to reported for free, but once one result
# has reached no verdict this many times the failure is persistent and the task ends awaiting_owner with the last reason.
settleNoVerdictMax: 3

# Coordinators (`kernel next`, `supervisor next`): the mechanics the deterministic driver applies, never an LLM's choice.
coordinators:
  # A seat's TTL lease: every harness call it makes (attach, next, submit, seat ping) renews it for this long.
  seatLeaseMinutes: 15
  # A Kernel whose lease lapsed and whose workflow recorded no progress for this long (an event of its work, never one of the
  # Supervisor relaunching it) is stalled; `supervisor next` asks Orca and relaunches it only on Orca's word (gone, or idle
  # past this long). Unknown is not dead.
  kernelTtlMinutes: 20
  # The Supervisor's lease; `supervisor ensure` relaunches it only when Orca says its terminal is gone.
  supervisorTtlMinutes: 30
  # After this many Kernel relaunches with no progress since the first, the next one pauses the workflow and escalates to the
  # owner instead.
  kernelRelaunchMax: 3
  # An effect_unknown launch Orca still holds no receipt for (request-show absent) after this long is stuck: a red decision.
  effectUnknownDeadlineMinutes: 15
  # A node waiting on another workflow's path lease for this long is a conflict decision (the Kernel escalates it).
  conflictMinutes: 10
  # The same refused Kernel command (its content, whatever its cmdId) this many times escalates to the Supervisor (kind
  # harness), and every later submit of it is refused at once.
  poisonRefusals: 3
  # How long one `next` blocks before it returns idle, and how often it re-reads the ledger while it waits on mail.
  nextWaitSeconds: 900
  nextPollSeconds: 30
