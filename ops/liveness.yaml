# Seat liveness (orca runner only): how long a seat may be quiet before the harness says so, and which Orca answers are its
# explicit word that a worker is gone; settle liveness and the revival of a task the harness ended; the host's heavy-command
# slots; the coordinators' mechanics; the budget ladder; owner feedback; and the stall ladder with its idle-ready wake. Read by `seat ping`, `workflow step`, `task verify`, `check run`, the
# coordinator drivers, `ticket list --kind feedback --status overdue` and `supervisor tick`; nothing here is restated in code.
# Unknown is never dead: an Orca that does not answer, or answers anything not listed below, proves nothing about the worker.
schema: starci/liveness@1

# A seat younger than this is launching: it is not pinged by a step and not judged.
launchGraceSeconds: 90
# The deadline of one worker-show a ping sends; no answer by then is unknown, not dead.
pingDeadlineSeconds: 15
# Orca answers, but the worker's terminal printed nothing for this long (when Orca reports its last output): stale (worker-hung).
activeStaleMinutes: 10
# Pings went unanswered for this long: quiet. The seat is held and reported, never declared dead.
quietMinutes: 20

# Orca's explicit word that a worker ended: a worker state or observation.status in goneStates, or a typed worker-show
# error in goneErrors. Only these make a seat worker-lost (and its running task effect_unknown).
goneStates: [exited, failed, stopped, released, abandoned]
goneErrors: [dispatch_not_found]

# Settle liveness (both runners): a verify that reaches no verdict returns its task to reported for free, but once one result
# has reached no verdict this many times the failure is persistent and the task ends awaiting_owner with the last reason.
settleNoVerdictMax: 3
# A verify holds its verifier lock (and a land lock) at most this long, the time its heavy commands waited in the heavy queue
# aside (cli/src/harness/settle.ts): past it the holder gives it up
# and its task reaches no verdict, and a holder still listed past it (hung in-process, its heartbeat beating) counts as gone, so
# the next `workflow step`, `kernel next` or `supervisor tick` reconciles its task (`task verify --recover`) and verifies it again.
verifyDeadlineMinutes: 45
# A task the harness ended (cli/src/harness/revive.ts `harnessCause`: a wave red not proven its own, a fenced or lost launch, a
# verify stopped by infrastructure or its deadline) with no red of its own returns to ready at the same try, on any try, its last
# included. At most this many of one node's tasks come back so; the next stays ended and its node is red for the Kernel.
reviveMax: 3

# Heavy commands (both runners, every verb): tsc, eslint, a test or suite command, a workspace or package build, npm ci or
# install, a uat container. Each runs under a row of a machine-wide queue in machine.sqlite (`heavy_slots`, cli/src/harness/heavy.ts), whose
# admissions are serialised by the store's lock. A command sizes itself greedily to the room it finds when it starts:
#   room = free RAM now - reserveMb - what the commands admitted in the last plannedSeconds planned
# Free RAM already excludes what running commands use, so nothing but the commands admitted lately (not yet grown into the free RAM, so
# two that start together never take the same room) is subtracted; after plannedSeconds a command counts as the live free RAM shows it.
# reserveMb is the one headroom the whole machine keeps, counted once. A test run takes the workers its room holds:
#   workers = clamp(floor((room - testRun.parentMb) / testRun.workerMb), 1, min(cores - 1, testWorkers))
# and any other node tool runs under min(its capMb, the room), never under its minMb. A command starts at once when the room covers its least
# need (caps minMb, or a test run's parent and one worker) and fewer commands run than the cap, floor(logical cores / 2) or maxSlots when set
# lower. Otherwise it waits in a first come, first served queue, holding nothing, only the head may start, and it prints its place, its need and
# the running commands every minute. While nothing runs the head starts on the room there is, whatever its need, with one worker: no running command
# will release memory, so waiting could not help, and a warning names the shortfall. A process that is gone (a killed command) is dropped from the
# queue at the next admission. A heavy command a running one starts (its children inherit STARCI_HEAVY_PARENTS) is admitted on its own, and the rows of
# its ancestors never count against it, so it never waits on them. `starci app check` holds no row: each of its heavy children is admitted on its own,
# and its steps run in parallel (packages/hfs/cache/schedule.mts). A CI runner is one job on its own
# machine: its command is sized from that runner's live free RAM and cores, with no queue and no lock. Heavy commands run through starci verbs; a
# raw `npx eslint` takes no admission and shows only as lower free RAM. Every number below is a measured constant, none is learned.
# The CPU ceiling governs the harness's own contribution. While the CPU average over cpuWindowSeconds is above maxCpuPercent,
# the share the governor's running commands and their process trees burn decides (managed CPU, sampled over the same window):
# under managedCpuFloorPercent of the host's total CPU the load is foreign, holding the harness back would not lower it, and up
# to underForeignPressureSlots commands run under it; at or above it (or unknown) new admissions pause and running commands keep
# going. A floor of 0 makes every load the harness's own. The CPU never lifts a RAM rule. High CPU slows the queue and never
# stops it: once the queue admitted nothing for cpuStarveMinutes, its first command that RAM admits starts anyway, one per
# cpuStarveMinutes. A command not admitted waits in the queue, polling every pollSeconds; a coordinator's turn (`kernel next`, `kernel submit`, `supervisor
# next`, `supervisor tick`) never waits in it: its own heavy command is refused and its step's verifies and waves run as detached jobs; the wait is logged (stderr and a `heavy-wait` host event) and
# never fails its check: a `task verify` command still waiting at the verify's contract budget is refused HOST_HELD, a verify with
# no verdict that spends no try and is verified again on the next step. Its timeout starts at admission, never in the queue: timeoutMinutes for its kind (an install's budget is
# sized for a cold npm ci on this host, an eslint's grows with the files it names, timeoutMinutesPer1000Files), else the caller's (a test command's comes from its contract). Each runs below normal OS
# priority; a node tool under `--max-old-space-size` of its heap cap, a uat container under `--memory` at it, so a command cannot take more than it
# planned, and each jest worker is held to workerMb by `--workerIdleMemoryLimit` and a heap cap.
# The jest parent keeps no coverage: each spec's coverage becomes its cache record as the run streams and is dropped, so the parent holds about
# 0.4 MB a spec beyond its base (about 1.3 GB on a Nivo-sized back end), which testRun.parentMb caps; a worker holds about 1.5 GB
# (testRun.workerMb). A free 22 GB on a 28-core host gives such a run 10 workers; a free 7 GB gives 1.
# A worker seat launches
# only while free memory is at least seatFreeMb; otherwise its task stays queued and the hold is recorded (since when, on what
# memory), so `workflow status` names it. `starci host load` shows the capacity, the CPU rule that applied, each queued
# command's wait and why, and who holds the memory (managed: the harness's heavy commands and seats; unmanaged: other node,
# WSL or Docker, IDEs, agents).
# When admission or seat launch has been held for more than starvedTicketMinutes without a break, `supervisor tick` opens one
# harness-defect ticket naming the top unmanaged holders, once per episode; these rules do not change for it.
# maxSlots (optional) caps the count below floor(logical cores / 2). bootProofTimeoutSeconds
# is the budget of the lite boot proof's worker, counted from its spawn: one timeout is retried, a second is BOOT_PROOF_TIMEOUT, not a failure.
# @starci/hfs reads both through the environment the CLI sets (cli/src/harness/heavy.ts hfsLimitsEnv).
# On Windows `host load` also reads the CPU of Defender's real-time scan (MsMpEng, percent of one core): at scannerCpuPercent or
# more it prints the owner's exclusion command for the harness state and every registered repository, and never runs it
# (security settings are the owner's).
heavy:
  reserveMb: 4096
  maxCpuPercent: 85
  cpuWindowSeconds: 60
  cpuStarveMinutes: 5
  managedCpuFloorPercent: 25
  underForeignPressureSlots: 2
  pollSeconds: 2
  # The cap of one process of each kind is its measured peak: its `--max-old-space-size` (uat: `--memory`), and minMb is the least room a command of the
  # kind starts in. A typecheck of a large app's back end outgrows node's default heap (4 GB), and one ESLint child of an app check, which takes a chunk of
  # files (plan.lintChunk), peaks near 8 GB on a typed back end of about 9,500 files in 600-file chunks; a lower heap turns a green run into an out-of-memory
  # one, so tsc, eslint and build start only in a room that holds their cap.
  caps:
    tsc: { capMb: 8192, minMb: 8192 }
    eslint: { capMb: 8192, minMb: 8192 }
    build: { capMb: 4096, minMb: 4096 }
    install: { capMb: 2048, minMb: 1024 }
    uat: { capMb: 4096, minMb: 2048 }
  timeoutMinutes:
    install: 15
    tsc: 10
    eslint: 10
  # Liveness, not quality: the longest a child may run before it is ended as hung, never a threshold its result is judged by. A lint that names
  # the files it judges (an ESLint child of an app check) gets max(timeoutMinutes, rate x files / 1000), so a large side on a slow
  # two-core runner is not ended for being large (a whole typed back end of 11,000 files outgrew a flat 10 min in CI); a hung child is still ended.
  timeoutMinutesPer1000Files:
    eslint: 5
  testWorkers: "50%"
  testRun:
    parentMb: 2048
    workerMb: 1536
  plannedSeconds: 60
  seatFreeMb: 6144
  starvedTicketMinutes: 45
  bootProofTimeoutSeconds: 300
  scannerCpuPercent: 50
  # The memory plan of `app check` (RAM-SIZING; cli/src/harness/memory-plan.ts): before its families run, the check measures
  # the cache folder of the app (L the MB of every record) and sizes its own heap from it. Fitted on Nivo (a parent that died on 494 MB of
  # coverage records at the default heap). It is clamped to minMb..maxMb, and no earlier run changes it:
  #   parent      = baseMb + perRecordMb x L, the check's own process; it re-executes itself under that heap when node's limit is lower. The
  #                 records are held as their lines and parsed one at a time (streaming), so 3 MB a record MB.
  #   lint chunk  = `files` of one ESLint chunk: a side's judged files make ceil(files / lintChunk) chunks, and as many children run at once as the room
  #                 holds of caps.eslint and the check's CPU lanes have free, at most the chunks, the files split evenly between them (one child
  #                 builds the side's typed program once, so a side is never split into children that wait for each other); the lint ratchet takes half.
  # A test run's parent and workers are not in the plan: heavy.testRun above and the room at admission size them.
  plan:
    parent: { baseMb: 1024, perRecordMb: 3, minMb: 2048, maxMb: 16384 }
    lintChunk: { files: 600 }

# Coordinators (`kernel next`, `supervisor next`): the mechanics the deterministic driver applies, never an LLM's choice.
coordinators:
  # A seat's TTL lease: every harness call it makes (attach, next, submit, seat ping) renews it for this long.
  seatLeaseMinutes: 15
  # A Kernel whose lease lapsed and whose workflow recorded no progress for this long (an event of its work, never one of the
  # Supervisor relaunching it or of the stall ladder) is relaunched on Orca's word (gone, or no output past this long) by
  # `supervisor next` and `supervisor tick`, whatever work is pending; one idle at its prompt with work pending meets the
  # shorter `stall` ladder first. Unknown is not dead.
  kernelTtlMinutes: 20
  # The Supervisor's lease; `supervisor ensure` and `supervisor tick` relaunch it only when Orca says its terminal is gone.
  supervisorTtlMinutes: 30
  # After this many Kernel relaunches (a stall's included) with no progress since the first, the next one pauses the workflow
  # and escalates to the owner instead.
  kernelRelaunchMax: 3
  # An effect_unknown launch Orca still holds no receipt for (request-show absent) after this long is stuck: a red decision.
  effectUnknownDeadlineMinutes: 15
  # The same refused Kernel command (its content, whatever its cmdId) this many times escalates to the Supervisor (kind
  # harness), and every later submit of it is refused at once.
  poisonRefusals: 3
  # How long one `next` blocks before it returns idle, and how often it re-reads the ledger (renewing the caller's lease) while
  # it waits on mail. The wait stays under the longest a coordinator's shell tool holds a command in the foreground (Claude
  # Code's Bash: 600 s), so a blocking `next` returns into the same turn; the briefs and loop prompts pass it as `--wait`.
  nextWaitSeconds: 540
  nextPollSeconds: 30

# The budget ladder (orca runner): an Op whose attempt has run past its contract's budget.minutes with no result filed, the
# time its heavy commands waited in the heavy queue (its verifies' and those run in its own checkout) left out, is asked
# once to wrap up and file now (the prompt below, `terminal send`); graceMinutes after that ask, counted the same way, it is
# fenced: its seat closed (worker-stop, release, tab), its dirty allowPaths preserved and reset as a red verify does, the task
# failed `over-budget` with its try spent; the next workflow step removes its worktree. A result filed in the grace is judged as
# any other.
# Run by `supervisor tick` and `kernel next`.
budget:
  graceMinutes: 15
  prompt: "Task {task} has used its budget of {minutes} min. Wrap up now: stop new work, file your result with starci task result {task} (done if the contract is met, else failed or blocked naming what is left) within {grace} min, or the task is fenced and its work set aside."

# Owner feedback (`starci ticket open --kind feedback`): an item the owner gave stays open at most this many days; `ticket list --kind feedback --status overdue` is red past
# it, and `supervisor tick` lists every open item.
feedback:
  openMaxDays: 3

# Shared needs (both runners, cli/README.md "Shared needs"): a need routed to a coordinator that names no owner (a resolver task,
# a worker, or a rejection) within this many minutes escalates one level: a Kernel's goes to the Supervisor, the Supervisor's to
# the owner (a package need to Debug, kind harness). Run by every workflow step, `kernel next` and `supervisor tick`.
needs:
  ownerDeadlineMinutes: 30

# The stall ladder (orca runner): a seat whose agent sits idle at its prompt while its ledger work is pending. A Supervisor
# with an open decision it rules (never an owner or harness escalation it waits on) or an owner request, or with its lease expired
# (its loop stopped, whatever waits), a Kernel with an open decision or a node its driver acts on (ready, queued, reported, returned,
# failed, lost, launch-unknown), an Op whose task runs with no result filed. Run by `supervisor tick` (Supervisor, Kernels and
# their Ops), `supervisor next` (Kernels) and `kernel next` (its Ops); judged from Orca's signals only, never a screen.
stall:
  # A seat whose last driver call (its lease renewal by attach, next or submit, which a `next` blocking on its wait renews every
  # nextPollSeconds; an Op's last output or heartbeat) is older than this, with work pending, is asked about.
  idleMinutes: 3
  # Orca's word that it is idle: `terminal wait --for tui-idle` satisfied within this many ms, or no terminal output and no
  # dispatch heartbeat for quietMinutes. Anything Orca does not answer is not idle.
  tuiIdleWaitMs: 2000
  quietMinutes: 5
  # Remedy 1: one nudge per stall (the role's loop prompt, `terminal send`), at most nudgeMax per seat. Remedy 2: a nudge that
  # brought no driver call within nudgeGraceMinutes, or a seat that stalls again after nudgeMax nudges, is given up: its member
  # records a `stalled` outcome (the provider circuit takes the kind its Orca failure text names, else `stall`), an Op is fenced
  # (its task fails `stalled`) and retried on another member, and a coordinator is relaunched on its tier's listed order (the
  # first member again, another only while the circuit or quota takes the first out); once that member gave up
  # coordinatorStallMax plain stalls of the same seat (the project's Supervisor, a workflow's Kernel) within
  # coordinatorStallWindowMinutes, the relaunch on it escalates (kind harness). Remedy 3: the Kernel relaunch limit escalates.
  nudgeMax: 2
  nudgeGraceMinutes: 3
  coordinatorStallMax: 2
  coordinatorStallWindowMinutes: 60
  # How long `supervisor tick --loop` sleeps between ticks.
  watchSeconds: 60
  # A launch Orca completed whose dispatch's worker shows one of these states (worker or observation) never started its turn;
  # still so this long after the launch, or gone, it was dead on arrival: fenced, its attempt closed launch-failed (no try
  # spent), a `stall` reported for its member, and the task queued again for another member. A completed request is never replayed.
  startUnknownStates: [start_unknown, turn_start_unobserved]
  startDeadlineMinutes: 10
  # Ready work nobody runs (run by `supervisor tick`): an orca workflow that dispatches, has ready or queued tasks and no live Op
  # since the later of its last progress and its Kernel's launch, while its project has a free worker slot. Past readyIdleMinutes
  # its Kernel is woken once with prompts.readyIdle, naming the ready tasks; past readyStallMinutes it is given up as remedy 2
  # gives up a stalled Kernel (its member's `stalled` outcome, a relaunch the Kernel relaunch limit bounds), once per Kernel seat.
  readyIdleMinutes: 10
  readyStallMinutes: 25
  # Work nobody decides (run by `supervisor tick`): an orca workflow that dispatches and waits on its Kernel for an open Kernel
  # decision, or for a failed or returned task whose last decision was answered without moving it and no escalation of that
  # answer or of a Supervisor ruling on it is still open, each since the later of that decision (raised or answered), its task's
  # last change and the Kernel's launch. Past decisionIdleMinutes the Kernel is woken once per Kernel seat and item with
  # prompts.decisionIdle, naming each; past decisionStallMinutes the item is handed to the Supervisor to rule in the Kernel's
  # place (a kernel-undecided decision, no ticket).
  decisionIdleMinutes: 15
  decisionStallMinutes: 45
  # The prompts the ladder types; {workflow}, {launch}, {task}, {tasks}, {since} and {wait} (coordinators.nextWaitSeconds) are filled in.
  prompts:
    supervisor: "Continue your loop: run starci supervisor next --json --wait {wait} in the foreground, answer its decision, then run it again in the same turn. Never end your turn while the driver is yours."
    kernel: "Continue your loop: run starci kernel next {workflow} --json --wait {wait} in the foreground (starci kernel attach {workflow} --launch {launch} first if you never attached), answer its decision, then run it again in the same turn. Never end your turn while the driver is yours."
    op: "Continue task {task}: finish it within its contract and file it with starci task result {task}."
    readyIdle: "Workflow {workflow} has ready work and no live Op since {since}: {tasks}. Run starci kernel next {workflow} --json --wait {wait} in the foreground now; it dispatches them. If it answers a decision, answer it; if a task stays ready, its next answer names why (a refusal, a budget, a wait), so act on that. Never end your turn while the driver is yours."
    decisionIdle: "Workflow {workflow} waits on you and nothing was decided since {since}: {tasks}. Run starci kernel next {workflow} --json --wait {wait} in the foreground now and decide each in this turn: an open decision by its route; a failed or returned task whose last answer held it, by a workflow-change (retry, edit or remove it, or hold it against a ticket, commit, need or time that releases it) or an escalation naming what it waits for. Never leave a decision open across a wake: one still undecided goes to the Supervisor, who rules it in your place. Never end your turn while the driver is yours."
