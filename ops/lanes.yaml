# The standard build flow: the lane every Work record walks, chosen by its family. The Work records with a lane are the
# brand (`.starciwork/brand`), the Master Plan (`.starciwork/master-plan.yaml`) and each environment resource (`.starciwork/_resources/environments/<name>`); a task over no such
# record walks no lane. A model fills the content of one step; it never decides which step comes next, which label repairs
# what (routes.yaml) or how many rounds. The Kernel plans dynamically: a step its evidence already satisfies is skipped.
# cli/src/harness/lanes.ts reads this file; `workflow define`, `amend` and every replan refuse FLOW_INCOMPLETE while a step of
# a Work record the graph covers is neither satisfied nor carried by a task of its label over that record.
#
# satisfiedWhen: evidence the code evaluates, any one of which satisfies the step:
#   record-exists       the record's file is in the Work tree
#   record-done         the record's state is done
#   task-green          a done task of the step's label over the record is in the ledger and its work is on the tree being judged:
#                       a task of the workflow itself, or one whose landed commit is an ancestor of the workflow's `base` (a task of
#                       a stopped workflow on another branch, or one that landed nothing, proves nothing; `onThisTree` of harness/lanes.ts)
# optionalUnless: a goal flag without which the step is optional (requiresSecurity, requiresPerf: the workflow file's
#   `requires` names security, perf).
# A step names any label with an op file, the folded ones (design, prove, inspect) included; while they are on trial the lanes keep the
# labels they supersede (ops/ops/README.md "Old labels and the ops that replace them"), and the swap of a step's label is one line here.
# Steps run in order: a task carrying a step depends on the tasks carrying the steps before it. `build` names the label a
# route `to: build` repairs with.
schema: starci/lanes@1
lanes:
  - id: brand
    match: [{family: brand}]
    steps:
      - {id: decide, label: docs, satisfiedWhen: [record-exists]}
  - id: master-plan
    match: [{family: master-plan}]
    steps:
      - {id: decide, label: docs, satisfiedWhen: [record-exists]}
  - id: operations
    match: [{family: environment}]
    build: deliver
    steps:
      - {id: deliver, label: deliver, satisfiedWhen: [task-green]}
      - {id: review, label: review, satisfiedWhen: [task-green]}
