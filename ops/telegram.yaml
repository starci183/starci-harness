# The owner's Telegram channel, read by cli/src/harness/telegram.ts (`starci connect telegram`, `starci supervisor telegram-bridge`).
# The bot token is read by name through the CLI's secret loader (`tokenVariable`, listed in policy/security.yaml secretKeys).
# STARCI_TELEGRAM_API replaces `apiBase` (the bench points it at its stand-in).
schema: starci/telegram@1
# The key that holds the bot token, in the environment or secret.env.
tokenVariable: TELEGRAM_BOT_TOKEN
apiBase: https://api.telegram.org
# How long one getUpdates long poll of the bridge waits for the owner, and how long any one API call may take.
pollSeconds: 25
requestTimeoutSeconds: 40
# The bridge is alive while its last beat is this recent; a newer bridge started meanwhile exits at once.
staleSeconds: 120
# At most this many notices in any minute; the rest wait for the next sweep. A notice whose send failed is tried this many times.
sendPerMinute: 6
sendTries: 3
# A notice carries at most this many characters of a question or a reason.
questionChars: 700
# A ticket below blocking severity (harness-internal noise) is noticed only once it was seen more than this many times.
ticketOccurrences: 5
# The one decorative banner every ticket notice is sent with (generated once with Codex's image generation), relative to ops/;
# uploaded once, then sent by the file id Telegram keeps it under. The ticket's facts are the caption and the buttons.
banner: telegram/ticket-banner.png
# The link of the "Xem commit" button of a fixed ticket.
commitUrl: https://github.com/starci183/starci-harness/commit/{sha}
# How long the "Tắt tiếng 1h" button holds back the defect notices.
muteMinutes: 60
