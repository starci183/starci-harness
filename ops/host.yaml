# The services a host runs for the harness, read by cli/src/harness/host.ts (`starci host status|up|install|uninstall`).
# An argv runs without a shell. Tokens: {starci} is this CLI (node and its main.js), {node} this Node, {orca} the Orca CLI
# (STARCI_ORCA_BIN honoured), {state} the state base, {shared-state} the state base shared by every checkout of this machine (the main checkout's `.runtime`, or STARCI_LOCAL_ROOT), {runtime} the runtime root, {env:NAME} an environment variable.
# A check is up when it exits 0 and, with `json`, when the value at `path` of its json output equals `equals`.
# `install` registers a service to run by itself (kind schedule: a scheduled task named StarCi ...), or nothing (kind none).
# A check is an `argv` or an `http` URL (the declared status, default 200). `start` may add `env` (its values expand the tokens) and `secrets` (secret-loader keys, never argv);
# `stack` names the compose project a service is a container of (`host up|status|down --stack <name>` select it).
# `stop` is what `host down` runs (a stop, never a removal); `waitSeconds` on a service overrides the file's for that service.
schema: starci/host@1
# How long `host up` waits for a started service's check to turn up, and how long one check may run.
waitSeconds: 120
checkTimeoutSeconds: 30
services:
  - id: orca
    summary: the Orca app and its runtime, which every seat runs in
    platform: any
    check:
      argv: ["{orca}", status, --json]
      json:
        path: result.runtime.reachable
        equals: true
    start:
      argv: ["{orca}", open]
    install:
      kind: none
    requires: []
  - id: docker
    summary: Docker Desktop, which runs the pinned uat image
    platform: win32
    check:
      argv: [docker, info, --format, "{{.ServerVersion}}"]
    start:
      argv: ["{env:LOCALAPPDATA}/Programs/DockerDesktop/Docker Desktop.exe"]
      detach: true
    install:
      kind: none
    requires: []
  - id: supervisors
    summary: every project's [Supervisor] seat, ensured by one supervisor tick
    platform: any
    check:
      argv: ["{starci}", supervisor, status, --json]
      json:
        path: data.liveness
        equals: alive
    start:
      argv: ["{starci}", supervisor, tick, --execute]
    install:
      kind: none
    requires: [orca]
  - id: supervisor-tick
    summary: the one host-wide process, a supervisor tick every minute that keeps every Supervisor and its tree alive with no LLM awake
    platform: any
    install:
      kind: schedule
      name: StarCi Supervisor Tick
      everyMinutes: 1
      argv: ["{starci}", supervisor, tick, --execute]
      env:
        STARCI_ROLE: supervisor
      log: "{state}/tick.log"
    requires: [orca]
  - id: telegram-bridge
    summary: the owner's Telegram channel (ops/telegram.yaml), notices out and the owner's replies in as owner requests; needs TELEGRAM_BOT_TOKEN in secret.env or the environment and a chat stored by connect telegram discover-chat
    platform: any
    check:
      argv: ["{starci}", connect, telegram, bridge, status, --json]
      json:
        path: data.liveness
        equals: alive
    start:
      argv: ["{starci}", connect, telegram, bridge, run]
      detach: true
    install:
      kind: schedule
      name: StarCi Telegram Bridge
      everyMinutes: 1
      argv: ["{starci}", connect, telegram, bridge, run]
      env:
        STARCI_ROLE: owner
      log: "{state}/telegram-bridge.log"
    requires: []
  # The host stack `starci`: one docker compose project (project name, container names and volume names fixed), its files in
  # ops/host/stack/ (sonar.yaml, tunnel.yaml, registry.yaml). Every container of it is a service here with `stack: starci`, and
  # `starci host up --stack starci` brings the whole stack up. `start` runs `docker compose up -d --no-recreate <service>`: only what is
  # down starts, a running container is never recreated, and no volume is touched. `stop` is `docker stop`, never `compose down`.
  # `secrets` come from the CLI's secret loader (policy/security.yaml secretKeys) into the compose process's environment only.
  # A check's `http` reads one URL (a status, and with `json` a body value).
  - id: sonar-postgres
    summary: the PostgreSQL of the shared SonarQube (container starci-sonarqube-postgres, volume starci-sonarqube-postgres-data), healthy
    platform: any
    stack: starci
    check:
      argv: [docker, inspect, --format, '{"status":"{{if .State.Running}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}"}', starci-sonarqube-postgres]
      json:
        path: status
        equals: healthy
    start:
      argv: [docker, compose, --project-directory, "{runtime}/ops/host/stack", -f, "{runtime}/ops/host/stack/sonar.yaml", up, -d, --no-recreate, sonarqube-postgres]
      secrets: [SONARQUBE_DB_PASSWORD, SONARQUBE_ADMIN_PASSWORD]
    stop:
      argv: [docker, stop, starci-sonarqube-postgres]
    install:
      kind: none
    requires: [docker]
  - id: sonar
    summary: the shared SonarQube (container starci-sonarqube, served on 127.0.0.1:9010), its status API saying UP
    platform: any
    stack: starci
    waitSeconds: 300
    check:
      http:
        url: http://127.0.0.1:9010/api/system/status
      json:
        path: status
        equals: UP
    start:
      argv: [docker, compose, --project-directory, "{runtime}/ops/host/stack", -f, "{runtime}/ops/host/stack/sonar.yaml", up, -d, --no-recreate, sonarqube]
      env:
        STARCI_PORT_SONARQUBE: "9010"
      secrets: [SONARQUBE_DB_PASSWORD, SONARQUBE_ADMIN_PASSWORD]
    stop:
      argv: [docker, stop, starci-sonarqube]
    install:
      kind: none
    requires: [sonar-postgres]
  - id: sonar-bootstrap
    summary: the one-shot job that replaces SonarQube's default admin password (container starci-sonarqube-bootstrap), exited 0
    platform: any
    stack: starci
    check:
      argv: [docker, inspect, --format, '{"done":{{if and (eq .State.Status "exited") (eq .State.ExitCode 0)}}true{{else}}false{{end}}}', starci-sonarqube-bootstrap]
      json:
        path: done
        equals: true
    start:
      argv: [docker, compose, --project-directory, "{runtime}/ops/host/stack", -f, "{runtime}/ops/host/stack/sonar.yaml", up, -d, --no-recreate, sonarqube-bootstrap]
      env:
        STARCI_PORT_SONARQUBE: "9010"
      secrets: [SONARQUBE_DB_PASSWORD, SONARQUBE_ADMIN_PASSWORD]
    install:
      kind: none
    requires: [sonar]
  - id: sonar-tunnel
    summary: the Cloudflare tunnel (container starci-cloudflared-sonarqube) that publishes the SonarQube as https://sonar.starci.org, the public origin answering
    platform: any
    stack: starci
    waitSeconds: 60
    check:
      http:
        url: https://sonar.starci.org/api/server/version
    start:
      argv: [docker, compose, --project-directory, "{runtime}/ops/host/stack", -f, "{runtime}/ops/host/stack/sonar.yaml", -f, "{runtime}/ops/host/stack/tunnel.yaml", up, -d, --no-recreate, cloudflared-sonarqube]
      env:
        STARCI_PORT_SONARQUBE: "9010"
      secrets: [SONARQUBE_DB_PASSWORD, SONARQUBE_ADMIN_PASSWORD, CLOUDFLARE_TUNNEL_TOKEN]
    stop:
      argv: [docker, stop, starci-cloudflared-sonarqube]
    install:
      kind: none
    requires: [sonar, sonar-bootstrap]
  - id: local-registry
    summary: the npm registry on 127.0.0.1:4873 that `deps publish-local` publishes to (container starci-local-registry, Verdaccio; its config in ops/host/stack/, its storage the named volume starci-local-registry-storage)
    platform: any
    stack: starci
    check:
      http:
        url: http://127.0.0.1:4873/-/ping
    start:
      argv: [docker, compose, --project-directory, "{runtime}/ops/host/stack", -f, "{runtime}/ops/host/stack/registry.yaml", up, -d, --no-recreate, local-registry]
    stop:
      argv: [docker, stop, starci-local-registry]
    install:
      kind: none
    requires: [docker]
