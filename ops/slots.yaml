# The machine-wide lane slots: how many lanes run one kind of job at once (an install, a gate, a shot, the shared stack) across every checkout
# and agent of a host; each heavy command inside a job also takes one of the host's heavy slots (ops/liveness.yaml heavy, one per gbPerSlot GB of
# RAM) while it runs. Read by
# cli/src/harness/slots.ts (`starci slot take|release|list|run|kill`, `starci lane gate`, `starci gallery shoot` and `starci app look`). A slot is one row of
#   `lane_slots` in the host store (machine.sqlite, the same file for every CLI copy and folder), naming the ONE process it lives as long as (pid and start),
#   its command and its child; taken in one transaction, deleted the moment that process lets it go, released only by the holder it names.
# root: the lanes folder (land status, the dev lock, run records); null is `<shared harness state>/slots`. STARCI_LANES_DIR and a verb's --dir override it,
#   and the lane verbs (`lane gate`, `lane status`) fall back to it when neither is given. A lock file `file` there (an older copy's, or a script's) is foreign:
#   never written, honoured as holding its number while its holder is not proven gone.
# Each kind: `count` numbered slots (`file` with {n}: the name of a foreign lock file of slot n); `burst` more slots, numbered after them, open only while the host has
#   `burst.minFreeMb` free; `minFreeMb` the free memory every take of the kind waits for; `pollSeconds` how often a waiting take tries
#   again; `heavy` the heavy-command kind (ops/liveness.yaml heavy.caps) an npm command run under the slot is governed as.
# A slot is reclaimed only on evidence that its holder is gone: the host booted after it was taken, its pid is not alive, or its pid now belongs
#   to a process started at another time. Age is never evidence: a slot older than `warnMinutes` is reported as old (`slot list`), never removed.
#   `slot kill` kills the process tree of a slot's proven holder as a last resort. Every take, release, reclaim and kill is logged with its evidence in
#   `slot_events` of the host store (`slot list --events N`).
# One slot per lane per kind: a take for a lane that holds one returns it. A lane's slots are released when it lands or is removed (`lane remove`).
# reap.graceMinutes: a run the harness started under a slot (or an app check) records its launchers in `<root>/_runs/`; once a launcher
#   has been gone this long, `starci ops reap --execute` stops the run's process tree (cli/src/harness/runs.ts).
# janitor: what `starci lane prune-installs` and the land step of `lane gate --land` delete from a lane worktree (the ignored folders named in
#   `dirs`, links unlinked first, never deleted through), and how long a worktree must be idle before prune-installs takes it (`idleHours`).
#   A worktree still in use is never taken, by the land step or by prune-installs: touched within `touchedMinutes` (default 60; the newest of
#   its git index, HEAD and top-level entries), uncommitted work in it, a branch with commits after the landed sha, a process inside it.
schema: starci/slots@1
root: null
reap:
  graceMinutes: 10
janitor:
  idleHours: 6
  touchedMinutes: 60
  dirs: [node_modules, .next, dist, .turbo]
kinds:
  npm:
    count: 3
    file: "_npm-slot-{n}.lock"
    burst: { count: 1, minFreeMb: 10240 }
    warnMinutes: 30
    pollSeconds: 60
    heavy: install
  gate:
    count: 5
    file: "_gate-slot-{n}.lock"
    warnMinutes: 120
    pollSeconds: 5
  shoot:
    count: 3
    file: "_shoot-slot-{n}.lock"
    burst: { count: 3, minFreeMb: 10240 }
    minFreeMb: 6144
    warnMinutes: 30
    pollSeconds: 15
  stack:
    count: 1
    file: "_stack.lock"
    warnMinutes: 45
    pollSeconds: 120
