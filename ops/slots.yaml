# The machine-wide lane slots: how many lanes run one kind of job at once (an install, a gate, a shot, the shared stack) across every checkout
# and agent of a host; each heavy command inside a job also takes one of the host's heavy slots (ops/liveness.yaml heavy, one per gbPerSlot GB of
# RAM) while it runs. Read by
# cli/src/harness/slots.ts (`starci slot take|release|list|run`, `starci lane gate`, `starci gallery shoot` and the batch lander's
# own npm and gate slots). A slot is one lock file in the slot root, taken by an exclusive create, released only by the holder it names.
# root: the folder holding the slot files; null is `<shared harness state>/slots`. STARCI_LANES_DIR and a verb's --dir override it,
#   and the lane verbs (`lane ready|land|status|withdraw`) fall back to it when neither is given.
# Each kind: `count` numbered slots (`file` with {n}); `burst` more slots, numbered after them, open only while the host has
#   `burst.minFreeMb` free; `minFreeMb` the free memory every take of the kind waits for; `pollSeconds` how often a waiting take tries
#   again; `heavy` the heavy-command kind (ops/liveness.yaml heavy.caps) an npm command run under the slot is governed as.
# A slot line is `<lane> <taken> pid=<pid> start=<pid start> boot=<host boot> host=<host>`. It is reclaimed only on evidence that its
#   holder is gone: the host booted after it was taken, its pid is not alive, or its pid now belongs to a process started at another time.
#   Age is never evidence: a slot older than `warnMinutes` is reported as old (`slot list`), never removed. Every reclaim is logged
#   with its evidence in `<root>/_slots.log`.
# One slot per lane per kind: a take for a lane that holds one returns it. A lock with no pid (the old helper) is also reclaimed when its lane
#   has no worktree under the root (`gone`). A lane's slots are released when it lands, is rejected or is removed (`lane remove`).
# reap.graceMinutes: a run the harness started under a slot (or an app check) records its launchers in `<root>/_runs/`; once a launcher
#   has been gone this long, `starci ops reap --execute` and the batch lander stop the run's process tree (cli/src/harness/runs.ts).
# janitor: what `starci lane prune-installs` and the batch lander's land step delete from a lane worktree (the ignored folders named in
#   `dirs`, links unlinked first, never deleted through), and how long a worktree must be idle before prune-installs takes it (`idleHours`).
#   A worktree still in use is never taken, by the land step or by prune-installs: touched within `touchedMinutes` (default 60; the newest of
#   its git index, HEAD and top-level entries), uncommitted work in it, a branch with commits after the landed sha, a process inside it.
schema: starci/slots@1
root: null
reap:
  graceMinutes: 10
janitor:
  idleHours: 6
  touchedMinutes: 60
  dirs: [node_modules, .next, dist, .turbo]
kinds:
  npm:
    count: 3
    file: "_npm-slot-{n}.lock"
    burst: { count: 1, minFreeMb: 10240 }
    warnMinutes: 30
    pollSeconds: 60
    heavy: install
  gate:
    count: 5
    file: "_gate-slot-{n}.lock"
    warnMinutes: 120
    pollSeconds: 5
  shoot:
    count: 3
    file: "_shoot-slot-{n}.lock"
    burst: { count: 3, minFreeMb: 10240 }
    minFreeMb: 6144
    warnMinutes: 30
    pollSeconds: 15
  stack:
    count: 1
    file: "_stack.lock"
    warnMinutes: 45
    pollSeconds: 120
