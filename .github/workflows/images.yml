# Publishes a harness-owned runtime layer image (images/<name>/ with a `layerOf` entry in images/sources.json) to GHCR. It runs only when the owner
# dispatches it (CONTRIB-20 and harness rule 5: a publication waits for the owner's yes); nobody pushes an image by hand. The job logs the digest;
# the digest and the run are then recorded in images/sources.json `published`, and the app image folders pin that digest.
name: images

on:
  workflow_dispatch:
    inputs:
      image:
        description: The layer to publish (a key of images/sources.json with a layerOf)
        required: true
        default: openclaw-runtime
      version:
        description: The tag to publish (for example 2026.10.10-beta.5-starci.1)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the recipe
        id: recipe
        run: |
          node -e "
            const image = require('./images/sources.json')[process.env.IMAGE];
            if (!image || !image.layerOf) { console.error('not a runtime layer: ' + process.env.IMAGE); process.exit(1); }
            const out = require('node:fs').appendFileSync;
            out(process.env.GITHUB_OUTPUT, 'context=' + image.context + '\n');
            out(process.env.GITHUB_OUTPUT, 'dockerfile=' + image.dockerfile + '\n');
            out(process.env.GITHUB_OUTPUT, 'image=' + image.image + '\n');
            out(process.env.GITHUB_OUTPUT, 'platforms=' + image.platforms.join(',') + '\n');
          "
        env:
          IMAGE: ${{ inputs.image }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.recipe.outputs.context }}
          file: ${{ steps.recipe.outputs.dockerfile }}
          platforms: ${{ steps.recipe.outputs.platforms }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.recipe.outputs.image }}:${{ inputs.version }}
      - name: Record the digest
        run: echo "${{ steps.recipe.outputs.image }}:${{ inputs.version }}@${{ steps.push.outputs.digest }}"
