name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# On a pull request only the newest run matters: a push cancels the run still going for its older commit. A run
# on main is never cut short, since its publish jobs publish one package after another: a newer push waits as the one
# pending run (an even newer push replaces it), then publishes whatever is still due, so a package late in the
# publication order reaches npm even while main moves faster than one run lasts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # What this run checks. A pull request is measured from its base, a push to main from the last main commit whose ci run
  # succeeded (else its parent), and `starci release affected` turns the diff into the packages to test (each with the siblings
  # it needs built first), the harness job and the app job. A manual run, or a base that cannot be read, checks everything.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      matrix: ${{ steps.plan.outputs.matrix }}
      packages: ${{ steps.plan.outputs.packages }}
      harness: ${{ steps.plan.outputs.harness }}
      app: ${{ steps.plan.outputs.app }}
      app-build: ${{ steps.plan.outputs.app-build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: The base this run is measured from
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1"
          base=""
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*)
              base="$PR_BASE" ;;
            push:refs/heads/main)
              base=$(gh api "$runs" --jq '.workflow_runs[0].head_sha // empty')
              # No successful run, or one off this history: the parent, and with no parent nothing (everything is checked).
              if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then
                base=""
                if git rev-parse --verify --quiet HEAD~1 > /dev/null; then base=$(git rev-parse HEAD~1); fi
              fi ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Build the CLI
        working-directory: cli
        run: npx tsc -p tsconfig.build.json
      - name: The affected packages and jobs
        id: plan
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          node cli/dist/main.js release affected --base "$BASE" --json > affected.json
          node -e '
            const { data } = JSON.parse(require("fs").readFileSync("affected.json", "utf8"))
            for (const line of data.summary) console.log(line)
            const lines = [
              `matrix=${JSON.stringify(data.matrix)}`,
              `packages=${data.packages.length > 0}`,
              `harness=${data.harness}`,
              `app=${data.app}`,
              `app-build=${data.appBuild.join(" ")}`,
            ]
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n")
          '

  # The always-on light gates, one job each, over the whole tree. A `repo` gate judges every package and gates the packages
  # publish; a `harness` gate judges the CLI and the trees it reads and gates only the CLI publish.
  gates:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: anatomy drift (contexts/project/anatomy.md)
            scope: harness
            run: contexts anatomy
          - gate: loosening (policy/loosening.yaml)
            scope: repo
            run: check loosening
          - gate: secret scan of the whole tree (policy/security.yaml)
            scope: repo
            run: check secrets --all
          - gate: harness shape (contexts/hfs/harness.yaml)
            scope: repo
            run: check shape
          - gate: CLI pins (the CLI's @starci requirements and lockfile at contexts/stack/pins.yaml)
            scope: harness
            run: check pins
          - gate: heavy spawn sites (every heavy command through the governor of cli/src/harness/heavy.ts)
            scope: harness
            run: check heavy-sites
          - gate: contexts anchors (one place per anchor, no dangling link)
            scope: harness
            run: contexts anchor
          - gate: contexts search index (cli/dist/contexts-search.json matches the tree)
            scope: harness
            run: contexts search
    # publish-packages reads the `repo` gates by this name's prefix.
    name: gate (${{ matrix.scope }}) ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Build the CLI
        working-directory: cli
        run: npm run build
      - name: ${{ matrix.gate }}
        env:
          GATE: ${{ matrix.run }}
        # GATE is one of the fixed commands above; word splitting turns it into the verb's arguments.
        run: node cli/dist/main.js $GATE

  # One job per affected package: its build order (the siblings it needs, then itself) is installed and built, its built
  # declarations name `.js` only (tsc keeps a source's `.ts` specifier, which a consumer's tsc cannot read; packages/README.md,
  # build convention), and its specs run.
  package:
    needs: plan
    if: needs.plan.outputs.packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # publish-packages reads each leg by this name.
    name: package (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and build ${{ matrix.package }} after the siblings it needs
        env:
          BUILD: ${{ matrix.build }}
        run: for dir in $BUILD; do (cd "$dir" && npm ci --no-audit --no-fund && npm run build --if-present); done
      - name: Declarations name .js
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ -d "$PACKAGE/dist" ] && grep -rnE "(from |import\()[\"']\.\.?/[^\"']+\.ts[\"']" "$PACKAGE/dist" --include=*.d.ts; then
            echo "a built declaration imports a .ts specifier"; exit 1
          fi
      - name: Test ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: npm test
      # hfs's build (run by its test above) is the source of the runtime copies the canon packages bundle; a copy that
      # drifted from it, or a file in one that its runtime/bundle.json does not list, fails here.
      - name: Bundle copies match the hfs build
        if: matrix.package == 'packages/hfs'
        working-directory: ${{ matrix.package }}
        run: npm run bundles:check

  # The CLI and the trees it reads (cli/, contexts/, ops/, policy/, or a package the CLI requires changed).
  harness:
    needs: plan
    if: needs.plan.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Typecheck the CLI
        working-directory: cli
        run: npm run typecheck
      - name: Typecheck the CI scripts
        run: node cli/node_modules/typescript/bin/tsc -p .github/scripts/tsconfig.json
      - name: Lint the CLI
        working-directory: cli
        run: npm run lint
      - name: Build the CLI
        working-directory: cli
        run: npm run build

  # The desktop app typechecks against cli/src/core/ui/contract.ts and installs packages/grammar as a file: copy, built first;
  # its bundles are built by .github/workflows/app.yml.
  app:
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and build the packages the app needs
        env:
          BUILD: ${{ needs.plan.outputs.app-build }}
        run: for dir in $BUILD; do (cd "$dir" && npm ci --no-audit --no-fund && npm run build --if-present); done
      - name: Typecheck and build the desktop app
        working-directory: app
        run: npm ci --no-audit --no-fund && npm run build

  # Once per pull request and push to main: the CLI is analysed for issues and duplication, never coverage
  # (sonar-project.properties), so it needs nothing the other jobs build.
  sonar:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar reads the history to find new code.
          fetch-depth: 0
      - name: Sonar (new-code gate, policy/quality.yaml ci.sonar-new-code)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  # The one required check: green when the plan and every job it needed passed, a job the plan did not need being skipped.
  ci:
    needs: [plan, gates, package, harness, app, sonar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS)
            const bad = Object.entries(needs).filter(([job, run]) => job === "plan" ? run.result !== "success" : !["success", "skipped"].includes(run.result))
            for (const [job, run] of Object.entries(needs)) console.log(`${job}: ${run.result}`)
            if (bad.length > 0) { console.log(`not green: ${bad.map(([job]) => job).join(", ")}`); process.exit(1) }
          '

  # The one publishing path (CONTRIBUTING.md CONTRIB-20), on a push to main whose plan affects a package or the CLI, in two
  # jobs that never wait for `ci`: publish-packages publishes each package as soon as its own jobs are green, publish-cli the
  # CLI after it once the harness jobs are green. Each runs `starci release publish` (cli/src/core/release/publish.ts), which
  # judges the plan before anything reaches npm and reads every version back. With provenance; a version already on npm is
  # skipped, so a re-run publishes only what is still missing; runs of one job queue, never overlap.
  publish-packages:
    needs: [plan, gates, package]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.result == 'success'
      && (needs.plan.outputs.packages == 'true' || needs.plan.outputs.harness == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-packages
      cancel-in-progress: false
    permissions:
      contents: read
      # The check step reads this run's job conclusions.
      actions: read
      # npm provenance signs each tarball with this workflow's OIDC identity.
      id-token: write
    outputs:
      held: ${{ steps.due.outputs.held }}
    steps:
      # Full history: the plan diffs each affected package from the commit npm recorded for its published version, and the
      # publish reads that this commit is on origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Build the CLI
        working-directory: cli
        run: npm run build
      # Refused before anything reaches npm: RELEASE_VERSION_NOT_BUMPED names a package changed since the plan's base whose
      # version is already on npm, RELEASE_DEPENDENCY_SKEW and RELEASE_DEPENDENCY_UNPUBLISHED a due package against its siblings
      # (the CLI requires a sibling npm serves; publish-cli judges it at its stack pins). A due package then
      # publishes only when every `gate (repo)` job is green and the `package` job of each folder of its build order (itself
      # and the siblings it needs) that this run tested is green; any other due package is held, and named.
      - name: Judge the plan and this run's jobs
        id: due
        env:
          BASE: ${{ needs.plan.outputs.base }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/publish-plan.json"
          every="$RUNNER_TEMP/every-package.json"
          jobs="$RUNNER_TEMP/jobs.json"
          node cli/dist/main.js release publish --base "$BASE" --json > "$plan" || { cat "$plan"; exit 1; }
          node cli/dist/main.js release affected --json > "$every"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {name, conclusion}' > "$jobs"
          PLAN="$plan" EVERY="$every" JOBS="$jobs" node .github/scripts/publish-gate.mts
      # npm publish packs each package through its prepack build, which needs its devDependencies and the siblings it installs.
      - name: Install and build the publishable packages after the siblings they need
        if: steps.due.outputs.build != ''
        env:
          BUILD: ${{ steps.due.outputs.build }}
        run: for dir in $BUILD; do (cd "$dir" && npm ci --no-audit --no-fund && npm run build --if-present); done
      # The token reaches npm alone: a user config naming the variable, set only for this step, never echoed. One package per
      # call, in the judged order (a dependency before its dependent), stopping at the first refusal.
      - name: Publish each publishable package not on npm
        if: steps.due.outputs.publish != ''
        env:
          BASE: ${{ needs.plan.outputs.base }}
          PUBLISH: ${{ steps.due.outputs.publish }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/publish.npmrc"
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          for dir in $PUBLISH; do node cli/dist/main.js release publish --execute --base "$BASE" --package "$dir"; done

  # Phase 2: the CLI (starci-harness), after publish-packages, once the harness job and every gate are green (Sonar and the app
  # job never gate a publish). It publishes as committed, its @starci requirements and lockfile at their stack pins
  # (CLI_PIN_SKEW otherwise, also the `check pins` gate); a due sibling it requires that publish-packages held refuses it here.
  publish-cli:
    needs: [plan, gates, harness, publish-packages]
    if: >-
      !cancelled() && needs.publish-packages.result == 'success' && needs.gates.result == 'success'
      && (needs.harness.result == 'success' || needs.harness.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-cli
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Build the CLI
        working-directory: cli
        run: npm run build
      - name: Judge the plan and the held siblings
        id: due
        env:
          BASE: ${{ needs.plan.outputs.base }}
          HELD: ${{ needs.publish-packages.outputs.held }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/publish-plan.json"
          # A CLI whose @starci requirements trail their stack pins waits: cli-follow raises them once npm serves the pins, and the
          # run of that commit publishes it.
          if ! node cli/dist/main.js check pins > "$RUNNER_TEMP/pins.txt"; then
            cat "$RUNNER_TEMP/pins.txt"
            echo "::notice::the CLI trails its stack pins; cli-follow moves it onto them and the run of that commit publishes it"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "verdict: pending" "$RUNNER_TEMP/pins.txt"; then
            cat "$RUNNER_TEMP/pins.txt"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node cli/dist/main.js release publish --base "$BASE" --package cli --json > "$plan" || { cat "$plan"; exit 1; }
          PLAN="$plan" node -e '
            const fs = require("fs")
            const row = JSON.parse(fs.readFileSync(process.env.PLAN, "utf8")).data.rows.find((candidate) => candidate.dir === "cli")
            console.log(`${row.package}@${row.version}: ${row.action}`)
            const cli = JSON.parse(fs.readFileSync("cli/package.json", "utf8"))
            const requires = new Set(Object.keys({ ...cli.dependencies, ...cli.peerDependencies }))
            const held = (process.env.HELD ?? "").split(" ").filter((dir) => dir !== "")
              .filter((dir) => requires.has(JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8")).name))
            if (row.action === "publish" && held.length > 0) {
              console.log(`::error::${row.package}@${row.version} requires ${held.join(", ")}, held by publish-packages; it publishes once they do`)
              process.exit(1)
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `due=${row.action === "publish"}\n`)
          '
      - name: Publish the CLI
        if: steps.due.outputs.due == 'true'
        env:
          BASE: ${{ needs.plan.outputs.base }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/publish.npmrc"
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          node cli/dist/main.js release publish --execute --base "$BASE" --package cli

  # The CLI follows its siblings by itself (.github/scripts/cli-follow.mts): once publish-packages put the pinned versions on npm,
  # this job raises the CLI's requirement and lockfile to the stack pins, bumps its prerelease when that version is on npm, records
  # it in CHANGELOG.md and pushes the commit to main. It pushes with HARNESS_BOT_TOKEN (a fine-grained token with contents: write on
  # this repository), because a push made with GITHUB_TOKEN starts no workflow run; the run of that commit publishes the CLI. With
  # nothing to follow it changes nothing, so its own commit's run ends here.
  cli-follow:
    needs: [plan, publish-packages]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish-packages.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: cli-follow
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # Without the secret the job only reports what it would move: the owner adds HARNESS_BOT_TOKEN once.
      HAS_BOT_TOKEN: ${{ secrets.HARNESS_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.HARNESS_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Build the CLI
        working-directory: cli
        run: npm run build
      - name: Move the CLI onto the pins npm serves
        id: follow
        run: |
          set -euo pipefail
          # check pins exits 1 when the CLI trails its pins, the case this job moves; any other failure stops the job.
          status=0
          node cli/dist/main.js check pins --json > "$RUNNER_TEMP/pins.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          SKEWS="$RUNNER_TEMP/pins.json" node .github/scripts/cli-follow.mts
      - name: Report a missing bot token
        if: steps.follow.outputs.changed == 'true' && env.HAS_BOT_TOKEN != 'true'
        run: echo "::warning::the CLI trails its pins but HARNESS_BOT_TOKEN is not set, so cli-follow cannot push its commit; add the secret (contents write on this repository) or move the CLI by hand"
      - name: Commit and push
        if: steps.follow.outputs.changed == 'true' && env.HAS_BOT_TOKEN == 'true'
        env:
          MESSAGE: ${{ steps.follow.outputs.message }}
        run: |
          set -euo pipefail
          git config user.name "starci-harness-bot"
          git config user.email "starci-harness-bot@users.noreply.github.com"
          git add cli/package.json cli/package-lock.json CHANGELOG.md
          git commit -m "$MESSAGE"
          git push origin HEAD:main
