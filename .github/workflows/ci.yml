name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar reads the history to find new code.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the CLI
        working-directory: cli
        run: npm ci
      - name: Typecheck the CLI
        working-directory: cli
        run: npm run typecheck
      - name: Lint the CLI
        working-directory: cli
        run: npm run lint
      - name: Build the CLI
        working-directory: cli
        run: npm run build
      - name: Anatomy drift (contexts/project/anatomy.md)
        run: node cli/dist/main.js contexts anatomy --check
      - name: Loosening gate (policy/loosening.yaml)
        run: node cli/dist/main.js check loosening
      - name: Secret scan of the whole tree (policy/security.yaml)
        run: node cli/dist/main.js check secrets --all
      - name: Harness shape (contexts/hfs/harness.yaml)
        run: node cli/dist/main.js check shape
      # Specs read sibling packages by relative path and the Grammar lint packages install siblings as file: copies,
      # which npm packs from the sibling's folder (its dist/ included), so every package is installed and built, in
      # folder order, before any is tested (packages/README.md, build convention).
      - name: Install and build packages
        run: for dir in packages/*/; do (cd "$dir" && npm ci --no-audit --no-fund && npm run build --if-present); done
      # tsc keeps a source's relative `.ts` specifier in the declarations it emits; a consumer's tsc cannot read those, so a
      # built package's .d.ts names `.js` only (packages/README.md, build convention).
      - name: Declarations name .js
        run: |
          if grep -rnE "(from |import\()[\"']\.\.?/[^\"']+\.ts[\"']" packages/*/dist --include=*.d.ts; then
            echo "a built declaration imports a .ts specifier"; exit 1
          fi
      - name: Test packages
        run: for dir in packages/*/; do (cd "$dir" && npm test); done
      # The desktop app typechecks against cli/src/core/ui/contract.ts and installs packages/grammar (built by its test
      # above) as a file: copy; its bundles are built by .github/workflows/app.yml.
      - name: Typecheck and build the desktop app
        working-directory: app
        run: npm ci --no-audit --no-fund && npm run build
      - name: Sonar (new-code gate, policy/quality.yaml ci.sonar-new-code)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance signs each tarball with this workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The CLI (starci-harness) and every package under packages/ are published with provenance, except a private
      # one and a version already on npm; a prerelease version goes under the dist-tag it names (1.0.0-alpha.1: alpha).
      - name: Publish the CLI and the packages whose version is not on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in cli/ packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if [ "$(node -p "require('./${dir}package.json').private === true")" = "true" ]; then
              echo "$name is private"
              continue
            fi
            if found=$(npm view "$name@$version" version 2>/dev/null) && [ "$found" = "$version" ]; then
              echo "$name@$version is already on npm"
              continue
            fi
            tag=$(node -p "(/^\d+\.\d+\.\d+-([A-Za-z]+)/.exec('$version') ?? [])[1] ?? 'latest'")
            (cd "$dir" && npm ci --no-audit --no-fund && npm publish --access public --provenance --tag "$tag")
            # The registry answers 404 for a few minutes after a publish ("being processed"); wait for it, up to 10 minutes.
            for attempt in $(seq 1 20); do
              [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ] && break
              [ "$attempt" = 20 ] && { echo "$name@$version is not visible on npm after 10 minutes"; exit 1; }
              sleep 30
            done
            echo "published $name@$version ($tag)"
          done
