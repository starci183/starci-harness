name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar reads the history to find new code.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the CLI
        working-directory: cli
        run: npm ci
      - name: Typecheck the CLI
        working-directory: cli
        run: npm run typecheck
      - name: Lint the CLI
        working-directory: cli
        run: npm run lint
      - name: Build the CLI
        working-directory: cli
        run: npm run build
      - name: Anatomy drift (knowledge/project/anatomy.md)
        run: node cli/dist/main.js knowledge anatomy --check
      - name: Loosening gate (policy/loosening.yaml)
        run: node cli/dist/main.js check loosening
      - name: Secret scan of the whole tree (policy/security.yaml)
        run: node cli/dist/main.js check secrets --all
      # The two ESLint canons read each other's fixtures and rules, so every package is installed before any is tested.
      - name: Install packages
        run: for dir in packages/*/; do (cd "$dir" && npm ci --no-audit --no-fund); done
      - name: Test packages
        run: for dir in packages/*/; do (cd "$dir" && npm test); done
      - name: Sonar (new-code gate, policy/quality.yaml ci.sonar-new-code)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Every package under packages/ is published, except a private one and a version already on npm.
      - name: Publish the packages whose version is not on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if [ "$(node -p "require('./${dir}package.json').private === true")" = "true" ]; then
              echo "$name is private"
              continue
            fi
            if found=$(npm view "$name@$version" version 2>/dev/null) && [ "$found" = "$version" ]; then
              echo "$name@$version is already on npm"
              continue
            fi
            tag=$(node -p "(/^\d+\.\d+\.\d+-([A-Za-z]+)/.exec('$version') ?? [])[1] ?? 'latest'")
            (cd "$dir" && npm ci --no-audit --no-fund && npm publish --access public --tag "$tag")
            test "$(npm view "$name@$version" version)" = "$version"
            echo "published $name@$version ($tag)"
          done
