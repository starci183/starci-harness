name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest run matters, on a pull request and on main alike: a push cancels the run still going for its older commit, and
# the newer run tests the whole tree. Nothing here writes to npm or to main, so a cancelled run leaves nothing half done: the
# publication is publish.yml's, which starts when this workflow completes and is never cancelled (CONTRIBUTING.md CONTRIB-20).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this run checks. A pull request is measured from its base, a push to main from the last main commit whose ci run
  # succeeded (else its parent), and `starci release affected` turns the diff into the packages to test (each with the siblings
  # it needs built first), the harness job and the app job. A manual run, or a base that cannot be read, checks everything.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      matrix: ${{ steps.plan.outputs.matrix }}
      packages: ${{ steps.plan.outputs.packages }}
      harness: ${{ steps.plan.outputs.harness }}
      app: ${{ steps.plan.outputs.app }}
      app-build: ${{ steps.plan.outputs.app-build }}
      grammar: ${{ steps.plan.outputs.grammar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            packages/*/package-lock.json
            app/package-lock.json
      - name: The base this run is measured from
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1"
          base=""
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*)
              base="$PR_BASE" ;;
            push:refs/heads/main)
              base=$(gh api "$runs" --jq '.workflow_runs[0].head_sha // empty')
              # No successful run, or one off this history: the parent, and with no parent nothing (everything is checked).
              if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then
                base=""
                if git rev-parse --verify --quiet HEAD~1 > /dev/null; then base=$(git rev-parse HEAD~1); fi
              fi ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Build the CLI
        working-directory: cli
        run: npx tsc -p tsconfig.build.json
      - name: The affected packages and jobs
        id: plan
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          node cli/dist/main.js release affected --base "$BASE" --json > affected.json
          node -e '
            const { data } = JSON.parse(require("fs").readFileSync("affected.json", "utf8"))
            for (const line of data.summary) console.log(line)
            const lines = [
              `matrix=${JSON.stringify(data.matrix)}`,
              `packages=${data.packages.length > 0}`,
              `harness=${data.harness}`,
              `app=${data.app}`,
              `app-build=${data.appBuild.join(" ")}`,
              `grammar=${data.matrix.include.some((entry) => entry.package === "packages/grammar")}`,
            ]
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n")
            // What publish.yml reads back from this run: the base it was measured from and the packages it tested.
            const plan = { base: process.env.BASE, matrix: data.matrix, packages: data.packages.length > 0, harness: data.harness }
            require("fs").writeFileSync("ci-plan.json", JSON.stringify(plan))
          '
      - name: Hand the plan to publish.yml
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 14

  # The always-on light gates, one job each, over the whole tree. A `repo` gate judges every package and gates the packages
  # publish; a `harness` gate judges the CLI and the trees it reads and gates only the CLI publish.
  gates:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: anatomy drift (contexts/project/anatomy.md)
            scope: harness
            run: contexts anatomy
          - gate: loosening (policy/loosening.yaml)
            scope: repo
            run: check loosening
          - gate: secret scan of the whole tree (policy/security.yaml)
            scope: repo
            run: check secrets --all
          - gate: harness shape (contexts/hfs/harness.yaml)
            scope: repo
            run: check shape
          - gate: no business identifier in the tree (policy/business-terms.yaml)
            scope: repo
            run: check business
          - gate: CLI pins (the CLI's @starci requirements and lockfile at contexts/stack/pins.yaml)
            scope: harness
            run: check pins
          - gate: heavy spawn sites (every heavy command through the governor of cli/src/harness/heavy.ts)
            scope: harness
            run: check heavy-sites
          - gate: contexts anchors (one place per anchor, no dangling link)
            scope: harness
            run: contexts anchor
          - gate: contexts search index (cli/dist/contexts-search.json matches the tree)
            scope: harness
            run: contexts search
    # publish.yml reads the `repo` gates by this name's prefix.
    name: gate (${{ matrix.scope }}) ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            packages/*/package-lock.json
            app/package-lock.json
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Build the CLI
        working-directory: cli
        run: npm run build
      - name: ${{ matrix.gate }}
        env:
          GATE: ${{ matrix.run }}
        # GATE is one of the fixed commands above; word splitting turns it into the verb's arguments.
        run: node cli/dist/main.js $GATE

  # One job per affected package: its build order (the siblings it needs, then itself) is installed and built, its built
  # declarations name `.js` only (tsc keeps a source's `.ts` specifier, which a consumer's tsc cannot read; packages/README.md,
  # build convention), and its specs run.
  package:
    needs: plan
    if: needs.plan.outputs.packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # publish.yml reads each leg by this name.
    name: package (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            packages/*/package-lock.json
            app/package-lock.json
      - name: Install and build ${{ matrix.package }} after the siblings it needs
        env:
          BUILD: ${{ matrix.build }}
        run: for dir in $BUILD; do (cd "$dir" && npm ci --no-audit --no-fund && npm run build --if-present); done
      - name: Declarations name .js
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ -d "$PACKAGE/dist" ] && grep -rnE "(from |import\()[\"']\.\.?/[^\"']+\.ts[\"']" "$PACKAGE/dist" --include=*.d.ts; then
            echo "a built declaration imports a .ts specifier"; exit 1
          fi
      - name: Test ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: npm test
      # hfs's build (run by its test above) is the source of the runtime copies the canon packages bundle; a copy that
      # drifted from it, or a file in one that its runtime/bundle.json does not list, fails here.
      - name: Bundle copies match the hfs build
        if: matrix.package == 'packages/hfs'
        working-directory: ${{ matrix.package }}
        run: npm run bundles:check
      # The tested bits are the bits that publish: the package is packed here, once, after its specs and checks, and publish.yml
      # publishes this tarball as it is (stamped with the commit, never rebuilt). A private package is never published.
      - name: Pack ${{ matrix.package }}
        id: pack
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if [ "$(node -p 'Boolean(require("./package.json").private)')" = true ]; then exit 0; fi
          packs="$RUNNER_TEMP/tarballs"
          mkdir -p "$packs"
          npm pack --pack-destination "$packs" > /dev/null
          file=$(ls "$packs")
          echo "name=${file%.tgz}" >> "$GITHUB_OUTPUT"
      # Named by package, version and commit (the tarball's own name is package-version).
      - name: Keep the tarball for publish.yml
        if: steps.pack.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ steps.pack.outputs.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/tarballs/${{ steps.pack.outputs.name }}.tgz
          retention-days: 14
          if-no-files-found: error

  # The Grammar's theme proof, on a change to packages/grammar: a foreign set of HeroUI tokens repaints every part.
  # publish.yml holds the Grammar while this job is not green. The render proof is not part of CI; it runs by hand
  # (npm run prove-render in the pinned Playwright image, contexts/grammars/contributing.md "Render proof").
  grammar-proof:
    name: grammar proof
    needs: plan
    if: needs.plan.outputs.grammar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install the Grammar
        working-directory: packages/grammar
        run: npm ci --no-audit --no-fund
      - name: Build the Grammar
        working-directory: packages/grammar
        run: npm run build
      - name: Theme proof
        working-directory: packages/grammar
        run: |
          STARCI_BROWSER="$(find /ms-playwright -type f \( -name chrome -o -name headless_shell \) | head -1)"
          export STARCI_BROWSER
          npm run prove-theme

  # The CLI and the trees it reads (cli/, contexts/, ops/, policy/, or a package the CLI requires changed).
  harness:
    needs: plan
    if: needs.plan.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            packages/*/package-lock.json
            app/package-lock.json
      - name: Install the CLI on this commit's packages
        uses: ./.github/actions/cli-install
      - name: Typecheck the CLI
        working-directory: cli
        run: npm run typecheck
      - name: Typecheck the CI scripts
        run: node cli/node_modules/typescript/bin/tsc -p .github/scripts/tsconfig.json
      - name: Lint the CLI
        working-directory: cli
        run: npm run lint
      - name: Build the CLI
        working-directory: cli
        run: npm run build
      # The CLI's own tests (node --test over the built tests): a red one keeps publish.yml from publishing the CLI.
      - name: Test the CLI
        working-directory: cli
        run: node --test --test-concurrency=2 "dist/**/*.test.js"

  # The desktop app typechecks against cli/src/core/ui/contract.ts and installs packages/grammar as a file: copy, built first;
  # its bundles are built by .github/workflows/app.yml.
  app:
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            packages/*/package-lock.json
            app/package-lock.json
      - name: Install and build the packages the app needs
        env:
          BUILD: ${{ needs.plan.outputs.app-build }}
        run: for dir in $BUILD; do (cd "$dir" && npm ci --no-audit --no-fund && npm run build --if-present); done
      - name: Typecheck and build the desktop app
        working-directory: app
        run: npm ci --no-audit --no-fund && npm run build

  # Once per pull request and push to main: the CLI is analysed for issues and duplication, never coverage
  # (sonar-project.properties), so it needs nothing the other jobs build.
  sonar:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar reads the history to find new code.
          fetch-depth: 0
      - name: Sonar (new-code gate, policy/quality.yaml ci.sonar-new-code)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  # The one required check: green when the plan and every job it needed passed, a job the plan did not need being skipped.
  ci:
    needs: [plan, gates, package, grammar-proof, harness, app, sonar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS)
            const bad = Object.entries(needs).filter(([job, run]) => job === "plan" ? run.result !== "success" : !["success", "skipped"].includes(run.result))
            for (const [job, run] of Object.entries(needs)) console.log(`${job}: ${run.result}`)
            if (bad.length > 0) { console.log(`not green: ${bad.map(([job]) => job).join(", ")}`); process.exit(1) }
          '
